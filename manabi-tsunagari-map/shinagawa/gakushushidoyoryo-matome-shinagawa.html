であることなどの知識と健康な生活に関する課題を解決するための思考力，判断力，表現力等を中心として構成している。"],"k":["(ｱ) 健康な生活","健康の状態には，気持ちが意欲的であること，元気なこと，具合の悪いところがないことなどの心や体の調子がよい状態があることを理解できるようにする。また，健康の状態には，１日の生活の仕方などの主体の要因や身の回りの環境の要因が関わっていることを理解できるようにする。その際，心や体が健康であることは，人と関わりながら明るく充実した毎日の生活を送れることにつながり，健康がかけがえのないものであることにも触れるようにする。","(ｲ) １日の生活の仕方","健康の保持増進には，１日の生活の仕方が深く関わっており，１日の生活のリズムに合わせて，運動，食事，休養及び睡眠をとることが必要であることを理解できるようにする。その際，日常生活に運動を取り入れることの大切さについても触れるようにする。","また，手や足などの清潔，ハンカチや衣服などの清潔を保つことが必要であることを理解できるようにする。","(ｳ) 身の回りの環境","健康の保持増進には，生活環境が関わっており，部屋の明るさの調節や換気などの生活環境を整えることが必要であることを理解できるようにする。"],"s":["健康な生活に関わる事象から課題を見付け，健康な生活を目指す視点から，解決の方法を考え，それを伝えることができるようにする。","［例示］","・ １日の生活の仕方などの主体の要因や身の回りの環境の要因から健康に関わる課題を見付けること。","・ 運動，食事，休養及び睡眠，体の清潔，明るさの調節や換気などの学習したことと，自分の生活とを比べたり関連付けたりして，１日の生活の仕方や生活環境を整えるための方法を考えること。","・ 健康な生活について，健康に過ごすために考えた方法を学習カードなどに書いたり，発表したりして伝え合うこと。"],"m":[]}},"taiiku-4-G-2":{"page":107,"name":"保健：体の発育・発達","expl":{"intro":["体の発育・発達については，その一般的な現象や思春期の体の変化などについて理解できるようにする必要がある。また，体をよりよく発育・発達させるための生活の仕方について理解できるようにする必要がある。さらに，体の発育・発達に関する課題を見付け，よりよい解決に向けて考え，それを表現できるようにすることも必要である。","このため，本内容は，体が年齢に伴って変化すること，体の発育・発達には個人差があること，思春期になると体に変化が起こり，異性への関心も芽生えること，体の発育・発達には適切な運動，食事，休養及び睡眠が必要であることなどの知識と体の発育・発達に関する課題を解決するための思考力，判断力，表現力等を中心として構成している。"],"k":["(ｱ) 体の発育・発達","体の発育・発達については，身長，体重などを適宜取り上げ，これらは年齢に伴って変化することを理解できるようにするとともに，個人差があることを理解できるようにする。","(ｲ) 思春期の体の変化","○ 思春期には，体つきに変化が起こり，人によって違いがあるものの，男子はがっしりした体つきに，女子は丸みのある体つきになるなど，男女の特徴が現れることを理解できるようにする。","○  思春期には，初経，精通，変声，発毛が起こり，また，異性への関心も芽生えることについて理解できるようにする。さらに，これらは，個人差があるものの，大人の体に近づく現象であることを理解できるようにする。","なお，指導に当たっては，発達の段階を踏まえること，学校全体で共通理解を図ること，保護者の理解を得ることなどに配慮することが大切である。","(ｳ) 体をよりよく発育・発達させるための生活","体をよりよく発育・発達させるための生活の仕方には，体の発育・発達によい運動，多くの種類の食品をとることができるようなバランスのとれた食事，適切な休養及び睡眠などが必要であることを理解できるようにする。","その際，運動については，生涯を通じて骨や筋肉などを丈夫にする効果が期待されること，食事については，特に，体をつくる基になるたん白質，不足がちなカルシウム，不可欠なビタミンなどを摂取する必要があることについても触れるようにする。"],"s":["体の発育・発達に関わる事象から課題を見付け，体のよりよい発育・発達を目指す視点から，適切な方法を考え，それを伝えることができるようにする。","［例示］","・ 身長や体重などの年齢に伴う体の変化や体の発育･発達に関わる生活の仕方から課題を見付けること。","・ 思春期の体の変化について，学習したことを，自己の体の発育・発達と結び付けて考えること。","・ 体をよりよく発育・発達させるための生活について，学習したことを自己の生活と比べたり，関連付けたりするなどして適切な解決方法を考えること。","・ 体の発育・発達について，自己の発育・発達や体をよりよく発育･発達させるために考えたことを学習カードなどに書いたり，発表したりして伝え合うこと。"],"m":[]}},"taiiku-56-A-0":{"page":116,"name":"体つくり運動","expl":{"intro":["高学年の体つくり運動は，「体ほぐしの運動」及び「体の動きを高める運動」で構成され，運動の楽しさや喜びを味わうとともに，中学年までに身に付けた体の基本的な動きを基に，体の様々な動きを高めるための運動である。","高学年では，手軽な運動を行うことを通して自己や仲間の心と体との関係に気付いたり，仲間と関わり合ったりするとともに，低学年・中学年での多様な動きをつくる運動（遊び）を踏まえ，体の動きを高める運動の行い方を理解し，体の柔らかさ，巧みな動き，力強い動き，動きを持続する能力を高めて中学校での体つくり運動の学習につなげていくことが求められる。","また，児童が運動の必要性や行い方を理解し，自己の心と体の状態を捉え，仲間と話し合いながら課題を明確にし，その解決の仕方を工夫し合うとともに，考えたことを仲間に伝え，約束を守り協力し合って運動をし，仲間の考えや取組を認め，場や用具の安全に気を配って運動をすることができるようにすることが大切である。","体の動きを高めることによって直接的に体力の向上をねらいとするが，児童が必要感のないまま運動を繰り返す活動にならないよう留意し，自己の課題をもち楽しく運動を行いながら体の動きを高めるとともに，学んだことを生かして授業以外でも取り組むことができるようにすることが重要である。"],"k":["ア 体ほぐしの運動","体ほぐしの運動では，その行い方を理解するとともに，手軽な運動を行い，体を動かす楽しさや心地よさを味わうことを通して，自己や仲間の心と体の状態に気付いたり，仲間と豊かに関わり合ったりすること。","心と体との関係に気付くとは，運動をすると心が軽くなったり，体の力を抜くとリラックスできたり，体の動かし方によって気持ちも異なることなど，心と体が関係し合っていることに気付くことである。","仲間と関わり合うとは，運動を通して自他の心と体に違いがあることを理解し，仲間のよさを認め合うとともに，仲間の心と体の状態に配慮しながら豊かに関わり合う楽しさや大切さを体験することである。","［行い方の例］","○ 伸び伸びとした動作で全身を動かしたり，ボール，なわ，体操棒，フープなどの用具を用いた運動を行ったりすること。","○ リズムに乗って，心が弾むような動作での運動を行うこと。","○ ペアになって背中合わせに座り，互いの心や体の状態に気付き合いながら体を前後左右に揺らすなどの運動を行うこと。","○ 動作や人数などの条件を変えて，歩いたり走ったりする運動を行うこと。","○ グループや学級の仲間と力を合わせて挑戦する運動を行うこと。","○ 伝承遊びや集団による運動を行うこと。","◎ 運動が苦手な児童への配慮の例","・ 心や体の変化に気付くことが苦手な児童には，二人組で気持ちや体の変化を話し合う場面をつくったり，運動を通して感じたことを確かめるような言葉がけをしたりするなどの配慮をする。","・ 仲間と関わり合いながら運動をすることが苦手な児童には，協力や助け合いが必要になる運動を仕組み，仲間と共に運動をすることのよさが実感できるよう言葉がけをするなどの配慮をする。","イ 体の動きを高める運動","体の動きを高める運動では，体力の必要性や体の動きを高めるための運動の行い方を理解するとともに，自己の課題を踏まえ，直接的に体力の向上をねらいとして，体の柔らかさ，巧みな動き，力強い動き，動きを持続する能力を高めるための運動を行うこと。","体の動きを高める運動は，次の内容で構成される。","(ｱ) 体の柔らかさを高めるための運動","(ｲ) 巧みな動きを高めるための運動","(ｳ) 力強い動きを高めるため運動","(ｴ) 動きを持続する能力を高めるための運動","特に，児童の発達の段階を考慮し，体の柔らかさ及び巧みな動きを高めるための運動に重点を置いて指導する。","(ｱ) 体の柔らかさを高めるための運動","体の柔らかさを高めるための運動とは，体の各部位の可動範囲を広げる体の動きを高めることをねらいとして行う運動である。","［例示］","○ 徒手での運動","・ 体の各部位を大きく広げたり曲げたりする姿勢を維持すること。","・ 全身や各部位を振ったり，回したり，ねじったりすること。","・ 向かい合って手をつなぎ，手を離さないで背中合わせになったり，足裏を合わせて座り，交互に引っ張り合って上体を前屈したり，背中を押してもらい前屈をしたりすること。","○ 用具などを用いた運動","・ ゴムひもを張りめぐらせてつくった空間や，棒の下や輪の中をくぐり抜けること。","・ 長座の姿勢で上体を曲げ，体の周りでボールを転がすこと。","・ 短なわを短く折り曲げて両手で持ち，足の下・背中・頭上・腹部を通過させること。","◎ 運動が苦手な児童への配慮の例","・ 体の各部位を伸ばしたり曲げたり，その姿勢を維持したりすることが苦手な児童には，息を吐きながら脱力をし，ゆっくりと体を伸展できるような言葉がけをするなどの配慮をする。","・ 一定の空間をくぐり抜けたり，前屈して用具を操作したりすることが苦手な児童には，空間を広げたり，十分な前屈ができなくても操作しやすい用具を用いたりするなどの配慮をする。","(ｲ) 巧みな動きを高めるための運動","巧みな動きを高めるための運動とは，人や物の動き，または場所の広さや形状などの環境の変化に対応して，タイミングやバランスよく動いたり，リズミカルに動いたり，力の入れ方を加減したりする体の動きを高めることをねらいとして行う運動である。","［例示］","○ 人や物の動き，場の状況に対応した運動","・ 馬跳びで跳んだり，馬の下をくぐったりすること。","・ 長座の姿勢で座り，足を開いたり閉じたりする相手の動きに応じ，開脚・閉脚を繰り返しながら跳ぶこと。","・ グループで一列に並んだり，円陣や二列縦隊で手をつないだりして，呼吸を合わせて一斉に前後左右に跳んだり，音楽に合わせてリズムを変えながら跳んだりすること。","・ 用具などを等間隔に並べた走路や，ゴムひもなどでつくった「くもの巣」，跳び箱や平均台などの器具で作った段差のある走路などをリズミカルに走ったり跳んだりすること。","・ マーカーをタッチしながら，素早く往復走をすること。","○ 用具などを用いた運動","・ 短なわや長なわを用いて回旋の仕方や跳ぶリズム，人数などを変えていろいろな跳び方をしたり，なわ跳びをしながらボールを操作したりすること。","・ 投げ上げたボールを姿勢や位置を変えて捕球すること。","・ 用具をコントロールしながら投げる，捕る，回す，転がすなどの操作をすること。","・ フープを転がし，回転しているフープの中をくぐり抜けたり，跳び越したりすること。","・ 跳び箱，平均台，輪などの器具やゴムひもなどの用具を用いて設定した変化のあるコースで，物を持ったり姿勢や速さを変えたりして移動すること。","◎ 運動が苦手な児童への配慮の例","・ 人や物の動きに対応して動くことが苦手な児童には，動きをリードする児童が動作に合わせた言葉がけをしたり，ゆっくりとした動作をしたりするなどの配慮をする。","・ 用具を操作する運動が苦手な児童には，器具・用具や行い方を変えながら繰り返し行い，易しい動きから徐々に動きが高まっていくようにするなどの配慮をする。","・ 用具を操作することが得意な児童が，苦手な児童に補助をしやすいよう，ペアやグループの編成の仕方を工夫するなどの配慮をする。","(ｳ) 力強い動きを高めるための運動","力強い動きを高めるための運動とは，自己の体重を利用したり，人や物などの抵抗に対してそれを動かしたりすることによって，力強い動きを高めることをねらいとして行う運動である。","［例示］","○ 人や物の重さなどを用いた運動","・ いろいろな姿勢での腕立て伏臥腕屈伸をすること。","・ 二人組，三人組で互いに持ち上げる，運ぶなどの運動をすること。","・ 押し，寄りを用いてすもうをすること。","・ 全身に力を込めて登り棒につかまったり，肋木や雲梯にぶら下がったりすること。","◎ 運動が苦手な児童への配慮の例","・ 人を持ち上げる，運ぶなどの動きが苦手な児童には，負担の少ない役割を果たすことから始め，徐々に力強い動きに挑戦できるようにするなどの配慮をする。","・ 押し，寄りを用いてすもうをすることが苦手な児童には，膝を曲げて腰を低くして構えることや，足裏全体を使って進むことなどの基本的な動きを意識したり，体格が同じ程度の相手と繰り返して行い，安心して活動ができるようにしたりするなどの配慮をする。","・ 全身に力を込めて登り棒につかまったり，肋木や雲梯にぶら下がったりすることが苦手な児童には，わずかずつでもできたことを取り上げて称賛したり，足が届く程度の高さで繰り返し行うようにしたりするなどの配慮をする。","(ｴ) 動きを持続する能力を高めるための運動","動きを持続する能力を高めるための運動とは，一つの運動又は複数の運動を組み合わせて一定の時間続けて行ったり，一定の回数を反復して行ったりすることによって，動きを持続する能力を高めることをねらいとして行う運動である。","［例示］","○ 時間やコースを決めて行う全身運動","・ 短なわ，長なわを用いての跳躍やエアロビクスなどの全身運動を続けること。","・ 無理のない速さで５～６分程度の持久走をすること。","・ 一定のコースに置かれた固定施設，器械・器具，変化のある地形などを越えながらかけ足で移動するなどの運動を続けること。","◎ 運動が苦手な児童への配慮の例","・ 短なわや長なわを用いて跳び続けることが苦手な児童には，自分が得意な跳び方で行い，自分に合ったペースで一定時間連続したり，中断しながらでも延べ回数を増やしたりするなどの配慮をする。","・ 一定の時間続けて走ることが苦手な児童には，自己のペースで無理のない速さで走り，段階的に課題を設定するよう助言したり，息をしっかり吐くことや，腕をリズムよく振ることができやすくなるよう個別に言葉がけをしたりするなどの配慮をする。","・ 一定の動きを繰り返しながら続けて行うことが苦手な児童には，リズムに合わせて動くことができるようＢＧＭを利用したり，ペアやグループで一緒に動いたりすることができるようにするなどの配慮をする。"],"s":["ア  体ほぐしの運動や体の動きを高める運動について，自己の心と体の状態や体力に応じて運動の課題や行い方を選ぶこと。","○ 心が弾んだり，仲間との関わり合いが深まったりする運動や，自己やグループで体の動きを高めるための運動の課題を選ぶ例","・ これまでに経験した運動の中から心と体との関係に気付いたり，仲間と関わり合ったりするなどのねらいに応じた活動を選ぶこと。","・ 自己の体力の状況を知ったり，体の様々な動きを試したりすることを通して，体の動きを高めるためにどのような運動に取り組むとよいか，自己の課題を見付けること。","○ 気付きや関わり合いが深まりやすい運動や，体の動きを高めるために適した運動の行い方を選んだり，工夫したりする例","・ 複数の運動を試して行い，比べてみることを通して，気付きや関わり合いが深まりやすい運動を選ぶこと。","・ 体の柔らかさを高めるために，長座の姿勢で体の周囲を転がすボールの大きさを変えたり，操作の仕方を変えたりして，自己に合った運動の行い方を選ぶこと。","・ 短なわ跳びを一定時間続けるために，動きを見合ったり，体の状態を確かめたりしながら，自己に合った回数や時間を選ぶこと。","・ ICT機器を活用して動き方を確認し，どのようなポイントを意識して運動を行うと動きが高まるのかを見付け，それを生かした運動を工夫すること。","イ  体をほぐしたり，体の動きを高めたりするために自己やグループで考えた運動の行い方を他者に伝えること。","○ 心や体の変化に気付いたり，みんなで行って楽しいと感じたりした運動を他者に伝える例","・ 運動を行うと心と体が軽やかになったことやみんなでリズムに乗って運動をすると楽しさが増したことを学習カードに書いたり，振り返りの時間に発表したりすること。","○ 体の動きを高めるためにグループで工夫した運動の行い方を他のグループに紹介する例","・ グループで工夫した長なわ跳びをしながらボールを投げたり捕ったりする運動の行い方を他のグループの仲間に例示して見せたり，言葉で伝えたりすること。","・ 活動後の感想を伝える場面で，言葉のかけ方や並び方などの条件を工夫することで，グループのみんなが楽しく運動が行えたことを他のグループに説明すること。"],"m":["ア 体ほぐしの運動や体の動きを高める運動に積極的に取り組むこと。","イ 運動を行う際の約束を守り，仲間と助け合うこと。","ウ 運動を行う場の設定や用具の片付けなどで，分担された役割を果たすこと。エ 運動の行い方について仲間の気付きや考え，取組のよさを認めること。","オ  運動の場の危険物を取り除くとともに，用具の使い方や周囲の安全に気を配ること。","◎ 運動に意欲的でない児童への配慮の例","・ 仲間との身体接触を嫌がる児童には，バトンやひもなどの用具を用いて触れ合う運動を工夫するなどの配慮をする。","・ 仲間と共に活動することに意欲的に取り組めない児童には，仲間と一緒に運動をすると楽しさが増すことを体験できるようにしたり，気持ちも弾んで心の状態が軽やかになることを感じることができるよう言葉がけをしたりするなどの配慮をする。","・ 自己の課題を見付けることに意欲的に取り組めない児童には，仲間の行い方を見て真似をしながら運動を行ったり，仲間に気付きを言ってもらったりし，徐々に自己の課題を見付けていくことができるようにするなどの配慮をする。","・ 課題の解決の仕方がわからないために運動に意欲的に取り組めない児童には，自己の課題を仲間に伝え，仲間からの助言を受けたり，同じような課題をもっている仲間の行い方の真似をしたりすることができるよう，ペアやグループの編成の仕方を工夫するなどの配慮をする。","・ 達成感をもてないために運動に意欲的に取り組めない児童には，運動の記録をとるようにしたり，わずかな変化を見付けて称賛したりしながら，自己の体の動きが高まっていることに気付くことができるようにするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア 体ほぐしの運動","体ほぐしの運動では，その行い方を理解するとともに，手軽な運動を行い，体を動かす楽しさや心地よさを味わうことを通して，自己や仲間の心と体の状態に気付いたり，仲間と豊かに関わり合ったりすること。","心と体との関係に気付くとは，運動をすると心が軽くなったり，体の力を抜くとリラックスできたり，体の動かし方によって気持ちも異なることなど，心と体が関係し合っていることに気付くことである。","仲間と関わり合うとは，運動を通して自他の心と体に違いがあることを理解し，仲間のよさを認め合うとともに，仲間の心と体の状態に配慮しながら豊かに関わり合う楽しさや大切さを体験することである。","［行い方の例］","○ 伸び伸びとした動作で全身を動かしたり，ボール，なわ，体操棒，フープなどの用具を用いた運動を行ったりすること。","○ リズムに乗って，心が弾むような動作での運動を行うこと。","○ ペアになって背中合わせに座り，互いの心や体の状態に気付き合いながら体を前後左右に揺らすなどの運動を行うこと。","○ 動作や人数などの条件を変えて，歩いたり走ったりする運動を行うこと。","○ グループや学級の仲間と力を合わせて挑戦する運動を行うこと。","○ 伝承遊びや集団による運動を行うこと。","◎ 運動が苦手な児童への配慮の例","・ 心や体の変化に気付くことが苦手な児童には，二人組で気持ちや体の変化を話し合う場面をつくったり，運動を通して感じたことを確かめるような言葉がけをしたりするなどの配慮をする。","・ 仲間と関わり合いながら運動をすることが苦手な児童には，協力や助け合いが必要になる運動を仕組み，仲間と共に運動をすることのよさが実感できるよう言葉がけをするなどの配慮をする。"],"イ":["イ 体の動きを高める運動","体の動きを高める運動では，体力の必要性や体の動きを高めるための運動の行い方を理解するとともに，自己の課題を踏まえ，直接的に体力の向上をねらいとして，体の柔らかさ，巧みな動き，力強い動き，動きを持続する能力を高めるための運動を行うこと。","体の動きを高める運動は，次の内容で構成される。","(ｱ) 体の柔らかさを高めるための運動","(ｲ) 巧みな動きを高めるための運動","(ｳ) 力強い動きを高めるため運動","(ｴ) 動きを持続する能力を高めるための運動","特に，児童の発達の段階を考慮し，体の柔らかさ及び巧みな動きを高めるための運動に重点を置いて指導する。","(ｱ) 体の柔らかさを高めるための運動","体の柔らかさを高めるための運動とは，体の各部位の可動範囲を広げる体の動きを高めることをねらいとして行う運動である。","［例示］","○ 徒手での運動","・ 体の各部位を大きく広げたり曲げたりする姿勢を維持すること。","・ 全身や各部位を振ったり，回したり，ねじったりすること。","・ 向かい合って手をつなぎ，手を離さないで背中合わせになったり，足裏を合わせて座り，交互に引っ張り合って上体を前屈したり，背中を押してもらい前屈をしたりすること。","○ 用具などを用いた運動","・ ゴムひもを張りめぐらせてつくった空間や，棒の下や輪の中をくぐり抜けること。","・ 長座の姿勢で上体を曲げ，体の周りでボールを転がすこと。","・ 短なわを短く折り曲げて両手で持ち，足の下・背中・頭上・腹部を通過させること。","◎ 運動が苦手な児童への配慮の例","・ 体の各部位を伸ばしたり曲げたり，その姿勢を維持したりすることが苦手な児童には，息を吐きながら脱力をし，ゆっくりと体を伸展できるような言葉がけをするなどの配慮をする。","・ 一定の空間をくぐり抜けたり，前屈して用具を操作したりすることが苦手な児童には，空間を広げたり，十分な前屈ができなくても操作しやすい用具を用いたりするなどの配慮をする。","(ｲ) 巧みな動きを高めるための運動","巧みな動きを高めるための運動とは，人や物の動き，または場所の広さや形状などの環境の変化に対応して，タイミングやバランスよく動いたり，リズミカルに動いたり，力の入れ方を加減したりする体の動きを高めることをねらいとして行う運動である。","［例示］","○ 人や物の動き，場の状況に対応した運動","・ 馬跳びで跳んだり，馬の下をくぐったりすること。","・ 長座の姿勢で座り，足を開いたり閉じたりする相手の動きに応じ，開脚・閉脚を繰り返しながら跳ぶこと。","・ グループで一列に並んだり，円陣や二列縦隊で手をつないだりして，呼吸を合わせて一斉に前後左右に跳んだり，音楽に合わせてリズムを変えながら跳んだりすること。","・ 用具などを等間隔に並べた走路や，ゴムひもなどでつくった「くもの巣」，跳び箱や平均台などの器具で作った段差のある走路などをリズミカルに走ったり跳んだりすること。","・ マーカーをタッチしながら，素早く往復走をすること。","○ 用具などを用いた運動","・ 短なわや長なわを用いて回旋の仕方や跳ぶリズム，人数などを変えていろいろな跳び方をしたり，なわ跳びをしながらボールを操作したりすること。","・ 投げ上げたボールを姿勢や位置を変えて捕球すること。","・ 用具をコントロールしながら投げる，捕る，回す，転がすなどの操作をすること。","・ フープを転がし，回転しているフープの中をくぐり抜けたり，跳び越したりすること。","・ 跳び箱，平均台，輪などの器具やゴムひもなどの用具を用いて設定した変化のあるコースで，物を持ったり姿勢や速さを変えたりして移動すること。","◎ 運動が苦手な児童への配慮の例","・ 人や物の動きに対応して動くことが苦手な児童には，動きをリードする児童が動作に合わせた言葉がけをしたり，ゆっくりとした動作をしたりするなどの配慮をする。","・ 用具を操作する運動が苦手な児童には，器具・用具や行い方を変えながら繰り返し行い，易しい動きから徐々に動きが高まっていくようにするなどの配慮をする。","・ 用具を操作することが得意な児童が，苦手な児童に補助をしやすいよう，ペアやグループの編成の仕方を工夫するなどの配慮をする。","(ｳ) 力強い動きを高めるための運動","力強い動きを高めるための運動とは，自己の体重を利用したり，人や物などの抵抗に対してそれを動かしたりすることによって，力強い動きを高めることをねらいとして行う運動である。","［例示］","○ 人や物の重さなどを用いた運動","・ いろいろな姿勢での腕立て伏臥腕屈伸をすること。","・ 二人組，三人組で互いに持ち上げる，運ぶなどの運動をすること。","・ 押し，寄りを用いてすもうをすること。","・ 全身に力を込めて登り棒につかまったり，肋木や雲梯にぶら下がったりすること。","◎ 運動が苦手な児童への配慮の例","・ 人を持ち上げる，運ぶなどの動きが苦手な児童には，負担の少ない役割を果たすことから始め，徐々に力強い動きに挑戦できるようにするなどの配慮をする。","・ 押し，寄りを用いてすもうをすることが苦手な児童には，膝を曲げて腰を低くして構えることや，足裏全体を使って進むことなどの基本的な動きを意識したり，体格が同じ程度の相手と繰り返して行い，安心して活動ができるようにしたりするなどの配慮をする。","・ 全身に力を込めて登り棒につかまったり，肋木や雲梯にぶら下がったりすることが苦手な児童には，わずかずつでもできたことを取り上げて称賛したり，足が届く程度の高さで繰り返し行うようにしたりするなどの配慮をする。","(ｴ) 動きを持続する能力を高めるための運動","動きを持続する能力を高めるための運動とは，一つの運動又は複数の運動を組み合わせて一定の時間続けて行ったり，一定の回数を反復して行ったりすることによって，動きを持続する能力を高めることをねらいとして行う運動である。","［例示］","○ 時間やコースを決めて行う全身運動","・ 短なわ，長なわを用いての跳躍やエアロビクスなどの全身運動を続けること。","・ 無理のない速さで５～６分程度の持久走をすること。","・ 一定のコースに置かれた固定施設，器械・器具，変化のある地形などを越えながらかけ足で移動するなどの運動を続けること。","◎ 運動が苦手な児童への配慮の例","・ 短なわや長なわを用いて跳び続けることが苦手な児童には，自分が得意な跳び方で行い，自分に合ったペースで一定時間連続したり，中断しながらでも延べ回数を増やしたりするなどの配慮をする。","・ 一定の時間続けて走ることが苦手な児童には，自己のペースで無理のない速さで走り，段階的に課題を設定するよう助言したり，息をしっかり吐くことや，腕をリズムよく振ることができやすくなるよう個別に言葉がけをしたりするなどの配慮をする。","・ 一定の動きを繰り返しながら続けて行うことが苦手な児童には，リズムに合わせて動くことができるようＢＧＭを利用したり，ペアやグループで一緒に動いたりすることができるようにするなどの配慮をする。"]}},"taiiku-56-B-0":{"page":123,"name":"器械運動","expl":{"intro":["高学年の器械運動は，「マット運動」，「鉄棒運動」及び「跳び箱運動」で構成され，回転したり，支持したり，逆位になったり，懸垂したりするなどの技に挑戦し，その技ができる楽しさや喜びを味わうことのできる運動である。","低学年の器械･器具を使っての運動遊びと中学年の器械運動の学習を踏まえ，高学年では，器械運動の楽しさや喜びを味わい，その行い方を理解するとともにマット運動，鉄棒運動，跳び箱運動などの中学年で学習した基本的な技を安定して行ったり，その発展技や更なる発展技に取り組んだり，それらを組み合わせたりして技を身に付けるようにし，中学校の器械運動の学習につなげていくことが求められる。","また，運動を楽しく行うために，自己やグループの課題を見付け，その解決のための活動を工夫するとともに，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や器械・器具の安全に気を配ったりすることなどをできるようにすることが大切である。"],"k":["ア マット運動","マット運動では，その行い方を理解するとともに，自己の能力に適した回転系や巧技系の基本的な技を安定して行ったり，その発展技に取り組んだりすること。また，選んだ技を自己やグループで繰り返したり，組み合わせたりすること。","［回転系 接転技群 前転グループ発展技の例示］","○ 開脚前転（更なる発展技：易しい場での伸膝前転）","・ 両手と後頭部をつきながら腰を高く上げ前方へ回転し，膝を伸ばして足を左右に大きく開き，接地するとともに素早く両手を股の近くに着いて膝を伸ばしたまま開脚立ちをすること。","○ 補助倒立前転（更なる発展技：倒立前転，跳び前転）","・ 片足を振り上げ補助倒立を行い，前に倒れながら腕を曲げ，頭を入れて前転すること。","［回転系 接転技群 後転グループ発展技の例示］","○ 伸膝後転（更なる発展技：後転倒立）","・ 直立の姿勢から前屈しながら後方へ倒れ，尻をつき，膝を伸ばして後方に回転し，両手でマットを押して膝を伸ばしたまま立ち上がること。","［回転系 ほん転技群 倒立回転グループ発展技の例示］","○ 倒立ブリッジ（更なる発展技：前方倒立回転，前方倒立回転跳び）","・ 倒立位から前方へ体を反らせ，ゆっくりと足を下ろしながらブリッジの姿勢をつくること。","○ ロンダート","・ 助走からホップを行い，片足を振り上げながら片手ずつ着き，体を1/2ひねり両足を真上で揃え，両手で押しながら両足を振り下ろし，空中で回転して立ち上がること。","○ 頭はね起き","・ 両手で支えて頭頂部をついて屈身の姿勢の頭倒立を行いながら前方に回転し，尻が頭を越えたら腕と腰を伸ばし，体を反らせながらはね起きること。","［巧技系 平均立ち技群 倒立グループ発展技の例示］","○ 補助倒立（更なる発展技：倒立）","・ 体を前方に振り下ろしながら片足を振り上げ両手を着き，体を真っ直ぐに伸ばして逆さの姿勢になり，補助者の支えで倒立すること。","［技の組み合わせ方の例］","○ 上に示した技や既にできる技を選び，それらにバランスやジャンプなどを加えて組み合わせたり，ペアやグループで動きを組み合わせて演技をつくったりすること。演技のつくり方は，回転系の接転技群の前転グループ技を行った後，ジャンプやバランス技で方向を変え，接転技群の後転グループ技やほん転技群の倒立回転グループ技を行うなど，いろいろな技群やグループ技で組み合わせること。また，前転で足を交差して後ろ向き立ちになったり，側方倒立回転で1/4ひねって後ろ向き立ちになったり，本来の終末の姿勢とは異なるように条件を変えて技を組み合わせたりすること。","◎ 運動が苦手な児童への配慮の例","・ 開脚前転が苦手な児童には，前転の起き上がる速さをつけたり，傾斜を利用したりして，勢いをつけて回転する動きが身に付くようにするなどの配慮をする。","・ 補助倒立前転が苦手な児童には，壁倒立をしたり，跳び箱や台などの上に足を置き，逆さの姿勢からの前転を行ったり，壁登り逆立ちから補助を受けながら前転したりして，倒立の姿勢からの前転を行う動きが身に付くようにするなどの配慮をする。","・ 伸膝後転が苦手な児童には，足を伸ばしたゆりかごで体を揺らしたり，傾斜を利用して回転に勢いをつけて転がりやすくしたりして，腰を上げたり，足を伸ばして回転の勢いを付けたりする動きが身に付くようにするなどの配慮をする。","・ 倒立ブリッジが苦手な児童には，壁登り逆立ちや壁倒立，ブリッジなどの逆さまで体を支える運動遊びや，体を反らす運動遊びに取り組んだりして，倒立したり，体を反らす動きが身に付くようにするなどの配慮をする。","・ ロンダートが苦手な児童には，手や足を着く場所が分かるように目印を置くなどして練習したり，側方倒立回転で足を勢いよく振り上げたりして，腰を伸ばした姿勢で体をひねる動きが身に付くようにするなどの配慮をする。","・ 頭はね起きが苦手な児童には，頭倒立や壁倒立などをしたり，首はね起きや頭倒立からブリッジなどに取り組んだり，また段差を利用して起き上がりやすくしたりして，逆さまで体を支え，体を反らし反動を利用して起き上がる動きが身に付くようにするなどの配慮をする。","・ 補助倒立が苦手な児童には，壁登り逆立ちや壁倒立などをして，体を逆さまにして支えたり，足を振り上げたりする動きが身に付くようにするなどの配慮をする。","イ 鉄棒運動","鉄棒運動では，その行い方を理解するとともに，自己の能力に適した支持系の基本的な技を安定して行ったり，その発展技に取り組んだりすること。また，選んだ技を自己やグループで繰り返したり，組み合わせたりすること。","［支持系 前方支持回転技群 前転グループ発展技の例示］","○ 前方支持回転（更なる発展技：前方伸膝支持回転）","・ 支持の姿勢から腰と膝を曲げ，体を前方に勢いよく倒して腹を掛けて回転し，その勢いを利用して手首を返しながら支持の姿勢に戻ること。","○ 片足踏み越し下り（更なる発展技：横とび越し下り）","・ 片逆手の支持の姿勢から順手側の手の近くに足を鉄棒に乗せ，踏み込みながら順手を離し，逆手握りの手は鉄棒を握ったままで横向きに下りること。","［支持系 前方支持回転技群 前方足掛け回転グループ発展技の例示］","○ 膝掛け上がり（更なる発展技：もも掛け上がり）","・ 鉄棒の下を走り込み，両足を振り上げ，振れ戻りながら片膝を掛けて手首を返しながら上がること。","○ 前方もも掛け回転","・ 逆手で鉄棒を持ち，前後開脚の支持の姿勢から前方へ上体を大きく振り出して，足を伸ばし鉄棒を挟むように回転し，手首を返しながらももを掛けて前後開脚の支持の姿勢に戻ること。","［支持系 後方支持回転技群 後転グループ発展技の例示］","○ 逆上がり","・ 足の振り上げとともに腕を曲げ，上体を後方へ倒し手首を返して鉄棒に上がること。","○ 後方支持回転（更なる発展技：後方伸膝支持回転）","・ 支持の姿勢から腰と膝を曲げたまま体を後方に勢いよく倒し，腹を鉄棒に掛けたまま回転し，手首を返して支持の姿勢に戻ること。","［支持系 後方支持回転技群 後方足掛け回転グループ発展技の例示］","○ 後方もも掛け回転","・ 前後開脚の支持の姿勢から後方に上体と後ろ足を大きく振り出し，ももを掛けて回転し手首を返しながら前後開脚の支持の姿勢に戻ること。","○ 両膝掛け振動下り","・ 鉄棒に両膝を掛けて逆さまになり両手を離し，腕と頭を使って体を前後に振動させ，振動が前から後ろに振れ戻る前に膝を鉄棒から外して下りること。","［技の組み合わせ方の例示］","○ 中学年までの基本的な技や上に示した技の中から，自己の能力に適した技を選んで組み合わせること。","◎ 運動が苦手な児童への配慮の例","・ 前方支持回転が苦手な児童には，ツバメの姿勢からふとん干しを繰り返したり，補助や補助具で回転しやすくしたりして，勢いのつけ方や体を丸めて鉄棒から離さない動きが身に付くようにするなどの配慮をする。","・ 片足踏み越し下りが苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座ったり，ツバメの姿勢で鉄棒上を横に移動したり，片手ずつ順手から逆手，逆手から順手に握りかえるなどの運動に取り組んだりして，バランスをとって鉄棒上で体を操作するための動きが身に付くようにするなどの配慮をする。","・ 膝掛け上がりが苦手な児童には，両手でぶら下がって体を前後に揺らしたり，片膝を掛けて大きく揺らしたり，足抜き回りなどの運動遊びに取り組んだり，補助を受けて回転したり，鉄棒に補助具をつけて回転しやすいようにしたりして，片膝を掛け振りの勢いを利用して上がる動きが身に付くようにするなどの配慮をする。","・ 前方もも掛け回転が苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座ったり，鉄棒に片膝を掛けて揺れたりするなど，バランスをとって回転を開始する姿勢をつくったり，体を揺らしてから振りの動きを利用して回転したりする動きが身に付くようにするなどの配慮をする。","・ 逆上がりが苦手な児童には，体を鉄棒に引きつける運動に取り組んだり，補助や補助具を利用して足を振り上げながら後方回転をしたりして，体を上昇させながら鉄棒に引きつけ回転する動きが身に付くようにするなどの配慮をする。","・ 後方支持回転が苦手な児童には，ツバメの姿勢で足を前後に振って体を曲げたり，補助や補助具で回転しやすくしたりして，勢いのつけ方や体を丸めて回転する動きが身に付くようにするなどの配慮をする。","・ 後方もも掛け回転が苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座ったり，片足を鉄棒から離したりしながら反対側の足を振ったり，また鉄棒に片膝を掛けて揺れたりするなど，バランスをとって回転を開始する姿勢をつくったり，体を揺らしてから振りの動きを利用して回転したりする動きが身に付くようにするなどの配慮をする。","・ 両膝掛け振動下りが苦手な児童には，両膝を掛けて体を揺らしたり，前を見て両膝を外したりする動きが身に付くように，こうもりで腕や頭を使って体を前後に揺らして前を見たり，二人の補助者と手をつないで体を前後に軽く揺らしながら前を見たりする運動に取り組めるようにするなどの配慮をする。","ウ 跳び箱運動","跳び箱運動では，その行い方を理解するとともに，自己の能力に適した切り返し系や回転系の基本的な技を安定して行ったり，その発展技に取り組んだりすること。","［切り返し系 切り返し跳びグループ発展技の例示］","○ かかえ込み跳び（更なる発展技：屈身跳び）","・ 助走から両足で踏み切って着手し，足をかかえ込んで跳び越し着地すること。","［回転系 回転跳びグループ発展技の例示］","○ 伸膝台上前転","・ 助走から両足で強く踏み切り，足を伸ばしたまま腰の位置を高く保って着手し，前方に回転して着地すること。","○ 頭はね跳び（更なる発展技：前方屈腕倒立回転跳び）","・ 伸膝台上前転を行うように腰を上げ回転し，両手で支えながら頭頂部をつき，尻が頭を越えたら腕と腰を伸ばし，体を反らせながら回転すること。","◎ 運動が苦手な児童への配慮の例","・ かかえ込み跳びが苦手な児童には，マットを数枚重ねた場を設置して，手を着きやすくしたり，跳び越しやすくしたり，体育館のステージに向かって跳び乗ったりして，跳び越しやすい場で踏切り－着手－着地までの動きが身に付くようにするなどの配慮をする。","・ 伸膝台上前転が苦手な児童には，マットを数枚重ねた場や低く設置した跳び箱で腰を上げたり，速さのある前転をしたりして，膝を伸ばして回転する動きが身に付くようにするなどの配慮をする。","・ 頭はね跳びが苦手な児童には，マットを数枚重ねた場や低く設置した跳び箱，ステージを利用して体を反らせてブリッジをしたり，場でつくった段差と補助を利用して頭はね起きを行ったりしながら，体を反らしてはねたり，手で押したりする動きが身に付くようにするなどの配慮をする。"],"s":["ア  自己の能力に適した課題を見付け，その課題の解決の仕方を考えたり，課題に応じた練習の場や段階を選んだりすること。","○ ICT機器を活用して，自己やグループの課題を見付ける例","・ タブレットやデジタルカメラなどのICT機器を活用して，動きのポイントと自己や仲間の動きを照らし合わせ，技のできばえや次の課題を確認するなど，自己の課題を見付けること。","○ 自己やグループに適した課題を設定して，解決のための活動を選ぶ例","・ 見付けた課題を解決するために，複数の場の中から自己の課題に適した練習の場を選ぶこと。","イ 課題の解決のために自己や仲間の考えたことを他者に伝えること。","○ 観察し合って見付けたこつやわかったことを他者に伝える例","・ グループの中で互いの役割を決めて観察し合ったり，学習カードやICT機器を活用したりして，つまずいていた技や演技のこつやわかったことを，文字や図で書いたり，映像を活用して発表したりするなどして，仲間やグループに伝えること。"],"m":["ア  膝を伸ばして回転したり，体を真っ直ぐ伸ばして逆さの姿勢になったり，それらの技を組み合わせたりするなど，マット運動，鉄棒運動及び跳び箱運動の基本的な技や発展技に積極的に取り組むこと。","イ  互いの役割を決めて観察し合うなど，学習の仕方や約束を守り，仲間と助け合うこと。","ウ 器械・器具の準備や片付けなどで，分担された役割を果たすこと。","エ  技や演技を行うなかでわかったことを伝えたり，課題の解決方法を工夫したりする際に，仲間の考えや取組を認めること。","オ  けがのないように，互いの服装や髪形に気を付けたり，場の危険物を取り除いたりするとともに，試技の前後などに器械・器具の安全に気を配ること。","◎ 運動に意欲的でない児童への配慮の例","・ 痛みへの不安感や技への恐怖心をもつ児童には，ぶつかったり，落ちたりしても痛くないように，器械・器具の横や下などにマットを敷いたり，補助者を付けたりする場を設定するなどの配慮をする。","・ 技に対する苦手意識が強い児童には，必要な体の動かし方や運動感覚が身に付くように，取り組む技と類似した動き方をする運動遊びに取り組む時間や場を設定するなどの配慮をする。","・ 仲間とうまく関わって学習を進めることが難しい児童には，技を観察するポイントや位置を示し，気付いたことなどを仲間に伝える時間や場を設定するなどの配慮をする。","・ 既に基本的な技を安定して行えるようになった児童には，発展技に挑戦したり，できる技を組み合わせたりして，新たな課題に取り組むことができる時間や場を設定するなどの配慮をする。"]},"ksub":{"":[],"ア":["ア マット運動","マット運動では，その行い方を理解するとともに，自己の能力に適した回転系や巧技系の基本的な技を安定して行ったり，その発展技に取り組んだりすること。また，選んだ技を自己やグループで繰り返したり，組み合わせたりすること。","［回転系 接転技群 前転グループ発展技の例示］","○ 開脚前転（更なる発展技：易しい場での伸膝前転）","・ 両手と後頭部をつきながら腰を高く上げ前方へ回転し，膝を伸ばして足を左右に大きく開き，接地するとともに素早く両手を股の近くに着いて膝を伸ばしたまま開脚立ちをすること。","○ 補助倒立前転（更なる発展技：倒立前転，跳び前転）","・ 片足を振り上げ補助倒立を行い，前に倒れながら腕を曲げ，頭を入れて前転すること。","［回転系 接転技群 後転グループ発展技の例示］","○ 伸膝後転（更なる発展技：後転倒立）","・ 直立の姿勢から前屈しながら後方へ倒れ，尻をつき，膝を伸ばして後方に回転し，両手でマットを押して膝を伸ばしたまま立ち上がること。","［回転系 ほん転技群 倒立回転グループ発展技の例示］","○ 倒立ブリッジ（更なる発展技：前方倒立回転，前方倒立回転跳び）","・ 倒立位から前方へ体を反らせ，ゆっくりと足を下ろしながらブリッジの姿勢をつくること。","○ ロンダート","・ 助走からホップを行い，片足を振り上げながら片手ずつ着き，体を1/2ひねり両足を真上で揃え，両手で押しながら両足を振り下ろし，空中で回転して立ち上がること。","○ 頭はね起き","・ 両手で支えて頭頂部をついて屈身の姿勢の頭倒立を行いながら前方に回転し，尻が頭を越えたら腕と腰を伸ばし，体を反らせながらはね起きること。","［巧技系 平均立ち技群 倒立グループ発展技の例示］","○ 補助倒立（更なる発展技：倒立）","・ 体を前方に振り下ろしながら片足を振り上げ両手を着き，体を真っ直ぐに伸ばして逆さの姿勢になり，補助者の支えで倒立すること。","［技の組み合わせ方の例］","○ 上に示した技や既にできる技を選び，それらにバランスやジャンプなどを加えて組み合わせたり，ペアやグループで動きを組み合わせて演技をつくったりすること。演技のつくり方は，回転系の接転技群の前転グループ技を行った後，ジャンプやバランス技で方向を変え，接転技群の後転グループ技やほん転技群の倒立回転グループ技を行うなど，いろいろな技群やグループ技で組み合わせること。また，前転で足を交差して後ろ向き立ちになったり，側方倒立回転で1/4ひねって後ろ向き立ちになったり，本来の終末の姿勢とは異なるように条件を変えて技を組み合わせたりすること。","◎ 運動が苦手な児童への配慮の例","・ 開脚前転が苦手な児童には，前転の起き上がる速さをつけたり，傾斜を利用したりして，勢いをつけて回転する動きが身に付くようにするなどの配慮をする。","・ 補助倒立前転が苦手な児童には，壁倒立をしたり，跳び箱や台などの上に足を置き，逆さの姿勢からの前転を行ったり，壁登り逆立ちから補助を受けながら前転したりして，倒立の姿勢からの前転を行う動きが身に付くようにするなどの配慮をする。","・ 伸膝後転が苦手な児童には，足を伸ばしたゆりかごで体を揺らしたり，傾斜を利用して回転に勢いをつけて転がりやすくしたりして，腰を上げたり，足を伸ばして回転の勢いを付けたりする動きが身に付くようにするなどの配慮をする。","・ 倒立ブリッジが苦手な児童には，壁登り逆立ちや壁倒立，ブリッジなどの逆さまで体を支える運動遊びや，体を反らす運動遊びに取り組んだりして，倒立したり，体を反らす動きが身に付くようにするなどの配慮をする。","・ ロンダートが苦手な児童には，手や足を着く場所が分かるように目印を置くなどして練習したり，側方倒立回転で足を勢いよく振り上げたりして，腰を伸ばした姿勢で体をひねる動きが身に付くようにするなどの配慮をする。","・ 頭はね起きが苦手な児童には，頭倒立や壁倒立などをしたり，首はね起きや頭倒立からブリッジなどに取り組んだり，また段差を利用して起き上がりやすくしたりして，逆さまで体を支え，体を反らし反動を利用して起き上がる動きが身に付くようにするなどの配慮をする。","・ 補助倒立が苦手な児童には，壁登り逆立ちや壁倒立などをして，体を逆さまにして支えたり，足を振り上げたりする動きが身に付くようにするなどの配慮をする。"],"イ":["イ 鉄棒運動","鉄棒運動では，その行い方を理解するとともに，自己の能力に適した支持系の基本的な技を安定して行ったり，その発展技に取り組んだりすること。また，選んだ技を自己やグループで繰り返したり，組み合わせたりすること。","［支持系 前方支持回転技群 前転グループ発展技の例示］","○ 前方支持回転（更なる発展技：前方伸膝支持回転）","・ 支持の姿勢から腰と膝を曲げ，体を前方に勢いよく倒して腹を掛けて回転し，その勢いを利用して手首を返しながら支持の姿勢に戻ること。","○ 片足踏み越し下り（更なる発展技：横とび越し下り）","・ 片逆手の支持の姿勢から順手側の手の近くに足を鉄棒に乗せ，踏み込みながら順手を離し，逆手握りの手は鉄棒を握ったままで横向きに下りること。","［支持系 前方支持回転技群 前方足掛け回転グループ発展技の例示］","○ 膝掛け上がり（更なる発展技：もも掛け上がり）","・ 鉄棒の下を走り込み，両足を振り上げ，振れ戻りながら片膝を掛けて手首を返しながら上がること。","○ 前方もも掛け回転","・ 逆手で鉄棒を持ち，前後開脚の支持の姿勢から前方へ上体を大きく振り出して，足を伸ばし鉄棒を挟むように回転し，手首を返しながらももを掛けて前後開脚の支持の姿勢に戻ること。","［支持系 後方支持回転技群 後転グループ発展技の例示］","○ 逆上がり","・ 足の振り上げとともに腕を曲げ，上体を後方へ倒し手首を返して鉄棒に上がること。","○ 後方支持回転（更なる発展技：後方伸膝支持回転）","・ 支持の姿勢から腰と膝を曲げたまま体を後方に勢いよく倒し，腹を鉄棒に掛けたまま回転し，手首を返して支持の姿勢に戻ること。","［支持系 後方支持回転技群 後方足掛け回転グループ発展技の例示］","○ 後方もも掛け回転","・ 前後開脚の支持の姿勢から後方に上体と後ろ足を大きく振り出し，ももを掛けて回転し手首を返しながら前後開脚の支持の姿勢に戻ること。","○ 両膝掛け振動下り","・ 鉄棒に両膝を掛けて逆さまになり両手を離し，腕と頭を使って体を前後に振動させ，振動が前から後ろに振れ戻る前に膝を鉄棒から外して下りること。","［技の組み合わせ方の例示］","○ 中学年までの基本的な技や上に示した技の中から，自己の能力に適した技を選んで組み合わせること。","◎ 運動が苦手な児童への配慮の例","・ 前方支持回転が苦手な児童には，ツバメの姿勢からふとん干しを繰り返したり，補助や補助具で回転しやすくしたりして，勢いのつけ方や体を丸めて鉄棒から離さない動きが身に付くようにするなどの配慮をする。","・ 片足踏み越し下りが苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座ったり，ツバメの姿勢で鉄棒上を横に移動したり，片手ずつ順手から逆手，逆手から順手に握りかえるなどの運動に取り組んだりして，バランスをとって鉄棒上で体を操作するための動きが身に付くようにするなどの配慮をする。","・ 膝掛け上がりが苦手な児童には，両手でぶら下がって体を前後に揺らしたり，片膝を掛けて大きく揺らしたり，足抜き回りなどの運動遊びに取り組んだり，補助を受けて回転したり，鉄棒に補助具をつけて回転しやすいようにしたりして，片膝を掛け振りの勢いを利用して上がる動きが身に付くようにするなどの配慮をする。","・ 前方もも掛け回転が苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座ったり，鉄棒に片膝を掛けて揺れたりするなど，バランスをとって回転を開始する姿勢をつくったり，体を揺らしてから振りの動きを利用して回転したりする動きが身に付くようにするなどの配慮をする。","・ 逆上がりが苦手な児童には，体を鉄棒に引きつける運動に取り組んだり，補助や補助具を利用して足を振り上げながら後方回転をしたりして，体を上昇させながら鉄棒に引きつけ回転する動きが身に付くようにするなどの配慮をする。","・ 後方支持回転が苦手な児童には，ツバメの姿勢で足を前後に振って体を曲げたり，補助や補助具で回転しやすくしたりして，勢いのつけ方や体を丸めて回転する動きが身に付くようにするなどの配慮をする。","・ 後方もも掛け回転が苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座ったり，片足を鉄棒から離したりしながら反対側の足を振ったり，また鉄棒に片膝を掛けて揺れたりするなど，バランスをとって回転を開始する姿勢をつくったり，体を揺らしてから振りの動きを利用して回転したりする動きが身に付くようにするなどの配慮をする。","・ 両膝掛け振動下りが苦手な児童には，両膝を掛けて体を揺らしたり，前を見て両膝を外したりする動きが身に付くように，こうもりで腕や頭を使って体を前後に揺らして前を見たり，二人の補助者と手をつないで体を前後に軽く揺らしながら前を見たりする運動に取り組めるようにするなどの配慮をする。"],"ウ":["ウ 跳び箱運動","跳び箱運動では，その行い方を理解するとともに，自己の能力に適した切り返し系や回転系の基本的な技を安定して行ったり，その発展技に取り組んだりすること。","［切り返し系 切り返し跳びグループ発展技の例示］","○ かかえ込み跳び（更なる発展技：屈身跳び）","・ 助走から両足で踏み切って着手し，足をかかえ込んで跳び越し着地すること。","［回転系 回転跳びグループ発展技の例示］","○ 伸膝台上前転","・ 助走から両足で強く踏み切り，足を伸ばしたまま腰の位置を高く保って着手し，前方に回転して着地すること。","○ 頭はね跳び（更なる発展技：前方屈腕倒立回転跳び）","・ 伸膝台上前転を行うように腰を上げ回転し，両手で支えながら頭頂部をつき，尻が頭を越えたら腕と腰を伸ばし，体を反らせながら回転すること。","◎ 運動が苦手な児童への配慮の例","・ かかえ込み跳びが苦手な児童には，マットを数枚重ねた場を設置して，手を着きやすくしたり，跳び越しやすくしたり，体育館のステージに向かって跳び乗ったりして，跳び越しやすい場で踏切り－着手－着地までの動きが身に付くようにするなどの配慮をする。","・ 伸膝台上前転が苦手な児童には，マットを数枚重ねた場や低く設置した跳び箱で腰を上げたり，速さのある前転をしたりして，膝を伸ばして回転する動きが身に付くようにするなどの配慮をする。","・ 頭はね跳びが苦手な児童には，マットを数枚重ねた場や低く設置した跳び箱，ステージを利用して体を反らせてブリッジをしたり，場でつくった段差と補助を利用して頭はね起きを行ったりしながら，体を反らしてはねたり，手で押したりする動きが身に付くようにするなどの配慮をする。"]}},"taiiku-56-C-0":{"page":130,"name":"陸上運動","expl":{"intro":["高学年の陸上運動は，「短距離走・リレー」，「ハードル走」，「走り幅跳び」及び「走り高跳び」で構成され，一定の距離を全力で走ったり，バトンの受渡しをしたり，リズミカルにハードルを走り越えたり，リズミカルな助走から踏み切って跳んだりして，記録に挑戦したり，相手と競走（争）したりする楽しさや喜びを味わうことができる運動である。","低学年の走・跳の運動遊びと中学年の走・跳の運動の学習を踏まえ，高学年では，陸上運動の楽しさや喜びを味わい，その行い方を理解するとともに，短距離走・リレー，ハードル走，走り幅跳び，走り高跳びなどの基本的な技能を身に付けるようにし，中学校の陸上競技の学習につなげていくことが求められる。","また，陸上運動を楽しく行うために，自己やグループの課題を見付け，その解決のための活動を工夫するとともに，約束を守り助け合って運動をしたり，勝敗を受け入れたり，仲間の考えや取組を認めたり，場や用具の安全に気を配ったりできるようにすることが大切である。"],"k":["ア 短距離走・リレー","短距離走・リレーでは，その行い方を理解するとともに，走る距離やバトンの受渡しなどのルールを決めて競走したり，自己（チーム）の記録の伸びや目標とする記録の達成を目指したりしながら，一定の距離を全力で走ることができるようにすること。","［例示］","○ 40～60ｍ程度の短距離走","・ スタンディングスタートから，素早く走り始めること。","・ 体を軽く前傾させて全力で走ること。","○ いろいろな距離でのリレー（一人が走る距離40～60ｍ程度）","・ テークオーバーゾーン内で，減速の少ないバトンの受渡しをすること。","◎ 運動が苦手な児童への配慮の例","・ 短距離走で，素早いスタートが苦手な児童には，構えた際に前に置いた足に重心をかけ，低い姿勢で構えるといったポイントを示すなどの配慮をする。","・ リレーで，減速せずにバトンの受渡しをすることが苦手な児童には，「ハイ」の声をしっかりかけたり，バトンを受ける手の位置や高さを確かめたり，仲間同士でスタートマークの位置を確かめたりするなどの配慮をする。","イ ハードル走","ハードル走では，その行い方を理解するとともに，インターバルの距離やハードルの台数などのルールを決めて競走したり，自己の記録の伸びや目標とする記録の達成を目指したりしながら，ハードルをリズミカルに走り越えることができるようにすること。","［例示］","○ 40～50ｍ程度のハードル走","・ 第１ハードルを決めた足で踏み切って走り越えること。","・ スタートから最後まで，体のバランスをとりながら真っ直ぐ走ること。","・ インターバルを３歩または５歩で走ること。","◎ 運動が苦手な児童への配慮の例","・ 走り越える時に体のバランスを取ることが苦手な児童には，１歩ハードル走や短いインターバルでの３歩ハードル走で，体を大きく素早く動かしながら走り越える場を設定するなどの配慮をする｡","・ 一定の歩数でハードルを走り越えることが苦手な児童には，３歩または５歩で走り越えることができるインターバルを選んでいるかを仲間と確かめたり，インターバル走のリズムを意識できるレーン（レーン上に輪を置く等）を設けたりするなどの配慮をする。","ウ 走り幅跳び","走り幅跳びでは，その行い方を理解するとともに，試技の回数や踏切りゾーンの設置などのルールを決めて競争したり，自己の記録の伸びや目標とする記録の達成を目指したりしながら，リズミカルな助走から力強く踏み切って跳ぶことができるようにすること。","［例示］","○ リズミカルな助走からの走り幅跳び","・ ７～９歩程度のリズミカルな助走をすること。","・ 幅30～40cm程度の踏切りゾーンで力強く踏み切ること。","・ かがみ跳びから両足で着地すること。","◎ 運動が苦手な児童への配慮の例","・ リズミカルな助走から踏み切ることが苦手な児童には，５～７歩程度の助走からの走り幅跳びや跳び箱などの台から踏み切る場などで，力強く踏み切って体が浮くことを経験できるようにしたり，「トン・トン・ト・ト・トン」など，一定のリズムを声に出しながら踏み切る場を設定したりするなどの配慮をする。","エ 走り高跳び","走り高跳びでは，その行い方を理解するとともに，試技の回数やバーの高さの決め方などのルールを決めて競争したり，自己の記録の伸びや目標とする記録の達成を目指したりしながら，リズミカルな助走から力強く踏み切って跳ぶことができるようにする。","［例示］","○ リズミカルな助走からの走り高跳び","・ ５～７歩程度のリズミカルな助走をすること。","・ 上体を起こして力強く踏み切ること。","・ はさみ跳びで，足から着地すること。","◎ 運動が苦手な児童への配慮の例","・ リズミカルな助走から踏み切ることが苦手な児童には，３～５歩程度の短い助走での走り高跳びや跳び箱などの台から踏み切る場などで，力強く踏み切って体が浮くことを経験できるようにしたり，「トン・トン・ト・ト・トン」など，一定のリズムを声に出しながら踏み切る場を設定したりするなどの配慮をする。"],"s":["ア  自己やグループの能力に適した課題を見付け，課題に応じた練習の場や段階を選ぶこと。","○ ICT機器を活用して自己の課題を見付ける例","・ 自己や仲間の走りや跳び方の様子をタブレットやデジタルカメラなどのICT機器を活用して確認し，動きのポイントと照らし合わせて自己やグループの課題を見付け，自己に適した練習方法を選ぶこと。","○ 自己やグループの能力に適した課題を設定し，解決のための活動を選ぶ例","・ ハードル走のインターバルを選ぶなど，自己の課題に適した練習の場を選ぶこと。","イ 自己の能力に適した競走（争）のルールや記録への挑戦の仕方を選ぶこと。","○ 記録への挑戦の仕方を選ぶ例","・ リレーで，チーム対抗戦に向けて自己のチームに適した作戦（レーンや走順など）を選ぶこと。","ウ  自己や仲間の動きの変化や伸びを見付けたり，考えたりしたことを他者に伝えること。","○ 学び合ったことを他者に伝える例","・ 活動後に，運動のポイント，学習の記録，仲間の動きのよさなどを学習カードに書いたり，振り返りの時間に発表したり，感想文を書いたりすること。"],"m":["ア  短距離走・リレーやハードル走，走り幅跳びや走り高跳びに積極的に取り組むこと。","イ 短距離走やリレーなどの約束を守り，仲間と助け合うこと。","ウ  陸上運動をするときに用具の準備や片付け，計測や記録などで，分担された役割を果たすこと。","エ 短距離やリレーなどの勝敗を受け入れること｡","オ  課題を見付けたり，その解決方法を工夫したりする際に，仲間の考えや取組を認めること。","カ  短距離走の場の危険物を取り除いたり，走り高跳びの場を整備したりするとともに，用具の安全に気を配ること。","◎ 運動に意欲的でない児童への配慮の例","・ リレーに意欲的に取り組めない児童には，チーム内で一人一人の走る距離を変えたり，勝敗を競うのではなく目標記録に近づくことを課題としたリレーを行ったりするなどの配慮をする。","・ ハードルにぶつかることへの恐怖心がある児童には，ハードルの板をゴムや新聞紙を折りたたんだものやスポンジ製のものに変えるなどの配慮をする｡","・ ハードルのインターバルの歩数がうまく合わないために，自己の課題に意欲的に取り組めない児童には，インターバルの歩数を決めてから場を選ぶなど，自己の能力に適した練習の場や課題の選択ができるようにしたり，同じような課題をもつ仲間と協力して練習できるようにしたりするなどの配慮をする｡","・ リレーの作戦について考える場面や走り高跳びのグループ競争の仕方を決める場面などで，自己の意見をうまく伝えられなかったり，仲間とうまく関わることができない児童には，話合いや振り返りの際に，学習カードを用いて仲間同士で新たな課題を出し合ったり，学習の成果を確認したりする場面を設定するなどの配慮をする｡"]},"ksub":{"":[],"ア":["ア 短距離走・リレー","短距離走・リレーでは，その行い方を理解するとともに，走る距離やバトンの受渡しなどのルールを決めて競走したり，自己（チーム）の記録の伸びや目標とする記録の達成を目指したりしながら，一定の距離を全力で走ることができるようにすること。","［例示］","○ 40～60ｍ程度の短距離走","・ スタンディングスタートから，素早く走り始めること。","・ 体を軽く前傾させて全力で走ること。","○ いろいろな距離でのリレー（一人が走る距離40～60ｍ程度）","・ テークオーバーゾーン内で，減速の少ないバトンの受渡しをすること。","◎ 運動が苦手な児童への配慮の例","・ 短距離走で，素早いスタートが苦手な児童には，構えた際に前に置いた足に重心をかけ，低い姿勢で構えるといったポイントを示すなどの配慮をする。","・ リレーで，減速せずにバトンの受渡しをすることが苦手な児童には，「ハイ」の声をしっかりかけたり，バトンを受ける手の位置や高さを確かめたり，仲間同士でスタートマークの位置を確かめたりするなどの配慮をする。"],"イ":["イ ハードル走","ハードル走では，その行い方を理解するとともに，インターバルの距離やハードルの台数などのルールを決めて競走したり，自己の記録の伸びや目標とする記録の達成を目指したりしながら，ハードルをリズミカルに走り越えることができるようにすること。","［例示］","○ 40～50ｍ程度のハードル走","・ 第１ハードルを決めた足で踏み切って走り越えること。","・ スタートから最後まで，体のバランスをとりながら真っ直ぐ走ること。","・ インターバルを３歩または５歩で走ること。","◎ 運動が苦手な児童への配慮の例","・ 走り越える時に体のバランスを取ることが苦手な児童には，１歩ハードル走や短いインターバルでの３歩ハードル走で，体を大きく素早く動かしながら走り越える場を設定するなどの配慮をする｡","・ 一定の歩数でハードルを走り越えることが苦手な児童には，３歩または５歩で走り越えることができるインターバルを選んでいるかを仲間と確かめたり，インターバル走のリズムを意識できるレーン（レーン上に輪を置く等）を設けたりするなどの配慮をする。"],"ウ":["ウ 走り幅跳び","走り幅跳びでは，その行い方を理解するとともに，試技の回数や踏切りゾーンの設置などのルールを決めて競争したり，自己の記録の伸びや目標とする記録の達成を目指したりしながら，リズミカルな助走から力強く踏み切って跳ぶことができるようにすること。","［例示］","○ リズミカルな助走からの走り幅跳び","・ ７～９歩程度のリズミカルな助走をすること。","・ 幅30～40cm程度の踏切りゾーンで力強く踏み切ること。","・ かがみ跳びから両足で着地すること。","◎ 運動が苦手な児童への配慮の例","・ リズミカルな助走から踏み切ることが苦手な児童には，５～７歩程度の助走からの走り幅跳びや跳び箱などの台から踏み切る場などで，力強く踏み切って体が浮くことを経験できるようにしたり，「トン・トン・ト・ト・トン」など，一定のリズムを声に出しながら踏み切る場を設定したりするなどの配慮をする。"],"エ":["エ 走り高跳び","走り高跳びでは，その行い方を理解するとともに，試技の回数やバーの高さの決め方などのルールを決めて競争したり，自己の記録の伸びや目標とする記録の達成を目指したりしながら，リズミカルな助走から力強く踏み切って跳ぶことができるようにする。","［例示］","○ リズミカルな助走からの走り高跳び","・ ５～７歩程度のリズミカルな助走をすること。","・ 上体を起こして力強く踏み切ること。","・ はさみ跳びで，足から着地すること。","◎ 運動が苦手な児童への配慮の例","・ リズミカルな助走から踏み切ることが苦手な児童には，３～５歩程度の短い助走での走り高跳びや跳び箱などの台から踏み切る場などで，力強く踏み切って体が浮くことを経験できるようにしたり，「トン・トン・ト・ト・トン」など，一定のリズムを声に出しながら踏み切る場を設定したりするなどの配慮をする。"]}},"taiiku-56-D-0":{"page":135,"name":"水泳運動","expl":{"intro":["高学年の水泳運動は，「クロール」，「平泳ぎ」及び「安全確保につながる運動」で構成され，続けて長く泳いだり，泳ぐ距離や浮いている時間を伸ばしたり，記録を達成したりする楽しさや喜びを味わうことができる運動である。","低学年の水遊びと中学年の水泳運動の学習を踏まえ，高学年では，水泳運動の楽しさや喜びを味わい，その行い方を理解するとともに，手と足の動かし方や呼吸動作などの基本的な技能を身に付けるようにし，中学校の水泳の学習につなげていくことが求められる。","また，水泳運動を楽しく行うために，自己やグループの課題を見付け，その解決のための活動を工夫するとともに，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，水泳運動の心得を守って安全に気を配ったりすることなどをできるようにすることが大切である。"],"k":["ア クロール","クロールでは，その行い方を理解するとともに，左右の手を入れ替える動きに呼吸を合わせて，続けて長く泳ぐこと。","［例示］","○ 25～50ｍ程度を目安にしたクロール","・ 手を左右交互に前方に伸ばして水に入れ，水を大きくかくこと。","・ 柔らかく足を交互に曲げたり伸ばしたりして，リズミカルなばた足をすること。","・ 肩のローリングを用い，体を左右に傾けながら顔を横に上げて呼吸をすること。","○ ゆったりとしたクロール","・ １ストロークで進む距離が伸びるように，頭の上方で両手を揃えた姿勢で，片手ずつ大きく水をかくこと。","・ １ストロークで進む距離が伸びるように，ゆっくりと動かすばた足をすること。","・ 呼吸する側の手をかく動きに合わせて，呼吸をすること。","◎ 運動が苦手な児童への配慮の例","・ 前方に伸ばした手が下がり，手のかきに呼吸を合わすことが苦手な児童には，両手を必ず前方で揃えてから片手ずつかくための練習をする場や，仲間に手を引っ張ってもらいより前方に手を伸ばす練習をする場を設定したり，補助具をおさえる手に力を入れすぎないように助言したりするなどの配慮をする。","・ 頭が前方に上がり，横向きの息継ぎが苦手な児童には，歩きながら息継ぎの練習をする場を設定したり，へそを見るようにして顎を引き，耳まで浸かって息継ぎをするように助言したりするなどの配慮をする。","・ 手や足をゆっくりと動かすことが苦手な児童には，一定の距離を少ないストローク数で泳ぐ場や，決められたストローク数で泳ぐ距離を仲間と競い合う場を設定するなどの配慮をする。","イ 平泳ぎ","平泳ぎでは，その行い方を理解するとともに，手の動きに合わせて呼吸し，キックの後には息を止めてしばらく伸びて，続けて長く泳ぐことができるようにする。","〔例示〕","○ 25～50ｍ程度を目安にした平泳ぎ","・ 両手を前方に伸ばし，ひじを曲げながら円を描くように左右に開き，水をかくこと。","・ 足の親指を外側に開いて左右の足の裏や脚の内側で水を挟み出すとともに，キックの後に伸びの姿勢を保つこと。","・ 手を左右に開き水をかきながら，顔を前に上げ呼吸をすること。","・ 伸びた姿勢から顔を前方にゆっくりと起こしながら手をかきはじめ，肘を曲げながら顔を上げ呼吸した後，キックをした勢いを利用して伸びること。","○ ゆったりとした平泳ぎ","・ １ストロークで進む距離が伸びるように，キックの後に顎を引いた伏し浮きの姿勢を保つこと。","・ キックの勢いをしっかり利用するようにゆっくりと手をかくこと。","◎ 運動が苦手な児童への配慮の例","・ かえる足の動きが苦手な児童には，プールサイドに腰かけて足の内側で水を挟む動きだけを練習したり，壁や補助具につかまって仲間に足を支えてもらい練習したりする場を設定するなどの配慮をする。","・ 手や足の動きと呼吸のタイミングを合わすことが苦手な児童には，陸上で動きの確認をする場を設定したり，水中を歩きながら仲間が息継ぎのタイミングを助言したりするなどの配慮をする。","・ キックの後にすぐ手をかいてしまい，伸びることが苦手な児童には，け伸びをしてから「かいて，蹴る」動きを繰り返すことを仲間と確かめ合ったり，「かいて，蹴って，伸びる」の一連の動作をしたら一度立つように助言し，少ないストローク数で泳ぐ距離を伸ばす場を設定したりするなどの配慮をする。","ウ 安全確保につながる運動","安全確保につながる運動では，その行い方を理解するとともに，背浮きや浮き沈みをしながら，タイミングよく呼吸をしたり，手や足を動かしたりして，続けて長く浮くことができるようにする。","［例示］","○ 10～20秒程度を目安にした背浮き","・ 顔以外の部位がしっかりと水中に入った背浮きの姿勢を維持すること。","・ 息を一度に吐き出し呼吸すること。","・ 背浮きの姿勢を崩さないように，手や足をゆっくりと動かすこと。","○ ３～５回程度を目安にした浮き沈み","・ 大きく息を吸ってだるま浮きをした状態で，仲間に背中を押して沈めてもらい，息を止めてじっとして水面に浮上する浮き沈みを続けること。","・ 浮いてくる動きに合わせて両手を動かし，顔を上げて呼吸をした後，再び沈み，息を止めて浮いてくるまで姿勢を保つ浮き沈みを続けること。","◎ 運動が苦手な児童への配慮の例","・ 背浮きの姿勢での呼吸を続けることが苦手な児童には，浅い場所で踵を付けたまま背浮きになる姿勢の練習をしたり，補助具を胸に抱えたり，仲間に頭や腰を支えてもらったりして続けて浮く練習をしたりするなどの配慮をする。","・ 浮き沈みの動きに合わせた呼吸をすることが苦手な児童には，体が自然に浮いてくるまで待ってから息継ぎをすることや，頭を大きく上げるのではなく首をゆっくりと動かし呼吸することを助言するなどの配慮をする。なお，着衣のまま水に落ちた場合の対処の仕方については，安全確保につながる運動との関連を図り，各学校の実態に応じて積極的に取り扱うこと。"],"s":["ア  自己の課題を見付け，その課題の解決の仕方を考えたり，課題に応じた練習の場や段階を選んだりすること。","○ 学習カードや掲示物などを活用して，自己の課題を見付ける例","・ 学習カードや掲示物などを活用し，動きのポイントと自己や仲間の動きを照らし合わせて自己の課題を見付けること。","○ 距離や回数，時間を確認して，自己の課題を見付ける例","・ クロールや平泳ぎで進んだ距離や，浮き沈みの回数，背浮きの時間など，自分で決めた距離や回数，時間に挑戦することで，自己の課題を見付けること。","○ 手や足の動きと呼吸を合わせるための活動を選ぶ例","・ 口伴奏で呼吸のタイミングを確かめたり，補助具の種類や練習場所を選んだりするなど，自己の課題に応じた練習の場や仕方を選ぶこと。","・ ICT機器を活用して，課題や解決のための動きのポイントを仲間と確認し，自己の課題に応じた練習の仕方を選ぶこと。","イ 自己の能力に適した記録への挑戦の仕方を選ぶこと。","○ 距離や回数を基にして記録への挑戦の仕方を選ぶ例","・ 自ら選んだ泳ぎ方（クロールや平泳ぎ）で続けて長く泳いだり，決まった距離でのストローク数に挑戦をしたりするなど，自己や仲間の能力に応じた記録への挑戦の仕方を選ぶこと。","ウ 課題の解決のために自己や仲間の考えたことを他者に伝えること。","○ クロールや平泳ぎでの自己や仲間の課題を解決する過程で見付けたことや考えたことを他者に伝える例","・ ペアやグループで陸上や水中から役割を決めて互いの動きを見合ったり，互いの練習の補助をし合ったりすることを通して，見付けた動きのポイントや自己や仲間の課題に適した練習方法を伝えること。","○ 安全確保につながる運動での仲間の動きのよさを他者に伝える例","・ 自己や仲間の手や足の動きや呼吸の合わせ方のよさを仲間同士で確かめ合ったり称賛し合ったりすること。"],"m":["ア  水泳運動が自己保全のために必要であることを生かし，クロールや平泳ぎをしたり，背浮きや浮き沈みをしたりするなどの水泳運動に積極的に取り組むこと。","イ  自己や仲間の課題を解決するための練習では，練習場所やレーンの使い方，補助の仕方などの約束を守り，仲間と助け合うこと。","ウ  水泳運動で使用する用具の準備や片付けなどで，分担された役割を果たすこと。","エ  課題を見付けたり，解決方法を工夫したりする際に，仲間の考えや取組を認めること。","オ  プールの底・水面などに危険物がないかを確認したり，自己の体の調子を確かめてから泳いだり，仲間の体の調子にも気を付けるなど，水泳運動の心得を守って安全に気を配ること。","◎ 運動に意欲的でない児童への配慮の例","・ 水に対する恐怖心や違和感を抱く児童には，すぐに泳法の練習を行うのではなく，もぐったり浮いたりしながら呼吸の仕方について確認する場を設定するなどの配慮をする。","・ 仲間とうまく関わりながら学習を進めることが苦手な児童には，ペアやグループ編成を工夫したり，その児童の伸びや仲間との関わりの成果を仲間同士で積極的に認める場を設定したり，仲間と一緒に達成する課題を設定したりするなどの配慮をする。","・ クロールや平泳ぎが50ｍ以上泳ぐことができる児童には，設定した距離をより少ないストローク数で泳ぐことに挑戦する場を設定したり，いろいろな泳ぎ方で競うリレーを取り入れたりするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア クロール","クロールでは，その行い方を理解するとともに，左右の手を入れ替える動きに呼吸を合わせて，続けて長く泳ぐこと。","［例示］","○ 25～50ｍ程度を目安にしたクロール","・ 手を左右交互に前方に伸ばして水に入れ，水を大きくかくこと。","・ 柔らかく足を交互に曲げたり伸ばしたりして，リズミカルなばた足をすること。","・ 肩のローリングを用い，体を左右に傾けながら顔を横に上げて呼吸をすること。","○ ゆったりとしたクロール","・ １ストロークで進む距離が伸びるように，頭の上方で両手を揃えた姿勢で，片手ずつ大きく水をかくこと。","・ １ストロークで進む距離が伸びるように，ゆっくりと動かすばた足をすること。","・ 呼吸する側の手をかく動きに合わせて，呼吸をすること。","◎ 運動が苦手な児童への配慮の例","・ 前方に伸ばした手が下がり，手のかきに呼吸を合わすことが苦手な児童には，両手を必ず前方で揃えてから片手ずつかくための練習をする場や，仲間に手を引っ張ってもらいより前方に手を伸ばす練習をする場を設定したり，補助具をおさえる手に力を入れすぎないように助言したりするなどの配慮をする。","・ 頭が前方に上がり，横向きの息継ぎが苦手な児童には，歩きながら息継ぎの練習をする場を設定したり，へそを見るようにして顎を引き，耳まで浸かって息継ぎをするように助言したりするなどの配慮をする。","・ 手や足をゆっくりと動かすことが苦手な児童には，一定の距離を少ないストローク数で泳ぐ場や，決められたストローク数で泳ぐ距離を仲間と競い合う場を設定するなどの配慮をする。"],"イ":["イ 平泳ぎ","平泳ぎでは，その行い方を理解するとともに，手の動きに合わせて呼吸し，キックの後には息を止めてしばらく伸びて，続けて長く泳ぐことができるようにする。","〔例示〕","○ 25～50ｍ程度を目安にした平泳ぎ","・ 両手を前方に伸ばし，ひじを曲げながら円を描くように左右に開き，水をかくこと。","・ 足の親指を外側に開いて左右の足の裏や脚の内側で水を挟み出すとともに，キックの後に伸びの姿勢を保つこと。","・ 手を左右に開き水をかきながら，顔を前に上げ呼吸をすること。","・ 伸びた姿勢から顔を前方にゆっくりと起こしながら手をかきはじめ，肘を曲げながら顔を上げ呼吸した後，キックをした勢いを利用して伸びること。","○ ゆったりとした平泳ぎ","・ １ストロークで進む距離が伸びるように，キックの後に顎を引いた伏し浮きの姿勢を保つこと。","・ キックの勢いをしっかり利用するようにゆっくりと手をかくこと。","◎ 運動が苦手な児童への配慮の例","・ かえる足の動きが苦手な児童には，プールサイドに腰かけて足の内側で水を挟む動きだけを練習したり，壁や補助具につかまって仲間に足を支えてもらい練習したりする場を設定するなどの配慮をする。","・ 手や足の動きと呼吸のタイミングを合わすことが苦手な児童には，陸上で動きの確認をする場を設定したり，水中を歩きながら仲間が息継ぎのタイミングを助言したりするなどの配慮をする。","・ キックの後にすぐ手をかいてしまい，伸びることが苦手な児童には，け伸びをしてから「かいて，蹴る」動きを繰り返すことを仲間と確かめ合ったり，「かいて，蹴って，伸びる」の一連の動作をしたら一度立つように助言し，少ないストローク数で泳ぐ距離を伸ばす場を設定したりするなどの配慮をする。"],"ウ":["ウ 安全確保につながる運動","安全確保につながる運動では，その行い方を理解するとともに，背浮きや浮き沈みをしながら，タイミングよく呼吸をしたり，手や足を動かしたりして，続けて長く浮くことができるようにする。","［例示］","○ 10～20秒程度を目安にした背浮き","・ 顔以外の部位がしっかりと水中に入った背浮きの姿勢を維持すること。","・ 息を一度に吐き出し呼吸すること。","・ 背浮きの姿勢を崩さないように，手や足をゆっくりと動かすこと。","○ ３～５回程度を目安にした浮き沈み","・ 大きく息を吸ってだるま浮きをした状態で，仲間に背中を押して沈めてもらい，息を止めてじっとして水面に浮上する浮き沈みを続けること。","・ 浮いてくる動きに合わせて両手を動かし，顔を上げて呼吸をした後，再び沈み，息を止めて浮いてくるまで姿勢を保つ浮き沈みを続けること。","◎ 運動が苦手な児童への配慮の例","・ 背浮きの姿勢での呼吸を続けることが苦手な児童には，浅い場所で踵を付けたまま背浮きになる姿勢の練習をしたり，補助具を胸に抱えたり，仲間に頭や腰を支えてもらったりして続けて浮く練習をしたりするなどの配慮をする。","・ 浮き沈みの動きに合わせた呼吸をすることが苦手な児童には，体が自然に浮いてくるまで待ってから息継ぎをすることや，頭を大きく上げるのではなく首をゆっくりと動かし呼吸することを助言するなどの配慮をする。なお，着衣のまま水に落ちた場合の対処の仕方については，安全確保につながる運動との関連を図り，各学校の実態に応じて積極的に取り扱うこと。"]}},"taiiku-56-E-0":{"page":140,"name":"ボール運動","expl":{"intro":["高学年のボール運動は，「ゴール型」，「ネット型」及び「ベースボール型」で構成され，ルールや作戦を工夫したり，集団対集団の攻防によって仲間と力を合わせて競い合ったりする楽しさや喜びを味わうことができる運動である。","低学年と中学年のゲームの学習を踏まえ，高学年では，集団対集団の攻防によって競争する楽しさや喜びを味わい，その行い方を理解するとともに，ボール操作とボールを持たないときの動きによって，簡易化されたゲームをすることができるようにし，中学校の球技の学習につなげていくことが求められる。","また，運動を楽しく行うために，自己やチームの課題を見付け，その解決のための活動を工夫するとともに，ルールを守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や用具の安全に気を配ったりすることなどをできるようにすることが大切である。"],"k":["簡易化されたゲームとは，ルールや形式が一般化されたゲームを児童の発達の段階を踏まえ，実態に応じたボール操作で行うことができ，プレイヤーの人数（プレイヤーの人数を少なくしたり，攻撃側のプレイヤーの人数が守備側のプレイヤーの人数を上回るようにしたりすること），コートの広さ（奥行きや横幅など），ネットの高さ，塁間の距離，プレイ上の制限（攻撃や守備のプレイ空間，触球方法など），ボールその他の運動用具や設備などを修正し，児童が取り組みやすいように工夫したゲームをいう。","なお，アはバスケットボール及びサッカーを，イはソフトバレーボールを，ウ","はソフトボールを主として取り扱うものとするが，これらに替えてハンドボール，タグラグビー，フラッグフットボールなどア，イ及びウの型に応じたその他のボール運動を指導することもできるものとする。なお，学校の実態に応じてウは取り扱わないことができることを「内容の取扱い」で示した。","ア ゴール型","ゴール型では，その行い方を理解するとともに，投げる，受ける，蹴る，止める，運ぶ，手渡すといったボール操作とボール保持者からボールを受けることのできる場所に動くなどのボールを持たないときの動きによって，攻撃側にとって易しい状況の中でチームの作戦に基づいた位置取りをするなどの攻守入り交じった簡易化されたゲームや陣地を取り合う簡易化されたゲームをすること。","［例示］","○ バスケットボール，サッカー，ハンドボールなどを基にした簡易化されたゲーム（攻守が入り交じって行うゴール型）","○ タグラグビーやフラッグフットボールなどを基にした簡易化されたゲーム（陣地を取り合うゴール型）","・ 近くにいるフリーの味方にパスを出すこと。","・ 相手に捕られない位置でドリブルをすること。","・ ボール保持者と自己の間に守備者が入らないように移動すること。","・ 得点しやすい場所に移動し，パスを受けてシュートなどをすること。","・ ボール保持者とゴールの間に体を入れて守備をすること。","◎ 運動が苦手な児童への配慮の例","・ 得点しやすい場所に移動し，パスを受けてシュートなどをすることが苦手な児童には，シュートが入りやすい場所に目印を付けたり，ボールを保持した際に最初にゴールを見ることを助言したりするなどの配慮をする。","・ ボール保持者とゴールの間に体を入れて守備をすることが苦手な児童には，仲間がゴールの位置を教えるようにするなどの配慮をする。","イ ネット型","ネット型では，その行い方を理解するともに，ボール操作とチームの作戦に基づいた位置取りをするなどのボールを持たないときの動きによって，軽くて柔らかいボールを片手，両手もしくは用具を使って操作したり相手が捕りにくいボールを返球したりするチームの連携プレイによる簡易化されたゲームや，自陣から相手コートに向かって相手が捕りにくいボールを返球する手や用具などを使った簡易化されたゲームをすること。","［例示］","○ ソフトバレーボールやプレルボールを基にした簡易化されたゲーム","○ バドミントンやテニスを基にした簡易化されたゲーム","・ 自陣のコート（中央付近）から相手コートに向けサービスを打ち入れること。","・ ボールの方向に体を向けて，その方向に素早く移動すること。","・ 味方が受けやすいようにボールをつなぐこと。","・ 片手，両手もしくは用具を使って，相手コートにボールを打ち返すこと。","◎ 運動が苦手な児童への配慮の例","・ 片手，両手もしくは用具を使って，相手コートにボールを打ち返すことが苦手な児童には，飛んできたボールを短時間保持することを認めたり，うまくはじくことができる児童と比較してどこが違うか考えたりする場を設定するなどの配慮をする。","・ 自陣のコート（中央付近）から相手コートに向けサービスを打ち入れることが苦手な児童には，手を使って投げ入れたり，軽い用具や柄の短い用具を用いたり，軽いボールを用いたり，一歩前からサービスをすることを認めたり，ネットの高さを低くしたりするなどの配慮をする。","・ 味方が受けやすいようにボールをつなぐことが苦手な児童には，飛んできたボールをキャッチしてパスしたりすることができるようにするなどの配慮をする。","ウ ベースボール型","ベースボール型では，その行い方を理解するとともに，静止したボールやゆっくりとした速さで投げられたボールを打つ攻撃や，捕球したり送球したりする守備などのボール操作と，チームとして守備の隊形をとったり走塁をしたりするボールを持たないときの動きによって，攻守交代が繰り返し行える簡易化されたゲームをすること。","［例示］","○ ソフトボールを基にした簡易化されたゲーム","○ ティーボールを基にした簡易化されたゲーム","・ 止まったボールや易しく投げられたボールをバットでフェアグラウンド内に打つこと。","・ 打球方向に移動し，捕球すること。","・ 捕球する相手に向かって，投げること。","・ 塁間を全力で走塁すること。","・ 守備の隊形をとって得点を与えないようにすること。","◎ 運動が苦手な児童への配慮の例","・ 打球方向に移動し，捕球することが苦手な児童には，ゆっくりと投げられたボールを移動して手に当てる練習を工夫したり，柔らかいボールを素手で捕る練習を工夫したりするなどの配慮をする。","・ 守備の隊形をとって得点を与えないようにすることが苦手な児童には，チーム練習の中で守備位置やその役割を確認したり，互いに言葉がけをしたりするなどの配慮をする。"],"s":["ア ルールを工夫すること","○ 誰もが楽しくゲームに参加できるように，プレイヤーの人数，コートの広さ，プレイの制限，得点の仕方などのルールを選ぶ例","・ 攻守に応じて動くことができる範囲を設けてプレイの制限をするなどのルールを選ぶこと。","イ 自己やチームの特徴に応じた作戦を選ぶこと","○ 自己やチームの特徴を確認して作戦を選ぶ例","・ チームの特徴に応じた作戦を選び，自己の役割を確認すること。","ウ 課題の解決のために自己や仲間の考えたことを他者に伝えること","○ 味方が受けやすいようにボールをつなぐことについて考えたことを他者に伝える例","・ 簡易化されたネット型のゲームで，自己や仲間が行っていた動き方の工夫を，動作や言葉，絵図，ICT機器を用いて記録した動画などを使って，他者に伝えること。","○ 守備の隊形について工夫したことを他者に伝える例","・ 簡易化されたベースボール型のゲームで，自チームや相手チームの守備位置のよさについて，動作や言葉，絵図，ICT機器を用いて記録した動画などを使って，他者に伝えること。"],"m":["ア  ゴール型，ネット型，ベースボール型の簡易化されたゲームや練習に積極的に取り組むこと。","イ ルールやマナーを守り，仲間と助け合うこと。","ウ  ゲームを行う場の設定や用具の片付けなどで，分担された役割を果たすこと。","エ ゲームの勝敗を受け入れること。","オ  ゲームや練習の中で互いの動きを見合ったり，話し合ったりする際に，仲間の考えや取組を認めること。","カ  ゲームや練習の際に，使用する用具などを片付けたり場の整備をしたりするとともに，用具の安全に気を配ること。","◎ 運動に意欲的でない児童への配慮の例","・ 味方や相手が投げるボールに恐怖心を抱くためにゲームに意欲的に取り組めない児童には，柔らかいボールを用意したり，大きなボールやゆっくりとした速さになるボールを用意したりするなどの配慮をする。","・ チームの中で何をすればよいかが分からないためにゲームに意欲的に取り組めない児童には，チーム内で分担する役割を確認するなどの配慮をする。","・ 場やルールが難しいためにゲームに意欲的に取り組めない児童には，場の設定やルールをチームで一つずつ確認するなどの配慮をする。","・ 新しく提示した動きが分からないためにゲームに意欲的に取り組めない児童には，代表の児童やチームが行う見本を観察したり，ゲーム中のポジションを確認したり，その動きを動画で確認したりする場を設定するなどの配慮をする。","・ 技能が高いにもかかわらずゲームに意欲的に取り組めない児童には，リーダーとしてチームをまとめるようにしたり，仲間に動きのアドバイスをする役割を担うようにしたりするなどの配慮をする。","・ ゲームに負け続けるためにゲームや練習に意欲的に取り組めない児童には，チームに合った作戦を選び直したり，新たな作戦を試したりすることを促すなどの配慮をする。","・ チーム内で仲間とうまく関わることができないためにゲームに意欲的に取り組めない児童には，チーム内の役割を明確にしたり，その役割に取り組むように助言したりするなどの配慮をする。","・ 仲間と仲よく助け合ってゲームに取り組めない児童には，役割を果たしたこと，最後まで全力でプレイしたこと，味方を励ます言葉がけがあったことなどの取組を，授業のまとめで取り上げて称賛したり，児童が相互に称え合ったりする場面を設定するなどの配慮をする。"]},"ksub":{"":["簡易化されたゲームとは，ルールや形式が一般化されたゲームを児童の発達の段階を踏まえ，実態に応じたボール操作で行うことができ，プレイヤーの人数（プレイヤーの人数を少なくしたり，攻撃側のプレイヤーの人数が守備側のプレイヤーの人数を上回るようにしたりすること），コートの広さ（奥行きや横幅など），ネットの高さ，塁間の距離，プレイ上の制限（攻撃や守備のプレイ空間，触球方法など），ボールその他の運動用具や設備などを修正し，児童が取り組みやすいように工夫したゲームをいう。","なお，アはバスケットボール及びサッカーを，イはソフトバレーボールを，ウ","はソフトボールを主として取り扱うものとするが，これらに替えてハンドボール，タグラグビー，フラッグフットボールなどア，イ及びウの型に応じたその他のボール運動を指導することもできるものとする。なお，学校の実態に応じてウは取り扱わないことができることを「内容の取扱い」で示した。"],"ア":["ア ゴール型","ゴール型では，その行い方を理解するとともに，投げる，受ける，蹴る，止める，運ぶ，手渡すといったボール操作とボール保持者からボールを受けることのできる場所に動くなどのボールを持たないときの動きによって，攻撃側にとって易しい状況の中でチームの作戦に基づいた位置取りをするなどの攻守入り交じった簡易化されたゲームや陣地を取り合う簡易化されたゲームをすること。","［例示］","○ バスケットボール，サッカー，ハンドボールなどを基にした簡易化されたゲーム（攻守が入り交じって行うゴール型）","○ タグラグビーやフラッグフットボールなどを基にした簡易化されたゲーム（陣地を取り合うゴール型）","・ 近くにいるフリーの味方にパスを出すこと。","・ 相手に捕られない位置でドリブルをすること。","・ ボール保持者と自己の間に守備者が入らないように移動すること。","・ 得点しやすい場所に移動し，パスを受けてシュートなどをすること。","・ ボール保持者とゴールの間に体を入れて守備をすること。","◎ 運動が苦手な児童への配慮の例","・ 得点しやすい場所に移動し，パスを受けてシュートなどをすることが苦手な児童には，シュートが入りやすい場所に目印を付けたり，ボールを保持した際に最初にゴールを見ることを助言したりするなどの配慮をする。","・ ボール保持者とゴールの間に体を入れて守備をすることが苦手な児童には，仲間がゴールの位置を教えるようにするなどの配慮をする。"],"イ":["イ ネット型","ネット型では，その行い方を理解するともに，ボール操作とチームの作戦に基づいた位置取りをするなどのボールを持たないときの動きによって，軽くて柔らかいボールを片手，両手もしくは用具を使って操作したり相手が捕りにくいボールを返球したりするチームの連携プレイによる簡易化されたゲームや，自陣から相手コートに向かって相手が捕りにくいボールを返球する手や用具などを使った簡易化されたゲームをすること。","［例示］","○ ソフトバレーボールやプレルボールを基にした簡易化されたゲーム","○ バドミントンやテニスを基にした簡易化されたゲーム","・ 自陣のコート（中央付近）から相手コートに向けサービスを打ち入れること。","・ ボールの方向に体を向けて，その方向に素早く移動すること。","・ 味方が受けやすいようにボールをつなぐこと。","・ 片手，両手もしくは用具を使って，相手コートにボールを打ち返すこと。","◎ 運動が苦手な児童への配慮の例","・ 片手，両手もしくは用具を使って，相手コートにボールを打ち返すことが苦手な児童には，飛んできたボールを短時間保持することを認めたり，うまくはじくことができる児童と比較してどこが違うか考えたりする場を設定するなどの配慮をする。","・ 自陣のコート（中央付近）から相手コートに向けサービスを打ち入れることが苦手な児童には，手を使って投げ入れたり，軽い用具や柄の短い用具を用いたり，軽いボールを用いたり，一歩前からサービスをすることを認めたり，ネットの高さを低くしたりするなどの配慮をする。","・ 味方が受けやすいようにボールをつなぐことが苦手な児童には，飛んできたボールをキャッチしてパスしたりすることができるようにするなどの配慮をする。"],"ウ":["ウ ベースボール型","ベースボール型では，その行い方を理解するとともに，静止したボールやゆっくりとした速さで投げられたボールを打つ攻撃や，捕球したり送球したりする守備などのボール操作と，チームとして守備の隊形をとったり走塁をしたりするボールを持たないときの動きによって，攻守交代が繰り返し行える簡易化されたゲームをすること。","［例示］","○ ソフトボールを基にした簡易化されたゲーム","○ ティーボールを基にした簡易化されたゲーム","・ 止まったボールや易しく投げられたボールをバットでフェアグラウンド内に打つこと。","・ 打球方向に移動し，捕球すること。","・ 捕球する相手に向かって，投げること。","・ 塁間を全力で走塁すること。","・ 守備の隊形をとって得点を与えないようにすること。","◎ 運動が苦手な児童への配慮の例","・ 打球方向に移動し，捕球することが苦手な児童には，ゆっくりと投げられたボールを移動して手に当てる練習を工夫したり，柔らかいボールを素手で捕る練習を工夫したりするなどの配慮をする。","・ 守備の隊形をとって得点を与えないようにすることが苦手な児童には，チーム練習の中で守備位置やその役割を確認したり，互いに言葉がけをしたりするなどの配慮をする。"]}},"taiiku-56-F-0":{"page":145,"name":"表現運動","expl":{"intro":["高学年の表現運動は，「表現」及び「フォークダンス」で内容が構成され，これらの運動は，自己の心身を解き放して，イメージやリズムの世界に没入してなりきって踊ることが楽しい運動であり，互いのよさを生かし合って仲間と交流して踊る楽しさや喜びを味わうことのできる運動である。","低学年の「表現リズム遊び」と中学年の「表現運動」の学習で身に付けてきた即興的に表現する能力やリズムに乗って踊る能力，コミュニケーション能力などを土台として，「表現」では，更に個人やグループの持ち味を生かした簡単なひとまとまりの動きにして，仲間と表したい感じを込めて通して踊る力を培うとともに，「フォークダンス」では，日本の地域や世界の国々で親しまれてきた日本の民踊や外国の踊りを身に付けて，日本の地域や世界の文化に触れながら踊りで交流する力を培い，中学校のダンスの学習につなげていくことが求められる。","また，表現運動を楽しく行うために，自己やグループの課題を見付け，その解決のための活動を工夫するとともに，助け合って踊ったり，互いの動きや考えを認め合ったり，場の安全に気を配ったりすることが大切である。"],"k":["ア 表現","表現では，その行い方を理解するとともに，いろいろな題材からそれらの主な特徴を捉え，表したい感じやイメージをひと流れの動きで即興的に表現したり，グループで簡単なひとまとまりの動きにして表現したりすること。","いろいろな題材とは，高学年の児童の発達の段階に応じて，「激しい感じの題材」，「群（集団）が生きる題材」などの変化と起伏のある表現へ発展しやすい題材と，題材を一つに固定しないで幅の広い捉え方や動きを含む題材として「多様な題材」を示している。それらの中から，題材の特徴を捉え，表したい感じやイメージを強調するように，動きを誇張したり変化を付けたりしてメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に表現したり，グループで変化と起伏のある「はじめ－なか－おわり」の構成を工夫した簡単なひとまとまりの動きにしたりして表現すること。","［題材と動きの例示］","○ 「激しい感じの題材」…生活や自然などから「激しく〇〇する」（バーゲンセール，火山の爆発，大型台風接近など）や「急に〇〇する」（ロボットが壊れた，竜巻発生，怒りの爆発など）などの変化や起伏のある動きを含む題材","○ 「群（集団）が生きる題材」…生活や社会，自然などから「祭り」，「スポーツの攻防」，「出口を探せ！」などの特徴的な群の動きや迫力を生かせる題材","・ 題材の特徴の捉え方としては，題材から動きの変化や起伏の特徴を捉え，そこに感情の変化や起伏を重ねていけるようにする。例えば，「火山の爆発」で，エネルギーの集中と不規則な爆発を繰り返す動きの中に自然への畏れの感情を重ねたり，「スポーツの攻防」で，対立･対応した動きから決定的な瞬間へ展開する動きの中に，勝者と敗者の感情の対比を重ねたりするなどである。","・ ひと流れの動きへの工夫の仕方としては，表したい感じやイメージを，素早く走る－急に止まる，ねじる－回る，跳ぶ－転がるなどの動きで変化を付けたり繰り返したりして，激しい感じや急変する感じをメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に踊ること。","・ 群の動きの工夫の仕方としては，集まる（固まる）－離れる，合わせて動く－自由に動くなど，表したい感じやイメージにふさわしい簡単な群の動きでひと流れの動きにして即興的に踊ること。","・ 簡単なひとまとまりの動きへの工夫の仕方としては，表したい感じやイメージを強調するように，変化と起伏のある「はじめ－なか－おわり」の構成や群の動きを工夫して，仲間と感じを込めて通して踊ること。","○ 「多様な題材」…「わたしたちの地球」，「ニュース〇〇」，「〇月×日，私のダイアリー」など，社会や生活のいろいろな印象的な出来事から個人やグループで選んだ関心のある題材","・ 題材の特徴の捉え方としては，社会の出来事や何気ない日常生活の中から個人やグループで関心のある印象的な出来事を独自に捉えるようにすること。","・ 動きの誇張や変化の付け方としては，表したい感じやイメージを，素早く走る－急に止まる，ねじる－回る，跳ぶ－転がるなどの差のある動きや急変する動きを入れるなどして，変化とメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に踊ること。","・ 簡単なひとまとまりの動きへの工夫の仕方としては，表したい感じやイメージを強調するように「はじめ－なか－おわり」の構成や群の動きを工夫したり，特にラストシーンを印象的にしたりして，個人やグループの持ち味を生かした簡単なひとまとまりの動きにして，仲間と感じを込めて通して踊ること。","◎ 運動が苦手な児童への配慮の例","・ 題材の特徴を捉えることが苦手な児童には，二人から四人組などで，題材の特徴的な様子や動きを出し合いながら踊ってみるなどの配慮をする。","・ ひと流れの動きにすることが苦手な児童には，表したい感じやイメージから捉えた変化とメリハリ（緩急・強弱）のある動きを，教師や仲間のリードで幾つか一緒に踊ってみるなどの配慮をする。","・ 簡単なひとまとまりの動きにすることが難しい児童には，一番表したい感じやイメージを明確にするとともに，できたところまでを通して踊ってみながら，表したい感じにふさわしい「はじめ－なか－おわり」の構成になっているか教師や他のグループに見てもらうなどの配慮をする。","イ フォークダンス（日本の民踊を含む）","フォークダンスでは，その行い方を理解するとともに，日本の民踊や外国の踊りの踊り方の特徴を捉え，基本的なステップや動きを身に付けて，音楽に合わせてみんなで楽しく踊って交流すること。","日本の民踊とは，それぞれの地域で親しまれている民踊や日本の代表的な民踊で，歌詞に伴う手振り，低く踏みしめるような足どりと腰の動き，輪踊り，一人踊りが多いなどの日本の民踊に共通する特徴をもつ踊りとして示している。外国の踊りとは，世界の国々で親しまれている代表的なフォークダンスで，軽快な音楽に乗せたいろいろなステップ，輪や列になって手をつないで踊る，パートナーと組んで踊るなど，国によって様々な特徴をもつ踊りとして示している。それらの踊りの中から踊りの特徴を捉え，基本的なステップや動きを身に付けて，音楽に合わせてみんなで楽しく踊って交流すること。また，踊りの由来や背景を理解し，踊りを通して日本の地域や世界の文化に触れるようにすること。","［踊りと動きの例示］","○ 日本の民踊","それぞれの地域で親しまれている民踊や日本の代表的な民踊の中から，軽快なリズムの踊りや力強い踊りなど，特徴や感じが異なる踊りや簡単な動きで構成されている踊り。","・ 日本の民踊に共通する特徴やそれぞれの踊り方の特徴を捉え，構成された基本的な踊り方を身に付けて踊ること。","・ 阿波踊り（徳島県）や春駒（岐阜県）などの軽快なリズムの踊りでは，軽快な足さばきや手振りで踊ること。","・ ソーラン節（北海道）やエイサー（沖縄県）などの力強い踊りでは，低く踏みしめるような足取りや腰の動きで踊ること。","○ 外国のフォークダンス","世界の国々で親しまれている代表的なフォークダンスの中から，特徴や感じが異なる踊りや簡単な隊形・ステップ・組み方で構成される踊り。","・ マイム・マイム（イスラエル）などのシングルサークルで踊る力強い踊りでは，みんなで手をつなぎ，かけ声をかけて力強くステップを踏みながら移動して踊ること。","・ コロブチカ（ロシア）などのパートナーチェンジのある軽快な踊りでは，パートナーと組んでスリーステップターンなどの軽快なステップで動きを合わせたり，パートナーチェンジをスムーズに行ったりしながら踊ること。","・ グスタフス・スコール（スウェーデン）などの特徴的な隊形と構成の踊りでは，前半の厳かな挨拶の部分と後半の軽快なスキップやアーチくぐりなどの変化を付けて，パートナーや全体でスムーズに隊形移動しながら踊ること。","◎ 運動が苦手な児童への配慮の例","・ 踊ることが苦手な児童には，低学年で既習した簡単な踊りや，前時に学習した踊りを授業の導入で行うなどの配慮をする。","・ 踊りの特徴を捉えて踊ることが苦手な児童には，踊りの由来や背景を伝えたり，映像を見て踊りのイメージを捉えたりするなどの配慮をする。","・ 踊り方を身に付けることが苦手な児童には，教師が曲を口ずさみながら全体を大まかに通して踊り，難しいところは部分練習をするなどの配慮をする。"],"s":["ア  自己やグループの課題を見付け，その課題の解決の仕方を考えたり，課題に応じた見合いや交流の仕方などを選んだりすること。","○ 自己やグループの課題を見付ける例","・ 表したい感じやイメージが表れているか，踊りの特徴を捉えて踊れているかなど，グループの仲間や他のグループの踊りを見て，自己やグループの課題を見付けること。","○ 課題に応じて動きを選ぶ例","・ 「表したい感じやイメージを強調する」という課題に応じて，素早く－ゆっくり，ねじる－回る，跳ぶ－転がるなどの差のある動きや群の動きなどで変化を付ける方法を選ぶこと。","○ 課題にふさわしい簡単なひとまとまりの動きを構成する例","・ 「表したい感じやイメージが伝わりにくい」という課題に応じて，「はじめ－なか－おわり」で一番盛り上げたい場面を明確にし，急変する場面や取り入れる群の動きを選ぶこと。","○ 課題に応じた見合いや交流の仕方を工夫する例","・ 表したい感じやイメージが表れているか，踊りの特徴を捉えているかなどを確かめるために，ペアのグループやクラス全体で見合ったり，一緒に踊って見合いながら交流したりするなどの仕方を選ぶこと。","イ 課題の解決のために自己や仲間の考えたことを他者に伝えること","○ 表現で工夫した成果を他者に伝える例","・ 表したい感じやイメージにふさわしい動きになっているかをペアのグループやクラス全体で見合い，よくなったところを伝えること。","○ フォークダンスで身に付けた踊りの特徴を他者に伝える例","・ ペアのグループやクラス全体で踊り，踊りの特徴が出ているかを伝えること。"],"m":["ア  表したい感じやイメージを表現したり，日本の民踊や外国のフォークダンスで交流したりする運動に積極的に取り組むこと。","イ  表現やフォークダンスに取り組む際に，互いの動きや考えのよさを認め合うこと。","ウ 表現やフォークダンスにグループで取り組む際に，仲間と助け合うこと。","エ  表現やフォークダンスを行う場の設定や用具の片付けなどで，分担された役割を果たすこと。","オ  活動する場所の危険物を取り除くとともに，仲間とぶつからないよう，場の安全に気を配ること。","◎ 運動に意欲的でない児童への配慮の例","・ 仲間の前で表現やフォークダンスを行うことに意欲的に取り組めない児童には，授業の導入で，中学年のリズムダンスで学習したへそ（体幹部）を中心に軽快なリズムに乗って踊る活動を取り入れ，心と体をほぐすなどの配慮をする。","・ 表したい感じやイメージを表現することに意欲的に取り組めない児童には，取り上げる題材を，クラス共通の題材だけでなく，個人やグループの関心や能力の違いに応じて選ぶようにするなどの配慮をする。","・ 日本の民踊や外国のフォークダンスを踊ることに意欲的に取り組めない児童には，身近な郷土の民踊や外国のフォークダンスの映像を見せて興味・関心をもてるようにしたり，踊りに必要な簡単な小道具や衣装を着けて踊りの雰囲気を高めたりするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア 表現","表現では，その行い方を理解するとともに，いろいろな題材からそれらの主な特徴を捉え，表したい感じやイメージをひと流れの動きで即興的に表現したり，グループで簡単なひとまとまりの動きにして表現したりすること。","いろいろな題材とは，高学年の児童の発達の段階に応じて，「激しい感じの題材」，「群（集団）が生きる題材」などの変化と起伏のある表現へ発展しやすい題材と，題材を一つに固定しないで幅の広い捉え方や動きを含む題材として「多様な題材」を示している。それらの中から，題材の特徴を捉え，表したい感じやイメージを強調するように，動きを誇張したり変化を付けたりしてメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に表現したり，グループで変化と起伏のある「はじめ－なか－おわり」の構成を工夫した簡単なひとまとまりの動きにしたりして表現すること。","［題材と動きの例示］","○ 「激しい感じの題材」…生活や自然などから「激しく〇〇する」（バーゲンセール，火山の爆発，大型台風接近など）や「急に〇〇する」（ロボットが壊れた，竜巻発生，怒りの爆発など）などの変化や起伏のある動きを含む題材","○ 「群（集団）が生きる題材」…生活や社会，自然などから「祭り」，「スポーツの攻防」，「出口を探せ！」などの特徴的な群の動きや迫力を生かせる題材","・ 題材の特徴の捉え方としては，題材から動きの変化や起伏の特徴を捉え，そこに感情の変化や起伏を重ねていけるようにする。例えば，「火山の爆発」で，エネルギーの集中と不規則な爆発を繰り返す動きの中に自然への畏れの感情を重ねたり，「スポーツの攻防」で，対立･対応した動きから決定的な瞬間へ展開する動きの中に，勝者と敗者の感情の対比を重ねたりするなどである。","・ ひと流れの動きへの工夫の仕方としては，表したい感じやイメージを，素早く走る－急に止まる，ねじる－回る，跳ぶ－転がるなどの動きで変化を付けたり繰り返したりして，激しい感じや急変する感じをメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に踊ること。","・ 群の動きの工夫の仕方としては，集まる（固まる）－離れる，合わせて動く－自由に動くなど，表したい感じやイメージにふさわしい簡単な群の動きでひと流れの動きにして即興的に踊ること。","・ 簡単なひとまとまりの動きへの工夫の仕方としては，表したい感じやイメージを強調するように，変化と起伏のある「はじめ－なか－おわり」の構成や群の動きを工夫して，仲間と感じを込めて通して踊ること。","○ 「多様な題材」…「わたしたちの地球」，「ニュース〇〇」，「〇月×日，私のダイアリー」など，社会や生活のいろいろな印象的な出来事から個人やグループで選んだ関心のある題材","・ 題材の特徴の捉え方としては，社会の出来事や何気ない日常生活の中から個人やグループで関心のある印象的な出来事を独自に捉えるようにすること。","・ 動きの誇張や変化の付け方としては，表したい感じやイメージを，素早く走る－急に止まる，ねじる－回る，跳ぶ－転がるなどの差のある動きや急変する動きを入れるなどして，変化とメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に踊ること。","・ 簡単なひとまとまりの動きへの工夫の仕方としては，表したい感じやイメージを強調するように「はじめ－なか－おわり」の構成や群の動きを工夫したり，特にラストシーンを印象的にしたりして，個人やグループの持ち味を生かした簡単なひとまとまりの動きにして，仲間と感じを込めて通して踊ること。","◎ 運動が苦手な児童への配慮の例","・ 題材の特徴を捉えることが苦手な児童には，二人から四人組などで，題材の特徴的な様子や動きを出し合いながら踊ってみるなどの配慮をする。","・ ひと流れの動きにすることが苦手な児童には，表したい感じやイメージから捉えた変化とメリハリ（緩急・強弱）のある動きを，教師や仲間のリードで幾つか一緒に踊ってみるなどの配慮をする。","・ 簡単なひとまとまりの動きにすることが難しい児童には，一番表したい感じやイメージを明確にするとともに，できたところまでを通して踊ってみながら，表したい感じにふさわしい「はじめ－なか－おわり」の構成になっているか教師や他のグループに見てもらうなどの配慮をする。"],"イ":["イ フォークダンス（日本の民踊を含む）","フォークダンスでは，その行い方を理解するとともに，日本の民踊や外国の踊りの踊り方の特徴を捉え，基本的なステップや動きを身に付けて，音楽に合わせてみんなで楽しく踊って交流すること。","日本の民踊とは，それぞれの地域で親しまれている民踊や日本の代表的な民踊で，歌詞に伴う手振り，低く踏みしめるような足どりと腰の動き，輪踊り，一人踊りが多いなどの日本の民踊に共通する特徴をもつ踊りとして示している。外国の踊りとは，世界の国々で親しまれている代表的なフォークダンスで，軽快な音楽に乗せたいろいろなステップ，輪や列になって手をつないで踊る，パートナーと組んで踊るなど，国によって様々な特徴をもつ踊りとして示している。それらの踊りの中から踊りの特徴を捉え，基本的なステップや動きを身に付けて，音楽に合わせてみんなで楽しく踊って交流すること。また，踊りの由来や背景を理解し，踊りを通して日本の地域や世界の文化に触れるようにすること。","［踊りと動きの例示］","○ 日本の民踊","それぞれの地域で親しまれている民踊や日本の代表的な民踊の中から，軽快なリズムの踊りや力強い踊りなど，特徴や感じが異なる踊りや簡単な動きで構成されている踊り。","・ 日本の民踊に共通する特徴やそれぞれの踊り方の特徴を捉え，構成された基本的な踊り方を身に付けて踊ること。","・ 阿波踊り（徳島県）や春駒（岐阜県）などの軽快なリズムの踊りでは，軽快な足さばきや手振りで踊ること。","・ ソーラン節（北海道）やエイサー（沖縄県）などの力強い踊りでは，低く踏みしめるような足取りや腰の動きで踊ること。","○ 外国のフォークダンス","世界の国々で親しまれている代表的なフォークダンスの中から，特徴や感じが異なる踊りや簡単な隊形・ステップ・組み方で構成される踊り。","・ マイム・マイム（イスラエル）などのシングルサークルで踊る力強い踊りでは，みんなで手をつなぎ，かけ声をかけて力強くステップを踏みながら移動して踊ること。","・ コロブチカ（ロシア）などのパートナーチェンジのある軽快な踊りでは，パートナーと組んでスリーステップターンなどの軽快なステップで動きを合わせたり，パートナーチェンジをスムーズに行ったりしながら踊ること。","・ グスタフス・スコール（スウェーデン）などの特徴的な隊形と構成の踊りでは，前半の厳かな挨拶の部分と後半の軽快なスキップやアーチくぐりなどの変化を付けて，パートナーや全体でスムーズに隊形移動しながら踊ること。","◎ 運動が苦手な児童への配慮の例","・ 踊ることが苦手な児童には，低学年で既習した簡単な踊りや，前時に学習した踊りを授業の導入で行うなどの配慮をする。","・ 踊りの特徴を捉えて踊ることが苦手な児童には，踊りの由来や背景を伝えたり，映像を見て踊りのイメージを捉えたりするなどの配慮をする。","・ 踊り方を身に付けることが苦手な児童には，教師が曲を口ずさみながら全体を大まかに通して踊り，難しいところは部分練習をするなどの配慮をする。"]}},"taiiku-5-G-1":{"page":150,"name":"保健：心の健康","expl":{"intro":["心の健康については，心は発達すること，及び心と体には密接な関係があることについて理解できるようにする必要がある。また，不安や悩みへの対処にはいろいろな方法があることを理解できるようにするとともに，不安や悩みを緩和するための対処の方法を行うことができるようにする必要がある。さらに，心の健康に関する課題を見付け，よりよい解決に向けて思考し判断するとともに，それらを表現できるようにする必要がある。","このため，本内容は，感情，社会性，思考力など，様々なはたらきの総体として捉えることができる心が，様々な生活経験を通して年齢に伴って発達すること，また，心と体は深く影響し合っていること，不安や悩みは誰もが経験すること，それらへの対処にはいろいろな方法があることなどの知識及び不安や悩みへの対処の技能と，心の健康に関する課題を解決するための思考力，判断力，表現力等を中心として構成している。"],"k":["(ｱ) 心の発達","心は人との関わり，あるいは自然とのふれあいなど様々な生活経験や学習を通して，年齢に伴って発達することを理解できるようにする。その際，家族，友達，地域の人々など人との関わりを中心として取り扱うようにし，心が発達することによって，自己の感情をコントロールしたり，相手の気持ちを理解したりすることができるようになることにも触れるようにする。また，自己の気持ちを上手に伝えるなど，よりよいコミュニケーションが大切であることにも触れるようにする。","(ｲ) 心と体との密接な関係","不安や緊張時には，動悸が激しくなったり，腹痛を起こしたりすること，体調が悪いときには，集中できなかったり，落ち込んだ気持ちになったり，体調がよいときには，気持ちが明るくなったり，集中できるようになったりすることなど，心と体は深く影響し合っていることを理解できるようにする。","(ｳ) 不安や悩みへの対処","不安や悩みがあるということは誰もが経験することであり，そうした場合には，家族や先生，友達などと話したり，相談したりすること，仲間と遊ぶこと，運動をしたり音楽を聴いたりすること，呼吸法を行うなどによって気持ちを楽にしたり，気分を変えたりすることなど様々な方法があり，自分に合った適切な方法で対処できることを理解できるようにする。その際，自己の心に不安や悩みがあるという状態に気付くことや不安や悩みに対処するために様々な経験をすることは，心の発達のために大切であることにも触れるようにする。","不安や悩みへの対処として，体ほぐしの運動や深呼吸を取り入れた呼吸法などを行うことができるようにする。"],"s":["心の健康に関わる事象から課題を見付け，心をよりよく発達させたり不安や悩みに対処したりする視点から，解決の方法を考え，適切なものを選び，それらを説明することができるようにする。","［例示］","・ 心の発達に関する事柄や，不安や悩みの経験から，心の健康に関わる課題を見付けること。","・ 心の発達や心と体の関わりについて，自己の経験と学習したことを関連付けて，よりよく心を発達させる適切な方法や心と体の関わりについて考えること。","・ 不安や悩みに対処する様々な方法を考え，学習したことを活用して，適切な方法を選ぶこと。","・ 心の健康について，考えたり選んだりした方法がなぜ適切なのか，理由をあげて学習カードなどに書いたり，友達に説明したりすること。"],"m":[]}},"taiiku-5-G-2":{"page":153,"name":"保健：けがの防止","expl":{"intro":["けがの防止については，けがの発生要因や防止の方法について理解できるようにする必要がある。また，けがが発生したときには，その症状の悪化を防ぐために速やかに手当ができるようにする必要がある。さらに，危険を予測し回避する方法を考え，それらを表現できるようにする必要がある。","このため，本内容は，交通事故や身の回りの生活の危険などを取り上げ，けがの起こり方とその防止，けがの悪化を防ぐための簡単な手当などの知識及びけがの手当の技能と，けがの防止に関する課題を解決するための思考力，判断力，表現力等などを中心として構成している。"],"k":["(ｱ) 交通事故や身の回りの生活の危険が原因となって起こるけがとその防止","○ 毎年多くの交通事故や水の事故が発生し，けがをする人や死亡する人が少なくないこと，また，学校生活での事故や，犯罪被害が発生していることを理解できるようにするとともに，これらの事故や犯罪，それらが原因となるけがなどは，人の行動や環境が関わって発生していることを理解できるようにする。","○ 交通事故や身の回りの生活の危険が原因となって起こるけがを防止するためには，周囲の状況をよく見極め，危険に早く気付いて，的確な判断の下に安全に行動することが必要であることを理解できるようにする。その際，交通事故の防止については，道路を横断する際の一時停止や右左の安全確認などを，学校生活の事故によるけがの防止については，廊下や階段の歩行の仕方，運動場などでの運動や遊び方などを，犯罪被害の防止については，犯罪が起こりやすい場所を避けること，犯罪に巻き込まれそうになったらすぐに助けを求めることなどを取り上げるようにする。なお，心の状態や体の調子が的確な判断や行動に影響を及ぼすことについても触れるようにする。","○ 交通事故，水の事故，学校生活の事故や，犯罪被害の防止には，危険な場所の点検などを通して，校舎や遊具など施設・設備を安全に整えるなど，安全な環境をつくることが必要であることを理解できるようにする。その際，通学路や地域の安全施設の改善などの例から，様々な安全施設の整備や適切な規制が行われていることにも触れるようにする。","(ｲ) けがの手当","○ けがをしたときには，けがの悪化を防ぐ対処として，けがの種類や程度などの状況をできるだけ速やかに把握して処置すること，近くの大人に知らせることが大切であることを理解できるようにする。また，自らできる簡単な手当には，傷口を清潔にする，圧迫して出血を止める，患部を冷やすなどの方法があることを理解できるようにする。","○ すり傷，鼻出血，やけどや打撲などを適宜取り上げ，実習を通して，傷口を清潔にする，圧迫して出血を止める，患部を冷やすなどの自らできる簡単な手当ができるようにする。"],"s":["けがの防止に関わる事象から課題を見付け，危険の予測や回避をしたり，けがを手当したりする方法を考え，それらを伝えることができるようにする。","［例示］","・ 人の行動や環境，けがの手当の仕方などから，けがや症状の悪化の防止に関わる課題を見付けること。","・ 自分のけがに関わる経験を振り返ったり，学習したことを活用したりして，危険の予測や回避の方法，けがなどの適切な手当の方法を考えたり，選んだりすること。","・ けがの防止について，けがや症状の悪化の防止のために考えたり，選んだりした方法がなぜ適切であるか，理由をあげて学習カードなどに書いたり，友達に説明したりすること。"],"m":[]}},"taiiku-6-G-3":{"page":155,"name":"保健：病気の予防","expl":{"intro":["病気の予防については，病気の発生要因や予防の方法について理解できるようにする必要がある。また，喫煙，飲酒，薬物乱用が健康に与える影響について理解できるようにする必要がある。さらに，病気の予防に関する課題を見付け，よりよい解決に向けて思考し判断するとともに，それらを表現できるようにする必要がある。","このため，本内容は，病気の予防には，病原体が体に入るのを防ぐこと，病原体に対する体の抵抗力を高めること及び望ましい生活習慣を身に付けることが必要であること，また，喫煙，飲酒，薬物乱用などの行為は健康を損なう原因となること，さらに，地域において保健に関わる様々な活動が行われていることなどの知識と病気の予防に関する課題を解決するための思考力，判断力，表現力等を中心として構成している。"],"k":["(ｱ) 病気の起こり方","日常経験している病気として「かぜ」などを取り上げ，病気は，病原体，体の抵抗力，生活行動，環境などが関わりあって起こることを理解できるようにする。","(ｲ) 病原体が主な要因となって起こる病気の予防","病原体が主な要因となって起こる病気として，インフルエンザ，麻疹，風疹，結核などを適宜取り上げ，その予防には，病原体の発生源をなくしたり，移る道筋を断ち切ったりして病原体が体に入るのを防ぐこと，また，予防接種や適切な運動，食事，休養及び睡眠をとることなどによって，体の抵抗力を高めておくことが必要であることを理解できるようにする。","(ｳ) 生活行動が主な要因となって起こる病気の予防","生活行動が主な要因となって起こる病気として，心臓や脳の血管が硬くなったりつまったりする病気，むし歯や歯ぐきの病気などを適宜取り上げ，その予防には，全身を使った運動を日常的に行うこと，糖分，脂肪分，塩分などを摂りすぎる偏った食事や間食を避けたり，口腔の衛生を保ったりすることなど，健康によい生活習慣を身に付ける必要があることを理解できるようにする。","(ｴ) 喫煙，飲酒，薬物乱用と健康","○ 喫煙については，せきが出たり心拍数が増えたりするなどして呼吸や心臓のはたらきに対する負担などの影響がすぐに現れること，受動喫煙により周囲の人々の健康にも影響を及ぼすことを理解できるようにする。また，喫煙を長い間続けるとがんや心臓病などの病気にかかりやすくなるなどの影響があることについても触れるようにする。","飲酒については，判断力が鈍る，呼吸や心臓が苦しくなるなどの影響がすぐに現れることを理解できるようにする。なお，飲酒を長い間続けると肝臓などの病気の原因になるなどの影響があることについても触れるようにする。","その際，低年齢からの喫煙や飲酒は特に害が大きいことについても取り扱うようにし，未成年の喫煙や飲酒は法律によって禁止されていること，好奇心や周りの人からの誘いなどがきっかけで喫煙や飲酒を開始する場合があることについても触れるようにする。","○ 薬物乱用については，シンナーなどの有機溶剤を取り上げ，一回の乱用でも死に至ることがあり，乱用を続けると止められなくなり，心身の健康に深刻な影響を及ぼすことを理解できるようにする。その際，覚醒剤を含む薬物乱用は法律で厳しく規制されていることにも触れるようにする。","(ｵ) 地域の様々な保健活動の取組","人々の病気を予防するために，保健所や保健センターなどでは，健康な生活習慣に関わる情報提供や予防接種などの活動が行われていることを理解できるようにする。"],"s":["病気の予防に関わる事象から課題を見付け，病気を予防する視点から解決の方法を考え，適切な方法を選び，それらを説明することができるようにする。","［例示］","・ 病気の予防について，病原体，体の抵抗力，生活行動，環境などの要因から課題を見付けること。","・ 病気の予防や回復に関する課題について，学習したことを活用して解決の方法を考えたり，選んだりすること。","・ いくつかの病気の要因や起こり方を比べて，それぞれの病気に応じた予防の方法を選ぶこと。","・ 喫煙，飲酒，薬物乱用と健康について，それらの害や体への影響を考えたり，地域の様々な保健活動の取組の中から人々の病気を予防するための取組を選んだりすること。","・ 病気の予防について，病気の予防や回復のために考えたり，選んだりした方法がなぜ適切であるか，理由をあげて学習カードなどに書いたり，友達に説明したりすること。"],"m":[]}}}},"krows":{"A":[{"name":"体ほぐし","cells":["ア","ア","ア"]},{"name":"多様な動き／体の動きを高める","cells":["イ","イ","イ"]}],"B":[{"name":"固定施設","cells":["ア","",""]},{"name":"マット","cells":["イ","ア","ア"]},{"name":"鉄棒","cells":["ウ","イ","イ"]},{"name":"跳び箱","cells":["エ","ウ","ウ"]}],"C":[{"name":"走・リレー","cells":["ア","ア","ア"]},{"name":"ハードル","cells":["ア","イ","イ"]},{"name":"幅跳び","cells":["イ","ウ","ウ"]},{"name":"高跳び","cells":["イ","エ","エ"]}],"D":[{"name":"泳ぐ","cells":["ア","ア","アイ"]},{"name":"もぐる・浮く／安全確保","cells":["イ","イ","ウ"]}],"E":[{"name":"ゴール型","cells":["アイ","ア","ア"]},{"name":"ネット型","cells":["アイ","イ","イ"]},{"name":"ベースボール型","cells":["アイ","ウ","ウ"]}],"F":[{"name":"表現","cells":["ア","ア","ア"]},{"name":"リズム／フォークダンス","cells":["イ","イ","イ"]}]}}],"edition":"品川区版","coming":["生活","音楽","図画工作","家庭","外国語活動","外国語","特別の教科 道徳（市民科）","総合的な学習の時間（市民科）","特別活動（市民科）"],"mapUrl":"https://claude.ai/artifact/QYpnoKHpv9sgD9Zskx6pZe","footer":"学習指導要領まとめツール 品川区版　第1版（国語・社会・算数・理科・体育）　出典：小学校学習指導要領（平成29年告示）（文部科学省）。「小学校学習指導要領（平成29年告示）解説」各教科編（文部科学省）を加工して作成。教科書の単元と学習指導要領の内容との結び付けは、品川区が採択した教科書（令和6〜9年度）の各社の公開資料（年間指導計画など）をもとにしたもの（一部はClaudeの案）。"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KAN = {k:"知識及び技能", s:"思考力、判断力、表現力等", m:"学びに向かう力、人間性等"};
const S = DATA.subjects, SUB = Object.fromEntries(S.map(s => [s.id, s]));
let cur = {subj:S[0].id, way:"unit", g:1, sel:null, part:0, kan:"all", q:""};
const store = {get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }};

/* 段落の字下げ：ア・（ア）などで始まる行は少し下げる */
/* 「アは，『知識及び技能』に関わる事項である。」「アのイは，技能に関わる事項である。」（社会）などの区切りの文は，小さな灰色の文字にする */
const KMARK = /^[アイ](の[ア-ン](及び[ア-ン])?|の前文及びアからサまで)?は，.{0,24}(に関わる)?事項であ(る|り)/;
const pcls = t => t.length < 60 && KMARK.test(t) ? "kmark" : /^（内容の取扱い）|^\(\d\) 「.+」に関わる目標$/.test(t) ? "sub" : /^（[ア-ン]）|^\([ア-ン]\)/.test(t) ? "i2" : /^[ア-ンⅠ-Ⅹ①-⑳][\s　]/.test(t) ? "i1" : "";
const paras = (ls, q) => ls.map(t => '<p class="' + pcls(t) + '">' + hl(t, q) + '</p>').join("");
/* 「アのアは，…」が本文のどこを指すかを小さく添える（社会の6年の歴史など，同じ書き出しがいくつも続くため） */
function refOf(it, t){
  const m = t.length < 60 && t.match(/^([アイ])の([ア-ン])(?:及び([ア-ン]))?は，/); if(!m) return "";
  const i = it.lines.findIndex(l => l.startsWith(m[1] + "　")); if(i < 0) return "";

    }
    if(kan !== "m" && !expl.length && K && K.expl.intro.length && !K.expl.k.length && !K.expl.s.length){ expl = K.expl.intro; note = "解説がア・イに分けて書かれていないため、説明全体です。"; }
    return '<div class="kcell"><div class="kname">' + esc(goalOnly ? "学年の目標（3）" : (it.mark ? it.mark + " " : "") + (K ? K.name : it.head)) + '</div>' +
      (body.length ? '<div class="blk" data-kan="' + kan + '">' + paras(body) + '</div>' : '<p class="note">この観点の本文はありません。</p>') +
      (note ? '<p class="note">' + esc(note) + '</p>' : '') +
      (expl.length ? '<details class="kexp"><summary><span class="k-o">解説を開く</span><span class="k-c">解説を閉じる</span>（p.' + (kan === "m" && note ? s.goals[it.g[0]].page : K.page) + '〜）</summary>' + paras(expl).replace(/<p class="i1">(ア|イ|ウ|エ|オ)[\s　]/g, '<p class="sub">$1 ') + '</details>' : '') +
      (goalOnly ? '' : '<button type="button" class="kopen" data-i="' + it.id + '">この内容をくわしく見る →</button>') + '</div>';
  };
  if(kan === "k" && s.krows && s.krows[cur.kArea]) return renderKeitoRows(s, area, cols);
  if((kan === "k" || kan === "s") && s.trows && s.trows[cur.kArea]) return renderKeitoThemes(s, area, kan);
  let h = '<div class="meta"><span class="badge">' + esc(s.name) + '</span><span class="badge">' + esc(area.name) + '</span><span class="badge" style="border-color:var(--' + kan + ');color:var(--' + kan + ')">' + KAN[kan] + '</span></div>' +
    '<h2>系統で比べる：' + esc(area.name.replace(/^[Ａ-Ｚ]\s*/, "")) + '</h2>' +
    (kan === "m" && !hasM ? '<p class="note">この教科は内容ごとに「学びに向かう力、人間性等」が書かれていないため、各学年の目標の（3）を並べています。</p>' : '') +
    '<div class="row"><p class="note" style="margin:0">横にスクロールすると、ほかの学年も見られます。解説は各列の下で開けます。</p><button type="button" class="gbtn" id="openAll">解説をすべて開く</button></div>' +
    '<div class="keito" style="--n:' + cols.length + '">' + cols.map(c => '<div class="kcol"><div class="khead">' + (c.g.length > 1 ? c.g[0] + '・' + c.g[c.g.length - 1] : c.g[0]) + '年</div>' + c.its.map(cell).join("") + '</div>').join("") + '</div>' +
    '<p class="src">出典：小学校学習指導要領（平成29年告示）' + esc(s.section) + '／' + esc(s.kaisetsu.source) + '</p>';
  $("result").innerHTML = h;
  $("openAll").onclick = () => { const ds = [...$("result").querySelectorAll(".kexp")], open = !ds.every(d => d.open); ds.forEach(d => d.open = open); $("openAll").textContent = open ? "解説をすべて閉じる" : "解説をすべて開く"; };
  $("result").querySelectorAll(".kopen").forEach(b => b.onclick = () => { const it = s.items.find(i => i.id === b.dataset.i); cur.way = "area"; cur.g = it.g[0]; cur.kan = kan; select({t:"i", g:it.g[0], ids:[it.id]}); });
}
/* 系統表の形：同じ内容（幅跳び・走り幅跳びなど）を横の行にそろえる */
function renderKeitoRows(s, area, cols){
  const all = s.krows[cur.kArea];
  /* 見たい行だけを選ぶ（何も選ばなければすべて）。選んだ行は解説を開いておく */
  cur.kPick = cur.kPick || {};
  const pick = cur.kPick[cur.kArea] || [];
  const names = ["全体", ...all.map(r => r.name)];
  const showAll = !pick.length, want = n => showAll || pick.includes(n);
  const rows = all.filter(r => want(r.name));
  const it3 = cols.map(c => c.its[0]);
  const sub = (it, L) => {   /* 本文の⑴の中の「ア　…」と，解説の小見出し「ア …」の部分 */
    const P = splitHonbun(it).k, i = P.findIndex(l => l.startsWith(L + "　") || l.startsWith(L + " "));
    let line = i >= 0 ? [P[i]] : [];
    for(let j = i + 1; i >= 0 && j < P.length && /^（/.test(P[j]); j++) line.push(P[j]);
    const K = s.kaisetsu.items[it.id], ex = K && K.ksub ? K.ksub[L] || [] : [];
    return '<div class="kcell">' + (line.length ? '<div class="blk" data-kan="k">' + paras(line) + '</div>' : '') +
      (ex.length ? '<details class="kexp"><summary><span class="k-o">解説を開く</span><span class="k-c">解説を閉じる</span>（' + esc(ex[0].replace(/^[アイウエオ]\s+/, "")) + '）</summary>' + paras(ex.slice(1)) + '</details>' : '') + '</div>';
  };
  let h = '<div class="meta"><span class="badge">' + esc(s.name) + '</span><span class="badge">' + esc(area.name) + '</span><span class="badge" style="border-color:var(--k);color:var(--k)">' + KAN.k + '</span></div>' +
    '<h2>系統で比べる：' + esc(area.name.replace(/^[Ａ-Ｚ]\s*/, "")) + '</h2>' +
    '<div class="row"><span class="lbl">見たい内容</span><div class="row" style="margin:0" id="rowPick">' +
      '<button type="button" class="gbtn" data-rp="" aria-pressed="' + showAll + '">すべて</button>' +
      names.map(n => '<button type="button" class="gbtn" data-rp="' + esc(n) + '" aria-pressed="' + (!showAll && pick.includes(n)) + '">' + esc(n) + '</button>').join("") + '</div></div>' +
    '<p class="note" style="margin:2px 0">いくつでも選べます。選んだ内容は、解説を開いた状態で出ます。</p>' +
    '<div class="row"><p class="note" style="margin:0">解説 体育編の付録「領域別系統表」の並びに合わせて、同じ内容を横の行にそろえています（行の分け方はClaudeによるものです）。</p><button type="button" class="gbtn" id="openAll">解説をすべて開く</button></div>' +
    '<div class="ktab-wrap"><table class="ktab"><thead><tr><th></th>' + cols.map((c, i) => '<th>' + (c.g.length > 1 ? c.g[0] + '・' + c.g[c.g.length - 1] : c.g[0]) + '年<br><small>' + esc(s.kaisetsu.items[it3[i].id] ? s.kaisetsu.items[it3[i].id].name : it3[i].head) + '</small></th>').join("") + '</tr></thead><tbody>';
  /* いちばん上の行：⑴の書き出しと，小見出しの前にある説明（「基本的な技とは」など） */
  if(want("全体")) h += '<tr><th>全体</th>' + it3.map(it => { const P = splitHonbun(it).k, K = s.kaisetsu.items[it.id], pre = K && K.ksub ? K.ksub[""] || [] : [];
    return '<td><div class="kcell"><div class="blk" data-kan="k">' + paras(P.slice(0, 1)) + '</div>' + (pre.length ? '<details class="kexp"><summary><span class="k-o">解説を開く</span><span class="k-c">解説を閉じる</span>（全体）</summary>' + paras(pre) + '</details>' : '') + '</div></td>'; }).join("") + '</tr>';
  const span = rows.map(() => cols.map(() => 1));
  rows.forEach((r, ri) => cols.forEach((c, ci) => { if(ri > 0 && r.cells[ci] && r.cells[ci] === rows[ri - 1].cells[ci]){ let k = ri - 1; while(span[k][ci] === 0) k--; span[k][ci]++; span[ri][ci] = 0; } }));
  rows.forEach((r, ri) => {
    h += '<tr><th>' + esc(r.name) + '</th>';
    cols.forEach((c, ci) => {
      if(span[ri][ci] === 0) return;
      const rs = span[ri][ci] > 1 ? ' rowspan="' + span[ri][ci] + '"' : '';
      const L = r.cells[ci];
      h += '<td' + rs + '>' + (L ? '<div class="kstack">' + [...L].map(x => sub(it3[ci], x)).join("") + '</div>' : '<p class="note" style="text-align:center">―</p>') + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div><p class="src">出典：小学校学習指導要領（平成29年告示）' + esc(s.section) + '／' + esc(s.kaisetsu.source) + '（行の並びは同書 付録「小学校及び中学校の領域別系統表」を参考にした）</p>';
  $("result").innerHTML = h;
  if(!showAll){ $("result").querySelectorAll(".kexp").forEach(d => d.open = true); $("openAll").textContent = "解説をすべて閉じる"; }
  $("openAll").onclick = () => { const ds = [...$("result").querySelectorAll(".kexp")], open = !ds.every(d => d.open); ds.forEach(d => d.open = open); $("openAll").textContent = open ? "解説をすべて閉じる" : "解説をすべて開く"; };
  $("rowPick").querySelectorAll("[data-rp]").forEach(b => b.onclick = () => {
    const n = b.dataset.rp; let p = cur.kPick[cur.kArea] || [];
    p = !n ? [] : p.includes(n) ? p.filter(x => x !== n) : [...p, n];
    cur.kPick[cur.kArea] = p.length === names.length ? [] : p;
    renderKeito();
  });
}
/* 算数：テーマ（整数のしくみ・わり算など）を行，1〜6年を列にして，同じ系統の内容を横にそろえる */
function renderKeitoThemes(s, area, kan){
  const all = s.trows[cur.kArea];
  cur.kPick = cur.kPick || {};
  const key = cur.kArea + ":" + kan, pick = cur.kPick[key] || [], showAll = !pick.length;
  const rows = all.filter(r => showAll || pick.includes(r.name));
  const gs = s.grades.filter(g => rows.some(r => (r.cells[g] || []).length));   /* 内容のない学年の列は出さない */
  const cell = (c) => {
    const it = s.items.find(i => i.id === c.id), K = s.kaisetsu.items[it.id], body = splitHonbun(it)[kan];
    let expl = K ? K.expl[kan] || [] : [], note = "";
    if(K && !expl.length && K.expl.intro.length && !K.expl.k.length && !K.expl.s.length){ expl = K.expl.intro; note = "（ア・イに分けて書かれていないため説明全体）"; }
    const other = it.area !== cur.kArea ? '<span class="note">（' + esc((s.areas.find(a => a.key === it.area) || {}).name || "") + '）</span>' : '';
    return '<div class="kcell"><div class="kname">' + esc(((it.mark || "") + " " + c.lab).trim()) + other + '</div>' +
      (body.length ? '<div class="blk" data-kan="' + kan + '">' + paras(body) + '</div>' : '') +
      (expl.length ? '<details class="kexp"><summary><span class="k-o">解説を開く</span><span class="k-c">解説を閉じる</span>（p.' + K.page + '〜）' + esc(note) + '</summary>' + paras(expl).replace(/<p class="i1">(ア|イ|ウ|エ|オ)[\s　]/g, '<p class="sub">$1 ') + '</details>' : '') +
      '<button type="button" class="kopen" data-i="' + it.id + '">くわしく見る →</button></div>';
  };
  let h = '<div class="meta"><span class="badge">' + esc(s.name) + '</span><span class="badge">' + esc(area.name) + '</span><span class="badge" style="border-color:var(--' + kan + ');color:var(--' + kan + ')">' + KAN[kan] + '</span></div>' +
    '<h2>系統で比べる：' + esc(area.name.replace(/^[Ａ-Ｚ]\s*/, "")) + '</h2>' +
    '<div class="row"><span class="lbl">見たい内容</span><div class="row" style="margin:0" id="rowPick"><button type="button" class="gbtn" data-rp="" aria-pressed="' + showAll + '">すべて</button>' +
      all.map(r => '<button type="button" class="gbtn" data-rp="' + esc(r.name) + '" aria-pressed="' + (!showAll && pick.includes(r.name)) + '">' + esc(r.name) + '</button>').join("") + '</div></div>' +
    '<p class="note" style="margin:2px 0">いくつでも選べます。選んだ内容は、解説を開いた状態で出ます。' + esc(s.trowNote || "") + '</p>' +
    '<div class="row"><button type="button" class="gbtn" id="openAll">解説をすべて開く</button>' + (gs.length > 3 ? '<span class="note">横にスクロールすると' + gs[gs.length - 1] + '年まで見られます。</span>' : '') + '</div>' +
    '<div class="ktab-wrap"><table class="ktab" style="min-width:' + (gs.length * 230 + 120) + 'px"><thead><tr><th></th>' + gs.map(g => '<th>' + (s.tcols ? s.tcols[g] : g + '年') + '</th>').join("") + '</tr></thead><tbody>';
  for(const r of rows){
    h += '<tr><th>' + esc(r.name) + '</th>' + gs.map(g => { const cs = r.cells[g] || []; return '<td>' + (cs.length ? '<div class="kstack">' + cs.map(cell).join("") + '</div>' : '<p class="note" style="text-align:center">―</p>') + '</td>'; }).join("") + '</tr>';
  }
  h += '</tbody></table></div><p class="src">出典：小学校学習指導要領（平成29年告示）' + esc(s.section) + '／' + esc(s.kaisetsu.source) + '</p>';
  $("result").innerHTML = h;
  if(!showAll){ $("result").querySelectorAll(".kexp").forEach(d => d.open = true); $("openAll").textContent = "解説をすべて閉じる"; }
  $("openAll").onclick = () => { const ds = [...$("result").querySelectorAll(".kexp")], open = !ds.every(d => d.open); ds.forEach(d => d.open = open); $("openAll").textContent = open ? "解説をすべて閉じる" : "解説をすべて開く"; };
  $("rowPick").querySelectorAll("[data-rp]").forEach(b => b.onclick = () => {
    const n = b.dataset.rp; let p = cur.kPick[key] || [];
    p = !n ? [] : p.includes(n) ? p.filter(x => x !== n) : [...p, n];
    cur.kPick[key] = p.length === all.length ? [] : p; renderKeito();
  });
  $("result").querySelectorAll(".kopen").forEach(b => b.onclick = () => { const it = s.items.find(i => i.id === b.dataset.i); cur.way = "area"; cur.g = it.g[0]; cur.kan = kan; select({t:"i", g:it.g[0], ids:[it.id]}); });
}
function renderResult(){
  if(cur.way === "keito") return renderKeito();
  const s = SUB[cur.subj], sel = cur.sel, q = cur.way === "word" ? cur.q : "";
  document.body.classList.remove("only-k", "only-s", "only-m");
  if(cur.kan !== "all") document.body.classList.add("only-" + cur.kan);
  if(!sel){ $("result").innerHTML = '<p class="empty">上で単元や内容を選んでください。</p>'; return; }
  let h = "";
  if(sel.t === "k"){
    const k = s.katsudo[sel.g];
    h = '<div class="meta"><span class="badge">' + sel.g + '年</span><span class="badge">' + esc(s.name) + '</span></div><h2>' + esc(s.katsudoName) + '</h2>' + kanBar() +
      '<section class="sec"><h3>本文と解説の説明（p.' + k.page + '〜）</h3>' + paras(k.paras, q) + '<p class="src">出典：' + esc(s.kaisetsu.source) + '　p.' + k.page + '〜</p></section>' + goalSec(sel.g, q, 2);
  } else if(sel.t === "g"){
    h = '<div class="meta"><span class="badge">' + esc(s.name) + '</span></div><h2>' + sel.g + '年の目標</h2>' + kanBar() + goalSec(sel.g, $("q").value.trim(), 1);
  } else {
    const its = sel.ids.map(id => s.items.find(i => i.id === id)).filter(Boolean);
    const it = its[Math.min(cur.part, its.length - 1)];
    const area = s.areas.find(a => a.key === it.area);
    h = '<div class="meta"><span class="badge">' + (it.g.length > 1 ? it.g[0] + '・' + it.g[it.g.length - 1] : it.g[0]) + '年</span><span class="badge">' + esc(s.name) + '</span><span class="badge">' + esc(area ? area.name : it.areaName) + '</span>' + (sel.t === "u" ? '<span class="badge">単元：' + esc(sel.name) + '（' + esc(sel.book) + '）</span>' : '') + '</div>';
    if(its.length > 1) h += '<p class="note" style="margin:4px 0 0">この単元には、学習指導要領の内容が ' + its.length + ' つ結び付いています。</p><div class="multi">' + its.map((x, i) => '<button type="button" data-part="' + i + '" aria-pressed="' + (x === it) + '">' + esc((x.mark ? x.mark + " " : "") + x.head) + '</button>').join("") + '</div>';
    h += '<h2>' + esc((it.mark ? it.mark + " " : "") + (s.kaisetsu.items[it.id] ? s.kaisetsu.items[it.id].name : it.head)) + '</h2>';
    if(it.units && it.units.length) h += '<div class="units">' + it.units.map(u => '<span class="unit">📖 ' + esc(u.u) + '（' + esc(u.b) + '）</span>').join("") + '</div>';
    if(it.kan) h += '<p class="note" style="margin:4px 0">この指導事項は〔' + KAN[it.kan] + '〕の内容です。' + (it.kan === "k" ? '「思考力、判断力、表現力等」はＡ〜Ｃの指導事項にあります。' : '「知識及び技能」は⑴〜⑶の指導事項にあります。') + '「学びに向かう力、人間性等」は学年の目標の（3）を見てください。</p>';
    h += kanBar() + itemSecs(it, q) + goalSec(it.g[0], q, (s.bandSecs && s.bandSecs[it.g[0]]) || (it.notes && it.notes.length) ? 4 : 3);
    if(s.katsudo && s.katsudo[it.g[0]]) h += '<details class="sec"><summary>' + esc(s.katsudoName) + '（' + it.g[0] + '年）の本文と解説</summary>' + paras(s.katsudo[it.g[0]].paras, q) + '<p class="src">出典：' + esc(s.kaisetsu.source) + '　p.' + s.katsudo[it.g[0]].page + '〜</p></details>';
  }
  $("result").innerHTML = h;
  $("result").querySelectorAll("[data-kan]").forEach(b => { if(b.tagName === "BUTTON") b.onclick = () => { cur.kan = b.dataset.kan; store.set("matome-kan", cur.kan); renderResult(); }; });
  $("result").querySelectorAll("[data-part]").forEach(b => b.onclick = () => { cur.part = +b.dataset.part; renderResult(); });
  if($("allParts")) $("allParts").onclick = () => { cur.allParts = true; renderResult(); };
  if($("unitParts")) $("unitParts").onclick = () => { cur.allParts = false; renderResult(); };
}

/* はじめ */
document.querySelectorAll("[data-way]").forEach(b => b.onclick = () => { cur.way = b.dataset.way; renderPicks(); if(cur.way === "word") $("q").focus(); });
$("subjSel").onchange = () => { cur.subj = $("subjSel").value; cur.sel = null; renderSubjects(); renderPicks(); renderResult(); };
let qt; $("q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(doSearch, 200); });
if(DATA.mapUrl){ $("toMap").hidden = false; $("toMap").href = DATA.mapUrl; }
if(DATA.edition){ document.querySelector(".brand h1").insertAdjacentHTML("beforeend", '<small class="ed">' + esc(DATA.edition) + '</small>'); }
$("foot").textContent = DATA.footer;
const hh = () => document.documentElement.style.setProperty("--hh", $("hdr").offsetHeight + "px"); hh(); addEventListener("resize", hh);
const k0 = store.get("matome-kan"); if(k0 && (k0 === "all" || KAN[k0])) cur.kan = k0;
(function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1)); if(!h) return;
  const [sid, t, a, b] = h.split(":"); if(!SUB[sid]) return; cur.subj = sid; const s = SUB[sid];
  if(t === "i"){ const it = s.items.find(i => i.id === a); if(it){ cur.way = "area"; cur.g = it.g[0]; cur.sel = {t:"i", g:it.g[0], ids:[a]}; } }
  if(t === "u"){ const u = s.units.find(x => x.g === +a && x.u === b); if(u){ cur.way = "unit"; cur.g = u.g; cur.sel = {t:"u", g:u.g, name:u.u, book:u.b, ids:u.ids, parts:u.parts}; } }
  if(t === "k"){ cur.way = "area"; cur.g = +a; cur.sel = {t:"k", g:+a, ids:[]}; }
})();
renderSubjects(); renderPicks(); renderResult();
</script>
</body></html>
