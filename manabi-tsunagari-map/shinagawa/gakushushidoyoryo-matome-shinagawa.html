にする。","こうして見いだされた変化や対応における規則性を生かして，問題を解決する。その際には，規則性と知りたい数量との関係を捉え，筋道を立てて考えて，求めたい数量についての結果を導いていく。さらに，関数の考えを生かして問題を解決した後に，問題解決過程を振り返り，見いだしたきまりを基に，数値を変えるなどして問題場面の条件を変更することで，変化や対応の特徴を発展的に考察することも大切である。"]},"quoteEnd":0},"sansu-5-C-2":{"page":264,"name":"異種の二つの量の割合","expl":{"intro":["第５学年では，これまでに学習した量のほかに，異種の二つの量の割合として捉えられる数量があることを学習する。異種の二つの量の割合として捉えられる数量の比べ方や表し方について理解し，その数量を求めるとともに，目的に応じて大きさを比べたり表現したりする方法を日常生活に生かすことができるようにすることを主なねらいとしている。","第５学年の速さなど単位量当たりの大きさの学習においては，基本的な量の性質をもっていない量を比較するのは初めてであるので，異種の二つの量の割合として捉えられる量を比べることの意味を十分理解できるようにすることが大切である。この意味の理解に基づいて，目的に応じて速さや人口密度などを考察する方法を工夫し，日常の事象の解決に活用することができる資質・能力の育成を目指すことが大切である。","ここで育成される資質・能力は，児童の生活に生かされるだけでなく，小学校のこれからの算数の学習や，中学校の理科における考察にも生かされるものとなる。"],"k":["ア 速さなど単位量当たりの大きさ","児童は日常生活において，人の走る速さや乗り物が移動する速さなどを，速い，遅いなどと表現して捉える経験をしてきている。速さを量として表すには，移動する長さと，移動にかかる時間という二つの量が必要になる。速さを，単位時間当たりに移動する長さとして捉えると，（速さ）＝（長さ）÷（時間）として表すことができる。例えば，時速60㎞の速さとは，１時間に60㎞の長さを移動する速さということになる。","一方で日常生活などでは，速さを，一定の長さを移動するのにかかる時間として捉えることがある。例えば100ｍ走などの競技では，100ｍを走るのにかかる時間によって速さを表している。時間が短いほど，速さが速いということになる。速さを，単位時間当たりに移動する長さとして捉えると，速いほど大きな数値が対応することになる。また，速さを，一定の長さを移動するのにかかる時間として捉えると，速いほど小さな数値が対応することになる。一般に速さについては速いほど大きな数値を対応させた方が都合がよいため，時間を単位量として，単位時間当たりの長さで比べることが多い。","二つの量の割合で捉えられる数量を比べるとき，三つ以上のものを比べたり，いつでも比べられるようにしたりするためには，単位量当たりの大きさを用いて比べるとより能率的に比べられることを理解し，単位量当たりの大きさを用いて比べることができるようにすることが大切である。例えば，米の収量を比較するのに，１a当たりの収量で比べたり，人口の疎密を比べるのに１㎢当たりの人口，すなわち人口密度を用いたりすることが，これに当たる。"],"s":["ア  異種の二つの量の割合として捉えられる数量の関係に着目し，目的に応じて大きさを比べたり表現したりする方法を考察し，それらを日常生活に生かすこと","速さなど単位量当たりの大きさの学習においては，まず，一つの量だけでは比較することができない事象に着目することが大切である。次に，そのような量は，どのようにすると比べることができるかを考えたり，数値化することができるかを考えたりすることが大切である。さらに，例えば速さであれば，単位時間当たりに移動する長さとして捉えたり，一定の長さを移動するのにかかる時間として捉えたりするなど，目的に応じた処理の仕方を工夫することが大切である。","具体的には，次のような指導を通して，異種の二つの量の割合として捉えられる量を比べることの意味を十分理解させるように指導する。","混み具合のように，一つの量，例えば人数だけに着目したのでは比べることができないし，単位となる数量が幾つ分あるかを数えるという測定の考えでも数値化することができない量があることを理解できるようにする。その場合，具体的な場面を用意して，長さや重さのような量と対比させながら，そのような量があることをできるだけ児童自身が見いだせるようにすることが大切である。","例えば，運動場が混み合っているかどうかは，運動場の面積と運動場にいる児童の人数とを組み合わせなければ決められないことなどに，長さ比べや重さ比べと対比させながら気付かせることが考えられる。","次に，このような量は，どのようにすると比べることができるか，どのようにして数値化したらよいかについて考えられるようにする。一般には，二つの量が関わっているので，その一方を揃えてほかの量で比較する方法が用いられる。これらの考えを用いるときには，二つの数量の間に比例関係があるという前提がある。また，平均の考えなども前提にしている。そこで指導に当たっては，これらのことについても着目させ，その意味を理解させていくような配慮が必要である。例えば，混み具合を比べる場合，人数と面積の二つの量が関わっている。このとき，人数を２倍，３倍，４倍，…にしたとき，面積も２倍，３倍，４倍，…すれば混み具合が変わらないことを用いて，比較するときには，どちらか一方の量，例えば面積を揃えて，もう一方の量の人数の大小で比べると比べやすいことに気付かせる。つまり10㎡の部屋に７人いる場合と15㎡の部屋に10人いる場合について混み具合を比べる際，30㎡に揃えるとそれぞれ21人と20人になるが，このように面積を揃えて人数で比べることが考えられる。"]},"quoteEnd":0},"sansu-5-C-3":{"page":266,"name":"割合","expl":{"intro":["第４学年では，簡単な場合について，ある二つの数量の関係と別の二つの数量の関係とを比べる場合に割合を用いる場合があることを知るとともに，日常の事象において，二つの数量の関係に着目し，図や式などを用いて，二つの数量の関係どうしの比べ方を考察することを指導してきた。","第５学年では，割合が小数で表される場合に考察の対象を広げ，ある二つの数量の関係と別の二つの数量の関係とを比べる場合に割合を用いる場合があることや百分率について理解するとともに，二つの数量の関係に着目し，図や式などを用いて，二つの数量の関係どうしの比べ方を考察し，日常生活に生かす力を伸ばしていくことをねらいとしている。また，割合を用いた比べ方のよさを感じて，学習や生活に生かそうとする態度とともに，考察の方法や結果を批判的に振り返り，よりよく問題解決する態度を養うことも大切である。","ここで育成される資質・能力は，第６学年の比，中学校における「数と式」領域や「関数」領域などの考察，中学校の理科における考察に生かされるものである。"],"k":["ア 割合","二つの数量の関係を，割合を用いて比べるとは，二つの数量のうちの一方を基準にする大きさ（基準量）としたときに，もう一方の数量（比較量）がどれだけに相当するのかを，比較量を基準量で割った商で比べることである。この表された数（商）が割合である。","ある二つの数量の関係と別の二つの数量の関係において，基準にする大きさが異なる場合に，割合を用いて，数量の関係どうしを比べることができる。全体と部分の大きさの関係どうし，部分と部分の大きさの関係どうしを比べる場合には，割合を用いる場合が多い。","例えば，「シュートのうまさ」を比べる場合，全シュート数と入ったシュート数という全体と部分の関係に着目したり，入ったシュート数と入らなかったシュート数という部分と部分の関係に着目したりする。以下は，「シュートのうまさ」が0.6の場合の，全シュート数と入ったシュート数の関係である。","シュートのうまさ","10回中６回入る","20回中12回入る","30回中18回入る","…","このように，0.6の割合で入る「うまさ」というのは，10回中６回入る，20回中12回入る，…などを，同じ関係とみることが必要であり，「全シュート数」と「入ったシュート数」の間の比例関係が前提となる。従って，この比較では，シュートのうまさは，差ではなく，割合でみて比べることが必要である。すなわち，「全シュート数」を基準量とし，その大きさを１として，それに対する「入ったシュート数」の割合を小数で表すことで，「シュートのうまさ」を比べていく。","第５学年では，基準量を１として，比較量を割合として小数で表すことで，資料の全体と部分，あるいは，部分と部分の関係どうしを比べる場合があることを理解し，そのような比べ方ができるようにする。","なお，割合は，「Ｂを基にしたＡの割合」，「Ｂの□倍がＡ」など，様々な表現で示されるため，割合を示す表現の中から，基準量や比較量を明確にすることも必要となる。","イ 百分率","割合では，基準とする数量の大きさを適宜決めて，それを単位として用いる。基準量を１としたときに，割合が小数で表されるとき，割合をなるべく整数で表すために，基準量を100として，それに対する割合で表す方法が，百分率（パーセント，％）である。ある二つの数量の関係と別の二つの数量の関係とを割合を用いて比べる場合，百分率による割合の表し方を理解し，百分率を求めたり，用いたりすることができるようにする。","日常の生活では，百分率は，「欠席率が15％だった。」，「定価の20％引きで買った。」というような確定的な事象の関係を表すことに用いられる。また，天気予報などで「明日の降水確率は20％である。」というように不確定な事象に関して用いられることもある。このような場合にも百分率が用いられることについては中学校で学習する。","指導に当たっては，百分率が日常生活の中で用いられている割合の便利な表現であることに気付くことができるように配慮する。また，実際の問題の場面などでは，必要に応じて電卓等を用いて，適切に処理できるように配慮することも望ましい。なお，「内容の取扱い」の（4）では，「歩合の表し方について触れるものとする」と示している。ここで取り扱う歩合の意味については，百分率の場合と関連付け，基準とする大きさを10とみて，それに対する割合を「割」で表していることなどに触れるようにする。また，歩合も，百分率と同様，日常生活の中で用いられている割合の便利な表現であることに気付くことができるよう配慮する。"],"s":["ア  日常の事象における数量の関係に着目し，図や式などを用いて，ある二つの数量の関係と別の二つの数量の関係との比べ方を考察し，それを日常生活に生かすこと","日常の事象における二つの数量の関係に着目すること","第５学年では，日常の事象において，資料の全体と部分の関係どうし，部分と部分の関係どうしを比べる場面で，二つの数量の関係に着目する。すなわち，比べる対象を明確にし，比べるために必要となる二つの数量の関係を，比例関係を前提に，割合でみてよいかを判断する。そして，二つの数量の関係に着目し，問題の条件や割合の求め方を基に，何を基準量とし，何を比較量とするかなどを筋道を立てて考える。","二つの数量の関係どうしを比べるときに，基準とする数量やその大きさをどのように決めるかは，何を目的としているかによって異なってくることが考えられる。全体の数量を基準とするか，部分の数量を基準とするか。基準とする数量を１として，それに対する割合を小数で表すか，あるいは，基準とする数量の大きさを１ではない数にして，それに対する割合を整数で表すか。また，割合を整数で表す場合であっても，基準とする数量を100として，それに対する割合で表すか，基準とする数量を10として，それに対する割合で表すか。目的に照らして，基準量やその大きさの決め方について判断をすることが大切である。","図や式などを用いて，数量の関係どうしの比べ方を考察すること","日常生活の二つの数量の関係を考察する問題場面では，全体と部分の関係どうし，あるいは，部分と部分の関係どうしの比べ方を考察して，得られた割合の大小から判断したり，割合を使って計算をした結果から問題を解決したりする。その際，考察によって得られた結果を日常の事象に戻してその意味を考え，必要に応じて考察の方法や表現方法を見直すことが大切である。","また，用いた方法や結果を振り返り，二つの数量の関係どうしを比べる場合に，どのような比べ方が適切であるかを考えることも大切である。例えば，差による比べ方や，一つの数量だけに着目する比べ方と比較することで，割合を用いて比べることの特徴やよさを考える活動を取り入れることができる。","このとき，全体と部分の関係，部分と部分の関係は，テープ図や数直線などの図，式などを用いて，明瞭，的確に表すことができる。ある二つの数量の関係と別の二つの数量の関係を割合を用いて比べるには，数量の関係を，これらの図や式などを用いて表したり，図や式から数量の関係を読み取ったりしていく。そのためには，第４学年同様，基準量と比較量をこれらの図や式に適切に表すこと，また，図や式から数量の関係を整理して捉えた上で，基準量と比較量を適切に選択し，割合を求めることが必要である。","なお，割合については全国学力・学習状況調査（『平成24年度全国学力・学習状況調査報告書』266ページ）などで課題が示されており，指導に当たっては，言葉と図や式を関連付けるような活動を取り入れることが大切である。以下は，「学級の男子と女子ではどちらの方が一輪車に乗れるかを調べた結果を表した表」から得られる数量の関係を，言葉，図，式で表したものである。","一輪車に乗れる人調べ（人）","乗れる 乗れない 合計","男子 ９ ６ 15","女子 12 ８ 20","男子の，合計の人数を基にした乗れる人数の割合","女子の，合計の人数を基にした乗れる人数の割合","９÷15＝0.6 男 子 ９人 ６人","12÷20＝0.6 女 子 12人 8人","０ 0.6 １（割合）このように，図で表した関係を式にしたり，式に表した関係を図で表したり，図や式の意味を言葉で説明したりすることが大切である。","割合を用いた比べ方を日常生活に生かすこと","日常生活では，打率やシュート率，勝率など「どちらの方が上手なのだろうか」と割合を用いて比べることがある。また，「10％の増量」「１割引」など割合を用いている場面も多くある。このように割合を用いて比べる場面などについて，児童が割合を用いて考えることができるようにする。","Ｄ データの活用"]},"quoteEnd":0},"sansu-5-D-1":{"page":271,"name":"円グラフや帯グラフ","expl":{"intro":["第４学年までに文字情報として得られる「質的データ」や数値情報として得られる「量的データ」，時間変化に沿って得られた「時系列データ」について表にまとめたり，グラフに表したりすることでデータの特徴や傾向を捉えることを学習してきている。","第５学年では，目的に応じたデータの収集や分類整理，表やグラフの選択など，一連の統計的な問題解決ができるようになることや，結論について多面的に捉え考察することができるようになることをねらいとしている。またその過程を通じて，質的データや量的データについて全体と部分，部分と部分の間の関係を調べると特徴を捉えやすい事象があることに気付かせ，割合を示す円グラフや帯グラフに表したり，それを読み取ったりすることをねらいとしている。","この内容は，第６学年での量的データに関する分布の中心や散らばりについての学習の素地となるものである。"],"k":["ア 円グラフや帯グラフの特徴と用い方","円グラフも帯グラフも，事象にある数量の関係を割合で捉え，基準量と比較量との関係をグラフとして表したものである。","円グラフは，データを分類整理した際の各項目の割合に対応させて，円をおうぎ１  １","形に区切って表したグラフのことである。 や といった割合を捉えやすいとい２   ４","う特徴がある。なお，円グラフについては，10等分又は100等分の目盛りの入った用紙を用いる。","帯グラフは帯状の長方形を割合に対応させて幾つかの長方形に区切って表したものである。「内容の取扱い」の（5）では，「複数の帯グラフを比べることにも触れるものとする。」と示している。複数のデータについて項目の割合を比較するには，帯グラフが便利である。例えば，ある項目間の比較について，年次変化を合わせて分析する場合などである。ただし，複数の帯グラフを用いる際には，各帯グラフの合計が異なっている場合があり，そのような場合には割合が小さくなっていても実際のデータとしては大きいなど，見た目では比較ができない場合があるため注意がある必た要めであ注る意。が 必要である。","右 の右図のは図，は，平平成成25年25度年全度国全学国力学・","学習力状・学況習調状査況小調学査校小算学数校Ｂ算の数５Ｂのの例","であるが，平成22年と23年について，","5の例であるが，平成22年と23","インターネットを利用して貸し出す","年について，インターネットを利","割合は同じ60％であるが，合計冊数","用して貸し出す割合は同じ60％","が異なっているため，それぞれの年","であるが，合計冊数が異なってい","のインターネットを利用して貸し出","したる本たのめ，冊そ数れはぞ異れなのっ年てのいイるン。ター","ネ(ッｲ)トを統利計用的しなて問貸題し解出決しのた方本法の","第５学年では，身の回りの事象に","冊数は異なっている。","ついて，その事象の因果関係や傾向","イ 統計的な問題解決の方法","を漠然と捉えるだけでなく，データに基づいて判断する統計的な問題解決の方法第５学年では，身の回りの事象について，その事象の因果関係や傾向を漠然と捉を知り，その方法で考察していくことができるようにする。","えるだけでなく，データに基づいて判断する統計的な問題解決の方法を知り，その統計的な問題解決とは，以下に述べる「問題－計画－データ－分析－結論」と方法で考察していくことができるようにする。","いう五つの段階を経て問題解決することである。","① 統身計的のな回問り題の解事決象とにはつ，い以て下，に興述味べ・る関「心問や題問—題計意画識—デにー基タづ—き分，析統—計結的論に」解と決いう可五能つのな段問階題をを経設て定問す題る解こ決とすることである。","② 見通しを立て，どのようなデータを，どのように集めるかについて計画を①  身の回りの事象について，興味・関心や問題意識に基づき，統計的に解決可立てること","能な問題を設定すること","③ データを集めて分類整理すること，","②  見通しを立て，どのようなデータを，どのように集めるかについて計画を立④ 目的に応じて，観点を決めてグラフや表に表し，データの特徴や傾向をつてること","かむこと","⑤ 問題に対する結論をまとめるとともに，さらなる問題を見いだすこと","その際には，自分たちが学習した分析手法の中でどれを用いて分析するかを計③  データを集めて分類整理すること","④  目的に応じて，観点を決めてグラフや表に表し，データの特徴や傾向をつかむこと","⑤  問題に対する結論をまとめるとともに，さらなる問題を見いだすこと","その際には，自分たちが学習した分析手法の中でどれを用いて分析するかを計画の段階で視野に入れたり，分析に合わせたデータの集め方などを考えたりすることも大切である。","また，得られた結論の意味や妥当性，問題解決の各段階が適切であったかについて，振り返って考え直す態度を養うことにも留意する。"],"s":["ア  目的に応じてデータを集めて分類整理し，データの特徴や傾向に着目し，問題を解決するために適切なグラフを選択して判断し，その結論について多面的に捉え考察すること","目的に応じてデータを集めて分類整理すること","目的に応じてデータを集めて分類整理するためには，児童にとって身近な興味や気付きなどから，判断や考察したい事象を問題場面として設定できるようにすることが大切である。例えば「このクラスは風邪をひいている人が多い。」という気付きがあるとする。そこから，「自分たちの学校で風邪をひいている人が多いのは何年生なのか。」というような問題として設定できるようにし，解決する目的を明確にもてるようにする。","まず，問題を解決するために，データを集める計画を立てる。データの集め方に関して「かぜをひいている・ひいていない・かぜがなおった」のように，どんな選択肢を用意するのか，風邪をひいた回数までたずねるのか，といった点についても，分析を見通した計画を考えられるようにする。そして，第４学年までの学習を生かしながら，分類の観点を決め，データを整理する。","データの特徴や傾向に着目し，問題を解決するために適切なグラフを選択して判断すること","集めたデータを分析するに当たり，データの種類や項目の数を考え，目的に応じて，これまでに学習してきている簡単な表や二次元の表，棒グラフ，折れ線グラフ，円グラフ，帯グラフといった表現から適切なものを選択して表してみることで，データの特徴や傾向をつかみ，判断していくようにする。","例えば，「学年によって風邪をひいている児童の割合はどのように違うのか。」ということが問題であれば，学年別に風邪をひいている児童の割合を整理し，それを複数の帯グラフに表して並べてみることで，割合の違いを明確に捉えることができる。そうして，「風邪をひいている児童の割合は〇年が他の学年より明らかに大きい。」というような判断ができる。","結論について多面的に捉え考察すること","自分たちが出した結論やデータについて，別の観点から見直してみることで，異なる結論が導きだせないかどうかを考察できるようにする。そのためには，割合でみていたものを量で見直してみたり，観点を変えて整理し直してみたりすることが必要となる。","上の例では，風邪をひいている児童の割合が大きい学年が３年生だったとしても，風邪が治った人も併せると５年生の割合のほうが大きかった場合に，風邪をひいた人が多いのは３年生であると結論付けてよいのかどうかを再度検討してみることが考えられる。"]},"quoteEnd":0},"sansu-5-D-2":{"page":274,"name":"測定値の平均","expl":{"intro":["測定について，対象の大きさや測る目的によって適当な計器や単位を選ぶこと，目盛りの読み，測定値の表し方などの基本的な事柄は，第４学年までに指導してきている。","第５学年では，測定した結果について，平均を用いて，それを妥当な数値として示すことができるようにすることをねらいとしている。","測定する場合に，概測によりおよその大きさを捉えておくことは，測定に対する見通しを立て，測定の結果の誤りを少なくする上でも，適当な計器や単位を選択する上でも必要なことである。計器の目盛りを読み取って測定値を出す場合には，その目盛りが最小目盛りのどれに一番近いかによって末位を丸めたり，最小目盛りの間を目分量で10等分などして末位を決めることになり，その値が近似値になることを指導する。"],"k":["ア 平均の意味","平均については児童が形式的に計算できればよいというのではなく，その意味を理解することが必要である。測定した結果を平均する方法については，多いところから少ないところへ移動しならすという方法や，全てを足し合わせたのち等分するという方法が考えられるが，それらの方法と平均の意味を関連させて理解できるようにする。","また，測定には必ず誤差が伴うことに気付かせ，それを考慮に入れた測定値の平均についても指導する。一般に，一つのものの測定値として幾つかの数量があったとき，それらを同じ大きさの数量にならすことでより妥当な数値が得られる場合がある。そこで，測定値を平均する考えを用いることを指導する。測定値を平均するのは，測定する対象がもつ真の値に近い値を得るためである。","例えば，ある三角形の周りの長さを調べるために，何人かの児童が三つの辺の長さを測るとする。すると，１㎜より細かくは物差しで測れないので誤差が生じることがある。そこで，何人かの児童が調べた結果を平均することで，真に近い値を得ようとする。また，歩測によってある長さを調べる場合，その処理方法としては，何度か往復して歩数を何回か測り，これを平均したものが用いられる。","その際，飛び離れた値や，予想外の値があった場合にそのわけを調べさせ，場合によっては，それらを除いて平均を求めたりすることなども考えられるようにする。測定値を平均することは，日常生活だけでなく理科などでも活用して用いられるようにする。","なお，測定値を使って計算するときには，答えの数の桁数を，測定値の桁数より多く出してもあまり意味がないことから，元の測定値の桁数程度にとどめるのが普通である。"],"s":["ア  概括的に捉えることに着目し，測定した結果を平均する方法について考察し，それを学習や日常生活に生かすこと","何らかの対象を測定した際に，適当な計器を用いて正しく測った場合でも測るたびに測定値が若干異なっていたり，人によって値が異なったりすることがある。それらの値は真の値に近いものが得られていることは予想でき，また，多く得られている値がおそらく真の値に近いだろうということも予想できるはずである。そこから，得られた測定値を平均してみるということをすれば，集めた測定値のほとんどを生かすことができ，より信頼できる値を求めることができる。","測定した結果を平均する方法については，多いところから少ないところへ移動させならすという方法や，全てを足し合わせたのち等分するという方法が考えられ，これらの方法について考察し，平均の考えを理科の学習をはじめ，日常生活に生かすことができるようにする。"]},"quoteEnd":0},"sansu-6-A-1":{"page":286,"name":"分数の乗法，除法","expl":{"intro":["第５学年までに，整数及び小数の四則計算について，計算の意味に着目し，計算の仕方を考えたり，それらを日常生活に生かしたりすることを指導してきた。また，分数の加法及び減法について，分数の意味や表現に着目し，計算の仕方を考えることを指導してきた。","第６学年では，分数の乗法及び除法の計算の仕方を考え，それらの計算ができるようにすることや数の意味と表現，計算に関して成り立つ性質に着目し，多面的に捉え，計算の仕方を考える態度や能力を高めることが主なねらいである。この学習は小学校において学ぶ数についての四則計算のまとめとなる。","ここで育成される資質・能力は，中学校数学における「負の数」「無理数」といった数を拡張したときの計算の考察などに生かされるものである。","なお，「内容の取扱い」の（2）では，「第３学年から第６学年までに示す小数や分数の計算の能力を定着させ，それらを用いる能力を伸ばすことに配慮するものとする」と示している。計算を用いる能力には，基礎的・基本的な計算の技能に習熟することや，計算を生活や学習に活用することなどが含まれる。これまでに児童が身に付けてきた計算の技能は，生活や学習で必要となる計算の基になるものであるし，また，より複雑な計算を進めるための基になるものでもある。"],"k":["ア 分数の乗法及び除法の意味","分数の乗法及び除法の意味については，整数の乗法及び除法から小数の乗法及び除法へと拡張された乗法及び除法の意味を適用できるように指導する。すなわち，小数の乗法及び除法の計算の考え方を基にして，乗数や除数が分数の乗法及び除法の意味について理解できるようにする。","乗法の意味は，基準とする大きさとそれに対する割合から，その割合に当たる大きさを求める計算と考えられる。Ｂを「基準にする大きさ」，ｐを「割合」，Ａを「割合に当たる大きさ」とするとき，Ｂ×ｐ＝Ａと表すことができる。","除法の意味は，割合を求める場合（Ａ÷Ｂ＝ｐ）と基準にする大きさを求める場合（Ａ÷ｐ＝Ｂ）の二つが考えられるが，いずれにしても乗法の逆であると捉えられるようにする。","イ 分数の乗法及び除法の計算","第６学年では，分数の乗法及び除法の計算ができるようにする。","「内容の取扱い」の（1）に示す逆数については，除法の計算は逆数を用いること２ ３","によって乗法の形に置き換えることができることを指導する。例えば， ÷ の５ ４","計算は，除数の の逆数は であることから， × と表すことができる。","また，整数や小数の乗法や除法を分数の場合の計算にまとめることも指導する。５ １ ３ ５×１×３","例えば，５÷２×0.3＝ × × ＝ と分数の形にまとめて表すこと１ ２ 10 １×２×10","ができる。","分数の計算については，真分数や仮分数の計算を中心に扱い，帯分数を含む計算については児童の実態によって扱うものとする。分数の乗法及び除法については，帯分数で表すよりも仮分数で表す方が計算を進めやすくなる。このことに児童が気付くことができる程度でよい。いたずらに複雑な計算を指導するのではなく，分数の計算を生活や今後の学習へ活用できるようにすることを重視する必要がある。","ウ 計算に関して成り立つ性質の分数への適用","分数についても，整数や小数の場合と同じように交換法則，結合法則，分配法則が成り立つことを理解できるようにする。","また，乗数が２倍，３倍，４倍，…になると積も２倍，３倍，４倍，…なるという乗法の性質がある。また，除数及び被除数に同じ数をかけても，同じ数で割っても商は変わらないという除法の性質がある。こうした性質が，分数の乗法及び除法についても成り立つことを理解できるようにする。"],"s":["ア  数の意味と表現，計算について成り立つ性質に着目し，計算の仕方を多面的に捉え考えること","分数の乗法及び除法については，分数の意味や表現に着目したり，乗法及び除法に関して成り立つ性質に着目したりして，分数の乗法及び除法について多面的に捉えて，計算の仕方について，児童が工夫して考え出せるようにする必要がある。a １","分数の意味や表現に着目することとは，分数の意味に基づいて を ×aと捉b b","a a","えたり，a÷bを とみたり をa÷bとみたりするなど分数を除法の結果と捉えb b","たりすることなどである。","４例えば，分数の意味と表現に着目して，乗数を単位分数の幾つ分とみると，","× という分数の乗法を次のように計算することができる。","４ ２ ４ １ ４ ４×２ ８","× ＝ × ×２＝ ÷３×２＝ ＝","５ ３ ５ ３ ５ ５×３ 15","また，乗数の を２÷３の結果とみると，次のように求めることができる。","４ ２ ４ ４×２ ８","× ＝ ×２÷３＝ ＝","５ ３ ５ ５×３ 15","計算に関して成り立つ性質に着目することとは，乗法に関して成り立つ性質や除法に関して成り立つ性質，交換法則，結合法則などの四則に関して成り立つ性質に着目することである。","例えば，除法に関して成り立つ性質を用いると， ÷ という分数の除法を次５ ４","のように計算することができる。","２ ３ （２ ）（３ ）（２ ） ２×４ ８","÷ ＝ ×４ ÷ ×４ ＝ ×４ ÷３＝ ＝","５ ４ ５ ４ ５ ５×３ 15","また，","２ ３ （２ ４）（３ ４）（２ ４） ２ ４ ２×４ ８÷ ＝ × ÷ × ＝ × ÷１＝ × ＝ ＝","５ ４ ５ ３ ４ ３ ５ ３ ５ ３ ５×３ 15","と求めることもできる。","なお，このように計算に関して成り立つ性質などを用いて計算の仕方を考えることは，抽象度が高く，児童によっては分かりにくいということがある。そういう場合は，適宜，面積図などの図を用いて考えさせることも大切である。","このように，数の意味と表現，計算に関して成り立つ性質に着目することで，多面的に捉えて，筋道を立てて計算の仕方を考えるなどして，数学的な見方・考え方を伸ばしていくよう指導する。"]},"quoteEnd":0},"sansu-6-A-2":{"page":289,"name":"文字を用いた式","expl":{"intro":["第５学年までに，変わり方や計算法則などを式に表す場面などで，数量の関係に着目し，言葉や□，△などの記号を用いて式に表すことを経験してきている。","第６学年では，これまで学習してきたことを基に，a，xなどの文字を使って未知の数量や任意の数を表すとともに，数量の関係に着目し簡潔かつ一般的に式に表したり，式から具体的な事柄を読み取ったりして考察できるようにする。また，文字に順序よく数を当てはめて答えを求めるなど，問題解決に文字を用いた式を活用することで，数量の関係や自分の思考過程を簡潔に表現できるよさに気付き，進んで生活や学習に活用できるようにする。","文字の使用については，第６学年全体を通じて少しずつ活用場面を広げていき，中学校における文字式の学習の素地を養うことが大切である。"],"k":["ア 文字を用いた式","第５学年までに変化の仕方や計算法則など，数量の関係を言葉の式に表したり，未知数や変数などを□，△などを用いて式に表したりしてきている。この理解の上に，第６学年では，数量を表す言葉や□，△などの代わりに，a，xなどの文字を用いて式に表し，文字の使用に次第に慣れることができるようにする。その際，数を当てはめて調べる活動などを通して，文字には，小数や分数も整数と同じように当てはめることができることを理解する。","文字が未知の数量を表す場合について，その処理の仕方は，□や△を用いた場合と同様である。文字が表す未知の数量を求めるためには，逆算をしたり，文字に順序よく数を当てはめたりして考察する。","文字が変量を表す場合については，二つの数量の関係を二つの文字を用いた式に表す。一方の文字に当てはめる数を決めたときの，他方の文字に当てはまる数を求めることができるようにする。","また，計算法則などを文字を用いた式に表すこともある。この場合はいろいろな数を文字に当てはめて式が成り立つことを確認する。","なお，比例や反比例の学習では，中学校では定数としてaという文字を扱うことがあるが，定数としての文字については中学校で扱う。","このような経験を積み重ねることで，以降の学習や中学校数学でも，文字を用いた式を積極的に活用していける素地を養うようにする。"],"s":["ア  問題場面の数量の関係に着目し，数量の関係を簡潔かつ一般的に表現したり，式の意味を読み取ったりすること","第６学年では，数量を表す言葉や□，△などの代わりに，a，xなどの文字を用いて式に表し，数量の関係を簡潔にしかも一般的に表現できるようになることが大切である。","そして，文字を用いて表した式について，具体的な事柄を読み取ったり，文字に順序よく数を当てはめたりして，問題解決に生かすようにする。例えば，底辺の長さが４㎝の平行四辺形がある。この平行四辺形の高さをa㎝，面積をb㎠として，平行四辺形の高さと面積の数量の関係を式に表すと，４×a＝bと一般的に表すことができる。この式から，高さが決まると面積も決まることや，高さと面積が比例関係になっていることを読み取らせることが大切である。","文字には，整数だけでなく，小数や分数も当てはめることができることに着目し，数の範囲を拡張して考えることができるようにする。","Ｂ 図形"]},"quoteEnd":0},"sansu-6-B-1":{"page":291,"name":"縮図や拡大図，対称な図形","expl":{"intro":["第５学年では，図形の合同については，図形間の関係に着目し，与えられた図形と合同な図形を構成する活動を通して，二つの図形が合同になることについて考察してきた。","第６学年では，縮図や拡大図，並びに，図形の対称性の見方を指導する。","縮図や拡大図については，二つの図形間の関係に着目し，合同についての考察を基に，二つの図形が拡大，縮小の関係にあるのかについて考察する。","また，対称な図形については，図形を構成する要素どうしの関係に着目し，対称性といった観点から図形の性質を考察していくことをねらいにしている。さらに，対称性といった観点から，既習の図形を捉え直すとともに，その性質を日常生活に生かすことをねらいにしている。対称性については，既に低学年から図形を取り扱う際に，例えば，第３学年で二等辺三角形は底辺の垂直二等分線を折り目にして折り重ねたときにぴったり重なるなど，具体的な操作に関連して着目してきている。第６学年では，観察や構成，作図などの活動を通して，均整のとれた美しさ，安定性など，図形のもつ美しさにも着目できるように指導する。上記のような観点から図形の理解を深め，図形に対する感覚を豊かにすることができるようにする。","なお，〔用語・記号〕では，線対称，点対称，対称の軸，対称の中心という用語を示している。これらの用語を用いて説明したり，表現したりできるようにすることが大切である。"],"k":["ア 縮図や拡大図","ア二つ知の識図及形びが技形能も大きさも同じであるときに合同という。縮図や拡大図は，大き(ｱ) 縮図や拡大図","さを問題にしないで，形が同じであるかどうかの観点から図形を捉えたものである。二つの図形が形も大きさも同じであるときに合同という。縮図や拡大図は，互いに縮図や拡大図の関係にある図形については，その対応している角の大きさはきさを問題にしないで，形が同じであるかどうかの観点から図形を捉えたもの全て等しく，対応している辺の長さの比はどこでも一定である。","ある。互いに縮図や拡大図の関係にある図形については，その対応している角実際に，縮図や拡大図をかくに当たっては，次の図のように方眼の縦，横の両方大きさは全て等しく，対応している辺の長さの比はどこでも一定である。","の向きに同じ割合で縮小，拡大したものを用いる場合や，一つの頂点に集まる辺や実際に，縮図や拡大図をかくに当たっては，次の図のように方眼の縦，横の対角線の長さの比を一定にしてかく場合がある。このような縮図や拡大図の意味や方の向きに同じ割合で縮小，拡大したものを用いる場合や，一つの頂点に集ま特徴について，作図することを通して理解できるようにする。","辺や対角線の長さの比を一定にしてかく場合がある。このような縮図や拡大図意味や特徴について，作図することを通して理解できるようにする。","２倍の拡大図","－の縮図","Ｄ","２倍","Ａ","Ｂ","－１ Ｃ","(ｲ) 対称な図形","対称性については，一つの図形について，線対称，点","イ 対称な図形","対称性については，一つの図形について，線対称，点","対称の二つの観点から考察できることを理解する。","線対称な図形とは，１本の直線を折り目として折った","とき，ぴったり重なる図形をさす。そのとき，対応する","点を結ぶ線分は，全て折り目にした直線によって垂直に","二等分される。この直線を対称の軸という。","点対称な図形とは，一つの点Ｏを中心にして180度回","転したときに重なり合う図形である。そのとき，対応す","る点を結ぶ線分は全て，中心にした点Ｏを通り，その中","心によって二等分される。この中心のことを対称の中心","という。","このような線対称，点対称の意味について，観察や構成，作図などの活動を通して理解できるようにし，線対称な図形，点対称な図形，線対称かつ点対称な図形を弁別するなどの活動を通して，図形の見方を深めることが大切である。"],"s":["ア  図形を構成する要素及び図形間の関係に着目し，構成の仕方を考察したり図形の性質を見いだしたりするとともに，その性質を基に既習の図形を捉え直したり日常生活に生かしたりすること","図形間の関係に着目し，構成の仕方を考察すること","第５学年では，二つの図形の関係について，辺の長さ，角の大きさが全て同じになる合同について学習してきた。第６学年では，大きさは異なるが，形が同じに見える図形について考察する。このような形が同じ二つの図形において，構成する要素の関係はどうなっているかを調べることになる。角の大きさに着目すると，二つの図形では全ての角の大きさが一致していることが分かるが，辺の長さに着目すると，長さは一致していないことが分かる。ここで，「同じ」をどのように捉え直すかが重要な論点となる。線分の長さの比に着目し，それが同じかどうかによって，同じ形かどうかを取り決めすることになる。そして，対応している角の大きさが全て等しく，対応している辺の長さの比がどこでも一定であることを見いだしていく。そしてこれを活用することで，縮図や拡大図をかくことが可能になる。","図形を構成する要素に着目し，図形の性質を見いだすこと","図形の性質を調べるには，その図形を構成する要素に着目し，それらの関係を考察していくことになる。第６学年では，辺の長さや角の大きさの相等関係について考察し，図形の性質を見いだしていくことになる。","例えば，ある直線に関して，左右両側が同じに見える図形がある。これを確かめるには，一本の直線を折り目にして二つに折ってみて，折り目の両側の形がぴったり重なるかどうかを確かめればよい。この行為は，図形を構成する要素に着目すると，一本の直線に対して両側にある，対応する点，対応する辺の長さ，対応する角の大きさがぴったり重なり合っていること，言い換えると合同になっていることを意味する。このように，一本の直線に対して両側にある，対応する点，対応する辺の長さ，対応する角の大きさが同じであるかどうかに着目することは，図形の性質（線対称）を見いだすための一つの着眼点となる。","また，左右両側が同じに見えるのに，一本の直線を折り目にして二つに折ってみても，重ならない図形がある。このような図形の中には，直線で折るのではなく，ある１点を中心に180度回転させてみることで，点，辺の長さ，角の大きさがぴったり重なり合う図形がある。このような図形では，ある１点を中心に180度回転させたとき，対応する点，対応する辺の長さ，対応する角の大きさが同じであるかどうかに着目することが，図形の性質（点対称）を見いだすための一つの着眼点となる。この線対称，点対称の性質を活用することで，線対称，点対称な図形を作図することが可能になる。","図形の性質を基に既習の図形を捉え直すこと","対称性については，既習の三角形，四角形，さらには，正多角形について，線対称な図形，点対称な図形，線対称かつ点対称な図形を弁別し，既習の図形を対称性といった観点から捉え直すことが大切である。例えば，線対称という観点から三角形をみると，二等辺三角形と正三角形を線対称な図形と捉えることができる。また，点対称という観点から四角形をみると，平行四辺形，ひし形，長方形，正方形を点対称な図形と捉えることができる。","図形の性質を日常生活に生かすこと","縮図や拡大図においては，日常生活にも活用されており，どのようなところで，どのように活用できるかを探ることが大切である。そして，縮図や拡大図では，対応する角の大きさが全て等しく，対応する辺の長さの比がどこでも一定であることを活用することで，日常生活の問題解決に生かしていけるようにする。","例えば，縮図や拡大図が，コピー機，地図，設計図，顕微鏡による像，写真，映画など，日常生活の中でいろいろと活用されていることに着目させたり，身の回りに見られる合同な図形が敷き詰められた床や壁などの模様から縮図や拡大図を見付けたりさせる。さらに，縮図や拡大図の考え方を活用する場面として，木の高さのように測定しにくい部分を測定しやすい影の長さを測って求めさせたり，比との関連で，地図上でｌ：100とあるのは地図上の１㎝が実際の１ｍを表していることから，地図上の長さから実際の長さを計算で求めさせたりする活動を通して，進んで生活に生かそうとする態度が育成されるようにする。例えば，学校のプールの図と縮尺を基にして，実際のプールの長さを計算で求める活動がある。","対称性については，身の回りから対称な図形を見付ける活動を通して，図形のもつ美しさや，日常生活に対称な形が用いられていることを実感的に理解できるようにすることをねらいとしている。対称な図形については，敷き詰められた図形や敷き詰められた模様などを通して，整った形の美しさとして日常生活でも見付けることができる。また，対称な図形は，植物や動物，装飾品，模様，地図記号や都道府県のマークなど，身の回りのいたるところで見られるので，それらを見付ける活動を大切にしていくようにする。"]},"quoteEnd":0},"sansu-6-B-2":{"page":295,"name":"概形とおよその面積","expl":{"intro":["第６学年の概形やおよその面積に関わる学習では，第４学年，第５学年の図形の面積の学習に基づき，概測などを用いて，測定が目的に応じて能率よくできるようにすることを主なねらいとしている。","第６学年の概形やおよその面積に関わる学習を通して，身の回りの具体的な形を，これまでに学習した図形を構成する要素や性質に着目して概形として捉えることで，筋道を立てて考える資質・能力が育成されることが大切である。そのため，身の回りの具体的な形を考察の対象として取り上げ，多様な図形の見方を働かせるようにすることが大切である。"],"k":["ア 概形とおよその面積","面積や体積を測定する対象となる身の回りにある図形は，必ずしも基本的な図形とは限らない。そこで，平面図形であれば，これまでに求積してきた三角形や四角形のように測定しやすい形と捉えたり，それらの図形に分割した形として捉えたりすることで，およその面積を測定することが可能になる。また，立体図形であれば，直方体や立方体と捉えたり，それらの立体図形に分割した形として捉えたりといった工夫をすることで，およその体積を測定することが可能になる。その際，概形を捉えることが重要な働きをする。身の回りにある形の面積や体積などについて考察する過程で，このような処理について経験を豊かにする必要がある。","なお，測定値を用いた計算に当たっては，いたずらに桁数を多く求めてもあまり意味がないことについて触れ，目的に応じて適切な桁数の計算ができるようにする。"],"s":["ア  図形を構成する要素や性質に着目し，筋道を立てて面積などの求め方を考え，それを日常生活に生かすこと","複雑な形であったり，必ずしも直線で構成されていなかったりする身の回りにある図形の面積や体積を測定する際には，これまでに学習してきた基本的な図形と対応させ，測定する見通しをもち，筋道を立てて考察することが大切である。このような筋道を立てて考察する能力を伸ばすことで，身の回りの事象に算数を活用する資質・能力を培うことができる。"]},"quoteEnd":0},"sansu-6-B-3":{"page":296,"name":"円の面積","expl":{"intro":["第５学年までに，三角形や四角形など直線で囲まれた図形の面積の求め方について指導している。また円については，円周の長さが（直径）×（円周率）で求められることを指導している。第６学年では，曲線で囲まれた図形の面積を工夫して測定する能力を伸ばすとともに，円の面積を求める公式をつくる活動を通して，算数として簡潔かつ的確な表現へと高める能力を一層伸ばすことを主なねらいとしている。"],"k":["ア 円の面積の求め方","円の面積は，（半径）×（半径）×（円周率）で求めることができることを理解し，円の面積を求めることができるようにする。ただ，単に公式を使いこなすだけでなく，第５学年までに学習してきた基本図形の面積の求め方に帰着することで，円の面積は計算によって求めることができることを理解できるようにすることが大切である。","また，公式が半径を一辺とする正方形の面積の3.14倍","を意味していることを，図と関連付けて理解できるように","する。","なお，「内容の取扱い」の（3）では，「円周率は3.14を","用いるものとする」と示しており，円の面積を求める際に","は，円周率は3.14を用いて処理することについて指導する。"],"s":["ア  図形を構成する要素などに着目し，基本図形の面積の求め方を見いだすとともに，その表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと","基本図形の面積の求め方を見いだすこと","円の面積の求め方を考える際には，面積の大きさの見通","しをもつことが大切である。例えば，円に内接したり外接","したりする正方形を基にして，円の面積は，一辺の長さが","半径に等しい正方形の面積の２倍と４倍の間にあると捉え","ることがこれに当たる。また，方眼紙に円を作図して，円","の内側にある正方形の個数を数えて，およその面積を捉え","ることもこれに当たる。","その上で，円の面積の求め方を，図形を構成する要素な","どに着目して，既習の求積可能な図形の面積の求め方を基","に考えたり，説明したりする。特に，このときに，数学的","な見方・考え方を働かせることで，図形の一部を変形した","り移動したりして，計算による求積が可能な図形に等積変","形する考えが導かれる。円の面積の求め方を考察する中で，","上記のように数学的な見方・考え方を働かせることによって，児童が自ら工夫して面積を求めることができるようにすることが大切である。","例えば半径10㎝の円の面積に","ついては，円を中心から等分して","並べ替え，平行四辺形に近い形を","作り，円の面積を求める方法が考","えられる。この場合，等分を細かくしていけば，平行四辺形に近い形の底辺は円周の長さの半分に，高さは元の円の半径に近づくことから，円の面積は次のような式で表せる。","（円の面積）＝（平行四辺形の面積）","＝（底辺）×（高さ）","＝（円周の長さの半分）×（半径）","10×２×3.14÷２ 10","10×２×3.14÷２×10＝314 314㎠","面積の求め方の表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと","円の面積の求め方を見いだしたら，式を読んで，もとの円のどこの長さに着目すると面積を求めることができるのか，振り返って考えることが大切である。","例えば，上の例では10×２×3.14÷２×10という式で円の面積を求めることができたことを基に考える。この式にある二つの10はもともと円の半径を意味していたことを振り返り，次の公式に導いていく。","（円の面積）＝（半径）×（半径）×（円周率）","なおこの公式を読むことで，円の面積が半径を一辺とする正方形の面積の3.14倍であることも気付かせることができる。"]},"quoteEnd":0},"sansu-6-B-4":{"page":298,"name":"角柱及び円柱の体積","expl":{"intro":["第６学年では，第５学年における立方体や直方体の体積の学習を踏まえ，角柱や円柱の体積について，必要な部分の長さを測り，計算によって体積を求めるという考えを基に，新しい公式を導きだし，それを用いることができるようにすることを主なねらいとしている。","そして角柱や円柱の体積について，計算による体積の求め方を考えるとともに，その表現を振り返り，簡潔かつ的確な表現に高める資質・能力が育成されることが大切である。その際，考察の対象となる，空間図形と既習の図形の面積の求め方を関連付けて図形の見方を働かせ，体積の求め方を考えたり，公式を導いたりする過程を繰り返すことで，上記の資質・能力を伸ばすようにすることが大切である。"],"k":["ア 角柱及び円柱の体積の求め方","角柱，円柱の体積については，第５学年で指導した立方体，直方体の場合の体積の求め方を基にして，これらの立体の体積も計算によって求めることができることを理解することが大切である。","直方体の体積は，一辺が１㎝の立方体を基にして（縦）×（横）×（高さ）で求めてきたが，ここでは，（底面積）×（高さ）と捉え直していく。そのことを基にして，角柱や円柱の体積は，（底面積）×（高さ）で求めることができることを理解できるようにする。"],"s":["ア  図形を構成する要素に着目し，基本図形の体積の求め方を見いだすとともに，その表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと","角柱，円柱の体積の求め方を，図形を構成する要素などに着目して，既習の立方体，直方体の体積の求め方を基に考えたり，図形の面積の学習と関連付けたりしながら説明したりする。直方体や立方体では，高さを１㎝に切った立体の体積をまず考えて，その体積を高さの分だけ倍にする考えを用いて体積の公式を導き出した。このことを基にして，次のように直方体での（縦）×（横）が（底面積）に当たると捉え直す。（直方体の体積）＝（縦）×（横）×（高さ）","＝（底面積）×（高さ）","また，捉え直した直方体の体積を求める公式から類推して，角柱や円柱の体積を求める公式を導くことができる。","（角柱や円柱の体積）＝（底面積）×（高さ）","その際，言葉の式でまとめるだけでなく，その式から，どんな角柱や円柱も，底面積と高さの積で体積を表すことができることを捉え直すことが大切である。","Ｃ 変化と関係"]},"quoteEnd":0},"sansu-6-C-1":{"page":300,"name":"比例","expl":{"intro":["第５学年では，簡単な場合についての比例の関係を知るとともに，伴って変わる二つの数量について，それらの関係に着目し，表や式を用いて，変化や対応の特徴を考察することを指導してきた。","第６学年では，比例の関係の意味や性質，比例の関係を用いた問題解決の方法，反比例について知るとともに，日常生活において，伴って変わる二つの数量を見いだし，それらの関係に着目し，目的に応じて表や式，グラフを用いて変化や対応の特徴を考察し，問題を解決する力を伸ばしていくことをねらいとしている。また，考察の方法や結果を振り返って，解決の質的な改善をめざして多面的に考察しようとしたり，処理のよさを見いだし，方法や結果を今後の生活に生かそうとしたりする態度を養うことも大切である。","ここで育成される資質・能力は，中学校第１学年の比例，反比例をはじめとする中学校の「関数」領域の考察や，中学校の理科での考察に生かされるものである。"],"k":["ア 比例の関係の意味や性質","比例の意味として，次のようなことを挙げることができる。","①  二つの数量Ａ，Ｂがあり，一方の数量が２倍，３倍，４倍，…と変化する１ １のに伴って，他方の数量も２倍，３倍，４倍，…と変化し，一方が ， ，２ ３１ １ １ １","，…と変化するのに伴って，他方も， ， ， ，…と変化するという４ ２ ３ ４","こと。","②  ①の見方を一般的にして，二つの数量の一方がｍ倍になれば，それと対応する他方の数量もｍ倍になるということ。","③  二つの数量の対応している値の商に着目すると，それがどこも一定になっているということ。","第５学年では，簡単な場合について比例の関係を指導している。第６学年では，これまでに指導してきた伴って変わる二つの数量の関係について整理する立場から，①のような特徴をもった数量の関係として比例を捉えられるようにする。","また，児童にとって，①の見方から②の見方ができるようになることは必ずしも容易ではない。そこで，表にいろいろな数値を入れて調べてみるなどの活動を通して，②の見方に気付いていけるような指導を工夫することが大切である。","さらに，対応している値の商に着目する③の見方は，関数の考えからみて，二つの数量が比例の関係にあるかどうかを調べる上でも有効である。こうした対応の見方がよく理解できるよう指導しておくことが大切である。","比例の関係を表す式は，③の商をaとすると，y＝a×xという形，又は，y＝（決まった数）×xという形で表される。このとき，x，yは具体的な数量を表していることに配慮する。なお，定数としての文字aは中学校で学習する。","一般に，比例の関係を表すグラフは，原点を通る直線として表される。これは，比例の関係を見分けるときなどに用いられる重要な性質である。また，比例する二つの数量についてのグラフが直線になることを，具体的な数量に即して理解できるようにする。","イ 比例の関係を用いた問題解決の方法","日常生活における問題を解決する際に，比例の関係を利用することで，手際よく問題が解決できる場合がある。そのような，比例の関係を用いた問題解決の方法は，以下のような過程を含んでいる。","①  一つの数量を調べようとするとき，その数量を直接調べることが難しい場面において，調べやすく，かつ，その数量と比例の関係にあるとみることのできる別の数量を見いだす。厳密には比例の関係かどうかは分からないが，おおむね比例の関係にあるとみてよさそうな数量を，幾つかの数値について調べることで見いだすことになる。","②  二つの数量の比例関係に着目することで，目的に応じて表や式，グラフを用いて関係を表現し，変化や対応の特徴を見いだす。","③  一方の数量がｍ倍ならば，他方の数量もｍ倍になるなど，比例の変化や対応の特徴を確認した後，それらの考えを用いて，問題の解決を行う。","このような問題解決の方法を身に付けるためには，比例の関係が有効に用いられる場面を用意し，児童が比例の関係を用いると手際よく問題を解決することができるなどのよさを味わうように配慮する必要がある。また，これまでに指導してきた，関数の考えによる問題解決の過程を振り返り，まとめることも大切である。","ウ 反比例の関係","反比例の意味として，比例の場合に対応して，次のようなことを挙げることができる。","①  二つの数量Ａ，Ｂがあり，一方の数量が２倍，３倍，４倍，…と変化するの１ １ １ １ １ １に伴って，他方の数量は ， ， ，…と変化し，一方が ， ， ，２ ３ ４ ２ ３ ４…と変化するのに伴って，他方は２倍，３倍，４倍，…と変化するということ。②  ①の見方を一般的にして，二つの数量の一方がｍ倍になれば，それと対応す１","る他方の数量は 倍になるということ。","m","③  二つの数量の対応している値の積に着目すると，それがどこも一定になっているということ。","反比例の関係を表す式は，対応する値の積をaとすると，x×y＝aという形又は，x×y＝（決まった数）という形の式で表すことができる。","反比例のグラフについては，児童が反比例の関係を満足する幾つかの点をとったり，教師がグラフを示したりすることで，変化の様子を調べられるようにして，比例と反比例の違いに気付けるようにする。"],"s":["ア  伴って変わる二つの数量を見いだして，それらの関係に着目し，目的に応じて表や式，グラフを用いてそれらの関係を表現して，変化や対応の特徴を見いだすとともに，それらを日常生活に生かすこと","伴って変わる二つの数量を見いだし，それらの関係に着目すること","第５学年までに，ものとものとを対応付けたり，一つの数を他の数の和や差としてみるなど，加法，減法，乗法，除法の用いられる場合や，簡単な場合についての比例の関係に関わって，関数の考えについての経験をしてきている。第６学年では，日常の事象における伴って変わる二つの数量の関係に考察の対象を広げ，比例の関係にあるものを中心に，日常生活における問題の解決を通して，関数の考えを伸ばすことをねらいとしている。","日常生活において一つの数量を調べようとするとき，それを直接調べることが難しかったり，非効率的であったりする場面において，調べたい数量に関係する他の数量を見いだす必要性が生まれる。調べたい数量と依存関係にある数量は一つではないかもしれない。その際も，比例の関係にある数量を見いだすことで，問題を解決するための見通しをもつことができる。厳密に考えれば誤差があり，比例の関係ではないことも考えられるが，比例の関係にあるとみることで，問題を解決する見通しがもてるようにする。","指導に当たっては，調べたい数量に関係する他の数量が，比例の関係にあるとみてよいかどうかを確認することが大切である。また，比例の関係にあるとみることのできる数量として，幾つかの候補がある場合，どの数量に着目するかを，目的や状況を考えながら判断し，選択することも大切である。","比例の関係について変化や対応の特徴を見いだすこと","見いだした数量との比例の関係を用いて問題を解決する上で，表，式，グラフを用いてその関係を表現し，変化や対応の特徴を捉えていくことが必要である。それぞれの表現において，変化や対応の特徴を読み取り，考察することは，これまでの学年でも指導をしてきている。ここでは，目的に応じて，適切な表現を選択して，変化や対応の特徴を考察していくようにする。","表を用いて表すことで，比例の関係についての変化と対応の規則性が捉えやすくなるため，表は基本的な表現や考察の手段である。グラフを用いて表すことで，おおよその数量の関係を把握しやすくなったり，見通しをもちやすくなったりする。また，式を用いて表すことで，対応における規則性が簡潔かつ明瞭に示され，計算によって知りたい数量を求めやすくなる。表や式，グラフを用いて考察し，そこから見いだした特徴を用いて，知りたい数量についての結果を導き，その結果を活用して，問題を解決するようにする。目的に応じて適切な表現を判断することは，それぞれの数学的表現の特徴やよさに気付くことにもつながる。","比例の関係を用いた問題解決の方法を日常生活に生かすこと","比例の関係を用いると能率よく問題を解決できる場面は日常生活に様々ある。その際，得られた結果については，現実場面でどういう意味をもつかを考え，目的に照らしてみたときに，問題を解決することにつながるかどうかを評価する必要がある。正確さが問題となる場合には，厳密に考えれば比例の関係ではないが，比例の関係にあるとみることで結果が導かれたという点を振り返ることも大切である。そして，問題解決の方法や結果を評価し，必要に応じて，目的により適したものに改善していくことも大切である。","こうした問題解決の活動を通して，日常生活や算数の学習などの場面で，能率のよい処理の仕方を求めて，積極的に比例の関係を生かしていこうとする態度を養う。"]},"quoteEnd":0},"sansu-6-C-2":{"page":304,"name":"比","expl":{"intro":["第５学年では，ある二つの数量の関係と別の二つの数量の関係とを比べる場合に割合を用いる場合があることや百分率について理解し，日常の事象を割合で捉え，図や式などを用いて，二つの数量の関係どうしの比べ方を考察し，日常生活に生かすことを指導してきた。","第６学年では，比の意味や表し方を理解するとともに，図や式などを用いて数量の関係の比べ方を考え，それを日常生活に生かす力を更に伸ばしていくことをねらいとしている。また，日常の事象を，目的に応じて比で捉えることやその処理のよさを感じて，それらを学習や生活に生かそうとする態度を養うことも大切である。ここで育成される資質・能力は，中学校における「数と式」領域，「関数」領域などでの考察に生かされるものである。"],"k":["ア 比","二つの数量の大きさを比較しその割合を表す場合に，どちらか一方を基準量とすることなく，簡単な整数などの組を用いて表す方法が比である。第５学年までに，倍や割合に関する指導，分数の指導，比例関係に関する指導などの中で，比の素地を指導してきている。第６学年では，これらの上に，a：bという比の表し方を指導する。比の相等（等しい比）及びそれらの意味を明らかにし，比について理解でa","きるようにする。これに関連し， をa：bの比の値ということや，比の値を用いb","ると比の相等（等しい比）を確かめることができることを理解できるようにする。このようなことから，数量の関係を比で表したり，等しい比をつくったりすることができるようにする。","指導に当たっては，具体的な場面によって，比の相等とそれらの意味について理解させる。例えば，同じ大きさのコップで３杯と５杯の２種類の液体を混ぜ合わせた液体を作ったとき，これと同じ濃さの液体を別に作ることを考える。そこでもう一回同じ大きさのコップで３杯と５杯の２種類の液体を混ぜ合わせた液体を作り，もとの液体と合わせると，同じ濃さの液体を合わせたから同じ濃さになる。このとき６杯と10杯の液体を混ぜ合わせたことになることから，３杯と５杯の割合で混ぜても，６杯と10杯の割合で混ぜても濃さは等しくなる。このようなことから，二つの数量の間には比例関係があることや，３：５は，６：10，９：15などや1.5：2.5などと等しいことを理解させる。","また，比は，比例，反比例や縮図・拡大図などと深く関連するものであるので，その指導の順序や取扱いについては，相互に理解を深めることができるよう配慮する必要がある。"],"s":["ア  日常の事象における数量の関係に着目し，図や式などを用いて数量の関係の比べ方を考察し，それを日常生活に生かすこと","日常の事象における二つの数量の関係に着目すること","第５学年までに，日常の事象について，二つの数量の関係どうしを比べる際に，どちらか一方を基準としたときに，基準量，比較量，割合という数量の関係に着目することを指導してきた。第６学年においては，比べるために必要となる二つの数量の関係を，比例の関係を前提に，割合でみてよいかを判断する。そして，どちらか一方を基準にすることなく，簡単な整数の組としての二つの数量の関係に着目する。これは，例えば，「水３の，凝縮液２に対する割合」で作ったジュースの濃さは，凝縮液の量を２倍，３倍，…としたときに，水の量も２倍，３倍，…にすれば濃さは変わらないと考え，それらを同じ関係とみて，３：２のように表すことである。「水は凝縮液の1.5倍の量」のように，一方を基準として二つの数量の関係を捉えることもできるが，整数の組で捉えた方が，数量の関係が見やすかったり，処理がしやすかったりすることも多い。","図や式などを用いて数量の関係どうしを比で比べること","比では，上述したように，二つの数量の割合を一つの数で表すのではなく，簡単な二つの整数の組を用いて表す。そして，表したその二つの数量についての比例関係がその背後にあることを使って，数量の関係を考察していくことになる。すなわち，２：３というのは，４：６，６：９，…などを同じ関係としてみていることを表しているという考えによって，数量の関係を比べたり，知りたい数量の大きさを求めたりしていく。","数量の関係を考察する上では，関係を図や式などを用いて表したり，それらを読み取ったりすることが有効である。これまでの学年と同様に，目的に応じて，図や式を関連付けたり用いたりしながら，数量の関係を考察し，結論を導いていく。また，考察によって得られた結果を，日常の事象に戻して，その意味を考え，必要に応じて，考察の方法や表現方法を見直すことが大切である。さらに，これまで学習してきた割合による比べ方の考察と比較することで，比を用いて物事を処理することの特徴やよさを振り返ることも大切である。","指導に当たっては，児童が考察において書き表す様々な図や式を取り上げ，それらを相互に読み取ったり，より適切なものへと改善していったりすることも大切である。","比を用いた比べ方を日常生活に生かすこと","比は，日常生活のいろいろな場面で用いられる。例えば，二つの液量を混合したり，二つの長さを組み合わせたりするなど，部分と部分の関係どうしを考察する場面，二つの数量を配分する場面で，数量の関係を比で表現し，等しい比をつくるなどして考察した結果を活用して，課題を解決する。","日常生活において，比によって数量の関係を表現している事象を探す活動を通して，比による数量の関係への着目の仕方に親しむことも大切である。","Ｄ データの活用"]},"quoteEnd":0},"sansu-6-D-1":{"page":306,"name":"データの考察","expl":{"intro":["第５学年までに文字情報として得られる「質的データ」や数値情報として得られる「量的データ」，時間変化に沿って得られた「時系列データ」について表にまとめたり，グラフに表したりすることでデータの特徴や傾向を捉えることを学習してきている。","第６学年では，目的に応じたデータの収集や分類整理，表やグラフ，代表値の適切な選択など，一連の統計的な問題解決をできるようになることや，結論について批判的に捉え妥当性について考察することができるようになることがねらいである。その過程を通じて，量的データについて分布の中心や散らばりの様子を考察することができるようにすることをねらいとしている。","ここで育成される資質・能力は中学校第１学年での度数分布を表す表やヒストグラムなどを用いて問題解決する学習の素地となるものである。"],"k":["ア 代表値の意味や求め方","量的データの特徴を読み取る場合，データ全体を表す指標として平均値，中央値，最頻値などの代表値を用いる場合があり，第６学年では，これらの意味について理解し，これらを用いることができるようにする。","平均値は，データの個々の値を合計し，データの個数で割った値，中央値はデータを大きさの順に並べたときの中央の値，最頻値はデータの中で最も多く現れている値のことである。なお，日常的には平均値は平均ということもある。","一つの数値で表すことで，データの特徴を簡潔に表すことができ，複数のデータを比較することも容易になる。しかしその反面，分布の形などの情報は失われているので代表値の用い方には留意する必要がある。","また，平均値は一般にもよく用いられる指標であるが，代表値として適切であるとはいえない場合があるため，このような場合について指導する。例えば，分布が非対称であったり多峰性であったりする場合や，極端にかけ離れた値があったりすると，平均値はデータが集中している付近からずれてしまうことがあり，そのような場合には代表値としてふさわしくない。このようなとき，中央値や最頻値を代表値として用いる。また，代表値として用いる目的から，平均値がふさわしくない場合もある。例えば，ある靴メーカーが，来年，どのようなサイズの靴を多く製造するかを決める場合，今年１年間に売れた靴のサイズの平均値を求め，その平均値のサイズの靴を来年，最も多く製造するようなことはしない。この場合は，最も多く売り上げがあった靴のサイズ，つまり最頻値を用いる方が望ましい。","このように，代表値を用いる場合は，資料の特徴や代表値を用いる目的を明らかにし，どのような代表値を用いるべきか判断する必要がある。","量的データの散らばりの様子や代表値の意味を捉えやすくするための方法としてドットプロットがある。第６学年では，データをドットプロットに表したり，ドットプロットからデータの特徴や傾向を読み取ったり，最頻値や中央値を見付けたりできるようにする。","ドットプロットとは数直線上の該当する箇所にデータを配置し，同じ値のデータがある際には積み上げて表したものである。ドットプロットを用いることでデータの散らばりの様子が捉えやすくなる。次の図は，学級内で地域の空き缶拾いの缶の数を調べてまとめたドットプロットであるが，最も高く積み上がった２本が最頻値ということになる。","イ 度数分布を表す表やグラフの特徴と用い方","量的データの分布の様子や特徴を捉えるための統計的な処理の方法として，度数分布を表す表や柱状グラフがある。第６学年では，度数分布を表す表と柱状グラフについて指導する。度数分布を表す表は，分布の様子を数量的に捉えやすくするために，数量を幾つかの区間（階級という）に分けて，各区間に，それに入る度数を対応させた表である。柱状グラフについては，各階級の幅を横とし，度数を縦とする長方形をかいたものという程度の理解でよい。また，階級の幅を変えて柱状グラフを作り直すなどして，分布の様子を的確に捉えることは，中学校第１学年で扱うものとする。","柱状グラフを用いることで，資料の分布の様子を捉えることができる。変量を幾つかの階級に分け，ある階級に属する度数を明らかにすることで，全体の形，左右の広がりの範囲，山の頂上の位置，対称性など，直観的に捉えやすくなる。ドットプロットでも分布の様子を捉えることができるが，扱うデータが小数点など刻みが細かくなっていたり，最小値と最大値の差が著しく開いている場合などには各点がほとんど積み上がることなく，まばらに広がってしまうことがある。そのような場合には柱状グラフを用いると考察しやすくなる。","また，児童によっては第３学年で学習する棒グラフと柱状グラフを混同して捉えてしまうことがある。棒グラフは質的データを集計した個数を高さで表していて，量的データの値をそのまま高さに対応させて表したものであり，横軸のラベルには質的な文字情報が表示される。一方，柱状グラフは，量的データの分布の様子を分析する目的から，階級に分けて集計し，度数の多さを高さに対応させて表しているため，横軸は数値軸となっている。柱状グラフの長方形（柱）を隙間なくつけているのは，隙間が空いているとその部分に該当する値のデータが存在しないかのような誤認を与えてしまうからである。","ウ 目的に応じた統計的な問題解決の方法","第５学年では，統計的な問題解決の方法を知り，考察することを学習してきている。統計的な問題解決とは，以下に述べる「問題—計画—データ—分析—結論」という五つの段階を経て問題解決することである。","①  身の回りの事象について，興味・関心や問題意識に基づき統計的に解決可能な問題を設定すること","②  見通しを立て，どのようなデータを，どのように集めるかについて計画を立てること","③ データを集めて分類整理すること","④  目的に応じて，観点を決めてグラフや表に表し，データの特徴や傾向をつかむこと","⑤ 問題に対する結論をまとめるとともに，さらなる問題を見いだすこと","第６学年では，身の回りの事象について，統計的な問題解決の方法で考察していくことでその方法への理解を深めるとともに，目的に応じてデータを収集したり適切な手法を選択したりするなどについて理解し，このことができるようにしていく。例えば，図書の貸し出し状況について調べたい場面があるとする。「貸し出し状況について」といった漠然とした目的では統計的に解決していくことが難しい。そこで，具体的な問題として目的を明確にする。貸し出し状況の何を調べ，その結果どうしたいのかということである。それにより，データの収集や手法の選択が異なってくるからである。","先の例では，「物語や科学，図鑑といった分類別のどの本を充実させたらよいのか。」というような問題を設定した場合には，それぞれの項目の本が何冊借りられたのかというデータを収集することになる。そのような質的データに対しては，表や棒グラフをかいたりして分類整理や視覚化し，分析していく。","また，そのようなデータを量の大小で分析するのでなく，割合の見方で分析したい場合には，それを帯グラフや円グラフに表すことも考えられるし，異なる項目間での関係について考察したい場合は，二次元の表にまとめることになる。","「毎月何冊借りられているのか。」「去年から貸し出し冊数はどのように変化しているのか。」というような問題を解決したい場合には，時系列順のデータを収集することになる。そのようなデータに対しては，表を作ったり折れ線グラフをかいたりして分類整理や視覚化し，分析していく。","「借りる数が多い児童と少ない児童がいるので，その傾向を調べたい。」というような分布を調べたい場合はその観点でデータを収集し，度数分布表や柱状グラフをつくって分析していくことになる。","このように，目的に応じて収集するデータが異なることや，それに応じて分析する手法も異なることを知ることが大切である。","また，統計的な問題解決の対象は不確実な事象であることから，確定的な結論は得られないため，問題解決の過程や結論についても振り返り，妥当性を考察したり，改善する余地がないかを検討したりすることの大切さについても指導する。"],"s":["ア  目的に応じてデータを集めて分類整理し，データの特徴や傾向に着目し，代表値などを用いて問題の結論について判断するとともに，その妥当性について批判的に考察すること","目的に応じてデータを集めて分類整理すること","目的に応じてデータを集めて分類整理するとは，統計的に解決する問題を設定し，その解決のために適したデータを収集し分類整理することである。","まず，目的を明確にするために，身の回りにある不確定な事象で確かめてみたいことについて，そのことを統計的に解決していく問題として設定できるようにする。例えば，「10年前，20年前と比べて自分たちの体力は落ちているという話を聞いた。それは本当だろうか。」という疑問があるとする。そこから，「20年前のこの学校の児童の50ｍ走の記録と今の自分たちの50ｍ走の記録を比べてどちらがよいのか。」というような比較する対象を明確にした問題として設定するようなことである。","次に，それを解決する目的で，必要なデータを集める計画を立てる。データの集め方に関して「学年や性別を揃えないと正しく比較できない。」ことや，「なるべく多くの人数のデータを集める。」ことを考えて，より適切に比べることができるようにするとともに，そのような集団のデータはどのように分析すればよいかを見通すことも求められる。そして，データを集めて必要なデータを分類整理する。","データの特徴や傾向に着目し，代表値などを用いて問題の結論について判断すること","データの特徴や傾向に着目し，代表値などを用いて問題の結論について判断するとは，代表値を求めたり，度数分布を表す表や柱状グラフからデータ全体の分布の様子を捉えたり，それらの特徴が表す意味を考察することである。","集めたデータを分析するに当たり，データの種類や項目の数を考え，目的に応じて，表やグラフに表してみる。その際，数値データが集団の特徴や傾向をみる場合には，代表値を求めたり，度数分布を表す表や柱状グラフからデータ全体の分布の様子を捉えたりすることができるようにする。そして分析した結果から問題の結論を見いだし，判断する。","第６学年の男子児童の50m走の記録","20年前 今","平均値 8.0秒 8.2秒","中央値 7.9秒 8.2秒","最頻値 8.0秒 8.2秒","先ほどの例でいえば，20年前と今の第６学年男子の50ｍ走の記録について，代表値で比較すると20年前の方が記録がよく，また柱状グラフでデータの分布を見ると，どちらも左右対称な山型をしていることから，二つのデータの分布はほぼ同じと考えられる。よって代表値の数値から20年前の方がよかったようだという結論が得られるというようなことである。","妥当性について批判的に考察すること","妥当性について批判的に考察するとは，自分たちが出した結論や問題解決の過程が妥当なものであるかどうかを別の観点や立場から検討してみることや，第三者によって提示された統計的な結論が信頼できるだけの根拠を伴ったものであるかどうかを検討することである。","統計的な問題解決では，解決すべき問題に対して，どのデータを用いるのかによって結論が異なることがある。また，用いるデータが同じでも，その分析の仕方や着目する点により結論が異なることがある。一方，データが少なすぎたり，公平でない比較をしている場合であれば，その結論は信頼しにくいものであると言える。それらのことから，自分たちが出した結論について，また第三者によって提示された統計的な結論について，信頼できるのかどうかを検討していくことが，批判的に考察するということである。","上の例では，代表値による比較や柱状グラフの分析に誤りはなかったかを振り返ることが当てはまる。また，20年前と今の児童の体力を比較するのに，50ｍ走の記録だけに注目したり，６年生の男子児童だけを比較したりしたことは妥当かどうかを考えることが当てはまる。他の種目や学年，性別なども合わせて多面的に分析する必要があると判断した際には，再度問題解決の過程を行うことになる。","統計的な問題解決の対象は不確定な事象であることから，確定的な結論は得られないため，得られた結論についてや，問題解決の方法の各段階が適切な選択に基づいたものであったかについて，振り返って考え直す態度を養うことにも留意する。また，妥当性について批判的に考察することについては，自分たちが出した結論や問題解決の過程だけでなく，新聞やニュース，雑誌など第三者による統計を用いた主張にも当てはまる。現在の社会におい","ては，様々な分野で統計が用いられ，デー","タに基づいて現状の把握や政策などが決定","されていく。日々の生活においても，様々","なデータとその分析に基づく主張を見聞き","することになる。","例えば，右の図はOECDによる生徒の","学習到達度調査（PISA）で用いられた問","題例であるが，「あるテレビレポーターがこのグラフを示して，「1999年は1998年に比べて，盗難事件が激増しています」と言いました。このレポーターの発言は，このグラフの説明として適切ですか。」と出題されたものである（国立教育政策研究所編『生きるための知識と技能２』，ぎょうせい，2004年 p.119）。このようなデータに基づく主張を提示された際に，それを鵜呑みにすることなく，信頼できるデータに基づく妥当な判断に基づくものであるかどうかを批判的に考察することが重要である。"]},"quoteEnd":0},"sansu-6-D-2":{"page":312,"name":"起こり得る場合","expl":{"intro":["第５学年までに，表などを用いて分類整理して表したり読み取ったりすることを学習してきている。","第６学年では，起こり得る全ての場合を適切な観点から分類整理して，順序よく列挙できるようにすることをねらいとしている。","ここで育成される資質・能力は，中学校第２学年で学習する確率などの考察につながっていくものである。"],"k":["ア 起こり得る場合","第６学年では，起こり得る場合を順序よく整理して調べることができるようにする。起こり得る場合を順序よく整理して調べるとは，思いつくままに列挙していたのでは落ちや重なりが生じるような順序や組み合わせなどの事象について，規則に従って正しく並べたり，整理して見やすくしたりして，誤りなく全ての場合を明らかにすることを指している。","例えば，４人が一列に並ぶ場合を考えるときには，特定のＡに着目して，まずＡが先頭に立つ場合を考える。２番目の位置にＢが並ぶとすれば，３番目はＣかＤになる。次に，２番目の位置にＣが並ぶ場合，Ｄが並ぶ場合と考えを進めていく。そうすると，Ａが先頭に立つ場合は，次の図のように６通りであることを明らかにすることができる。Ａのほかにも，Ｂ，Ｃ，Ｄが先頭に立つことができることから，起こり得る場合を図にかいて調べると24通りであることが分かる。","Ａ—Ｂ—Ｃ—Ｄ","Ａ—Ｂ—Ｄ—Ｃ","Ａ—Ｃ—Ｂ—Ｄ","Ａ—Ｃ—Ｄ—Ｂ","Ａ—Ｄ—Ｂ—Ｃ","Ａ—Ｄ—Ｃ—Ｂ","また，四つのチームの対戦の組み合わせを考えるときには，次の図や表に示すような方法で，全ての場合を落ちや重なりがないように調べていくことができる。Ａ—Ｂ","Ａ—Ｃ","Ａ—Ｄ","Ｂ—Ｃ","Ｂ—Ｄ","Ｃ—Ｄ","このように，図や表を適切に用いることができるようにする。"],"s":["ア  事象の特徴に着目し，順序よく整理する観点を決めて，落ちや重なりなく調べる方法を考察すること","順序よく整理する観点を決めること","起こり得る場合を考える際に，落ちや重なりなく調べるには，観点を決めて考えていく。観点を決めるとは，あるものを固定して考えるなどのことである。","例えば，大中小３種類のコインの裏表の出方の場合を調べる場面があるとする。（大コインが表，中コインが表，小コインが表）の場合を考えたのち，大コインは表のまま変えずに，中コインと小コインの場合のみ考えていくようなことである。すると（中コイン表，小コイン裏）（中コイン裏，小コイン表）（中コイン裏，小コイン裏）の四つの場合を見いだすことができ，これ以外の場合はないことが分かる。","落ちや重なりなく調べる方法を考察すること","落ちや重なりなく調べるためには，図や表などに整理して表すことが有効に働く。順序よく調べていこうとしても，場合が多かったり複雑だったりすると，落ちや重なりが発生する可能性が増すことになる。","先のコインの例で考えてみる。（大コイン表，…）などと書いて挙げていくより，記号などを使って表を〇，裏を×で表すことを考えたり，大コイン，中コイン，小コインをそれぞれ位置で（左中右）で表すなどして簡潔に示すことができる。（大コイン表，中コイン表，小コイン裏）を（〇〇×）と表すようなことである。","落ちや重なりがないように考えていくことは，思考や表現の方法を工夫することや，筋道を立てて考えていくことにつながるものである。多様な考えに触れ，それぞれのよさに気付くようにしていく。"]},"quoteEnd":0}}}},{"id":"taiiku","name":"体育","section":"第２章 第９節 体育","textbook":"東京書籍（保健）","grades":[1,2,3,4,5,6],"areas":[{"key":"A","name":"Ａ 体つくり","grades":[1,2,3,4,5,6]},{"key":"B","name":"Ｂ 器械運動系","grades":[1,2,3,4,5,6]},{"key":"C","name":"Ｃ 陸上運動系","grades":[1,2,3,4,5,6]},{"key":"D","name":"Ｄ 水泳運動系","grades":[1,2,3,4,5,6]},{"key":"E","name":"Ｅ ボール運動系","grades":[1,2,3,4,5,6]},{"key":"F","name":"Ｆ 表現運動系","grades":[1,2,3,4,5,6]},{"key":"G","name":"Ｇ 保健","grades":[3,4,5,6]}],"goals":{"1":{"lines":["⑴　各種の運動遊びの楽しさに触れ，その行い方を知るとともに，基本的な動きを身に付けるようにする。","⑵　各種の運動遊びの行い方を工夫するとともに，考えたことを他者に伝える力を養う。","⑶　各種の運動遊びに進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，健康・安全に留意したりし，意欲的に運動をする態度を養う。"],"page":36,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動遊びの楽しさに触れることを通して，その行い方を知るとともに，それらの基本的な動きを身に付けること及び体力を養うことを意図している。","各種の運動遊びとは，児童の発達の段階を踏まえ，ねらいとする動きを遊びの要素を取り入れて行うものであり，児童が成功体験を得やすいように課題やルール，場や用具等が緩和された体つくりの運動遊び，器械・器具を使っての運動遊び，走・跳の運動遊び，水遊び，ゲーム及び表現リズム遊びを指す。","楽しさに触れとは，教科の目標に示している体育や保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動遊びを通して運動の楽しさに触れることができるようにすることを目指し，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。","低学年では，全ての児童が，運動遊びを楽しく行うことができるようにすることにより，運動遊びに意欲的に取り組み，知識及び技能を身に付け，その結果として体力の向上につながることを意図している。そのためには，課題や活動の場などを工夫した易しい運動遊びを行ったり，運動遊びの取り上げ方の弾力化を図ったりすることが重要である。","その行い方を知るとは，低学年においても運動遊びの課題，行い方のきまり，用具の使い方，場の安全確保等，各種の運動遊びの行い方を知ることが，各種の基本的な動きの習得や課題の解決，友達との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","基本的な動きを身に付けるようにするとは，各種の運動遊びにおいて習得が期待される，運動種目として成立する以前の基本的な動きを身に付けることを示している。また，このねらいは，それぞれの運動遊びの楽しさに触れるようにすることを大切にしながら，基本的な動きを身に付けることを重視したものである。なお，低学年の児童は体力についての認識が低いことから，各種の運動遊びの楽しさに触れ，活発に運動遊びを行っていく中で，基本的な動きを幅広く身に付け，結果として体力の向上を図ろうとするものである。したがって，低学年の各種の運動遊びを取り上げるに当たっては，低学年児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，各種の運動遊びを安全に楽しむための活動の仕方やルールなどを児童の力に応じて工夫するとともに，考えたことを他者に伝える力を養うことを意図している。","各種の運動遊びの行い方を工夫するとは，低学年の各種の運動遊びの楽しさに触れることができるようにするために，運動遊びをする場や練習の仕方などを自らの力に応じて工夫したり，選択したりすることを示したものである。教師から提案された楽しみ方や，自己や友達が考えた楽しみ方から，自己に合った楽しみ方を選択することもその一つである。","考えたことを他者に伝えるとは，自己の工夫したことを他者に伝えることができるようにすることを示している。他者とは，共に学ぶ友達だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値のうち，公正，協力，責任，参画，健康・安全等に関する態度及び意欲的に運動遊びをする態度を養うことを意図している。特に，運動遊びをする際の良好な人間関係が運動遊びの楽しさに大きな影響を与えることや，友達と共に進んで意思決定に関わることが，運動やスポーツの意義や価値等を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることで，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。","各種の運動遊びに進んで取り組みとは，各種の運動遊びの楽しさに触れ，自ら進んで運動遊びに取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","きまりを守り誰とでも仲よく運動をしたりとは，低学年の各種の運動遊びにおいて，順番やきまりを守り，誰とでも仲よく運動遊びをしたり，友達と協力したり，公正な態度で勝敗を競ったりするなどのスポーツの価値の実現に関する態度の育成を示している。","健康・安全に留意したりとは，運動遊びをする場所や器械・器具の安全に気を付けたりする等，健康・安全に留意する態度を育てることを目指している。","意欲的に運動をする態度とは，運動をする子供とそうでない子供の二極化傾向が見られることを受け，運動遊びをする環境条件の整備も含め，低学年から誰もが意欲的に運動に取り組む態度を培う指導が大切であることを示している。運動遊びに意欲的に取り組むことにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動遊びの実践だけでなく，日常の生活において必要な態度にもつながるものである。"]},"grades":[1,2],"band":"1・2年"},"2":{"lines":["⑴　各種の運動遊びの楽しさに触れ，その行い方を知るとともに，基本的な動きを身に付けるようにする。","⑵　各種の運動遊びの行い方を工夫するとともに，考えたことを他者に伝える力を養う。","⑶　各種の運動遊びに進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，健康・安全に留意したりし，意欲的に運動をする態度を養う。"],"page":36,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動遊びの楽しさに触れることを通して，その行い方を知るとともに，それらの基本的な動きを身に付けること及び体力を養うことを意図している。","各種の運動遊びとは，児童の発達の段階を踏まえ，ねらいとする動きを遊びの要素を取り入れて行うものであり，児童が成功体験を得やすいように課題やルール，場や用具等が緩和された体つくりの運動遊び，器械・器具を使っての運動遊び，走・跳の運動遊び，水遊び，ゲーム及び表現リズム遊びを指す。","楽しさに触れとは，教科の目標に示している体育や保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動遊びを通して運動の楽しさに触れることができるようにすることを目指し，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。","低学年では，全ての児童が，運動遊びを楽しく行うことができるようにすることにより，運動遊びに意欲的に取り組み，知識及び技能を身に付け，その結果として体力の向上につながることを意図している。そのためには，課題や活動の場などを工夫した易しい運動遊びを行ったり，運動遊びの取り上げ方の弾力化を図ったりすることが重要である。","その行い方を知るとは，低学年においても運動遊びの課題，行い方のきまり，用具の使い方，場の安全確保等，各種の運動遊びの行い方を知ることが，各種の基本的な動きの習得や課題の解決，友達との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","基本的な動きを身に付けるようにするとは，各種の運動遊びにおいて習得が期待される，運動種目として成立する以前の基本的な動きを身に付けることを示している。また，このねらいは，それぞれの運動遊びの楽しさに触れるようにすることを大切にしながら，基本的な動きを身に付けることを重視したものである。なお，低学年の児童は体力についての認識が低いことから，各種の運動遊びの楽しさに触れ，活発に運動遊びを行っていく中で，基本的な動きを幅広く身に付け，結果として体力の向上を図ろうとするものである。したがって，低学年の各種の運動遊びを取り上げるに当たっては，低学年児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，各種の運動遊びを安全に楽しむための活動の仕方やルールなどを児童の力に応じて工夫するとともに，考えたことを他者に伝える力を養うことを意図している。","各種の運動遊びの行い方を工夫するとは，低学年の各種の運動遊びの楽しさに触れることができるようにするために，運動遊びをする場や練習の仕方などを自らの力に応じて工夫したり，選択したりすることを示したものである。教師から提案された楽しみ方や，自己や友達が考えた楽しみ方から，自己に合った楽しみ方を選択することもその一つである。","考えたことを他者に伝えるとは，自己の工夫したことを他者に伝えることができるようにすることを示している。他者とは，共に学ぶ友達だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値のうち，公正，協力，責任，参画，健康・安全等に関する態度及び意欲的に運動遊びをする態度を養うことを意図している。特に，運動遊びをする際の良好な人間関係が運動遊びの楽しさに大きな影響を与えることや，友達と共に進んで意思決定に関わることが，運動やスポーツの意義や価値等を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることで，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。","各種の運動遊びに進んで取り組みとは，各種の運動遊びの楽しさに触れ，自ら進んで運動遊びに取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","きまりを守り誰とでも仲よく運動をしたりとは，低学年の各種の運動遊びにおいて，順番やきまりを守り，誰とでも仲よく運動遊びをしたり，友達と協力したり，公正な態度で勝敗を競ったりするなどのスポーツの価値の実現に関する態度の育成を示している。","健康・安全に留意したりとは，運動遊びをする場所や器械・器具の安全に気を付けたりする等，健康・安全に留意する態度を育てることを目指している。","意欲的に運動をする態度とは，運動をする子供とそうでない子供の二極化傾向が見られることを受け，運動遊びをする環境条件の整備も含め，低学年から誰もが意欲的に運動に取り組む態度を培う指導が大切であることを示している。運動遊びに意欲的に取り組むことにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動遊びの実践だけでなく，日常の生活において必要な態度にもつながるものである。"]},"grades":[1,2],"band":"1・2年"},"3":{"lines":["⑴　各種の運動の楽しさや喜びに触れ，その行い方及び健康で安全な生活や体の発育・発達について理解するとともに，基本的な動きや技能を身に付けるようにする。","⑵　自己の運動や身近な生活における健康の課題を見付け，その解決のための方法や活動を工夫するとともに，考えたことを他者に伝える力を養う。","⑶　各種の運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や用具の安全に留意したりし，最後まで努力して運動をする態度を養う。また，健康の大切さに気付き，自己の健康の保持増進に進んで取り組む態度を養う。"],"page":67,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動の楽しさや喜びに触れることを通して，その行い方や健康な生活及び体の発育・発達について理解するとともに，それらの基本的な動きや技能を身に付けること及び体力を養うことを意図している。","各種の運動とは，児童の発達の段階を踏まえ，設定される運動であり，児童が成功体験を得やすいように，課題やルール，場や用具等が緩和された体つくり運動，器械運動，走・跳の運動，水泳運動，ゲーム及び表現運動を指す。","楽しさや喜びに触れとは，教科の目標に示している体育や保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動を通して運動の楽しさや喜びに触れることができるようにすることを目指し，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。そのためには，課題や活動の場などを工夫した易しい運動を行ったり，運動の取り上げ方の弾力化を図ったりすることが重要である。","中学年では，全ての児童が，運動の特性に応じた楽しさや喜びに触れることができるようにすることにより，運動に意欲的に取り組み，知識及び技能を身に付けることを重視し，その結果として体力の向上につながる指導等の在り方について改善を図ることを意図したものである。また，運動の楽しさだけでなく，友達と協力して得られる達成感や課題を解決した成就感などの喜びに触れることができるようにすることを意図している。そのため，中学年では，低学年の楽しさに","触れるから楽しさや喜びに触れることができるようにすることを求めている。","その行い方を知るとは，中学年においても運動の課題，行い方のきまり，場や用具の使い方，場の安全の確保等，各種の運動の行い方を知ることが，各種の運動の基本的な動きや技能の習得や友達との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","健康で安全な生活や体の発育・発達について理解するとは，保健領域の内容との関連から，健康の保持増進には，健康の大切さを認識できるようにするとともに，毎日の生活の仕方が関わっていること，体を清潔に保つこと，生活環境を健康的に整えることなどがあること，また，体の発育・発達には，年齢に伴う体の変化と身近な事柄としての思春期における体の変化などがあることについて理解できるようにすることを目指したものである。","基本的な動きや技能を身に付けるようにするとは，各種の運動の基本となる動きや技能を身に付けることを示している。また，このねらいは，それぞれの運動の楽しさや喜びに触れるようにすることを大切にしながら，基本的な動きや技能を身に付けることを重視したものである。","なお，中学年の児童は体力についての認識が低いことから，各種の運動の楽しさや喜びに触れ，活発に運動を行っていく中で，各種の運動の基本となる様々な動きや技能を身に付け，結果として体力の向上を図ることを目指すものである。したがって，中学年の各種の運動を取り上げるに当たっては，中学年の児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，自己の運動や健康に関する課題を見付け，その解決方法を工夫するとともに，それについて考えたことを他者に伝える力を養うことを意図している。","自己の運動の課題を見付けとは，自己が取り組む運動に関わり解決すべき課題を見付けることを指す。そのため，教師は，児童が自己の能力に適した運動の課題を見付けることができるように支援することが必要になる。","自己の身近な生活における健康の課題を見付けとは，保健領域の内容である健康な生活及び体の発育・発達に関わる事象や情報から，自己の健康に関する課題を見付けることを意図したものである。その際，教師は，児童がそれぞれの内容に関わる情報を収集したり，自己の経験を振り返ったりすることによって課題を見付けることができるように支援することが重要である。","その解決のための方法や活動を工夫するとは，中学年の各種の運動において見付けた自己の運動や身近な生活における健康の課題の解決に向けた方法や活動を工夫することを示している。自己の運動の課題であれば，各種の運動の楽しさや喜びに触れることができるようにするために，運動をする場や練習の仕方などを発達の段階に即して，自ら適切に工夫したり，選択したりすることを示したものである。そこには，自ら楽しみ方を工夫したり，教師や友達から提案された楽しみ方から，自己に合った楽しみ方を選択したりすることも含まれている。身近な生活における健康の課題であれば，正しい健康情報を集めたり選んだりして，課題のよりよい解決方法を予想したり考えたりすることや，学んだことを自己の生活と関連付けたりすることを示している。","考えたことを他者に伝えるとは，自己の工夫したことを他者に伝えることができるようにすることを示している。自己の考えを他者に伝えることで，自己の考えを深めることができるようにすることを意図している。他者とは，共に学ぶ友達だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者や地域の人に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値である，公正，協力，責任，参画，共生，健康・安全等に関する態度及び意欲的に運動をする態度を養うことを意図している。特に，運動をする際の良好な人間関係が運動の楽しさや喜びに大きな影響を与えることや，友達と共に進んで意思決定に関わることが，運動やスポーツの意義や価値等を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることにより，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。さらに，健康が単に疾病でないことや虚弱でないといったことだけを意味するのではなく，生活の質の向上までを含んだ積極的なものとして捉え，その健康の大切さを認識し，自己の健康の保持増進に主体的に取り組み，よりよい健康づくりを目指すとともに楽しく明るい生活を営む態度の育成を重視するという保健の「学びに向かう力，人間性等」を示している。","各種の運動に進んで取り組みとは，各種の運動の楽しさや喜びに触れ，自ら進んで運動に取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","きまりを守り誰とでも仲よく運動をしとは，中学年の各種の運動において，順番やきまりを守り，誰とでも仲よく運動をしたり，互いの違いを認めたり，友達と協力したり，公正な態度で勝敗を競ったりするなどのスポーツの価値の実現に関する態度の育成を示している。","友達の考えを認めとは，友達の考えを聞くことで，自己の考えを深めたり，友達との良好な関係を築いたりすることを目指したものである。","場や用具の安全に留意しとは，運動をする場所や器械・器具の整備，用具の安全を確かめること，水泳運動の心得を守って安全に気を付けることなど，低学年のねらいを発展させたものである。","最後まで努力して運動をする態度を養うとは，運動領域の学習で児童が学習課題の達成に向けて最後まで成し遂げる態度の育成を示している。課題に最後まで諦めずに取り組む過程で達成感を得たり，課題の解決に取り組む意味や自己の可能性に気付いたりすることにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動の実践だけでなく，日常の生活において必要な態度にもつながるものである。","健康の大切さに気付き，自己の健康の保持増進に進んで取り組む態度を養うとは，保健領域の内容に触れ健康の大切さに気付くことにより，自己の健康に関心をもち，健康の保持増進のために進んで学習活動に取り組む，課題の解決に向けて協力し合う，心身の発育・発達等を肯定的に捉える等の態度を養うことを意図したものである。"]},"grades":[3,4],"band":"3・4年"},"4":{"lines":["⑴　各種の運動の楽しさや喜びに触れ，その行い方及び健康で安全な生活や体の発育・発達について理解するとともに，基本的な動きや技能を身に付けるようにする。","⑵　自己の運動や身近な生活における健康の課題を見付け，その解決のための方法や活動を工夫するとともに，考えたことを他者に伝える力を養う。","⑶　各種の運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や用具の安全に留意したりし，最後まで努力して運動をする態度を養う。また，健康の大切さに気付き，自己の健康の保持増進に進んで取り組む態度を養う。"],"page":67,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動の楽しさや喜びに触れることを通して，その行い方や健康な生活及び体の発育・発達について理解するとともに，それらの基本的な動きや技能を身に付けること及び体力を養うことを意図している。","各種の運動とは，児童の発達の段階を踏まえ，設定される運動であり，児童が成功体験を得やすいように，課題やルール，場や用具等が緩和された体つくり運動，器械運動，走・跳の運動，水泳運動，ゲーム及び表現運動を指す。","楽しさや喜びに触れとは，教科の目標に示している体育や保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動を通して運動の楽しさや喜びに触れることができるようにすることを目指し，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。そのためには，課題や活動の場などを工夫した易しい運動を行ったり，運動の取り上げ方の弾力化を図ったりすることが重要である。","中学年では，全ての児童が，運動の特性に応じた楽しさや喜びに触れることができるようにすることにより，運動に意欲的に取り組み，知識及び技能を身に付けることを重視し，その結果として体力の向上につながる指導等の在り方について改善を図ることを意図したものである。また，運動の楽しさだけでなく，友達と協力して得られる達成感や課題を解決した成就感などの喜びに触れることができるようにすることを意図している。そのため，中学年では，低学年の楽しさに","触れるから楽しさや喜びに触れることができるようにすることを求めている。","その行い方を知るとは，中学年においても運動の課題，行い方のきまり，場や用具の使い方，場の安全の確保等，各種の運動の行い方を知ることが，各種の運動の基本的な動きや技能の習得や友達との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","健康で安全な生活や体の発育・発達について理解するとは，保健領域の内容との関連から，健康の保持増進には，健康の大切さを認識できるようにするとともに，毎日の生活の仕方が関わっていること，体を清潔に保つこと，生活環境を健康的に整えることなどがあること，また，体の発育・発達には，年齢に伴う体の変化と身近な事柄としての思春期における体の変化などがあることについて理解できるようにすることを目指したものである。","基本的な動きや技能を身に付けるようにするとは，各種の運動の基本となる動きや技能を身に付けることを示している。また，このねらいは，それぞれの運動の楽しさや喜びに触れるようにすることを大切にしながら，基本的な動きや技能を身に付けることを重視したものである。","なお，中学年の児童は体力についての認識が低いことから，各種の運動の楽しさや喜びに触れ，活発に運動を行っていく中で，各種の運動の基本となる様々な動きや技能を身に付け，結果として体力の向上を図ることを目指すものである。したがって，中学年の各種の運動を取り上げるに当たっては，中学年の児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，自己の運動や健康に関する課題を見付け，その解決方法を工夫するとともに，それについて考えたことを他者に伝える力を養うことを意図している。","自己の運動の課題を見付けとは，自己が取り組む運動に関わり解決すべき課題を見付けることを指す。そのため，教師は，児童が自己の能力に適した運動の課題を見付けることができるように支援することが必要になる。","自己の身近な生活における健康の課題を見付けとは，保健領域の内容である健康な生活及び体の発育・発達に関わる事象や情報から，自己の健康に関する課題を見付けることを意図したものである。その際，教師は，児童がそれぞれの内容に関わる情報を収集したり，自己の経験を振り返ったりすることによって課題を見付けることができるように支援することが重要である。","その解決のための方法や活動を工夫するとは，中学年の各種の運動において見付けた自己の運動や身近な生活における健康の課題の解決に向けた方法や活動を工夫することを示している。自己の運動の課題であれば，各種の運動の楽しさや喜びに触れることができるようにするために，運動をする場や練習の仕方などを発達の段階に即して，自ら適切に工夫したり，選択したりすることを示したものである。そこには，自ら楽しみ方を工夫したり，教師や友達から提案された楽しみ方から，自己に合った楽しみ方を選択したりすることも含まれている。身近な生活における健康の課題であれば，正しい健康情報を集めたり選んだりして，課題のよりよい解決方法を予想したり考えたりすることや，学んだことを自己の生活と関連付けたりすることを示している。","考えたことを他者に伝えるとは，自己の工夫したことを他者に伝えることができるようにすることを示している。自己の考えを他者に伝えることで，自己の考えを深めることができるようにすることを意図している。他者とは，共に学ぶ友達だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者や地域の人に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値である，公正，協力，責任，参画，共生，健康・安全等に関する態度及び意欲的に運動をする態度を養うことを意図している。特に，運動をする際の良好な人間関係が運動の楽しさや喜びに大きな影響を与えることや，友達と共に進んで意思決定に関わることが，運動やスポーツの意義や価値等を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることにより，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。さらに，健康が単に疾病でないことや虚弱でないといったことだけを意味するのではなく，生活の質の向上までを含んだ積極的なものとして捉え，その健康の大切さを認識し，自己の健康の保持増進に主体的に取り組み，よりよい健康づくりを目指すとともに楽しく明るい生活を営む態度の育成を重視するという保健の「学びに向かう力，人間性等」を示している。","各種の運動に進んで取り組みとは，各種の運動の楽しさや喜びに触れ，自ら進んで運動に取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","きまりを守り誰とでも仲よく運動をしとは，中学年の各種の運動において，順番やきまりを守り，誰とでも仲よく運動をしたり，互いの違いを認めたり，友達と協力したり，公正な態度で勝敗を競ったりするなどのスポーツの価値の実現に関する態度の育成を示している。","友達の考えを認めとは，友達の考えを聞くことで，自己の考えを深めたり，友達との良好な関係を築いたりすることを目指したものである。","場や用具の安全に留意しとは，運動をする場所や器械・器具の整備，用具の安全を確かめること，水泳運動の心得を守って安全に気を付けることなど，低学年のねらいを発展させたものである。","最後まで努力して運動をする態度を養うとは，運動領域の学習で児童が学習課題の達成に向けて最後まで成し遂げる態度の育成を示している。課題に最後まで諦めずに取り組む過程で達成感を得たり，課題の解決に取り組む意味や自己の可能性に気付いたりすることにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動の実践だけでなく，日常の生活において必要な態度にもつながるものである。","健康の大切さに気付き，自己の健康の保持増進に進んで取り組む態度を養うとは，保健領域の内容に触れ健康の大切さに気付くことにより，自己の健康に関心をもち，健康の保持増進のために進んで学習活動に取り組む，課題の解決に向けて協力し合う，心身の発育・発達等を肯定的に捉える等の態度を養うことを意図したものである。"]},"grades":[3,4],"band":"3・4年"},"5":{"lines":["⑴　各種の運動の楽しさや喜びを味わい，その行い方及び心の健康やけがの防止，病気の予防について理解するとともに，各種の運動の特性に応じた基本的な技能及び健康で安全な生活を営むための技能を身に付けるようにする。","⑵　自己やグループの運動の課題や身近な健康に関わる課題を見付け，その解決のための方法や活動を工夫するとともに，自己や仲間の考えたことを他者に伝える力を養う。","⑶　各種の運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や用具の安全に留意したりし，自己の最善を尽くして運動をする態度を養う。また，健康・安全の大切さに気付き，自己の健康の保持増進や回復に進んで取り組む態度を養う。"],"page":112,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動の楽しさや喜びを味わうことを通して，その行い方や心の健康，けがの防止及び病気の予防について理解するとともに，各種の運動の特性に応じた基本的な技能及び健康で安全な生活を営むための技能を身に付けること及び体力を養うことを意図している。","各種の運動とは，児童の発達の段階を踏まえ，設定される運動であり，児童が成功体験を得やすいように，児童の発達の段階と運動の特性を踏まえ，課題やルール，場や用具等が緩和された体つくり運動，器械運動，陸上運動，水泳運動，ボール運動及び表現運動を指す。","楽しさや喜びを味わいとは，教科の目標に示している体育・保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動を通して運動の楽しさや喜びを味わうようにすることを目指すとともに，健康な生活や発育・発達について理解することを通して，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。そのためには，課題や活動の場などを工夫した易しい運動を行ったり，運動の取り上げ方の弾力化を図ったりすることが重要である。","高学年では，中学年の楽しさや喜びに触れる段階から，楽しさや喜びを味わうことを重視したものである。そのため，楽しさとともに，運動の特性に即して自己の力に応じた各種の運動の行い方を理解し，それらの基本的な技能を身に付けたり，それをプレイ等の中で発揮したりすることで喜びを味わうことに重点を置いている。また，個人の達成感や仲間と協力して得られる達成感等の喜びを味わうことにより，知識及び技能が更に身に付いていくことを意図している。さらに，知識及び技能を活用しながら身に付けていくことで，一層楽しさや喜びが高まっていくことを意図している。","その行い方を理解するとは，高学年においても運動の課題や約束，場や用具の使い方，場の安全の確保等，各種の運動の行い方を理解することが，各種の運動の基本的な技能の習得や仲間との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","心の健康やけがの防止，病気の予防について理解するとは，保健領域の内容との関連から，心の発達や心と体との密接な関係及び不安や悩みへの対処の仕方，交通事故や身の回りの生活の危険を予測し，回避すること，病気の起こり方と予防について理解できるようにすることを目指したものである。","各種の運動の特性に応じた基本的な技能を身に付けるようにするとは，各種の運動の基本となる技能を，それぞれの運動の特性に応じて身に付けることを示している。また，このねらいは，それぞれの運動の特性に応じた楽しさや喜びを味わうようにすることを大切にしながら，基本的な技能を身に付けることを重視したものである。","健康で安全な生活を営むための技能を身に付けるようにするとは，心の健康における不安や悩みへの対処の方法やけがの防止におけるけがなどの簡単な手当に関わる技能を身に付けるようにすることを意図し，今回，新たに示したものである。","なお，高学年の児童は体力についての認識が高まってくることを踏まえ，体力の重要性を理解するとともに，各種の運動の楽しさや喜びを味わい，活発に運動を行っていく中で，各種の運動の基本となる様々な技能を身に付け，結果として体力の向上を図ることを目指すものである。したがって，高学年の各種の運動を取り上げるに当たっては，高学年の児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，自己やグループの運動の課題や健康に関する自己の課題を見付け，その解決方法を工夫するとともに，それについて自己や仲間の考えたことを他者に伝える力を養うことを意図している。","自己やグループの運動の課題を見付けとは，自己やグループが取り組む運動に関わり解決すべき課題を見付けることを指す。取り組む運動についての課題と，課題に対応した練習の場，技や技術を確認することがそれに当たる。その際，個人が対応すべき課題とグループで対応すべき課題とを整理して確認することが大切になる。そのため，教師は，児童が自己やグループの適切な運動の課題を見付けることができるように支援することが必要になる。","身近な健康に関わる課題を見付けとは，保健領域の内容である心の発達や心と体との密接な関係及び不安や悩みへの対処の仕方，交通事故や身の回りの生活の危険を予測し，回避すること，病気の起こり方と予防についての自己の課題を見付けることを意図したものである。その際，教師は，児童がそれぞれの内容に関わる情報を収集したり，自己の経験を振り返ったりすることによって課題を見付けることができるように支援することが重要である。","その解決のための方法や活動を工夫するとは，高学年の各種の運動において見付けた自己やグループの運動や心の健康，けがの防止及び病気の予防に関する課題の解決に向けた方法や活動を工夫することを示している。自己やグループの運動の課題であれば，各種の運動の楽しさや喜びを味わうことができるようにするために，運動をする場や練習の仕方などを発達の段階に即して，自ら適切に工夫したり，選択したりすることを示している。そこには，自ら楽しみ方を工夫したり，教師や仲間から提案された楽しみ方から，自己やグループに合った楽しみ方を選択したりすることも含まれている。自己の健康の課題であれば，保健で習得した知識及び技能を活用して課題の解決方法を予想し考えたり，それらの中から適切な方法を選択したりすることを示している。","自己や仲間の考えたことを他者に伝えるとは，自己や仲間の考えたことを他者に伝えることができるようにすることを示している。自己の考えのみならず，仲間の考えたことを他者に伝えることで，他者の考えを理解するとともに自己の考えを深めることができるようにすることを意図している。他者とは，共に学ぶ仲間だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者や地域の人に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値である，公正，協力，責任，参画，共生，健康・安全等に関する態度及び意欲的に運動をする態度を養うことを意図している。特に，運動をする際の良好な人間関係が運動の楽しさや喜びに大きな影響を与えることや，仲間と共に積極的に意思決定に関わることが，運動やスポーツの意義や価値を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることで，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。さらに，健康・安全の大切さを認識し，自己の心身の健康の保持増進や疾病やけがなどからの回復，危険の回避等に主体的に取り組み，楽しく明るい生活を営む態度の育成を重視するという保健の「学びに向かう力，人間性等」を示している。","各種の運動に積極的に取り組みとは，各種の運動の楽しさや喜びを味わい，自ら積極的に運動に取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","約束を守り助け合って運動をしとは，高学年の各種の運動において，仲間と一緒に運動の楽しさや喜びを味わうことができるように，自分たちで決めた約束を守り，仲間と互いに助け合って運動をすることを示している。互いに助け合って運動をすることを通して，運動の課題やその解決方法についての理解が深まるとともに，仲間への信頼感が高まり，互いの関係がより良好になっていくことなどのスポーツの価値の実現に関する態度の育成を示している。","仲間の考えや取組を認めとは，仲間の考えを聞くことで自己の考えを深めたり，互いの取組を認めて仲間とのより良好な関係を築いたりすることを目指したものである。","場や用具の安全に留意しとは，運動をする場所や器械・器具の整備，用具の安全を確かめること，水泳運動の心得を守って安全に気を配ることなど，中学年のねらいを発展させたものである。","自己の最善を尽くして運動をする態度を養うとは，運動領域の学習で児童が学習課題の達成に向けて全力を出して運動に取り組む態度の育成を示している。最善を尽くして運動をする過程で達成感を得たり，課題の解決に取り組む意味や，自己や仲間の可能性に気付いたり，新たな課題に挑戦する態度が培われたりすることにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動の実践だけでなく日常の生活において必要な態度にもつながるものである。","健康・安全の大切さに気付き，自己の健康の保持増進や回復に進んで取り組む態度を養うとは，保健領域の内容を学習し，健康や安全の大切さに気付くことにより，自己の健康に関心をもち，心身の健康の保持増進や疾病の予防・回復のために主体的に学習活動に取り組む，課題の解決に向けて協力し合う，安全を確保してけがを防止するなどの態度を養うことを意図したものである。"]},"grades":[5,6],"band":"5・6年"},"6":{"lines":["⑴　各種の運動の楽しさや喜びを味わい，その行い方及び心の健康やけがの防止，病気の予防について理解するとともに，各種の運動の特性に応じた基本的な技能及び健康で安全な生活を営むための技能を身に付けるようにする。","⑵　自己やグループの運動の課題や身近な健康に関わる課題を見付け，その解決のための方法や活動を工夫するとともに，自己や仲間の考えたことを他者に伝える力を養う。","⑶　各種の運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や用具の安全に留意したりし，自己の最善を尽くして運動をする態度を養う。また，健康・安全の大切さに気付き，自己の健康の保持増進や回復に進んで取り組む態度を養う。"],"page":112,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動の楽しさや喜びを味わうことを通して，その行い方や心の健康，けがの防止及び病気の予防について理解するとともに，各種の運動の特性に応じた基本的な技能及び健康で安全な生活を営むための技能を身に付けること及び体力を養うことを意図している。","各種の運動とは，児童の発達の段階を踏まえ，設定される運動であり，児童が成功体験を得やすいように，児童の発達の段階と運動の特性を踏まえ，課題やルール，場や用具等が緩和された体つくり運動，器械運動，陸上運動，水泳運動，ボール運動及び表現運動を指す。","楽しさや喜びを味わいとは，教科の目標に示している体育・保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動を通して運動の楽しさや喜びを味わうようにすることを目指すとともに，健康な生活や発育・発達について理解することを通して，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。そのためには，課題や活動の場などを工夫した易しい運動を行ったり，運動の取り上げ方の弾力化を図ったりすることが重要である。","高学年では，中学年の楽しさや喜びに触れる段階から，楽しさや喜びを味わうことを重視したものである。そのため，楽しさとともに，運動の特性に即して自己の力に応じた各種の運動の行い方を理解し，それらの基本的な技能を身に付けたり，それをプレイ等の中で発揮したりすることで喜びを味わうことに重点を置いている。また，個人の達成感や仲間と協力して得られる達成感等の喜びを味わうことにより，知識及び技能が更に身に付いていくことを意図している。さらに，知識及び技能を活用しながら身に付けていくことで，一層楽しさや喜びが高まっていくことを意図している。","その行い方を理解するとは，高学年においても運動の課題や約束，場や用具の使い方，場の安全の確保等，各種の運動の行い方を理解することが，各種の運動の基本的な技能の習得や仲間との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","心の健康やけがの防止，病気の予防について理解するとは，保健領域の内容との関連から，心の発達や心と体との密接な関係及び不安や悩みへの対処の仕方，交通事故や身の回りの生活の危険を予測し，回避すること，病気の起こり方と予防について理解できるようにすることを目指したものである。","各種の運動の特性に応じた基本的な技能を身に付けるようにするとは，各種の運動の基本となる技能を，それぞれの運動の特性に応じて身に付けることを示している。また，このねらいは，それぞれの運動の特性に応じた楽しさや喜びを味わうようにすることを大切にしながら，基本的な技能を身に付けることを重視したものである。","健康で安全な生活を営むための技能を身に付けるようにするとは，心の健康における不安や悩みへの対処の方法やけがの防止におけるけがなどの簡単な手当に関わる技能を身に付けるようにすることを意図し，今回，新たに示したものである。","なお，高学年の児童は体力についての認識が高まってくることを踏まえ，体力の重要性を理解するとともに，各種の運動の楽しさや喜びを味わい，活発に運動を行っていく中で，各種の運動の基本となる様々な技能を身に付け，結果として体力の向上を図ることを目指すものである。したがって，高学年の各種の運動を取り上げるに当たっては，高学年の児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，自己やグループの運動の課題や健康に関する自己の課題を見付け，その解決方法を工夫するとともに，それについて自己や仲間の考えたことを他者に伝える力を養うことを意図している。","自己やグループの運動の課題を見付けとは，自己やグループが取り組む運動に関わり解決すべき課題を見付けることを指す。取り組む運動についての課題と，課題に対応した練習の場，技や技術を確認することがそれに当たる。その際，個人が対応すべき課題とグループで対応すべき課題とを整理して確認することが大切になる。そのため，教師は，児童が自己やグループの適切な運動の課題を見付けることができるように支援することが必要になる。","身近な健康に関わる課題を見付けとは，保健領域の内容である心の発達や心と体との密接な関係及び不安や悩みへの対処の仕方，交通事故や身の回りの生活の危険を予測し，回避すること，病気の起こり方と予防についての自己の課題を見付けることを意図したものである。その際，教師は，児童がそれぞれの内容に関わる情報を収集したり，自己の経験を振り返ったりすることによって課題を見付けることができるように支援することが重要である。","その解決のための方法や活動を工夫するとは，高学年の各種の運動において見付けた自己やグループの運動や心の健康，けがの防止及び病気の予防に関する課題の解決に向けた方法や活動を工夫することを示している。自己やグループの運動の課題であれば，各種の運動の楽しさや喜びを味わうことができるようにするために，運動をする場や練習の仕方などを発達の段階に即して，自ら適切に工夫したり，選択したりすることを示している。そこには，自ら楽しみ方を工夫したり，教師や仲間から提案された楽しみ方から，自己やグループに合った楽しみ方を選択したりすることも含まれている。自己の健康の課題であれば，保健で習得した知識及び技能を活用して課題の解決方法を予想し考えたり，それらの中から適切な方法を選択したりすることを示している。","自己や仲間の考えたことを他者に伝えるとは，自己や仲間の考えたことを他者に伝えることができるようにすることを示している。自己の考えのみならず，仲間の考えたことを他者に伝えることで，他者の考えを理解するとともに自己の考えを深めることができるようにすることを意図している。他者とは，共に学ぶ仲間だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者や地域の人に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値である，公正，協力，責任，参画，共生，健康・安全等に関する態度及び意欲的に運動をする態度を養うことを意図している。特に，運動をする際の良好な人間関係が運動の楽しさや喜びに大きな影響を与えることや，仲間と共に積極的に意思決定に関わることが，運動やスポーツの意義や価値を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることで，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。さらに，健康・安全の大切さを認識し，自己の心身の健康の保持増進や疾病やけがなどからの回復，危険の回避等に主体的に取り組み，楽しく明るい生活を営む態度の育成を重視するという保健の「学びに向かう力，人間性等」を示している。","各種の運動に積極的に取り組みとは，各種の運動の楽しさや喜びを味わい，自ら積極的に運動に取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","約束を守り助け合って運動をしとは，高学年の各種の運動において，仲間と一緒に運動の楽しさや喜びを味わうことができるように，自分たちで決めた約束を守り，仲間と互いに助け合って運動をすることを示している。互いに助け合って運動をすることを通して，運動の課題やその解決方法についての理解が深まるとともに，仲間への信頼感が高まり，互いの関係がより良好になっていくことなどのスポーツの価値の実現に関する態度の育成を示している。","仲間の考えや取組を認めとは，仲間の考えを聞くことで自己の考えを深めたり，互いの取組を認めて仲間とのより良好な関係を築いたりすることを目指したものである。","場や用具の安全に留意しとは，運動をする場所や器械・器具の整備，用具の安全を確かめること，水泳運動の心得を守って安全に気を配ることなど，中学年のねらいを発展させたものである。","自己の最善を尽くして運動をする態度を養うとは，運動領域の学習で児童が学習課題の達成に向けて全力を出して運動に取り組む態度の育成を示している。最善を尽くして運動をする過程で達成感を得たり，課題の解決に取り組む意味や，自己や仲間の可能性に気付いたり，新たな課題に挑戦する態度が培われたりすることにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動の実践だけでなく日常の生活において必要な態度にもつながるものである。","健康・安全の大切さに気付き，自己の健康の保持増進や回復に進んで取り組む態度を養うとは，保健領域の内容を学習し，健康や安全の大切さに気付くことにより，自己の健康に関心をもち，心身の健康の保持増進や疾病の予防・回復のために主体的に学習活動に取り組む，課題の解決に向けて協力し合う，安全を確保してけがを防止するなどの態度を養うことを意図したものである。"]},"grades":[5,6],"band":"5・6年"}},"units":[{"g":3,"u":"保健：けんこうというたからもの","b":"3年","ids":["taiiku-3-G-1"]},{"g":3,"u":"保健：けんこうによい1日の生活","b":"3年","ids":["taiiku-3-G-1"]},{"g":3,"u":"保健：体のせいけつとけんこう","b":"3年","ids":["taiiku-3-G-1"]},{"g":3,"u":"保健：けんこうによいかんきょう","b":"3年","ids":["taiiku-3-G-1"]},{"g":4,"u":"保健：育ちゆくわたしたちの体","b":"4年","ids":["taiiku-4-G-2"]},{"g":4,"u":"保健：思春期にあらわれる変化","b":"4年","ids":["taiiku-4-G-2"]},{"g":4,"u":"保健：よりよく成長するための生活","b":"4年","ids":["taiiku-4-G-2"]},{"g":5,"u":"保健：心の発達","b":"5年","ids":["taiiku-5-G-1"]},{"g":5,"u":"保健：心と体のつながり","b":"5年","ids":["taiiku-5-G-1"]},{"g":5,"u":"保健：不安やなやみがあるとき","b":"5年","ids":["taiiku-5-G-1"]},{"g":5,"u":"保健：事故やけがの原因と防止","b":"5年","ids":["taiiku-5-G-2"]},{"g":5,"u":"保健：交通事故の防止","b":"5年","ids":["taiiku-5-G-2"]},{"g":5,"u":"保健：犯罪被害の防止","b":"5年","ids":["taiiku-5-G-2"]},{"g":5,"u":"保健：自然災害によるけがの防止(発展)","b":"5年","ids":["taiiku-5-G-2"]},{"g":5,"u":"保健：けがの手当","b":"5年","ids":["taiiku-5-G-2"]},{"g":6,"u":"保健：病気の起こり方","b":"6年","ids":["taiiku-6-G-3"]},{"g":6,"u":"保健：感染症の予防","b":"6年","ids":["taiiku-6-G-3"]},{"g":6,"u":"保健：生活習慣病の予防","b":"6年","ids":["taiiku-6-G-3"]},{"g":6,"u":"保健：喫煙の害と健康","b":"6年","ids":["taiiku-6-G-3"]},{"g":6,"u":"保健：飲酒の害と健康","b":"6年","ids":["taiiku-6-G-3"]},{"g":6,"u":"保健：薬物乱用の害と健康","b":"6年","ids":["taiiku-6-G-3"]},{"g":6,"u":"保健：地域の保健活動","b":"6年","ids":["taiiku-6-G-3"]}],"katsudoName":"","katsudo":{},"bandSecs":{"1":{"page":65,"quote":["(1) 内容の「Ａ体つくりの運動遊び」については，２学年間にわたって指導するものとする。","(2) 内容の「Ｃ走・跳の運動遊び」については，児童の実態に応じて投の運動遊びを加えて指導することができる。","(3) 内容の「Ｆ表現リズム遊び」の(1)のイについては，簡単なフォークダンスを含めて指導することができる。","(4) 学校や地域の実態に応じて歌や運動を伴う伝承遊び及び自然の中での運動遊びを加えて指導することができる。","(5) 各領域の各内容については，運動と健康が関わっていることについての具体的な考えがもてるよう指導すること。"],"paras":["(1)は，「Ａ体つくりの運動遊び」の「体ほぐしの運動遊び」及び「多様な動きをつくる運動遊び」について，それぞれの学年で指導することを示したものである。また，「体つくりの運動遊び」以外の領域については，いずれかの学年で指導することもできることを示したものである。","(2)は，「Ｃ走・跳の運動遊び」について，児童の実態に応じて投の運動遊びを加えて指導することができることを示したものである。","(3)は，「Ｆ表現リズム遊び」の「リズム遊び」について，軽快なリズムに乗って踊るという視点がフォークダンスと共通することから，簡単なフォークダンスを含めて指導することができることを示したものである。","(4)は，「歌や運動を伴う伝承遊び」及び「自然の中での運動遊び」を，学校や地域の実態に応じて加えて指導することができることを示したものである。","(5)は，体は，活発に運動をしたり，長く運動をしたりすると，汗が出たり，心臓の鼓動や呼吸が速くなったりすること，体を使って元気に運動をすることは，体を丈夫にし，健康によいことなどを，各領域において行うことを示したものである。"]},"2":{"page":65,"quote":["(1) 内容の「Ａ体つくりの運動遊び」については，２学年間にわたって指導するものとする。","(2) 内容の「Ｃ走・跳の運動遊び」については，児童の実態に応じて投の運動遊びを加えて指導することができる。","(3) 内容の「Ｆ表現リズム遊び」の(1)のイについては，簡単なフォークダンスを含めて指導することができる。","(4) 学校や地域の実態に応じて歌や運動を伴う伝承遊び及び自然の中での運動遊びを加えて指導することができる。","(5) 各領域の各内容については，運動と健康が関わっていることについての具体的な考えがもてるよう指導すること。"],"paras":["(1)は，「Ａ体つくりの運動遊び」の「体ほぐしの運動遊び」及び「多様な動きをつくる運動遊び」について，それぞれの学年で指導することを示したものである。また，「体つくりの運動遊び」以外の領域については，いずれかの学年で指導することもできることを示したものである。","(2)は，「Ｃ走・跳の運動遊び」について，児童の実態に応じて投の運動遊びを加えて指導することができることを示したものである。","(3)は，「Ｆ表現リズム遊び」の「リズム遊び」について，軽快なリズムに乗って踊るという視点がフォークダンスと共通することから，簡単なフォークダンスを含めて指導することができることを示したものである。","(4)は，「歌や運動を伴う伝承遊び」及び「自然の中での運動遊び」を，学校や地域の実態に応じて加えて指導することができることを示したものである。","(5)は，体は，活発に運動をしたり，長く運動をしたりすると，汗が出たり，心臓の鼓動や呼吸が速くなったりすること，体を使って元気に運動をすることは，体を丈夫にし，健康によいことなどを，各領域において行うことを示したものである。"]},"3":{"page":110,"quote":["(1) 内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。","(2) 内容の「Ｃ走・跳の運動」については，児童の実態に応じて投の運動を加えて指導することができる。","(3) 内容の「Ｅゲーム」の(1)のアについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うものとする。","(4) 内容の「Ｆ表現運動」の(1)については，学校や地域の実態に応じてフォークダンスを加えて指導することができる。","(5) 内容の「Ｇ保健」については，(1)を第３学年，(2)を第４学年で指導するものとする。","(6) 内容の「Ｇ保健」の(1)については，学校でも，健康診断や学校給食など様々な活動が行われていることについて触れるものとする。","(7) 内容の「Ｇ保健」の(2)については，自分と他の人では発育・発達などに違いがあることに気付き，それらを肯定的に受け止めることが大切であることについて触れるものとする。","(8) 各領域の各内容については，運動と健康が密接に関連していることについての具体的な考えがもてるよう指導すること。"],"paras":["(1)は，「Ａ体つくり運動」の「体ほぐしの運動」及び「多様な動きをつくる運動」について，それぞれの学年で指導することを示したものである。また，「体つくり運動」以外の領域については，いずれかの学年で指導することもできることを示したものである。","(2)は，「Ｃ走・跳の運動」について，児童の実態に応じて投の運動を加えて指導することができることを示したものである。","(3)は，「Ｅゲーム」について，アについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うことを示したものである。","(4)は，「Ｆ表現運動」について，「フォークダンス」を学校や地域の実態に応じて加えて指導することができることを示したものである。","(5)は，「Ｇ保健」の内容の「(1) 健康な生活」を第３学年で，「(2) 体の発育・発達」を第４学年で指導することを示したものである。","(6)は，学校での健康診断や学校給食などは，学校全体で計画的に行われていること，また，保健室では，養護教諭が中心となってけがの手当や健康についての相談などが行われていることなどを取り上げ，保健活動の大切さについて気付かせるよう配慮するものとすることを示したものである。","(7)は，自分や他の人を大切にする気持ちを育てる観点から，自己の体の変化や個人による発育の違いなどについて肯定的に受け止めることが大切であることに気付かせるよう配慮するものとすることを示したものである。","(8)は，保健領域の「健康な生活と運動」及び「体の発育・発達と適切な運動」について学習したことを，運動領域の各領域において関係付けて学習することによって，児童が運動と健康が密接に関連していることに考えをもてるよう指導することを示したものである。特に，保健領域の「体の発育・発達」については，児童が「運動については，生涯を通じて骨や筋肉などを丈夫にする効果が期待されること」の知識を習得したことを，運動領域の「Ａ体つくり運動」の「跳ぶ，はねるなどの動きで構成される運動」を通じて行うなど，運動と健康との関連について具体的な考えをもてるよう配慮することが大切である。"]},"4":{"page":110,"quote":["(1) 内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。","(2) 内容の「Ｃ走・跳の運動」については，児童の実態に応じて投の運動を加えて指導することができる。","(3) 内容の「Ｅゲーム」の(1)のアについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うものとする。","(4) 内容の「Ｆ表現運動」の(1)については，学校や地域の実態に応じてフォークダンスを加えて指導することができる。","(5) 内容の「Ｇ保健」については，(1)を第３学年，(2)を第４学年で指導するものとする。","(6) 内容の「Ｇ保健」の(1)については，学校でも，健康診断や学校給食など様々な活動が行われていることについて触れるものとする。","(7) 内容の「Ｇ保健」の(2)については，自分と他の人では発育・発達などに違いがあることに気付き，それらを肯定的に受け止めることが大切であることについて触れるものとする。","(8) 各領域の各内容については，運動と健康が密接に関連していることについての具体的な考えがもてるよう指導すること。"],"paras":["(1)は，「Ａ体つくり運動」の「体ほぐしの運動」及び「多様な動きをつくる運動」について，それぞれの学年で指導することを示したものである。また，「体つくり運動」以外の領域については，いずれかの学年で指導することもできることを示したものである。","(2)は，「Ｃ走・跳の運動」について，児童の実態に応じて投の運動を加えて指導することができることを示したものである。","(3)は，「Ｅゲーム」について，アについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うことを示したものである。","(4)は，「Ｆ表現運動」について，「フォークダンス」を学校や地域の実態に応じて加えて指導することができることを示したものである。","(5)は，「Ｇ保健」の内容の「(1) 健康な生活」を第３学年で，「(2) 体の発育・発達」を第４学年で指導することを示したものである。","(6)は，学校での健康診断や学校給食などは，学校全体で計画的に行われていること，また，保健室では，養護教諭が中心となってけがの手当や健康についての相談などが行われていることなどを取り上げ，保健活動の大切さについて気付かせるよう配慮するものとすることを示したものである。","(7)は，自分や他の人を大切にする気持ちを育てる観点から，自己の体の変化や個人による発育の違いなどについて肯定的に受け止めることが大切であることに気付かせるよう配慮するものとすることを示したものである。","(8)は，保健領域の「健康な生活と運動」及び「体の発育・発達と適切な運動」について学習したことを，運動領域の各領域において関係付けて学習することによって，児童が運動と健康が密接に関連していることに考えをもてるよう指導することを示したものである。特に，保健領域の「体の発育・発達」については，児童が「運動については，生涯を通じて骨や筋肉などを丈夫にする効果が期待されること」の知識を習得したことを，運動領域の「Ａ体つくり運動」の「跳ぶ，はねるなどの動きで構成される運動」を通じて行うなど，運動と健康との関連について具体的な考えをもてるよう配慮することが大切である。"]},"5":{"page":158,"quote":["(1) 内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。また，(1)のイについては，体の柔らかさ及び巧みな動きを高めることに重点を置いて指導するものとする。その際，音楽に合わせて運動をするなどの工夫を図ること。","(2) 内容の「Ａ体つくり運動」の(1)のアと「Ｇ保健」の(1)のアの(ｳ)については，相互の関連を図って指導するものとする。","(3) 内容の「Ｃ陸上運動」については，児童の実態に応じて，投の運動を加えて指導することができる。","(4) 内容の「Ｄ水泳運動」の(1)のア及びイについては，水中からのスタートを指導するものとする。また，学校の実態に応じて背泳ぎを加えて指導することができる。","(5) 内容の「Ｅボール運動」の(1)については，アはバスケットボール及びサッカーを，イはソフトバレーボールを，ウはソフトボールを主として取り扱うものとするが，これらに替えてハンドボール，タグラグビー，フラッグフットボールなどア，イ及びウの型に応じたその他のボール運動を指導することもできるものとする。なお，学校の実態に応じてウは取り扱わないことができる。","(6) 内容の「Ｆ表現運動」の(1)については，学校や地域の実態に応じてリズムダンスを加えて指導することができる。","(7) 内容の「Ｇ保健」については，(1)及び(2)を第５学年，(3)を第６学年で指導するものとする。また，けがや病気からの回復についても触れるものとする。","(8) 内容の「Ｇ保健」の(3)のアの(ｴ)の薬物については，有機溶剤の心身への影響を中心に取り扱うものとする。また，覚醒剤等についても触れるものとする。","(9) 各領域の各内容については，運動領域と保健領域との関連を図る指導に留意すること。"],"paras":["(1)は，「Ａ体つくり運動」の「体ほぐしの運動」及び「体の動きを高める運動」について，それぞれの学年で指導することを示したものである。また，「体の動きを高める運動」については，高学年の児童の発達の段階を踏まえ，体の柔らかさ及び巧みな動きを高めるための運動に重点を置いて指導することを示したものである。また，体つくり運動の指導に当たっては，音楽に合わせて運動をするなど，楽しく運動に取り組むための工夫を図ることを示したものである。","(2)の相互の関連を図って指導するとは，「体ほぐしの運動」についての意味や必要性について，保健の時間において理解を図ることであり，また，心の健康で学んだことを「体つくり運動」の時間で実践し理解を深めようとすることである。","(3)は，「Ｃ陸上運動」について，児童の実態に応じて投の運動を加えて指導することができることを示したものである。","(4)は，「Ｄ水泳運動」について，泳ぎにつなげる水中からのスタートを指導するとともに，学校の実態に応じて「背泳ぎ」を加えて指導することができることを示したものである。","(5)は，「Ｅボール運動」について，アからウまでの各型で主として取り扱う運動を示すとともに，それぞれの型に応じてその他のボール運動を替えて指導することもできることを示したものである。また，「ベースボール型」については，運動場が狭くその実施が難しい学校もあることから，取り扱わないこともできることを示したものである。","(6)は，「Ｆ表現運動」について，学校や地域の実態に応じて，「リズムダンス」を加えて指導することができることを示したものである。","(7)は，「Ｇ保健」の内容の「(1)心の健康」及び「(2)けがの防止」については第５学年，「(3)病気の予防」については第６学年で指導することを示したものである。また，けがの防止や病気の予防だけでなく，「(2)けがの防止」の適切なけがの手当や「(3)病気の予防」の病原体に対する体の抵抗力や早期の治療の効果などを取り上げ，けがや病気からの回復についても触れるようにすることを示したものである。","(8)は，「Ｇ保健」の内容の(3)のアの(ｴ)の薬物乱用の心身への影響については，シンナーなどの有機溶剤を中心に取り扱うものとしたものである。また，覚醒剤については，乱用される薬物には様々なものがあることに触れる例として示したものである。","(9)は，「Ａ体つくり運動」をはじめ各運動領域の内容と，心の健康と運動，病気の予防の運動の効果などの保健領域の内容とを関連して指導することを示したものである。特に，児童が保健領域の病気の予防について，全身を使った運動を日常的に行うことが，現在のみならず大人になってからの病気の予防の方法としても重要であることを理解することと，各運動領域において学習したことを基に日常的に運動に親しむことを関連付けるなど，運動と健康との関連について具体的な考えをもてるよう配慮することが大切である。"]},"6":{"page":158,"quote":["(1) 内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。また，(1)のイについては，体の柔らかさ及び巧みな動きを高めることに重点を置いて指導するものとする。その際，音楽に合わせて運動をするなどの工夫を図ること。","(2) 内容の「Ａ体つくり運動」の(1)のアと「Ｇ保健」の(1)のアの(ｳ)については，相互の関連を図って指導するものとする。","(3) 内容の「Ｃ陸上運動」については，児童の実態に応じて，投の運動を加えて指導することができる。","(4) 内容の「Ｄ水泳運動」の(1)のア及びイについては，水中からのスタートを指導するものとする。また，学校の実態に応じて背泳ぎを加えて指導することができる。","(5) 内容の「Ｅボール運動」の(1)については，アはバスケットボール及びサッカーを，イはソフトバレーボールを，ウはソフトボールを主として取り扱うものとするが，これらに替えてハンドボール，タグラグビー，フラッグフットボールなどア，イ及びウの型に応じたその他のボール運動を指導することもできるものとする。なお，学校の実態に応じてウは取り扱わないことができる。","(6) 内容の「Ｆ表現運動」の(1)については，学校や地域の実態に応じてリズムダンスを加えて指導することができる。","(7) 内容の「Ｇ保健」については，(1)及び(2)を第５学年，(3)を第６学年で指導するものとする。また，けがや病気からの回復についても触れるものとする。","(8) 内容の「Ｇ保健」の(3)のアの(ｴ)の薬物については，有機溶剤の心身への影響を中心に取り扱うものとする。また，覚醒剤等についても触れるものとする。","(9) 各領域の各内容については，運動領域と保健領域との関連を図る指導に留意すること。"],"paras":["(1)は，「Ａ体つくり運動」の「体ほぐしの運動」及び「体の動きを高める運動」について，それぞれの学年で指導することを示したものである。また，「体の動きを高める運動」については，高学年の児童の発達の段階を踏まえ，体の柔らかさ及び巧みな動きを高めるための運動に重点を置いて指導することを示したものである。また，体つくり運動の指導に当たっては，音楽に合わせて運動をするなど，楽しく運動に取り組むための工夫を図ることを示したものである。","(2)の相互の関連を図って指導するとは，「体ほぐしの運動」についての意味や必要性について，保健の時間において理解を図ることであり，また，心の健康で学んだことを「体つくり運動」の時間で実践し理解を深めようとすることである。","(3)は，「Ｃ陸上運動」について，児童の実態に応じて投の運動を加えて指導することができることを示したものである。","(4)は，「Ｄ水泳運動」について，泳ぎにつなげる水中からのスタートを指導するとともに，学校の実態に応じて「背泳ぎ」を加えて指導することができることを示したものである。","(5)は，「Ｅボール運動」について，アからウまでの各型で主として取り扱う運動を示すとともに，それぞれの型に応じてその他のボール運動を替えて指導することもできることを示したものである。また，「ベースボール型」については，運動場が狭くその実施が難しい学校もあることから，取り扱わないこともできることを示したものである。","(6)は，「Ｆ表現運動」について，学校や地域の実態に応じて，「リズムダンス」を加えて指導することができることを示したものである。","(7)は，「Ｇ保健」の内容の「(1)心の健康」及び「(2)けがの防止」については第５学年，「(3)病気の予防」については第６学年で指導することを示したものである。また，けがの防止や病気の予防だけでなく，「(2)けがの防止」の適切なけがの手当や「(3)病気の予防」の病原体に対する体の抵抗力や早期の治療の効果などを取り上げ，けがや病気からの回復についても触れるようにすることを示したものである。","(8)は，「Ｇ保健」の内容の(3)のアの(ｴ)の薬物乱用の心身への影響については，シンナーなどの有機溶剤を中心に取り扱うものとしたものである。また，覚醒剤については，乱用される薬物には様々なものがあることに触れる例として示したものである。","(9)は，「Ａ体つくり運動」をはじめ各運動領域の内容と，心の健康と運動，病気の予防の運動の効果などの保健領域の内容とを関連して指導することを示したものである。特に，児童が保健領域の病気の予防について，全身を使った運動を日常的に行うことが，現在のみならず大人になってからの病気の予防の方法としても重要であることを理解することと，各運動領域において学習したことを基に日常的に運動に親しむことを関連付けるなど，運動と健康との関連について具体的な考えをもてるよう配慮することが大切である。"]}},"unitNote":"体育の運動領域（Ａ〜Ｆ）は教科書がないため、単元は保健だけです。運動領域は「区分から」選んでください。","items":[{"id":"taiiku-12-A-0","g":[1,2],"area":"A","areaName":"体つくりの運動遊び","mark":null,"head":"体つくりの運動遊び：体ほぐしの運動遊び，多様な動きをつくる運動遊び","title":"体つくりの運動遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，体を動かす心地よさを味わったり，基本的な動きを身に付けたりすること。","ア　体ほぐしの運動遊びでは，手軽な運動遊びを行い，心と体の変化に気付いたり，みんなで関わり合ったりすること。","イ　多様な動きをつくる運動遊びでは，体のバランスをとる動き，体を移動する動き，用具を操作する動き，力試しの動きをすること。","⑵　体をほぐしたり多様な動きをつくったりする遊び方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，場の安全に気を付けたりすること。"],"notes":["⑴　内容の「Ａ体つくりの運動遊び」については，２学年間にわたって指導するものとする。"],"units":null},{"id":"taiiku-12-B-0","g":[1,2],"area":"B","areaName":"器械・器具を使っての運動遊び","mark":null,"head":"器械・器具を使っての運動遊び：固定施設，マット，鉄棒，跳び箱","title":"器械・器具を使っての運動遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　固定施設を使った運動遊びでは，登り下りや懸垂移行，渡り歩きや跳び下りをすること。","イ　マットを使った運動遊びでは，いろいろな方向への転がり，手で支えての体の保持や回転をすること。","ウ　鉄棒を使った運動遊びでは，支持しての揺れや上がり下り，ぶら下がりや易しい回転をすること。","エ　跳び箱を使った運動遊びでは，跳び乗りや跳び下り，手を着いてのまたぎ乗りやまたぎ下りをすること。","⑵　器械・器具を用いた簡単な遊び方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，順番やきまりを守り誰とでも仲よく運動をしたり，場や器械・器具の安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-12-C-0","g":[1,2],"area":"C","areaName":"走・跳の運動遊び","mark":null,"head":"走・跳の運動遊び：走の運動遊び，跳の運動遊び","title":"走・跳の運動遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　走の運動遊びでは，いろいろな方向に走ったり，低い障害物を走り越えたりすること。","イ　跳の運動遊びでは，前方や上方に跳んだり，連続して跳んだりすること。","⑵　走ったり跳んだりする簡単な遊び方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，順番やきまりを守り誰とでも仲よく運動をしたり，勝敗を受け入れたり，場の安全に気を付けたりすること。"],"notes":["⑵　内容の「Ｃ走・跳の運動遊び」については，児童の実態に応じて投の運動遊びを加えて指導することができる。"],"units":null},{"id":"taiiku-12-D-0","g":[1,2],"area":"D","areaName":"水遊び","mark":null,"head":"水遊び：水の中を移動する運動遊び，もぐる・浮く運動遊び","title":"水遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　水の中を移動する運動遊びでは，水につかって歩いたり走ったりすること。","イ　もぐる・浮く運動遊びでは，息を止めたり吐いたりしながら，水にもぐったり浮いたりすること。","⑵　水の中を移動したり，もぐったり浮いたりする簡単な遊び方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，順番やきまりを守り誰とでも仲よく運動をしたり，水遊びの心得を守って安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-12-E-0","g":[1,2],"area":"E","areaName":"ゲーム","mark":null,"head":"ゲーム：ボールゲーム，鬼遊び","title":"ゲームについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，易しいゲームをすること。","ア　ボールゲームでは，簡単なボール操作と攻めや守りの動きによって，易しいゲームをすること。","イ　鬼遊びでは，一定の区域で，逃げる，追いかける，陣地を取り合うなどをすること。","⑵　簡単な規則を工夫したり，攻め方を選んだりするとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，規則を守り誰とでも仲よく運動をしたり，勝敗を受け入れたり，場や用具の安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-12-F-0","g":[1,2],"area":"F","areaName":"表現リズム遊び","mark":null,"head":"表現リズム遊び：表現遊び，リズム遊び","title":"表現リズム遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，題材になりきったりリズムに乗ったりして踊ること。","ア　表現遊びでは，身近な題材の特徴を捉え，全身で踊ること。","イ　リズム遊びでは，軽快なリズムに乗って踊ること。","⑵　身近な題材の特徴を捉えて踊ったり，軽快なリズムに乗って踊ったりする簡単な踊り方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，誰とでも仲よく踊ったり，場の安全に気を付けたりすること。"],"notes":["⑶　内容の「Ｆ表現リズム遊び」の⑴のイについては，簡単なフォークダンスを含めて指導することができる。"],"units":null},{"id":"taiiku-34-A-0","g":[3,4],"area":"A","areaName":"体つくり運動","mark":null,"head":"体つくり運動：体ほぐしの運動，多様な動きをつくる運動","title":"体つくり運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，体を動かす心地よさを味わったり，基本的な動きを身に付けたりすること。","ア　体ほぐしの運動では，手軽な運動を行い，心と体の変化に気付いたり，みんなで関わり合ったりすること。","イ　多様な動きをつくる運動では，体のバランスをとる動き，体を移動する動き，用具を操作する動き，力試しの動きをし，それらを組み合わせること。","⑵　自己の課題を見付け，その解決のための活動を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や用具の安全に気を付けたりすること。"],"notes":["⑴　内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。"],"units":null},{"id":"taiiku-34-B-0","g":[3,4],"area":"B","areaName":"器械運動","mark":null,"head":"器械運動：マット運動，鉄棒運動，跳び箱運動","title":"器械運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，その技を身に付けること。","ア　マット運動では，回転系や巧技系の基本的な技をすること。","イ　鉄棒運動では，支持系の基本的な技をすること。","ウ　跳び箱運動では，切り返し系や回転系の基本的な技をすること。","⑵　自己の能力に適した課題を見付け，技ができるようになるための活動を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や器械・器具の安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-34-C-0","g":[3,4],"area":"C","areaName":"走・跳の運動","mark":null,"head":"走・跳の運動：かけっこ・リレー，小型ハードル走，幅跳び，高跳び","title":"走・跳の運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　かけっこ・リレーでは，調子よく走ったりバトンの受渡しをしたりすること。","イ　小型ハードル走では，小型ハードルを調子よく走り越えること。","ウ　幅跳びでは，短い助走から踏み切って跳ぶこと","エ　高跳びでは，短い助走から踏み切って跳ぶこと。","⑵　自己の能力に適した課題を見付け，動きを身に付けるための活動や競争の仕方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，勝敗を受け入れたり，友達の考えを認めたり，場や用具の安全に気を付けたりすること。"],"notes":["⑵　内容の「Ｃ走・跳の運動」については，児童の実態に応じて投の運動を加えて指導することができる。"],"units":null},{"id":"taiiku-34-D-0","g":[3,4],"area":"D","areaName":"水泳運動","mark":null,"head":"水泳運動：浮いて進む運動，もぐる・浮く運動","title":"水泳運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　浮いて進む運動では，け伸びや初歩的な泳ぎをすること。","イ　もぐる・浮く運動では，息を止めたり吐いたりしながら，いろいろなもぐり方や浮き方をすること。","⑵　自己の能力に適した課題を見付け，水の中での動きを身に付けるための活動を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，水泳運動の心得を守って安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-34-E-0","g":[3,4],"area":"E","areaName":"ゲーム","mark":null,"head":"ゲーム：ゴール型，ネット型，ベースボール型ゲーム","title":"ゲームについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，易しいゲームをすること。","ア　ゴール型ゲームでは，基本的なボール操作とボールを持たないときの動きによって，易しいゲームをすること。","イ　ネット型ゲームでは，基本的なボール操作とボールを操作できる位置に体を移動する動きによって，易しいゲームをすること。","ウ　ベースボール型ゲームでは，蹴る，打つ，捕る，投げるなどのボール操作と得点をとったり防いだりする動きによって，易しいゲームをすること。","⑵　規則を工夫したり，ゲームの型に応じた簡単な作戦を選んだりするとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，規則を守り誰とでも仲よく運動をしたり，勝敗を受け入れたり，友達の考えを認めたり，場や用具の安全に気を付けたりすること。"],"notes":["⑶　内容の「Ｅゲーム」の⑴のアについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うものとする。"],"units":null},{"id":"taiiku-34-F-0","g":[3,4],"area":"F","areaName":"表現運動","mark":null,"head":"表現運動：表現，リズムダンス","title":"表現運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，表したい感じを表現したりリズムに乗ったりして踊ること。","ア　表現では，身近な生活などの題材からその主な特徴を捉え，表したい感じをひと流れの動きで踊ること。","イ　リズムダンスでは，軽快なリズムに乗って全身で踊ること。","⑵　自己の能力に適した課題を見付け，題材やリズムの特徴を捉えた踊り方や交流の仕方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，誰とでも仲よく踊ったり，友達の動きや考えを認めたり，場の安全に気を付けたりすること。"],"notes":["⑷　内容の「Ｆ表現運動」の⑴については，学校や地域の実態に応じてフォークダンスを加えて指導することができる。"],"units":null},{"id":"taiiku-3-G-1","g":[3],"area":"G","areaName":"保健","mark":"⑴","head":"保健：健康な生活","title":"健康な生活について，課題を見付け，その解決を目指した活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　健康な生活について理解すること。","（ア）　心や体の調子がよいなどの健康の状態は，主体の要因や周囲の環境の要因が関わっていること。","（イ）　毎日を健康に過ごすには，運動，食事，休養及び睡眠の調和のとれた生活を続けること，また，体の清潔を保つことなどが必要であること。","（ウ）　毎日を健康に過ごすには，明るさの調節，換気などの生活環境を整えることなどが必要であること。","イ　健康な生活について課題を見付け，その解決に向けて考え，それを表現すること。"],"notes":["⑸　内容の「Ｇ保健」については，⑴を第３学年，⑵を第４学年で指導するものとする。","⑹　内容の「Ｇ保健」の⑴については，学校でも，健康診断や学校給食など様々な活動が行われていることについて触れるものとする。"],"units":[{"u":"保健：けんこうというたからもの","b":"3年","s":3},{"u":"保健：けんこうによい1日の生活","b":"3年","s":3},{"u":"保健：体のせいけつとけんこう","b":"3年","s":3},{"u":"保健：けんこうによいかんきょう","b":"3年","s":3}]},{"id":"taiiku-4-G-2","g":[4],"area":"G","areaName":"保健","mark":"⑵","head":"保健：体の発育・発達","title":"体の発育・発達について，課題を見付け，その解決を目指した活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　体の発育・発達について理解すること。","（ア）　体は，年齢に伴って変化すること。また，体の発育・発達には，個人差があること。","（イ）　体は，思春期になると次第に大人の体に近づき，体つきが変わったり，初経，精通などが起こったりすること。また，異性への関心が芽生えること。","（ウ）　体をよりよく発育・発達させるには，適切な運動，食事，休養及び睡眠が必要であること。","イ　体がよりよく発育・発達するために，課題を見付け，その解決に向けて考え，それを表現すること。"],"notes":["⑸　内容の「Ｇ保健」については，⑴を第３学年，⑵を第４学年で指導するものとする。","⑺　内容の「Ｇ保健」の⑵については，自分と他の人では発育・発達などに違いがあることに気付き，それらを肯定的に受け止めることが大切であることについて触れるものとする。"],"units":[{"u":"保健：育ちゆくわたしたちの体","b":"4年","s":3},{"u":"保健：思春期にあらわれる変化","b":"4年","s":3},{"u":"保健：よりよく成長するための生活","b":"4年","s":3}]},{"id":"taiiku-56-A-0","g":[5,6],"area":"A","areaName":"体つくり運動","mark":null,"head":"体つくり運動：体ほぐしの運動，体の動きを高める運動","title":"体つくり運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，体を動かす心地よさを味わったり，体の動きを高めたりすること。","ア　体ほぐしの運動では，手軽な運動を行い，心と体との関係に気付いたり，仲間と関わり合ったりすること。","イ　体の動きを高める運動では，ねらいに応じて，体の柔らかさ，巧みな動き，力強い動き，動きを持続する能力を高めるための運動をすること。","⑵　自己の体の状態や体力に応じて，運動の行い方を工夫するとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や用具の安全に気を配ったりすること。"],"notes":["⑴　内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。また，⑴のイについては，体の柔らかさ及び巧みな動きを高めることに重点を置いて指導するものとする。その際，音楽に合わせて運動をするなどの工夫を図ること。","⑵　内容の「Ａ体つくり運動」の⑴のアと「Ｇ保健」の⑴のアの（ウ）については，相互の関連を図って指導するものとする。"],"units":null},{"id":"taiiku-56-B-0","g":[5,6],"area":"B","areaName":"器械運動","mark":null,"head":"器械運動：マット運動，鉄棒運動，跳び箱運動","title":"器械運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，その技を身に付けること。","ア　マット運動では，回転系や巧技系の基本的な技を安定して行ったり，その発展技を行ったり，それらを繰り返したり組み合わせたりすること。","イ　鉄棒運動では，支持系の基本的な技を安定して行ったり，その発展技を行ったり，それらを繰り返したり組み合わせたりすること。","ウ　跳び箱運動では，切り返し系や回転系の基本的な技を安定して行ったり，その発展技を行ったりすること。","⑵　自己の能力に適した課題の解決の仕方や技の組み合わせ方を工夫するとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や器械・器具の安全に気を配ったりすること。"],"notes":null,"units":null},{"id":"taiiku-56-C-0","g":[5,6],"area":"C","areaName":"陸上運動","mark":null,"head":"陸上運動：短距離走・リレー，ハードル走，走り幅跳び，走り高跳び","title":"陸上運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，その技能を身に付けること。","ア　短距離走・リレーでは，一定の距離を全力で走ったり，滑らかなバトンの受渡しをしたりすること。","イ　ハードル走では，ハードルをリズミカルに走り越えること。","ウ　走り幅跳びでは，リズミカルな助走から踏み切って跳ぶこと。","エ　走り高跳びでは，リズミカルな助走から踏み切って跳ぶこと。","⑵　自己の能力に適した課題の解決の仕方，競争や記録への挑戦の仕方を工夫するとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，約束を守り助け合って運動をしたり，勝敗を受け入れたり，仲間の考えや取組を認めたり，場や用具の安全に気を配ったりすること。"],"notes":["⑶　内容の「Ｃ陸上運動」については，児童の実態に応じて，投の運動を加えて指導することができる。"],"units":null},{"id":"taiiku-56-D-0","g":[5,6],"area":"D","areaName":"水泳運動","mark":null,"head":"水泳運動：クロール，平泳ぎ，安全確保につながる運動","title":"水泳運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，その技能を身に付けること。","ア　クロールでは，手や足の動きに呼吸を合わせて続けて長く泳ぐこと。","イ　平泳ぎでは，手や足の動きに呼吸を合わせて続けて長く泳ぐこと。","ウ　安全確保につながる運動では，背浮きや浮き沈みをしながら続けて長く浮くこと。","⑵　自己の能力に適した課題の解決の仕方や記録への挑戦の仕方を工夫するとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，水泳運動の心得を守って安全に気を配ったりすること。"],"notes":["⑷　内容の「Ｄ水泳運動」の⑴のア及びイについては，水中からのスタートを指導するものとする。また，学校の実態に応じて背泳ぎを加えて指導することができる。"],"units":null},{"id":"taiiku-56-E-0","g":[5,6],"area":"E","areaName":"ボール運動","mark":null,"head":"ボール運動：ゴール型，ネット型，ベースボール型","title":"ボール運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，その技能を身に付け，簡易化されたゲームをすること。","ア　ゴール型では，ボール操作とボールを持たないときの動きによって，簡易化されたゲームをすること。","イ　ネット型では，個人やチームによる攻撃と守備によって，簡易化されたゲームをすること。","ウ　ベースボール型では，ボールを打つ攻撃と隊形をとった守備によって，簡易化されたゲームをすること。","⑵　ルールを工夫したり，自己やチームの特徴に応じた作戦を選んだりするとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，ルールを守り助け合って運動をしたり，勝敗を受け入れたり，仲間の考えや取組を認めたり，場や用具の安全に
