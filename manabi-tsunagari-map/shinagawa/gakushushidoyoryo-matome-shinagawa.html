を跳ぶなどの動きで構成される運動遊び","・ 短なわを揺らしたり，回旋したりしながら前や後ろの連続両足跳びをすること。","○ 用具に乗るなどの動きで構成される運動遊び","・ 足場の低い易しい竹馬などに乗り，歩くこと。","◎ 運動遊びが苦手な児童への配慮の例","・ 回す，転がすなど用具を操作することが苦手な児童には，ボールやフープなど用具の大きさ，柔らかさ，重さを変えて操作しやすくするなどの配慮をする。","・ 用具を投げる，捕るなどの動きが苦手な児童には，新聞紙を丸めた球や新聞紙で作った棒，スポンジのボールなど，恐怖心を感じにくい用具を用いたり，紙鉄砲を用いた遊びを取り入れたりするなどの配慮をする。","・ なわを跳んだり，くぐったりすることが苦手な児童には，跳び越す位置や動き方を示したり，かけ声によってタイミングを合わせることができるようにしたりするなどの配慮をする。","(ｴ) 力試しの運動遊び","人を押す，引く，運ぶ，支えるなどしたり，力比べをしたりするなどの動きで構成される運動遊びを通して，力を出しきったり，力を入れたり緩めたりする力試しの動きを身に付けることができるようにする。","［例示］","○ 人を押す，引く動きや力比べをするなどの動きで構成される運動遊び","・ すもう遊びで相手を押し出したり，引き合い遊びで引き動かしたりすること。","・ なわを引いたり，緩めたりしながら力の出し入れを調整し，力比べをすること。","○ 人を運ぶ，支えるなどの動きで構成される運動遊び","・ 友達をいろいろな方向に引きずったり，おんぶをしたりすること。","・ 腕立て伏臥の姿勢から自己の体を支え，手や足を支点として回ること。","◎ 運動遊びが苦手な児童への配慮の例","・ すもう遊びや力比べが苦手な児童には，力を入れたり緩めたりする行い方について助言したり，力を加減するタイミングをつかめるように声をかけたりするなどの配慮をする。","・ 友達を引きずったり，おんぶをしたりする動きが苦手な児童には，補助を受けながら行ったり，動く距離を短くしたりするなどの配慮をする。","・ 体を支える動きが苦手な児童には，肘を曲げずに手の平で地面や床を押したり，目線を地面や床と平行にしたりすることができるよう助言するなどの配慮をする。"],"s":["ア  楽しくできる体ほぐしの運動遊びや多様な動きをつくる運動遊びを選ぶこと。","○ できそうな運動遊びや，友達と一緒に行うと楽しい運動遊びを選んだり，運動遊びをする場や使用する用具を変えながら，楽しくできる遊び方を選んだりする例","・ 友達の感想や気付きを聞いたり，友達の動きを見たりして，できそうな運動遊びや友達と一緒に行うと楽しい運動遊びを選ぶこと。","・ いろいろな種類の用具の中から操作しやすい物を選んだり，楽しく動くことができる場を選んだりすること。","イ  友達のよい動きを見付けたり，工夫したりした楽しい遊び方を友達に伝えること。","○ 体ほぐしの運動遊びで心や体の変化に気付いたことを友達に伝える例","・ 体を動かすと気持ちがよいことや汗が出ることなどの気付いたことを言葉で表したり，気持ちを表すカードなどを用いたりして友達に伝えること。","○ 多様な動きをつくる運動遊びで友達の動きを見てよい動きを見付けたり，楽しい運動遊びの行い方を選んだりしたことを友達に伝える例","・ 友達の動きを見て見付けたよい動きや，行ってみて楽しいと感じた運動遊びの行い方を友達に伝えること。","・ 用具を運ぶ運動遊びで，ボールの大きさや種類を変えたり，様々な運び方を試したりして選んだ行い方を，動作を交えながら友達に伝えること。"],"m":["ア 体ほぐしの運動遊びや多様な動きをつくる運動遊びに進んで取り組むこと。イ 運動遊びをする際に，順番やきまりを守り，誰とでも仲よくすること。","ウ 運動遊びで使用する用具の準備や片付けを，友達と一緒にすること。","エ  危険物が無いか，友達とぶつからない十分な間隔があるかなどの場の安全に気を付けること。","◎ 運動遊びに意欲的でない児童への配慮の例","・ 体を動かすことを好まない児童には，教室から友達と手をつないで体育館や運動場に移動するなど，授業前から友達と関わりながら自然に運動遊びに加わっていくことができるようにするなどの配慮をする。","・ 友達と関わり合うことに意欲的になれない児童には，ペアやグループで調子を合わせて動くことによって，気持ちも弾んでくることが実感できる運動遊びを準備したり，意欲が感じられる児童のつぶやきや動きを取り上げて共感したりするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア 体ほぐしの運動遊び","体ほぐしの運動遊びでは，その行い方を知るとともに，手軽な運動遊びを行い，体を動かす楽しさや心地よさを味わうことを通して，自己の心と体の変化に気付いたり，みんなで関わり合ったりすること。","心と体の変化に気付くとは，体を動かすと気持ちがよいことや，力一杯動くと汗が出たり心臓の鼓動が激しくなったりすることなどに気付くことである。みんなで関わり合うとは，人それぞれに違いがあることを知り，誰とでも仲よく協力したり助け合ったりして運動遊びを行い，友達と一緒に体を動かすと楽しさが増すことや，つながりを体験することである。","［行い方の例］","○ 伸び伸びとした動作で新聞紙やテープ，ボール，なわ，体操棒，フープといった操作しやすい用具などを用いた運動遊びを行うこと。","○ リズムに乗って，心が弾むような動作で運動遊びを行うこと。","○ 動作や人数などの条件を変えて，歩いたり走ったりする運動遊びを行うこと。","○ 伝承遊びや集団による運動遊びを行うこと。","◎ 運動遊びが苦手な児童への配慮の例","・ 心や体の変化に気付くことが苦手な児童には，表情を表す絵や感情を表すカードを示し，自己の心や体の変化のイメージができるようにするなどの配慮をする。","・ 友達と楽しく運動をすることが苦手な児童には，友達とハイタッチや拍手で喜びを共有するなど，共に運動遊びをする楽しい雰囲気を実感することができるようにするなどの配慮をする。"],"イ":["イ 多様な動きをつくる運動遊び","多様な動きをつくる運動遊びでは，その行い方を知るとともに，体のバランスをとったり，体を移動したり，用具を操作したり，力試しをしたりすること。多様な動きをつくる運動遊びは，次の内容で構成される。","(ｱ) 体のバランスをとる運動遊び","(ｲ) 体を移動する運動遊び","(ｳ) 用具を操作する運動遊び","(ｴ) 力試しの運動遊び","(ｱ) 体のバランスをとる運動遊び","姿勢や方向，人数を変えて，回る，寝転ぶ，起きる，座る，立つなどの動きやバランスを保つ動きで構成される運動遊びを通して，体のバランスをとる動きを身に付けることができるようにする。","［例示］","○ 回るなどの動きで構成される運動遊び","・  片足を軸にして，右回り・左回りに回転したり，跳び上がって回ったりすること。","・  立った姿勢からリズムよく跳びながら，右回り・左回りに1/2回転，3/4回転，１回転などをすること。","○ 寝転ぶ，起きるなどの動きで構成される運動遊び","・ 足の裏を合わせて座り，両手で足先を持ち，転がって起きること。","○ 座る，立つなどの動きで構成される運動遊び","・ 友達と肩を組んだり背中を合わせたりして，立ったり座ったりすること。","○ 体のバランスを保つ動きで構成される運動遊び","・ 片足でバランスを保ちながら静止すること。","・  しゃがんだ姿勢で互いに手を合わせ，相手のバランスを崩したり，相手にバランスを崩されないようにしたりすること。","◎ 運動遊びが苦手な児童への配慮の例","・ 回るなどの動きでバランスをとることが苦手な児童には，できそうなところに目印を置いて回ったり，軸になる足の位置に輪を置いたりするなど，回りやすくする場を設定するなどの配慮をする。","・ 足の裏を合わせて座った姿勢のまま転がって起きることが苦手な児童には，補助を受けながら，体の重心をゆっくりと移動する動きを身に付けるようにするなどの配慮をする。","・ 二人組になって同時に座る，立つなどの動きが苦手な児童には，補助を受けながら単独での動きを試みるなどの配慮をする。","・ 体のバランスを保つ動きが苦手な児童には，個別に行い方を説明したり，友達の行い方を見ながら真似をしたりするなどの配慮をする。","(ｲ) 体を移動する運動遊び","姿勢，速さ，リズム，方向などを変えて，這う，歩く，走る，跳ぶ，はねるなどの動きで構成される運動遊びや一定の速さでのかけ足などの運動遊びを通して，様々な行い方で体を移動する動きを身に付けることができるようにする。","［例示］","○ 這う，歩く，走るなどの動きで構成される運動遊び","・ 大きな円を右回りや左回りに這ったり，歩いたり，走ったりすること。","・ 横や後ろ，斜めに走ったり，曲線やジグザグ，クランクなどの形態の異なる走路や細い走路を走ったりすること。","○ 跳ぶ，はねるなどの動きで構成される運動遊び","・ 両足や片足でいろいろな跳び方で跳んだり，空中で向きを変えて足から着地したりすること。","・ 両足または片足で，リズムや方向，高さを変えてはねること。","○ 一定の速さでのかけ足","・ 無理のない速さでかけ足を２～３分程度続けること。","◎ 運動遊びが苦手な児童への配慮の例","・ 様々な行い方で這ったり，歩いたり，走ったりすることが苦手な児童には，友達の行い方の真似をしたり，友達の後について行ったりするなど，体の動かし方が分かるようにするなどの配慮をする。","・ 跳ぶ，はねるなどの動きが苦手な児童には，跳ぶ方向が分かるよう矢印を置いたり，はねた際に手でタッチできるよう目印をぶら下げたりするなど，場や用具を準備するなどの配慮をする。","・ 一定の速さでのかけ足が苦手な児童には，継続できる速さを助言したり，音楽に合わせるようにしたり，友達とかけ声を合わせながら走ったりするなどの配慮をする。","(ｳ) 用具を操作する運動遊び","用具をつかむ，持つ，降ろす，回す，転がす，くぐる，運ぶ，投げる，捕る，跳ぶ，用具に乗るなどの動きで構成される運動遊びを通して，用具を操作する動きを身に付けることができるようにする。","［例示］","○ 用具をつかむ，持つ，降ろす，回す，転がすなどの動きで構成される運動遊び","・ 大きさや重さの異なるボールを両手でつかんで，持ち上げたり，回したり，下ろしたりすること。","・ フープを手首や腰を軸にして回したり，倒れないように転がしたりすること。","・ ペアで向かい合ったり，的を決めたりして，ボールやフープを真っ直ぐ転がすこと。","○ 用具をくぐるなどの動きで構成される運動遊び","・ 長なわでの大波・小波をしたり，回っているなわをくぐり抜けたりすること。","○ 用具を運ぶなどの動きで構成される運動遊び","・ 友達と背中などでボールをはさんで，いろいろな方向に運ぶこと。","○ 用具を投げる，捕るなどの動きで構成される運動遊び","・ ボールや棒など大きさや種類の異なる用具を片手や両手で投げたり，捕ったりすること。","○ 用具を跳ぶなどの動きで構成される運動遊び","・ 短なわを揺らしたり，回旋したりしながら前や後ろの連続両足跳びをすること。","○ 用具に乗るなどの動きで構成される運動遊び","・ 足場の低い易しい竹馬などに乗り，歩くこと。","◎ 運動遊びが苦手な児童への配慮の例","・ 回す，転がすなど用具を操作することが苦手な児童には，ボールやフープなど用具の大きさ，柔らかさ，重さを変えて操作しやすくするなどの配慮をする。","・ 用具を投げる，捕るなどの動きが苦手な児童には，新聞紙を丸めた球や新聞紙で作った棒，スポンジのボールなど，恐怖心を感じにくい用具を用いたり，紙鉄砲を用いた遊びを取り入れたりするなどの配慮をする。","・ なわを跳んだり，くぐったりすることが苦手な児童には，跳び越す位置や動き方を示したり，かけ声によってタイミングを合わせることができるようにしたりするなどの配慮をする。","(ｴ) 力試しの運動遊び","人を押す，引く，運ぶ，支えるなどしたり，力比べをしたりするなどの動きで構成される運動遊びを通して，力を出しきったり，力を入れたり緩めたりする力試しの動きを身に付けることができるようにする。","［例示］","○ 人を押す，引く動きや力比べをするなどの動きで構成される運動遊び","・ すもう遊びで相手を押し出したり，引き合い遊びで引き動かしたりすること。","・ なわを引いたり，緩めたりしながら力の出し入れを調整し，力比べをすること。","○ 人を運ぶ，支えるなどの動きで構成される運動遊び","・ 友達をいろいろな方向に引きずったり，おんぶをしたりすること。","・ 腕立て伏臥の姿勢から自己の体を支え，手や足を支点として回ること。","◎ 運動遊びが苦手な児童への配慮の例","・ すもう遊びや力比べが苦手な児童には，力を入れたり緩めたりする行い方について助言したり，力を加減するタイミングをつかめるように声をかけたりするなどの配慮をする。","・ 友達を引きずったり，おんぶをしたりする動きが苦手な児童には，補助を受けながら行ったり，動く距離を短くしたりするなどの配慮をする。","・ 体を支える動きが苦手な児童には，肘を曲げずに手の平で地面や床を押したり，目線を地面や床と平行にしたりすることができるよう助言するなどの配慮をする。"]}},"taiiku-12-B-0":{"page":44,"name":"器械・器具を使っての運動遊び","expl":{"intro":["低学年の器械・器具を使っての運動遊びは，「固定施設を使った運動遊び」，「マットを使った運動遊び」，「鉄棒を使った運動遊び」及び「跳び箱を使った運動遊び」で構成され，様々な動きに挑戦し，それらができる楽しさに触れることのできる運動遊びである。","低学年では，器械・器具を使っての運動遊びの楽しさに触れ，その行い方を知るとともに，回転，支持，逆さの姿勢，ぶら下がり，振動，手足での移動などの基本的な動きや技能を身に付けるようにし，中学年の器械運動の学習につなげていくことが求められる。","また，運動遊びを楽しく行うために，簡単な遊び方を工夫するとともに，きまりを守り誰とでも仲よく運動遊びをしたり，場や器械・器具の安全に気を付けたりすることなどができるようにすることが大切である。"],"k":["ア 固定施設を使った運動遊び","固定施設を使った運動遊びでは，その行い方を知るとともに，ジャングルジムや雲梯，登り棒，肋木，平均台などで，いろいろな登り下りやぶら下がりをしたり，懸垂移行をしたり，渡り歩きや跳び下りをしたり，逆さの姿勢をとったりするなどして遊ぶこと。","［例示］","○ ジャングルジムを使った運動遊び","・ 登り下り，渡り歩き，逆さの姿勢などをすること。","○ 雲梯を使った運動遊び","・ 懸垂移行や渡り歩きなどをすること。","○ 登り棒を使った運動遊び","・ 登り下りや逆さの姿勢などをすること。","○ 肋木を使った運動遊び","・ 登り下りや懸垂移行，腕立て移動などをすること。","○ 平均台を使った運動遊び","・ 渡り歩きや跳び下りなどをすること。","◎ 運動遊びが苦手な児童への配慮の例","・ ジャングルジムを使った運動遊びで，登ることが苦手な児童には，低い場所に音の鳴る教具を付けることで登ることへの興味を喚起したり，低い場所を横に移動したりして，高さに慣れるようにするなどの配慮をする。","・ 雲梯を使った運動遊びで，体を揺らして移動することが苦手な児童には，体を支えて移動できるように補助をしたり，少し斜めを向いた姿勢で片手ずつ動かして移動できるように助言したりして，懸垂の姿勢と体の揺れを使って移動できる動きが身に付くようにするなどの配慮をする。","・ 登り棒を使った運動遊びで，足が滑って登ることが苦手な児童には，ハチマキなどを巻いて節をつくり，足が滑らないようにするなどの配慮をする。","・ 肋木を使った運動遊びで，ぶら下がって移動することが苦手な児童には，足を上げてポーズをとったり，足を振ってみたりするなど，ぶら下がってできる運動遊びをしたり，手で支えて移動することが苦手な児童には，高さごとに色分けした場で，同じ色の高さを横に歩いたり，色の違う高さに登ったり移動したりできるようにして，取り組みやすい場にするなどの配慮をする。","・ 平均台を使った運動遊びで，バランスを保つことが苦手な児童には，床のライン上で姿勢よく体重移動ができるように歩いたり，高さのあるところでは手をつないだりするなどの配慮をする。","イ マットを使った運動遊び","マットを使った運動遊びでは，その行い方を知るとともに，マットに背中や腹などをつけていろいろな方向に転がったり，手や背中で支えて逆立ちをしたり，体を反らせたりするなどして遊ぶこと。","［例示］","○ ゆりかご，前転がり，後ろ転がり，だるま転がり，丸太転がりなど","・ マットに背中や腹をつけて揺れたり，いろいろな方向に転がったりすること。","○ 背支持倒立（首倒立），うさぎ跳び，かえるの足打ち，かえるの逆立ち，壁登り逆立ち，支持での川跳び，腕立て横跳び越し，ブリッジなど","・ 手や背中で体を支えていろいろな姿勢で逆立ちしたり，移動したり，体を反らしてブリッジをしたり，友達がつくったブリッジをくぐったりすること。","◎ 運動遊びが苦手な児童への配慮の例","・ 前や後ろへ転がることが苦手な児童には，体を丸めて揺れるゆりかごに取り組んだり，傾斜のある場で勢いよく転がるように取り組んだりして，転がるための体の動かし方が身に付くように練習の仕方や場を設定するなどの配慮をする。","・ 手で体を支えて移動することが苦手な児童には，手や足を移動する場所や目線の先にマークを置くなどして，支持で移動できる体の動かし方が身に付くように教具や場を設定するなどの配慮をする。","ウ 鉄棒を使った運動遊び","鉄棒を使った運動遊びでは，その行い方を知るとともに，鉄棒を使って，手や腹，膝で支持したり，ぶら下がったり，揺れたり，跳び上がったり，跳び下りたり，易しい回転をしたりするなどして遊ぶこと。","［例示］","○ ふとん干しやこうもり，さる，ぶたの丸焼き","・ 腹や膝，手でぶら下がったり，揺れたりすること。","○ ツバメ","・ 体を伸ばし手で支えバランスをとって止まること。","○ 跳び上がりや跳び下り","・ 跳び上がって支持して下りたり，支持の姿勢で体を揺らして後ろに跳び下りたりすること。","○ 易しい回転","・ 支持の姿勢から体を丸めて前に回って下りたり，両手でぶら下がって前後に足抜き回りをしたりすること。","◎ 運動遊びが苦手な児童への配慮の例","・ 体を揺らすことが苦手な児童には，腕や頭を動かして反動をつけたり，補助を受けて体を軽く揺らしたりして，揺れるための体の動かし方が身に付くようにするなどの配慮をする。","・ 鉄棒上で支えたりバランスをとることが苦手な児童には，伸ばす部位を助言したり，支持しているときの目線の先を示したりして，バランスをとる動きが身に付くようにするなどの配慮をする。","・ 跳び上がることが苦手な児童には，台などを設置して，支持や跳び上がりなどを行いやすい場を設定するなどの配慮をする。","・ 回転することが苦手な児童には，腹を掛けて揺れたり，補助や補助具などを使って回転したりして，体を丸めて勢いよく回転する体の動かし方が身に付くようにするなどの配慮をする。","エ 跳び箱を使った運動遊び","跳び箱を使った運動遊びでは，その行い方を知るとともに，跳び箱を使って跳び乗りや跳び下りをしたり，馬跳びやタイヤ跳びをしたりするなどして遊ぶこと。","［例示］","○ 踏み越し跳び","・ 片足で踏み切って跳び箱に跳び乗ったり，ジャンプをして跳び下りたりすること。","○ 支持でまたぎ乗り・またぎ下り，支持で跳び乗り・跳び下り","・ 数歩の助走から両足で踏み切り，跳び箱に両手を着いてまたぎ乗ったり，またいだ姿勢で手を支点に体重を移動させてまたぎ下りたりすること。","・ 数歩の助走から両足で踏み切り，跳び箱に両手を着いて両足で跳び乗ったり，ジャンプをして跳び下りたりすること。","○ 馬跳び，タイヤ跳び","・ 両手で支持してまたぎ越すこと。","◎ 運動遊びが苦手な児童への配慮の例","・ 踏み越し跳びや手を着いてのまたぎ乗りやまたぎ下り，手を着いての跳び乗りや跳び下りが苦手な児童には，高さを低くしたり，跳び箱の手前に台を置いて跳び乗りやすくしたりして，手で支えたり，跳んだりする動きが身に付くように場を設定するなどの配慮をする。","・ 馬跳びやタイヤ跳びが苦手な児童には，床でうさぎ跳びやかえるの足打ち，かえるの逆立ちなどを行い，手で支えたり，跳んだりする動きが身に付くようにするなどの配慮をする。"],"s":["ア  固定施設を使った運動遊びやマットを使った運動遊び，鉄棒を使った運動遊び，跳び箱を使った運動遊びの簡単な遊び方を選ぶこと。","○ 運動遊びの場や遊び方を選ぶ工夫の例","・ それぞれの固定施設を使って，ぶら下がったり，逆さの姿勢になったりするなどのいろいろな姿勢をとったり，鬼ごっこやじゃんけんをして登り下りしたりするなど，楽しくできる場や遊び方を選ぶこと。","・ マットを使った運動遊びでは，坂道やジグザグなどの複数のコースでいろいろな方向に転がることができるような場を選んだり，動物に変身して腕で支えながら移動したり，逆さまになったりする運動遊びの中から，動物の動きを選んだりすること。","・ 鉄棒を使った運動遊びでは，手や足，腹でぶら下がった姿勢でじゃんけんをしたり，支持して体を揺らして遠くへ跳ぶ競争をしたりするなど，楽しくできる遊び方を選ぶこと。","・ 跳び箱を使った運動遊びでは，走って跳び乗った後，手を叩いたり，回ったりして着地するなど，いろいろな着地の仕方を選ぶこと。","イ 友達のよい動きを見付けたり，考えたりしたことを友達に伝えること。","○ 友達のよい動きを伝える例","・ 友達のよい動きを擬態語や擬音語で表現したり，学習カードに書いたりすること。"],"m":["ア  ぶら下がったり，逆さまになったりするなどのいろいろな姿勢をして遊んだり，動物の真似をして腕で支えながら移動したり，転がったりするなど，器械・器具を使っての運動遊びに進んで取り組むこと。","イ  器械・器具を使ったいろいろな運動遊びをする際に，順番やきまりを守り，誰とでも仲よくすること。","ウ 器械・器具の準備や片付けを，友達と一緒にすること。","エ  転がったり，跳び下りたりするときなどに，危ないものが無いか，近くに人がいないか，マットや跳び箱などの器械・器具が安全に置かれているかなどの場の安全に気を付けること。","◎ 運動遊びに意欲的でない児童への配慮の例","・ 怖くて運動遊びに取り組めない児童には，器械・器具の高さを変えたり，痛くないように配慮した場を設定したりして，条件を変えた場を複数設定して選択できるようにするなどの配慮をする。","・ 自信がもてない児童には，成功回数が多くなる簡単な運動遊びを取り入れたり，できたことを称賛したりして，肯定的な働きかけができるようにするなどの配慮をする。","・ 恥ずかしがる児童には，二人組で手をつないで跳び下りたり，集団で転がったりできる運動遊びを取り入れたりして，友達と一緒に運動遊びをする楽しさに触れることができるようにするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア 固定施設を使った運動遊び","固定施設を使った運動遊びでは，その行い方を知るとともに，ジャングルジムや雲梯，登り棒，肋木，平均台などで，いろいろな登り下りやぶら下がりをしたり，懸垂移行をしたり，渡り歩きや跳び下りをしたり，逆さの姿勢をとったりするなどして遊ぶこと。","［例示］","○ ジャングルジムを使った運動遊び","・ 登り下り，渡り歩き，逆さの姿勢などをすること。","○ 雲梯を使った運動遊び","・ 懸垂移行や渡り歩きなどをすること。","○ 登り棒を使った運動遊び","・ 登り下りや逆さの姿勢などをすること。","○ 肋木を使った運動遊び","・ 登り下りや懸垂移行，腕立て移動などをすること。","○ 平均台を使った運動遊び","・ 渡り歩きや跳び下りなどをすること。","◎ 運動遊びが苦手な児童への配慮の例","・ ジャングルジムを使った運動遊びで，登ることが苦手な児童には，低い場所に音の鳴る教具を付けることで登ることへの興味を喚起したり，低い場所を横に移動したりして，高さに慣れるようにするなどの配慮をする。","・ 雲梯を使った運動遊びで，体を揺らして移動することが苦手な児童には，体を支えて移動できるように補助をしたり，少し斜めを向いた姿勢で片手ずつ動かして移動できるように助言したりして，懸垂の姿勢と体の揺れを使って移動できる動きが身に付くようにするなどの配慮をする。","・ 登り棒を使った運動遊びで，足が滑って登ることが苦手な児童には，ハチマキなどを巻いて節をつくり，足が滑らないようにするなどの配慮をする。","・ 肋木を使った運動遊びで，ぶら下がって移動することが苦手な児童には，足を上げてポーズをとったり，足を振ってみたりするなど，ぶら下がってできる運動遊びをしたり，手で支えて移動することが苦手な児童には，高さごとに色分けした場で，同じ色の高さを横に歩いたり，色の違う高さに登ったり移動したりできるようにして，取り組みやすい場にするなどの配慮をする。","・ 平均台を使った運動遊びで，バランスを保つことが苦手な児童には，床のライン上で姿勢よく体重移動ができるように歩いたり，高さのあるところでは手をつないだりするなどの配慮をする。"],"イ":["イ マットを使った運動遊び","マットを使った運動遊びでは，その行い方を知るとともに，マットに背中や腹などをつけていろいろな方向に転がったり，手や背中で支えて逆立ちをしたり，体を反らせたりするなどして遊ぶこと。","［例示］","○ ゆりかご，前転がり，後ろ転がり，だるま転がり，丸太転がりなど","・ マットに背中や腹をつけて揺れたり，いろいろな方向に転がったりすること。","○ 背支持倒立（首倒立），うさぎ跳び，かえるの足打ち，かえるの逆立ち，壁登り逆立ち，支持での川跳び，腕立て横跳び越し，ブリッジなど","・ 手や背中で体を支えていろいろな姿勢で逆立ちしたり，移動したり，体を反らしてブリッジをしたり，友達がつくったブリッジをくぐったりすること。","◎ 運動遊びが苦手な児童への配慮の例","・ 前や後ろへ転がることが苦手な児童には，体を丸めて揺れるゆりかごに取り組んだり，傾斜のある場で勢いよく転がるように取り組んだりして，転がるための体の動かし方が身に付くように練習の仕方や場を設定するなどの配慮をする。","・ 手で体を支えて移動することが苦手な児童には，手や足を移動する場所や目線の先にマークを置くなどして，支持で移動できる体の動かし方が身に付くように教具や場を設定するなどの配慮をする。"],"ウ":["ウ 鉄棒を使った運動遊び","鉄棒を使った運動遊びでは，その行い方を知るとともに，鉄棒を使って，手や腹，膝で支持したり，ぶら下がったり，揺れたり，跳び上がったり，跳び下りたり，易しい回転をしたりするなどして遊ぶこと。","［例示］","○ ふとん干しやこうもり，さる，ぶたの丸焼き","・ 腹や膝，手でぶら下がったり，揺れたりすること。","○ ツバメ","・ 体を伸ばし手で支えバランスをとって止まること。","○ 跳び上がりや跳び下り","・ 跳び上がって支持して下りたり，支持の姿勢で体を揺らして後ろに跳び下りたりすること。","○ 易しい回転","・ 支持の姿勢から体を丸めて前に回って下りたり，両手でぶら下がって前後に足抜き回りをしたりすること。","◎ 運動遊びが苦手な児童への配慮の例","・ 体を揺らすことが苦手な児童には，腕や頭を動かして反動をつけたり，補助を受けて体を軽く揺らしたりして，揺れるための体の動かし方が身に付くようにするなどの配慮をする。","・ 鉄棒上で支えたりバランスをとることが苦手な児童には，伸ばす部位を助言したり，支持しているときの目線の先を示したりして，バランスをとる動きが身に付くようにするなどの配慮をする。","・ 跳び上がることが苦手な児童には，台などを設置して，支持や跳び上がりなどを行いやすい場を設定するなどの配慮をする。","・ 回転することが苦手な児童には，腹を掛けて揺れたり，補助や補助具などを使って回転したりして，体を丸めて勢いよく回転する体の動かし方が身に付くようにするなどの配慮をする。"],"エ":["エ 跳び箱を使った運動遊び","跳び箱を使った運動遊びでは，その行い方を知るとともに，跳び箱を使って跳び乗りや跳び下りをしたり，馬跳びやタイヤ跳びをしたりするなどして遊ぶこと。","［例示］","○ 踏み越し跳び","・ 片足で踏み切って跳び箱に跳び乗ったり，ジャンプをして跳び下りたりすること。","○ 支持でまたぎ乗り・またぎ下り，支持で跳び乗り・跳び下り","・ 数歩の助走から両足で踏み切り，跳び箱に両手を着いてまたぎ乗ったり，またいだ姿勢で手を支点に体重を移動させてまたぎ下りたりすること。","・ 数歩の助走から両足で踏み切り，跳び箱に両手を着いて両足で跳び乗ったり，ジャンプをして跳び下りたりすること。","○ 馬跳び，タイヤ跳び","・ 両手で支持してまたぎ越すこと。","◎ 運動遊びが苦手な児童への配慮の例","・ 踏み越し跳びや手を着いてのまたぎ乗りやまたぎ下り，手を着いての跳び乗りや跳び下りが苦手な児童には，高さを低くしたり，跳び箱の手前に台を置いて跳び乗りやすくしたりして，手で支えたり，跳んだりする動きが身に付くように場を設定するなどの配慮をする。","・ 馬跳びやタイヤ跳びが苦手な児童には，床でうさぎ跳びやかえるの足打ち，かえるの逆立ちなどを行い，手で支えたり，跳んだりする動きが身に付くようにするなどの配慮をする。"]}},"taiiku-12-C-0":{"page":50,"name":"走・跳の運動遊び","expl":{"intro":["低学年の走・跳の運動遊びは，「走の運動遊び」及び「跳の運動遊び」で構成され，いろいろなレーンを走ったりリズムよく跳んだりする楽しさに触れることができる運動遊びである。","低学年では，走・跳の運動遊びの楽しさに触れ，その行い方を知るとともに，いろいろな方向へ走ったり，低い障害物を走り越えたり，前方や上方に跳んだり，連続して跳んだりするなどの基本的な動きを身に付けるようにし，中学年の走・跳の運動の学習につなげていくことが求められる。","また，走・跳の運動遊びを楽しく行うために，簡単な遊び方を工夫するとともに，順番やきまりを守り誰とでも仲よく運動遊びをしたり，勝敗を受け入れたり，場の安全に気を付けたりすることなどができるようにすることも大切である。"],"k":["ア 走の運動遊び","走の運動遊びでは，その行い方を知るとともに，距離や方向などを決めて走ったり，手でのタッチやバトンの受渡しをする折り返しリレー遊びをしたり，段ボールや輪などの低い障害物を用いてのリレー遊びをしたりすること。","［例示］","○ 30～40ｍ程度のかけっこ","・ いろいろな形状の線上等を真っ直ぐに走ったり，蛇行して走ったりすること。","○ 折り返しリレー遊び，低い障害物を用いてのリレー遊び","・ 相手の手の平にタッチをしたり，バトンの受渡しをしたりして走ること。","・ いろいろな間隔に並べられた低い障害物を走り越えること。","◎ 運動遊びが苦手な児童への配慮の例","・ かけっこで，リズムよく走ることが苦手な児童には，一定のリズム，速いリズムなど，いろいろなリズムで走ったり，レーン上に目印を置いて，分かりやすいレーンを設定したりするなどの配慮をする。","・ リレー遊びで，バトンを上手に渡したり受けたりすることが苦手な児童には，手で相手の背中にタッチしたり，迎えタッチにしたりするなど，タッチの仕方を変えたり，受渡しがしやすくなるように形状の異なるバトン（リング状のバトン等）を用いるなどの配慮をする。","・ 低い障害物を走り越える運動遊びで，最後まで走り越えることが苦手な児童には，障害物を置く間隔や高さを変えるなどの配慮をする｡","イ 跳の運動遊び","跳の運動遊びでは，その行い方を知るとともに，助走を付けて片足で踏み切り，前方や上方に跳んだり，片足や両足で連続して跳んだりすること。","［例示］","○ 幅跳び遊び","・ 助走を付けて片足でしっかり地面を蹴って前方に跳ぶこと。","○ ケンパー跳び遊び","・ 片足や両足で，いろいろな間隔に並べられた輪等を連続して前方に跳ぶこと。","○ ゴム跳び遊び","・ 助走を付けて片足でしっかり地面を蹴って上方に跳ぶこと。","・ 片足や両足で連続して上方に跳ぶこと。","◎ 運動遊びが苦手な児童への配慮の例","・ 幅跳び遊びで，上手に跳ぶことができない児童には，足を置く位置の目印として輪を置き，リズミカルに跳ぶことのできる場を設定するなどの配慮をする。","・ ケンパー跳び遊びで，上手に跳ぶことができない児童には，「グー」と「パー」が分かりやすい目印をレーン上に設定し，足を置く順番やリズムが分かるようにするなどの配慮をする。","・ ゴム跳び遊びで，高く跳ぶことやしっかりジャンプをすることが苦手な児童には，高さを変えたり，跳ぶ時のリズムを決めたりするなどの配慮をする。"],"s":["ア 走の運動遊びや跳の運動遊びの簡単な遊び方を選ぶこと。","○ 運動遊びの場を選ぶ遊び方の工夫の例","・ 走の運動遊びでは，直線や曲線，ジグザグなどいろいろな運動遊びの場の中から，自己に適した運動遊びの場を選ぶこと。","・ 跳の運動遊びでは，前方や上方に跳ぶ高さや距離，間隔など，いろいろな運動遊びの場の中から，自己に適した運動遊びの場を選ぶこと｡","イ 友達のよい動きを見付けたり，考えたりしたことを友達に伝えること。","○ 学び合ったことを友達に伝える例","・ 活動後に，感想や動きのポイント，友達のよい動きを書いたり，発表したりすること。"],"m":["ア 走の運動遊びや跳の運動遊びに進んで取り組むこと。","イ  かけっこやリレー遊びなどを行う際に，順番やきまりを守り，誰とでも仲よくすること。","ウ かけっこやリレー遊びなどの勝敗を受け入れること｡","エ 運動遊びで使用する用具の準備や片付けを，友達と一緒にすること。","オ  走る場所に危険物が無いか，跳ぶ運動遊びをするときに，友達とぶつからない十分な間隔があるかなどの場の安全に気を付けること。","◎ 運動遊びに意欲的でない児童への配慮の例","・ かけっこでの競走など，競走（争）を好まない児童には，いろいろな走り方や跳び方で勝敗を競わずに楽しめる場を設定したり，行い方を工夫したりするなどの配慮をする。","・ 最後までうまく走ったり跳んだりできないなど，達成感を味わうことが難しい児童には，易しい場や課題を複数準備するなどの配慮をする。","・ 友達同士でうまく関わり合うことができない児童には，見合いや教え合いなど，互いに関わり合いながら学習をするようにしたり，友達同士で学習の成果を認め合ったりする機会を設定するなどの配慮をする。","・ 対人関係をうまく保つことができない児童には，児童の伸びや友達との関わり方を教師が積極的に称賛するなどの配慮をする。"]},"ksub":{"":[],"ア":["ア 走の運動遊び","走の運動遊びでは，その行い方を知るとともに，距離や方向などを決めて走ったり，手でのタッチやバトンの受渡しをする折り返しリレー遊びをしたり，段ボールや輪などの低い障害物を用いてのリレー遊びをしたりすること。","［例示］","○ 30～40ｍ程度のかけっこ","・ いろいろな形状の線上等を真っ直ぐに走ったり，蛇行して走ったりすること。","○ 折り返しリレー遊び，低い障害物を用いてのリレー遊び","・ 相手の手の平にタッチをしたり，バトンの受渡しをしたりして走ること。","・ いろいろな間隔に並べられた低い障害物を走り越えること。","◎ 運動遊びが苦手な児童への配慮の例","・ かけっこで，リズムよく走ることが苦手な児童には，一定のリズム，速いリズムなど，いろいろなリズムで走ったり，レーン上に目印を置いて，分かりやすいレーンを設定したりするなどの配慮をする。","・ リレー遊びで，バトンを上手に渡したり受けたりすることが苦手な児童には，手で相手の背中にタッチしたり，迎えタッチにしたりするなど，タッチの仕方を変えたり，受渡しがしやすくなるように形状の異なるバトン（リング状のバトン等）を用いるなどの配慮をする。","・ 低い障害物を走り越える運動遊びで，最後まで走り越えることが苦手な児童には，障害物を置く間隔や高さを変えるなどの配慮をする｡"],"イ":["イ 跳の運動遊び","跳の運動遊びでは，その行い方を知るとともに，助走を付けて片足で踏み切り，前方や上方に跳んだり，片足や両足で連続して跳んだりすること。","［例示］","○ 幅跳び遊び","・ 助走を付けて片足でしっかり地面を蹴って前方に跳ぶこと。","○ ケンパー跳び遊び","・ 片足や両足で，いろいろな間隔に並べられた輪等を連続して前方に跳ぶこと。","○ ゴム跳び遊び","・ 助走を付けて片足でしっかり地面を蹴って上方に跳ぶこと。","・ 片足や両足で連続して上方に跳ぶこと。","◎ 運動遊びが苦手な児童への配慮の例","・ 幅跳び遊びで，上手に跳ぶことができない児童には，足を置く位置の目印として輪を置き，リズミカルに跳ぶことのできる場を設定するなどの配慮をする。","・ ケンパー跳び遊びで，上手に跳ぶことができない児童には，「グー」と「パー」が分かりやすい目印をレーン上に設定し，足を置く順番やリズムが分かるようにするなどの配慮をする。","・ ゴム跳び遊びで，高く跳ぶことやしっかりジャンプをすることが苦手な児童には，高さを変えたり，跳ぶ時のリズムを決めたりするなどの配慮をする。"]}},"taiiku-12-D-0":{"page":53,"name":"水遊び","expl":{"intro":["低学年の水遊びは，「水の中を移動する運動遊び」及び「もぐる・浮く運動遊び」で構成され，水につかって歩いたり走ったり，水にもぐったり浮いたりする楽しさに触れることができる運動遊びである。","低学年では，水遊びの楽しさに触れ，その行い方を知るとともに，水慣れを通して不安感を取り除き，水の心地よさを味わうことからはじめ，水の中を移動すること，もぐる・浮くことなどの基本的な動きを身に付けるようにし，中学年の水泳運動の学習につなげていくことが求められる。","また，水遊びを楽しく行うために，簡単な遊び方を工夫するとともに，順番やきまりを守り誰とでも仲よく運動遊びをしたり，水遊びの心得を守って安全に気を付けたりすることなどをできるようにすることが大切である。"],"k":["ア 水の中を移動する運動遊び","水の中を移動する運動遊びでは，その行い方を知るとともに，まねっこ遊びやリレー遊びなどで，いろいろな姿勢で歩いたり，自由に方向や速さを変えて走ったりすること。","［例示］","○ 水につかっての水かけっこ，まねっこ遊び","・ 胸まで水につかって大きく息を吸ったり吐いたりすること。","・ 水を手ですくって体のいろいろな部分にかけたり，いろいろな方向に飛ばしたり，友達と水をかけ合ったりすること。","・ 水につかっていろいろな動物（アヒル，カニ，カエル，ワニなど）の真似をしながら歩いたり，腰や膝を伸ばした一直線の姿勢になり手を使って歩いたりすること。","○ 水につかっての電車ごっこ，リレー遊び，鬼遊び","・ 水の抵抗や浮力に負けないように，自由に歩いたり走ったり，方向を変えたりすること。","・ 手で水をかいたり，足でプールの底を力強く蹴ったりジャンプをしたりしながら速く走ること。","◎ 運動遊びが苦手な児童への配慮の例","・ 水かけっこで，顔に水がかかることが苦手な児童には，背中合わせになったり，友達との距離を広げたりするなど，遊び方を工夫するなどの配慮をする。","・ まねっこ遊び（ワニ）で，水面に対して体を水平にした姿勢になり手だけで歩くことが苦手な児童には，より浅い場所で歩いたり，しゃがんだ姿勢でゆっくりと移動したりするなど，段階的な遊び方を工夫するなどの配慮をする。","・ 電車ごっこ，リレー遊び，鬼遊びで，水の抵抗や浮力の影響で歩いたり走ったりすることが苦手な児童には，友達の後ろに続いて移動したり，手で水を力強くかいたりすることを助言するなどの配慮をする。","イ もぐる・浮く運動遊び","もぐる・浮く運動遊びでは，その行い方を知るとともに，石拾いや伏し浮きなどで，息を止めたり吐いたりしながら，いろいろな姿勢でもぐったり浮いたりすること。","［例示］","○ 水中でのじゃんけん，にらめっこ，石拾い，輪くぐりなどのもぐる遊び","・ 水に顔をつけたり，もぐって目を開けたりすること。","・ 水中で息を止めたり吐いたりしながらもぐる遊びをすること。","・ 浮力に負けないように，手や足を使っていろいろな姿勢でもぐること。","○ くらげ浮き，伏し浮き，大の字浮きなど浮く遊び","・ 壁や補助具につかまったり，友達に支えてもらったりして浮くこと。","・ 補助具や友達につかまり，体を伸ばした姿勢にして浮いて進むこと。","・ 息を吸って止め，全身の力を抜いて浮くこと。","○ バブリングやボビング","・ 大きく息を吸ってもぐり，水中で息を止めたり吐いたりすること。","・ 息を止めてもぐり，口や鼻から少しずつ息を吐きながら水面まで跳び上がって息をまとめて吐いた後，空中ですぐに吸ってまたもぐること。","・ 頭の上に手を挙げながら（膝を曲げて）もぐり，手をさげながら（膝を伸ばして）跳び上がる動きを繰り返すこと。","◎ 運動遊びが苦手な児童への配慮の例","・ もぐる遊びで，水に顔をつけることが苦手な児童には，少しずつ顔に水がかかるようにシャワーを浴びたり，顎→口→鼻→目へと徐々に水につける部分を増やしたりするなどの配慮をする。","・ もぐる遊びで，水の浮力を受け，輪をくぐることが苦手な児童には，輪の深さや数を変えたり，二人組でつくった手のトンネルをくぐったりするなどの配慮をする。","・ 浮く遊びで，足が沈み，伏し浮きをすることが苦手な児童には，息を大きく吸って止めたり，顎を引いて頭を水の中につけたり，無駄な力を抜いて体を真っ直ぐにしたりすることを助言するなどの配慮をする。","・ バブリングで，水中で息を吐くことが苦手な児童には，手の平にすくった水を吹き飛ばしたり，水面に浮いたものを吐いた息で移動させたりするなど，顔をつけずに息をまとめて強く吐くことのできる遊びをするなどの配慮をする。","・ ボビングで，動きと呼吸のリズムを合わすことが苦手な児童には，友達と手をつないで一緒にボビングをするなどの場を設定したり，「プクプクプク（弱く吐く），ブハ！（水面を出たら大きく強くまとめて吐く），スゥー（すぐに吸う）」などの呼吸のリズムのイメージができる言葉を助言したりするなどの配慮をする。"],"s":["ア  水の中を移動する運動遊びやもぐる・浮く運動遊びの簡単な遊び方や場を選ぶこと。","○ まねっこをする動物を選ぶ例","・ 動物を選んだり，友達が選んだ動物の動きを取り入れたりすること。","○ 石拾いや輪くぐりの場を選ぶ例","・ 拾う石の数や色を決めたり，輪の置き方（縦・横・斜め）や数，輪を沈める深さなどを変えたりするなど，楽しくできる場や遊び方を選ぶこと。","○ バブリングやボビングを取り入れて遊ぶ工夫の例","・ バブリングでは，水中でのじゃんけんを繰り返したり，水中でいろいろな言葉を伝え合ったりするなど，楽しくできる遊び方を選ぶこと。","・ ボビングでは，一緒にする人数を増やしたり，友達と合わせるタイミングを変えたりするなど，楽しくできる遊び方を選ぶこと。","イ 友達のよい動きを見付けたり，考えたりしたことを友達に伝えること。","○ 水中でのいろいろな歩き方や走り方を友達に伝える例","・ 試した動物の動きや，友達が行った動物のよい動きを伝えること。","・ スムーズに歩いたり走ったりするために，方向や速さを変えるときの手や足の使い方を見付け，友達に伝えること。"],"m":["ア  水につかって動物の真似をしたり鬼遊びをしたり，いろいろな姿勢でもぐったり浮いたりするなど，水遊びに進んで取り組むこと。","イ 水遊びをする際に，順番やきまりを守り，誰とでも仲よくすること。","ウ 水遊びで使用する用具の準備や片付けを，友達と一緒にすること。","エ  準備運動や整理運動をしっかり行う，丁寧にシャワーを浴びる，プールサイドは走らない，プールに飛び込まない，友達とぶつからないように動くなどの水遊びの心得を守ること。また，水遊びをする前には，体（爪，耳，鼻，頭髪等）を清潔にしておくこと。","◎ 運動遊びに意欲的でない児童への配慮の例","・ 水に対する恐怖心がある児童には，安全面からもペアでの学習（バディシステム）を取り入れ，友達と一緒に行う水遊びの楽しさに触れることができるようにしたり，水慣れの時間を十分に確保したり，少しでもできたことを称賛したりするなどの配慮をする。","・ 友達と一緒に水遊びをすることを好まない児童には，友達と協力して一緒に取り組む水遊びを紹介したり，友達同士で互いの動きのよさを認め合う機会を設定したりするなどの配慮をする。","・ 既に初歩的な泳ぎを身に付けている児童には，ワニ歩きで頭までつかりながら行うよう助言し，その動きのよさを全体に伝えたり，石拾いで石の数や色を指定して（連続して行うボビングの回数を指定して）児童にとってより適した課題を提示したりするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア 水の中を移動する運動遊び","水の中を移動する運動遊びでは，その行い方を知るとともに，まねっこ遊びやリレー遊びなどで，いろいろな姿勢で歩いたり，自由に方向や速さを変えて走ったりすること。","［例示］","○ 水につかっての水かけっこ，まねっこ遊び","・ 胸まで水につかって大きく息を吸ったり吐いたりすること。","・ 水を手ですくって体のいろいろな部分にかけたり，いろいろな方向に飛ばしたり，友達と水をかけ合ったりすること。","・ 水につかっていろいろな動物（アヒル，カニ，カエル，ワニなど）の真似をしながら歩いたり，腰や膝を伸ばした一直線の姿勢になり手を使って歩いたりすること。","○ 水につかっての電車ごっこ，リレー遊び，鬼遊び","・ 水の抵抗や浮力に負けないように，自由に歩いたり走ったり，方向を変えたりすること。","・ 手で水をかいたり，足でプールの底を力強く蹴ったりジャンプをしたりしながら速く走ること。","◎ 運動遊びが苦手な児童への配慮の例","・ 水かけっこで，顔に水がかかることが苦手な児童には，背中合わせになったり，友達との距離を広げたりするなど，遊び方を工夫するなどの配慮をする。","・ まねっこ遊び（ワニ）で，水面に対して体を水平にした姿勢になり手だけで歩くことが苦手な児童には，より浅い場所で歩いたり，しゃがんだ姿勢でゆっくりと移動したりするなど，段階的な遊び方を工夫するなどの配慮をする。","・ 電車ごっこ，リレー遊び，鬼遊びで，水の抵抗や浮力の影響で歩いたり走ったりすることが苦手な児童には，友達の後ろに続いて移動したり，手で水を力強くかいたりすることを助言するなどの配慮をする。"],"イ":["イ もぐる・浮く運動遊び","もぐる・浮く運動遊びでは，その行い方を知るとともに，石拾いや伏し浮きなどで，息を止めたり吐いたりしながら，いろいろな姿勢でもぐったり浮いたりすること。","［例示］","○ 水中でのじゃんけん，にらめっこ，石拾い，輪くぐりなどのもぐる遊び","・ 水に顔をつけたり，もぐって目を開けたりすること。","・ 水中で息を止めたり吐いたりしながらもぐる遊びをすること。","・ 浮力に負けないように，手や足を使っていろいろな姿勢でもぐること。","○ くらげ浮き，伏し浮き，大の字浮きなど浮く遊び","・ 壁や補助具につかまったり，友達に支えてもらったりして浮くこと。","・ 補助具や友達につかまり，体を伸ばした姿勢にして浮いて進むこと。","・ 息を吸って止め，全身の力を抜いて浮くこと。","○ バブリングやボビング","・ 大きく息を吸ってもぐり，水中で息を止めたり吐いたりすること。","・ 息を止めてもぐり，口や鼻から少しずつ息を吐きながら水面まで跳び上がって息をまとめて吐いた後，空中ですぐに吸ってまたもぐること。","・ 頭の上に手を挙げながら（膝を曲げて）もぐり，手をさげながら（膝を伸ばして）跳び上がる動きを繰り返すこと。","◎ 運動遊びが苦手な児童への配慮の例","・ もぐる遊びで，水に顔をつけることが苦手な児童には，少しずつ顔に水がかかるようにシャワーを浴びたり，顎→口→鼻→目へと徐々に水につける部分を増やしたりするなどの配慮をする。","・ もぐる遊びで，水の浮力を受け，輪をくぐることが苦手な児童には，輪の深さや数を変えたり，二人組でつくった手のトンネルをくぐったりするなどの配慮をする。","・ 浮く遊びで，足が沈み，伏し浮きをすることが苦手な児童には，息を大きく吸って止めたり，顎を引いて頭を水の中につけたり，無駄な力を抜いて体を真っ直ぐにしたりすることを助言するなどの配慮をする。","・ バブリングで，水中で息を吐くことが苦手な児童には，手の平にすくった水を吹き飛ばしたり，水面に浮いたものを吐いた息で移動させたりするなど，顔をつけずに息をまとめて強く吐くことのできる遊びをするなどの配慮をする。","・ ボビングで，動きと呼吸のリズムを合わすことが苦手な児童には，友達と手をつないで一緒にボビングをするなどの場を設定したり，「プクプクプク（弱く吐く），ブハ！（水面を出たら大きく強くまとめて吐く），スゥー（すぐに吸う）」などの呼吸のリズムのイメージができる言葉を助言したりするなどの配慮をする。"]}},"taiiku-12-E-0":{"page":57,"name":"ゲーム","expl":{"intro":["低学年のゲームは，「ボールゲーム」及び「鬼遊び」で構成され，個人対個人で競い合ったり，集団対集団で競い合ったりする楽しさに触れることができる運動遊びである。","低学年では，ゲームの楽しさに触れ，その行い方を知るとともに，攻めと守りに関する課題を解決するために，簡単なボール操作と攻めや守りの動きによって易しいゲームをしたり，一定の区域で鬼遊びをしたりすることができるようにし，中学年のゲームの学習につなげていくことが求められる。","また，ゲームを楽しく行うために，簡単な遊び方を工夫するとともに，規則を守り誰とでも仲よく運動遊びをしたり，場の安全に気を付けたりすることなどをできるようにすることが大切である。"],"k":["ア ボールゲーム","ボールゲームでは，その行い方を知るとともに，簡単なボール操作と簡単な攻めや守りの動きなどのボールを持たないときの動きによって，コート内で攻守入り交じって，的やゴールに向かってボールを投げたり蹴ったりする簡単な規則で行われる易しいゲーム（ゴール型ゲームに発展），攻めと守りが分かれたコートで，相手コートにボールを投げ入れる簡単な規則で行われる易しいゲーム（ネット型ゲームに発展），攻めと守りを交代しながら，ボールを手などで打ったり，蹴ったりする簡単な規則で行われる易しいゲーム（ベースボール型ゲームに発展）などをすること。","［例示］","○ 的当てゲーム","○ シュートゲーム","○ 相手コートにボールを投げ入れるゲーム","○ 攻めがボールを手などで打ったり蹴ったりして行うゲーム","・ ねらったところに緩やかにボールを転がしたり，投げたり，蹴ったりして，的に当てたり得点したりすること。","・ 相手コートに緩やかにボールを投げ入れたり，捕ったりすること。","・ ボールを捕ったり止めたりすること。","・ ボールが飛んだり，転がったりしてくるコースに入ること。","・ ボールを操作できる位置に動くこと。","◎ 運動遊びが苦手な児童への配慮の例","・ ボールを捕ったり止めたりすることが苦手な児童には，柔らかいボールを用いたり，空気を少し抜いたボールを用いたりするなどの配慮をする。","・ ボールが飛んだり，転がったりしてくるコースに入ることが苦手な児童には，柔らかいボールを用い，１対１でゴールを守る練習をしたりするなどの配慮をする。","・ ボールの勢いに怖さを感じる児童には，柔らかいボールを用いたり，速さの出にくい軽いボールを用いたりするなどの配慮をする。","イ 鬼遊び","鬼遊びでは，その行い方を知るとともに，一定の区域で逃げる，追いかける，陣地を取り合うなどの簡単な規則で鬼遊びをしたり，工夫した区域や用具で鬼遊びをしたりすること。","［例示］","○ 一人鬼，手つなぎ鬼，子増やし鬼","○ 宝取り鬼，ボール運び鬼","・ 相手（鬼）にタッチされたり，マーク（タグやフラッグ）を取られたりしないように，空いている場所を見付けて，速く走ったり，急に曲がったり，身をかわしたりすること。","・ 相手（鬼）のいない場所に移動したり，駆け込んだりすること。","・ 少人数で連携して相手（鬼）をかわしたり，走り抜けたりすること。","・ 逃げる相手を追いかけてタッチしたり，マーク（タグやフラッグ）を取ったりすること。","◎ 運動遊びが苦手な児童への配慮の例","・ 鬼になってなかなか捕まえられない児童には，短い時間で鬼を交代したり，逃げる場所を制限したり，逃げる場所を狭くしたりするなどの配慮をする。","・ 鬼から逃げることが苦手な児童には，安全地帯を設けたり，鬼の人数を一人から徐々に増やしたり，鬼でない児童の人数を増やしたりするなどの配慮をする。","・ 宝取り鬼で，相手の陣地から宝をとるのが苦手な児童には，宝を置く場所や宝の数を増やしたり，鬼の人数を一人から徐々に増やしたり，宝を取りやすいように陣地の形を変えたりするなどの配慮をする。","・ ボール運び鬼で，相手の陣地にボールを運ぶことが苦手な児童には，チーム内での役割が分かるようにしたり，攻めと守りが入り交じる場を制限したり，守りの人数を減らしたり，ボールを運ぶ側の人数を増やしたりするなどの配慮をする。"],"s":["ア ボールゲームや鬼遊びの簡単な遊び方を選ぶこと。","○ ボールゲームや鬼遊びの規則を選ぶ例","・ ボールゲームでは，ゲームの場や規則の中から，楽しくゲームができる場や得点の方法など，自己に適した場や規則を選ぶこと。","・ 鬼遊びでは，提示された簡単な遊び方や規則の中から，楽しく鬼遊びができる場や得点の方法など，自己に適した遊び方や規則を選ぶこと。","イ 友達のよい動きを見付けたり，考えたりしたことを友達に伝えること。","○ ボールを捕ったり止めたりすることについて考えたことを友達に伝える例","・ 易しいボールゲームで，ボールを捕ったり止めたりするときに行った工夫を，動作や言葉で友達に伝えること。","○ ボールが飛んだり，転がったりしてくるコースに入ることについて考えたことを友達に伝える例","・ 易しいボールゲームで，ボールが飛んだり，転がったりしてくるコースに入ることについて，友達のよい動きを動作や言葉で友達に伝えること。","○ 少人数で連携して相手（鬼）をかわしたり，走り抜けたりすることについて考えたことを友達に伝える例","・ 鬼遊びで，少人数で連携して相手（鬼）をかわしたり，走り抜けたりする行い方について，動作や言葉で友達に伝えること。"],"m":["ア ボールゲームや鬼遊びに進んで取り組むこと。","イ  ボールゲームや鬼遊びをする際に，順番や規則を守り，誰とでも仲よくすること。","ウ ボールゲームや鬼遊びの勝敗を受け入れること。","エ  ボールゲームや鬼遊びで使用する用具等の準備や片付けを，友達と一緒にすること。","オ  ボールゲームや鬼遊びを行う際に，危険物が無いか，安全にゲームができるかなどの場の安全に気を付けること。","◎ 運動遊びに意欲的でない児童への配慮の例","・ ボールを捕ることや用具を用いて打つことに対する恐怖心などでボールゲームに意欲的に取り組めない児童には，柔らかいボールを用意したり，大きなボールやゆっくりとした速さになるボールを用意したりするなどの配慮をする。","・ ゲーム中に何をすればよいのかが分からないなどで，ボールゲームや鬼遊びに意欲的に取り組めない児童には，行い方や課題を絵図で説明したり，活動内容を掲示したりするなどの配慮をする。","・ 場や規則が難しいなどで，ボールゲームや鬼遊びに意欲的に取り組めない児童には，場の設定や規則を易しくして児童が取り組みやすくするなどの配慮をする。","・ 新しく提示した動きやゲームが分からないなどでボールゲームや鬼遊びに意欲的に取り組めない児童には，動きをゆっくりと示したり，一緒にそのチームに入ってゲームをしたりするなどの配慮をする。","・ ゲームに勝てなかったり，鬼に捕まりやすかったりするなどでボールゲームや鬼遊びに意欲的に取り組めない児童には，勝敗を受け入れることが大切であることを話したり，安全地帯など場の設定を工夫したりするなどの配慮をする。","・ 友達とうまく関われないためにボールゲームや鬼遊びに意欲的に取り組めない児童には，対戦相手を変えたり，チーム編成を工夫したりするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア ボールゲーム","ボールゲームでは，その行い方を知るとともに，簡単なボール操作と簡単な攻めや守りの動きなどのボールを持たないときの動きによって，コート内で攻守入り交じって，的やゴールに向かってボールを投げたり蹴ったりする簡単な規則で行われる易しいゲーム（ゴール型ゲームに発展），攻めと守りが分かれたコートで，相手コートにボールを投げ入れる簡単な規則で行われる易しいゲーム（ネット型ゲームに発展），攻めと守りを交代しながら，ボールを手などで打ったり，蹴ったりする簡単な規則で行われる易しいゲーム（ベースボール型ゲームに発展）などをすること。","［例示］","○ 的当てゲーム","○ シュートゲーム","○ 相手コートにボールを投げ入れるゲーム","○ 攻めがボールを手などで打ったり蹴ったりして行うゲーム","・ ねらったところに緩やかにボールを転がしたり，投げたり，蹴ったりして，的に当てたり得点したりすること。","・ 相手コートに緩やかにボールを投げ入れたり，捕ったりすること。","・ ボールを捕ったり止めたりすること。","・ ボールが飛んだり，転がったりしてくるコースに入ること。","・ ボールを操作できる位置に動くこと。","◎ 運動遊びが苦手な児童への配慮の例","・ ボールを捕ったり止めたりすることが苦手な児童には，柔らかいボールを用いたり，空気を少し抜いたボールを用いたりするなどの配慮をする。","・ ボールが飛んだり，転がったりしてくるコースに入ることが苦手な児童には，柔らかいボールを用い，１対１でゴールを守る練習をしたりするなどの配慮をする。","・ ボールの勢いに怖さを感じる児童には，柔らかいボールを用いたり，速さの出にくい軽いボールを用いたりするなどの配慮をする。"],"イ":["イ 鬼遊び","鬼遊びでは，その行い方を知るとともに，一定の区域で逃げる，追いかける，陣地を取り合うなどの簡単な規則で鬼遊びをしたり，工夫した区域や用具で鬼遊びをしたりすること。","［例示］","○ 一人鬼，手つなぎ鬼，子増やし鬼","○ 宝取り鬼，ボール運び鬼","・ 相手（鬼）にタッチされたり，マーク（タグやフラッグ）を取られたりしないように，空いている場所を見付けて，速く走ったり，急に曲がったり，身をかわしたりすること。","・ 相手（鬼）のいない場所に移動したり，駆け込んだりすること。","・ 少人数で連携して相手（鬼）をかわしたり，走り抜けたりすること。","・ 逃げる相手を追いかけてタッチしたり，マーク（タグやフラッグ）を取ったりすること。","◎ 運動遊びが苦手な児童への配慮の例","・ 鬼になってなかなか捕まえられない児童には，短い時間で鬼を交代したり，逃げる場所を制限したり，逃げる場所を狭くしたりするなどの配慮をする。","・ 鬼から逃げることが苦手な児童には，安全地帯を設けたり，鬼の人数を一人から徐々に増やしたり，鬼でない児童の人数を増やしたりするなどの配慮をする。","・ 宝取り鬼で，相手の陣地から宝をとるのが苦手な児童には，宝を置く場所や宝の数を増やしたり，鬼の人数を一人から徐々に増やしたり，宝を取りやすいように陣地の形を変えたりするなどの配慮をする。","・ ボール運び鬼で，相手の陣地にボールを運ぶことが苦手な児童には，チーム内での役割が分かるようにしたり，攻めと守りが入り交じる場を制限したり，守りの人数を減らしたり，ボールを運ぶ側の人数を増やしたりするなどの配慮をする。"]}},"taiiku-12-F-0":{"page":61,"name":"表現リズム遊び","expl":{"intro":["低学年の表現リズム遊びは，「表現遊び」及び「リズム遊び」で内容が構成され，身近な題材の特徴を捉えてそのものになりきって全身の動きで表現したり，軽快なリズムの音楽に乗って踊ったりする楽しさに触れることのできる運動遊びであるとともに，友達と様々な動きを見付けて踊ったり，みんなで調子を合わせて踊ったりする楽しさに触れることのできる運動遊びである。","低学年では，表現リズム遊びの楽しさに触れ，その行い方を知るとともに，表現遊びとリズム遊びの両方の遊びを豊かに体験する中で，即興的な身体表現能力やリズムに乗って踊る能力，コミュニケーション能力などを培えるようにし，中学年の表現運動の学習につなげていくことが求められる。","また，表現リズム遊びを楽しく行うために，簡単な踊り方を工夫するとともに，誰とでも仲よく踊ったり，場の安全に気を付けたりすることなどをできるようにすることが大切である。","なお，リズム遊びには，中学年のリズムダンスと高学年のフォークダンスへのつながりを考慮して，簡単なフォークダンスを軽快なリズムに乗って踊る内容に含めて指導することができることを「内容の取扱い」に示した。"],"k":["ア 表現遊び","表現遊びでは，その行い方を知るとともに，身近な題材の特徴を捉え，そのものになりきって全身で即興的に踊ること。","身近な題材とは，低学年の児童の発達の段階に応じて，動物や乗り物など，身近で関心が高く，特徴が捉えやすくて具体的な動きを多く含む題材として示している。それらの題材の特徴を捉えて，跳ぶ，回る，ねじる，這う，素早く走るなどの全身の動きで，そのものになりきって即興的に踊ること。","［題材と動きの例示］","○ 鳥，昆虫，恐竜，動物園の動物など，特徴が捉えやすく多様な感じの動きを多く含む題材","○ 飛行機，遊園地の乗り物，おもちゃなど，特徴が捉えやすく速さに変化のある動きを多く含む題材","・ 「〇〇が〇〇しているところ」（サルが木登りしたり木から木へ跳び移ったりする，カマキリが獲物にゆっくりと近づいていったり戦ったりする，飛行機が旋回したり急降下したりする，コーヒーカップがゆっくりと回ったり速く回ったりする）など，いろいろな題材の特徴や様子を具体的な動きで幾つか捉え，跳ぶ，回る，ねじる，這う，素早く走る，高・低の差や速さに変化のある動きなどの全身の動きで即興的に踊ること。","・ 動きの中に「大変だ！○○だ！」（池に落ちた，サメが襲ってくる，急カーブの連続だ，こわれちゃった）など，急変する場面を入れて簡単な話にして続けて踊ること。","◎ 運動遊びが苦手な児童への配慮の例","・ 題材の特徴を捉えて踊ることが苦手な児童には，ねじったり回ったり，跳んだり転がったりして全身の動きで特徴を捉えている友達の動きを見合い，真似をすることができるなどの配慮をする。","・ 続けて踊ることが苦手な児童には，「大変だ！〇〇だ！」の複数の例示から選べるようにするなどの配慮をする。","イ リズム遊び","リズム遊びでは，その行い方を知るとともに，軽快なリズムの音楽に乗って弾んで踊ったり，友達と調子を合わせたりして即興的に踊ること。","軽快なリズムに乗って踊るとは，スキップで弾んで踊れる軽快なリズムの曲を取り上げ，へそ（体幹部）を中心にリズムに乗って踊ったり，友達と調子を合わせて即興的に踊ったりすること。","［リズムと動きの例示］","○ 弾んで踊れるロックやサンバなどの軽快なリズムの曲で児童にとって身近で関心の高い曲","・ へそ（体幹部）でリズムに乗って，スキップなどで弾む動きを中心に，ねじる，回る，移動するなどの動きを繰り返して即興的に踊ること。","・ 友達と向かい合って手をつなぎ，スキップしながら回ったり，ねじったり，手を叩き合ったりして即興的に踊ること。","◎ 運動遊びが苦手な児童への配慮の例","・ リズムに乗って踊ることが苦手な児童には，友達や教師の動きの真似をしながら，リズムに合わせてスキップで弾んだり，かけ声や手拍子を入れたりして踊るなどの配慮をする。","・ 友達と関わって踊ることが苦手な児童には，教師を含めた数人で手をつなぎ，簡単な動きで弾んだり，回ったり，移動したりして一緒に踊るなどの配慮をする。","※ 「内容の取扱い」で示されているフォークダンスを含めて指導する場合は，その場ですぐ覚えて踊ることができる易しい踊りを取り上げ，スキップやランニングなどの簡単なステップで，音楽に合わせてみんなで踊ること。","［踊りの例示］","○ ジェンカ（フィンランド)，キンダーポルカ（ドイツ)，タタロチカ（ロシア)など，軽快なリズムと易しいステップの繰り返しで構成される簡単なフォークダンス","・ ジェンカは，前の人の肩に手を置いて列になって踊るところが特徴的な踊り。軽やかに体を弾ませながら踊ること。","・ キンダーポルカは，易しいステップと指さしの動きが特徴的な踊り。パートナーと調子を合わせて踊ること。","・ タタロチカは，一重円で軽快な足の動きとかけ声が特徴的な踊り。大きなかけ声をかけながら軽快に踊ること。"],"s":["ア  身近な題材の特徴を捉えて踊ったり，軽快なリズムに乗って踊ったりする表現遊びやリズム遊びの簡単な踊り方を工夫すること。","○ 題材の特徴にふさわしい様子や動きを選んだり見付けたりする例","・ 題材の特徴的な様子を出し合い，その中から行いたい様子を選んだり，それにふさわしい動きを見付けたり，友達の動きを取り入れたりすること。","○ リズムの特徴を捉えた動きを選んだり見付けたりする例","・ 軽快なリズムの特徴を捉えた動きを選んだり，気に入った動きを見付けたり，友達の動きを取り入れたりすること。","イ よい動きを見付けたり，考えたりしたことを友達に伝えること。","○ 表現遊びで見付けた気に入った動きを友達に伝える例","・ 題材の特徴を捉えて踊った後に，一番気に入った様子や動きを友達に伝える。","○ リズム遊びで友達のよい動きを伝える例","・ へそ（体幹部）を中心に全身で弾んでリズムに乗っている動き，変化のある動きなど，友達のよい動きについて発表する。"],"m":["ア  題材になりきって踊ったり，軽快なリズムに乗って踊ったりする運動遊びに進んで取り組むこと。","イ 表現遊びやリズム遊びに取り組む際に，誰とでも仲よくすること。","ウ  表現リズム遊びをする場の設定や使った用具の片付けを，友達と一緒にすること。","エ 友達とぶつからないように周りの安全に気を付けて踊ること。","◎ 運動遊びに意欲的でない児童への配慮の例","・ 題材から表したい様子や動きを思い浮かべることに意欲的に取り組めない児童には，単元の導入でその題材に関連する絵本や図鑑などを提示し，題材についての興味や関心を高めるなどの配慮をする。","・ リズムに乗って踊ることに意欲的に取り組めない児童には，その児童にとって身近で関心があり，自然に体を弾ませたくなるような選曲をするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア 表現遊び","表現遊びでは，その行い方を知るとともに，身近な題材の特徴を捉え，そのものになりきって全身で即興的に踊ること。","身近な題材とは，低学年の児童の発達の段階に応じて，動物や乗り物など，身近で関心が高く，特徴が捉えやすくて具体的な動きを多く含む題材として示している。それらの題材の特徴を捉えて，跳ぶ，回る，ねじる，這う，素早く走るなどの全身の動きで，そのものになりきって即興的に踊ること。","［題材と動きの例示］","○ 鳥，昆虫，恐竜，動物園の動物など，特徴が捉えやすく多様な感じの動きを多く含む題材","○ 飛行機，遊園地の乗り物，おもちゃなど，特徴が捉えやすく速さに変化のある動きを多く含む題材","・ 「〇〇が〇〇しているところ」（サルが木登りしたり木から木へ跳び移ったりする，カマキリが獲物にゆっくりと近づいていったり戦ったりする，飛行機が旋回したり急降下したりする，コーヒーカップがゆっくりと回ったり速く回ったりする）など，いろいろな題材の特徴や様子を具体的な動きで幾つか捉え，跳ぶ，回る，ねじる，這う，素早く走る，高・低の差や速さに変化のある動きなどの全身の動きで即興的に踊ること。","・ 動きの中に「大変だ！○○だ！」（池に落ちた，サメが襲ってくる，急カーブの連続だ，こわれちゃった）など，急変する場面を入れて簡単な話にして続けて踊ること。","◎ 運動遊びが苦手な児童への配慮の例","・ 題材の特徴を捉えて踊ることが苦手な児童には，ねじったり回ったり，跳んだり転がったりして全身の動きで特徴を捉えている友達の動きを見合い，真似をすることができるなどの配慮をする。","・ 続けて踊ることが苦手な児童には，「大変だ！〇〇だ！」の複数の例示から選べるようにするなどの配慮をする。"],"イ":["イ リズム遊び","リズム遊びでは，その行い方を知るとともに，軽快なリズムの音楽に乗って弾んで踊ったり，友達と調子を合わせたりして即興的に踊ること。","軽快なリズムに乗って踊るとは，スキップで弾んで踊れる軽快なリズムの曲を取り上げ，へそ（体幹部）を中心にリズムに乗って踊ったり，友達と調子を合わせて即興的に踊ったりすること。","［リズムと動きの例示］","○ 弾んで踊れるロックやサンバなどの軽快なリズムの曲で児童にとって身近で関心の高い曲","・ へそ（体幹部）でリズムに乗って，スキップなどで弾む動きを中心に，ねじる，回る，移動するなどの動きを繰り返して即興的に踊ること。","・ 友達と向かい合って手をつなぎ，スキップしながら回ったり，ねじったり，手を叩き合ったりして即興的に踊ること。","◎ 運動遊びが苦手な児童への配慮の例","・ リズムに乗って踊ることが苦手な児童には，友達や教師の動きの真似をしながら，リズムに合わせてスキップで弾んだり，かけ声や手拍子を入れたりして踊るなどの配慮をする。","・ 友達と関わって踊ることが苦手な児童には，教師を含めた数人で手をつなぎ，簡単な動きで弾んだり，回ったり，移動したりして一緒に踊るなどの配慮をする。","※ 「内容の取扱い」で示されているフォークダンスを含めて指導する場合は，その場ですぐ覚えて踊ることができる易しい踊りを取り上げ，スキップやランニングなどの簡単なステップで，音楽に合わせてみんなで踊ること。","［踊りの例示］","○ ジェンカ（フィンランド)，キンダーポルカ（ドイツ)，タタロチカ（ロシア)など，軽快なリズムと易しいステップの繰り返しで構成される簡単なフォークダンス","・ ジェンカは，前の人の肩に手を置いて列になって踊るところが特徴的な踊り。軽やかに体を弾ませながら踊ること。","・ キンダーポルカは，易しいステップと指さしの動きが特徴的な踊り。パートナーと調子を合わせて踊ること。","・ タタロチカは，一重円で軽快な足の動きとかけ声が特徴的な踊り。大きなかけ声をかけながら軽快に踊ること。"]}},"taiiku-34-A-0":{"page":70,"name":"体つくり運動","expl":{"intro":["中学年の体つくり運動は，「体ほぐしの運動」及び「多様な動きをつくる運動」で構成され，体を動かす楽しさや心地よさを味わうとともに，低学年で学習した様々な基本的な体の動きに加えて，更に多様な動きを身に付けたり，動きの質を高めたりする運動である。","中学年では，低学年での体つくりの運動遊びの学習を踏まえ，手軽な運動を行うことを通して自己の心と体の状態に気付いたり，みんなで関わり合ったりするとともに，多様な動きをつくる運動の行い方を知り，体のバランス，体の移動，用具の操作，力試しの様々な動き及びそれらを組み合わせた動きを身に付け，様々な基本的な体の動きの幅を更に広げていくとともに，動きの質を高め，高学年の体つくり運動の学習につなげることが求められる。","また，運動を楽しく行うために，友達の動きを見たり，話し合ったりしながら自己の課題を見付け，その解決のための活動を工夫し，それを友達に伝えるとともに，体つくり運動に進んで取り組み，きまりを守り誰とでも仲よく運動をし，友達の考えを認め，場や用具の安全に気を付けることなどをできるようにすることが大切である。","なお，固定施設を使った運動は，低学年では「器械・器具を使っての運動遊び」の内容として示しているが，体の基本的な動きを培う運動としても適していることから，中学年においては「多様な動きをつくる運動」の例として示している。"],"k":["ア 体ほぐしの運動","体ほぐしの運動では，その行い方を知るとともに，手軽な運動を行い，体を動かす楽しさや心地よさを味わうことを通して，自己や友達の心と体の状態に気付いたり，みんなで豊かに関わり合ったりすること。","心と体の変化に気付くとは，体を動かすと心も弾み，体の動きが軽快になることや，体の力を抜くと気持ちがよいこと，汗をかいた後は気分もすっきりするなど，運動により心や体が変化することに気付くことである。","みんなで関わり合うとは，運動を通して自他の心と体に違いがあることを知り，誰とでも仲よく協力したり助け合ったりして様々な運動をすると楽しさが増すことや，友達とともに体を動かすと心のつながりを感じ，体を動かすことへの不安が解消されることなどを体験することである。","［行い方の例］","○ 伸び伸びとした動作でボール，なわ，体操棒，フープといった用具などを用いた運動を行うこと。","○ リズムに乗って，心が弾むような動作で運動を行うこと。","○ 動作や人数などの条件を変えて，歩いたり走ったりする運動を行うこと。","○ 伝承遊びや集団による運動を行うこと。","◎ 運動が苦手な児童への配慮の例","・ 伸び伸びとした動作で運動をすることが苦手な児童には，低学年の体ほぐしの運動遊びで行った運動を繰り返し，なじみの深い簡単な運動を行ってみるなどの配慮をする。","・ 心や体の変化に気付くことが苦手な児童には，気持ちや体の変化を表す言葉を示したり，問いかけたりし，自己の心や体の変化に合った言葉のイメージができるようにするなどの配慮をする。","・ 友達と関わり合いながら運動をすることが苦手な児童には，ペアやグループの組み方を考慮し，安心して活動に取り組めるようにするなどの配慮をする。","イ 多様な動きをつくる運動","多様な動きをつくる運動では，その行い方を知るとともに，体のバランスをとったり，移動をしたり，用具を操作したり，力試しをしたりするとともに，それらを組み合わせる運動をすること。","多様な動きをつくる運動は，次の運動で構成される。","(ｱ) 体のバランスをとる運動","(ｲ) 体を移動する運動","(ｳ) 用具を操作する運動","(ｴ) 力試しの運動","(ｵ) 基本的な動きを組み合わせる運動","(ｱ) 体のバランスをとる運動","姿勢や方向，人数を変えて，回る，寝転ぶ，起きる，座る，立つ，渡るなどの動きやバランスを保つ動きで構成される運動を通して，体のバランスをとる動きを身に付けることができるようにする。","［例示］","○ 回るなどの動きで構成される運動","・ 片足を軸にして，回りながら移動すること。","・ 両足でジャンプをして1/2回転，3/4回転，１回転やそれ以上の回転をすること。","○ 寝転ぶ，起きるなどの動きで構成される運動","・ 友達と手をつなぎながら，寝転んだり，転がったり，起きたりすること。","○ 座る，立つなどの動きで構成される運動","・ 友達と手をつないだり，背中合わせになったりしながら，片足で立ったり座ったりすること。","○ 渡るなどの動きで構成される運動","・ 平均台など，少し高さのある器具の上を動物歩きや横歩きなどで渡ること。","○ 体のバランスを保つ動きで構成される運動","・ ケンケンしながら相手のバランスを崩したり，バランスを崩されないようにしたりすること。","・ グループで円陣になり，バランスを崩し合うゲームを行い，友達のバランスを崩しながら両足で踏ん張ってバランスを保持すること。","◎ 運動が苦手な児童への配慮の例","・ 片足を軸にして回りながら移動する動きが苦手な児童には，片足で回ることを連続して行ったり，ケンケンパで半回転をしたりするなどの配慮をする。","・ 渡るなどの動きが苦手な児童には，平面に描いた細い通路や，新聞紙や段ボールなどで作った用具を用いて，広さや高さを易しくした場づくりをするなどの配慮をする。","・ バランスを保つ動きが苦手な児童には，一定の距離をケンケンで進んだり，バランスをとりながら単独で立ったりするなど，易しい動きを示すなどの配慮をする。","(ｲ) 体を移動する運動","姿勢，速さ，リズム，方向などを変えて，這う，歩く，走る，跳ぶ，はねる，登る，下りるなどの動きで構成される運動や，一定の速さでのかけ足などの運動を通して，体を移動する動きを身に付けることができるようにする。","［例示］","○ 這う，歩く，走るなどの動きで構成される運動","・ 物や用具の間を速さ，方向を変えて這ったり，歩いたり，走ったりすること。","○ 跳ぶ，はねるなどの動きで構成される運動","・ 両足で跳び，手足の動作を伴って全身じゃんけんをすること。","・ 速さやリズムの変化を付けたスキップやギャロップをしてはねること。","・ 踏切り方や着地の仕方を変えて，いろいろな跳び方をすること。","○ 登る，下りるなどの動きで構成される運動","・ ジャングルジムや肋木，登り棒などに登ったり，下りたりすること。","○ 一定の速さでのかけ足","・ 無理のない速さでかけ足を３～４分程度続けること。","◎ 運動が苦手な児童への配慮の例","・ 這う，歩く，走るなどの動きが苦手な児童には，広い場所で前や後ろに移動したり，物や用具の間をゆっくりと移動したりするなど易しい条件で行うことができるようにするなどの配慮をする。","・ いろいろな跳び方やはねる動きが苦手な児童には，できる動きやできそうなことを繰り返し行いながら，できる動きを徐々に増やせるようにするなどの配慮をする。","・ 登る，下りるなどの動きが苦手な児童には，肋木や登り棒等に目印を付け，段階的に挑戦していくことができるようにしたり，肋木や登り棒の足元にマットを敷くなどにより，下りやすい場づくりをしたりするなどの配慮をする。","・ 一定の速さで続けて走ることが苦手な児童には，リズムよくしっかりと息を吐きながら，続けることができる速さで行うことを個別に助言するなどの配慮をする。","(ｳ) 用具を操作する運動","用具をつかむ，持つ，降ろす，回す，転がす，くぐる，運ぶ，投げる，捕る，跳ぶ，用具に乗る，跳び越すなどの動きで構成される運動を通して，巧みに用具を操作する動きを身に付けることができるようにする。","［例示］","○ 用具をつかむ，持つ，降ろす，回すなどの動きで構成される運動","・ 大きさや重さの異なるボールやフープなどの用具を片手でつかんで持ち上げたり，回したり，降ろしたりすること。","○ 用具を転がす，くぐる，運ぶなどの動きで構成される運動","・ ボールをねらったところに真っ直ぐ転がすこと。","・ フープを安定して転がし，回転しているフープの中をくぐり抜けたり，片足を入れてステップを踏んだりすること。","・ ボールを両膝や両足首に挟んだり，友達と体で挟んだりして，落とさないように運ぶこと。","○ 用具を投げる，捕る，振るなどの動きで構成される運動","・ 相手に向かってボールや輪を投げたり，投げられたボールや輪を手や足で捕ったりすること。","・ 紙で作った棒やタオルなど，操作しやすい用具を振ったり，投げたりすること。","○ 用具を跳ぶなどの動きで構成される運動","・ 短なわでの前や後ろの連続片足跳びや交差跳びなどをすること。","・ 長なわでの連続回旋跳びをすること。","○ 用具に乗るなどの動きで構成される運動","・ 補助を受けながら竹馬や一輪車に乗ること。","・ 座ったり弾んだりできる大きなボールに乗って，軽く弾んだり転がったりすること。","◎ 運動が苦手な児童への配慮の例","・ 用具をつかむ，転がす，投げるなどが苦手な児童には，用具の大きさや重さ，長さ，柔らかさなどを変えて動きを易しくするなどの配慮をする。","・ 用具を捕ることが苦手な児童には，転がったり，弾んだりしたボールを捕るなど，易しい行い方にするなどの配慮をする。","・ 用具を跳ぶ動きが苦手な児童には，踵を上げて跳ぶことや手首の使い方がつかめるよう，用具を持たずにその場で跳んだり，弾みやすい場所で行ったりするなどの配慮をする。","・ 用具に乗るなどの動きが苦手な児童には，二人組や三人組で体を支えて補助をし合ったり，器具等につかまりながら進んだりするなどの配慮をする。","(ｴ) 力試しの運動","人や物を押す，引く，運ぶ，支える，ぶら下がるなどの動きや，力比べをするなどの動きで構成される運動の行い方を知り，力を出し切ったり力の入れ方を加減したりする動きができるようにする。","［例示］","○ 人を押す，引く動きや力比べをするなどの動きで構成される運動","・ 押し合いずもうで，重心を低くして相手を押したり，相手から押されないように踏ん張ったりすること。","・ 重心を低くして相手を引っ張ること。","・ 人数を変えて綱引きをすること。","○ 人を運ぶ，支えるなどの動きで構成される運動","・ 友達をおんぶし，力の入れ方を加減しながら安定して運ぶこと。","・ 手押し車などにより，両腕で体重を支えながら移動したり，相手の様子を見ながら支えたりすること。","○ 物にぶら下がるなどの動きで構成される運動","・ 登り棒や肋木をしっかりと握り，数を数えながら一定の時間ぶら下がったり，ぶら下がりながら友達とじゃんけんをしたりすること。","◎ 運動が苦手な児童への配慮の例","・ 人を押す，引く動きが苦手な児童には，膝を曲げて腰を低くした構えで，安定した姿勢で行えるようにするなどの配慮をする。","・ 人を運ぶ，支える動きが苦手な児童には，補助を受けながらゆっくりと動いたり，手のひらでしっかりと地面や床を押し付けたりして行うことができるようにするなどの配慮をする。","(ｵ) 基本的な動きを組み合わせる運動","バランスをとりながら移動する，用具を操作しながら移動するなど二つ以上の動きを同時に行ったり，連続して行ったりする運動を通して，基本的な動きの組み合わせた動きを身に付けることができるようにする。","［例示］","○ バランスをとりながら移動するなどの動きで構成される運動","・ 物を持ったりかついだりして，バランスをとりながら歩いたり走ったりすること。","○ 用具を操作しながら移動するなどの動きで構成される運動","・ 短なわで跳びながら，歩いたり走ったりすること。","・ フープを回しながら歩いたり走ったり，フープを転がし，転がるフープの中をくぐり抜けたり，跳び越したりすること。","・ ボールを投げ上げ，その場で回ったり移動したりして，投げ上げたボールを落とさないように捕ること。","・ ペアで各々が立てたり回したりしたフープや棒をすばやく相手と場所を入れ替わって捕らえること。","○ 用具を操作しながらバランスをとるなどの動きで構成される運動","・ 回旋する長なわを跳びながら，ボールを捕ったり投げたり，ついたりすること。","◎ 運動が苦手な児童への配慮の例","・ 物を持ったりかついだりして，バランスをとりながら移動することが苦手な児童には，物を持たずに移動，または小さい物を持って移動するなどの簡単な動きから始めるようにするなどの配慮をする。","・ 回旋する長なわを跳びながらボールを操作することが苦手な児童には，止めた長なわを跳び越しながら操作したり，ボールを持ったまま回旋する長なわを跳んだりするなど，基本的な動きの習熟を図りながら組み合わせた動きに高めていけるようにするなどの配慮をする。","・ ボールを投げ上げ，移動して捕ることが苦手な児童には，友達に投げ上げてもらったボールを移動して捕るなど，行い方を変えるなどの配慮をする。","・ ペアになり，各々が立てたり回したりしたフープや棒をすばやく相手と場所を入れ替わって捕らえることが苦手な児童には，ペアとの距離を調整したり，易しいフープや棒を用いるなどの配慮をする。"],"s":["ア  体ほぐしの運動や多様な動きをつくる運動について自己の課題を見付け，その課題を解決するために様々な運動の行い方を選んだり，友達と一緒に工夫したりすること。","○ 心地よさを味わえる運動を選んだり，楽しく運動をしながら基本的な動きを高めるための課題を見付けたりする例","・ 掲示物等に示された運動の行い方の中から，心も弾み，体の動きが軽快になる運動や，体を動かすと心のつながりを感じる運動の行い方を選ぶこと。","・ 用具の操作の仕方や行う人数など，より楽しく運動ができ，体の様々な動きを身に付けることができる行い方を選ぶこと。","・ 基本的な動きを高めるために友達の運動の行い方と自己の行い方とを比べるなどして，自己の課題を見付けること。","○ 運動の楽しさや心地よさを味わったり，様々な基本的な体の動きを身に付けたりするために行い方を選ぶ例","・ これまでに行った運動の中から更に行ってみたい運動を選び，人数や用具などの条件を変え，新たな運動の行い方を選ぶこと。","・ 友達と声を出して動きを合わせるなど，リズムやタイミングを合わせる行い方を選ぶこと。","・ 友達の行い方の真似をしたりそれを修正したりしながら，自己に適した動き方を選ぶこと。","イ  楽しく運動をしながら心と体の変化に気付いたことや，友達と関わり合ったり，多様な動きを身に付けたりするための運動の行い方について，考えたことや見付けたことを友達に伝えること。","○ 運動の楽しさや心地よさを味わい，基本的な動きを身に付けるために考えたり，見付けたりしたことを友達に伝える例","・ これまでの学習で経験した運動の中から選んだ，みんなで行うと楽しくなる運動を友達に紹介すること。","・ 基本的な動きを身に付けるための運動のポイントや行い方について，友達と考え合う際に，自己の気付きを発表したり，大切だと感じたことを友達に教えたりすること。","・ 体を動かすと心が軽くなることや体の力を抜くと気持ちがよいこと，運動の仕方によって気持ちが変わることなどの気付きや，行ってみて楽しかったことなどを学習カードに書いたり，発表したりすること。"],"m":["ア 体ほぐしの運動や多様な動きをつくる運動に進んで取り組むこと。","イ 運動を行う際にきまりを守り，誰とでも仲よく励まし合うこと。","ウ 使用する用具の準備や片付けを，友達と一緒にすること。","エ 友達の考えを認めたり，互いの気持ちを尊重し合ったりしようとすること。オ  活動の場の危険物を取り除いたり，用具や活動する場の安全を確かめたりすること。","◎ 運動に意欲的でない児童への配慮の例","・ 運動の行い方が分からないために意欲的に取り組めない児童には，友達の様子を見ながら，その真似をして体を動かし徐々に運動に加わることができるようにするなどの配慮をする。","・ 友達と関わり合うことが苦手で運動に意欲的に取り組めない児童には，意欲的に取り組む児童とペアやグループを組み，友達の動きに刺激を受けて一緒に様々な運動に挑戦できるようにするなどの配慮をする。","・ 運動への興味や関心がもてず意欲的に取り組めない児童には，体を動かしたり，みんなで運動をしたりすることのよさを個別に語ったり，易しい運動の行い方や場の設定，BGMなど環境の工夫をし，少しでも取り組もうとする行動を称賛したり，励ましたりするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア 体ほぐしの運動","体ほぐしの運動では，その行い方を知るとともに，手軽な運動を行い，体を動かす楽しさや心地よさを味わうことを通して，自己や友達の心と体の状態に気付いたり，みんなで豊かに関わり合ったりすること。","心と体の変化に気付くとは，体を動かすと心も弾み，体の動きが軽快になることや，体の力を抜くと気持ちがよいこと，汗をかいた後は気分もすっきりするなど，運動により心や体が変化することに気付くことである。","みんなで関わり合うとは，運動を通して自他の心と体に違いがあることを知り，誰とでも仲よく協力したり助け合ったりして様々な運動をすると楽しさが増すことや，友達とともに体を動かすと心のつながりを感じ，体を動かすことへの不安が解消されることなどを体験することである。","［行い方の例］","○ 伸び伸びとした動作でボール，なわ，体操棒，フープといった用具などを用いた運動を行うこと。","○ リズムに乗って，心が弾むような動作で運動を行うこと。","○ 動作や人数などの条件を変えて，歩いたり走ったりする運動を行うこと。","○ 伝承遊びや集団による運動を行うこと。","◎ 運動が苦手な児童への配慮の例","・ 伸び伸びとした動作で運動をすることが苦手な児童には，低学年の体ほぐしの運動遊びで行った運動を繰り返し，なじみの深い簡単な運動を行ってみるなどの配慮をする。","・ 心や体の変化に気付くことが苦手な児童には，気持ちや体の変化を表す言葉を示したり，問いかけたりし，自己の心や体の変化に合った言葉のイメージができるようにするなどの配慮をする。","・ 友達と関わり合いながら運動をすることが苦手な児童には，ペアやグループの組み方を考慮し，安心して活動に取り組めるようにするなどの配慮をする。"],"イ":["イ 多様な動きをつくる運動","多様な動きをつくる運動では，その行い方を知るとともに，体のバランスをとったり，移動をしたり，用具を操作したり，力試しをしたりするとともに，それらを組み合わせる運動をすること。","多様な動きをつくる運動は，次の運動で構成される。","(ｱ) 体のバランスをとる運動","(ｲ) 体を移動する運動","(ｳ) 用具を操作する運動","(ｴ) 力試しの運動","(ｵ) 基本的な動きを組み合わせる運動","(ｱ) 体のバランスをとる運動","姿勢や方向，人数を変えて，回る，寝転ぶ，起きる，座る，立つ，渡るなどの動きやバランスを保つ動きで構成される運動を通して，体のバランスをとる動きを身に付けることができるようにする。","［例示］","○ 回るなどの動きで構成される運動","・ 片足を軸にして，回りながら移動すること。","・ 両足でジャンプをして1/2回転，3/4回転，１回転やそれ以上の回転をすること。","○ 寝転ぶ，起きるなどの動きで構成される運動","・ 友達と手をつなぎながら，寝転んだり，転がったり，起きたりすること。","○ 座る，立つなどの動きで構成される運動","・ 友達と手をつないだり，背中合わせになったりしながら，片足で立ったり座ったりすること。","○ 渡るなどの動きで構成される運動","・ 平均台など，少し高さのある器具の上を動物歩きや横歩きなどで渡ること。","○ 体のバランスを保つ動きで構成される運動","・ ケンケンしながら相手のバランスを崩したり，バランスを崩されないようにしたりすること。","・ グループで円陣になり，バランスを崩し合うゲームを行い，友達のバランスを崩しながら両足で踏ん張ってバランスを保持すること。","◎ 運動が苦手な児童への配慮の例","・ 片足を軸にして回りながら移動する動きが苦手な児童には，片足で回ることを連続して行ったり，ケンケンパで半回転をしたりするなどの配慮をする。","・ 渡るなどの動きが苦手な児童には，平面に描いた細い通路や，新聞紙や段ボールなどで作った用具を用いて，広さや高さを易しくした場づくりをするなどの配慮をする。","・ バランスを保つ動きが苦手な児童には，一定の距離をケンケンで進んだり，バランスをとりながら単独で立ったりするなど，易しい動きを示すなどの配慮をする。","(ｲ) 体を移動する運動","姿勢，速さ，リズム，方向などを変えて，這う，歩く，走る，跳ぶ，はねる，登る，下りるなどの動きで構成される運動や，一定の速さでのかけ足などの運動を通して，体を移動する動きを身に付けることができるようにする。","［例示］","○ 這う，歩く，走るなどの動きで構成される運動","・ 物や用具の間を速さ，方向を変えて這ったり，歩いたり，走ったりすること。","○ 跳ぶ，はねるなどの動きで構成される運動","・ 両足で跳び，手足の動作を伴って全身じゃんけんをすること。","・ 速さやリズムの変化を付けたスキップやギャロップをしてはねること。","・ 踏切り方や着地の仕方を変えて，いろいろな跳び方をすること。","○ 登る，下りるなどの動きで構成される運動","・ ジャングルジムや肋木，登り棒などに登ったり，下りたりすること。","○ 一定の速さでのかけ足","・ 無理のない速さでかけ足を３～４分程度続けること。","◎ 運動が苦手な児童への配慮の例","・ 這う，歩く，走るなどの動きが苦手な児童には，広い場所で前や後ろに移動したり，物や用具の間をゆっくりと移動したりするなど易しい条件で行うことができるようにするなどの配慮をする。","・ いろいろな跳び方やはねる動きが苦手な児童には，できる動きやできそうなことを繰り返し行いながら，できる動きを徐々に増やせるようにするなどの配慮をする。","・ 登る，下りるなどの動きが苦手な児童には，肋木や登り棒等に目印を付け，段階的に挑戦していくことができるようにしたり，肋木や登り棒の足元にマットを敷くなどにより，下りやすい場づくりをしたりするなどの配慮をする。","・ 一定の速さで続けて走ることが苦手な児童には，リズムよくしっかりと息を吐きながら，続けることができる速さで行うことを個別に助言するなどの配慮をする。","(ｳ) 用具を操作する運動","用具をつかむ，持つ，降ろす，回す，転がす，くぐる，運ぶ，投げる，捕る，跳ぶ，用具に乗る，跳び越すなどの動きで構成される運動を通して，巧みに用具を操作する動きを身に付けることができるようにする。","［例示］","○ 用具をつかむ，持つ，降ろす，回すなどの動きで構成される運動","・ 大きさや重さの異なるボールやフープなどの用具を片手でつかんで持ち上げたり，回したり，降ろしたりすること。","○ 用具を転がす，くぐる，運ぶなどの動きで構成される運動","・ ボールをねらったところに真っ直ぐ転がすこと。","・ フープを安定して転がし，回転しているフープの中をくぐり抜けたり，片足を入れてステップを踏んだりすること。","・ ボールを両膝や両足首に挟んだり，友達と体で挟んだりして，落とさないように運ぶこと。","○ 用具を投げる，捕る，振るなどの動きで構成される運動","・ 相手に向かってボールや輪を投げたり，投げられたボールや輪を手や足で捕ったりすること。","・ 紙で作った棒やタオルなど，操作しやすい用具を振ったり，投げたりすること。","○ 用具を跳ぶなどの動きで構成される運動","・ 短なわでの前や後ろの連続片足跳びや交差跳びなどをすること。","・ 長なわでの連続回旋跳びをすること。","○ 用具に乗るなどの動きで構成される運動","・ 補助を受けながら竹馬や一輪車に乗ること。","・ 座ったり弾んだりできる大きなボールに乗って，軽く弾んだり転がったりすること。","◎ 運動が苦手な児童への配慮の例","・ 用具をつかむ，転がす，投げるなどが苦手な児童には，用具の大きさや重さ，長さ，柔らかさなどを変えて動きを易しくするなどの配慮をする。","・ 用具を捕ることが苦手な児童には，転がったり，弾んだりしたボールを捕るなど，易しい行い方にするなどの配慮をする。","・ 用具を跳ぶ動きが苦手な児童には，踵を上げて跳ぶことや手首の使い方がつかめるよう，用具を持たずにその場で跳んだり，弾みやすい場所で行ったりするなどの配慮をする。","・ 用具に乗るなどの動きが苦手な児童には，二人組や三人組で体を支えて補助をし合ったり，器具等につかまりながら進んだりするなどの配慮をする。","(ｴ) 力試しの運動","人や物を押す，引く，運ぶ，支える，ぶら下がるなどの動きや，力比べをするなどの動きで構成される運動の行い方を知り，力を出し切ったり力の入れ方を加減したりする動きができるようにする。","［例示］","○ 人を押す，引く動きや力比べをするなどの動きで構成される運動","・ 押し合いずもうで，重心を低くして相手を押したり，相手から押されないように踏ん張ったりすること。","・ 重心を低くして相手を引っ張ること。","・ 人数を変えて綱引きをすること。","○ 人を運ぶ，支えるなどの動きで構成される運動","・ 友達をおんぶし，力の入れ方を加減しながら安定して運ぶこと。","・ 手押し車などにより，両腕で体重を支えながら移動したり，相手の様子を見ながら支えたりすること。","○ 物にぶら下がるなどの動きで構成される運動","・ 登り棒や肋木をしっかりと握り，数を数えながら一定の時間ぶら下がったり，ぶら下がりながら友達とじゃんけんをしたりすること。","◎ 運動が苦手な児童への配慮の例","・ 人を押す，引く動きが苦手な児童には，膝を曲げて腰を低くした構えで，安定した姿勢で行えるようにするなどの配慮をする。","・ 人を運ぶ，支える動きが苦手な児童には，補助を受けながらゆっくりと動いたり，手のひらでしっかりと地面や床を押し付けたりして行うことができるようにするなどの配慮をする。","(ｵ) 基本的な動きを組み合わせる運動","バランスをとりながら移動する，用具を操作しながら移動するなど二つ以上の動きを同時に行ったり，連続して行ったりする運動を通して，基本的な動きの組み合わせた動きを身に付けることができるようにする。","［例示］","○ バランスをとりながら移動するなどの動きで構成される運動","・ 物を持ったりかついだりして，バランスをとりながら歩いたり走ったりすること。","○ 用具を操作しながら移動するなどの動きで構成される運動","・ 短なわで跳びながら，歩いたり走ったりすること。","・ フープを回しながら歩いたり走ったり，フープを転がし，転がるフープの中をくぐり抜けたり，跳び越したりすること。","・ ボールを投げ上げ，その場で回ったり移動したりして，投げ上げたボールを落とさないように捕ること。","・ ペアで各々が立てたり回したりしたフープや棒をすばやく相手と場所を入れ替わって捕らえること。","○ 用具を操作しながらバランスをとるなどの動きで構成される運動","・ 回旋する長なわを跳びながら，ボールを捕ったり投げたり，ついたりすること。","◎ 運動が苦手な児童への配慮の例","・ 物を持ったりかついだりして，バランスをとりながら移動することが苦手な児童には，物を持たずに移動，または小さい物を持って移動するなどの簡単な動きから始めるようにするなどの配慮をする。","・ 回旋する長なわを跳びながらボールを操作することが苦手な児童には，止めた長なわを跳び越しながら操作したり，ボールを持ったまま回旋する長なわを跳んだりするなど，基本的な動きの習熟を図りながら組み合わせた動きに高めていけるようにするなどの配慮をする。","・ ボールを投げ上げ，移動して捕ることが苦手な児童には，友達に投げ上げてもらったボールを移動して捕るなど，行い方を変えるなどの配慮をする。","・ ペアになり，各々が立てたり回したりしたフープや棒をすばやく相手と場所を入れ替わって捕らえることが苦手な児童には，ペアとの距離を調整したり，易しいフープや棒を用いるなどの配慮をする。"]}},"taiiku-34-B-0":{"page":79,"name":"器械運動","expl":{"intro":["中学年の器械運動は，「マット運動」，「鉄棒運動」及び「跳び箱運動」で構成され，回転したり，支持したり，逆位になったり，懸垂したりすることなどの技に挑戦し，その技ができる楽しさや喜びに触れることのできる運動である。","低学年の器械・器具を使っての運動遊びの学習を踏まえ，中学年では，器械運動の楽しさや喜びに触れ，その行い方を知るとともに，マット運動，鉄棒運動，跳び箱運動などの基本的な動きや技を身に付けるようにし，高学年の器械運動の学習につなげていくことが求められる。","また，運動を楽しく行うために，自己の課題を見付け，その解決のための活動を工夫するとともに，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や器械・器具の安全に気を付けたりすることなどをできるようにすることが大切である。"],"k":["基本的な技とは，類似する技のグループの中で，最も初歩的で易しい技でありながら，グループの技に共通する技術的な課題をもっていて，当該学年で身に付けておきたい技のことである。","ア マット運動","マット運動では，その行い方を知るとともに，自己の能力に適した回転系（前転など）や巧技系（壁倒立など）の基本的な技をすること。また，基本的な技に十分に取り組んだ上で，それらの発展技に取り組んだり，技を繰り返したり組み合わせたりすること。","［ 背中をマットに接して回転する（接転技群）回転系の基本的な前転グループ技の例示］","○ 前転（発展技：開脚前転）","・ しゃがんだ姿勢から手で支えながら腰を上げ，体を丸めながら後頭部－背中－尻－足裏の順にマットに接して前方に回転して立ち上がること。","○ 易しい場での開脚前転","・ 傾斜をつくった場で両手を着き，腰を高く上げながら後頭部をつき前方へ回転し，膝を伸ばして足を左右に大きく開き，接地するとともに素早く両手を股の近くに着いて膝を伸ばしたまま開脚立ちをすること。","［ 背中をマットに接して回転する（接転技群）回転系の基本的な後転グループ技の例示］","○ 後転","・ しゃがんだ姿勢から体を丸めながら尻－背中－後頭部－足裏の順にマットに接して腰を上げながら後方に回転し，両手で押して立ち上がること。","○ 開脚後転（発展技：伸膝後転）","・ しゃがんだ姿勢から体を丸めながら尻－背中－後頭部－足裏の順にマットに接して腰を上げながら後方に回転し，膝を伸ばして足を左右に大きく開き，両手で押して膝を伸ばしたまま開脚立ちすること。","［ 手や足の支えで回転する（ほん転技群）回転系の基本的な倒立回転グループ技の例示］","○ 補助倒立ブリッジ（発展技：倒立ブリッジ）","・ 二人組の補助者は，実施者が両手をマットに着いて足を振り上げるときに，実施者の背中に手を当て，ブリッジの姿勢をつくりやすいように支えること。","○ 側方倒立回転（発展技：ロンダート）","・ 正面を向き，体を前方へ振り下ろしながら片足を振り上げ，前方に片手ずつ着き，腰を伸ばした姿勢で倒立位を経過し，側方回転しながら片足を振り下ろして起き上がること。","［ 手や足の支えで回転する（ほん転技群）回転系の基本的なはね起きグループ技の例示］","○ 首はね起き（発展技：頭はね起き）","・ 前転を行うように回転し，両肩－背中がマットについたら腕と腰を伸ばし，体を反らせながらはね起きること。","［ バランスをとりながら静止する（平均立ち技群）巧技系の基本的な倒立グループ技の例示］","○ 壁倒立（発展技：補助倒立）","・ 壁に向かって体を前方に振り下ろしながら片足を振り上げ両手を着き，体を真っ直ぐに伸ばして壁に足をもたれかけて倒立すること。","○ 頭倒立","・ 頭と両手で三角形をつくるように，両手を肩幅くらいに着き，頭を三角形の頂点になるようについて，腰の位置を倒立に近付けるように上げながら両足をゆっくりと上に伸ばし逆さの姿勢になること。","◎ 運動が苦手な児童への配慮の例","・ 前転が苦手な児童には，ゆりかごなどの体を揺らす運動遊びや，かえるの逆立ちなどの体を支える運動遊びに取り組んだり，傾斜を利用して回転に勢いをつけて転がりやすくしたりするなどの配慮をする。","・ 易しい場での開脚前転が苦手な児童には，足が曲がらないように太ももに力を入れたり，両足を勢いよく振り下ろしてマットに接地したりして，足の伸ばし方や回転の勢いをつける動きが身に付くようにするなどの配慮をする。","・ 後転が苦手な児童には，ゆりかごなどの体を揺らす運動遊びや，かえるの逆立ちなどの体を支える運動遊びに取り組んだり，傾斜を利用して回転に勢いをつけて転がりやすくしたりして，腰を上げたり，体を支えたり，回転の勢いをつけたりする動きが身に付くようにするなどの配慮をする。","・ 開脚後転が苦手な児童には，足を伸ばしたゆりかごで体を揺らしたり，かえるの逆立ちなどの体を支えたりする運動遊びに取り組んだり，傾斜を利用して回転に勢いをつけて転がりやすくしたりして，足を伸ばしたり，腰を上げたり，体を支えたり，回転の勢いをつけたりする動きが身に付くようにするなどの配慮をする。","・ 補助倒立ブリッジが苦手な児童には，壁登り逆立ちや背支持倒立（首倒立）などの逆さまで体を支える運動遊びに取り組んだり，ブリッジなどの体を反らす運動遊びに取り組んだりして，体を支えたり，逆さまで体を反らしたりする動きが身に付くようにするなどの配慮をする。","・ 側方倒立回転が苦手な児童には，壁登り逆立ちや支持での川跳びなどの体を支えたり，逆さまになる運動遊びに取り組んだり，足を勢いよく振り上げるためにゴムなどを活用したり，補助を受けたりして，腰を伸ばした姿勢で回転できる動きが身に付くようにするなどの配慮をする。","・ 首はね起きが苦手な児童には，壁登り逆立ちや背支持倒立（首倒立）などの逆さまで体を支える運動遊びや，ブリッジなどの体を反らす運動遊びに取り組んだり，腰を上げた仰向けの姿勢からはねてブリッジをしたり，段差を利用して起き上がりやすくしたりして，逆さまで体を支えて体を反らしたり，手でマットを押したり，反動を利用して起き上がる動きが身に付くようにするなどの配慮をする。","・ 壁倒立が苦手な児童には，肋木や壁を活用した運動遊びに取り組んだり，足を勢いよく振り上げるためにゴムなどを活用したりして，体を逆さまにして支えたり，足を勢いよく振り上げたりする動きが身に付くようにするなどの配慮をする。","・ 頭倒立が苦手な児童には，かえるの逆立ちや背支持倒立（首倒立）などの逆さまで体を支える運動遊びに取り組んだり，肋木，壁を活用した運動遊びに取り組んだりして，体を逆さまにして支える動きが身に付くようにするなどの配慮をする。","イ 鉄棒運動","鉄棒運動では，その行い方を知るとともに，自己の能力に適した支持系の基本的な技をすること。また，基本的な技に十分に取り組んだ上で，それらの発展技に取り組んだり，技を繰り返したり組み合わせたりすること。","［ 腹を鉄棒に掛けて前に回る（前方支持回転技群）支持系の基本的な前転グループ技の例示］","○ 前回り下り（発展技：前方支持回転）","・ 支持の姿勢から前方へ上体を大きく振り出して，腰を曲げたまま回転し，両足を揃えて開始した側に着地すること。","○ かかえ込み前回り（発展技：前方支持回転）","・ 支持の姿勢から腰を曲げながら上体を前方へ倒し，手で足を抱え込んで回転すること。","○ 転向前下り（発展技：片足踏み越し下り）","・ 前後開脚の支持の姿勢から前に出した足と同じ側の手を逆手に持ちかえ，反対側の手を放しながら後ろの足を前に出し，逆手に持ちかえた手は握ったままで横向きに着地すること。","［ 足を鉄棒に掛けて前に回る（前方支持回転技群）支持系の基本的な前方足掛け回転グループ技の例示］","○ 膝掛け振り上がり（発展技：膝掛け上がり）","・ 片膝を鉄棒に掛け，腕を曲げて体を鉄棒に引きつけながら，掛けていない足を前後に大きく振動させ，振動に合わせて前方へ回転し手首を返しながら上がること。","○ 前方片膝掛け回転（発展技：前方もも掛け回転）","・ 逆手で鉄棒を持ち，前後開脚の支持の姿勢から前方へ上体を大きく振り出して，膝を掛けて回転し，手首を返しながら前後開脚の支持の姿勢に戻ること。","［ 腹を鉄棒に掛けて後ろに回る（後方支持回転技群）支持系の基本的な後転グループ技の例示］","○ 補助逆上がり（発展技：逆上がり）","・ 補助や補助具を利用した易しい条件の基で，足の振り上げとともに腕を曲げ上体を後方へ倒し，手首を返して鉄棒に上がること。","○ かかえ込み後ろ回り（発展技：後方支持回転）","・ 支持の姿勢から腰を曲げながら上体を後方へ倒し，手で足を抱え込んで回転すること。","［ 足を鉄棒に掛けて後ろに回る（後方支持回転技群）支持系の基本的な後方足掛け回転グループ技の例示］","○ 後方片膝掛け回転（発展技：後方もも掛け回転）","・ 前後開脚の支持の姿勢から後方へ上体と後ろ足を大きく振り出し片膝を掛けて回転し，手首を返しながら前後開脚の支持の姿勢に戻ること。","○ 両膝掛け倒立下り（発展技：両膝掛け振動下り）","・ 鉄棒に両膝を掛けた姿勢から両手を放し，その両手を地面に着いて倒立の姿勢になり，指先の方向へ手で少し歩いて移動し，両膝を鉄棒から外してつま先から下りること。","◎ 運動が苦手な児童への配慮の例","・ 前回り下りが苦手な児童には，ふとん干しなどの鉄棒に腹を掛けて揺れる運動遊びに取り組んだり，補助を受けて回転しやすくしたりして，勢いのつけ方や体を丸めて鉄棒から離さない動きが身に付くようにするなどの配慮をする。","・ かかえ込み前回りが苦手な児童には，ふとん干しの姿勢から足を抱えて揺れたり，支持の姿勢からふとん干しを繰り返したりするなどの鉄棒に腹を掛けて揺れる運動遊びに取り組んだり，補助や補助具で回転しやすくしたりして，勢いのつけ方や体を丸めて鉄棒から離さない動きが身に付くようにするなどの配慮をする。","・ 転向前下りが苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座ったり，台などを設置して足を台上につけて行ったりして，バランスをとる動きが身に付くようにするなどの配慮をする。","・ 膝掛け振り上がりが苦手な児童には，片膝を掛けて大きく振れるように，補助を受けて回転したり，鉄棒に補助具をつけて回転しやすいようにしたりして，振りの勢いを利用して起き上がる動きが身に付くようにするなどの配慮をする。","・ 前方片膝掛け回転が苦手な児童には，鉄棒上に片足を掛けて座ったり，鉄棒に片膝を掛けて揺れたりして，バランスをとって回転を開始する姿勢をつくったり，体を揺らしてから振りの動きを利用して回転したりする動きが身に付くようにするなどの配慮をする。","・ 補助逆上がりが苦手な児童には，ダンゴムシや足抜き回り，ふとん干しから支持の姿勢を繰り返すなどの運動遊びに取り組み，体を鉄棒に引きつけたり，回転したり，腹支持から起き上がる動きが身に付くようにするなどの配慮をする。","・ かかえ込み後ろ回りが苦手な児童には，ふとん干しの姿勢で揺れたり，ふとん干しの姿勢から足を抱えて揺れたりするなどの鉄棒に腹を掛けて揺れる運動遊びに取り組んだり，補助や補助具で回転しやすくしたりして，勢いのつけ方や体を丸めて鉄棒から離さない動きが身に付くようにするなどの配慮をする。","・ 後方片膝掛け回転が苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座って反対側の足を振ったり，鉄棒に片膝を掛けて揺れたりして，バランスをとって回転を開始する姿勢をつくったり，体を揺らしてから振りの動きを利用して回転したりする動きが身に付くようにするなどの配慮をする。","・ 両膝掛け倒立下りが苦手な児童には，こうもりで揺れたり，足抜き回りなどで鉄棒に足を掛けて逆さまでぶら下がったり，揺れたり，懸垂の姿勢から前後に回転したりする運動遊びに取り組み，逆さまで体を動かしたり，鉄棒に足を掛けたりする動きが身に付くようにするなどの配慮をする。","ウ 跳び箱運動","跳び箱運動では，その行い方を知るとともに，自己の能力に適した切り返し系（開脚跳びなど）や回転系（台上前転など）の基本的な技をすること。また，基本的な技に十分に取り組んだ上で，それらの発展技に取り組むこと。","［ 跳び箱上に支持し，回転方向を切り返して跳び越す切り返し系の基本的な切り返し跳びグループ技の例示］","○ 開脚跳び（発展技：かかえ込み跳び）","・ 助走から両足で踏み切り，足を左右に開いて着手し，跳び越えて着地すること。","［ 跳び箱上を回転しながら跳び越す回転系の基本的な回転跳びグループ技の例示］","○ 台上前転（発展技：伸膝台上前転）","・ 助走から両足で踏み切り，腰の位置を高く保って着手し，前方に回転して着地すること。","○ 首はね跳び（発展技：頭はね跳び）","・ 台上前転を行うように回転し，背中が跳び箱についたら腕と腰を伸ばして体を反らせながらはね起きること。","◎ 運動が苦手な児童への配慮の例","・ 開脚跳びが苦手な児童には，マットを数枚重ねた上に跳び箱１段を置いて，手を着きやすくしたり，跳び越しやすくしたりして，踏切り－着手－着地までの動きが身に付くようにするなどの配慮をする。","・ 台上前転が苦手な児童には，マットを数枚重ねた場で前転したり，マット上にテープなどで跳び箱と同じ幅にラインを引いて，速さのある前転をしたり，真っ直ぐ回転する前転をしたりして，腰を上げて回転する動きが身に付くようにするなどの配慮をする。","・ 首はね跳びが苦手な児童には，マットを数枚重ねた場や低く設置した跳び箱，ステージなどを利用して体を反らせてブリッジをしたり，場でつくった段差と補助を利用して首はね起きを行ったりしながら，体を反らしてはねたり，手で押したりする動きが身に付くようにするなどの配慮をする。"],"s":["ア  自己の能力に適した課題を見付け，その課題の解決のための活動を選ぶこと。","○ 学習カードや掲示物を用いて，自己の能力に適した課題を見付ける例","・ 上手くできたところやできなかったところを，学習カードや掲示物などの連続図に目印や色をつけたり，シールを貼ったりして，自己の能力に適した課題を見付けること。","○ 技のできばえを視覚的に振り返って，自己の能力に適した課題を見付ける例","・ 手の着く位置や着地する位置に目印を置くなどして，技のできばえを視覚的に確認して，自己に適した課題を見付けること。","○ 技のできばえを振り返り，自己の能力に適した課題を解決するための活動を選ぶ例","・ 手の着く位置や着地する位置，目線が向く場所などに目印をして，技のできばえを振り返り，自己の能力に適した課題を解決しやすい練習の場を選ぶこと。","イ 課題の解決のために考えたことを友達に伝えること。","○ 見付けたポイントを伝える例","・ つまずいていた技が上手にできた際に，わかったことを言葉で伝えたり，連続図の絵の横に付箋を貼って文字で示したりして伝えること。","○ 目印を置くなどして，友達の技のできばえを伝える例","・ 友達の手の着く位置や着地する位置，目線が向く場所に目印を置いて，動きのできばえを友達に伝えること。"],"m":["ア  回転したり，支持したり，逆位になったりするなど，マット運動や鉄棒運動，跳び箱運動の基本的な技に進んで取り組むこと。","イ  マットや跳び箱，踏切り板などの器械・器具の正しい使い方や試技をする前の待ち方，技を観察するときなどのきまりを守り，誰とでも仲よく励まし合うこと。","ウ 器械・器具の準備や片付けを，友達と一緒にすること。","エ  互いの動きを見合ったり補助をし合ったりして，技がうまくできたときの動き方や気付いたことなどを伝え合う際に，友達の考えを認めること。","オ  場の危険物を取り除いたり，器械・器具の安全を確かめたりするとともに，試技の開始前の安全を確かめること。","◎ 運動に意欲的でない児童への配慮の例","・ 技への恐怖心がある児童には，落ちても痛くないようにマットを敷いたり，回転しやすいように鉄棒に補助具を付けたりして，場を工夫するなどの配慮をする。","・ 技への不安感がある児童には，必要な体の動かし方や運動感覚が身に付くように，低学年で学習した運動遊びに取り組む場を設定するなどの配慮をする。","・ 技に繰り返し取り組もうとしない児童には，着地位置に目印を置いて自己評価をできるようにしたり，ゲーム化した運動遊びにグループで取り組めるようにしたりするなどの配慮をする。","・ 友達とうまく関わって学習することができない児童には，手や足の位置に目印を置いたり，回数を数えたりする役割ができるようにするなどの配慮をする。"]},"ksub":{"":["基本的な技とは，類似する技のグループの中で，最も初歩的で易しい技でありながら，グループの技に共通する技術的な課題をもっていて，当該学年で身に付けておきたい技のことである。"],"ア":["ア マット運動","マット運動では，その行い方を知るとともに，自己の能力に適した回転系（前転など）や巧技系（壁倒立など）の基本的な技をすること。また，基本的な技に十分に取り組んだ上で，それらの発展技に取り組んだり，技を繰り返したり組み合わせたりすること。","［ 背中をマットに接して回転する（接転技群）回転系の基本的な前転グループ技の例示］","○ 前転（発展技：開脚前転）","・ しゃがんだ姿勢から手で支えながら腰を上げ，体を丸めながら後頭部－背中－尻－足裏の順にマットに接して前方に回転して立ち上がること。","○ 易しい場での開脚前転","・ 傾斜をつくった場で両手を着き，腰を高く上げながら後頭部をつき前方へ回転し，膝を伸ばして足を左右に大きく開き，接地するとともに素早く両手を股の近くに着いて膝を伸ばしたまま開脚立ちをすること。","［ 背中をマットに接して回転する（接転技群）回転系の基本的な後転グループ技の例示］","○ 後転","・ しゃがんだ姿勢から体を丸めながら尻－背中－後頭部－足裏の順にマットに接して腰を上げながら後方に回転し，両手で押して立ち上がること。","○ 開脚後転（発展技：伸膝後転）","・ しゃがんだ姿勢から体を丸めながら尻－背中－後頭部－足裏の順にマットに接して腰を上げながら後方に回転し，膝を伸ばして足を左右に大きく開き，両手で押して膝を伸ばしたまま開脚立ちすること。","［ 手や足の支えで回転する（ほん転技群）回転系の基本的な倒立回転グループ技の例示］","○ 補助倒立ブリッジ（発展技：倒立ブリッジ）","・ 二人組の補助者は，実施者が両手をマットに着いて足を振り上げるときに，実施者の背中に手を当て，ブリッジの姿勢をつくりやすいように支えること。","○ 側方倒立回転（発展技：ロンダート）","・ 正面を向き，体を前方へ振り下ろしながら片足を振り上げ，前方に片手ずつ着き，腰を伸ばした姿勢で倒立位を経過し，側方回転しながら片足を振り下ろして起き上がること。","［ 手や足の支えで回転する（ほん転技群）回転系の基本的なはね起きグループ技の例示］","○ 首はね起き（発展技：頭はね起き）","・ 前転を行うように回転し，両肩－背中がマットについたら腕と腰を伸ばし，体を反らせながらはね起きること。","［ バランスをとりながら静止する（平均立ち技群）巧技系の基本的な倒立グループ技の例示］","○ 壁倒立（発展技：補助倒立）","・ 壁に向かって体を前方に振り下ろしながら片足を振り上げ両手を着き，体を真っ直ぐに伸ばして壁に足をもたれかけて倒立すること。","○ 頭倒立","・ 頭と両手で三角形をつくるように，両手を肩幅くらいに着き，頭を三角形の頂点になるようについて，腰の位置を倒立に近付けるように上げながら両足をゆっくりと上に伸ばし逆さの姿勢になること。","◎ 運動が苦手な児童への配慮の例","・ 前転が苦手な児童には，ゆりかごなどの体を揺らす運動遊びや，かえるの逆立ちなどの体を支える運動遊びに取り組んだり，傾斜を利用して回転に勢いをつけて転がりやすくしたりするなどの配慮をする。","・ 易しい場での開脚前転が苦手な児童には，足が曲がらないように太ももに力を入れたり，両足を勢いよく振り下ろしてマットに接地したりして，足の伸ばし方や回転の勢いをつける動きが身に付くようにするなどの配慮をする。","・ 後転が苦手な児童には，ゆりかごなどの体を揺らす運動遊びや，かえるの逆立ちなどの体を支える運動遊びに取り組んだり，傾斜を利用して回転に勢いをつけて転がりやすくしたりして，腰を上げたり，体を支えたり，回転の勢いをつけたりする動きが身に付くようにするなどの配慮をする。","・ 開脚後転が苦手な児童には，足を伸ばしたゆりかごで体を揺らしたり，かえるの逆立ちなどの体を支えたりする運動遊びに取り組んだり，傾斜を利用して回転に勢いをつけて転がりやすくしたりして，足を伸ばしたり，腰を上げたり，体を支えたり，回転の勢いをつけたりする動きが身に付くようにするなどの配慮をする。","・ 補助倒立ブリッジが苦手な児童には，壁登り逆立ちや背支持倒立（首倒立）などの逆さまで体を支える運動遊びに取り組んだり，ブリッジなどの体を反らす運動遊びに取り組んだりして，体を支えたり，逆さまで体を反らしたりする動きが身に付くようにするなどの配慮をする。","・ 側方倒立回転が苦手な児童には，壁登り逆立ちや支持での川跳びなどの体を支えたり，逆さまになる運動遊びに取り組んだり，足を勢いよく振り上げるためにゴムなどを活用したり，補助を受けたりして，腰を伸ばした姿勢で回転できる動きが身に付くようにするなどの配慮をする。","・ 首はね起きが苦手な児童には，壁登り逆立ちや背支持倒立（首倒立）などの逆さまで体を支える運動遊びや，ブリッジなどの体を反らす運動遊びに取り組んだり，腰を上げた仰向けの姿勢からはねてブリッジをしたり，段差を利用して起き上がりやすくしたりして，逆さまで体を支えて体を反らしたり，手でマットを押したり，反動を利用して起き上がる動きが身に付くようにするなどの配慮をする。","・ 壁倒立が苦手な児童には，肋木や壁を活用した運動遊びに取り組んだり，足を勢いよく振り上げるためにゴムなどを活用したりして，体を逆さまにして支えたり，足を勢いよく振り上げたりする動きが身に付くようにするなどの配慮をする。","・ 頭倒立が苦手な児童には，かえるの逆立ちや背支持倒立（首倒立）などの逆さまで体を支える運動遊びに取り組んだり，肋木，壁を活用した運動遊びに取り組んだりして，体を逆さまにして支える動きが身に付くようにするなどの配慮をする。"],"イ":["イ 鉄棒運動","鉄棒運動では，その行い方を知るとともに，自己の能力に適した支持系の基本的な技をすること。また，基本的な技に十分に取り組んだ上で，それらの発展技に取り組んだり，技を繰り返したり組み合わせたりすること。","［ 腹を鉄棒に掛けて前に回る（前方支持回転技群）支持系の基本的な前転グループ技の例示］","○ 前回り下り（発展技：前方支持回転）","・ 支持の姿勢から前方へ上体を大きく振り出して，腰を曲げたまま回転し，両足を揃えて開始した側に着地すること。","○ かかえ込み前回り（発展技：前方支持回転）","・ 支持の姿勢から腰を曲げながら上体を前方へ倒し，手で足を抱え込んで回転すること。","○ 転向前下り（発展技：片足踏み越し下り）","・ 前後開脚の支持の姿勢から前に出した足と同じ側の手を逆手に持ちかえ，反対側の手を放しながら後ろの足を前に出し，逆手に持ちかえた手は握ったままで横向きに着地すること。","［ 足を鉄棒に掛けて前に回る（前方支持回転技群）支持系の基本的な前方足掛け回転グループ技の例示］","○ 膝掛け振り上がり（発展技：膝掛け上がり）","・ 片膝を鉄棒に掛け，腕を曲げて体を鉄棒に引きつけながら，掛けていない足を前後に大きく振動させ，振動に合わせて前方へ回転し手首を返しながら上がること。","○ 前方片膝掛け回転（発展技：前方もも掛け回転）","・ 逆手で鉄棒を持ち，前後開脚の支持の姿勢から前方へ上体を大きく振り出して，膝を掛けて回転し，手首を返しながら前後開脚の支持の姿勢に戻ること。","［ 腹を鉄棒に掛けて後ろに回る（後方支持回転技群）支持系の基本的な後転グループ技の例示］","○ 補助逆上がり（発展技：逆上がり）","・ 補助や補助具を利用した易しい条件の基で，足の振り上げとともに腕を曲げ上体を後方へ倒し，手首を返して鉄棒に上がること。","○ かかえ込み後ろ回り（発展技：後方支持回転）","・ 支持の姿勢から腰を曲げながら上体を後方へ倒し，手で足を抱え込んで回転すること。","［ 足を鉄棒に掛けて後ろに回る（後方支持回転技群）支持系の基本的な後方足掛け回転グループ技の例示］","○ 後方片膝掛け回転（発展技：後方もも掛け回転）","・ 前後開脚の支持の姿勢から後方へ上体と後ろ足を大きく振り出し片膝を掛けて回転し，手首を返しながら前後開脚の支持の姿勢に戻ること。","○ 両膝掛け倒立下り（発展技：両膝掛け振動下り）","・ 鉄棒に両膝を掛けた姿勢から両手を放し，その両手を地面に着いて倒立の姿勢になり，指先の方向へ手で少し歩いて移動し，両膝を鉄棒から外してつま先から下りること。","◎ 運動が苦手な児童への配慮の例","・ 前回り下りが苦手な児童には，ふとん干しなどの鉄棒に腹を掛けて揺れる運動遊びに取り組んだり，補助を受けて回転しやすくしたりして，勢いのつけ方や体を丸めて鉄棒から離さない動きが身に付くようにするなどの配慮をする。","・ かかえ込み前回りが苦手な児童には，ふとん干しの姿勢から足を抱えて揺れたり，支持の姿勢からふとん干しを繰り返したりするなどの鉄棒に腹を掛けて揺れる運動遊びに取り組んだり，補助や補助具で回転しやすくしたりして，勢いのつけ方や体を丸めて鉄棒から離さない動きが身に付くようにするなどの配慮をする。","・ 転向前下りが苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座ったり，台などを設置して足を台上につけて行ったりして，バランスをとる動きが身に付くようにするなどの配慮をする。","・ 膝掛け振り上がりが苦手な児童には，片膝を掛けて大きく振れるように，補助を受けて回転したり，鉄棒に補助具をつけて回転しやすいようにしたりして，振りの勢いを利用して起き上がる動きが身に付くようにするなどの配慮をする。","・ 前方片膝掛け回転が苦手な児童には，鉄棒上に片足を掛けて座ったり，鉄棒に片膝を掛けて揺れたりして，バランスをとって回転を開始する姿勢をつくったり，体を揺らしてから振りの動きを利用して回転したりする動きが身に付くようにするなどの配慮をする。","・ 補助逆上がりが苦手な児童には，ダンゴムシや足抜き回り，ふとん干しから支持の姿勢を繰り返すなどの運動遊びに取り組み，体を鉄棒に引きつけたり，回転したり，腹支持から起き上がる動きが身に付くようにするなどの配慮をする。","・ かかえ込み後ろ回りが苦手な児童には，ふとん干しの姿勢で揺れたり，ふとん干しの姿勢から足を抱えて揺れたりするなどの鉄棒に腹を掛けて揺れる運動遊びに取り組んだり，補助や補助具で回転しやすくしたりして，勢いのつけ方や体を丸めて鉄棒から離さない動きが身に付くようにするなどの配慮をする。","・ 後方片膝掛け回転が苦手な児童には，ツバメの姿勢から鉄棒上に片足を掛けて座って反対側の足を振ったり，鉄棒に片膝を掛けて揺れたりして，バランスをとって回転を開始する姿勢をつくったり，体を揺らしてから振りの動きを利用して回転したりする動きが身に付くようにするなどの配慮をする。","・ 両膝掛け倒立下りが苦手な児童には，こうもりで揺れたり，足抜き回りなどで鉄棒に足を掛けて逆さまでぶら下がったり，揺れたり，懸垂の姿勢から前後に回転したりする運動遊びに取り組み，逆さまで体を動かしたり，鉄棒に足を掛けたりする動きが身に付くようにするなどの配慮をする。"],"ウ":["ウ 跳び箱運動","跳び箱運動では，その行い方を知るとともに，自己の能力に適した切り返し系（開脚跳びなど）や回転系（台上前転など）の基本的な技をすること。また，基本的な技に十分に取り組んだ上で，それらの発展技に取り組むこと。","［ 跳び箱上に支持し，回転方向を切り返して跳び越す切り返し系の基本的な切り返し跳びグループ技の例示］","○ 開脚跳び（発展技：かかえ込み跳び）","・ 助走から両足で踏み切り，足を左右に開いて着手し，跳び越えて着地すること。","［ 跳び箱上を回転しながら跳び越す回転系の基本的な回転跳びグループ技の例示］","○ 台上前転（発展技：伸膝台上前転）","・ 助走から両足で踏み切り，腰の位置を高く保って着手し，前方に回転して着地すること。","○ 首はね跳び（発展技：頭はね跳び）","・ 台上前転を行うように回転し，背中が跳び箱についたら腕と腰を伸ばして体を反らせながらはね起きること。","◎ 運動が苦手な児童への配慮の例","・ 開脚跳びが苦手な児童には，マットを数枚重ねた上に跳び箱１段を置いて，手を着きやすくしたり，跳び越しやすくしたりして，踏切り－着手－着地までの動きが身に付くようにするなどの配慮をする。","・ 台上前転が苦手な児童には，マットを数枚重ねた場で前転したり，マット上にテープなどで跳び箱と同じ幅にラインを引いて，速さのある前転をしたり，真っ直ぐ回転する前転をしたりして，腰を上げて回転する動きが身に付くようにするなどの配慮をする。","・ 首はね跳びが苦手な児童には，マットを数枚重ねた場や低く設置した跳び箱，ステージなどを利用して体を反らせてブリッジをしたり，場でつくった段差と補助を利用して首はね起きを行ったりしながら，体を反らしてはねたり，手で押したりする動きが身に付くようにするなどの配慮をする。"]}},"taiiku-34-C-0":{"page":87,"name":"走・跳の運動","expl":{"intro":["中学年の走・跳の運動は，「走の運動」及び「跳の運動」で構成され，調子よく走ったり，バトンの受渡しをしたり，小型ハードルを走り越えたりする楽しさや喜びに触れることができる運動である。","低学年の走・跳の運動遊びの学習を踏まえ，中学年では，走・跳の運動の楽しさや喜びに触れ，その行い方を知るとともに，かけっこ・リレー，小型ハードル走，幅跳び，高跳びなどの基本的な動きや技能を身に付けるようにし，高学年の陸上運動の学習につなげていくことが求められる。","また，運動を楽しく行うために，自己の課題を見付け，その解決のための活動を工夫するとともに，きまりを守り誰とでも仲よく運動をしたり，勝敗を受け入れたり，友達の考えを認めたり，場や用具の安全に気を付けたりできるようにすることが大切である。"],"k":["ア かけっこ・リレー","かけっこ・リレーでは，その行い方を知るとともに，距離を決めて調子よく最後まで走ったり，走りながらバトンの受渡しをする周回リレーをしたりすること。","［例示］","○ 30～50ｍ程度のかけっこ","・ いろいろな走り出しの姿勢から，素早く走り始めること。","・ 真っ直ぐ前を見て，腕を前後に大きく振って走ること。","○ 周回リレー（一人が走る距離30～50ｍ程度）","・ 走りながら，タイミングよくバトンの受渡しをすること。","・ コーナーの内側に体を軽く傾けて走ること。","◎ 運動が苦手な児童への配慮の例","・ かけっこで，スタートが苦手な児童には，立った姿勢からだけでなくいろいろな姿勢から素早く走ったり，スタート位置を変えて競走したりするなどの配慮をする。","・ 周回リレーで，タイミングよくバトンを受渡すことが苦手な児童には，追いかけ走やコーナー走で受渡しをするなどの配慮をする。","イ 小型ハードル走","小型ハードル走では，その行い方を知るとともに，小型ハードルを自己に合ったリズムで走り越えること。","［例示］","○ いろいろなリズムでの小型ハードル走","・ インターバルの距離や小型ハードルの高さに応じたいろいろなリズムで小型ハードルを走り越えること。","○ 30～40ｍ程度の小型ハードル走","・ 一定の間隔に並べられた小型ハードルを一定のリズムで走り越えること。","◎ 運動が苦手な児童への配慮の例","・ 一定のリズムで小型ハードルを走り越えることが苦手な児童には，インターバルの異なる複数のレーンを設定し選べるようにしたり，いろいろな材質の小型ハードル（ゴムを張った小型ハードルや段ボールを用いたハードル等）を使用したりするなどの配慮をする。","ウ 幅跳び","幅跳びでは，その行い方を知るとともに，短い助走から強く踏み切って遠くへ跳ぶこと。","［例示］","○ 短い助走からの幅跳び","・ ５～７歩程度の助走から踏切り足を決めて前方に強く踏み切り，遠くへ跳ぶこと。","・ 膝を柔らかく曲げて，両足で着地すること。","◎ 運動が苦手な児童への配慮の例","・ 踏切り足が定まらず，強く前方へ跳ぶことが苦手な児童には，３～５歩など，短い助走による幅跳びをしたり，「トン・トン・ト・ト・トン」など，一定のリズムの助走からの幅跳びを行ったりする場を設定するなどの配慮をする。","エ 高跳び","高跳びでは，その行い方を知るとともに，短い助走から強く踏み切って高く跳ぶこと。","［例示］","○ 短い助走からの高跳び","・ ３～５歩程度の短い助走から踏切り足を決めて上方に強く踏み切り，高く跳ぶこと。","・ 膝を柔らかく曲げて，足から着地すること。","◎ 運動が苦手な児童への配慮の例","・ 踏切り足が定まらず，強く上方へ跳ぶことが苦手な児童には，３歩など，短い助走による高跳びをしたり，「トン・トン・ト・ト・トン」など，一定のリズムの助走からの高跳びを行ったりする場を設定するなどの配慮をする。"],"s":["ア 自己の課題を見付け，その課題の解決のための活動を選ぶこと。","○ ICT機器を活用して自己の課題を見付ける例","・ 自己の走・跳の運動の様子をタブレットやデジタルカメラなどのICT機器を活用して確認し，動きのポイントと照らし合わせて自己の課題を見付けること。","○ 自己に応じた課題の解決のための練習の場を選ぶ例","・ 踏切り位置に輪を置くなど，動きのポイントについて見合ったり教え合ったりしやすくなるような練習の場を選ぶこと。","イ  友達との競走（争）の仕方を考え，競走（争）の規則や記録への挑戦の仕方を選ぶこと。","○ 自己の能力に適した規則を選ぶ例","・ 個人の記録を得点化してチーム対抗戦をしたり，チームの目標得点を設定して競争したりするなどの規則を選ぶこと。","ウ  友達のよい動きや変化を見付けたり，考えたりしたことを友達に伝えること。","○ 学び合ったことを友達に伝える例","・ 活動後に，運動のポイントや友達の動きのよさなどを学習カードなどに記入したり，振り返りの時間に発表したり，感想文を書いたりすること。"],"m":["ア  かけっこ・リレーや小型ハードル走，幅跳びや高跳びに進んで取り組むこと。","イ かけっこやリレーなどのきまりを守り，誰とでも仲よく励まし合うこと。","ウ 走・跳の運動で使用する用具の準備や片付けを友達と一緒にすること。","エ かけっこやリレーなどの勝敗を受け入れること｡","オ  小型ハードル走で互いの動きを見合ったり，高跳びで動きのよさや課題を伝え合ったりするなどの際に，友達の考えを認めること。","カ  小型ハードル走をする場所や幅跳びをする砂場などの危険物を取り除くとともに，用具の安全を確かめること。","◎ 運動に意欲的でない児童への配慮の例","・ かけっこ・リレーでの競走など，競走（争）に対して意欲的に取り組めない児童には，いろいろな走り方・跳び方で活動する場を設定したり，勝敗のルールを工夫したりするなどの配慮をする。","・ 高跳びのスタンドやバーが当たることへの恐怖心がある児童には，友達が持つゴムひもを跳ぶようにするなどの配慮をする。","・ 課題が易しすぎたり難しすぎたりして，うまく走ったり跳んだりできずに達成感を味わうことができない児童には，一つの場だけでなく，速さ，距離を変えるなど，易しい課題や複数の課題を設定するなどの配慮をする。","・ リレーのバトンの受渡しの練習の場面などで，友達同士でうまく関わり合うことができない児童には，互いに見合い，教え合いをする学習の仕組みや，振り返りの場面などで，友達同士で学習の成果を認め合うようにするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア かけっこ・リレー","かけっこ・リレーでは，その行い方を知るとともに，距離を決めて調子よく最後まで走ったり，走りながらバトンの受渡しをする周回リレーをしたりすること。","［例示］","○ 30～50ｍ程度のかけっこ","・ いろいろな走り出しの姿勢から，素早く走り始めること。","・ 真っ直ぐ前を見て，腕を前後に大きく振って走ること。","○ 周回リレー（一人が走る距離30～50ｍ程度）","・ 走りながら，タイミングよくバトンの受渡しをすること。","・ コーナーの内側に体を軽く傾けて走ること。","◎ 運動が苦手な児童への配慮の例","・ かけっこで，スタートが苦手な児童には，立った姿勢からだけでなくいろいろな姿勢から素早く走ったり，スタート位置を変えて競走したりするなどの配慮をする。","・ 周回リレーで，タイミングよくバトンを受渡すことが苦手な児童には，追いかけ走やコーナー走で受渡しをするなどの配慮をする。"],"イ":["イ 小型ハードル走","小型ハードル走では，その行い方を知るとともに，小型ハードルを自己に合ったリズムで走り越えること。","［例示］","○ いろいろなリズムでの小型ハードル走","・ インターバルの距離や小型ハードルの高さに応じたいろいろなリズムで小型ハードルを走り越えること。","○ 30～40ｍ程度の小型ハードル走","・ 一定の間隔に並べられた小型ハードルを一定のリズムで走り越えること。","◎ 運動が苦手な児童への配慮の例","・ 一定のリズムで小型ハードルを走り越えることが苦手な児童には，インターバルの異なる複数のレーンを設定し選べるようにしたり，いろいろな材質の小型ハードル（ゴムを張った小型ハードルや段ボールを用いたハードル等）を使用したりするなどの配慮をする。"],"ウ":["ウ 幅跳び","幅跳びでは，その行い方を知るとともに，短い助走から強く踏み切って遠くへ跳ぶこと。","［例示］","○ 短い助走からの幅跳び","・ ５～７歩程度の助走から踏切り足を決めて前方に強く踏み切り，遠くへ跳ぶこと。","・ 膝を柔らかく曲げて，両足で着地すること。","◎ 運動が苦手な児童への配慮の例","・ 踏切り足が定まらず，強く前方へ跳ぶことが苦手な児童には，３～５歩など，短い助走による幅跳びをしたり，「トン・トン・ト・ト・トン」など，一定のリズムの助走からの幅跳びを行ったりする場を設定するなどの配慮をする。"],"エ":["エ 高跳び","高跳びでは，その行い方を知るとともに，短い助走から強く踏み切って高く跳ぶこと。","［例示］","○ 短い助走からの高跳び","・ ３～５歩程度の短い助走から踏切り足を決めて上方に強く踏み切り，高く跳ぶこと。","・ 膝を柔らかく曲げて，足から着地すること。","◎ 運動が苦手な児童への配慮の例","・ 踏切り足が定まらず，強く上方へ跳ぶことが苦手な児童には，３歩など，短い助走による高跳びをしたり，「トン・トン・ト・ト・トン」など，一定のリズムの助走からの高跳びを行ったりする場を設定するなどの配慮をする。"]}},"taiiku-34-D-0":{"page":91,"name":"水泳運動","expl":{"intro":["中学年の水泳運動は，「浮いて進む運動」及び「もぐる・浮く運動」で構成され，水に浮いて進んだり呼吸したり，様々な方法で水にもぐったり浮いたりする楽しさや喜びに触れることができる運動である。","低学年の水遊びの学習を踏まえ，中学年では，水泳運動の楽しさや喜びに触れ，その行い方を知るとともに，け伸びや初歩的な泳ぎ，もぐる・浮くことなどの基本的な動きや技能を身に付けるようにし，高学年の水泳運動の学習につなげていくことが求められる。","また，運動を楽しく行うために，自己の課題を見付け，その解決のための活動を工夫するとともに，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，水泳運動の心得を守って安全に気を付けたりすることなどをできるようにすることが大切である。"],"k":["初歩的な泳ぎとは，呼吸しながらのばた足泳ぎやかえる足泳ぎなど，近代泳法の前段階となる泳ぎのことである。このような泳ぎでは，浮いて呼吸をしながら手や足を使って進むことが大切であり，近代泳法の手や足の動かし方などの泳形にこだわる必要がない泳ぎである。","ア 浮いて進む運動","浮いて進む運動では，その行い方を知るとともに，プールの底や壁を蹴った勢いを利用して進むけ伸びをしたり，浮いて呼吸をしながら手や足を使って進む初歩的な泳ぎをしたりすること。","［例示］","○ け伸び","・ け伸びにつながるように，友達に手を引かれたり足を押されたりした勢いを利用して，伏し浮きの姿勢で続けて進むこと。","・ プールの底を両足で蹴り，体を一直線に伸ばした姿勢で進んだり，友達の股の下をくぐり抜けたりすること。","・ 体を縮めた状態になってプールの壁に両足を揃えてから，力強く両足で蹴り出した勢いで，顎を引いて腕で頭を挟んで体を一直線に伸ばした姿勢で進むこと。","○ 初歩的な泳ぎ","・ 補助具を用いて浮き，呼吸をしながら手や足を動かして進む初歩的な泳ぎをすること。","・ 補助具を用いて仰向けの姿勢で浮き，呼吸をしながら手や足を動かして進む初歩的な泳ぎをすること。","・ 水面に顔を付け，手や足をゆっくりと動かし進むなど，呼吸を伴わない初歩的な泳ぎをすること。","・ ばた足泳ぎやかえる足泳ぎなど，頭の上方に腕を伸ばした姿勢で，手や足をバランスよく動かし，呼吸をしながら進むこと。","◎ 運動が苦手な児童への配慮の例","・ け伸びで，体を一直線に伸ばすことが苦手な児童には，補助具や友達の手につかまり，大きく息を吸って伏し浮きの姿勢になるまで待つように助言したり，体を伸ばした状態になったところを友達に引っ張ってもらったりするなどの配慮をする。","・ け伸びで，プールの底や壁を力強く蹴ることが苦手な児童には，水の中に体を十分に沈め，膝を曲げて体を小さく縮めてから底や壁を蹴るように助言したり，け伸びで進む距離を友達と競争したり自己の記録を伸ばしたりする場を設定したりするなどの配慮をする。","・ 初歩的な泳ぎで，手や足の動きと呼吸のタイミングを合わすことが苦手な児童には，陸上で動きのイメージができる言葉「伸びて，イーチ・ニィー・サーン（手で水をかいたり，足を動かしたりして），ブハ！（息をまとめて吐く），伸びて」とともにタイミングを確認する場を設定したり，友達にゆっくりと引っ張ってもらいながら息継ぎのタイミングを声かけしてもらったりするなどの配慮をする。","イ もぐる・浮く運動","もぐる・浮く運動では，その行い方を知るとともに，呼吸を調整しながらいろいろなもぐり方をしたり，背浮きの姿勢で浮いたり，簡単な浮き沈みをしたりすること。","［例示］","○ プールの底にタッチ，股くぐり，変身もぐりなどのいろいろなもぐり方","・ プールの底から足を離して，体の一部分をプールの底につけるようにもぐること。","・ 手や足を動かした推進力を利用して，上体からもぐったり，友達の股の下やプールの底に固定した輪の中をくぐり抜けたりすること。","・ 座った姿勢でもぐってから大の字の姿勢に変わったり，仰向けの姿勢でもぐってから伏し浮きの姿勢に変わったり，体を回転させたりするなど，水の中で姿勢を変えること。","○ 背浮き，だるま浮き，変身浮きなどのいろいろな浮き方","・ 補助具を抱えたり挟んだりして，浮力を生かしたいろいろな浮き方をすること。","・ 大きく息を吸い込み全身の力を抜いて，背浮きやだるま浮きなどのいろいろな浮き方をすること。","・ 伏し浮きから大の字浮き，伏し浮きからだるま浮き，背浮きから伏し浮きなど，ゆっくりと浮いた姿勢を変える変身浮きをすること。","○ だるま浮きやボビングなどを活用した簡単な浮き沈み","・ 息を大きく吸った状態でもぐり体が浮いてくる動きをしたり，浮いた姿勢から息を吐き体が沈んでいく動きをしたりすること。","・ 浮いた姿勢から手や足を利用して口を水面上へ出すこと。","・ 大きく息を吸ってだるま浮きをした状態で，友達に背中を押して沈めてもらい，息を止めてじっとして水面に浮上する動きをすること。","・ ボビングを連続して行ったり，連続したボビングをしながらジャンプをして移動したりすること。","◎ 運動が苦手な児童への配慮の例","・ プールの底にタッチをする際，浮力の影響でもぐることが苦手な児童には，息を吐きながらもぐることや手や足を大きく使うことを助言したり，水深が浅い場を設定したりするなどの配慮をする。","・ いろいろなもぐり方をする際，もぐり方を変えることが苦手な児童には，友達ともぐり方の真似をし合う場を設定したり，陸上でできる動きを水の中でできないかを助言したりするなどの配慮をする。","・ だるま浮きで，体を小さく縮めることが苦手な児童には，両膝を抱え込まずに持つ程度にした簡単な方法に挑戦することや，膝を抱えると一度は沈むがゆっくりと浮いてくることを助言するなどの配慮をする。","・ 背浮きで，腰が沈まないようにして浮くことが苦手な児童には，補助具が体から離れないようにしっかり抱えて浮くように助言したり，友達に背中や腰を支えてもらう場を設定したりするなどの配慮をする。","・ 変身浮きで，浮き方を変えることが苦手な児童には，一つの浮き方で浮いている時間を延ばしたり，「つぼみがだんだん開いて，またしぼんでいく」などお話づくりで変身していくイメージをもって挑戦したりする場を設定するなどの配慮をする。","・ 連続したボビングが苦手な児童には，低学年で扱った呼吸のリズムを再度確認したり，友達と手をつないでボビングをしたりする場を設定するなどの配慮をする。"],"s":["ア  自己の能力に適した課題を見付け，その課題の解決のための活動を選ぶこと。","○ 進んだ距離やできた回数を確かめて自己の課題を見付ける例","・ け伸びや初歩的な泳ぎで進んだ距離，連続ボビングの回数など，自己で決めた距離や回数に挑戦することで，自己の課題を見付けること。","○ 真っ直ぐに体を伸ばしたけ伸びにするための活動を選ぶ例","・ 補助具を活用して体を真っ直ぐに伸ばした時間を長くとる練習や，伸びた状態で友達に手を引っ張ってもらう練習など，自己の課題に適した練習の仕方を選ぶこと。","○ 手や足をバランスよく動かし，呼吸をしながら進むための活動を選ぶ例","・ 陸上で手や足の動かし方と呼吸を合わせた動きをしたり，補助具を用いて体を安定させて手や足の動きと呼吸を合わせたりするなど，自己の課題に適した練習の仕方を選ぶこと。","・ け伸びで進んだ回数をグループで競ったり，連続ボビングでのリレーをしたりするなど，自己の能力に適した競争の仕方を選ぶこと。","イ 課題の解決のために考えたことを友達に伝えること。","○ け伸びや初歩的な泳ぎでの動きを友達と見合ったり補助をし合ったりする過程で，考えたことを伝える例","・ け伸びや初歩的な泳ぎについて見付けた友達のよい動きや課題の解決のための動きのポイントを言葉や動作で伝えること。","○ いろいろなもぐり方や浮き方を友達に伝える例","・ 自ら試したいろいろなもぐり方や浮き方を友達に紹介したり，互いのよい動きの真似をしたりすること。"],"m":["ア  け伸びや初歩的な泳ぎをしたり，いろいろなもぐり方や浮き方をしたりするなど，水泳運動に進んで取り組むこと。","イ  け伸びをする際に順番にスタートしたり，決まった場所で友達と練習したりするなど，水泳運動のきまりを守り，誰とでも仲よく励まし合うこと。","ウ 水泳運動の練習で使用する用具の準備や片付けを，友達と一緒にすること。エ  互いの動きを見合ったり補助をし合ったりするときに見付けた動きのよさや課題について伝え合う際に，友達の考えを認めること。","オ  準備運動や整理運動を正しく行う，バディで互いを確認しながら活動する，シャワーを浴びてからゆっくりと水の中に入る，プールに飛び込まないなど，水泳運動の心得を守って安全を確かめること。","◎ 運動に意欲的でない児童への配慮の例","・ 水に対する恐怖心や違和感を抱く児童には，低学年での水遊びを単元や授業の始めに取り入れたり，ゲーム的な要素のある運動をしたりするなどの配慮をする。","・ 友達と練習することが苦手な児童には，自己の能力に適した距離や時間等の明確な目標をもって挑戦する場を設定し，その成果を友達と見合ったり，友達と課題を一緒に解決する活動を取り入れたりするなどの配慮をする。","・ 既にクロールや平泳ぎができる児童には，け伸びの距離をより伸ばすことを助言したり，いろいろなもぐり方をする場面で腹や背中をプールの底に付けたり逆立ちや連続回転をしたりすることを助言したりするなど，挑戦する課題を提示するなどの配慮をする。"]},"ksub":{"":["初歩的な泳ぎとは，呼吸しながらのばた足泳ぎやかえる足泳ぎなど，近代泳法の前段階となる泳ぎのことである。このような泳ぎでは，浮いて呼吸をしながら手や足を使って進むことが大切であり，近代泳法の手や足の動かし方などの泳形にこだわる必要がない泳ぎである。"],"ア":["ア 浮いて進む運動","浮いて進む運動では，その行い方を知るとともに，プールの底や壁を蹴った勢いを利用して進むけ伸びをしたり，浮いて呼吸をしながら手や足を使って進む初歩的な泳ぎをしたりすること。","［例示］","○ け伸び","・ け伸びにつながるように，友達に手を引かれたり足を押されたりした勢いを利用して，伏し浮きの姿勢で続けて進むこと。","・ プールの底を両足で蹴り，体を一直線に伸ばした姿勢で進んだり，友達の股の下をくぐり抜けたりすること。","・ 体を縮めた状態になってプールの壁に両足を揃えてから，力強く両足で蹴り出した勢いで，顎を引いて腕で頭を挟んで体を一直線に伸ばした姿勢で進むこと。","○ 初歩的な泳ぎ","・ 補助具を用いて浮き，呼吸をしながら手や足を動かして進む初歩的な泳ぎをすること。","・ 補助具を用いて仰向けの姿勢で浮き，呼吸をしながら手や足を動かして進む初歩的な泳ぎをすること。","・ 水面に顔を付け，手や足をゆっくりと動かし進むなど，呼吸を伴わない初歩的な泳ぎをすること。","・ ばた足泳ぎやかえる足泳ぎなど，頭の上方に腕を伸ばした姿勢で，手や足をバランスよく動かし，呼吸をしながら進むこと。","◎ 運動が苦手な児童への配慮の例","・ け伸びで，体を一直線に伸ばすことが苦手な児童には，補助具や友達の手につかまり，大きく息を吸って伏し浮きの姿勢になるまで待つように助言したり，体を伸ばした状態になったところを友達に引っ張ってもらったりするなどの配慮をする。","・ け伸びで，プールの底や壁を力強く蹴ることが苦手な児童には，水の中に体を十分に沈め，膝を曲げて体を小さく縮めてから底や壁を蹴るように助言したり，け伸びで進む距離を友達と競争したり自己の記録を伸ばしたりする場を設定したりするなどの配慮をする。","・ 初歩的な泳ぎで，手や足の動きと呼吸のタイミングを合わすことが苦手な児童には，陸上で動きのイメージができる言葉「伸びて，イーチ・ニィー・サーン（手で水をかいたり，足を動かしたりして），ブハ！（息をまとめて吐く），伸びて」とともにタイミングを確認する場を設定したり，友達にゆっくりと引っ張ってもらいながら息継ぎのタイミングを声かけしてもらったりするなどの配慮をする。"],"イ":["イ もぐる・浮く運動","もぐる・浮く運動では，その行い方を知るとともに，呼吸を調整しながらいろいろなもぐり方をしたり，背浮きの姿勢で浮いたり，簡単な浮き沈みをしたりすること。","［例示］","○ プールの底にタッチ，股くぐり，変身もぐりなどのいろいろなもぐり方","・ プールの底から足を離して，体の一部分をプールの底につけるようにもぐること。","・ 手や足を動かした推進力を利用して，上体からもぐったり，友達の股の下やプールの底に固定した輪の中をくぐり抜けたりすること。","・ 座った姿勢でもぐってから大の字の姿勢に変わったり，仰向けの姿勢でもぐってから伏し浮きの姿勢に変わったり，体を回転させたりするなど，水の中で姿勢を変えること。","○ 背浮き，だるま浮き，変身浮きなどのいろいろな浮き方","・ 補助具を抱えたり挟んだりして，浮力を生かしたいろいろな浮き方をすること。","・ 大きく息を吸い込み全身の力を抜いて，背浮きやだるま浮きなどのいろいろな浮き方をすること。","・ 伏し浮きから大の字浮き，伏し浮きからだるま浮き，背浮きから伏し浮きなど，ゆっくりと浮いた姿勢を変える変身浮きをすること。","○ だるま浮きやボビングなどを活用した簡単な浮き沈み","・ 息を大きく吸った状態でもぐり体が浮いてくる動きをしたり，浮いた姿勢から息を吐き体が沈んでいく動きをしたりすること。","・ 浮いた姿勢から手や足を利用して口を水面上へ出すこと。","・ 大きく息を吸ってだるま浮きをした状態で，友達に背中を押して沈めてもらい，息を止めてじっとして水面に浮上する動きをすること。","・ ボビングを連続して行ったり，連続したボビングをしながらジャンプをして移動したりすること。","◎ 運動が苦手な児童への配慮の例","・ プールの底にタッチをする際，浮力の影響でもぐることが苦手な児童には，息を吐きながらもぐることや手や足を大きく使うことを助言したり，水深が浅い場を設定したりするなどの配慮をする。","・ いろいろなもぐり方をする際，もぐり方を変えることが苦手な児童には，友達ともぐり方の真似をし合う場を設定したり，陸上でできる動きを水の中でできないかを助言したりするなどの配慮をする。","・ だるま浮きで，体を小さく縮めることが苦手な児童には，両膝を抱え込まずに持つ程度にした簡単な方法に挑戦することや，膝を抱えると一度は沈むがゆっくりと浮いてくることを助言するなどの配慮をする。","・ 背浮きで，腰が沈まないようにして浮くことが苦手な児童には，補助具が体から離れないようにしっかり抱えて浮くように助言したり，友達に背中や腰を支えてもらう場を設定したりするなどの配慮をする。","・ 変身浮きで，浮き方を変えることが苦手な児童には，一つの浮き方で浮いている時間を延ばしたり，「つぼみがだんだん開いて，またしぼんでいく」などお話づくりで変身していくイメージをもって挑戦したりする場を設定するなどの配慮をする。","・ 連続したボビングが苦手な児童には，低学年で扱った呼吸のリズムを再度確認したり，友達と手をつないでボビングをしたりする場を設定するなどの配慮をする。"]}},"taiiku-34-E-0":{"page":96,"name":"ゲーム","expl":{"intro":["中学年のゲームは，「ゴール型ゲーム」，「ネット型ゲーム」及び「ベースボール型ゲーム」で構成され，主として，規則を工夫したり作戦を選んだり，集団対集団で友達と力を合わせて競い合ったりする楽しさや喜びに触れることができる運動である。","低学年のゲームの学習を踏まえ，中学年では，ゲームの楽しさや喜びに触れ，その行い方を知るとともに，基本的なボール操作とボールを持たないときの動きによって，易しいゲームをすることができるようにし，高学年のボール運動の学習につなげていくことが求められる。","また，運動を楽しく行うために，自己の課題を見付け，その解決のための活動を工夫するとともに，規則を守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や用具の安全に気を付けたりすることなどをできるようにすることが大切である。"],"k":["易しいゲームとは，ゲームを児童の発達の段階を踏まえて，基本的なボール操作で行え，プレイヤーの人数（プレイヤーの人数を少なくしたり，攻める側のプレイヤーの人数が守る側のプレイヤーの人数を上回るようにしたりすること），コートの広さ（奥行きや横幅など），ネットの高さ，塁間の距離，プレイ上の緩和や制限（攻める側のプレイ空間，触球方法の緩和や守る側のプレイ空間，身体接触の回避，触球方法の制限など），ボールその他の運動用具や設備などを修正し，児童が取り組みやすいように工夫したゲームをいう。","ア ゴール型ゲーム","ゴール型ゲームでは，その行い方を知るとともに，基本的なボール操作とボールを持たないときの動きによって，コート内で攻守入り交じって，ボールを手や足でシュートしたり，空いている場所に素早く動いたりする易しいゲーム及び陣地を取り合って得点ゾーンに走り込むなどの易しいゲームをすること。","［例示］","○ ハンドボール，ポートボール，ラインサッカー，ミニサッカーなどを基にした易しいゲーム（味方チームと相手チームが入り交じって得点を取り合うゲーム）","○ タグラグビー，フラッグフットボールなどを基にした易しいゲーム（陣地を取り合うゲーム）","・ ボールを持ったときにゴールに体を向けること。","・ 味方にボールを手渡したり，パスを出したり，シュートをしたり，ゴールにボールを持ち込んだりすること。","・ ボール保持者と自分の間に守る者がいない空間に移動すること。","◎ 運動が苦手な児童への配慮の例","・ パスを出したり，シュートをしたりすることが苦手な児童には，ボールを保持する条件を易しくするとともに，ボールを保持した際に周囲の状況が確認できるように言葉がけを工夫するなどの配慮をする。","・ ボール保持者と自分の間に守る者がいない空間に移動することが苦手な児童には，守る者の位置を見るように言葉がけを工夫するなどの配慮をする。","イ ネット型ゲーム","ネット型ゲームでは，その行い方を知るとともに，基本的なボール操作とボールを操作できる位置に体を移動するなどのボールを持たないときの動きによって，軽量のボールを片手，両手もしくは用具を使って，自陣の味方にパスをしたり，相手コートに返球したり，弾むボールを床や地面に打ちつけて相手コートに返球したりして，ラリーの続く易しいゲームをすること。","［例示］","○ ソフトバレーボールを基にした易しいゲーム","○ プレルボールを基にした易しいゲーム","○ バドミントンやテニスを基にした易しいゲーム","○ 天大中小など，子供の遊びを基にした易しいゲーム","・ いろいろな高さのボールを片手，両手もしくは用具を使ってはじいたり，打ちつけたりすること。","・ 相手コートから飛んできたボールを片手，両手もしくは用具を使って相手コートに返球すること。","・ ボールの方向に体を向けたり，ボールの落下点やボールを操作しやすい位置に移動したりすること。","◎ 運動が苦手な児童への配慮の例","・ いろいろな高さのボールを片手，両手もしくは用具を使ってはじいたり，打ちつけたりすることが苦手な児童には，飛んできたボールをキャッチして打つことを認めるなどの配慮をする。","・ ボールの落下点やボールを操作しやすい位置に移動したりすることが苦手な児童には，プレイできるバウンド数を多くしたり，飛んできたボールをキャッチしてラリーを継続したりするなどの配慮をする。","ウ ベースボール型ゲーム","ベースボール型ゲームでは，その行い方を知るとともに，ボールを蹴ったり打ったりする攻めや捕ったり投げたりする守りなどの基本的なボール操作と，ボールの飛球方向に移動したり，全力で走塁したりするなどのボールを持たないときの動きによって，攻守を交代する易しいゲームをすること。","［例示］","○ 攻める側がボールを蹴って行う易しいゲーム","○ 手や用具などを使って打ったり，静止したボールを打ったりして行う易しいゲーム","・ ボールをフェアグラウンド内に蹴ったり打ったりすること。","・ 投げる手と反対の足を一歩前に踏み出してボールを投げること。","・ 向かってくるボールの正面に移動すること。","・ ベースに向かって全力で走り，かけ抜けること。","◎ 運動が苦手な児童への配慮の例","・ ボールをフェアグラウンド内に蹴ったり打ったりすることが苦手な児童には，大きなボールや軽いボールを用いたり，手や大きなバット，軽いバット，ラケットなどを用いて打ったり，静止したボールを蹴ったり打ったりすることができるようにするなどの配慮をする。","・ 投げる手と反対の足を一歩前に踏み出してボールを投げることが苦手な児童には，的当てゲームを取り入れたり，紙鉄砲やタオルを用いて遊ぶ場を設定したりして，投げる動きが自然に身に付くような練習をするなどの配慮をする。"],"s":["ア 規則を工夫すること","○ 誰もが楽しくゲームに参加できるように，プレイヤーの人数，コートの広さ，プレイ上の緩和や制限，得点の仕方などの規則を選ぶ例","・ 攻めと守りの局面でプレイヤーの人数に違いを設け，攻めを行いやすいようにするなどの規則を選ぶこと。","イ ゲームの型に応じた簡単な作戦を選ぶこと","○ ゴール型の陣地を取り合うゲームで，陣地に侵入するための簡単な作戦を選ぶ例","・ 少人数のゲームで，ボールを持っている人とボールを持っていない人の役割を踏まえた作戦を選ぶこと。","ウ 課題の解決のために考えたことを友達に伝えること","○ いろいろな高さのボールを片手，両手もしくは用具を使ってはじいたり，打ちつけたりすることについて考えたことを友達に伝える例","・ 易しいネット型ゲームで，高さの違うボールを片手，両手もしくは用具を使って強さや方向を変えてはじいた工夫を，動作や言葉，絵図などを使って，友達に伝えること。","○ 向かってくるボールの正面に移動することについて考えたことを友達に伝える例","・ 易しいベースボール型ゲームで，友達の正面に移動する動きのよさを，動作や言葉，絵図などを使って，友達に伝えること。"],"m":["ア  易しいゴール型ゲーム，ネット型ゲーム，ベースボール型ゲームに進んで取り組むこと。","イ ゲームの規則を守り，誰とでも仲よくすること。","ウ ゲームで使用する用具などの準備や片付けを，友達と一緒にすること。","エ ゲームの勝敗を受け入れること。","オ  ゲームやそれらの練習の中で互いに動きを見合ったり，話し合ったりして見付けた動きのよさや課題を伝え合う際に，友達の考えを認めること。","カ  ゲームやそれらの練習の際に，使用する用具などを片付けて場の危険物を取り除くなど，周囲を見て場や用具の安全を確かめること。","◎ 運動に意欲的でない児童への配慮の例","・ ボールが固くて恐怖心を抱いたり，小さくて操作しにくかったりするために，ゲームに意欲的に取り組めない児童には，柔らかいボールを用意したり，大きなボールやゆっくりとした速さになる軽めのボールを用意したりするなどの配慮をする。","・ 学習の仕方が分からないために，ゲームに意欲的に取り組めない児童には，学習への取組の手順を掲示物で確認できるようにするなどの配慮をする。","・ 場や規則が難しいと感じ，ゲームに意欲的に取り組めない児童には，文字やイラスト等を用いて掲示しながら説明したり，より易しい規則に変更したりするなどの配慮をする。","・ 新しく提示した動きが分からないために，ゲームや練習に意欲的に取り組めない児童には，よい動きの友達やチームを観察したり，掲示物などの具体物を用いて説明したりするなどの配慮をする。","・ 審判の判定に納得しなかったり，ゲームに勝てなかったりすることで，ゲームに意欲的に取り組めない児童には，判定に従うことやフェアなプレイの大切さについて，継続して伝えていくようにするなどの配慮をする。","・ ゲームに参加している実感がなく，楽しさを味わえない児童には，チームの人数を少なくして，役割を明確にしたり触球回数を増やせるようにしたりするなどの配慮をする。","・ 友達と仲よくゲームに取り組めない児童には，試合の前後に相手や味方同士で挨拶や握手を交わしたり，相手や味方同士でよいプレイや取組を称賛したりするなどの配慮をする。"]},"ksub":{"":["易しいゲームとは，ゲームを児童の発達の段階を踏まえて，基本的なボール操作で行え，プレイヤーの人数（プレイヤーの人数を少なくしたり，攻める側のプレイヤーの人数が守る側のプレイヤーの人数を上回るようにしたりすること），コートの広さ（奥行きや横幅など），ネットの高さ，塁間の距離，プレイ上の緩和や制限（攻める側のプレイ空間，触球方法の緩和や守る側のプレイ空間，身体接触の回避，触球方法の制限など），ボールその他の運動用具や設備などを修正し，児童が取り組みやすいように工夫したゲームをいう。"],"ア":["ア ゴール型ゲーム","ゴール型ゲームでは，その行い方を知るとともに，基本的なボール操作とボールを持たないときの動きによって，コート内で攻守入り交じって，ボールを手や足でシュートしたり，空いている場所に素早く動いたりする易しいゲーム及び陣地を取り合って得点ゾーンに走り込むなどの易しいゲームをすること。","［例示］","○ ハンドボール，ポートボール，ラインサッカー，ミニサッカーなどを基にした易しいゲーム（味方チームと相手チームが入り交じって得点を取り合うゲーム）","○ タグラグビー，フラッグフットボールなどを基にした易しいゲーム（陣地を取り合うゲーム）","・ ボールを持ったときにゴールに体を向けること。","・ 味方にボールを手渡したり，パスを出したり，シュートをしたり，ゴールにボールを持ち込んだりすること。","・ ボール保持者と自分の間に守る者がいない空間に移動すること。","◎ 運動が苦手な児童への配慮の例","・ パスを出したり，シュートをしたりすることが苦手な児童には，ボールを保持する条件を易しくするとともに，ボールを保持した際に周囲の状況が確認できるように言葉がけを工夫するなどの配慮をする。","・ ボール保持者と自分の間に守る者がいない空間に移動することが苦手な児童には，守る者の位置を見るように言葉がけを工夫するなどの配慮をする。"],"イ":["イ ネット型ゲーム","ネット型ゲームでは，その行い方を知るとともに，基本的なボール操作とボールを操作できる位置に体を移動するなどのボールを持たないときの動きによって，軽量のボールを片手，両手もしくは用具を使って，自陣の味方にパスをしたり，相手コートに返球したり，弾むボールを床や地面に打ちつけて相手コートに返球したりして，ラリーの続く易しいゲームをすること。","［例示］","○ ソフトバレーボールを基にした易しいゲーム","○ プレルボールを基にした易しいゲーム","○ バドミントンやテニスを基にした易しいゲーム","○ 天大中小など，子供の遊びを基にした易しいゲーム","・ いろいろな高さのボールを片手，両手もしくは用具を使ってはじいたり，打ちつけたりすること。","・ 相手コートから飛んできたボールを片手，両手もしくは用具を使って相手コートに返球すること。","・ ボールの方向に体を向けたり，ボールの落下点やボールを操作しやすい位置に移動したりすること。","◎ 運動が苦手な児童への配慮の例","・ いろいろな高さのボールを片手，両手もしくは用具を使ってはじいたり，打ちつけたりすることが苦手な児童には，飛んできたボールをキャッチして打つことを認めるなどの配慮をする。","・ ボールの落下点やボールを操作しやすい位置に移動したりすることが苦手な児童には，プレイできるバウンド数を多くしたり，飛んできたボールをキャッチしてラリーを継続したりするなどの配慮をする。"],"ウ":["ウ ベースボール型ゲーム","ベースボール型ゲームでは，その行い方を知るとともに，ボールを蹴ったり打ったりする攻めや捕ったり投げたりする守りなどの基本的なボール操作と，ボールの飛球方向に移動したり，全力で走塁したりするなどのボールを持たないときの動きによって，攻守を交代する易しいゲームをすること。","［例示］","○ 攻める側がボールを蹴って行う易しいゲーム","○ 手や用具などを使って打ったり，静止したボールを打ったりして行う易しいゲーム","・ ボールをフェアグラウンド内に蹴ったり打ったりすること。","・ 投げる手と反対の足を一歩前に踏み出してボールを投げること。","・ 向かってくるボールの正面に移動すること。","・ ベースに向かって全力で走り，かけ抜けること。","◎ 運動が苦手な児童への配慮の例","・ ボールをフェアグラウンド内に蹴ったり打ったりすることが苦手な児童には，大きなボールや軽いボールを用いたり，手や大きなバット，軽いバット，ラケットなどを用いて打ったり，静止したボールを蹴ったり打ったりすることができるようにするなどの配慮をする。","・ 投げる手と反対の足を一歩前に踏み出してボールを投げることが苦手な児童には，的当てゲームを取り入れたり，紙鉄砲やタオルを用いて遊ぶ場を設定したりして，投げる動きが自然に身に付くような練習をするなどの配慮をする。"]}},"taiiku-34-F-0":{"page":101,"name":"表現運動","expl":{"intro":["中学年の表現運動は，「表現」及び「リズムダンス」で内容が構成され，これらの運動は，自己の心身を解き放して，イメージやリズムの世界に没入してなりきって踊ることが楽しい運動であり，互いのよさを生かし合って友達と交流して踊る楽しさや喜びに触れることのできる運動である。","低学年の「表現リズム遊び」の学習を踏まえ，中学年では，表現運動の楽しさや喜びに触れ，その行い方を知るとともに，題材の特徴を捉えた多様な感じの表現と全身でリズムに乗って踊る学習を通して，即興的に表現する能力やリズムに乗って踊る能力，友達と豊かに関わり合うコミュニケーション能力などを培えるようにし，高学年の「表現運動」の学習につなげていくことが求められる。","また，表現運動を楽しく行うために，表現運動についての自己の課題を見付け，その解決のための活動を工夫するとともに，誰とでも仲よく踊ったり，友達の動きや考えを認めたり，場の安全に気を付けたりすることが大切である。"],"k":["ア 表現","表現では，その行い方を知るとともに，身近な生活などの題材から主な特徴や感じを捉え，表したい感じをひと流れの動きで即興的に踊ること。","身近な生活などの題材とは，中学年の児童の発達の段階に応じて，「具体的な生活からの題材」やそれと対比する「空想の世界からの題材」など，ダイナミックで変化に富んだ多様な表現に取り組みやすい題材として示している。それらの中から児童の関心や能力にふさわしい題材を取り上げ，その主な特徴や感じを捉えて，表したい感じを中心に動きを誇張したり変化を付けたりしてメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に表現すること。","［題材と動きの例示］","○ 「具体的な生活からの題材」－「〇〇づくり」（料理，粘土造形など），「１日の生活」（洗濯物，掃除，スポーツなど）など，身近な生活の中から特徴が捉えやすく多様な感じの動きを含む題材","・ 題材の特徴の捉え方としては，その題材の変化する様子（「料理」で焼かれたり揚げられたり「洗濯」で洗われたり干されたりする，それらの行程で質感や形状が変わっていく様子など）を捉えるようにすること。","・ 動きの誇張や変化の付け方としては，表したい感じを，硬く・軟らかく，大きく・小さく，速く・遅くなどの動きの質感や形状の変化を付けて誇張したり，二人で対応する動きを繰り返したりしてひと流れの動きで即興的に踊ること。","・ ひと流れの動きへの工夫の仕方としては，表したい感じを中心に，感じの異なる動きや急変する場面などの変化のある動きをつなげて，メリハリ（緩急・強弱）のあるひと流れの動きに工夫して感じを込めて踊ること。","○ 「空想の世界からの題材」－「〇〇探検」（ジャングル，宇宙，海底など）などの未知の想像が広がる題材や，忍者や戦いなどの二人組で対立する動きを含む題材","・ 題材の特徴の捉え方としては，「ジャングル探検」などでは多様な場面（底なし沼に落ちた，宝物発見！など）を捉えたり，「忍者」などではその題材ならではのふさわしい動き（忍び込む，戦うなど）で特徴を捉えたりすること。","・ 動きの誇張や変化の付け方としては，表したい感じを，跳ぶ－転がる，素早く動く－急に止まるなど動きに差を付けて誇張したり，「追いつ・追われつ」などの二人組で対応する動きや「戦い・対決」などの二人組で対立する動きで変化を付けたりして，ひと流れの動きで即興的に踊ること。","・ ひと流れの動きへの工夫の仕方としては，「具体的な生活からの題材」と同じように，表したい感じを中心に，感じの異なる動きや急変する場面など変化のある動きをつなげてメリハリ（緩急・強弱）のあるひと流れの動きに工夫して感じを込めて踊ること。","◎ 運動が苦手な児童への配慮の例","・ 題材の特徴を捉えることが苦手な児童には，題材の多様な場面を絵や文字で描いたカードをめくりながら動くなどの配慮をする。","・ 動きの誇張や変化の付け方が苦手な児童には，動きに差を付けて誇張したり，急変する動きで変化を付けたりして踊っている友達の動きを見合い，真似をするようにするなどの配慮をする。","・ ひと流れの動きにすることが苦手な児童には，気に入った様子を中心に，動きが急変する場面の例を複数挙げて動いてみるなどの配慮をする。","イ リズムダンス","リズムダンスでは，その行い方を知るとともに，軽快なロックやサンバなどのリズムの特徴を捉え，リズムに乗って弾んで踊ったり，友達と関わり合ったりして即興的に踊ること。","軽快なリズムに乗って全身で踊るとは，スキップで弾んで踊れる軽快なリズムの曲を取り上げ，ロックの後打ちやサンバのシンコペーション（拍子の強弱を逆転させたり変化させたりしたリズム）などのリズムの特徴を捉え，へそ（体幹部）を中心に，リズムに乗って全身で弾んで踊ったり，動きに変化を付けて踊ったり，友達と関わり合って踊ったりすること。","［リズムと動きの例示］","○ 軽快なテンポやビートの強いロックのリズム","・ リズムの特徴を捉えた踊り方としては，軽快なテンポのロックのリズム（テンポの目安はスキップで弾めるBPM140前後：BPMとは１分間のビートの数を示す）では，「ンタ（１拍）ンタ（１拍）」（※下線は，強調を表す）の弾みや後打ち（後拍が強調された弱起のリズムでアフタービートともいう）のリズムの特徴を捉え，へそ（体幹部）を中心にその場で弾んだり，体の各部分でリズムをとったりして即興的に踊ること。ビートの強いロックのリズム（テンポの目安は歩く速さのBPM120前後）では，「ウンタ（２拍）ウンタ（２拍）」の後打ちのリズムの特徴を捉え，動きにアクセントを付けるなどして即興的に踊ること。","・ 動きの変化の付け方としては，弾む動きにねじる・回るなどの動きを入れて変化を付けたり，素早い動きやストップなどで曲のリズムに変化を付けたりして続けて即興的に踊ること。","・ 友達との関わり方としては，二人で向かい合って手をつないだりくぐり抜けたりして自由に関わり合って踊ったり，二人で調子を合わせたりかけ合いをしたりして即興的に踊ること。","○ 陽気で小刻みなビートのサンバのリズム","・ リズムの特徴を捉えた踊り方としては，サンバの「ンタッタ（２拍）ンタッタ（２拍）」（※下線は，強調を表す）のシンコペーションのリズムと打楽器の小刻みなビートのリズムの特徴を捉え，その場で弾んだり，体の各部分で小刻みにリズムをとったり，へそ（体幹部）を中心に前後左右のスイングなどでリズムに乗ったりして即興的に踊ること。","・ 動きの変化の付け方としては，ロックのリズムと同じように，弾む動きにねじる・回るなどの動きを入れて変化を付けたり，素早い動きやストップなどで曲のリズムに変化を付けたりして続けて即興的に踊ること。","・ 友達との関わり方としては，二，三人の友達と調子を合わせたりかけ合いをしたりして即興的に踊ること。","◎ 運動が苦手な児童への配慮の例","・ リズムの特徴を捉えて踊ることが苦手な児童には，リズムに合わせて手拍子をしたり，リズムを表す言葉がけをしながら踊ったりするなどの配慮をする。","・ 動きに変化を付けて踊ることが苦手な児童には，曲のリズムに同調するだけでなく，動きやリズムに変化を付けた動きで踊っている友達の動きを見て，真似をするようにするなどの配慮をする。","・ 友達と関わって踊ることが苦手な児童には，二人組で向かい合って手をつなぎ，スキップで弾んだり，回ったり，動きの真似をし合うようにしたりするなどの配慮をする。"],"s":["ア  自己の能力に適した課題を見付け，その課題の解決のための活動を選ぶこと。","○ 自己の能力に適した課題を見付ける例","・ 題材やリズムの特徴を知り，自己の能力に合った課題を選ぶこと。","・ 表現やリズムダンスの動きのポイントを知り，楽しく踊るための自己に合った課題を見付けること。","○ 友達のよい動きを取り入れる例","・ よい動きを知り，友達のよい動きを自己の動きに取り入れること。","イ 課題の解決のために考えたことを友達に伝えること。","○ 友達が工夫したよいところを伝える例","・ 表したい感じや様子にふさわしい動きで踊れていたかどうかを見合い，特徴を捉えた動きや変化のある動きなどよかったところを友達に伝えること。","○ リズムダンスで工夫した動きを伝える例","・ その時間に見付けた動きや気に入った動きを，みんなで円形などになって一緒に踊りながら伝えること。"],"m":["ア  表したい感じをひと流れの動きで踊ったり，軽快なリズムに乗って全身で踊ったりする運動に進んで取り組むこと。","イ 表現やリズムダンスに取り組む際に，誰とでも仲よくすること。","ウ  表現やリズムダンスを行う場の設定や用具の片付けを，友達と一緒にすること。","エ  表現やリズムダンスでの友達の動きや楽しく踊るための友達の考えを認めること。","オ 友達とぶつからないように周りの安全を確かめて踊ること。","◎ 運動に意欲的でない児童への配慮の例","・ 踊ることに意欲的に取り組めない児童には，授業の導入で，みんなで円形などになり，顔を見合わせながら軽快なリズムに乗って弾んだり手拍子をしたりして，心と体をほぐすなどの配慮をする。","・ 友達と関わりながら踊ることに意欲的に取り組めない児童には，友達と組んでできる簡単な動きを示した中から選べるようにするなどの配慮をする。"]},"ksub":{"":[],"ア":["ア 表現","表現では，その行い方を知るとともに，身近な生活などの題材から主な特徴や感じを捉え，表したい感じをひと流れの動きで即興的に踊ること。","身近な生活などの題材とは，中学年の児童の発達の段階に応じて，「具体的な生活からの題材」やそれと対比する「空想の世界からの題材」など，ダイナミックで変化に富んだ多様な表現に取り組みやすい題材として示している。それらの中から児童の関心や能力にふさわしい題材を取り上げ，その主な特徴や感じを捉えて，表したい感じを中心に動きを誇張したり変化を付けたりしてメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に表現すること。","［題材と動きの例示］","○ 「具体的な生活からの題材」－「〇〇づくり」（料理，粘土造形など），「１日の生活」（洗濯物，掃除，スポーツなど）など，身近な生活の中から特徴が捉えやすく多様な感じの動きを含む題材","・ 題材の特徴の捉え方としては，その題材の変化する様子（「料理」で焼かれたり揚げられたり「洗濯」で洗われたり干されたりする，それらの行程で質感や形状が変わっていく様子など）を捉えるようにすること。","・ 動きの誇張や変化の付け方としては，表したい感じを，硬く・軟らかく，大きく・小さく，速く・遅くなどの動きの質感や形状の変化を付けて誇張したり，二人で対応する動きを繰り返したりしてひと流れの動きで即興的に踊ること。","・ ひと流れの動きへの工夫の仕方としては，表したい感じを中心に，感じの異なる動きや急変する場面などの変化のある動きをつなげて，メリハリ（緩急・強弱）のあるひと流れの動きに工夫して感じを込めて踊ること。","○ 「空想の世界からの題材」－「〇〇探検」（ジャングル，宇宙，海底など）などの未知の想像が広がる題材や，忍者や戦いなどの二人組で対立する動きを含む題材","・ 題材の特徴の捉え方としては，「ジャングル探検」などでは多様な場面（底なし沼に落ちた，宝物発見！など）を捉えたり，「忍者」などではその題材ならではのふさわしい動き（忍び込む，戦うなど）で特徴を捉えたりすること。","・ 動きの誇張や変化の付け方としては，表したい感じを，跳ぶ－転がる，素早く動く－急に止まるなど動きに差を付けて誇張したり，「追いつ・追われつ」などの二人組で対応する動きや「戦い・対決」などの二人組で対立する動きで変化を付けたりして，ひと流れの動きで即興的に踊ること。","・ ひと流れの動きへの工夫の仕方としては，「具体的な生活からの題材」と同じように，表したい感じを中心に，感じの異なる動きや急変する場面など変化のある動きをつなげてメリハリ（緩急・強弱）のあるひと流れの動きに工夫して感じを込めて踊ること。","◎ 運動が苦手な児童への配慮の例","・ 題材の特徴を捉えることが苦手な児童には，題材の多様な場面を絵や文字で描いたカードをめくりながら動くなどの配慮をする。","・ 動きの誇張や変化の付け方が苦手な児童には，動きに差を付けて誇張したり，急変する動きで変化を付けたりして踊っている友達の動きを見合い，真似をするようにするなどの配慮をする。","・ ひと流れの動きにすることが苦手な児童には，気に入った様子を中心に，動きが急変する場面の例を複数挙げて動いてみるなどの配慮をする。"],"イ":["イ リズムダンス","リズムダンスでは，その行い方を知るとともに，軽快なロックやサンバなどのリズムの特徴を捉え，リズムに乗って弾んで踊ったり，友達と関わり合ったりして即興的に踊ること。","軽快なリズムに乗って全身で踊るとは，スキップで弾んで踊れる軽快なリズムの曲を取り上げ，ロックの後打ちやサンバのシンコペーション（拍子の強弱を逆転させたり変化させたりしたリズム）などのリズムの特徴を捉え，へそ（体幹部）を中心に，リズムに乗って全身で弾んで踊ったり，動きに変化を付けて踊ったり，友達と関わり合って踊ったりすること。","［リズムと動きの例示］","○ 軽快なテンポやビートの強いロックのリズム","・ リズムの特徴を捉えた踊り方としては，軽快なテンポのロックのリズム（テンポの目安はスキップで弾めるBPM140前後：BPMとは１分間のビートの数を示す）では，「ンタ（１拍）ンタ（１拍）」（※下線は，強調を表す）の弾みや後打ち（後拍が強調された弱起のリズムでアフタービートともいう）のリズムの特徴を捉え，へそ（体幹部）を中心にその場で弾んだり，体の各部分でリズムをとったりして即興的に踊ること。ビートの強いロックのリズム（テンポの目安は歩く速さのBPM120前後）では，「ウンタ（２拍）ウンタ（２拍）」の後打ちのリズムの特徴を捉え，動きにアクセントを付けるなどして即興的に踊ること。","・ 動きの変化の付け方としては，弾む動きにねじる・回るなどの動きを入れて変化を付けたり，素早い動きやストップなどで曲のリズムに変化を付けたりして続けて即興的に踊ること。","・ 友達との関わり方としては，二人で向かい合って手をつないだりくぐり抜けたりして自由に関わり合って踊ったり，二人で調子を合わせたりかけ合いをしたりして即興的に踊ること。","○ 陽気で小刻みなビートのサンバのリズム","・ リズムの特徴を捉えた踊り方としては，サンバの「ンタッタ（２拍）ンタッタ（２拍）」（※下線は，強調を表す）のシンコペーションのリズムと打楽器の小刻みなビートのリズムの特徴を捉え，その場で弾んだり，体の各部分で小刻みにリズムをとったり，へそ（体幹部）を中心に前後左右のスイングなどでリズムに乗ったりして即興的に踊ること。","・ 動きの変化の付け方としては，ロックのリズムと同じように，弾む動きにねじる・回るなどの動きを入れて変化を付けたり，素早い動きやストップなどで曲のリズムに変化を付けたりして続けて即興的に踊ること。","・ 友達との関わり方としては，二，三人の友達と調子を合わせたりかけ合いをしたりして即興的に踊ること。","◎ 運動が苦手な児童への配慮の例","・ リズムの特徴を捉えて踊ることが苦手な児童には，リズムに合わせて手拍子をしたり，リズムを表す言葉がけをしながら踊ったりするなどの配慮をする。","・ 動きに変化を付けて踊ることが苦手な児童には，曲のリズムに同調するだけでなく，動きやリズムに変化を付けた動きで踊っている友達の動きを見て，真似をするようにするなどの配慮をする。","・ 友達と関わって踊ることが苦手な児童には，二人組で向かい合って手をつなぎ，スキップで弾んだり，回ったり，動きの真似をし合うようにしたりするなどの配慮をする。"]}},"taiiku-3-G-1":{"page":105,"name":"保健：健康な生活","expl":{"intro":["健康な生活については，児童が自ら主体的に健康によい生活を送るための基礎として，健康の大切さを認識できるようにするとともに，毎日の生活に関心をもつようにし，健康によい生活の仕方を理解できるようにする必要がある。また，健康な生活に関する課題を見付け，よりよい解決に向けて考え，それを表現できるようにする必要がある。さらに，自己の生活を見直すことを通して，健康によい１日の生活の仕方や生活環境を整えることについて実践する意欲をもてるようにすることも大切である。","このため，本内容は，健康の状態には主体の要因や周囲の環境の要因が関わっていること，また，健康を保持増進するには，１日の生活の仕方が深く関わっていること，体を清潔に保つこと，生活環境を整えることが必要
