方が変わることを捉えるようにする。その際，例えば，簡易検流計などを用いて，これらの現象と電流の大きさや向きとを関係付けて調べるようにする。","ここで扱う対象としては，乾電池につなぐ物として豆電球，モーターの他に，発光ダイオードなどが考えられる。","ここでの指導に当たっては，電流の大きさや向きと乾電池につないだ物の様子について考えたことを，図を用いて表現したり，「電流」，「直列つなぎ」，「並列つなぎ」という言葉を使用して説明したりするなど，電流の働きについて考えたり，説明したりする活動の充実を図るようにする。また，発光ダイオードが電流の向きによって点灯したり，点灯しなかったりすることを扱うことが考えられる。さらに，実験の結果を整理する際に，乾電池，豆電球，モーター，スイッチについて，電気用図記号（回路図記号）を扱うことが考えられる。","なお，乾電池をつなぐ際には，一つの回路で違う種類の電池が混在しないよう，安全に配慮するように指導する。","（内容の取扱い） (2) 内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。","空気や水の性質を活用したものづくりとしては，空気は圧し縮められるが，水は圧し縮められないという観点から，例えば，物を遠くへ飛ばすことを目的とした空気でっぽうや水を離れた場所へ飛ばすことを目的とした水でっぽうなどが考えられる。","物の温まり方を活用したものづくりとしては，水や空気は熱せられた部分が上に移動するという観点から，例えば，物を上空に持ち上げることを目的としたソーラーバルーンや，体積変化という観点から，温度の計測を目的とした温度計が考えられる。","電流の働きを活用したものづくりとしては，乾電池の数やつなぎ方を変えると電流の大きさや向きが変わり，モーターの回り方が変わるという観点から，例えば，物の動きを制御することを目的とした，乾電池などを用いた自動車や回転ブランコ，クレーンなどが考えられる。"],"k":[],"s":[]}},"rika-4-B-1":{"page":52,"name":"人の体のつくりと運動","expl":{"intro":["本内容は，第３学年「Ｂ(1)身の回りの生物」の学習を踏まえて，「生命」についての基本的な概念等を柱とした内容のうちの「生物の構造と機能」に関わるものであり，第６学年「Ｂ(1)人の体のつくりと働き」，中学校第２分野「(3)ア(ｳ)動物の体のつくりと働き」の学習につながるものである。","ここでは，児童が，骨や筋肉のつくりと働きに着目して，それらを関係付けて，人や他の動物の体のつくりと運動との関わりを調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力や生命を尊重する態度，主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 人や他の動物の運動器官に着目して，骨と筋肉とを関係付けて，自分の体に直接触れることを手掛かりとして，骨の位置や筋肉の存在を調べる。これらの活動を通して，骨や筋肉のつくりについて，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，体を支えたり体を動かしたりするときに使われる骨と筋肉があることを捉えるようにする。その際，硬い部分としての骨と柔らかい部分としての筋肉があることを捉えるようにする。","(ｲ) 人や他の動物の骨や筋肉のつくりと働きに着目して，それらを関係付けて，自分の体を動かしたり他の動物が運動しているところを観察したりして，体の動きと骨や筋肉との関係を調べる。これらの活動を通して，骨や筋肉の働きについて，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，人や他の動物が体を動かすことができるのは，骨と筋肉の働きによることを捉えるようにする。また，体の各部には，手や足のように曲がるところと曲がらないところがあり，曲がるところを関節ということを捉えるようにする。","ここで扱う対象としては，骨や筋肉の存在を調べる際には，自分の体を中心に扱うようにし，他の動物としては，骨や筋肉の働きが調べられる身近で安全な哺乳類，例えば，学校飼育動物の観察などが考えられる。","ここでの指導に当たっては，人の体の骨や筋肉の働きについて，体のつくりについて予想したことを，絵を用いて表現したり，体の各部にある曲がるところを「関節」という名称を使用して説明したりするなど，人や他の動物の骨や筋肉のつくりと働きについて考えたり，説明したりする活動の充実を図るようにする。また，資料を使って調べるだけではなく，実際に腕で物を持ち上げたり，他の動物の体のつくりや体の動き，運動を観察したりすることが考えられる。実際に触れながら比較したり，映像や模型などを活用したりしながら，人の体のつくりと運動との関わりについて捉えるようにする。他の動物の骨と筋肉の存在や運動について調べる際には，動物園などの施設の活用が考えられる。"],"k":[],"s":[]}},"rika-4-B-2":{"page":54,"name":"季節と生物","expl":{"intro":["本内容は，第３学年「Ｂ(1)身の回りの生物」の学習を踏まえて，「生命」についての基本的な概念等を柱とした内容のうちの「生命の連続性」，「生物と環境の関わり」に関わるものであり，第５学年「Ｂ(1)植物の発芽，成長，結実」，「Ｂ(2)動物の誕生」，第６学年「Ｂ(3)生物と環境」の学習につながるものである。","ここでは，児童が，動物を探したり植物を育てたりしながら，動物の活動や植物の成長の様子と季節の変化に着目して，それらを関係付けて，身近な動物の活動や植物の成長と環境との関わりを調べることを通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力や生物を愛護する態度，主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 季節ごとの身近な動物の活動の様子と季節の変化に着目して，それらを関係付けて調べる。これらの活動を通して，季節による動物の活動の変化について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，動物の活動は，暖かい季節，寒い季節などによって違いがあることを捉えるようにする。活動の様子として，身近に見られる動物は，暖かい季節には出現する数も多く活発に活動するが，寒い季節には活動が鈍くなったり，卵で越冬したりするなど，それぞれに適した姿で越冬状態となるものが多いこと，また，魚類や両生類は季節による水温の変化によって活動の様子などに違いがあること，さらに，鳥類は季節によって見られる種類や産卵，巣立ちなどに違いがあることなどを観察することが考えられる。","(ｲ) 季節ごとの身近な植物の成長の様子と季節の変化に着目して，それらを関係付けて調べる。これらの活動を通して，季節による植物の成長の変化について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，植物の成長は，暖かい季節，寒い季節などによって違いがあることを捉えるようにする。その際，植物を育てたり，身近な植物を一年を通して定期的に観察したりする活動を通して，身近な植物は，暖かくなる夏までは体全体の成長が顕著に見られ，寒くなり始めると体全体の成長はほとんど見られないが結実するなど，季節によって成長の仕方に違いがあることや，冬になると種子をつくって枯れたり形態を変えて越冬したりすることなどを捉えるようにする。","ここで扱う対象としては，(ｱ)については身近で危険のない動物，(ｲ)については身近で，季節による成長の変化が明確な植物とし，それぞれ２種類以上観察するようにする。また，地域性を生かし，地域の特徴的な動植物を取り上げることを通して，身近な自然に愛着をもつようにすることが考えられる。","ここでの指導に当たっては，植物の成長について，同地点で同一の対象を定期的に観察するようにする。また，観察したことを図や表，グラフなどを用いて整理し，比較するなど，動物の活動や植物の成長について考えたり，説明したりする活動の充実を図るようにする。さらに，観察の時期については，「暖かい季節」，「寒い季節」として，それぞれ夏，冬を想定しているが，春や秋を含めることが考えられる。","なお，野外での学習に際しては，毒をもつ生物に注意するとともに事故に遭わないようにするなど，安全に配慮するように指導する。"],"k":[],"s":[]}},"rika-4-B-3":{"page":56,"name":"雨水の行方と地面の様子","expl":{"intro":["本内容は，「地球」についての基本的な概念等を柱とした内容のうちの「地球の内部と地表面の変動」，「地球の大気と水の循環」に関わるものであり，第５学年「Ｂ(3)流れる水の働きと土地の変化」，第６学年「Ｂ(4)土地のつくりと変化」の学習につながるものである。","ここでは，児童が，水の流れ方やしみ込み方に着目して，それらと地面の傾きや土の粒の大きさとを関係付けて，雨水の行方と地面の様子を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 雨水が地面を流れていく様子から，雨水の流れ方に着目して，雨水の流れる方向と地面の傾きとを関係付けて，降った雨の流れの行方を調べる。これらの活動を通して，雨水の流れ方について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，水は高い場所から低い場所へと流れて集まることを捉えるようにする。その際，地面にできた雨水の流れの方向を観察するとともに，普段の生活ではあまり意識することのなかった地面の傾きの違いについて，雨水の流れる方向と地面の傾きとの関係を捉えるようにする。","(ｲ) 雨があがった後の校庭や教材園などの地面の様子から，水のしみ込み方に着目して，水のしみ込み方と土の粒の大きさとを関係付けて，降った雨の流れの行方を調べる。これらの活動を通して，土の粒の大きさによる水のしみ込み方の違いについて，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，水のしみ込み方は土の粒の大きさによって違いがあることを捉えるようにする。その際，水たまりができている地面とできていない地面を観察するとともに，水のしみ込み方の違いについて，虫眼鏡で土の粒の大きさを観察したり，粒の大きさの違う土を用いて，水がしみ込むまでの時間を比べたりすることが考えられる。","ここで扱う対象としては，(ｱ)については，雨があがった後の校庭や教材園などに見られる雨水の流れが考えられる。(ｲ)については，校庭や教材園，砂場などにある，粒の小さい土や粒の大きい土などが考えられる。","ここでの指導に当たっては，雨水の行方と地面の様子について調べる際，実際に校庭や教材園などに出て，地面の傾きの様子を調べたり，虫眼鏡で土の粒の大きさを観察したり，校庭や教材園，砂場などから土を採取して，粒の大きさの違いによる水のしみ込み方の違いを調べたりすることが考えられる。","日常生活との関連として，ここでの学習が排水の仕組みに生かされていることや，雨水が川へと流れ込むことに触れることで，自然災害との関連を図ることも考えられる。","なお，校庭での観察については，急な天候の変化や雷等に留意し，事故防止に配慮するように指導する。"],"k":[],"s":[]}},"rika-4-B-4":{"page":57,"name":"天気の様子","expl":{"intro":["本内容は，第３学年「Ｂ(2)太陽と地面の様子」の学習を踏まえて，「地球」についての基本的な概念等を柱とした内容のうちの「地球の大気と水の循環」に関わるものであり，第５学年「Ｂ(4)天気の変化」の学習につながるものである。","ここでは，児童が，気温や水の行方に着目して，それらと天気の様子や水の状態変化とを関係付けて，天気や自然界の水の様子を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 天気と気温の変化に着目して，それらを関係付けて，１日の気温の変化を調べる。これらの活動を通して，天気の様子と気温との関係について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，天気によって１日の気温の変化の仕方に違いがあることを捉えるようにする。その際，１日の気温の変化の様子を調べてグラフに表すと，太陽が出ている晴れた穏やかな日には日中に気温が上がる山型のグラフになり，太陽が雲などで遮られている曇りや雨の日には高低差の小さいグラフになることから，１日の気温の変化の仕方は天気によって違いがあることを捉えるようにする。","(ｲ) 湿った地面が乾くなどの水の行方に着目して，それらと気温とを関係付けて，自然界の水の様子を調べる。これらの活動を通して，自然界の水の行方について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，水は，水面や地面などから蒸発し，水蒸気になって空気中に含まれていくことや，空気中の水蒸気は，結露して再び水になって現れることがあることを捉えるようにする。その際，例えば，水を入れた容器に覆いをしておくと，やがて内側に水滴が付いて曇ってくるといった現象を観察することから，自然界では水面や地面などから水が蒸発していることを捉えるようにする。また，冷えた物を常温の空気中に置くとその表面に水滴が付く現象などから，空気中には蒸発した水が水蒸気として存在していることや，冷やすと結露して再び水になって現れることがあることを捉えるようにする。","ここでの指導に当たっては，気温の適切な測り方について，温度計などを用いて場所を決めて定点で観測する方法が身に付くようにする。その際，例えば，百葉箱の中に設置した温度計などを利用することが考えられる。さらに，１日の気温の変化の様子を調べた結果を，算数科の学習との関連を図りながら，グラフを用いて表したり，その変化の特徴を読み取ったりするなど，天気や自然界の水の様子について考えたり，説明したりする活動の充実を図るようにする。また，自然界での水の状態変化を捉えるために，第４学年「Ａ(2)金属，水，空気と温度」の学習との関連を図るようにする。","日常生活との関連としては，窓ガラスの内側の曇りなど，身の回りで見られる結露の現象を取り上げることが考えられる。"],"k":[],"s":[]}},"rika-4-B-5":{"page":59,"name":"月と星","expl":{"intro":["本内容は，第３学年「Ｂ(2)太陽と地面の様子」の学習を踏まえて，「地球」についての基本的な概念等を柱とした内容のうちの「地球と天体の運動」に関わるものであり，第６学年「Ｂ(5)月と太陽」の学習につながるものである。","ここでは，児童が，月や星の位置の変化や時間の経過に着目して，それらを関係付けて，月や星の特徴を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 月の位置の変化や時間の経過に着目して，それらを関係付けて，月の見え方を調べる。これらの活動を通して，月の特徴について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，月は三日月や満月など日によって形が変わって見え，１日のうちでも時刻によって位置が変わることを捉えるようにする。その際，任意の時刻における月の位置を，木や建物など地上の物を目印にして調べたり，方位で表したりする活動を行い，月の見え方について調べることが考えられる。","(ｲ) 星の明るさや色に着目して，それらを比較しながら，星の明るさや色の違いを調べる。これらの活動を通して，星の特徴についての問題を見いだし，表現するとともに，空には，明るさの違う星があること，星には青白い色や赤い色など色の違いがあることを捉えるようにする。","(ｳ) 星の位置の変化と時間の経過に着目して，それらを関係付けて，木や建物など地上の物を目印にして，星の位置の変化を調べる。これらの活動を通して，星の並び方や位置の変化について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，明るく輝く星をいくつか結んで何かの形に表すと星の集まりをつくることができ，これらの星の集まりは，時間の経過に伴って並び方は変わらないが位置が変化していることを捉えるようにする。","ここでの指導に当たっては，移動教室や宿泊を伴う学習の機会を生かして，実際に月や星を観察する機会を多くもつようにし，夜空に輝く無数の星に対する豊かな心情と天体に対する興味・関心をもつようにする。その際，方位磁針を用いて方位の確認をしたり，観察の時間間隔を一定にしたりして，決めた場所で月や星の位置の変化を観察する方法が身に付くようにする。また，学校では観察ができない時間帯の月や星の位置の変化については，映像や模型，プラネタリウムなどを活用することが考えられる。","なお，夜間の観察の際には，安全を第一に考え，事故防止に配慮するように指導する。"],"k":[],"s":[]}},"rika-5-A-1":{"page":63,"name":"物の溶け方","expl":{"intro":["本内容は，第３学年「Ａ(1)物と重さ」の学習を踏まえて，「粒子」についての基本的な概念等を柱とした内容のうちの「粒子の保存性」に関わるものであり，第６学年「Ａ(2)水溶液の性質」の学習につながるものである。","ここでは，児童が，物が水に溶ける量や様子に着目して，水の温度や量などの条件を制御しながら，物の溶け方の規則性を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に予想や仮説を基に，解決の方法を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 物が水に溶ける量や全体の量に着目して，溶かす前の物の重さに水の重さを加えた全体の重さと，溶かした後の水溶液の重さの変化を比較しながら調べる。これらの活動を通して，溶けた物の行方についての予想や仮説を基に，解決の方法を発想し，表現するとともに，物が水に溶けてもなくならず，水と物とを合わせた重さは変わらないことを捉えるようにする。","(ｲ) 物が水に溶ける量に着目して，水の温度や量といった条件を制御しながら，水に物を溶かしたときの，物の溶ける量を調べる。これらの活動を通して，物の溶け方のきまりについての予想や仮説を基に，解決の方法を発想し，表現するとともに，物が一定量の水に溶ける量には限度があることを捉えるようにする。","(ｳ) 物が水に溶ける量に着目して，水の温度や量といった条件を制御しながら，物の溶ける量やその変化を調べる。これらの活動を通して，物の溶け方のきまりについての予想や仮説を基に，解決の方法を発想し，表現するとともに，一定量の水を加熱したときの物の溶ける様子から，水溶液の温度が上昇すると，溶ける量も増えることや，高い温度で物を溶かした水溶液を冷やすと，溶けた物が出てくることを捉えるようにする。また，水の温度を一定にして，水の量を増やしたときの物の溶ける量の変化から，水の量が増えると溶ける量も増えることや，溶けた物は水溶液の中に存在することから，水溶液の水を蒸発させると，溶けた物が出てくることなどを捉えるようにする。さらに，それらの実験を複数の物を使って行い，物が水に溶ける量やその変化は，溶かす物によって違うことを捉えるようにする。","ここで扱う対象としては，水の温度や溶かす物の違いによって，溶ける量の違いが顕著に観察できるように，水の温度によって溶ける量の変化が大きい物と変化が小さい物を用いることが考えられる。また，加熱によって分解しにくく，安全性の高い物を扱うようにする。","ここでの指導に当たっては，例えば，有色の物を溶かしたとき，色が水溶液全体に均一に広がることから，溶けている物が均一に広がることにも触れるようにする。また，物が水に溶けても，水と物を合わせた重さは変わらないことについて，定量的な実験を通して捉えるようにすることが考えられる。さらに，物が溶けるということを，図や絵などを用いて表現したり，「水溶液」という言葉を使用して説明したりするなど，物の溶け方について考えたり，説明したりする活動の充実を図るようにする。","日常生活との関連として，水や湯に物を溶かした経験を想起させることが考えられる。","なお，実験を行う際には，メスシリンダーや電子てんびん，ろ過器具，加熱器具，温度計などの器具の適切な操作について，安全に配慮するように指導する。"],"k":[],"s":[]}},"rika-5-A-2":{"page":65,"name":"振り子の運動","expl":{"intro":["本内容は，第３学年「Ａ(2)風とゴムの力の働き」の学習を踏まえて，「エネルギー」についての基本的な概念等を柱とした内容のうちの「エネルギーの捉え方」に関わるものであり，第６学年「Ａ(3)てこの規則性」の学習につながるものである。","ここでは，児童が，振り子が１往復する時間に着目して，おもりの重さや振り子の長さなどの条件を制御しながら，振り子の運動の規則性を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に予想や仮説を基に，解決の方法を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 振り子が１往復する時間に着目して，おもりの重さ，振り子の長さ，振れ幅などの条件を制御しながら，振り子が１往復する時間を変化させる条件を調べる。これらの活動を通して，振り子の運動の規則性についての予想や仮説を基に，解決の方法を発想し，表現するとともに，振り子が１往復する時間は，おもりの重さなどによっては変わらないが，振り子の長さによって変わることを捉えるようにする。","ここでの指導に当たっては，振り子の長さや振れ幅を一定にしておもりの重さを変えるなど，変える条件と変えない条件を制御しながら実験を行うことによって，実験の結果を適切に処理し，考察することができるようにする。その際，振れ幅が極端に大きくならないように適切な振れ幅で実験を行うようにする。また，振り子の長さは糸などをつるした位置からおもりの重心までであることに留意する。さらに，伸びの少ない糸などを用いることや，おもりの数を増やして実験するときに，おもりを下につなげてつるすと振り子の長さも変わってしまうことがあること，測定中の振れ幅の減少ができるだけ小さい振り子を使用することなどに留意する必要がある。","他教科等との関連として，実験を複数回行い，その結果を処理する際には，算数科の学習と関連付けて適切に処理できるようにする。"],"k":[],"s":[]}},"rika-5-A-3":{"page":66,"name":"電流がつくる磁力","expl":{"intro":["本内容は，第４学年「Ａ(3)電流の働き」の学習を踏まえて，「エネルギー」についての基本的な概念等を柱とした内容のうちの「エネルギーの変換と保存」に関わるものであり，第６学年「Ａ(4)電気の利用」の学習につながるものである。","ここでは，児童が，電流の大きさや向き，コイルの巻数などに着目して，これらの条件を制御しながら，電流がつくる磁力を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に予想や仮説を基に，解決の方法を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 電流の大きさや向きに着目して，電磁石と磁石とを比較しながら，電磁石の性質を調べる。これらの活動を通して，電流がつくる磁力についての予想や仮説を基に，解決の方法を発想し，表現するとともに，電流には磁力を発生させ，鉄心を磁化させる働きがあり，電流の向きが変わると，電磁石の極も変わることを捉えるようにする。","(ｲ) 電流の大きさやコイルの巻数などに着目して，電流の大きさや導線の長さ，コイルの巻数などの条件を制御しながら，電磁石の強さを変化させる要因を調べる。これらの活動を通して，電磁石の性質についての予想や仮説を基に，解決の方法を発想し，表現するとともに，電磁石の強さは，電流の大きさや導線の巻数によって変わることを捉えるようにする。","ここで扱う対象としては，乾電池のほかに充電式電池の利用が考えられる。ただし，一つの回路では，違う種類の電池が混在しないようにする。","ここでの指導に当たっては，電磁石の強さについて，導線の巻数を一定にして電流の大きさを変えるなど，変える条件と変えない条件を制御しながら実験を行うことによって，実験の結果を適切に処理し，考察することができるようにする。電流がつくる磁力を捉える際には，電流を流したコイルに方位磁針などを近付けて確かめることなどが考えられる。","なお，身の回りでは，様々な電磁石が利用されていることを日常生活と関連させて取り上げたり，科学館などを利用して調べたりすることが考えられる。","（内容の取扱い） (1) 内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。","振り子の運動の規則性を活用したものづくりとしては，振り子の周期を変えるという観点から，例えば，規則正しく時間（リズム）を刻むことを目的とした簡易メトロノームなどが考えられる。","また，電流がつくる磁力を利用したものづくりとしては，電流の大きさなどによって電磁石の強さを変えるという観点から，例えば，物を動かすことを目的としたモーター，鉄を引き付けたり放したりして移動させることを目的としたクレーンなどが考えられる。"],"k":[],"s":[]}},"rika-5-B-1":{"page":67,"name":"植物の発芽，成長，結実","expl":{"intro":["本内容は，第４学年「Ｂ(2)季節と生物」の学習を踏まえて，「生命」についての基本的な概念等を柱とした内容のうちの「生命の連続性」に関わるものであり，中学校第２分野「(1)ア(ｲ)生物の体の共通点と相違点」，「(5)ア(ｱ)生物の成長と殖え方」の学習につながるものである。","ここでは，児童が，発芽，成長及び結実の様子に着目して，それらに関わる条件を制御しながら，植物の育ち方を調べることを通して，植物の発芽，成長及び結実とその条件についての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に予想や仮説を基に，解決の方法を発想する力や生命を尊重する態度，主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 適当な温度下で種子に水を与えると，種子は水を吸い，根や芽を出し，発芽することから，発芽と種子の中の養分との関係に着目して，発芽前後の種子の養分の存在を比較しながら調べる。これらの活動を通して，発芽と種子の養分との関係についての予想や仮説を基に，解決の方法を発想し，表現するとともに，植物は，種子の中の養分を基にして発芽することを捉えるようにする。種子が発芽するための養分についてはでんぷんを扱う。その際，希釈したヨウ素液などを使用して，種子の中のでんぷんの存在を調べるなどの方法が考えられる。","(ｲ) 身近な植物の種子の発芽の様子に着目して，例えば，水や空気の条件を一定にして，温度の条件を変えるなど，水，空気及び温度といった条件を制御しながら，種子が発芽するために必要な環境条件を調べる。これらの活動を通して，発芽の条件についての予想や仮説を基に，解決の方法を発想し，表現するとともに，発芽には水，空気及び適当な温度が関係していることを捉えるようにする。","(ｳ) 身近な植物の成長の様子に着目して，日光や肥料などの環境条件が適した場合とそうでない場合を設定するなど，条件を制御しながら植物が成長するのに必要な環境条件を調べる。これらの活動を通して,植物の成長の条件についての予想や仮説を基に，解決の方法を発想し，表現するとともに，植物の成長には，日光や肥料などが関係していることを捉えるようにする。","(ｴ) 身近な植物の花のつくりや結実の様子に着目して，おしべやめしべなどの花のつくりを調べたり，顕微鏡を使って花粉を観察したり，受粉の有無といった条件を制御しながら実のでき方を調べたりする。これらの活動を通して，花のつくりや結実の条件についての予想や仮説を基に，解決の方法を発想し，表現するとともに，花にはおしべやめしべなどがあり，花粉がめしべの先に付くとめしべのもとが実になり，実の中に種子ができることを捉えるようにする。また，ここで扱った植物が，自然の中では，風や昆虫などによって花粉が運ばれて受粉し結実することにも触れるようにする。","ここで扱う対象としては，(ｱ)，(ｲ)では，種子が大きく，観察しやすいものを取り上げる。また，(ｳ)では，生命尊重の立場から，成長との関係が確認できたところで実験を終了し，花壇などに植え替えるなどして，実験に利用した植物を枯らさないように配慮するようにする。さらに，(ｱ)，(ｲ)，(ｳ)では，養分などの要因によって発芽や成長に関わる環境条件の制御が困難になることがないようにするため，養分の含まれていない保水性のある基質を使用することが考えられる。(ｴ)では，花のつくりについては，おしべ，めしべ，がく及び花びらの存在を確かめるようにする。受粉と結実との関係を調べるためには，おばな，めばなのある植物を扱って，実験を行うことが考えられる。","ここでの指導に当たっては，発芽の条件と成長の条件について混同しやすいので，発芽と成長の意味を観察，実験を通して捉えるとともに，条件については，変える条件と変えない条件を区別し，その操作と関連付けてその意味を捉えるようにする。また，発芽や成長の条件について調べる際には，観察，実験の方法や結果を表に整理するなど，植物の育ち方について考えたり，説明したりする活動の充実を図るようにする。花粉の観察においては，顕微鏡を適切に操作して，花粉の特徴を捉えることが考えられる。"],"k":[],"s":[]}},"rika-5-B-2":{"page":70,"name":"動物の誕生","expl":{"intro":["本内容は，第４学年「Ｂ(2)季節と生物」の学習を踏まえて，「生命」についての基本的な概念等を柱とした内容のうちの「生命の連続性」に関わるものであり，中学校第２分野「(5)ア(ｱ)生物の成長と殖え方」の学習につながるものである。","ここでは，児童が，魚を育てたり人の発生についての資料を活用したりする中で，卵や胎児の様子に着目して，時間の経過と関係付けて，動物の発生や成長を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に予想や仮説を基に，解決の方法を発想する力や生命を尊重する態度，主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 魚を育て観察する中で，魚が産んだ卵の中の様子に着目して，それらと時間の経過とを関係付けて，卵の中の変化を継続して観察して調べる。これらの活動を通して，卵の中が変化する様子やふ化する様子についての予想や仮説を基に，解決の方法を発想し，表現するとともに，魚には雌雄があり，生まれた卵は日がたつにつれて中の様子が変化してかえることを捉えるようにする。その際，雌雄では体の形状が異なることや，卵の中には育つための養分が含まれていることも捉えるようにする。","(ｲ) 胎児の母体内での成長に着目して，それらと時間の経過とを関係付けて，胎児の成長の様子を調べる。これらの活動を通して，人の母体内での成長についての予想や仮説を基に，解決の方法を発想し，表現するとともに，人は，受精した卵が母体内で少しずつ成長して体ができていくことや，母体内でへその緒を通して養分をもらって成長することを捉えるようにする。","ここで扱う対象としては，(ｱ)については，内部の変化の様子を捉えやすい魚の卵が適しており，これらを実体顕微鏡などを用いて観察していくようにする。(ｲ)については，母体内の成長を直接観察することが困難なので，映像や模型，その他の資料を活用して調べるようにする。","ここでの指導に当たっては，(ｱ)については，観察の計画を立て，継続的に調べるようにする。魚の卵の内部の変化を観察する際に，実体顕微鏡などの観察器具を適切に操作できるように指導する。また，(ｲ)については，資料を基に調べる計画を立てるようにする。母体内での成長については，直接観察することが難しく，連続的に成長していくことを捉えにくいので，魚の卵の成長と関係付けながら捉えるようにする。","なお，ここでは，人の卵と精子が受精に至る過程については取り扱わないものとする。"],"k":[],"s":[]}},"rika-5-B-3":{"page":71,"name":"流れる水の働きと土地の変化","expl":{"intro":["本内容は，第４学年「Ｂ(3)雨水の行方と地面の様子」の学習を踏まえて，「地球」についての基本的な概念等を柱とした内容のうちの「地球の内部と地表面の変動」，「地球の大気と水の循環」に関わるものであり，第６学年「Ｂ(4)土地のつくりと変化」の学習につながるものである。","ここでは，児童が，流れる水の速さや量に着目して，それらの条件を制御しながら，流れる水の働きと土地の変化を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に予想や仮説を基に，解決の方法を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 川を流れる水の速さや量に着目して，それらと土地の変化とを関係付けて，流れる水の働きを調べる。これらの活動を通して，流れる水の働きと土地の変化との関係についての予想や仮説を基に，解決の方法を発想し，表現するとともに，流れる水には，土地を侵食したり，石や土などを運搬したり堆積させたりする働きがあることを捉えるようにする。","(ｲ) 川を流れる水の速さや量に着目して，それらと川原の石の大きさや形とを関係付けて，川の様子の違いを調べる。これらの活動を通して，石の大きさや形と流れる水の働きとの関係についての予想や仮説を基に，解決の方法を発想し，表現するとともに，川の上流と下流によって，川原の石の大きさや形に違いがあることを捉えるようにする。また，上流から下流まで，川を全体として捉え，上流では侵食の働きがよく見られ，下流では堆積の働きがよく見られることなど，流れる水の働きの違いによる川の様子の違いを捉えるようにする。","(ｳ) 雨が短時間に多量に降ったり，長時間降り続いたりしたときの川を流れる水の速さや量に着目して，水の速さや量といった条件を制御しながら，増水による土地の変化の様子を調べる。これらの活動を通して，水の速さや量の変化に伴う流れる水の働きの変化についての予想や仮説を基に，解決の方法を発想し，表現するとともに，雨の降り方によって，水の速さや量が増し，地面を大きく侵食したり，石や土を多量に運搬したり堆積させたりして，土地の様子が大きく変化する場合があることを捉えるようにする。","ここでの指導に当たっては，野外での直接観察のほか，適宜，人工の流れをつくったモデル実験を取り入れて，流れる水の速さや量を変え，土地の変化の様子を調べることで，流れる水の働きについて捉えるようにすることが考えられる。また，流れる水には，土地を侵食したり，石や土などを運搬したり堆積させたりする働きがあることや増水により土地の様子が大きく変化することを捉えるために，第４学年「Ｂ(3)雨水の行方と地面の様子」の学習との関連を図るようにする。さらに，観察，実験の結果と実際の川の様子とを関係付けて捉えたり，長雨や集中豪雨により増水した川の様子を捉えたりするために，映像，図書などの資料を活用することが考えられる。","日常生活との関連としては，長雨や集中豪雨がもたらす川の増水による自然災害に触れるようにする。","なお，川の現地学習に当たっては，気象情報に注意するとともに，事故防止に配慮するように指導する。"],"k":[],"s":[]}},"rika-5-B-4":{"page":73,"name":"天気の変化","expl":{"intro":["本内容は，第４学年「Ｂ(4)天気の様子」の学習を踏まえて，「地球」についての基本的な概念等を柱とした内容のうちの「地球の大気と水の循環」に関わるものであり，中学校第２分野「(4)気象とその変化」の学習につながるものである。","ここでは，児童が，雲の量や動きに着目して，それらと天気の変化とを関係付けて，天気の変化の仕方を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に予想や仮説を基に，解決の方法を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 雲の量や動きに着目して，それらと天気の変化とを関係付けて，１日の雲の量や動きを調べる。これらの活動を通して，天気の変化の仕方についての予想や仮説を基に，解決の方法を発想し，表現するとともに，天気の変化は，雲の量や動きと関係があることを捉えるようにする。また，実際に観察した結果から，雲の形や量，動きの多様さに触れ，雲には様々なものがあることを捉えるようにする。","(ｲ) 数日間の雲の量や動きに着目して，それらと気象衛星などから得た雲の量や動きの情報とを関係付けて，天気の変化の仕方を調べる。これらの活動を通して，天気の変化の仕方についての予想や仮説を基に，解決の方法を発想し，表現するとともに，天気はおよそ西から東へ変化していくという規則性があり，映像などの気象情報を用いて予想ができることを捉えるようにする。その際，台風の進路についてはこの規則性が当てはまらないことや，台風がもたらす降雨は短時間に多量になることにも触れるようにする。","ここで扱う対象としては，雨に関係する雲として，例えば，乱層雲や積乱雲などが考えられる。","ここでの指導に当たっては，身近な自然現象としての雲を観察することにより，気象現象に興味・関心をもち，天気を予想することができるようにする。","日常生活との関連としては，長雨や集中豪雨，台風などの気象情報から，自然災害に触れるようにする。","なお，雲を野外で観察する際には，気象情報に注意するとともに，太陽を直接見ないように指導し，事故防止に配慮するように指導する。"],"k":[],"s":[]}},"rika-6-A-1":{"page":77,"name":"燃焼の仕組み","expl":{"intro":["本内容は，第４学年「Ａ(1)空気と水の性質」の学習を踏まえて，「粒子」についての基本的な概念等を柱とした内容のうちの「粒子の存在」，「粒子の結合」に関わるものであり，中学校第１分野「(2)ア(ｱ)物質のすがた」，「(4)ア(ｲ)化学変化」の学習につながるものである。","ここでは，児童が，空気の変化に着目して，物の燃え方を多面的に調べる活動を通して，燃焼の仕組みについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主により妥当な考えをつくりだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 植物体が燃えるときの空気の変化に着目して，植物体が燃える前と燃えた後での空気の性質や植物体の変化を多面的に調べる。これらの活動を通して，燃焼の仕組みについて，より妥当な考えをつくりだし，表現するとともに，植物体が燃えるときには，空気中に含まれる酸素の一部が使われて，二酸化炭素ができることを捉えるようにする。また，酸素には物を燃やす働きがあることや，燃えた後の植物体の様子も変化していることを捉えるようにする。さらに，実験結果や資料を基に，空気には，主に，窒素，酸素，二酸化炭素が含まれていることを捉えるようにする。その際，植物体を空気中で燃やすと，空気の入れ替わるところでは燃えるが，入れ替わらないところでは燃えなくなってしまうことを，実験を通して捉えることが考えられる。","ここで扱う対象としては，燃焼の様子を観察しやすい植物体として，例えば，木片や紙などが考えられる。","ここでの指導に当たっては，日常生活の中で物を燃やす体験が少ない現状を踏まえ，物が燃える現象を十分に観察できるような場を設定する。また，物が燃える際に，酸素の一部が使われ二酸化炭素ができることを捉える際には，二酸化炭素の有無を調べることができる石灰水や，酸素や二酸化炭素の割合を調べることのできる気体検知管や気体センサーといった測定器具などを用いることが考えられる。その際，物が燃えたときの空気の変化について，図や絵，文を用いて表現するなど，燃焼の仕組みについて考えたり，説明したりする活動の充実を図るようにする。","なお，燃焼実験の際の火の取扱いや気体検知管の扱い方などについて十分指導するとともに，保護眼鏡を使用するなど，安全に配慮するように指導する。"],"k":[],"s":[]}},"rika-6-A-2":{"page":78,"name":"水溶液の性質","expl":{"intro":["本内容は，第５学年「Ａ(1)物の溶け方」の学習を踏まえて，「粒子」についての基本的な概念等を柱とした内容のうちの「粒子の結合」，「粒子の保存性」に関わるものであり，中学校第１分野「(2)ア(ｲ)水溶液」，「(4)ア(ｲ)化学変化」の学習につながるものである。","ここでは，児童が，水に溶けている物に着目して，それらによる水溶液の性質や働きの違いを多面的に調べる活動を通して，水溶液の性質や働きについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主により妥当な考えをつくりだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 水に溶けている物に着目して，水溶液の違いを多面的に調べる。これらの活動を通して，水溶液の性質について，より妥当な考えをつくりだし，表現するとともに，水溶液には，酸性，アルカリ性及び中性のものがあることを捉えるようにする。その際，水溶液には，色やにおいなどの異なるものがあることや，同じように無色透明な水溶液でも，溶けている物を取り出すと違った物が出てくることがあることなどから，水溶液の性質の違いを捉えるようにする。また，リトマス紙などを用いて調べることにより，酸性，アルカリ性，中性の三つの性質にまとめられることを捉えるようにする。","(ｲ) 水に溶けている物に着目して，水溶液の性質や働きを多面的に調べる。これらの活動を通して，気体が溶けている水溶液の性質や働きについて，より妥当な考えをつくりだし，表現するとともに，水溶液には気体が溶けているものがあることを捉えるようにする。その際，水溶液を振り動かしたり温めたりすると，気体を発生するものがあることや，発生した気体を調べると，その気体特有の性質を示すものがあること，発生した気体は再び水に溶けることを捉えるようにする。さらに，水溶液を加熱すると，固体が溶けている場合と違って，何も残らないものがあることから，溶けていた気体が空気中に出ていったことを捉えるようにする。","(ｳ) 水溶液に溶かした金属や水溶液から取り出した物に着目して，水溶液の性質や働きの違いを多面的に調べる。これらの活動を通して，水溶液の性質や働きについて，より妥当な考えをつくりだし，表現するとともに，水溶液には，金属を入れると金属が溶けて気体を発生させたり，金属の表面の様子を変化させたりするものがあることを捉えるようにする。その際，金属が溶けた水溶液から溶けている物を取り出して調べると，元の金属とは違う新しい物ができていることがあることを実験を通して捉えるようにする。","ここで扱う対象としては，水溶液については，例えば，炭酸水，薄い塩酸，薄い水酸化ナトリウム水溶液などが考えられる。(ｳ)については，例えば，鉄やアルミニウムなど，生活の中でよく見かけるもので性質やその変化が捉えやすい金属を使用することが考えられる。","ここでの指導に当たっては，水溶液の性質や金属の質的変化について，多面的に調べた結果を表に整理したり，そこから考えたことを図や絵，文を用いて表現したりするなど，水溶液の性質について考えたり，説明したりする活動の充実を図るようにする。","日常生活との関連として，身の回りで使用されている酸性やアルカリ性の水溶液を調べるといった活動が考えられる。","なお，実験に使用する薬品については，その危険性や扱い方について十分指導するとともに，保護眼鏡を使用するなど，安全に配慮するように指導する。また，事故のないように配慮し管理するとともに，使用した廃液などについても，環境に配慮し適切に処理する必要があることを指導する。"],"k":[],"s":[]}},"rika-6-A-3":{"page":80,"name":"てこの規則性","expl":{"intro":["本内容は，第５学年「Ａ(2)振り子の運動」の学習を踏まえて，「エネルギー」についての基本的な概念等を柱とした内容のうちの「エネルギーの捉え方」に関わるものであり，中学校第１分野「(1)ア(ｲ)力の働き」の学習につながるものである。","ここでは，児童が，加える力の位置や大きさに着目して，これらの条件とてこの働きとの関係を多面的に調べる活動を通して，てこの規則性についての理解を図り，観察，実験などに関する技能を身に付けるとともに，主により妥当な考えをつくりだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) てこを働かせたときの，力を加える位置や力の大きさに着目して，てこのつり合いの条件を制御しながら調べる。これらの活動を通して，力を加える位置や力の大きさとてこを傾ける働きとの関係について，より妥当な考えをつくりだし，表現するとともに，力を加える位置や力の大きさを変えると，てこを傾ける働きが変わり，てこがつり合うときにはそれらの間に規則性があることを捉えるようにする。その際，１カ所で支えて水平になった棒の支点から左右に等距離の位置に物をつり下げ，両側の物の重さが等しいとき，棒が水平になってつり合うことも捉えるようにする。","(ｲ) 身の回りの様々な道具で，力を加える位置や力の大きさに着目して，てこの規則性と道具の仕組みや働きとの関係を多面的に調べる。これらの活動を通して，てこの規則性について，より妥当な考えをつくりだし，表現するとともに，身の回りには，てこの規則性を利用した道具があり，てこの規則性が日常生活の様々な場面で活用されていることを捉えるようにする。","ここで扱う対象としては，(ｱ)については，てこ実験器，(ｲ)については，ペンチ，釘抜き，空き缶つぶし，トングなどが考えられる。","ここでの指導に当たっては，支点からの距離とおもりの重さとの関係を表などに整理するなど，てこの規則性について考えたり，説明したりする活動の充実を図り，これらの活動を通して，てこがつり合っている場合は，「左側の（力点にかかるおもりの重さ）×（支点から力点までの距離）＝右側の（力点にかかるおもりの重さ）×（支点から力点までの距離）」という関係式が成立することを捉えるようにする。このことから，てこを傾ける働きの大きさが，（力点にかかるおもりの重さ）×（支点から力点までの距離）で決まり，両側のてこを傾ける働きの大きさが等しいときにつり合うというてこの規則性を捉えるようにする。その際，算数科の反比例の学習と関連を図ることが考えられる。","日常生活との関連として，てこの規則性が利用されている様々な道具を調べる際には，「支点」，「力点」，「作用点」等の言葉を用いて説明したり，どのような便利さが得られるかについて話し合ったりするなど，道具の効果とてこの規則性とを関係付けて考えられるようにする。"],"k":[],"s":[]}},"rika-6-A-4":{"page":82,"name":"電気の利用","expl":{"intro":["本内容は，第５学年「Ａ(3)電流がつくる磁力」の学習を踏まえて，「エネルギー」についての基本的な概念等を柱とした内容のうちの「エネルギーの変換と保存」，「エネルギー資源の有効利用」に関わるものであり，中学校第１分野「(3)ア(ｱ)電流」，「(7)科学技術と人間」の学習につながるものである。","ここでは，児童が，電気の量や働きに着目して，それらを多面的に調べる活動を通して，発電や蓄電，電気の変換についての理解を図り，観察，実験などに関する技能を身に付けるとともに，主により妥当な考えをつくりだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 身の回りにある発電，蓄電に関する道具に着目して，手回し発電機や光電池などを使って発電したり，蓄電器に電気を蓄えたりできることを多面的に調べる。これらの活動を通して，発電や蓄電について，電気の量と働きとの関係について，より妥当な考えをつくりだし，表現するとともに，電気は，つくりだしたり蓄えたりすることができることを捉えるようにする。","(ｲ) 豆電球や発光ダイオードを点灯させたり，電子オルゴールを鳴らしたり，電熱線を発熱させたり，モーターを回転させたりしたときの電気の働きに着目して，それらを多面的に調べる。これらの活動を通して，電気の変換について，より妥当な考えをつくりだし，表現するとともに，電気は，光，音，熱，運動などに変換することができることを捉えるようにする。","(ｳ) 身の回りにある，電気を利用している道具の働きに着目して，電気の利用の仕方を多面的に調べる。これらの活動を通して，発電や蓄電，電気の変換について，より妥当な考えをつくりだし，表現するとともに，発電したり，蓄電したり，変換させたりしながら利用していることを捉えるようにする。その際，身の回りには，電気の働きを目的に合わせて制御したり，電気を効率よく利用したりしている物があることを捉えるようにする。","ここで扱う対象としては，電気を蓄える物として，例えば，コンデンサーなどの蓄電器が考えられる。電気をつくりだしたり，蓄電器などに電気を蓄えたりすることができることについては，豆電球や発光ダイオードの点灯やモーターの回転などによって捉えるようにする。","ここでの指導に当たっては，児童が手回し発電機や光電池などを使って自分で電気をつくりだし，その電気を蓄えたり，変換したりすることにより，エネルギーが蓄えられることや変換されることを体験的に捉えるようにする。","日常生活との関連としては，エネルギー資源の有効利用という観点から，電気の効率的な利用について捉えるようにする。このことについて，例えば，蓄電した電気を使って，発光ダイオードと豆電球の点灯時間を比較することが考えられる。また，身の回りには，温度センサーなどを使って，エネルギーを効率よく利用している道具があることに気付き，実際に目的に合わせてセンサーを使い，モーターの動きや発光ダイオードの点灯を制御するなどといったプログラミングを体験することを通して，その仕組みを体験的に学習するといったことが考えられる。","（内容の取扱い） (1) 内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。","てこの規則性を活用したものづくりとしては，てこの働きを利用するという観点から，用途に応じて作用する力の大きさを制御することを目的としたてこや，物の重さを測定することを目的としたてんびんばかりなどが考えられる。","また，電気の働きを活用したものづくりとしては，風力や太陽光といった自然エネルギーでつくりだした電気を蓄電器に蓄えて効率的に利用することを目的とした照明などが考えられる。その際，目的に合わせてセンサーを使い，発光ダイオードの点灯を制御することなどが考えられる。"],"k":[],"s":[]}},"rika-6-B-1":{"page":84,"name":"人の体のつくりと働き","expl":{"intro":["本内容は，第４学年「Ｂ(1)人の体のつくりと運動」の学習を踏まえて，「生命」についての基本的な概念等を柱とした内容のうちの「生物の構造と機能」に関わるものであり，中学校第２分野「(3)ア(ｳ)動物の体のつくりと働き」の学習につながるものである。","ここでは，児童が，体のつくりと呼吸，消化，排出及び循環の働きに着目して，生命を維持する働きを多面的に調べる活動を通して，人や他の動物の体のつくりと働きについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主により妥当な考えをつくりだす力や生命を尊重する態度，主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 人や他の動物の呼吸の働きに着目して，吸気と呼気の成分などを基に，肺を通して血液中に酸素を取り入れ，血液中の二酸化炭素などを体外に排出する働きを多面的に調べる。これらの活動を通して，呼吸の働きについて，より妥当な考えをつくりだし，表現するとともに，人や他の動物は体内に酸素を取り入れ，体外に二酸化炭素などを出していることを捉えるようにする。","(ｲ) 人や他の動物の消化の働きに着目して，食べた物が変化し体内に取り入れられることを多面的に調べる。これらの活動を通して，消化や排出の働きについて，より妥当な考えをつくりだし，表現するとともに，食べた物は口から，食道，胃，小腸，大腸へと移動する間に消化されていくことや，口では咀しゃくが行われ，消化された養分は腸から吸収されて血液中に入り，吸収されなかった物はふんとして肛門から排出されることを捉えるようにする。","(ｳ) 人や他の動物の血液の循環に着目して，心臓の動きと血液の流れを関係付けて，血液に入った養分や酸素，肺から取り入れられた酸素の行方などを多面的に調べる。これらの活動を通して，血液の働きについて，より妥当な考えをつくりだし，表現するとともに，血液が，心臓の働きで体内を巡り，養分や酸素などを体のすみずみまで運んでいることや二酸化炭素を体のすみずみから運び出していることを捉えるようにする。また，肺から心臓に戻る血液には，酸素が多く含まれ，全身から心臓に戻る血液には，二酸化炭素が多く含まれることを捉えるようにする。その際，人や他の動物は心臓の拍動数と脈拍数が関係することから，心臓の動きと血液の流れが関係していることに触れるようにする。","(ｴ) 人や他の動物の体内の臓器に着目して，呼吸，消化，吸収，排出などと臓器との関係を多面的に調べる。これらの活動を通して，個々の臓器と生命を維持する働きとの関係について，より妥当な考えをつくりだし，表現するとともに，呼吸には肺が関係し，消化，吸収には主に胃，小腸，大腸，肝臓が関係し，排出には腎臓が関係し，血液の循環には心臓が関係していることを捉えるようにするとともに，それらが相互に働き合って生命が維持されていることを捉えるようにする。また，これらの臓器の名称ととともに，体内における位置を捉えるようにする。","ここで扱う対象としては，人の体を中心とし，呼気や吸気を調べる活動では指示薬や気体検知管，気体センサーなどによる酸素や二酸化炭素の測定が，消化を調べる活動ではヨウ素液によるヨウ素デンプン反応などが考えられる。また，他の動物としては，呼吸の状態などが調べられる身近で安全な哺乳類や魚類が考えられる。体のつくりの観察については魚の解剖や標本などの活用が考えられ,その際，事前にその意義を十分説明するよう留意する。","ここでの指導に当たっては，人や他の動物の体のつくりや働きについて，個々の臓器の働きといった部分で見たり，生命を維持する働きという全体で見たりすることや，人と他の動物の体のつくりと働きを比較しながら調べることで，理解を深めるようにする。その際，映像や模型，図書，コンピュータシミュレーションなどを活用して調べたり，調べたことを図や表などに整理して伝え合ったりするなど，人や他の動物の体のつくりや働きについて考えたり，説明したりする学習活動の充実を図るようにする。"],"k":[],"s":[]}},"rika-6-B-2":{"page":86,"name":"植物の養分と水の通り道","expl":{"intro":["本内容は，第３学年「Ｂ(1)身の回りの生物」の学習を踏まえて，「生命」についての基本的な概念等を柱とした内容のうちの「生物の構造と機能」に関わるものであり，中学校第２分野「(3)ア(ｲ)植物の体のつくりと働き」の学習につながるものである。","ここでは，児童が，植物の体のつくりと体内の水などの行方や葉で養分をつくる働きに着目して，生命を維持する働きを多面的に調べる活動を通して，植物の体のつくりと働きについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主により妥当な考えをつくりだす力や生命を尊重する態度，主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 植物の体のつくりと葉で養分をつくる働きに着目して，葉の中のでんぷんの存在を多面的に調べる。これらの活動を通して，日光と葉の中のでんぷんのでき方との関係について，より妥当な考えをつくりだすとともに，葉の中のでんぷんの存在から，植物が日光に当たると自らでんぷんをつくりだしていることを捉えるようにする。その際，日光が当たっている何枚かの葉で，アルミニウム箔などを被せて遮光した葉と遮光しない葉を用いて，希釈したヨウ素液などを使用して，葉の中のでんぷんの存在を比較しながら調べるなどの方法が考えられる。","(ｲ) 植物の体のつくりと体内の水などの行方に着目して，植物の体内での水の通り道を多面的に調べる。これらの活動を通して，植物の体内での水の行方について，より妥当な考えをつくりだし，表現するとともに，植物の根，茎及び葉には水の通り道があり，すみずみまで水が行きわたっていることや，根から吸い上げられた水は主に葉から蒸散により水蒸気として排出されていることを捉えるようにする。その際，植物に着色した水を吸わせ，茎や葉などを切ってその体の内部のつくりを観察したり，何枚かの葉に透明な袋で覆いをして袋に付く水の量を観察したりすることなどが考えられる。蒸散により排出される水の量を調べる際には，気温が高い晴れの日を選ぶようにする。","ここで扱う対象としては，葉ででんぷんがつくられる植物を扱う。","ここでの指導に当たっては，児童の理解の充実を図るために，観察，実験とともに，映像や模型，その他の資料を活用することが考えられる。"],"k":[],"s":[]}},"rika-6-B-3":{"page":87,"name":"生物と環境","expl":{"intro":["本内容は，第４学年「Ｂ(2)季節と生物」の学習を踏まえて，「生命」についての基本的な概念等を柱とした内容のうちの「生物と環境の関わり」に関わるものであり，中学校第２分野「(7)ア(ｱ)生物と環境」の学習につながるものである。","ここでは，児童が，生物と水，空気及び食べ物との関わりに着目して，それらを多面的に調べる活動を通して，生物と持続可能な環境との関わりについて理解を図り，観察，実験などに関する技能を身に付けるとともに，主により妥当な考えをつくりだす力や生命を尊重する態度，主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 動物は，水及び空気がないと生きていくことができないことや，植物は水が不足すると枯れてしまうことなどから，生物と水及び空気との関わりに着目して，それらを多面的に調べる。これらの活動を通して，生物と周囲の環境との関わりについて，より妥当な考えをつくりだし，表現するとともに，生物は水及び空気を通して周囲の環境と関わって生きていることを捉えるようにする。その際，地球上の水は，海や川などから蒸発し，水蒸気や雲となり，雨となるなど循環していることに触れるようにする。また，生物は酸素を吸って二酸化炭素をはき出しているが，植物は光が当たると二酸化炭素を取り入れて酸素を出すなど，生物が空気を通して周囲の環境と関わって生きていることを捉えるようにする。","(ｲ) 様々な動物の食べ物に着目して，生物同士の関わりを多面的に調べる。これらの活動を通して，生物同士の関わりについて，より妥当な考えをつくりだし，表現するとともに，植物を食べている動物がいることや，その動物も他の動物に食べられることがあること，生物には食う食われるという関係があるということを捉えるようにする。その際，池や川などの水を採取し，顕微鏡などを使って，水中の小さな生物を観察することにより，魚が，水中にいる小さな生物を食べて生きていることに触れるようにする。","(ｳ) 人の生活について，環境との関わり方の工夫に着目して，持続可能な環境との関わり方を多面的に調べる。これらの活動を通して，人と環境との関わりについて，より妥当な考えをつくりだし，表現するとともに，人は，環境と関わり，工夫して生活していることを捉えるようにする。その際，人の生活が環境に及ぼす影響を少なくする工夫や，環境から人の生活へ及ぼす影響を少なくする工夫，よりよい関係をつくりだす工夫など，人と環境との関わり方の工夫について考えるようにする。","ここで扱う対象としては，(ｱ)については，例えば，植物が酸素を出しているかを調べるために，気体検知管や気体センサーなどを活用して，酸素や二酸化炭素の検出を行うことが考えられる。また，地球上の水や空気の存在を想起するなど，生物と環境との関わりについて考察することが考えられる。(ｲ)については，例えば，植物体を食べる身近な動物として，昆虫や草食性の哺乳類などを扱うとともに，動物を食べる動物として，肉食性の哺乳類や節足動物などを扱うようにし，食べ物を通した関わりについて考察するようにする。(ｳ)については，例えば，科学技術を活用して水や空気など周囲の環境に与える影響を少なくする工夫や，情報を活用して環境の変化を事前に予測し受ける影響を少なくする工夫，また，人が自然に働きかけることでよりよい関係をつくりだす工夫について扱うことが考えられる。","ここでの指導に当たっては，観察，実験が行いにくい活動については，児童の理解の充実を図るために，映像や模型，図書などの資料を活用することが考えられる。(ｱ)については，水の循環や酸素，二酸化炭素の出入りを図で表現するなど，生物と環境との関わりについて考えたり，説明したりする活動の充実を図るようにする。(ｲ)については，植物は自らでんぷんをつくりだしているが，人や他の動物は植物あるいは動物を食べていることから，食べ物を通して生物が関わり合って生きていることを整理し，相互の関係付けを図って理解できるようにする。水中の小さな生物を観察する際には，顕微鏡などの観察器具を適切に操作できるように指導する。(ｳ)については，これまでの理科の学習を踏まえて，自分が環境とよりよく関わっていくためにはどのようにすればよいか，日常生活に当てはめて考察するなど，持続可能な社会の構築という観点で扱うようにする。"],"k":[],"s":[]}},"rika-6-B-4":{"page":89,"name":"土地のつくりと変化","expl":{"intro":["本内容は，第４学年「Ｂ(3)雨水の行方と地面の様子」，第５学年「Ｂ(3)流れる水の働きと土地の変化」の学習を踏まえて，「地球」についての基本的な概念等を柱とした内容のうちの「地球の内部と地表面の変動」に関わるものであり，中学校第２分野「(2)大地の成り立ちと変化」の学習につながるものである。","ここでは，児童が，土地やその中に含まれている物に着目して，土地のつくりやでき方を多面的に調べる活動を通して，土地のつくりや変化についての理解を図り，観察，実験などに関する技能を身に付けるとともに，主により妥当な考えをつくりだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 崖や切り通しなどで土地やその中に含まれる物に着目して，土地のつくりを多面的に調べる。これらの活動を通して，土地のつくりについて，より妥当な考えをつくりだし，表現するとともに，土地は，礫，砂，泥，火山灰などからできており，幾重にも層状に重なり地層をつくって広がっているものがあることを捉えるようにする。また，地層には化石が含まれているものがあることや，礫，砂，泥については，粒の大きさに違いがあることを捉えるようにする。その際，複数の地点の地層のつくりを層の構成物の粒の大きさや形，色を相互に関係付けて調べ，地層の重なりや広がりを捉えるようにする。なお，土地の構成物を調べる際には，例えば，地質ボーリングの資料を利用することが考えられる。","(ｲ) 土地やその中に含まれる物に着目して，粒の大きさや形や色などの特徴から，土地のでき方を多面的に調べる。これらの活動を通して，地層ができた要因について，より妥当な考えをつくりだし，表現するとともに，地層は，流れる水の働きや火山の噴火によってできることを捉えるようにする。その際，地層の中に含まれる丸みを帯びた礫や砂などから，流れる水の働きによってつくられた地層であることを捉えるようにする。また，流れる水の働きでできた岩石として礫岩，砂岩，泥岩を扱うこととする。一方，火山灰や多くの穴をもつ石が地層の中に含まれていることなどから，火山の噴火によってつくられた地層もあることを捉えるようにする。","(ｳ) 土地の様子に着目して，火山の活動や地震による土地の変化を多面的に調べる。これらの活動を通して，土地のつくりやでき方について，より妥当な考えをつくりだし，表現するとともに，土地は，火山の噴火や地震によって変化することを捉えるようにする。その際，火山の噴火によって，溶岩が流れ出したり，火山灰が噴き出したりして変化した土地の様子や，大きな地震によって地割れが生じたり断層が地表に現れたり崖が崩れたりした様子を調べることが考えられる。","ここでの指導に当たっては，児童が土地のつくりや変化について実際に地層を観察する機会をもつようにするとともに，映像，模型，標本などの資料を活用し，土地を構成物といった部分で見たり，地層のつくりや広がりといった全体で見たりすることで，理解を深めるようにする。また，遠足や移動教室などあらゆる機会を生かすとともに，博物館や資料館などの社会教育施設を活用することが考えられる。さらに，地層のつくりや，地層が流れる水の働きによってできる場合があることを捉えるために，第４学年「Ｂ(3)雨水の行方と地面の様子」，第５学年「Ｂ(3)流れる水の働きと土地の変化」の学習との関連を図るようにする。","日常生活との関連としては，火山の噴火や地震がもたらす自然災害に触れるようにする。その際，映像，図書などの資料を基に調べ，過去に起こった火山の活動や大きな地震によって土地が変化したことや将来にも起こる可能性があることを捉えるようにする。","なお，土地の観察に当たっては，それぞれの地域に応じた指導を工夫するようにするとともに，野外観察においては安全を第一に考え，事故防止に配慮するように指導する。また，岩石サンプルを採る際には，保護眼鏡を使用するなど，安全に配慮するように指導する。"],"k":[],"s":[]}},"rika-6-B-5":{"page":92,"name":"月と太陽","expl":{"intro":["本内容は，第４学年「Ｂ(5)月と星」の学習を踏まえて，「地球」についての基本的な概念等を柱とした内容のうちの「地球と天体の運動」に関わるものであり，中学校第２分野「(6)地球と宇宙」の学習につながるものである。","ここでは，児童が，月と太陽の位置に着目して，これらの位置関係を多面的に調べる活動を通して，月の形の見え方と月と太陽の位置関係についての理解を図り，観察，実験などに関する技能を身に付けるとともに，主により妥当な考えをつくりだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 月と太陽の位置に着目して，月の形の見え方と太陽の位置関係を実際に観察したり，モデルや図で表したりして多面的に調べる。これらの活動を通して，月の形の見え方について，より妥当な考えをつくりだすとともに，月は，日によって形が変わって見え，月の輝いている側に太陽があることや，月の形の見え方は太陽と月との位置関係によって変わることを捉えるようにする。ただし，地球から見た太陽と月の位置関係で扱うものとし，地球の外から月や太陽の位置関係を捉えることについては，中学校第２分野「(6)地球と宇宙」で扱う。","ここで扱う対象としては，太陽が沈んでから見える月の他に，昼間に観察できる月も考えられる。また，月を観察する際には，クレーターなど，表面の様子にも目を向けて，月に対する興味・関心を高めるようにする。","ここでの指導に当たっては，実際に観察した月の形の見え方を，モデルや図によって表現するなど，月の位置や形と太陽の位置との関係について考えたり，説明したりする活動の充実を図るようにするとともに，数日後の月の見え方を予測する活動が考えられる。また，児童の天体に対する興味・関心を高め，理解を深めるために，移動教室や宿泊を伴う学習の機会を生かすとともに，プラネタリウムなどを活用することが考えられる。","なお，夜間の観察の際には，安全を第一に考え，事故防止に配慮するように指導する。また，昼間の月を観察し，太陽の位置を確認する際には，太陽を直接見ないようにするなど，安全に配慮するように指導する。"],"k":[],"s":[]}}}},"trowNote":"行は、つながりマップのテーマ（Claudeが学習指導要領の内容から作ったもの）です。ほかの領域の内容も、同じ系統なら同じ行に入れています。","trows":{"A":[{"name":"物の性質（粒子）","cells":{"3":[{"id":"rika-3-A-1","lab":"物と重さ"}],"4":[{"id":"rika-4-A-1","lab":"空気と水の性質"},{"id":"rika-4-A-2","lab":"金属，水，空気と温度"}],"5":[{"id":"rika-5-A-1","lab":"物の溶け方"}],"6":[{"id":"rika-6-A-1","lab":"燃焼の仕組み"},{"id":"rika-6-A-2","lab":"水溶液の性質"}]}},{"name":"力と運動","cells":{"3":[{"id":"rika-3-A-2","lab":"風とゴムの力の働き"}],"5":[{"id":"rika-5-A-2","lab":"振り子の運動"}],"6":[{"id":"rika-6-A-3","lab":"てこの規則性"}]}},{"name":"光と音","cells":{"3":[{"id":"rika-3-A-3","lab":"光と音の性質"}]}},{"name":"磁石","cells":{"3":[{"id":"rika-3-A-4","lab":"磁石の性質"}],"5":[{"id":"rika-5-A-3","lab":"電磁石"}]}},{"name":"電気","cells":{"3":[{"id":"rika-3-A-5","lab":"電気の通り道"}],"4":[{"id":"rika-4-A-3","lab":"電流の働き"}],"5":[{"id":"rika-5-A-3","lab":"電流がつくる磁力"}],"6":[{"id":"rika-6-A-4","lab":"電気の利用"}]}}],"B":[{"name":"植物","cells":{"3":[{"id":"rika-3-B-1","lab":"植物の育ち方と体のつくり"}],"4":[{"id":"rika-4-B-2","lab":"季節と植物の成長"}],"5":[{"id":"rika-5-B-1","lab":"植物の発芽，成長，結実"}],"6":[{"id":"rika-6-B-2","lab":"植物の養分と水の通り道"}]}},{"name":"動物と人の体","cells":{"3":[{"id":"rika-3-B-1","lab":"昆虫の育ち方と体のつくり"}],"4":[{"id":"rika-4-B-1","lab":"人の体のつくりと運動"},{"id":"rika-4-B-2","lab":"季節と動物の活動"}],"5":[{"id":"rika-5-B-2","lab":"動物の誕生"}],"6":[{"id":"rika-6-B-1","lab":"人の体のつくりと働き"}]}},{"name":"生物と環境","cells":{"3":[{"id":"rika-3-B-1","lab":"生物と周辺の環境"}],"6":[{"id":"rika-6-B-3","lab":"生物と環境"}]}},{"name":"天気と水","cells":{"3":[{"id":"rika-3-B-2","lab":"日なたと日陰の地面の様子"}],"4":[{"id":"rika-4-B-4","lab":"天気の様子"}],"5":[{"id":"rika-5-B-4","lab":"天気の変化"}]}},{"name":"流れる水と土地","cells":{"4":[{"id":"rika-4-B-3","lab":"雨水の行方と地面の様子"}],"5":[{"id":"rika-5-B-3","lab":"流れる水の働きと土地の変化"}],"6":[{"id":"rika-6-B-4","lab":"土地のつくりと変化"}]}},{"name":"太陽・月・星","cells":{"3":[{"id":"rika-3-B-2","lab":"太陽の位置と日陰"}],"4":[{"id":"rika-4-B-5","lab":"月と星"}],"6":[{"id":"rika-6-B-5","lab":"月と太陽"}]}},{"name":"季節と自然","cells":{"4":[{"id":"rika-4-B-2","lab":"季節と生物"}]}}]}},{"id":"taiiku","name":"体育","section":"第２章 第９節 体育","textbook":"東京書籍（保健）","grades":[1,2,3,4,5,6],"areas":[{"key":"A","name":"Ａ 体つくり","grades":[1,2,3,4,5,6]},{"key":"B","name":"Ｂ 器械運動系","grades":[1,2,3,4,5,6]},{"key":"C","name":"Ｃ 陸上運動系","grades":[1,2,3,4,5,6]},{"key":"D","name":"Ｄ 水泳運動系","grades":[1,2,3,4,5,6]},{"key":"E","name":"Ｅ ボール運動系","grades":[1,2,3,4,5,6]},{"key":"F","name":"Ｆ 表現運動系","grades":[1,2,3,4,5,6]},{"key":"G","name":"Ｇ 保健","grades":[3,4,5,6]}],"goals":{"1":{"lines":["⑴　各種の運動遊びの楽しさに触れ，その行い方を知るとともに，基本的な動きを身に付けるようにする。","⑵　各種の運動遊びの行い方を工夫するとともに，考えたことを他者に伝える力を養う。","⑶　各種の運動遊びに進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，健康・安全に留意したりし，意欲的に運動をする態度を養う。"],"page":36,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動遊びの楽しさに触れることを通して，その行い方を知るとともに，それらの基本的な動きを身に付けること及び体力を養うことを意図している。","各種の運動遊びとは，児童の発達の段階を踏まえ，ねらいとする動きを遊びの要素を取り入れて行うものであり，児童が成功体験を得やすいように課題やルール，場や用具等が緩和された体つくりの運動遊び，器械・器具を使っての運動遊び，走・跳の運動遊び，水遊び，ゲーム及び表現リズム遊びを指す。","楽しさに触れとは，教科の目標に示している体育や保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動遊びを通して運動の楽しさに触れることができるようにすることを目指し，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。","低学年では，全ての児童が，運動遊びを楽しく行うことができるようにすることにより，運動遊びに意欲的に取り組み，知識及び技能を身に付け，その結果として体力の向上につながることを意図している。そのためには，課題や活動の場などを工夫した易しい運動遊びを行ったり，運動遊びの取り上げ方の弾力化を図ったりすることが重要である。","その行い方を知るとは，低学年においても運動遊びの課題，行い方のきまり，用具の使い方，場の安全確保等，各種の運動遊びの行い方を知ることが，各種の基本的な動きの習得や課題の解決，友達との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","基本的な動きを身に付けるようにするとは，各種の運動遊びにおいて習得が期待される，運動種目として成立する以前の基本的な動きを身に付けることを示している。また，このねらいは，それぞれの運動遊びの楽しさに触れるようにすることを大切にしながら，基本的な動きを身に付けることを重視したものである。なお，低学年の児童は体力についての認識が低いことから，各種の運動遊びの楽しさに触れ，活発に運動遊びを行っていく中で，基本的な動きを幅広く身に付け，結果として体力の向上を図ろうとするものである。したがって，低学年の各種の運動遊びを取り上げるに当たっては，低学年児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，各種の運動遊びを安全に楽しむための活動の仕方やルールなどを児童の力に応じて工夫するとともに，考えたことを他者に伝える力を養うことを意図している。","各種の運動遊びの行い方を工夫するとは，低学年の各種の運動遊びの楽しさに触れることができるようにするために，運動遊びをする場や練習の仕方などを自らの力に応じて工夫したり，選択したりすることを示したものである。教師から提案された楽しみ方や，自己や友達が考えた楽しみ方から，自己に合った楽しみ方を選択することもその一つである。","考えたことを他者に伝えるとは，自己の工夫したことを他者に伝えることができるようにすることを示している。他者とは，共に学ぶ友達だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値のうち，公正，協力，責任，参画，健康・安全等に関する態度及び意欲的に運動遊びをする態度を養うことを意図している。特に，運動遊びをする際の良好な人間関係が運動遊びの楽しさに大きな影響を与えることや，友達と共に進んで意思決定に関わることが，運動やスポーツの意義や価値等を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることで，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。","各種の運動遊びに進んで取り組みとは，各種の運動遊びの楽しさに触れ，自ら進んで運動遊びに取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","きまりを守り誰とでも仲よく運動をしたりとは，低学年の各種の運動遊びにおいて，順番やきまりを守り，誰とでも仲よく運動遊びをしたり，友達と協力したり，公正な態度で勝敗を競ったりするなどのスポーツの価値の実現に関する態度の育成を示している。","健康・安全に留意したりとは，運動遊びをする場所や器械・器具の安全に気を付けたりする等，健康・安全に留意する態度を育てることを目指している。","意欲的に運動をする態度とは，運動をする子供とそうでない子供の二極化傾向が見られることを受け，運動遊びをする環境条件の整備も含め，低学年から誰もが意欲的に運動に取り組む態度を培う指導が大切であることを示している。運動遊びに意欲的に取り組むことにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動遊びの実践だけでなく，日常の生活において必要な態度にもつながるものである。"]},"grades":[1,2],"band":"1・2年"},"2":{"lines":["⑴　各種の運動遊びの楽しさに触れ，その行い方を知るとともに，基本的な動きを身に付けるようにする。","⑵　各種の運動遊びの行い方を工夫するとともに，考えたことを他者に伝える力を養う。","⑶　各種の運動遊びに進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，健康・安全に留意したりし，意欲的に運動をする態度を養う。"],"page":36,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動遊びの楽しさに触れることを通して，その行い方を知るとともに，それらの基本的な動きを身に付けること及び体力を養うことを意図している。","各種の運動遊びとは，児童の発達の段階を踏まえ，ねらいとする動きを遊びの要素を取り入れて行うものであり，児童が成功体験を得やすいように課題やルール，場や用具等が緩和された体つくりの運動遊び，器械・器具を使っての運動遊び，走・跳の運動遊び，水遊び，ゲーム及び表現リズム遊びを指す。","楽しさに触れとは，教科の目標に示している体育や保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動遊びを通して運動の楽しさに触れることができるようにすることを目指し，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。","低学年では，全ての児童が，運動遊びを楽しく行うことができるようにすることにより，運動遊びに意欲的に取り組み，知識及び技能を身に付け，その結果として体力の向上につながることを意図している。そのためには，課題や活動の場などを工夫した易しい運動遊びを行ったり，運動遊びの取り上げ方の弾力化を図ったりすることが重要である。","その行い方を知るとは，低学年においても運動遊びの課題，行い方のきまり，用具の使い方，場の安全確保等，各種の運動遊びの行い方を知ることが，各種の基本的な動きの習得や課題の解決，友達との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","基本的な動きを身に付けるようにするとは，各種の運動遊びにおいて習得が期待される，運動種目として成立する以前の基本的な動きを身に付けることを示している。また，このねらいは，それぞれの運動遊びの楽しさに触れるようにすることを大切にしながら，基本的な動きを身に付けることを重視したものである。なお，低学年の児童は体力についての認識が低いことから，各種の運動遊びの楽しさに触れ，活発に運動遊びを行っていく中で，基本的な動きを幅広く身に付け，結果として体力の向上を図ろうとするものである。したがって，低学年の各種の運動遊びを取り上げるに当たっては，低学年児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，各種の運動遊びを安全に楽しむための活動の仕方やルールなどを児童の力に応じて工夫するとともに，考えたことを他者に伝える力を養うことを意図している。","各種の運動遊びの行い方を工夫するとは，低学年の各種の運動遊びの楽しさに触れることができるようにするために，運動遊びをする場や練習の仕方などを自らの力に応じて工夫したり，選択したりすることを示したものである。教師から提案された楽しみ方や，自己や友達が考えた楽しみ方から，自己に合った楽しみ方を選択することもその一つである。","考えたことを他者に伝えるとは，自己の工夫したことを他者に伝えることができるようにすることを示している。他者とは，共に学ぶ友達だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値のうち，公正，協力，責任，参画，健康・安全等に関する態度及び意欲的に運動遊びをする態度を養うことを意図している。特に，運動遊びをする際の良好な人間関係が運動遊びの楽しさに大きな影響を与えることや，友達と共に進んで意思決定に関わることが，運動やスポーツの意義や価値等を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることで，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。","各種の運動遊びに進んで取り組みとは，各種の運動遊びの楽しさに触れ，自ら進んで運動遊びに取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","きまりを守り誰とでも仲よく運動をしたりとは，低学年の各種の運動遊びにおいて，順番やきまりを守り，誰とでも仲よく運動遊びをしたり，友達と協力したり，公正な態度で勝敗を競ったりするなどのスポーツの価値の実現に関する態度の育成を示している。","健康・安全に留意したりとは，運動遊びをする場所や器械・器具の安全に気を付けたりする等，健康・安全に留意する態度を育てることを目指している。","意欲的に運動をする態度とは，運動をする子供とそうでない子供の二極化傾向が見られることを受け，運動遊びをする環境条件の整備も含め，低学年から誰もが意欲的に運動に取り組む態度を培う指導が大切であることを示している。運動遊びに意欲的に取り組むことにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動遊びの実践だけでなく，日常の生活において必要な態度にもつながるものである。"]},"grades":[1,2],"band":"1・2年"},"3":{"lines":["⑴　各種の運動の楽しさや喜びに触れ，その行い方及び健康で安全な生活や体の発育・発達について理解するとともに，基本的な動きや技能を身に付けるようにする。","⑵　自己の運動や身近な生活における健康の課題を見付け，その解決のための方法や活動を工夫するとともに，考えたことを他者に伝える力を養う。","⑶　各種の運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や用具の安全に留意したりし，最後まで努力して運動をする態度を養う。また，健康の大切さに気付き，自己の健康の保持増進に進んで取り組む態度を養う。"],"page":67,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動の楽しさや喜びに触れることを通して，その行い方や健康な生活及び体の発育・発達について理解するとともに，それらの基本的な動きや技能を身に付けること及び体力を養うことを意図している。","各種の運動とは，児童の発達の段階を踏まえ，設定される運動であり，児童が成功体験を得やすいように，課題やルール，場や用具等が緩和された体つくり運動，器械運動，走・跳の運動，水泳運動，ゲーム及び表現運動を指す。","楽しさや喜びに触れとは，教科の目標に示している体育や保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動を通して運動の楽しさや喜びに触れることができるようにすることを目指し，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。そのためには，課題や活動の場などを工夫した易しい運動を行ったり，運動の取り上げ方の弾力化を図ったりすることが重要である。","中学年では，全ての児童が，運動の特性に応じた楽しさや喜びに触れることができるようにすることにより，運動に意欲的に取り組み，知識及び技能を身に付けることを重視し，その結果として体力の向上につながる指導等の在り方について改善を図ることを意図したものである。また，運動の楽しさだけでなく，友達と協力して得られる達成感や課題を解決した成就感などの喜びに触れることができるようにすることを意図している。そのため，中学年では，低学年の楽しさに","触れるから楽しさや喜びに触れることができるようにすることを求めている。","その行い方を知るとは，中学年においても運動の課題，行い方のきまり，場や用具の使い方，場の安全の確保等，各種の運動の行い方を知ることが，各種の運動の基本的な動きや技能の習得や友達との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","健康で安全な生活や体の発育・発達について理解するとは，保健領域の内容との関連から，健康の保持増進には，健康の大切さを認識できるようにするとともに，毎日の生活の仕方が関わっていること，体を清潔に保つこと，生活環境を健康的に整えることなどがあること，また，体の発育・発達には，年齢に伴う体の変化と身近な事柄としての思春期における体の変化などがあることについて理解できるようにすることを目指したものである。","基本的な動きや技能を身に付けるようにするとは，各種の運動の基本となる動きや技能を身に付けることを示している。また，このねらいは，それぞれの運動の楽しさや喜びに触れるようにすることを大切にしながら，基本的な動きや技能を身に付けることを重視したものである。","なお，中学年の児童は体力についての認識が低いことから，各種の運動の楽しさや喜びに触れ，活発に運動を行っていく中で，各種の運動の基本となる様々な動きや技能を身に付け，結果として体力の向上を図ることを目指すものである。したがって，中学年の各種の運動を取り上げるに当たっては，中学年の児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，自己の運動や健康に関する課題を見付け，その解決方法を工夫するとともに，それについて考えたことを他者に伝える力を養うことを意図している。","自己の運動の課題を見付けとは，自己が取り組む運動に関わり解決すべき課題を見付けることを指す。そのため，教師は，児童が自己の能力に適した運動の課題を見付けることができるように支援することが必要になる。","自己の身近な生活における健康の課題を見付けとは，保健領域の内容である健康な生活及び体の発育・発達に関わる事象や情報から，自己の健康に関する課題を見付けることを意図したものである。その際，教師は，児童がそれぞれの内容に関わる情報を収集したり，自己の経験を振り返ったりすることによって課題を見付けることができるように支援することが重要である。","その解決のための方法や活動を工夫するとは，中学年の各種の運動において見付けた自己の運動や身近な生活における健康の課題の解決に向けた方法や活動を工夫することを示している。自己の運動の課題であれば，各種の運動の楽しさや喜びに触れることができるようにするために，運動をする場や練習の仕方などを発達の段階に即して，自ら適切に工夫したり，選択したりすることを示したものである。そこには，自ら楽しみ方を工夫したり，教師や友達から提案された楽しみ方から，自己に合った楽しみ方を選択したりすることも含まれている。身近な生活における健康の課題であれば，正しい健康情報を集めたり選んだりして，課題のよりよい解決方法を予想したり考えたりすることや，学んだことを自己の生活と関連付けたりすることを示している。","考えたことを他者に伝えるとは，自己の工夫したことを他者に伝えることができるようにすることを示している。自己の考えを他者に伝えることで，自己の考えを深めることができるようにすることを意図している。他者とは，共に学ぶ友達だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者や地域の人に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値である，公正，協力，責任，参画，共生，健康・安全等に関する態度及び意欲的に運動をする態度を養うことを意図している。特に，運動をする際の良好な人間関係が運動の楽しさや喜びに大きな影響を与えることや，友達と共に進んで意思決定に関わることが，運動やスポーツの意義や価値等を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることにより，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。さらに，健康が単に疾病でないことや虚弱でないといったことだけを意味するのではなく，生活の質の向上までを含んだ積極的なものとして捉え，その健康の大切さを認識し，自己の健康の保持増進に主体的に取り組み，よりよい健康づくりを目指すとともに楽しく明るい生活を営む態度の育成を重視するという保健の「学びに向かう力，人間性等」を示している。","各種の運動に進んで取り組みとは，各種の運動の楽しさや喜びに触れ，自ら進んで運動に取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","きまりを守り誰とでも仲よく運動をしとは，中学年の各種の運動において，順番やきまりを守り，誰とでも仲よく運動をしたり，互いの違いを認めたり，友達と協力したり，公正な態度で勝敗を競ったりするなどのスポーツの価値の実現に関する態度の育成を示している。","友達の考えを認めとは，友達の考えを聞くことで，自己の考えを深めたり，友達との良好な関係を築いたりすることを目指したものである。","場や用具の安全に留意しとは，運動をする場所や器械・器具の整備，用具の安全を確かめること，水泳運動の心得を守って安全に気を付けることなど，低学年のねらいを発展させたものである。","最後まで努力して運動をする態度を養うとは，運動領域の学習で児童が学習課題の達成に向けて最後まで成し遂げる態度の育成を示している。課題に最後まで諦めずに取り組む過程で達成感を得たり，課題の解決に取り組む意味や自己の可能性に気付いたりすることにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動の実践だけでなく，日常の生活において必要な態度にもつながるものである。","健康の大切さに気付き，自己の健康の保持増進に進んで取り組む態度を養うとは，保健領域の内容に触れ健康の大切さに気付くことにより，自己の健康に関心をもち，健康の保持増進のために進んで学習活動に取り組む，課題の解決に向けて協力し合う，心身の発育・発達等を肯定的に捉える等の態度を養うことを意図したものである。"]},"grades":[3,4],"band":"3・4年"},"4":{"lines":["⑴　各種の運動の楽しさや喜びに触れ，その行い方及び健康で安全な生活や体の発育・発達について理解するとともに，基本的な動きや技能を身に付けるようにする。","⑵　自己の運動や身近な生活における健康の課題を見付け，その解決のための方法や活動を工夫するとともに，考えたことを他者に伝える力を養う。","⑶　各種の運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や用具の安全に留意したりし，最後まで努力して運動をする態度を養う。また，健康の大切さに気付き，自己の健康の保持増進に進んで取り組む態度を養う。"],"page":67,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動の楽しさや喜びに触れることを通して，その行い方や健康な生活及び体の発育・発達について理解するとともに，それらの基本的な動きや技能を身に付けること及び体力を養うことを意図している。","各種の運動とは，児童の発達の段階を踏まえ，設定される運動であり，児童が成功体験を得やすいように，課題やルール，場や用具等が緩和された体つくり運動，器械運動，走・跳の運動，水泳運動，ゲーム及び表現運動を指す。","楽しさや喜びに触れとは，教科の目標に示している体育や保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動を通して運動の楽しさや喜びに触れることができるようにすることを目指し，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。そのためには，課題や活動の場などを工夫した易しい運動を行ったり，運動の取り上げ方の弾力化を図ったりすることが重要である。","中学年では，全ての児童が，運動の特性に応じた楽しさや喜びに触れることができるようにすることにより，運動に意欲的に取り組み，知識及び技能を身に付けることを重視し，その結果として体力の向上につながる指導等の在り方について改善を図ることを意図したものである。また，運動の楽しさだけでなく，友達と協力して得られる達成感や課題を解決した成就感などの喜びに触れることができるようにすることを意図している。そのため，中学年では，低学年の楽しさに","触れるから楽しさや喜びに触れることができるようにすることを求めている。","その行い方を知るとは，中学年においても運動の課題，行い方のきまり，場や用具の使い方，場の安全の確保等，各種の運動の行い方を知ることが，各種の運動の基本的な動きや技能の習得や友達との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","健康で安全な生活や体の発育・発達について理解するとは，保健領域の内容との関連から，健康の保持増進には，健康の大切さを認識できるようにするとともに，毎日の生活の仕方が関わっていること，体を清潔に保つこと，生活環境を健康的に整えることなどがあること，また，体の発育・発達には，年齢に伴う体の変化と身近な事柄としての思春期における体の変化などがあることについて理解できるようにすることを目指したものである。","基本的な動きや技能を身に付けるようにするとは，各種の運動の基本となる動きや技能を身に付けることを示している。また，このねらいは，それぞれの運動の楽しさや喜びに触れるようにすることを大切にしながら，基本的な動きや技能を身に付けることを重視したものである。","なお，中学年の児童は体力についての認識が低いことから，各種の運動の楽しさや喜びに触れ，活発に運動を行っていく中で，各種の運動の基本となる様々な動きや技能を身に付け，結果として体力の向上を図ることを目指すものである。したがって，中学年の各種の運動を取り上げるに当たっては，中学年の児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，自己の運動や健康に関する課題を見付け，その解決方法を工夫するとともに，それについて考えたことを他者に伝える力を養うことを意図している。","自己の運動の課題を見付けとは，自己が取り組む運動に関わり解決すべき課題を見付けることを指す。そのため，教師は，児童が自己の能力に適した運動の課題を見付けることができるように支援することが必要になる。","自己の身近な生活における健康の課題を見付けとは，保健領域の内容である健康な生活及び体の発育・発達に関わる事象や情報から，自己の健康に関する課題を見付けることを意図したものである。その際，教師は，児童がそれぞれの内容に関わる情報を収集したり，自己の経験を振り返ったりすることによって課題を見付けることができるように支援することが重要である。","その解決のための方法や活動を工夫するとは，中学年の各種の運動において見付けた自己の運動や身近な生活における健康の課題の解決に向けた方法や活動を工夫することを示している。自己の運動の課題であれば，各種の運動の楽しさや喜びに触れることができるようにするために，運動をする場や練習の仕方などを発達の段階に即して，自ら適切に工夫したり，選択したりすることを示したものである。そこには，自ら楽しみ方を工夫したり，教師や友達から提案された楽しみ方から，自己に合った楽しみ方を選択したりすることも含まれている。身近な生活における健康の課題であれば，正しい健康情報を集めたり選んだりして，課題のよりよい解決方法を予想したり考えたりすることや，学んだことを自己の生活と関連付けたりすることを示している。","考えたことを他者に伝えるとは，自己の工夫したことを他者に伝えることができるようにすることを示している。自己の考えを他者に伝えることで，自己の考えを深めることができるようにすることを意図している。他者とは，共に学ぶ友達だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者や地域の人に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値である，公正，協力，責任，参画，共生，健康・安全等に関する態度及び意欲的に運動をする態度を養うことを意図している。特に，運動をする際の良好な人間関係が運動の楽しさや喜びに大きな影響を与えることや，友達と共に進んで意思決定に関わることが，運動やスポーツの意義や価値等を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることにより，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。さらに，健康が単に疾病でないことや虚弱でないといったことだけを意味するのではなく，生活の質の向上までを含んだ積極的なものとして捉え，その健康の大切さを認識し，自己の健康の保持増進に主体的に取り組み，よりよい健康づくりを目指すとともに楽しく明るい生活を営む態度の育成を重視するという保健の「学びに向かう力，人間性等」を示している。","各種の運動に進んで取り組みとは，各種の運動の楽しさや喜びに触れ，自ら進んで運動に取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","きまりを守り誰とでも仲よく運動をしとは，中学年の各種の運動において，順番やきまりを守り，誰とでも仲よく運動をしたり，互いの違いを認めたり，友達と協力したり，公正な態度で勝敗を競ったりするなどのスポーツの価値の実現に関する態度の育成を示している。","友達の考えを認めとは，友達の考えを聞くことで，自己の考えを深めたり，友達との良好な関係を築いたりすることを目指したものである。","場や用具の安全に留意しとは，運動をする場所や器械・器具の整備，用具の安全を確かめること，水泳運動の心得を守って安全に気を付けることなど，低学年のねらいを発展させたものである。","最後まで努力して運動をする態度を養うとは，運動領域の学習で児童が学習課題の達成に向けて最後まで成し遂げる態度の育成を示している。課題に最後まで諦めずに取り組む過程で達成感を得たり，課題の解決に取り組む意味や自己の可能性に気付いたりすることにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動の実践だけでなく，日常の生活において必要な態度にもつながるものである。","健康の大切さに気付き，自己の健康の保持増進に進んで取り組む態度を養うとは，保健領域の内容に触れ健康の大切さに気付くことにより，自己の健康に関心をもち，健康の保持増進のために進んで学習活動に取り組む，課題の解決に向けて協力し合う，心身の発育・発達等を肯定的に捉える等の態度を養うことを意図したものである。"]},"grades":[3,4],"band":"3・4年"},"5":{"lines":["⑴　各種の運動の楽しさや喜びを味わい，その行い方及び心の健康やけがの防止，病気の予防について理解するとともに，各種の運動の特性に応じた基本的な技能及び健康で安全な生活を営むための技能を身に付けるようにする。","⑵　自己やグループの運動の課題や身近な健康に関わる課題を見付け，その解決のための方法や活動を工夫するとともに，自己や仲間の考えたことを他者に伝える力を養う。","⑶　各種の運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や用具の安全に留意したりし，自己の最善を尽くして運動をする態度を養う。また，健康・安全の大切さに気付き，自己の健康の保持増進や回復に進んで取り組む態度を養う。"],"page":112,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動の楽しさや喜びを味わうことを通して，その行い方や心の健康，けがの防止及び病気の予防について理解するとともに，各種の運動の特性に応じた基本的な技能及び健康で安全な生活を営むための技能を身に付けること及び体力を養うことを意図している。","各種の運動とは，児童の発達の段階を踏まえ，設定される運動であり，児童が成功体験を得やすいように，児童の発達の段階と運動の特性を踏まえ，課題やルール，場や用具等が緩和された体つくり運動，器械運動，陸上運動，水泳運動，ボール運動及び表現運動を指す。","楽しさや喜びを味わいとは，教科の目標に示している体育・保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動を通して運動の楽しさや喜びを味わうようにすることを目指すとともに，健康な生活や発育・発達について理解することを通して，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。そのためには，課題や活動の場などを工夫した易しい運動を行ったり，運動の取り上げ方の弾力化を図ったりすることが重要である。","高学年では，中学年の楽しさや喜びに触れる段階から，楽しさや喜びを味わうことを重視したものである。そのため，楽しさとともに，運動の特性に即して自己の力に応じた各種の運動の行い方を理解し，それらの基本的な技能を身に付けたり，それをプレイ等の中で発揮したりすることで喜びを味わうことに重点を置いている。また，個人の達成感や仲間と協力して得られる達成感等の喜びを味わうことにより，知識及び技能が更に身に付いていくことを意図している。さらに，知識及び技能を活用しながら身に付けていくことで，一層楽しさや喜びが高まっていくことを意図している。","その行い方を理解するとは，高学年においても運動の課題や約束，場や用具の使い方，場の安全の確保等，各種の運動の行い方を理解することが，各種の運動の基本的な技能の習得や仲間との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","心の健康やけがの防止，病気の予防について理解するとは，保健領域の内容との関連から，心の発達や心と体との密接な関係及び不安や悩みへの対処の仕方，交通事故や身の回りの生活の危険を予測し，回避すること，病気の起こり方と予防について理解できるようにすることを目指したものである。","各種の運動の特性に応じた基本的な技能を身に付けるようにするとは，各種の運動の基本となる技能を，それぞれの運動の特性に応じて身に付けることを示している。また，このねらいは，それぞれの運動の特性に応じた楽しさや喜びを味わうようにすることを大切にしながら，基本的な技能を身に付けることを重視したものである。","健康で安全な生活を営むための技能を身に付けるようにするとは，心の健康における不安や悩みへの対処の方法やけがの防止におけるけがなどの簡単な手当に関わる技能を身に付けるようにすることを意図し，今回，新たに示したものである。","なお，高学年の児童は体力についての認識が高まってくることを踏まえ，体力の重要性を理解するとともに，各種の運動の楽しさや喜びを味わい，活発に運動を行っていく中で，各種の運動の基本となる様々な技能を身に付け，結果として体力の向上を図ることを目指すものである。したがって，高学年の各種の運動を取り上げるに当たっては，高学年の児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，自己やグループの運動の課題や健康に関する自己の課題を見付け，その解決方法を工夫するとともに，それについて自己や仲間の考えたことを他者に伝える力を養うことを意図している。","自己やグループの運動の課題を見付けとは，自己やグループが取り組む運動に関わり解決すべき課題を見付けることを指す。取り組む運動についての課題と，課題に対応した練習の場，技や技術を確認することがそれに当たる。その際，個人が対応すべき課題とグループで対応すべき課題とを整理して確認することが大切になる。そのため，教師は，児童が自己やグループの適切な運動の課題を見付けることができるように支援することが必要になる。","身近な健康に関わる課題を見付けとは，保健領域の内容である心の発達や心と体との密接な関係及び不安や悩みへの対処の仕方，交通事故や身の回りの生活の危険を予測し，回避すること，病気の起こり方と予防についての自己の課題を見付けることを意図したものである。その際，教師は，児童がそれぞれの内容に関わる情報を収集したり，自己の経験を振り返ったりすることによって課題を見付けることができるように支援することが重要である。","その解決のための方法や活動を工夫するとは，高学年の各種の運動において見付けた自己やグループの運動や心の健康，けがの防止及び病気の予防に関する課題の解決に向けた方法や活動を工夫することを示している。自己やグループの運動の課題であれば，各種の運動の楽しさや喜びを味わうことができるようにするために，運動をする場や練習の仕方などを発達の段階に即して，自ら適切に工夫したり，選択したりすることを示している。そこには，自ら楽しみ方を工夫したり，教師や仲間から提案された楽しみ方から，自己やグループに合った楽しみ方を選択したりすることも含まれている。自己の健康の課題であれば，保健で習得した知識及び技能を活用して課題の解決方法を予想し考えたり，それらの中から適切な方法を選択したりすることを示している。","自己や仲間の考えたことを他者に伝えるとは，自己や仲間の考えたことを他者に伝えることができるようにすることを示している。自己の考えのみならず，仲間の考えたことを他者に伝えることで，他者の考えを理解するとともに自己の考えを深めることができるようにすることを意図している。他者とは，共に学ぶ仲間だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者や地域の人に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値である，公正，協力，責任，参画，共生，健康・安全等に関する態度及び意欲的に運動をする態度を養うことを意図している。特に，運動をする際の良好な人間関係が運動の楽しさや喜びに大きな影響を与えることや，仲間と共に積極的に意思決定に関わることが，運動やスポーツの意義や価値を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることで，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。さらに，健康・安全の大切さを認識し，自己の心身の健康の保持増進や疾病やけがなどからの回復，危険の回避等に主体的に取り組み，楽しく明るい生活を営む態度の育成を重視するという保健の「学びに向かう力，人間性等」を示している。","各種の運動に積極的に取り組みとは，各種の運動の楽しさや喜びを味わい，自ら積極的に運動に取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","約束を守り助け合って運動をしとは，高学年の各種の運動において，仲間と一緒に運動の楽しさや喜びを味わうことができるように，自分たちで決めた約束を守り，仲間と互いに助け合って運動をすることを示している。互いに助け合って運動をすることを通して，運動の課題やその解決方法についての理解が深まるとともに，仲間への信頼感が高まり，互いの関係がより良好になっていくことなどのスポーツの価値の実現に関する態度の育成を示している。","仲間の考えや取組を認めとは，仲間の考えを聞くことで自己の考えを深めたり，互いの取組を認めて仲間とのより良好な関係を築いたりすることを目指したものである。","場や用具の安全に留意しとは，運動をする場所や器械・器具の整備，用具の安全を確かめること，水泳運動の心得を守って安全に気を配ることなど，中学年のねらいを発展させたものである。","自己の最善を尽くして運動をする態度を養うとは，運動領域の学習で児童が学習課題の達成に向けて全力を出して運動に取り組む態度の育成を示している。最善を尽くして運動をする過程で達成感を得たり，課題の解決に取り組む意味や，自己や仲間の可能性に気付いたり，新たな課題に挑戦する態度が培われたりすることにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動の実践だけでなく日常の生活において必要な態度にもつながるものである。","健康・安全の大切さに気付き，自己の健康の保持増進や回復に進んで取り組む態度を養うとは，保健領域の内容を学習し，健康や安全の大切さに気付くことにより，自己の健康に関心をもち，心身の健康の保持増進や疾病の予防・回復のために主体的に学習活動に取り組む，課題の解決に向けて協力し合う，安全を確保してけがを防止するなどの態度を養うことを意図したものである。"]},"grades":[5,6],"band":"5・6年"},"6":{"lines":["⑴　各種の運動の楽しさや喜びを味わい，その行い方及び心の健康やけがの防止，病気の予防について理解するとともに，各種の運動の特性に応じた基本的な技能及び健康で安全な生活を営むための技能を身に付けるようにする。","⑵　自己やグループの運動の課題や身近な健康に関わる課題を見付け，その解決のための方法や活動を工夫するとともに，自己や仲間の考えたことを他者に伝える力を養う。","⑶　各種の運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や用具の安全に留意したりし，自己の最善を尽くして運動をする態度を養う。また，健康・安全の大切さに気付き，自己の健康の保持増進や回復に進んで取り組む態度を養う。"],"page":112,"expl":{"intro":[],"1":["(1)は，「知識及び技能」に関する目標であり，各種の運動の楽しさや喜びを味わうことを通して，その行い方や心の健康，けがの防止及び病気の予防について理解するとともに，各種の運動の特性に応じた基本的な技能及び健康で安全な生活を営むための技能を身に付けること及び体力を養うことを意図している。","各種の運動とは，児童の発達の段階を踏まえ，設定される運動であり，児童が成功体験を得やすいように，児童の発達の段階と運動の特性を踏まえ，課題やルール，場や用具等が緩和された体つくり運動，器械運動，陸上運動，水泳運動，ボール運動及び表現運動を指す。","楽しさや喜びを味わいとは，教科の目標に示している体育・保健の見方・考え方を働かせ，課題を見付け，その解決に向けた学習過程を通して，心と体を一体として捉え，生涯にわたって心身の健康を保持増進し豊かなスポーツライフを実現するための資質・能力を育成すること及び「体育の見方・考え方」である「運動やスポーツを，その価値や特性に着目して，楽しさや喜びとともに体力の向上に果たす役割の視点から捉え，自己の適性等に応じた『する・みる・支える・知る』の多様な関わり方と関連付けること」を踏まえたねらいである。また，児童にとって発達の段階に適した，易しい運動を通して運動の楽しさや喜びを味わうようにすることを目指すとともに，健康な生活や発育・発達について理解することを通して，生涯にわたって運動やスポーツに親しみ，実践していくための資質・能力を育てることを意図したものである。そのためには，課題や活動の場などを工夫した易しい運動を行ったり，運動の取り上げ方の弾力化を図ったりすることが重要である。","高学年では，中学年の楽しさや喜びに触れる段階から，楽しさや喜びを味わうことを重視したものである。そのため，楽しさとともに，運動の特性に即して自己の力に応じた各種の運動の行い方を理解し，それらの基本的な技能を身に付けたり，それをプレイ等の中で発揮したりすることで喜びを味わうことに重点を置いている。また，個人の達成感や仲間と協力して得られる達成感等の喜びを味わうことにより，知識及び技能が更に身に付いていくことを意図している。さらに，知識及び技能を活用しながら身に付けていくことで，一層楽しさや喜びが高まっていくことを意図している。","その行い方を理解するとは，高学年においても運動の課題や約束，場や用具の使い方，場の安全の確保等，各種の運動の行い方を理解することが，各種の運動の基本的な技能の習得や仲間との関わり合いなどをしやすくするものであることから，今回，新たに示したものである。","心の健康やけがの防止，病気の予防について理解するとは，保健領域の内容との関連から，心の発達や心と体との密接な関係及び不安や悩みへの対処の仕方，交通事故や身の回りの生活の危険を予測し，回避すること，病気の起こり方と予防について理解できるようにすることを目指したものである。","各種の運動の特性に応じた基本的な技能を身に付けるようにするとは，各種の運動の基本となる技能を，それぞれの運動の特性に応じて身に付けることを示している。また，このねらいは，それぞれの運動の特性に応じた楽しさや喜びを味わうようにすることを大切にしながら，基本的な技能を身に付けることを重視したものである。","健康で安全な生活を営むための技能を身に付けるようにするとは，心の健康における不安や悩みへの対処の方法やけがの防止におけるけがなどの簡単な手当に関わる技能を身に付けるようにすることを意図し，今回，新たに示したものである。","なお，高学年の児童は体力についての認識が高まってくることを踏まえ，体力の重要性を理解するとともに，各種の運動の楽しさや喜びを味わい，活発に運動を行っていく中で，各種の運動の基本となる様々な技能を身に付け，結果として体力の向上を図ることを目指すものである。したがって，高学年の各種の運動を取り上げるに当たっては，高学年の児童の発達の段階や指導内容，体力の状況等に十分に留意することが大切である。"],"2":["(2)は，「思考力，判断力，表現力等」に関する目標であり，自己やグループの運動の課題や健康に関する自己の課題を見付け，その解決方法を工夫するとともに，それについて自己や仲間の考えたことを他者に伝える力を養うことを意図している。","自己やグループの運動の課題を見付けとは，自己やグループが取り組む運動に関わり解決すべき課題を見付けることを指す。取り組む運動についての課題と，課題に対応した練習の場，技や技術を確認することがそれに当たる。その際，個人が対応すべき課題とグループで対応すべき課題とを整理して確認することが大切になる。そのため，教師は，児童が自己やグループの適切な運動の課題を見付けることができるように支援することが必要になる。","身近な健康に関わる課題を見付けとは，保健領域の内容である心の発達や心と体との密接な関係及び不安や悩みへの対処の仕方，交通事故や身の回りの生活の危険を予測し，回避すること，病気の起こり方と予防についての自己の課題を見付けることを意図したものである。その際，教師は，児童がそれぞれの内容に関わる情報を収集したり，自己の経験を振り返ったりすることによって課題を見付けることができるように支援することが重要である。","その解決のための方法や活動を工夫するとは，高学年の各種の運動において見付けた自己やグループの運動や心の健康，けがの防止及び病気の予防に関する課題の解決に向けた方法や活動を工夫することを示している。自己やグループの運動の課題であれば，各種の運動の楽しさや喜びを味わうことができるようにするために，運動をする場や練習の仕方などを発達の段階に即して，自ら適切に工夫したり，選択したりすることを示している。そこには，自ら楽しみ方を工夫したり，教師や仲間から提案された楽しみ方から，自己やグループに合った楽しみ方を選択したりすることも含まれている。自己の健康の課題であれば，保健で習得した知識及び技能を活用して課題の解決方法を予想し考えたり，それらの中から適切な方法を選択したりすることを示している。","自己や仲間の考えたことを他者に伝えるとは，自己や仲間の考えたことを他者に伝えることができるようにすることを示している。自己の考えのみならず，仲間の考えたことを他者に伝えることで，他者の考えを理解するとともに自己の考えを深めることができるようにすることを意図している。他者とは，共に学ぶ仲間だけでなく，教師，保護者等も含めた総称である。また，直接，言葉で説明することばかりでなく，身振りなどの動作を伴い表現すること，学習で経験したことを感想文や絵で表現すること，保護者や地域の人に伝えることなども想定している。"],"3":["(3)は，「学びに向かう力，人間性等」に関する目標であり，運動やスポーツの価値である，公正，協力，責任，参画，共生，健康・安全等に関する態度及び意欲的に運動をする態度を養うことを意図している。特に，運動をする際の良好な人間関係が運動の楽しさや喜びに大きな影響を与えることや，仲間と共に積極的に意思決定に関わることが，運動やスポーツの意義や価値を知ることにつながることを踏まえたものである。また，児童の発達の段階に応じて，ルールやマナーを遵守することの大切さをはじめ，スポーツの意義や価値等に触れることができるよう指導等の改善を図ることで，オリンピック・パラリンピックに関する指導の充実に資するようにすることを意図している。さらに，健康・安全の大切さを認識し，自己の心身の健康の保持増進や疾病やけがなどからの回復，危険の回避等に主体的に取り組み，楽しく明るい生活を営む態度の育成を重視するという保健の「学びに向かう力，人間性等」を示している。","各種の運動に積極的に取り組みとは，各種の運動の楽しさや喜びを味わい，自ら積極的に運動に取り組むことにより，生涯にわたる豊かなスポーツライフを実現する資質・能力を培うことを示している。","約束を守り助け合って運動をしとは，高学年の各種の運動において，仲間と一緒に運動の楽しさや喜びを味わうことができるように，自分たちで決めた約束を守り，仲間と互いに助け合って運動をすることを示している。互いに助け合って運動をすることを通して，運動の課題やその解決方法についての理解が深まるとともに，仲間への信頼感が高まり，互いの関係がより良好になっていくことなどのスポーツの価値の実現に関する態度の育成を示している。","仲間の考えや取組を認めとは，仲間の考えを聞くことで自己の考えを深めたり，互いの取組を認めて仲間とのより良好な関係を築いたりすることを目指したものである。","場や用具の安全に留意しとは，運動をする場所や器械・器具の整備，用具の安全を確かめること，水泳運動の心得を守って安全に気を配ることなど，中学年のねらいを発展させたものである。","自己の最善を尽くして運動をする態度を養うとは，運動領域の学習で児童が学習課題の達成に向けて全力を出して運動に取り組む態度の育成を示している。最善を尽くして運動をする過程で達成感を得たり，課題の解決に取り組む意味や，自己や仲間の可能性に気付いたり，新たな課題に挑戦する態度が培われたりすることにより，生涯にわたり豊かなスポーツライフを実現する資質・能力を養うことを意図したものである。また，このねらいは，運動の実践だけでなく日常の生活において必要な態度にもつながるものである。","健康・安全の大切さに気付き，自己の健康の保持増進や回復に進んで取り組む態度を養うとは，保健領域の内容を学習し，健康や安全の大切さに気付くことにより，自己の健康に関心をもち，心身の健康の保持増進や疾病の予防・回復のために主体的に学習活動に取り組む，課題の解決に向けて協力し合う，安全を確保してけがを防止するなどの態度を養うことを意図したものである。"]},"grades":[5,6],"band":"5・6年"}},"units":[{"g":1,"u":"体つくりの運動遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-A-0"]},{"g":2,"u":"体つくりの運動遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-A-0"]},{"g":1,"u":"器械・器具を使っての運動遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-B-0"]},{"g":2,"u":"器械・器具を使っての運動遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-B-0"]},{"g":1,"u":"走・跳の運動遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-C-0"]},{"g":2,"u":"走・跳の運動遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-C-0"]},{"g":1,"u":"水遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-D-0"]},{"g":2,"u":"水遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-D-0"]},{"g":1,"u":"ゲーム","b":"運動領域（教科書なし）","ids":["taiiku-12-E-0"]},{"g":2,"u":"ゲーム","b":"運動領域（教科書なし）","ids":["taiiku-12-E-0"]},{"g":1,"u":"表現リズム遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-F-0"]},{"g":2,"u":"表現リズム遊び","b":"運動領域（教科書なし）","ids":["taiiku-12-F-0"]},{"g":3,"u":"体つくり運動","b":"運動領域（教科書なし）","ids":["taiiku-34-A-0"]},{"g":4,"u":"体つくり運動","b":"運動領域（教科書なし）","ids":["taiiku-34-A-0"]},{"g":3,"u":"器械運動","b":"運動領域（教科書なし）","ids":["taiiku-34-B-0"]},{"g":4,"u":"器械運動","b":"運動領域（教科書なし）","ids":["taiiku-34-B-0"]},{"g":3,"u":"走・跳の運動","b":"運動領域（教科書なし）","ids":["taiiku-34-C-0"]},{"g":4,"u":"走・跳の運動","b":"運動領域（教科書なし）","id 速くなったりすること，体を使って元気に運動をすることは，体を丈夫にし，健康によいことなどを，各領域において行うことを示したものである。"]},"3":{"page":110,"quote":["(1) 内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。","(2) 内容の「Ｃ走・跳の運動」については，児童の実態に応じて投の運動を加えて指導することができる。","(3) 内容の「Ｅゲーム」の(1)のアについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うものとする。","(4) 内容の「Ｆ表現運動」の(1)については，学校や地域の実態に応じてフォークダンスを加えて指導することができる。","(5) 内容の「Ｇ保健」については，(1)を第３学年，(2)を第４学年で指導するものとする。","(6) 内容の「Ｇ保健」の(1)については，学校でも，健康診断や学校給食など様々な活動が行われていることについて触れるものとする。","(7) 内容の「Ｇ保健」の(2)については，自分と他の人では発育・発達などに違いがあることに気付き，それらを肯定的に受け止めることが大切であることについて触れるものとする。","(8) 各領域の各内容については，運動と健康が密接に関連していることについての具体的な考えがもてるよう指導すること。"],"paras":["(1)は，「Ａ体つくり運動」の「体ほぐしの運動」及び「多様な動きをつくる運動」について，それぞれの学年で指導することを示したものである。また，「体つくり運動」以外の領域については，いずれかの学年で指導することもできることを示したものである。","(2)は，「Ｃ走・跳の運動」について，児童の実態に応じて投の運動を加えて指導することができることを示したものである。","(3)は，「Ｅゲーム」について，アについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うことを示したものである。","(4)は，「Ｆ表現運動」について，「フォークダンス」を学校や地域の実態に応じて加えて指導することができることを示したものである。","(5)は，「Ｇ保健」の内容の「(1) 健康な生活」を第３学年で，「(2) 体の発育・発達」を第４学年で指導することを示したものである。","(6)は，学校での健康診断や学校給食などは，学校全体で計画的に行われていること，また，保健室では，養護教諭が中心となってけがの手当や健康についての相談などが行われていることなどを取り上げ，保健活動の大切さについて気付かせるよう配慮するものとすることを示したものである。","(7)は，自分や他の人を大切にする気持ちを育てる観点から，自己の体の変化や個人による発育の違いなどについて肯定的に受け止めることが大切であることに気付かせるよう配慮するものとすることを示したものである。","(8)は，保健領域の「健康な生活と運動」及び「体の発育・発達と適切な運動」について学習したことを，運動領域の各領域において関係付けて学習することによって，児童が運動と健康が密接に関連していることに考えをもてるよう指導することを示したものである。特に，保健領域の「体の発育・発達」については，児童が「運動については，生涯を通じて骨や筋肉などを丈夫にする効果が期待されること」の知識を習得したことを，運動領域の「Ａ体つくり運動」の「跳ぶ，はねるなどの動きで構成される運動」を通じて行うなど，運動と健康との関連について具体的な考えをもてるよう配慮することが大切である。"]},"4":{"page":110,"quote":["(1) 内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。","(2) 内容の「Ｃ走・跳の運動」については，児童の実態に応じて投の運動を加えて指導することができる。","(3) 内容の「Ｅゲーム」の(1)のアについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うものとする。","(4) 内容の「Ｆ表現運動」の(1)については，学校や地域の実態に応じてフォークダンスを加えて指導することができる。","(5) 内容の「Ｇ保健」については，(1)を第３学年，(2)を第４学年で指導するものとする。","(6) 内容の「Ｇ保健」の(1)については，学校でも，健康診断や学校給食など様々な活動が行われていることについて触れるものとする。","(7) 内容の「Ｇ保健」の(2)については，自分と他の人では発育・発達などに違いがあることに気付き，それらを肯定的に受け止めることが大切であることについて触れるものとする。","(8) 各領域の各内容については，運動と健康が密接に関連していることについての具体的な考えがもてるよう指導すること。"],"paras":["(1)は，「Ａ体つくり運動」の「体ほぐしの運動」及び「多様な動きをつくる運動」について，それぞれの学年で指導することを示したものである。また，「体つくり運動」以外の領域については，いずれかの学年で指導することもできることを示したものである。","(2)は，「Ｃ走・跳の運動」について，児童の実態に応じて投の運動を加えて指導することができることを示したものである。","(3)は，「Ｅゲーム」について，アについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うことを示したものである。","(4)は，「Ｆ表現運動」について，「フォークダンス」を学校や地域の実態に応じて加えて指導することができることを示したものである。","(5)は，「Ｇ保健」の内容の「(1) 健康な生活」を第３学年で，「(2) 体の発育・発達」を第４学年で指導することを示したものである。","(6)は，学校での健康診断や学校給食などは，学校全体で計画的に行われていること，また，保健室では，養護教諭が中心となってけがの手当や健康についての相談などが行われていることなどを取り上げ，保健活動の大切さについて気付かせるよう配慮するものとすることを示したものである。","(7)は，自分や他の人を大切にする気持ちを育てる観点から，自己の体の変化や個人による発育の違いなどについて肯定的に受け止めることが大切であることに気付かせるよう配慮するものとすることを示したものである。","(8)は，保健領域の「健康な生活と運動」及び「体の発育・発達と適切な運動」について学習したことを，運動領域の各領域において関係付けて学習することによって，児童が運動と健康が密接に関連していることに考えをもてるよう指導することを示したものである。特に，保健領域の「体の発育・発達」については，児童が「運動については，生涯を通じて骨や筋肉などを丈夫にする効果が期待されること」の知識を習得したことを，運動領域の「Ａ体つくり運動」の「跳ぶ，はねるなどの動きで構成される運動」を通じて行うなど，運動と健康との関連について具体的な考えをもてるよう配慮することが大切である。"]},"5":{"page":158,"quote":["(1) 内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。また，(1)のイについては，体の柔らかさ及び巧みな動きを高めることに重点を置いて指導するものとする。その際，音楽に合わせて運動をするなどの工夫を図ること。","(2) 内容の「Ａ体つくり運動」の(1)のアと「Ｇ保健」の(1)のアの(ｳ)については，相互の関連を図って指導するものとする。","(3) 内容の「Ｃ陸上運動」については，児童の実態に応じて，投の運動を加えて指導することができる。","(4) 内容の「Ｄ水泳運動」の(1)のア及びイについては，水中からのスタートを指導するものとする。また，学校の実態に応じて背泳ぎを加えて指導することができる。","(5) 内容の「Ｅボール運動」の(1)については，アはバスケットボール及びサッカーを，イはソフトバレーボールを，ウはソフトボールを主として取り扱うものとするが，これらに替えてハンドボール，タグラグビー，フラッグフットボールなどア，イ及びウの型に応じたその他のボール運動を指導することもできるものとする。なお，学校の実態に応じてウは取り扱わないことができる。","(6) 内容の「Ｆ表現運動」の(1)については，学校や地域の実態に応じてリズムダンスを加えて指導することができる。","(7) 内容の「Ｇ保健」については，(1)及び(2)を第５学年，(3)を第６学年で指導するものとする。また，けがや病気からの回復についても触れるものとする。","(8) 内容の「Ｇ保健」の(3)のアの(ｴ)の薬物については，有機溶剤の心身への影響を中心に取り扱うものとする。また，覚醒剤等についても触れるものとする。","(9) 各領域の各内容については，運動領域と保健領域との関連を図る指導に留意すること。"],"paras":["(1)は，「Ａ体つくり運動」の「体ほぐしの運動」及び「体の動きを高める運動」について，それぞれの学年で指導することを示したものである。また，「体の動きを高める運動」については，高学年の児童の発達の段階を踏まえ，体の柔らかさ及び巧みな動きを高めるための運動に重点を置いて指導することを示したものである。また，体つくり運動の指導に当たっては，音楽に合わせて運動をするなど，楽しく運動に取り組むための工夫を図ることを示したものである。","(2)の相互の関連を図って指導するとは，「体ほぐしの運動」についての意味や必要性について，保健の時間において理解を図ることであり，また，心の健康で学んだことを「体つくり運動」の時間で実践し理解を深めようとすることである。","(3)は，「Ｃ陸上運動」について，児童の実態に応じて投の運動を加えて指導することができることを示したものである。","(4)は，「Ｄ水泳運動」について，泳ぎにつなげる水中からのスタートを指導するとともに，学校の実態に応じて「背泳ぎ」を加えて指導することができることを示したものである。","(5)は，「Ｅボール運動」について，アからウまでの各型で主として取り扱う運動を示すとともに，それぞれの型に応じてその他のボール運動を替えて指導することもできることを示したものである。また，「ベースボール型」については，運動場が狭くその実施が難しい学校もあることから，取り扱わないこともできることを示したものである。","(6)は，「Ｆ表現運動」について，学校や地域の実態に応じて，「リズムダンス」を加えて指導することができることを示したものである。","(7)は，「Ｇ保健」の内容の「(1)心の健康」及び「(2)けがの防止」については第５学年，「(3)病気の予防」については第６学年で指導することを示したものである。また，けがの防止や病気の予防だけでなく，「(2)けがの防止」の適切なけがの手当や「(3)病気の予防」の病原体に対する体の抵抗力や早期の治療の効果などを取り上げ，けがや病気からの回復についても触れるようにすることを示したものである。","(8)は，「Ｇ保健」の内容の(3)のアの(ｴ)の薬物乱用の心身への影響については，シンナーなどの有機溶剤を中心に取り扱うものとしたものである。また，覚醒剤については，乱用される薬物には様々なものがあることに触れる例として示したものである。","(9)は，「Ａ体つくり運動」をはじめ各運動領域の内容と，心の健康と運動，病気の予防の運動の効果などの保健領域の内容とを関連して指導することを示したものである。特に，児童が保健領域の病気の予防について，全身を使った運動を日常的に行うことが，現在のみならず大人になってからの病気の予防の方法としても重要であることを理解することと，各運動領域において学習したことを基に日常的に運動に親しむことを関連付けるなど，運動と健康との関連について具体的な考えをもてるよう配慮することが大切である。"]},"6":{"page":158,"quote":["(1) 内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。また，(1)のイについては，体の柔らかさ及び巧みな動きを高めることに重点を置いて指導するものとする。その際，音楽に合わせて運動をするなどの工夫を図ること。","(2) 内容の「Ａ体つくり運動」の(1)のアと「Ｇ保健」の(1)のアの(ｳ)については，相互の関連を図って指導するものとする。","(3) 内容の「Ｃ陸上運動」については，児童の実態に応じて，投の運動を加えて指導することができる。","(4) 内容の「Ｄ水泳運動」の(1)のア及びイについては，水中からのスタートを指導するものとする。また，学校の実態に応じて背泳ぎを加えて指導することができる。","(5) 内容の「Ｅボール運動」の(1)については，アはバスケットボール及びサッカーを，イはソフトバレーボールを，ウはソフトボールを主として取り扱うものとするが，これらに替えてハンドボール，タグラグビー，フラッグフットボールなどア，イ及びウの型に応じたその他のボール運動を指導することもできるものとする。なお，学校の実態に応じてウは取り扱わないことができる。","(6) 内容の「Ｆ表現運動」の(1)については，学校や地域の実態に応じてリズムダンスを加えて指導することができる。","(7) 内容の「Ｇ保健」については，(1)及び(2)を第５学年，(3)を第６学年で指導するものとする。また，けがや病気からの回復についても触れるものとする。","(8) 内容の「Ｇ保健」の(3)のアの(ｴ)の薬物については，有機溶剤の心身への影響を中心に取り扱うものとする。また，覚醒剤等についても触れるものとする。","(9) 各領域の各内容については，運動領域と保健領域との関連を図る指導に留意すること。"],"paras":["(1)は，「Ａ体つくり運動」の「体ほぐしの運動」及び「体の動きを高める運動」について，それぞれの学年で指導することを示したものである。また，「体の動きを高める運動」については，高学年の児童の発達の段階を踏まえ，体の柔らかさ及び巧みな動きを高めるための運動に重点を置いて指導することを示したものである。また，体つくり運動の指導に当たっては，音楽に合わせて運動をするなど，楽しく運動に取り組むための工夫を図ることを示したものである。","(2)の相互の関連を図って指導するとは，「体ほぐしの運動」についての意味や必要性について，保健の時間において理解を図ることであり，また，心の健康で学んだことを「体つくり運動」の時間で実践し理解を深めようとすることである。","(3)は，「Ｃ陸上運動」について，児童の実態に応じて投の運動を加えて指導することができることを示したものである。","(4)は，「Ｄ水泳運動」について，泳ぎにつなげる水中からのスタートを指導するとともに，学校の実態に応じて「背泳ぎ」を加えて指導することができることを示したものである。","(5)は，「Ｅボール運動」について，アからウまでの各型で主として取り扱う運動を示すとともに，それぞれの型に応じてその他のボール運動を替えて指導することもできることを示したものである。また，「ベースボール型」については，運動場が狭くその実施が難しい学校もあることから，取り扱わないこともできることを示したものである。","(6)は，「Ｆ表現運動」について，学校や地域の実態に応じて，「リズムダンス」を加えて指導することができることを示したものである。","(7)は，「Ｇ保健」の内容の「(1)心の健康」及び「(2)けがの防止」については第５学年，「(3)病気の予防」については第６学年で指導することを示したものである。また，けがの防止や病気の予防だけでなく，「(2)けがの防止」の適切なけがの手当や「(3)病気の予防」の病原体に対する体の抵抗力や早期の治療の効果などを取り上げ，けがや病気からの回復についても触れるようにすることを示したものである。","(8)は，「Ｇ保健」の内容の(3)のアの(ｴ)の薬物乱用の心身への影響については，シンナーなどの有機溶剤を中心に取り扱うものとしたものである。また，覚醒剤については，乱用される薬物には様々なものがあることに触れる例として示したものである。","(9)は，「Ａ体つくり運動」をはじめ各運動領域の内容と，心の健康と運動，病気の予防の運動の効果などの保健領域の内容とを関連して指導することを示したものである。特に，児童が保健領域の病気の予防について，全身を使った運動を日常的に行うことが，現在のみならず大人になってからの病気の予防の方法としても重要であることを理解することと，各運動領域において学習したことを基に日常的に運動に親しむことを関連付けるなど，運動と健康との関連について具体的な考えをもてるよう配慮することが大切である。"]}},"unitNote":"運動領域（Ａ〜Ｆ）は教科書がないため、領域の名前で並べています。保健は教科書（東京書籍）の単元です。","items":[{"id":"taiiku-12-A-0","g":[1,2],"area":"A","areaName":"体つくりの運動遊び","mark":null,"head":"体つくりの運動遊び：体ほぐしの運動遊び，多様な動きをつくる運動遊び","title":"体つくりの運動遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，体を動かす心地よさを味わったり，基本的な動きを身に付けたりすること。","ア　体ほぐしの運動遊びでは，手軽な運動遊びを行い，心と体の変化に気付いたり，みんなで関わり合ったりすること。","イ　多様な動きをつくる運動遊びでは，体のバランスをとる動き，体を移動する動き，用具を操作する動き，力試しの動きをすること。","⑵　体をほぐしたり多様な動きをつくったりする遊び方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，場の安全に気を付けたりすること。"],"notes":["⑴　内容の「Ａ体つくりの運動遊び」については，２学年間にわたって指導するものとする。"],"units":null},{"id":"taiiku-12-B-0","g":[1,2],"area":"B","areaName":"器械・器具を使っての運動遊び","mark":null,"head":"器械・器具を使っての運動遊び：固定施設，マット，鉄棒，跳び箱","title":"器械・器具を使っての運動遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　固定施設を使った運動遊びでは，登り下りや懸垂移行，渡り歩きや跳び下りをすること。","イ　マットを使った運動遊びでは，いろいろな方向への転がり，手で支えての体の保持や回転をすること。","ウ　鉄棒を使った運動遊びでは，支持しての揺れや上がり下り，ぶら下がりや易しい回転をすること。","エ　跳び箱を使った運動遊びでは，跳び乗りや跳び下り，手を着いてのまたぎ乗りやまたぎ下りをすること。","⑵　器械・器具を用いた簡単な遊び方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，順番やきまりを守り誰とでも仲よく運動をしたり，場や器械・器具の安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-12-C-0","g":[1,2],"area":"C","areaName":"走・跳の運動遊び","mark":null,"head":"走・跳の運動遊び：走の運動遊び，跳の運動遊び","title":"走・跳の運動遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　走の運動遊びでは，いろいろな方向に走ったり，低い障害物を走り越えたりすること。","イ　跳の運動遊びでは，前方や上方に跳んだり，連続して跳んだりすること。","⑵　走ったり跳んだりする簡単な遊び方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，順番やきまりを守り誰とでも仲よく運動をしたり，勝敗を受け入れたり，場の安全に気を付けたりすること。"],"notes":["⑵　内容の「Ｃ走・跳の運動遊び」については，児童の実態に応じて投の運動遊びを加えて指導することができる。"],"units":null},{"id":"taiiku-12-D-0","g":[1,2],"area":"D","areaName":"水遊び","mark":null,"head":"水遊び：水の中を移動する運動遊び，もぐる・浮く運動遊び","title":"水遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　水の中を移動する運動遊びでは，水につかって歩いたり走ったりすること。","イ　もぐる・浮く運動遊びでは，息を止めたり吐いたりしながら，水にもぐったり浮いたりすること。","⑵　水の中を移動したり，もぐったり浮いたりする簡単な遊び方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，順番やきまりを守り誰とでも仲よく運動をしたり，水遊びの心得を守って安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-12-E-0","g":[1,2],"area":"E","areaName":"ゲーム","mark":null,"head":"ゲーム：ボールゲーム，鬼遊び","title":"ゲームについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，易しいゲームをすること。","ア　ボールゲームでは，簡単なボール操作と攻めや守りの動きによって，易しいゲームをすること。","イ　鬼遊びでは，一定の区域で，逃げる，追いかける，陣地を取り合うなどをすること。","⑵　簡単な規則を工夫したり，攻め方を選んだりするとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，規則を守り誰とでも仲よく運動をしたり，勝敗を受け入れたり，場や用具の安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-12-F-0","g":[1,2],"area":"F","areaName":"表現リズム遊び","mark":null,"head":"表現リズム遊び：表現遊び，リズム遊び","title":"表現リズム遊びについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動遊びの楽しさに触れ，その行い方を知るとともに，題材になりきったりリズムに乗ったりして踊ること。","ア　表現遊びでは，身近な題材の特徴を捉え，全身で踊ること。","イ　リズム遊びでは，軽快なリズムに乗って踊ること。","⑵　身近な題材の特徴を捉えて踊ったり，軽快なリズムに乗って踊ったりする簡単な踊り方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動遊びに進んで取り組み，誰とでも仲よく踊ったり，場の安全に気を付けたりすること。"],"notes":["⑶　内容の「Ｆ表現リズム遊び」の⑴のイについては，簡単なフォークダンスを含めて指導することができる。"],"units":null},{"id":"taiiku-34-A-0","g":[3,4],"area":"A","areaName":"体つくり運動","mark":null,"head":"体つくり運動：体ほぐしの運動，多様な動きをつくる運動","title":"体つくり運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，体を動かす心地よさを味わったり，基本的な動きを身に付けたりすること。","ア　体ほぐしの運動では，手軽な運動を行い，心と体の変化に気付いたり，みんなで関わり合ったりすること。","イ　多様な動きをつくる運動では，体のバランスをとる動き，体を移動する動き，用具を操作する動き，力試しの動きをし，それらを組み合わせること。","⑵　自己の課題を見付け，その解決のための活動を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や用具の安全に気を付けたりすること。"],"notes":["⑴　内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。"],"units":null},{"id":"taiiku-34-B-0","g":[3,4],"area":"B","areaName":"器械運動","mark":null,"head":"器械運動：マット運動，鉄棒運動，跳び箱運動","title":"器械運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，その技を身に付けること。","ア　マット運動では，回転系や巧技系の基本的な技をすること。","イ　鉄棒運動では，支持系の基本的な技をすること。","ウ　跳び箱運動では，切り返し系や回転系の基本的な技をすること。","⑵　自己の能力に適した課題を見付け，技ができるようになるための活動を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，場や器械・器具の安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-34-C-0","g":[3,4],"area":"C","areaName":"走・跳の運動","mark":null,"head":"走・跳の運動：かけっこ・リレー，小型ハードル走，幅跳び，高跳び","title":"走・跳の運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　かけっこ・リレーでは，調子よく走ったりバトンの受渡しをしたりすること。","イ　小型ハードル走では，小型ハードルを調子よく走り越えること。","ウ　幅跳びでは，短い助走から踏み切って跳ぶこと","エ　高跳びでは，短い助走から踏み切って跳ぶこと。","⑵　自己の能力に適した課題を見付け，動きを身に付けるための活動や競争の仕方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，勝敗を受け入れたり，友達の考えを認めたり，場や用具の安全に気を付けたりすること。"],"notes":["⑵　内容の「Ｃ走・跳の運動」については，児童の実態に応じて投の運動を加えて指導することができる。"],"units":null},{"id":"taiiku-34-D-0","g":[3,4],"area":"D","areaName":"水泳運動","mark":null,"head":"水泳運動：浮いて進む運動，もぐる・浮く運動","title":"水泳運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，その動きを身に付けること。","ア　浮いて進む運動では，け伸びや初歩的な泳ぎをすること。","イ　もぐる・浮く運動では，息を止めたり吐いたりしながら，いろいろなもぐり方や浮き方をすること。","⑵　自己の能力に適した課題を見付け，水の中での動きを身に付けるための活動を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，きまりを守り誰とでも仲よく運動をしたり，友達の考えを認めたり，水泳運動の心得を守って安全に気を付けたりすること。"],"notes":null,"units":null},{"id":"taiiku-34-E-0","g":[3,4],"area":"E","areaName":"ゲーム","mark":null,"head":"ゲーム：ゴール型，ネット型，ベースボール型ゲーム","title":"ゲームについて，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，易しいゲームをすること。","ア　ゴール型ゲームでは，基本的なボール操作とボールを持たないときの動きによって，易しいゲームをすること。","イ　ネット型ゲームでは，基本的なボール操作とボールを操作できる位置に体を移動する動きによって，易しいゲームをすること。","ウ　ベースボール型ゲームでは，蹴る，打つ，捕る，投げるなどのボール操作と得点をとったり防いだりする動きによって，易しいゲームをすること。","⑵　規則を工夫したり，ゲームの型に応じた簡単な作戦を選んだりするとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，規則を守り誰とでも仲よく運動をしたり，勝敗を受け入れたり，友達の考えを認めたり，場や用具の安全に気を付けたりすること。"],"notes":["⑶　内容の「Ｅゲーム」の⑴のアについては，味方チームと相手チームが入り交じって得点を取り合うゲーム及び陣地を取り合うゲームを取り扱うものとする。"],"units":null},{"id":"taiiku-34-F-0","g":[3,4],"area":"F","areaName":"表現運動","mark":null,"head":"表現運動：表現，リズムダンス","title":"表現運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びに触れ，その行い方を知るとともに，表したい感じを表現したりリズムに乗ったりして踊ること。","ア　表現では，身近な生活などの題材からその主な特徴を捉え，表したい感じをひと流れの動きで踊ること。","イ　リズムダンスでは，軽快なリズムに乗って全身で踊ること。","⑵　自己の能力に適した課題を見付け，題材やリズムの特徴を捉えた踊り方や交流の仕方を工夫するとともに，考えたことを友達に伝えること。","⑶　運動に進んで取り組み，誰とでも仲よく踊ったり，友達の動きや考えを認めたり，場の安全に気を付けたりすること。"],"notes":["⑷　内容の「Ｆ表現運動」の⑴については，学校や地域の実態に応じてフォークダンスを加えて指導することができる。"],"units":null},{"id":"taiiku-3-G-1","g":[3],"area":"G","areaName":"保健","mark":"⑴","head":"保健：健康な生活","title":"健康な生活について，課題を見付け，その解決を目指した活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　健康な生活について理解すること。","（ア）　心や体の調子がよいなどの健康の状態は，主体の要因や周囲の環境の要因が関わっていること。","（イ）　毎日を健康に過ごすには，運動，食事，休養及び睡眠の調和のとれた生活を続けること，また，体の清潔を保つことなどが必要であること。","（ウ）　毎日を健康に過ごすには，明るさの調節，換気などの生活環境を整えることなどが必要であること。","イ　健康な生活について課題を見付け，その解決に向けて考え，それを表現すること。"],"notes":["⑸　内容の「Ｇ保健」については，⑴を第３学年，⑵を第４学年で指導するものとする。","⑹　内容の「Ｇ保健」の⑴については，学校でも，健康診断や学校給食など様々な活動が行われていることについて触れるものとする。"],"units":[{"u":"保健：けんこうというたからもの","b":"3年","s":3},{"u":"保健：けんこうによい1日の生活","b":"3年","s":3},{"u":"保健：体のせいけつとけんこう","b":"3年","s":3},{"u":"保健：けんこうによいかんきょう","b":"3年","s":3}]},{"id":"taiiku-4-G-2","g":[4],"area":"G","areaName":"保健","mark":"⑵","head":"保健：体の発育・発達","title":"体の発育・発達について，課題を見付け，その解決を目指した活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　体の発育・発達について理解すること。","（ア）　体は，年齢に伴って変化すること。また，体の発育・発達には，個人差があること。","（イ）　体は，思春期になると次第に大人の体に近づき，体つきが変わったり，初経，精通などが起こったりすること。また，異性への関心が芽生えること。","（ウ）　体をよりよく発育・発達させるには，適切な運動，食事，休養及び睡眠が必要であること。","イ　体がよりよく発育・発達するために，課題を見付け，その解決に向けて考え，それを表現すること。"],"notes":["⑸　内容の「Ｇ保健」については，⑴を第３学年，⑵を第４学年で指導するものとする。","⑺　内容の「Ｇ保健」の⑵については，自分と他の人では発育・発達などに違いがあることに気付き，それらを肯定的に受け止めることが大切であることについて触れるものとする。"],"units":[{"u":"保健：育ちゆくわたしたちの体","b":"4年","s":3},{"u":"保健：思春期にあらわれる変化","b":"4年","s":3},{"u":"保健：よりよく成長するための生活","b":"4年","s":3}]},{"id":"taiiku-56-A-0","g":[5,6],"area":"A","areaName":"体つくり運動","mark":null,"head":"体つくり運動：体ほぐしの運動，体の動きを高める運動","title":"体つくり運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，体を動かす心地よさを味わったり，体の動きを高めたりすること。","ア　体ほぐしの運動では，手軽な運動を行い，心と体との関係に気付いたり，仲間と関わり合ったりすること。","イ　体の動きを高める運動では，ねらいに応じて，体の柔らかさ，巧みな動き，力強い動き，動きを持続する能力を高めるための運動をすること。","⑵　自己の体の状態や体力に応じて，運動の行い方を工夫するとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や用具の安全に気を配ったりすること。"],"notes":["⑴　内容の「Ａ体つくり運動」については，２学年間にわたって指導するものとする。また，⑴のイについては，体の柔らかさ及び巧みな動きを高めることに重点を置いて指導するものとする。その際，音楽に合わせて運動をするなどの工夫を図ること。","⑵　内容の「Ａ体つくり運動」の⑴のアと「Ｇ保健」の⑴のアの（ウ）については，相互の関連を図って指導するものとする。"],"units":null},{"id":"taiiku-56-B-0","g":[5,6],"area":"B","areaName":"器械運動","mark":null,"head":"器械運動：マット運動，鉄棒運動，跳び箱運動","title":"器械運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，その技を身に付けること。","ア　マット運動では，回転系や巧技系の基本的な技を安定して行ったり，その発展技を行ったり，それらを繰り返したり組み合わせたりすること。","イ　鉄棒運動では，支持系の基本的な技を安定して行ったり，その発展技を行ったり，それらを繰り返したり組み合わせたりすること。","ウ　跳び箱運動では，切り返し系や回転系の基本的な技を安定して行ったり，その発展技を行ったりすること。","⑵　自己の能力に適した課題の解決の仕方や技の組み合わせ方を工夫するとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，場や器械・器具の安全に気を配ったりすること。"],"notes":null,"units":null},{"id":"taiiku-56-C-0","g":[5,6],"area":"C","areaName":"陸上運動","mark":null,"head":"陸上運動：短距離走・リレー，ハードル走，走り幅跳び，走り高跳び","title":"陸上運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，その技能を身に付けること。","ア　短距離走・リレーでは，一定の距離を全力で走ったり，滑らかなバトンの受渡しをしたりすること。","イ　ハードル走では，ハードルをリズミカルに走り越えること。","ウ　走り幅跳びでは，リズミカルな助走から踏み切って跳ぶこと。","エ　走り高跳びでは，リズミカルな助走から踏み切って跳ぶこと。","⑵　自己の能力に適した課題の解決の仕方，競争や記録への挑戦の仕方を工夫するとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，約束を守り助け合って運動をしたり，勝敗を受け入れたり，仲間の考えや取組を認めたり，場や用具の安全に気を配ったりすること。"],"notes":["⑶　内容の「Ｃ陸上運動」については，児童の実態に応じて，投の運動を加えて指導することができる。"],"units":null},{"id":"taiiku-56-D-0","g":[5,6],"area":"D","areaName":"水泳運動","mark":null,"head":"水泳運動：クロール，平泳ぎ，安全確保につながる運動","title":"水泳運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，その技能を身に付けること。","ア　クロールでは，手や足の動きに呼吸を合わせて続けて長く泳ぐこと。","イ　平泳ぎでは，手や足の動きに呼吸を合わせて続けて長く泳ぐこと。","ウ　安全確保につながる運動では，背浮きや浮き沈みをしながら続けて長く浮くこと。","⑵　自己の能力に適した課題の解決の仕方や記録への挑戦の仕方を工夫するとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，約束を守り助け合って運動をしたり，仲間の考えや取組を認めたり，水泳運動の心得を守って安全に気を配ったりすること。"],"notes":["⑷　内容の「Ｄ水泳運動」の⑴のア及びイについては，水中からのスタートを指導するものとする。また，学校の実態に応じて背泳ぎを加えて指導することができる。"],"units":null},{"id":"taiiku-56-E-0","g":[5,6],"area":"E","areaName":"ボール運動","mark":null,"head":"ボール運動：ゴール型，ネット型，ベースボール型","title":"ボール運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，その技能を身に付け，簡易化されたゲームをすること。","ア　ゴール型では，ボール操作とボールを持たないときの動きによって，簡易化されたゲームをすること。","イ　ネット型では，個人やチームによる攻撃と守備によって，簡易化されたゲームをすること。","ウ　ベースボール型では，ボールを打つ攻撃と隊形をとった守備によって，簡易化されたゲームをすること。","⑵　ルールを工夫したり，自己やチームの特徴に応じた作戦を選んだりするとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，ルールを守り助け合って運動をしたり，勝敗を受け入れたり，仲間の考えや取組を認めたり，場や用具の安全に気を配ったりすること。"],"notes":["⑸　内容の「Ｅボール運動」の⑴については，アはバスケットボール及びサッカーを，イはソフトバレーボールを，ウはソフトボールを主として取り扱うものとするが，これらに替えてハンドボール，タグラグビー，フラッグフットボールなどア，イ及びウの型に応じたその他のボール運動を指導することもできるものとする。なお，学校の実態に応じてウは取り扱わないことができる。"],"units":null},{"id":"taiiku-56-F-0","g":[5,6],"area":"F","areaName":"表現運動","mark":null,"head":"表現運動：表現，フォークダンス","title":"表現運動について，次の事項を身に付けることができるよう指導する。","lines":["⑴　次の運動の楽しさや喜びを味わい，その行い方を理解するとともに，表したい感じを表現したり踊りで交流したりすること。","ア　表現では，いろいろな題材からそれらの主な特徴を捉え，表したい感じをひと流れの動きで即興的に踊ったり，簡単なひとまとまりの動きにして踊ったりすること。","イ　フォークダンスでは，日本の民踊や外国の踊りから，それらの踊り方の特徴を捉え，音楽に合わせて簡単なステップや動きで踊ること。","⑵　自己やグループの課題の解決に向けて，表したい内容や踊りの特徴を捉えた練習や発表・交流の仕方を工夫するとともに，自己や仲間の考えたことを他者に伝えること。","⑶　運動に積極的に取り組み，互いのよさを認め合い助け合って踊ったり，場の安全に気を配ったりすること。"],"notes":["⑹　内容の「Ｆ表現運動」の⑴については，学校や地域の実態に応じてリズムダンスを加えて指導することができる。"],"units":null},{"id":"taiiku-5-G-1","g":[5],"area":"G","areaName":"保健","mark":"⑴","head":"保健：心の健康","title":"心の健康について，課題を見付け，その解決を目指した活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　心の発達及び不安や悩みへの対処について理解するとともに，簡単な対処をすること。","（ア）　心は，いろいろな生活経験を通して，年齢に伴って発達すること。","（イ）　心と体には，密接な関係があること。","（ウ）　不安や悩みへの対処には，大人や友達に相談する，仲間と遊ぶ，運動をするなどいろいろな方法があること。","イ　心の健康について，課題を見付け，その解決に向けて思考し判断するとともに，それらを表現すること。"],"notes":["⑵　内容の「Ａ体つくり運動」の⑴のアと「Ｇ保健」の⑴のアの（ウ）については，相互の関連を図って指導するものとする。","⑺　内容の「Ｇ保健」については，⑴及び⑵を第５学年，⑶を第６学年で指導するものとする。また，けがや病気からの回復についても触れるものとする。"],"units":[{"u":"保健：心の発達","b":"5年","s":3},{"u":"保健：心と体のつながり","b":"5年","s":3},{"u":"保健：不安やなやみがあるとき","b":"5年","s":3}]},{"id":"taiiku-5-G-2","g":[5],"area":"G","areaName":"保健","mark":"⑵","head":"保健：けがの防止","title":"けがの防止について，課題を見付け，その解決を目指した活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　けがの防止に関する次の事項を理解するとともに，けがなどの簡単な手当をすること。","（ア）　交通事故や身の回りの生活の危険が原因となって起こるけがの防止には，周囲の危険に気付くこと，的確な判断の下に安全に行動すること，環境を安全に整えることが必要であること。","（イ）　けがなどの簡単な手当は，速やかに行う必要があること。","イ　けがを防止するために，危険の予測や回避の方法を考え，それらを表現すること。"],"notes":["⑺　内容の「Ｇ保健」については，⑴及び⑵を第５学年，⑶を第６学年で指導するものとする。また，けがや病気からの回復についても触れるものとする。"],"units":[{"u":"保健：事故やけがの原因と防止","b":"5年","s":3},{"u":"保健：交通事故の防止","b":"5年","s":3},{"u":"保健：犯罪被害の防止","b":"5年","s":3},{"u":"保健：自然災害によるけがの防止(発展)","b":"5年","s":3},{"u":"保健：けがの手当","b":"5年","s":3}]},{"id":"taiiku-6-G-3","g":[6],"area":"G","areaName":"保健","mark":"⑶","head":"保健：病気の予防","title":"病気の予防について，課題を見付け，その解決を目指した活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　病気の予防について理解すること。","（ア）　病気は，病原体，体の抵抗力，生活行動，環境が関わりあって起こること。","（イ）　病原体が主な要因となって起こる病気の予防には，病原体が体に入るのを防ぐことや病原体に対する体の抵抗力を高めることが必要であること。","（ウ）　生活習慣病など生活行動が主な要因となって起こる病気の予防には，適切な運動，栄養の偏りのない食事をとること，口腔の衛生を保つことなど，望ましい生活習慣を身に付ける必要があること。","（エ）　喫煙，飲酒，薬物乱用などの行為は，健康を損なう原因となること。","（オ）　地域では，保健に関わる様々な活動が行われていること。","イ　病気を予防するために，課題を見付け，その解決に向けて思考し判断するとともに，それらを表現すること。"],"notes":["⑺　内容の「Ｇ保健」については，⑴及び⑵を第５学年，⑶を第６学年で指導するものとする。また，けがや病気からの回復についても触れるものとする。","⑻　内容の「Ｇ保健」の⑶のアの（エ）の薬物については，有機溶剤の心身への影響を中心に取り扱うものとする。また，覚醒剤等についても触れるものとする。"],"units":[{"u":"保健：病気の起こり方","b":"6年","s":3},{"u":"保健：感染症の予防","b":"6年","s":3},{"u":"保健：生活習慣病の予防","b":"6年","s":3},{"u":"保健：喫煙の害と健康","b":"6年","s":3},{"u":"保健：飲酒の害と健康","b":"6年","s":3},{"u":"保健：薬物乱用の害と健康","b":"6年","s":3},{"u":"保健：地域の保健活動","b":"6年","s":3}]}],"kaisetsu":{"source":"小学校学習指導要領（平成29年告示）解説 体育編（文部科学省，平成29年7月）","items":{"taiiku-12-A-0":{"page":38,"name":"体つくりの運動遊び","expl":{"intro":["低学年の体つくりの運動遊びは，「体ほぐしの運動遊び」及び「多様な動きをつくる運動遊び」で構成され，体を動かす楽しさや心地よさを味わうとともに，伸び伸びと体を動かしながら，様々な基本的な体の動きを身に付けることを主なねらいとする運動遊びである。","低学年では，体ほぐしの運動遊びや多様な動きをつくる運動遊びの行い方を知り，自己の心と体の状態に気付いたり，みんなで関わり合ったりするとともに，様々な基本的な体の動きを楽しく経験することにより，動きの幅を広げ，中学年の体つくり運動の学習につなげていくことが求められる。","運動遊びの楽しさに触れ，結果的に体力の向上を図るとともに，この時期に基本的な体の動きを幅広く培っておくことが重要であり，他の領域において扱いにくい様々な動きを取り上げるものとする。","また，友達と話し合いながら簡単な行い方を工夫し，考えた運動遊びを友達に伝えるとともに，体つくりの運動遊びに進んで取り組み，きまりを守り誰とでも仲よく運動遊びをしたり，場の安全に気を付けたりすることなどをできるようにすることが大切である。","なお，体ほぐしの運動遊びと多様な動きをつくる運動遊びにおいて，取り上げる運動遊びが似通ってくることも考えられるため，各々のねらいを明確にして運動遊びの行い方を意図的に取り扱うことが必要である。"],"k":["ア 体ほぐしの運動遊び","体ほぐしの運動遊びでは，その行い方を知るとともに，手軽な運動遊びを行い，体を動かす楽しさや心地よさを味わうことを通して，自己の心と体の変化に気付いたり，みんなで関わり合ったりすること。","心と体の変化に気付くとは，体を動かすと気持ちがよいことや，力一杯動くと汗が出たり心臓の鼓動が激しくなったりすることなどに気付くことである。みんなで関わり合うとは，人それぞれに違いがあることを知り，誰とでも仲よく協力したり助け合ったりして運動遊びを行い，友達と一緒に体を動かすと楽しさが増すことや，つながりを体験することである。","［行い方の例］","○ 伸び伸びとした動作で新聞紙やテープ，ボール，なわ，体操棒，フープといった操作しやすい用具などを用いた運動遊びを行うこと。","○ リズムに乗って，心が弾むような動作で運動遊びを行うこと。","○ 動作や人数などの条件を変えて，歩いたり走ったりする運動遊びを行うこと。","○ 伝承遊びや集団による運動遊びを行うこと。","◎ 運動遊びが苦手な児童への配慮の例","・ 心や体の変化に気付くことが苦手な児童には，表情を表す絵や感情を表すカードを示し，自己の心や体の変化のイメージができるようにするなどの配慮をする。","・ 友達と楽しく運動をすることが苦手な児童には，友達とハイタッチや拍手で喜びを共有するなど，共に運動遊びをする楽しい雰囲気を実感することができるようにするなどの配慮をする。","イ 多様な動きをつくる運動遊び","多様な動きをつくる運動遊びでは，その行い方を知るとともに，体のバランスをとったり，体を移動したり，用具を操作したり，力試しをしたりすること。多様な動きをつくる運動遊びは，次の内容で構成される。","(ｱ) 体のバランスをとる運動遊び","(ｲ) 体を移動する運動遊び","(ｳ) 用具を操作する運動遊び","(ｴ) 力試しの運動遊び","(ｱ) 体のバランスをとる運動遊び","姿勢や方向，人数を変えて，回る，寝転ぶ，起きる，座る，立つなどの動きやバランスを保つ動きで構成される運動遊びを通して，体のバランスをとる動きを身に付けることができるようにする。","［例示］","○ 回るなどの動きで構成される運動遊び","・  片足を軸にして，右回り・左回りに回転したり，跳び上がって回ったりすること。","・  立った姿勢からリズムよく跳びながら，右回り・左回りに1/2回転，3/4回転，１回転などをすること。","○ 寝転ぶ，起きるなどの動きで構成される運動遊び","・ 足の裏を合わせて座り，両手で足先を持ち，転がって起きること。","○ 座る，立つなどの動きで構成される運動遊び","・ 友達と肩を組んだり背中を合わせたりして，立ったり座ったりすること。","○ 体のバランスを保つ動きで構成される運動遊び","・ 片足でバランスを保ちながら静止すること。","・  しゃがんだ姿勢で互いに手を合わせ，相手のバランスを崩したり，相手にバランスを崩されないようにしたりすること。","◎ 運動遊びが苦手な児童への配慮の例","・ 回るなどの動きでバランスをとることが苦手な児童には，できそうなところに目印を置いて回ったり，軸になる足の位置に輪を置いたりするなど，回りやすくする場を設定するなどの配慮をする。","・ 足の裏を合わせて座った姿勢のまま転がって起きることが苦手な児童には，補助を受けながら，体の重心をゆっくりと移動する動きを身に付けるようにするなどの配慮をする。","・ 二人組になって同時に座る，立つなどの動きが苦手な児童には，補助を受けながら単独での動きを試みるなどの配慮をする。","・ 体のバランスを保つ動きが苦手な児童には，個別に行い方を説明したり，友達の行い方を見ながら真似をしたりするなどの配慮をする。","(ｲ) 体を移動する運動遊び","姿勢，速さ，リズム，方向などを変えて，這う，歩く，走る，跳ぶ，はねるなどの動きで構成される運動遊びや一定の速さでのかけ足などの運動遊びを通して，様々な行い方で体を移動する動きを身に付けることができるようにする。","［例示］","○ 這う，歩く，走るなどの動きで構成される運動遊び","・ 大きな円を右回りや左回りに這ったり，歩いたり，走ったりすること。","・ 横や後ろ，斜めに走ったり，曲線やジグザグ，クランクなどの形態の異なる走路や細い走路を走ったりすること。","○ 跳ぶ，はねるなどの動きで構成される運動遊び","・ 両足や片足でいろいろな跳び方で跳んだり，空中で向きを変えて足から着地したりすること。","・ 両足または片足で，リズムや方向，高さを変えてはねること。","○ 一定の速さでのかけ足","・ 無理のない速さでかけ足を２～３分程度続けること。","◎ 運動遊びが苦手な児童への配慮の例","・ 様々な行い方で這ったり，歩いたり，走ったりすることが苦手な児童には，友達の行い方の真似をしたり，友達の後について行ったりするなど，体の動かし方が分かるようにするなどの配慮をする。","・ 跳ぶ，はねるなどの動きが苦手な児童には，跳ぶ方向が分かるよう矢印を置いたり，はねた際に手でタッチできるよう目印をぶら下げたりするなど，場や用具を準備するなどの配慮をする。","・ 一定の速さでのかけ足が苦手な児童には，継続できる速さを助言したり，音楽に合わせるようにしたり，友達とかけ声を合わせながら走ったりするなどの配慮をする。","(ｳ) 用具を操作する運動遊び","用具をつかむ，持つ，降ろす，回す，転がす，くぐる，運ぶ，投げる，捕る，跳ぶ，用具に乗るなどの動きで構成される運動遊びを通して，用具を操作する動きを身に付けることができるようにする。","［例示］","○ 用具をつかむ，持つ，降ろす，回す，転がすなどの動きで構成される運動遊び","・ 大きさや重さの異なるボールを両手でつかんで，持ち上げたり，回したり，下ろしたりすること。","・ フープを手首や腰を軸にして回したり，倒れないように転がしたりすること。","・ ペアで向かい合ったり，的を決めたりして，ボールやフープを真っ直ぐ転がすこと。","○ 用具をくぐるなどの動きで構成される運動遊び","・ 長なわでの大波・小波をしたり，回っているなわをくぐり抜けたりすること。","○ 用具を運ぶなどの動きで構成される運動遊び","・ 友達と背中などでボールをはさんで，いろいろな方向に運ぶこと。","○ 用具を投げる，捕るなどの動きで構成される運動遊び","・ ボールや棒など大きさや種類の異なる用具を片手や両手で投げたり，捕ったりすること。","○ 用具
