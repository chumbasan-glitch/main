<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>学習指導要領まとめツール 品川区版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 紙の学習指導要領と解説を引く代わりの道具。上で選び、下に本文・解説・内容の取扱い・学年の目標を順に並べる */
:root{
  --bg:#f6f7f4; --panel:#ffffff; --ink:#1f2a2e; --ink2:#55626a; --line:#d9ded8; --accent:#2b5d8a; --mark:#ffe36b; --markInk:#1f2a2e;
  --soft:#eef3f8; --quote:#f4f6f1;
  --k:#2f7d5b; --kbg:#e6f4ec; --s:#2b5d8a; --sbg:#e5eef8; --m:#9a4f8c; --mbg:#f6e9f3;
  --font-display:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --font-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161b1d; --panel:#1f2629; --ink:#e7ecea; --ink2:#a3afb3; --line:#36403f; --accent:#8cbbe6; --mark:#d9b800; --markInk:#111;
  --soft:#22303a; --quote:#232b2d;
  --k:#7fd3a8; --kbg:#1d3a2c; --s:#8cbbe6; --sbg:#1d2f42; --m:#e0a6d4; --mbg:#3a2336; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161b1d; --panel:#1f2629; --ink:#e7ecea; --ink2:#a3afb3; --line:#36403f; --accent:#8cbbe6; --mark:#d9b800; --markInk:#111;
  --soft:#22303a; --quote:#232b2d;
  --k:#7fd3a8; --kbg:#1d3a2c; --s:#8cbbe6; --sbg:#1d2f42; --m:#e0a6d4; --mbg:#3a2336; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.75}
button,input,select{font:inherit; color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1080px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line)}
.topin{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 16px; padding-block:10px}
.brand{display:flex; align-items:center; gap:10px}
.brand h1{font-family:var(--font-display); font-size:20px; margin:0; letter-spacing:.03em}
.brand h1 .ed{font-size:.62em; margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--accent); color:var(--panel); vertical-align:2px}
.logo{width:26px; height:26px; flex:none}
.tomap{font-size:13px; white-space:nowrap}
main{padding-block:16px 40px}
.lead{color:var(--ink2); margin:0 0 12px; max-width:62em}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:6px 0}
.lbl{font-size:13px; color:var(--ink2); min-width:4.5em}
.seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{border:0; background:var(--panel); padding:7px 14px; cursor:pointer; min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--panel); font-weight:700}
.gbtn{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; cursor:pointer; min-height:40px; min-width:52px}
.gbtn[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink); font-weight:700}
select{border:1px solid var(--line); border-radius:8px; padding:7px 10px; background:var(--panel); min-height:40px}
.picks{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; margin-top:8px}
.pick{display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:8px 11px; cursor:pointer; line-height:1.45; min-height:44px}
.pick:hover{border-color:var(--accent)}
.pick[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); background:var(--soft)}
.pick small{display:block; color:var(--ink2); font-size:12px}
.areaH{font-size:13px; font-weight:700; color:var(--ink2); margin:12px 0 2px}
.search{display:flex; gap:8px}
.search input{flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 12px; background:var(--panel); min-height:44px; font-size:16px}
.hits{margin-top:8px}
.hit{display:block; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:none; padding:8px 4px; cursor:pointer}
.hit b{font-size:14px}
.hit p{margin:2px 0 0; font-size:13px; color:var(--ink2)}
mark{background:var(--mark); color:var(--markInk); border-radius:2px; padding:0 1px}
.note{font-size:13px; color:var(--ink2)}

/* 結果 */
#result h2{font-family:var(--font-display); font-size:22px; margin:2px 0 4px; line-height:1.4}
.meta{display:flex; flex-wrap:wrap; gap:6px; font-size:13px; margin-bottom:6px}
.badge{border:1px solid var(--line); border-radius:999px; padding:1px 10px; background:var(--panel)}
.units{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px}
.unit{font-size:13px; background:var(--soft); border-radius:6px; padding:2px 8px}
.kanbar{position:sticky; top:var(--hh,58px); z-index:10; background:var(--bg); padding:8px 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.kanbar button{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; cursor:pointer; min-height:40px}
.kanbar button[aria-pressed="true"]{color:var(--panel); font-weight:700; border-color:transparent; background:var(--ink)}
.kanbar button[data-kan="k"][aria-pressed="true"]{background:var(--k)}
.kanbar button[data-kan="s"][aria-pressed="true"]{background:var(--s)}
.kanbar button[data-kan="m"][aria-pressed="true"]{background:var(--m)}
.multi{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px}
.multi button{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:13px}
.multi button[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
.sec{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin:10px 0}
.sec > h3{margin:0 0 6px; font-size:16px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px}
.sec > h3 .num{font-family:var(--font-display); color:var(--accent)}
.src{font-size:12px; color:var(--ink2); margin:6px 0 0}
.blk{border-left:4px solid var(--line); padding:4px 10px; margin:8px 0; border-radius:0 8px 8px 0}
.blk[data-kan="k"]{border-color:var(--k); background:var(--kbg)}
.blk[data-kan="s"]{border-color:var(--s); background:var(--sbg)}
.blk[data-kan="m"]{border-color:var(--m); background:var(--mbg)}
.blk .tag{display:inline-block; font-size:12px; font-weight:700; margin-bottom:2px}
.blk[data-kan="k"] .tag{color:var(--k)} .blk[data-kan="s"] .tag{color:var(--s)} .blk[data-kan="m"] .tag{color:var(--m)}
.quote{background:var(--quote); border-radius:8px; padding:6px 12px}
.blk p,.quote p,.sec p{margin:4px 0}
p.sub{font-weight:700; margin-top:10px}
.kref{display:block; font-weight:400; font-size:12px; color:var(--ink2)}
p.kmark{font-size:12px; color:var(--ink2); margin-top:10px}
.bhead{font-weight:700; margin:16px 0 4px; padding-top:8px; border-top:1px dashed var(--line)}
.bhead:first-child{border-top:0; margin-top:4px}
.partnote{background:var(--soft); border-radius:8px; padding:6px 10px; font-size:13px; margin:6px 0; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center}
p.i1{padding-left:1em; text-indent:-1em}
p.i2{padding-left:2em; text-indent:-1em}
details.sec > summary{cursor:pointer; font-weight:700}
body.only-k .blk:not([data-kan="k"]), body.only-s .blk:not([data-kan="s"]), body.only-m .blk:not([data-kan="m"]){display:none}
body.only-k .sec[data-has]:not([data-has~="k"]), body.only-s .sec[data-has]:not([data-has~="s"]), body.only-m .sec[data-has]:not([data-has~="m"]){display:none}
.empty{color:var(--ink2); font-size:14px; padding:6px 0}
.keito{display:grid; grid-template-columns:repeat(var(--n), minmax(260px, 1fr)); gap:10px; overflow-x:auto; padding-bottom:8px; margin-top:8px}
.kcol{min-width:0}
.ktab-wrap{overflow-x:auto; margin-top:8px}
.ktab{border-collapse:separate; border-spacing:6px; width:100%; min-width:820px; table-layout:fixed}
.ktab th{font-size:13px; text-align:left; vertical-align:top}
.ktab thead th{background:var(--ink); color:var(--panel); border-radius:8px; padding:4px 10px; text-align:center}
.ktab thead th small{font-weight:400; opacity:.85}
.ktab thead th:first-child,.ktab tbody th{background:none; color:var(--ink2); width:110px; padding-top:10px}
.ktab td{vertical-align:top; padding:0}
.kstack{display:flex; flex-direction:column; gap:6px}   /* 1つのマスに2つ以上の内容（クロールと平泳ぎなど）を縦に積む。高さは指定しない */
.ktab td .kcell{margin:0}
.khead{background:var(--ink); color:var(--panel); border-radius:8px; padding:4px 10px; font-weight:700; text-align:center; margin-bottom:6px}
.kcell{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px; font-size:14px}
.kname{font-weight:700; margin-bottom:4px}
.kexp summary{cursor:pointer; color:var(--accent); font-size:13px; margin-top:4px}
.kexp:not([open]) .k-c, .kexp[open] .k-o{display:none}   /* 開いているときは「解説を閉じる」 */
.kopen{border:0; background:none; color:var(--accent); cursor:pointer; padding:4px 0 0; font-size:13px; text-decoration:underline}
footer{color:var(--ink2); font-size:12px; text-align:center; padding:20px 16px 30px}
@media (max-width:640px){
  .brand h1{font-size:17px}
  #result h2{font-size:19px}
  .sec{padding:10px 12px}
  .picks{grid-template-columns:1fr}
}
</style>

<header class="top" id="hdr"><div class="wrap topin">
  <div class="brand">
    <svg class="logo" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="3" width="17" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9h9M7 13h9M7 17h6" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="18" r="4" fill="none" stroke="#2b5d8a" stroke-width="2.2"/><path d="M22 21l2.5 2.5" stroke="#2b5d8a" stroke-width="2.4" stroke-linecap="round"/></svg>
    <h1>学習指導要領まとめツール</h1>
  </div>
  <a class="tomap" id="toMap" href="#" hidden>学びのつながりマップへ →</a>
</div></header>

<main class="wrap">
  <p class="lead">教科書の単元、学習指導要領の区分、または言葉から選ぶと、学習指導要領の本文、解説のその内容の説明、内容の取扱い、学年の目標をまとめて読めます。「知識及び技能」などのボタンで、その観点の部分だけにしぼれます。</p>

  <div class="panel">
    <div class="row"><span class="lbl">教科</span><select id="subjSel" aria-label="教科"></select><span class="note" id="subjNote"></span></div>
    <div class="row"><span class="lbl">さがし方</span>
      <div class="seg" role="group" aria-label="さがし方">
        <button type="button" data-way="unit" aria-pressed="true">単元から</button>
        <button type="button" data-way="area" aria-pressed="false">区分から</button>
        <button type="button" data-way="word" aria-pressed="false">言葉で検索</button>
        <button type="button" data-way="keito" aria-pressed="false">系統で比べる</button>
      </div>
    </div>
    <div class="row" id="gradeRow"><span class="lbl">学年</span><div class="row" id="grades" style="margin:0"></div></div>
    <div id="pickUnit"></div>
    <div id="pickArea" hidden></div>
    <div id="pickKeito" hidden></div>
    <div id="pickWord" hidden>
      <div class="search"><input id="q" type="search" placeholder="例：概数、単位量あたり、筆算" aria-label="さがす言葉" autocomplete="off"></div>
      <div class="hits" id="hits"></div>
    </div>
  </div>

  <section id="result" aria-live="polite"><p class="empty">上で単元や内容を選んでください。</p></section>
</main>
<footer id="foot"></footer>

文字，発声や発音","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["イ　音節と文字との関係，アクセントによる語の意味の違いなどに気付くとともに，姿勢や口形，発声や発音に注意して話すこと。"],"notes":null,"units":[{"u":"うたに あわせて あいうえお","b":"1年上","s":1},{"u":"ことばの たいそう （こえに だして よもう よく きいて、はなそう ことばを さがそう）","b":"1年上","s":1},{"u":"楽しかったよ、二年生","b":"2年下","s":1}],"kan":"k"},{"id":"kokugo-12-K1-ウ","g":[1,2],"area":"K1","areaName":"知識及び技能 ⑴ 言葉の特徴や使い方","mark":"ウ","head":"平仮名・片仮名，助詞，句読点，かぎの使い方","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["ウ　長音，拗音，促音，撥音などの表記，助詞の「は」，「へ」及び「を」の使い方，句読点の打ち方，かぎ（「」）の使い方を理解して文や文章の中で使うこと。また，平仮名及び片仮名を読み，書くとともに，片仮名で書く語の種類を知り，文や文章の中で使うこと。"],"notes":null,"units":[{"u":"かく こと たのしいな","b":"1年上","s":1},{"u":"かきと かぎ","b":"1年上","s":1},{"u":"ねこと ねっこ","b":"1年上","s":1},{"u":"おばさんと おばあさん","b":"1年上","s":1},{"u":"あいうえおで あそぼう","b":"1年上","s":1},{"u":"おもちやと おもちゃ","b":"1年上","s":1},{"u":"はをへを つかおう","b":"1年上","s":1},{"u":"かたかなを みつけよう","b":"1年上","s":1},{"u":"くじらぐも","b":"1年下","s":1},{"u":"かたかなを かこう","b":"1年下","s":1},{"u":"かたかなの かたち","b":"1年下","s":1},{"u":"こんな もの、見つけたよ（丸、点、かぎ）","b":"2年上","s":1},{"u":"かたかなのひろば","b":"2年上","s":1},{"u":"かたかなで書くことば","b":"2年下","s":1}],"kan":"k"},{"id":"kokugo-12-K1-エ","g":[1,2],"area":"K1","areaName":"知識及び技能 ⑴ 言葉の特徴や使い方","mark":"エ","head":"漢字を読む・書く（1・2年の配当漢字）","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["エ　第１学年においては，別表の学年別漢字配当表（以下「学年別漢字配当表」という。）の第１学年に配当されている漢字を読み，漸次書き，文や文章の中で使うこと。第２学年においては，学年別漢字配当表の第２学年までに配当されている漢字を読むこと。また，第１学年に配当されている漢字を書き，文や文章の中で使うとともに，第２学年に配当されている漢字を漸次書き，文や文章の中で使うこと。"],"notes":null,"units":[{"u":"かずと かんじ","b":"1年上","s":1},{"u":"かん字の はなし","b":"1年下","s":1},{"u":"日づけと よう日","b":"1年下","s":1},{"u":"にて いる かん字","b":"1年下","s":1},{"u":"同じ ぶぶんを もつ かん字","b":"2年上","s":1},{"u":"かん字の ひろば①","b":"2年上","s":1},{"u":"かん字のひろば②","b":"2年上","s":1},{"u":"かん字のひろば③","b":"2年上","s":1},{"u":"かん字の読み方","b":"2年下","s":1},{"u":"かん字のひろば④","b":"2年下","s":1},{"u":"カンジーはかせの大はつめい","b":"2年下","s":1},{"u":"かん字の広場⑤","b":"2年下","s":1}],"kan":"k"},{"id":"kokugo-12-K1-オ","g":[1,2],"area":"K1","areaName":"知識及び技能 ⑴ 言葉の "相手を見て話す，抑揚・強弱・間","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["イ　相手を見て話したり聞いたりするとともに，言葉の抑揚や強弱，間の取り方などに注意して話すこと。"],"notes":null,"units":[{"u":"もっと知りたい、友だちのこと （きちんとつたえるために）","b":"3年上","s":1},{"u":"お気に入りの場所、教えます","b":"3年下","s":1},{"u":"調べて話そう、生活調査隊","b":"4年下","s":1}],"kan":"k"},{"id":"kokugo-34-K1-ウ","g":[3,4],"area":"K1","areaName":"知識及び技能 ⑴ 言葉の特徴や使い方","mark":"ウ","head":"漢字と仮名の表記，送り仮名，ローマ字（3年）","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["ウ　漢字と仮名を用いた表記，送り仮名の付け方，改行の仕方を理解して文や文章の中で使うとともに，句読点を適切に打つこと。また，第３学年においては，日常使われている簡単な単語について，ローマ字で表記されたものを読み，ローマ字で書くこと。"],"notes":null,"units":[{"u":"ローマ字","b":"3年上","s":1},{"u":"漢字の意味","b":"3年下","s":1},{"u":"ローマ字を使いこなそう","b":"4年上","s":1},{"u":"漢字を正しく使おう","b":"4年下","s":1}],"kan":"k"},{"id":"kokugo-34-K1-エ","g":[3,4],"area":"K1","areaName":"知識及び技能 ⑴ 言葉の特徴や使い方","mark":"エ","head":"漢字を読む・書く（3・4年の配当漢字）","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["エ　第３学年及び第４学年の各学年においては，学年別漢字配当表の当該学年までに配当されている漢字を読むこと。また，当該学年の前の学年までに配当されている漢字を書き，文や文章の中で使うとともに，当該学年に配当されている漢字を漸次書き，文や文章の中で使うこと。"],"notes":null,"units":[{"u":"漢字の広場①","b":"3年上","s":1},{"u":"漢字の音と訓","b":"3年上","s":1},{"u":"漢字の広場②","b":"3年上","s":1},{"u":"漢字の広場③","b":"3年上","s":1},{"u":"漢字の広場④","b":"3年下","s":1},{"u":"カンジーはかせの音訓かるた","b":"3年下","s":1},{"u":"漢字の広場⑤","b":"3年下","s":1},{"u":"漢字の広場⑥","b":"3年下","s":1},{"u":"カンジーはかせの都道府県の旅１","b":"4年上","s":1},{"u":"カンジーはかせの都道府県の旅２","b":"4年上","s":1},{"u":"熟語の意味","b":"4年下","s":1}],"kan":"k"},{"id":"kokugo-34-K1-オ","g":[3,4],"area":"K1","areaName":"知識及び技能 ⑴ 言葉の特徴や使い方","mark":"オ","head":"様子や気持ちを表す語句を増やす","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["オ　様子や行動，気持ちや性格を表す語句の量を増し，話や文章の中で使うとともに，言葉には性質や役割による語句のまとまりがあることを理解し，語彙を豊かにすること。"],"notes":null,"units":[{"u":"春風をたどって","b":"3年上","s":1},{"u":"春のくらし","b":"3年上","s":1},{"u":"夏のくらし","b":"3年上","s":1},{"u":"ちいちゃんのかげおくり","b":"3年下","s":1},{"u":"秋のくらし","b":"3年下","s":1},{"u":"冬のくらし","b":"3年下","s":1},{"u":"つたわる言葉で表そう","b":"3年下","s":1},{"u":"たから島のぼうけん","b":"3年下","s":1},{"u":"白いぼうし","b":"4年上","s":1},{"u":"春の楽しみ","b":"4年上","s":1},{"u":"夏の楽しみ","b":"4年上","s":1},{"u":"いろいろな意味をもつ言葉","b":"4年上","s":1},{"u":"ごんぎつね（言葉を分類しよう）","b":"4年下","s":1},{"u":"秋の楽しみ","b":"4年下","s":1},{"u":"冬の楽しみ","b":"4年下","s":1}],"kan":"k"},{"id":"kokugo-34-K1-カ","g":[3,4],"area":"K1","areaName":"知識及び技能 ⑴ 言葉の特徴や使い方","mark":"カ","head":"修飾と被修飾，指示語・接続語，段落の役割","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["カ　主語と述語との関係，修飾と被修飾との関係，指示する語句と接続する語句の役割，段落の役割について理解すること。"],"notes":null,"units":[{"u":"こそあど言葉を使いこなそう","b":"3年上","s":1},{"u":"修飾語を使って書こう","b":"3年下","s":1},{"u":"ありの行列","b":"3年下","s":1},{"u":"つなぎ言葉のはたらきを知ろう","b":"4年上","s":1},{"u":"つながりに気をつけよう","b":"4年下","s":1}],"kan":"k"},{"id":"kokugo-34-K1-キ","g":[3,4],"area":"K1","areaName":"知識及び技能 ⑴ 言葉の特徴や使い方","mark":"キ","head":"敬体と常体の違いに注意して書く","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["キ　丁寧な言葉を使うとともに，敬体と常体との違いに注意しながら書くこと。"],"notes":null,"units":[{"u":"気もちをこめて、「来てください」","b":"3年上","s":1}],"kan":"k"},{"id":"kokugo-34-K1-ク","g":[3,4],"area":"K1","areaName":"知識及び技能 ⑴ 言葉の特徴や使い方","mark":"ク","head":"文章全体の構成を意識して音読する","title":"言葉の特徴や使い方に関する次の事項を身に付けることができるよう指導する。","lines":["ク　文章全体の構成や内容の大体を意識しながら音読すること。"],"notes":null,"units":[{"u":"どきん","b":"3年上","s":1},{"u":"春のうた","b":"4年上","s":1}],"kan":"k"},{"id":"kokugo-34-K2-ア","g":[3,4],"area":"K2","areaName":"知識及び技能 ⑵ 情報の扱い方","mark":"ア","head":"考えと理由や事例，全体と中心の関係","title":"話や文章に含まれている情報の扱い方に関する次の事項を身に付けることができるよう指導する。","lines":["ア　考えとそれを支える理由や事例，全体と中心など情報と情報との関係について理解すること。"],"notes":null,"units":[{"u":"文様 こまを楽しむ 全体と中心","b":"3年上","s":1},{"u":"こんな係がクラスにほしい","b":"3年上","s":1},{"u":"思いやりのデザイン アップとルーズで伝える 考えと例","b":"4年上","s":1},{"u":"あなたなら、どう言う","b":"4年上","s":1},{"u":"もしものときにそなえよう","b":"4年下","s":1},{"u":"風船でうちゅうへ","b":"4年下","s":1}],"kan":"k"},{"id":"kokugo-34-K2-イ","g":[3,4],"area":"K2","areaName":"知識及び技能 ⑵ 情報の扱い方","mark":"イ","head":"比較や分類，引用，辞書や事典の使い方","title":"話や文章に含まれている情報の扱い方に関する次の事項を身に付けることができるよう指導する。","lines":["イ　比較や分類の仕方，必要な語句などの書き留め方，引用の仕方や出典の示し方，辞書や事典の使い方を理解し使うこと。"],"notes":null,"units":[{"u":" ":"k"},{"id":"kokugo-34-K3-オ","g":[3,4],"area":"K3","areaName":"知識及び技能 ⑶ 我が国の言語文化","mark":"オ","head":"幅広く読書に親しみ，知識や情報を得る","title":"我が国の言語文化に関する次の事項を身に付けることができるよう指導する。","lines":["オ　幅広く読書に親しみ，読書が，必要な知識や情報を得ることに役立つことに気付くこと。"],"notes":null,"units":[{"u":"図書館たんていだん","b":"3年上","s":1},{"u":"本で知ったことをクイズにしよう 鳥になったきょうりゅうの話","b":"3年上","s":1},{"u":"図書館の達人になろう","b":"4年上","s":1},{"u":"本のポップや帯を作ろう 神様の階段","b":"4年上","s":1}],"kan":"k"},{"id":"kokugo-34-A-ア","g":[3,4],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"ア","head":"目的を意識して話題を決め，材料を比較・分類する","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["ア　目的を意識して，日常生活の中から話題を決め，集めた材料を比較したり分類したりして，伝え合うために必要な事柄を選ぶこと。"],"notes":null,"units":[{"u":"調べて話そう、生活調査隊","b":"4年下","s":1}],"kan":"s"},{"id":"kokugo-34-A-イ","g":[3,4],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"イ","head":"理由や事例を挙げ，話の中心が分かる構成","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["イ　相手に伝わるように，理由や事例などを挙げながら，話の中心が明確になるよう話の構成を考えること。"],"notes":null,"units":[{"u":"お気に入りの場所、教えます","b":"3年下","s":1}],"kan":"s"},{"id":"kokugo-34-A-ウ","g":[3,4],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"ウ","head":"抑揚・強弱・間の取り方を工夫する","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["ウ　話の中心や話す場面を意識して，言葉の抑揚や強弱，間の取り方などを工夫すること。"],"notes":null,"units":[{"u":"調べて話そう、生活調査隊","b":"4年下","s":1}],"kan":"s"},{"id":"kokugo-34-A-エ","g":[3,4],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"エ","head":"記録や質問をしながら聞き，中心を捉える","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["エ　必要なことを記録したり質問したりしながら聞き，話し手が伝えたいことや自分が聞きたいことの中心を捉え，自分の考えをもつこと。"],"notes":null,"units":[{"u":"もっと知りたい、友だちのこと （きちんとつたえるために）","b":"3年上","s":1},{"u":"聞き取りメモのくふう （話し方や聞き方からつたわること）","b":"4年上","s":1}],"kan":"s"},{"id":"kokugo-34-A-オ","g":[3,4],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"オ","head":"司会などの役割を果たしながら話し合う","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["オ　目的や進め方を確認し，司会などの役割を果たしながら話し合い，互いの意見の共通点や相違点に着目して，考えをまとめること。"],"notes":null,"units":[{"u":"こんな係がクラスにほしい","b":"3年上","s":1},{"u":"おすすめの一さつを決めよう","b":"3年下","s":1},{"u":"あなたなら、
