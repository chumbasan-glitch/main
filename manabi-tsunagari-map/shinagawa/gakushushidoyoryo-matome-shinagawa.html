易化されたゲームや練習に積極的に取り組むこと。","イ ルールやマナーを守り，仲間と助け合うこと。","ウ  ゲームを行う場の設定や用具の片付けなどで，分担された役割を果たすこと。","エ ゲームの勝敗を受け入れること。","オ  ゲームや練習の中で互いの動きを見合ったり，話し合ったりする際に，仲間の考えや取組を認めること。","カ  ゲームや練習の際に，使用する用具などを片付けたり場の整備をしたりするとともに，用具の安全に気を配ること。","◎ 運動に意欲的でない児童への配慮の例","・ 味方や相手が投げるボールに恐怖心を抱くためにゲームに意欲的に取り組めない児童には，柔らかいボールを用意したり，大きなボールやゆっくりとした速さになるボールを用意したりするなどの配慮をする。","・ チームの中で何をすればよいかが分からないためにゲームに意欲的に取り組めない児童には，チーム内で分担する役割を確認するなどの配慮をする。","・ 場やルールが難しいためにゲームに意欲的に取り組めない児童には，場の設定やルールをチームで一つずつ確認するなどの配慮をする。","・ 新しく提示した動きが分からないためにゲームに意欲的に取り組めない児童には，代表の児童やチームが行う見本を観察したり，ゲーム中のポジションを確認したり，その動きを動画で確認したりする場を設定するなどの配慮をする。","・ 技能が高いにもかかわらずゲームに意欲的に取り組めない児童には，リーダーとしてチームをまとめるようにしたり，仲間に動きのアドバイスをする役割を担うようにしたりするなどの配慮をする。","・ ゲームに負け続けるためにゲームや練習に意欲的に取り組めない児童には，チームに合った作戦を選び直したり，新たな作戦を試したりすることを促すなどの配慮をする。","・ チーム内で仲間とうまく関わることができないためにゲームに意欲的に取り組めない児童には，チーム内の役割を明確にしたり，その役割に取り組むように助言したりするなどの配慮をする。","・ 仲間と仲よく助け合ってゲームに取り組めない児童には，役割を果たしたこと，最後まで全力でプレイしたこと，味方を励ます言葉がけがあったことなどの取組を，授業のまとめで取り上げて称賛したり，児童が相互に称え合ったりする場面を設定するなどの配慮をする。"]}},"taiiku-56-F-0":{"page":145,"name":"表現運動","expl":{"intro":["高学年の表現運動は，「表現」及び「フォークダンス」で内容が構成され，これらの運動は，自己の心身を解き放して，イメージやリズムの世界に没入してなりきって踊ることが楽しい運動であり，互いのよさを生かし合って仲間と交流して踊る楽しさや喜びを味わうことのできる運動である。","低学年の「表現リズム遊び」と中学年の「表現運動」の学習で身に付けてきた即興的に表現する能力やリズムに乗って踊る能力，コミュニケーション能力などを土台として，「表現」では，更に個人やグループの持ち味を生かした簡単なひとまとまりの動きにして，仲間と表したい感じを込めて通して踊る力を培うとともに，「フォークダンス」では，日本の地域や世界の国々で親しまれてきた日本の民踊や外国の踊りを身に付けて，日本の地域や世界の文化に触れながら踊りで交流する力を培い，中学校のダンスの学習につなげていくことが求められる。","また，表現運動を楽しく行うために，自己やグループの課題を見付け，その解決のための活動を工夫するとともに，助け合って踊ったり，互いの動きや考えを認め合ったり，場の安全に気を配ったりすることが大切である。"],"k":["表現では，その行い方を理解するとともに，いろいろな題材からそれらの主な特徴を捉え，表したい感じやイメージをひと流れの動きで即興的に表現したり，グループで簡単なひとまとまりの動きにして表現したりすること。","いろいろな題材とは，高学年の児童の発達の段階に応じて，「激しい感じの題材」，「群（集団）が生きる題材」などの変化と起伏のある表現へ発展しやすい題材と，題材を一つに固定しないで幅の広い捉え方や動きを含む題材として「多様な題材」を示している。それらの中から，題材の特徴を捉え，表したい感じやイメージを強調するように，動きを誇張したり変化を付けたりしてメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に表現したり，グループで変化と起伏のある「はじめ－なか－おわり」の構成を工夫した簡単なひとまとまりの動きにしたりして表現すること。","［題材と動きの例示］","○ 「激しい感じの題材」…生活や自然などから「激しく〇〇する」（バーゲンセール，火山の爆発，大型台風接近など）や「急に〇〇する」（ロボットが壊れた，竜巻発生，怒りの爆発など）などの変化や起伏のある動きを含む題材","○ 「群（集団）が生きる題材」…生活や社会，自然などから「祭り」，「スポーツの攻防」，「出口を探せ！」などの特徴的な群の動きや迫力を生かせる題材・ 題材の特徴の捉え方としては，題材から動きの変化や起伏の特徴を捉え，そこに感情の変化や起伏を重ねていけるようにする。例えば，「火山の爆発」で，エネルギーの集中と不規則な爆発を繰り返す動きの中に自然への畏れの感情を重ねたり，「スポーツの攻防」で，対立･対応した動きから決定的な瞬間へ展開する動きの中に，勝者と敗者の感情の対比を重ねたりするなどである。","・ ひと流れの動きへの工夫の仕方としては，表したい感じやイメージを，素早く走る－急に止まる，ねじる－回る，跳ぶ－転がるなどの動きで変化を付けたり繰り返したりして，激しい感じや急変する感じをメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に踊ること。","・ 群の動きの工夫の仕方としては，集まる（固まる）－離れる，合わせて動く－自由に動くなど，表したい感じやイメージにふさわしい簡単な群の動きでひと流れの動きにして即興的に踊ること。","・ 簡単なひとまとまりの動きへの工夫の仕方としては，表したい感じやイメージを強調するように，変化と起伏のある「はじめ－なか－おわり」の構成や群の動きを工夫して，仲間と感じを込めて通して踊ること。","○ 「多様な題材」…「わたしたちの地球」，「ニュース〇〇」，「〇月×日，私のダイアリー」など，社会や生活のいろいろな印象的な出来事から個人やグループで選んだ関心のある題材","・ 題材の特徴の捉え方としては，社会の出来事や何気ない日常生活の中から個人やグループで関心のある印象的な出来事を独自に捉えるようにすること。","・ 動きの誇張や変化の付け方としては，表したい感じやイメージを，素早く走る－急に止まる，ねじる－回る，跳ぶ－転がるなどの差のある動きや急変する動きを入れるなどして，変化とメリハリ（緩急・強弱）のあるひと流れの動きにして即興的に踊ること。","・ 簡単なひとまとまりの動きへの工夫の仕方としては，表したい感じやイメージを強調するように「はじめ－なか－おわり」の構成や群の動きを工夫したり，特にラストシーンを印象的にしたりして，個人やグループの持ち味を生かした簡単なひとまとまりの動きにして，仲間と感じを込めて通して踊ること。","◎ 運動が苦手な児童への配慮の例","・ 題材の特徴を捉えることが苦手な児童には，二人から四人組などで，題材の特徴的な様子や動きを出し合いながら踊ってみるなどの配慮をする。・ ひと流れの動きにすることが苦手な児童には，表したい感じやイメージから捉えた変化とメリハリ（緩急・強弱）のある動きを，教師や仲間のリードで幾つか一緒に踊ってみるなどの配慮をする。","・ 簡単なひとまとまりの動きにすることが難しい児童には，一番表したい感じやイメージを明確にするとともに，できたところまでを通して踊ってみながら，表したい感じにふさわしい「はじめ－なか－おわり」の構成になっているか教師や他のグループに見てもらうなどの配慮をする。","イ フォークダンス（日本の民踊を含む）","フォークダンスでは，その行い方を理解するとともに，日本の民踊や外国の踊りの踊り方の特徴を捉え，基本的なステップや動きを身に付けて，音楽に合わせてみんなで楽しく踊って交流すること。","日本の民踊とは，それぞれの地域で親しまれている民踊や日本の代表的な民踊で，歌詞に伴う手振り，低く踏みしめるような足どりと腰の動き，輪踊り，一人踊りが多いなどの日本の民踊に共通する特徴をもつ踊りとして示している。外国の踊りとは，世界の国々で親しまれている代表的なフォークダンスで，軽快な音楽に乗せたいろいろなステップ，輪や列になって手をつないで踊る，パートナーと組んで踊るなど，国によって様々な特徴をもつ踊りとして示している。それらの踊りの中から踊りの特徴を捉え，基本的なステップや動きを身に付けて，音楽に合わせてみんなで楽しく踊って交流すること。また，踊りの由来や背景を理解し，踊りを通して日本の地域や世界の文化に触れるようにすること。","［踊りと動きの例示］","○ 日本の民踊","それぞれの地域で親しまれている民踊や日本の代表的な民踊の中から，軽快なリズムの踊りや力強い踊りなど，特徴や感じが異なる踊りや簡単な動きで構成されている踊り。","・ 日本の民踊に共通する特徴やそれぞれの踊り方の特徴を捉え，構成された基本的な踊り方を身に付けて踊ること。","・ 阿波踊り（徳島県）や春駒（岐阜県）などの軽快なリズムの踊りでは，軽快な足さばきや手振りで踊ること。","・ ソーラン節（北海道）やエイサー（沖縄県）などの力強い踊りでは，低く踏みしめるような足取りや腰の動きで踊ること。","○ 外国のフォークダンス","世界の国々で親しまれている代表的なフォークダンスの中から，特徴や感じが異なる踊りや簡単な隊形・ステップ・組み方で構成される踊り。","・ マイム・マイム（イスラエル）などのシングルサークルで踊る力強い踊りでは，みんなで手をつなぎ，かけ声をかけて力強くステップを踏みながら移動して踊ること。","・ コロブチカ（ロシア）などのパートナーチェンジのある軽快な踊りでは，パートナーと組んでスリーステップターンなどの軽快なステップで動きを合わせたり，パートナーチェンジをスムーズに行ったりしながら踊ること。・ グスタフス・スコール（スウェーデン）などの特徴的な隊形と構成の踊りでは，前半の厳かな挨拶の部分と後半の軽快なスキップやアーチくぐりなどの変化を付けて，パートナーや全体でスムーズに隊形移動しながら踊ること。","◎ 運動が苦手な児童への配慮の例","・ 踊ることが苦手な児童には，低学年で既習した簡単な踊りや，前時に学習した踊りを授業の導入で行うなどの配慮をする。","・ 踊りの特徴を捉えて踊ることが苦手な児童には，踊りの由来や背景を伝えたり，映像を見て踊りのイメージを捉えたりするなどの配慮をする。","・ 踊り方を身に付けることが苦手な児童には，教師が曲を口ずさみながら全体を大まかに通して踊り，難しいところは部分練習をするなどの配慮をする。"],"s":["ア  自己やグループの課題を見付け，その課題の解決の仕方を考えたり，課題に応じた見合いや交流の仕方などを選んだりすること。","○ 自己やグループの課題を見付ける例","・ 表したい感じやイメージが表れているか，踊りの特徴を捉えて踊れているかなど，グループの仲間や他のグループの踊りを見て，自己やグループの課題を見付けること。","○ 課題に応じて動きを選ぶ例","・ 「表したい感じやイメージを強調する」という課題に応じて，素早く－ゆっくり，ねじる－回る，跳ぶ－転がるなどの差のある動きや群の動きなどで変化を付ける方法を選ぶこと。","○ 課題にふさわしい簡単なひとまとまりの動きを構成する例","・ 「表したい感じやイメージが伝わりにくい」という課題に応じて，「はじめ－なか－おわり」で一番盛り上げたい場面を明確にし，急変する場面や取り入れる群の動きを選ぶこと。","○ 課題に応じた見合いや交流の仕方を工夫する例","・ 表したい感じやイメージが表れているか，踊りの特徴を捉えているかなどを確かめるために，ペアのグループやクラス全体で見合ったり，一緒に踊って見合いながら交流したりするなどの仕方を選ぶこと。","イ 課題の解決のために自己や仲間の考えたことを他者に伝えること","○ 表現で工夫した成果を他者に伝える例","・ 表したい感じやイメージにふさわしい動きになっているかをペアのグループやクラス全体で見合い，よくなったところを伝えること。","○ フォークダンスで身に付けた踊りの特徴を他者に伝える例","・ ペアのグループやクラス全体で踊り，踊りの特徴が出ているかを伝えること。"],"m":["ア  表したい感じやイメージを表現したり，日本の民踊や外国のフォークダンスで交流したりする運動に積極的に取り組むこと。","イ  表現やフォークダンスに取り組む際に，互いの動きや考えのよさを認め合うこと。","ウ 表現やフォークダンスにグループで取り組む際に，仲間と助け合うこと。","エ  表現やフォークダンスを行う場の設定や用具の片付けなどで，分担された役割を果たすこと。","オ  活動する場所の危険物を取り除くとともに，仲間とぶつからないよう，場の安全に気を配ること。","◎ 運動に意欲的でない児童への配慮の例","・ 仲間の前で表現やフォークダンスを行うことに意欲的に取り組めない児童には，授業の導入で，中学年のリズムダンスで学習したへそ（体幹部）を中心に軽快なリズムに乗って踊る活動を取り入れ，心と体をほぐすなどの配慮をする。","・ 表したい感じやイメージを表現することに意欲的に取り組めない児童には，取り上げる題材を，クラス共通の題材だけでなく，個人やグループの関心や能力の違いに応じて選ぶようにするなどの配慮をする。","・ 日本の民踊や外国のフォークダンスを踊ることに意欲的に取り組めない児童には，身近な郷土の民踊や外国のフォークダンスの映像を見せて興味・関心をもてるようにしたり，踊りに必要な簡単な小道具や衣装を着けて踊りの雰囲気を高めたりするなどの配慮をする。"]}},"taiiku-5-G-1":{"page":150,"name":"保健：心の健康","expl":{"intro":["心の健康については，心は発達すること，及び心と体には密接な関係があることについて理解できるようにする必要がある。また，不安や悩みへの対処にはいろいろな方法があることを理解できるようにするとともに，不安や悩みを緩和するための対処の方法を行うことができるようにする必要がある。さらに，心の健康に関する課題を見付け，よりよい解決に向けて思考し判断するとともに，それらを表現できるようにする必要がある。","このため，本内容は，感情，社会性，思考力など，様々なはたらきの総体として捉えることができる心が，様々な生活経験を通して年齢に伴って発達すること，また，心と体は深く影響し合っていること，不安や悩みは誰もが経験すること，それらへの対処にはいろいろな方法があることなどの知識及び不安や悩みへの対処の技能と，心の健康に関する課題を解決するための思考力，判断力，表現力等を中心として構成している。"],"k":["(ｱ) 心の発達","心は人との関わり，あるいは自然とのふれあいなど様々な生活経験や学習を通して，年齢に伴って発達することを理解できるようにする。その際，家族，友達，地域の人々など人との関わりを中心として取り扱うようにし，心が発達することによって，自己の感情をコントロールしたり，相手の気持ちを理解したりすることができるようになることにも触れるようにする。また，自己の気持ちを上手に伝えるなど，よりよいコミュニケーションが大切であることにも触れるようにする。","(ｲ) 心と体との密接な関係","不安や緊張時には，動悸が激しくなったり，腹痛を起こしたりすること，体調が悪いときには，集中できなかったり，落ち込んだ気持ちになったり，体調がよいときには，気持ちが明るくなったり，集中できるようになったりすることなど，心と体は深く影響し合っていることを理解できるようにする。","(ｳ) 不安や悩みへの対処","不安や悩みがあるということは誰もが経験することであり，そうした場合には，家族や先生，友達などと話したり，相談したりすること，仲間と遊ぶこと，運動をしたり音楽を聴いたりすること，呼吸法を行うなどによって気持ちを楽にしたり，気分を変えたりすることなど様々な方法があり，自分に合った適切な方法で対処できることを理解できるようにする。その際，自己の心に不安や悩みがあるという状態に気付くことや不安や悩みに対処するために様々な経験をすることは，心の発達のために大切であることにも触れるようにする。","不安や悩みへの対処として，体ほぐしの運動や深呼吸を取り入れた呼吸法などを行うことができるようにする。"],"s":["心の健康に関わる事象から課題を見付け，心をよりよく発達させたり不安や悩みに対処したりする視点から，解決の方法を考え，適切なものを選び，それらを説明することができるようにする。","［例示］","・ 心の発達に関する事柄や，不安や悩みの経験から，心の健康に関わる課題を見付けること。","・ 心の発達や心と体の関わりについて，自己の経験と学習したことを関連付けて，よりよく心を発達させる適切な方法や心と体の関わりについて考えること。","・ 不安や悩みに対処する様々な方法を考え，学習したことを活用して，適切な方法を選ぶこと。","・ 心の健康について，考えたり選んだりした方法がなぜ適切なのか，理由をあげて学習カードなどに書いたり，友達に説明したりすること。"],"m":[]}},"taiiku-5-G-2":{"page":153,"name":"保健：けがの防止","expl":{"intro":["けがの防止については，けがの発生要因や防止の方法について理解できるようにする必要がある。また，けがが発生したときには，その症状の悪化を防ぐために速やかに手当ができるようにする必要がある。さらに，危険を予測し回避する方法を考え，それらを表現できるようにする必要がある。","このため，本内容は，交通事故や身の回りの生活の危険などを取り上げ，けがの起こり方とその防止，けがの悪化を防ぐための簡単な手当などの知識及びけがの手当の技能と，けがの防止に関する課題を解決するための思考力，判断力，表現力等などを中心として構成している。"],"k":["(ｱ) 交通事故や身の回りの生活の危険が原因となって起こるけがとその防止","○ 毎年多くの交通事故や水の事故が発生し，けがをする人や死亡する人が少なくないこと，また，学校生活での事故や，犯罪被害が発生していることを理解できるようにするとともに，これらの事故や犯罪，それらが原因となるけがなどは，人の行動や環境が関わって発生していることを理解できるようにする。","○ 交通事故や身の回りの生活の危険が原因となって起こるけがを防止するためには，周囲の状況をよく見極め，危険に早く気付いて，的確な判断の下に安全に行動することが必要であることを理解できるようにする。その際，交通事故の防止については，道路を横断する際の一時停止や右左の安全確認などを，学校生活の事故によるけがの防止については，廊下や階段の歩行の仕方，運動場などでの運動や遊び方などを，犯罪被害の防止については，犯罪が起こりやすい場所を避けること，犯罪に巻き込まれそうになったらすぐに助けを求めることなどを取り上げるようにする。なお，心の状態や体の調子が的確な判断や行動に影響を及ぼすことについても触れるようにする。","○ 交通事故，水の事故，学校生活の事故や，犯罪被害の防止には，危険な場所の点検などを通して，校舎や遊具など施設・設備を安全に整えるなど，安全な環境をつくることが必要であることを理解できるようにする。その際，通学路や地域の安全施設の改善などの例から，様々な安全施設の整備や適切な規制が行われていることにも触れるようにする。","(ｲ) けがの手当","○ けがをしたときには，けがの悪化を防ぐ対処として，けがの種類や程度などの状況をできるだけ速やかに把握して処置すること，近くの大人に知らせることが大切であることを理解できるようにする。また，自らできる簡単な手当には，傷口を清潔にする，圧迫して出血を止める，患部を冷やすなどの方法があることを理解できるようにする。","○ すり傷，鼻出血，やけどや打撲などを適宜取り上げ，実習を通して，傷口を清潔にする，圧迫して出血を止める，患部を冷やすなどの自らできる簡単な手当ができるようにする。"],"s":["けがの防止に関わる事象から課題を見付け，危険の予測や回避をしたり，けがを手当したりする方法を考え，それらを伝えることができるようにする。","［例示］","・ 人の行動や環境，けがの手当の仕方などから，けがや症状の悪化の防止に関わる課題を見付けること。","・ 自分のけがに関わる経験を振り返ったり，学習したことを活用したりして，危険の予測や回避の方法，けがなどの適切な手当の方法を考えたり，選んだりすること。","・ けがの防止について，けがや症状の悪化の防止のために考えたり，選んだりした方法がなぜ適切であるか，理由をあげて学習カードなどに書いたり，友達に説明したりすること。"],"m":[]}},"taiiku-6-G-3":{"page":155,"name":"保健：病気の予防","expl":{"intro":["病気の予防については，病気の発生要因や予防の方法について理解できるようにする必要がある。また，喫煙，飲酒，薬物乱用が健康に与える影響について理解できるようにする必要がある。さらに，病気の予防に関する課題を見付け，よりよい解決に向けて思考し判断するとともに，それらを表現できるようにする必要がある。","このため，本内容は，病気の予防には，病原体が体に入るのを防ぐこと，病原体に対する体の抵抗力を高めること及び望ましい生活習慣を身に付けることが必要であること，また，喫煙，飲酒，薬物乱用などの行為は健康を損なう原因となること，さらに，地域において保健に関わる様々な活動が行われていることなどの知識と病気の予防に関する課題を解決するための思考力，判断力，表現力等を中心として構成している。"],"k":["(ｱ) 病気の起こり方","日常経験している病気として「かぜ」などを取り上げ，病気は，病原体，体の抵抗力，生活行動，環境などが関わりあって起こることを理解できるようにする。","(ｲ) 病原体が主な要因となって起こる病気の予防","病原体が主な要因となって起こる病気として，インフルエンザ，麻疹，風疹，結核などを適宜取り上げ，その予防には，病原体の発生源をなくしたり，移る道筋を断ち切ったりして病原体が体に入るのを防ぐこと，また，予防接種や適切な運動，食事，休養及び睡眠をとることなどによって，体の抵抗力を高めておくことが必要であることを理解できるようにする。","(ｳ) 生活行動が主な要因となって起こる病気の予防","生活行動が主な要因となって起こる病気として，心臓や脳の血管が硬くなったりつまったりする病気，むし歯や歯ぐきの病気などを適宜取り上げ，その予防には，全身を使った運動を日常的に行うこと，糖分，脂肪分，塩分などを摂りすぎる偏った食事や間食を避けたり，口腔の衛生を保ったりすることなど，健康によい生活習慣を身に付ける必要があることを理解できるようにする。","(ｴ) 喫煙，飲酒，薬物乱用と健康","○ 喫煙については，せきが出たり心拍数が増えたりするなどして呼吸や心臓のはたらきに対する負担などの影響がすぐに現れること，受動喫煙により周囲の人々の健康にも影響を及ぼすことを理解できるようにする。また，喫煙を長い間続けるとがんや心臓病などの病気にかかりやすくなるなどの影響があることについても触れるようにする。","飲酒については，判断力が鈍る，呼吸や心臓が苦しくなるなどの影響がすぐに現れることを理解できるようにする。なお，飲酒を長い間続けると肝臓などの病気の原因になるなどの影響があることについても触れるようにする。","その際，低年齢からの喫煙や飲酒は特に害が大きいことについても取り扱うようにし，未成年の喫煙や飲酒は法律によって禁止されていること，好奇心や周りの人からの誘いなどがきっかけで喫煙や飲酒を開始する場合があることについても触れるようにする。","○ 薬物乱用については，シンナーなどの有機溶剤を取り上げ，一回の乱用でも死に至ることがあり，乱用を続けると止められなくなり，心身の健康に深刻な影響を及ぼすことを理解できるようにする。その際，覚醒剤を含む薬物乱用は法律で厳しく規制されていることにも触れるようにする。","(ｵ) 地域の様々な保健活動の取組","人々の病気を予防するために，保健所や保健センターなどでは，健康な生活習慣に関わる情報提供や予防接種などの活動が行われていることを理解できるようにする。"],"s":["病気の予防に関わる事象から課題を見付け，病気を予防する視点から解決の方法を考え，適切な方法を選び，それらを説明することができるようにする。［例示］","・ 病気の予防について，病原体，体の抵抗力，生活行動，環境などの要因から課題を見付けること。","・ 病気の予防や回復に関する課題について，学習したことを活用して解決の方法を考えたり，選んだりすること。","・ いくつかの病気の要因や起こり方を比べて，それぞれの病気に応じた予防の方法を選ぶこと。","・ 喫煙，飲酒，薬物乱用と健康について，それらの害や体への影響を考えたり，地域の様々な保健活動の取組の中から人々の病気を予防するための取組を選んだりすること。","・ 病気の予防について，病気の予防や回復のために考えたり，選んだりした方法がなぜ適切であるか，理由をあげて学習カードなどに書いたり，友達に説明したりすること。"],"m":[]}}}}}],"edition":"品川区版","coming":["国語","社会","理科","生活","音楽","図画工作","家庭","外国語活動","外国語","特別の教科 道徳（市民科）","総合的な学習の時間（市民科）","特別活動（市民科）"],"mapUrl":"https://claude.ai/artifact/QYpnoKHpv9sgD9Zskx6pZe","footer":"学習指導要領まとめツール 品川区版　第1版（算数・体育の見本）　出典：小学校学習指導要領（平成29年告示）、同解説（文部科学省）。教科書の単元：品川区が採択した教科書（令和6〜9年度）の会社の年間指導計画による。"};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KAN = {k:"知識及び技能", s:"思考力、判断力、表現力等", m:"学びに向かう力、人間性等"};
const S = DATA.subjects, SUB = Object.fromEntries(S.map(s => [s.id, s]));
let cur = {subj:S[0].id, way:"unit", g:1, sel:null, part:0, kan:"all", q:""};
const store = {get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }};

/* 段落の字下げ：ア・（ア）などで始まる行は少し下げる */
const pcls = t => /^（[ア-ン]）|^\([ア-ン]\)/.test(t) ? "i2" : /^[ア-ンⅠ-Ⅹ①-⑳][\s　]/.test(t) ? "i1" : "";
const paras = (ls, q) => ls.map(t => '<p class="' + pcls(t) + '">' + hl(t, q) + '</p>').join("");
const hl = (t, q) => { const e = esc(t); if(!q) return e; const qq = esc(q); return e.split(qq).join('<mark>' + qq + '</mark>'); };

function renderSubjects(){
  $("subjSel").innerHTML = S.map(s => '<option value="' + s.id + '"' + (s.id === cur.subj ? ' selected' : '') + '>' + esc(s.name) + '</option>').join("") +
    DATA.coming.map(n => '<option disabled>' + esc(n) + '（準備中）</option>').join("");
  const s = SUB[cur.subj];
  $("subjNote").textContent = s.textbook ? "教科書：" + s.textbook : "";
}
function renderGrades(){
  const s = SUB[cur.subj];
  $("grades").innerHTML = s.grades.map(g => '<button type="button" class="gbtn" data-g="' + g + '" aria-pressed="' + (g === cur.g) + '">' + g + '年</button>').join("");
  $("grades").querySelectorAll("button").forEach(b => b.onclick = () => { cur.g = +b.dataset.g; renderPicks(); });
}
function renderPicks(){
  document.querySelectorAll("[data-way]").forEach(b => b.setAttribute("aria-pressed", b.dataset.way === cur.way));
  $("pickUnit").hidden = cur.way !== "unit"; $("pickArea").hidden = cur.way !== "area"; $("pickWord").hidden = cur.way !== "word";
  $("gradeRow").hidden = cur.way === "word";
  renderGrades();
  const s = SUB[cur.subj];
  if(cur.way === "unit"){
    const us = s.units.filter(u => u.g === cur.g);
    $("pickUnit").innerHTML = us.length ? '<div class="picks">' + us.map((u, i) => '<button type="button" class="pick" data-u="' + i + '" aria-pressed="' + (cur.sel && cur.sel.t === "u" && cur.sel.name === u.u && cur.sel.g === u.g) + '">' + esc(u.u) + '<small>' + esc(u.b) + '・' + u.ids.length + 'つの内容</small></button>').join("") + '</div>'
      : '<p class="empty">この学年の単元はありません。</p>';
    if(s.unitNote) $("pickUnit").insertAdjacentHTML("afterbegin", '<p class="note">' + esc(s.unitNote) + '</p>');
    $("pickUnit").querySelectorAll("[data-u]").forEach(b => b.onclick = () => { const u = us[+b.dataset.u]; select({t:"u", g:u.g, name:u.u, book:u.b, ids:u.ids}); });
  }
  if(cur.way === "area"){
    let h = "";
    for(const a of s.areas){
      const its = s.items.filter(it => it.g.includes(cur.g) && it.area === a.key);
      if(!its.length) continue;
      h += '<div class="areaH">' + esc(a.name) + '</div><div class="picks">' + its.map(it => '<button type="button" class="pick" data-i="' + it.id + '" aria-pressed="' + (cur.sel && cur.sel.t === "i" && cur.sel.ids[0] === it.id) + '">' + esc((it.mark ? it.mark + " " : "") + it.head) + '</button>').join("") + '</div>';
    }
    if(s.katsudo && s.katsudo[cur.g]) h += '<div class="areaH">' + esc(s.katsudoName) + '</div><div class="picks"><button type="button" class="pick" data-k="1">' + esc(s.katsudoName) + '（' + cur.g + '年）</button></div>';
    $("pickArea").innerHTML = h;
    $("pickArea").querySelectorAll("[data-i]").forEach(b => b.onclick = () => select({t:"i", g:cur.g, ids:[b.dataset.i]}));
    $("pickArea").querySelectorAll("[data-k]").forEach(b => b.onclick = () => select({t:"k", g:cur.g, ids:[]}));
  }
}
function select(sel){ cur.sel = sel; cur.part = 0; renderPicks(); renderResult(); location.hash = encodeURIComponent(cur.subj + ":" + (sel.t === "u" ? "u:" + sel.g + ":" + sel.name : sel.t === "k" ? "k:" + sel.g : "i:" + sel.ids[0])); scrollToResult(); }
function scrollToResult(){ requestAnimationFrame(() => { const r = $("result"); const y = r.getBoundingClientRect().top + scrollY - $("hdr").offsetHeight - 6; if(y < scrollY || y > scrollY + innerHeight * .6) scrollTo({top:y, behavior:"smooth"}); }); }

/* 検索：本文・解説・内容の取扱い・目標の文から */
function doSearch(){
  const q = $("q").value.trim(); cur.q = q;
  if(!q){ $("hits").innerHTML = ""; return; }
  const s = SUB[cur.subj], hits = [];
  for(const it of s.items){
    const K = s.kaisetsu.items[it.id] || {expl:{}};
    const parts = [["本文", [it.title, ...it.lines]], ["内容の取扱い", it.notes || []], ["解説", [...(K.expl.intro || []), ...(K.expl.k || []), ...(K.expl.s || [])]]];
    const found = [];
    for(const [where, ls] of parts) for(const l of ls) if(l && l.includes(q)) found.push([where, l]);
    if(found.length) hits.push({it, found});
  }
  const gh = [];
  for(const g of s.grades){ const G = s.goals[g]; if(!G) continue; const ls = [...G.lines, ...Object.values(G.expl || {}).flat()]; const f = ls.filter(l => l.includes(q)); if(f.length) gh.push({g, f}); }
  $("hits").innerHTML = '<p class="note">「' + esc(q) + '」は ' + hits.length + ' 件の内容' + (gh.length ? '、' + gh.length + ' 学年の目標' : '') + 'に出てきます。</p>' +
    hits.map(({it, found}) => {
      const snip = found.slice(0, 2).map(([w, l]) => { const i = l.indexOf(q); return '<p>' + esc(w) + '：…' + hl(l.slice(Math.max(0, i - 24), i + q.length + 30), q) + '…</p>'; }).join("");
      return '<button type="button" class="hit" data-i="' + it.id + '"><b>' + it.g.join("・") + '年　' + esc((it.mark ? it.mark + " " : "") + it.head) + '</b>（' + found.length + 'か所）' + snip + '</button>';
    }).join("") +
    gh.map(x => '<button type="button" class="hit" data-goal="' + x.g + '"><b>' + x.g + '年の目標</b>（' + x.f.length + 'か所）</button>').join("");
  $("hits").querySelectorAll("[data-i]").forEach(b => b.onclick = () => select({t:"i", g:SUB[cur.subj].items.find(i => i.id === b.dataset.i).g[0], ids:[b.dataset.i]}));
  $("hits").querySelectorAll("[data-goal]").forEach(b => b.onclick = () => { cur.kan = "m"; select({t:"g", g:+b.dataset.goal, ids:[]}); });
}

function kanBar(){
  return '<div class="kanbar" role="group" aria-label="観点でしぼる"><span class="note">観点でしぼる：</span>' +
    [["all","すべて"],["k",KAN.k],["s",KAN.s],["m",KAN.m]].map(([k, n]) => '<button type="button" data-kan="' + k + '" aria-pressed="' + (cur.kan === k) + '">' + n + '</button>').join("") + '</div>';
}
function blk(kan, title, inner){ return '<div class="blk" data-kan="' + kan + '"><span class="tag">' + esc(title) + '</span>' + inner + '</div>'; }

/* 本文：ア（知識及び技能）とイ（思考力、判断力、表現力等）に分ける */
function honbun(it, q){
  const a = [], b = [], c = [], other = []; let to = other;
  const num = it.lines.some(l => /^⑴/.test(l));
  for(const l of it.lines){
    if(num){ if(/^⑴/.test(l)) to = a; else if(/^⑵/.test(l)) to = b; else if(/^⑶/.test(l)) to = c; }
    else if(/^ア[\s　]/.test(l)) to = a; else if(/^イ[\s　]/.test(l)) to = b;
    to.push(l);
  }
  return '<div class="quote">' + (it.title ? '<p>' + esc(it.mark || '') + (it.mark ? '　' : '') + hl(it.title, q) + '</p>' : '') + paras(other, q) +
    (a.length ? blk("k", KAN.k, paras(a, q)) : '') + (b.length ? blk("s", KAN.s, paras(b, q)) : '') + (c.length ? blk("m", KAN.m, paras(c, q)) : '') + '</div>';
}
function itemSecs(it, q){
  const s = SUB[cur.subj], K = s.kaisetsu.items[it.id], src = s.kaisetsu.source;
  const has = it.lines.some(l => /^⑶/.test(l)) ? "k s m" : "k s";
  let h = '<section class="sec" data-has="' + has + '"><h3><span class="num">1</span>学習指導要領の本文</h3>' + honbun(it, q) +
    '<p class="src">出典：小学校学習指導要領（平成29年告示）' + esc(s.section) + '　第２ 各学年の目標及び内容' + gLabel(it.g) + '２ 内容</p></section>';
  if(K){
    const e = K.expl;
    h += '<section class="sec" data-has="' + (e.m && e.m.length ? 'k s m' : 'k s') + '"><h3><span class="num">2</span>解説の説明<span class="note">' + esc(K.name) + '（p.' + K.page + '〜）</span></h3>' +
      (e.intro.length ? '<div>' + paras(e.intro, q) + '</div>' : '') +
      (e.k.length ? blk("k", (e.m && e.m.length ? "(1) " : "ア ") + KAN.k, paras(e.k, q).replace(/<p class="i1">(ア|イ|ウ|エ|オ)[\s　]/g, '<p class="sub">$1 ')) : '') +
      (e.s.length ? blk("s", (e.m && e.m.length ? "(2) " : "イ ") + KAN.s, paras(e.s, q).replace(/<p class="i1">(ア|イ|ウ|エ|オ)[\s　]/g, '<p class="sub">$1 ')) : '') +
      (e.m && e.m.length ? blk("m", "(3) " + KAN.m, paras(e.m, q)) : '') +
      (!e.k.length && !e.s.length ? '<p class="note">この内容の解説は、「知識及び技能」「思考力、判断力、表現力等」に分けて書かれていません。上の説明に両方が含まれています。</p>' : '') +
      '<p class="src">出典：' + esc(src) + '　p.' + K.page + '〜</p></section>';
  }
  const bs = s.bandSecs && s.bandSecs[it.g[0]];
  if(bs){
    const key = (K && K.name || "").replace(/^保健：.*/, "保健");
    const rel = t => key && t.includes(key.slice(0, 4));
    h += '<section class="sec" data-has="k s m"><h3><span class="num">3</span>内容の取扱い<span class="note">' + gLabel((s.goals[it.g[0]] && s.goals[it.g[0]].grades) || it.g) + '全体（p.' + bs.page + '〜）</span></h3><div class="quote">' + bs.quote.map(t => '<p' + (rel(t) ? ' style="font-weight:700"' : '') + '>' + hl(t, q) + '</p>').join("") + '</div>' +
      '<h4 style="margin:10px 0 2px;font-size:14px">解説の説明</h4>' + bs.paras.map(t => '<p' + (rel(t) ? ' style="background:var(--soft);border-radius:4px"' : '') + '>' + hl(t, q) + '</p>').join("") +
      '<p class="note">この内容に関係するところを太字・色付きにしています。</p><p class="src">出典：' + esc(s.kaisetsu.source) + '　p.' + bs.page + '〜</p></section>';
  } else if(it.notes && it.notes.length){
    h += '<section class="sec" data-has="k s"><h3><span class="num">3</span>内容の取扱い</h3><div class="quote">' + paras(it.notes, q) + '</div>' +
      '<p class="note">内容の取扱いについての説明は、上の「解説の説明」の中にあります（「内容の取扱い」の（n）では…と書かれているところ）。</p></section>';
  }
  return h;
}
const gLabel = gs => gs.length > 1 ? '〔第' + "〇一二三四五六"[gs[0]] + '学年及び第' + "〇一二三四五六"[gs[gs.length - 1]] + '学年〕' : '〔第' + "〇一二三四五六"[gs[0]] + '学年〕';
function goalSec(g, q, n){
  const G = SUB[cur.subj].goals[g]; if(!G) return "";
  const L = G.lines, X = G.expl || {};
  const kanOf = i => ["k","s","m"][i] || "m";
  return '<section class="sec" data-has="k s m"><h3><span class="num">' + n + '</span>' + (G.band ? G.band : g + '年') + 'の目標</h3>' +
    '<div class="quote">' + L.map((l, i) => blk(kanOf(i), "（" + (i + 1) + "）" + KAN[kanOf(i)], '<p>' + hl(l.replace(/^[⑴⑵⑶]\s*/, ""), q) + '</p>')).join("") + '</div>' +
    '<h4 style="margin:12px 0 2px;font-size:14px">解説の説明（p.' + G.page + '〜）</h4>' + (X.intro && X.intro.length ? paras(X.intro, q) : '') +
    ["1","2","3"].map((k, i) => X[k] && X[k].length ? blk(kanOf(i), "（" + k + "）" + KAN[kanOf(i)], paras(X[k], q)) : '').join("") +
    '<p class="src">出典：小学校学習指導要領（平成29年告示）' + esc(SUB[cur.subj].section) + ' 第２ ' + gLabel(G.grades || [g]) + '１ 目標／' + esc(SUB[cur.subj].kaisetsu.source) + '　p.' + G.page + '〜</p></section>';
}
function renderResult(){
  const s = SUB[cur.subj], sel = cur.sel, q = cur.way === "word" ? cur.q : "";
  document.body.classList.remove("only-k", "only-s", "only-m");
  if(cur.kan !== "all") document.body.classList.add("only-" + cur.kan);
  if(!sel){ $("result").innerHTML = '<p class="empty">上で単元や内容を選んでください。</p>'; return; }
  let h = "";
  if(sel.t === "k"){
    const k = s.katsudo[sel.g];
    h = '<div class="meta"><span class="badge">' + sel.g + '年</span><span class="badge">' + esc(s.name) + '</span></div><h2>' + esc(s.katsudoName) + '</h2>' + kanBar() +
      '<section class="sec"><h3>本文と解説の説明（p.' + k.page + '〜）</h3>' + paras(k.paras, q) + '<p class="src">出典：' + esc(s.kaisetsu.source) + '　p.' + k.page + '〜</p></section>' + goalSec(sel.g, q, 2);
  } else if(sel.t === "g"){
    h = '<div class="meta"><span class="badge">' + esc(s.name) + '</span></div><h2>' + sel.g + '年の目標</h2>' + kanBar() + goalSec(sel.g, $("q").value.trim(), 1);
  } else {
    const its = sel.ids.map(id => s.items.find(i => i.id === id)).filter(Boolean);
    const it = its[Math.min(cur.part, its.length - 1)];
    const area = s.areas.find(a => a.key === it.area);
    h = '<div class="meta"><span class="badge">' + (it.g.length > 1 ? it.g[0] + '・' + it.g[it.g.length - 1] : it.g[0]) + '年</span><span class="badge">' + esc(s.name) + '</span><span class="badge">' + esc(area ? area.name : it.areaName) + '</span>' + (sel.t === "u" ? '<span class="badge">単元：' + esc(sel.name) + '（' + esc(sel.book) + '）</span>' : '') + '</div>';
    if(its.length > 1) h += '<p class="note" style="margin:4px 0 0">この単元には、学習指導要領の内容が ' + its.length + ' つ結び付いています。</p><div class="multi">' + its.map((x, i) => '<button type="button" data-part="' + i + '" aria-pressed="' + (x === it) + '">' + esc((x.mark ? x.mark + " " : "") + x.head) + '</button>').join("") + '</div>';
    h += '<h2>' + esc((it.mark ? it.mark + " " : "") + (s.kaisetsu.items[it.id] ? s.kaisetsu.items[it.id].name : it.head)) + '</h2>';
    if(it.units && it.units.length) h += '<div class="units">' + it.units.map(u => '<span class="unit">📖 ' + esc(u.u) + '（' + esc(u.b) + '）</span>').join("") + '</div>';
    h += kanBar() + itemSecs(it, q) + goalSec(it.g[0], q, (s.bandSecs && s.bandSecs[it.g[0]]) || (it.notes && it.notes.length) ? 4 : 3);
    if(s.katsudo && s.katsudo[it.g[0]]) h += '<details class="sec"><summary>' + esc(s.katsudoName) + '（' + it.g[0] + '年）の本文と解説</summary>' + paras(s.katsudo[it.g[0]].paras, q) + '<p class="src">出典：' + esc(s.kaisetsu.source) + '　p.' + s.katsudo[it.g[0]].page + '〜</p></details>';
  }
  $("result").innerHTML = h;
  $("result").querySelectorAll("[data-kan]").forEach(b => { if(b.tagName === "BUTTON") b.onclick = () => { cur.kan = b.dataset.kan; store.set("matome-kan", cur.kan); renderResult(); }; });
  $("result").querySelectorAll("[data-part]").forEach(b => b.onclick = () => { cur.part = +b.dataset.part; renderResult(); });
}

/* はじめ */
document.querySelectorAll("[data-way]").forEach(b => b.onclick = () => { cur.way = b.dataset.way; renderPicks(); if(cur.way === "word") $("q").focus(); });
$("subjSel").onchange = () => { cur.subj = $("subjSel").value; cur.sel = null; renderSubjects(); renderPicks(); renderResult(); };
let qt; $("q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(doSearch, 200); });
if(DATA.mapUrl){ $("toMap").hidden = false; $("toMap").href = DATA.mapUrl; }
if(DATA.edition){ document.querySelector(".brand h1").insertAdjacentHTML("beforeend", '<small class="ed">' + esc(DATA.edition) + '</small>'); }
$("foot").textContent = DATA.footer;
const hh = () => document.documentElement.style.setProperty("--hh", $("hdr").offsetHeight + "px"); hh(); addEventListener("resize", hh);
const k0 = store.get("matome-kan"); if(k0 && (k0 === "all" || KAN[k0])) cur.kan = k0;
(function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1)); if(!h) return;
  const [sid, t, a, b] = h.split(":"); if(!SUB[sid]) return; cur.subj = sid; const s = SUB[sid];
  if(t === "i"){ const it = s.items.find(i => i.id === a); if(it){ cur.way = "area"; cur.g = it.g[0]; cur.sel = {t:"i", g:it.g[0], ids:[a]}; } }
  if(t === "u"){ const u = s.units.find(x => x.g === +a && x.u === b); if(u){ cur.way = "unit"; cur.g = u.g; cur.sel = {t:"u", g:u.g, name:u.u, book:u.b, ids:u.ids}; } }
  if(t === "k"){ cur.way = "area"; cur.g = +a; cur.sel = {t:"k", g:+a, ids:[]}; }
})();
renderSubjects(); renderPicks(); renderResult();
</script>
</body></html>
