<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"></head><body><title>学習指導要領まとめツール 品川区版</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 紙の学習指導要領と解説を引く代わりの道具。上で選び、下に本文・解説・内容の取扱い・学年の目標を順に並べる */
:root{
  --bg:#f6f7f4; --panel:#ffffff; --ink:#1f2a2e; --ink2:#55626a; --line:#d9ded8; --accent:#2b5d8a; --mark:#ffe36b; --markInk:#1f2a2e;
  --soft:#eef3f8; --quote:#f4f6f1;
  --k:#2f7d5b; --kbg:#e6f4ec; --s:#2b5d8a; --sbg:#e5eef8; --m:#9a4f8c; --mbg:#f6e9f3;
  --font-display:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --font-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161b1d; --panel:#1f2629; --ink:#e7ecea; --ink2:#a3afb3; --line:#36403f; --accent:#8cbbe6; --mark:#d9b800; --markInk:#111;
  --soft:#22303a; --quote:#232b2d;
  --k:#7fd3a8; --kbg:#1d3a2c; --s:#8cbbe6; --sbg:#1d2f42; --m:#e0a6d4; --mbg:#3a2336; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161b1d; --panel:#1f2629; --ink:#e7ecea; --ink2:#a3afb3; --line:#36403f; --accent:#8cbbe6; --mark:#d9b800; --markInk:#111;
  --soft:#22303a; --quote:#232b2d;
  --k:#7fd3a8; --kbg:#1d3a2c; --s:#8cbbe6; --sbg:#1d2f42; --m:#e0a6d4; --mbg:#3a2336; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.75}
button,input,select{font:inherit; color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1080px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line)}
.topin{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 16px; padding-block:10px}
.brand{display:flex; align-items:center; gap:10px}
.brand h1{font-family:var(--font-display); font-size:20px; margin:0; letter-spacing:.03em}
.brand h1 .ed{font-size:.62em; margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--accent); color:var(--panel); vertical-align:2px}
.logo{width:26px; height:26px; flex:none}
.tomap{font-size:13px; white-space:nowrap}
main{padding-block:16px 40px}
.lead{color:var(--ink2); margin:0 0 12px; max-width:62em}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:6px 0}
.lbl{font-size:13px; color:var(--ink2); min-width:4.5em}
.seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{border:0; background:var(--panel); padding:7px 14px; cursor:pointer; min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--panel); font-weight:700}
.gbtn{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; cursor:pointer; min-height:40px; min-width:52px}
.gbtn[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink); font-weight:700}
select{border:1px solid var(--line); border-radius:8px; padding:7px 10px; background:var(--panel); min-height:40px}
.picks{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; margin-top:8px}
.pick{display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:8px 11px; cursor:pointer; line-height:1.45; min-height:44px}
.pick:hover{border-color:var(--accent)}
.pick[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); background:var(--soft)}
.pick small{display:block; color:var(--ink2); font-size:12px}
.areaH{font-size:13px; font-weight:700; color:var(--ink2); margin:12px 0 2px}
.search{display:flex; gap:8px}
.search input{flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 12px; background:var(--panel); min-height:44px; font-size:16px}
.hits{margin-top:8px}
.hit{display:block; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:none; padding:8px 4px; cursor:pointer}
.hit b{font-size:14px}
.hit p{margin:2px 0 0; font-size:13px; color:var(--ink2)}
mark{background:var(--mark); color:var(--markInk); border-radius:2px; padding:0 1px}
.note{font-size:13px; color:var(--ink2)}

/* 結果 */
#result h2{font-family:var(--font-display); font-size:22px; margin:2px 0 4px; line-height:1.4}
.meta{display:flex; flex-wrap:wrap; gap:6px; font-size:13px; margin-bottom:6px}
.badge{border:1px solid var(--line); border-radius:999px; padding:1px 10px; background:var(--panel)}
.units{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px}
.unit{font-size:13px; background:var(--soft); border-radius:6px; padding:2px 8px}
.kanbar{position:sticky; top:var(--hh,58px); z-index:10; background:var(--bg); padding:8px 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.kanbar button{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; cursor:pointer; min-height:40px}
.kanbar button[aria-pressed="true"]{color:var(--panel); font-weight:700; border-color:transparent; background:var(--ink)}
.kanbar button[data-kan="k"][aria-pressed="true"]{background:var(--k)}
.kanbar button[data-kan="s"][aria-pressed="true"]{background:var(--s)}
.kanbar button[data-kan="m"][aria-pressed="true"]{background:var(--m)}
.multi{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px}
.multi button{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:13px}
.multi button[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
.sec{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin:10px 0}
.sec > h3{margin:0 0 6px; font-size:16px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px}
.sec > h3 .num{font-family:var(--font-display); color:var(--accent)}
.src{font-size:12px; color:var(--ink2); margin:6px 0 0}
.blk{border-left:4px solid var(--line); padding:4px 10px; margin:8px 0; border-radius:0 8px 8px 0}
.blk[data-kan="k"]{border-color:var(--k); background:var(--kbg)}
.blk[data-kan="s"]{border-color:var(--s); background:var(--sbg)}
.blk[data-kan="m"]{border-color:var(--m); background:var(--mbg)}
.blk .tag{display:inline-block; font-size:12px; font-weight:700; margin-bottom:2px}
.blk[data-kan="k"] .tag{color:var(--k)} .blk[data-kan="s"] .tag{color:var(--s)} .blk[data-kan="m"] .tag{color:var(--m)}
.quote{background:var(--quote); border-radius:8px; padding:6px 12px}
.blk p,.quote p,.sec p{margin:4px 0}
p.sub{font-weight:700; margin-top:10px}
p.i1{padding-left:1em; text-indent:-1em}
p.i2{padding-left:2em; text-indent:-1em}
details.sec > summary{cursor:pointer; font-weight:700}
body.only-k .blk:not([data-kan="k"]), body.only-s .blk:not([data-kan="s"]), body.only-m .blk:not([data-kan="m"]){display:none}
body.only-k .sec[data-has]:not([data-has~="k"]), body.only-s .sec[data-has]:not([data-has~="s"]), body.only-m .sec[data-has]:not([data-has~="m"]){display:none}
.empty{color:var(--ink2); font-size:14px; padding:6px 0}
footer{color:var(--ink2); font-size:12px; text-align:center; padding:20px 16px 30px}
@media (max-width:640px){
  .brand h1{font-size:17px}
  #result h2{font-size:19px}
  .sec{padding:10px 12px}
  .picks{grid-template-columns:1fr}
}
</style>

<header class="top" id="hdr"><div class="wrap topin">
  <div class="brand">
    <svg class="logo" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="3" width="17" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9h9M7 13h9M7 17h6" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="18" r="4" fill="none" stroke="#2b5d8a" stroke-width="2.2"/><path d="M22 21l2.5 2.5" stroke="#2b5d8a" stroke-width="2.4" stroke-linecap="round"/></svg>
    <h1>学習指導要領まとめツール</h1>
  </div>
  <a class="tomap" id="toMap" href="#" hidden>学びのつながりマップへ →</a>
</div></header>

<main class="wrap">
  <p class="lead">教科書の単元、学習指導要領の区分、または言葉から選ぶと、学習指導要領の本文、解説のその内容の説明、内容の取扱い、学年の目標をまとめて読めます。「知識及び技能」などのボタンで、その観点の部分だけにしぼれます。</p>

  <div class="panel">
    <div class="row"><span class="lbl">教科</span><select id="subjSel" aria-label="教科"></select><span class="note" id="subjNote"></span></div>
    <div class="row"><span class="lbl">さがし方</span>
      <div class="seg" role="group" aria-label="さがし方">
        <button type="button" data-way="unit" aria-pressed="true">単元から</button>
        <button type="button" data-way="area" aria-pressed="false">区分から</button>
        <button type="button" data-way="word" aria-pressed="false">言葉で検索</button>
      </div>
    </div>
    <div class="row" id="gradeRow"><span class="lbl">学年</span><div class="row" id="grades" style="margin:0"></div></div>
    <div id="pickUnit"></div>
    <div id="pickArea" hidden></div>
    <div id="pickWord" hidden>
      <div class="search"><input id="q" type="search" placeholder="例：概数、単位量あたり、筆算" aria-label="さがす言葉" autocomplete="off"></div>
      <div class="hits" id="hits"></div>
    </div>
  </div>

  <section id="result" aria-live="polite"><p class="empty">上で単元や内容を選んでください。</p></section>
</main>
<footer id="foot"></footer>

<script>
const DATA = {"subjects":[{"id":"sansu","name":"算数","section":"第２章 第３節 算数","textbook":"学校図書","grades":[1,2,3,4,5,6],"areas":[{"key":"A","name":"Ａ 数と計算","grades":[1,2,3,4,5,6]},{"key":"B","name":"Ｂ 図形","grades":[1,2,3,4,5,6]},{"key":"C","name":"Ｃ 測定","grades":[1,2,3]},{"key":"C2","name":"Ｃ 変化と関係","grades":[4,5,6]},{"key":"D","name":"Ｄ データの活用","grades":[1,2,3,4,5,6]}],"goals":{"1":{"lines":["⑴　数の概念とその表し方及び計算の意味を理解し，量，図形及び数量の関係についての理解の基礎となる経験を重ね，数量や図形についての感覚を豊かにするとともに，加法及び減法の計算をしたり，形を構成したり，身の回りにある量の大きさを比べたり，簡単な絵や図などに表したりすることなどについての技能を身に付けるようにする。","⑵　ものの数に着目し，具体物や図などを用いて数の数え方や計算の仕方を考える力，ものの形に着目して特徴を捉えたり，具体的な操作を通して形の構成について考えたりする力，身の回りにあるものの特徴を量に着目して捉え，量の大きさの比べ方を考える力，データの個数に着目して身の回りの事象の特徴を捉える力などを養う。","⑶　数量や図形に親しみ，算数で学んだことのよさや楽しさを感じながら学ぶ態度を養う。"],"page":76,"expl":{"intro":["第１学年では，算数の学習を始めるに当たって必要となる資質・能力の育成を図る。"],"1":["（1）では，第１学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，算数科で学習する内容の基礎となる概念や性質の理解の基礎となる経験を繰り返すことや，算数を豊かに学び続ける上で必要となる感覚の育成が重要である。例えば数の表し方の学習では，具体物などを用いることを通して，数の大きさや数のまとまりに着目してその意味や表し方についての経験を積む。この経験が，その後の数の仕組みを学ぶ素地としての見方を育むことになる。","また，「技能」に関しては，算数の学習を進めていく上で必要な数学的な処理や表現の基礎となる技能を習得する。例えば，繰り上がりのある加法の計算の仕方を具体物を操作することと関連させながら確実に身に付けるとともに，それを繰り下がりのある減法の計算の仕方の学習においても生かすことができるようにし，これ以降の算数の学習に活用することができる技能の基礎を確実に習得することが大切である。"],"2":["（2）では，第１学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，ものの数に着目し，具体物や図などを用いて数の数え方や計算の仕方を考える力を養う。数のまとまりや数量の関係に着目して，ブロックや数え棒といった具体物や図などを使って数の数え方や計算の仕方を考えたり，その過程を表現したりすることを重視するとともにそれらを日常生活に生かすことを重視する。","「Ｂ図形」では，ものの形に着目して特徴を捉えたり，具体的な操作を通して形の構成について考えたりする力を養う。身の回りにある様々なものの形に着目してその特徴に関心をもつとともに，空き箱や色板，折り紙などの具体物を使って形を組み合わせたり分解したり，動かして形を変形させてみたりなどの操作を通して形の構成について考えることを重視する。","「Ｃ測定」では，身の回りにあるものの特徴を量に着目して捉え，量の大きさを比べる方法を考える力を養う。長さ，広さ，かさなどの量から身の回りの事象の特徴を捉え，具体的な操作を通して量の大きさの比べ方を見いだす。また，時刻と日常生活を結び付けるなど，時刻の読み方を日常生活の中で生かすことを重視する。「Ｄデータの活用」では，データの個数に着目して身の回りの事象の特徴を捉える力を養う。身の回りにあるデータに関心をもって，事象の特徴を，データの個数に着目し，大小や順番から捉えることができるようにする。"],"3":["（3）では，学びに向かう力，人間性等の目標を示した。","第１学年では，数量や図形に親しみをもち，それらに対する感覚を豊かにするとともに，算数を学ぶことのよさや楽しさを感じながら学ぼうとする態度を養う。第１学年では算数の学習との出合いを大切にして，具体物を用いた活動などを有効に活用して，算数に主体的に関わって親しむことを重視する。この活動を基盤として算数を学ぶことが楽しいことを実感し，主体的に算数を学ぶことができるようにする。","なお，幼児期の教育において，遊びや生活の中で，一人一人の幼児がその幼児なりに必要感をもって，数量などへの関心をもち感覚が磨かれるような体験をしていることなどを踏まえ，指導の工夫を行うことが大切である。"]}},"2":{"lines":["⑴　数の概念についての理解を深め，計算の意味と性質，基本的な図形の概念，量の概念，簡単な表とグラフなどについて理解し，数量や図形についての感覚を豊かにするとともに，加法，減法及び乗法の計算をしたり，図形を構成したり，長さやかさなどを測定したり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や数量の関係に着目し，必要に応じて具体物や図などを用いて数の表し方や計算の仕方などを考察する力，平面図形の特徴を図形を構成する要素に着目して捉えたり，身の回りの事象を図形の性質から考察したりする力，身の回りにあるものの特徴を量に着目して捉え，量の単位を用いて的確に表現する力，身の回りの事象をデータの特徴に着目して捉え，簡潔に表現したり考察したりする力などを養う。","⑶　数量や図形に進んで関わり，数学的に表現・処理したことを振り返り，数理的な処理のよさに気付き生活や学習に活用しようとする態度を養う。"],"page":102,"expl":{"intro":["第２学年では，第１学年の学習を踏まえて，引き続き具体物などを用いることを通して算数の学習に関心をもち，基礎的・基本的な概念や性質などを理解するとともに，日常の事象や算数の学習場面を，数学的に表現したり処理したりすることを重視する。"],"1":["（1）では，第２学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，第１学年での学習内容を基に基本的な数量や図形の概念や意味，性質を確実に理解することや数量や図形の感覚をより豊かにすることが重要になる。例えば，乗法九九の構成の学習では，具体物や九九表などを用いることを通して，数のまとまりや数量の関係に着目して乗法に関して成り立つ簡単な性質について理解できるようにするとともに数についての感覚を豊かにする。","また「技能」に関しては，第１学年の学習を踏まえて，数学的な処理や表現の基礎となる技能の習得が必要である。例えば，長さを測定する際におよその長さの見当をつけるとともにそれを表現するのに適切な単位を選択することができるようにするが，その手続きを，かさの測定においても用いることができるようにするなど，他の学習場面にも活用することができるようにすることが大切である。"],"2":["（2）では，第２学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や数量の関係に着目し，必要に応じて具体物や図などを用いて数の表し方や計算の仕方などを考察する力を養う。具体物などを用いることを通して，身の回りの数への関心を高め，数についての感覚を豊かにするとともに数の大きさや仕組みに着目して表し方を考える。また加法及び減法の可能性や相互関係に着目して計算の仕方を考えたり，乗法の計算の仕方を考えたり，それらを日常生活に生かしたりすることができるようにする。さらに，具体物などを用いることを通して，数量やその関係に着目して，言葉，数，式，図などに表したり読み取ったり，それらを日常生活に生かせるようにする。","「Ｂ図形」では，平面図形の特徴を図形を構成する要素に着目して捉えたり，身の回りの事象を図形の性質から考察したりする力を養う。この学年から身の回りの事象を図形として捉え，図形の特徴を図形を構成する要素に着目して捉えたり図形の性質から考察したりすることを重視する。第１学年同様に，空き箱や色板，折り紙などの具体物を使って形を組み合わせたり分解したり，動かして形を変形させてみたりするなどの操作を大切にするが，図形を構成する要素に関心をもったりその性質を考えたりすることを重視する。","「Ｃ測定」では，身の回りにあるものの特徴を量に着目して捉え，量の単位を用いて的確に表現する力を養う。長さ，かさの量から身の回りの事象の特徴に着目し，実験・実測を通して目的に応じた普遍単位を用いることで量を的確に表現したり比べたりすることを重視する。また，時間の単位に着目して，時刻や時間を日常生活の中で生かせるようにする。","「Ｄデータの活用」では，「身の回りの事象をデータの特徴に着目して捉え，簡潔に表現したり考察したりする力」を養う。身の回りの事象をデータを整理する観点に着目し，その事象の特徴を簡単な表やグラフに表して考察することができるようにする。","なお，児童の発達の段階を考慮して，この「（2）思考力・判断力・表現力等」の目標については，次の第３学年でも基本的に同様の内容とする。"],"3":["（3）では，学びに向かう力，人間性等の目標を示した。","第２学年では，数量や図形に進んで関わり，数学的に表現・処理したことを振り返り，数理的な処理のよさに気付き生活や学習に活用する態度を養う。第１学年での算数の学習で経験したことを踏まえて，第２学年では，算数の学習で表現・処理したことへの振り返りや数理的処理のよさに気付くこと，さらにはそれらを生活や学習へ活用することが期待されている。算数を学ぶことの価値を実感し，それが新たに主体的に算数に関わる態度を育むことにつながる。","なお，児童の発達の段階を考慮して，この「（3）学びに向かう力，人間性等」の目標については，次の第３学年でも同様の内容とする。"]}},"3":{"lines":["⑴　数の表し方，整数の計算の意味と性質，小数及び分数の意味と表し方，基本的な図形の概念，量の概念，棒グラフなどについて理解し，数量や図形についての感覚を豊かにするとともに，整数などの計算をしたり，図形を構成したり，長さや重さなどを測定したり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や数量の関係に着目し，必要に応じて具体物や図などを用いて数の表し方や計算の仕方などを考察する力，平面図形の特徴を図形を構成する要素に着目して捉えたり，身の回りの事象を図形の性質から考察したりする力，身の回りにあるものの特徴を量に着目して捉え，量の単位を用いて的確に表現する力，身の回りの事象をデータの特徴に着目して捉え，簡潔に表現したり適切に判断したりする力などを養う。","⑶　数量や図形に進んで関わり，数学的に表現・処理したことを振り返り，数理的な処理のよさに気付き生活や学習に活用しようとする態度を養う。"],"page":134,"expl":{"intro":["第３学年では，第２学年の学習を踏まえて，算数の学習に関心をもち，基礎的・基本的な概念及び意味や性質などを理解するとともに，日常の事象や算数の学習場面を，数学的に表現したり処理したりすることを重視する。"],"1":["（1）では，第３学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，第２学年での学習内容を踏まえて，基本的な数量や図形の概念及び意味，性質を確実に理解することや数量や図形の感覚をより豊かにすることが重要になる。例えば，三角形の学習では，二等辺三角形や正三角形の観察や操作活動などを通して，図形を構成する要素である辺の長さに着目して図形の概念や性質について理解できるようにするとともに図形の感覚を豊かにする。","また，「技能」に関しては，第２学年の学習を踏まえて，数理的な処理や表現の基礎となる技能のより確かな習得が必要である。例えば，乗法の学習では，数の仕組みや乗法九九および乗法の性質に着目して２位数や３位数に１位数や２位数をかける乗法の計算の仕方について身に付けるようにする。既習の知識及び技能と結び付けながら新しい学習にも生かせる技能となるように指導することが大切である。（2）では，第３学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や数量の関係に着目し，必要に応じて具体物や図などを用いて数の表し方や計算の仕方などを考察する力を養う。身の回りの数や数量の関係への関心を高め，数についての感覚を一層豊かにするとともに数の大きさや構造に着目して表し方を考え，日常生活に生かせるようにする。また，数量の関係に着目し，加法及び減法，乗法及び除法の計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，計算に関して成り立つ性質を活用し計算の工夫やその確かめができるようにする。さらに，数量の関係に着目して，数量の関係を図や式を用いて簡潔に表したり式と図を関連付けて式を読んだり，それらを日常生活に生かすことができるようにする。","「Ｂ図形」では，平面図形の特徴を図形を構成する要素に着目して捉えたり，身の回りの事象を図形の性質から考察したりする力を養う。身の回りの事象を図形として捉え，図形の特徴を図形を構成する要素に着目して捉えたり図形の性質から考察したりすることを重視する。具体物を操作しながら形を構成したり分解したりして，図形を構成する要素に着目しながらその性質を見いだしたり，それを日常の事象の考察に生かしたりすることを重視する。","「Ｃ測定」では，身の回りにあるものの特徴を量に着目して捉え，量の単位を用いて的確に表現する力を養う。長さ，重さの量から身の回りの事象の特徴に着目し，実験・実測などを通して目的に応じた普遍単位を用いることで量を的確に表現したり単位を統合的に捉えたりすることを重視する。また，時間の単位に着目して，時刻や時間の求め方について考察し，それを日常生活で生かせるようにする。","「Ｄデータの活用」では，身の回りの事象をデータの特徴に着目して捉え，簡潔に表現したり適切に判断したりする力を養う。身の回りの事象のデータを整理する観点に着目し，その事象の特徴を簡単な表や棒グラフに表すとともにそれを基に適切な判断ができるようにする。"],"2":[],"3":["（3）では，学びに向かう力，人間性等の目標を示した。数量や図形に進んで関わり，数学的に表現・処理したことを振り返り，数理的な処理のよさに気付き生活や学習に活用する態度を養う。第２学年までの算数の学習での経験を踏まえて，第３学年でも算数の学習で表現・処理したことを振り返ることや数理的処理のよさに気付くこと，さらにはそれらを生活や学習へ活用することが期待されている。算数を学ぶことの価値を実感し，それが新たに主体的に算数に関わる態度を育むことにつながる。"]}},"4":{"lines":["⑴　小数及び分数の意味と表し方，四則の関係，平面図形と立体図形，面積，角の大きさ，折れ線グラフなどについて理解するとともに，整数，小数及び分数の計算をしたり，図形を構成したり，図形の面積や角の大きさを求めたり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や数量の関係に着目し，目的に合った表現方法を用いて計算の仕方などを考察する力，図形を構成する要素及びそれらの位置関係に着目し，図形の性質や図形の計量について考察する力，伴って変わる二つの数量やそれらの関係に着目し，変化や対応の特徴を見いだして，二つの数量の関係を表や式を用いて考察する力，目的に応じてデータを収集し，データの特徴や傾向に着目して表やグラフに的確に表現し，それらを用いて問題解決したり，解決の過程や結果を多面的に捉え考察したりする力などを養う。","⑶　数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用しようとする態度を養う。"],"page":179,"expl":{"intro":["第４学年では，それまでの下学年の学習で身に付けた基礎的・基本的な概念及び意味や性質などを生かしながら日常の事象や算数の学習場面から見いだした問題の解決に取り組み，数学的に表現・処理したことを振り返りよりよいものを求めて粘り強く考えていくことを重視する。"],"1":["（1）では，第４学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，第３学年の学習を踏まえて，基本的な数量や図形の概念及び意味，性質や数量関係，表やグラフなどの意味の確実な理解が重要になる。例えば，折れ線グラフの学習では，変化の視点からデータの特徴に着目し，それを適切に表現するグラフとしての意味を理解する。","また，「技能」に関しては，第３学年の学習を踏まえて，適切に数理的な処理や表現ができるように技能の確かな習得が必要である。例えば，小数の学習では，小数が整数と同じ仕組みで構成されていることを基にして，乗数や除数が整数である場合の小数の乗法及び除法の計算の仕方について身に付けるようにする。既習の知識及び技能と結び付けながら新しい方法を見いだしていく技能となるように指導することが大切である。"],"2":["（2）では，第４学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や数量の関係に着目し，目的に合った表現方法を用いて計算の仕方などを考察する力を養う。数やその表現の仕方及び数量の関係に着目するとともに数の表現方法を統合的に捉えたり目的に合わせて考察したり，それらを日常生活に生かせるようにしたりする。数量の関係に着目して，除法の計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，計算に関して成り立つ性質を活用した計算の工夫やその確かめができるようにする。また，数の仕組みや構成する単位に着目して，小数や分数の計算の仕方を考えることができるようにする。さらに，数量の関係に着目して，簡潔で一般的に表現したり，式の意味を読み取ったりすることができるようにする。","「Ｂ図形」では，図形を構成する要素及びそれらの位置関係に着目し，図形の性質や図形の計量について考察する力を養う。平面図形及び立体図形を平行・垂直などの図形を構成する要素に着目しながら，図形の性質や位置の表現方法を見いだしたり，それを基に既習の基本図形を捉えなおしたり日常の事象の考察に生かしたりすることを重視する。また，図形の計量の視点から量の単位や図形を構成する要素に着目し，図形の面積の求め方や既習の単位との関係，角の大きさの表現の仕方について考察できるようにする。","「Ｃ変化と関係」では，変化や対応の特徴を見いだして，二つの数量の関係を表や式を用いて考察する力を養う。下学年での数量の関係の学習を踏まえて，日常の事象における数量の関係に着目し，図や表，式などを用いて，変化や対応の関係やある二つの数量の関係と別の二つの数量の関係との比べ方を考察するとともに，その結果を日常生活で生かせるようにする。","「Ｄデータの活用」では，目的に応じてデータを収集し，表やグラフに的確に表現し，それらを用いて問題解決したり，解決の過程や結果を多面的に捉え考察したりする力を養う。第３学年までの学習に加えて，身の回りの事象から目的に応じたデータの収集，表や折れ線グラフを用いた問題解決及び解決過程や結果の多面的な考察を重視することが加わった。統計の問題解決の過程を重視しながら，データの特徴や傾向に着目し，解決に適した表やグラフを選択して結論を考察することを重視する。","なお，児童の発達の段階を考慮して，「（2）思考力，判断力，表現力等」の目標については次の第５学年でも基本的に同様の内容とする。"],"3":["（3）では，学びに向かう力，人間性等の目標を示した。第４学年では，数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用する態度を養う。これまでの算数の学習での経験を踏まえて，数学的に表現・処理したことへの振り返りに加えて，結果を多面的に捉えて検討し，それをよりよいものにするために粘り強く考えていくことが重視され，さらに，それらを生活や学習へ活用することが期待されている。算数に主体的に関わりよりよいものを創り上げていくという立場から，問題解決の結果を常に評価・改善し続けていく姿勢が期待されている。なお，児童の発達の段階を考慮して，「（3）学びに向かう力，人間性等」の目標については第５学年，第６学年でも同様の内容とする。"]}},"5":{"lines":["⑴　整数の性質，分数の意味，小数と分数の計算の意味，面積の公式，図形の意味と性質，図形の体積，速さ，割合，帯グラフなどについて理解するとともに，小数や分数の計算をしたり，図形の性質を調べたり，図形の面積や体積を求めたり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や計算の意味に着目し，目的に合った表現方法を用いて数の性質や計算の仕方などを考察する力，図形を構成する要素や図形間の関係などに着目し，図形の性質や図形の計量について考察する力，伴って変わる二つの数量やそれらの関係に着目し，変化や対応の特徴を見いだして，二つの数量の関係を表や式を用いて考察する力，目的に応じてデータを収集し，データの特徴や傾向に着目して表やグラフに的確に表現し，それらを用いて問題解決したり，解決の過程や結果を多面的に捉え考察したりする力などを養う。","⑶　数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用しようとする態度を養う。"],"page":232,"expl":{"intro":["第４学年に引き続き，第５学年の学習でも基礎的・基本的な概念及び意味や性質などを生かしながら日常の事象や算数の学習場面から見いだした問題の解決に取り組み，数学的に表現・処理したことを振り返りよりよいものを求めて粘り強く考えていくことを重視する。"],"1":["（1）では，第５学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，基本的な数量や図形の概念及び意味，性質や数量関係，表やグラフなどの意味の確実な理解が重要になる。例えば，小数の乗法及び除法の学習では，乗法及び除法の意味に着目し，乗数や除数が小数である場合まで数の範囲を広げて乗法及び除法の意味を理解する。数の範囲を広げることで計算の意味の拡張が行われ，知識の捉え直しが行われることになる。","また，「技能」に関しては，第４学年の学習に引き続き，適切に数理的な処理や表現ができるように技能の確かな習得が必要である。例えば，小数の乗法及び除法の学習では，小数の乗法及び除法についても整数の場合と同じ関係や法則が成り立つことを生かしながら，小数の乗法及び除法の計算ができるようにする。発展的な場面においても活用可能な技能になるように指導することが大切である。","（2）においても，第５学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や数量の関係に着目し，目的に合った表現方法を用いて数の性質や計算の仕方などを考察する力を養う。数やその表現の仕方及び数量の関係に着目するとともに数の表現方法を統合的に捉えたり目的に合わせて考察したり，それらを日常生活に生かせるようにしたりする。数の仕組みや構成する単位に着目して，分数の意味の解釈や大きさの表現の仕方を考えることができるようにする。また，数量の関係に着目して，小数の乗法及び除法の計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，計算に関して成り立つ性質を活用した計算の工夫やその確かめができるようにする。さらに，二つの数量の対応や変化に着目し，式で表されている関係について考察できるようにする。「Ｂ図形」では，図形の性質や図形の計量について考察する力を養う。平面図形を合同の視点から，図形を構成する要素や図形間の関係に着目しながら，図形の構成の仕方やその性質を見いだし論理的に説明したり，それを基に既習の基本図形を捉え直したり日常の事象の考察に生かしたりすることを重視する。また，図形の計量の視点から量の単位や図形を構成する要素に着目し，図形の面積や体積の求め方や既習の単位との関係について考察できるようにする。","「Ｃ変化と関係」では，伴って変わる二つの数量やそれらの関係に着目し変化や対応の特徴を見いだして二つの数量の関係を表や式を用いて考察する力を養う。これまでの数量の関係の学習を踏まえて，日常の事象における伴って変わる二つの数量及びそれらの関係に着目し，図や表，式などを用いて，簡単な比例における変化や対応の考察や割合や単位量当たりの大きさにおける目的に応じた大小の比較及び表現をするとともに，それらを日常生活で生かせるようにする。","「Ｄデータの活用」では，目的に応じてデータを収集し，表やグラフに的確に表現し，それらを用いて問題解決したり，解決の過程や結果を多面的に捉え考察したりする力を養う。第４学年の学習に引き続いて，身の回りの事象から目的に応じたデータの収集，表や帯グラフや円グラフなどへの適切な表現，それを用いた問題解決及び解決過程や結果の多面的な考察を重視する。統計の問題解決の過程を重視しながら，データの特徴や傾向に着目し，解決に適した表やグラフを選択して結論を考察することを重視する。また，事象を概括的に捉え，平均を使って考察することやそれを学習や生活に生かせるようにする。"],"2":[],"3":["（3）では，学びに向かう力，人間性等の目標を示した。第５学年では，数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用する態度を養う。これまでの算数の学習での経験を踏まえて，数学的に表現・処理したことへの振り返りに加えて，結果を多面的に捉えて検討し，それをよりよいものにするために粘り強く考えていくことが重視され，さらに，それらを生活や学習へ活用することが期待されている。算数に主体的に関わりよりよいものを創り上げていくという立場から，問題解決の結果を常に評価・改善し続けていく姿勢が期待されている。"]}},"6":{"lines":["⑴　分数の計算の意味，文字を用いた式，図形の意味，図形の体積，比例，度数分布を表す表などについて理解するとともに，分数の計算をしたり，図形を構成したり，図形の面積や体積を求めたり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や計算の意味に着目し，発展的に考察して問題を見いだすとともに，目的に応じて多様な表現方法を用いながら数の表し方や計算の仕方などを考察する力，図形を構成する要素や図形間の関係などに着目し，図形の性質や図形の計量について考察する力，伴って変わる二つの数量やそれらの関係に着目し，変化や対応の特徴を見いだして，二つの数量の関係を表や式，グラフを用いて考察する力，身の回りの事象から設定した問題について，目的に応じてデータを収集し，データの特徴や傾向に着目して適切な手法を選択して分析を行い，それらを用いて問題解決したり，解決の過程や結果を批判的に考察したりする力などを養う。","⑶　数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用しようとする態度を養う。"],"page":284,"expl":{"intro":["小学校修了時において算数の学習で身に付ける資質・能力である。基礎的・基本的な概念及び意味や性質などを生かしながら日常の事象や算数の学習場面から見いだした問題の解決に取り組み，常によりよいものを求めて粘り強く考えていくとともに，数学的に表現・処理したことを振り返り，そのよさに気付き学習したことを活用していくことを重視する。"],"1":["（1）では，第６学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，基本的な数量や図形の概念及び意味，性質や数量関係，表やグラフなどの意味の確実な理解が重要になる。例えば，分数の乗法や除法の学習では，乗法及び除法の意味に着目し，第５学年に引き続き乗数や除数が分数である場合まで数の範囲を広げて乗法及び除法の意味を理解する。数の範囲を広げることで計算の意味の拡張が行われ，ここでも知識の捉え直しが行われることになる。また，「技能」に関しては，小学校での算数の学習で身に付けた技能を生かしながら，適切な数理的な処理や表現ができるようにすることが必要である。例えば，分数の乗法及び除法の学習では，分数の乗法及び除法についても整数の場合と同じ関係や法則が成り立つことを生かしながら，分数の乗法及び除法の計算ができるようにする。ここでも第５学年に引き続き発展的な場面においても活用可能な技能になるように指導することが大切である。","（2）においても，第６学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や計算の意味に着目し，発展的に考察して問題を見いだすとともに，目的に応じて多様な表現方法を用いながら数の表し方や計算の仕方などを考察する力を養う。数やその表現の仕方及び数量の関係に着目するとともに数の表現方法を目的に合わせて考察したり，それらを日常生活に生かせるようにしたりする。また，数量の関係に着目して，分数の乗法及び除法の計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，計算に関して成り立つ性質を活用した計算の工夫やその確かめができるようにする。さらに，数量の関係を簡潔かつ一般的に表現したり，式の意味を読み取ったりすることができるようにする。","「Ｂ図形」では，図形を構成する要素や図形間の関係などに着目し，図形の性質や図形の計量について考察する力を養う。平面図形を対称の視点から，図形を構成する要素や図形間の関係に着目しながら，図形の構成の仕方やその性質を見いだし説明したり，それを基に既習の基本図形を捉えなおしたり日常の事象の考察に生かしたりすることを重視する。また，図形の計量の視点から量の単位や図形を構成する要素に着目し，図形や概形の面積や体積の求め方について論理的に考察できるようにする。","「Ｃ変化と関係」では，変化や対応の特徴を見いだして，二つの数量の関係を表や式，グラフを用いて考察する力を養う。これまでの数量の関係の学習を踏まえて，日常の事象における伴って変わる二つの数量及びそれらの関係に着目し，図，表，グラフ，式などを用いて，比例や反比例における変化及び対応や比における数量の関係の比べ方を考察するとともに，その結果を日常生活で生かせるようにする。「Ｄデータの活用」では，身の回りの事象から設定した問題について，目的に応じてデータを収集し，データの特徴や傾向に着目して適切な手法を選択して分析を行い，それらを用いて問題解決したり，解決の過程や結果を批判的に考察したりする力を養う。これまでの学習で学んだ統計の問題解決過程を生かして，身の回りの事象から目的に応じたデータの収集，表や柱状グラフなどの選択と表現，それを用いた問題解決及び解決過程や結果の批判的な考察を重視する。統計の問題解決の過程を重視しながら，データの特徴や傾向に着目し，目的に応じて代表値などを活用して結論の判断をすることを重視する。また，事象の特徴に着目し，順序よく整理する観点を決めて，落ちや重なりなく調べる方法を考察することができるようにする。"],"2":[],"3":["（3）では，学びに向かう力，人間性等の目標を示した。第６学年では，数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用する態度を養う。これまでの算数の学習での経験を踏まえ小学校修了時に身に付ける態度などとして，数学的に表現・処理したことを振り返るとともに，問題解決の結果を多面的に捉えて検討し，それをよりよいものにするために粘り強く考えていくことを重視し，さらに，それらを生活や学習へ活用することを期待している。算数に主体的に関わりよりよいものを創り上げていくという立場から，問題解決の結果を常に評価・改善し続けていく姿勢を中学校につなげていく。"]}}},"units":[{"g":1,"u":"１０までの かず","b":"1年上","ids":["sansu-1-A-1"]},{"g":1,"u":"いくつと いくつ","b":"1年上","ids":["sansu-1-A-1"]},{"g":1,"u":"なんばんめかな","b":"1年上","ids":["sansu-1-A-1","sansu-1-B-1"]},{"g":1,"u":"あわせて いくつ ふえると いくつ","b":"1年上","ids":["sansu-1-A-2"]},{"g":1,"u":"のこりは いくつ ちがいは いくつ","b":"1年上","ids":["sansu-1-A-2"]},{"g":1,"u":"いくつ あるかな","b":"1年上","ids":["sansu-1-D-1"]},{"g":1,"u":"１０より おおきい かずを かぞえよう","b":"1年上","ids":["sansu-1-A-1"]},{"g":1,"u":"なんじ なんじはん","b":"1年上","ids":["sansu-1-C-2"]},{"g":1,"u":"かたちあそび","b":"1年下","ids":["sansu-1-B-1"]},{"g":1,"u":"たしたり ひいたり してみよう","b":"1年下","ids":["sansu-1-A-2"]},{"g":1,"u":"たしざん","b":"1年下","ids":["sansu-1-A-2"]},{"g":1,"u":"ひきざん","b":"1年下","ids":["sansu-1-A-2"]},{"g":1,"u":"くらべてみよう","b":"1年下","ids":["sansu-1-C-1"]},{"g":1,"u":"かたちを つくろう","b":"1年下","ids":["sansu-1-B-1"]},{"g":1,"u":"大きい かずを かぞえよう","b":"1年下","ids":["sansu-1-A-1","sansu-1-A-2"]},{"g":1,"u":"なんじなんぷん","b":"1年下","ids":["sansu-1-C-2"]},{"g":1,"u":"たすのかな ひくのかな ずに かいて かんがえよう","b":"1年下","ids":["sansu-1-A-1","sansu-1-A-2"]},{"g":1,"u":"かずしらべ","b":"1年下","ids":["sansu-1-D-1"]},{"g":2,"u":"ひょうと グラフ","b":"2年上","ids":["sansu-2-D-1"]},{"g":2,"u":"時こくと 時間（１）","b":"2年上","ids":["sansu-2-C-2"]},{"g":2,"u":"２けたの たし算と ひき算","b":"2年上","ids":["sansu-2-A-2"]},{"g":2,"u":"たし算の ひっ算","b":"2年上","ids":["sansu-2-A-2"]},{"g":2,"u":"ひき算の ひっ算","b":"2年上","ids":["sansu-2-A-2"]},{"g":2,"u":"長さ（1）","b":"2年上","ids":["sansu-2-C-1"]},{"g":2,"u":"たし算と ひき算（１）","b":"2年上","ids":["sansu-2-A-2"]},{"g":2,"u":"１０００までの 数","b":"2年上","ids":["sansu-2-A-1"]},{"g":2,"u":"大きい 数の たし算と ひき算","b":"2年上","ids":["sansu-2-A-2"]},{"g":2,"u":"水の かさ","b":"2年上","ids":["sansu-2-C-1"]},{"g":2,"u":"三角形と 四角形","b":"2年上","ids":["sansu-2-B-1"]},{"g":2,"u":"かけ算（１）","b":"2年下","ids":["sansu-2-A-1","sansu-2-A-3"]},{"g":2,"u":"かけ算（２）","b":"2年下","ids":["sansu-2-A-1","sansu-2-A-3"]},{"g":2,"u":"かけ算 ,{"g":6,"u":"ならべ方と組み合わせ方","b":"6年","ids":["sansu-6-D-2"]},{"g":6,"u":"小数と分数の計算","b":"6年","ids":["sansu-6-A-1"]},{"g":6,"u":"円の面積","b":"6年","ids":["sansu-6-B-2","sansu-6-B-3"]},{"g":6,"u":"立体の体積","b":"6年","ids":["sansu-6-B-4"]},{"g":6,"u":"比とその利用","b":"6年","ids":["sansu-6-C-2"]},{"g":6,"u":"拡大図と縮図","b":"6年","ids":["sansu-6-B-1"]},{"g":6,"u":"比例と反比例","b":"6年","ids":["sansu-6-C-1"]},{"g":6,"u":"データの活用","b":"6年","ids":["sansu-6-D-1"]}],"katsudoName":"〔数学的活動〕","katsudo":{"1":{"page":96,"paras":["（1 ）内容の「Ａ数と計算」，「Ｂ図形」，「Ｃ測定」及び「Ｄデータの活用」に示す学習については，次のような数学的活動に取り組むものとする。","ア  身の回りの事象を観察したり，具体物を操作したりして，数量や形を見いだす活動","イ  日常生活の問題を具体物などを用いて解決したり結果を確かめたりする活動","ウ  算数の問題を具体物などを用いて解決したり結果を確かめたりする活動エ  問題解決の過程や結果を，具体物や図などを用いて表現する活動","数学的活動では，数学的な問題発見・解決の活動と，数学的な表現を生かしながら互いに伝え合う活動を中核とした活動を行うほか，特に，下学年においては具体的経験を大切にする操作等を通して数量や図形を見いだす活動を重視している。具体物を使って素朴に学ぶための操作活動については，児童が目的意識をもって主体的に行う活動となるように配慮する必要がある。","第１学年では，これを踏まえて，児童が数学的活動に意欲的に取り組み，基礎的・基本的な知識及び技能を確実に身に付けるとともに，思考力，判断力，表現力等を高め，算数に関わりをもったり，算数を学ぶことの楽しさやよさを実感したりできるようにすることを重視する。","ア  身の回りの事象を観察したり，具体物を操作したりして，数量や形を見いだす活動","第１学年においては，幼児期の生活の中でそれまでは意識せずに行ってきた認識や行動を基盤にしながら，児童が算数の学びに登場する数量や形と出合ったりそれらを自覚したりすることが大切である。それまでの生活や経験を無視して，算数の内容を指導してしまっては児童の学習意欲を削いでしまう。","このようなことから，これまでの児童の生活経験が算数の学習につながっていくことが実感できるようにするために，具体物を操作しながら数量やものの形に関わりをもつとともに算数に関心をもつ活動を行うことが大切である。","第１学年における「身の回りの事象を観察したり，具体物を操作したりして，数量や形を見いだす活動」として，例えば次のような活動が考えられる。","身の回りの具体物を操作しながらものの形に親しむ活動～形との出合い～","この活動は，「Ｂ図形」の（1）の指導における数学的活動であり，身の回りにある具体物を操作したり，その結果として構成される形に着目したりすることで，図形についての理解の基礎となる経験を豊かにすることをねらいとしている。","ここでは，具体物を操作しながらものの形への関心を高めて，いろいろな形の積み木や箱などを積んだり，並べたりして身近なものに見立てたり，紙を折ったり切ったりする児童の日常生活の場面を算数の学習につなげていく。","例えば，チューリップの花を折る場面では，１枚の紙を折ったり切ったりしながら他のものの形を作る経験を踏まえ，最初に下の図に示すように折り紙を折る。その際，正方形（ましかく）の折り紙が，一度折","ることで三角形（さんかく）に変わったり，さらに","折り進むと再び正方形（ましかく）に変わったりす","る。児童は丁寧に操作をすることで，角と角をぴっ","たり重ねるときれいな形ができることに気付く。ま","た次々と形が変化する様子に関心をもつ。また，一","度折った折り紙を開いてみることで，折った線に","よっていろいろな形ができていることにも気付く。","「折り紙を半分に折るとさんかくやながしかくが","できる」「折った後に広げると線ができる」「右と左","に同じ形ができてきれいだ」などの児童の素朴な気","付きを大切にして，何気なく行ってきた折り紙との","関わりから，ものの形に対する関心をもたせるよう","にする。","操作活動を主体的に行うことで，ものの形に対して親しみと関心を高め，算数の学習への意欲をもたせるようにすることが大切である。","イ 日常生活の問題を具体物などを用いて解決したり結果を確かめたりする活動","児童が経験する日常生活におけるできごとには，算数と結び付けて考えたり判断したりすることで解決が可能になったり，その結果を適切に表現したり処理したりすることがたくさんある。児童はそれらを何気なく行っているが，これらのできごとの背景にある数学的課題には気付いておらず，算数の問題と関わっているとは認識していないことが多い。","このような児童に，日常生活の中に算数で解決することができる課題があることに関心をもたせるとともに，それを実際に解決したりその結果を確かめたりする活動を経験させることが大切である。日常生活におけるできごとを算数と結び付けて考えたり処理したりする活動を通して，算数を学ぶよさを実感できるようにすることが大切である。","第１学年における「日常生活の問題を具体物などを用いて解決したり結果を確かめたりする活動」として，例えば次のような活動が考えられる。","日常生活にある量の大きさを比べる活動～長さの比較～","この活動は，「Ｃ測定」の（1）の指導における数学的活動であり，身の回りにあるものの長さに着目し，日常生活における長さの比べ方を考えたり，比べ方を用いたりする経験を通して，日常生活のできごとを測定を用いて処理することに関心をもち算数を学ぶよさを実感することをねらいとしている。","例えば，教室の大掃除をするために，可能ならば教師用机も廊下に出したいということから，「先生の机は教室の入り口から外に出すことができるだろうか。」ということを考える場面において，児童は次","のような数学的活動を遂行することが","考えられる。","教師の机が重く，運ぶだけでも大変で","あれば，運ぶ前に，「どうすれば，離れ","た場所にある先生の机が入り口を通る","かどうか分かるか。」という問いが生ま","れうる。","実際に運んで長さを合わせてみること（直接比較）は大変そうなので，もっと簡単に比べられないかを考えるのである。","「自分の腕の長さを使って比べてみる。」「机の幅と同じ長さの紙テープを作って，教室の入り口の長さと比べてみる。」「みんなの鉛筆を借りて，鉛筆の長さの幾つ分かで比べてみる。」という解決方法が生み出されるかもしれないが，そこで現実の場面に戻って妥当性を考える必要がある。","ある児童は，腕をひろげて机の幅に合わせ，そのまま移動してドアまで移動して比べようとするが，途中で幅が変わってしまい，その方法は正確でないことが分かるだろう。","なわとびのなわや紙テープといった媒介物を用いて長さを写し取る考え（間接比較）で実際に比べてみたり，筆箱など小さいものの幾つ分かで測る考え（任意単位による測定）で実際に比べてみたりする。このようにして，何か別のものを使うことで長さを比べることができることに気付き，そのよさを感じる。","比較した児童の結論は，教師の机の幅は，ドアの幅より狭いということだった。そこで実際に教師の机を廊下に出して大掃除を行った。","また，同じようにすれば比べられるという見通しをもち，教室にあるロッカーも教室から出せるかなど，直接並べなくても比べる活動を続けて行うことも考えられる。","このように，日常の事象でも算数を用いて解決することができる経験を豊かにすることで算数を学ぶよさを実感することができる。","ほかにも，「学習で使う大きなテレビは教室に入るかどう","かも確かめてみたい。」といった場面でも同様な活動はあり","うる。","このような活動を通して，日常の事象にある課題について","筋道を立てて考えるとともに，量の大きさの比べ方について","のアイディアを試してみたり，獲得した比べ方から選んで用","いて活用したりして，日常生活の中で量の大きさを比べよう","とすることは，第２学年で単位を用いて測定する能力につながるものである。","ウ 算数の問題を具体物などを用いて解決したり結果を確かめたりする活動","児童が算数の問題に主体的に関わり，既習事項を基にして考えたり判断したりすることで解決が可能になったり，その結果を適切に表現したり処理したりすることが期待される。","第１学年の児童にとって，算数で学習したことを意識的に活用して課題解決することは決して簡単なことではないが，既習事項を活用することで算数の問題を解決することが容易になることに関心をもたせるとともに，実際に解決したりその結果を確かめたりする活動を経験させることで，自ら算数を学び続ける楽しさを実感できるようにすることが大切である。","第１学年における「算数の問題を具体物などを用いて解決したり結果を確かめたりする活動」として，例えば次のような活動が考えられる。","既習の数の見方に着目し，具体物や図などを用いて，未習の計算の仕方を見付ける活動～（十何）−（１位数）で繰り下がりのある減法の計算の仕方～","この活動は，「Ａ数と計算」の（2）の指導における数学的活動であり，既習の数の見方に着目し，具体物や図などを用いて，未習の計算の仕方を見付けることをねらいとしている。ここでは，（十何）−（１位数）で繰り下がりのある減法の計算の仕方を考える際，10より大きい数を「10とあと幾つ」と捉えてきた既習の数の見方に着目し，数を分解して10から引くことで，既習の計算に帰着できることに気付かせていくことが大切である。","例えば，13−９という減法の計算の仕方を考える場面である。児童は13−９という式を見て「答えは幾つになるか」と考えようとするが，「３−９は引けない」ことに気付いたり，19−３という計算はできるがこの計算は今までと違い，（十何）−（１位数）で，一の位どうしが引けない減法であることに気付いたりするだろう。「一の位どうしが引けない13−９のような計算はどのように答えを出せばよいのだろう。」と問いが明確になれば，解決に向けて，ブロックなどの具体物を用いて考えることになる。","〇〇〇〇 〇〇〇〇〇〇〇〇〇→","多くの児童は上のように，一つずつ数えて９を取り答えを出すことができる。また，まとまりとして９を10から取る考えをする児童もいるだろう。","「13は10と３」 「10−９＝１」 「１＋３＝４」","〇〇〇〇〇〇〇〇〇〇 〇 〇〇〇〇〇〇〇〇〇 → 〇","〇〇〇 〇〇〇  〇〇〇","この手続きを支えている考え方を共有した後で，10から９をまとめて引けばよいことなど，この考えのよさについて話し合うことで，12−９など，同じように考えれば，ほかの（十何）−９の計算も簡単にできるのではないかと，児童自らが次の問いを考え，実際に真似して計算することもできる。","「12は10と２」 「10−９＝１」 「１＋２＝３」","〇〇〇〇〇〇〇〇〇〇 〇 〇〇〇〇〇〇〇〇〇 → 〇","〇〇 〇〇  〇〇","「15は10と５」 「10−９＝１」 「１＋５＝６」","〇〇〇〇〇〇〇〇〇〇 〇 〇〇〇〇〇〇〇〇〇 → 〇","〇〇〇〇〇 〇〇〇〇〇  〇〇〇〇〇","このように繰り返し９を引く計算をした後で，学習を振り返ることにより，数え引くのではなく，10のまとまりからまとめて９を取ると簡単だったことや，12−８などほかの（十何）−（１位数）の計算も同じようにできるのではないかといった気付きを確認することができる。","このような活動を通して，新たな計算に出合ったときに，既に知っている計算で解決できるよう，数の見方を工夫して解決しようとする態度や，ある数の計算の仕方を見付けたときに，それを基にして他の計算を発展的に考えようとする態度が育成されるようにする。","エ 問題解決の過程や結果を，具体物や図などを用いて表現する活動","今回の改訂では，算数科では，算数の問題解決の過程やその結果を具体物や図などを使って表現するとともに他者とのコミュニケーションによって算数を深く学ぶことを目指している。","第１学年の児童においても，具体物や図などを用いることで自ら取り組んでいる問題解決の過程やその結果を分かりやすく表すことを目指す。計算の方法や量の測定方法，さらにはものの形の構成や分解など形式的な手続きの理解を図るためには，具体物や図などを用いてそれらを可視化することが有効であり，他者との対話的な学びを支えていくことにもつながる。","第１学年における「問題解決の過程や結果を，具体物や図などを用いて表現する活動」として，例えば次のような活動が考えられる。","咲いたあさがおをグラフに表す活動～絵グラフ～","この活動は，「Ｄデータの活用」の（1）の指導における数学的活動であり，身の回りにある資料を絵グラフに表すことで，集めた資料の結果を分かりやすく表現できるようにすることをねらいとしている。","第１学年の生活科であさがおを育てている学校は多い。「先生，僕のあさがおが三つ咲いたよ。」「私は，四つ咲いたよ。」などと児童はあさがおの咲いている状況を数で表現するだろう。このようなことを捉えて，算数を活用する経験を豊かにする。例えば，次のような活動が考えられる。","教師は色の塗っていないあさがおの絵を幾つも用意し，一人","ひとりに咲いた数だけあさがおの絵を渡し，曜日を記入させ，","色を塗らせ，台紙に曜日ごとに貼らせる。このようなことを一","週間続けた後，この一週間あさがおがたくさん咲いたことにつ","いて振り返り話し合う。","児童は，台紙を見ながら，全体の個数や日ごとの数，色別の数などに着目して次々と話し始めるであろう。「一週間で全部で何個咲いたかな。」「何曜日が一番咲いたかな。」「何色が一番咲いたかな。」「クラスで一番咲いたのは誰かな。」","これらの問いの中で，「どの曜日が一番多いかな。」という問いから，絵グラフに表したよさに気付くだろう。","また，「何色が一番咲いたかな。」という問いに対して，児童はあさがおの絵を色ごとに並び替えたグラフを作るだろう。","このような活動を行うことで，整理する観点によって並び方を変えると，同じ資料でも絵グラフが変わり，よく分かることも変わることを感じることができる。こうした活動は次学年以降の学習につながっていく。"]},"2":{"page":127,"paras":["（1 ）内容の「Ａ数と計算」，「Ｂ図形」，「Ｃ測定」及び「Ｄデータの活用」に示す学習については，次のような数学的活動に取り組むものとする。","ア  身の回りの事象を観察したり，具体物を操作したりして，数量や図形に進んで関わる活動","イ  日常の事象から見いだした算数の問題を，具体物，図，数，式などを用いて解決し，結果を確かめる活動","ウ  算数の学習場面から見いだした算数の問題を，具体物，図，数，式などを用いて解決し，結果を確かめる活動","エ  問題解決の過程や結果を，具体物，図，数，式などを用いて表現し伝え合う活動","第１学年での算数の学習経験を踏まえて，児童が引き続き数学的活動に意欲的に取り組み，基礎的・基本的な知識及び技能を確実に身に付けるとともに，思考力，判断力，表現力等を高め，算数に関わりをもったり，算数を学ぶことの楽しさやよさを実感したりできるようにすることを重視する。","特に，これまで以上に数量や図形に積極的に関わるとともに，日常の事象や算数の学習場面から見いだした算数の問題について，これまで学習した数や式などの方法を有効に使うなどして思考したり表現したりできるようにする。なお，児童の発達の段階を考慮して，これらの数学的活動の視点は次の第３学年でも同様の内容とする。","ア  身の回りの事象を観察したり，具体物を操作したりして，数量や図形に進んで関わる活動","前学年での算数の学習経験を生かしながら，数量や図形に進んで関わり，算数の学習を楽しみながら取り組めるようにすることが大切である。それまでの児童の生活や学習での経験が第２学年の算数の学習につながっていくことが実感できるようにするために，事象を丁寧に観察したり具体物を操作したりしながら数量や図形に関わる活動を行うことが大切である。","第２学年における「身の回りの事象を観察したり，具体物を操作したりして，数量や図形に進んで関わる活動」として，例えば次のような活動が考えられる。","ものの個数を数える際に，数のまとまりに関心をもつ活動～乗法との出合い～","この活動は，「Ａ数と計算」の（3）の指導における数学的活動であり，同数累加の簡潔な表現として，乗法の式と出合う活動である。第１学年では，10のまとまりが幾つあるかを数えたり，２とびや５とびでものの数を数えたりするなどして，数のまとまりに着目する経験をしてきている。ここではこれらの経験を踏まえて，ものの数をまとまりとして捉えることで構成を再現しやすくなることに気付き，乗法的にみることへとつなげていくことをねらいとしている。","例えば，映像を見て，そこに表されたものの数をブロックで並べる活動を行う。左のような映像を見て全部で幾つあるかを考える際，「同じ数ずつ」あることに気付くことができれば，それが幾つあるのか，まとまりの個数を数える必要性が生まれる。串が３本あること，団子が４個ずつ並んでいることを見いだせば，同じようにブロックを並べることができる。全部の数も，並べた後で数えることができる。","この団子の数は，数えると12個である。式で表現すれば，４＋４＋４と表現できる。しかし，その式では３本と見いだした数を直接表現できていない。そのことを表すために乗法を使って４×３という式に表すことを知る。","また，右のような場面では，「同じ数ず","つ」縦横に並んでいることが共有できれ","ば，何をみればよいかが焦点化できる。「縦","は何段か。」「横は何列あったか。」などで","ある。それらが分かれば，ブロックを並べ","ることができる。縦に３段あること，横に","４列あることが見いだせれば，３×４，又は４×３と式で表すことができる。答えは，３＋３＋３＋３として求めることもできるし，並べたブロックを数えて求めることもできる。","このようにして新たな式と出合うことから，次はその式で表せるものがないか，自分で探すことになる。教室の机の並び，教室の窓，時間割表のコマ数，ノートのマス目などである。数のまとまりに着目し，それらが同じ数ずつあることを見いだせば，乗法に表すことができることを知り，その答え（積）を簡単に求めたいという思いから乗法九九についての関心を高めるようにする。","イ  日常の事象から見いだした算数の問題を，具体物，図，数，式などを用いて解決し，結果を確かめる活動","児童が経験する日常生活におけるできごとには，算数と結び付けて考えたり判断したりすることで解決が可能になったり，その結果を適切に表現したり処理したりすることがたくさんある。","このような児童に対して，日常生活の中から見いだした算数の問題を，これまでの学習で使用してきた具体物，図，数，式によって解決したりその結果を確かめたりする活動を経験させることが大切である。日常生活におけるできごとを算数と結び付けて考えたり処理したりする活動を通して，算数を学ぶよさを実感できるようにすることが大切である。","第２学年における「日常の事象から見いだした算数の問題を，具体物，図，数，式などで解決し，結果を確かめる活動」として，例えば次のような活動が考えられる。","データを整理して判断する活動～簡単な表の利用～","この活動は，「Ｄデータの活用」の（1）の指導における数学的活動であり，学級の一人一人の意見の中で人気があるものを把握することを通して，データを整理して判断することができるようにすることをねらいとしている。","例えば，学級のみんなで何をして遊ぶのかをデータを基に決める場面では，児童は次のような数学的活動を遂行することが考えられる。","遊びの候補が六つあり，児童が各自一つずつ選んだ結果が名簿にまとめられている元のデータを観察する。遊びを すきなあそびしらべ","ドッジ いすとり","決めるという目的から，「どれが おにごっこ クイズ かくれんぼ てつぼうボール ゲーム","一番人気があるのか」，「それぞれ ５ 12 ７ ５ ２ ４を選んだ人が何人ずついるのか」","すきなあそびしらべ","といった問題が生まれている。","○","○","そこで，この問題の解決のため","○","○","に，各候補について何人が選んで","○","○ ○","いるのかを集計し，見やすく表に","○ ○","○ ○ ○ ○","整理する。また，それを簡単なグ","○ ○ ○ ○ ○","○ ○ ○ ○ ○","ラフに表すことで，それぞれを選","○ ○ ○ ○ ○ ○","○ ○ ○ ○ ○ ○","んだ人数の違いが捉えやすくな","ドッジ いすとり","おにごっこ クイズ かくれんぼ てつぼうり，結果をみんなに伝えたり，共 ボール ゲーム","有しやすくなったりする。","このように整理された表やグラフから，一番人気があるもの，次に人気があるもの，またそれぞれの候補の人数の違いなど様々な情報を読み取ることができる。絵グラフや表から結果を読み取る過程で，「外遊びと中遊びがまじっているから，晴れの日の遊びと雨の日の遊びに分けて，もう一度調べてみよう。」といった新たな問題解決活動へとつながることも考えられる。","こうした活動を通して，観点を定めてデータを整理し特徴を把握することや，身の回りの事象についてデータを通じて考察する力の育成を目指す。","ウ  算数の学習場面から見いだした算数の問題を，具体物，図，数，式などを用いて解決し，結果を確かめる活動","児童が算数の問題に主体的に関わり，既習事項を基にして考えたり判断したりすることで解決が可能になったり，その結果を適切に表現したり処理したりすることが期待される。","第２学年の児童にとって，算数の学習場面から見いだした算数の問題について，事象を観察するとともに既習事項との関連を意識させるなどして問題解決の見通しを丁寧に扱うことが大切である。また，これまでの学習で使用してきた具体物，図，数，式を活用して問題を解決したりその結果を確かめたりする活動を経験させることで，自ら算数を学び続ける楽しさを実感できるようにすることが大切である。第２学年における「算数の学習場面から見いだした算数の問題を，具体物，図，数，式などを用いて解決し，結果を確かめる活動」として，例えば次のような活動が考えられる。","構成要素に着目して立体をつくる活動～箱の形の探究～","この活動は，「Ｂ図形」の（1）の指導における数学的活動であり，身近な箱を構成する活動を通して，箱の形がもつ基本的な性質を理解することをねらいとしている。児童は正方形や長方形の面で構成される箱の形をしたものについて観察したり，面を写し取ったりする活動から図形についての理解を深めている。そして「さいころの形は全部の面が正方形で構成されている」「長方形が六つで箱の形ができている」といったことについては学習をしてきた場面である。","例えば，さいころの形や箱の形を作ることができる，いろいろな大きさの正方形や長方形を２，３種類用意しておき，これらを使って箱の形を作ろうという問題場面では，児童は，次のような数学的活動を遂行することが考えられる。","正方形や長方形の紙を見た児童は，「これらの形を使うとどんな箱の形ができるかな。」という問いをもち，さいころの形やふつうの箱の形ができるという見通しをもつ。","さいころの形を作ろうと決めた児童の中で，前時までの学習を思い出した児童は，合同な正方形を６枚使いさいころの形を作ろうとする。","「どうして正方形６枚持ってきたの？」と分からない児童が友達に聞き，「さいころの形は正方形６枚でできているから。」と教えてもらうこともあるかもしれない。そのようにして，さいころの形を友達と協力し合って作っていく。","そのとき，「きれいなさいころにならない。」「ここがずれているからじゃないか。」などのやりとりの中から，辺と辺を合わせることの必要性に気付いていくこともあるかもしれない。","このようにしてさいころの形を作った後に学習を振り返る。友達が作ったさいころの形を鑑賞し，いろいろな大きさのさいころの形ができたことを認め合う。「ほかの形もできるだろう。」「もっと作りたい。」という思いから，ほかの箱の形（直方体）も作ることになるだろう。","けれども直方体は立方体より難しい。同じ長さの辺を合わせることを意識して作成していたが，同じ大きさの長方形を隣り合わせで張ってしまい，上手に組み立てられない児童がいることが考えられる。そのような児童がいる場合，「なぜうまくいかなかったのだろう。どのようにすると箱の形が作れるのだろうか。」と問いを焦点化していく。","そこで今度はできあがった箱を見ながら作っていく。完成した箱と自分が作った形を比べて観察することで，同じ大きさの長方形は，隣り合うのではなく，向かい合う位置になるように組み立てる必要があることに気付いていくだろう。","このような活動を通して，児童は箱の形を作るのに必要な面について理解を深めたり，実際に面を基に箱の形を構成したりすることができる。","エ  問題解決の過程や結果を，具体物，図，数，式などを用いて表現し伝え合う活動","今回の改訂では，算数科では，算数の問題を解決している過程やその結果を簡潔で明瞭かつ的確に表現するとともに他者との数学的なコミュニケーションによって算数を学び続けることを目指している。","第２学年の児童においては，これまでの学習で使用してきた具体物，図，数，式によって自ら取り組んでいる問題解決の過程やその結果を分かりやすく表現することを目指す。計算の方法や量の測定方法，さらには図形の性質の理解など形式的な手続きの理解を図るためには，具体物，図，数，式を用いてそれらを可視化することが有効であり，他者との対話的な学びを確かなものにしていくことにもつながる。第２学年における「問題解決の過程や結果を，具体物，図，数，式などを用いて表現し伝え合う活動」として，例えば次のような活動が考えられる。","問題場面と図，図と式を関連付けて解決の仕方を伝え合う活動","～加法と減法との相互関係～","この活動は，「Ａ数と計算」の（2）の指導における数学的活動であり，逆思考の問題場面について，図に表したり，図と式を関連付けたりして解決の仕方を考えることをねらいとしている。","ここでは，問題の文脈にそって図に表し，加法と減法との相互関係に着目して，図を頼りに答えを求める式を考え，解決すること，また，それらの数学的な表現を関連付けて，解決の仕方について分かりやすく伝え合うことが大切である。","例えば「はじめにリンゴが幾つかあって，５こもらったら12こになりました。はじめに幾つありましたか。」という問題場面では，児童は次のような数学的活動を遂行することが考えられる。","この問題を読み，「もらった」のだから，加法で答えが求められると考える児童や，減法で求められるという児童がいることが想定される。","これらの児童の対話の中で，「この問題は，たし算で答えが求められるのか，ひき算なのかはっきりさせよう」などの問いが生まれるだろう。そして，加法なのか，減法なのかをはっきりさせるために，「この問題場面を図にして，その計算でいい理由を図から考えよう。」と，見通しをもつ。","問題解決の段階では，次のように，リンゴを○として図に表して考える児童がいるかもしれない。","最初は分からないから","５こもらったから  ○○○○○","全部で12こになったから ○○○○○○○ ○○○○○","また，数量の関係をつかむために，問題文を短く区切り，下のようなテープ図を文脈に沿って少しずつかき加えている児童がいるかもしれない。","「はじめにリンゴが幾つかありました。」「５こもらいました。」","「12こになりました。」","友達との対話の中で，このように少しずつ図をかき加えていくことで正しく場面を表すことができることが広がっていく。","このようにして問題場面を図に表すことができた児童は，次に「□の数は，どのような計算で求めたらよいのだろう。」と考えを進めることになる。","○の図で考えた児童は，図から○が７個であることに気付くだろう。","テープ図で考えた児童は，この図を見て□に当てはまる数の求め方を考えることになる。そして，全部の数の12個から５個を引けば，はじめの数が分かることに気付くだろう。","これらのことから，12−５＝７で答えが求められること。□に７を入れて確かめてみたら，７＋５＝12なので，その答えでよいことを見いだしていく。","最後に学習を振り返り，問題の順に少しずつ図に表していくと，問題の場面を正しく捉えられることなどを確認したり，さらに「はじめに５こもっていて，幾つかもらったら11こになった」というような似た場面について考えたりする。","このように，数量の関係がつかめないときや，解決の仕方が分からないときには，問題場面に沿って図に表すことで問題の構造がつかみやすくなったり，正しい計算を見いだしたりすることなどを確認し，図という数学的な表現のよさに気付かせることが大切である。","このような活動を通して，問題解決の過程や結果について，数学的表現を用いて考えたり伝え合ったりしようとする態度が育成されるようにする。"]},"3":{"page":172,"paras":["（1 ）内容の「Ａ数と計算」，「Ｂ図形」，「Ｃ測定」及び「Ｄデータの活用」に示す学習については，次のような数学的活動に取り組むものとする。","ア  身の回りの事象を観察したり，具体物を操作したりして，数量や図形に進んで関わる活動","イ  日常の事象から見いだした算数の問題を，具体物，図，数，式などを用いて解決し，結果を確かめる活動","ウ  算数の学習場面から見いだした算数の問題を，具体物，図，数，式などを用いて解決し，結果を確かめる活動","エ  問題解決の過程や結果を，具体物，図，数，式などを用いて表現し伝え合う活動","第２学年までの算数の学習経験を踏まえて，児童が引き続き数学的活動に主体的に取り組み，基礎的・基本的な知識及び技能を確実に身に付けるとともに，数学的な思考力，判断力，表現力等を高め，算数に関わりをもったり，算数を学ぶことの楽しさやよさを実感したりできるようにすることを重視する。","特に，前学年以上に数量や図形に積極的に関わるとともに，日常の事象や算数の学習場面から見いだした算数の問題について，これまで学習した数や式などの方法を有効に使うなどして思考したり表現したりできるようにする。なお，児童の発達の段階を考慮して，これらの数学的活動の視点は前の第２学年と同様の内容とする。","ア  身の回りの事象を観察したり，具体物を操作したりして，数量や図形に進んで関わる活動","前学年までの算数の学習経験を生かしながら，数量や図形に進んで関わり，算数の学習を楽しみながら主体的に取り組めるようにすることが大切である。それまでの児童の生活や学習での経験が本学年の算数の学習につながっていくことが実感できるようにするために，事象を丁寧に観察したり具体物を操作したりしながら数量や図形に関わる活動を行うことが大切である。","第３学年における「身の回りの事象を観察したり，具体物を操作したりして，数量や図形に進んで関わる活動」として，例えば次のような活動が考えられる。","身の回りの形を観察したり操作したりして，まるい形に関心をもつ活動","～円との出合い～","この活動は，「Ｂ図形」の（1）の指導における数学的活動であり，身の回りにある形からまるい形を見いだし，円に出合う活動である。身の回りにある形を観察したり操作したりすることを通して，まるいものの形に含まれている円に気付き，円についても約束に基づいて捉えていこうと態度につなげることをねらいとしている。例えば，児童が「身の回りにあるまるいもの」","を集める場面を設定する。おはじきやシールのよ","うに円に近いものや，ボールやおもちゃのカプセ","ル容器など様々なものが集まる。","中にはペットボトルやラグビーボールのよ であり，自分たちの住む町の交通量について調べたものを分類整理して表やグラフに表し，それを用いて考えたことを伝え合うことを通して，データを整理する観点に着目し，身の回りの事象について表やグラフを用いて考察して，見いだしたことを表現できるようにすることをねらいとしている。","例えば，自分たちの住む町には，場所によって車や人の通る数がとても多い通りがあり，「どのぐらい多いのかを分かりやすく表せないか」という問題場面において，統計的な方法を用いて調べて表していこうとして，児童は次のような数学的活動を遂行することが考えられる。","ある地点の通行の実際の様子をビデオなどで見て，通行量の多い通りでは，人や車の数を容易には数えることができないことに気付いたり，場所により通行量に違いがあることや，車や自転車，歩行者といった実際に通る種類も違うことなどに気付いたりするだろう。","このようなことから，「どのように数えたらよいのか」という問いや，方向別に数える必要があることや車か歩行者か自転車かといった手段別に数える必要があることなど，観点を決める必要性が生じ，分類整理する見通しをもつことができる。に数える必要があることや車か歩行者か自転車かといった手段別に数えるあることなど，観点を決める必要性が生じ，分類整理する見通しをもつこきる。","実実際際にに分分担担してし，てあ，るあ１る時１間時に間，に調，べた調結べ果たを結表果にをま表とにめまると。める。","そして，次に集めたデータを，分かりやすく表すにはどうしたらよいかをそして，次に集めたデータを，分かりやすく表すにはどうしたらよいかを考え，観点を決め，伝えたいことに関する情報だけを抽出し，見て分かりやすい観点を決め，伝えたいことに関する情報だけを抽出し，見て分かりやすいグラフににまとめていく。","まとめていく。","「自転車はどこが多いのかを分かりやすく表すために，自転車だけの表「自転車はどこが多いのかを分かりやすく表すために，自転車だけの表からグララフにしよう。」「私は車の数を棒グラフで表してみよう。」「全部を１枚フにしよう。」「私は車の数を棒グラフで表してみよう。」「全部を１枚に表すために，ために，組み合わせたグラフを作成しよう。」といったように，児童は，組みれ合自わ分せのた思グいラにフ従を作っ成てし主よ体う的。」にと取いりっ組たんよでういにく，。児童は，それぞれ自分の思いに従って主体的に取り組んでいく。","グラグフラにフ表にし表た後し，たそ後こ，かそらこ見かいらだ見しいた特だ徴しやた傾特向徴，やそ傾し向て，考そえたしこてと考をえ，たグこラとフとラ対フ応とさ対せ応なさがらせ，な自が然らと，伝自え然合とう伝活え動が合始うま活る動。が始まる。","「こ「の通こりのは通車りがはと車てがもと多ていもで多す。いこでのす道。はこ，のと道なはり，のと町なへりつなのが町るへ大つきななが道るだ大だからだと思います。」「こっちの場所は人や自転車がたくさん通っていまからだと思います。」「こっちの場所は人や自転車がたくさん通っています。駅や商や商店街につながっているし，車が少ないからだと思います。」「〇さんの店街につながっているし，車が少ないからだと思います。」「〇さんのグラフと□さんのグラフを合わせると，この通りは車も人も少ないことが分かるね。」など，自分の考えを表現したり，友達の表現したものを比べて新たに考えたりしていく。- 176 -","こうして様々な観点とそれに対応するグラフに触れ，そこから読み取ることを相互に考える機会をもつことで，目的に応じてグラフに表すとよいことを学ぶとともに，主張によって適切なグラフの表し方が異なることにも気付き，児童の統計的な問題解決活動が深まることが期待できる。"]},"4":{"page":224,"paras":["（1 ）内容の「Ａ数と計算」，「Ｂ図形」，「Ｃ変化と関係」及び「Ｄデータの活用」に示す学習については，次のような数学的活動に取り組むものとする。ア  日常の事象から算数の問題を見いだして解決し，結果を確かめたり，日常生活等に生かしたりする活動","イ  算数の学習場面から算数の問題を見いだして解決し，結果を確かめたり，発展的に考察したりする活動","ウ  問題解決の過程や結果を，図や式などを用いて数学的に表現し伝え合う活動","低学年での算数の学習経験を踏まえて，児童が目的意識をもって数学的活動に主体的に取り組み，基礎的・基本的な知識及び技能を確実に身に付けるとともに，数学的な思考力，判断力，表現力等を高め，算数に関わりをもったり，算数を学ぶことの楽しさやよさを実感したりできるようにすることを重視する。","日常の事象や算数の学習場面から算数の問題を見いだしたり，その解決に既習事項を活用しながら数，式，図やグラフなどの方法を有効に使うなどして思考したり表現したりできるようにする。","なお，児童の発達の段階を考慮して，これらの数学的活動の視点は次の第５学年と同様の内容とする。","ア  日常の事象から算数の問題を見いだして解決し，結果を確かめたり，日常生活等に生かしたりする活動","これまでの数学的活動での経験を踏まえて，児童が，日常生活における問題を算数の学習で解決できるように数理的に捉え，それを既習事項を活用しながら解決し，その結果を確かめるとともに日常生活などに生かす活動である。日常生活での出来事を児童自らが算数の学習と結び付けて数理的に表現・処理する活動を通して，算数を利用することのよさを実感し，数学的な見方・考え方を働かせながら，既習の知識及び技能等を進んで活用していけるようにすることが大切である。","第４学年における「日常の事象から算数の問題を見いだして解決し，結果を確かめたり，日常生活等に生かしたりする活動」として，例えば次のような活動が考えられる。","二つのグラフを比べ判断したことを考察し，グラフを作り替え考察を深める活動～折れ線グラフ～","この活動は，「Ｄデータの活用」の（1）の指導における数学的活動であり，二つのグラフを比べて判断したことを考察し，より適切なグラフに作り替えて考察を深めることができるようにすることをねらいとしている。","統計的な主張は取り上げる特徴やグラフの作り方などで，本来の特徴や傾向とは異なる印象を他者に与えることができる。主張の内容をそのまま受け止めるのではなく，「このグラフから導く結論は，これで正しいのか。」という視点で振り返って考えることが大切である。","例えば，平成28年度の全国学力・学習状況調査の算数Ｂの4の（3）の出題例のように二つの小学校の図書委員会が協力して読書運動を進めているとする。それぞれの学校の図書委員が，読書運動を進めた成果を表すために，「物語」の貸し出し冊数の変化の様子を，折れ線グラフにそれぞれまとめた。どちらの学校が，読書運動がうまくいったのか，グラフを比較して考える場面があるとする。この場面において，児童は次のような数学的活動を遂行すると考えられる。","折れ線グラフは，線の傾きで変化の様子を捉えるグラフである。そこで，まず，折れ線グラフの線だけを見て分かることを交流し合う。","Ｂ小学校の方が増え方が急であること，Ａ小学校は初めからあまり少なくないこと，Ｂ小学校は読書運動をする前はあまり貸し出し冊数が多くないこと，Ｂ小学校の最も冊数の多い月は，Ａ小学校を上回っていることなどである。","しかし，本当にそうだろうか。そのような判断が正しいかどうかは，どこを見るとよいのだろうか。そのような問題意識から，二つのグラフをより詳しく比べて読み，判断したことを伝え合う。","縦軸をよく見ると，目盛りの間隔が違うこと，Ｂ小学校のグラフは，変化の様子を見やすくするために，省略を示す線が使われていること，グラフの数値を読むと，６月はＡ小学校の方が貸し出し冊数が多いこと，それぞれのグラフから貸し出し冊数を読み取るとＡ小学校は400冊，Ｂ小学校は300冊増えていることなどである。このようなことから，Ａ小学校とＢ小学校の「物語」の貸し出し冊数の変化の様子を分かりやすくするために「これらのグラフをどのように作り替えるとよいか。」と問いをもつことが考えられる。","そして，縦軸の目盛りを同じにすればよいこ","とや一つのグラフとしてまとめればよいことな","どの見通しをもち，解決活動に入る。","例えば，次のようにグラフを作り替える。","そして，学習を振り返り，折れ線グラフの傾","きは，縦軸の目盛りの幅によっては急になって","しまい，大きく変化しているという印象を与え","やすくなることや，統計的な主張を聞く際には，","このような見かけに惑わされないことが大切で","あることなどをまとめることができる。","イ  算数の学習場面から算数の問題を見いだして解決し，結果を確かめたり，発展的に考察したりする活動","低学年での学習経験を踏まえて，児童が算数の問題に主体的に関わり自ら問題を見いだし，既習事項を基にして考えたり判断したりすることで解決が可能になったり，その結果を適切に表現したり処理したりするとともに，それを発展的に考察することが期待される。","算数の学習場面から自ら問題を見いだすために，事象を観察するとともに既習事項との関連を意識させるなどして問題解決の入口を丁寧に扱うことが大切である。また，これまでの学習で使用してきた具体物，図，数，式，表やグラフなどを活用して問題を解決し，その結果を確かめるだけでなく，それを発展的に考察する活動を位置付けることで，自ら算数を学び続け，算数を創ることの楽しさを実感できるようにすることが大切である。","第４学年における「算数の学習場面から算数の問題を見いだして解決し，結果を確かめたり，発展的に考察したりする活動」として，例えば次のような活動が考えられる。","商の意味を考える活動～小数を用いた倍～","この活動は，「Ａ数と計算」の（4）の指導における数学的活動であり，ある量を倍で捉えたいが，それを整数で表すことができない場合に，小数を用いて倍を表すことができるように倍の意味を拡張することをねらいとしている。","例えば，「２ｍや125㎝，120㎝は50㎝の何倍か」を考える場面において，児童は次のような数学的活動を遂行すると考えられる。","まず，数値が示されていない50㎝の長さのテープと２ｍの長さのテープを見て「長いテープの長さは短いテープの長さの何倍か」を予想する。","そして，「４倍」ではないかと考え，どうしたら４倍とはっきり分かるかを話し合う。","その中で，実際にテープを使って幾つ分あるか調べればいいという意見や，長さが分かれば計算して分かるという意見を基に，実際に調べてみる。","実際にテープを使って確認したり，長さは２ｍと50㎝なので，200÷50＝４だから４倍であることを確認したりする。","次に，数値が示されていない125㎝の長さのテープを見て，50㎝のテープの長さの何倍か考える。","見た目では，２倍とちょっとである。そこで，この「ちょっと」ということをはっきりいえないかという問いをもつだろう。","実際にテープで調べると，二つ分と半分であることが分かる。２倍と３倍のちょうど真ん中だから，２倍と半分である。先ほどと同じように計算でも調べると，125÷50＝2.5だから，2.5倍だということが分かる。","今までは，倍は整数の場合だけしか学習していない。2.5倍というのは初めて見る表し方である。そこで，2.5倍とはどういう意味かを考え，２倍と半分ということだと落ち着くであろう。","さらに発展的に考えを進めることで，違うテープの長さでも何倍かを考えようとするだろう。例えば120㎝のテープについて考えを進めるとする。","「120㎝のテープの長さは50㎝のテープの長さの何倍といえばよいだろうか」という問いが生まれ，数値で考えると120÷50＝2.4なので2.4倍だということは分かる。問題は2.4倍の意味である。","テープを基に操作して，ここまでが２倍であるが，「残りの部分は，どうして0.4といえるのか」と考えを進める。","小数のときは10等分して考えたという振り返りのもと，50㎝のテープを10等分することで，2.4倍とは，２個分と，１を10等分した内の４個分のこと，言い換えると，120㎝は50㎝を１としたとき，2.4の目盛りにちょうど当たることを確認していく。","さらに，2.4倍のような小数で倍を表すことができるなら，0.8倍などもあるのかと発展的に考えることもできる。","このような学習過程を経ることで，倍を表す数に小数を用いてもよいと，倍の意味の拡張を図る。これまで倍は「幾つ分」と捉えてきたが，ここからは，「基準量を１とみたときに幾つに当たるか」を倍の意味と捉え直す。","このとき，倍の意味を広げる活動とともに，倍を求める除法の意味についても捉え直す機会になる。包含除の除法の意味について，a÷bを「aはbの幾つ分かを求める計算」と捉えていたものを，「bを１とみたときにaが（小数も含めて）幾つに当たるかを求める計算」と捉え直すことになる。","このような学習は，第５学年の小数の乗法及び除法の計算や，割合の学習につながる大切な学習である。","ウ 問題解決の過程や結果を，図や式などを用いて数学的に表現し伝え合う活動","低学年での数学的活動を踏まえて，これまでの学習で使用してきた図や式などを活用して自ら取り組んでいる問題解決を過程やその結果を分かりやすく表現し，他者と伝え合うなど対話的に学ぶことを目指す。問題解決における思考の過程や判断の結果などを数学的に表現するためには，図や式などを適切に用いて的確に表現する必要がある。また，思考した過程や結果などを数学的な表現を用いて伝え合う機会を設け，数学的に表現することのよさを実感できるようにすることも大切である。さらに，対話的に伝え合うことにより，お互いの考えをよりよいものにしたり，新たなことを見いだしたりする機会が生まれることを経験できるようにする。","第４学年における「問題解決の過程や結果を，図や式などを用いて数学的に表現し伝え合う活動」として，例えば次のような活動が考えられる。","図や式を関連させて面積の求め方を考える活動～長方形を組み合わせた図形～","この活動は，「Ｂ図形」の（4）の指導における数学的活動であり，正方形や長方形が組み合わせた図形の面積の求め方を，既習の正方形や長方形の求積公式を活用することで求めることができるようにすることをねらいとしている。ここで，長方形や正方形が組み合わせた図形とは，例えばＬ字の形をした図形や凸の形，凹の形をした図形などのことである。","最初に，長方形とＬ字型の図形を観察することで，「長方形の面積は求められるけど，Ｌ字型の図形の面積は初めてだ。どのように面積を求めたらいいのだろう。」といった問いが生まれるだろう。そしてこれまでに身に付けてきた図形の合成や分解，変形など図形の構成についての見方を働かせ，「長方形や正方形の面積の求め方は分かるので，それらの図形を見いだせないか。」と見通しをもつ。","「長方形の面積の求め方が使えるように，この図形を分けられないかな」と考えることで，（あ）のように考えて答えが出る。さらに「ほかの求め方はないかな」と考えを進めたりする。","次に，友達はどんな求め方をしたのか知り，自分の考えを深めようとする。","ある友達は「６×２＋３×４＝24だから24㎠です。」と言うかもしれない。式を聞いただけでは，どのように求めたのかよく分からなければ，更に聞いてみることで，その友達は，（い）のように図に線を書き加え，６×２の式と図を対応させるなどして説明してくれるだろう。そして，「なるほど。６×２や３×４はこれらの長方形の面積なのか。式と図を関連付けて説明してくれると分かりやすい。」と気付くかもしれない。","また，減法を使った６×６−３×４という式を考える友達がいれば，どうしてこの式だけひき算なんだろうと疑問を感じ，６×６ってどこの図形の面積を求めているのかと考えを進めていく。","また，６×４＝24と乗法１回で求めている式を考える友達もいるかもしれない。この場合も，６×４の４とはどこのことだろうと探り，求め方を理解する。","このように，多くの求め方があることを学級全体で確認していくとともに，面積を求めることができたアイディアについて確認しておくことが重要である。","授業の終わりでは，結局，今日はどういう求め方をしたことになるかと振り返り，どの求め方も図形に働きかけて「既習の図形である長方形を見いだしていること」や，「分けたり，分割したり，移動したりすると長方形にできること」などについてまとめたり，さらに「階段の形や凸の形，凹の形など，長方形を組み合わせた複雑な図形でも面積が求められるかな」と発展的に考えたりする。","このように，いろいろな図形の面積の求め方を考えることにより，児童は，これらの考え方の中で，いつでも使える考え方もあれば，簡単な考え方ではあるが特定の場合にしか使えない考え方があることに気付いていくことができる。","また，このようなことが理解できるのは，式と図を関連付けて説明してくれたからだということも確認できる。","このような数学的活動を通して，面積を求める際のポイントである図形の見方・考え方が豊かになっていくことで，次学年の面積の学習につなげいていく。","伴って変わる二つの数量の関係を表現し伝え合う活動","～段数と周りの長さの関係～","この活動は，「Ｃ変化と関係」の（1）の指導における数学的活動であり，見いだした変化や対応のきまりを表現し伝え合うことで，伴って変わる二つの数量の関係に着目し，表や式を用いて変化や対応の特徴を考察できるようにすることをねらいとしている。","例えば，段数と周りの長さの関係について，「段数を増やしていくと周りの長さがどのように変わるか」という問いをもったとする。","そして，図や表を用いて調べ，調べ方や調べた結果を表，図，式といった数学的な表現を用いて，他者に分かるように説明してみる。他者に正しく分かりやすく伝えるためには，数値と数値を関係付けたり，関係が簡潔・明瞭に伝わるような表現方法を工夫したりすることが必要である。また，同じ関係を，一つの表現だけではなく，別の表現で表すことによって，変化や対応についての理解を深めることを大切にしていく。","児童は，変化や対応について，「段数が１ずつ増えると，周りの長さは４㎝ずつ増えていく」，「段数に４をかけると周りの長さになる」などの関係を見いだすであろう。見いだした関係は，表を用いて説明することができる。矢印などを用いると「＋４」や「×４」の関係が捉えやすい。また，関係は表だけでなく，「４，４＋４，４＋４＋４，…」，「段数×４＝周りの長さ」などの言葉の式，□，△などを用いた式でも表される。","さらに，「４㎝ずつ増える」，「４をかけると周りの長さになる」という関係には「＋４」，「×４」といった不変な数量の関係がある。図を用いて，どこが「＋４」，「×４」になっているかを表現することは，変化や対応についての新たな気付きを促し，関係についての理解を深めることにつながる。","「＋４」，「×４」になっているかを表現することは，変化や対応についての新な気付きを促し，関係についての理解を深めることにつながる。","図で「+４」を説明する 図で「×４」を説明する","この活動では，伴って変わる二つの数量の関係を，表，図，式を用いて表し，説この活動では，伴って変わる二つの数量の関係を，表，図，式を用いて表し明する機会となるため，数学的な表現を用いて，自分の考えを説明する力が育成さ説明する機会となるため，数学的な表現を用いて，自分の考えを説明する力がれる。さらに，一つの関係を複数の数学的表現を用いて表し，それらを関連付ける成される。さらに，一つの関係を複数の数学的表現を用いて表し，それらを関ということを，様々な事象の考察においても行っていけるようにすることも大切で付けるということを，様々な事象の考察においても行っていけるようにするこもあ大る切。である。"]},"5":{"page":276,"paras":["（1 ）内容の「Ａ数と計算」，「Ｂ図形」，「Ｃ変化と関係」及び「Ｄデータの活用」に示す学習については，次のような数学的活動に取り組むものとする。","ア  日常の事象から算数の問題を見いだして解決し，結果を確かめたり，日常生活等に生かしたりする活動","イ  算数の学習場面から算数の問題を見いだして解決し，結果を確かめたり，発展的に考察したりする活動","ウ  問題解決の過程や結果を，図や式などを用いて数学的に表現し伝え合う活動","それまでの算数の学習経験を踏まえて，児童が目的意識をもって数学的活動に主体的に取り組み，基礎的・基本的な知識及び技能を確実に身に付けるとともに，数学的な思考力，判断力，表現力等を高め，算数に関わりをもったり，算数を学ぶことの楽しさやよさを実感したりできるようにすることを重視する。","日常の事象や算数の学習場面から算数の問題を見いだしたり，その解決に既習事項を活用しながら数，式，図やグラフなどの方法を有効に使うなどして思考したり表現したりできるようにする。","なお，児童の発達の段階を考慮して，これらの数学的活動の視点は前の第４学年と同様の内容とする。","ア  日常の事象から算数の問題を見いだして解決し，結果を確かめたり，日常生活等に生かしたりする活動","これまでの数学的活動での経験を踏まえて，児童が，日常生活における問題を算数を用いて解決できるように数理的に捉え，それを既習事項を活用しながら解決し，その結果を確かめるとともに日常生活などに生かす活動である。日常生活でのできごとを児童自らが算数の学習と結び付けて数理的に表現・処理する活動を通して，算数を利用することのよさを実感し，数学的な見方・考え方を働かせながら，既習の知識及び技能等を進んで活用していけるようにすることが大切である。","第５学年における「日常の事象から算数の問題を見いだして解決し，結果を確かめたり，日常生活等に生かしたりする活動」として，例えば次のような活動が考えられる。","データに基づいて身の回りの問題を解決する活動～学年とけがの関係の考察～","この活動は，「Ｄデータの活用」の（1）の指導における数学的活動であり，目的に応じてデータを集めて分類整理し，データの特徴や傾向を分析して対策を立てることができるようにすることをねらいとしている。","日常生活において，問題に感じることや改善したいことなどに対して，ただ漠然と取り組んでみたり，勘や個人的な経験則を頼りにしたりしていても効果が出ないことがある。そういった事柄に対しては，データを収集し分析することで実態を的確に把握し，そこから解決策を見いだしたり効果的な対策を講じたりすることができることがある。","例えば，小学校のけがについて考察する場面において，児童は次のような数学的活動を遂行とすると考えられる。","けがについて学習していた際に，「下学年の児童の方が，けがが多そうだ。」という予想をしていたのに，保健だよりなどから，どの学年も同じくらいの人数がけがをしていることを知ったとする。","そこから「どの学年も， 第１学年と第６学年のけがの種類（人）","本当に同じようにけがを すりきず きりきず だぼく ねんざ その他第１学年 60 22 ９ ０ ６","しているのか。」につい","第６学年 28 20 18 12 22","て調べていく。けがをし","た人数が同じくらいであることが分かったが，ほかに何を調べれば詳しく分かるのかを考える。","学年によって人数が異なるので，単純に量だけで比べられないことから，調べる対象によっては，割合で比べることも必要であることが分かる。そして，「学年によって，けがをする場所に違いはあるのか。」「けがの種類には，違いがあるのか。」「けがの程度に違いはあるのか。」といったような調べる内容を決める。","どんなデータがあればよいのかを決めれば，次はそのデータを収集する必要がある。このときどのようにデータを収集するかについても検討できるようにすることが望ましい。","収集したデータを分析するため，これまでに学習したような表やグラフにまとめてみる。観点を二つ取り","出して二次元の表に整理","することや，その内訳を","量的にみるなら棒グラ","フ，割合でみるなら帯グ","ラフや円グラフというよ","うに目的に応じて適切な","グラフを選択し表現して","いく。","「すりきず」でけがをしている人数","このとき，全員が同じ観点で分析をしてい","るとは限らない。むしろ個人やグループごと","の関心から様々な分析をしているだろう。そ","こで，その結果を交流することで，別の観点","から分析した結果を知ることができる。例え","ば右のような棒グラフを見ると，１年生がす","りきずが多いということだけでなく，下学年","ではすりきずが多いという傾向が読み取ることができる。","このようにして，データを集めて分類整理し，適切な表やグラフを選択して表現し，多面的に捉え考察することで的確な判断が可能となることを学ぶ機会とするのである。","また，このような活動の方法全体を振り返り，どのようにして結論に至ったかを整理することで，統計的な問題解決の方法を知ることの定着につながると考えられる。","こうした活動を通じて，自身が問題に感じたことに対して，データを通じて客観的に捉えようとする見方を養い，適切なデータ収集方法や分析の仕方を含めた問題解決の進め方を学び，進んで生活に生かそうとする態度の育成を目指す。","イ  算数の学習場面から算数の問題を見いだして解決し，結果を確かめたり，発展的に考察したりする活動","これまでの学習経験を踏まえて，児童が算数の問題に主体的に関わり自ら問題を見いだし，既習事項を基にして考えたり判断したりすることで解決が可能になったり，その結果を適切に表現したり処理したりするとともにそれを発展的に考察することが期待される。","算数の学習場面から自ら問題を見いだすために，事象を観察するとともに既習事項との関連を意識させるなどして問題解決の入口を丁寧に扱うことが大切である。また，これまでの学習で使用してきた具体物，図，数，式，表やグラフなどを活用して問題を解決し，その結果を確かめるだけでなく，それを発展的に考察する活動を位置付けることで，自ら算数を学び続け，算数を創ることの楽しさを実感できるようにすることが大切である。","第５学年における「算数の学習場面から算数の問題を見いだして解決し，結果を確かめたり，発展的に考察したりする活動」として，例えば次のような活動が考えられる。","乗法の意味を広げる活動～乗数が小数の乗法～","この活動は，「Ａ数と計算」の（3）の指導における数学的活動であり，小数についての既習の内容を根拠に，数直線や図，式などを用いて，乗数が小数についての乗法の意味を見いだすことをねらいとしている。","小数の乗法では，乗数が整数のとき乗法の意味を基にして，乗数が小数の場合にも，乗法を用いることができるように意味を広げることを考える。","例えば，長さが示されていない１ｍのリボンと2.3ｍのリボンを観察し，「１ｍのリボンが120円のとき，もう一方のリボンはいくらだろうか」を考える場面では，児童は次のような数学的活動を遂行することが考えられる。","「240円ぐらい。」と予想を発表すると「どうして240円だと思ったの。」と根拠を問われ，例えば「長さが２倍だから，値段も２倍だと思ったから。」と答える。実際に長さを当てて確かめると，２倍より少し長いことが分かる。","長さを聞き，2.3ｍであることを知る。","そこで，ある児童は，２ｍまでの代金と0.3ｍの代金に分けて，2.3ｍのときの代金を調べていくだろう。そして，１ｍが120円だから0.1ｍは12円であり，2.3ｍの代金は120×２＋12×３＝276で276円だと考えを進めていく。","また，ある児童は，１ｍから2.3ｍに2.3倍になることを基に，答えを求める式を考えていくだろう。長さが２倍のときは，代金は120×２で求めたので，2.3倍だから，120×2.3だと考えを進める。2.3倍という，小数を用いた倍は第４学年で学習している。","これらの考えを伝え合うことで学び合い，「このことを図でも説明できないかな。」と問題を焦点化する。","そこで，児童はそれぞれ，テープ図の下に数直線を引き，「ここまでが１倍とすると２倍や３倍はどこぐらいかな。」と倍の目盛りを書き加えていく。さらに「ここまでが120円とすると，２倍や３倍のところはどんな式で求められるのかな？」とテープ図を上に代金や代金を求める式の数直線を書き加える。２倍のところは120×２で240円，同じように，３倍のところは120×３で360円と書く。","「では，2.3倍のところはどんな式になるだろうか。」と考えを進め，式が120×2.3になることやその答えが276円であることも確認し合う。","そして，「今までのかけ算は（一つ分の大きさ）×（幾つ分）で考えていたけど，120×2.3という式はどういうふうに考えたらいいのだろうか。」と振り返り，小数を用いた倍の意味を基に「120円を１としたときの2.3に当たる大きさを求める計算が120×2.3である」ことをまとめていく。","さらに，「120×2.3の答えを求める他の方法はないか。」と発展的に考え，乗数が小数の場合の計算の仕方について考察を深めていく。","このように，乗数が小数の場合の乗法の意味を，乗数が整数の場合の乗法の意味を基にして，考えられるようにすることが大切である。","図形を構成する要素に着目して合同な図形の作図の方法を見いだす活動","～三角形の合同～","この活動は，「Ｂ図形」の（1）の指導における数学的活動であり，図形を構成する要素に着目し，合同な図形をかく活動を通して，どの構成要素が決まれば図形の形や大きさが一つに決定するかという図形の決定条件を考えることをねらいとするものである。","ここでは，ぴったり重なるという具体的な操作を，対","応する辺の長さや角の大きさが等しいかどうかに置き換","えて考えていくことになる。","例えば，辺イウの長さが６㎝であることのみを示した","右のような三角形アイウを基に「この三角形と合同な三","角形をかくには，どうしたよいのだろう。」という問題の場面では児童は次のような数学的活動を遂行することが考えられる。","「合同な図形は，全ての対応する辺の長さと角の大きさが等しかったから，辺の長さや角の大きさが知りたい。」「でも，全ての辺の長さや角の大きさを調べる必要があるのだろうか。」と話し合ったり，「辺イウが決まったということは，三角形の三つの頂点のうち，二つが決まったということだ。」と考えを進めたりする中で，「あと一つの頂点アの位置を決めるには，何を調べたらよいだろう。」と問題を焦点化していくだろう。","例えば，まず，辺アイの長さを調べた児童は次のように考えを進めるだろう。頂点アの位置が決まらない。 角イの大きさを調べると，頂点アの位置が決まる。辺アウの長さを調べると，頂点アの位置が決まる。このように調べていくことを通して，三つの構成要素をうまく選ぶと，三角形が一つに決定することに気付いていく。","そして，ほかに調べた児童と交流し，三角形が決まる条件はほかにもあるがそれをもとにすると，合同な三角形を書くことができることを見いだしていく。","「正三角形や二等辺三角形の場合は，どうだろう。」「四角形の場合は，どうだろう。」などと別の図形について発展的に考えることも考えられる。新たな図形を考察する観点を学んだら，その観点で既習の図形について見直そうとする態度が育成されることも大切である。","ウ 問題解決の過程や結果を，図や式などを用いて数学的に表現し伝え合う活動","これまでの数学的活動を踏まえて，これまでの学習で使用してきた図や式などを活用して自ら取り組んでいる問題解決の過程やその結果を分かりやすく表現し，他者と伝え合うなど対話的に学ぶことを目指す。問題解決における思考の過程や判断の結果などを数学的に表現するためには，図や式などを適切に用いて的確に表現する必要がある。また，思考した過程や結果などを数学的な表現を用いて伝え合う機会を設け，数学的に表現することのよさを実感できるようにすることも大切である。さらに，対話的に伝え合うことにより，お互いの考えをよりよいものにしたり，新たなことを見いだしたりする機会が生まれることを経験できるようにする。","第５学年における「問題解決の過程や結果を，具体物や図などを用いて数学的に表現し伝え合う活動」として，例えば次のような活動が考えられる。","図形の特徴や図形を構成する要素に着目して面積の求め方を考察する活動","～台形の面積の公式作り～","この活動は，「Ｂ図形」の（3）の指導における数学的活動であり，図形の特徴や図形を構成する要素に着目して，図形の面積の求め方を考え，図と式を関連付けて説明することを通して，問題解決の過程や結果を数学的に表現する力を高めることをねらいとしている。","これまでに，児童は，正方形や長方形の面積の求め方について，辺の長さに着目し，計算によって面積を求めることのよさに気付き，図形を構成する要素である辺に着目することで面積の公式を作ることを考えてきている。第５学年では，これらの経験を踏まえて，図形の見方や既習の面積を求める公式の作り方を活用し，三角形や平行四辺形，台形及びひし形の面積の求め方を工夫して考え，その考え方を公式へと表現を高めていく。","例えば，右の図のような上底が２㎝，下底が８㎝，","高さが４㎝の台形の面積を求め方を考えたことを基","に，台形の公式をつくる場面で，児童は次のような数","学的活動を遂行すると考えられる。","台形の面積の求め方として，例えば次の二つの場合を児童が考えたとする。","｢台形を二つ合わせて平行四辺形にしまし","た。底辺が（２＋８）で高さが４なので平行","四辺形の面積が求められます。その面積の","半分なので÷２をしました。（２＋８）×４","÷２＝20です。｣","｢台形を横に切って一部を移動して平行四辺形に","しました。底辺が（２＋８）で高さが４÷２なの","で，（２＋８）×（４÷２）＝20です。」","などのように考えたことを伝え合い，お互いの考","えを共有していく。","そこで，これらの活動を振り返り，面積の公式を知っている図形に台形を変形したことから，台形の面積が求められたことをまとめる。","ここでさらに，三角形や平行四辺形と同じように「台形も公式があるといいのではないか。台形の公式を考えよう。」という問いをもつことが考えられる。","そこでまず，平行四辺形や三角形のとき，どのように公式を作ったのかを振り返る。","①  面積を計算した図形の辺や高さなどが，もとの図形の辺や高さなどに当たるかを捉える。","②  数値を用語に置き換え，言葉の式に表す。","③  幾つかの考えの共通点を見付けて公式にする。","そこで，このことを基に台形の公式を作っていく。","台形を二つ合わせて平行四辺形にする考えでは，次のように考えるだろう。","（ ２  ＋  ８ ） × ４   ÷２ ＝ 20","↑ ↑  ↑ ↑","台形の 台形の  台形の高さ 面積が半分","上の辺の長さ 下の辺の長さ","このことから（（上底）＋（下底））×高さ÷２という台形の公式を導くことができる。","また，台形を横に切って一部を移動して平行四辺形にする考えでは，次のように考えるだろう。","（ ２  ＋  ８ ） ×（４÷２） ＝ 20","↑ ↑  ↑","台形の 台形の 台形の高さの半分","上の辺の長さ 下の辺の長さ","このことからも（（上底）＋（下底））×高さ÷２という台形の公式を導くことができる。","このように幾つかの求め方を公式にしていき，どの求め方からも","（（上底）＋（下底））×高さ÷２が導けることを確認して公式としてまとめる。","これらの経験を通して，図と式を関連付けて考える力や，式に表現したことを公式という簡潔・明瞭・的確な表現に高めていく力の育成を目指す。"]},"6":{"page":314,"paras":["（1 ） 内容の「Ａ数と計算」，「Ｂ図形」，「Ｃ変化と関係」及び「Ｄデータの活用」に示す学習については，次のような数学的活動に取り組むものとする。","ア  日常の事象を数理的に捉え問題を見いだして解決し，解決過程を振り返り，結果や方法を改善したり，日常生活等に生かしたりする活動","イ  算数の学習場面から算数の問題を見いだして解決し，解決過程を振り返り統合的・発展的に考察する活動","ウ  問題解決の過程や結果を，目的に応じて図や式などを用いて数学的に表現し伝え合う活動","第５学年までの算数の学習経験を踏まえて，児童が目的意識をもって数学的活動に主体的に取り組み，基礎的・基本的な知識及び技能を確実に身に付けるとともに，数学的な思考力，判断力，表現力等を高め，算数に関わりをもったり，算数を学ぶことの楽しさやよさを実感したりできるようにすることを重視する。","日常の事象や算数の学習場面から算数の問題を見いだしたり，その解決に既習事項を活用しながら数，式，図やグラフなどの方法を有効に使うなどして思考したり表現したりできるようにする。","なお，児童の発達の段階を考慮して，これらの数学的活動の視点は次の中学校第１学年と内容との整合性を図る必要がある。","ア  日常の事象を数理的に捉え問題を見いだして解決し，解決過程を振り返り，結果や方法を改善したり，日常生活等に生かしたりする活動","これまでの数学的活動での経験を踏まえて，児童が，日常生活における問題を算数の学習で解決するために理想化したり単純化したりすることによって定式化して，それを既習事項を活用しながら解決し，よりよい問題解決にするために解決過程を振り返り結果や方法を工夫・改善するとともに，それらを日常生活の課題解決などに生かす活動である。日常の事象を丁寧に観察するなどして問題を見いだし，それを児童が主体的に算数の学習と結び付けて数理的に表現・処理する活動を通して，算数を利用することのよさを実感し，数学的な見方・考え方などを働かせ，既習の知識及び技能等を進んで活用していけるようにすることが大切である。","第６学年における「日常の事象を数理的に捉え問題を見いだして解決し，解決過程を振り返り，結果や方法を改善したり，日常生活等に生かしたりする活動」として，例えば次のような活動が考えられる。","縮図や拡大図を日常生活に利用する活動～大きな図や小さな図をかく～","この活動は，「Ｂ図形」の（1）の指導における数学的活動であり，形が同じである図形どうしの関係に着目して，縮図や拡大図をかく方法を日常生活に活用することを通して，縮図や拡大図の理解を深め，その有用性を感じることをねらいとしている。","例えば，運動会でソーラン節を演技する際にクラスの大漁旗を作ることを計画する場面において，児童は次のような数学的活動を遂行することが考えられる。","大漁旗を作ることになり，大漁旗の下絵ができた段階で「この下絵を旗の布のサイズまで大きくして描き写したい。」「どうすれば，この下絵を旗のサイズまで拡大することができるのだろうか。」という目的や問いが生まれる。","「コピー機では旗のサイズまで大きく","できないね。」「自分たちの手描きで絵を","拡大する必要がありそうだ。」という話","し合いから，自分たちが学んできた縮図","や拡大図に結び付けて解決しようと考え","を進めていく。","これまでの学習を振り返りながら，対","応する角の大きさや辺の長さの比に着目","する考え方，あるいは，ある１点から対応する頂点への長さの比を等しくする考え方，下絵に描かれた方眼の一辺の長さを旗のサイズに応じて拡大していく考え方など多様な考え方があったことを確認する。そこで描きたい形によってそれぞれの考え方の長所・短所を考えていくことになる。そして，どのようにしたら描けるかをクラスで話し合い，みんなで協力しながら大漁旗を描く活動へと結びつけていく。他の例として，第２学年の生活科「町探検」の学習に関連して，６年生が２年生の教室に模造紙数枚分の掲示用の地図をかいてあげる場面がある。","プリントに示された地図を拡大図にするためにはどうすればよいかを考え，方眼を利用して拡大図をかいた学習を生かし，「模造紙にもマス目があるから，このプリントにも同じようにマス目をかいたら拡大図をかくことができるのではないか」と見通しを立てる。","辺の長さの比が等しくなることや，角の大き","さは変わらないといった学習内容を用いながら","かいていく。","また，国語や総合的な学習の時間でつくるよ","うなパンフレットやリーフレットに縮図を用い","て挿絵をかくといった場合にも，小さい方眼を","かき，それを使って縮図をかくような活動も考","えられる。","このように，他教科等の学習も含めて生活場面で縮図や拡大図の学習を生かす活動を設け，そのよさを感じ，進んで生活に生かそうとする態度の育成を目指す。","イ  算数の学習場面から算数の問題を見いだして解決し，解決過程を振り返り統合的・発展的に考察する活動","これまでの学習経験を踏まえて，児童が算数の問題に主体的に関わり自ら問題を見いだし，既習事項を基にして問題解決を行い，その結果や方法を振り返るとともに統合的・発展的に考察することで算数を創り出していくことが期待される。","算数の学習場面から自ら問題を見いだすためには，事象を観察するとともに既習事項との関連を意識させるなどして問題解決の思考対象を明確にすることが大切である。また，これまでの学習で使用してきた具体物，図，数，式，表やグラフなどを活用して問題解決し，その結果や方法を振り返りそれを統合的・発展的に捉え直すなどの考察も重要である。これらによって数学的な見方・考え方を成長させるとともに自ら算数を学び続け，算数を創ることの楽しさを実感できるようにする。第６学年における「算数の学習場面から算数の問題を見いだして解決し，解決過程を振り返り統合的・発展的に考察する活動」として，例えば次のような活動が考えられる。","計算の意味を統合的に考察する活動～分数の乗法～","この活動は，「Ａ数と計算」の（1）の指導における数学的活動であり，整数の乗法や小数の乗法の意味や計算の方法に着目することで，乗法の意味を拡張したり統合的に捉え直したりすることをねらいとするものである。","児童は第５学年において，乗数が小数である場合の乗法について考え，乗法の意味の拡張を経験している。ここではこれらの経験を踏まえて，乗数が分数の場合について考えていくようにする。","例えば，１ｍの値段が120円のリボンの ｍ分の値段を求めることについて考５","える場面で，児童は次のような数学的活動を遂行すると考えられる。","この場面では，120× と立式したとき「リボンの長さが分数の場合でも値段を５","求めることができるだろうか」と考えるだろう。実際，この場合は， ｍ分の値５","段を求めて４倍すれば値段は求めることができる。120÷５×４＝96と，96円であることを導き出すだろう。","このとき「120× と式を立ててよいのだろうか」という問いをもつことも考え５","られる。","ｍ＝0.8ｍなので，同じリボンが0.8ｍ分の値段を求める場合を振り返り，こ５","のことを基に類推して，乗数が分数の場合についても乗法が成り立つことについて説明しようという見通しをもつ。","児童は，第５学年で，乗数が小数である場合の乗法について，例えば，１ｍの定価120円のリボン２ｍ分の値段を 120円","求める考えを言葉や図や式を用い","て表し，それを拠り所にして，0.8","ｍ分の値段を求める方法について","考えてきた。その際，リボン２ｍ","分を求める式が120×２と表させ ０ 0.8 １ ２（ｍ）ることから，同じリボン0.8ｍ分が120×0.8が成り立つことを考え説明する学習を行ってきている。また，比例関係についても，理解を深めてきている。","そこで，ここでも，「１ｍ120円","120円","のリボンが，２ｍなら120×２と","表した。 ｍの場合も120×","と表す。というのは， をかける","ということは， に当たる大きさ","を求めることだからである。」と","０ １ ２（ｍ）かけ算の意味を確認していくだろ","う。","このように，例えば，「なぜ，小数で使えた方法を分数に使ってもよいのか」「そもそも乗法とはどういう計算なのか」などの問いをもって立ち止まって考えることが大切である。","このような活動を重ねることによって，乗数が整数や小数の場合と乗数が分数の場合とを統合的にみるなどにより，数学的な見方・考え方を豊かで確かなものにしていく。また，学んだことを振り返って考えようとする態度を養うとともに，類似の事柄をつなげて考えることによって新しい考え方を生み出していこうとする態度を養うようにする。","比例の関係を発展的に考察する活動～比例～","この活動は，「Ｃ変化と関係」の（1）の指導における数学的活動であり，数学的な見方・考え方を働かせて二つの数量の関係を考察し，乗法の式で表されたほかの場面についても比例であるかどうかを発展的に考えていくことをねらいとしている。例えば，直方体の水そうに水を入れていき，水の量と水の深さの関係を調べる場面において，児童は次のような数学的活動を遂行することが考えられる。","そして，上の表のように整理できたら，表から分かることを考えていく。","「表を横にみると，第５学年の時の学習から比例していることが分かります。」","「表を縦にみて，きまりを考えてみました。表にはない水の量が１dLのときの深さは，横の関係から0.8になることが分かるので，0.8×（水の量）をすると，深さが分かります。」","「それなら，その関係を式にできそうです。水の量をx（dL），深さをy（cm）とするとy＝0.8×xとなります。」","「式にすると，表にないところの組も見付けられます。」","表から数量の関係を考えていく時にこのように表の数値を横に関連付けて変化の特徴をみたり，縦に関連付けて対応の特徴をみたりすることは，第４学年からの学習を生かす場である。","一方，算数の学習で学んだことを振り返り，それを統合的・発展的に捉え直す場を設けていくことも大切である。例えばここでは，比例関係を表した式を振り返り，既習と関連付けて考えていくことが考えられる。","例えば，「y＝0.8×xというような式は，これまでの学習と関連付けられないかな。」という問いである。","「（円周）＝（直径）×3.14 というのと似ているように思います。」","「0.8でなくても，かけ算でよいなら，たくさんあります。面積の公式などです。」「では，九九の場面や，分数のかけ算の場面も，かけ算だから比例になるのだろうか。」このようにして，比例として学習していない既習の場面を数量の関係を考察する対象として捉え直していく。そして，比例で学習した表や式，グラフを根拠に次のように説明をしていくことが考えられる。","「私は，（円周）＝（直径）×（円周率）の公式で調べてみました。表にすると直径が２倍，３倍，…になると，円周も２倍，３倍，…になっていたので，比例であることが分かり，またグラフに表してみると，次のようになって水の量と深さのときのグラフと同じであることが分かりました。」","「ぼくは，５年生の時に学習した速さに関する式で，（長さ）＝（速さ）×（時間）が比例するかどうかを調べました。これは，y＝0.8×xと比べると，（長さ）と（速さ）が比例しているとも，（長さ）と（時間）が比例しているとも考えられます。」","第６学年で比例を学習することは，このようにこれまで学習してきたかけ算に関する学習内容が全て比例の関係を表しているという見方で統合的にみることができることにつなげることができるということである。","ウ  問題解決の過程や結果を，目的に応じて図や式などを用いて数学的に表現し伝え合う活動","これまでの数学的活動を踏まえて，これまでの学習で使用してきた図や式などを活用して自ら取り組んでいる問題解決の過程やその結果を分かりやすく表現し，他者と伝え合うなど対話的に学ぶことを目指す。問題解決における思考の過程や判断の結果などを数学的に表現するためには，解決の目的に適した図や式などを用いて的確に表現する必要がある。そこでは数学的に表現することと数学的に表現されたものを説明することを対にして考えることが大切である。また，思考した過程や結果などを数学的な表現を用いて伝え合う機会を設け，数学的に表現することのよさを実感できるようにすることも大切である。さらに，対話的に伝え合うことにより，お互いの考えをよりよいものにしたり，一人では気付くことのできなかった新たなことを見いだしたりする機会が生まれることを経験できるようにする。","第６学年における「問題解決の過程や結果を，目的に応じて図や式などを用いて数学的に表現し伝え合う活動」として，例えば次のような活動が考えられる。","データを批判的に考察した結果を表現し伝え合う活動～柱状グラフ～","この活動は，「Ｄデータの活用」の（1）の指導における数学的活動であり，統計的に問題解決した一連の活動を振り返り，集めたデータや分析や判断の仕方，結論に問題点や誤りはなかったかどうかを検討することができるようにすることをねらいとしている。","統計的な問題解決活動においては，データを集める際の対象に偏りがあったり，アンケートの聞き方によって回答結果が歪められてしまったりする場合があり，また分析して見いだされたデータの特徴や傾向についても，観点を変えると異なる特徴や傾向が見いだされてしまうこともある。そのためデータの収集方法に偏りなどはなかったか，分析の仕方やそこから導き出した結論は本当に妥当なものであるかどうか，振り返って検討する活動が大切である。","例えば，１組と２組の２クラスで「どちらのクラスの方が夏休みの間によく読書をしたと言えるのか」を比較する場面で，児童は次のような数学的活動を遂行すると考えられる。","それぞれのクラスの児童の夏休みの図書館での本の貸し出し冊数について調査する。それを一人ひとりそれぞれが何冊読んだのかを示す表にまとめる。","まず考えられるのは，合計の冊数で比べることである。しかし，クラスの人数が異なる場合，合計冊数だけでは比べられないので，冊数の平均値を求めてみると，１組は8.2冊で２組は8.6冊であることから，２組の方が読書冊数が多いという結論を出すことができる。","さらに，「たくさん読んでいる子もいるけど，少ない子も多いよ。」という気付きから，ドットプロットに表してみる。","「２組は，たくさん読んでいる子もいるけど，あまり読んでいない子もいます。極端に多く読んでいる子がいるから平均が高くなるのではないかな。」","「分布が横に広がりすぎていて，傾向が見えにくいです。」","そこで幾つかずつデータをまとめて度数分布を表す表を作成し，柱状グラフに表してみる。","１組の読書冊数 ２組の読書冊数","(人) (人)","０ ３ ６ ９ 12 15 18 21 24(冊) ０ ３ ６ ９ 12 15 18 21 24(冊)中央値や最頻値も求めてみるとどちらも１組の方が多くなっていたり，１組は中央値や最頻値も求めてみるとどちらも１組の方が多くなっていたり，１組は左左右対称な山型をしているのに対して，２組は冊数の多い右側に伸びていること右対称な山型をしているのに対して，２組は冊数の多い右側に伸びていることから，から，２組には他の児童よりもかなり多くの本を読んだ児童がわずかにいること２組には他の児童よりもかなり多くの本を読んだ児童がわずかにいることで平均値で平均値は大きくなり，２組全体としてはそれほど読んでいないことを柱状グラは大きくなり，２組全体としてはそれほど読んでいないことを柱状グラフで確認すフで確認することができる。","こるのこ結と論がをでき受るけ。て，２組の方が読書冊数が多いという結論についても再考しようと すこるのこ結と論をも受考けえてら，れ２る組。の方が読書冊数が多いという結論についても再考しようことのすよるうこにとも分考析えしらたれ結る果。や結論について，別の観点から考えて検討することで，より妥当な結論について追究を深めていくことが大切である。","このように分析した結果や結論について，別の観点から考えて検討することで，また，そもそも読書冊数のデータについては，学校の図書館で借りた本だけでより妥当な結論について追究を深めていくことが大切である。","なく，市や町の図書館で借りた本を含める必要があるのではないか，総ページ数また，そもそも読書冊数のデータについては，学校の図書館で借りた本だけでなについてはどうか，本のジャンルについてはどうだったかなど，データの収集過く，市や町の図書館で借りた本を含める必要があるのではないか，総ページ数につ程についても検討する必要がある。","こいのてよはうどなうか活，動本をの通ジじャてン，ル統に計つ的いなて問は題ど解うだ決っのた過か程なやど結，果デをー安タ易のに収受集け過止程めにつるのでいはてなもく検，討す様る々必な要視が点あかるら。多面的に吟味し，より妥当な判断を下したり，問題点を 改こ善のしよてうな遂活行動しをた通りじすてる，力統が計育的成なさ問れ題る解決。の過程や結果を安易に受け止めるのさらに，自分たちの問題解決の過程を批判的に検討する活動を行うことで，第ではなく，様々な視点から多面的に吟味し，より妥当な判断を下したり，問題点を三者から提示された統計的な主張についても多面的に吟味し，その信頼性や妥当改善して遂行したりする力が育成される。","性を評価できるようになる。","さらに，自分たちの問題解決の過程を批判的に検討する活動を行うことで，第三者から提示された統計的な主張についても多面的に吟味し，その信頼性や妥当性を評価できるようになる。"]}},"bandSecs":{},"unitNote":"","items":[{"id":"sansu-1-A-1","g":[1],"area":"A","areaName":"数と計算","mark":"⑴","head":"10までの数・2けたの数のしくみ","title":"数の構成と表し方に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　ものとものとを対応させることによって，ものの個数を比べること。","（イ）　個数や順番を正しく数えたり表したりすること。","（ウ）　数の大小や順序を考えることによって，数の系列を作ったり，数直線の上に表したりすること。","（エ）　一つの数をほかの数の和や差としてみるなど，ほかの数と関係付けてみること。","（オ）　２位数の表し方について理解すること。","（カ）　簡単な場合について，３位数の表し方を知ること。","（キ）　数を，十を単位としてみること。","（ク）　具体物をまとめて数えたり等分したりして整理し，表すこと。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数のまとまりに着目し，数の大きさの比べ方や数え方を考え，それらを日常生活に生かすこと。"],"notes":null,"units":[{"u":"１０までの かず","b":"1年上","s":0},{"u":"いくつと いくつ","b":"1年上","s":0},{"u":"なんばんめかな","b":"1年上","s":0},{"u":"１０より おおきい かずを かぞえよう","b":"1年上","s":0},{"u":"大きい かずを かぞえよう","b":"1年下","s":0},{"u":"たすのかな ひくのかな ずに かいて かんがえよう","b":"1年下","s":0}]},{"id":"sansu-1-A-2","g":[1],"area":"A","areaName":"数と計算","mark":"⑵","head":"たし算・ひき算の意味（1けた＋1けた）","title":"加法及び減法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　加法及び減法の意味につい
