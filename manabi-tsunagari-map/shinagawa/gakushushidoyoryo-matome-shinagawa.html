４学年同様，第５学年においても，伴って変わる二つの数量の関係を，表や式を用いて表し，数量の間の変化や対応の特徴を考察して規則性などを見付けていく。その際，表や式を用いて表すことで，変化や対応についてのさらなる特徴を見いだしていくことも大切である。","表を用いて変化や対応の規則性などを見いだすことは，考察の基礎となる。従って，表については，第４学年から継続して第５学年においても中心的に取り扱い，表を多様にみて活用できるようにする。簡単な場合の比例の関係では，数値の間の倍関係に着目しながら，変化の規則性を捉えていく。一方が２倍になれば，それに対応して他方も２倍になっていることを見いだしたのであれば，一方が３倍になったときはどうか，一方が４倍になったときはどうかなど，その規則性が，他の数値の間においても成り立つのかを確かめることが大切である。","また，数を用いた式に表せないかと考えるなど，対応の規則性などを次第に式で考察していけるようにする。","こうして見いだされた変化や対応における規則性を生かして，問題を解決する。その際には，規則性と知りたい数量との関係を捉え，筋道を立てて考えて，求めたい数量についての結果を導いていく。さらに，関数の考えを生かして問題を解決した後に，問題解決過程を振り返り，見いだしたきまりを基に，数値を変えるなどして問題場面の条件を変更することで，変化や対応の特徴を発展的に考察することも大切である。"]},"quoteEnd":0},"sansu-5-C-2":{"page":264,"name":"異種の二つの量の割合","expl":{"intro":["第５学年では，これまでに学習した量のほかに，異種の二つの量の割合として捉えられる数量があることを学習する。異種の二つの量の割合として捉えられる数量の比べ方や表し方について理解し，その数量を求めるとともに，目的に応じて大きさを比べたり表現したりする方法を日常生活に生かすことができるようにすることを主なねらいとしている。","第５学年の速さなど単位量当たりの大きさの学習においては，基本的な量の性質をもっていない量を比較するのは初めてであるので，異種の二つの量の割合として捉えられる量を比べることの意味を十分理解できるようにすることが大切である。この意味の理解に基づいて，目的に応じて速さや人口密度などを考察する方法を工夫し，日常の事象の解決に活用することができる資質・能力の育成を目指すことが大切である。","ここで育成される資質・能力は，児童の生活に生かされるだけでなく，小学校のこれからの算数の学習や，中学校の理科における考察にも生かされるものとなる。"],"k":["ア 速さなど単位量当たりの大きさ","児童は日常生活において，人の走る速さや乗り物が移動する速さなどを，速い，遅いなどと表現して捉える経験をしてきている。速さを量として表すには，移動する長さと，移動にかかる時間という二つの量が必要になる。速さを，単位時間当たりに移動する長さとして捉えると，（速さ）＝（長さ）÷（時間）として表すことができる。例えば，時速60㎞の速さとは，１時間に60㎞の長さを移動する速さということになる。","一方で日常生活などでは，速さを，一定の長さを移動するのにかかる時間として捉えることがある。例えば100ｍ走などの競技では，100ｍを走るのにかかる時間によって速さを表している。時間が短いほど，速さが速いということになる。速さを，単位時間当たりに移動する長さとして捉えると，速いほど大きな数値が対応することになる。また，速さを，一定の長さを移動するのにかかる時間として捉えると，速いほど小さな数値が対応することになる。一般に速さについては速いほど大きな数値を対応させた方が都合がよいため，時間を単位量として，単位時間当たりの長さで比べることが多い。","二つの量の割合で捉えられる数量を比べるとき，三つ以上のものを比べたり，いつでも比べられるようにしたりするためには，単位量当たりの大きさを用いて比べるとより能率的に比べられることを理解し，単位量当たりの大きさを用いて比べることができるようにすることが大切である。例えば，米の収量を比較するのに，１a当たりの収量で比べたり，人口の疎密を比べるのに１㎢当たりの人口，すなわち人口密度を用いたりすることが，これに当たる。"],"s":["ア  異種の二つの量の割合として捉えられる数量の関係に着目し，目的に応じて大きさを比べたり表現したりする方法を考察し，それらを日常生活に生かすこと","速さなど単位量当たりの大きさの学習においては，まず，一つの量だけでは比較することができない事象に着目することが大切である。次に，そのような量は，どのようにすると比べることができるかを考えたり，数値化することができるかを考えたりすることが大切である。さらに，例えば速さであれば，単位時間当たりに移動する長さとして捉えたり，一定の長さを移動するのにかかる時間として捉えたりするなど，目的に応じた処理の仕方を工夫することが大切である。","具体的には，次のような指導を通して，異種の二つの量の割合として捉えられる量を比べることの意味を十分理解させるように指導する。","混み具合のように，一つの量，例えば人数だけに着目したのでは比べることができないし，単位となる数量が幾つ分あるかを数えるという測定の考えでも数値化することができない量があることを理解できるようにする。その場合，具体的な場面を用意して，長さや重さのような量と対比させながら，そのような量があることをできるだけ児童自身が見いだせるようにすることが大切である。","例えば，運動場が混み合っているかどうかは，運動場の面積と運動場にいる児童の人数とを組み合わせなければ決められないことなどに，長さ比べや重さ比べと対比させながら気付かせることが考えられる。","次に，このような量は，どのようにすると比べることができるか，どのようにして数値化したらよいかについて考えられるようにする。一般には，二つの量が関わっているので，その一方を揃えてほかの量で比較する方法が用いられる。これらの考えを用いるときには，二つの数量の間に比例関係があるという前提がある。また，平均の考えなども前提にしている。そこで指導に当たっては，これらのことについても着目させ，その意味を理解させていくような配慮が必要である。例えば，混み具合を比べる場合，人数と面積の二つの量が関わっている。このとき，人数を２倍，３倍，４倍，…にしたとき，面積も２倍，３倍，４倍，…すれば混み具合が変わらないことを用いて，比較するときには，どちらか一方の量，例えば面積を揃えて，もう一方の量の人数の大小で比べると比べやすいことに気付かせる。つまり10㎡の部屋に７人いる場合と15㎡の部屋に10人いる場合について混み具合を比べる際，30㎡に揃えるとそれぞれ21人と20人になるが，このように面積を揃えて人数で比べることが考えられる。"]},"quoteEnd":0},"sansu-5-C-3":{"page":266,"name":"割合","expl":{"intro":["第４学年では，簡単な場合について，ある二つの数量の関係と別の二つの数量の関係とを比べる場合に割合を用いる場合があることを知るとともに，日常の事象において，二つの数量の関係に着目し，図や式などを用いて，二つの数量の関係どうしの比べ方を考察することを指導してきた。","第５学年では，割合が小数で表される場合に考察の対象を広げ，ある二つの数量の関係と別の二つの数量の関係とを比べる場合に割合を用いる場合があることや百分率について理解するとともに，二つの数量の関係に着目し，図や式などを用いて，二つの数量の関係どうしの比べ方を考察し，日常生活に生かす力を伸ばしていくことをねらいとしている。また，割合を用いた比べ方のよさを感じて，学習や生活に生かそうとする態度とともに，考察の方法や結果を批判的に振り返り，よりよく問題解決する態度を養うことも大切である。","ここで育成される資質・能力は，第６学年の比，中学校における「数と式」領域や「関数」領域などの考察，中学校の理科における考察に生かされるものである。"],"k":["ア 割合","二つの数量の関係を，割合を用いて比べるとは，二つの数量のうちの一方を基準にする大きさ（基準量）としたときに，もう一方の数量（比較量）がどれだけに相当するのかを，比較量を基準量で割った商で比べることである。この表された数（商）が割合である。","ある二つの数量の関係と別の二つの数量の関係において，基準にする大きさが異なる場合に，割合を用いて，数量の関係どうしを比べることができる。全体と部分の大きさの関係どうし，部分と部分の大きさの関係どうしを比べる場合には，割合を用いる場合が多い。","例えば，「シュートのうまさ」を比べる場合，全シュート数と入ったシュート数という全体と部分の関係に着目したり，入ったシュート数と入らなかったシュート数という部分と部分の関係に着目したりする。以下は，「シュートのうまさ」が0.6の場合の，全シュート数と入ったシュート数の関係である。","シュートのうまさ","10回中６回入る","20回中12回入る","30回中18回入る","…","このように，0.6の割合で入る「うまさ」というのは，10回中６回入る，20回中12回入る，…などを，同じ関係とみることが必要であり，「全シュート数」と「入ったシュート数」の間の比例関係が前提となる。従って，この比較では，シュートのうまさは，差ではなく，割合でみて比べることが必要である。すなわち，「全シュート数」を基準量とし，その大きさを１として，それに対する「入ったシュート数」の割合を小数で表すことで，「シュートのうまさ」を比べていく。","第５学年では，基準量を１として，比較量を割合として小数で表すことで，資料の全体と部分，あるいは，部分と部分の関係どうしを比べる場合があることを理解し，そのような比べ方ができるようにする。","なお，割合は，「Ｂを基にしたＡの割合」，「Ｂの□倍がＡ」など，様々な表現で示されるため，割合を示す表現の中から，基準量や比較量を明確にすることも必要となる。","イ 百分率","割合では，基準とする数量の大きさを適宜決めて，それを単位として用いる。基準量を１としたときに，割合が小数で表されるとき，割合をなるべく整数で表すために，基準量を100として，それに対する割合で表す方法が，百分率（パーセント，％）である。ある二つの数量の関係と別の二つの数量の関係とを割合を用いて比べる場合，百分率による割合の表し方を理解し，百分率を求めたり，用いたりすることができるようにする。","日常の生活では，百分率は，「欠席率が15％だった。」，「定価の20％引きで買った。」というような確定的な事象の関係を表すことに用いられる。また，天気予報などで「明日の降水確率は20％である。」というように不確定な事象に関して用いられることもある。このような場合にも百分率が用いられることについては中学校で学習する。","指導に当たっては，百分率が日常生活の中で用いられている割合の便利な表現であることに気付くことができるように配慮する。また，実際の問題の場面などでは，必要に応じて電卓等を用いて，適切に処理できるように配慮することも望ましい。なお，「内容の取扱い」の（4）では，「歩合の表し方について触れるものとする」と示している。ここで取り扱う歩合の意味については，百分率の場合と関連付け，基準とする大きさを10とみて，それに対する割合を「割」で表していることなどに触れるようにする。また，歩合も，百分率と同様，日常生活の中で用いられている割合の便利な表現であることに気付くことができるよう配慮する。"],"s":["ア  日常の事象における数量の関係に着目し，図や式などを用いて，ある二つの数量の関係と別の二つの数量の関係との比べ方を考察し，それを日常生活に生かすこと","日常の事象における二つの数量の関係に着目すること","第５学年では，日常の事象において，資料の全体と部分の関係どうし，部分と部分の関係どうしを比べる場面で，二つの数量の関係に着目する。すなわち，比べる対象を明確にし，比べるために必要となる二つの数量の関係を，比例関係を前提に，割合でみてよいかを判断する。そして，二つの数量の関係に着目し，問題の条件や割合の求め方を基に，何を基準量とし，何を比較量とするかなどを筋道を立てて考える。","二つの数量の関係どうしを比べるときに，基準とする数量やその大きさをどのように決めるかは，何を目的としているかによって異なってくることが考えられる。全体の数量を基準とするか，部分の数量を基準とするか。基準とする数量を１として，それに対する割合を小数で表すか，あるいは，基準とする数量の大きさを１ではない数にして，それに対する割合を整数で表すか。また，割合を整数で表す場合であっても，基準とする数量を100として，それに対する割合で表すか，基準とする数量を10として，それに対する割合で表すか。目的に照らして，基準量やその大きさの決め方について判断をすることが大切である。","図や式などを用いて，数量の関係どうしの比べ方を考察すること","日常生活の二つの数量の関係を考察する問題場面では，全体と部分の関係どうし，あるいは，部分と部分の関係どうしの比べ方を考察して，得られた割合の大小から判断したり，割合を使って計算をした結果から問題を解決したりする。その際，考察によって得られた結果を日常の事象に戻してその意味を考え，必要に応じて考察の方法や表現方法を見直すことが大切である。","また，用いた方法や結果を振り返り，二つの数量の関係どうしを比べる場合に，どのような比べ方が適切であるかを考えることも大切である。例えば，差による比べ方や，一つの数量だけに着目する比べ方と比較することで，割合を用いて比べることの特徴やよさを考える活動を取り入れることができる。","このとき，全体と部分の関係，部分と部分の関係は，テープ図や数直線などの図，式などを用いて，明瞭，的確に表すことができる。ある二つの数量の関係と別の二つの数量の関係を割合を用いて比べるには，数量の関係を，これらの図や式などを用いて表したり，図や式から数量の関係を読み取ったりしていく。そのためには，第４学年同様，基準量と比較量をこれらの図や式に適切に表すこと，また，図や式から数量の関係を整理して捉えた上で，基準量と比較量を適切に選択し，割合を求めることが必要である。","なお，割合については全国学力・学習状況調査（『平成24年度全国学力・学習状況調査報告書』266ページ）などで課題が示されており，指導に当たっては，言葉と図や式を関連付けるような活動を取り入れることが大切である。以下は，「学級の男子と女子ではどちらの方が一輪車に乗れるかを調べた結果を表した表」から得られる数量の関係を，言葉，図，式で表したものである。","一輪車に乗れる人調べ（人）","乗れる 乗れない 合計","男子 ９ ６ 15","女子 12 ８ 20","男子の，合計の人数を基にした乗れる人数の割合","女子の，合計の人数を基にした乗れる人数の割合","９÷15＝0.6 男 子 ９人 ６人","12÷20＝0.6 女 子 12人 8人","０ 0.6 １（割合）このように，図で表した関係を式にしたり，式に表した関係を図で表したり，図や式の意味を言葉で説明したりすることが大切である。","割合を用いた比べ方を日常生活に生かすこと","日常生活では，打率やシュート率，勝率など「どちらの方が上手なのだろうか」と割合を用いて比べることがある。また，「10％の増量」「１割引」など割合を用いている場面も多くある。このように割合を用いて比べる場面などについて，児童が割合を用いて考えることができるようにする。","Ｄ データの活用"]},"quoteEnd":0},"sansu-5-D-1":{"page":271,"name":"円グラフや帯グラフ","expl":{"intro":["第４学年までに文字情報として得られる「質的データ」や数値情報として得られる「量的データ」，時間変化に沿って得られた「時系列データ」について表にまとめたり，グラフに表したりすることでデータの特徴や傾向を捉えることを学習してきている。","第５学年では，目的に応じたデータの収集や分類整理，表やグラフの選択など，一連の統計的な問題解決ができるようになることや，結論について多面的に捉え考察することができるようになることをねらいとしている。またその過程を通じて，質的データや量的データについて全体と部分，部分と部分の間の関係を調べると特徴を捉えやすい事象があることに気付かせ，割合を示す円グラフや帯グラフに表したり，それを読み取ったりすることをねらいとしている。","この内容は，第６学年での量的データに関する分布の中心や散らばりについての学習の素地となるものである。"],"k":["ア 円グラフや帯グラフの特徴と用い方","円グラフも帯グラフも，事象にある数量の関係を割合で捉え，基準量と比較量との関係をグラフとして表したものである。","円グラフは，データを分類整理した際の各項目の割合に対応させて，円をおうぎ１  １","形に区切って表したグラフのことである。 や といった割合を捉えやすいとい２   ４","う特徴がある。なお，円グラフについては，10等分又は100等分の目盛りの入った用紙を用いる。","帯グラフは帯状の長方形を割合に対応させて幾つかの長方形に区切って表したものである。「内容の取扱い」の（5）では，「複数の帯グラフを比べることにも触れるものとする。」と示している。複数のデータについて項目の割合を比較するには，帯グラフが便利である。例えば，ある項目間の比較について，年次変化を合わせて分析する場合などである。ただし，複数の帯グラフを用いる際には，各帯グラフの合計が異なっている場合があり，そのような場合には割合が小さくなっていても実際のデータとしては大きいなど，見た目では比較ができない場合があるため注意がある必た要めであ注る意。が 必要である。","右 の右図のは図，は，平平成成25年25度年全度国全学国力学・","学習力状・学況習調状査況小調学査校小算学数校Ｂ算の数５Ｂのの例","であるが，平成22年と23年について，","5の例であるが，平成22年と23","インターネットを利用して貸し出す","年について，インターネットを利","割合は同じ60％であるが，合計冊数","用して貸し出す割合は同じ60％","が異なっているため，それぞれの年","であるが，合計冊数が異なってい","のインターネットを利用して貸し出","したる本たのめ，冊そ数れはぞ異れなのっ年てのいイるン。ター","ネ(ッｲ)トを統利計用的しなて問貸題し解出決しのた方本法の","第５学年では，身の回りの事象に","冊数は異なっている。","ついて，その事象の因果関係や傾向","イ 統計的な問題解決の方法","を漠然と捉えるだけでなく，データに基づいて判断する統計的な問題解決の方法第５学年では，身の回りの事象について，その事象の因果関係や傾向を漠然と捉を知り，その方法で考察していくことができるようにする。","えるだけでなく，データに基づいて判断する統計的な問題解決の方法を知り，その統計的な問題解決とは，以下に述べる「問題－計画－データ－分析－結論」と方法で考察していくことができるようにする。","いう五つの段階を経て問題解決することである。","① 統身計的のな回問り題の解事決象とにはつ，い以て下，に興述味べ・る関「心問や題問—題計意画識—デにー基タづ—き分，析統—計結的論に」解と決いう可五能つのな段問階題をを経設て定問す題る解こ決とすることである。","② 見通しを立て，どのようなデータを，どのように集めるかについて計画を①  身の回りの事象について，興味・関心や問題意識に基づき，統計的に解決可立てること","能な問題を設定すること","③ データを集めて分類整理すること，","②  見通しを立て，どのようなデータを，どのように集めるかについて計画を立④ 目的に応じて，観点を決めてグラフや表に表し，データの特徴や傾向をつてること","かむこと","⑤ 問題に対する結論をまとめるとともに，さらなる問題を見いだすこと","その際には，自分たちが学習した分析手法の中でどれを用いて分析するかを計③  データを集めて分類整理すること","④  目的に応じて，観点を決めてグラフや表に表し，データの特徴や傾向をつかむこと","⑤  問題に対する結論をまとめるとともに，さらなる問題を見いだすこと","その際には，自分たちが学習した分析手法の中でどれを用いて分析するかを計画の段階で視野に入れたり，分析に合わせたデータの集め方などを考えたりすることも大切である。","また，得られた結論の意味や妥当性，問題解決の各段階が適切であったかについて，振り返って考え直す態度を養うことにも留意する。"],"s":["ア  目的に応じてデータを集めて分類整理し，データの特徴や傾向に着目し，問題を解決するために適切なグラフを選択して判断し，その結論について多面的に捉え考察すること","目的に応じてデータを集めて分類整理すること","目的に応じてデータを集めて分類整理するためには，児童にとって身近な興味や気付きなどから，判断や考察したい事象を問題場面として設定できるようにすることが大切である。例えば「このクラスは風邪をひいている人が多い。」という気付きがあるとする。そこから，「自分たちの学校で風邪をひいている人が多いのは何年生なのか。」というような問題として設定できるようにし，解決する目的を明確にもてるようにする。","まず，問題を解決するために，データを集める計画を立てる。データの集め方に関して「かぜをひいている・ひいていない・かぜがなおった」のように，どんな選択肢を用意するのか，風邪をひいた回数までたずねるのか，といった点についても，分析を見通した計画を考えられるようにする。そして，第４学年までの学習を生かしながら，分類の観点を決め，データを整理する。","データの特徴や傾向に着目し，問題を解決するために適切なグラフを選択して判断すること","集めたデータを分析するに当たり，データの種類や項目の数を考え，目的に応じて，これまでに学習してきている簡単な表や二次元の表，棒グラフ，折れ線グラフ，円グラフ，帯グラフといった表現から適切なものを選択して表してみることで，データの特徴や傾向をつかみ，判断していくようにする。","例えば，「学年によって風邪をひいている児童の割合はどのように違うのか。」ということが問題であれば，学年別に風邪をひいている児童の割合を整理し，それを複数の帯グラフに表して並べてみることで，割合の違いを明確に捉えることができる。そうして，「風邪をひいている児童の割合は〇年が他の学年より明らかに大きい。」というような判断ができる。","結論について多面的に捉え考察すること","自分たちが出した結論やデータについて，別の観点から見直してみることで，異なる結論が導きだせないかどうかを考察できるようにする。そのためには，割合でみていたものを量で見直してみたり，観点を変えて整理し直してみたりすることが必要となる。","上の例では，風邪をひいている児童の割合が大きい学年が３年生だったとしても，風邪が治った人も併せると５年生の割合のほうが大きかった場合に，風邪をひいた人が多いのは３年生であると結論付けてよいのかどうかを再度検討してみることが考えられる。"]},"quoteEnd":0},"sansu-5-D-2":{"page":274,"name":"測定値の平均","expl":{"intro":["測定について，対象の大きさや測る目的によって適当な計器や単位を選ぶこと，目盛りの読み，測定値の表し方などの基本的な事柄は，第４学年までに指導してきている。","第５学年では，測定した結果について，平均を用いて，それを妥当な数値として示すことができるようにすることをねらいとしている。","測定する場合に，概測によりおよその大きさを捉えておくことは，測定に対する見通しを立て，測定の結果の誤りを少なくする上でも，適当な計器や単位を選択する上でも必要なことである。計器の目盛りを読み取って測定値を出す場合には，その目盛りが最小目盛りのどれに一番近いかによって末位を丸めたり，最小目盛りの間を目分量で10等分などして末位を決めることになり，その値が近似値になることを指導する。"],"k":["ア 平均の意味","平均については児童が形式的に計算できればよいというのではなく，その意味を理解することが必要である。測定した結果を平均する方法については，多いところから少ないところへ移動しならすという方法や，全てを足し合わせたのち等分するという方法が考えられるが，それらの方法と平均の意味を関連させて理解できるようにする。","また，測定には必ず誤差が伴うことに気付かせ，それを考慮に入れた測定値の平均についても指導する。一般に，一つのものの測定値として幾つかの数量があったとき，それらを同じ大きさの数量にならすことでより妥当な数値が得られる場合がある。そこで，測定値を平均する考えを用いることを指導する。測定値を平均するのは，測定する対象がもつ真の値に近い値を得るためである。","例えば，ある三角形の周りの長さを調べるために，何人かの児童が三つの辺の長さを測るとする。すると，１㎜より細かくは物差しで測れないので誤差が生じることがある。そこで，何人かの児童が調べた結果を平均することで，真に近い値を得ようとする。また，歩測によってある長さを調べる場合，その処理方法としては，何度か往復して歩数を何回か測り，これを平均したものが用いられる。","その際，飛び離れた値や，予想外の値があった場合にそのわけを調べさせ，場合によっては，それらを除いて平均を求めたりすることなども考えられるようにする。測定値を平均することは，日常生活だけでなく理科などでも活用して用いられるようにする。","なお，測定値を使って計算するときには，答えの数の桁数を，測定値の桁数より多く出してもあまり意味がないことから，元の測定値の桁数程度にとどめるのが普通である。"],"s":["ア  概括的に捉えることに着目し，測定した結果を平均する方法について考察し，それを学習や日常生活に生かすこと","何らかの対象を測定した際に，適当な計器を用いて正しく測った場合でも測るたびに測定値が若干異なっていたり，人によって値が異なったりすることがある。それらの値は真の値に近いものが得られていることは予想でき，また，多く得られている値がおそらく真の値に近いだろうということも予想できるはずである。そこから，得られた測定値を平均してみるということをすれば，集めた測定値のほとんどを生かすことができ，より信頼できる値を求めることができる。","測定した結果を平均する方法については，多いところから少ないところへ移動させならすという方法や，全てを足し合わせたのち等分するという方法が考えられ，これらの方法について考察し，平均の考えを理科の学習をはじめ，日常生活に生かすことができるようにする。"]},"quoteEnd":0},"sansu-6-A-1":{"page":286,"name":"分数の乗法，除法","expl":{"intro":["第５学年までに，整数及び小数の四則計算について，計算の意味に着目し，計算の仕方を考えたり，それらを日常生活に生かしたりすることを指導してきた。また，分数の加法及び減法について，分数の意味や表現に着目し，計算の仕方を考えることを指導してきた。","第６学年では，分数の乗法及び除法の計算の仕方を考え，それらの計算ができるようにすることや数の意味と表現，計算に関して成り立つ性質に着目し，多面的に捉え，計算の仕方を考える態度や能力を高めることが主なねらいである。この学習は小学校において学ぶ数についての四則計算のまとめとなる。","ここで育成される資質・能力は，中学校数学における「負の数」「無理数」といった数を拡張したときの計算の考察などに生かされるものである。","なお，「内容の取扱い」の（2）では，「第３学年から第６学年までに示す小数や分数の計算の能力を定着させ，それらを用いる能力を伸ばすことに配慮するものとする」と示している。計算を用いる能力には，基礎的・基本的な計算の技能に習熟することや，計算を生活や学習に活用することなどが含まれる。これまでに児童が身に付けてきた計算の技能は，生活や学習で必要となる計算の基になるものであるし，また，より複雑な計算を進めるための基になるものでもある。"],"k":["ア 分数の乗法及び除法の意味","分数の乗法及び除法の意味については，整数の乗法及び除法から小数の乗法及び除法へと拡張された乗法及び除法の意味を適用できるように指導する。すなわち，小数の乗法及び除法の計算の考え方を基にして，乗数や除数が分数の乗法及び除法の意味について理解できるようにする。","乗法の意味は，基準とする大きさとそれに対する割合から，その割合に当たる大きさを求める計算と考えられる。Ｂを「基準にする大きさ」，ｐを「割合」，Ａを「割合に当たる大きさ」とするとき，Ｂ×ｐ＝Ａと表すことができる。","除法の意味は，割合を求める場合（Ａ÷Ｂ＝ｐ）と基準にする大きさを求める場合（Ａ÷ｐ＝Ｂ）の二つが考えられるが，いずれにしても乗法の逆であると捉えられるようにする。","イ 分数の乗法及び除法の計算","第６学年では，分数の乗法及び除法の計算ができるようにする。","「内容の取扱い」の（1）に示す逆数については，除法の計算は逆数を用いること２ ３","によって乗法の形に置き換えることができることを指導する。例えば， ÷ の５ ４","計算は，除数の の逆数は であることから， × と表すことができる。","また，整数や小数の乗法や除法を分数の場合の計算にまとめることも指導する。５ １ ３ ５×１×３","例えば，５÷２×0.3＝ × × ＝ と分数の形にまとめて表すこと１ ２ 10 １×２×10","ができる。","分数の計算については，真分数や仮分数の計算を中心に扱い，帯分数を含む計算については児童の実態によって扱うものとする。分数の乗法及び除法については，帯分数で表すよりも仮分数で表す方が計算を進めやすくなる。このことに児童が気付くことができる程度でよい。いたずらに複雑な計算を指導するのではなく，分数の計算を生活や今後の学習へ活用できるようにすることを重視する必要がある。","ウ 計算に関して成り立つ性質の分数への適用","分数についても，整数や小数の場合と同じように交換法則，結合法則，分配法則が成り立つことを理解できるようにする。","また，乗数が２倍，３倍，４倍，…になると積も２倍，３倍，４倍，…なるという乗法の性質がある。また，除数及び被除数に同じ数をかけても，同じ数で割っても商は変わらないという除法の性質がある。こうした性質が，分数の乗法及び除法についても成り立つことを理解できるようにする。"],"s":["ア  数の意味と表現，計算について成り立つ性質に着目し，計算の仕方を多面的に捉え考えること","分数の乗法及び除法については，分数の意味や表現に着目したり，乗法及び除法に関して成り立つ性質に着目したりして，分数の乗法及び除法について多面的に捉えて，計算の仕方について，児童が工夫して考え出せるようにする必要がある。a １","分数の意味や表現に着目することとは，分数の意味に基づいて を ×aと捉b b","a a","えたり，a÷bを とみたり をa÷bとみたりするなど分数を除法の結果と捉えb b","たりすることなどである。","４例えば，分数の意味と表現に着目して，乗数を単位分数の幾つ分とみると，","× という分数の乗法を次のように計算することができる。","４ ２ ４ １ ４ ４×２ ８","× ＝ × ×２＝ ÷３×２＝ ＝","５ ３ ５ ３ ５ ５×３ 15","また，乗数の を２÷３の結果とみると，次のように求めることができる。","４ ２ ４ ４×２ ８","× ＝ ×２÷３＝ ＝","５ ３ ５ ５×３ 15","計算に関して成り立つ性質に着目することとは，乗法に関して成り立つ性質や除法に関して成り立つ性質，交換法則，結合法則などの四則に関して成り立つ性質に着目することである。","例えば，除法に関して成り立つ性質を用いると， ÷ という分数の除法を次５ ４","のように計算することができる。","２ ３ （２ ）（３ ）（２ ） ２×４ ８","÷ ＝ ×４ ÷ ×４ ＝ ×４ ÷３＝ ＝","５ ４ ５ ４ ５ ５×３ 15","また，","２ ３ （２ ４）（３ ４）（２ ４） ２ ４ ２×４ ８÷ ＝ × ÷ × ＝ × ÷１＝ × ＝ ＝","５ ４ ５ ３ ４ ３ ５ ３ ５ ３ ５×３ 15","と求めることもできる。","なお，このように計算に関して成り立つ性質などを用いて計算の仕方を考えることは，抽象度が高く，児童によっては分かりにくいということがある。そういう場合は，適宜，面積図などの図を用いて考えさせることも大切である。","このように，数の意味と表現，計算に関して成り立つ性質に着目することで，多面的に捉えて，筋道を立てて計算の仕方を考えるなどして，数学的な見方・考え方を伸ばしていくよう指導する。"]},"quoteEnd":0},"sansu-6-A-2":{"page":289,"name":"文字を用いた式","expl":{"intro":["第５学年までに，変わり方や計算法則などを式に表す場面などで，数量の関係に着目し，言葉や□，△などの記号を用いて式に表すことを経験してきている。","第６学年では，これまで学習してきたことを基に，a，xなどの文字を使って未知の数量や任意の数を表すとともに，数量の関係に着目し簡潔かつ一般的に式に表したり，式から具体的な事柄を読み取ったりして考察できるようにする。また，文字に順序よく数を当てはめて答えを求めるなど，問題解決に文字を用いた式を活用することで，数量の関係や自分の思考過程を簡潔に表現できるよさに気付き，進んで生活や学習に活用できるようにする。","文字の使用については，第６学年全体を通じて少しずつ活用場面を広げていき，中学校における文字式の学習の素地を養うことが大切である。"],"k":["ア 文字を用いた式","第５学年までに変化の仕方や計算法則など，数量の関係を言葉の式に表したり，未知数や変数などを□，△などを用いて式に表したりしてきている。この理解の上に，第６学年では，数量を表す言葉や□，△などの代わりに，a，xなどの文字を用いて式に表し，文字の使用に次第に慣れることができるようにする。その際，数を当てはめて調べる活動などを通して，文字には，小数や分数も整数と同じように当てはめることができることを理解する。","文字が未知の数量を表す場合について，その処理の仕方は，□や△を用いた場合と同様である。文字が表す未知の数量を求めるためには，逆算をしたり，文字に順序よく数を当てはめたりして考察する。","文字が変量を表す場合については，二つの数量の関係を二つの文字を用いた式に表す。一方の文字に当てはめる数を決めたときの，他方の文字に当てはまる数を求めることができるようにする。","また，計算法則などを文字を用いた式に表すこともある。この場合はいろいろな数を文字に当てはめて式が成り立つことを確認する。","なお，比例や反比例の学習では，中学校では定数としてaという文字を扱うことがあるが，定数としての文字については中学校で扱う。","このような経験を積み重ねることで，以降の学習や中学校数学でも，文字を用いた式を積極的に活用していける素地を養うようにする。"],"s":["ア  問題場面の数量の関係に着目し，数量の関係を簡潔かつ一般的に表現したり，式の意味を読み取ったりすること","第６学年では，数量を表す言葉や□，△などの代わりに，a，xなどの文字を用いて式に表し，数量の関係を簡潔にしかも一般的に表現できるようになることが大切である。","そして，文字を用いて表した式について，具体的な事柄を読み取ったり，文字に順序よく数を当てはめたりして，問題解決に生かすようにする。例えば，底辺の長さが４㎝の平行四辺形がある。この平行四辺形の高さをa㎝，面積をb㎠として，平行四辺形の高さと面積の数量の関係を式に表すと，４×a＝bと一般的に表すことができる。この式から，高さが決まると面積も決まることや，高さと面積が比例関係になっていることを読み取らせることが大切である。","文字には，整数だけでなく，小数や分数も当てはめることができることに着目し，数の範囲を拡張して考えることができるようにする。","Ｂ 図形"]},"quoteEnd":0},"sansu-6-B-1":{"page":291,"name":"縮図や拡大図，対称な図形","expl":{"intro":["第５学年では，図形の合同については，図形間の関係に着目し，与えられた図形と合同な図形を構成する活動を通して，二つの図形が合同になることについて考察してきた。","第６学年では，縮図や拡大図，並びに，図形の対称性の見方を指導する。","縮図や拡大図については，二つの図形間の関係に着目し，合同についての考察を基に，二つの図形が拡大，縮小の関係にあるのかについて考察する。","また，対称な図形については，図形を構成する要素どうしの関係に着目し，対称性といった観点から図形の性質を考察していくことをねらいにしている。さらに，対称性といった観点から，既習の図形を捉え直すとともに，その性質を日常生活に生かすことをねらいにしている。対称性については，既に低学年から図形を取り扱う際に，例えば，第３学年で二等辺三角形は底辺の垂直二等分線を折り目にして折り重ねたときにぴったり重なるなど，具体的な操作に関連して着目してきている。第６学年では，観察や構成，作図などの活動を通して，均整のとれた美しさ，安定性など，図形のもつ美しさにも着目できるように指導する。上記のような観点から図形の理解を深め，図形に対する感覚を豊かにすることができるようにする。","なお，〔用語・記号〕では，線対称，点対称，対称の軸，対称の中心という用語を示している。これらの用語を用いて説明したり，表現したりできるようにすることが大切である。"],"k":["ア 縮図や拡大図","ア二つ知の識図及形びが技形能も大きさも同じであるときに合同という。縮図や拡大図は，大き(ｱ) 縮図や拡大図","さを問題にしないで，形が同じであるかどうかの観点から図形を捉えたものである。二つの図形が形も大きさも同じであるときに合同という。縮図や拡大図は，互いに縮図や拡大図の関係にある図形については，その対応している角の大きさはきさを問題にしないで，形が同じであるかどうかの観点から図形を捉えたもの全て等しく，対応している辺の長さの比はどこでも一定である。","ある。互いに縮図や拡大図の関係にある図形については，その対応している角実際に，縮図や拡大図をかくに当たっては，次の図のように方眼の縦，横の両方大きさは全て等しく，対応している辺の長さの比はどこでも一定である。","の向きに同じ割合で縮小，拡大したものを用いる場合や，一つの頂点に集まる辺や実際に，縮図や拡大図をかくに当たっては，次の図のように方眼の縦，横の対角線の長さの比を一定にしてかく場合がある。このような縮図や拡大図の意味や方の向きに同じ割合で縮小，拡大したものを用いる場合や，一つの頂点に集ま特徴について，作図することを通して理解できるようにする。","辺や対角線の長さの比を一定にしてかく場合がある。このような縮図や拡大図意味や特徴について，作図することを通して理解できるようにする。","２倍の拡大図","－の縮図","Ｄ","２倍","Ａ","Ｂ","－１ Ｃ","(ｲ) 対称な図形","対称性については，一つの図形について，線対称，点","イ 対称な図形","対称性については，一つの図形について，線対称，点","対称の二つの観点から考察できることを理解する。","線対称な図形とは，１本の直線を折り目として折った","とき，ぴったり重なる図形をさす。そのとき，対応する","点を結ぶ線分は，全て折り目にした直線によって垂直に","二等分される。この直線を対称の軸という。","点対称な図形とは，一つの点Ｏを中心にして180度回","転したときに重なり合う図形である。そのとき，対応す","る点を結ぶ線分は全て，中心にした点Ｏを通り，その中","心によって二等分される。この中心のことを対称の中心","という。","このような線対称，点対称の意味について，観察や構成，作図などの活動を通して理解できるようにし，線対称な図形，点対称な図形，線対称かつ点対称な図形を弁別するなどの活動を通して，図形の見方を深めることが大切である。"],"s":["ア  図形を構成する要素及び図形間の関係に着目し，構成の仕方を考察したり図形の性質を見いだしたりするとともに，その性質を基に既習の図形を捉え直したり日常生活に生かしたりすること","図形間の関係に着目し，構成の仕方を考察すること","第５学年では，二つの図形の関係について，辺の長さ，角の大きさが全て同じになる合同について学習してきた。第６学年では，大きさは異なるが，形が同じに見える図形について考察する。このような形が同じ二つの図形において，構成する要素の関係はどうなっているかを調べることになる。角の大きさに着目すると，二つの図形では全ての角の大きさが一致していることが分かるが，辺の長さに着目すると，長さは一致していないことが分かる。ここで，「同じ」をどのように捉え直すかが重要な論点となる。線分の長さの比に着目し，それが同じかどうかによって，同じ形かどうかを取り決めすることになる。そして，対応している角の大きさが全て等しく，対応している辺の長さの比がどこでも一定であることを見いだしていく。そしてこれを活用することで，縮図や拡大図をかくことが可能になる。","図形を構成する要素に着目し，図形の性質を見いだすこと","図形の性質を調べるには，その図形を構成する要素に着目し，それらの関係を考察していくことになる。第６学年では，辺の長さや角の大きさの相等関係について考察し，図形の性質を見いだしていくことになる。","例えば，ある直線に関して，左右両側が同じに見える図形がある。これを確かめるには，一本の直線を折り目にして二つに折ってみて，折り目の両側の形がぴったり重なるかどうかを確かめればよい。この行為は，図形を構成する要素に着目すると，一本の直線に対して両側にある，対応する点，対応する辺の長さ，対応する角の大きさがぴったり重なり合っていること，言い換えると合同になっていることを意味する。このように，一本の直線に対して両側にある，対応する点，対応する辺の長さ，対応する角の大きさが同じであるかどうかに着目することは，図形の性質（線対称）を見いだすための一つの着眼点となる。","また，左右両側が同じに見えるのに，一本の直線を折り目にして二つに折ってみても，重ならない図形がある。このような図形の中には，直線で折るのではなく，ある１点を中心に180度回転させてみることで，点，辺の長さ，角の大きさがぴったり重なり合う図形がある。このような図形では，ある１点を中心に180度回転させたとき，対応する点，対応する辺の長さ，対応する角の大きさが同じであるかどうかに着目することが，図形の性質（点対称）を見いだすための一つの着眼点となる。この線対称，点対称の性質を活用することで，線対称，点対称な図形を作図することが可能になる。","図形の性質を基に既習の図形を捉え直すこと","対称性については，既習の三角形，四角形，さらには，正多角形について，線対称な図形，点対称な図形，線対称かつ点対称な図形を弁別し，既習の図形を対称性といった観点から捉え直すことが大切である。例えば，線対称という観点から三角形をみると，二等辺三角形と正三角形を線対称な図形と捉えることができる。また，点対称という観点から四角形をみると，平行四辺形，ひし形，長方形，正方形を点対称な図形と捉えることができる。","図形の性質を日常生活に生かすこと","縮図や拡大図においては，日常生活にも活用されており，どのようなところで，どのように活用できるかを探ることが大切である。そして，縮図や拡大図では，対応する角の大きさが全て等しく，対応する辺の長さの比がどこでも一定であることを活用することで，日常生活の問題解決に生かしていけるようにする。","例えば，縮図や拡大図が，コピー機，地図，設計図，顕微鏡による像，写真，映画など，日常生活の中でいろいろと活用されていることに着目させたり，身の回りに見られる合同な図形が敷き詰められた床や壁などの模様から縮図や拡大図を見付けたりさせる。さらに，縮図や拡大図の考え方を活用する場面として，木の高さのように測定しにくい部分を測定しやすい影の長さを測って求めさせたり，比との関連で，地図上でｌ：100とあるのは地図上の１㎝が実際の１ｍを表していることから，地図上の長さから実際の長さを計算で求めさせたりする活動を通して，進んで生活に生かそうとする態度が育成されるようにする。例えば，学校のプールの図と縮尺を基にして，実際のプールの長さを計算で求める活動がある。","対称性については，身の回りから対称な図形を見付ける活動を通して，図形のもつ美しさや，日常生活に対称な形が用いられていることを実感的に理解できるようにすることをねらいとしている。対称な図形については，敷き詰められた図形や敷き詰められた模様などを通して，整った形の美しさとして日常生活でも見付けることができる。また，対称な図形は，植物や動物，装飾品，模様，地図記号や都道府県のマークなど，身の回りのいたるところで見られるので，それらを見付ける活動を大切にしていくようにする。"]},"quoteEnd":0},"sansu-6-B-2":{"page":295,"name":"概形とおよその面積","expl":{"intro":["第６学年の概形やおよその面積に関わる学習では，第４学年，第５学年の図形の面積の学習に基づき，概測などを用いて，測定が目的に応じて能率よくできるようにすることを主なねらいとしている。","第６学年の概形やおよその面積に関わる学習を通して，身の回りの具体的な形を，これまでに学習した図形を構成する要素や性質に着目して概形として捉えることで，筋道を立てて考える資質・能力が育成されることが大切である。そのため，身の回りの具体的な形を考察の対象として取り上げ，多様な図形の見方を働かせるようにすることが大切である。"],"k":["ア 概形とおよその面積","面積や体積を測定する対象となる身の回りにある図形は，必ずしも基本的な図形とは限らない。そこで，平面図形であれば，これまでに求積してきた三角形や四角形のように測定しやすい形と捉えたり，それらの図形に分割した形として捉えたりすることで，およその面積を測定することが可能になる。また，立体図形であれば，直方体や立方体と捉えたり，それらの立体図形に分割した形として捉えたりといった工夫をすることで，およその体積を測定することが可能になる。その際，概形を捉えることが重要な働きをする。身の回りにある形の面積や体積などについて考察する過程で，このような処理について経験を豊かにする必要がある。","なお，測定値を用いた計算に当たっては，いたずらに桁数を多く求めてもあまり意味がないことについて触れ，目的に応じて適切な桁数の計算ができるようにする。"],"s":["ア  図形を構成する要素や性質に着目し，筋道を立てて面積などの求め方を考え，それを日常生活に生かすこと","複雑な形であったり，必ずしも直線で構成されていなかったりする身の回りにある図形の面積や体積を測定する際には，これまでに学習してきた基本的な図形と対応させ，測定する見通しをもち，筋道を立てて考察することが大切である。このような筋道を立てて考察する能力を伸ばすことで，身の回りの事象に算数を活用する資質・能力を培うことができる。"]},"quoteEnd":0},"sansu-6-B-3":{"page":296,"name":"円の面積","expl":{"intro":["第５学年までに，三角形や四角形など直線で囲まれた図形の面積の求め方について指導している。また円については，円周の長さが（直径）×（円周率）で求められることを指導している。第６学年では，曲線で囲まれた図形の面積を工夫して測定する能力を伸ばすとともに，円の面積を求める公式をつくる活動を通して，算数として簡潔かつ的確な表現へと高める能力を一層伸ばすことを主なねらいとしている。"],"k":["ア 円の面積の求め方","円の面積は，（半径）×（半径）×（円周率）で求めることができることを理解し，円の面積を求めることができるようにする。ただ，単に公式を使いこなすだけでなく，第５学年までに学習してきた基本図形の面積の求め方に帰着することで，円の面積は計算によって求めることができることを理解できるようにすることが大切である。","また，公式が半径を一辺とする正方形の面積の3.14倍","を意味していることを，図と関連付けて理解できるように","する。","なお，「内容の取扱い」の（3）では，「円周率は3.14を","用いるものとする」と示しており，円の面積を求める際に","は，円周率は3.14を用いて処理することについて指導する。"],"s":["ア  図形を構成する要素などに着目し，基本図形の面積の求め方を見いだすとともに，その表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと","基本図形の面積の求め方を見いだすこと","円の面積の求め方を考える際には，面積の大きさの見通","しをもつことが大切である。例えば，円に内接したり外接","したりする正方形を基にして，円の面積は，一辺の長さが","半径に等しい正方形の面積の２倍と４倍の間にあると捉え","ることがこれに当たる。また，方眼紙に円を作図して，円","の内側にある正方形の個数を数えて，およその面積を捉え","ることもこれに当たる。","その上で，円の面積の求め方を，図形を構成する要素な","どに着目して，既習の求積可能な図形の面積の求め方を基","に考えたり，説明したりする。特に，このときに，数学的","な見方・考え方を働かせることで，図形の一部を変形した","り移動したりして，計算による求積が可能な図形に等積変","形する考えが導かれる。円の面積の求め方を考察する中で，","上記のように数学的な見方・考え方を働かせることによって，児童が自ら工夫して面積を求めることができるようにすることが大切である。","例えば半径10㎝の円の面積に","ついては，円を中心から等分して","並べ替え，平行四辺形に近い形を","作り，円の面積を求める方法が考","えられる。この場合，等分を細かくしていけば，平行四辺形に近い形の底辺は円周の長さの半分に，高さは元の円の半径に近づくことから，円の面積は次のような式で表せる。","（円の面積）＝（平行四辺形の面積）","＝（底辺）×（高さ）","＝（円周の長さの半分）×（半径）","10×２×3.14÷２ 10","10×２×3.14÷２×10＝314 314㎠","面積の求め方の表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと","円の面積の求め方を見いだしたら，式を読んで，もとの円のどこの長さに着目すると面積を求めることができるのか，振り返って考えることが大切である。","例えば，上の例では10×２×3.14÷２×10という式で円の面積を求めることができたことを基に考える。この式にある二つの10はもともと円の半径を意味していたことを振り返り，次の公式に導いていく。","（円の面積）＝（半径）×（半径）×（円周率）","なおこの公式を読むことで，円の面積が半径を一辺とする正方形の面積の3.14倍であることも気付かせることができる。"]},"quoteEnd":0},"sansu-6-B-4":{"page":298,"name":"角柱及び円柱の体積","expl":{"intro":["第６学年では，第５学年における立方体や直方体の体積の学習を踏まえ，角柱や円柱の体積について，必要な部分の長さを測り，計算によって体積を求めるという考えを基に，新しい公式を導きだし，それを用いることができるようにすることを主なねらいとしている。","そして角柱や円柱の体積について，計算による体積の求め方を考えるとともに，その表現を振り返り，簡潔かつ的確な表現に高める資質・能力が育成されることが大切である。その際，考察の対象となる，空間図形と既習の図形の面積の求め方を関連付けて図形の見方を働かせ，体積の求め方を考えたり，公式を導いたりする過程を繰り返すことで，上記の資質・能力を伸ばすようにすることが大切である。"],"k":["ア 角柱及び円柱の体積の求め方","角柱，円柱の体積については，第５学年で指導した立方体，直方体の場合の体積の求め方を基にして，これらの立体の体積も計算によって求めることができることを理解することが大切である。","直方体の体積は，一辺が１㎝の立方体を基にして（縦）×（横）×（高さ）で求めてきたが，ここでは，（底面積）×（高さ）と捉え直していく。そのことを基にして，角柱や円柱の体積は，（底面積）×（高さ）で求めることができることを理解できるようにする。"],"s":["ア  図形を構成する要素に着目し，基本図形の体積の求め方を見いだすとともに，その表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと","角柱，円柱の体積の求め方を，図形を構成する要素などに着目して，既習の立方体，直方体の体積の求め方を基に考えたり，図形の面積の学習と関連付けたりしながら説明したりする。直方体や立方体では，高さを１㎝に切った立体の体積をまず考えて，その体積を高さの分だけ倍にする考えを用いて体積の公式を導き出した。このことを基にして，次のように直方体での（縦）×（横）が（底面積）に当たると捉え直す。（直方体の体積）＝（縦）×（横）×（高さ）","＝（底面積）×（高さ）","また，捉え直した直方体の体積を求める公式から類推して，角柱や円柱の体積を求める公式を導くことができる。","（角柱や円柱の体積）＝（底面積）×（高さ）","その際，言葉の式でまとめるだけでなく，その式から，どんな角柱や円柱も，底面積と高さの積で体積を表すことができることを捉え直すことが大切である。","Ｃ 変化と関係"]},"quoteEnd":0},"sansu-6-C-1":{"page":300,"name":"比例","expl":{"intro":["第５学年では，簡単な場合についての比例の関係を知るとともに，伴って変わる二つの数量について，それらの関係に着目し，表や式を用いて，変化や対応の特徴を考察することを指導してきた。","第６学年では，比例の関係の意味や性質，比例の関係を用いた問題解決の方法，反比例について知るとともに，日常生活において，伴って変わる二つの数量を見いだし，それらの関係に着目し，目的に応じて表や式，グラフを用いて変化や対応の特徴を考察し，問題を解決する力を伸ばしていくことをねらいとしている。また，考察の方法や結果を振り返って，解決の質的な改善をめざして多面的に考察しようとしたり，処理のよさを見いだし，方法や結果を今後の生活に生かそうとしたりする態度を養うことも大切である。","ここで育成される資質・能力は，中学校第１学年の比例，反比例をはじめとする中学校の「関数」領域の考察や，中学校の理科での考察に生かされるものである。"],"k":["ア 比例の関係の意味や性質","比例の意味として，次のようなことを挙げることができる。","①  二つの数量Ａ，Ｂがあり，一方の数量が２倍，３倍，４倍，…と変化する１ １のに伴って，他方の数量も２倍，３倍，４倍，…と変化し，一方が ， ，２ ３１ １ １ １","，…と変化するのに伴って，他方も， ， ， ，…と変化するという４ ２ ３ ４","こと。","②  ①の見方を一般的にして，二つの数量の一方がｍ倍になれば，それと対応する他方の数量もｍ倍になるということ。","③  二つの数量の対応している値の商に着目すると，それがどこも一定になっているということ。","第５学年では，簡単な場合について比例の関係を指導している。第６学年では，これまでに指導してきた伴って変わる二つの数量の関係について整理する立場から，①のような特徴をもった数量の関係として比例を捉えられるようにする。","また，児童にとって，①の見方から②の見方ができるようになることは必ずしも容易ではない。そこで，表にいろいろな数値を入れて調べてみるなどの活動を通して，②の見方に気付いていけるような指導を工夫することが大切である。","さらに，対応している値の商に着目する③の見方は，関数の考えからみて，二つの数量が比例の関係にあるかどうかを調べる上でも有効である。こうした対応の見方がよく理解できるよう指導しておくことが大切である。","比例の関係を表す式は，③の商をaとすると，y＝a×xという形，又は，y＝（決まった数）×xという形で表される。このとき，x，yは具体的な数量を表していることに配慮する。なお，定数としての文字aは中学校で学習する。","一般に，比例の関係を表すグラフは，原点を通る直線として表される。これは，比例の関係を見分けるときなどに用いられる重要な性質である。また，比例する二つの数量についてのグラフが直線になることを，具体的な数量に即して理解できるようにする。","イ 比例の関係を用いた問題解決の方法","日常生活における問題を解決する際に，比例の関係を利用することで，手際よく問題が解決できる場合がある。そのような，比例の関係を用いた問題解決の方法は，以下のような過程を含んでいる。","①  一つの数量を調べようとするとき，その数量を直接調べることが難しい場面において，調べやすく，かつ，その数量と比例の関係にあるとみることのできる別の数量を見いだす。厳密には比例の関係かどうかは分からないが，おおむね比例の関係にあるとみてよさそうな数量を，幾つかの数値について調べることで見いだすことになる。","②  二つの数量の比例関係に着目することで，目的に応じて表や式，グラフを用いて関係を表現し，変化や対応の特徴を見いだす。","③  一方の数量がｍ倍ならば，他方の数量もｍ倍になるなど，比例の変化や対応の特徴を確認した後，それらの考えを用いて，問題の解決を行う。","このような問題解決の方法を身に付けるためには，比例の関係が有効に用いられる場面を用意し，児童が比例の関係を用いると手際よく問題を解決することができるなどのよさを味わうように配慮する必要がある。また，これまでに指導してきた，関数の考えによる問題解決の過程を振り返り，まとめることも大切である。","ウ 反比例の関係","反比例の意味として，比例の場合に対応して，次のようなことを挙げることができる。","①  二つの数量Ａ，Ｂがあり，一方の数量が２倍，３倍，４倍，…と変化するの１ １ １ １ １ １に伴って，他方の数量は ， ， ，…と変化し，一方が ， ， ，２ ３ ４ ２ ３ ４…と変化するのに伴って，他方は２倍，３倍，４倍，…と変化するということ。②  ①の見方を一般的にして，二つの数量の一方がｍ倍になれば，それと対応す１","る他方の数量は 倍になるということ。","m","③  二つの数量の対応している値の積に着目すると，それがどこも一定になっているということ。","反比例の関係を表す式は，対応する値の積をaとすると，x×y＝aという形又は，x×y＝（決まった数）という形の式で表すことができる。","反比例のグラフについては，児童が反比例の関係を満足する幾つかの点をとったり，教師がグラフを示したりすることで，変化の様子を調べられるようにして，比例と反比例の違いに気付けるようにする。"],"s":["ア  伴って変わる二つの数量を見いだして，それらの関係に着目し，目的に応じて表や式，グラフを用いてそれらの関係を表現して，変化や対応の特徴を見いだすとともに，それらを日常生活に生かすこと","伴って変わる二つの数量を見いだし，それらの関係に着目すること","第５学年までに，ものとものとを対応付けたり，一つの数を他の数の和や差としてみるなど，加法，減法，乗法，除法の用いられる場合や，簡単な場合についての比例の関係に関わって，関数の考えについての経験をしてきている。第６学年では，日常の事象における伴って変わる二つの数量の関係に考察の対象を広げ，比例の関係にあるものを中心に，日常生活における問題の解決を通して，関数の考えを伸ばすことをねらいとしている。","日常生活において一つの数量を調べようとするとき，それを直接調べることが難しかったり，非効率的であったりする場面において，調べたい数量に関係する他の数量を見いだす必要性が生まれる。調べたい数量と依存関係にある数量は一つではないかもしれない。その際も，比例の関係にある数量を見いだすことで，問題を解決するための見通しをもつことができる。厳密に考えれば誤差があり，比例の関係ではないことも考えられるが，比例の関係にあるとみることで，問題を解決する見通しがもてるようにする。","指導に当たっては，調べたい数量に関係する他の数量が，比例の関係にあるとみてよいかどうかを確認することが大切である。また，比例の関係にあるとみることのできる数量として，幾つかの候補がある場合，どの数量に着目するかを，目的や状況を考えながら判断し，選択することも大切である。","比例の関係について変化や対応の特徴を見いだすこと","見いだした数量との比例の関係を用いて問題を解決する上で，表，式，グラフを用いてその関係を表現し，変化や対応の特徴を捉えていくことが必要である。それぞれの表現において，変化や対応の特徴を読み取り，考察することは，これまでの学年でも指導をしてきている。ここでは，目的に応じて，適切な表現を選択して，変化や対応の特徴を考察していくようにする。","表を用いて表すことで，比例の関係についての変化と対応の規則性が捉えやすくなるため，表は基本的な表現や考察の手段である。グラフを用いて表すことで，おおよその数量の関係を把握しやすくなったり，見通しをもちやすくなったりする。また，式を用いて表すことで，対応における規則性が簡潔かつ明瞭に示され，計算によって知りたい数量を求めやすくなる。表や式，グラフを用いて考察し，そこから見いだした特徴を用いて，知りたい数量についての結果を導き，その結果を活用して，問題を解決するようにする。目的に応じて適切な表現を判断することは，それぞれの数学的表現の特徴やよさに気付くことにもつながる。","比例の関係を用いた問題解決の方法を日常生活に生かすこと","比例の関係を用いると能率よく問題を解決できる場面は日常生活に様々ある。その際，得られた結果については，現実場面でどういう意味をもつかを考え，目的に照らしてみたときに，問題を解決することにつながるかどうかを評価する必要がある。正確さが問題となる場合には，厳密に考えれば比例の関係ではないが，比例の関係にあるとみることで結果が導かれたという点を振り返ることも大切である。そして，問題解決の方法や結果を評価し，必要に応じて，目的により適したものに改善していくことも大切である。","こうした問題解決の活動を通して，日常生活や算数の学習などの場面で，能率のよい処理の仕方を求めて，積極的に比例の関係を生かしていこうとする態度を養う。"]},"quoteEnd":0},"sansu-6-C-2":{"page":304,"name":"比","expl":{"intro":["第５学年では，ある二つの数量の関係と別の二つの数量の関係とを比べる場合に割合を用いる場合があることや百分率について理解し，日常の事象を割合で捉え，図や式などを用いて，二つの数量の関係どうしの比べ方を考察し，日常生活に生かすことを指導してきた。","第６学年では，比の意味や表し方を理解するとともに，図や式などを用いて数量の関係の比べ方を考え，それを日常生活に生かす力を更に伸ばしていくことをねらいとしている。また，日常の事象を，目的に応じて比で捉えることやその処理のよさを感じて，それらを学習や生活に生かそうとする態度を養うことも大切である。ここで育成される資質・能力は，中学校における「数と式」領域，「関数」領域などでの考察に生かされるものである。"],"k":["ア 比","二つの数量の大きさを比較しその割合を表す場合に，どちらか一方を基準量とすることなく，簡単な整数などの組を用いて表す方法が比である。第５学年までに，倍や割合に関する指導，分数の指導，比例関係に関する指導などの中で，比の素地を指導してきている。第６学年では，これらの上に，a：bという比の表し方を指導する。比の相等（等しい比）及びそれらの意味を明らかにし，比について理解でa","きるようにする。これに関連し， をa：bの比の値ということや，比の値を用いb","ると比の相等（等しい比）を確かめることができることを理解できるようにする。このようなことから，数量の関係を比で表したり，等しい比をつくったりすることができるようにする。","指導に当たっては，具体的な場面によって，比の相等とそれらの意味について理解させる。例えば，同じ大きさのコップで３杯と５杯の２種類の液体を混ぜ合わせた液体を作ったとき，これと同じ濃さの液体を別に作ることを考える。そこでもう一回同じ大きさのコップで３杯と５杯の２種類の液体を混ぜ合わせた液体を作り，もとの液体と合わせると，同じ濃さの液体を合わせたから同じ濃さになる。このとき６杯と10杯の液体を混ぜ合わせたことになることから，３杯と５杯の割合で混ぜても，６杯と10杯の割合で混ぜても濃さは等しくなる。このようなことから，二つの数量の間には比例関係があることや，３：５は，６：10，９：15などや1.5：2.5などと等しいことを理解させる。","また，比は，比例，反比例や縮図・拡大図などと深く関連するものであるので，その指導の順序や取扱いについては，相互に理解を深めることができるよう配慮する必要がある。"],"s":["ア  日常の事象における数量の関係に着目し，図や式などを用いて数量の関係の比べ方を考察し，それを日常生活に生かすこと","日常の事象における二つの数量の関係に着目すること","第５学年までに，日常の事象について，二つの数量の関係どうしを比べる際に，どちらか一方を基準としたときに，基準量，比較量，割合という数量の関係に着目することを指導してきた。第６学年においては，比べるために必要となる二つの数量の関係を，比例の関係を前提に，割合でみてよいかを判断する。そして，どちらか一方を基準にすることなく，簡単な整数の組としての二つの数量の関係に着目する。これは，例えば，「水３の，凝縮液２に対する割合」で作ったジュースの濃さは，凝縮液の量を２倍，３倍，…としたときに，水の量も２倍，３倍，…にすれば濃さは変わらないと考え，それらを同じ関係とみて，３：２のように表すことである。「水は凝縮液の1.5倍の量」のように，一方を基準として二つの数量の関係を捉えることもできるが，整数の組で捉えた方が，数量の関係が見やすかったり，処理がしやすかったりすることも多い。","図や式などを用いて数量の関係どうしを比で比べること","比では，上述したように，二つの数量の割合を一つの数で表すのではなく，簡単な二つの整数の組を用いて表す。そして，表したその二つの数量についての比例関係がその背後にあることを使って，数量の関係を考察していくことになる。すなわち，２：３というのは，４：６，６：９，…などを同じ関係としてみていることを表しているという考えによって，数量の関係を比べたり，知りたい数量の大きさを求めたりしていく。","数量の関係を考察する上では，関係を図や式などを用いて表したり，それらを読み取ったりすることが有効である。これまでの学年と同様に，目的に応じて，図や式を関連付けたり用いたりしながら，数量の関係を考察し，結論を導いていく。また，考察によって得られた結果を，日常の事象に戻して，その意味を考え，必要に応じて，考察の方法や表現方法を見直すことが大切である。さらに，これまで学習してきた割合による比べ方の考察と比較することで，比を用いて物事を処理することの特徴やよさを振り返ることも大切である。","指導に当たっては，児童が考察において書き表す様々な図や式を取り上げ，それらを相互に読み取ったり，より適切なものへと改善していったりすることも大切である。","比を用いた比べ方を日常生活に生かすこと","比は，日常生活のいろいろな場面で用いられる。例えば，二つの液量を混合したり，二つの長さを組み合わせたりするなど，部分と部分の関係どうしを考察する場面，二つの数量を配分する場面で，数量の関係を比で表現し，等しい比をつくるなどして考察した結果を活用して，課題を解決する。","日常生活において，比によって数量の関係を表現している事象を探す活動を通して，比による数量の関係への着目の仕方に親しむことも大切である。","Ｄ データの活用"]},"quoteEnd":0},"sansu-6-D-1":{"page":306,"name":"データの考察","expl":{"intro":["第５学年までに文字情報として得られる「質的データ」や数値情報として得られる「量的データ」，時間変化に沿って得られた「時系列データ」について表にまとめたり，グラフに表したりすることでデータの特徴や傾向を捉えることを学習してきている。","第６学年では，目的に応じたデータの収集や分類整理，表やグラフ，代表値の適切な選択など，一連の統計的な問題解決をできるようになることや，結論について批判的に捉え妥当性について考察することができるようになることがねらいである。その過程を通じて，量的データについて分布の中心や散らばりの様子を考察することができるようにすることをねらいとしている。","ここで育成される資質・能力は中学校第１学年での度数分布を表す表やヒストグラムなどを用いて問題解決する学習の素地となるものである。"],"k":["ア 代表値の意味や求め方","量的データの特徴を読み取る場合，データ全体を表す指標として平均値，中央値，最頻値などの代表値を用いる場合があり，第６学年では，これらの意味について理解し，これらを用いることができるようにする。","平均値は，データの個々の値を合計し，データの個数で割った値，中央値はデータを大きさの順に並べたときの中央の値，最頻値はデータの中で最も多く現れている値のことである。なお，日常的には平均値は平均ということもある。","一つの数値で表すことで，データの特徴を簡潔に表すことができ，複数のデータを比較することも容易になる。しかしその反面，分布の形などの情報は失われているので代表値の用い方には留意する必要がある。","また，平均値は一般にもよく用いられる指標であるが，代表値として適切であるとはいえない場合があるため，このような場合について指導する。例えば，分布が非対称であったり多峰性であったりする場合や，極端にかけ離れた値があったりすると，平均値はデータが集中している付近からずれてしまうことがあり，そのような場合には代表値としてふさわしくない。このようなとき，中央値や最頻値を代表値として用いる。また，代表値として用いる目的から，平均値がふさわしくない場合もある。例えば，ある靴メーカーが，来年，どのようなサイズの靴を多く製造するかを決める場合，今年１年間に売れた靴のサイズの平均値を求め，その平均値のサイズの靴を来年，最も多く製造するようなことはしない。この場合は，最も多く売り上げがあった靴のサイズ，つまり最頻値を用いる方が望ましい。","このように，代表値を用いる場合は，資料の特徴や代表値を用いる目的を明らかにし，どのような代表値を用いるべきか判断する必要がある。","量的データの散らばりの様子や代表値の意味を捉えやすくするための方法としてドットプロットがある。第６学年では，データをドットプロットに表したり，ドットプロットからデータの特徴や傾向を読み取ったり，最頻値や中央値を見付けたりできるようにする。","ドットプロットとは数直線上の該当する箇所にデータを配置し，同じ値のデータがある際には積み上げて表したものである。ドットプロットを用いることでデータの散らばりの様子が捉えやすくなる。次の図は，学級内で地域の空き缶拾いの缶の数を調べてまとめたドットプロットであるが，最も高く積み上がった２本が最頻値ということになる。","イ 度数分布を表す表やグラフの特徴と用い方","量的データの分布の様子や特徴を捉えるための統計的な処理の方法として，度数分布を表す表や柱状グラフがある。第６学年では，度数分布を表す表と柱状グラフについて指導する。度数分布を表す表は，分布の様子を数量的に捉えやすくするために，数量を幾つかの区間（階級という）に分けて，各区間に，それに入る度数を対応させた表である。柱状グラフについては，各階級の幅を横とし，度数を縦とする長方形をかいたものという程度の理解でよい。また，階級の幅を変えて柱状グラフを作り直すなどして，分布の様子を的確に捉えることは，中学校第１学年で扱うものとする。","柱状グラフを用いることで，資料の分布の様子を捉えることができる。変量を幾つかの階級に分け，ある階級に属する度数を明らかにすることで，全体の形，左右の広がりの範囲，山の頂上の位置，対称性など，直観的に捉えやすくなる。ドットプロットでも分布の様子を捉えることができるが，扱うデータが小数点など刻みが細かくなっていたり，最小値と最大値の差が著しく開いている場合などには各点がほとんど積み上がることなく，まばらに広がってしまうことがある。そのような場合には柱状グラフを用いると考察しやすくなる。","また，児童によっては第３学年で学習する棒グラフと柱状グラフを混同して捉えてしまうことがある。棒グラフは質的データを集計した個数を高さで表していて，量的データの値をそのまま高さに対応させて表したものであり，横軸のラベルには質的な文字情報が表示される。一方，柱状グラフは，量的データの分布の様子を分析する目的から，階級に分けて集計し，度数の多さを高さに対応させて表しているため，横軸は数値軸となっている。柱状グラフの長方形（柱）を隙間なくつけているのは，隙間が空いているとその部分に該当する値のデータが存在しないかのような誤認を与えてしまうからである。","ウ 目的に応じた統計的な問題解決の方法","第５学年では，統計的な問題解決の方法を知り，考察することを学習してきている。統計的な問題解決とは，以下に述べる「問題—計画—データ—分析—結論」という五つの段階を経て問題解決することである。","①  身の回りの事象について，興味・関心や問題意識に基づき統計的に解決可能な問題を設定すること","②  見通しを立て，どのようなデータを，どのように集めるかについて計画を立てること","③ データを集めて分類整理すること","④  目的に応じて，観点を決めてグラフや表に表し，データの特徴や傾向をつかむこと","⑤ 問題に対する結論をまとめるとともに，さらなる問題を見いだすこと","第６学年では，身の回りの事象について，統計的な問題解決の方法で考察していくことでその方法への理解を深めるとともに，目的に応じてデータを収集したり適切な手法を選択したりするなどについて理解し，このことができるようにしていく。例えば，図書の貸し出し状況について調べたい場面があるとする。「貸し出し状況について」といった漠然とした目的では統計的に解決していくことが難しい。そこで，具体的な問題として目的を明確にする。貸し出し状況の何を調べ，その結果どうしたいのかということである。それにより，データの収集や手法の選択が異なってくるからである。","先の例では，「物語や科学，図鑑といった分類別のどの本を充実させたらよいのか。」というような問題を設定した場合には，それぞれの項目の本が何冊借りられたのかというデータを収集することになる。そのような質的データに対しては，表や棒グラフをかいたりして分類整理や視覚化し，分析していく。","また，そのようなデータを量の大小で分析するのでなく，割合の見方で分析したい場合には，それを帯グラフや円グラフに表すことも考えられるし，異なる項目間での関係について考察したい場合は，二次元の表にまとめることになる。","「毎月何冊借りられているのか。」「去年から貸し出し冊数はどのように変化しているのか。」というような問題を解決したい場合には，時系列順のデータを収集することになる。そのようなデータに対しては，表を作ったり折れ線グラフをかいたりして分類整理や視覚化し，分析していく。","「借りる数が多い児童と少ない児童がいるので，その傾向を調べたい。」というような分布を調べたい場合はその観点でデータを収集し，度数分布表や柱状グラフをつくって分析していくことになる。","このように，目的に応じて収集するデータが異なることや，それに応じて分析する手法も異なることを知ることが大切である。","また，統計的な問題解決の対象は不確実な事象であることから，確定的な結論は得られないため，問題解決の過程や結論についても振り返り，妥当性を考察したり，改善する余地がないかを検討したりすることの大切さについても指導する。"],"s":["ア  目的に応じてデータを集めて分類整理し，データの特徴や傾向に着目し，代表値などを用いて問題の結論について判断するとともに，その妥当性について批判的に考察すること","目的に応じてデータを集めて分類整理すること","目的に応じてデータを集めて分類整理するとは，統計的に解決する問題を設定し，その解決のために適したデータを収集し分類整理することである。","まず，目的を明確にするために，身の回りにある不確定な事象で確かめてみたいことについて，そのことを統計的に解決していく問題として設定できるようにする。例えば，「10年前，20年前と比べて自分たちの体力は落ちているという話を聞いた。それは本当だろうか。」という疑問があるとする。そこから，「20年前のこの学校の児童の50ｍ走の記録と今の自分たちの50ｍ走の記録を比べてどちらがよいのか。」というような比較する対象を明確にした問題として設定するようなことである。","次に，それを解決する目的で，必要なデータを集める計画を立てる。データの集め方に関して「学年や性別を揃えないと正しく比較できない。」ことや，「なるべく多くの人数のデータを集める。」ことを考えて，より適切に比べることができるようにするとともに，そのような集団のデータはどのように分析すればよいかを見通すことも求められる。そして，データを集めて必要なデータを分類整理する。","データの特徴や傾向に着目し，代表値などを用いて問題の結論について判断すること","データの特徴や傾向に着目し，代表値などを用いて問題の結論について判断するとは，代表値を求めたり，度数分布を表す表や柱状グラフからデータ全体の分布の様子を捉えたり，それらの特徴が表す意味を考察することである。","集めたデータを分析するに当たり，データの種類や項目の数を考え，目的に応じて，表やグラフに表してみる。その際，数値データが集団の特徴や傾向をみる場合には，代表値を求めたり，度数分布を表す表や柱状グラフからデータ全体の分布の様子を捉えたりすることができるようにする。そして分析した結果から問題の結論を見いだし，判断する。","第６学年の男子児童の50m走の記録","20年前 今","平均値 8.0秒 8.2秒","中央値 7.9秒 8.2秒","最頻値 8.0秒 8.2秒","先ほどの例でいえば，20年前と今の第６学年男子の50ｍ走の記録について，代表値で比較すると20年前の方が記録がよく，また柱状グラフでデータの分布を見ると，どちらも左右対称な山型をしていることから，二つのデータの分布はほぼ同じと考えられる。よって代表値の数値から20年前の方がよかったようだという結論が得られるというようなことである。","妥当性について批判的に考察すること","妥当性について批判的に考察するとは，自分たちが出した結論や問題解決の過程が妥当なものであるかどうかを別の観点や立場から検討してみることや，第三者によって提示された統計的な結論が信頼できるだけの根拠を伴ったものであるかどうかを検討することである。","統計的な問題解決では，解決すべき問題に対して，どのデータを用いるのかによって結論が異なることがある。また，用いるデータが同じでも，その分析の仕方や着目する点により結論が異なることがある。一方，データが少なすぎたり，公平でない比較をしている場合であれば，その結論は信頼しにくいものであると言える。それらのことから，自分たちが出した結論について，また第三者によって提示された統計的な結論について，信頼できるのかどうかを検討していくことが，批判的に考察するということである。","上の例では，代表値による比較や柱状グラフの分析に誤りはなかったかを振り返ることが当てはまる。また，20年前と今の児童の体力を比較するのに，50ｍ走の記録だけに注目したり，６年生の男子児童だけを比較したりしたことは妥当かどうかを考えることが当てはまる。他の種目や学年，性別なども合わせて多面的に分析する必要があると判断した際には，再度問題解決の過程を行うことになる。","統計的な問題解決の対象は不確定な事象であることから，確定的な結論は得られないため，得られた結論についてや，問題解決の方法の各段階が適切な選択に基づいたものであったかについて，振り返って考え直す態度を養うことにも留意する。また，妥当性について批判的に考察することについては，自分たちが出した結論や問題解決の過程だけでなく，新聞やニュース，雑誌など第三者による統計を用いた主張にも当てはまる。現在の社会におい","ては，様々な分野で統計が用いられ，デー","タに基づいて現状の把握や政策などが決定","されていく。日々の生活においても，様々","なデータとその分析に基づく主張を見聞き","することになる。","例えば，右の図はOECDによる生徒の","学習到達度調査（PISA）で用いられた問","題例であるが，「あるテレビレポーターがこのグラフを示して，「1999年は1998年に比べて，盗難事件が激増しています」と言いました。このレポーターの発言は，このグラフの説明として適切ですか。」と出題されたものである（国立教育政策研究所編『生きるための知識と技能２』，ぎょうせい，2004年 p.119）。このようなデータに基づく主張を提示された際に，それを鵜呑みにすることなく，信頼できるデータに基づく妥当な判断に基づくものであるかどうかを批判的に考察することが重要である。"]},"quoteEnd":0},"sansu-6-D-2":{"page":312,"name":"起こり得る場合","expl":{"intro":["第５学年までに，表などを用いて分類整理して表したり読み取ったりすることを学習してきている。","第６学年では，起こり得る全ての場合を適切な観点から分類整理して，順序よく列挙できるようにすることをねらいとしている。","ここで育成される資質・能力は，中学校第２学年で学習する確率などの考察につながっていくものである。"],"k":["ア 起こり得る場合","第６学年では，起こり得る場合を順序よく整理して調べることができるようにする。起こり得る場合を順序よく整理して調べるとは，思いつくままに列挙していたのでは落ちや重なりが生じるような順序や組み合わせなどの事象について，規則に従って正しく並べたり，整理して見やすくしたりして，誤りなく全ての場合を明らかにすることを指している。","例えば，４人が一列に並ぶ場合を考えるときには，特定のＡに着目して，まずＡが先頭に立つ場合を考える。２番目の位置にＢが並ぶとすれば，３番目はＣかＤになる。次に，２番目の位置にＣが並ぶ場合，Ｄが並ぶ場合と考えを進めていく。そうすると，Ａが先頭に立つ場合は，次の図のように６通りであることを明らかにすることができる。Ａのほかにも，Ｂ，Ｃ，Ｄが先頭に立つことができることから，起こり得る場合を図にかいて調べると24通りであることが分かる。","Ａ—Ｂ—Ｃ—Ｄ","Ａ—Ｂ—Ｄ—Ｃ","Ａ—Ｃ—Ｂ—Ｄ","Ａ—Ｃ—Ｄ—Ｂ","Ａ—Ｄ—Ｂ—Ｃ","Ａ—Ｄ—Ｃ—Ｂ","また，四つのチームの対戦の組み合わせを考えるときには，次の図や表に示すような方法で，全ての場合を落ちや重なりがないように調べていくことができる。Ａ—Ｂ","Ａ—Ｃ","Ａ—Ｄ","Ｂ—Ｃ","Ｂ—Ｄ","Ｃ—Ｄ","このように，図や表を適切に用いることができるようにする。"],"s":["ア  事象の特徴に着目し，順序よく整理する観点を決めて，落ちや重なりなく調べる方法を考察すること","順序よく整理する観点を決めること","起こり得る場合を考える際に，落ちや重なりなく調べるには，観点を決めて考えていく。観点を決めるとは，あるものを固定して考えるなどのことである。","例えば，大中小３種類のコインの裏表の出方の場合を調べる場面があるとする。（大コインが表，中コインが表，小コインが表）の場合を考えたのち，大コインは表のまま変えずに，中コインと小コインの場合のみ考えていくようなことである。すると（中コイン表，小コイン裏）（中コイン裏，小コイン表）（中コイン裏，小コイン裏）の四つの場合を見いだすことができ，これ以外の場合はないことが分かる。","落ちや重なりなく調べる方法を考察すること","落ちや重なりなく調べるためには，図や表などに整理して表すことが有効に働く。順序よく調べていこうとしても，場合が多かったり複雑だったりすると，落ちや重なりが発生する可能性が増すことになる。","先のコインの例で考えてみる。（大コイン表，…）などと書いて挙げていくより，記号などを使って表を〇，裏を×で表すことを考えたり，大コイン，中コイン，小コインをそれぞれ位置で（左中右）で表すなどして簡潔に示すことができる。（大コイン表，中コイン表，小コイン裏）を（〇〇×）と表すようなことである。","落ちや重なりがないように考えていくことは，思考や表現の方法を工夫することや，筋道を立てて考えていくことにつながるものである。多様な考えに触れ，それぞれのよさに気付くようにしていく。"]},"quoteEnd":0}}},"trowNote":"行は、つながりマップのテーマ（Claudeが学習指導要領の内容から作ったもの）です。ほかの領域の内容も、同じ系統なら同じ行に入れています。","trows":{"A":[{"name":"整数のしくみ","cells":{"1":[{"id":"sansu-1-A-1","lab":"10までの数・2けたの数のしくみ"}],"2":[{"id":"sansu-2-A-1","lab":"4けたまでの数（十進位取り記数法）"}],"3":[{"id":"sansu-3-A-1","lab":"万の単位・10倍や1/10の大きさの数"}],"4":[{"id":"sansu-4-A-1","lab":"億・兆の単位と十進位取り記数法"}],"5":[{"id":"sansu-5-A-1","lab":"偶数・奇数，約数・倍数（整数の性質）"},{"id":"sansu-5-A-2","lab":"10倍，1/10・1/100 などの数と小数点の移動"}]}},{"name":"がい数と見積もり","cells":{"4":[{"id":"sansu-4-A-2","lab":"がい数・四捨五入・見積もり"}]}},{"name":"たし算・ひき算","cells":{"1":[{"id":"sansu-1-A-2","lab":"たし算・ひき算の意味（1けた＋1けた）"}],"2":[{"id":"sansu-2-A-2","lab":"2けたのたし算・ひき算の筆算"}],"3":[{"id":"sansu-3-A-2","lab":"3・4けたのたし算・ひき算の筆算"}]}},{"name":"かけ算","cells":{"2":[{"id":"sansu-2-A-3","lab":"かけ算の意味と九九"}],"3":[{"id":"sansu-3-A-3","lab":"2・3けた×1・2けたのかけ算の筆算"}]}},{"name":"わり算","cells":{"3":[{"id":"sansu-3-A-4","lab":"わり算の意味（九九1回で答えが出るわり算）・余り"}],"4":[{"id":"sansu-4-A-3","lab":"わり算の筆算（÷1けた・÷2けた）"}]}},{"name":"小数","cells":{"3":[{"id":"sansu-3-A-5","lab":"小数の意味と表し方（1/10の位）"}],"4":[{"id":"sansu-4-A-4","lab":"小数のたし算・ひき算，小数×整数・小数÷整数" ","grades":[3,4,5,6]},{"key":"B","name":"Ｂ 生命・地球","grades":[3,4,5,6]}],"goals":{"3":{"lines":["⑴　物質・エネルギー","①　物の性質，風とゴムの力の働き，光と音の性質，磁石の性質及び電気の回路についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにする。","②　物の性質，風とゴムの力の働き，光と音の性質，磁石の性質及び電気の回路について追究する中で，主に差異点や共通点を基に，問題を見いだす力を養う。","③　物の性質，風とゴムの力の働き，光と音の性質，磁石の性質及び電気の回路について追究する中で，主体的に問題解決しようとする態度を養う。","⑵　生命・地球","①　身の回りの生物，太陽と地面の様子についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにする。","②　身の回りの生物，太陽と地面の様子について追究する中で，主に差異点や共通点を基に，問題を見いだす力を養う。","③　身の回りの生物，太陽と地面の様子について追究する中で，生物を愛護する態度や主体的に問題解決しようとする態度を養う。"],"page":29,"expl":{"intro":["第３学年の目標は，自然の事物・現象について，理科の見方・考え方を働かせ，問題を追究する活動を通して，物の性質，風とゴムの力の働き，光と音の性質，磁石の性質及び電気の回路，身の回りの生物，太陽と地面の様子についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，問題解決の力や生物を愛護する態度，主体的に問題解決しようとする態度を養うことである。","特に，本学年では，学習の過程において，自然の事物・現象の差異点や共通点を基に，問題を見いだすといった問題解決の力を育成することに重点が置かれている。","なお，理科の学習が，小学校第３学年から開始されることを踏まえ，生活科の学習との関連を考慮し，体験的な活動を多く取り入れるとともに，問題解決の過程の中で，「理科の見方・考え方」を働かせ，問題を追究していくという理科の学習の仕方を身に付けることができるよう配慮する。","(1) 「Ａ物質・エネルギー」に関わる目標","本区分では，物の性質，風とゴムの力の働き，光と音の性質，磁石の性質及び電気の回路についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，主に差異点や共通点を基に，問題を見いだすといった問題解決の力や主体的に問題解決しようとする態度を養うことが目標である。","ここでは，「粒子」についての基本的な概念等を柱とした内容として，「Ａ(1)物と重さ」を設定する。「Ａ(1)物と重さ」については，物の形や体積に着目して，重さを比較しながら調べ，物の形や体積と重さとの関係を捉えるようにする。","また，「エネルギー」についての基本的な概念等を柱とした内容として，「Ａ(2)風とゴムの力の働き」，「Ａ(3)光と音の性質」，「Ａ(4)磁石の性質」及び「Ａ(5)電気の通り道」を設定する。「Ａ(2)風とゴムの力の働き」については，風とゴムの力と物の動く様子に着目して，それらを比較しながら調べ，風とゴムの力の働きを捉えるようにする。「Ａ(3)光と音の性質」については，光を当てたときの明るさや暖かさ，音を出したときの震え方に着目して，光の強さや音の大きさを変えたときの現象の違いを比較しながら調べ，光と音の性質を捉えるようにする。「Ａ(4)磁石の性質」については，磁石を身の回りの物に近付けたときの様子に着目して，それらを比較しながら調べ，磁石の性質を捉えるようにする。「Ａ(5)電気の通り道」については，乾電池と豆電球などのつなぎ方と乾電池につないだ物の様子に着目して，電気を通すときと通さないときのつなぎ方を比較しながら調べ，電気の回路を捉えるようにする。","(2) 「Ｂ生命・地球」に関わる目標","本区分では，身の回りの生物，太陽と地面の様子についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，主に差異点や共通点を基に，問題を見いだすといった問題解決の力や生物を愛護する態度，主体的に問題解決しようとする態度を養うことが目標である。","ここでは，「生命」についての基本的な概念等を柱とした内容として，「Ｂ(1)身の回りの生物」を設定する。「Ｂ(1)身の回りの生物」については，身の回りの生物を探したり育てたりする中で，これらの様子や周辺の環境，成長の過程や体のつくりに着目して，それらを比較しながら調べ，身の回りの生物と環境との関わり，昆虫や植物の成長のきまりや体のつくりを捉えるようにする。","また，「地球」についての基本的な概念等を柱とした内容として，「Ｂ(2)太陽と地面の様子」を設定する。「Ｂ(2)太陽と地面の様子」については，日なたと日陰の様子に着目して，それらを比較しながら調べ，太陽と地面の様子との関係を捉えるようにする。"],"1":[],"2":[],"3":[]}},"4":{"lines":["⑴　物質・エネルギー","①　空気，水及び金属の性質，電流の働きについての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにする。","②　空気，水及び金属の性質，電流の働きについて追究する中で，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力を養う。","③　空気，水及び金属の性質，電流の働きについて追究する中で，主体的に問題解決しようとする態度を養う。","⑵　生命・地球","①　人の体のつくりと運動，動物の活動や植物の成長と環境との関わり，雨水の行方と地面の様子，気象現象，月や星についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにする。","②　人の体のつくりと運動，動物の活動や植物の成長と環境との関わり，雨水の行方と地面の様子，気象現象，月や星について追究する中で，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力を養う。","③　人の体のつくりと運動，動物の活動や植物の成長と環境との関わり，雨水の行方と地面の様子，気象現象，月や星について追究する中で，生物を愛護する態度や主体的に問題解決しようとする態度を養う。"],"page":45,"expl":{"intro":["第４学年の目標は，自然の事物・現象について，理科の見方・考え方を働かせ，問題を追究する活動を通して，空気，水及び金属の性質，電流の働き，人の体のつくりと運動，動物の活動や植物の成長と環境との関わり，雨水の行方と地面の様子，気象現象，月や星についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，問題解決の力や生物を愛護する態度，主体的に問題解決しようとする態度を養うことである。","特に，本学年では，学習の過程において，自然の事物・現象から見いだした問題について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想するといった問題解決の力を育成することに重点が置かれている。","(1) 「Ａ物質・エネルギー」に関わる目標","本区分では，空気，水及び金属の性質，電流の働きについての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想するといった問題解決の力や主体的に問題解決しようとする態度を養うことが目標である。","ここでは，「粒子」についての基本的な概念等を柱とした内容として，「Ａ(1)空気と水の性質」及び「Ａ(2)金属，水，空気と温度」を設定する。「Ａ(1)空気と水の性質」については，閉じ込めた空気や水を圧し縮めたときの体積や圧し返す力の変化に着目して，それらと圧す力とを関係付けて調べ，空気と水の性質を捉えるようにする。「Ａ(2)金属，水，空気と温度」については，体積や状態の変化，熱の伝わり方に着目して，それらと温度の変化とを関係付けて調べ，金属，水及び空気の性質を捉えるようにする。","また，「エネルギー」についての基本的な概念等を柱とした内容として，「Ａ(3)電流の働き」を設定する。「Ａ(3)電流の働き」については，電流の大きさや向きと乾電池につないだ物の様子に着目して，それらを関係付けて調べ，電流の働きを捉えるようにする。","(2) 「Ｂ生命・地球」に関わる目標","本区分では，人の体のつくりと運動，動物の活動や植物の成長と環境との関わり，雨水の行方と地面の様子，気象現象，月や星についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想するといった問題解決の力や生物を愛護する態度，主体的に問題解決しようとする態度を養うことが目標である。","ここでは，「生命」についての基本的な概念等を柱とした内容として，「Ｂ(1)人の体のつくりと運動」，「Ｂ(2)季節と生物」を設定する。「Ｂ(1)人の体のつくりと運動」については，骨や筋肉のつくりと働きに着目して，それらを関係付けて調べ，人や他の動物の体のつくりと運動との関わりを捉えるようにする。「Ｂ(2)季節と生物」については，身近な動物や植物を探したり育てたりする中で，動物の活動や植物の成長と季節の変化に着目して，それらを関係付けて調べ，身近な動物の活動や植物の成長と環境との関わりを捉えるようにする。","また，「地球」についての基本的な概念等を柱とした内容として，「Ｂ(3)雨水の行方と地面の様子」，「Ｂ(4)天気の様子」，「Ｂ(5)月と星」を設定する。「Ｂ(3)雨水の行方と地面の様子」については，雨水の流れ方やしみ込み方に着目して，それらと地面の傾きや土の粒の大きさとを関係付けて調べ，雨水の行方と地面の様子を捉えるようにする。「Ｂ(4)天気の様子」については，気温や水の行方に着目して，それらと天気の様子や水の状態変化とを関係付けて調べ，天気や自然界の水の様子を捉えるようにする。「Ｂ(5)月と星」については，月や星の位置の変化や時間の経過に着目して，それらを関係付けて調べ，月や星の特徴を捉えるようにする。"],"1":[],"2":[],"3":[]}},"5":{"lines":["⑴　物質・エネルギー","①　物の溶け方，振り子の運動，電流がつくる磁力についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにする。","②　物の溶け方，振り子の運動，電流がつくる磁力について追究する中で，主に予想や仮説を基に，解決の方法を発想する力を養う。","③　物の溶け方，振り子の運動，電流がつくる磁力について追究する中で，主体的に問題解決しようとする態度を養う。","⑵　生命・地球","①　生命の連続性，流れる水の働き，気象現象の規則性についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにする。","②　生命の連続性，流れる水の働き，気象現象の規則性について追究する中で，主に予想や仮説を基に，解決の方法を発想する力を養う。","③　生命の連続性，流れる水の働き，気象現象の規則性について追究する中で，生命を尊重する態度や主体的に問題解決しようとする態度を養う。"],"page":61,"expl":{"intro":["第５学年の目標は，自然の事物・現象について，理科の見方・考え方を働かせ，問題を追究する活動を通して，物の溶け方，振り子の運動，電流がつくる磁力，生命の連続性，流れる水の働き，気象現象の規則性についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，問題解決の力や生命を尊重する態度，主体的に問題解決しようとする態度を養うことである。","特に，本学年では，学習の過程において，自然の事物・現象から見いだした問題についての予想や仮説を基に，解決の方法を発想するといった問題解決の力を育成することに重点が置かれている。","(1) 「Ａ物質・エネルギー」に関わる目標","本区分では，物の溶け方，振り子の運動，電流がつくる磁力についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，主に予想や仮説を基に，解決の方法を発想するといった問題解決の力や主体的に問題解決しようとする態度を養うことが目標である。","ここでは，「粒子」についての基本的な概念等を柱とした内容として，「Ａ(1)物の溶け方」を設定する。「Ａ(1)物の溶け方」については，物が水に溶ける量や様子に着目して，水の温度や量などの条件を制御しながら調べ，物の溶け方の規則性を捉えるようにする。","また，「エネルギー」についての基本的な概念等を柱とした内容として，「Ａ(2)振り子の運動」，「Ａ(3)電流がつくる磁力」を設定する。「Ａ(2)振り子の運動」については，振り子が１往復する時間に着目して，おもりの重さや振り子の長さなどの条件を制御しながら調べ，振り子の運動の規則性を捉えるようにする。「Ａ(3)電流がつくる磁力」については，電流の大きさや向き，コイルの巻数などに着目して，それらの条件を制御しながら調べ，電流がつくる磁力について捉えるようにする。","(2) 「Ｂ生命・地球」に関わる目標","本区分では，生命の連続性，流れる水の働き，気象現象の規則性についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，主に予想や仮説を基に，解決の方法を発想するといった問題解決の力や生命を尊重する態度，主体的に問題解決しようとする態度を養うことが目標である。","ここでは，「生命」についての基本的な概念等を柱とした内容として，「Ｂ(1)植物の発芽，成長，結実」，「Ｂ(2)動物の誕生」を設定する。「Ｂ(1)植物の発芽，成長，結実」については，植物の発芽，成長及び結実の様子に着目して，それらに関わる条件を制御しながら調べ，植物の育ち方を捉えるようにする。「Ｂ(2)動物の誕生」については，魚を育てたり人の発生についての資料を活用したりする中で，卵や胎児の様子に着目して，時間の経過と関係付けて調べ，動物の発生や成長について捉えるようにする。","また，「地球」についての基本的な概念等を柱とした内容として，「Ｂ(3)流れる水の働きと土地の変化」，「Ｂ(4)天気の変化」を設定する。「Ｂ(3)流れる水の働きと土地の変化」については，流れる水の速さや量に着目して，それらの条件を制御しながら調べ，流れる水の働きと土地の変化を捉えるようにする。「Ｂ(4)天気の変化」については，雲の量や動きに着目して，それらと天気の変化とを関係付けて調べ，天気の変化の仕方を捉えるようにする。"],"1":[],"2":[],"3":[]}},"6":{"lines":["⑴　物質・エネルギー","①　燃焼の仕組み，水溶液の性質，てこの規則性及び電気の性質や働きについての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにする。","②　燃焼の仕組み，水溶液の性質，てこの規則性及び電気の性質や働きについて追究する中で，主にそれらの仕組みや性質，規則性及び働きについて，より妥当な考えをつくりだす力を養う。","③　燃焼の仕組み，水溶液の性質，てこの規則性及び電気の性質や働きについて追究する中で，主体的に問題解決しようとする態度を養う。","⑵　生命・地球","①　生物の体のつくりと働き，生物と環境との関わり，土地のつくりと変化，月の形の見え方と太陽との位置関係についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにする。","②　生物の体のつくりと働き，生物と環境との関わり，土地のつくりと変化，月の形の見え方と太陽との位置関係について追究する中で，主にそれらの働きや関わり，変化及び関係について，より妥当な考えをつくりだす力を養う。","③　生物の体のつくりと働き，生物と環境との関わり，土地のつくりと変化，月の形の見え方と太陽との位置関係について追究する中で，生命を尊重する態度や主体的に問題解決しようとする態度を養う。"],"page":75,"expl":{"intro":["第６学年の目標は，自然の事物・現象について，理科の見方・考え方を働かせ，問題を追究する活動を通して，燃焼の仕組み，水溶液の性質，てこの規則性及び電気の性質や働き，生物の体のつくりと働き，生物と環境との関わり，土地のつくりと変化，月の形の見え方と太陽との位置関係についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，問題解決の力や生命を尊重する態度，主体的に問題解決しようとする態度を養うことである。","特に，本学年では，学習の過程において，自然の事物・現象から見いだした問題について追究し，より妥当な考えをつくりだすといった問題解決の力を育成することに重点が置かれている。","(1) 「Ａ物質・エネルギー」に関わる目標","本区分では，燃焼の仕組み，水溶液の性質，てこの規則性及び電気の性質や働きについての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，主にこれらの仕組みや性質，規則性及び働きについて，より妥当な考えをつくりだすといった問題解決の力や主体的に問題解決しようとする態度を養うことが目標である。","ここでは，「粒子」についての基本的な概念等を柱とした内容として，「Ａ(1)燃焼の仕組み」，「Ａ(2)水溶液の性質」を設定する。「Ａ(1)燃焼の仕組み」については，空気の変化に着目して，物の燃え方を多面的に調べ，燃焼の仕組みを捉えるようにする。「Ａ(2)水溶液の性質」については，溶けている物に着目して，それらによる水溶液の性質や働きの違いを多面的に調べ，水溶液の性質や働きを捉えるようにする。","また，「エネルギー」についての基本的な概念等を柱とした内容として，「Ａ(3)てこの規則性」，「Ａ(4)電気の利用」を設定する。「Ａ(3)てこの規則性」については，力を加える位置や力の大きさに着目して，これらの条件とてこの働きとの関係を多面的に調べ，てこの規則性を捉えるようにする。「Ａ(4)電気の利用」については，電気の量や働きに着目して，それらを多面的に調べ，発電や蓄電，電気の変換を捉えるようにする。","(2) 「Ｂ生命・地球」に関わる目標","本区分では，生物の体のつくりと働き，生物と環境との関わり，土地のつくりと変化，月の形の見え方と太陽との位置関係についての理解を図り，観察，実験などに関する基本的な技能を身に付けるようにするとともに，主にこれらの働きや関わり，変化及び関係について，より妥当な考えをつくりだすといった問題解決の力や生命を尊重する態度，主体的に問題解決しようとする態度を養うことが目標である。","ここでは，「生命」についての基本的な概念等を柱とした内容として，「Ｂ(1)人の体のつくりと働き」，「Ｂ(2)植物の養分と水の通り道」，「Ｂ(3)生物と環境」を設定する。「Ｂ(1)人の体のつくりと働き」については，体のつくりと呼吸，消化，排出及び循環の働きに着目して，生命を維持する働きを多面的に調べ，人や他の動物の体のつくりと働きを捉えるようにする。「Ｂ(2)植物の養分と水の通り道」については，植物の体のつくりと体内の水などの行方や葉で養分をつくる働きに着目して，生命を維持する働きを多面的に調べ，植物の体のつくりと働きを捉えるようにする。「Ｂ(3)生物と環境」については，生物と水，空気及び食べ物との関わりや，人と環境との関わりに着目して，それらを多面的に調べ，生物と環境との関わりを捉えるようにする。","また，「地球」についての基本的な概念等を柱とした内容として，「Ｂ(4)土地のつくりと変化」,「Ｂ(5)月と太陽」を設定する。「Ｂ(4)土地のつくりと変化」については，土地やその中に含まれる物に着目して，土地のつくりやでき方を多面的に調べ，土地のつくりと変化を捉えるようにする。「Ｂ(5)月と太陽」については，月と太陽の位置に着目して，これらの位置関係を多面的に調べ，月の形の見え方と月と太陽の位置関係を捉えるようにする。"],"1":[],"2":[],"3":[]}}},"units":[{"g":3,"u":"しぜんのかんさつ","b":"3年","ids":["rika-3-B-1"]},{"g":3,"u":"植物を育てよう","b":"3年","ids":["rika-3-B-1"]},{"g":3,"u":"かげと太陽","b":"3年","ids":["rika-3-B-2"]},{"g":3,"u":"チョウを育てよう","b":"3年","ids":["rika-3-B-1"]},{"g":3,"u":"こん虫を調べよう","b":"3年","ids":["rika-3-B-1"]},{"g":3,"u":"音を調べよう","b":"3年","ids":["rika-3-A-3"]},{"g":3,"u":"光を調べよう","b":"3年","ids":["rika-3-A-3"]},{"g":3,"u":"風のはたらき","b":"3年","ids":["rika-3-A-2"]},{"g":3,"u":"ゴムのはたらき","b":"3年","ids":["rika-3-A-2"]},{"g":3,"u":"明かりをつけよう","b":"3年","ids":["rika-3-A-5"]},{"g":3,"u":"じしゃくのひみつ","b":"3年","ids":["rika-3-A-4"]},{"g":3,"u":"ものの重さを調べよう","b":"3年","ids":["rika-3-A-1"]},{"g":4,"u":"季節と生き物","b":"4年","ids":["rika-4-B-2"]},{"g":4,"u":"1日の気温と天気","b":"4年","ids":["rika-4-B-4"]},{"g":4,"u":"空気と水","b":"4年","ids":["rika-4-A-1"]},{"g":4,"u":"電気のはたらき","b":"4年","ids":["rika-4-A-3"]},{"g":4,"u":"雨水の流れ","b":"4年","ids":["rika-4-B-3"]},{"g":4,"u":"月や星の動き","b":"4年","ids":["rika-4-B-5"]},{"g":4,"u":"自然の中の水","b":"4年","ids":["rika-4-B-4"]},{"g":4,"u":"水の3つのすがた","b":"4年","ids":["rika-4-A-2"]},{"g":4,"u":"ものの体積と温度","b":"4年","ids":["rika-4-A-2"]},{"g":4,"u":"ものの温まり方","b":"4年","ids":["rika-4-A-2"]},{"g":4,"u":"人の体のつくりと運動","b":"4年","ids":["rika-4-B-1"]},{"g":5,"u":"ふりこの運動","b":"5年","ids":["rika-5-A-2"]},{"g":5,"u":"種子の発芽と成長","b":"5年","ids":["rika-5-B-1"]},{"g":5,"u":"魚のたんじょう","b":"5年","ids":["rika-5-B-2"]},{"g":5,"u":"台風の接近","b":"5年","ids":["rika-5-B-4"]},{"g":5,"u":"実や種子のでき方","b":"5年","ids":["rika-5-B-1"]},{"g":5,"u":"雲と天気の変化","b":"5年","ids":["rika-5-B-4"]},{"g":5,"u":"流れる水のはたらき","b":"5年","ids":["rika-5-B-3"]},{"g":5,"u":"川と災害","b":"5年","ids":["rika-5-B-3"]},{"g":5,"u":"電流のはたらき","b":"5年","ids":["rika-5-A-3"]},{"g":5,"u":"もののとけ方","b":"5年","ids":["rika-5-A-1"]},{"g":5,"u":"人のたんじょう","b":"5年","ids":["rika-5-B-2"]},{"g":6,"u":"環境と私たちのくらし","b":"6年","ids":["rika-6-B-3"]},{"g":6,"u":"ものの燃え方と空気","b":"6年","ids":["rika-6-A-1"]},{"g":6,"u":"人や動物の体","b":"6年","ids":["rika-6-B-1"]},{"g":6,"u":"植物の養分と水","b":"6年","ids":["rika-6-B-2"]},{"g":6,"u":"生物のくらしと環境","b":"6年","ids":["rika-6-B-3"]},{"g":6,"u":"てこのしくみとはたらき","b":"6年","ids":["rika-6-A-3"]},{"g":6,"u":"月の形と太陽","b":"6年","ids":["rika-6-B-5"]},{"g":6,"u":"大地のつくりと変化","b":"6年","ids":["rika-6-B-4"]},{"g":6,"u":"火山の噴火と地震","b":"6年","ids":["rika-6-B-4"]},{"g":6,"u":"水溶液の性質","b":"6年","ids":["rika-6-A-2"]},{"g":6,"u":"電気と私たちの生活","b":"6年","ids":["rika-6-A-4"]},{"g":6,"u":"人と環境","b":"6年","ids":["rika-6-B-3"]}],"katsudoName":"","katsudo":{},"bandSecs":{},"unitNote":"教科書（学校図書）の単元と学習指導要領の内容の結び付けは、Claudeが考えた案を先生に確かめていただいたものです。","items":[{"id":"rika-3-A-1","g":[3],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑴","head":"物と重さ","title":"物の性質について，形や体積に着目して，重さを比較しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　物は，形が変わっても重さは変わらないこと。","（イ）　物は，体積が同じでも重さは違うことがあること。","イ　物の形や体積と重さとの関係について追究する中で，差異点や共通点を基に，物の性質についての問題を見いだし，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，３種類以上のものづくりを行うものとする。"],"units":[{"u":"ものの重さを調べよう","b":"3年","s":9}]},{"id":"rika-3-A-2","g":[3],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑵","head":"風とゴムの力の働き","title":"風とゴムの力の働きについて，力と物の動く様子に着目して，それらを比較しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　風の力は，物を動かすことができること。また，風の力の大きさを変えると，物が動く様子も変わること。","（イ）　ゴムの力は，物を動かすことができること。また，ゴムの力の大きさを変えると，物が動く様子も変わること。","イ　風とゴムの力で物が動く様子について追究する中で，差異点や共通点を基に，風とゴムの力の働きについての問題を見いだし，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，３種類以上のものづくりを行うものとする。"],"units":[{"u":"風のはたらき","b":"3年","s":9},{"u":"ゴムのはたらき","b":"3年","s":9}]},{"id":"rika-3-A-3","g":[3],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑶","head":"光と音の性質","title":"光と音の性質について，光を当てたときの明るさや暖かさ，音を出したときの震え方に着目して，光の強さや音の大きさを変えたときの違いを比較しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　日光は直進し，集めたり反射させたりできること。","（イ）　物に日光を当てると，物の明るさや暖かさが変わること。","（ウ）　物から音が出たり伝わったりするとき，物は震えていること。また，音の大きさが変わるとき物の震え方が変わること。","イ　光を当てたときの明るさや暖かさの様子，音を出したときの震え方の様子について追究する中で，差異点や共通点を基に，光と音の性質についての問題を見いだし，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，３種類以上のものづくりを行うものとする。"],"units":[{"u":"音を調べよう","b":"3年","s":9},{"u":"光を調べよう","b":"3年","s":9}]},{"id":"rika-3-A-4","g":[3],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑷","head":"磁石の性質","title":"磁石の性質について，磁石を身の回りの物に近付けたときの様子に着目して，それらを比較しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　磁石に引き付けられる物と引き付けられない物があること。また，磁石に近付けると磁石になる物があること。","（イ）　磁石の異極は引き合い，同極は退け合うこと。","イ　磁石を身の回りの物に近付けたときの様子について追究する中で，差異点や共通点を基に，磁石の性質についての問題を見いだし，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，３種類以上のものづくりを行うものとする。","⑵　内容の「Ａ物質・エネルギー」の⑷のアの（ア）については，磁石が物を引き付ける力は，磁石と物の距離によって変わることにも触れること。"],"units":[{"u":"じしゃくのひみつ","b":"3年","s":9}]},{"id":"rika-3-A-5","g":[3],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑸","head":"電気の通り道","title":"電気の回路について，乾電池と豆電球などのつなぎ方と乾電池につないだ物の様子に着目して，電気を通すときと通さないときのつなぎ方を比較しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　電気を通すつなぎ方と通さないつなぎ方があること。","（イ）　電気を通す物と通さない物があること。","イ　乾電池と豆電球などのつなぎ方と乾電池につないだ物の様子について追究する中で，差異点や共通点を基に，電気の回路についての問題を見いだし，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，３種類以上のものづくりを行うものとする。"],"units":[{"u":"明かりをつけよう","b":"3年","s":9}]},{"id":"rika-3-B-1","g":[3],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑴","head":"身の回りの生物","title":"身の回りの生物について，探したり育てたりする中で，それらの様子や周辺の環境，成長の過程や体のつくりに着目して，それらを比較しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　生物は，色，形，大きさなど，姿に違いがあること。また，周辺の環境と関わって生きていること。","（イ）　昆虫の育ち方には一定の順序があること。また，成虫の体は頭，胸及び腹からできていること。","（ウ）　植物の育ち方には一定の順序があること。また，その体は根，茎及び葉からできていること。","イ　身の回りの生物の様子について追究する中で，差異点や共通点を基に，身の回りの生物と環境との関わり，昆虫や植物の成長のきまりや体のつくりについての問題を見いだし，表現すること。"],"notes":["⑶　内容の「Ｂ生命・地球」の⑴については，次のとおり取り扱うものとする。","ア　アの（イ）及び（ウ）については，飼育，栽培を通して行うこと。","イ　アの（ウ）の「植物の育ち方」については，夏生一年生の双子葉植物を扱うこと。"],"units":[{"u":"しぜんのかんさつ","b":"3年","s":9},{"u":"植物を育てよう","b":"3年","s":9},{"u":"チョウを育てよう","b":"3年","s":9},{"u":"こん虫を調べよう","b":"3年","s":9}]},{"id":"rika-3-B-2","g":[3],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑵","head":"太陽と地面の様子","title":"太陽と地面の様子との関係について，日なたと日陰の様子に着目して，それらを比較しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　日陰は太陽の光を遮るとでき，日陰の位置は太陽の位置の変化によって変わること。","（イ）　地面は太陽によって暖められ，日なたと日陰では地面の暖かさや湿り気に違いがあること。","イ　日なたと日陰の様子について追究する中で，差異点や共通点を基に，太陽と地面の様子との関係についての問題を見いだし，表現すること。"],"notes":["⑷　内容の「Ｂ生命・地球」の⑵のアの（ア）の「太陽の位置の変化」については，東から南，西へと変化することを取り扱うものとする。また，太陽の位置を調べるときの方位は東，西，南，北を扱うものとする。"],"units":[{"u":"かげと太陽","b":"3年","s":9}]},{"id":"rika-4-A-1","g":[4],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑴","head":"空気と水の性質","title":"空気と水の性質について，体積や圧し返す力の変化に着目して，それらと圧す力とを関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　閉じ込めた空気を圧すと，体積は小さくなるが，圧し返す力は大きくなること。","（イ）　閉じ込めた空気は圧し縮められるが，水は圧し縮められないこと。","イ　空気と水の性質について追究する中で，既習の内容や生活経験を基に，空気と水の体積や圧し返す力の変化と圧す力との関係について，根拠のある予想や仮説を発想し，表現すること。"],"notes":["⑵　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。"],"units":[{"u":"空気と水","b":"4年","s":9}]},{"id":"rika-4-A-2","g":[4],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑵","head":"金属，水，空気と温度","title":"金属，水及び空気の性質について，体積や状態の変化，熱の伝わり方に着目して，それらと温度の変化とを関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　金属，水及び空気は，温めたり冷やしたりすると，それらの体積が変わるが，その程度には違いがあること。","（イ）　金属は熱せられた部分から順に温まるが，水や空気は熱せられた部分が移動して全体が温まること。","（ウ）　水は，温度によって水蒸気や氷に変わること。また，水が氷になると体積が増えること。","イ　金属，水及び空気の性質について追究する中で，既習の内容や生活経験を基に，金属，水及び空気の温度を変化させたときの体積や状態の変化，熱の伝わり方について，根拠のある予想や仮説を発想し，表現すること。"],"notes":["⑵　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。"],"units":[{"u":"水の3つのすがた","b":"4年","s":9},{"u":"ものの体積と温度","b":"4年","s":9},{"u":"ものの温まり方","b":"4年","s":9}]},{"id":"rika-4-A-3","g":[4],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑶","head":"電流の働き","title":"電流の働きについて，電流の大きさや向きと乾電池につないだ物の様子に着目して，それらを関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　乾電池の数やつなぎ方を変えると，電流の大きさや向きが変わり，豆電球の明るさやモーターの回り方が変わること。","イ　電流の働きについて追究する中で，既習の内容や生活経験を基に，電流の大きさや向きと乾電池につないだ物の様子との関係について，根拠のある予想や仮説を発想し，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の⑶のアの（ア）については，直列つなぎと並列つなぎを扱うものとする。","⑵　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。"],"units":[{"u":"電気のはたらき","b":"4年","s":9}]},{"id":"rika-4-B-1","g":[4],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑴","head":"人の体のつくりと運動","title":"人や他の動物について，骨や筋肉のつくりと働きに着目して，それらを関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　人の体には骨と筋肉があること。","（イ）　人が体を動かすことができるのは，骨，筋肉の働きによること。","イ　人や他の動物について追究する中で，既習の内容や生活経験を基に，人や他の動物の骨や筋肉のつくりと働きについて，根拠のある予想や仮説を発想し，表現すること。"],"notes":["⑶　内容の「Ｂ生命・地球」の⑴のアの（イ）については，関節の働きを扱うものとする。"],"units":[{"u":"人の体のつくりと運動","b":"4年","s":9}]},{"id":"rika-4-B-2","g":[4],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑵","head":"季節と生物","title":"身近な動物や植物について，探したり育てたりする中で，動物の活動や植物の成長と季節の変化に着目して，それらを関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　動物の活動は，暖かい季節，寒い季節などによって違いがあること。","（イ）　植物の成長は，暖かい季節，寒い季節などによって違いがあること。","イ　身近な動物や植物について追究する中で，既習の内容や生活経験を基に，季節ごとの動物の活動や植物の成長の変化について，根拠のある予想や仮説を発想し，表現すること。"],"notes":["⑷　内容の「Ｂ生命・地球」の⑵については，１年を通じて動物の活動や植物の成長をそれぞれ２種類以上観察するものとする。"],"units":[{"u":"季節と生き物","b":"4年","s":9}]},{"id":"rika-4-B-3","g":[4],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑶","head":"雨水の行方と地面の様子","title":"雨水の行方と地面の様子について，流れ方やしみ込み方に着目して，それらと地面の傾きや土の粒の大きさとを関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　水は，高い場所から低い場所へと流れて集まること。","（イ）　水のしみ込み方は，土の粒の大きさによって違いがあること。","イ　雨水の行方と地面の様子について追究する中で，既習の内容や生活経験を基に，雨水の流れ方やしみ込み方と地面の傾きや土の粒の大きさとの関係について，根拠のある予想や仮説を発想し，表現すること。"],"notes":null,"units":[{"u":"雨水の流れ","b":"4年","s":9}]},{"id":"rika-4-B-4","g":[4],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑷","head":"天気の様子","title":"天気や自然界の水の様子について，気温や水の行方に着目して，それらと天気の様子や水の状態変化とを関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　天気によって１日の気温の変化の仕方に違いがあること。","（イ）　水は，水面や地面などから蒸発し，水蒸気になって空気中に含まれていくこと。また，空気中の水蒸気は，結露して再び水になって現れることがあること。","イ　天気や自然界の水の様子について追究する中で，既習の内容や生活経験を基に，天気の様子や水の状態変化と気温や水の行方との関係について，根拠のある予想や仮説を発想し，表現すること。"],"notes":null,"units":[{"u":"1日の気温と天気","b":"4年","s":9},{"u":"自然の中の水","b":"4年","s":9}]},{"id":"rika-4-B-5","g":[4],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑸","head":"月と星","title":"月や星の特徴について，位置の変化や時間の経過に着目して，それらを関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　月は日によって形が変わって見え，１日のうちでも時刻によって位置が変わること。","（イ）　空には，明るさや色の違う星があること。","（ウ）　星の集まりは，１日のうちでも時刻によって，並び方は変わらないが，位置が変わること。","イ　月や星の特徴について追究する中で，既習の内容や生活経験を基に，月や星の位置の変化と時間の経過との関係について，根拠のある予想や仮説を発想し，表現すること。"],"notes":null,"units":[{"u":"月や星の動き","b":"4年","s":9}]},{"id":"rika-5-A-1","g":[5],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑴","head":"物の溶け方","title":"物の溶け方について，溶ける量や様子に着目して，水の温度や量などの条件を制御しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　物が水に溶けても，水と物とを合わせた重さは変わらないこと。","（イ）　物が水に溶ける量には，限度があること。","（ウ）　物が水に溶ける量は水の温度や量，溶ける物によって違うこと。また，この性質を利用して，溶けている物を取り出すことができること。","イ　物の溶け方について追究する中で，物の溶け方の規則性についての予想や仮説を基に，解決の方法を発想し，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。","⑵　内容の「Ａ物質・エネルギー」の⑴については，水溶液の中では，溶けている物が均一に広がることにも触れること。"],"units":[{"u":"もののとけ方","b":"5年","s":9}]},{"id":"rika-5-A-2","g":[5],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑵","head":"振り子の運動","title":"振り子の運動の規則性について，振り子が１往復する時間に着目して，おもりの重さや振り子の長さなどの条件を制御しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　振り子が１往復する時間は，おもりの重さなどによっては変わらないが，振り子の長さによって変わること。","イ　振り子の運動の規則性について追究する中で，振り子が１往復する時間に関係する条件についての予想や仮説を基に，解決の方法を発想し，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。"],"units":[{"u":"ふりこの運動","b":"5年","s":9}]},{"id":"rika-5-A-3","g":[5],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑶","head":"電流がつくる磁力","title":"電流がつくる磁力について，電流の大きさや向き，コイルの巻数などに着目して，それらの条件を制御しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　電流の流れているコイルは，鉄心を磁化する働きがあり，電流の向きが変わると，電磁石の極も変わること。","（イ）　電磁石の強さは，電流の大きさや導線の巻数によって変わること。","イ　電流がつくる磁力について追究する中で，電流がつくる磁力の強さに関係する条件についての予想や仮説を基に，解決の方法を発想し，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。"],"units":[{"u":"電流のはたらき","b":"5年","s":9}]},{"id":"rika-5-B-1","g":[5],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑴","head":"植物の発芽，成長，結実","title":"植物の育ち方について，発芽，成長及び結実の様子に着目して，それらに関わる条件を制御しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　植物は，種子の中の養分を基にして発芽すること。","（イ）　植物の発芽には，水，空気及び温度が関係していること。","（ウ）　植物の成長には，日光や肥料などが関係していること。","（エ）　花にはおしべやめしべなどがあり，花粉がめしべの先に付くとめしべのもとが実になり，実の中に種子ができること。","イ　植物の育ち方について追究する中で，植物の発芽，成長及び結実とそれらに関わる条件についての予想や仮説を基に，解決の方法を発想し，表現すること。"],"notes":["⑶　内容の「Ｂ生命・地球」の⑴については，次のとおり取り扱うものとする。","ア　アの（ア）の「種子の中の養分」については，でんぷんを扱うこと。","イ　アの（エ）については，おしべ，めしべ，がく及び花びらを扱うこと。また，受粉については，風や昆虫などが関係していることにも触れること。"],"units":[{"u":"種子の発芽と成長","b":"5年","s":9},{"u":"実や種子のでき方","b":"5年","s":9}]},{"id":"rika-5-B-2","g":[5],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑵","head":"動物の誕生","title":"動物の発生や成長について，魚を育てたり人の発生についての資料を活用したりする中で，卵や胎児の様子に着目して，時間の経過と関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　魚には雌雄があり，生まれた卵は日がたつにつれて中の様子が変化してかえること。","（イ）　人は，母体内で成長して生まれること。","イ　動物の発生や成長について追究する中で，動物の発生や成長の様子と経過についての予想や仮説を基に，解決の方法を発想し，表現すること。"],"notes":["⑷　内容の「Ｂ生命・地球」の⑵のアの（イ）については，人の受精に至る過程は取り扱わないものとする。"],"units":[{"u":"魚のたんじょう","b":"5年","s":9},{"u":"人のたんじょう","b":"5年","s":9}]},{"id":"rika-5-B-3","g":[5],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑶","head":"流れる水の働きと土地の変化","title":"流れる水の働きと土地の変化について，水の速さや量に着目して，それらの条件を制御しながら調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　流れる水には，土地を侵食したり，石や土などを運搬したり堆積させたりする働きがあること。","（イ）　川の上流と下流によって，川原の石の大きさや形に違いがあること。","（ウ）　雨の降り方によって，流れる水の速さや量は変わり，増水により土地の様子が大きく変化する場合があること。","イ　流れる水の働きについて追究する中で，流れる水の働きと土地の変化との関係についての予想や仮説を基に，解決の方法を発想し，表現すること。"],"notes":["⑸　内容の「Ｂ生命・地球」の⑶のアの（ウ）については，自然災害についても触れること。"],"units":[{"u":"流れる水のはたらき","b":"5年","s":9},{"u":"川と災害","b":"5年","s":9}]},{"id":"rika-5-B-4","g":[5],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑷","head":"天気の変化","title":"天気の変化の仕方について，雲の様子を観測したり，映像などの気象情報を活用したりする中で，雲の量や動きに着目して，それらと天気の変化とを関係付けて調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　天気の変化は，雲の量や動きと関係があること。","（イ）　天気の変化は，映像などの気象情報を用いて予想できること。","イ　天気の変化の仕方について追究する中で，天気の変化の仕方と雲の量や動きとの関係についての予想や仮説を基に，解決の方法を発想し，表現すること。"],"notes":["⑹　内容の「Ｂ生命・地球」の⑷のアの（イ）については，台風の進路による天気の変化や台風と降雨との関係及びそれに伴う自然災害についても触れること。"],"units":[{"u":"台風の接近","b":"5年","s":9},{"u":"雲と天気の変化","b":"5年","s":9}]},{"id":"rika-6-A-1","g":[6],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑴","head":"燃焼の仕組み","title":"燃焼の仕組みについて，空気の変化に着目して，物の燃え方を多面的に調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　植物体が燃えるときには，空気中の酸素が使われて二酸化炭素ができること。","イ　燃焼の仕組みについて追究する中で，物が燃えたときの空気の変化について，より妥当な考えをつくりだし，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。"],"units":[{"u":"ものの燃え方と空気","b":"6年","s":9}]},{"id":"rika-6-A-2","g":[6],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑵","head":"水溶液の性質","title":"水溶液について，溶けている物に着目して，それらによる水溶液の性質や働きの違いを多面的に調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　水溶液には，酸性，アルカリ性及び中性のものがあること。","（イ）　水溶液には，気体が溶けているものがあること。","（ウ）　水溶液には，金属を変化させるものがあること。","イ　水溶液の性質や働きについて追究する中で，溶けているものによる性質や働きの違いについて，より妥当な考えをつくりだし，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。"],"units":[{"u":"水溶液の性質","b":"6年","s":9}]},{"id":"rika-6-A-3","g":[6],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑶","head":"てこの規則性","title":"てこの規則性について，力を加える位置や力の大きさに着目して，てこの働きを多面的に調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　力を加える位置や力の大きさを変えると，てこを傾ける働きが変わり，てこがつり合うときにはそれらの間に規則性があること。","（イ）　身の回りには，てこの規則性を利用した道具があること。","イ　てこの規則性について追究する中で，力を加える位置や力の大きさとてこの働きとの関係について，より妥当な考えをつくりだし，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。"],"units":[{"u":"てこのしくみとはたらき","b":"6年","s":9}]},{"id":"rika-6-A-4","g":[6],"area":"A","areaName":"Ａ 物質・エネルギー","mark":"⑷","head":"電気の利用","title":"発電や蓄電，電気の変換について，電気の量や働きに着目して，それらを多面的に調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　電気は，つくりだしたり蓄えたりすることができること。","（イ）　電気は，光，音，熱，運動などに変換することができること。","（ウ）　身の回りには，電気の性質や働きを利用した道具があること。","イ　電気の性質や働きについて追究する中で，電気の量と働きとの関係，発電や蓄電，電気の変換について，より妥当な考えをつくりだし，表現すること。"],"notes":["⑴　内容の「Ａ物質・エネルギー」の指導に当たっては，２種類以上のものづくりを行うものとする。","⑵　内容の「Ａ物質・エネルギー」の⑷のアの（ア）については，電気をつくりだす道具として，手回し発電機，光電池などを扱うものとする。"],"units":[{"u":"電気と私たちの生活","b":"6年","s":9}]},{"id":"rika-6-B-1","g":[6],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑴","head":"人の体のつくりと働き","title":"人や他の動物について，体のつくりと呼吸，消化，排出及び循環の働きに着目して，生命を維持する働きを多面的に調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　体内に酸素が取り入れられ，体外に二酸化炭素などが出されていること。","（イ）　食べ物は，口，胃，腸などを通る間に消化，吸収され，吸収されなかった物は排出されること。","（ウ）　血液は，心臓の働きで体内を巡り，養分，酸素及び二酸化炭素などを運んでいること。","（エ）　体内には，生命活動を維持するための様々な臓器があること。","イ　人や他の動物の体のつくりと働きについて追究する中で，体のつくりと呼吸，消化，排出及び循環の働きについて，より妥当な考えをつくりだし，表現すること。"],"notes":["⑶　内容の「Ｂ生命・地球」の⑴については，次のとおり取り扱うものとする。","ア　アの（ウ）については，心臓の拍動と脈拍とが関係することにも触れること。","イ　アの（エ）については，主な臓器として，肺，胃，小腸，大腸，肝臓，腎臓，心臓を扱うこと。"],"units":[{"u":"人や動物の体","b":"6年","s":9}]},{"id":"rika-6-B-2","g":[6],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑵","head":"植物の養分と水の通り道","title":"植物について，その体のつくり，体内の水などの行方及び葉で養分をつくる働きに着目して，生命を維持する働きを多面的に調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　植物の葉に日光が当たるとでんぷんができること。","（イ）　根，茎及び葉には，水の通り道があり，根から吸い上げられた水は主に葉から蒸散により排出されること。","イ　植物の体のつくりと働きについて追究する中で，体のつくり，体内の水などの行方及び葉で養分をつくる働きについて，より妥当な考えをつくりだし，表現すること。"],"notes":null,"units":[{"u":"植物の養分と水","b":"6年","s":9}]},{"id":"rika-6-B-3","g":[6],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑶","head":"生物と環境","title":"生物と環境について，動物や植物の生活を観察したり資料を活用したりする中で，生物と環境との関わりに着目して，それらを多面的に調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　生物は，水及び空気を通して周囲の環境と関わって生きていること。","（イ）　生物の間には，食う食われるという関係があること。","（ウ）　人は，環境と関わり，工夫して生活していること。","イ　生物と環境について追究する中で，生物と環境との関わりについて，より妥当な考えをつくりだし，表現すること。"],"notes":["⑷　内容の「Ｂ生命・地球」の⑶については，次のとおり取り扱うものとする。","ア　アの（ア）については，水が循環していることにも触れること。","イ　アの（イ）については，水中の小さな生物を観察し，それらが魚などの食べ物になっていることに触れること。"],"units":[{"u":"環境と私たちのくらし","b":"6年","s":9},{"u":"生物のくらしと環境","b":"6年","s":9},{"u":"人と環境","b":"6年","s":9}]},{"id":"rika-6-B-4","g":[6],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑷","head":"土地のつくりと変化","title":"土地のつくりと変化について，土地やその中に含まれる物に着目して，土地のつくりやでき方を多面的に調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　土地は，礫，砂，泥，火山灰などからできており，層をつくって広がっているものがあること。また，層には化石が含まれているものがあること。","（イ）　地層は，流れる水の働きや火山の噴火によってできること。","（ウ）　土地は，火山の噴火や地震によって変化すること。","イ　土地のつくりと変化について追究する中で，土地のつくりやでき方について，より妥当な考えをつくりだし，表現すること。"],"notes":["⑸　内容の「Ｂ生命・地球」の⑷については，次のとおり取り扱うものとする。","ア　アの（イ）については，流れる水の働きでできた岩石として礫岩，砂岩，泥岩を扱うこと。","イ　アの（ウ）については，自然災害についても触れること。"],"units":[{"u":"大地のつくりと変化","b":"6年","s":9},{"u":"火山の噴火と地震","b":"6年","s":9}]},{"id":"rika-6-B-5","g":[6],"area":"B","areaName":"Ｂ 生命・地球","mark":"⑸","head":"月と太陽","title":"月の形の見え方について，月と太陽の位置に着目して，それらの位置関係を多面的に調べる活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のことを理解するとともに，観察，実験などに関する技能を身に付けること。","（ア）　月の輝いている側に太陽があること。また，月の形の見え方は，太陽と月との位置関係によって変わること。","イ　月の形の見え方について追究する中で，月の位置や形と太陽の位置との関係について，より妥当な考えをつくりだし，表現すること。"],"notes":["⑹　内容の「Ｂ生命・地球」の⑸のアの（ア）については，地球から見た太陽と月との位置関係で扱うものとする。"],"units":[{"u":"月の形と太陽","b":"6年","s":9}]}],"kaisetsu":{"source":"小学校学習指導要領（平成29年告示）解説 理科編（文部科学省，平成29年7月）","items":{"rika-3-A-1":{"page":31,"name":"物と重さ","expl":{"intro":["本内容は，「粒子」についての基本的な概念等を柱とした内容のうちの「粒子の保存性」に関わるものであり，第５学年「Ａ(1)物の溶け方」の学習につながるものである。","ここでは，児童が，物の形や体積に着目して，重さを比較しながら，物の性質を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に差異点や共通点を基に，問題を見いだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 物の形に着目して，数種の身の回りにある形を変えられる物を，広げたり，いくつかに分けて丸めたりするなどして形を変え，手ごたえなどの体感を基に，てんびんを用いたり，自動上皿はかりを用いて重さを数値化したりして，重さを比較しながら調べる。これらの活動を通して，差異点や共通点を基に，形を変えたときの重さの変化についての問題を見いだし，表現するとともに，物は，形が変わっても重さは変わらないことを捉えるようにする。","(ｲ) 物の体積に着目して，複数の種類の身の回りにある物を，体積を同じにして，手ごたえなどの体感を基に，てんびんを用いたり，自動上皿はかりを用いて重さを数値化したりして，重さの違いを比較しながら調べる。これらの活動を通して，差異点や共通点を基に，体積を同じにしたときの重さの違いについての問題を見いだし，表現するとともに，物は，体積が同じでも重さは違うことがあることを捉えるようにする。","ここで扱う対象としては，(ｱ)については，粘土やアルミニウム箔など，広げたり，丸めたりして形を変えることが容易な物，(ｲ)については，児童の身の回りにある砂糖や食塩などといった粉状の物など，同体積にして重さの違いを比べることが容易な物や，同形・同体積の木や金属などが考えられる。","ここでの指導に当たっては，物の重さを手ごたえなどの体感を通して調べるとともに，てんびんを用いて比べたり，自動上皿はかりを用いて調べた結果を表に整理したりして，物の形や体積と重さとの関係について考えたり，説明したりする活動の充実を図るようにする。これらの機器の使用や重さの単位については，算数科の学習との関連を図るようにする。"],"k":[],"s":[]}},"rika-3-A-2":{"page":32,"name":"風とゴムの力の働き","expl":{"intro":["本内容は，「エネルギー」についての基本的な概念等を柱とした内容のうちの「エネルギーの捉え方」に関わるものであり，第５学年「Ａ(2)振り子の運動」の学習につながるものである。","ここでは，児童が，風とゴムの力と物の動く様子に着目して，それらを比較しながら，風とゴムの力の働きを調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に差異点や共通点を基に，問題を見いだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 風の力で動く物をつくり，物に風を当てたときの風の力の大きさと物の動く様子に着目して，それらを比較しながら，風の力の大きさと物の動く様子との関係を調べる。これらの活動を通して，差異点や共通点を基に，風の力の働きについての問題を見いだし，表現するとともに，風の力は，物を動かすことができることや，風の力の大きさを変えると，物が動く様子も変わることを捉えるようにする。","(ｲ) ゴムの力で動く物をつくり，ゴムを引っぱったり，ねじったりしたときの元に戻ろうとする力の大きさと物の動く様子に着目して，それらを比較しながら，ゴムの元に戻ろうとする力の大きさと物の動く様子との関係を調べる。これらの活動を通して，差異点や共通点を基に，ゴムの力の働きについての問題を見いだし，表現するとともに，ゴムの力は，物を動かすことができることや，ゴムの力の大きさを変えると，物が動く様子も変わることを捉えるようにする。","ここで扱う対象としては，(ｱ)については，例えば，風の強さを変えることができる送風器などを用いて起こした風が考えられる。また，(ｲ)については，例えば，長さや太さが同じゴムが考えられる。その際，ゴムを複数束ねたり，引っぱる長さを変えたりして，その力の大きさを変えることが考えられる。","ここでの指導に当たっては，生活科の学習との関連を考慮しながら，風を受けたときやゴムの力を働かせたときの手ごたえなどの体感を基にした活動を重視するようにする。また，風の強さやゴムの伸びなどと物の動きとの関係を表に整理するなど，風とゴムの力の働きについて考えたり，説明したりする活動の充実を図るようにする。さらに，風やゴムの力で動く物の動きや動く距離を変えるなど，活動の目的によって風やゴムの力を調整することが考えられる。","なお，ゴムを扱う際には，安全な使用に配慮するように指導する。"],"k":[],"s":[]}},"rika-3-A-3":{"page":33,"name":"光と音の性質","expl":{"intro":["本内容は，「エネルギー」についての基本的な概念等を柱とした内容のうちの「エネルギーの捉え方」に関わるものであり，中学校第１分野「(1)ア(ｱ)光と音」の学習につながるものである。","ここでは，児童が，光を当てたときの明るさや暖かさ，音を出したときの震え方に着目して，光の強さや音の大きさを変えたときの現象の違いを比較しながら，光と音の性質について調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に差異点や共通点を基に，問題を見いだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 平面鏡に日光を当てたときの，平面鏡の向きと光の様子に着目して，それらを比較しながら，光の進み方を調べる。これらの活動を通して，差異点や共通点を基に，光の性質についての問題を見いだし，表現するとともに，日光は直進すること，反射させることができること，反射した日光を重ねることができることを捉えるようにする。日光が直進することについては，身の回りで見られる日光の様子などから捉えることも考えられる。また，虫眼鏡を使い，日光を集めることができることを捉えるようにする。","(ｲ) 何枚かの平面鏡を使い，光を当てたときの物の明るさや暖かさに着目して，光の強さを変えたときの現象の違いを比較しながら，物の明るさや暖かさの違いを調べる。これらの活動を通して，差異点や共通点を基に，光の性質についての問題を見いだし，表現するとともに，物に日光を当てると，物の明るさや暖かさが変わることを捉えるようにする。また，虫眼鏡では，日光が集まったところを小さくすると明るさや暖かさが増し，黒い紙などが焦げることがあることも捉えるようにする。","(ｳ)  身の回りにある物を使って音を出したときの物の震え方に着目して，音の大きさを変えたときの現象の違いを比較しながら，音の大きさと物の震え方との関係を調べる。これらの活動を通して，差異点や共通点を基に，音の性質についての問題を見いだし，表現するとともに，物から音が出たり伝わったりするときは物が震えていることや，音が大きいときは震え方が大きく，音が小さいときは震え方が小さいといった，音の大きさが震え方に関係していることを捉えるようにする。","ここで扱う対象としては，光については日光とし，日光を当てた物の温度を測定する際には，放射温度計などを利用することが考えられる。また，平面鏡の代わりに，アルミニウム板などの光を反射させることができる物の使用が考えられる。音の大きさと物の震え方との関係を捉える道具については，児童が扱いやすい打楽器などが考えられる。また，音の伝わりを捉える活動としては，鉄棒や糸電話などを使うことなどが考えられる。","ここでの指導に当たっては，生活科の学習との関連を考慮し，諸感覚を働かせながら明るさや暖かさ，音の大小，物の震え方などを捉えるようにする。また，日光の重なり方が変わると明るさや暖かさが変わることや，音の大きさが変わるとき，物の震え方が変わることについて，実験の結果を表に整理して比較するなど，光と音の性質について考えたり，説明したりする活動の充実を図るようにする。","日常生活との関連として，光の反射が照明の反射板に活用されていることやスピーカーなどから音が出るとき，それが震えていることを取り上げることが考えられる。","なお，平面鏡や虫眼鏡などを扱う際には，破損して，指を切ったり手を傷つけたりする危険が伴うので，その扱い方には十分気を付けるようにする。また，直接目で太陽を見たり，反射させた日光を人の顔に当てたり，虫眼鏡で集めた日光を衣服や生物に当てたりしないようにするなど，安全に配慮するように指導する。"],"k":[],"s":[]}},"rika-3-A-4":{"page":35,"name":"磁石の性質","expl":{"intro":["本内容は，「エネルギー」についての基本的な概念等を柱とした内容のうちの「エネルギーの捉え方」，「エネルギーの変換と保存」に関わるものであり，第５学年「Ａ(3)電流がつくる磁力」の学習につながるものである。","ここでは，児童が，磁石を身の回りの物に近付けたときの様子に着目して，それらを比較しながら，磁石の性質について調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に差異点や共通点を基に，問題を見いだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 磁石を身の回りの物に近付けたときの，物の様子や特徴に着目して，それらを比較しながら，磁石に引き付けられる物や引き付けられない物を調べる。これらの活動を通して，差異点や共通点を基に，磁石の性質についての問題を見いだし，表現するとともに，磁石に引き付けられる物と引き付けられない物があることや，磁石に引き付けられる物には，磁石に近付けると磁石になる物があることを捉えるようにする。また，磁石に物が引き付けられる力を手ごたえなどで感じとったり，磁石を方位磁針に近付けて，その動き方を調べたりして，磁石と物との間を開けても引き付ける力が働いていることを捉えるようにする。その際，磁石が物を引き付ける力は，磁石と物の距離によって変わることにも触れるようにする。","(ｲ) 二つの磁石を近付け，磁石が相互に引き合ったり，退け合ったりする様子に着目して，それらを比較しながら，磁石の極を調べる。これらの活動を通して，差異点や共通点を基に，磁石の性質についての問題を見いだし，表現するとともに，磁石の異極は引き合い，同極は退け合うことを捉えるようにする。また，磁石を自由に動くようにしたときの，磁石が動いたり止まったりする様子から，磁石には形や大きさが違っていてもいつも南北の向きに止まるという性質があることを捉えるようにする。その際，北の方向を指している端を「Ｎ極」，南の方向を指している端を「Ｓ極」と名付けていることに触れるようにする。","ここで扱う対象としては，児童が扱いやすい棒磁石やＵ字型磁石などが考えられる。これらを使用する際には，磁気カードなど磁気の影響を受けやすい物に近付けないなど，適切な取扱いについて指導する。","ここでの指導に当たっては，磁石に引き付けられる物，引き付けられない物を調べる際に，実験の結果を表などに分類，整理するなど，磁石の性質について考えたり，説明したりする活動の充実を図るようにする。","日常生活との関連として，身の回りには，磁石の性質を利用した物が多数あることを取り上げることが考えられる。"],"k":[],"s":[]}},"rika-3-A-5":{"page":37,"name":"電気の通り道","expl":{"intro":["本内容は，「エネルギー」についての基本的な概念等を柱とした内容のうちの「エネルギーの変換と保存」に関わるものであり，第４学年「Ａ(3)電流の働き」の学習につながるものである。","ここでは，児童が，乾電池と豆電球などのつなぎ方と乾電池につないだ物の様子に着目して，電気を通すときと通さないときのつなぎ方を比較しながら，電気の回路について調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に差異点や共通点を基に，問題を見いだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) １個の乾電池と１個の豆電球などを導線でつないだときの，つなぎ方と豆電球などの様子に着目して，それらを比較しながら，豆電球などが動作するつなぎ方と動作しないつなぎ方を調べる。これらの活動を通して，電気の回路についての問題を見いだし，表現するとともに，回路ができると電気が通り，豆電球などが動作することを捉えるようにする。また，導線を乾電池の二つの極以外につないだり，導線と乾電池がつながっていなかったり，回路の一部が切れていたりすると豆電球などは動作しないことも捉えるようにする。","(ｲ) 回路の一部に，身の回りにあるいろいろな物を入れたときの豆電球などの様子に着目して，それらを比較しながら，電気を通す物や通さない物を調べる。これらの活動を通して，電気の回路についての問題を見いだし，表現するとともに，物には電気を通す物と通さない物があることを捉えるようにする。","ここで扱う対象としては，児童の身の回りにある物で，鉄やアルミニウム，ガラス，木などが考えられる。","ここでの指導に当たっては，電気を通す物と通さない物を調べる際に，実験の結果を表などに分類，整理するなど，電気の回路について考えたり，説明したりする活動の充実を図るようにする。実験の結果を基に考察する場面では，豆電球などが動作したり，動作しなかったりする現象を「回路」という言葉を使用して考察し，適切に説明できるようにすることが考えられる。","なお，豆電球などを使わないで，乾電池の二つの極を直接導線でつなぐことのないようにするなど，安全に配慮するように指導する。","（内容の取扱い） (1) 内容の「Ａ物質・エネルギー」の指導に当たっては，３種類以上のものづくりを行うものとする。","風やゴムの力の働きを活用したものづくりとしては，風やゴムの力を動力に変換するという観点から，例えば，物を動かすことを目的とした，風やゴムの力で動く自動車や風車などが考えられる。","光の性質を活用したものづくりとしては，日光により物の明るさや暖かさが変わるという観点から，例えば，平面鏡を使って物を明るくしたり暖かくしたりすることを目的とした装置などが考えられる。","音の性質を活用したものづくりとしては，音は，様々な物が震えることで伝わるという観点から，例えば，離れた場所や同時に複数の場所に音声を伝えることを目的とした糸電話などが考えられる。","磁石の性質を活用したものづくりとしては，磁石の異極は引き合い，同極は退け合うという観点から，例えば，極の働きや性質を使って物を動かすことを目的とした自動車や船などが考えられる。","乾電池や豆電球などを使った，電気の性質を活用したものづくりとしては，回路ができると電気が通るという観点から，例えば，回路につないだ豆電球などを動作させたり止めたりすることを目的としたスイッチ，電気を通す物であるかどうかを調べることを目的としたテスターなどが考えられる。"],"k":[],"s":[]}},"rika-3-B-1":{"page":39,"name":"身の回りの生物","expl":{"intro":["本内容は，生活科「(7)動植物の飼育・栽培」の学習を踏まえて，「生命」についての基本的な概念等を柱とした内容のうちの「生物の構造と機能」，「生命の連続性」，「生物と環境の関わり」に関わるものであり，第４学年「Ｂ(1)人の体のつくりと運動」，「Ｂ(2)季節と生物」，第６学年「Ｂ(2)植物の養分と水の通り道」，中学校第２分野「(1)いろいろな生物とその共通点」の学習につながるものである。","ここでは，児童が，身の回りの生物について，探したり育てたりする中で，これらの様子や周辺の環境，成長の過程や体のつくりに着目して，それらを比較しながら，生物と環境との関わり，昆虫や植物の成長のきまりや体のつくりを調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に差異点や共通点を基に，問題を見いだす力や生物を愛護する態度，主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 児童の身の回りに見られる様々な生物の色，形，大きさなどに着目して，それらを比較しながら，身の回りの生物の特徴を調べる。これらの活動を通して，差異点や共通点を基に，生物の姿についての問題を見いだし，表現するとともに，生物にはそれぞれに固有の形態があることを捉えるようにする。例えば，植物については，タンポポやチューリップなどの様々な種類の植物を観察し，着目した点に即して比較する。また，動物についても，アリやカエルなどの様々な種類の動物を観察し，同様に比較する。その際，児童が身の回りの様々な種類の植物や動物を見たり触れたりにおいを感じたりするなど直接観察することを通して，諸感覚で確認できる特徴を見いだし，捉えるようにする。","また，多様な環境の下で生きている様々な生物について，生物が生息している場所に着目して，それらを比較しながら，生物が生息している様子を調べる。これらの活動を通して，生物と環境との関わりについて，問題を見いだし，表現するとともに，生物が周辺の環境と関わって生きていることを捉えるようにする。例えば，植物に集まる昆虫や植物に生息する昆虫の様子を観察し，昆虫には植物の花の蜜を吸ったり葉を食べたりして生活しているものがいることや，植物をすみかにしているものがいること，また，石のかげなどで生活しているものがいることに気付くようにすることが考えられる。","(ｲ) 昆虫の成長の過程に着目して，複数の種類の昆虫の成長の過程を比較しながら，成長による体の変化を調べる。これらの活動を通して，差異点や共通点を基に，昆虫の成長についての問題を見いだし，表現するとともに，昆虫の育ち方には，「卵→幼虫→蛹→成虫」というような一定の順序があることを捉えるようにする。その際，幼虫の時期には食べ物を食べ，脱皮をして体が大きくなることや，蛹の時期には食べ物を食べないことを捉えるようにする。昆虫の育ち方については，「卵→幼虫→蛹→成虫」や「卵→幼虫→成虫」などの変態の仕方の違う昆虫を用意し，それらを比較することによって，その過程が異なるものがあることにも触れるようにする。","また，昆虫の体のつくりに着目して，複数の種類の昆虫の体のつくりを比較しながら調べる。これらの活動を通して，差異点や共通点を基に，昆虫の体のつくりについての問題を見いだし，表現するとともに，昆虫の成虫の体は頭，胸，腹の三つの部分からできていること，頭には目や触角，口があること，胸には３対６本のあしがあり，はねのついているものがあること，腹はいくつかの節からできていることなどの体のつくりの特徴を捉えるようにする。","(ｳ) 植物の成長の過程に着目して，複数の種類の植物の成長の過程を比較しながら，成長による体の変化を調べる。これらの活動を通して，差異点や共通点を基に，植物の育ち方についての問題を見いだし，表現するとともに，植物の育ち方には，種子から発芽し子葉が出て，葉がしげり，花が咲き，果実がなって種子ができた後に個体は枯死するという，一定の順序があることを捉えるようにする。","また，植物の体のつくりに着目して，複数の種類の植物の体のつくりを比較しながら調べる。これらの活動を通して，差異点や共通点を基に，植物の体のつくりについての問題を見いだし，表現するとともに，植物の体は根，茎及び葉からできていて，根は地中にあること，茎は葉や花をつけることなどの体のつくりの特徴を捉えるようにする。","ここで扱う対象としては，(ｱ)については，学校で栽培している植物に加え，校庭などの身近な場所に生育する野草として，例えばキク科などの植物が考えられる。また，環境との関わりについては，昆虫との関わりがよく分かるような植物として，例えば，アブラナ科，ミカン科などの植物が考えられる。環境との関わりがよく分かるような動物としては，例えば，身近な昆虫やダンゴムシなどの節足動物が考えられる。(ｲ)については，飼育が簡単で，身近に見られる昆虫を扱うようにする。(ｳ)については，栽培が簡単で，身近に見られるもので，夏生一年生の双子葉植物を扱うようにする。","ここでの指導に当たっては，生活科の学習との関連を考慮しながら，理科の学習の基盤となる自然体験活動の充実を図り，児童の野外での発見や気付きを大切にする。また，観察の際は，直接観察することに加え，細かい部分を拡大するなどして，生物の特徴を図や絵で記録するなど，身の回りの生物について考えたり，説明したりする活動の充実を図るようにする。その際，例えば，虫眼鏡や携帯型の顕微鏡などの器具の使用が考えられる。(ｱ)については，例えば，校庭などの身近な場所で，花の色や葉の形，大きさなどに着目して観察を行い，比較しながら特徴を見いだしていくようにする。その際，観察の後に振り返りを行ったり，着目した点に即して，仲間分けなどの活動を取り入れたりするなど，児童の生物への興味・関心が高まるよう工夫するようにする。(ｲ)，(ｳ)については，昆虫の卵や幼虫を探し，それらを飼育し観察したり，植物を栽培し観察したりする活動を継続して行い，昆虫や植物の育ち方についての理解の充実を図るとともに，昆虫が食べ物を食べて成長していく様子や，植物が発芽し成長し花が咲き，果実がなって種子ができて枯れていく様子などから，生物を愛護しようとする態度を養うようにする。さらに，昆虫の体のつくりを調べる際には，頭，胸，腹の三つの部分から体ができていて，胸には３対６本のあしがあるものを「昆虫」という名称を使用して考察し，適切に説明できるようにすることが考えられる。","なお，野外での学習に際しては，毒をもつ生物に注意するとともに事故に遭わないようにするなど，安全に配慮するように指導する。さらに，自然環境の中で，生物の採取は必要最小限にとどめるなど，生態系の維持に配慮するようにし，環境保全の態度を育てるようにする。"],"k":[],"s":[]}},"rika-3-B-2":{"page":42,"name":"太陽と地面の様子","expl":{"intro":["本内容は，「地球」についての基本的な概念等を柱とした内容のうちの「地球の大気と水の循環」，「地球と天体の運動」に関わるものであり，第４学年「Ｂ(4)天気の様子」，「Ｂ(5)月と星」の学習につながるものである。","ここでは，児童が，日なたと日陰の様子に着目して，それらを比較しながら，太陽の位置と地面の様子を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に差異点や共通点を基に，問題を見いだす力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 建物によってできる日陰や，物によってできる影の位置に着目して，継続的に観察し，それらを比較しながら，時間ごとの，太陽と日陰や影の位置を調べる。これらの活動を通して，差異点や共通点を基に，太陽と日陰や影の位置の変化についての問題を見いだし，表現するとともに，太陽が影の反対側にあることを基に，日陰は太陽の光を遮るとできることや日陰の位置は太陽の位置の変化によって変わることを捉えるようにする。その際，太陽の位置については，影をつくっている物を目印にして継続的に調べ，日陰の位置や地面にできる影の位置の変化と太陽の位置の変化との関係を捉えるようにする。このとき，太陽の位置を午前から午後にわたって数回調べ，太陽の位置が東の方から南の空を通って西の方に変化することを捉えるようにする。","(ｲ) 太陽の光が当たっている地面と当たっていない地面の暖かさや湿り気に着目して，それらを比較しながら，地面の様子を調べる。これらの活動を通して，差異点や共通点を基に，太陽と地面の様子との関係についての問題を見いだし，表現するとともに，地面は太陽によって暖められ，日なたと日陰では地面の暖かさや湿り気に違いがあることを捉えるようにする。その際，太陽の光がよく当たる場所で，朝と昼の地面の温度を測って比較し，太陽の光が地面を暖めていることを捉えるようにする。","ここでの指導に当たっては，日陰の位置の変化や日なたと日陰の地面の様子を資料や映像で調べるだけでなく，太陽の位置を方位で記録したり，固定した物の影の位置を，時間をおいて地面に描いたりする活動を通して，日陰の位置の変化と太陽の位置の変化との関係を捉えるようにする。また，太陽や影の位置の変化を調べる活動では，方位磁針を用いて方位を調べ，東，西，南，北で空間を捉えるようにする。なお，児童が太陽の位置の変化を調べる際には，地球から見た太陽の位置の変化を扱うものとする。一方，日なたと日陰の地面の暖かさの違いを調べる活動については，手や足で地面に触れるなど体感を通して感じ取るようにするとともに，放射温度計などを用いて地面の温度を測定し，数値化して比較できるようにする。","日常生活や他教科等との関連として，方位については，日常生活や社会科との関連を図り，日常生活において使えるようにする。","なお，太陽の観察においては，JIS規格の遮光板を必ず用い，安全に配慮するように指導する。"],"k":[],"s":[]}},"rika-4-A-1":{"page":47,"name":"空気と水の性質","expl":{"intro":["本内容は，「粒子」についての基本的な概念等を柱とした内容のうちの「粒子の存在」に関わるものであり，第６学年「Ａ(1)燃焼の仕組み」の学習につながるものである。","ここでは，児童が，体積や圧し返す力の変化に着目して，それらと圧す力とを関係付けて，空気と水の性質を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 閉じ込めた空気を圧し縮めたときの体積や圧し返す力に着目して，それらと圧す力とを関係付けて，容器に閉じ込めた空気を圧し縮めたときの体積や圧し返す力の変化を調べる。これらの活動を通して，空気の性質について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，閉じ込めた空気を圧すと，体積は小さくなるが，圧し返す力は大きくなることを捉えるようにする。","(ｲ) 閉じ込めた空気や水に力を加えたときの体積や圧し返す力の変化に着目して，空気と水の場合を比較しながら調べる。これらの活動を通して，水の性質について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，閉じ込めた空気は圧し縮められるが，水は圧しても体積は変わらないことから，水は圧し縮められないことを捉えるようにする。","ここで扱う対象としては，閉じ込めた空気と水を使用する。その際，空気を閉じ込めても圧し縮めることが容易にできる物や，体積の変化を容易に捉えることができる物を使用することが考えられる。","ここでの指導に当たっては，空気と水の性質の違いを，力を加えたときの手ごたえなどの体感を基にしながら調べるようにする。また，空気や水の存在や力を加える前後の空気や水の体積変化を図や絵を用いて表現するなど，空気や水の性質について考えたり，説明したりする活動の充実を図るようにする。さらに，空気と水の性質を踏まえ，それらを利用したおもちゃや道具などの仕組みについて，学んだことを適用し，表現することが考えられる。","日常生活との関連として，ボールやタイヤなど，空気の性質を利用した物があることを取り上げることが考えられる。","なお，容器に閉じ込めた空気や水を圧し縮めようとする際には，容器が破損したり，容器の一部が飛び出したりして，容器などの一部が顔や体などに当たったりしないようにするなど，安全に配慮するように指導する。"],"k":[],"s":[]}},"rika-4-A-2":{"page":48,"name":"金属，水，空気と温度","expl":{"intro":["本内容は，「粒子」についての基本的な概念等を柱とした内容のうちの「粒子のもつエネルギー」に関わるものであり，中学校第１分野「(2)ア(ｳ)状態変化」の学習につながるものである。","ここでは，児童が，体積や状態の変化，熱の伝わり方に着目して，それらと温度の変化とを関係付けて，金属，水及び空気の性質を調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 金属，水及び空気を温めたり，冷やしたりしたときの体積の変化に着目して，それらと温度の変化とを関係付けて，金属，水及び空気の温度変化に伴う体積の変化を調べる。これらの活動を通して，金属，水及び空気の性質について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，金属，水及び空気は，温めたり冷やしたりすると，それらの体積は変わるが，その程度には違いがあること，これらの中では空気の温度による体積の変化が最も大きいことを捉えるようにする。","(ｲ) 金属，水及び空気を熱したときの熱の伝わり方に着目して，それらと温度の変化とを関係付けて，金属，水及び空気の温まり方を調べる。これらの活動を通して，金属，水及び空気の性質について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，金属は熱せられた部分から順に温まっていくこと，水や空気は熱を加えられた部分が上方に移動して全体が温まっていくことを捉えるようにする。また，物によってその温まり方には違いがあることを捉えるようにする。","(ｳ) 水の状態に着目して，温度の変化と関係付けて，水の状態の変化を調べる。これらの活動を通して，温度を変化させたときの水の体積や状態の変化について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，水は，温度によって水蒸気や氷に変わることを捉えるようにする。また，水が氷になると体積が増えることを捉えるようにする。水を熱していき，100℃近くになると沸騰した水の中から盛んに泡が出てくるが，この泡を水の中から出てきた空気であると考えている児童がいる。この泡を集めて冷やすと水になることから，この泡は空気ではなく水が変化したものであることに気付くようにする。水が凍って氷になることを捉える際には，寒剤を使って水の温度を０℃以下に下げて調べることが考えられる。これらのことから，水は温度によって液体，気体，又は固体に状態が変化するということを捉えるようにする。","ここでの指導に当たっては，水の温度の変化を捉える際に，実験の結果をグラフで表現し読み取ったり，状態が変化すると体積も変化することを図や絵を用いて表現したりするなど，金属，水及び空気の性質について考えたり，説明したりする活動の充実を図るようにする。さらに，水は100℃より低い温度でも蒸発していることを捉えるようにするために，第４学年「Ｂ(4)天気の様子」における自然界での水の状態変化の学習との関連を図るようにする。","日常生活との関連として，鉄道のレールの継ぎ目，道路橋の伸縮装置，冷暖房時の空気循環の効果などを取り上げることが考えられる。","なお，火を使用して実験したり，熱した湯の様子を観察したりする際に火傷などの危険を伴うので，保護眼鏡を着用することや使用前に器具の点検を行うこと，加熱器具などの適切な操作を確認することなど，安全に配慮するように指導する。"],"k":[],"s":[]}},"rika-4-A-3":{"page":50,"name":"電流の働き","expl":{"intro":["本内容は，第３学年「Ａ(5)電気の通り道」の学習を踏まえて，「エネルギー」についての基本的な概念等を柱とした内容のうちの「エネルギーの変換と保存」に関わるものであり，第５学年「Ａ(3)電流がつくる磁力」の学習につながるものである。","ここでは，児童が，電流の大きさや向き，乾電池につないだ物の様子に着目して，それらを関係付けて，電流の働きを調べる活動を通して，それらについての理解を図り，観察，実験などに関する技能を身に付けるとともに，主に既習の内容や生活経験を基に，根拠のある予想や仮説を発想する力や主体的に問題解決しようとする態度を育成することがねらいである。","(ｱ) 乾電池の数を１個から２個に増やしたり，つなぎ方を変えたりしたときの豆電球やモーターの動作の様子に着目して，これらの変化と電流の大きさや向きとを関係付けて電流の働きを調べる。これらの活動を通して，電流の大きさや向きと乾電池につないだ物の様子との関係について，既習の内容や生活経験を基に，根拠のある予想や仮説を発想し，表現するとともに，乾電池の数やつなぎ方を変えると，電流の大きさや向きが変わり，豆電球の明るさやモーターの回り
