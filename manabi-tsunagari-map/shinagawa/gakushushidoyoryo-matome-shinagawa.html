{"1":"1・2年","3":"3・4年","5":"5・6年"},"trowNote":"行は、解説 国語編の第3章で指導事項の系統を示している項目（「言葉の働き」「構成の検討」など）です。"},{"id":"shakai","name":"社会","section":"第２章 第２節 社会","textbook":"東京書籍","grades":[3,4,5,6],"areas":[{"key":"chiri","name":"地理的環境と人々の生活","grades":[3,4,5]},{"key":"rekishi","name":"歴史と人々の生活","grades":[3,4,6]},{"key":"koumin","name":"現代社会の仕組みや働きと人々の生活","grades":[3,4,5,6]}],"goals":{"3":{"lines":["社会的事象の見方・考え方を働かせ，学習の問題を追究・解決する活動を通して，次のとおり資質・能力を育成することを目指す。","⑴　身近な地域や市区町村の地理的環境，地域の安全を守るための諸活動や地域の産業と消費生活の様子，地域の様子の移り変わりについて，人々の生活との関連を踏まえて理解するとともに，調査活動，地図帳や各種の具体的資料を通して，必要な情報を調べまとめる技能を身に付けるようにする。","⑵　社会的事象の特色や相互の関連，意味を考える力，社会に見られる課題を把握して，その解決に向けて社会への関わり方を選択・判断する力，考えたことや選択・判断したことを表現する力を養う。","⑶　社会的事象について，主体的に学習の問題を解決しようとする態度や，よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとともに，思考や理解を通して，地域社会に対する誇りと愛情，地域社会の一員としての自覚を養う。"],"page":31,"expl":{"intro":["これは，教科の目標を受け，第３学年の目標を示している。","第３学年においては，社会的事象の見方・考え方を働かせ，学習問題を追究・解決する活動を通して，次の(1)から(3)までのとおり資質・能力を育成することを目指す。"],"1":["これは，第３学年における「知識及び技能」に関する目標を示している。","身近な地域や市区町村の地理的環境，地域の安全を守るための諸活動や地域の産業と消費生活の様子，地域の様子の移り変わりについて，人々の生活との関連を踏まえて理解するとは，知識に関する目標を示している。","身近な地域や市区町村の地理的環境について理解するとは，身近な地域や自分たちの市区町村の位置，地形や土地利用，交通の広がり，市役所などの主な公共施設の場所と働き，古くから残る建造物の分布などを基に，身近な地域や市区町村の様子を大まかに理解できるようにすることである。","地域の安全を守るための諸活動や地域の産業と消費生活の様子について理解するとは，消防署や警察署などの関係機関の働きや，地域に見られる生産や販売の仕事の様子などを理解できるようにすることである。","地域の様子の移り変わりについて理解するとは，自分たちの市やそこに住む人々の生活の様子は時間の経過に伴い移り変わってきたことなどを理解できるようにすることである。","人々の生活との関連を踏まえて理解するとは，身近な地域や市区町村の地理的環境，地域の安全を守るための諸活動や地域の産業と消費生活の様子，地域の様子の移り変わりのいずれにおいても，地域の人々の生活との関連を考えることを通して，地域における社会生活について理解できるようにすることである。なお，ここでいう「地域」とは，主として自分たちが生活している市区町村の範囲を指している。","調査活動，地図帳や各種の具体的資料を通して，必要な情報を調べまとめる技能を身に付けるようにするとは，技能に関する目標を示している。","調査活動，地図帳や各種の具体的資料を通してとは，身近な地域や市区町村の地理的環境，地域の安全を守るための諸活動や地域の産業と消費生活の様子，地域の様子の移り変わりについて，見学や観察，聞き取りなどの調査活動や，地図帳や地域の平面地図や立体地図，写真，実物などの具体的資料を通して調べることである。これらの調査活動や資料を通して，必要な情報を集め，読み取り，白地図や年表などにまとめる技能を身に付けるようにすることを示している。なお，ここでいう「必要な情報」とは，学習問題の追究・解決に必要な情報であり，学習計画に沿って集める情報，予想に基づいて調べる情報などを指している。"],"2":["これは，第３学年における「思考力，判断力，表現力等」に関する目標を示している。","社会的事象の特色や相互の関連，意味を考える力を養うとは，身近な地域や市の場所による違い，生産の仕事と地域の人々の生活の関連や販売の仕事に見られる工夫，人々の安全を守る関係機関の相互の関連やそこに従事する人々の働き，市や人々の生活の様子の変化などを考える力を養うようにすることである。","社会に見られる課題を把握して，その解決に向けて社会への関わり方を選択・判断する力を養うとは，例えば，地域や自分自身の安全に関して，地域や生活における課題を見いだし，それらの解決のために自分たちにできることを選択・判断したり，これからの市の発展について考えたりする力を養うようにすることである。","考えたことや選択・判断したことを表現する力を養うとは，社会的事象の特色や相互の関連，意味について考えたことや，社会への関わり方について選択・判断したことを文章で記述したり，資料などを用いて説明したり話し合ったりする力を養うようにすることである。"],"3":["これは，第３学年における「学びに向かう力，人間性等」に関する目標を示している。","社会的事象について，主体的に学習の問題を解決しようとする態度を養うとは，学習問題を追究・解決するために，社会的事象について意欲的に調べ，社会的事象の特色や相互の関連，意味について粘り強く考えたり，調べたことや考えたことを表現しようとしたりする主体的な学習態度を養うようにすることである。","よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとは，これまでの学習を振り返り，学習したことを確認するとともに，学習成果を基に，生活の在り方やこれからの地域社会の発展について考えようとする態度を養うようにすることである。","地域社会に対する誇りと愛情を養うとは，地域社会についての理解を踏まえて，自分たちの生活している地域社会としての市区町村に対する誇りと愛情を養うようにすることである。","地域社会の一員としての自覚を養うとは，地域社会についての理解を踏まえて，自分も地域社会の一員であるという自覚や，これからの地域の発展を実現していくために共に努力し，協力しようとする意識などを養うようにすることである。","思考や理解を通してとは，これらの誇りや愛情，自覚は，現在及び過去の地域社会の特色やよさ，課題への理解に基づくものであり，学習活動を通して考えたり理解したりしたことを基に涵養されるものであることを示している。"]}},"4":{"lines":["社会的事象の見方・考え方を働かせ，学習の問題を追究・解決する活動を通して，次のとおり資質・能力を育成することを目指す。","⑴　自分たちの都道府県の地理的環境の特色，地域の人々の健康と生活環境を支える働きや自然災害から地域の安全を守るための諸活動，地域の伝統と文化や地域の発展に尽くした先人の働きなどについて，人々の生活との関連を踏まえて理解するとともに，調査活動，地図帳や各種の具体的資料を通して，必要な情報を調べまとめる技能を身に付けるようにする。","⑵　社会的事象の特色や相互の関連，意味を考える力，社会に見られる課題を把握して，その解決に向けて社会への関わり方を選択・判断する力，考えたことや選択・判断したことを表現する力を養う。","⑶　社会的事象について，主体的に学習の問題を解決しようとする態度や，よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとともに，思考や理解を通して，地域社会に対する誇りと愛情，地域社会の一員としての自覚を養う。"],"page":48,"expl":{"intro":["これは，教科の目標を受けて，第４学年の目標を示している。","第４学年においては，社会的事象の見方・考え方を働かせ，学習問題を追究・解決する活動を通して，次の(1)から(3)までのとおり資質・能力を育成することを目指す。"],"1":["これは，第４学年における「知識及び技能」に関する目標を示している。","自分たちの都道府県の地理的環境の特色，地域の人々の健康と生活環境を支える働きや自然災害から地域の安全を守るための諸活動，地域の伝統と文化や地域の発展に尽くした先人の働きなどについて，人々の生活との関連を踏まえて理解するとは，知識に関する目標を示している。","自分たちの都道府県の地理的環境の特色について理解するとは，自分たちの県の位置や地形，主な産業の分布など地理的環境の概要及び47都道府県の名称と位置とともに，県内には地理的環境などの特色を生かし，まちづくりや産業の発展などに努めている地域があることなどを理解できるようにすることである。","地域の人々の健康と生活環境を支える働きや自然災害から地域の安全を守るための諸活動について理解するとは，飲料水，電気，ガスを供給する事業や廃棄物を処理する事業は人々の健康や生活環境の維持と向上に役立っていることや，地域の関係機関や人々は自然災害に対し様々な対処や備えをしていることなどを理解できるようにすることである。","地域の伝統と文化や地域の発展に尽くした先人の働きについて理解するとは，県内の文化財や年中行事は地域の人々の願いが込められ受け継がれていることや，地域の発展に尽くした先人は様々な苦心や努力により生活の向上に貢献したことなどを理解できるようにすることである。","人々の生活との関連を踏まえて理解するとは，自分たちの都道府県の地理的環境の特色，地域の人々の健康と生活環境を支える働きや自然災害から地域の安全を守るための諸活動，地域の伝統と文化や地域の発展に尽くした先人の働きのいずれにおいても，地域の人々の生活との関連を考えることを通して，地域における社会生活について理解できるようにすることである。なお，ここでいう「地域」とは，主として自分たちが生活している都道府県の範囲を指している。","調査活動，地図帳や各種の具体的資料を通して，必要な情報を調べまとめる技能を身に付けるようにするとは，技能に関する目標を示している。","調査活動，地図帳や各種の具体的資料を通してとは，自分たちの都道府県の地理的環境の特色，地域の人々の健康と生活環境を支える働きや自然災害から地域の安全を守るための諸活動，地域の伝統と文化や地域の発展に尽くした先人の働きについて，見学や観察，聞き取り調査などの調査活動や，地図帳や地域の平面地図や立体地図，写真，実物などの具体的資料を通して調べることである。これらの調査活動や資料を通して，学習問題の追究・解決に必要な情報を集め，読み取り，白地図や年表などにまとめる技能を身に付けるようにすることを示している。なお，ここでいう「必要な情報」とは，学習問題の追究・解決に必要な情報であり，学習計画に沿って集める情報，予想に基づいて調べる情報などを指している。"],"2":["これは，第４学年における「思考力，判断力，表現力等」の育成に関する目標を示している。","社会的事象の特色や相互の関連，意味を考える力を養うとは，自分たちの県の地理的環境の特色，飲料水，電気，ガスを供給する事業や廃棄物を処理する事業が果たす役割，自然災害から人々の安全を守る活動の働き，文化財や年中行事に込められた人々の願いや努力，地域の発展に尽くした先人の働きなどを考える力を養うようにすることである。","社会に見られる課題を把握して，その解決に向けて社会への関わり方を選択・判断する力を養うとは，例えば，節水や節電，ごみの減量や水を汚さない工夫，自然災害に対する日頃からの備え，伝統や文化の保護・継承などに関して，地域や生活における課題を見いだし，それらの解決のために自分たちにできることを選択・判断する力を養うようにすることである。","考えたことや選択・判断したことを表現する力を養うとは，社会的事象の特色や相互の関連，意味について考えたことや，社会への関わり方について選択・判断したことを，文章で記述したり，資料などを用いて説明したり話し合ったりする力を養うようにすることである。"],"3":["これは，第４学年における「学びに向かう力，人間性等」の育成に関する目標を示している。","社会的事象について，主体的に学習の問題を解決しようとする態度を養うとは，学習問題を追究・解決するために，社会的事象について意欲的に調べ，社会的事象の特色や相互の関連，意味について粘り強く考えたり，調べたことや考えたことを表現しようとしたりする主体的な学習態度を養うようにすることである。","よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとは，これまでの学習を振り返り，学習したことを確認するとともに，学習成果を基に生活の在り方やこれからの地域社会の発展について考えようとする態度を養うようにすることである。","地域社会に対する誇りと愛情を養うとは，地域社会についての理解を踏まえて，自分たちの生活している地域社会としての都道府県に対する誇りと愛情を養うようにすることである。","地域社会の一員としての自覚を養うとは，地域社会についての理解を踏まえて，自分も地域社会の一員であるという自覚や，地域の人々の健康やよりよい生活環境，自然災害への対策など安全な生活，伝統や文化の保護・継承を実現していくために共に努力し，協力しようとする意識などを養うようにすることである。","思考や理解を通してとは，これらの誇りや愛情，自覚は，現在及び過去の地域社会の特色やよさ，課題への理解に基づくものであり，学習活動を通して考えたり理解したりしたことを基に涵養されるものであることを示している。"]}},"5":{"lines":["社会的事象の見方・考え方を働かせ，学習の問題を追究・解決する活動を通して，次のとおり資質・能力を育成することを目指す。","⑴　我が国の国土の地理的環境の特色や産業の現状，社会の情報化と産業の関わりについて，国民生活との関連を踏まえて理解するとともに，地図帳や地球儀，統計などの各種の基礎的資料を通して，情報を適切に調べまとめる技能を身に付けるようにする。","⑵　社会的事象の特色や相互の関連，意味を多角的に考える力，社会に見られる課題を把握して，その解決に向けて社会への関わり方を選択・判断する力，考えたことや選択・判断したことを説明したり，それらを基に議論したりする力を養う。","⑶　社会的事象について，主体的に学習の問題を解決しようとする態度や，よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとともに，多角的な思考や理解を通して，我が国の国土に対する愛情，我が国の産業の発展を願い我が国の将来を担う国民としての自覚を養う。"],"page":70,"expl":{"intro":["これは，教科の目標を受けて，第５学年の目標を示している。","第５学年においては，社会的事象の見方・考え方を働かせ，学習問題を追究・解決する活動を通して，次の(1)から(3)までのとおり資質・能力を育成することを目指す。"],"1":["これは，第５学年における「知識及び技能」に関する目標を示している。","我が国の国土の地理的環境の特色や産業の現状，社会の情報化と産業の関わりについて，国民生活との関連を踏まえて理解するとは，知識に関する目標を示している。","我が国の国土の地理的環境の特色について理解するとは，我が国の国土の位置や構成，領土の範囲などを大まかに理解するとともに，国土で発生する自然災害は国土の自然条件と関連が深いことや，森林資源が国土の環境保全などに重要な役割を果たしていること，公害から国民生活を守ることの大切さなどについて理解できるようにすることである。","我が国の産業の現状について理解するとは，我が国の農業や水産業における食料生産や工業生産の概要，食料生産や工業生産を支える人々の工夫や努力，食料や工業製品が国民生活を支えていることなどを理解できるようにすることである。","社会の情報化と産業の関わりについて理解するとは，放送，新聞などの産業は国民生活に大きな影響を及ぼしていること，大量の情報や情報通信技術の活用は様々な産業を発展させ国民生活を向上させていることなどを理解できるようにすることである。","国民生活との関連を踏まえて理解するとは，我が国の国土の地理的環境の特色や産業の現状，社会の情報化と産業の関わりのいずれにおいても，国民生活との関連を考えることを通して，社会生活について理解できるようにすることである。","地図帳や地球儀，統計などの各種の基礎的資料を通して，情報を適切に調べまとめる技能を身に付けるようにするとは，技能に関する目標を示している。","地図帳や地球儀，統計などの各種の基礎的資料を通してとは，我が国の国土の地理的環境の特色や産業の現状，社会の情報化と産業の関わりについて，地図帳や地球儀，統計などの基礎的な資料で調べることである。これらの活動を通して，適切に情報を集め，読み取り，白地図や年表，図表などにまとめる技能を身に付けるようにすることを示している。なお，ここでいう「適切に」とは，情報の出典や作成時期，作成者を確かめたり，聞き取り調査やコンピュータなど集める手段の特性に留意したりして情報を集めること，資料の特性に留意して情報を読み取ること，必要な情報を整理して白地図や年表，図表などに効果的にまとめることなどを指している。"],"2":["これは，第５学年における「思考力，判断力，表現力等」に関する目標を示している。","社会的事象の特色や相互の関連，意味を多角的に考える力を養うとは，複数の立場や意見を踏まえて，我が国の国土の自然環境などの特色やそれらと国民生活の関連，産業が国民生活に果たす役割，産業に関わる人々の働きや公害防止の取組の働き，貿易や運輸が工業生産に果たす役割，森林資源が国土の環境に果たす役割，国土の自然災害と自然条件との関連などを多角的に考える力を養うようにすることである。","社会に見られる課題を把握して，その解決に向けて社会への関わり方を選択・判断する力を養うとは，例えば，これからの農業や工業などの発展，情報化の進展に伴う産業の発展や国民生活の向上などについて考えたり，国土の環境保全に関して課題を見いだし，その解決のために自分たちにできることを選択・判断したりする力を養うようにすることである。","考えたことや選択・判断したことを説明したり，それらを基に議論したりする力を養うとは，社会的事象の特色や相互の関連，意味について考えたことや，社会への関わり方について選択・判断したことを文章で記述したり，資料などを用いて説明したり，根拠や理由などを明確にして議論したりする力を養うようにすることである。"],"3":["これは，第５学年における「学びに向かう力，人間性等」に関する目標を示している。","社会的事象について，主体的に学習の問題を解決しようとする態度を養うとは，学習問題を追究・解決するために，社会的事象について意欲的に調べたり，社会的事象の特色や相互の関連，意味を多角的に考えたりして，調べたことや考えたことを表現しようとする主体的な学習態度を養うようにすることである。","よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとは，これまでの学習を振り返り，学習したことを確認するとともに，学習成果を基に生活の在り方やこれからの国家及び社会の発展について考えようとする態度を養うようにすることである。","我が国の国土に対する愛情を養うとは，我が国の国土についての理解を踏まえて，国民生活の舞台である我が国の国土の自然などに対する愛情を養うようにすることである。","我が国の産業の発展を願い我が国の将来を担う国民としての自覚を養うとは，我が国の産業についての理解を踏まえて，国家及び社会の一員としての自覚や，我が国の産業の発展やよりよい社会を実現していくために共に努力し，協力しようとする意識などを養うようにすることである。","多角的な思考や理解を通してとは，これらの愛情や自覚は，社会の仕組みやよさ，課題への理解に基づくものであり，学習活動を通して，複数の立場や意見を踏まえて考え理解したことを基に涵養されるものであることを示している。"]}},"6":{"lines":["社会的事象の見方・考え方を働かせ，学習の問題を追究・解決する活動を通して，次のとおり資質・能力を育成することを目指す。","⑴　我が国の政治の考え方と仕組みや働き，国家及び社会の発展に大きな働きをした先人の業績や優れた文化遺産，我が国と関係の深い国の生活やグローバル化する国際社会における我が国の役割について理解するとともに，地図帳や地球儀，統計や年表などの各種の基礎的資料を通して，情報を適切に調べまとめる技能を身に付けるようにする。","⑵　社会的事象の特色や相互の関連，意味を多角的に考える力，社会に見られる課題を把握して，その解決に向けて社会への関わり方を選択・判断する力，考えたことや選択・判断したことを説明したり，それらを基に議論したりする力を養う。","⑶　社会的事象について，主体的に学習の問題を解決しようとする態度や，よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとともに，多角的な思考や理解を通して，我が国の歴史や伝統を大切にして国を愛する心情，我が国の将来を担う国民としての自覚や平和を願う日本人として世界の国々の人々と共に生きることの大切さについての自覚を養う。"],"page":97,"expl":{"intro":["これは，教科の目標を受けて，第６学年の目標を示している。","第６学年においては，社会的事象の見方・考え方を働かせ，学習問題を追究・解決する活動を通して，次の(1)から(3)までのとおり資質・能力を育成することを目指す。"],"1":["これは，第６学年における「知識及び技能」に関する目標を示している。","我が国の政治の考え方と仕組みや働き，国家及び社会の発展に大きな働きをした先人の業績や優れた文化遺産，我が国と関係の深い国の生活やグローバル化する国際社会における我が国の役割について理解するとは，知識に関する目標を示している。","我が国の政治の考え方と仕組みや働きについて理解するとは，日本国憲法は国家の理想，天皇の地位，国民としての権利及び義務など国家や国民生活の基本を定めていることや，現在の我が国の民主政治は日本国憲法の基本的な考え方に基づいていること，立法，行政，司法の三権がそれぞれの役割を果たしていること，国や地方公共団体の政治は，国民主権の考え方の下，国民生活の安定と向上を図る大切な働きをしていることなどを理解できるようにすることである。","国家及び社会の発展に大きな働きをした先人の業績や優れた文化遺産について理解するとは，我が国の歴史上の主な事象を手掛かりに，大まかな歴史を理解するとともに，関連する先人の業績，優れた文化遺産の働きなどを理解できるようにすることである。","我が国と関係の深い国の生活やグローバル化する国際社会における我が国の役割について理解するとは，我が国と経済や文化などの面でつながりが深い国の人々の生活は多様であること，スポーツや文化などを通して他国と交流し異なる文化や習慣を尊重し合うことが大切であること，我が国は平和な世界の実現のために国際連合の一員として重要な役割を果たしたり諸外国の発展のために援助や協力を行ったりしていることなどを理解できるようにすることである。","地図帳や地球儀，統計や年表などの各種の基礎的資料を通して，情報を適切に調べまとめる技能を身に付けるようにするとは，技能に関する目標を示している。","地図帳や地球儀，統計や年表などの各種の基礎的資料を通してとは，我が国の政治の考え方と仕組みや働き，国家及び社会の発展に大きな働きをした先人の業績や優れた文化遺産，我が国と関係の深い国の生活やグローバル化する国際社会における我が国の役割について，地図帳や地球儀，統計や年表などの基礎的な資料で調べることである。これらの活動を通して，適切に情報を集め，読み取り，白地図や年表，図表などにまとめる技能を身に付けるようにすることを示している。なお，ここでいう「適切に」とは，情報の出典や作成時期，作成者を確かめたり，聞き取り調査やコンピュータなど集める手段の特性に留意したりして情報を集めること，資料の特性に留意して情報を読み取ること，必要な情報を整理して白地図や年表，図表などに効果的にまとめることなどを指している。"],"2":["これは，第６学年における「思考力，判断力，表現力等」に関する目標を示している。","社会的事象の特色や相互の関連，意味を多角的に考える力を養うとは，複数の立場や意見を踏まえて，日本国憲法が国民生活に果たす役割や国会，内閣，裁判所と国民との関わり，国民生活における政治の働き，我が国の歴史の展開，国際交流の果たす役割，国際社会において我が国が果たしている役割などを多角的に考える力を養うようにすることである。","社会に見られる課題を把握して，その解決に向けて社会への関わり方を選択・判断する力を養うとは，世界の人々と共に生きていくことに関して，社会における課題を見いだし，それらの解決のために自分たちにできることを選択・判断したり，これからの我が国が果たすべき役割などを考えたりする力を養うようにすることである。","考えたことや選択・判断したことを説明したり，それらを基に議論したりする力を養うとは，社会的事象の特色や相互の関連，意味について考えたことや，社会への関わり方について選択・判断したことを文章で記述したり，資料などを用いて説明したり，根拠や理由などを明確にして議論したりする力を養うようにすることである。"],"3":["これは，第６学年における「学びに向かう力，人間性等」に関する目標を示している。","社会的事象について，主体的に学習の問題を解決しようとする態度を養うとは，学習問題を追究・解決するために，社会的事象について意欲的に調べたり，社会的事象の特色や相互の関連，意味を多角的に考えたりして，調べたことや考えたことを表現しようとする主体的な学習態度を養うようにすることである。","よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとは，これまでの学習を振り返り，学習したことを確認するとともに，学習成果を基に生活の在り方やこれからの国家及び社会の発展について考えようとする態度を養うようにすることである。","我が国の歴史や伝統を大切にして国を愛する心情を養うとは，我が国の歴史についての理解を踏まえて，国家及び社会の発展に貢献した先人によってつくり出された歴史や伝統を大切にして国を愛する心情を養うようにすることである。","我が国の将来を担う国民としての自覚を養うとは，我が国の政治についての理解を踏まえて，国家及び社会の一員としての自覚をもつとともに，主権者として将来にわたって我が国の政治に関わろうとする意識や，社会の担い手として平和で民主的な国家及び社会を築き上げようとする意識などを養うようにすることである。","平和を願う日本人として世界の国々の人々と共に生きることの大切さについての自覚を養うとは，国際社会における我が国の役割についての理解を踏まえて，我が国はこれからも国際社会の一員として，平和な国際社会の実現を目指して努力を続けていくことが必要であるという自覚や，そのためには平和を願う日本人として世界の国々の人々と共に生きていくことが大切であるという自覚を養うようにすることである。","多角的な思考や理解を通してとは，これらの愛情や自覚は，現在及び過去の社会の仕組みやよさ，課題への理解に基づくものであり，学習活動を通して複数の立場や意見を踏まえて考え理解したことを基に涵養されるものであることを示している。"]}}},"units":[{"g":3,"u":" g":5,"u":"くらしを支える工業生産","b":"5年","ids":["shakai-5-X-3"],"parts":{"shakai-5-X-3":{"ア":"アエ","イ":"ア"}}},{"g":5,"u":"自動車をつくる工業","b":"5年","ids":["shakai-5-X-3"],"parts":{"shakai-5-X-3":{"ア":"イエ","イ":"イ"}}},{"g":5,"u":"工業生産を支える運輸と貿易","b":"5年","ids":["shakai-5-X-3"],"parts":{"shakai-5-X-3":{"ア":"ウエ","イ":"ウ"}}},{"g":5,"u":"これからの工業生産とわたしたち","b":"5年","ids":["shakai-5-X-3"],"parts":{"shakai-5-X-3":{"ア":"アエ","イ":"ア"}}},{"g":5,"u":"情報産業とわたしたちのくらし","b":"5年","ids":["shakai-5-X-4"],"parts":{"shakai-5-X-4":{"ア":"アウ","イ":"ア"}}},{"g":5,"u":"情報を生かす産業","b":"5年","ids":["shakai-5-X-4"],"parts":{"shakai-5-X-4":{"ア":"イウ","イ":"イ"}}},{"g":5,"u":"情報を生かすわたしたち","b":"5年","ids":["shakai-5-X-4"],"parts":{"shakai-5-X-4":{"ア":"イウ","イ":"イ"}}},{"g":5,"u":"自然災害を防ぐ","b":"5年","ids":["shakai-5-X-5"],"parts":{"shakai-5-X-5":{"ア":"アエ","イ":"ア"}}},{"g":5,"u":"わたしたちの生活と森林","b":"5年","ids":["shakai-5-X-5"],"parts":{"shakai-5-X-5":{"ア":"イエ","イ":"イ"}}},{"g":5,"u":"環境を守るわたしたち","b":"5年","ids":["shakai-5-X-5"],"parts":{"shakai-5-X-5":{"ア":"ウエ","イ":"ウ"}}},{"g":6,"u":"わたしたちのくらしと日本国憲法","b":"6年","ids":["shakai-6-X-1"],"parts":{"shakai-6-X-1":{"ア":"アウ","イ":"ア"}}},{"g":6,"u":"国の政治のしくみと選挙","b":"6年","ids":["shakai-6-X-1"],"parts":{"shakai-6-X-1":{"ア":"アウ","イ":"ア"}}},{"g":6,"u":"子育て支援の願いを実現する政治 震災復興の願いを実現する政治（選択）","b":"6年","ids":["shakai-6-X-1"],"parts":{"shakai-6-X-1":{"ア":"イウ","イ":"イ"}}},{"g":6,"u":"縄文のむらから古墳のくにへ","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"アシ","イ":"ア"}}},{"g":6,"u":"天皇中心の国づくり","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"イシ","イ":"ア"}}},{"g":6,"u":"貴族のくらし","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"ウシ","イ":"ア"}}},{"g":6,"u":"武士の世の中へ","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"エシ","イ":"ア"}}},{"g":6,"u":"今に伝わる室町文化","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"オシ","イ":"ア"}}},{"g":6,"u":"戦国の世から天下統一へ","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"カシ","イ":"ア"}}},{"g":6,"u":"江戸幕府と政治の安定","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"キシ","イ":"ア"}}},{"g":6,"u":"町人の文化と新しい学問","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"クシ","イ":"ア"}}},{"g":6,"u":"明治の国づくりを進めた人々","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"ケシ","イ":"ア"}}},{"g":6,"u":"世界に歩み出した日本","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"コシ","イ":"ア"}}},{"g":6,"u":"長く続いた戦争と人々のくらし","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"サシ","イ":"ア"}}},{"g":6,"u":"新しい日本、平和な日本へ","b":"6年","ids":["shakai-6-X-2"],"parts":{"shakai-6-X-2":{"ア":"サシ","イ":"ア"}}},{"g":6,"u":"日本とつながりの深い国々","b":"6年","ids":["shakai-6-X-3"],"parts":{"shakai-6-X-3":{"ア":"アウ","イ":"ア"}}},{"g":6,"u":"世界の未来と日本の役割","b":"6年","ids":["shakai-6-X-3"],"parts":{"shakai-6-X-3":{"ア":"イウ","イ":"イ"}}}],"katsudoName":"","katsudo":{},"bandSecs":{},"unitNote":"","items":[{"id":"shakai-3-X-1","g":[3],"area":"chiri","areaName":"地理的環境と人々の生活","mark":"⑴","head":"身近な地域や市の様子","title":"身近な地域や市区町村（以下第２章第２節において「市」という。）の様子について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　身近な地域や自分たちの市の様子を大まかに理解すること。","（イ）　観察・調査したり地図などの資料で調べたりして，白地図などにまとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　都道府県内における市の位置，市の地形や土地利用，交通の広がり，市役所など主な公共施設の場所と働き，古くから残る建造物の分布などに着目して，身近な地域や市の様子を捉え，場所による違いを考え，表現すること。"],"notes":["⑴　内容の⑴については，次のとおり取り扱うものとする。","ア　学年の導入で扱うこととし，アの（ア）については，「自分たちの市」に重点を置くよう配慮すること。","イ　アの（イ）については，「白地図などにまとめる」際に，教科用図書「地図」（以下第２章第２節において「地図帳」という。）を参照し，方位や主な地図記号について扱うこと。"],"units":[{"u":"○学校のまわり","b":"3年","s":3},{"u":"市の様子","b":"3年","s":3}]},{"id":"shakai-3-X-2","g":[3],"area":"koumin","areaName":"現代社会の仕組みや働きと人々の生活","mark":"⑵","head":"地域の生産や販売の仕事","title":"地域に見られる生産や販売の仕事について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　生産の仕事は，地域の人々の生活と密接な関わりをもって行われていることを理解すること。","（イ）　販売の仕事は，消費者の多様な願いを踏まえ売り上げを高めるよう，工夫して行われていることを理解すること。","（ウ）　見学・調査したり地図などの資料で調べたりして，白地図などにまとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　仕事の種類や産地の分布，仕事の工程などに着目して，生産に携わっている人々の仕事の様子を捉え，地域の人々の生活との関連を考え，表現すること。","（イ）　消費者の願い，販売の仕方，他地域や外国との関わりなどに着目して，販売に携わっている人々の仕事の様子を捉え，それらの仕事に見られる工夫を考え，表現すること。"],"notes":["⑵　内容の⑵については，次のとおり取り扱うものとする。","ア　アの（ア）及びイの（ア）については，事例として農家，工場などの中から選択して取り上げるようにすること。","イ　アの（イ）及びイの（イ）については，商店を取り上げ，「他地域や外国との関わり」を扱う際には，地図帳などを使用して都道府県や国の名称と位置などを調べるようにすること。","ウ　イの（イ）については，我が国や外国には国旗があることを理解し，それを尊重する態度を養うよう配慮すること。"],"units":[{"u":"農家の仕事 工場の仕事（選択）","b":"3年","s":3},{"u":"店ではたらく人","b":"3年","s":3}]},{"id":"shakai-3-X-3","g":[3],"area":"koumin","areaName":"現代社会の仕組みや働きと人々の生活","mark":"⑶","head":"地域の安全を守る働き（消防・警察）","title":"地域の安全を守る働きについて，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　消防署や警察署などの関係機関は，地域の安全を守るために，相互に連携して緊急時に対処する体制をとっていることや，関係機関が地域の人々と協力して火災や事故などの防止に努めていることを理解すること。","（イ）　見学・調査したり地図などの資料で調べたりして，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　施設・設備などの配置，緊急時への備えや対応などに着目して，関係機関や地域の人々の諸活動を捉え，相互の関連や従事する人々の働きを考え，表現すること。"],"notes":["⑶　内容の⑶については，次のとおり取り扱うものとする。","ア　アの（ア）の「緊急時に対処する体制をとっていること」と「防止に努めていること」については，火災と事故はいずれも取り上げること。その際，どちらかに重点を置くなど効果的な指導を工夫すること。","イ　イの（ア）については，社会生活を営む上で大切な法やきまりについて扱うとともに，地域や自分自身の安全を守るために自分たちにできることなどを考えたり選択・判断したりできるよう配慮すること。"],"units":[{"u":"火事からくらしを守る","b":"3年","s":3},{"u":"事故や事件からくらしを守る","b":"3年","s":3}]},{"id":"shakai-3-X-4","g":[3],"area":"rekishi","areaName":"歴史と人々の生活","mark":"⑷","head":"市の様子の移り変わり","title":"市の様子の移り変わりについて，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　市や人々の生活の様子は，時間の経過に伴い，移り変わってきたことを理解すること。","（イ）　聞き取り調査をしたり地図などの資料で調べたりして，年表などにまとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　交通や公共施設，土地利用や人口，生活の道具などの時期による違いに着目して，市や人々の生活の様子を捉え，それらの変化を考え，表現すること。"],"notes":["⑷　内容の⑷については，次のとおり取り扱うものとする。","ア　アの（イ）の「年表などにまとめる」際には，時期の区分について，昭和，平成など元号を用いた言い表し方などがあることを取り上げること。","イ　イの（ア）の「公共施設」については，市が公共施設の整備を進めてきたことを取り上げること。その際，租税の役割に触れること。","ウ　イの（ア）の「人口」を取り上げる際には，少子高齢化，国際化などに触れ，これからの市の発展について考えることができるよう配慮すること。"],"units":[{"u":"市の様子と人々のくらしのうつりかわり","b":"3年","s":3}]},{"id":"shakai-4-X-1","g":[4],"area":"chiri","areaName":"地理的環境と人々の生活","mark":"⑴","head":"県の様子，47都道府県の名称と位置","title":"都道府県（以下第２章第２節において「県」という。）の様子について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　自分たちの県の地理的環境の概要を理解すること。また，47都道府県の名称と位置を理解すること。","（イ）　地図帳や各種の資料で調べ，白地図などにまとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　我が国における自分たちの県の位置，県全体の地形や主な産業の分布，交通網や主な都市の位置などに着目して，県の様子を捉え，地理的環境の特色を考え，表現すること。"],"notes":null,"units":[{"u":"〇日本地図を広げて","b":"4年","s":3},{"u":"県の広がり","b":"4年","s":3}]},{"id":"shakai-4-X-2","g":[4],"area":"koumin","areaName":"現代社会の仕組みや働きと人々の生活","mark":"⑵","head":"飲料水・電気・ガス，ごみや下水の事業","title":"人々の健康や生活環境を支える事業について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　飲料水，電気，ガスを供給する事業は，安全で安定的に供給できるよう進められていることや，地域の人々の健康な生活の維持と向上に役立っていることを理解すること。","（イ）　廃棄物を処理する事業は，衛生的な処理や資源の有効利用ができるよう進められていることや，生活環境の維持と向上に役立っていることを理解すること。","（ウ）　見学・調査したり地図などの資料で調べたりして，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　供給の仕組みや経路，県内外の人々の協力などに着目して，飲料水，電気，ガスの供給のための事業の様子を捉え，それらの事業が果たす役割を考え，表現すること。","（イ）　処理の仕組みや再利用，県内外の人々の協力などに着目して，廃棄物の処理のための事業の様子を捉え，その事業が果たす役割を考え，表現すること。"],"notes":["⑴　内容の⑵については，次のとおり取り扱うものとする。","ア　アの（ア）及び（イ）については，現在に至るまでに仕組みが計画的に改善され公衆衛生が向上してきたことに触れること。","イ　アの（ア）及びイの（ア）については，飲料水，電気，ガスの中から選択して取り上げること。","ウ　アの（イ）及びイの（イ）については，ごみ，下水のいずれかを選択して取り上げること。","エ　イの（ア）については，節水や節電など自分たちにできることを考えたり選択・判断したりできるよう配慮すること。","オ　イの（イ）については，社会生活を営む上で大切な法やきまりについて扱うとともに，ごみの減量や水を汚さない工夫など，自分たちにできることを考えたり選択・判断したりできるよう配慮すること。"],"units":[{"u":"水はどこから","b":"4年","s":3},{"u":"ごみのしょりと利用","b":"4年","s":3}]},{"id":"shakai-4-X-3","g":[4],"area":"koumin","areaName":"現代社会の仕組みや働きと人々の生活","mark":"⑶","head":"自然災害から人々を守る活動","title":"自然災害から人々を守る活動について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　地域の関係機関や人々は，自然災害に対し，様々な協力をして対処してきたことや，今後想定される災害に対し，様々な備えをしていることを理解すること。","（イ）　聞き取り調査をしたり地図や年表などの資料で調べたりして，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　過去に発生した地域の自然災害，関係機関の協力などに着目して，災害から人々を守る活動を捉え，その働きを考え，表現すること。"],"notes":["⑵　内容の⑶については，次のとおり取り扱うものとする。","ア　アの（ア）については，地震災害，津波災害，風水害，火山災害，雪害などの中から，過去に県内で発生したものを選択して取り上げること。","イ　アの（ア）及びイの（ア）の「関係機関」については，県庁や市役所の働きなどを中心に取り上げ，防災情報の発信，避難体制の確保などの働き，自衛隊など国の機関との関わりを取り上げること。","ウ　イの（ア）については，地域で起こり得る災害を想定し，日頃から必要な備えをするなど，自分たちにできることなどを考えたり選択・判断したりできるよう配慮すること。"],"units":[{"u":"風水害からくらしを守る","b":"4年","s":3}]},{"id":"shakai-4-X-4","g":[4],"area":"rekishi","areaName":"歴史と人々の生活","mark":"⑷","head":"県内の伝統や文化，先人の働き","title":"県内の伝統や文化，先人の働きについて，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　県内の文化財や年中行事は，地域の人々が受け継いできたことや，それらには地域の発展など人々の様々な願いが込められていることを理解すること。","（イ）　地域の発展に尽くした先人は，様々な苦心や努力により当時の生活の向上に貢献したことを理解すること。","（ウ）　見学・調査したり地図などの資料で調べたりして，年表などにまとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　歴史的背景や現在に至る経過，保存や継承のための取組などに着目して，県内の文化財や年中行事の様子を捉え，人々の願いや努力を考え，表現すること。","（イ）　当時の世の中の課題や人々の願いなどに着目して，地域の発展に尽くした先人の具体的事例を捉え，先人の働きを考え，表現すること。"],"notes":["⑶　内容の⑷については，次のとおり取り扱うものとする。","ア　アの（ア）については，県内の主な文化財や年中行事が大まかに分かるようにするとともに，イの（ア）については，それらの中から具体的事例を取り上げること。","イ　アの（イ）及びイの（イ）については，開発，教育，医療，文化，産業などの地域の発展に尽くした先人の中から選択して取り上げること。","ウ　イの（ア）については，地域の伝統や文化の保存や継承に関わって，自分たちにできることなどを考えたり選択・判断したりできるよう配慮すること。"],"units":[{"u":"残したいもの 伝えたいもの","b":"4年","s":3},{"u":"谷に囲まれた台地に水を引く","b":"4年","s":3}]},{"id":"shakai-4-X-5","g":[4],"area":"chiri","areaName":"地理的環境と人々の生活","mark":"⑸","head":"県内の特色ある地域の様子","title":"県内の特色ある地域の様子について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　県内の特色ある地域では，人々が協力し，特色あるまちづくりや観光などの産業の発展に努めていることを理解すること。","（イ）　地図帳や各種の資料で調べ，白地図などにまとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　特色ある地域の位置や自然環境，人々の活動や産業の歴史的背景，人々の協力関係などに着目して，地域の様子を捉え，それらの特色を考え，表現すること。"],"notes":["⑷　内容の⑸については，次のとおり取り扱うものとする。","ア　県内の特色ある地域が大まかに分かるようにするとともに，伝統的な技術を生かした地場産業が盛んな地域，国際交流に取り組んでいる地域及び地域の資源を保護・活用している地域を取り上げること。その際，地域の資源を保護・活用している地域については，自然環境，伝統的な文化のいずれかを選択して取り上げること。","イ　国際交流に取り組んでいる地域を取り上げる際には，我が国や外国には国旗があることを理解し，それを尊重する態度を養うよう配慮すること。"],"units":[{"u":"こけしをつくるまち・蔵王町","b":"4年","s":3},{"u":"国際交流に取り組むまち・仙台市","b":"4年","s":3},{"u":"美しい景観を生かすまち・松島町 古いまちなみを生かすまち・登米市登米町（選択）","b":"4年","s":3}]},{"id":"shakai-5-X-1","g":[5],"area":"chiri","areaName":"地理的環境と人々の生活","mark":"⑴","head":"我が国の国土の様子と国民生活","title":"我が国の国土の様子と国民生活について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　世界における我が国の国土の位置，国土の構成，領土の範囲などを大まかに理解すること。","（イ）　我が国の国土の地形や気候の概要を理解するとともに，人々は自然環境に適応して生活していることを理解すること。","（ウ）　地図帳や地球儀，各種の資料で調べ，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　世界の大陸と主な海洋，主な国の位置，海洋に囲まれ多数の島からなる国土の構成などに着目して，我が国の国土の様子を捉え，その特色を考え，表現すること。","（イ）　地形や気候などに着目して，国土の自然などの様子や自然条件から見て特色ある地域の人々の生活を捉え，国土の自然環境の特色やそれらと国民生活との関連を考え，表現すること。"],"notes":["⑴　内容の⑴については，次のとおり取り扱うものとする。","ア　アの（ア）の「領土の範囲」については，竹島や北方領土，尖閣諸島が我が国の固有の領土であることに触れること。","イ　アの（ウ）については，地図帳や地球儀を用いて，方位，緯度や経度などによる位置の表し方について取り扱うこと。","ウ　イの（ア）の「主な国」については，名称についても扱うようにし，近隣の諸国を含めて取り上げること。その際，我が国や諸外国には国旗があることを理解し，それを尊重する態度を養うよう配慮すること。","エ　イの（イ）の「自然条件から見て特色ある地域」については，地形条件や気候条件から見て特色ある地域を取り上げること。"],"units":[{"u":"世界の中の国土","b":"5年","s":3},{"u":"国土の地形の特色","b":"5年","s":3},{"u":"低い土地のくらし 高い土地のくらし（選択）","b":"5年","s":3},{"u":"国土の気候の特色","b":"5年","s":3},{"u":"あたたかい土地のくらし 寒い土地のくらし（選択）","b":"5年","s":3}]},{"id":"shakai-5-X-2","g":[5],"area":"koumin","areaName":"現代社会の仕組みや働きと人々の生活","mark":"⑵","head":"我が国の農業や水産業（食料生産）","title":"我が国の農業や水産業における食料生産について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　我が国の食料生産は，自然条件を生かして営まれていることや，国民の食料を確保する重要な役割を果たしていることを理解すること。","（イ）　食料生産に関わる人々は，生産性や品質を高めるよう努力したり輸送方法や販売方法を工夫したりして，良質な食料を消費地に届けるなど，食料生産を支えていることを理解すること。","（ウ）　地図帳や地球儀，各種の資料で調べ，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　生産物の種類や分布，生産量の変化，輸入など外国との関わりなどに着目して，食料生産の概要を捉え，食料生産が国民生活に果たす役割を考え，表現すること。","（イ）　生産の工程，人々の協力関係，技術の向上，輸送，価格や費用などに着目して，食料生産に関わる人々の工夫や努力を捉え，その働きを考え，表現すること。"],"notes":["⑵　内容の⑵については，次のとおり取り扱うものとする。","ア　アの（イ）及びイの（イ）については，食料生産の盛んな地域の具体的事例を通して調べることとし，稲作のほか，野菜，果物，畜産物，水産物などの中から一つを取り上げること。","イ　イの（ア）及び（イ）については，消費者や生産者の立場などから多角的に考えて，これからの農業などの発展について，自分の考えをまとめることができるよう配慮すること。"],"units":[{"u":"くらしを支える食料生産","b":"5年","s":3},{"u":"米づくりのさかんな地域","b":"5年","s":3},{"u":"水産業のさかんな地域","b":"5年","s":3},{"u":"これからの食料生産とわたしたち","b":"5年","s":3}]},{"id":"shakai-5-X-3","g":[5],"area":"koumin","areaName":"現代社会の仕組みや働きと人々の生活","mark":"⑶","head":"我が国の工業生産","title":"我が国の工業生産について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　我が国では様々な工業生産が行われていることや，国土には工業の盛んな地域が広がっていること及び工業製品は国民生活の向上に重要な役割を果たしていることを理解すること。","（イ）　工業生産に関わる人々は，消費者の需要や社会の変化に対応し，優れた製品を生産するよう様々な工夫や努力をして，工業生産を支えていることを理解すること。","（ウ）　貿易や運輸は，原材料の確保や製品の販売などにおいて，工業生産を支える重要な役割を果たしていることを理解すること。","（エ）　地図帳や地球儀，各種の資料で調べ，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　工業の種類，工業の盛んな地域の分布，工業製品の改良などに着目して，工業生産の概要を捉え，工業生産が国民生活に果たす役割を考え，表現すること。","（イ）　製造の工程，工場相互の協力関係，優れた技術などに着目して，工業生産に関わる人々の工夫や努力を捉え，その働きを考え，表現すること。","（ウ）　交通網の広がり，外国との関わりなどに着目して，貿易や運輸の様子を捉え，それらの役割を考え，表現すること。"],"notes":["⑶　内容の⑶については，次のとおり取り扱うものとする。","ア　アの（イ）及びイの（イ）については，工業の盛んな地域の具体的事例を通して調べることとし，金属工業，機械工業，化学工業，食料品工業などの中から一つを取り上げること。","イ　イの（ア）及び（イ）については，消費者や生産者の立場などから多角的に考えて，これからの工業の発展について，自分の考えをまとめることができるよう配慮すること。"],"units":[{"u":"くらしを支える工業生産","b":"5年","s":3},{"u":"自動車をつくる工業","b":"5年","s":3},{"u":"工業生産を支える運輸と貿易","b":"5年","s":3},{"u":"これからの工業生産とわたしたち","b":"5年","s":3}]},{"id":"shakai-5-X-4","g":[5],"area":"koumin","areaName":"現代社会の仕組みや働きと人々の生活","mark":"⑷","head":"我が国の産業と情報との関わり","title":"我が国の産業と情報との関わりについて，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　放送，新聞などの産業は，国民生活に大きな影響を及ぼしていることを理解すること。","（イ）　大量の情報や情報通信技術の活用は，様々な産業を発展させ，国民生活を向上させていることを理解すること。","（ウ）　聞き取り調査をしたり映像や新聞などの各種資料で調べたりして，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　情報を集め発信するまでの工夫や努力などに着目して，放送，新聞などの産業の様子を捉え，それらの産業が国民生活に果たす役割を考え，表現すること。","（イ）　情報の種類，情報の活用の仕方などに着目して，産業における情報活用の現状を捉え，情報を生かして発展する産業が国民生活に果たす役割を考え，表現すること。"],"notes":["⑷　内容の⑷については，次のとおり取り扱うものとする。","ア　アの（ア）の「放送，新聞などの産業」については，それらの中から選択して取り上げること。その際，情報を有効に活用することについて，情報の送り手と受け手の立場から多角的に考え，受け手として正しく判断することや送り手として責任をもつことが大切であることに気付くようにすること。","イ　アの（イ）及びイの（イ）については，情報や情報技術を活用して発展している販売，運輸，観光，医療，福祉などに関わる産業の中から選択して取り上げること。その際，産業と国民の立場から多角的に考えて，情報化の進展に伴う産業の発展や国民生活の向上について，自分の考えをまとめることができるよう配慮すること。"],"units":[{"u":"情報産業とわたしたちのくらし","b":"5年","s":3},{"u":"情報を生かす産業","b":"5年","s":3},{"u":"情報を生かすわたしたち","b":"5年","s":3}]},{"id":"shakai-5-X-5","g":[5],"area":"chiri","areaName":"地理的環境と人々の生活","mark":"⑸","head":"国土の自然環境と国民生活（自然災害・森林・公害）","title":"我が国の国土の自然環境と国民生活との関連について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　自然災害は国土の自然条件などと関連して発生していることや，自然災害から国土を保全し国民生活を守るために国や県などが様々な対策や事業を進めていることを理解すること。","（イ）　森林は，その育成や保護に従事している人々の様々な工夫と努力により国土の保全など重要な役割を果たしていることを理解すること。","（ウ）　関係機関や地域の人々の様々な努力により公害の防止や生活環境の改善が図られてきたことを理解するとともに，公害から国土の環境や国民の健康な生活を守ることの大切さを理解すること。","（エ）　地図帳や各種の資料で調べ，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　災害の種類や発生の位置や時期，防災対策などに着目して，国土の自然災害の状況を捉え，自然条件との関連を考え，表現すること。","（イ）　森林資源の分布や働きなどに着目して，国土の環境を捉え，森林資源が果たす役割を考え，表現すること。","（ウ）　公害の発生時期や経過，人々の協力や努力などに着目して，公害防止の取組を捉え，その働きを考え，表現すること。"],"notes":["⑸　内容の⑸については，次のとおり取り扱うものとする。","ア　アの（ア）については，地震災害，津波災害，風水害，火山災害，雪害などを取り上げること。","イ　アの（ウ）及びイの（ウ）については，大気の汚染，水質の汚濁などの中から具体的事例を選択して取り上げること。","ウ　イの（イ）及び（ウ）については，国土の環境保全について，自分たちにできることなどを考えたり選択・判断したりできるよう配慮すること。"],"units":[{"u":"自然災害を防ぐ","b":"5年","s":3},{"u":"わたしたちの生活と森林","b":"5年","s":3},{"u":"環境を守るわたしたち","b":"5年","s":3}]},{"id":"shakai-6-X-1","g":[6],"area":"koumin","areaName":"現代社会の仕組みや働きと人々の生活","mark":"⑴","head":"我が国の政治の働き（日本国憲法，国や地方の政治）","title":"我が国の政治の働きについて，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　日本国憲法は国家の理想，天皇の地位，国民としての権利及び義務など国家や国民生活の基本を定めていることや，現在の我が国の民主政治は日本国憲法の基本的な考え方に基づいていることを理解するとともに，立法，行政，司法の三権がそれぞれの役割を果たしていることを理解すること。","（イ）　国や地方公共団体の政治は，国民主権の考え方の下，国民生活の安定と向上を図る大切な働きをしていることを理解すること。","（ウ）　見学・調査したり各種の資料で調べたりして，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　日本国憲法の基本的な考え方に着目して，我が国の民主政治を捉え，日本国憲法が国民生活に果たす役割や，国会，内閣，裁判所と国民との関わりを考え，表現すること。","（イ）　政策の内容や計画から実施までの過程，法令や予算との関わりなどに着目して，国や地方公共団体の政治の取組を捉え，国民生活における政治の働きを考え，表現すること。"],"notes":["⑴　内容の⑴については，次のとおり取り扱うものとする。","ア　アの（ア）については，国会などの議会政治や選挙の意味，国会と内閣と裁判所の三権相互の関連，裁判員制度や租税の役割などについて扱うこと。その際，イの（ア）に関わって，国民としての政治への関わり方について多角的に考えて，自分の考えをまとめることができるよう配慮すること。","イ　アの（ア）の「天皇の地位」については，日本国憲法に定める天皇の国事に関する行為など児童に理解しやすい事項を取り上げ，歴史に関する学習との関連も図りながら，天皇についての理解と敬愛の念を深めるようにすること。また，「国民としての権利及び義務」については，参政権，納税の義務などを取り上げること。","ウ　アの（イ）の「国や地方公共団体の政治」については，社会保障，自然災害からの復旧や復興，地域の開発や活性化などの取組の中から選択して取り上げること。","エ　イの（ア）の「国会」について，国民との関わりを指導する際には，各々の国民の祝日に関心をもち，我が国の社会や文化における意義を考えることができるよう配慮すること。"],"units":[{"u":"わたしたちのくらしと日本国憲法","b":"6年","s":3},{"u":"国の政治のしくみと選挙","b":"6年","s":3},{"u":"子育て支援の願いを実現する政治 震災復興の願いを実現する政治（選択）","b":"6年","s":3}]},{"id":"shakai-6-X-2","g":[6],"area":"rekishi","areaName":"歴史と人々の生活","mark":"⑵","head":"我が国の歴史上の主な事象","title":"我が国の歴史上の主な事象について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。その際，我が国の歴史上の主な事象を手掛かりに，大まかな歴史を理解するとともに，関連する先人の業績，優れた文化遺産を理解すること。","（ア）　狩猟・採集や農耕の生活，古墳，大和朝廷（大和政権）による統一の様子を手掛かりに，むらからくにへと変化したことを理解すること。その際，神話・伝承を手掛かりに，国の形成に関する考え方などに関心をもつこと。","（イ）　大陸文化の摂取，大化の改新，大仏造営の様子を手掛かりに，天皇を中心とした政治が確立されたことを理解すること。","（ウ）　貴族の生活や文化を手掛かりに，日本風の文化が生まれたことを理解すること。","（エ）　源平の戦い，鎌倉幕府の始まり，元との戦いを手掛かりに，武士による政治が始まったことを理解すること。","（オ）　京都の室町に幕府が置かれた頃の代表的な建造物や絵画を手掛かりに，今日の生活文化につながる室町文化が生まれたことを理解すること。","（カ）　キリスト教の伝来，織田・豊臣の天下統一を手掛かりに，戦国の世が統一されたことを理解すること。","（キ）　江戸幕府の始まり，参勤交代や鎖国などの幕府の政策，身分制を手掛かりに，武士による政治が安定したことを理解すること。","（ク）　歌舞伎や浮世絵，国学や蘭学を手掛かりに，町人の文化が栄え新しい学問がおこったことを理解すること。","（ケ）　黒船の来航，廃藩置県や四民平等などの改革，文明開化などを手掛かりに，我が国が明治維新を機に欧米の文化を取り入れつつ近代化を進めたことを理解すること。","（コ）　大日本帝国憲法の発布，日清・日露の戦争，条約改正，科学の発展などを手掛かりに，我が国の国力が充実し国際的地位が向上したことを理解すること。","（サ）　日中戦争や我が国に関わる第二次世界大戦，日本国憲法の制定，オリンピック・パラリンピックの開催などを手掛かりに，戦後我が国は民主的な国家として出発し，国民生活が向上し，国際社会の中で重要な役割を果たしてきたことを理解すること。","（シ）　遺跡や文化財，地図や年表などの資料で調べ，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　世の中の様子，人物の働きや代表的な文化遺産などに着目して，我が国の歴史上の主な事象を捉え，我が国の歴史の展開を考えるとともに，歴史を学ぶ意味を考え，表現すること。"],"notes":["⑵　内容の⑵については，次のとおり取り扱うものとする。","ア　アの（ア）から（サ）までについては，児童の興味・関心を重視し，取り上げる人物や文化遺産の重点の置き方に工夫を加えるなど，精選して具体的に理解できるようにすること。その際，アの（サ）の指導に当たっては，児童の発達の段階を考慮すること。","イ　アの（ア）から（サ）までについては，例えば，国宝，重要文化財に指定されているものや，世界文化遺産に登録されているものなどを取り上げ，我が国の代表的な文化遺産を通して学習できるように配慮すること。","ウ　アの（ア）から（コ）までについては，例えば，次に掲げる人物を取り上げ，人物の働きを通して学習できるよう指導すること。卑弥呼，聖徳太子，小野妹子，中大兄皇子，中臣鎌足，聖武天皇，行基，鑑真，藤原道長，紫式部，清少納言，平清盛，源頼朝，源義経，北条時宗，足利義満，足利義政，雪舟，ザビエル，織田信長，豊臣秀吉，徳川家康，徳川家光，近松門左衛門，歌川広重，本居宣長，杉田玄白，伊能忠敬，ペリー，勝海舟，西郷隆盛，大久保利通，木戸孝允，明治天皇，福沢諭吉，大隈重信，板垣退助，伊藤博文，陸奥宗光，東郷平八郎，小村寿太郎，野口英世","エ　アの（ア）の「神話・伝承」については，古事記，日本書紀，風土記などの中から適切なものを取り上げること。","オ　アの（イ）から（サ）までについては，当時の世界との関わりにも目を向け，我が国の歴史を広い視野から捉えられるよう配慮すること。","カ　アの（シ）については，年表や絵画など資料の特性に留意した読み取り方についても指導すること。","キ　イの（ア）については，歴史学習全体を通して，我が国は長い歴史をもち伝統や文化を育んできたこと，我が国の歴史は政治の中心地や世の中の様子などによって幾つかの時期に分けられることに気付くようにするとともに，現在の自分たちの生活と過去の出来事との関わりを考えたり，過去の出来事を基に現在及び将来の発展を考えたりするなど，歴史を学ぶ意味を考えるようにすること。"],"units":[{"u":"縄文のむらから古墳のくにへ","b":"6年","s":3},{"u":"天皇中心の国づくり","b":"6年","s":3},{"u":"貴族のくらし","b":"6年","s":3},{"u":"武士の世の中へ","b":"6年","s":3},{"u":"今に伝わる室町文化","b":"6年","s":3},{"u":"戦国の世から天下統一へ","b":"6年","s":3},{"u":"江戸幕府と政治の安定","b":"6年","s":3},{"u":"町人の文化と新しい学問","b":"6年","s":3},{"u":"明治の国づくりを進めた人々","b":"6年","s":3},{"u":"世界に歩み出した日本","b":"6年","s":3},{"u":"長く続いた戦争と人々のくらし","b":"6年","s":3},{"u":"新しい日本、平和な日本へ","b":"6年","s":3}]},{"id":"shakai-6-X-3","g":[6],"area":"koumin","areaName":"現代社会の仕組みや働きと人々の生活","mark":"⑶","head":"グローバル化する世界と日本の役割","title":"グローバル化する世界と日本の役割について，学習の問題を追究・解決する活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　我が国と経済や文化などの面でつながりが深い国の人々の生活は，多様であることを理解するとともに，スポーツや文化などを通して他国と交流し，異なる文化や習慣を尊重し合うことが大切であることを理解すること。","（イ）　我が国は，平和な世界の実現のために国際連合の一員として重要な役割を果たしたり，諸外国の発展のために援助や協力を行ったりしていることを理解すること。","（ウ）　地図帳や地球儀，各種の資料で調べ，まとめること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　外国の人々の生活の様子などに着目して，日本の文化や習慣との違いを捉え，国際交流の果たす役割を考え，表現すること。","（イ）　地球規模で発生している課題の解決に向けた連携・協力などに着目して，国際連合の働きや我が国の国際協力の様子を捉え，国際社会において我が国が果たしている役割を考え，表現すること。"],"notes":["⑶　内容の⑶については，次のとおり取り扱うものとする。","ア　アについては，我が国の国旗と国歌の意義を理解し，これを尊重する態度を養うとともに，諸外国の国旗と国歌も同様に尊重する態度を養うよう配慮すること。","イ　アの（ア）については，我が国とつながりが深い国から数か国を取り上げること。その際，児童が１か国を選択して調べるよう配慮すること。","ウ　アの（ア）については，我が国や諸外国の伝統や文化を尊重しようとする態度を養うよう配慮すること。","エ　イについては，世界の人々と共に生きていくために大切なことや，今後，我が国が国際社会において果たすべき役割などを多角的に考えたり選択・判断したりできるよう配慮すること。","オ　イの（イ）については，網羅的，抽象的な扱いを避けるため，「国際連合の働き」については，ユニセフやユネスコの身近な活動を取り上げること。また，「我が国の国際協力の様子」については，教育，医療，農業などの分野で世界に貢献している事例の中から選択して取り上げること。"],"units":[{"u":"日本とつながりの深い国々","b":"6年","s":3},{"u":"世界の未来と日本の役割","b":"6年","s":3}]}],"kaisetsu":{"source":"小学校学習指導要領（平成29年告示）解説 社会編（文部科学省，平成29年7月）","items":{"shakai-3-X-1":{"page":34,"name":"身近な地域や市の様子","expl":{"intro":["この内容は，主として「地理的環境と人々の生活」に区分されるものであり，身近な地域や市区町村の様子についての学習で身に付ける事項を示している。身近な地域や市区町村の様子とは，自分たちが通う学校の周りの地域や自分たちの住んでいる市の様子を指している。なお，ここで示している区とは，東京都の特別区（23区）を指している。","身近な地域や自分たちの市の様子に関する内容については，アのア及びイとイのアを関連付けて指導する。例えば，都道府県内における市の位置，市の地形や土地利用，交通の広がり，市役所など主な公共施設の場所と働き，古くから残る建造物の分布などに着目して，観察・調査したり地図などの資料で調べたりして，白地図などにまとめ，身近な地域や市の様子を捉え，場所による違いを考え，表現することを通して，身近な地域や自分たちの市の様子を大まかに理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのアは，知識に関わる事項である。","身近な地域や自分たちの市の様子を大まかに理解することとは，都道府県内における市の位置，市の地形や土地利用，交通の広がり，市役所など主な公共施設の場所と働き，古くから残る建造物の分布などを基に，身近な地域や市区町村の様子について理解することである。","アのイは，技能に関わる事項である。","観察・調査したり地図などの資料で調べたりして，白地図などにまとめることとは，身近な地域や市の様子について，地図や写真などの資料で市の位置や地形，土地利用，交通の広がりなどを観察したり調べたりして，白地図などにまとめることである。ここでは，観察・調査して必要な情報を集める技能，地図などの資料から位置や地形，広がりや分布などを読み取る技能，地図記号を使って，調べたことを白地図などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","都道府県内における市の位置，市の地形や土地利用，交通の広がり，市役所など主な公共施設の場所と働き，古くから残る建造物の分布などに着目して，身近な地域や市の様子を捉え，場所による違いを考え，表現することとは，社会的事象の見方・考え方を働かせ，身近な地域や市の様子について，例えば，市はどこに位置しているか，どのように広がっているか，どのように利用されているかなどの問いを設けて調べたり，場所ごとの様子を比較して違いを考えたりして，調べたことや考えたことを表現することである。","都道府県内における市の位置に着目するとは，都道府県全体から見た自分たちの市や隣接する市などの位置や位置関係について調べることである。市の地形に着目するとは，土地の低いところや高いところ，広々と開けた土地や山々に囲まれた土地，川の流れているところや海に面したところなどの地形の様子について調べることである。土地利用に着目するとは，田や畑，森林の広がり，住宅や商店，工場の分布など，土地利用の広がりや分布について調べることである。交通の広がりに着目するとは，主な道路や鉄道の名称や主な経路などについて調べることである。市役所など主な公共施設の場所と働きに着目するとは，人々が利用する主な公共施設の場所や施設としての働きについて調べることである。ここで取り上げる公共施設としては，市（区）役所や町（村）役場（以下市役所という。）をはじめ，学校，公園，公民館，コミュニティセンター，図書館，児童館，体育館，美術館，博物館，資料館，文化会館，消防署，警察署，交番，裁判所，検察庁，港など，多くの市民が利用したり，市民のために活動したりしている施設が考えられる。その際，多くの公共施設は市役所によって運営されていることや，災害時における避難場所は市役所において指定されていることに触れることが大切である。古くから残る建造物の分布に着目するとは，身近な地域や市に古くから残る神社，寺院，伝統的な家屋などの建造物や，門前町，城下町，宿場町などの伝統的なまち並みの位置や広がり，いわれなどについて調べることである。このようにして調べたことを手掛かりに，身近な地域や市の様子を捉えることができるようにする。","場所による違いを考え，表現することとは，例えば，駅や市役所の付近，工場や住宅の多いところ，田畑や森林が多いところ，伝統的なまち並みがあるところなど，場所ごとの様子を比較したり，主な道路と工場の分布，主な駅と商店の分布など土地利用の様子と，交通などの社会的な条件や土地の高低などの地形条件を関連付けたりして，市内の様子は場所によって違いがあることを考え，文章で記述したり，白地図などにまとめたことを基に説明したりすることである。","実際の指導に当たっては，生活科での学習経験を生かし，小高い山や校舎の屋上など高いところから身近な地域の景観を展望したり，地理的に見て特徴のある場所や主な公共施設などを観察・調査したりする活動が考えられる。そうした活動からつなげて，地図や写真などを活用して，市全体の様子へ視野を広げるようにすることが大切である。"],"t":["内容の取扱いの(1)のアは，内容の(1)の指導における配慮事項を示している。","ここでは，第３学年の内容の(2)，(3)及び(4)に関わりがあることを踏まえて，学年の導入で扱うようにすることや，授業時間数の配分などを工夫して，「自分たちの市」に重点を置いた効果的な指導を行うように計画することを求めている。市の範囲や広がりを捉えることは，地域社会の生産や販売，安全を守るための諸活動，市の様子の移り変わりを理解する上で基礎となるものである。身近な地域を見学したり聞き取り調査をしたりして情報を集める際には，目的や着目する視点を明確にして効果的に行い，市全体を調べる際にその視点を生かすなどして，市全体の地理的環境の概要を理解できるよう工夫することが大切である。","内容の取扱いの(1)のイは，内容の(1)のアのイの指導において，地図帳を使って方位や主な地図記号について扱うようにすることを示したものである。","ここでは，市の様子に関する内容の指導において，自分たちの市の位置を確かめたり調べたことを白地図にまとめたりする際に必要となる方位や主な地図記号について，地図帳を参照して理解し活用できるようにすることを求めている。","方位については，四方位と八方位を扱う。その際，児童の実態等を考慮に入れ，最初に四方位を取り上げ，八方位については，ここでの学習も含めて第４学年修了までに身に付けるようにする。","主な地図記号については，身近な地域の様子を地図に表したり，地図から市の様子を読み取ったりする際に，地域の実態を踏まえて必要なものを扱うようにする。地図記号は，例えば，学校，警察署，交番，消防署，工場，神社，寺院，市役所，図書館，博物館，老人ホーム，郵便局，銀行などの金融機関，病院などの建物・施設に関わるもの，田，畑，果樹園，森林などの土地利用に関わるもの，鉄道，駅，道路，橋，港，空港などの交通に関わるものなどに分類される。"]}},"shakai-3-X-2":{"page":37,"name":"地域の生産や販売の仕事","expl":{"intro":["この内容は，主として「現代社会の仕組みや働きと人々の生活」に区分されるものであり，地域に見られる生産や販売の仕事についての学習で身に付ける事項を示している。地域に見られる生産や販売の仕事とは，身近な地域や市の人々の農作物や工業製品などを生産する仕事や商品を販売する仕事を指している。","ここでは，生産の仕事に関する内容と販売の仕事に関する内容から構成されている。生産の仕事に関する内容については，アのア及びウとイのアを関連付けて指導する。例えば，仕事の種類や産地の分布，仕事の工程などに着目して，見学・調査したり地図などの資料で調べたりして，白地図などにまとめ，生産に携わっている人々の仕事の様子を捉え，地域の人々の生活との関連を考え，表現することを通して，生産の仕事は，地域の人々の生活と密接な関わりをもって行われていることを理解できるようにすることである。","販売の仕事に関する内容については，アのイ及びウとイのイを関連付けて指導する。例えば，消費者の願い，販売の仕方，他地域や外国との関わりなどに着目して，見学・調査したり地図などの資料で調べたりして，白地図などにまとめ，販売に携わっている人々の仕事の様子を捉え，それらの仕事に見られる工夫を考え，表現することを通して，販売の仕事は，消費者の多様な願いを踏まえ売り上げを高めるよう，工夫して行われていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイは，知識に関わる事項である。","アのアの生産の仕事は，地域の人々の生活と密接な関わりをもって行われていることを理解することとは，自分たちの住む地域には様々な生産に関する仕事があること，産地は市内に分布していること，生産するには一定の順序や工程があること，地域で生産された物は地域の人々の生活に使われていることなどを基に，生産の仕事の様子について理解することである。","アのイの販売の仕事は，消費者の多様な願いを踏まえ売り上げを高めるよう，工夫して行われていることを理解することとは，販売の仕事は消費者の需要を踏まえて売り上げを高めるよう工夫していること，商店では商品の品質や並べ方，値段の付け方などを工夫して販売していること，販売の仕事は商品や人を通して国内の他地域や外国とも関わりがあることなどを基に，販売の仕事の様子について理解することである。","アのウは，技能に関わる事項である。","見学・調査したり地図などの資料で調べたりして，白地図などにまとめることとは，地域に見られる販売や生産の仕事について，農家や工場，商店などを見学したり，地図などの資料で生産の仕事の種類や産地の分布，商品の仕入れ先や商圏を調べたりして，市の白地図などにまとめることである。ここでは，見学・調査して必要な情報を集める技能，地図などの資料から分布や地域間のつながりなどを読み取る技能，方位や位置などを確かめながら，調べたことを白地図などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの仕事の種類や産地の分布，仕事の工程などに着目して，生産に携わっている人々の仕事の様子を捉え，地域の人々の生活との関連を考え，表現するとは，社会的事象の見方・考え方を働かせ，生産に携わっている人々の仕事の様子について，例えば，市内にはどのような生産の仕事があるか，それらはどこに集まっているか，どのようにして生産されているかなどの問いを設けて調べたり，生産の仕事と地域の人々の生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","仕事の種類に着目するとは，市内に見られる農作物や工業製品などをつくる仕事の種類について調べることである。産地の分布に着目するとは，市内における田や畑，工場などがある場所の分布について調べることである。仕事の工程に着目するとは，農家や工場などの仕事に見られる原材料の仕入，施設・設備，働く人の仕事の手順，生産物の販売の様子について調べることである。このようにして調べたことを手掛かりに，生産に携わっている人々の仕事の様子を捉えることができるようにする。","地域の人々の生活との関連を考え，表現するとは，例えば，生産の仕事の様子と地域を結び付けて，地域に見られる生産の仕事と地域の人々の生活との関連を考え，文章で記述したり，白地図などにまとめたことを基に説明したりすることである。","イのイの消費者の願い，販売の仕方，他地域や外国との関わりなどに着目して，販売に携わっている人々の仕事の様子を捉え，それらの仕事に見られる工夫を考え，表現するとは，社会的事象の見方・考え方を働かせ，販売に携わっている人々の仕事の様子について，例えば，消費者はどのようなことを願って買い物をしているか，商店の人は消費者の願いに応え売り上げを高めるためにどのような工夫をしているか，商品や客はどこから来ているかなどの問いを設けて調べたり，販売する側の仕事の工夫と消費者の願いを関連付けて考えたりして，調べたことや考えたことを表現することである。","消費者の願いに着目するとは，家族などがよく買い物をする店や，買い物する際の工夫について調べることである。販売の仕方に着目するとは，商品の品質管理，売り場での並べ方や値段の付け方，宣伝の仕方などについて調べることである。他地域や外国との関わりに着目するとは，外国を含めた商品の産地や仕入れ先の名称と位置，買い物に来る客の居住地の範囲などについて調べることである。このようにして調べたことを手掛かりに，地域の販売に携わっている人々の仕事の様子を捉えることができるようにする。","それら（販売に携わっている人々）の仕事に見られる工夫を考え，表現することとは，例えば，観点を設けて，販売の仕方を分類したり，それらと消費者の願いを関連付けたりして，販売の仕事に見られる工夫を考え，文章で記述したり，図表などにまとめたことを基に説明したりすることである。","実際の指導に当たっては，生産の仕事については，市内に見られる生産の仕事の主な種類や分布を大まかに調べた上で，生産の仕事の様子を見学・調査すること，販売の仕事については，地域の人々が利用している身近な商店などを見学・調査することなどが考えられる。なお，販売の仕事と自分たちの生活との関わりについて調べる際には，個人のプライバシーに十分配慮する必要がある。"],"t":["内容の取扱いの(2)のアは，内容の(2)のアのア及びイのアの指導において，取り上げる生産の仕事の範囲を示したものである。","生産の仕事について，事例として取り上げる際には，例えば，地域の実態に応じた学習が展開できるか，市の人々の仕事の特色を具体的に捉えることができるかなどに留意し，農家の仕事，工場の仕事，木を育てる仕事，魚や貝などを採ったり育てたりする仕事などの中から選択して取り上げることが考えられる。","内容の取扱いの(2)のイは，内容の(2)のアのイ及びイのイにおいて，販売の仕事を取り上げる際の配慮事項を示したものである。","ここでは，販売の仕事については，身近な地域にある，例えば，小売店，スーパーマーケット，コンビニエンスストア，デパート，移動販売などの中から選択して，商店を取り上げることとし，その際，国内の「他地域や外国との関わり」について指導することを示している。例えば，販売における商品の仕入れ先を調べる際，地図帳などを使って，都道府県や外国の名称と位置を確かめる活動を行い，自分たちの消費生活を支えている販売の仕事は国内の他地域や外国と結び付いていることに気付くように指導する必要がある。","内容の取扱いの(2)のウは，内容の(2)のイのイにおいて外国を取り上げる際，我が国や外国には国旗があることを理解させるとともに，それを尊重する態度を育てるようにすることを示したものである。","ここでは，我が国や外国には国旗があること，いずれの国でも国旗を大切にしていること，及び我が国の国旗を尊重するとともに，外国の国旗を尊重することが大切であることなどを指導することが大切である。その際，取り上げた外国の国旗を地図帳などで確認することなどを通して指導するように配慮する必要がある。"]}},"shakai-3-X-3":{"page":41,"name":"地域の安全を守る働き（消防・警察）","expl":{"intro":["この内容は，「現代社会の仕組みや働きと人々の生活」に区分されるものであり，地域の安全を守る働きについての学習で身に付ける事項を示している。地域の安全を守る働きとは，消防署や警察署などの関係機関に従事する人々が相互に連携し，地域の人々と協力して，火災や事故などから人々の安全を守るために行っている働きを指している。ここで取り上げる火災や事故などとは，地域の人々の生命や財産を脅かす火災，交通事故や犯罪などの事故や事件である。","地域の安全を守る働きに関する内容については，アのア及びイとイのアを関連付けて指導する。例えば，施設・設備などの配置，緊急時への備えや対応などに着目して，見学・調査したり地図などの資料で調べたりして，まとめ，関係機関や地域の人々の諸活動を捉え，相互の関連や従事する人々の働きを考え，表現することを通して，消防署や警察署などの関係機関は，地域の安全を守るために，相互に連携して緊急時に対処する体制をとっていることや，関係機関が地域の人々と協力して火災や事故などの防止に努めていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのアは，知識に関わる事項である。","消防署や警察署などの関係機関は，地域の安全を守るために，相互に連携して緊急時に対処する体制をとっていることを理解することとは，緊急時において，消防署や警察署などの関係機関が，緊急指令室等を中心にネットワークを活用して相互に連携するとともに，火災，交通事故，犯罪など緊急事態が発生した時には，状況に応じて迅速かつ確実に事態に対処していることや，近隣の消防署や警察署，市役所や病院，放送局，水・電気・ガスを供給している機関などが協力していること，消防団など地域の人々が組織する諸団体が緊急事態に対処していることなどを基に，地域の安全を守る働きについて理解することである。","消防署や警察署などの関係機関が地域の人々と協力して火災や事故などの防止に努めていることを理解することとは，火災については，消防署を中心に警察署，市役所，病院，放送局，学校，水，電気・ガスを供給している機関などが普段から施設・設備の整備や点検，訓練，広報活動などに取り組み，火災の予防に努めていることや，地域の人々が消防署への火災通報，避難訓練の実施，地域の消防団による防火を呼び掛ける活動などの火災予防に協力していることなどを基にして，地域の安全を守る働きについて理解することである。また，交通事故や犯罪などの事故や事件については，警察署が中心となって，消防署，市役所，病院，放送局，地域の町内会や自治会，学校，ＰＴＡその他の関係の諸団体が連携・協力して交通安全運動や防犯活動を展開していることや，保護者による地域の巡回，「子ども110番の家」の設置など，地域の人々が事故防止や防犯に協力していることなどを基に，地域の安全を守る働きについて理解することである。","アのイは，技能に関わる事項である。","見学・調査したり地図などの資料で調べたりして，まとめることとは，地域の安全を守る活動について，消防署や警察署などの関係機関や関連する施設・設備を見学したり，地図や関係機関が作成した資料などで調べたりして，白地図などにまとめることである。ここでは，見学・調査して必要な情報を集める技能，施設・設備の位置，関係機関相互の協力関係などを読み取る技能，調べたことを白地図や図表などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","施設・設備などの配置，緊急時への備えや対応などに着目して，関係機関や地域の人々の諸活動を捉え，相互の関連や従事する人々の働きを考え，表現するとは，社会的事象の見方・考え方を働かせ，関係機関や地域の人々の諸活動について，例えば，どこにどのような施設・設備があるか，どのように連携・協力して火災や事故などの発生に備えたり対応したりしているかなどの問いを設けて調べたり，それらの諸活動と人々の生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","施設・設備などの配置に着目するとは，消防署や警察署などの関係機関や消火栓や火災報知器，消防水利，消防団倉庫などの施設・設備や，ガードレールや交通標識，信号，カーブミラー，「子ども110番の家」などの施設・設備の位置や分布について調べることである。緊急時への備えや対応に着目するとは，働いている人の勤務体制や待機の仕方，訓練，施設・設備の点検，パトロールの様子などについて調べたり，関係機関のそれぞれの役割や通信指令室を中心とするネットワークによる関係機関の相互の連携などについて調べたりすることである。このようにして調べたことを手掛かりに，関係機関や地域の人々の諸活動を捉えることができるようにする。","相互の関連や従事する人々の働きを考え，表現することとは，例えば，連携・協力している関係機関の働きを比較・分類したり，結び付けたりして，関係機関の相互の関連を考え，文章で記述したり，図などにまとめたことを基に説明したりすることである。また，関係機関に従事する人々の活動と地域の人々の生活を関連付けて，関係機関の働きを考え，文章で記述したり話し合ったりすることである。","実際の指導に当たっては，関係機関等から集めた資料を活用したり，関係機関や地域の人などから地域の安全を守るための活動について話を聞いたりする活動が考えられる。"],"t":["内容の取扱いの(3)のアは，内容の(3)のアのアにおいて，「消防署や警察署などの関係機関は，地域の安全を守るために，相互に連携して緊急時に対処する体制をとっていることや，関係機関が地域の人々と協力して火災や事故などの防止に努めていること」を指導する際の配慮事項を示したものである。「緊急時に対処する体制をとっていること」と「防止に努めていること」については，火災と事故のいずれにおいても取り上げるものとする。その際，例えば，「緊急時に対処する体制をとっていること」については，火災に重点を置き，「防止に努めていること」については，事故に重点を置くなど，取り上げ方に軽重を付け，効果的に指導するようにする。","内容の取扱いの(3)のイは，内容の(3)のイのアにおいて，社会生活を営む上で大切な法やきまりについて扱うようにすることを示したものである。火災については，例えば，防火設備の設置や点検，消防訓練の義務など，火災の防止に関する法やきまりを，事故などについては，例えば，登下校などにおける交通事故の防止に関する法やきまりを取り上げるなど，地域の人々の安全な生活の維持と向上を図るための法やきまりを扱うようにする。","また，内容の(3)のイのアにおける配慮事項を示したものである。ここでは，学習したことを基に，地域の人々が行っている火災予防，交通安全や防犯などに関わる活動の中から，地域社会の一員として自分たちにも協力できることを考えたり，自分自身の安全を守るために日頃から心掛けるべきことを選択・判断したりして，それらを基に話し合うことなどが大切である。例えば，火事を引き起こさない生活の仕方や事故を起こしたり事件に巻き込まれたりしない行動の仕方について討論したり，標語やポスターなどを作成したりすることなどが考えられる。"]}},"shakai-3-X-4":{"page":44,"name":"市の様子の移り変わり","expl":{"intro":["この内容は，主として「歴史と人々の生活」に区分されるものであり，市の様子の移り変わりについての学習で身に付ける事項を示している。市の様子の移り変わりとは，自分たちの市において，交通や公共施設が整備されたり人口が増えたり，土地利用の様子が変わったりしてきたこと，それらに伴い市や人々の生活の様子が変化してきたことを指している。","市の様子の移り変わりに関する内容については，アのア及びイとイのアを関連付けて指導する。例えば，交通や公共施設，土地利用や人口，生活の道具などの時期による違いに着目して，聞き取り調査をしたり地図などの資料で調べたりして，年表などにまとめ，市や人々の生活の様子を捉え，それらの変化を考え，表現することを通して，市や人々の生活の様子は，時間の経過に伴い，移り変わってきたことを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのアは，知識に関わる事項である。","市や人々の生活の様子は，時間の経過に伴い，移り変わってきたことを理解することとは，自分たちの市は，昔から今に至る時間の経過に伴って，駅や道路などの交通網が整備されてきたこと，公共施設などが建設されてきたこと，土地利用の様子や人口が変化してきたこと，生活で使う道具などが改良され変わってきたことなどを基に，市や人々の生活の様子の移り変わりについて理解することである。","アのイは，技能に関わる事項である。","聞き取り調査をしたり地図などの資料で調べたりして，年表などにまとめることとは，市の様子の移り変わりについて，博物館や資料館などの関係者や地域の人などへの聞き取り調査をしたり，関係機関が作成した資料などで調べたりして，年表などにまとめることである。ここでは，聞き取り調査で必要な情報を集める技能，地図や写真などの資料を見比べながら，移り変わりなどの情報を読み取る技能，時期の区分や時間の経過に沿って，調べたことを年表などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","交通や公共施設，土地利用や人口，生活の道具などの時期による違いに着目して，市や人々の生活の様子を捉え，それらの変化を考え，表現することとは，社会的事象の見方・考え方を働かせ，市や人々の生活の様子について，例えば，鉄道や道路はどのように整備されてきたか，どのような公共施設が建てられてきたか，土地の使われ方や人口はどのように変わってきたか，生活の道具はどのように変化してきたかなどの問いを設けて調べたり，その変化の傾向を考えたりして，調べたことや考えたことを表現することである。","交通の時期による違いに着目するとは，市内の鉄道や主要な道路などが整備される前や整備された後の市の様子，及び現在の市の様子について調べることである。公共施設の時期による違いに着目するとは，自分たちの学校や中央図書館，公民館などの公共施設が建設された頃と現在の市の様子について調べることである。土地利用の時期による違いに着目するとは，大きな団地などの住宅開発や工業団地の建設など，大きく変わった市の土地利用の様子について調べることである。その際，例えば，昔は山林や農地が多かったが現在はその多くが住宅地などに変わっていることなど，市全体を見渡して違いを捉えるようにすることも大切である。人口の時期による違いに着目するとは，現在に至るまでに増加したり減少したりして変化してきた市の人口について調べることである。その際，市町村の合併による市の広がりなどに触れることも大切である。生活の道具の時期による違いに着目するとは，電化製品が普及する前と普及した後，及び現在の生活の中で使用している道具の使い方や生活の様子について調べることである。ここでは，炊事や洗濯など家事に使用する道具や明かりや暖をとる道具など生活の中で使われた道具を取り上げることが考えられる。このようにして調べたことを手掛かりに，市や人々の生活の様子を捉えることができるようにする。","それら（市や人々の様子）の変化を考え，表現することとは，例えば，駅や鉄道，公共施設ができたこと，人口が変化してきたこと，土地利用の様子や生活の道具が変わったことなどを相互に関連付けたり，市の様子の変化と人々の生活の様子の変化を結び付けたりして，都市化や過疎化，少子高齢化など市全体の変化の傾向を考え，文章で記述したり，年表などにまとめたことを基に話し合ったりすることである。","実際の指導に当たっては，市町村合併の時期，交通の整備や公共施設の建設，人口の増減などの視点から市の様子が大きく変わった幾つかの時期に着目して，その頃の様子を調べる活動や，現在と比較して年表などにまとめる活動などが考えられる。その際，内容の(1)の「身近な地域や市の様子」の学習において作成した地図などを活用することなどが考えられる。"],"t":["内容の取扱いの(4)のアは，内容の(4)のアのイの指導において，「年表などにまとめる」際に，取り上げるべき事項について示したものである。ここでは，市の様子の移り変わりについて指導する際に，時期の区分について，昭和，平成などの元号を取り上げるようにする。また，明治，大正などの元号や江戸時代などの言い表し方があることを取り上げることも考えられる。年表に元号などを位置付けて，市の様子の移り変わりを年代順に整理できるようにすることが大切である。","内容の取扱いの(4)のイは，内容の(4)のイのアにおいて，「公共施設」を取り上げる際の留意事項を示したものである。","公共施設については，学校，図書館，公民館，資料館などが考えられる。その際，内容の(1)において取り上げた公共施設との関連を図り，公共施設の建設や運営には市役所が関わってきたことや，その建設や運営には租税が重要な役割を果たしていることに触れるようにすることが大切である。","内容の取扱いの(4)のウは，内容の(4)のイのアにおいて，「人口」を取り上げる際の留意事項を示したものである。","人口を取り上げる際には，表や棒グラフを活用するなど，増減の傾向を大まかに捉えるようにすることが大切である。その際，市によっては，少子化や高齢化が進んでいることや外国人居住者が増え国際化が進んでいることなどに触れることも大切である。","また，市役所などが作成している資料などを基に，これからの市の発展に関心をもち，市が将来どのようになってほしいか，そのためには市民としてどのように行動していけばよいかなど，市の将来について考えたり討論したりすることができるよう指導することが大切である。","第３学年の内容においては，内容の(1)から(4)の学習を通して，社会的事象について，学習問題を主体的に解決しようとする態度や，よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとともに，思考や理解を通して，地域社会に対する誇りと愛情，地域社会の一員としての自覚を養うようにすることが大切である。"]}},"shakai-4-X-1":{"page":51,"name":"県の様子，47都道府県の名称と位置","expl":{"intro":["この内容は，「地理的環境と人々の生活」に区分されるものであり，都道府県の様子についての学習で身に付ける事項を示している。都道府県の様子とは，自分たちの県の位置や地形，産業や交通，主な都市の位置などの概要を指している。","都道府県の様子に関する内容については，アのアとイ及びイのアをそれぞれ関連付けて指導する。例えば，我が国における自分たちの県の位置，県全体の地形や主な産業の分布，交通網や主な都市の位置などに着目して，地図帳や各種の資料で調べ，白地図などにまとめ，県の様子を捉え，地理的環境の特色を考え，表現することを通して，自分たちの県の地理的環境の概要を理解するとともに，47都道府県の名称と位置を理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのアは，知識に関わる事項である。","自分たちの県の地理的環境の概要を理解することとは，国内における自分たちの県の位置，隣接する県との位置関係，県全体の地形や主な産業，交通網の様子や主な都市の位置などを基に，都道府県の様子について理解することである。","47都道府県の名称と位置を理解することとは，我が国が47の都道府県で構成されていることや，各都道府県の名称や日本地図上の位置などを基に，47都道府県の名称と位置について理解することである。その際，都道府県の名称に用いる漢字については，国語科において，第４学年までに指導することとなっている。このため，指導する時期について国語科との連携を図るとともに，漢字の表記に慣れるよう配慮する。","地図帳や各種の資料で調べ，白地図などにまとめることとは，自分たちの県の様子について，地図帳や立体模型，航空写真などの資料で調べ，県の白地図などにまとめることや，47都道府県の名称と位置について，地図帳などで確かめたり，日本の白地図などに書き表したりすることである。ここでは，地図帳などを用いて，位置や地形，広がりや分布などの情報を読み取る技能，名称と位置を確かめながら，調べたことを白地図などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","我が国における自分たちの県の位置，県全体の地形や主な産業の分布，交通網や主な都市の位置などに着目して，県の様子を捉え，地理的環境の特色を考え，表現することとは，社会的事象の見方・考え方を働かせ，県の様子について，例えば，自分たちの県は日本のどこに位置しているか，どのような地形が見られるか，主な産業はどこに分布しているか，交通網はどのように広がっているか，主な都市はどこに位置しているかなどの問いを設けて調べたり，それらを総合して県の地理的環境の特色を考えたりして，調べたことや考えたことを表現することである。","我が国における自分たちの県の位置に着目するとは，日本全体から見た自分たちの県の位置や隣接する県との位置関係について調べることである。県全体の地形に着目するとは，県全体の主な山地や平地，半島，川，湖や沼，海などの位置や広がりの様子について調べることである。主な産業の分布に着目するとは，県内の主要な産業や特色ある産業の分布について調べることである。交通網に着目するとは，主な駅や港，空港の位置，県内を通る主な道路や鉄道などの交通網の広がりについて調べることである。主な道路としては高速道路や主な国道や県道などが考えられる。主な都市の位置に着目するとは，県庁のある市や人口が集中している市，交通の要衝となっている市，産業の盛んな市など主な都市の位置を調べることである。このようにして調べたことを手掛かりに，県の様子を捉えることができるようにする。","地理的環境の特色を考え，表現するとは，例えば，県の位置や県全体の地形，主な産業，交通網や主な都市の位置などの情報を総合して，自分たちの県の概要や特色を考え，文章で記述したり，白地図などにまとめたことを基に説明したりすることである。","実際の指導に当たっては，県の地図や地図帳を十分に活用することが大切である。例えば，地図上で自分たちの県の位置を言い表す活動，県の白地図に地形や産業の分布，交通網，主な都市の位置を書き表す活動，47都道府県の位置を地図帳で確かめ，その名称を白地図に書き表す活動などが考えられる。"],"t":[]}},"shakai-4-X-2":{"page":53,"name":"飲料水・電気・ガス，ごみや下水の事業","expl":{"intro":["この内容は，主として「現代社会の仕組みや働きと人々の生活」に区分されるものであり，人々の健康や生活環境を支える事業についての学習で身に付ける事項を示している。人々の健康や生活環境を支える事業とは，飲料水，電気，ガスを供給する事業と廃棄物を処理する事業を指している。","ここでは，飲料水，電気，ガスを供給する事業に関する内容と廃棄物を処理する事業に関する内容から構成されている。飲料水，電気，ガスを供給する事業に関する内容については，アのア及びウとイのアを関連付けて指導する。例えば，供給の仕組みや経路，県内外の人々の協力などに着目して，見学・調査したり地図などの資料で調べたりして，まとめ，飲料水，電気，ガスの供給のための事業の様子を捉え，それらの事業が果たす役割を考え，表現することを通して，飲料水，電気，ガスを供給する事業は，安全で安定的に供給できるよう進められていることや，地域の人々の健康な生活の維持と向上に役立っていることを理解できるようにすることである。","廃棄物の処理に関する内容については，アのイ及びウとイのイを関連付けて指導する。例えば，処理の仕組みや再利用，県内外の人々の協力などに着目して，見学・調査したり地図などの資料で調べたりして，まとめ，廃棄物の処理のための事業の様子を捉え，その事業が果たす役割を考え，表現することを通して，廃棄物を処理する事業は，衛生的な処理や資源の有効利用ができるよう進められていることや，生活環境の維持と向上に役立っていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイは，知識に関わる事項である。","アのアの飲料水，電気，ガスを供給する事業は，安全で安定的に供給できるよう進められていることを理解することとは，飲料水，電気，ガスを供給する事業は，人々が安心してそれらを使うことができるよう様々な面で安全確保に努めていること，必要な量をいつでも使えるよう確保に努めていること，関係機関が相互に連携したり県内外の人々と協力したりして安定的に供給できるように進められていることなどを基に，飲料水，電気，ガスを供給する事業について理解することである。また，（飲料水，電気，ガスを供給する事業は，）地域の人々の健康な生活の維持と向上に役立っていることを理解することとは，地域の人々の日常生活において，大量の飲料水，電気，ガスが使用されていること，飲料水，電気，ガスを供給する事業においては，現在に至るまでに安全かつ安定的に供給する仕組みがつくられ，計画的に改善されてきたことや，その結果，地域の公衆衛生が向上し，健康な生活が維持・向上してきたことなどを基に，飲料水，電気，ガスを供給する事業について理解することである。","アのイの廃棄物を処理する事業は，衛生的な処理や資源の有効利用ができるよう進められていることを理解することとは，ごみや下水などの廃棄物を処理する事業は，地域の生活環境に配慮しながら廃棄物を安全かつ衛生的に処理していることや，県内外の関係機関が相互に連携して処理したり再利用したりしていることなどを基に，廃棄物を処理する事業について理解することである。また，（廃棄物を処理する事業は，）生活環境の維持と向上に役立っていることを理解することとは，地域の人々の日常生活において，大量で多様な廃棄物が排出されていることや，廃棄物を処理する事業においては，現在に至るまでに衛生的に処理する仕組みがつくられ計画的に改善されてきたこと，その結果，地域の公衆衛生が向上し，人々の生活環境が維持・向上してきたことなどを基に，廃棄物を処理する事業について理解することである。","アのウは，技能に関わる事項である。","見学・調査したり地図などの資料で調べたりして，まとめることとは，人々の健康や生活環境を支える事業について，関連する施設や事業所を見学したり，地図や関係機関が作成した資料などで調べたりして，県の白地図や図表などにまとめることである。ここでは，見学・調査して必要な情報を集める技能，関係機関相互の協力関係などを読み取る技能，調べたことを図表などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの供給の仕組みや経路，県内外の人々の協力などに着目して，飲料水，電気，ガスの供給のための事業の様子を捉え，それらの事業が果たす役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，飲料水，電気，ガスの供給のための事業の様子について，例えば，どのような仕組みで作られているか，どのような経路を通って送られて来るか，どのような関係機関や人々の協力の基に成り立っているかなどの問いを設けて調べたり，それらの事業と人々の生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","供給の仕組みや経路に着目するとは，飲料水，電気，ガスの確保に向けた取組や，飲料水，電気，ガスが自分たちの地域に届けられる仕組みや経路について調べることである。飲料水の供給については，水源林の確保，ダムや貯水池，浄水場での高度な技術を活用した浄水処理や給水の仕組みなどを調べることである。電気の供給については，火力，水力，原子力などの発電所，燃料や水資源の確保，発電所から消費地までの送電，必要な量の電気の確保などの様子を調べることである。その際，火力発電所や原子力発電所については，環境や安全に配慮して発電していることについても調べる必要がある。ガスの供給については，原料の液化天然ガスなどを外国から輸入していること，液化天然ガスの製造基地，都市ガスとしての供給，安全の確保などの様子を調べることである。県内外の人々の協力に着目するとは，飲料水，電気，ガスの供給に関係する施設や事業所などの建設に関わる県内外の人々，節水（節電や省エネ）などに関わる県内の人々の連携や協力について調べることである。なお，電気を取り上げる場合には，電力を大量に消費する大都市圏に住む人々の生活は，消費地から離れた県などにある発電所から電力の供給を受けることで成り立っていることに触れるようにする。その際，先の東日本大震災において原子力発電所で大きな事故が発生したことに伴って生じ，現在なお直面している多くの困難を踏まえ，当該地域やその住民，一時避難者に十分配慮して指導することが必要である。","このようにして調べたことを手掛かりに，飲料水，電気，ガスの供給のための事業の様子を捉えることができるようにする。","それらの事業が果たす役割を考え，表現することとは，例えば，飲料水，電気，ガスの供給のための事業に見られる仕組みや人々の協力関係と地域の人々の健康や生活環境を関連付けて，それらの事業が果たす役割を考え，文章で記述したり，白地図や図表などにまとめたことを基に話し合ったりすることである。","イのイの処理の仕組みや再利用，県内外の人々の協力などに着目して，廃棄物の処理のための事業の様子を捉え，その事業が果たす役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，廃棄物の処理のための事業の様子について，例えば，廃棄物をどのように集め処理しているか，再利用にはどのような方法があるか，どのような関係機関や人々の協力の基に成り立っているかなどの問いを設けて調べたり，その事業と人々の健康や生活環境を関連付けて考えたりして，調べたことや考えたことを表現することである。","処理の仕組みに着目するとは，ごみや下水などの廃棄物を処理したり処分したりする仕組みについて調べることである。再利用に着目するとは，廃棄物が資源として再利用されていることについて調べることである。ごみの処理については，資源の分別収集や再利用，再生された製品の有効利用，焼却時の熱を利用した施設などを調べることである。下水の処理については，下水を処理した再生水や雨水の有効利用の取組などを調べることである。県内外の人々の協力に着目するとは，廃棄物の処理に関係する施設や事業所，ごみ処理場や下水処理場などの建設に関わる県内外の人々，ごみ資源のリサイクルや水の再利用などに関わる人々などの連携や協力について調べることである。このようにして調べたことを手掛かりに，廃棄物の処理のための事業の様子を捉えることができるようにする。","その事業が果たす役割を考え，表現することとは，例えば，ごみや下水などの廃棄物を処理する仕組みや人々の協力関係と地域の良好な生活環境を関連付けて，廃棄物を処理する事業の役割を考え，文章で記述したり，白地図や図表などにまとめたことを基に話し合ったりすることである。","実際の指導に当たっては，学校など身近な生活や社会における飲料水の使われ方や使用量，学校，商店などから出される廃棄物の種類や量などを調べることが考えられる。なお，各家庭における状況を調べる場合には，個人のプライバシーに十分配慮することが大切である。"],"t":["内容の取扱いの(1)のアは，内容の(2)のアのア及びイについて指導する際の配慮事項を示したものである。","内容の(2)のアのアの「地域の人々の健康な生活の維持と向上に役立っていること」やアのイの「生活環境の維持と向上に役立っていること」を理解できるようにする際に，供給や処理の仕組みが過去から現在に至るまでに計画的に改善され，公衆衛生が向上してきたことに触れるようにすることを示したものである。","ここでは，例えば，川の水や井戸水をそのまま飲んでいたこと，かまどやランプを使って生活していたこと，下水を十分に処理しないまま川や海などに流したり，ごみをそのまま埋めたり燃やしたりしていたことなどに触れ，その後，上水の仕組み，ごみや下水の処理の仕組みなどが計画的に改善されてきたことにより，公衆衛生が向上し，環境に与える負荷が軽減してきたことに気付くようにすることなどが考えられる。","内容の取扱いの(1)のイは，内容の(2)のアのア及びイのアの指導において，取り上げる対象の範囲を示したものである。","ここでは，「飲料水，電気，ガス」の中から一つを選択して取り上げることが考えられる。その際，地域の実態に応じて，見学を取り入れたり関係機関が作成した資料などを活用したりして，具体的に調べることができるようにすることが大切である。","内容の取扱いの(1)のウは，内容の(2)のアのイ及びイのイの指導において，取り上げる対象の範囲について示したものである。","ここでは，「ごみ，下水」のいずれかを選択して取り上げることが考えられる。その際，地域の実態に応じて，見学を取り入れたり関係機関が作成した資料などを活用したりして，具体的に調べることができるようにすることが大切である。","内容の取扱いの(1)のエは，内容の(2)のイのアについて指導する際の配慮事項について示したものである。","ここでは，学習したことを基に，水，電気，ガスを大切な資源として捉え，節水や節電，省エネなどに向けて，自分たちが協力できることなどを考えたり選択・判断したりするなど，資源の有効利用に関心を高めるよう配慮することが大切である。その際，市などが行っている節水や節電の呼びかけ，家庭や学校，事業所などでの節水や節電の取組，太陽エネルギー利用の取組などを取り上げ，飲料水や電気，ガスなどの使い方を見直し有効に利用することが大切であることに気付くようにすることが大切である。","内容の取扱いの(1)のオは，内容の(2)のイのイの指導において，地域の人々の健康や生活環境を守る上で大切な法やきまりについて扱うようにすることを示したものである。","ここでは，例えば，ごみの処理，下水の処理に関わって，ごみの出し方や生活排水の処理，資源の再利用などに関する法やきまりを取り上げるなど，地域の人々の健康な生活や良好な生活環境の維持と向上を図るための法やきまりを扱うようにする。","また，内容の(2)のイのイについて指導する際の配慮事項について示したものである。","ここでは，学習したことを基に，ごみを減らしたり水を汚したりしないために自分たちが協力できることを考えたり選択・判断したりして，人々の生活環境の保全に関心を高めるよう配慮することが大切である。その際，地域におけるごみの減量や資源としての再利用，水を汚さない取組などを取り上げるなどして，自らも廃棄物の適切な処理や再利用に協力しようとする態度を養うように配慮することが大切である。"]}},"shakai-4-X-3":{"page":58,"name":"自然災害から人々を守る活動","expl":{"intro":["この内容は，主として「現代社会の仕組みや働きと人々の生活」に区分されるものであり，自然災害から人々を守る活動についての学習で身に付ける事項を示している。自然災害から人々を守る活動とは，県庁や市役所などの関係機関が相互に連携したり地域の人々と協力したりして，自然災害から人々の安全を守るために行っている活動を指している。","自然災害から人々を守る活動に関する内容については，アのア及びイとイのアを関連付けて指導する。例えば，過去に発生した地域の自然災害，関係機関の協力などに着目して，聞き取り調査をしたり地図や年表などの資料で調べたりして，まとめ，災害から人々を守る活動を捉え，その働きを考え，表現することを通して，地域の関係機関や人々は，自然災害に対し，様々な協力をして対処してきたことや，今後想定される災害に対し，様々な備えをしていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのアは，知識に関わる事項である。","地域の関係機関や人々は，自然災害に対し，様々な協力をして対処してきたことを理解することとは，県内で過去に自然災害が発生していること，発生した際には県や市，警察署や消防署，消防団などの関係機関や地域の人々が協力して，自然災害から人々の安全を守るために対処してきたことなどを基に，自然災害から人々を守る活動について理解することである。","（地域の関係機関や人々は，）今後想定される災害に対し，様々な備えをしていることを理解することとは，県庁や市役所，警察署や消防署，消防団などの関係機関と地域の人々は，過去の自然災害の発生状況などを踏まえ，気象情報を収集したり災害の前兆現象を察知したりして，起こり得る自然災害による被害を防いだり減らしたりするための備えをしていることなどを基に，自然災害から人々を守る活動について理解することである。","アのイは，技能に関わる事項である。","聞き取り調査をしたり地図や年表などの資料で調べたりして，まとめることとは，自然災害から地域の安全を守る活動について，県庁や市役所，地域の防災組織などの関係者から聞き取り調査をしたり，地図や年表，関係者が作成した資料などで調べたりして，年表などにまとめることである。ここでは，聞き取り調査で必要な情報を集める技能，地図や年表などの資料から情報を読み取る技能，時間の経過に沿って年表などに整理したり関係機関相互の協力関係を図表などにまとめたりする技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","過去に発生した地域の自然災害，関係機関の協力などに着目して，災害から人々を守る活動を捉え，その働きを考え，表現することとは，社会的事象の見方・考え方を働かせ，災害から人々を守る活動について，例えば，県内で過去にどのような自然災害が発生しどのような被害をもたらしたか，被害を減らすために関係機関や人々はどのように協力しているかなどの問いを設けて調べたり，それらの活動と人々の生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","過去に発生した地域の自然災害に着目するとは，県内で発生した自然災害の種類や場所，時期について調べることである。関係機関の協力に着目するとは，自然災害が発生した際には，県庁や市役所はもとより警察署や消防署，消防団や地域の自主防災組織など様々な機関や団体，人々が協力して，被害を減らすよう努力してきたことや，これからの災害に備えて県庁や市役所などが防災対策を考え，地域の人々とともに取組を進めていることなどについて調べることである。このようにして調べたことを手掛かりに，自然災害から人々を守る活動を捉えることができるようにする。","その（災害から人々を守る活動の）働きを考え，表現するとは，例えば，自然災害が発生した際の被害状況と災害から人々を守る活動を関連付けて，県内の人々の命や財産を守るなど，それらの活動の働きを考え，文章で記述したり，年表や図表などにまとめたことを基に説明したり話し合ったりすることである。","実際の指導に当たっては，ハザードマップや県や市の広報誌，災害年表などを活用して調べることが考えられる。"],"t":["内容の取扱いの(2)のアは，内容の(3)のアのアの指導において，地域における自然災害を取り上げる際の対象の範囲と配慮事項を示したものである。","地域における自然災害については，過去に県内で発生した「地震災害，津波災害，風水害，火山災害，雪害など」の中から選択して取り上げることが考えられる。なお，風水害とは，豪雨，洪水，崖崩れや土石流などの土砂災害，突風や竜巻などによる災害を指している。ここでは，県内において過去に発生した自然災害を取り上げて，地域の関係機関や人々の協力活動などを中心に調べるようにすることが大切である。","例えば，地震災害を取り上げる場合には，国と県と市の協力による防災情報の提供，津波や土砂崩れなどへの対策，緊急避難場所の指定や備蓄倉庫の設置，地震の発生を想定した緊急時の連絡体制などの整備，及び救助計画，避難訓練など地域の人々の協力と参加を取り上げることが考えられる。風水害を取り上げる場合には，国や県の働きや近隣の市の協力により，崖崩れによる災害の防止や砂防ダムの建設，河川の改修，水防倉庫の設置，避難場所の確保など，風水害を未然に防ぐ努力をしていることや，避難訓練の実施，地域の消防団による危険箇所の見回りや点検など，地域の住民が風水害防止に協力していることを取り上げることが考えられる。火山災害を取り上げる場合には，国，県及び市が，地域住民や登山者に向けて作成している火山災害に関するパンフレット，火山ハザードマップや火山災害時の行動マニュアル，県や市が地域住民に対して行っている避難計画の周知や避難訓練の実施，噴火の恐れがある時には，国が観測体制を強化し，警戒レベルを決めて噴火警報を発表していることを取り上げることが考えられる。なお，実際に自然災害によって被災した地域や被災が想定される地域を取り上げる際には，そこに居住していた人々や今も居住している人々がいることを念頭に，個人の置かれている状況やプライバシーなどに十分配慮する必要がある。","内容の取扱いの(2)のイは，内容の(3)のアのア及びイのアの「関係機関」として中心に取り上げる対象を示したものである。","ここでは，県庁や市役所を中心に取り上げ，県や市が策定した防災計画に基づく防災対策，防災情報の発信や避難体制の確保などの対策や事業の取組を取り上げるようにする。その際，県庁や市役所が，消防署や警察署はもとより我が国の平和と安全を守ることを任務とする自衛隊など国の関係機関とも連携・協力して人々の安全を守る活動を行っていることに気付かせることも大切である。","内容の取扱いの(2)のウは，内容の(3)のイのアについて指導する際の配慮事項を示したものである。","ここでは，県内で様々な自然災害が度々起きていることや，自然災害は気象や地象の状況と深い関係があることなどを踏まえて，日ごろから気象庁などからの情報や防災情報，地域の地理的環境などに関心をもち，災害が起きたときに自分自身の安全を守るための行動の仕方を考えたり，自分たちにできる自然災害への備えを選択・判断したりすることができるように指導することが大切である。"]}},"shakai-4-X-4":{"page":62,"name":"県内の伝統や文化，先人の働き","expl":{"intro":["この内容は，主として「歴史と人々の生活」に区分されるものであり，県内の伝統や文化，先人の働きについての学習を通して身に付ける事項を示している。県内の伝統や文化，先人の働きとは，県内に古くから伝わる文化財や年中行事と地域の発展に尽くした先人の働きを指している。","ここでは，県内の伝統や文化に関する内容と先人の働きに関する内容から構成されている。県内の伝統や文化に関する内容については，アのア及びウとイのアを関連付けて指導する。例えば，歴史的背景や現在に至る経過，保存や継承のための取組などに着目して，見学・調査したり地図などの資料で調べたりして，年表などにまとめ，県内の文化財や年中行事の様子を捉え，人々の願いや努力を考え，表現することを通して，県内の文化財や年中行事は，地域の人々が受け継いできたことや，それらには地域の発展など人々の様々な願いが込められていることを理解できるようにすることである。","先人の働きに関する内容については，アのイ及びウとイのイを関連付けて指導する。例えば，当時の世の中の課題や人々の願いなどに着目して，見学・調査したり地図などの資料で調べたりして，年表などにまとめ，地域の発展に尽くした先人の具体的事例を捉え，先人の働きを考え，表現することを通して，地域の発展に尽くした先人は，様々な苦心や努力により当時の生活の向上に貢献したことを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイは，知識に関わる事項である。","アのアの県内の文化財や年中行事は，地域の人々が受け継いできたことを理解することとは，自分たちの住む県内の様々な場所で文化財や年中行事が受け継がれていること，それらは地域の歴史を伝えるものであることなどを基に，県内の伝統や文化について理解することである。また，それら（県内の文化財や年中行事）には地域の発展など人々の様々な願いが込められていることを理解することとは，文化財や年中行事にはそれらの保存や継承に取り組んでいる地域の人々の努力が見られることや，地域の生産活動やまちの発展，人々のまとまりなどへの願いが込められていることを基に，県内の伝統や文化について理解することである。","アのイの地域の発展に尽くした先人は，様々な苦心や努力により当時の生活の向上に貢献したことを理解することとは，開発，教育，医療，文化，産業などにおいて地域の発展に尽くした先人について，それらの先人は様々な苦心や努力を重ねて業績を成し遂げたことや，その苦心や努力が当時の人々の生活の向上や地域の発展に大きく貢献したことなどを基に，先人の働きについて理解することである。","アのウは，技能に関わる事項である。","見学・調査したり地図などの資料で調べたりして，年表などにまとめることとは，県内の伝統や文化，先人の働きについて，博物館や資料館などを見学したり，昔と現在の市の地図や写真などの資料で調べたりして，年表などにまとめることである。ここでは，博物館や資料館などを見学して必要な情報を集める技能，地図や写真などの資料を結び付けながら情報を読み取る技能，調べたことを時間の経過に沿って年表などに整理する技能などを身に付けるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの歴史的背景や現在に至る経過，保存や継承のための取組などに着目して，県内の文化財や年中行事の様子を捉え，人々の願いや努力を考え，表現することとは，社会的事象の見方・考え方を働かせ，県内の文化財や年中行事について，例えば，いつ頃，どのような理由で始まったか，どのような経過で現在に至っているか，人々は保存や継承のためにどのような取組をしているかなどの問いを設けて調べたり，それらを人々の願いや努力と関連付けて考えたりして，調べたことや考えたことを表現することである。","歴史的背景に着目するとは，文化財がつくられたり始められたりした時期や保存されてきた理由，年中行事のおこりや成り立ちなどについて調べることである。現在に至る経過に着目するとは，文化財や年中行事が生み出されてから現在に至るまでの経過について調べることである。保存や継承のための取組に着目するとは，文化財や年中行事を大切に保存したり受け継いだりしている人々の工夫や努力について調べることである。このようにして調べたことを手掛かりに，県内の文化財や年中行事の様子を捉えることができるようにする。","人々の願いや努力を考え，表現するとは，例えば，文化財や年中行事を保存したり受け継いだりしている人々の工夫や努力と地域の人々の願いを関連付け，文化財や年中行事を受け継ぎ保存していることの意味を考え，文章で記述したり，年表などにまとめたことを基に説明したりすることである。","イのイの当時の世の中の課題や人々の願いなどに着目して，地域の発展に尽くした先人の具体的事例を捉え，先人の働きを考え，表現することとは，社会的事象の見方・考え方を働かせ，地域の発展に尽くした先人の具体的事例について，例えば，当時の人々の生活や世の中にはどのような課題があったか，人々はどのような願いをもっていたかなどの問いを設けて調べたり，先人の働きと地域の発展や人々の生活の向上を関連付けて考えたりして，調べたことや考えたことを表現することである。","当時の世の中の課題に着目するとは，先人が活躍した当時の世の中の様子や先人の働きが必要とされた背景について調べることである。人々の願いに着目するとは，当時の人々の生活の向上や地域の発展への願いと先人の苦心や努力を関連付けて調べることである。このようにして，調べたことを手掛かりに，地域の発展に尽くした先人の具体的事例を捉えることができるようにする。","先人の働きを考え，表現するとは，例えば，先人の働きと地域の発展や人々の生活の向上を関連付けて，先人が当時の地域や人々の生活の向上に貢献したことを考え，文章で記述したり，年表などにまとめたことを基に話し合ったりすることである。","実際の指導に当たっては，文化財や年中行事については，それらを保存したり継承したりしている人々から直接話を聞く活動などが考えられる。また，先人の働きについては，先人が用いた道具や技術に見られる工夫，実際の取組の様子，当時の社会に与えた影響などを調べる活動などが考えられる。"],"t":["内容の取扱いの(3)のアは，内容の(4)のアのア及びイのアの指導において，「県内の主な文化財や年中行事」を取り上げる際の配慮事項について示したものである。","県内の主な文化財や年中行事については，例えば，県内を代表するような歴史を伝える建造物や遺跡，民俗芸能などの文化財，地域の人々が楽しみにしている祭りなどの年中行事などが考えられる。文化財については，文化財保護法でいう文化財はもとより，日本遺産や世界遺産といった地域の歴史的な特色やその魅力を知るための地域の遺産の中に見られる文化財なども考えられる。","県内の文化財や年中行事を調べる際には，地図や関係機関が作成した資料などを活用して調べ，県内の主な文化財や年中行事の名称や位置などが大まかに分かるようにすることが大切である。また，取り上げる事例については，見学・調査を通して，文化財や年中行事に込められた地域の人々の願いが具体的に理解できるよう配慮することが大切である。なお，ここで取り上げる文化財や年中行事については，内容の(5)において伝統的な文化を保護・活用してまちづくりなどを行っている地域の様子を学ぶ「県内の特色ある地域の様子」の学習との違いに配慮する必要がある。","内容の取扱いの(3)のイは，内容の(4)のアのイ及びイのイにおいて，取り上げる「地域の発展に尽くした先人」の具体的事例の範囲を示したものである。","ここでは，例えば，用水路の開削や堤防の改修，砂防ダムの建設，農地の開拓などを行って地域を興した人，藩校や私塾などを設けて地域の教育を発展させた人，新しい医療技術等を開発したり病院を設立したりして医学の進歩に貢献した人，新聞社を興すなど文化を広めた人，地域の農業・漁業・工業などの産業の発展に尽くした人など，「開発，教育，医療，文化，産業など」の面で地域の発展や技術の開発に尽くした先人の具体的事例の中から一つを選択して取り上げることが考えられる。","内容の取扱いの(3)のウは，内容の(4)のイのアについて指導する際の配慮事項について示したものである。","ここでは，学習したことを基に，地域の伝統や文化を保護したり継承したりするために自分たちが協力できることを考えたり選択・判断したりして，地域に対する誇りや持続可能な社会を担おうとする態度を養うよう配慮することが大切である。その際，伝統や文化を創造する観点から，地域社会の発展への願いを基に新しく生まれた祭りなどに触れることも考えられる。"]}},"shakai-4-X-5":{"page":66,"name":"県内の特色ある地域の様子","expl":{"intro":["この内容は，主として「地理的環境と人々の生活」に区分されるものであり，県内の特色ある地域の様子についての学習で身に付ける事項を示している。県内の特色ある地域の様子とは，地理的環境などの特色を生かしてまちづくりや産業の発展に努めている県内の特色ある地域の様子を指している。","県内の特色ある地域の様子に関する内容については，アのア及びイとイのアを関連付けて指導する。例えば，特色ある地域の位置や自然環境，人々の活動や産業の歴史的背景，人々の協力関係などに着目して，地図帳や各種の資料で調べ，白地図などにまとめることを通して，県内の特色ある地域では，人々が協力し，特色あるまちづくりや観光などの産業の発展に努めていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのアは，知識に関わる事項である。","県内の特色ある地域では，人々が協力し，特色あるまちづくりや観光などの産業の発展に努めていることを理解することとは，県内には，地場産業が盛んな地域や国際交流に取り組んでいる地域，自然環境や伝統的な文化を保護・活用している地域など特色ある地域があること，それらの地域では，特色あるまちづくりを進めたり，県や市，地域住民など様々な組織や機関，人々の協力により，観光などの産業を発展させたりしていることなどを基に，県内の特色ある地域の様子について理解することである。","アのイは，技能に関わる事項である。","地図帳や各種の資料で調べ，白地図などにまとめることとは，県内の特色ある地域の様子について，地図帳やコンピュータなどを使って調べたり，県庁や市役所などが作成した資料で特色ある地域の位置や自然環境，人々の活動や産業などを調べたりして，県の白地図などにまとめることである。ここでは，地図帳を用いたりコンピュータなどを使ったりして必要な情報を集める技能，地図や写真などの資料を見比べながら，地域ごとの情報を読み取る技能，調べたことを白地図などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","特色ある地域の位置や自然環境，人々の活動や産業の歴史的背景，人々の協力関係などに着目して，地域の様子を捉え，それらの特色を考え，表現することとは，社会的事象の見方・考え方を働かせ，特色ある地域の様子について，例えば，どこにどのような特色ある地域があるか，その地域はどのような自然環境のところか，その活動や産業はどのような経緯で始まったか，人々はどのように協力しているかなどの問いを設けて調べたり，その地域の特色を考えたりして，調べたことや考えたことを表現することである。","特色ある地域の位置に着目するとは，特色ある地域の県内における位置や周囲の地域との位置関係について調べることである。自然環境に着目するとは，特色ある地域の地形や気候について調べることである。人々の活動や産業の歴史的背景に着目するとは，特色ある地域の人々の活動や産業のおこりや成り立ちについて調べることである。人々の協力関係に着目するとは，県や市，地域住民，産業に携わる人など，様々な立場の人々の協力関係について調べることである。このようにして調べたことを手掛かりに，県内の特色ある地域の様子を捉えることができるようにする。","それら（県内の地域）の特色を考え，表現するとは，例えば，特色ある地域の人々の活動や産業とそれらの地域の発展を関連付けたり，自分たちの住む地域と比較したりして，その地域の特色を考え，文章で記述したり，白地図や年表などにまとめたことを基に説明したりすることである。","実際の指導に当たっては，まず，県全体における特色ある地域の位置や自分たちの市との位置関係などを捉え，その上で，特色ある地域の様子について調べ，それらを県の白地図に整理することなどが考えられる。"],"t":["内容の取扱いの(4)のアは，内容の(5)の指導において，「県内の特色ある地域」を取り上げる際の対象の範囲と地域を選択する際の配慮事項を示したものである。","ここでは，選択する県内の地域として，「伝統的な技術を生かした地場産業が盛んな地域，国際交流に取り組んでいる地域，及び地域の資源を保護・活用している地域」の中から三つ程度を特色ある地域として取り上げる。その際，地域の資源を保護・活用している地域としては，自然環境あるいは伝統的な文化を保護・活用している地域が考えられ，そのいずれかを選択して取り上げる。","「伝統的な技術を生かした地場産業が盛んな地域」とは，県内で古くから伝わっている技術や技法を受け継いで行われている伝統的な工業や，古くから地域の特性を生かして独自の製品をつくっている産業など，地域に密着した地場産業の盛んな地域を指している。伝統的な技術を生かした工業には，例えば，陶磁器，塗り物，織物，和紙，人形，筆など，現在にも優れた技術が継承されているものが考えられ，それらの盛んな地域を取り上げることになる。ここでは，その地域の位置のほか，自然環境や産業の歴史的背景に着目して調べるようにする。","「国際交流に取り組んでいる地域」とは，姉妹都市提携などを結び外国の都市と様々な交流を行っている地域や，国際都市を目指して市内で外国との交流活動を盛んに行っている地域などを指している。ここでは，その地域の位置のほか，活動の歴史的背景や人々の協力関係に着目して調べるようにする。","「地域の資源を保護・活用している地域」とは，人々に様々な恵みをもたらしている自然の風景や歴史的景観，文化財や年中行事，その土地の特性を生かした産物などを地域の資源として保護・活用している地域を指している。例えば，渓谷や森林，高原や湿原，河川や海辺などの豊かな自然を守りながら，あるいは，歴史ある建造物やまち並み，祭りなどの地域の伝統的な文化を受け継ぎながら，それを保護・活用している地域が考えられる。また，世界遺産に登録されている地域や文化庁により日本遺産に認定されている地域などを取り上げることも考えられる。自然環境を保護・活用している地域を取り上げる際には，その地域の位置のほか，自然環境や産業の歴史的背景，人々の協力関係に着目して調べるようにする。また，伝統的な文化を保護・活用している地域を取り上げる際には，その地域の位置のほか，活動の歴史的背景，人々の協力関係に着目して調べるようにする。なお，伝統的な文化を保護・活用している地域を取り上げる際には，内容(4)の文化財や行事を保護・継承している人々の努力を取り上げる「県内の伝統や文化」の学習との違いに配慮する必要がある。","また，特色ある地域を選定する際には，広く県内から地域を選択し，自分たちの住んでいる市と比較しながら，それらの地域の特色を捉えることができるよう配慮する必要がある。","内容の取扱いの(4)のイは，国際交流に取り組んでいる地域において，外国を取り上げる際，我が国や外国には国旗があることを理解し，それを尊重する態度を育てようとすることを示したものである。","ここでは，我が国や外国には国旗があること，いずれの国でも国旗を大切にしていること，及び，我が国の国旗を尊重するとともに，外国の国旗を尊重することが大切であることなどを指導することが大切である。","その際，取り上げた外国の名称と位置，国旗を地図帳などで確認することなどを通して指導するように配慮する必要がある。","第４学年においては，内容の(1)から(5)の学習を通して，社会的事象について，学習問題を主体的に解決しようとする態度や，よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとともに，思考や理解を通して，地域社会に対する誇りと愛情，地域社会の一員としての自覚を養うようにすることが大切である。"]}},"shakai-5-X-1":{"page":73,"name":"我が国の国土の様子と国民生活","expl":{"intro":["この内容は，主として「地理的環境と人々の生活」に区分されるものであり，我が国の国土の様子と国民生活についての学習で身に付ける事項を示している。我が国の国土の様子と国民生活とは，世界における我が国の地理的位置や国土の構成，我が国の国土の自然環境やこれに適応している人々の生活を指している。","ここでは，我が国の国土の概要に関する内容と国土の自然環境に関する内容から構成されている。我が国の国土の概要に関する内容については，アのア及びウとイのアを関連付けて指導する。例えば，世界の大陸と主な海洋，主な国の位置，海洋に囲まれ多数の島からなる国土の構成などに着目して，地図帳や地球儀，各種の資料で調べ，まとめ，我が国の国土の様子を捉え，その特色を考え，表現することを通して，世界の中における我が国の国土の位置，国土の構成，領土の範囲などを大まかに理解できるようにすることである。その際，領土とは，我が国の法律が及ぶ地理的な範囲であることなど，小学校の段階に応じた指導を行うようにする。","また，我が国の国土の自然環境に関する内容については，アのイ及びウとイのイを関連付けて指導する。例えば，地形や気候などに着目して，地図帳や地球儀，各種の資料で調べ，まとめ，国土の自然などの様子や自然条件から見て特色ある地域の人々の生活を捉え，国土の自然環境の特色やそれらと国民生活との関連を考え，表現することを通して，我が国の国土の地形や気候の概要を理解するとともに，人々は自然環境に適応して生活していることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイは，知識に関わる事項である。","アのアの世界における我が国の国土の位置，国土の構成，領土の範囲などを大まかに理解することとは，世界の大陸と主な海洋の位置や広がりと主な国の位置，それらと我が国との位置関係，我が国の国土を構成する主な島の名称と位置，我が国の北端，南端，東端，西端の島などを含めた14,000以上の島を含む我が国の領土の範囲などを基に，我が国の国土の概要や特色について理解することである。","アのイの我が国の国土の地形や気候の概要を理解するとは，我が国の地形は全体としてみると山がちで平野が少ないこと，我が国の気候には四季の変化が見られること，国土の南と北，太平洋側と日本海側では気候が異なることなどを基に，我が国の国土の自然環境について理解することである。また，人々は自然環境に適応して生活していることを理解することとは，我が国には地形や気候などの自然条件から見て特色ある地域があること，人々は自然条件の中で工夫しながら生活していること，人々は自然条件を生かして野菜や果物，花卉の栽培，酪農，観光などの産業を営んでいることなどを基に，我が国の国土の様子と国民生活について理解することである。","アのウは，技能に関わる事項である。","地図帳や地球儀，各種の資料で調べ，まとめることとは，我が国の国土の様子と国民生活について，地図帳や地球儀，衛星写真などの資料で国土の位置や構成，領土の範囲などを調べたり，立体模型，統計，写真などの資料で地形や気候の概要，自然条件から見て特色ある地域の様子を調べたりして，まとめることである。ここでは，地図帳や地球儀などを用いて，方位や位置関係，範囲などを読み取る技能，調べたことを適切にまとめる技能などを身に付けるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの世界の大陸と主な海洋，主な国の位置，海洋に囲まれ多数の島からなる国土の構成などに着目して，我が国の国土の様子を捉え，その特色を考え，表現することとは，社会的事象の見方・考え方を働かせ，我が国の国土の様子について，例えば，我が国は世界のどこに位置しているか，国土はどのような島々から成り立っているか，我が国の領土はどの範囲かなどの問いを設けて調べたり，調べたことを総合して我が国の国土の特色を考えたりして，調べたことや考えたことを表現することである。","世界の大陸と主な海洋に着目するとは，ユーラシア大陸，北アメリカ大陸，南アメリカ大陸，アフリカ大陸，オーストラリア大陸，南極大陸の六大陸と，太平洋，大西洋，インド洋の三海洋の名称と位置や広がりについて調べることである。主な国の位置に着目するとは，各大陸における主な国の位置を調べることである。海洋に囲まれ多数の島からなる国土の構成に着目するとは，北海道，本州，四国，九州，沖縄島，北方領土などの主な島やその周囲の海洋，14,000を超える大小多数の島々から成る我が国の国土の構成や弧状に連なっている国土の様子について調べることである。このようにして調べたことを手掛かりに，我が国の国土の様子を捉えることができるようにする。その際，世界の主な大陸と海洋，主な国を我が国の国土との位置関係に着目して捉えることができるようにすることが大切である。","その（我が国の国土の）特色を考え，表現するとは，例えば，我が国の国土の位置や形状，面積などの情報を総合して，我が国は北半球にあり，ユーラシア大陸の東方に位置していることや，大韓民国，中華人民共和国，ロシア連邦と隣り合っていること，太平洋や日本海，オホーツク海などに囲まれ，大小の島々が弧状に連なって構成されていることなど我が国の国土の特色を地図帳や地球儀などを用いて説明することである。","イのイの地形や気候などに着目して，国土の自然などの様子や自然条件から見て特色ある地域の人々の生活を捉え，国土の自然環境の特色やそれらと国民生活との関連を考え，表現することとは，社会的事象の見方・考え方を働かせ，国土の自然などの様子や自然条件から見て特色ある地域の人々の生活について，例えば，我が国の地形や気候にはどのような特色があるか，人々は地形条件や気候条件をどのように生かしているかなどの問いを設けて調べたり，国土の位置と地形や気候を関連付けて国土の特色を考えたり，国土の自然環境と国民生活の関連を考えたりして，調べたことや考えたことを表現することである。","地形や気候に着目するとは，国土の環境について，主な山地や山脈，平野，川や湖，主な島や半島などの地形の概要や特色，地域や時期によって気温や降水量が変わるなど気候の違いや変化について調べることである。自然条件から見て特色ある地域については，地形や気候に合わせた生活や産業の様子について調べることである。このようにして調べたことを手掛かりに，国土の自然などの様子や自然条件から見て特色ある地域の人々の生活を捉えることができるようにする。","国土の自然環境の特色やそれらと国民生活との関連を考え，表現するとは，例えば，我が国の位置や地形，気候の側面から，我が国の国土の自然環境の特色を考えたり，特色ある地域の自然条件と人々の生活や産業を関連付けて考えたりしたことを基に，文章で記述したり，説明したりすることである。","実際の指導に当たっては，地図帳や地球儀などを活用して，位置や方位を確かめ言い表したり，調べたことを白地図などにまとめたりする活動が考えられる。"],"t":["内容の取扱いの(1)のアは，内容の(1)のアの「領土の範囲」について指導する際の配慮事項を示したものである。","領土の範囲について指導する際には，竹島や北方領土（歯舞群島，色丹島，国後島，択捉島），尖閣諸島は一度も他の国の領土になったことがない領土という意味で我が国の固有の領土であることなどに触れて説明することが大切である。","また，竹島や北方領土の問題については，我が国の固有の領土であるが現在大韓民国やロシア連邦によって不法に占拠されていることや，我が国は竹島について大韓民国に対し繰り返し抗議を行っていること，北方領土についてロシア連邦にその返還を求めていることなどについて触れるようにする。","さらに，尖閣諸島については，我が国が現に有効に支配する固有の領土であり，領土問題は存在しないことに触れるようにする。","その際，これら我が国の立場は，歴史的にも国際法上も正当であることを踏まえて指導するようにする。","内容の取扱いの(1)のイは，内容の(1)のアのウの「地図帳」や「地球儀」を扱う際の配慮事項を示したものである。","地球儀の特徴や使い方については，具体的な活動を通して丁寧に指導する必要がある。例えば，地球儀を用いて２点間の方位や距離を確かめたり，緯度や経度等を使って位置を説明したりする活動が考えられる。","内容の取扱いの(1)のウは，内容の(1)のイのアの「主な国」についての指導において取り上げる国の範囲と，それを取り扱う際の配慮事項を示したものである。","主な国の取り上げ方としては，近隣諸国を含めてユーラシア大陸やその周りに位置する国々の中から10か国程度，北アメリカ大陸，南アメリカ大陸，アフリカ大陸，オーストラリア大陸やその周りに位置する国々の中からそれぞれ２か国程度選択することが考えられる。その際，それらの国の名称や我が国との位置関係を世界地図や地球儀で確認させ，産業に関する学習などにおける基礎的な情報となるよう指導することが大切である。","指導に当たっては，地図帳や地球儀などを用いて，取り上げた国の正式な名称と位置を確認するようにする。また，我が国や諸外国には国旗があることやいずれの国でも国旗を大切にしていることが分かり，我が国の国旗を尊重するとともに，外国の国旗を尊重する態度を養うようにすることが大切である。","内容の取扱いの(1)のエは，内容の(1)のイのイの「自然条件から見て特色ある地域」についての指導における配慮事項を示したものである。","事例地の選定に当たっては，自分たちの住んでいる地域の自然条件と異なる地域を選択するよう配慮する必要がある。例えば，山地や低地など特色ある地形条件の地域と，温暖多雨や寒冷多雪など特色ある気候条件の地域の中からそれぞれ一つ取り上げ，自然環境に適応しながら工夫して生活したり，自然条件を生かしながら産業を営んだりしていることを具体的に学習できるようにすることが考えられる。例えば，山地としては，山に囲まれた盆地や平らな地形の山地である高原などが，また低地としては，河口に近い地域や海沿いの平地が，それぞれ考えられる。温暖多雨の地域としては，日本列島の南に位置する地域や台風などが多く上陸する地域が，寒冷多雪の地域としては，日本列島の北に位置する地域や降雪量の多い地域などが，それぞれ考えられる。"]}},"shakai-5-X-2":{"page":77,"name":"我が国の農業や水産業（食料生産）","expl":{"intro":["この内容は，主として「現代社会の仕組みや働きと人々の生活」に区分されるものであり，我が国の農業や水産業における食料生産についての学習で身に付ける事項を示している。我が国の農業や水産業における食料生産とは，米，野菜，果物などの農産物や畜産物を生産する農業や，魚介類を採ったり養殖したりする水産業を指している。","ここでは，我が国の食料生産の概要に関する内容と食料生産に関わる人々の工夫や努力に関する内容から構成されている。我が国の食料生産の概要に関する内容については，アのア及びウとイのアを関連付けて指導する。例えば，生産物の種類や分布，生産量の変化，輸入など外国との関わりなどに着目して，地図帳や地球儀，各種の資料で調べ，まとめ，食料生産の概要を捉え，食料生産が国民生活に果たす役割を考え，表現することを通して，我が国の食料生産は，自然条件を生かして営まれていることや，国民の食料を確保する重要な役割を果たしていることを理解できるようにすることである。","また，食料生産に関わる人々の工夫や努力に関する内容については，アのイ及びウとイのイを関連付けて指導する。例えば，生産の工程，人々の協力関係，技術の向上，輸送，価格や費用などに着目して，地図帳や地球儀，各種の資料で調べ，まとめ，食料生産に関わる人々の工夫や努力を捉え，その働きを考え，表現することを通して，食料生産に関わる人々は，生産性や品質を高めるよう努力したり輸送方法や販売方法を工夫したりして，良質な食料を消費地に届けるなど，食料生産を支えていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイは，知識に関わる事項である。","アのアの我が国の食料生産は，自然条件を生かして営まれていることを理解することとは，我が国では様々な食料を生産していること，それぞれの土地や気候を生かして食料の生産地が広がっていることなどを基に，我が国の食料生産の概要について理解することである。また，（我が国の食料生産は，）国民の食料を確保する重要な役割を果たしていることを理解することとは，食料生産は国民の食生活を支えていること，食料の生産量は国民生活と関連して変化していること，食料の中には外国から輸入しているものがあることなどを基に，我が国の食料生産の役割について理解することである。","アのイの食料生産に関わる人々は，生産性や品質を高めるよう努力したり輸送方法や販売方法を工夫したりして，良質な食料を消費地に届けるなど，食料生産を支えていることを理解することとは，農業や水産業の盛んな地域の人々が，新鮮で良質な物を生産し出荷するために生産性や品質を高めるなど様々な工夫や努力を行っていること，生産し輸送，販売する工程で費用が発生すること，輸送方法や販売方法を工夫することにより収益を上げていることなどを基に，食料生産に関わる人々の工夫や努力について理解することである。","アのウは，技能に関わる事項である。","地図帳や地球儀，各種の資料で調べ，まとめることとは，我が国の農業や水産業における食料生産について，地図帳や地球儀を用いて，国内の主な生産地や輸入相手国の位置，主な漁港や漁場の位置などを調べ，白地図などにまとめることや，統計，写真などの資料やコンピュータなどを使って，食料生産に関わる人々の工夫や努力を調べて，図表などにまとめることである。ここでは，統計などの資料やコンピュータなどを適切に使って情報を集める技能，地図帳や地球儀を用いて，位置や経路，広がりや分布などを読み取る技能，仕事の工程や協力関係を図表などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの生産物の種類や分布，生産量の変化，輸入など外国との関わりなどに着目して，食料生産の概要を捉え，食料生産が国民生活に果たす役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，食料生産の概要について，例えば，どこでどのようなものが生産されているか，生産量はどのように変化しているか，外国とどのような関わりがあるかなどの問いを設けて調べたり，食料生産と国民生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","生産物の種類や分布に着目するとは，我が国における主な農産物や畜産物，水産物の種類や生産量，主な生産地の分布について調べることである。生産量の変化に着目するとは，主な農産物の生産量や主な水産物の漁獲量の過去から現在に至る変化について調べることである。輸入など外国との関わりに着目するとは，我が国の食料の輸出入品目や相手国，食料自給率などについて調べることである。このようにして調べたことを手掛かりに食料生産の概要を捉えることができるようにする。","食料生産が国民生活に果たす役割を考え，表現するとは，例えば，我が国の農産物や水産物の種類や生産量，農業や水産業が盛んな地域の分布などの情報を総合したり，農業や水産業における食料生産と国民生活を関連付けたりして，我が国の食料生産が国民生活に果たす役割を考え，文章で記述したり，根拠や理由を明確にして議論したりすることである。","イのイの生産の工程，人々の協力関係，技術の向上，輸送，価格や費用などに着目して，食料生産に関わる人々の工夫や努力を捉え，その働きを考え，表現することとは，社会的事象の見方・考え方を働かせ，食料生産に関わる人々の工夫や努力について，例えば，食料はどのように生産されているか，人々はどのように協力して生産しているか，食料生産の技術はどのように向上してきたか，食料はどのように運ばれるか，食料の価格はどのように決まるかなどの問いを設けて調べたり，食料生産に関わる人々の工夫や努力とその土地の自然条件や需要を関連付けて考えたりして，調べたことや考えたことを表現することである。","生産の工程に着目するとは，生産から出荷までの仕事の工程について調べることである。人々の協力関係に着目するとは，共同経営や協働作業，農業試験場や農業協同組合，水産試験場や漁業協同組合などの働きについて調べることである。技術の向上に着目するとは，機械化による効率化や省力化，収穫量の増加，品種改良や情報の活用などについて調べることである。輸送に着目するとは，トラックや鉄道などによる陸上輸送や，貨物船やカーフェリーなどによる海上輸送，飛行機による航空輸送を使って鮮度を保ちながら生産物を国内外の消費地へ届ける工夫について調べることである。その際，主な高速道路網や鉄道網，主な海路や航路などを調べることが大切である。価格や費用に着目するとは，生産や輸送，販売の過程で掛かる費用や販売される際の価格について調べることである。ここでは，野菜や魚など生鮮食料品の価格は，主として市場で決められ，時期や場所によって変わること，市場の情報を基に出荷する場所，量，種類，時期を判断していること，産地のブランド化やいわゆる「６次産業化」など新しい取組をしていることなどを調べることも考えられる。このようにして調べたことを手掛かりにして，食料生産に関わる人々の工夫や努力を捉えることができるようにする。","その（食料生産に関わる人々の）働きを考え，表現するとは，例えば，食料生産の仕事の工夫や努力とその土地の自然条件や需要を関連付けて，食料生産に関わる人々の働きを考え，文章で記述したり，白地図や図表などにまとめたことを基に説明したりすることである。","実際の指導に当たっては，地域の実態に応じて見学を取り入れて情報を収集したり，食料生産の盛んな地域で生産に従事している人々に電話や手紙などで調査したり，さらに，インターネットなどで生産地が発信している情報を活用したりする活動などが考えられる。"],"t":["内容の取扱いの(2)のアは，内容の(2)のアのイ及びイのイの指導において，取り上げる対象の範囲を示したものである。","ここでは，食料生産に関わる人々について，農業や水産業における食料生産の盛んな地域の具体的事例を通して調べるようにする。その際，国民の主食を確保する上で重要な役割を果たしている「稲作」については必ず取り上げる。また，国民の食生活と関わりの深い「野菜，果物，畜産物，水産物など」については，それらの中から一つを選択して取り上げるようにする。事例の選択に当たっては，児童の興味・関心や学習経験の広がりなどを考慮し，第３学年の「地域に見られる生産の仕事」において取り上げた事例に配慮する必要がある。地域の農産物を生産する仕事として，例えば，野菜の生産を取り上げて学習してきた場合には，果物，畜産物，水産物などの生産の中から事例を選択することが考えられる。","なお，第３学年では，地域の農産物を生産する仕事を通して地域社会に対する理解を深めることに，第５学年では我が国の農業や水産業について理解を深めることに，それぞれのねらいがあることに留意することが大切である。","内容の取扱いの(2)のイは，内容の(2)のイのア及びイの指導における配慮事項を示したものである。","ここでは，学習したことを基に，生産性や品質を高める工夫を消費者や生産者の立場に立って多角的に考え，これからの農業や水産業における食料生産の発展に向けて自分の考えをまとめることができるよう指導することが大切である。その際，生産者の立場からは，農産物の生産では，農業法人などを設立して取り組んでいること，温室等の設備により出荷時期を工夫していることや，低価格という観点だけでなく手間をかけて高品質なものや付加価値のあるものを生産し海外に輸出していること，畜産物の生産では，与える飼料により品質を高めていること，水産物の生産では，魚群探知や養殖などに最新の技術を使っていることや持続可能な漁業を目指し水産資源を保護していること，さらに，生産・加工・販売を関連付けた，いわゆる「６次産業化」の動きなど新しい取組を取り上げることが考えられる。","また，消費者の立場からは，安全性の確保や環境への負荷の軽減などの意識が高まっていること，低価格のものだけでなく，高品質のものや希少性のあるものを求める傾向も見られることなどを取り上げることが考えられる。","このようにして，今後の農業や水産業の発展について考えようとする態度を養うようにする。"]}},"shakai-5-X-3":{"page":82,"name":"我が国の工業生産","expl":{"intro":["この内容は，主として「現代社会の仕組みや働きと人々の生活」に区分されるものであり，我が国の工業生産についての学習で身に付ける事項を示している。我が国の工業生産とは，我が国における工場での生産活動であり，原材料を加工しその形や性質を変えたり，部品を組み立てたりして生活や産業に役立つ製品を作り出している工業を指している。","ここでは，我が国の工業生産の概要に関する内容と工業生産に関わる人々の工夫や努力に関する内容，貿易や運輸に関する内容から構成されている。我が国の工業生産の概要に関する内容については，アのア及びエとイのアを関連付けて指導する。例えば，工業の種類，工業の盛んな地域の分布，工業製品の改良などに着目して，地図帳や地球儀，各種の資料で調べ，まとめ，工業生産の概要を捉え，工業生産が国民生活に果たす役割を考え，表現することを通して，我が国では様々な工業生産が行われていることや，国土には工業の盛んな地域が広がっていること及び工業製品は国民生活の向上に重要な役割を果たしていることを理解できるようにすることである。","また，工業生産に関わる人々の工夫や努力に関する内容については，アのイ及びエとイのイを関連付けて指導する。例えば，製造の工程，工場相互の協力関係，優れた技術などに着目して，地図帳や地球儀，各種の資料で調べ，まとめ，工業生産に関わる人々の工夫や努力を捉え，その働きを考え，表現することを通して，工業生産に関わる人々は，消費者の需要や社会の変化に対応し，優れた製品を生産するよう様々な工夫や努力をして，工業生産を支えていることを理解できるようにすることである。","さらに，貿易や運輸に関する内容については，アのウ及びエとイのウを関連付けて指導する。例えば，交通網の広がり，外国との関わりなどに着目して，地図帳や地球儀，各種の資料で調べ，まとめ，貿易や運輸の様子を捉え，それらの役割を考え，表現することを通して，貿易や運輸は，原材料の確保や製品の販売などにおいて，工業生産を支える重要な役割を果たしていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイ並びにウは，知識に関わる事項である。","アのアの我が国では様々な工業生産が行われていることを理解することとは，自分たちの身の回りには様々な工業製品があること，我が国では様々な種類の工業生産が行われていることなどを基に，我が国の工業生産の概要について理解することである。また，国土には工業の盛んな地域が広がっていることを理解することとは，我が国には海岸沿いに大きな工業地帯が広がっていること，工業が盛んな地域は全国各地に分布していることなどを基に，我が国の工業生産の概要について理解することである。工業製品は国民生活の向上に重要な役割を果たしていることを理解することとは，工業製品の改良と国民生活の向上とは深い関わりがあること，工業製品は国民生活はもとより，農業や水産業，工業などの中で使われていることなどを基に，我が国の工業生産の役割について理解することである。","アのイの工業生産に関わる人々は，消費者の需要や社会の変化に対応し，優れた製品を生産するよう様々な工夫や努力をして，工業生産を支えていることを理解することとは，工場で働く人々は優れた製品を生産するために様々な工夫や協力をしていること，工業生産には様々な工場が関連していること，我が国の工業生産は優れた技術を生かして消費者の需要や社会の発展に応える研究開発などの努力を行っていることなどを基に，工業生産に関わる人々の工夫や努力について理解することである。","アのウの貿易や運輸は，原材料の確保や製品の販売などにおいて，工業生産を支える重要な役割を果たしていることを理解することとは，原材料や工業製品の輸出入の特色，原材料や工業製品の輸出入や工業製品の出荷には，海上輸送，航空輸送，陸上輸送など日本国内や世界の交通網が使われていることなどを基に，貿易や運輸の役割について理解することである。","アのエは，技能に関わる事項である。","地図帳や地球儀，各種の資料で調べ，まとめることとは，我が国の工業生産について，地図帳や地球儀を用いて，工業の盛んな地域の広がりや貿易相手国の位置を調べ，白地図などにまとめることや，統計，写真などの資料やコンピュータなどを使って，工業生産に関わる人々の工夫や努力を調べて，図表などにまとめることである。ここでは，統計などの資料やコンピュータなどを適切に使って情報を集める技能，地図帳や地球儀を用いて，位置や経路，分布や地域間のつながりなどを読み取る技能，仕事の工程や協力関係を図表などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの工業の種類，工業の盛んな地域の分布，工業製品の改良などに着目して，各種の工業生産の概要を捉え，工業生産が国民生活に果たす役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，工業生産の概要について，例えば，日本はどのような工業が盛んか，工業の盛んな地域はどのように広がっているか，工業製品はどのように改良されてきたかなどの問いを設けて調べたり，工業製品と国民生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","工業の種類に着目するとは，我が国の工業の種類や種類別生産額，工場の規模別の数や割合などについて調べることである。工業の盛んな地域の分布に着目するとは，我が国における工業地帯や主な工業地域の分布などについて調べることである。工業製品の改良に着目するとは，身の回りの工業製品の改良の経過について調べることである。その際，機械工業では，自動車，テレビ，炊飯器，掃除機，電話機など身近な生活で使う工業製品を取り上げることが考えられる。このようにして調べたことを手掛かりに，我が国の工業生産の概要を捉えることができるようにする。","工業生産が国民生活に果たす役割を考え，表現することとは，例えば，我が国の工業の種類や生産額，工業生産が盛んな地域の分布などの情報を総合したり，工業製品の改良と国民生活の向上を関連付けたりして，我が国の工業生産が国民生活に果たす役割を考え，文章で記述したり，根拠や理由を明確にして議論したりすることである。","イのイの製造の工程，工場相互の協力関係，優れた技術などに着目して，工業生産に関わる人々の工夫や努力を捉え，それらの人々の働きを考え，表現することとは，社会的事象の見方・考え方を働かせ，工業生産に関わる人々の工夫や努力について，例えば，工業製品はどのようにしてつくられているか，工場はどのように関連し合っているか，どのような技術を生かして生産しているかなどの問いを設けて調べたり，工業生産と国民生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","製造の工程に着目するとは，工業生産における原材料の確保，生産から出荷までの仕事の工程について調べることである。工場相互の協力関係に着目するとは，関連工場の計画的，効率的な部品生産の工夫や努力，大規模な工場と関連工場との結び付きについて調べることである。優れた技術に着目するとは，産業用ロボットなどを活用したオートメーションなど大規模工場の生産システム，消費者の需要や社会の要請に応える生産の仕方，中小工場での技術を生かした生産の様子，新しい分野に挑戦する研究開発などについて調べることである。このようにして調べたことを手掛かりに工業生産に関わる人々の工夫や努力を捉えることができるようにする。","その（工業生産に関わる人々の）働きを考え，表現するとは，例えば，工業生産の仕事の工夫や努力と消費者の需要や社会の変化を関連付けて，工業生産に関わる人々の働きを考え，文章で記述したり，図表などにまとめたことを基に説明したりすることである。","イのウの交通網の広がり，外国との関わりなどに着目して，貿易や運輸の様子を捉え，それらの役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，貿易や運輸の様子について，例えば，原材料や工業製品はどのような輸送手段で運ばれるか，我が国の工業は外国とどのような関わりがあるかなどの問いを設けて調べたり，貿易や運輸と工業生産を関連付けて考えたりして，調べたことや考えたことを表現することである。","交通網の広がりに着目するとは，原材料の確保や製品の出荷のための高速道路や鉄道，航路などの交通網，陸運や海運などの輸送手段と，輸送の際の工夫や努力について調べることである。その際，運輸業や倉庫など物流に関わる人々の働きや港湾や空港といった施設などに触れるようにすることも考えられる。","外国との関わりに着目するとは，輸出入を通した我が国と諸外国との関わりについて調べることである。このようにして調べたことを手掛かりに貿易や運輸の様子を捉えることができるようにする。","それら（貿易や運輸）の役割を考え，表現するとは，例えば，工業生産と貿易や運輸の働きを関連付けて，貿易や運輸が工業生産に果たす役割を考え，文章で記述したり，白地図などにまとめたことを基に説明したりすることである。","実際の指導に当たっては，地域の実態に応じて，自動車や造船，製鉄や石油，食料品などの工場で見学できる工場がある場合には，見学を取り入れて情報を収集したり，工業生産の盛んな地域で生産に従事している人々に手紙などで調査したり，さらに，インターネットなどで工業生産を行っている企業などが発信している情報を活用したりする活動などが考えられる。"],"t":["内容の取扱いの(3)のアは，内容の(3)のアのイ及びイのイの工業生産に関わる人々の工夫や努力について指導する際の配慮事項と取り上げる具体的事例の範囲や選択の仕方を示したものである。","具体的事例については，「金属工業，機械工業，化学工業，食料品工業など」の中から一つを選択して取り上げるようにする。その際，児童の興味・関心や学習経験の広がりを考慮し，第３学年において取り上げた事例に配慮する必要がある。例えば，第３学年の内容(2)の「地域に見られる生産の仕事」において食料品の工場を取り上げて学習してきた場合には，金属工業，機械工業，化学工業など他の工業の中から事例を選択することが考えられる。","なお，第３学年では，地域の工場の仕事を通して地域社会に対する理解を深めることに，第５学年では，我が国の工業生産について理解を深めることに，それぞれねらいがあることに留意することが大切である。","内容の取扱いの(3)のイは，内容の(3)のイのア及びイの指導において，指導する際の配慮事項を示したものである。","ここでは，学習したことを基に，消費者や生産者の立場，人々の安全，環境，価格，利便性，バリアフリーなどに対する願いが工業生産により実現されることや，優れた技術やその向上が我が国の工業をより発展させること，工業生産を通した我が国と外国との関わり方など，我が国の工業の発展について自分の考えをまとめることが大切である。その際，新しい技術やそれを生かした工業製品を研究開発し，それらを輸出したりしていることや，高齢化社会への対応や環境への負荷を少なくするために工業製品の開発に努力していることなどを取り上げ，今後の工業の発展について考えようとする態度を養うことなども考えられる。"]}},"shakai-5-X-4":{"page":87,"name":"我が国の産業と情報との関わり","expl":{"intro":["この内容は，主として「現代社会の仕組みや働きと人々の生活」に区分されるものであり，我が国の産業と情報との関わりについての学習で身に付ける事項を示している。我が国の産業と情報との関わりとは，放送，新聞などの産業が多種多様な情報を収集・選択・加工して提供していることや，販売，運輸，観光，医療，福祉などに関わる産業が，販売情報や交通情報等の大量の情報やインターネットなどで情報を瞬時に伝える情報通信技術などを活用していることを指している。","ここでは，放送，新聞などの産業に関する内容と情報や情報通信技術を活用する産業に関する内容から構成されている。放送や新聞などの産業に関する内容については，アのア及びウとイのアを関連付けて指導する。例えば，情報を集め発信するまでの工夫や努力などに着目して，聞き取り調査をしたり映像や新聞などの各種資料で調べたりして，まとめ，放送，新聞などの産業の様子を捉え，それらの産業が国民生活に果たす役割を考え，表現することを通して，放送，新聞などの産業は，国民生活に大きな影響を及ぼしていることを理解できるようにすることである。","また，情報や情報通信技術を活用する産業に関する内容については，アのイ及びウとイのイを関連付けて指導する。例えば，情報の種類，情報の活用の仕方などに着目して，聞き取り調査をしたり映像や新聞などの各種資料で調べたりして，まとめ，産業における情報活用の現状を捉え，情報を生かして発展する産業が国民生活に果たす役割を考え，表現することを通して，大量の情報や情報通信技術の活用は，様々な産業を発展させ，国民生活を向上させていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイは，知識に関わる事項である。","アのアの放送，新聞などの産業は，国民生活に大きな影響を及ぼしていることを理解することとは，放送，新聞などの産業は，国民に正確な情報を分かりやすく速く伝えるために多種多様な情報を収集し，選択・加工していること，社会の出来事をより多くの国民に伝えるためにインターネットなど様々な情報媒体を活用していること，国民は放送や新聞，インターネットなどの様々な情報媒体から必要な情報を収集していることなどを基に，放送，新聞などの産業の役割について理解することである。","アのイの大量の情報や情報通信技術の活用は，様々な産業を発展させ，国民生活を向上させていることを理解することとは，多様で大量の情報を情報通信技術で瞬時に収集・発信し，それらを活用することで産業が変化し発展していること，国民がコンピュータや携帯電話などの情報通信機器を利用することにより，いつでも，どこでも様々なサービスを享受でき，生活が向上していることなどを基に，情報や情報通信技術を活用する産業の役割について理解することである。その際，高度に情報化した社会においては，自他の個人情報の保護や適切な扱いが必要であることなどに触れることが大切である。","アのウは，技能に関わる事項である。","聞き取り調査をしたり映像や新聞などの各種資料で調べたりして，まとめることとは，我が国の産業と情報との関わりについて，放送局や新聞社，情報を生かして発展している産業に従事している人への聞き取り調査をしたり，ニュース番組の映像や新聞記事などの各種の資料，コンピュータなどを使って調べたりして，図表などにまとめることである。ここでは，聞き取り調査をしたりコンピュータなどを使ったりして適切に情報を集める技能，映像や新聞などの資料から適切に情報を読み取る技能，情報活用の様子などを図表などにまとめる技能などを身に付けるようにすること，またその際，情報の出典を確認したり，複数の情報を比較したりして，情報の確かさや送り手の意図を確認できるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの情報を集め発信するまでの工夫や努力などに着目して，放送，新聞などの産業の様子を捉え，それらの産業が国民生活に果たす役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，放送，新聞などの産業の様子について，例えば，情報をどのように集めているか，どのように選択・加工・整理して国民に伝えているかなどの問いを設けて調べたり，発信された情報と国民生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","情報を集め発信するまでの工夫や努力に着目するとは，ニュースや天気情報，交通情報など多くの情報を収集し，意図をもって，分かりやすく伝えるよう編集・加工し，テレビやラジオ，新聞，インターネットなどの情報媒体を通して広く国民に伝えている放送局や新聞社などに従事する人々の工夫や努力について調べることである。このようにして調べたことを手掛かりに，放送，新聞などの産業の様子を捉えることができるようにする。","それら（放送，新聞など）の産業が国民生活に果たす役割を考え，表現するとは，例えば，放送局や新聞社などから発信される情報と自分たちの生活を関連付けて，放送や新聞などの産業が国民生活に果たす役割を考え，文章で記述したり，根拠や理由を明確にして議論したりすることである。","イのイの情報の種類，情報の活用の仕方などに着目して，産業における情報活用の現状を捉え，情報を生かして発展する産業が国民生活に果たす役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，産業における情報活用の現状について，例えば，その産業ではどのような情報を集めているか，情報をどのように活用しているかなどの問いを設けて調べたり，情報を活用した産業の変化や発展と国民生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","情報の種類に着目するとは，販売情報，気象情報，交通情報など産業が活用している情報の種類について調べることである。情報の活用の仕方に着目するとは，産業が情報を集める際の対象，情報活用の目的や方法，情報を活用する場面について調べることである。このようにして調べたことを手掛かりに，産業における情報活用の現状を捉えることである。","情報を生かして発展する産業が国民生活に果たす役割を考え，表現するとは，例えば，情報を活用した産業の変化や発展と人々の生活の利便性の向上を関連付けて，情報を生かして発展する産業が国民生活に果たす役割を考え，文章で記述したり，根拠や理由を明確にして議論したりすることである。","実際の指導に当たっては，放送，新聞などの産業については，自分たちが日頃から様々な情報手段を活用している事実を調べる活動などが考えられる。また，情報を活用して発展している産業については，情報活用が十分に行われていなかった頃の状況と現在の状況を比較して，情報の生かし方の工夫や国民の利便性の向上などを図表にまとめる活動などが考えられる。"],"t":["内容の取扱いの(4)のアは，内容の(4)アのア及びイのアの指導において，取り上げる対象の範囲について示したものである。","ここでは，「放送，新聞などの産業」の中から一つを選択して取り上げ，その産業のもつ働き，国民生活との関わりについて具体的に調べられるようにする。事例の選択に当たっては，地域の実態や児童の興味・関心，教材の収集状況などから判断するようにする。放送については，テレビやラジオなどの放送局で働く人々は国民に多様な情報を伝えるため様々な番組を制作していること，情報を分かりやすく伝えるため映像や音声を編集していることを取り上げることが考えられる。新聞については，新聞社で働く人々は国民に正確な情報を伝えるために取材をしていること，情報を分かりやすく伝えるために記事を選択・加工したり編集したりしていることを取り上げることが考えられる。","また，情報は放送，新聞などの産業が目的をもって発信していること，情報媒体にはそれぞれ伝え方・伝わり方に特徴があること，情報の中には不確かなものや誤ったものもあることなどを踏まえ，情報の受け手として，確かな情報を収集・選択し，様々な観点から比較して適切に判断することの大切さに気付くようにする。なお，不確かな情報や誤った情報が広がることによって，風評被害などが生じ，関係者の人権等が著しく侵害されることがあることにも触れるようにする。","内容の取扱いの(4)のイは，内容の(4)アのイ及びイのイの指導において，取り上げる対象の範囲について示したものである。","ここでは，「様々な産業」について，「販売，運輸，観光，医療，福祉など」情報を活用して発展している産業の中から選択して取り上げることが
