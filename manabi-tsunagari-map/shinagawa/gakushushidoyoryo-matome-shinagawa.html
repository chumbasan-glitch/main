考えられる。取り上げる事例としては，例えば，販売情報を収集・分析して商品の入荷量や販売量を予測したり，インターネット上で商品の管理を行ったりしている販売業，交通や位置，気象などの情報を活用したり，倉庫を運営する産業と連携して迅速かつ効率的な輸送に努めたりしている運輸業，魅力ある地域の観光資源について情報を発信して地域の活性化に努めている観光業，様々な機関と連携したり離れた地域間で情報を共有したりすることによりサービスの向上に努めている医療や福祉などの産業が考えられる。","事例の選択に当たっては，情報を活用して産業におけるサービスを向上させたり，販売業と運輸業などが結び付いて物流を構成するなど複数の産業が相互に結び付くことで新たなサービスを提供したりして，国民生活の利便性を大きく向上させている例など，国民の身近な生活を支えている事例を取り上げることが考えられる。その際，情報通信機器の操作方法や情報通信の仕組みに深入りすることがないように，児童の発達の段階を考慮して指導することが大切である。","また，学習したことを基に，大量の情報を活用して産業をより一層発展させることや，それにより国民生活の利便性が向上すること，国民は適切な情報を見極める必要があることなど情報活用の在り方を多角的に考えて，情報化社会のよさや課題について自分の考えをまとめることができるよう指導することが大切である。"]}},"shakai-5-X-5":{"page":91,"name":"国土の自然環境と国民生活（自然災害・森林・公害）","expl":{"intro":["この内容は，「地理的環境と人々の生活」及び「現代社会の仕組みや働きと人々の生活」に区分される内容として，我が国の国土の自然環境と国民生活との関連に関する内容を学習することで身に付ける事項を示している。我が国の国土の自然環境と国民生活との関連とは，自然災害への対応，森林資源の保護，公害の防止に見られる，国土の環境と人々の生活や産業との密接な関連を指している。","ここでは，国土の自然災害に関する内容，森林資源の働きに関する内容，公害の防止と生活環境に関する内容から構成されている。国土の自然災害に関する内容については，アのア及びエとイのアを関連付けて指導する。例えば，災害の種類や発生の位置や時期，防災対策などに着目して，地図帳や各種の資料で調べ，まとめ，国土の自然災害の状況を捉え，自然条件との関連を考え，表現することを通して，自然災害は国土の自然条件などと関連して発生していることや，自然災害から国土を保全し国民生活を守るために国や県などが様々な対策や事業を進めていることを理解できるようにすることである。","また，森林資源の働きに関する内容については，アのイ及びエとイのイを関連付けて指導する。例えば，森林資源の分布や働きなどに着目して，地図帳や各種の資料で調べ，まとめ，国土の環境を捉え，森林資源が果たす役割を考え，表現することを通して，森林は，その育成や保護に従事している人々の様々な工夫と努力により国土の保全など重要な役割を果たしていることを理解できるようにすることである。","さらに，公害の防止と生活環境に関する内容については，アのウ及びエとイのウを関連付けて指導する。例えば，公害の発生時期や経過，人々の協力や努力などに着目して，地図帳や各種の資料で調べ，まとめ，公害防止の取組を捉え，その働きを考え，表現することを通して，関係機関や地域の人々の様々な努力により公害の防止や生活環境の改善が図られてきたことを理解するとともに，公害から国土の環境や国民の健康な生活を守ることの大切さを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイ並びにウは，知識に関わる事項である。","アのアの自然災害は国土の自然条件などと関連して発生していることを理解することとは，我が国では，国土の地形や気候などとの関係から地震災害，津波災害，風水害，火山災害，雪害などの様々な自然災害が起こりやすいこと，自然災害はこれまで度々発生しこれからも発生する可能性があることなどを基に，国土の自然災害の状況について理解することである。また，自然災害から国土を保全し国民の生活を守るために国や県などが様々な対策や事業を進めていることを理解することとは，国や県などは，砂防ダムや堤防，防潮堤の建設，津波避難場所の整備，ハザードマップの作成など，自然災害の種類や国土の地形や気候に応じた対策や事業を進めていることなどを基に，国土の自然災害への対策や事業について理解することである。","アのイの森林は，その育成や保護に従事している人々の様々な工夫と努力により国土の保全などに重要な役割を果たしていることを理解することとは，我が国は，国土に占める森林面積の割合が高いこと，森林は国民生活の舞台である国土の保全や水源の涵養などに大切な働きをしていること，森林はその育成や保護に従事している人々の取組により維持・管理されていることなどを基に，森林資源の役割について理解することである。","アのウの関係機関や地域の人々の様々な努力により公害の防止や生活環境の改善が図られてきたことを理解することとは，我が国では，産業の発展，生活様式の変化や都市化の進展により公害が発生して国民の健康や生活環境が脅かされてきたこと，関係機関をはじめ多くの人々の努力や協力により公害の防止や生活環境の改善が図られてきたことなどを基に，公害防止の取組と国民生活の関連について理解することである。また，公害から国土の環境や国民の健康な生活を守ることの大切さを理解することとは，国土の環境保全の取組は国民の健康な生活を守ることにつながること，そのためには継続的な取組と様々な立場の人の協力が大切であることなどを基にして，公害防止の取組の大切さについて理解することである。","アのエは，技能に関わる事項である。","地図帳や各種の資料で調べ，まとめることとは，我が国の国土の自然環境と国民生活との関連について，地図帳や衛星写真などの資料で自然災害や公害の発生位置，森林の広がりなどを調べたり，統計，写真や映像，年表などの資料で自然災害への対策や事業，森林資源の働き，公害の防止や生活環境の改善に向けた関係機関や地域の取組などを調べたりして，白地図や図表などにまとめることである。ここでは，地図帳，統計や年表などの資料から適切に情報を読み取る技能，調べたことを白地図などにまとめる技能などを身に付けるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの災害の種類や発生の位置や時期，防災対策などに着目して，自然災害を捉え，自然条件との関連を考え，表現することとは，社会的事象の見方・考え方を働かせ，国土の自然災害の状況について，例えば，これまでに我が国においてどのような自然災害が，いつどこで発生したか，自然災害による被害をどのように減らす対策をとっているかなどの問いを設けて調べたり，自然災害と国土の自然条件を関連付けて考えたりして，調べたことや考えたことを表現することである。","災害の種類に着目するとは，我が国で発生した主な自然災害の種類や被害の状況について調べることである。発生の位置や時期に着目するとは，我が国で発生した主な自然災害の位置や発生した時期について調べることである。防災対策に着目するとは，国や県などが進めてきた砂防ダムや堤防などの整備，ハザードマップの作成などの防災・減災に向けた対策や事業について調べることである。このようにして調べたことを手掛かりに，国土の自然災害の状況を捉えることができるようにする。","自然条件との関連を考え，表現するとは，例えば，我が国で発生する様々な自然災害と国土の自然条件を関連付けて，自然災害が発生する理由や，国や県などの防災・減災に向けた対策や事業の役割を考え，文章で記述したり，白地図や年表，図表などにまとめたことを基に説明したりすることである。その際，自然災害が発生しやすい我が国においては，日頃から防災に関する情報に関心をもつなど，国民一人一人の防災意識を高めることが大切であることに気付くように配慮することが大切である。","イのイの森林資源の分布や働きなどに着目して，国土の環境を捉え，森林資源が果たす役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，国土の環境について，例えば，国土における森林の面積の割合はどれくらいか，森林にはどのような働きがあるかなどの問いを設けて調べたり，森林と国土保全や国民生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","森林資源の分布に着目するとは，森林の種類や広がり，国土に占める割合などについて調べることである。（森林資源の）働きに着目するとは，森林資源がもつ多様な機能や森林の育成や保護に関わる人々の工夫や努力について調べることである。なお，森林の働きによる自然災害の防止には限界があることについても触れるようにする。このようにして調べたことを手掛かりに，国土の環境を捉えることができるようにする。","森林資源が果たす役割を考え，表現するとは，例えば，我が国の国土における森林の分布と国民の生活舞台である国土の保全を関連付けて，森林資源の果たす役割や森林資源を保護していくことの大切さを考え，文章で記述したり，白地図などにまとめたことを基に説明したり，根拠や理由を明確にして議論したりすることである。","イのウの公害の発生時期や経過，人々の協力や努力などに着目して，公害防止の取組を捉え，それらの取組の働きを考え，表現することとは，社会的事象の見方・考え方を働かせ，公害防止の取組について，例えば，どのような公害がいつごろ発生したか，それはどのように広がり，その後どのように改善したか，人々はどのように協力してきたかなどの問いを設けて調べたり，公害防止の取組と国土の環境や国民の健康な生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","公害の発生時期や経過に着目するとは，産業の発展や生活様式の変化，都市化の進展などにより主な公害が発生した時期や，公害により国民の健康や生活環境が脅かされてきたこと，関係の諸機関をはじめ多くの人々の努力により公害の防止や生活環境の改善が図られてきたことなどの経過について調べることである。人々の協力や努力に着目するとは，関係の諸機関や人々の協力や努力によって環境改善に成果を上げてきたことについて調べることである。このようにして調べたことを手掛かりに，公害防止の取組を捉えることができるようにする。","その（公害防止の）取組の働きを考え，表現するとは，例えば，公害防止の取組と環境改善や人々の健康な生活を関連付けて，公害防止の継続的，協力的な取組の大切さを考え，白地図や図表などにまとめたことを基に説明したり，根拠や理由を明確にして議論したりすることである。","実際の指導に当たっては，自然災害への対応や公害の防止について，国や県などが策定した計画などの情報を，インターネットなどを活用して集めたり，関係の諸機関に従事する人に聞き取り調査をしたりする活動などが考えられる。"],"t":["内容の取扱い(5)のアは，内容の(5)のアのアにおいて，自然災害を取り上げる際の配慮事項を示したものである。","自然災害については，我が国で過去に発生した地震災害，津波災害，風水害，火山災害，雪害などの自然災害を国土の自然条件と関連付けて取り上げることが考えられる。なお，風水害とは，豪雨，洪水，高潮，崖崩れや土石流などによる土砂災害，突風や竜巻などによる災害を指している。ここでは，第４学年の内容の(3)「自然災害から人々を守る活動」とのねらいの違いに留意する必要がある。第４学年では，県内などで発生した自然災害を取り上げ，地域の関係機関や人々による自然災害への対処や備えを通して地域社会について理解することに，第５学年では，国土において発生する様々な自然災害を取り上げて，自然災害と国土の自然条件との関連を通して国土の地理的環境を理解することに，それぞれねらいがあることに留意することが大切である。また，気象条件など，理科における学習内容との関連を図った指導を工夫することも大切である。","内容の取扱い(5)のイは，内容の(5)のアのウ及びイのウの公害についての指導において，取り上げる公害の範囲を示したものである。","環境基本法では，公害として，大気の汚染，水質の汚濁，騒音，振動，地盤の沈下及び悪臭が挙げられている。ここでは，「大気の汚染，水質の汚濁など」の中から具体的事例を一つ選択して取り上げることが考えられる。","事例の選択に当たっては，例えば，生活様式の変化や都市化の進展などがもたらした都市・生活型の公害，産業がもたらした公害などが考えられる。その際，取り上げた事例について，過去に我が国の国土で発生し改善されてきた公害を年表などで調べたり，公害の防止や環境改善に向けて成果を上げてきた関係機関や人々の努力や協力の様子などを資料で具体的に調べたりすることが考えられる。","内容の取扱い(5)のウは，内容の(5)イのイの森林資源の働きやイのウの公害の防止の指導における配慮事項を示したものである。","ここでは，国民の一人として，国土の自然環境，国民の健康や生活環境の維持・改善に配慮した行動が求められるなど国民一人一人の協力の必要性に気付くようにすることが大切である。その際，一度破壊された環境を取り戻すためには長い時間と多くの人の努力や協力が必要であることに気付くようにするともに，例えば，自分たちには何ができるかなどと，自分たちに協力できることを考えたり選択・判断したりして，国土の環境保全への関心を高めるように配慮することが大切である。","第５学年においては，内容の(1)から(5)までの学習を通して，社会的事象について，学習問題を主体的に解決しようとする態度や，よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとともに，多角的な思考や理解を通して，我が国の国土に対する愛情，我が国の産業の発展を願い我が国の将来を担う国民としての自覚を養うようにすることが大切である。"]}},"shakai-6-X-1":{"page":100,"name":"我が国の政治の働き（日本国憲法，国や地方の政治）","expl":{"intro":["この内容は，「現代社会の仕組みや働きと人々の生活」に区分されるものであり，我が国の政治の働きについての学習で身に付ける事項を示している。我が国の政治の働きとは，国家や国民生活の基本を定めている日本国憲法の下で，立法，行政，司法の三権がそれぞれ果たしている役割や，国や地方公共団体の政治が民主政治の考え方に基づいて，国民生活の安定と向上を図るために果たしている働きを指している。","そのためこの内容は，日本国憲法や政治の仕組みに関する内容と国や地方公共団体の政治の取組に関する内容から構成されている。日本国憲法や政治の仕組みに関する内容については，アのア及びウとイのアを関連付けて指導する。例えば，日本国憲法の基本的な考え方に着目して，見学・調査したり各種の資料で調べたりして，まとめ，我が国の民主政治を捉え，日本国憲法が国民生活に果たす役割や，国会，内閣，裁判所と国民との関わりを考え，表現することを通して，日本国憲法は国家の理想，天皇の地位，国民としての権利及び義務など国家や国民生活の基本を定めていることや，現在の我が国の民主政治は日本国憲法の基本的な考え方に基づいていることを理解するとともに，立法，行政，司法の三権がそれぞれの役割を果たしていることを理解できるようにすることである。","また，国や地方公共団体の政治の取組に関する内容については，アのイ及びウとイのイを関連付けて指導する。例えば，政策の内容や計画から実施までの過程，法令や予算との関わりなどに着目して，見学・調査したり各種の資料で調べたりして，まとめ，国や地方公共団体の政治の取組を捉え，国民生活における政治の働きを考え，表現することを通して，国や地方公共団体の政治は，国民主権の考え方の下，国民生活の安定と向上を図る大切な働きをしていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイは，知識に関わる事項である。","アのアの日本国憲法は国家の理想，天皇の地位，国民としての権利及び義務など国家や国民生活の基本を定めていることを理解することとは，日本国憲法には，国民の基本的人権は侵すことのできない永久の権利として保障されていること，主権は国民にあることや我が国が国際紛争を解決する手段としての戦争を永久に放棄することなどが定められていること，天皇は日本国の象徴であり日本国民統合の象徴として位置付けられていること，生命，自由及び幸福の追求に対する国民の権利は侵すことのできない永久の権利として国民に保障されたものであり，それを保持するためには国民の不断の努力を必要とするものであること，参政権は国民主権の表れであり，民主政治にとって極めて重要であること，また，国民は権利を行使する一方で，勤労や納税の義務などを果たす必要があることなどの権利や義務が定められていることなどを基に，日本国憲法の特色について理解することである。また，現在の我が国の民主政治は日本国憲法の基本的な考え方に基づいていることを理解することとは，現在の我が国の民主政治は日本国憲法の基本理念である国民主権の考え方と深く関わっていること，そのことは私たちの日常生活とも関連があることなどを基に，日本国憲法と国民生活との関連について理解することである。立法，行政，司法の三権がそれぞれの役割を果たしていることを理解することとは，我が国の政治には国会に立法，内閣に行政，裁判所に司法という三権があること，それらは相互に関連し合ってそれぞれの役割を果たしていることなどを基に，我が国の政治の仕組みについて理解することである。","アのイの国や地方公共団体の政治は，国民主権の考え方の下，国民生活の安定と向上を図る大切な働きをしていることを理解することとは，国や地方公共団体の政治は国民生活と密接な関係をもっていること，それらの政治は国民主権の考え方を基本として，国民の願いを実現し国民生活の安定と向上を図るために大切な働きをしていることなどを基に，国や地方公共団体の政治の働きについて理解することである。","アのウは，技能に関わる事項である。","見学・調査したり各種の資料で調べたりして，まとめることとは，我が国の政治の働きについて，公共施設などの見学や，そこで働く人への聞き取り調査をしたり，国や県，市などが作成した広報誌などの各種資料で調べたりして，図表などにまとめることである。ここでは，見学・調査して適切に情報を集める技能，複数の情報を比べたり結び付けたりして読み取る技能，調べたことを図表などに適切に整理する技能などを身に付けるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの日本国憲法の基本的な考え方に着目して，我が国の民主政治を捉え，日本国憲法が国民生活に果たす役割や，国会，内閣，裁判所と国民との関わりを考え，表現することとは，社会的事象の見方・考え方を働かせ，我が国の民主政治について，例えば，日本国憲法の基本的な考え方はどのようなものか，国会，内閣，裁判所はそれぞれどのような役割を果たしているか，国会，内閣，裁判所はどのように関連しているかなどの問いを設けて調べたり，日本国憲法と国民生活，国会，内閣，裁判所と国民をそれぞれ関連付けて考えたりして，調べたことや考えたことを表現することである。","日本国憲法の基本的な考え方に着目するとは，日本国憲法に定められた基本的人権の尊重，国民主権，平和主義の原則，天皇の地位，国民の権利と義務などの基本的な考え方について，関連する条文などを根拠に調べることである。このようにして調べたことを手掛かりに，我が国の民主政治を捉えることができるようにする。なお，平和主義については，自衛隊が我が国の平和と安全を守っていることに触れるようにする。","日本国憲法が国民生活に果たす役割を考え，表現することとは，例えば，日本国憲法の基本的な考え方と国民生活を関連付けて，日本国憲法の特色や役割を考え，文章で記述したり図表などにまとめたことを基に説明したりすることである。また，国会，内閣，裁判所と国民との関わりを考え，表現することとは，例えば，国会，内閣，裁判所の働きと国民を関連付けて，国民としての政治への関わり方を考え，図表などにまとめたことを基に説明したり，根拠や理由を明確にして議論したりすることである。","イのイの政策の内容や計画から実施までの過程，法令や予算との関わりなどに着目して，国や地方公共団体の政治の取組を捉え，国民生活における政治の働きを考え，表現することとは，社会的事象の見方・考え方を働かせ，国や地方公共団体の政治の取組について，例えば，どのような内容の政策か，どのような過程を経て実施されたか，どのような法令に基づいているか，予算はどのように決められるかなどの問いを設けて調べたり，それらの取組と国民生活を関連付けて考えたりして，調べたことや考えたことを表現することである。","政策の内容や計画から実施までの過程に着目するとは，国民の願い，国や地方公共団体の政策の内容，その計画から実施までの期間や過程などについて調べることである。法令や予算との関わりに着目するとは，国や地方公共団体の政治の取組を実施するための基になる法令や予算について調べることである。このようにして調べたことを手掛かりに，国や地方公共団体の政治の取組を捉えることができるようにする。","国民生活における政治の働きを考え，表現するとは，例えば，国や地方公共団体の政治の取組と国民生活を関連付けて，政治の働きを考え，レポートなどにまとめたり，図表などにまとめたことを基に説明したりすることである。","実際の指導に当たっては，我が国の政治の学習が，抽象的になったり，細かい用語や仕組み，数値などを覚えるだけの指導になったりすることのないよう，国や地方公共団体の取組についての具体的な事例を取り上げて調べるようにすることが大切である。また，地方公共団体の政治の働きを取り上げる際には，国の政治との関連を十分に踏まえて指導することが大切である。"],"t":["内容の取扱いの(1)のアは，内容の(1)のアのア及びイのアについて指導する際に取り上げる事柄と配慮事項を示したものである。","ここでは，アのアの指導について，国会などの議会政治や選挙の意味，国会と内閣と裁判所の三権相互の関連，裁判員制度や租税の役割などについても扱うようにすることを示している。","「国会など議会政治や選挙の意味」については，選挙は国民の代表者を選出する大切な仕組みであること，国民の代表者として選出された国会議員は国民生活の安定と向上に努めなければならないこと，国民は代表者を選出するため，選挙権を行使する必要があることを考えるようにする。","「国会と内閣と裁判所の三権相互の関連」については，国会が国権の最高機関であり，国の唯一の立法機関として法律の制定や予算の議決，条約の承認などを行っていること，内閣が国の行政権をもち，法律や予算に基づいて実際の政治を行っていること，裁判所が司法権をもち，法律に基づいて裁判を行っていることを取り上げ，三権がそれぞれ大切な役割を果たしていることや，三権が相互に関連し合っていることを理解できるようにする。","「裁判員制度」については，国民が裁判に参加する裁判員制度を取り上げ，法律に基づいて行われる裁判と国民との関わりについて関心をもつようにする。","「租税の役割」については，租税が国や県，市によって行われている対策や事業などの費用として使われていること，それらは主に国民によって納められた税金であることなどを理解できるようにする。その際，限られた財源をどのように配分するのかを決める責任は，国会や地方議会などの制度を通して，国民や住民にあることに触れるようにする。","また，イのアの指導に関連して，調べて得た情報などに基づいて，政治への関わり方について多角的に考え，自分の考えをまとめることができるよう配慮することを求めている。例えば，選挙は国民の代表者を選出する大切な仕組みであること，行政に必要な予算を国民が納める税金が支えていること，国民が裁判に参加する仕組みとして裁判員制度があることなどを踏まえて，様々な立場から多角的に考え，義務や責任などと関連付けて自分の考えをまとめるように指導することが大切である。","内容の取扱いの(1)のイは，内容の(1)のアのアに示されている「天皇の地位」と「国民としての権利及び義務」について学習する際に取り上げる事例と配慮事項を示したものである。","「天皇の地位」については，例えば，国会の召集，栄典の授与，外国の大使等の接受などの国事行為や，国会開会式への出席，全国植樹祭・国民体育大会への出席や被災地への訪問・励ましといった各地への訪問などを通して，象徴としての天皇と国民との関係を取り上げ，天皇が日本国の象徴であり日本国民統合の象徴であることを理解できるようにする。また，内容の(2)の歴史学習との関連に配慮し，天皇が国民に敬愛されてきたことを理解できるようにすることも大切である。","これらの指導を通して，天皇についての理解と敬愛の念を深めるようにする必要がある。","「国民としての権利及び義務」についての指導に当たっては，日本国憲法に定められた国民としての権利及び義務について，国民生活の安定と向上を図るために政治が大切な働きをしているという観点から，具体的な事例を取り上げるようにすることが大切である。国民の権利については，例えば，参政権を取り上げ，選挙権など，政治に参加する権利が国民に保障されていることを理解できるようにする必要がある。国民の義務については，例えば，納税の義務を取り上げ，税金が国民生活の向上と安定に使われていることを理解できるようにする必要がある。","内容の取扱いの(1)のウは，内容の(1)のアのイについて指導する際に取り上げる事例の範囲と配慮事項を示したものである。","ここでは，「国や地方公共団体の政治」の取組について，具体的に調べられるように児童の関心や地域の実態に応じて，「社会保障，自然災害からの復旧や復興，地域の開発や活性化などの取組」の中から選択して取り上げる。","社会保障の取組を取り上げる場合には，例えば，高齢者や障害者の生活支援や介護，医療の充実，子育て支援などに関わる具体的な事業を選択して取り上げ，市役所，県庁が地域の実態や住民の意見を取り入れながら政策を決定し，国と協力して計画的に実行していることなどを具体的に調べるようにすることが考えられる。自然災害からの復旧や復興の取組を取り上げる場合には，災害が発生したときに市役所，県庁が，自衛隊の派遣を要請するなど国と協力しながら救援活動を行ったり災害復旧のために物流拠点を配置したり，さらに，長期的な視野に立って地域の再興に向けて様々な施策を実行したりしていることなどを具体的に調べるようにすることが考えられる。また，地域の開発や活性化の取組を取り上げる場合には，地域経済の活性化や地域における雇用機会の創出を，市役所，県庁が主体的に進めていることや，国はそのような地域の自立的な取組を制度や財政などの面から支援していることなどを具体的に調べるようにすることが考えられる。これらの取組を調べることを通して，国民生活における政治の働きを考えるようにすることが大切である。","その際，税金が国や地方公共団体による対策や事業に使われ，国民生活の向上と安定のために重要な役割を果たしていることを理解できるようにする必要がある。","内容の取扱いの(1)のエは，内容の(1)のイのアについて指導する際の配慮事項を示したものである。","ここでは，「「国会」について，国民との関わりを指導する」に当たり，国民生活と関わりが深い具体的な事例として各々の国民の祝日を扱い，それらに関心をもつようにする。その際，国民の祝日に関する法律に定められている内容や歴史的な由来などを取り上げながら，各々の祝日がよりよき社会，より豊かな生活を築きあげるために，全ての国民が祝い，感謝し，または記念する日として定められていることなど，我が国の社会や文化における意義を考えることができるよう配慮して指導することが大切である。"]}},"shakai-6-X-2":{"page":106,"name":"我が国の歴史上の主な事象","expl":{"intro":["この内容は，「歴史と人々の生活」に区分される内容であり，我が国の歴史上の主な事象についての学習で身に付ける事項を示している。我が国の歴史上の主な事象とは，我が国の歴史の進展に大きな影響を与えた各時期の代表的な歴史上の事象のことである。具体的には内容(2)のアのアからサまでに示された歴史上の事象を指しており，我が国の歴史を学習する際に調べる対象のことである。","我が国の歴史上の主な事象に関する内容については，アのアからサまでの各項目とアのシ及びイのアを，それぞれ関連付けて指導する。例えば，世の中の様子，人物の働きや代表的な文化遺産などに着目して，遺跡や文化財，地図や年表などの資料で調べ，まとめ，我が国の歴史上の主な事象を捉え，我が国の歴史の展開を考え，表現することを通して，大まかな歴史を理解するとともに，関連する先人の業績，優れた文化遺産を理解できるようにすることである。また，歴史を学ぶ意味を考え，表現できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アの前文及びアからサまでは，知識に関わる事項である。","前文では，歴史学習全体を通して，我が国の歴史の進展に大きな影響を与えたアからサまでの代表的な歴史上の事象を手掛かりに，我が国が歩んできた大まかな歴史を理解するとともに，それらの事象に関連する先人の業績，優れた文化遺産を理解することである。","我が国の歴史上の主な事象を手掛かりにするとは，アからサまでに示されている各時代の典型的な歴史上の事象や関連する人物，代表的な文化遺産についての知識を習得し，その知識を基に考えるようにすることである。","大まかな歴史を理解することとは，政治の中心地や世の中の様子によって分けたいくつかの時期における世の中の動きを人物の業績や優れた文化遺産を通して捉え，我が国が歩んできた歴史を大まかに理解することである。従って，小学校では歴史を通史として事象を網羅的に取り扱うものではないことに留意する必要がある。","関連する先人の業績，優れた文化遺産を理解することとは，我が国が歩んできた歴史の中で，その時期の世の中の様子を形づくったり，国家や社会の変化に大きな影響を及ぼしたりした先人の働きとともに，各時代の人々によって生み出され，今日まで保存・保護されてきた文化遺産の大切さを理解することである。","アのシは，技能に関わる事項である。","遺跡や文化財，地図や年表などの資料で調べ，まとめることとは，歴史学習を通して身に付ける調べ方や，調べたことを表現する学習の仕方を示している。遺跡や文化財については，地域の博物館や資料館等を活用したり，学芸員から話を聞いたりして調べること，地図や年表などの資料については，歴史上の事象について，分布や経路などを表した地図や，出来事の経緯を示した年表，事象や出来事の様子を書き記した資料などで調べることを示している。また，歴史上の事象について調べたことや考えたこと，理解したことを整理してまとめることを示している。このような調べ方やまとめ方を繰り返しつつ，歴史上の事象を適切に調べまとめる技能を身に付けるようにすることが大切である。このほか，資料については，人物の肖像画や伝記，エピソード（逸話）などによって人物への関心や調べる意欲を高めることも考えられる。","アは，「知識及び技能」に関わる事項である。","アのアは，知識に関わる事項である。","狩猟・採集や農耕の生活については，貝塚や集落跡などの遺跡，土器などの遺物や，水田跡の遺跡や農具などの当時の遺物が残されていること，日本列島では長い期間，豊かな自然の中で狩猟や採集の生活が営まれていたこと，大陸から稲作が伝えられ農耕が始まると，人々は耕地の近くに定住してむらを作るようになったことなどが分かることである。","古墳については，古墳の規模やその出土品，古墳の広がりなどが分かることである。","大和朝廷（大和政権）による統一の様子については，各地に支配者が現れ，有力豪族を中心とした大和朝廷によって大和地方を中心とした地域の統一が進められたことなどが分かることである。なお，大和朝廷については，その成立や展開の時期を広く捉える観点から大和政権とも呼ばれていることに触れるようにする。","これらのことを手掛かりに，世の中の様子がむらからくにへと変化したことを理解できるようにする。","その際，神話・伝承を手掛かりに，国の形成に関する考え方などに関心をもつこととは，国の形成や地域の統一の様子を物語る神話・伝承を取り上げ，当時の人々のものの見方や考え方に関心をもつようにすることを意味している。神話・伝承には，児童が興味をもちやすい物語が多く見られ，それらを活用し，我が国の歴史に対し一層親しみをもてるようにすることが大切である。","アのシは，技能に関わる事項である。","例えば，貝塚や集落跡などの遺跡，土器などの遺物について，地域にある博物館や資料館などを利用して調べたり，身近な地域に残されている古墳を観察・見学したり，当時の様子や人物の働きなどを資料で調べたりして，年表などにまとめることなどが考えられる。ここでは，博物館や資料館などを見学して適切に情報を集める技能，年表などの資料から出来事やその時期の情報を読み取る技能，調べたことを年表などに適切に整理する技能などを身に付けるようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのイは，知識に関わる事項である。","大陸文化の摂取については， 聖徳太子が法隆寺を建立し，小野妹子らを遣隋使として隋（中国）に派遣することにより，政治の仕組みなど大陸文化を積極的に摂取しようとしたことなどが分かることである。","大化の改新については，中大兄皇子や中臣鎌足によって政治の改革が行われたことや，天皇中心の新しい国づくりを目指したことなどが分かることである。","大仏造営については，聖武天皇の発案の下，行基らの協力により国家的な大事業として東大寺の大仏が造られ，天皇を中心とする政治が都だけでなく広く全国に及んだことや，聖武天皇の願いにより鑑真が来日し，仏教の発展に大きな働きをしたことなどが分かることである。","これらのことを手掛かりに，天皇を中心とした政治が確立されたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，遣隋使の航路や正倉院の宝物が渡来した経路を世界地図などの資料で調べてまとめたり，大化の改新や大仏造営の様子などを資料で調べて年表などにまとめたりすることが考えられる。ここでは，地図などの資料で歴史上の出来事の位置や広がりなどを読み取る技能，調べたことを白地図や年表などに適切に整理する技能などを身に付けるようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのウは，知識に関わる事項である。","貴族の生活や文化については，貴族の屋敷の様子や藤 原道長に代表される貴族の生活の様子，紫式部や清少納言が我が国独自のかな文字を使って優れた文学作品をつくり出したこと，貴族の生活の様子を描いた大和絵などがつくられたことなどが分かることである。","これらのことを手掛かりに，京都に都が置かれた頃，日本風の文化が生まれたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，貴族の暮らしの様子や，紫式部や清少納言の活躍などを資料で調べ，まとめることが考えられる。ここでは，絵画などの資料から生活や文化に関する情報を適切に読み取る技能，調べたことをまとめる技能などを身に付けるようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのエは，知識に関わる事項である。","源平の戦いについては，力を付けてきた源氏と平氏が戦い，源 義経の働きもあって源氏が勝利し，大きな力をもつようになったことなどが分かることである。","鎌倉幕府の始まりについては，朝廷から認められ全国に守護や地頭を置いた 源 頼朝が鎌倉に幕府を開き，武士による政治の仕組みをつくり上げたことなどが分かることである。元との戦いについては，北 条時宗が九州の御家人を中心に全国の武士を動員し，元の攻撃を退けたこと，幕府が全国的に力をもってきたことなどが分かることである。","これらのことを手掛かりに，鎌倉に幕府が置かれた頃，武士による政治が始まったことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，源平の戦いが行われた場所や鎌倉幕府が開かれた場所，守護や地頭の配置，元との戦いの様子を日本地図や世界地図などの資料で調べ，年表や白地図などにまとめることが考えられる。ここでは，地図などの資料で歴史上の出来事の位置や広がりなどを読み取る技能，調べたことを白地図や年表などに適切に整理する技能などを身に付けるようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのオは，知識に関わる事項である。","京都の室町に幕府が置かれた頃の代表的な建造物については，足利義満は金閣を，足利義政は銀閣を，それぞれ建てたこと，それらは現在も保存されていること，銀閣の東求堂の書院造といわれる部屋のつくりには，ふすまや畳，違い棚などが作られていたこと，それらは現在の和風建築に生かされていることなどが分かることである。","京都の室町に幕府が置かれた頃の代表的な絵画については，雪舟により我が国の水墨画を代表する作品が生み出されたこと，それらの中には国宝に指定され現在も保存されているものがあること，水墨画は現在も人々に親しまれていることなどが分かることである。","これらのことを手掛かりに，京都の室町に幕府が置かれた頃，今日の生活文化につながる室町文化が生まれたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，金閣や銀閣などの建造物を比較したり，雪舟によって描かれた水墨画の複数が国宝に指定されていることやそれらを鑑賞してその独自性やよさを調べたりして，まとめることが考えられる。ここでは，写真や絵画などの資料を比べたり結び付けたりして，文化に関する情報を適切に読み取る技能，調べたことをまとめる技能などを養うようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのカは，知識に関わる事項である。","キリスト教の伝来については，ザビエルによってキリスト教が伝えられ我が国に広がったことなどが分かることである。","織田・豊臣の天下統一については，ポルトガル人によって日本に伝えられた鉄砲を多用するなどして織田信長が短い期間に領地を拡大したこと，豊臣秀吉が検地や刀狩などの政策を行ったことなどが分かることである。","これらのことを手掛かりに，群雄割拠の状態から戦国の世が統一されたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，キリスト教の伝来の様子を世界地図などの資料で調べたり，織田信長と豊臣秀吉の働きを比べたり結び付けたりして調べ，年表にまとめることが考えられる。ここでは，複数の人物の業績に関する情報を比べたり結び付けたりしながら読み取る技能，調べたことを年表などに適切に整理する技能を身に付けるようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのキは，知識に関わる事項である。","江戸幕府の始まりについては徳川家康が関ヶ原の戦いに勝利を収め，その後，江戸幕府を開いたことが分かることである。","参勤交代や鎖国などの幕府の政策については，大名を親藩，譜代，外様の三つに分けて全国に配置したこと，徳川家光の頃に参勤交代が制度として確立したこと，キリスト教の信仰を禁止し，貿易を統制し渡航を禁止するなど海外との交流を制限する政策を進めたことなどが分かることである。","身分制については，武士を中心とする身分制が定着したことなどが分かることである。","これらのことを手掛かりに，江戸幕府が政治を行った頃，武士による政治が安定したことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，大名の配置や参勤交代の経路，出島などを通して交易があった国の名称と位置を日本地図や世界地図などの資料で調べ，まとめることが考えられる。ここでは，地図などの資料で歴史上の事象の位置や地域間のつながりなどを適切に読み取る技能，調べたことをまとめる技能などを身に付けるようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのクは，知識に関わる事項である。","歌舞伎や浮世絵については，近松門左衛門などによって生み出された歌舞伎の作品が数多く演じられ，それを人々が楽しんで鑑賞していたことや，歌川広重などによって描かれた作品が人々に親しまれたことなどが分かることである。","国学や蘭学については，本居宣長が我が国の古典を研究し，国学の発展に重要な役割を果たしたこと，杉田玄白らがオランダ語の医学書を翻訳して『解体新書』を著したこと，伊能忠敬が全国を測量して精密な日本地図を作ったことなどが分かることである。","これらのことを手掛かりに，江戸幕府が政治を行った頃，町人の文化が栄え新しい学問がおこったことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，歌舞伎や浮世絵の作品，『解体新書』や日本地図などの学問の成果などを資料で調べ，それらをまとめることが考えられる。ここでは，当時の作品などの資料から文化や学問に関する情報を適切に読み取る技能，調べたことをまとめる技能などを身に付けるようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのケは，知識に関わる事項である。","黒船の来航については，ペリーが率いる米国艦隊の来航をきっかけに我が国が開国したことや江戸幕府の政権返上に伴い勝海舟と西郷隆盛の話し合いにより江戸城の明け渡しが行われたことなどが分かることである。","廃藩置県や四民平等などの改革については，西郷隆盛，大久保利通，木戸孝允らの働きによって明治天皇を中心とした新政府がつくられたこと，明治天皇の名による五箇条の御誓文が発布され新政府の方針が示されたこと，明治政府が行った廃藩置県や四民平等などの諸改革によって近代国家としての政治や社会の新たな仕組みが整ったことなどが分かることである。","文明開化については，福沢諭吉が欧米の思想を紹介するなど欧米の文化が広く取り入れられたことにより人々の生活が大きく変化したことが分かることである。","これらのことを手掛かりに，幕末から明治の初めの頃，我が国が明治維新を機に欧米の文化を取り入れつつ近代化を進めたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，黒船の来航の様子や明治政府の諸改革などを写真，絵画，世界地図などの資料で調べたり，明治政府に関わる人物などの業績と主な出来事などの関係を年表や図表などにまとめたりすることなどが考えられる。ここでは，写真や絵画などの資料から世の中の様子や人物の業績に関する情報を適切に読み取る技能，調べたことを年表や図表などに適切に整理する技能などを身に付けるようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのコは，知識に関わる事項である。","大日本帝国憲法の発布については，国会の開設に備えて板垣退助や大隈重信が政党をつくったこと，伊藤博文が憲法制定に重要な役割を果たしたこと，明治政府が発足後20年ほどで憲法を制定したことなどが分かることである。","日清・日露の戦争については，日清戦争の講和条約の締結で陸奥宗光が大きな働きをしたこと，日露戦争において東郷平八郎が活躍したこと，講和条約の締結において小村寿太郎が大きな働きをしたこと，そして，我が国が厳しい国際社会の環境に置かれた状況において，これらの戦争に勝利を収め，講和条約を結ぶことによって，国の安全を確保することができたことなどが分かることである。その際，これらの戦争では，戦場となった朝鮮半島及び中国において大きな損害を与えたことに触れることが大切である。","条約改正については，幕末に欧米諸国との間で結ばれた不平等な条約を対等なものに改める交渉において，外務大臣であった陸奥宗光や小村寿太郎が大きな働きをし，条約改正に成功したことなどが分かることである。","科学の発展については，野口英世が黄熱病について世界的に注目された研究を行ったことなどが分かることである。","これらのことを手掛かりに，我が国の国力が充実し国際的地位が向上したことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，明治政府に関わる人物の業績や当時の人々の生活の様子，当時の国際関係などを写真や絵画，世界地図などの資料で調べて，年表などにまとめることが考えられる。ここでは，写真や絵画などの資料から世の中の様子や人物の業績などに関する情報を適切に読み取る技能，調べたことを年表や図表などに適切に整理する技能などを身に付けるようにすることが大切である。","アは，「知識及び技能」に関わる事項である。","アのサは，知識に関わる事項である。","日中戦争や我が国に関わる第二次世界大戦については，我が国と中国との戦いが全面化したことや，我が国が戦時体制に移行したこと，我が国がアジア・太平洋地域において連合国と戦って敗れたこと，国内各地への空襲，沖縄戦，広島・長崎への原子爆弾の投下など，国民が大きな被害を受けたことが分かることである。また，これらの戦争において，我が国が多くの国々，とりわけアジア諸国の人々に対して多大な損害を与えたことについても触れることが大切である。","日本国憲法の制定については，戦後，平和で民主的な憲法が制定され，我が国が民主的な国家として出発したことなどが分かることである。なお，ここでは，内容の(1)のアの日本国憲法に関する学習と関連付けながら，日本国憲法制定の意義について理解を深めるよう指導するようにする。","オリンピック・パラリンピックの開催については，我が国が国際社会に復帰し，工業が発展し電化製品が普及したことなどにより国民生活が向上したこと，スポーツの祭典としてアジアで初めて東京でオリンピック大会が開催され，その後も我が国でオリンピック・パラリンピックの大会が開催されたこと，そうした中で我が国は国際社会において重要な役割を果たしてきたことなどが分かることである。なお，1964年には東京オリンピックに続き，第２回パラリンピックが東京で開催されたことにも触れ，戦後，我が国はスポーツを通した世界平和の実現に貢献してきたことに気付くようにすることも大切である。","これらのことを手掛かりに，戦後我が国は民主的な国家として出発し，国民生活が向上し，国際社会の中で重要な役割を果たしてきたことを理解できるようにする。その際，アからサまでに示されている事項を通して歴史学習全体を振り返り，我が国が歩んできた大まかな歴史や，関連する先人の業績や優れた文化遺産についての理解を深めるようにすることも考えられる。","アのシは，技能に関わる事項である。","例えば，当時の国民生活の様子を知る人への聞き取り調査や，戦争の広がりを世界地図や写真などの資料で調べ，年表などにまとめることが考えられる。ここでは，聞き取り調査で必要な情報を集める技能，地図や年表などの資料から事象の広がりや経過などを適切に読み取る技能，調べたことを年表や図表などに適切に整理する技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","世の中の様子，人物の働きや代表的な文化遺産などに着目して，我が国の歴史上の主な事象を捉え，我が国の歴史の展開を考えるとともに，歴史を学ぶ意味を考え，表現することとは，社会的事象の見方・考え方を働かせ，我が国の歴史上の主な事象について，例えば，世の中の様子，人物の働きや代表的な文化遺産などに関する問いを設けて調べたり，歴史の展開や歴史を学ぶ意味を考えたりして，調べたことや考えたことを表現することである。","世の中の様子に着目するとは，例えば，いつから始まったか，どのような世の中だったか，どのように発展したかなどの問いを設けて，アのアからサまでに示されたそれぞれの時期における国家・社会の様子について調べることである。","人物の働きに着目するとは，例えば，その人物はどのようなことをしたか，なぜそうしたか，社会や人々にどのような影響を与えたかなどの問いを設けて，国家・社会の発展や優れた文化遺産を生み出すことに貢献した先人の働きについて調べることである。なおアからコまでに示された歴史上の事象を調べる際には，内容の取扱いの(2)のウに示された，事象と関わりの深い人物の働きを中心にして具体的に調べるようにする。","代表的な文化遺産に着目するとは，例えば，誰がいつ頃作ったか，何のために作ったか，歴史上どのような意味や価値があるかなどの問いを設けて，我が国の代表的な文化遺産について調べることである。その際，内容の取扱いの(2)のイに示された，国宝，重要文化財に指定されているものや日本遺産に認定されているもの，世界文化遺産に登録されているものなど，国家・社会の発展を象徴する優れた文化遺産について調べることが考えられる。これらの文化遺産については，歴史上の主な事象や人物の働きとの関連に配慮して児童が理解しやすいものを選択して取り上げ，具体的に調べることができるようにする。また，人々の工夫や努力によって生み出され，今日に至るまで保存，継承されてきたことの意味を考えるようにすることが大切である。","このようにして，我が国の歴史上の主な事象を捉えることができるようにする。","我が国の歴史の展開を考えるとともに，歴史を学ぶ意味を考え，表現するとは，例えば，調べた歴史上の主な事象を関連付けたり総合したりして，世の中の様子や国家・社会の変化，歴史を学ぶ意味などを考えたりして，文章で記述したり，年表や図表などにまとめたことを基に説明したりすることである。歴史を学ぶ意味を考えるとは，歴史学習の全体を通して，歴史から何が学べるか，歴史をなぜ学ぶのかなど歴史を学ぶ目的や大切さなどについて考えることである。例えば，我が国の伝統や文化は長い歴史の中で育まれてきたことを踏まえ，過去の出来事は現代とどのような関わりをもっているかなど過去の出来事と今日の自分たちの生活や社会との関連や，歴史から学んだことをどのように生かしていくかなど国家及び社会の発展を考えることである。","その際，今日の自分たちの生活は，長い間の我が国の歴史や先人たちの働きの上に成り立っていることや，遠い祖先の生活が自分たちの生活と深く関わっていることなどを理解できるようにし，自分たちもこれからの歴史の担い手となることや，平和で民主的な国家及び社会を築き上げることについて，考えを深めるようにすることが大切である。","実際の指導に当たっては，我が国の歴史は各時期において様々な課題の解決や人々の願いの実現に向けて努力した先人の働きによって発展してきたことを理解できるようにし，我が国が発展してきた基盤について考え，我が国の歴史への関心を高めるようにすることが大切である。このことは，我が国の歴史や伝統を大切にして国を愛する心情を育てることにつながるものである。","また，人物の働きや代表的な文化遺産を中心とした学習の効果を高めるためには，内容のアのアからサまでに示した事象を取り扱う授業時数に軽重を付けるなど，単元の構成を工夫する必要がある。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，人々はどのような生活をしていたか，世の中の様子はどのように変わったか，どのように力を伸ばし国を治めたかなどの問いを設けて，狩猟・採集の生活や農耕が始まった頃の生活の様子，古墳の出現と広がり，大和朝廷（大和政権）の支配の広がりについて調べ，これらの事象を比較したり関連付けたりして，世の中の様子の変化を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，遺跡や遺物などを調べて，狩猟・採集や農耕の生活をしていたころの人々の生活や社会の様子を考える学習，卑弥呼が治めたと言われる邪馬台国の様子を想像して当時の社会を考える学習，身近な地域や国土に残る古墳について調べ，豪族や大和朝廷（大和政権）の力を想像する学習，神話・伝承を調べて国の形成について当時の人々のものの見方や考え方に関心をもつようにする学習などが考えられる。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，聖徳太子はどのような国づくりを進めたか，国づくりには聖武天皇のどのような願いが込められていたかなどの問いを設けて，大陸文化を取り入れた政治の様子，大化の改新を経て進められた天皇中心の政治の様子，大仏造営に込められた聖武天皇の願いや造営の様子について調べ，これらの事象を関連付けたり総合したりして，この頃の世の中の様子を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，聖徳太子の肖像画やエピソードなどからその人となりを想像する学習，大仏の大きさから天皇の力を考えたり，大仏造営を命じた詔から聖武天皇の願いを考えたりする学習などが考えられる。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，貴族はどのような生活をしていたか，どのような作品を残したかなどの問いを設けて，この頃の貴族の服装や建物，日常の生活や行事などの様子や紫式部や清少納言の作品について調べ，これらの事象を関連付けたり総合したりして，この頃の文化の特色を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，十二単や貴族の服装などから貴族の生活の様子を想像する学習，寝殿造の屋敷における貴族の生活の様子を調べる学習，当時の貴族が行っていた，現在にまで受け継がれている年中行事を調べる学習などが考えられる。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，源氏と平氏はどのような戦いをしたか， 源 頼朝はどのような政治の仕組みを作ったかなどの問いを設けて，武士が台頭してきたことや源平の戦いの様子，鎌倉幕府の政治の仕組み，元との戦いについて調べ，これらの事象を関連付けたり総合したりして，この頃の世の中の様子を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，源平の戦いにおける 源 義経の活躍の様子やエピソードを調べる学習，人物年表，エピソードから 源 頼朝の業績について考える学習，元との戦いの様子から武士の戦いの様子を調べる学習などが考えられる。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，誰がつくった建造物か，誰が描いた絵画か，この頃の文化にはどのような特色があるか，今に受け継がれているものにどのようなものがあるかなどの問いを設けて，金閣や銀閣などの建造物や水墨画などの絵画や今に受け継がれる文化について調べ，これらの事象を関連付けたり総合したりして，この頃の文化の特色を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，書院造の影響を受けている伝統的な家屋を観察して，この頃の文化に関心をもつようにすることなどが考えられる。また，この頃に生まれた能，茶の湯，生け花，盆踊りなども，今なお多くの人々に親しまれていることを関連的に取り上げることも考えられる。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，当時の世の中はどのような様子だったか，織田信長や豊臣秀吉らはどのようにして力を伸ばしたか，どのような政策を進めたかなどの問いを設けて，ザビエルが日本にキリスト教を伝えたことや，織田信長が勢力を伸ばした様子，豊臣秀吉が検地や刀狩りなどの政策を進め天下を統一した様子について調べ，これらの事象を関連付けたり総合したりして，戦国の世の統一に果たした織田信長，豊臣秀吉の役割を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，戦い方を工夫しながら勢力を伸ばした織田信長による天下統一への様子を調べる学習，検地や刀狩の資料から豊臣秀吉の政策の意図を考える学習，取り上げた人物のエピソードから業績を考える学習などが考えられる。また，キリスト教の伝来などを扱う際に，地図などを用いて，我が国の歴史上の事象をより広い視野から捉えることができるよう配慮することが大切である。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，江戸幕府はどのように始まったか，幕府はどのように世の中を治めたかなどの問いを設けて，関ヶ原の戦い，江戸幕府の大名配置，参勤交代や鎖国などの幕府の政策，武士を中心とした身分制について調べ，これらの事象を関連付けたり総合したりして，江戸幕府の政策の意図や社会の様子を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，徳川家康や徳川家光の人物年表，エピソードなどから，それらの人物の業績を考える学習，大名行列や出島，踏み絵などの資料を活用して江戸幕府の政策を調べる学習などが考えられる。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，歌舞伎や浮世絵はどのような人々に親しまれていたか，国学や蘭学はどのような学問だったのか，どのようにして作り上げたのかなどの問いを設けて，歌舞伎や浮世絵が町人の間に広がったことや国学や蘭学がおこったことを調べ，これらの事象を関連付けたり総合したりして，この頃に栄えた町人の文化や新しい学問を生み出した人物の業績を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，歌舞伎や浮世絵を楽しむ人々の様子から，それらが町人の間に広がったことを調べたり，室町文化と比較してそれらの特色を考えたりする学習，本居宣長，杉田玄白，伊能忠敬の業績が果たした役割などを考える学習などが考えられる。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，どのような背景から黒船が来航したか，黒船の来航を当時の人々はどのように受け止めたか，開国によって人々の生活はどのように変わったか，新政府をつくるために誰がどのように活躍したかなどの問いを設けて，当時の欧米諸国はアジア進出を進めたこと，黒船の来航後に近代化が進み欧米の文化が取り入れられたこと，明治政府は廃藩置県や四民平等など諸改革を行ったことについて調べ，これらの事象を関連付けたり総合したりして，この頃の政治の仕組みや世の中の様子の変化を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，ペリーの肖像画や黒船来航の絵画などから江戸幕府や当時の人々への影響を考える学習，西郷隆盛，大久保利通，木戸孝允などの人物のエピソードや資料などを基に明治政府の諸改革について調べる学習，『学問のすゝめ』を手掛かりとして福沢諭吉が欧米から新しい文化や考え方を取り入れたことを調べる学習などが考えられる。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，どのようにして国力を充実させたか，どのような人物が活躍したかなどの問いを設けて，自由民権運動の進展，大日本帝国憲法の発布や帝国議会の開設，日清・日露の戦争や不平等な条約の改正の経過，科学の分野で優れた業績を上げた人物について調べ，これらの事象を関連付けたり総合したりして，明治政府の意図や世の中の様子の変化を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，伊藤博文が中心となって行った大日本帝国憲法の制定のための取組を調べる学習，日清・日露の戦争や条約改正に関わる主な出来事を年表に整理する学習，陸奥宗光や小村寿太郎の外交努力について調べる学習などが考えられる。","イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，戦争はどのように広がったか，人々の暮らしはどのように変わったか，世界との関わりはどのように変わったかなどの問いを設けて，日中戦争や我が国に関わる第二次世界大戦の広がりの様子，戦争の長期化や戦線の拡大に伴う国民生活への影響，各地への空襲，沖縄戦，広島・長崎への原子爆弾の投下などにより国民が受けた大きな被害，日本国憲法の制定，オリンピック・パラリンピックの開催などについて調べ，これらの事象を関連付けたり総合したりして，我が国の政治や国民生活が大きく変わったことや，我が国が国際社会において果たしてきた役割を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，学校図書館や公共図書館，博物館や資料館などを利用したり，地域の高齢者に当時の話を聞いたりする活動を取り入れ，児童が自ら資料を活用したり調査したりする学習が考えられる。"],"t":["内容の取扱いの(2)のアは，小学校の歴史学習における配慮事項を示したものである。小学校の歴史学習は，人物の働きや代表的な文化遺産を中心として学習することとしている。児童にとっては我が国の歴史を初めて学習することから，児童の興味・関心を踏まえて，取り上げる人物や文化遺産を精選する必要がある。また，小学校の歴史学習においては，歴史上の主な出来事や年号などを覚えることだけでなく，我が国の歴史に対する興味・関心をもち，歴史を学ぶ楽しさを味わわせるとともに，歴史を学ぶことの大切さに気付くようにする必要がある。","指導計画を作成する際には，例えば，アからサまでに示された歴史上の事象の中で重点的に扱うものと関連的に扱うものを明確にして授業時間の掛け方に軽重を付けるなど，歴史上の主な事象の取り上げ方を工夫し，小学校の歴史学習に関する目標や内容が一層効果的に実現できるようにすることが大切である。","実際の指導に当たっては，内容の(2)のアからサまでに示された歴史上の主な事象に対応する人物の働きや代表的な文化遺産を取り上げるとともに，重点的に扱う歴史的事象やそれに対応する人物などについては，資料の数や扱う授業時間数に軽重を付けるなど，指導の重点の置き方に工夫を加え，人物の働きを具体的に理解できるようにする。その際，児童の発達の段階を踏まえた教材，資料の内容や提示の仕方などを工夫し，学習活動を具体的に展開する必要がある。また，内容の(2)のサについては，その後の中学校以降の歴史学習との関連を図り，児童の発達の段階を踏まえて指導するように配慮する必要がある。","内容の取扱いの(2)のイは，代表的な文化遺産を通して歴史学習を進める上で，内容の(2)のアからサに示した歴史上の主な事象に関連して，取り上げる文化遺産の範囲を例示したものである。","「重要文化財」とは，国内の建造物，美術工芸品等の文化財の中から国によって指定されたものであり，「国宝」とは，重要文化財のうち，学術的に価値が極めて高く，かつ代表的なものとして指定されたものである。「世界文化遺産」とは，ユネスコによって世界遺産リストに登録された遺跡や景観，自然などの世界遺産のうち，我が国に所在する建築物や遺跡などの文化遺産を指している。また，地域の歴史的魅力や特色を通じて我が国の文化・伝統を語り継ぐことを目的として文化庁が認定している「日本遺産」を取り上げることも考えられる。","ここでは歴史上の主な事象と関連の深い国宝，重要文化財，世界文化遺産などの中から適切なものを取り上げ，我が国の代表的な文化遺産を通して学習が具体的に展開できるよう配慮する必要がある。なお，地域の実態を生かし，歴史上の主な事象に対する関心や理解を深める観点から，自分たちの住む県や市によって指定されている文化財などを取り上げることも一つの方法である。","実際の指導においては，取り上げた文化遺産を通して，それらが我が国の先人の工夫や努力によって生み出されたものであることや，自分たちの祖先によって現在まで大切に受け継がれてきたこと，それらは我が国の伝統や文化の特色や現在の自分たちの生活や文化の源流などを考える上で欠かすことのできない高い価値をもっていることを具体的に理解できるようにするとともに，我が国の伝統や文化を大切にしようとする態度を育てるようにすることが大切である。","内容の取扱いの(2)のウは，人物の働きを中心とした学習を進める上で，内容の(2)のアからコに示した歴史上の主な事象との関連を考慮して，取り上げる人物を例示したものである。","具体的には，歴史学習のアからコまでの10項目に示した歴史的事象に関連して，国家及び社会の発展に大きな働きをした代表的な人物を，政治，文化などの分野から取り上げて，合計42名を例示している。","実際の指導においては，これらの人物を取り上げ，その働きを通して指導を行うことが適切であると考えられる。しかし，これらは例示として示しているものであり，指導のねらいを実現できるのであれば，例示した人物に代えて，他の人物を取り上げることも可能である。その際には，内容の取扱いの(2)のアに示された精選の趣旨を踏まえるよう配慮する必要がある。","内容の取扱いの(2)のエは，内容の(2)のアにおいて，「神話・伝承」について指導する際の出典の範囲及びそれの取り上げ方を示したものである。","ここで取り上げる「神話・伝承」については，「古事記，日本書紀，風土記など」の中から，国の形成に関する考えを学習する上で適切なものを取り上げることを示している。","古事記，日本書紀，風土記などには，国が形成されていく過程に関する考え方をくみ取ることのできる，高天原神話，天孫降臨，出雲国譲り， 神武天皇の東征の物語，九州の豪族や関東などを平定した日本 武 尊の物語などが記述されている。","ここでの指導に当たっては，これらの神話・伝承の中から児童が興味や関心をもつことのできるものを取り上げ，国の形成に関する当時の人々の考え方などに関心をもつように指導することが大切である。","内容の取扱いの(2)のオは，世界の国々との関わりが深い歴史上の主な事象について調べる際の指導の配慮事項を示したものである。例えば，イのイの「大陸文化の摂取」，イのエの「元との戦い」，イのカの「キリスト教の伝来」，イのケの「黒船の来航」，イのコの「日清・日露の戦争」，イのサの「日中戦争や我が国に関わる第二次世界大戦」を取り上げる際には，当時の世界の動きが大まかに分かる地図などの資料を用いるようにすることが考えられる。","内容の取扱いの(2)のカは，歴史上の事象について調べまとめる技能を身に付ける際の配慮事項を示したものである。年表については，出来事が生じた時期や歴史の展開を捉える上で手掛かりとなる資料であることを指導するとともに，その読み方を確実に身に付けるようにすることが大切である。また，絵画などの資料については，資料の特性に留意して調べることができるようにすることが大切である。例えば，遺跡や遺物については，当時の人々の生活の様子を探る上で参考になる資料であること，絵画については，当時または後の時代に作成者が意図をもって描いた資料であり，事象について考える手掛かりになる資料であることなど，各々の資料の特性に留意させることなどが大切である。","内容の取扱いの(2)のキは，小学校の歴史学習全体を通して配慮すべき事項を示したものである。指導に当たっては，アのアからサまでに示されている事項の全てを通して，我が国が歩んできた大まかな歴史を理解できるようにする。その際，我が国は遠い祖先からの長い歴史をもち，その間，私たちの祖先は世界に誇ることのできる，日本固有の伝統や文化を育んできたこと，また，我が国の歴史について，狩猟・採集や農耕の生活，大和朝廷（大和政権）による統一以降，政治の中心地や世の中の様子などに着目すると幾つかの時期に区分することができることに気付くようにすることが大切である。","また，取り上げる歴史上の事象と人物の働きや代表的な文化遺産を関連させ，我が国の伝統や文化が長い歴史を経て築かれてきたものであること，そうした遠い祖先の生活や，人々の工夫や努力が今日の自分たちの生活と深く関わっていることに気付くことができるようにすることが大切である。なお，その際，「アイヌ民族を先住民族とすることを求める決議」（平成20年６月６日衆・参議院本会議），「アイヌ文化の復興等を促進するための民族共生象徴空間の整備及び管理運営に関する基本方針について」（平成26年６月13日閣議決定（平成29年６月27日一部変更））を踏まえ，現在の北海道などの地域における先住民族であるアイヌの人々には独自の伝統や文化があることに触れるようにする。また，現在の沖縄県には琉球の伝統や文化があることにも触れるようにする。それらの伝統や文化は長い歴史の中で育まれてきたことに気付くようにする。","さらに，自然災害からの復興，少子高齢化の問題，環境問題，日本人拉致問題，領土問題など，国内外に残されている課題等にも触れ，これからの国際社会における我が国の在り方について考えるようにすることも大切である。","こうした学習を通して，我が国の歴史を学ぶ意味を考えるとともに，歴史に対する理解を深め，興味・関心を高めるようにする。"],"blocks":[{"intro":["この内容は，「歴史と人々の生活」に区分される内容であり，我が国の歴史上の主な事象についての学習で身に付ける事項を示している。我が国の歴史上の主な事象とは，我が国の歴史の進展に大きな影響を与えた各時期の代表的な歴史上の事象のことである。具体的には内容(2)のアのアからサまでに示された歴史上の事象を指しており，我が国の歴史を学習する際に調べる対象のことである。","我が国の歴史上の主な事象に関する内容については，アのアからサまでの各項目とアのシ及びイのアを，それぞれ関連付けて指導する。例えば，世の中の様子，人物の働きや代表的な文化遺産などに着目して，遺跡や文化財，地図や年表などの資料で調べ，まとめ，我が国の歴史上の主な事象を捉え，我が国の歴史の展開を考え，表現することを通して，大まかな歴史を理解するとともに，関連する先人の業績，優れた文化遺産を理解できるようにすることである。また，歴史を学ぶ意味を考え，表現できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アの前文及びアからサまでは，知識に関わる事項である。","前文では，歴史学習全体を通して，我が国の歴史の進展に大きな影響を与えたアからサまでの代表的な歴史上の事象を手掛かりに，我が国が歩んできた大まかな歴史を理解するとともに，それらの事象に関連する先人の業績，優れた文化遺産を理解することである。","我が国の歴史上の主な事象を手掛かりにするとは，アからサまでに示されている各時代の典型的な歴史上の事象や関連する人物，代表的な文化遺産についての知識を習得し，その知識を基に考えるようにすることである。","大まかな歴史を理解することとは，政治の中心地や世の中の様子によって分けたいくつかの時期における世の中の動きを人物の業績や優れた文化遺産を通して捉え，我が国が歩んできた歴史を大まかに理解することである。従って，小学校では歴史を通史として事象を網羅的に取り扱うものではないことに留意する必要がある。","関連する先人の業績，優れた文化遺産を理解することとは，我が国が歩んできた歴史の中で，その時期の世の中の様子を形づくったり，国家や社会の変化に大きな影響を及ぼしたりした先人の働きとともに，各時代の人々によって生み出され，今日まで保存・保護されてきた文化遺産の大切さを理解することである。","アのシは，技能に関わる事項である。","遺跡や文化財，地図や年表などの資料で調べ，まとめることとは，歴史学習を通して身に付ける調べ方や，調べたことを表現する学習の仕方を示している。遺跡や文化財については，地域の博物館や資料館等を活用したり，学芸員から話を聞いたりして調べること，地図や年表などの資料については，歴史上の事象について，分布や経路などを表した地図や，出来事の経緯を示した年表，事象や出来事の様子を書き記した資料などで調べることを示している。また，歴史上の事象について調べたことや考えたこと，理解したことを整理してまとめることを示している。このような調べ方やまとめ方を繰り返しつつ，歴史上の事象を適切に調べまとめる技能を身に付けるようにすることが大切である。このほか，資料については，人物の肖像画や伝記，エピソード（逸話）などによって人物への関心や調べる意欲を高めることも考えられる。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","世の中の様子，人物の働きや代表的な文化遺産などに着目して，我が国の歴史上の主な事象を捉え，我が国の歴史の展開を考えるとともに，歴史を学ぶ意味を考え，表現することとは，社会的事象の見方・考え方を働かせ，我が国の歴史上の主な事象について，例えば，世の中の様子，人物の働きや代表的な文化遺産などに関する問いを設けて調べたり，歴史の展開や歴史を学ぶ意味を考えたりして，調べたことや考えたことを表現することである。","世の中の様子に着目するとは，例えば，いつから始まったか，どのような世の中だったか，どのように発展したかなどの問いを設けて，アのアからサまでに示されたそれぞれの時期における国家・社会の様子について調べることである。","人物の働きに着目するとは，例えば，その人物はどのようなことをしたか，なぜそうしたか，社会や人々にどのような影響を与えたかなどの問いを設けて，国家・社会の発展や優れた文化遺産を生み出すことに貢献した先人の働きについて調べることである。なおアからコまでに示された歴史上の事象を調べる際には，内容の取扱いの(2)のウに示された，事象と関わりの深い人物の働きを中心にして具体的に調べるようにする。","代表的な文化遺産に着目するとは，例えば，誰がいつ頃作ったか，何のために作ったか，歴史上どのような意味や価値があるかなどの問いを設けて，我が国の代表的な文化遺産について調べることである。その際，内容の取扱いの(2)のイに示された，国宝，重要文化財に指定されているものや日本遺産に認定されているもの，世界文化遺産に登録されているものなど，国家・社会の発展を象徴する優れた文化遺産について調べることが考えられる。これらの文化遺産については，歴史上の主な事象や人物の働きとの関連に配慮して児童が理解しやすいものを選択して取り上げ，具体的に調べることができるようにする。また，人々の工夫や努力によって生み出され，今日に至るまで保存，継承されてきたことの意味を考えるようにすることが大切である。","このようにして，我が国の歴史上の主な事象を捉えることができるようにする。","我が国の歴史の展開を考えるとともに，歴史を学ぶ意味を考え，表現するとは，例えば，調べた歴史上の主な事象を関連付けたり総合したりして，世の中の様子や国家・社会の変化，歴史を学ぶ意味などを考えたりして，文章で記述したり，年表や図表などにまとめたことを基に説明したりすることである。歴史を学ぶ意味を考えるとは，歴史学習の全体を通して，歴史から何が学べるか，歴史をなぜ学ぶのかなど歴史を学ぶ目的や大切さなどについて考えることである。例えば，我が国の伝統や文化は長い歴史の中で育まれてきたことを踏まえ，過去の出来事は現代とどのような関わりをもっているかなど過去の出来事と今日の自分たちの生活や社会との関連や，歴史から学んだことをどのように生かしていくかなど国家及び社会の発展を考えることである。","その際，今日の自分たちの生活は，長い間の我が国の歴史や先人たちの働きの上に成り立っていることや，遠い祖先の生活が自分たちの生活と深く関わっていることなどを理解できるようにし，自分たちもこれからの歴史の担い手となることや，平和で民主的な国家及び社会を築き上げることについて，考えを深めるようにすることが大切である。","実際の指導に当たっては，我が国の歴史は各時期において様々な課題の解決や人々の願いの実現に向けて努力した先人の働きによって発展してきたことを理解できるようにし，我が国が発展してきた基盤について考え，我が国の歴史への関心を高めるようにすることが大切である。このことは，我が国の歴史や伝統を大切にして国を愛する心情を育てることにつながるものである。","また，人物の働きや代表的な文化遺産を中心とした学習の効果を高めるためには，内容のアのアからサまでに示した事象を取り扱う授業時数に軽重を付けるなど，単元の構成を工夫する必要がある。"],"letters":""},{"intro":["この内容は，「くに」としての我が国の歴史が形づくられるまでの学習で身に付ける事項を示している。ここでは，狩猟・採集や農耕の生活，古墳，大和朝廷（大和政権）による統一の三つの事象を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのアは，知識に関わる事項である。","狩猟・採集や農耕の生活については，貝塚や集落跡などの遺跡，土器などの遺物や，水田跡の遺跡や農具などの当時の遺物が残されていること，日本列島では長い期間，豊かな自然の中で狩猟や採集の生活が営まれていたこと，大陸から稲作が伝えられ農耕が始まると，人々は耕地の近くに定住してむらを作るようになったことなどが分かることである。","古墳については，古墳の規模やその出土品，古墳の広がりなどが分かることである。","大和朝廷（大和政権）による統一の様子については，各地に支配者が現れ，有力豪族を中心とした大和朝廷によって大和地方を中心とした地域の統一が進められたことなどが分かることである。なお，大和朝廷については，その成立や展開の時期を広く捉える観点から大和政権とも呼ばれていることに触れるようにする。","これらのことを手掛かりに，世の中の様子がむらからくにへと変化したことを理解できるようにする。","その際，神話・伝承を手掛かりに，国の形成に関する考え方などに関心をもつこととは，国の形成や地域の統一の様子を物語る神話・伝承を取り上げ，当時の人々のものの見方や考え方に関心をもつようにすることを意味している。神話・伝承には，児童が興味をもちやすい物語が多く見られ，それらを活用し，我が国の歴史に対し一層親しみをもてるようにすることが大切である。","アのシは，技能に関わる事項である。","例えば，貝塚や集落跡などの遺跡，土器などの遺物について，地域にある博物館や資料館などを利用して調べたり，身近な地域に残されている古墳を観察・見学したり，当時の様子や人物の働きなどを資料で調べたりして，年表などにまとめることなどが考えられる。ここでは，博物館や資料館などを見学して適切に情報を集める技能，年表などの資料から出来事やその時期の情報を読み取る技能，調べたことを年表などに適切に整理する技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，人々はどのような生活をしていたか，世の中の様子はどのように変わったか，どのように力を伸ばし国を治めたかなどの問いを設けて，狩猟・採集の生活や農耕が始まった頃の生活の様子，古墳の出現と広がり，大和朝廷（大和政権）の支配の広がりについて調べ，これらの事象を比較したり関連付けたりして，世の中の様子の変化を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，遺跡や遺物などを調べて，狩猟・採集や農耕の生活をしていたころの人々の生活や社会の様子を考える学習，卑弥呼が治めたと言われる邪馬台国の様子を想像して当時の社会を考える学習，身近な地域や国土に残る古墳について調べ，豪族や大和朝廷（大和政権）の力を想像する学習，神話・伝承を調べて国の形成について当時の人々のものの見方や考え方に関心をもつようにする学習などが考えられる。"],"letters":"ア"},{"intro":["この内容は，聖徳太子が政治を行った頃から聖武天皇が国を治めた頃までの学習で身に付ける事項を示している。ここでは，大陸文化の摂取，大化の改新，大仏造営の様子の三つの事象を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのイは，知識に関わる事項である。","大陸文化の摂取については， 聖徳太子が法隆寺を建立し，小野妹子らを遣隋使として隋（中国）に派遣することにより，政治の仕組みなど大陸文化を積極的に摂取しようとしたことなどが分かることである。","大化の改新については，中大兄皇子や中臣鎌足によって政治の改革が行われたことや，天皇中心の新しい国づくりを目指したことなどが分かることである。","大仏造営については，聖武天皇の発案の下，行基らの協力により国家的な大事業として東大寺の大仏が造られ，天皇を中心とする政治が都だけでなく広く全国に及んだことや，聖武天皇の願いにより鑑真が来日し，仏教の発展に大きな働きをしたことなどが分かることである。","これらのことを手掛かりに，天皇を中心とした政治が確立されたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，遣隋使の航路や正倉院の宝物が渡来した経路を世界地図などの資料で調べてまとめたり，大化の改新や大仏造営の様子などを資料で調べて年表などにまとめたりすることが考えられる。ここでは，地図などの資料で歴史上の出来事の位置や広がりなどを読み取る技能，調べたことを白地図や年表などに適切に整理する技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，聖徳太子はどのような国づくりを進めたか，国づくりには聖武天皇のどのような願いが込められていたかなどの問いを設けて，大陸文化を取り入れた政治の様子，大化の改新を経て進められた天皇中心の政治の様子，大仏造営に込められた聖武天皇の願いや造営の様子について調べ，これらの事象を関連付けたり総合したりして，この頃の世の中の様子を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，聖徳太子の肖像画やエピソードなどからその人となりを想像する学習，大仏の大きさから天皇の力を考えたり，大仏造営を命じた詔から聖武天皇の願いを考えたりする学習などが考えられる。"],"letters":"イ"},{"intro":["この内容は，京都に都が置かれた頃の貴族の生活や文化についての学習で身に付ける事項を示している。"],"k":["アは，「知識及び技能」に関わる事項である。","アのウは，知識に関わる事項である。","貴族の生活や文化については，貴族の屋敷の様子や藤 原道長に代表される貴族の生活の様子，紫式部や清少納言が我が国独自のかな文字を使って優れた文学作品をつくり出したこと，貴族の生活の様子を描いた大和絵などがつくられたことなどが分かることである。","これらのことを手掛かりに，京都に都が置かれた頃，日本風の文化が生まれたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，貴族の暮らしの様子や，紫式部や清少納言の活躍などを資料で調べ，まとめることが考えられる。ここでは，絵画などの資料から生活や文化に関する情報を適切に読み取る技能，調べたことをまとめる技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，貴族はどのような生活をしていたか，どのような作品を残したかなどの問いを設けて，この頃の貴族の服装や建物，日常の生活や行事などの様子や紫式部や清少納言の作品について調べ，これらの事象を関連付けたり総合したりして，この頃の文化の特色を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，十二単や貴族の服装などから貴族の生活の様子を想像する学習，寝殿造の屋敷における貴族の生活の様子を調べる学習，当時の貴族が行っていた，現在にまで受け継がれている年中行事を調べる学習などが考えられる。"],"letters":"ウ"},{"intro":["この内容は， 源 頼朝が平氏打倒の兵を挙げた頃から鎌倉に幕府が置かれた頃までの学習で身に付ける事項を示している。ここでは，源平の戦い，鎌倉幕府の始まり，元との戦いの三つの事象を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのエは，知識に関わる事項である。","源平の戦いについては，力を付けてきた源氏と平氏が戦い，源 義経の働きもあって源氏が勝利し，大きな力をもつようになったことなどが分かることである。","鎌倉幕府の始まりについては，朝廷から認められ全国に守護や地頭を置いた 源 頼朝が鎌倉に幕府を開き，武士による政治の仕組みをつくり上げたことなどが分かることである。元との戦いについては，北 条時宗が九州の御家人を中心に全国の武士を動員し，元の攻撃を退けたこと，幕府が全国的に力をもってきたことなどが分かることである。","これらのことを手掛かりに，鎌倉に幕府が置かれた頃，武士による政治が始まったことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，源平の戦いが行われた場所や鎌倉幕府が開かれた場所，守護や地頭の配置，元との戦いの様子を日本地図や世界地図などの資料で調べ，年表や白地図などにまとめることが考えられる。ここでは，地図などの資料で歴史上の出来事の位置や広がりなどを読み取る技能，調べたことを白地図や年表などに適切に整理する技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，源氏と平氏はどのような戦いをしたか， 源 頼朝はどのような政治の仕組みを作ったかなどの問いを設けて，武士が台頭してきたことや源平の戦いの様子，鎌倉幕府の政治の仕組み，元との戦いについて調べ，これらの事象を関連付けたり総合したりして，この頃の世の中の様子を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，源平の戦いにおける 源 義経の活躍の様子やエピソードを調べる学習，人物年表，エピソードから 源 頼朝の業績について考える学習，元との戦いの様子から武士の戦いの様子を調べる学習などが考えられる。"],"letters":"エ"},{"intro":["この内容は，京都の室町に幕府が置かれた頃の学習で身に付ける事項を示している。ここでは，代表的な建造物や絵画を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのオは，知識に関わる事項である。","京都の室町に幕府が置かれた頃の代表的な建造物については，足利義満は金閣を，足利義政は銀閣を，それぞれ建てたこと，それらは現在も保存されていること，銀閣の東求堂の書院造といわれる部屋のつくりには，ふすまや畳，違い棚などが作られていたこと，それらは現在の和風建築に生かされていることなどが分かることである。","京都の室町に幕府が置かれた頃の代表的な絵画については，雪舟により我が国の水墨画を代表する作品が生み出されたこと，それらの中には国宝に指定され現在も保存されているものがあること，水墨画は現在も人々に親しまれていることなどが分かることである。","これらのことを手掛かりに，京都の室町に幕府が置かれた頃，今日の生活文化につながる室町文化が生まれたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，金閣や銀閣などの建造物を比較したり，雪舟によって描かれた水墨画の複数が国宝に指定されていることやそれらを鑑賞してその独自性やよさを調べたりして，まとめることが考えられる。ここでは，写真や絵画などの資料を比べたり結び付けたりして，文化に関する情報を適切に読み取る技能，調べたことをまとめる技能などを養うようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，誰がつくった建造物か，誰が描いた絵画か，この頃の文化にはどのような特色があるか，今に受け継がれているものにどのようなものがあるかなどの問いを設けて，金閣や銀閣などの建造物や水墨画などの絵画や今に受け継がれる文化について調べ，これらの事象を関連付けたり総合したりして，この頃の文化の特色を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，書院造の影響を受けている伝統的な家屋を観察して，この頃の文化に関心をもつようにすることなどが考えられる。また，この頃に生まれた能，茶の湯，生け花，盆踊りなども，今なお多くの人々に親しまれていることを関連的に取り上げることも考えられる。"],"letters":"オ"},{"intro":["この内容は，戦国大名の群雄割拠の状態から，豊臣秀吉が全国統一をした頃までの学習で身に付ける事項を示している。ここでは，キリスト教の伝来，織田・豊臣の天下統一の二つの事象を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのカは，知識に関わる事項である。","キリスト教の伝来については，ザビエルによってキリスト教が伝えられ我が国に広がったことなどが分かることである。","織田・豊臣の天下統一については，ポルトガル人によって日本に伝えられた鉄砲を多用するなどして織田信長が短い期間に領地を拡大したこと，豊臣秀吉が検地や刀狩などの政策を行ったことなどが分かることである。","これらのことを手掛かりに，群雄割拠の状態から戦国の世が統一されたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，キリスト教の伝来の様子を世界地図などの資料で調べたり，織田信長と豊臣秀吉の働きを比べたり結び付けたりして調べ，年表にまとめることが考えられる。ここでは，複数の人物の業績に関する情報を比べたり結び付けたりしながら読み取る技能，調べたことを年表などに適切に整理する技能を身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，当時の世の中はどのような様子だったか，織田信長や豊臣秀吉らはどのようにして力を伸ばしたか，どのような政策を進めたかなどの問いを設けて，ザビエルが日本にキリスト教を伝えたことや，織田信長が勢力を伸ばした様子，豊臣秀吉が検地や刀狩りなどの政策を進め天下を統一した様子について調べ，これらの事象を関連付けたり総合したりして，戦国の世の統一に果たした織田信長，豊臣秀吉の役割を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，戦い方を工夫しながら勢力を伸ばした織田信長による天下統一への様子を調べる学習，検地や刀狩の資料から豊臣秀吉の政策の意図を考える学習，取り上げた人物のエピソードから業績を考える学習などが考えられる。また，キリスト教の伝来などを扱う際に，地図などを用いて，我が国の歴史上の事象をより広い視野から捉えることができるよう配慮することが大切である。"],"letters":"カ"},{"intro":["この内容は，江戸幕府が政治を行った頃の学習で身に付ける事項を示している。ここでは，江戸幕府の始まり，参勤交代，鎖国などの幕府の政策，身分制の四つの事象を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのキは，知識に関わる事項である。","江戸幕府の始まりについては徳川家康が関ヶ原の戦いに勝利を収め，その後，江戸幕府を開いたことが分かることである。","参勤交代や鎖国などの幕府の政策については，大名を親藩，譜代，外様の三つに分けて全国に配置したこと，徳川家光の頃に参勤交代が制度として確立したこと，キリスト教の信仰を禁止し，貿易を統制し渡航を禁止するなど海外との交流を制限する政策を進めたことなどが分かることである。","身分制については，武士を中心とする身分制が定着したことなどが分かることである。","これらのことを手掛かりに，江戸幕府が政治を行った頃，武士による政治が安定したことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，大名の配置や参勤交代の経路，出島などを通して交易があった国の名称と位置を日本地図や世界地図などの資料で調べ，まとめることが考えられる。ここでは，地図などの資料で歴史上の事象の位置や地域間のつながりなどを適切に読み取る技能，調べたことをまとめる技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，江戸幕府はどのように始まったか，幕府はどのように世の中を治めたかなどの問いを設けて，関ヶ原の戦い，江戸幕府の大名配置，参勤交代や鎖国などの幕府の政策，武士を中心とした身分制について調べ，これらの事象を関連付けたり総合したりして，江戸幕府の政策の意図や社会の様子を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，徳川家康や徳川家光の人物年表，エピソードなどから，それらの人物の業績を考える学習，大名行列や出島，踏み絵などの資料を活用して江戸幕府の政策を調べる学習などが考えられる。"],"letters":"キ"},{"intro":["この内容は，江戸幕府が政治を行った頃の学習で身に付ける事項を示している。","ここでは，歌舞伎や浮世絵，国学や蘭学の二つの事象を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのクは，知識に関わる事項である。","歌舞伎や浮世絵については，近松門左衛門などによって生み出された歌舞伎の作品が数多く演じられ，それを人々が楽しんで鑑賞していたことや，歌川広重などによって描かれた作品が人々に親しまれたことなどが分かることである。","国学や蘭学については，本居宣長が我が国の古典を研究し，国学の発展に重要な役割を果たしたこと，杉田玄白らがオランダ語の医学書を翻訳して『解体新書』を著したこと，伊能忠敬が全国を測量して精密な日本地図を作ったことなどが分かることである。","これらのことを手掛かりに，江戸幕府が政治を行った頃，町人の文化が栄え新しい学問がおこったことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，歌舞伎や浮世絵の作品，『解体新書』や日本地図などの学問の成果などを資料で調べ，それらをまとめることが考えられる。ここでは，当時の作品などの資料から文化や学問に関する情報を適切に読み取る技能，調べたことをまとめる技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，歌舞伎や浮世絵はどのような人々に親しまれていたか，国学や蘭学はどのような学問だったのか，どのようにして作り上げたのかなどの問いを設けて，歌舞伎や浮世絵が町人の間に広がったことや国学や蘭学がおこったことを調べ，これらの事象を関連付けたり総合したりして，この頃に栄えた町人の文化や新しい学問を生み出した人物の業績を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，歌舞伎や浮世絵を楽しむ人々の様子から，それらが町人の間に広がったことを調べたり，室町文化と比較してそれらの特色を考えたりする学習，本居宣長，杉田玄白，伊能忠敬の業績が果たした役割などを考える学習などが考えられる。"],"letters":"ク"},{"intro":["この内容は，幕末から明治の初めの頃の学習で身に付ける事項を示している。ここでは，黒船の来航，廃藩置県や四民平等などの改革，文明開化などの事象を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのケは，知識に関わる事項である。","黒船の来航については，ペリーが率いる米国艦隊の来航をきっかけに我が国が開国したことや江戸幕府の政権返上に伴い勝海舟と西郷隆盛の話し合いにより江戸城の明け渡しが行われたことなどが分かることである。","廃藩置県や四民平等などの改革については，西郷隆盛，大久保利通，木戸孝允らの働きによって明治天皇を中心とした新政府がつくられたこと，明治天皇の名による五箇条の御誓文が発布され新政府の方針が示されたこと，明治政府が行った廃藩置県や四民平等などの諸改革によって近代国家としての政治や社会の新たな仕組みが整ったことなどが分かることである。","文明開化については，福沢諭吉が欧米の思想を紹介するなど欧米の文化が広く取り入れられたことにより人々の生活が大きく変化したことが分かることである。","これらのことを手掛かりに，幕末から明治の初めの頃，我が国が明治維新を機に欧米の文化を取り入れつつ近代化を進めたことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，黒船の来航の様子や明治政府の諸改革などを写真，絵画，世界地図などの資料で調べたり，明治政府に関わる人物などの業績と主な出来事などの関係を年表や図表などにまとめたりすることなどが考えられる。ここでは，写真や絵画などの資料から世の中の様子や人物の業績に関する情報を適切に読み取る技能，調べたことを年表や図表などに適切に整理する技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，どのような背景から黒船が来航したか，黒船の来航を当時の人々はどのように受け止めたか，開国によって人々の生活はどのように変わったか，新政府をつくるために誰がどのように活躍したかなどの問いを設けて，当時の欧米諸国はアジア進出を進めたこと，黒船の来航後に近代化が進み欧米の文化が取り入れられたこと，明治政府は廃藩置県や四民平等など諸改革を行ったことについて調べ，これらの事象を関連付けたり総合したりして，この頃の政治の仕組みや世の中の様子の変化を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，ペリーの肖像画や黒船来航の絵画などから江戸幕府や当時の人々への影響を考える学習，西郷隆盛，大久保利通，木戸孝允などの人物のエピソードや資料などを基に明治政府の諸改革について調べる学習，『学問のすゝめ』を手掛かりとして福沢諭吉が欧米から新しい文化や考え方を取り入れたことを調べる学習などが考えられる。"],"letters":"ケ"},{"intro":["この内容は，明治中・後期から大正期までの学習で身に付ける事項を示している。ここでは，大日本帝国憲法の発布，日清・日露の戦争，条約改正，科学の発展などの事象を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのコは，知識に関わる事項である。","大日本帝国憲法の発布については，国会の開設に備えて板垣退助や大隈重信が政党をつくったこと，伊藤博文が憲法制定に重要な役割を果たしたこと，明治政府が発足後20年ほどで憲法を制定したことなどが分かることである。","日清・日露の戦争については，日清戦争の講和条約の締結で陸奥宗光が大きな働きをしたこと，日露戦争において東郷平八郎が活躍したこと，講和条約の締結において小村寿太郎が大きな働きをしたこと，そして，我が国が厳しい国際社会の環境に置かれた状況において，これらの戦争に勝利を収め，講和条約を結ぶことによって，国の安全を確保することができたことなどが分かることである。その際，これらの戦争では，戦場となった朝鮮半島及び中国において大きな損害を与えたことに触れることが大切である。","条約改正については，幕末に欧米諸国との間で結ばれた不平等な条約を対等なものに改める交渉において，外務大臣であった陸奥宗光や小村寿太郎が大きな働きをし，条約改正に成功したことなどが分かることである。","科学の発展については，野口英世が黄熱病について世界的に注目された研究を行ったことなどが分かることである。","これらのことを手掛かりに，我が国の国力が充実し国際的地位が向上したことを理解できるようにする。","アのシは，技能に関わる事項である。","例えば，明治政府に関わる人物の業績や当時の人々の生活の様子，当時の国際関係などを写真や絵画，世界地図などの資料で調べて，年表などにまとめることが考えられる。ここでは，写真や絵画などの資料から世の中の様子や人物の業績などに関する情報を適切に読み取る技能，調べたことを年表や図表などに適切に整理する技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，どのようにして国力を充実させたか，どのような人物が活躍したかなどの問いを設けて，自由民権運動の進展，大日本帝国憲法の発布や帝国議会の開設，日清・日露の戦争や不平等な条約の改正の経過，科学の分野で優れた業績を上げた人物について調べ，これらの事象を関連付けたり総合したりして，明治政府の意図や世の中の様子の変化を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，伊藤博文が中心となって行った大日本帝国憲法の制定のための取組を調べる学習，日清・日露の戦争や条約改正に関わる主な出来事を年表に整理する学習，陸奥宗光や小村寿太郎の外交努力について調べる学習などが考えられる。"],"letters":"コ"},{"intro":["この内容は，おおむね昭和の時期の学習で身に付ける事項を示している。ここでは，日中戦争や我が国に関わる第二次世界大戦，日本国憲法の制定，オリンピック・パラリンピックの開催などの事象を取り上げる。"],"k":["アは，「知識及び技能」に関わる事項である。","アのサは，知識に関わる事項である。","日中戦争や我が国に関わる第二次世界大戦については，我が国と中国との戦いが全面化したことや，我が国が戦時体制に移行したこと，我が国がアジア・太平洋地域において連合国と戦って敗れたこと，国内各地への空襲，沖縄戦，広島・長崎への原子爆弾の投下など，国民が大きな被害を受けたことが分かることである。また，これらの戦争において，我が国が多くの国々，とりわけアジア諸国の人々に対して多大な損害を与えたことについても触れることが大切である。","日本国憲法の制定については，戦後，平和で民主的な憲法が制定され，我が国が民主的な国家として出発したことなどが分かることである。なお，ここでは，内容の(1)のアの日本国憲法に関する学習と関連付けながら，日本国憲法制定の意義について理解を深めるよう指導するようにする。","オリンピック・パラリンピックの開催については，我が国が国際社会に復帰し，工業が発展し電化製品が普及したことなどにより国民生活が向上したこと，スポーツの祭典としてアジアで初めて東京でオリンピック大会が開催され，その後も我が国でオリンピック・パラリンピックの大会が開催されたこと，そうした中で我が国は国際社会において重要な役割を果たしてきたことなどが分かることである。なお，1964年には東京オリンピックに続き，第２回パラリンピックが東京で開催されたことにも触れ，戦後，我が国はスポーツを通した世界平和の実現に貢献してきたことに気付くようにすることも大切である。","これらのことを手掛かりに，戦後我が国は民主的な国家として出発し，国民生活が向上し，国際社会の中で重要な役割を果たしてきたことを理解できるようにする。その際，アからサまでに示されている事項を通して歴史学習全体を振り返り，我が国が歩んできた大まかな歴史や，関連する先人の業績や優れた文化遺産についての理解を深めるようにすることも考えられる。","アのシは，技能に関わる事項である。","例えば，当時の国民生活の様子を知る人への聞き取り調査や，戦争の広がりを世界地図や写真などの資料で調べ，年表などにまとめることが考えられる。ここでは，聞き取り調査で必要な情報を集める技能，地図や年表などの資料から事象の広がりや経過などを適切に読み取る技能，調べたことを年表や図表などに適切に整理する技能などを身に付けるようにすることが大切である。"],"s":["イのアは，「思考力，判断力，表現力等」に関わる事項である。","ここでは，社会的事象の見方・考え方を働かせ，例えば，戦争はどのように広がったか，人々の暮らしはどのように変わったか，世界との関わりはどのように変わったかなどの問いを設けて，日中戦争や我が国に関わる第二次世界大戦の広がりの様子，戦争の長期化や戦線の拡大に伴う国民生活への影響，各地への空襲，沖縄戦，広島・長崎への原子爆弾の投下などにより国民が受けた大きな被害，日本国憲法の制定，オリンピック・パラリンピックの開催などについて調べ，これらの事象を関連付けたり総合したりして，我が国の政治や国民生活が大きく変わったことや，我が国が国際社会において果たしてきた役割を考え，文章で記述したり説明したりすることが考えられる。","実際の指導に当たっては，例えば，学校図書館や公共図書館，博物館や資料館などを利用したり，地域の高齢者に当時の話を聞いたりする活動を取り入れ，児童が自ら資料を活用したり調査したりする学習が考えられる。"],"letters":"サ"}]}},"shakai-6-X-3":{"page":128,"name":"グローバル化する世界と日本の役割","expl":{"intro":["この内容は，主として「現代社会の仕組みや働きと人々の生活」に区分されるものであり，グローバル化する世界と日本の役割についての学習で身に付ける事項を示している。グローバル化する世界と日本の役割とは，世界の国の人々と相互に理解を深め合い，平和な国際社会の実現を目指して，我が国がグローバル化する国際社会の中で果たしている重要な役割を指している。","そのためこの内容は，我が国とつながりの深い国の人々の生活に関する内容と国際連合の働きや我が国の国際協力に関する内容から構成されている。我が国とつながりの深い国の人々の生活に関する内容については，アのア及びウとイのアを関連付けて指導する。例えば，外国の人々の生活の様子などに着目して，地図帳や地球儀，各種の資料で調べ，まとめ，日本の文化や習慣との違いを捉え，国際交流の果たす役割を考え，表現することを通して，我が国と経済や文化などの面でつながりが深い国の人々の生活は多様であることを理解するとともに，スポーツや文化などを通して他国と交流し，異なる文化や習慣を尊重し合うことが大切であることを理解できるようにすることである。","また，国際連合の働きや我が国の国際協力に関する内容については，アのイ及びウとイのイを関連付けて指導する。例えば，地球規模で発生している課題や世界の国々が抱えている課題，それらの解決に向けた連携・協力などに着目して，地図帳や地球儀，各種の資料で調べ，まとめ，国際連合の働きや我が国の国際協力の様子を捉え，国際社会において我が国が果たしている役割を考え，表現することを通して，我が国は，平和な世界の実現のために国際連合の一員として重要な役割を果たしたり，諸外国の発展のために援助や協力を行ったりしていることを理解できるようにすることである。"],"k":["アは，「知識及び技能」に関わる事項である。","アのア及びイは，知識に関わる事項である。","アのアの我が国と経済や文化などの面でつながりが深い国の人々の生活は多様であることを理解することとは，外国の文化や習慣を背景とした人々の生活の様子には違いがあること，その違いがその国の文化や習慣を特徴付けていることなどを基に，世界の人々の生活は多様であることについて理解することである。","また，スポーツや文化などを通して他国と交流し，異なる文化や習慣を尊重し合うことが大切であることを理解することとは，オリンピック・パラリンピックをはじめとした国際的なスポーツ交流，様々な文化を通した国際交流が行われていることなどを基に，異なる文化や習慣を尊重し合うことの大切さについて理解することである。","アのイの我が国は，平和な世界の実現のために国際連合の一員として重要な役割を果たしたり，諸外国の発展のために援助や協力を行ったりしていることを理解することとは，国際連合は，平和な国際社会の実現のための大きな役割を果たしていること，我が国は，国際連合の一員としてユニセフやユネスコの活動に協力していることなど，平和な国際社会の実現のために大きな役割を果たしていることや，我が国が教育や医学，農業などの分野で諸外国の発展に貢献していること，今後も国際社会の平和と発展のために果たさなければならない責任と義務があることなどを基に，グローバル化する国際社会における我が国の役割について理解することである。","アのウは，技能に関わる事項である。","地図帳や地球儀，各種の資料で調べ，まとめることとは，グローバル化する世界と日本の役割について，地図帳や地球儀を用いて，取り上げる国や地域の名称と位置などを調べたり，学校図書館や公共図書館，コンピュータなどの活用，留学生や地域に住む外国人，国際交流活動や国際協力活動に参加した人などへの聞き取り調査などにより，外国の人々の生活の様子を調べたりして，まとめることである。ここでは，地図帳や地球儀を用いて，国や地域の位置，日本との位置関係などを適切に読み取る技能，調べたことを適切にまとめる技能を身に付けるようにすることが大切である。"],"s":["イは，「思考力，判断力，表現力等」に関わる事項である。","イのアの外国の人々の生活の様子などに着目して，日本の文化や習慣との違いを捉え，国際交流の果たす役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，日本の文化や習慣との違いについて，例えば，その国の人々の生活や文化にはどのような特色があるか，その国の人々の生活にはどのような習慣が見られるかなどの問いを設けて調べたり，互いの国の文化や習慣を理解し合うための国際交流の役割を考えたりして，調べたことや考えたことを表現することである。","外国の人々の生活の様子に着目するとは，貿易や経済協力などの面，歴史や文化，スポーツの交流などの面でつながりが深い国の人々の衣服や料理，食事の習慣，住居，挨拶の仕方やマナー，子供たちの遊びや学校生活，気候や地形の特色に合わせたくらしの様子，娯楽，国民に親しまれている行事などの生活の様子について調べることである。これらの学習を通して異なる文化や習慣を理解し関心を深めるようにすることは，外国の人々の物事の捉え方や考え方を理解し，尊重することにつながるものである。このようにして調べたことを手掛かりに，日本の文化や習慣との違いを捉えることができるようにする。","国際交流の果たす役割を考え，表現することとは，例えば，世界の国々の文化や習慣は多様であることとスポーツや文化などを通して他国と交流することを関連付けて，異なる文化を相互に理解するために果たしている国際交流の役割を考え，レポートなどにまとめたり，根拠や理由を明確にして議論したりすることである。","イのイの地球規模で発生している課題の解決に向けた連携・協力などに着目して，国際連合の働きや我が国の国際協力の様子を捉え，国際社会において我が国が果たしている役割を考え，表現することとは，社会的事象の見方・考え方を働かせ，国際連合の働きや我が国の国際協力の様子について，例えば，世界ではどのような課題が発生しているか，国際連合や我が国は課題を解決するためにどのような連携や協力を行っているかなどの問いを設けて調べたり，地球規模で発生している課題とその解決のための連携や協力の様子を関連付けて，我が国が果たしている役割を考えたりして，調べたことや考えたことを表現することである。","地球規模で発生している課題の解決に向けた連携・協力に着目するとは，紛争，環境破壊，飢餓，貧困，自然災害，人権など国境を越えた課題，その解決のための国際連合の働きや我が国の国際協力の様子について調べることである。その際，国際紛争を避ける努力や国と国との安全保障の大切さにも触れるようにする。このようにして調べたことを手掛かりに，国際連合の働きや我が国の国際協力の様子を捉えることができるようにする。","国際社会において我が国が果たしている役割を考え，表現することとは，例えば，地球規模で発生している課題の解決策と我が国の国際協力の様子を関連付けて，我が国が国際社会において果たしている役割を考え，文章で記述したり，根拠や理由を明確にして議論したりすることである。","実際の指導に当たっては，学習が具体的に展開できるよう，外国語科の学習などとの関連を図り，そこで出会った外国人を招いて話を聞く活動や，地域に住む留学生や外国で生まれ育った人などとの交流，青年海外協力隊の元隊員などから話を聞く活動などが考えられる。また，外国の人々の生活の様子については，児童が調べた国について，相互に交流し合う活動を取り入れたり，取り上げた国々と日本との国際交流の様子などを取り上げたりして，文化や習慣が多様であることや人間としての願いが共通であることなどを考える学習などが考えられる。"],"t":["内容の取扱いの(3)のアは，内容の(3)のアのア及びイにおける国旗と国歌の指導について，それを取り扱う際の配慮事項を示したものである。","内容の(3)のアのアの世界の国の人々の生活，アのイの国際連合や我が国の国際協力に関わる学習においては，国旗と国歌について関連して指導するようにする。","国旗と国歌の指導については，国際社会においては，国旗と国歌が重んじられていることに気付かせるとともに，我が国の国旗と国歌の意義を理解させ，これを尊重する態度を養うことが大切である。また，諸外国の国旗と国歌についても同様にこれを尊重する態度を養い，国際社会に生きる日本人としての自覚と資質を育成することが大切である。","国旗と国歌の意義については，第３学年及び第４学年，第５学年における国旗に関わる指導の上に立って，次のような事柄について理解できるようにする必要がある。","① 国旗と国歌はいずれの国ももっていること。","② 国旗と国歌はいずれの国でもその国の象徴として大切にされており，互いに尊重し合うことが必要であること。","③ 我が国の国旗と国歌は，それぞれの歴史を背景に，長年の慣行により，「日章旗」が国旗であり，「君が代」が国歌であることが広く国民の認識として定着していることを踏まえて，法律によって定められていること。","④ 我が国の国歌「君が代」は，日本国憲法の下においては，日本国民の総意に基づき天皇を日本国及び日本国民統合の象徴とする我が国の末永い繁栄と平和を祈念した歌であること。","また，国歌「君が代」については，音楽科における指導との関連を重視するとともに，入学式や卒業式などにおける国旗や国歌の指導などとも関連付けながら指導することが大切である。","内容の取扱いの(3)のイは，内容(3)のアのアについて指導する際の配慮事項について示したものである。","ここでは，我が国と経済や文化などの面でつながりの深い国から，教師が３か国程度を取り上げ，その中から児童一人一人が自らの興味・関心や問題意識に基づいて１か国を選択して主体的に調べることができるようにすること，それぞれの児童が選択して調べた国の人々の生活の違いなどから，文化や習慣には多様性が見られることについて具体的に考え理解できるように配慮することが大切である。その際，取り上げる国が特定の地域に偏らないように配慮することが大切である。また，児童が選んだ国によって調べる資料の量などに大きな違いが生じることのないよう，個に応じた適切な指導を心掛けるようにする。","内容の取扱いの(3)のウは，内容(3)のアのアについて指導する際の配慮事項について示したものである。","ここでは，それぞれの児童が選択して調べた国の人々の生活などについて互いに発表し，考えたことを話し合う学習活動を位置付けることなどにより，外国の人々の生活や文化の違いに触れ，その違いを理解し尊重することが，外国の人々と共に生きる上で大切であることを考えることができるようにする。その際，これまでの学習で身に付けた自国に対する理解との関連を図りながら，多様な文化を適切に理解できるように配慮する必要がある。その上で，我が国や諸外国の伝統や文化を尊重しようとする態度を養うようにすることが大切である。","内容の取扱いの(3)のエは，内容のイについて指導する際の配慮事項について示したものである。","ここでは，世界の国の人々の生活，国際連合や我が国の国際協力について学習したことを基に，グローバル化する国際社会において，今後，我が国が果たすべき役割，義務や責任について，過去の戦争や原爆による人類最初の災禍を経験した我が国の立場，国際的な協力や援助を必要としている国や地域の人々などの立場，国際連合など国際的な機関の立場などから多角的に考えたり，世界の人々と共に生きていくために大切なことについて，自分たちにできることを考えたり選択・判断したりして，世界の平和に向けた自分の考えをまとめるようにすることが大切である。","内容の取扱いの(3)のオは，内容の(3)のイのイについて指導する際の配慮事項について示したものである。","「国際連合の働き」について指導する際には，児童にとって身近なユニセフやユネスコの活動を取り上げて具体的に調べることができるよう配慮する必要がある。「我が国の国際協力の様子」については，教育，医学，農業など様々な分野で技術者を海外に派遣したり，国内に海外からの研修生を受け入れたりしている事例を取り上げることが考えられる。それらを具体的に調べることを通して，国際社会における我が国の役割を具体的に考えるようにする。","こうした学習を通して，過去の戦争や原爆による人類最初の災禍などの経験を生かし，国際社会の平和と発展のために，我が国や日本人が今後果たさなければならない責任と義務があることに気付くようにするとともに，世界平和の大切さと我が国が世界において重要な役割を果たしていることを考えることができるようにすることが大切である。","第６学年においては，内容の(1)から(3)までを通して，社会的事象について，学習問題を主体的に解決しようとする態度や，よりよい社会を考え学習したことを社会生活に生かそうとする態度を養うとともに，多角的な思考や理解を通して，我が国の歴史や伝統を大切にして国を愛する心情，我が国の将来を担う国民としての自覚や平和を願う日本人として世界の国々の人々と共に生きることの大切さについての自覚を養うようにすることが大切である。"]}}}},"trowNote":"行は、つながりマップのテーマ（Claudeが学習指導要領の内容から作ったもの）です。ほかの領域の内容も、同じ系統なら同じ行に入れています。","trows":{"chiri":[{"name":"地域と国土の様子","cells":{"3":[{"id":"shakai-3-X-1","lab":"身近な地域や市の様子"}],"4":[{"id":"shakai-4-X-1","lab":"県の様子，47都道府県の名称と位置"},{"id":"shakai-4-X-5","lab":"県内の特色ある地域の様子"}],"5":[{"id":"shakai-5-X-1","lab":"我が国の国土の様子と国民生活"},{"id":"shakai-5-X-5","lab":"国土の自然環境と国民生活（自然災害・森林・公害）"}]}},{"name":"地域の安全と防災","cells":{"3":[{"id":"shakai-3-X-3","lab":"地域の安全を守る働き（消防・警察）"}],"4":[{"id":"shakai-4-X-3","lab":"自然災害から人々を守る活動"}],"5":[{"id":"shakai-5-X-5","lab":"国土の自然環境と国民生活（自然災害・森林・公害）"}]}}],"koumin":[{"name":"地域の安全と防災","cells":{"3":[{"id":"shakai-3-X-3","lab":"地域の安全を守る働き（消防・警察）"}],"4":[{"id":"shakai-4-X-3","lab":"自然災害から人々を守る活動"}],"5":[{"id":"shakai-5-X-5","lab":"国土の自然環境と国民生活（自然災害・森林・公害）"}]}},{"name":"生産と産業","cells":{"3":[{"id":"shakai-3-X-2","lab":"地域の生産や販売の仕事"}],"5":[{"id":"shakai-5-X-2","lab":"我が国の農業や水産業（食料生産）"},{"id":"shakai-5-X-3","lab":"我が国の工業生産"},{"id":"shakai-5-X-4","lab":"我が国の産業と情報との関わり"}]}},{"name":"くらしを支える事業","cells":{"4":[{"id":"shakai-4-X-2","lab":"飲料水・電気・ガス，ごみや下水の事業"}]}},{"name":"政治のしくみと働き","cells":{"6":[{"id":"shakai-6-X-1","lab":"我が国の政治の働き（日本国憲法，国や地方の政治）"}]}},{"name":"世界とのつながり","cells":{"6":[{"id":"shakai-6-X-3","lab":"グローバル化する世界と日本の役割"}]}}],"rekishi":[{"name":"歴史と人々の生活","cells":{"3":[{"id":"shakai-3-X-4","lab":"市の様子の移り変わり"}],"4":[{"id":"shakai-4-X-4","lab":"県内の伝統や文化，先人の働き"}],"6":[{"id":"shakai-6-X-2","lab":"我が国の歴史上の主な事象"}]}}]}},{"id":"sansu","name":"算数","section":"第２章 第３節 算数","textbook":"学校図書","grades":[1,2,3,4,5,6],"areas":[{"key":"A","name":"Ａ 数と計算","grades":[1,2,3,4,5,6]},{"key":"B","name":"Ｂ 図形","grades":[1,2,3,4,5,6]},{"key":"C","name":"Ｃ 測定","grades":[1,2,3]},{"key":"C2","name":"Ｃ 変化と関係","grades":[4,5,6]},{"key":"D","name":"Ｄ データの活用","grades":[1,2,3,4,5,6]}],"goals":{"1":{"lines":["⑴　数の概念とその表し方及び計算の意味を理解し，量，図形及び数量の関係についての理解の基礎となる経験を重ね，数量や図形についての感覚を豊かにするとともに，加法及び減法の計算をしたり，形を構成したり，身の回りにある量の大きさを比べたり，簡単な絵や図などに表したりすることなどについての技能を身に付けるようにする。","⑵　ものの数に着目し，具体物や図などを用いて数の数え方や計算の仕方を考える力，ものの形に着目して特徴を捉えたり，具体的な操作を通して形の構成について考えたりする力，身の回りにあるものの特徴を量に着目して捉え，量の大きさの比べ方を考える力，データの個数に着目して身の回りの事象の特徴を捉える力などを養う。","⑶　数量や図形に親しみ，算数で学んだことのよさや楽しさを感じながら学ぶ態度を養う。"],"page":76,"expl":{"intro":["第１学年では，算数の学習を始めるに当たって必要となる資質・能力の育成を図る。"],"1":["（1）では，第１学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，算数科で学習する内容の基礎となる概念や性質の理解の基礎となる経験を繰り返すことや，算数を豊かに学び続ける上で必要となる感覚の育成が重要である。例えば数の表し方の学習では，具体物などを用いることを通して，数の大きさや数のまとまりに着目してその意味や表し方についての経験を積む。この経験が，その後の数の仕組みを学ぶ素地としての見方を育むことになる。","また，「技能」に関しては，算数の学習を進めていく上で必要な数学的な処理や表現の基礎となる技能を習得する。例えば，繰り上がりのある加法の計算の仕方を具体物を操作することと関連させながら確実に身に付けるとともに，それを繰り下がりのある減法の計算の仕方の学習においても生かすことができるようにし，これ以降の算数の学習に活用することができる技能の基礎を確実に習得することが大切である。"],"2":["（2）では，第１学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，ものの数に着目し，具体物や図などを用いて数の数え方や計算の仕方を考える力を養う。数のまとまりや数量の関係に着目して，ブロックや数え棒といった具体物や図などを使って数の数え方や計算の仕方を考えたり，その過程を表現したりすることを重視するとともにそれらを日常生活に生かすことを重視する。","「Ｂ図形」では，ものの形に着目して特徴を捉えたり，具体的な操作を通して形の構成について考えたりする力を養う。身の回りにある様々なものの形に着目してその特徴に関心をもつとともに，空き箱や色板，折り紙などの具体物を使って形を組み合わせたり分解したり，動かして形を変形させてみたりなどの操作を通して形の構成について考えることを重視する。","「Ｃ測定」では，身の回りにあるものの特徴を量に着目して捉え，量の大きさを比べる方法を考える力を養う。長さ，広さ，かさなどの量から身の回りの事象の特徴を捉え，具体的な操作を通して量の大きさの比べ方を見いだす。また，時刻と日常生活を結び付けるなど，時刻の読み方を日常生活の中で生かすことを重視する。「Ｄデータの活用」では，データの個数に着目して身の回りの事象の特徴を捉える力を養う。身の回りにあるデータに関心をもって，事象の特徴を，データの個数に着目し，大小や順番から捉えることができるようにする。"],"3":["（3）では，学びに向かう力，人間性等の目標を示した。","第１学年では，数量や図形に親しみをもち，それらに対する感覚を豊かにするとともに，算数を学ぶことのよさや楽しさを感じながら学ぼうとする態度を養う。第１学年では算数の学習との出合いを大切にして，具体物を用いた活動などを有効に活用して，算数に主体的に関わって親しむことを重視する。この活動を基盤として算数を学ぶことが楽しいことを実感し，主体的に算数を学ぶことができるようにする。","なお，幼児期の教育において，遊びや生活の中で，一人一人の幼児がその幼児なりに必要感をもって，数量などへの関心をもち感覚が磨かれるような体験をしていることなどを踏まえ，指導の工夫を行うことが大切である。"]}},"2":{"lines":["⑴　数の概念についての理解を深め，計算の意味と性質，基本的な図形の概念，量の概念，簡単な表とグラフなどについて理解し，数量や図形についての感覚を豊かにするとともに，加法，減法及び乗法の計算をしたり，図形を構成したり，長さやかさなどを測定したり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や数量の関係に着目し，必要に応じて具体物や図などを用いて数の表し方や計算の仕方などを考察する力，平面図形の特徴を図形を構成する要素に着目して捉えたり，身の回りの事象を図形の性質から考察したりする力，身の回りにあるものの特徴を量に着目して捉え，量の単位を用いて的確に表現する力，身の回りの事象をデータの特徴に着目して捉え，簡潔に表現したり考察したりする力などを養う。","⑶　数量や図形に進んで関わり，数学的に表現・処理したことを振り返り，数理的な処理のよさに気付き生活や学習に活用しようとする態度を養う。"],"page":102,"expl":{"intro":["第２学年では，第１学年の学習を踏まえて，引き続き具体物などを用いることを通して算数の学習に関心をもち，基礎的・基本的な概念や性質などを理解するとともに，日常の事象や算数の学習場面を，数学的に表現したり処理したりすることを重視する。"],"1":["（1）では，第２学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，第１学年での学習内容を基に基本的な数量や図形の概念や意味，性質を確実に理解することや数量や図形の感覚をより豊かにすることが重要になる。例えば，乗法九九の構成の学習では，具体物や九九表などを用いることを通して，数のまとまりや数量の関係に着目して乗法に関して成り立つ簡単な性質について理解できるようにするとともに数についての感覚を豊かにする。","また「技能」に関しては，第１学年の学習を踏まえて，数学的な処理や表現の基礎となる技能の習得が必要である。例えば，長さを測定する際におよその長さの見当をつけるとともにそれを表現するのに適切な単位を選択することができるようにするが，その手続きを，かさの測定においても用いることができるようにするなど，他の学習場面にも活用することができるようにすることが大切である。"],"2":["（2）では，第２学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や数量の関係に着目し，必要に応じて具体物や図などを用いて数の表し方や計算の仕方などを考察する力を養う。具体物などを用いることを通して，身の回りの数への関心を高め，数についての感覚を豊かにするとともに数の大きさや仕組みに着目して表し方を考える。また加法及び減法の可能性や相互関係に着目して計算の仕方を考えたり，乗法の計算の仕方を考えたり，それらを日常生活に生かしたりすることができるようにする。さらに，具体物などを用いることを通して，数量やその関係に着目して，言葉，数，式，図などに表したり読み取ったり，それらを日常生活に生かせるようにする。","「Ｂ図形」では，平面図形の特徴を図形を構成する要素に着目して捉えたり，身の回りの事象を図形の性質から考察したりする力を養う。この学年から身の回りの事象を図形として捉え，図形の特徴を図形を構成する要素に着目して捉えたり図形の性質から考察したりすることを重視する。第１学年同様に，空き箱や色板，折り紙などの具体物を使って形を組み合わせたり分解したり，動かして形を変形させてみたりするなどの操作を大切にするが，図形を構成する要素に関心をもったりその性質を考えたりすることを重視する。","「Ｃ測定」では，身の回りにあるものの特徴を量に着目して捉え，量の単位を用いて的確に表現する力を養う。長さ，かさの量から身の回りの事象の特徴に着目し，実験・実測を通して目的に応じた普遍単位を用いることで量を的確に表現したり比べたりすることを重視する。また，時間の単位に着目して，時刻や時間を日常生活の中で生かせるようにする。","「Ｄデータの活用」では，「身の回りの事象をデータの特徴に着目して捉え，簡潔に表現したり考察したりする力」を養う。身の回りの事象をデータを整理する観点に着目し，その事象の特徴を簡単な表やグラフに表して考察することができるようにする。","なお，児童の発達の段階を考慮して，この「（2）思考力・判断力・表現力等」の目標については，次の第３学年でも基本的に同様の内容とする。"],"3":["（3）では，学びに向かう力，人間性等の目標を示した。","第２学年では，数量や図形に進んで関わり，数学的に表現・処理したことを振り返り，数理的な処理のよさに気付き生活や学習に活用する態度を養う。第１学年での算数の学習で経験したことを踏まえて，第２学年では，算数の学習で表現・処理したことへの振り返りや数理的処理のよさに気付くこと，さらにはそれらを生活や学習へ活用することが期待されている。算数を学ぶことの価値を実感し，それが新たに主体的に算数に関わる態度を育むことにつながる。","なお，児童の発達の段階を考慮して，この「（3）学びに向かう力，人間性等」の目標については，次の第３学年でも同様の内容とする。"]}},"3":{"lines":["⑴　数の表し方，整数の計算の意味と性質，小数及び分数の意味と表し方，基本的な図形の概念，量の概念，棒グラフなどについて理解し，数量や図形についての感覚を豊かにするとともに，整数などの計算をしたり，図形を構成したり，長さや重さなどを測定したり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や数量の関係に着目し，必要に応じて具体物や図などを用いて数の表し方や計算の仕方などを考察する力，平面図形の特徴を図形を構成する要素に着目して捉えたり，身の回りの事象を図形の性質から考察したりする力，身の回りにあるものの特徴を量に着目して捉え，量の単位を用いて的確に表現する力，身の回りの事象をデータの特徴に着目して捉え，簡潔に表現したり適切に判断したりする力などを養う。","⑶　数量や図形に進んで関わり，数学的に表現・処理したことを振り返り，数理的な処理のよさに気付き生活や学習に活用しようとする態度を養う。"],"page":134,"expl":{"intro":["第３学年では，第２学年の学習を踏まえて，算数の学習に関心をもち，基礎的・基本的な概念及び意味や性質などを理解するとともに，日常の事象や算数の学習場面を，数学的に表現したり処理したりすることを重視する。"],"1":["（1）では，第３学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，第２学年での学習内容を踏まえて，基本的な数量や図形の概念及び意味，性質を確実に理解することや数量や図形の感覚をより豊かにすることが重要になる。例えば，三角形の学習では，二等辺三角形や正三角形の観察や操作活動などを通して，図形を構成する要素である辺の長さに着目して図形の概念や性質について理解できるようにするとともに図形の感覚を豊かにする。","また，「技能」に関しては，第２学年の学習を踏まえて，数理的な処理や表現の基礎となる技能のより確かな習得が必要である。例えば，乗法の学習では，数の仕組みや乗法九九および乗法の性質に着目して２位数や３位数に１位数や２位数をかける乗法の計算の仕方について身に付けるようにする。既習の知識及び技能と結び付けながら新しい学習にも生かせる技能となるように指導することが大切である。（2）では，第３学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や数量の関係に着目し，必要に応じて具体物や図などを用いて数の表し方や計算の仕方などを考察する力を養う。身の回りの数や数量の関係への関心を高め，数についての感覚を一層豊かにするとともに数の大きさや構造に着目して表し方を考え，日常生活に生かせるようにする。また，数量の関係に着目し，加法及び減法，乗法及び除法の計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，計算に関して成り立つ性質を活用し計算の工夫やその確かめができるようにする。さらに，数量の関係に着目して，数量の関係を図や式を用いて簡潔に表したり式と図を関連付けて式を読んだり，それらを日常生活に生かすことができるようにする。","「Ｂ図形」では，平面図形の特徴を図形を構成する要素に着目して捉えたり，身の回りの事象を図形の性質から考察したりする力を養う。身の回りの事象を図形として捉え，図形の特徴を図形を構成する要素に着目して捉えたり図形の性質から考察したりすることを重視する。具体物を操作しながら形を構成したり分解したりして，図形を構成する要素に着目しながらその性質を見いだしたり，それを日常の事象の考察に生かしたりすることを重視する。","「Ｃ測定」では，身の回りにあるものの特徴を量に着目して捉え，量の単位を用いて的確に表現する力を養う。長さ，重さの量から身の回りの事象の特徴に着目し，実験・実測などを通して目的に応じた普遍単位を用いることで量を的確に表現したり単位を統合的に捉えたりすることを重視する。また，時間の単位に着目して，時刻や時間の求め方について考察し，それを日常生活で生かせるようにする。","「Ｄデータの活用」では，身の回りの事象をデータの特徴に着目して捉え，簡潔に表現したり適切に判断したりする力を養う。身の回りの事象のデータを整理する観点に着目し，その事象の特徴を簡単な表や棒グラフに表すとともにそれを基に適切な判断ができるようにする。"],"2":[],"3":["（3）では，学びに向かう力，人間性等の目標を示した。数量や図形に進んで関わり，数学的に表現・処理したことを振り返り，数理的な処理のよさに気付き生活や学習に活用する態度を養う。第２学年までの算数の学習での経験を踏まえて，第３学年でも算数の学習で表現・処理したことを振り返ることや数理的処理のよさに気付くこと，さらにはそれらを生活や学習へ活用することが期待されている。算数を学ぶことの価値を実感し，それが新たに主体的に算数に関わる態度を育むことにつながる。"]}},"4":{"lines":["⑴　小数及び分数の意味と表し方，四則の関係，平面図形と立体図形，面積，角の大きさ，折れ線グラフなどについて理解するとともに，整数，小数及び分数の計算をしたり，図形を構成したり，図形の面積や角の大きさを求めたり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や数量の関係に着目し，目的に合った表現方法を用いて計算の仕方などを考察する力，図形を構成する要素及びそれらの位置関係に着目し，図形の性質や図形の計量について考察する力，伴って変わる二つの数量やそれらの関係に着目し，変化や対応の特徴を見いだして，二つの数量の関係を表や式を用いて考察する力，目的に応じてデータを収集し，データの特徴や傾向に着目して表やグラフに的確に表現し，それらを用いて問題解決したり，解決の過程や結果を多面的に捉え考察したりする力などを養う。","⑶　数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用しようとする態度を養う。"],"page":179,"expl":{"intro":["第４学年では，それまでの下学年の学習で身に付けた基礎的・基本的な概念及び意味や性質などを生かしながら日常の事象や算数の学習場面から見いだした問題の解決に取り組み，数学的に表現・処理したことを振り返りよりよいものを求めて粘り強く考えていくことを重視する。"],"1":["（1）では，第４学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，第３学年の学習を踏まえて，基本的な数量や図形の概念及び意味，性質や数量関係，表やグラフなどの意味の確実な理解が重要になる。例えば，折れ線グラフの学習では，変化の視点からデータの特徴に着目し，それを適切に表現するグラフとしての意味を理解する。","また，「技能」に関しては，第３学年の学習を踏まえて，適切に数理的な処理や表現ができるように技能の確かな習得が必要である。例えば，小数の学習では，小数が整数と同じ仕組みで構成されていることを基にして，乗数や除数が整数である場合の小数の乗法及び除法の計算の仕方について身に付けるようにする。既習の知識及び技能と結び付けながら新しい方法を見いだしていく技能となるように指導することが大切である。"],"2":["（2）では，第４学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や数量の関係に着目し，目的に合った表現方法を用いて計算の仕方などを考察する力を養う。数やその表現の仕方及び数量の関係に着目するとともに数の表現方法を統合的に捉えたり目的に合わせて考察したり，それらを日常生活に生かせるようにしたりする。数量の関係に着目して，除法の計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，計算に関して成り立つ性質を活用した計算の工夫やその確かめができるようにする。また，数の仕組みや構成する単位に着目して，小数や分数の計算の仕方を考えることができるようにする。さらに，数量の関係に着目して，簡潔で一般的に表現したり，式の意味を読み取ったりすることができるようにする。","「Ｂ図形」では，図形を構成する要素及びそれらの位置関係に着目し，図形の性質や図形の計量について考察する力を養う。平面図形及び立体図形を平行・垂直などの図形を構成する要素に着目しながら，図形の性質や位置の表現方法を見いだしたり，それを基に既習の基本図形を捉えなおしたり日常の事象の考察に生かしたりすることを重視する。また，図形の計量の視点から量の単位や図形を構成する要素に着目し，図形の面積の求め方や既習の単位との関係，角の大きさの表現の仕方について考察できるようにする。","「Ｃ変化と関係」では，変化や対応の特徴を見いだして，二つの数量の関係を表や式を用いて考察する力を養う。下学年での数量の関係の学習を踏まえて，日常の事象における数量の関係に着目し，図や表，式などを用いて，変化や対応の関係やある二つの数量の関係と別の二つの数量の関係との比べ方を考察するとともに，その結果を日常生活で生かせるようにする。","「Ｄデータの活用」では，目的に応じてデータを収集し，表やグラフに的確に表現し，それらを用いて問題解決したり，解決の過程や結果を多面的に捉え考察したりする力を養う。第３学年までの学習に加えて，身の回りの事象から目的に応じたデータの収集，表や折れ線グラフを用いた問題解決及び解決過程や結果の多面的な考察を重視することが加わった。統計の問題解決の過程を重視しながら，データの特徴や傾向に着目し，解決に適した表やグラフを選択して結論を考察することを重視する。","なお，児童の発達の段階を考慮して，「（2）思考力，判断力，表現力等」の目標については次の第５学年でも基本的に同様の内容とする。"],"3":["（3）では，学びに向かう力，人間性等の目標を示した。第４学年では，数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用する態度を養う。これまでの算数の学習での経験を踏まえて，数学的に表現・処理したことへの振り返りに加えて，結果を多面的に捉えて検討し，それをよりよいものにするために粘り強く考えていくことが重視され，さらに，それらを生活や学習へ活用することが期待されている。算数に主体的に関わりよりよいものを創り上げていくという立場から，問題解決の結果を常に評価・改善し続けていく姿勢が期待されている。なお，児童の発達の段階を考慮して，「（3）学びに向かう力，人間性等」の目標については第５学年，第６学年でも同様の内容とする。"]}},"5":{"lines":["⑴　整数の性質，分数の意味，小数と分数の計算の意味，面積の公式，図形の意味と性質，図形の体積，速さ，割合，帯グラフなどについて理解するとともに，小数や分数の計算をしたり，図形の性質を調べたり，図形の面積や体積を求めたり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や計算の意味に着目し，目的に合った表現方法を用いて数の性質や計算の仕方などを考察する力，図形を構成する要素や図形間の関係などに着目し，図形の性質や図形の計量について考察する力，伴って変わる二つの数量やそれらの関係に着目し，変化や対応の特徴を見いだして，二つの数量の関係を表や式を用いて考察する力，目的に応じてデータを収集し，データの特徴や傾向に着目して表やグラフに的確に表現し，それらを用いて問題解決したり，解決の過程や結果を多面的に捉え考察したりする力などを養う。","⑶　数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用しようとする態度を養う。"],"page":232,"expl":{"intro":["第４学年に引き続き，第５学年の学習でも基礎的・基本的な概念及び意味や性質などを生かしながら日常の事象や算数の学習場面から見いだした問題の解決に取り組み，数学的に表現・処理したことを振り返りよりよいものを求めて粘り強く考えていくことを重視する。"],"1":["（1）では，第５学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，基本的な数量や図形の概念及び意味，性質や数量関係，表やグラフなどの意味の確実な理解が重要になる。例えば，小数の乗法及び除法の学習では，乗法及び除法の意味に着目し，乗数や除数が小数である場合まで数の範囲を広げて乗法及び除法の意味を理解する。数の範囲を広げることで計算の意味の拡張が行われ，知識の捉え直しが行われることになる。","また，「技能」に関しては，第４学年の学習に引き続き，適切に数理的な処理や表現ができるように技能の確かな習得が必要である。例えば，小数の乗法及び除法の学習では，小数の乗法及び除法についても整数の場合と同じ関係や法則が成り立つことを生かしながら，小数の乗法及び除法の計算ができるようにする。発展的な場面においても活用可能な技能になるように指導することが大切である。","（2）においても，第５学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や数量の関係に着目し，目的に合った表現方法を用いて数の性質や計算の仕方などを考察する力を養う。数やその表現の仕方及び数量の関係に着目するとともに数の表現方法を統合的に捉えたり目的に合わせて考察したり，それらを日常生活に生かせるようにしたりする。数の仕組みや構成する単位に着目して，分数の意味の解釈や大きさの表現の仕方を考えることができるようにする。また，数量の関係に着目して，小数の乗法及び除法の計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，計算に関して成り立つ性質を活用した計算の工夫やその確かめができるようにする。さらに，二つの数量の対応や変化に着目し，式で表されている関係について考察できるようにする。「Ｂ図形」では，図形の性質や図形の計量について考察する力を養う。平面図形を合同の視点から，図形を構成する要素や図形間の関係に着目しながら，図形の構成の仕方やその性質を見いだし論理的に説明したり，それを基に既習の基本図形を捉え直したり日常の事象の考察に生かしたりすることを重視する。また，図形の計量の視点から量の単位や図形を構成する要素に着目し，図形の面積や体積の求め方や既習の単位との関係について考察できるようにする。","「Ｃ変化と関係」では，伴って変わる二つの数量やそれらの関係に着目し変化や対応の特徴を見いだして二つの数量の関係を表や式を用いて考察する力を養う。これまでの数量の関係の学習を踏まえて，日常の事象における伴って変わる二つの数量及びそれらの関係に着目し，図や表，式などを用いて，簡単な比例における変化や対応の考察や割合や単位量当たりの大きさにおける目的に応じた大小の比較及び表現をするとともに，それらを日常生活で生かせるようにする。","「Ｄデータの活用」では，目的に応じてデータを収集し，表やグラフに的確に表現し，それらを用いて問題解決したり，解決の過程や結果を多面的に捉え考察したりする力を養う。第４学年の学習に引き続いて，身の回りの事象から目的に応じたデータの収集，表や帯グラフや円グラフなどへの適切な表現，それを用いた問題解決及び解決過程や結果の多面的な考察を重視する。統計の問題解決の過程を重視しながら，データの特徴や傾向に着目し，解決に適した表やグラフを選択して結論を考察することを重視する。また，事象を概括的に捉え，平均を使って考察することやそれを学習や生活に生かせるようにする。"],"2":[],"3":["（3）では，学びに向かう力，人間性等の目標を示した。第５学年では，数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用する態度を養う。これまでの算数の学習での経験を踏まえて，数学的に表現・処理したことへの振り返りに加えて，結果を多面的に捉えて検討し，それをよりよいものにするために粘り強く考えていくことが重視され，さらに，それらを生活や学習へ活用することが期待されている。算数に主体的に関わりよりよいものを創り上げていくという立場から，問題解決の結果を常に評価・改善し続けていく姿勢が期待されている。"]}},"6":{"lines":["⑴　分数の計算の意味，文字を用いた式，図形の意味，図形の体積，比例，度数分布を表す表などについて理解するとともに，分数の計算をしたり，図形を構成したり，図形の面積や体積を求めたり，表やグラフに表したりすることなどについての技能を身に付けるようにする。","⑵　数とその表現や計算の意味に着目し，発展的に考察して問題を見いだすとともに，目的に応じて多様な表現方法を用いながら数の表し方や計算の仕方などを考察する力，図形を構成する要素や図形間の関係などに着目し，図形の性質や図形の計量について考察する力，伴って変わる二つの数量やそれらの関係に着目し，変化や対応の特徴を見いだして，二つの数量の関係を表や式，グラフを用いて考察する力，身の回りの事象から設定した問題について，目的に応じてデータを収集し，データの特徴や傾向に着目して適切な手法を選択して分析を行い，それらを用いて問題解決したり，解決の過程や結果を批判的に考察したりする力などを養う。","⑶　数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用しようとする態度を養う。"],"page":284,"expl":{"intro":["小学校修了時において算数の学習で身に付ける資質・能力である。基礎的・基本的な概念及び意味や性質などを生かしながら日常の事象や算数の学習場面から見いだした問題の解決に取り組み，常によりよいものを求めて粘り強く考えていくとともに，数学的に表現・処理したことを振り返り，そのよさに気付き学習したことを活用していくことを重視する。"],"1":["（1）では，第６学年の四つの領域で身に付ける知識及び技能について示した。","「知識」に関しては，基本的な数量や図形の概念及び意味，性質や数量関係，表やグラフなどの意味の確実な理解が重要になる。例えば，分数の乗法や除法の学習では，乗法及び除法の意味に着目し，第５学年に引き続き乗数や除数が分数である場合まで数の範囲を広げて乗法及び除法の意味を理解する。数の範囲を広げることで計算の意味の拡張が行われ，ここでも知識の捉え直しが行われることになる。また，「技能」に関しては，小学校での算数の学習で身に付けた技能を生かしながら，適切な数理的な処理や表現ができるようにすることが必要である。例えば，分数の乗法及び除法の学習では，分数の乗法及び除法についても整数の場合と同じ関係や法則が成り立つことを生かしながら，分数の乗法及び除法の計算ができるようにする。ここでも第５学年に引き続き発展的な場面においても活用可能な技能になるように指導することが大切である。","（2）においても，第６学年の四つの領域で身に付ける思考力，判断力，表現力等を数学的な見方・考え方と対応する形で示した。","「Ａ数と計算」では，数とその表現や計算の意味に着目し，発展的に考察して問題を見いだすとともに，目的に応じて多様な表現方法を用いながら数の表し方や計算の仕方などを考察する力を養う。数やその表現の仕方及び数量の関係に着目するとともに数の表現方法を目的に合わせて考察したり，それらを日常生活に生かせるようにしたりする。また，数量の関係に着目して，分数の乗法及び除法の計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，計算に関して成り立つ性質を活用した計算の工夫やその確かめができるようにする。さらに，数量の関係を簡潔かつ一般的に表現したり，式の意味を読み取ったりすることができるようにする。","「Ｂ図形」では，図形を構成する要素や図形間の関係などに着目し，図形の性質や図形の計量について考察する力を養う。平面図形を対称の視点から，図形を構成する要素や図形間の関係に着目しながら，図形の構成の仕方やその性質を見いだし説明したり，それを基に既習の基本図形を捉えなおしたり日常の事象の考察に生かしたりすることを重視する。また，図形の計量の視点から量の単位や図形を構成する要素に着目し，図形や概形の面積や体積の求め方について論理的に考察できるようにする。","「Ｃ変化と関係」では，変化や対応の特徴を見いだして，二つの数量の関係を表や式，グラフを用いて考察する力を養う。これまでの数量の関係の学習を踏まえて，日常の事象における伴って変わる二つの数量及びそれらの関係に着目し，図，表，グラフ，式などを用いて，比例や反比例における変化及び対応や比における数量の関係の比べ方を考察するとともに，その結果を日常生活で生かせるようにする。「Ｄデータの活用」では，身の回りの事象から設定した問題について，目的に応じてデータを収集し，データの特徴や傾向に着目して適切な手法を選択して分析を行い，それらを用いて問題解決したり，解決の過程や結果を批判的に考察したりする力を養う。これまでの学習で学んだ統計の問題解決過程を生かして，身の回りの事象から目的に応じたデータの収集，表や柱状グラフなどの選択と表現，それを用いた問題解決及び解決過程や結果の批判的な考察を重視する。統計の問題解決の過程を重視しながら，データの特徴や傾向に着目し，目的に応じて代表値などを活用して結論の判断をすることを重視する。また，事象の特徴に着目し，順序よく整理する観点を決めて，落ちや重なりなく調べる方法を考察することができるようにする。"],"2":[],"3":["（3）では，学びに向かう力，人間性等の目標を示した。第６学年では，数学的に表現・処理したことを振り返り，多面的に捉え検討してよりよいものを求めて粘り強く考える態度，数学のよさに気付き学習したことを生活や学習に活用する態度を養う。これまでの算数の学習での経験を踏まえ小学校修了時に身に付ける態度などとして，数学的に表現・処理したことを振り返るとともに，問題解決の結果を多面的に捉えて検討し，それをよりよいものにするために粘り強く考えていくことを重視し，さらに，それらを生活や学習へ活用することを期待している。算数に主体的に関わりよりよいものを創り上げていくという立場から，問題解決の結果を常に評価・改善し続けていく姿勢を中学校につなげていく。"]}}},"units":[{"g":1,"u":"１０までの かず","b":"1年上","ids":["sansu-1-A-1"]},{"g":1,"u":"いくつと いくつ","b":"1年上","ids":["sansu-1-A-1"]},{"g":1,"u":"なんばんめかな","b":"1年上","ids":["sansu-1-A-1","sansu-1-B-1"]},{"g":1,"u":"あわせて いくつ ふえると いくつ","b":"1年上","ids":["sansu-1-A-2"]},{"g":1,"u":"のこりは いくつ ちがいは いくつ","b":"1年上","ids":["sansu-1-A-2"]},{"g":1,"u":"いくつ あるかな","b":"1年上","ids":["sansu-1-D-1"]},{"g":1,"u":"１０より おおきい かずを かぞえよう","b":"1年上","ids":["sansu-1-A-1"]},{"g":1,"u":"なんじ なんじはん","b":"1年上","ids":["sansu-1-C-2"]},{"g":1,"u":"かたちあそび","b":"1年下","ids":["sansu-1-B-1"]},{"g":1,"u":"たしたり ひいたり してみよう","b":"1年下","ids":["sansu-1-A-2"]},{"g":1,"u":"たしざん","b":"1年下","ids":["sansu-1-A-2"]},{"g":1,"u":"ひきざん","b":"1年下","ids":["sansu-1-A-2"]},{"g":1,"u":"くらべてみよう","b":"1年下","ids":["sansu-1-C-1"]},{"g":1,"u":"かたちを つくろう","b":"1年下","ids":["sansu-1-B-1"]},{"g":1,"u":"大きい かずを かぞえよう","b":"1年下","ids":["sansu-1-A-1","sansu-1-A-2"]},{"g":1,"u":"なんじなんぷん","b":"1年下","ids":["sansu-1-C-2"]},{"g":1,"u":"たすのかな ひくのかな ずに かいて かんがえよう","b":"1年下","ids":["sansu-1-A-1","sansu-1-A-2"]},{"g":1,"u":"かずしらべ","b":"1年下","ids":["sansu-1-D-1"]},{"g":2,"u":"ひょうと グラフ","b":"2年上","ids":["sansu-2-D-1"]},{"g":2,"u":"時こくと 時間（１）","b":"2年上","ids":["sansu-2-C-2"]},{"g":2,"u":"２けたの たし算と ひき算","b":"2年上","ids":["sansu-2-A-2"]},{"g":2,"u":"たし算の ひっ算","b":"2年上","ids":["sansu-2-A-2"]},{"g":2,"u":"ひき算の ひっ算","b":"2年上","ids":["sansu-2-A-2"]},{"g":2,"u":"長さ（1）","b":"2年上","ids":["sansu-2-C-1"]},{"g":2,"u"
