，判断力，表現力等を身に付けること。","（ア）　データの個数に着目し，身の回りの事象の特徴を捉えること。"],"notes":null,"units":[{"u":"いくつ あるかな","b":"1年上","s":0},{"u":"かずしらべ","b":"1年下","s":0}]},{"id":"sansu-2-A-1","g":[2],"area":"A","areaName":"数と計算","mark":"⑴","head":"4けたまでの数のしくみ・簡単な分数","title":"数の構成と表し方に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　同じ大きさの集まりにまとめて数えたり，分類して数えたりすること。","（イ）　４位数までについて，十進位取り記数法による数の表し方及び数の大小や順序について理解すること。","（ウ）　数を十や百を単位としてみるなど，数の相対的な大きさについて理解すること。","（エ）　一つの数をほかの数の積としてみるなど，ほかの数と関係付けてみること。","（オ）　簡単な事柄を分類整理し，それを数を用いて表すこと。","（カ）　1/2，1/4 など簡単な分数について知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数のまとまりに着目し，大きな数の大きさの比べ方や数え方を考え，日常生活に生かすこと。"],"notes":["⑴　内容の「Ａ数と計算」の⑴については，１万についても取り扱うものとする。"],"units":[{"u":"１０００までの 数","b":"2年上","s":0},{"u":"かけ算（１）","b":"2年下","s":0},{"u":"かけ算（２）","b":"2年下","s":0},{"u":"かけ算（３）","b":"2年下","s":0},{"u":"分数","b":"2年下","s":0},{"u":"１００００までの 数","b":"2年下","s":0}]},{"id":"sansu-2-A-2","g":[2],"area":"A","areaName":"数と計算","mark":"⑵","head":"2けたのたし算・ひき算の筆算","title":"加法及び減法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　２位数の加法及びその逆の減法の計算が，１位数などについての基本的な計算を基にしてできることを理解し，それらの計算が確実にできること。また，それらの筆算の仕方について理解すること。","（イ）　簡単な場合について，３位数などの加法及び減法の計算の仕方を知ること。","（ウ）　加法及び減法に関して成り立つ性質について理解すること。","（エ）　加法と減法との相互関係について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること。"],"notes":["⑵　内容の「Ａ数と計算」の⑵については，必要な場合には，（　）や□などを用いることができる。また，計算の結果の見積りについて配慮するものとする。","⑶　内容の「Ａ数と計算」の⑵のアの（ウ）については，交換法則や結合法則を取り扱うものとする。"],"units":[{"u":"２けたの たし算と ひき算","b":"2年上","s":0},{"u":"たし算の ひっ算","b":"2年上","s":0},{"u":"ひき算の ひっ算","b":"2年上","s":0},{"u":"たし算と ひき算（１）","b":"2年上","s":0},{"u":"大きい 数の たし算と ひき算","b":"2年上","s":0},{"u":"たし算と ひき算（２）","b":"2年下","s":0}]},{"id":"sansu-2-A-3","g":[2],"area":"A","areaName":"数と計算","mark":"⑶","head":"かけ算の意味と九九","title":"乗法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　乗法の意味について理解し，それが用いられる場合について知ること。","（イ）　乗法が用いられる場面を式に表したり，式を読み取ったりすること。","（ウ）　乗法に関して成り立つ簡単な性質について理解すること。","（エ）　乗法九九について知り，１位数と１位数との乗法の計算が確実にできること。","（オ）　簡単な場合について，２位数と１位数との乗法の計算の仕方を知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数量の関係に着目し，計算の意味や計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること。","（イ）　数量の関係に着目し，計算を日常生活に生かすこと。"],"notes":["⑷　内容の「Ａ数と計算」の⑶のアの（ウ）については，主に乗数が１ずつ増えるときの積の増え方や交換法則を取り扱うものとする。"],"units":[{"u":"かけ算（１）","b":"2年下","s":0},{"u":"かけ算（２）","b":"2年下","s":0},{"u":"かけ算（３）","b":"2年下","s":0}]},{"id":"sansu-2-B-1","g":[2],"area":"B","areaName":"図形","mark":"⑴","head":"三角形・四角形・箱の形","title":"図形に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　三角形，四角形について知ること。","（イ）　正方形，長方形，直角三角形について知ること。","（ウ）　正方形や長方形の面で構成される箱の形をしたものについて理解し，それらを構成したり分解したりすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素に着目し，構成の仕方を考えるとともに，身の回りのものの形を図形として捉えること。"],"notes":["⑸　内容の「Ｂ図形」の⑴のアの（イ）に関連して，正方形，長方形が身の回りで多く使われていることが分かるようにするとともに，敷き詰めるなどの操作的な活動を通して，平面の広がりについての基礎となる経験を豊かにするよう配慮するものとする。"],"units":[{"u":"三角形と 四角形","b":"2年上","s":0},{"u":"はこの 形","b":"2年下","s":0}]},{"id":"sansu-2-C-1","g":[2],"area":"C","areaName":"測定","mark":"⑴","head":"長さ（mm・cm・m）とかさ（mL・dL・L）の単位","title":"量の単位と測定に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　長さの単位（ミリメートル（mm），センチメートル（cm），メートル（m））及びかさの単位（ミリリットル（mL），デシリットル（dL），リットル（L））について知り，測定の意味を理解すること。","（イ）　長さ及びかさについて，およその見当を付け，単位を適切に選択して測定すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　身の回りのものの特徴に着目し，目的に応じた単位で量の大きさを的確に表現したり，比べたりすること。"],"notes":null,"units":[{"u":"長さ（1）","b":"2年上","s":0},{"u":"水の かさ","b":"2年上","s":0},{"u":"長さ（２）","b":"2年下","s":0}]},{"id":"sansu-2-C-2","g":[2],"area":"C","areaName":"測定","mark":"⑵","head":"日・時・分の関係","title":"時刻と時間に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　日，時，分について知り，それらの関係を理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　時間の単位に着目し，時刻や時間を日常生活に生かすこと。"],"notes":null,"units":[{"u":"時こくと 時間（１）","b":"2年上","s":0},{"u":"時こくと 時間（２）","b":"2年下","s":0}]},{"id":"sansu-2-D-1","g":[2],"area":"D","areaName":"データの活用","mark":"⑴","head":"簡単な表とグラフ","title":"データの分析に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　身の回りにある数量を分類整理し，簡単な表やグラフを用いて表したり読み取ったりすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　データを整理する観点に着目し，身の回りの事象について表やグラフを用いて考察すること。"],"notes":null,"units":[{"u":"ひょうと グラフ","b":"2年上","s":0},{"u":"しりょうの せいり","b":"2年下","s":0}]},{"id":"sansu-3-A-1","g":[3],"area":"A","areaName":"数と計算","mark":"⑴","head":"万の単位・10倍や1/10の大きさの数","title":"整数の表し方に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　万の単位について知ること。","（イ）　10 倍，100 倍，1000 倍，1/10 の大きさの数及びそれらの表し方について知ること。","（ウ）　数の相対的な大きさについての理解を深めること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数のまとまりに着目し，大きな数の大きさの比べ方や表し方を考え，日常生活に生かすこと。"],"notes":["⑴　内容の「Ａ数と計算」の⑴については，１億についても取り扱うものとする。"],"units":[{"u":"大きい数","b":"3年下","s":0}]},{"id":"sansu-3-A-2","g":[3],"area":"A","areaName":"数と計算","mark":"⑵","head":"3・4けたのたし算・ひき算の筆算","title":"加法及び減法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　３位数や４位数の加法及び減法の計算が，２位数などについての基本的な計算を基にしてできることを理解すること。また，それらの筆算の仕方について理解すること。","（イ）　加法及び減法の計算が確実にでき，それらを適切に用いること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること。"],"notes":["⑵　内容の「Ａ数と計算」の⑵及び⑶については，簡単な計算は暗算でできるよう配慮するものとする。また，計算の結果の見積りについても触れるものとする。"],"units":[{"u":"たし算とひき算","b":"3年上","s":0},{"u":"大きい数","b":"3年下","s":0}]},{"id":"sansu-3-A-3","g":[3],"area":"A","areaName":"数と計算","mark":"⑶","head":"2・3けた×1・2けたのかけ算の筆算","title":"乗法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　２位数や３位数に１位数や２位数をかける乗法の計算が，乗法九九などの基本的な計算を基にしてできることを理解すること。また，その筆算の仕方について理解すること。","（イ）　乗法の計算が確実にでき，それを適切に用いること。","（ウ）　乗法に関して成り立つ性質について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること。"],"notes":["⑵　内容の「Ａ数と計算」の⑵及び⑶については，簡単な計算は暗算でできるよう配慮するものとする。また，計算の結果の見積りについても触れるものとする。","⑶　内容の「Ａ数と計算」の⑶については，乗数又は被乗数が０の場合の計算についても取り扱うものとする。","⑷　内容の「Ａ数と計算」の⑶のアの（ウ）については，交換法則，結合法則，分配法則を取り扱うものとする。"],"units":[{"u":"かけ算","b":"3年上","s":0},{"u":"（２けた）×（１けた）の計算","b":"3年下","s":0},{"u":"１けたをかけるかけ算","b":"3年下","s":0},{"u":"２けたをかけるかけ算","b":"3年下","s":0}]},{"id":"sansu-3-A-4","g":[3],"area":"A","areaName":"数と計算","mark":"⑷","head":"わり算の意味（九九1回で答えが出るわり算）・余り","title":"除法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　除法の意味について理解し，それが用いられる場合について知ること。また，余りについて知ること。","（イ）　除法が用いられる場面を式に表したり，式を読み取ったりすること。","（ウ）　除法と乗法や減法との関係について理解すること。","（エ）　除数と商が共に１位数である除法の計算が確実にできること。","（オ）　簡単な場合について，除数が１位数で商が２位数の除法の計算の仕方を知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数量の関係に着目し，計算の意味や計算の仕方を考えたり，計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること。","（イ）　数量の関係に着目し，計算を日常生活に生かすこと。"],"notes":null,"units":[{"u":"わり算","b":"3年上","s":0},{"u":"あまりのあるわり算","b":"3年上","s":0}]},{"id":"sansu-3-A-5","g":[3],"area":"A","areaName":"数と計算","mark":"⑸","head":"小数の意味と表し方（1/10の位）","title":"小数とその表し方に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　端数部分の大きさを表すのに小数を用いることを知ること。また，小数の表し方及び 1/10 の位について知ること。","（イ）　1/10 の位までの小数の加法及び減法の意味について理解し，それらの計算ができることを知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数のまとまりに着目し，小数でも数の大きさを比べたり計算したりできるかどうかを考えるとともに，小数を日常生活に生かすこと。"],"notes":["⑸　内容の「Ａ数と計算」の⑸及び⑹については，小数の 0.1 と分数の 1/10 などを数直線を用いて関連付けて取り扱うものとする。"],"units":[{"u":"小数","b":"3年下","s":0},{"u":"分数","b":"3年下","s":0}]},{"id":"sansu-3-A-6","g":[3],"area":"A","areaName":"数と計算","mark":"⑹","head":"分数の意味と表し方・単位分数","title":"分数とその表し方に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　等分してできる部分の大きさや端数部分の大きさを表すのに分数を用いることを知ること。また，分数の表し方について知ること。","（イ）　分数が単位分数の幾つ分かで表すことができることを知ること。","（ウ）　簡単な場合について，分数の加法及び減法の意味について理解し，それらの計算ができることを知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数のまとまりに着目し，分数でも数の大きさを比べたり計算したりできるかどうかを考えるとともに，分数を日常生活に生かすこと。"],"notes":["⑸　内容の「Ａ数と計算」の⑸及び⑹については，小数の 0.1 と分数の 1/10 などを数直線を用いて関連付けて取り扱うものとする。"],"units":[{"u":"分数","b":"3年下","s":0}]},{"id":"sansu-3-A-7","g":[3],"area":"A","areaName":"数と計算","mark":"⑺","head":"□を使った式","title":"数量の関係を表す式に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　数量の関係を表す式について理解するとともに，数量を□などを用いて表し，その関係を式に表したり，□などに数を当てはめて調べたりすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数量の関係に着目し，数量の関係を図や式を用いて簡潔に表したり，式と図を関連付けて式を読んだりすること。"],"notes":null,"units":[{"u":"□を使った式","b":"3年下","s":0}]},{"id":"sansu-3-A-8","g":[3],"area":"A","areaName":"数と計算","mark":"⑻","head":"そろばんの数の表し方とたし算・ひき算","title":"そろばんを用いた数の表し方と計算に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　そろばんによる数の表し方について知ること。","（イ）　簡単な加法及び減法の計算の仕方について知り，計算すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　そろばんの仕組みに着目し，大きな数や小数の計算の仕方を考えること。"],"notes":null,"units":[{"u":"そろばん","b":"3年下","s":0}]},{"id":"sansu-3-B-1","g":[3],"area":"B","areaName":"図形","mark":"⑴","head":"二等辺三角形・正三角形・角・円と球","title":"図形に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　二等辺三角形，正三角形などについて知り，作図などを通してそれらの関係に次第に着目すること。","（イ）　基本的な図形と関連して角について知ること。","（ウ）　円について，中心，半径，直径を知ること。また，円に関連して，球についても直径などを知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素に着目し，構成の仕方を考えるとともに，図形の性質を見いだし，身の回りのものの形を図形として捉えること。"],"notes":["⑹　内容の「Ｂ図形」の⑴の基本的な図形については，定規，コンパスなどを用いて，図形をかいたり確かめたりする活動を重視するとともに，三角形や円などを基にして模様をかくなどの具体的な活動を通して，図形のもつ美しさに関心をもたせるよう配慮するものとする。"],"units":[{"u":"円と球","b":"3年上","s":0},{"u":"三角形と角","b":"3年下","s":0}]},{"id":"sansu-3-C-1","g":[3],"area":"C","areaName":"測定","mark":"⑴","head":"長さ（km）と重さ（g・kg）の単位","title":"量の単位と測定に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　長さの単位（キロメートル（km））及び重さの単位（グラム（g），キログラム（kg））について知り，測定の意味を理解すること。","（イ）　長さや重さについて，適切な単位で表したり，およその見当を付け計器を適切に選んで測定したりすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　身の回りのものの特徴に着目し，単位の関係を統合的に考察すること。"],"notes":["⑺　内容の「Ｃ測定」の⑴については，重さの単位のトン（t）について触れるとともに，接頭語（キロ（k）やミリ（m））についても触れるものとする。"],"units":[{"u":"長さ","b":"3年上","s":0},{"u":"重さ","b":"3年下","s":0}]},{"id":"sansu-3-C-2","g":[3],"area":"C","areaName":"測定","mark":"⑵","head":"秒・時刻や時間の求め方","title":"時刻と時間に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　秒について知ること。","（イ）　日常生活に必要な時刻や時間を求めること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　時間の単位に着目し，時刻や時間の求め方について考察し，日常生活に生かすこと。"],"notes":null,"units":[{"u":"時こくと時間","b":"3年上","s":0}]},{"id":"sansu-3-D-1","g":[3],"area":"D","areaName":"データの活用","mark":"⑴","head":"表の整理と棒グラフ","title":"データの分析に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　日時の観点や場所の観点などからデータを分類整理し，表に表したり読んだりすること。","（イ）　棒グラフの特徴やその用い方を理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　データを整理する観点に着目し，身の回りの事象について表やグラフを用いて考察して，見いだしたことを表現すること。"],"notes":["⑻　内容の「Ｄデータの活用」の⑴のアの（イ）については，最小目盛りが２，５又は 20，50 などの棒グラフや，複数の棒グラフを組み合わせたグラフなどにも触れるものとする。"],"units":[{"u":"表とグラフ","b":"3年上","s":0},{"u":"しりょうの活用","b":"3年下","s":0}]},{"id":"sansu-4-A-1","g":[4],"area":"A","areaName":"数と計算","mark":"⑴","head":"億・兆の単位と十進位取り記数法","title":"整数の表し方に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　億，兆の単位について知り，十進位取り記数法についての理解を深めること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数のまとまりに着目し，大きな数の大きさの比べ方や表し方を統合的に捉えるとともに，それらを日常生活に生かすこと。"],"notes":["⑴　内容の「Ａ数と計算」の⑴については，大きな数を表す際に，３桁ごとに区切りを用いる場合があることに触れるものとする。"],"units":[{"u":"大きい数","b":"4年上","s":0}]},{"id":"sansu-4-A-2","g":[4],"area":"A","areaName":"数と計算","mark":"⑵","head":"がい数・四捨五入・見積もり","title":"概数に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　概数が用いられる場合について知ること。","（イ）　四捨五入について知ること。","（ウ）　目的に応じて四則計算の結果の見積りをすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　日常の事象における場面に着目し，目的に合った数の処理の仕方を考えるとともに，それを日常生活に生かすこと。"],"notes":["⑵　内容の「Ａ数と計算」の⑵のアの（ウ）及び⑶については，簡単な計算は暗算でできるよう配慮するものとする。また，暗算を筆算や見積りに生かすよう配慮するものとする。"],"units":[{"u":"がい数","b":"4年下","s":0}]},{"id":"sansu-4-A-3","g":[4],"area":"A","areaName":"数と計算","mark":"⑶","head":"わり算の筆算（÷1けた・÷2けた）","title":"整数の除法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　除数が１位数や２位数で被除数が２位数や３位数の場合の計算が，基本的な計算を基にしてできることを理解すること。また，その筆算の仕方について理解すること。","（イ）　除法の計算が確実にでき，それを適切に用いること。","（ウ）　除法について，次の関係を理解すること。（被除数）＝（除数）×（商）＋（余り）","（エ）　除法に関して成り立つ性質について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること。"],"notes":["⑵　内容の「Ａ数と計算」の⑵のアの（ウ）及び⑶については，簡単な計算は暗算でできるよう配慮するものとする。また，暗算を筆算や見積りに生かすよう配慮するものとする。","⑶　内容の「Ａ数と計算」の⑶については，第１学年から第４学年までに示す整数の計算の能力を定着させ，それを用いる能力を伸ばすことに配慮するものとする。","⑷　内容の「Ａ数と計算」の⑶のアの（エ）については，除数及び被除数に同じ数をかけても，同じ数で割っても商は変わらないという性質などを取り扱うものとする。"],"units":[{"u":"わり算","b":"4年上","s":0},{"u":"（２けた）÷（１けた）の計算","b":"4年上","s":0},{"u":"１けたでわるわり算","b":"4年上","s":0},{"u":"２けたでわるわり算","b":"4年上","s":0}]},{"id":"sansu-4-A-4","g":[4],"area":"A","areaName":"数と計算","mark":"⑷","head":"小数のたし算・ひき算，小数×整数・小数÷整数","title":"小数とその計算に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　ある量の何倍かを表すのに小数を用いることを知ること。","（イ）　小数が整数と同じ仕組みで表されていることを知るとともに，数の相対的な大きさについての理解を深めること。","（ウ）　小数の加法及び減法の計算ができること。","（エ）　乗数や除数が整数である場合の小数の乗法及び除法の計算ができること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数の表し方の仕組みや数を構成する単位に着目し，計算の仕方を考えるとともに，それを日常生活に生かすこと。"],"notes":["⑸　内容の「Ａ数と計算」の⑷のアの（エ）については，整数を整数で割って商が小数になる場合も含めるものとする。"],"units":[{"u":"小数","b":"4年下","s":0},{"u":"計算のしかたを考えよう","b":"4年下","s":0},{"u":"小数のかけ算とわり算","b":"4年下","s":0}]},{"id":"sansu-4-A-5","g":[4],"area":"A","areaName":"数と計算","mark":"⑸","head":"大きさの等しい分数・同分母分数のたし算・ひき算","title":"分数とその加法及び減法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　簡単な場合について，大きさの等しい分数があることを知ること。","（イ）　同分母の分数の加法及び減法の計算ができること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数を構成する単位に着目し，大きさの等しい分数を探したり，計算の仕方を考えたりするとともに，それを日常生活に生かすこと。"],"notes":null,"units":[{"u":"分数","b":"4年下","s":0}]},{"id":"sansu-4-A-6","g":[4],"area":"A","areaName":"数と計算","mark":"⑹","head":"四則混合の式・公式・□や△を使った式","title":"数量の関係を表す式に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　四則の混合した式や（　）を用いた式について理解し，正しく計算すること。","（イ）　公式についての考え方を理解し，公式を用いること。","（ウ）　数量を□，△などを用いて表し，その関係を式に表したり，□，△などに数を当てはめて調べたりすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　問題場面の数量の関係に着目し，数量の関係を簡潔に，また一般的に表現したり，式の意味を読み取ったりすること。"],"notes":null,"units":[{"u":"式と計算","b":"4年下","s":0},{"u":"面積","b":"4年下","s":0},{"u":"ともなって変わる量","b":"4年下","s":0}]},{"id":"sansu-4-A-7","g":[4],"area":"A","areaName":"数と計算","mark":"⑺","head":"計算のきまり（交換・結合・分配法則）","title":"計算に関して成り立つ性質に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　四則に関して成り立つ性質についての理解を深めること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数量の関係に着目し，計算に関して成り立つ性質を用いて計算の仕方を考えること。"],"notes":["⑹　内容の「Ａ数と計算」の⑺のアの（ア）については，交換法則，結合法則，分配法則を扱うものとする。"],"units":[{"u":"式と計算","b":"4年下","s":0}]},{"id":"sansu-4-A-8","g":[4],"area":"A","areaName":"数と計算","mark":"⑻","head":"そろばんでのたし算・ひき算","title":"そろばんを用いた数の表し方と計算に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　加法及び減法の計算をすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　そろばんの仕組みに着目し，大きな数や小数の計算の仕方を考えること。"],"notes":null,"units":[{"u":"そろばん","b":"4年下","s":0}]},{"id":"sansu-4-B-1","g":[4],"area":"B","areaName":"図形","mark":"⑴","head":"垂直・平行と四角形（平行四辺形・ひし形・台形）","title":"平面図形に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　直線の平行や垂直の関係について理解すること。","（イ）　平行四辺形，ひし形，台形について知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素及びそれらの位置関係に着目し，構成の仕方を考察し図形の性質を見いだすとともに，その性質を基に既習の図形を捉え直すこと。"],"notes":["⑺　内容の「Ｂ図形」の⑴については，平行四辺形，ひし形，台形で平面を敷き詰めるなどの操作的な活動を重視するよう配慮するものとする。"],"units":[{"u":"垂直・平行と四角形","b":"4年上","s":0}]},{"id":"sansu-4-B-2","g":[4],"area":"B","areaName":"図形","mark":"⑵","head":"立方体・直方体，見取図・展開図","title":"立体図形に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　立方体，直方体について知ること。","（イ）　直方体に関連して，直線や平面の平行や垂直の関係について理解すること。","（ウ）　見取図，展開図について知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素及びそれらの位置関係に着目し，立体図形の平面上での表現や構成の仕方を考察し図形の性質を見いだすとともに，日常の事象を図形の性質から捉え直すこと。"],"notes":null,"units":[{"u":"直方体と立方体","b":"4年下","s":0}]},{"id":"sansu-4-B-3","g":[4],"area":"B","areaName":"図形","mark":"⑶","head":"ものの位置の表し方（平面・空間）","title":"ものの位置に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　ものの位置の表し方について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　平面や空間における位置を決める要素に着目し，その位置を数を用いて表現する方法を考察すること。"],"notes":null,"units":[{"u":"直方体と立方体","b":"4年下","s":0}]},{"id":"sansu-4-B-4","g":[4],"area":"B","areaName":"図形","mark":"⑷","head":"面積の単位と長方形・正方形の面積","title":"平面図形の面積に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　面積の単位（平方センチメートル（cm2），平方メートル（m2），平方キロメートル（km2））について知ること。","（イ）　正方形及び長方形の面積の計算による求め方について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　面積の単位や図形を構成する要素に着目し，図形の面積の求め方を考えるとともに，面積の単位とこれまでに学習した単位との関係を考察すること。"],"notes":["⑻　内容の「Ｂ図形」の⑷のアの（ア）については，アール（a），ヘクタール（ha）の単位についても触れるものとする。"],"units":[{"u":"面積","b":"4年下","s":0}]},{"id":"sansu-4-B-5","g":[4],"area":"B","areaName":"図形","mark":"⑸","head":"角の大きさ（度）と分度器","title":"角の大きさに関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　角の大きさを回転の大きさとして捉えること。","（イ）　角の大きさの単位（度（°））について知り，角の大きさを測定すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形の角の大きさに着目し，角の大きさを柔軟に表現したり，図形の考察に生かしたりすること。"],"notes":null,"units":[{"u":"角","b":"4年上","s":0}]},{"id":"sansu-4-C-1","g":[4],"area":"C2","areaName":"変化と関係","mark":"⑴","head":"伴って変わる二つの数量と折れ線グラフ","title":"伴って変わる二つの数量に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　変化の様子を表や式，折れ線グラフを用いて表したり，変化の特徴を読み取ったりすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　伴って変わる二つの数量を見いだして，それらの関係に着目し，表や式を用いて変化や対応の特徴を考察すること。"],"notes":null,"units":[{"u":"折れ線グラフ","b":"4年上","s":0},{"u":"ともなって変わる量","b":"4年下","s":0}]},{"id":"sansu-4-C-2","g":[4],"area":"C2","areaName":"変化と関係","mark":"⑵","head":"簡単な割合（何倍で比べる）","title":"二つの数量の関係に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　簡単な場合について，ある二つの数量の関係と別の二つの数量の関係とを比べる場合に割合を用いる場合があることを知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　日常の事象における数量の関係に着目し，図や式などを用いて，ある二つの数量の関係と別の二つの数量の関係との比べ方を考察すること。"],"notes":null,"units":null},{"id":"sansu-4-D-1","g":[4],"area":"D","areaName":"データの活用","mark":"⑴","head":"二つの観点での分類整理と折れ線グラフ","title":"データの収集とその分析に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　データを二つの観点から分類整理する方法を知ること。","（イ）　折れ線グラフの特徴とその用い方を理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　目的に応じてデータを集めて分類整理し，データの特徴や傾向に着目し，問題を解決するために適切なグラフを選択して判断し，その結論について考察すること。"],"notes":["⑼　内容の「Ｄデータの活用」の⑴のアの（ア）については，資料を調べるときに，落ちや重なりがないようにすることを取り扱うものとする。","⑽　内容の「Ｄデータの活用」の⑴のアの（イ）については，複数系列のグラフや組み合わせたグラフにも触れるものとする。"],"units":[{"u":"折れ線グラフ","b":"4年上","s":0},{"u":"しりょうの整理","b":"4年上","s":0},{"u":"しりょうの活用","b":"4年下","s":0}]},{"id":"sansu-5-A-1","g":[5],"area":"A","areaName":"数と計算","mark":"⑴","head":"偶数・奇数，約数・倍数","title":"整数の性質及び整数の構成に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　整数は，観点を決めると偶数と奇数に類別されることを知ること。","（イ）　約数，倍数について知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　乗法及び除法に着目し，観点を決めて整数を類別する仕方を考えたり，数の構成について考察したりするとともに，日常生活に生かすこと。"],"notes":["⑴　内容の「Ａ数と計算」の⑴のアの（イ）については，最大公約数や最小公倍数を形式的に求めることに偏ることなく，具体的な場面に即して取り扱うものとする。"],"units":[{"u":"倍数と約数","b":"5年上","s":0}]},{"id":"sansu-5-A-2","g":[5],"area":"A","areaName":"数と計算","mark":"⑵","head":"10倍，1/10・1/100 などの数と小数点の移動","title":"整数及び小数の表し方に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　ある数の 10 倍，100 倍，1000 倍，1/10，1/100 などの大きさの数を，小数点の位置を移してつくること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数の表し方の仕組みに着目し，数の相対的な大きさを考察し，計算などに有効に生かすこと。"],"notes":null,"units":[{"u":"小数と整数","b":"5年上","s":0}]},{"id":"sansu-5-A-3","g":[5],"area":"A","areaName":"数と計算","mark":"⑶","head":"小数のかけ算・わり算","title":"小数の乗法及び除法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　乗数や除数が小数である場合の小数の乗法及び除法の意味について理解すること。","（イ）　小数の乗法及び除法の計算ができること。また，余りの大きさについて理解すること。","（ウ）　小数の乗法及び除法についても整数の場合と同じ関係や法則が成り立つことを理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　乗法及び除法の意味に着目し，乗数や除数が小数である場合まで数の範囲を広げて乗法及び除法の意味を捉え直すとともに，それらの計算の仕方を考えたり，それらを日常生活に生かしたりすること。"],"notes":null,"units":[{"u":"小数のかけ算","b":"5年上","s":0},{"u":"小数のわり算","b":"5年上","s":0}]},{"id":"sansu-5-A-4","g":[5],"area":"A","areaName":"数と計算","mark":"⑷","head":"分数と小数・整数の関係，約分・通分のもとになる性質","title":"分数に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　整数及び小数を分数の形に直したり，分数を小数で表したりすること。","（イ）　整数の除法の結果は，分数を用いると常に一つの数として表すことができることを理解すること。","（ウ）　一つの分数の分子及び分母に同じ数を乗除してできる分数は，元の分数と同じ大きさを表すことを理解すること。","（エ）　分数の相等及び大小について知り，大小を比べること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数を構成する単位に着目し，数の相等及び大小関係について考察すること。","（イ）　分数の表現に着目し，除法の結果の表し方を振り返り，分数の意味をまとめること。"],"notes":null,"units":[{"u":"分数のたし算とひき算","b":"5年下","s":0},{"u":"分数と小数・整数","b":"5年下","s":0},{"u":"割合（１）","b":"5年下","s":0}]},{"id":"sansu-5-A-5","g":[5],"area":"A","areaName":"数と計算","mark":"⑸","head":"異分母分数のたし算・ひき算","title":"分数の加法及び減法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　異分母の分数の加法及び減法の計算ができること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　分数の意味や表現に着目し，計算の仕方を考えること。"],"notes":null,"units":[{"u":"分数のたし算とひき算","b":"5年下","s":0}]},{"id":"sansu-5-A-6","g":[5],"area":"A","areaName":"数と計算","mark":"⑹","head":"簡単な式で表される関係","title":"数量の関係を表す式に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　数量の関係を表す式についての理解を深めること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　二つの数量の対応や変わり方に着目し，簡単な式で表されている関係について考察すること。"],"notes":null,"units":[{"u":"比例","b":"5年上","s":0}]},{"id":"sansu-5-B-1","g":[5],"area":"B","areaName":"図形","mark":"⑴","head":"合同・多角形の性質・正多角形・円周率","title":"平面図形に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　図形の形や大きさが決まる要素について理解するとともに，図形の合同について理解すること。","（イ）　三角形や四角形など多角形についての簡単な性質を理解すること。","（ウ）　円と関連させて正多角形の基本的な性質を知ること。","（エ）　円周率の意味について理解し，それを用いること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素及び図形間の関係に着目し，構成の仕方を考察したり，図形の性質を見いだし，その性質を筋道を立てて考え説明したりすること。"],"notes":["⑵　内容の「Ｂ図形」の⑴については，平面を合同な図形で敷き詰めるなどの操作的な活動を重視するよう配慮するものとする。","⑶　内容の「Ｂ図形」の⑴のアの（エ）については，円周率は 3.14 を用いるものとする。"],"units":[{"u":"合同な図形","b":"5年上","s":0},{"u":"図形の角","b":"5年上","s":0},{"u":"正多角形と円","b":"5年下","s":0}]},{"id":"sansu-5-B-2","g":[5],"area":"B","areaName":"図形","mark":"⑵","head":"角柱・円柱","title":"立体図形に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　基本的な角柱や円柱について知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素に着目し，図形の性質を見いだすとともに，その性質を基に既習の図形を捉え直すこと。"],"notes":null,"units":[{"u":"立体","b":"5年下","s":0}]},{"id":"sansu-5-B-3","g":[5],"area":"B","areaName":"図形","mark":"⑶","head":"三角形・平行四辺形・ひし形・台形の面積","title":"平面図形の面積に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　三角形，平行四辺形，ひし形，台形の面積の計算による求め方について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素などに着目して，基本図形の面積の求め方を見いだすとともに，その表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと。"],"notes":null,"units":[{"u":"図形の面積","b":"5年下","s":0}]},{"id":"sansu-5-B-4","g":[5],"area":"B","areaName":"図形","mark":"⑷","head":"体積の単位と直方体・立方体の体積","title":"立体図形の体積に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　体積の単位（立方センチメートル（cm3），立方メートル（m3））について知ること。","（イ）　立方体及び直方体の体積の計算による求め方について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　体積の単位や図形を構成する要素に着目し，図形の体積の求め方を考えるとともに，体積の単位とこれまでに学習した単位との関係を考察すること。"],"notes":null,"units":[{"u":"体積","b":"5年下","s":0}]},{"id":"sansu-5-C-1","g":[5],"area":"C2","areaName":"変化と関係","mark":"⑴","head":"簡単な比例","title":"伴って変わる二つの数量に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　簡単な場合について，比例の関係があることを知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　伴って変わる二つの数量を見いだして，それらの関係に着目し，表や式を用いて変化や対応の特徴を考察すること。"],"notes":null,"units":[{"u":"比例","b":"5年上","s":0}]},{"id":"sansu-5-C-2","g":[5],"area":"C2","areaName":"変化と関係","mark":"⑵","head":"単位量あたりの大きさ・速さ","title":"異種の二つの量の割合として捉えられる数量に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　速さなど単位量当たりの大きさの意味及び表し方について理解し，それを求めること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　異種の二つの量の割合として捉えられる数量の関係に着目し，目的に応じて大きさを比べたり表現したりする方法を考察し，それらを日常生活に生かすこと。"],"notes":null,"units":[{"u":"単位量あたりの大きさ（１）","b":"5年上","s":0},{"u":"単位量あたりの大きさ（２）","b":"5年上","s":0}]},{"id":"sansu-5-C-3","g":[5],"area":"C2","areaName":"変化と関係","mark":"⑶","head":"割合・百分率","title":"二つの数量の関係に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　ある二つの数量の関係と別の二つの数量の関係とを比べる場合に割合を用いる場合があることを理解すること。","（イ）　百分率を用いた表し方を理解し，割合などを求めること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　日常の事象における数量の関係に着目し，図や式などを用いて，ある二つの数量の関係と別の二つの数量の関係との比べ方を考察し，それを日常生活に生かすこと。"],"notes":["⑷　内容の「Ｃ変化と関係」の⑶のアの（イ）については，歩合の表し方について触れるものとする。"],"units":[{"u":"割合（１）","b":"5年下","s":0},{"u":"割合（２）","b":"5年下","s":0}]},{"id":"sansu-5-D-1","g":[5],"area":"D","areaName":"データの活用","mark":"⑴","head":"円グラフ・帯グラフと統計的な問題解決","title":"データの収集とその分析に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　円グラフや帯グラフの特徴とそれらの用い方を理解すること。","（イ）　データの収集や適切な手法の選択など統計的な問題解決の方法を知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　目的に応じてデータを集めて分類整理し，データの特徴や傾向に着目し，問題を解決するために適切なグラフを選択して判断し，その結論について多面的に捉え考察すること。"],"notes":["⑸　内容の「Ｄデータの活用」の⑴については，複数の帯グラフを比べることにも触れるものとする。"],"units":[{"u":"いろいろなグラフ","b":"5年下","s":0},{"u":"データの活用","b":"5年下","s":0}]},{"id":"sansu-5-D-2","g":[5],"area":"D","areaName":"データの活用","mark":"⑵","head":"平均","title":"測定した結果を平均する方法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　平均の意味について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　概括的に捉えることに着目し，測定した結果を平均する方法について考察し，それを学習や日常生活に生かすこと。"],"notes":null,"units":[{"u":"平均","b":"5年上","s":0}]},{"id":"sansu-6-A-1","g":[6],"area":"A","areaName":"数と計算","mark":"⑴","head":"分数のかけ算・わり算","title":"分数の乗法及び除法に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　乗数や除数が整数や分数である場合も含めて，分数の乗法及び除法の意味について理解すること。","（イ）　分数の乗法及び除法の計算ができること。","（ウ）　分数の乗法及び除法についても，整数の場合と同じ関係や法則が成り立つことを理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　数の意味と表現，計算について成り立つ性質に着目し，計算の仕方を多面的に捉え考えること。"],"notes":["⑴　内容の「Ａ数と計算」の⑴については，逆数を用いて除法を乗法の計算としてみることや，整数や小数の乗法や除法を分数の場合の計算にまとめることも取り扱うものとする。","⑵　内容の「Ａ数と計算」の⑴については，第３学年から第６学年までに示す小数や分数の計算の能力を定着させ，それらを用いる能力を伸ばすことに配慮するものとする。"],"units":[{"u":"分数と整数のかけ算とわり算","b":"6年","s":0},{"u":"分数×分数","b":"6年","s":0},{"u":"分数÷分数","b":"6年","s":0},{"u":"小数と分数の計算","b":"6年","s":0}]},{"id":"sansu-6-A-2","g":[6],"area":"A","areaName":"数と計算","mark":"⑵","head":"文字（a・x）を使った式","title":"数量の関係を表す式に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　数量を表す言葉や□，△などの代わりに，a，x などの文字を用いて式に表したり，文字に数を当てはめて調べたりすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　問題場面の数量の関係に着目し，数量の関係を簡潔かつ一般的に表現したり，式の意味を読み取ったりすること。"],"notes":null,"units":[{"u":"文字と式","b":"6年","s":0}]},{"id":"sansu-6-B-1","g":[6],"area":"B","areaName":"図形","mark":"⑴","head":"縮図・拡大図，対称な図形","title":"平面図形に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　縮図や拡大図について理解すること。","（イ）　対称な図形について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素及び図形間の関係に着目し，構成の仕方を考察したり図形の性質を見いだしたりするとともに，その性質を基に既習の図形を捉え直したり日常生活に生かしたりすること。"],"notes":null,"units":[{"u":"対称","b":"6年","s":0},{"u":"拡大図と縮図","b":"6年","s":0}]},{"id":"sansu-6-B-2","g":[6],"area":"B","areaName":"図形","mark":"⑵","head":"身の回りの形のおよその面積","title":"身の回りにある形の概形やおよその面積などに関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　身の回りにある形について，その概形を捉え，およその面積などを求めること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素や性質に着目し，筋道を立てて面積などの求め方を考え，それを日常生活に生かすこと。"],"notes":null,"units":[{"u":"円の面積","b":"6年","s":0}]},{"id":"sansu-6-B-3","g":[6],"area":"B","areaName":"図形","mark":"⑶","head":"円の面積","title":"平面図形の面積に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　円の面積の計算による求め方について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素などに着目し，基本図形の面積の求め方を見いだすとともに，その表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと。"],"notes":["⑶　内容の「Ｂ図形」の⑶のアの（ア）については，円周率は 3.14 を用いるものとする。"],"units":[{"u":"円の面積","b":"6年","s":0}]},{"id":"sansu-6-B-4","g":[6],"area":"B","areaName":"図形","mark":"⑷","head":"角柱・円柱の体積","title":"立体図形の体積に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　基本的な角柱及び円柱の体積の計算による求め方について理解すること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　図形を構成する要素に着目し，基本図形の体積の求め方を見いだすとともに，その表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと。"],"notes":null,"units":[{"u":"立体の体積","b":"6年","s":0}]},{"id":"sansu-6-C-1","g":[6],"area":"C2","areaName":"変化と関係","mark":"⑴","head":"比例・反比例","title":"伴って変わる二つの数量に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　比例の関係の意味や性質を理解すること。","（イ）　比例の関係を用いた問題解決の方法について知ること。","（ウ）　反比例の関係について知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　伴って変わる二つの数量を見いだして，それらの関係に着目し，目的に応じて表や式，グラフを用いてそれらの関係を表現して，変化や対応の特徴を見いだすとともに，それらを日常生活に生かすこと。"],"notes":null,"units":[{"u":"比例と反比例","b":"6年","s":0}]},{"id":"sansu-6-C-2","g":[6],"area":"C2","areaName":"変化と関係","mark":"⑵","head":"比","title":"二つの数量の関係に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　比の意味や表し方を理解し，数量の関係を比で表したり，等しい比をつくったりすること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　日常の事象における数量の関係に着目し，図や式などを用いて数量の関係の比べ方を考察し，それを日常生活に生かすこと。"],"notes":null,"units":[{"u":"比とその利用","b":"6年","s":0}]},{"id":"sansu-6-D-1","g":[6],"area":"D","areaName":"データの活用","mark":"⑴","head":"代表値・度数分布と統計的な問題解決","title":"データの収集とその分析に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　代表値の意味や求め方を理解すること。","（イ）　度数分布を表す表やグラフの特徴及びそれらの用い方を理解すること。","（ウ）　目的に応じてデータを収集したり適切な手法を選択したりするなど，統計的な問題解決の方法を知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　目的に応じてデータを集めて分類整理し，データの特徴や傾向に着目し，代表値などを用いて問題の結論について判断するとともに，その妥当性について批判的に考察すること。"],"notes":null,"units":[{"u":"資料の整理","b":"6年","s":0},{"u":"データの活用","b":"6年","s":0}]},{"id":"sansu-6-D-2","g":[6],"area":"D","areaName":"データの活用","mark":"⑵","head":"起こり得る場合（並べ方・組み合わせ方）","title":"起こり得る場合に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。","lines":["ア　次のような知識及び技能を身に付けること。","（ア）　起こり得る場合を順序よく整理するための図や表などの用い方を知ること。","イ　次のような思考力，判断力，表現力等を身に付けること。","（ア）　事象の特徴に着目し，順序よく整理する観点を決めて，落ちや重なりなく調べる方法を考察すること。"],"notes":null,"units":[{"u":"ならべ方と組み合わせ方","b":"6年","s":0}]}],"kaisetsu":{"source":"小学校学習指導要領（平成29年告示）解説 算数編（文部科学省，平成29年7月）","items":{"sansu-1-A-1":{"page":78,"name":"数の構成と表し方","expl":{"intro":["具体物を操作しながら数に関わりをもつとともに算数に関心をもつ活動を行うことにより，ものの個数や人数などを比べたり数えたりすることなどの児童の日常生活や学校生活の場面と算数の学習をつなげていくことが大切である。","第１学年では，これを踏まえて，ものとものとを対応させてものの個数を比べる活動などから始め，やがて，その個数を正しく数えたり，個数を数字で表したりできるようにする。こうした活動を通して，数の大小や順序を知り，次第に数の概念や表し方を理解できるようにしていく。そして，数のまとまりに着目しながら，徐々に数の範囲を広げていく。また生活の中で実際に数を使うことで，数を使うよさを感じ，数についての感覚を豊かにしていく。","ここで育成される資質・能力は，第２学年以降の数の概念とその表し方や，数の性質の理解に生かされるものである。"],"k":["ア 個数を比べること","ものの個数を比べる場合，それぞれの個数を数えなくても，１対１の対応を付けることで，個数の大小や相等を判断できる。例えば，下の図では，ブロック■とおはじき●とを１対１に対応させることで，おはじき●の個数の方が大きいことが分かる。","■ ■ ■ ■","● ● ● ● ●","一方，音の回数のように見えないもの，通りすぎる車の台数のように動いているもの，校庭にある木の本数のように手元で操作できないものも，それらとおはじきなどを１対１に対応させれば，おはじきなどの個数で比べることができる。このように，数えることはものとものを１対１に対応させることが前提となるので，このことを丁寧に扱うことが大切である。","イ 個数や順番を数えること","ものの個数を数えるとき，数えるものの集合を明確に捉えることが大切である。次に，数える対象に「いち，に，さん，し，…」という数詞を順に対応させて唱え，最後の数でものの個数を表す。","また，ものの順番を調べる場合，対象に数を順に対応させていき，その対応する数によってその順番を知ることができる。このとき，最後の順番を表す数は，個数を表す数と一致する。","数としての０については，次のような意味で用いられることを次第に理解できるよう配慮する。例えば，ゲームで得点がない場合，具体的な量が１ずつ減少していってなくなる場合などのように，何もないという意味に用いたり，70や107の０のように，十進位取り記数法で空位を表すのに用いたり，数直線で，基準の位置を表すのに用いたりする。このような場合，０をほかの数と同様に数とみられるようにすることが大切である。","ウ 数の大小，順序と数直線","直線上に基準となる点を決めてそれに０を対応させ，決めた長さを単位にして目盛りを付け，点の位置で数を表した直線を数直線という。この数直線を用いると数の大小や順序，系列などを分かりやすく表現できる。","その導入では，一列に並んだものの順番を示すことなどと関連させながら扱うようにする。また，目盛りの単位が５や10などで示された数直線や，途中から目盛りが始まる数直線についても，次第に理解できるようにする。","なお，用語としての数直線は第３学年で扱う。","エ 一つの数をほかの数の和や差としてみること","整数についての理解は，ものの個数を数える操作に基づいて始め，次第に，一つの数を合成や分解により構成的にみることができるように活動を通して学んでいくようにする。このような数の合成や分解は，数の概念の形成に欠かせない。例えば下の図のように，５個のおはじきを分解された二つの部分の和としてみることができるようにする。","●と●●●●","●●と●●●","●●●と●●","●●●●と●","また，一つの数をほかの数と関係付けてみることも大切である。例えば，８を10に関係付けて，８は10より２小さいとみたり，式で10−２と表したりすることで，数を多面的にみることができる。","このような見方は，加法，減法の計算における繰り上がり，繰り下がりについての理解の素地として重要な内容であるので，数についての多面的な見方ができるようにし，数についての感覚を豊かにすることが大切である。","オ ２位数の表し方","第１学年では，十進位取り記数法の原理についての基礎的な理解を図ることをねらいとしている。","２位数については，10のまとまりの個数と端数という数え方を基にして表現されていることを理解し，数の構成についての感覚を豊かにする。","数を数字で書き表す場合，十進位取り記数法では，一，十，百などの単位の大きさを，位置で表現するので，記号が少なくてすむ。また，数の大小についての判断や，第２学年で学ぶ筆算形式による四則計算もこれによって簡単にできるようになるなど，この方法のもつよさに気付くようにすることが大切である。","なお，十進位取り記数法の理解を図るために「一の位」，「十の位」の意味と用語を指導する。例えば，43については，一の位は３，十の位は４であり，これは１が３個，10が４個あるという意味である。このように，数を単位の幾つ分の集まりと捉えたり，図や具体物で表したりすることで，数の大きさについての感覚を伴って用いられるようにしていく。","カ 簡単な場合の３位数の表し方","120程度までの簡単な場合について，３位数の表し方を指導する。ここでは，","100より１大きい数が101であることや，109より１大きい数が110であることなど，百より大きくなっても下２桁は１から99までを数えた時と同じように変化していることを120程度までの数に触れることで気付かせるようにする。そのために，具体物を数えて，100や10のまとまりの個数と端数によって個数を表す活動などに取り組み，２位数までの数の意味や表し方について確実に理解できるようにしたり，第２学年での３位数の学習への連続性や発展性をもてるようにしたりする。","キ 十を単位とした数の見方","10のまとまりをつくって数える活動などを通して，十を単位として数の大きさをみることができるようにする。","ここで，十を単位とした数の見方とは，「40は10の４個分である」というように数の中に10のまとまりを見付けたり，「10が６個で60になる」というように10の何個分かで何十になるとみたりするような見方である。","このような十を単位とした数の見方について指導することで，数の構成について理解を深めたり，十を単位としてみられる数の加法及び減法の計算の仕方の学習の素地とする。","ク まとめて数えたり等分したりすること","数の概念についての理解を深めるためには，数える活動を多様な方法で行うことが大切である。その際，具体物をまとめて数えることも指導する。２ずつ，５ずつ，10ずつなど幾つかずつにまとめて数え，１ずつ数えたときと比べ，まとめて数えるよさに気付くようにする。特に，10ずつのまとまり作って数えることは，十進位取り記数法の仕組みを理解する基礎となる。その際，既に幾つかずつにまとめられた具体物を数えるのではなく，自分で適当な大きさのまとまりを作って数えたものを整理して表すことが大切である。","具体物を等分することについては，全体を同じ数ずつ幾つかに分けたり，全体を幾つかに同じ数ずつ分けたりすることができるようにする。例えば，８本の鉛筆を，２本ずつや４本ずつなど，同じ数ずつ分けると何人に分けられるかを操作や図で説明したり，分けられた結果を式に表したりする。このようなことを通して，８という一つの数を多面的にみることができるようにし，数についての感覚を豊かにする。○○ ○○ ○○ ○○ ○○○○ ○○○○","２＋２＋２＋２ ４＋４","まとめて数えたことを，上のように図や式などに整理して表すことで，一つの数を同じ数のまとまりとしてみたり，等分した数としてみたりできるようにしていく。このように数をみることは，数についての感覚を豊かにし，乗法や除法を考える際の素地となり，自ら計算の仕方を考えていくことにつながっていく。"],"s":["ア  数のまとまりに着目し，数の大きさの比べ方や数え方を考え，それらを日常生活に生かすこと","数のまとまりに着目し，数の比べ方や数え方を考えること","具体物は，数詞と１対１に対応をさせて唱えることで，数えることができる。対象となる数が大きくなってくると，数え間違わないように数えることや，より手際よい数え方を工夫する必要が出てくる。","例えば２ずつ数えるといったように数のまとまりをつくり，そのまとまりに着目して数えたり比べたりする考えを見いだせるようにする。対象となる数が大きくなると，さらに大きなまとまりを考える必要が出てくる。","そこで，10のまとまりを作ると後から数え直す手間も少なくてすみ，かつ数字や言葉で表現する際にも容易であるよさに気付くようにすることが大切である。それは，数を10と幾つと捉えることや，10が幾つと端数と捉えることがそのまま十進位取り記数法での表現や命数法を用いての表現とつながるからである。","また，簡単な場合についての３位数のものを数える際には，10のまとまりの個数が多くなるので，10のまとまりをさらに10ずつまとめようと考えを進められるように指導する。","このように，具体物を数える活動に取り組み，その活動の中でよりよい数え方を考えていくようにすることで数のまとまりに着目することのよさに気付くようにしていく。","ただ，具体物を数に表すことばかりでなく，徐々に数字からその数の大きさを捉えたり大小を比べたりすることができるようにしていく必要もある。数字で表された数の大小の比べ方を考えるには，どの位の数字に着目すればよいのかということや，数を大小の順に一列に並べる活動などを通し，比べ方を考えていくことが大切である。","こうして考えた比べ方や数え方は，他者との対話的な学びによって，その理解が深まる。どのようにすればうまく比べたり数えたりできるのか，ということを比較の中から学ぶのである。","日常生活に生かすこと","アのアで示した個数を比べることは，机上のおはじきなどで行うだけでなく，二つのグループの人数を比べる場合に，一人ずつが手をつないでいくことで判断するなど，算数の学習を日常生活の場面で使うことが大切である。例えば，ドッジボールの勝ち負けを決める際，内野にいる人がセンターラインに沿って１対１に対応して並ぶことで，どちらのチームの方が人数が内野に多くの残っていたかを判断することができる。","また，アのクでは５とびで数えることを学習する。時刻を知りたいとき，時計の長い針が４を示していれば，５，10，15，20と数えて，20分であることが分かる。順に並ぶこと，数の大小を比べることで量の多少を比べること，時計をはじめ身の回りの数字を読むことなど日々の生活は，算数の学習を通して，効率的になったり豊かになったりする。そのようなことが算数を学ぶよさとして実感できるように，価値付けていくことが大切である。"]},"quoteEnd":0},"sansu-1-A-2":{"page":83,"name":"加法，減法","expl":{"intro":["第１学年では，加法及び減法の意味を考えたり，加法及び減法が用いられる場面を式に表したり，式を読み取ったりすることができるようにするとともに，１位数の加法及びその逆の減法の計算ができるようにすることをねらいとしている。また，数量の関係に着目し，計算の意味や計算の仕方を考えたりするとともに，それを日常生活に生かそうとする態度を養うことをねらいとしている。さらに，簡単な場合についての２位数などの加法及び減法の計算についても加法及び減法ができることを知り，数についての理解を深めることができるようにする。","ここで育成される資質・能力は，第２学年の２位数の加法及びその逆の減法などの考察に生かされるものである。"],"k":["ア 加法，減法が用いられる場合とそれらの意味","加法や減法が用いられる場合として，次のようなものを挙げることができる。この学年では，それぞれあ，い，うの場合を主として取り上げ，えやおについては，児童の実態に合わせて適宜取り扱うことが考えられる。","① 加法が用いられる場合","あ  ある数量に他の数量を追加したり，ある数量が増加したりしたときの数量の大きさを求める場合（増加）","い  同時に存在する二つの数量を合わせた大きさを求める場合（合併）","う  ある番号や順番から，さらに何番か後の番号や順番を求める場合（順序数を含む加法）","え  大小二つの数量の差と小さい方の数量が分かっており，大きい方の数量を求める場合（求大）","お  異種のものの数量を，同種のものの数量に置き換えて，二つの数量を合わせた大きさを求める場合（異種のものの数量を含む加法）","② 減法が用いられる場合","あ  ある数量から，他の数量を取り去ったり，ある数量が減少したりしたときの残りの数量の大きさを求める場合（求残）","い  二つの数量の差を求める場合（求差）","う  ある順番から，幾つか前の順番を求める場合や，二つの順番の違いを求める場合（順序数を含む減法）","え  大小二つの数量の差と大きい方の数量が分かっており，小さい方の数量を求める場合（求小）","お  異種のものの数量を，同種のものの数量に置き換えて，二つの数量の差を求める場合（異種のものの数量を含む減法）","これらの指導に当たっては，具体的な場面について，児童がどの場合も同じ加法や減法が適用される場として判断することができるようにすることが大切である。このように，加法や減法の用いられる場面を次第に一般化して，加法や減法の意味を具体的に捉えることができるようにすることを重視する。そして，加法は二つの集合を合わせた集合の要素の個数を求める演算であり，減法は一つの集合を二つの集合に分けたときの一方の集合の要素の個数を求める演算であることについて，具体物を用いた活動などを通して理解できるようにすることが大切である。","イ 加法，減法の式","加法や減法が用いられる具体的な場面を，＋や−の記号を用いた式に表したり，それらの式を具体的な場面に即して読み取ったり，式を読み取って図や具体物を用いて表したりすることができるようにする。","式は，具体的な場面の数量の関係を簡潔に表現したり，答えを求める過程を表現したりするものとして捉えられ，算数・数学固有の表現として重要なものである。式を読み取るとは，式からそれに対応する具体的な場面や数量の関係を捉えることである。そこから，言葉や図や具体物を用いて表すことができるようになる。指導に当たっては，加法や減法の式を，教室や学校の中での具体物や実生活での具体的場面に結び付けることができるようにするために，それらの式で表される場面を探して言葉や絵や図を用いて表したり，実生活で探した数量について式に表したり，問題づくりをしたりすることが考えられる。","例えば，あさがおの種について，昨日取れた個数と今日取れた個数を合わせた個数を求めることを，加法の式で表すことができる。また，８−３＝５の式から，「砂場で８人の子供が遊んでいます。３人の子供が帰りました。子供は５人になりました。」というような場面をつくることができる。さらに，６−３＋７の式からは，「りすが６ぴきいます。３びき帰りました。そこへ７ひき遊びに来ました。りすは全部で何びきになりましたか。」などの問題をつくり，絵を用いて表すこともできる。このような指導により，式についての理解を深め，式と具体的な場面とを結び付けられるようにする。","ウ １位数の加法とその逆の減法の計算","１位数と１位数との加法とその逆の減法については，和が10以下の加法及びその逆の減法と，和が10より大きい数になる加法及びその逆の減法に分けて考える。和が10より大きい数になる加法及びその逆の減法は，「10とあと幾つ」という数の見方を活用して計算する。","いずれの場合もその後の加法や減法の計算の基礎となる重要な内容である。指導に当たっては，具体物を用いた活動などを通して計算の仕方の理解を確実にするとともに，計算に習熟し，活用できるようにすることが大切である。","エ 簡単な場合の２位数などの加法，減法","２位数の加法，減法についても，１位数の場合と同様に，加法，減法が用いられることを理解するとともに，数についての理解を一層深めることをねらいとしている。","簡単な場合とは，次のようなものである。","① 十を単位としてみられる数の加法，減法","ここでの十を単位としてみられる数の加法及び減法とは，例えば， 20＋40や70−30のことである。これらの計算は，十を単位とした数の見方に関連させると，それぞれ，２＋４，７−３を基にして求めることができる。","なお，和が100を超えるような計算は第２学年で扱う。","② 繰り上がりや繰り下がりのない２位数と１位数との加法，減法","ここでの２位数と１位数との加法及び減法とは，例えば，13＋４や20＋５のような繰り上がりのない加法，15−２や38−８のような繰り下がりのない減法である。","このような簡単な場合について，２位数を含む加法及び減法を指導することで，１位数までの計算の理解を確実にしていくだけでなく，２位数までの数の理解もより確実にしていくようにする。"],"s":["ア  数量の関係に着目し，計算の意味や計算の仕方を考えたり，日常生活に生かしたりすること","数量の関係に着目し，計算の意味を考えること","具体的な場面に基づいて，数量の関係に着目し，計算の意味を考えることをねらいとしている。","指導に当たっては，アのアで示した加法及び減法が用いられる場合について，具体物や図を用いて表したりすることを通して，数量の関係を捉え，児童がどの場合も，同じ加法や減法が用いられる場として，判断できるようにすることが大切である。","例えば，「太郎さんは，前から８番目にいます。太郎さんの後ろに７人います。全部で何人いるでしょう。」という問題について，図を用いて表すと次のようになる。太郎  太郎","前 ○○○○○○○●○○○○○○○ ⇒ 前 ○○○○○○○●○○○○○○○","↑  ７人 ８人  ７人","８番目","この場合， 図の右のように，太郎が８番目にいるということは，太郎がいるところまでの人数は８人であり，同時に存在する二つの数量を合わせた大きさを求める場面と数量の関係が同じとみて，８＋７というように加法の式に表すことができる。このように，具体的な場面について，具体物や図を用いたりして表すことを通して，順序数を含む場面でも，数量の関係を捉え直すことで加法や減法が用いられる場合として判断することができるようにするとともに，日常の事象から，加法，減法の場面を見いだし，計算の意味と結び付けて解決していこうとする態度を養うことが大切である。","数量の関係に着目し，計算の仕方を考えること","加法及び減法の計算の仕方を考える場合，既習の数の見方や計算の仕方を活用することで，未習の計算の仕方を見付け出していくことができる。その際，今までの計算と違うところはどこか，どういう数なら今までの計算が使えるかを考えさせることが大切である。例えば，和が10より大きい数になる加法及びその逆の減法は，「10とあと幾つ」という数の見方や計算の意味に着目し，数を分解して足したり，引いたりすることで，既習の計算が使えるようになる。","加法の場合には様々な計算の仕方が考えられる。その主なものとしては，加数を分解する場合と被加数を分解する場合がある。例えば，８＋７の場合，加数の７を分けて（８＋２）＋５としたり，被加数の８を分けて５＋（３＋７）としたりして，数を分解して加えて10をつくり，10と５で15と計算する。","① ７を２と５に分ける。８に２を足して10になる。この10と５で15になる。○○○○○○○○ ○○ ○○○○○","８ ↓ ２  ５","○○○○○○○○ ○○ ○○○○○","② ８を５と３に分ける。３に７を足して10になる。この10と５で15になる。○○○○○ ○○○ ○○○○○○○","５ ３  ↓  ７","○○○○○ ○○○ ○○○○○○○","また，減法の場合にも様々な計算の仕方が考えられる。その主なものとしては，被減数の分解の仕方によって二通り考えられる。例えば12−７の場合，減加法では（10−７）＋２のように10から７を引いて，残り２を加える。減々法は，（12−２）−５のように順々に引いていく方法である。ブロックなどを操作する活動を取り入れるならば，10のまとまりから取っていく方法と，端数から取っていく方法の違いになる。どちらを主にして指導するかは，数の大きさに従い柔軟に対応できるようにすることを原則とするが，児童の実態に合わせて指導することが大切である。このように，新たな計算に出合ったときに，既に知っている計算で求めることができるよう，数の見方を工夫して解決しようとする態度や問題解決した過程や結果を具体物や図などを用いて表現し伝え合い，互いの考えを理解しようとする態度を養い，第２学年以降で計算の仕方を考える際に生かしていけるようにする。","日常生活に生かすこと","日常生活の場面では，第１学年で学習する加法や減法が用いられる場面が多く存在する。このようなときに，加法や減法の式に表すことでそのよさに気付かせ，加法や減法を日常生活に活かそうとする態度を養うことが大切である。","Ｂ 図形"]},"quoteEnd":0},"sansu-1-B-1":{"page":88,"name":"図形についての理解の基礎","expl":{"intro":["具体物を操作しながら図形に関わりをもつとともに算数に関心をもつ活動を行うことにより，積み木や箱などを積んだり並べたりすることや，折り紙を折ったり重ね合わせたり比べたりすることなどの児童の日常生活や学校生活の場面と算数の学習をつなげていくことが大切である。","第１学年では，これを踏まえて，身の回りにあるものの形を観察や構成の対象とし，形を見付けたり，形作りをしたりする活動を重視するとともに，構成や分解の様子を，言葉を使って表すことを指導する。これらの活動を通して，次第に，ものの色，大きさ，位置や材質を捨象して，形を認め，形の特徴について捉えることができるようにする。同時に，形について学ぶことの楽しさを感じる経験を通して，図形に対する関心を喚起し，感覚を豊かなものとする。","ここで育成される資質・能力は，第２学年での三角形，四角形などの考察に生かされるものである。"],"k":["ア 形とその特徴の捉え方","第１学年ではものの形に着目して，その形の特徴を捉えることを指導する。","「ものの形を認める」とは，児童の身の回りにある具体物の中から，色や大きさ，位置や材質などを捨象し，ものの形のみに着目してものを捉えることである。また，箱の形，筒の形，ボールの形などの身の回りにある立体については，立体を構成している面の形に着目して，「さんかく」，「しかく」，「まる」などの形を見付けることができることである。","このときは個々の辺の長さや角の大きさについては着目せず全体で形を捉えるため，例えば楽器のトライアングルのようにかどが丸みを帯びていたり，一部が切れている形も「さんかく」に含まれることになる。","「形の特徴を知る」とは，「さんかく」や「しかく」は「まる」と比べてかどがある，「さんかく」のかどは三つある，「さんかく」と「しかく」を比べるとかどの個数が異なるといった形状の特徴を捉えることができることである。また，箱の形は平らなところがあるが，ボールの形は平らなところがないといった立体の形状を捉えることや，筒の形は置き方によって，転がりやすくなったり，重ねて積み上げることができたりする形であること，また，ボールの形は転がりやすい形であること，箱の形は，重ねて積み上げることができる形であることなどの機能的な性質についても指導する。","イ 形の構成と分解","具体物を用いて形を作るとは，色板などを","直角二等辺三角形の色板を用いた","基本的な形作りの例","使って身の回りにある具体物の形を作った","・ましかく","り，作った形から逆に具体物を想像したりす","ることである。例えば，積み木や箱などの立","体を用いて身の回りにある具体物の形を作る","ことや，色板などを組み合わせたり点を結ん","・ながしかく","で身の回りにあるものの形を作ったりするこ","とが考えられる。具体物を用いて形を分解し","たりするとは，身の回りにある立体や色板等","を用いて作った形から，「さんかく」や「し","かく」などを見付けられるようにすることである。例えば，箱の側面の形を観察したり，その面を写し取った形と同じ形が身の回りのどこにあるかを見いだしたりすることを通して箱の形の多くは「しかく」で構成されていることを理解できるようにする。色板での形作りでは「しかく」は「さんかく」二枚で構成できること，「ましかく」が二つで「ながしかく」が構成できることなどに児童が気付けるよう配慮する。また，形を構成したり分解したりする活動では，ずらす，まわす，裏返すなどと図形を移動したり，ぴったり同じ形や大きさは違うが似ている形を作ったりすることなどの活動を豊富にさせることが大切である。","ウ 方向やものの位置","方向や位置に関する言葉には，前後，左右，上下などの方向を表すものと，一番前や何番目，真ん中などの位置を表すものがある。これらを用いる際には一定のものを基準として表現する必要があることを児童が理解することが大切である。","例えば，教室の中の二つのものの位置関係を表すために，「壁に掛かっている時計は時間割の上にある」や「自分から見て，黒板の左にテレビがある」というように表すことができるようにする。この学習では，実際に児童が一列に並ぶ体験や具体物を並べる活動を取り入れることで，方向や位置を実感的に捉えられるようにする。"],"s":["ア  ものの形に着目し，身の回りにあるものの特徴を捉えたり，具体的な操作を通して形の構成について考えたりすること。","ものの形に着目し身の回りにあるものの特徴を捉えるとは，ものの形や立体が身の回りでどのようなところに見られるか，それらの用いられ方にどのような特徴があるかということに気付いたり，敷き詰められた模様の中にいろいろな形を認めたりすることである。また，具体的な操作を通して形の構成について考えるとは，形を作ったり分解したりすることを通して，形の構成の仕方について考えることである。このような活動は，例えば色板などを用いて，ロケットや家の形をつくることなどが考えられる。さらに，箱の形であるならば平らな面を使って重ねたり立てたりすることができるというように，その形のもつ性質や特徴を用いて目的を達成したり問題を解決したりすることができるようにし，この学年以降も児童が図形に親しみを深めていけるよう指導することが大切である。","Ｃ 測定"]},"quoteEnd":0},"sansu-1-C-1":{"page":90,"name":"量と測定についての理解の基礎","expl":{"intro":["具体物を操作しながら量に関わりをもつとともに算数に関心をもつ活動を行うことにより，様々な量の大きさを比べるとなどの児童の日常生活や学校生活の場面と算数の学習をつなげていくことが大切である。","第１学年では，これを踏まえて，量の単位を用いて測定する前段階として，身の回りのものの特徴に着目し，量の大きさの比べ方を見いだしたり量の大きさを表現したりすることを主なねらいとしている。","第１学年の量と測定についての理解の基礎となる学習では，児童が体験を通して，学習の中で取り上げられた具体的なものの長さ，広さ，かさなど，身の回りに広くある量に関心をもって調べたり，身の回りのものの大きさの比べ方を見いだそうとしたりする態度を養う。ここで育成される資質・能力は，第２学年の以降の長さ，広さ，かさの大きさの測定や数値化などの学習に生かされるものである。"],"k":["ア 量の大きさの直接比較，間接比較","量の単位や測定の意味を指導する上で大切なことは，まず，直接あるいは間接的に大きさを比べる活動を通して，その量についての理解を深めていくことである。長さ，広さ，かさのうち，特に長さは，「測定」で取り扱う様々な量の中で基本的な量である。","量の大きさを比較する際，ものを移動して，直接重ね合わせることで比べることがある。これを直接比較という。直接比較で比べられない場合，","別のものに写し取ることや，水のようなかさであれば別の容器に","入れるなど媒介物を用いて間接的に比較することがある。これを","間接比較という。第１学年では，これらの活動を十分に行うこと","が大切である。","長さの直接比較については，例えば，２本の鉛筆の長さを比べ","るといった移動のできるものを比べる場合には，並べて置いたり","重ねたりして比べることができる。この場合は，一方の端を揃え","ることにより，反対側の端で長さの大小を比べることができる。","広さについては，例えば２枚のレジャーシートの大きさを比べ","る場合には，右のように角を揃えて重ねることにより，一方が他","方に完全に含まれるのであれば，広さの大小を比べることができ","る。","かさについては，長さや広さに比べて捉えにく","い場合がある。しかし，例えば，大きな箱の中に","小さな箱を直接入れることにより，二つのかさを","比べることができる。","量の大きさを比べる際，ものを移動して，直接重ね合わせることが難しい場合がある。その場合，媒介物を用いて量の大小を比べることができる。","長さの間接比較については，例えば，机の縦と横の長さを比べる場合は，紙テープや棒を用いて長さを写し取ることにより，基になる大きさと比べることができる。広さやかさの大きさも同様に，形を紙に写し取ったり，二つの入れ物にそれぞれにいっぱいに入れた水を第三の容器に移したりすると比べることができる。","このような直接比較や間接比較についての理解は，第３学年の重さや第４学年の角の大きさを比べる際にも必要になる。","イ 任意単位を用いた大きさの比べ方","量の大きさを比較する際，ものを移動して直接重ね合わせることが難しかったり，適当な大きさの媒介物がなかったりする場合がある。また，二つや三つの量を比べるのでなく，多くのものの量を比べる場合がある。そのようなとき，測るものより小さい任意のものの大きさを単位として，それが幾つ分あるかを調べることで，大きさを数で表すことができ，その数で比べることができる。","長さの任意単位による測定については，例えば，机の縦と横の長さを，鉛筆の長さの幾つ分かに置き換えるなどの具体的な操作を通して調べ，これを数で表せば比べることができる。","広さについては，例えば，それぞれの広さの上に同じ大きさの色板を並べ，色板が幾つ分あるかを数えることで比べることができる。色板を並べたり，方眼紙を塗りつぶしたりといった活動を通して，任意単位を用いた広さの比べ方を理解できるようにする。","かさについては，二つの容器いっぱいに入れた水を，同じコップや茶碗で何杯分あるかを数えるなどして比べることができる。","このように，身の回りにあるものの大きさを単位として数値化することにより，大きさの違いを数に表して比べることができるようになる。様々な場面で，比較や測定を行うことを通して，長さが長いとは，広さが広いとは，かさが大きいとはといったそれぞれの量の意味やその測定の仕方についての理解をより確かなものにしたり，量の大きさについての感覚を豊かにしたりする。","なお，属性の捨象や量の保存性，量の加法性といった量のもつ基本的な性質については，ア，イの活動を通して次第に理解できるようにしていく。"],"s":["ア 身の回りのものの特徴に着目し，量の大きさの比べ方を見いだすこと","身の回りにあるものから，まず，比べたい量を明確にすることが大切である。例えば，２冊の本の大きさについて比べようとするとき，「どちらの本が長いのか」「どちらの本が広いのか」「どちらの本が厚いのか」というように，どの量に着目しているのかを明確にする必要がある。そして，その目的に応じて直接比較をして比べる。また，どのくらい違うのかを知りたいときは数値化して比べる。このように，目的に応じて効率よく量の大きさを比べることが大切である。さらに比較の過程では，比べ方について問いを見いだしたり，試行錯誤したりすることが大切である。そして，長さでの比較や測定の仕方と同じように，広さやかさについても，直接比較，間接比較，任意単位による測定という比べ方ができることについて気付くことができるようにする。","また，比べ方の表現については，長さにおいては「大きい・小さい」ではなく，「長い・短い」という表現を用い，使われる長さ（距離）や場所によっては，「遠い・近い」「高い・低い」などの言葉でも多様に表現されることにも触れ，生活の中にある長さについての見方を広げていくことも大切である。"]},"quoteEnd":0},"sansu-1-C-2":{"page":93,"name":"時刻の読み方","expl":{"intro":["具体物を操作しながら時刻に関わりをもつとともに算数に関心をもつ活動を行うことにより，児童の日常生活や学校生活の場面と算数の学習をつなげていくことが大切である。","第１学年では，これを踏まえて，時刻を表す単位に着目し，日常生活で時刻を読み，時刻と日常生活と関連付けることを主なねらいとしている。","第１学年の時刻の学習は，児童が生活する上で必要な時刻を意識して，主体的に生活の予定を考えたり，時刻の見通しをもって行動したり，時刻を守って楽しく生活しようとしたりすることがねらいである。ここで育成される資質・能力は，第２学年以降の時刻と時間の考察や，それらを日常生活に生かす素地となるものである。"],"k":["ア 時刻の読み方","学校生活や日常生活では，時刻を読んで行動することは必要なことである。短針と長針の位置を基に，それぞれの針が示す数と時刻を表す数との対応を理解し，時計の観察や操作を通して時刻を読むことができるようにする。"],"s":["ア 時刻の読み方を用いて，時刻と日常生活を関連付けること","学校生活を含む日常生活の場面における幾つかの時刻とその読み方の例示から，どのように時刻を読むのかを考えたり，時刻を表す単位に着目し，短針や長針の役割（何時，何分）について考えたりする。","また，右の図のような曖昧な位置にある短針について，時","計の短針と長針が連動していることや，「８時は過ぎたけれ","ど，まだ１時間目が始まる９時にはなっていない」というよ","うに，時刻と日常生活を関連付けて捉えることが大切である。","また，「そろそろ９時だから１時間目の準備をしよう」と時","刻を基に行動を決めることも大切である。","与えられた時刻を読んだり表したりするだけでなく，児童の日常生活での活動などと時刻とを関連させ，学習の時間以外の学校生活や家庭生活で適切に用い，時刻への関心を高めていくことが大切である。","Ｄ データの活用"]},"quoteEnd":0},"sansu-1-D-1":{"page":94,"name":"絵や図を用いた数量の表現","expl":{"intro":["具体物を操作しながら数量に関わりをもつとともに算数に関心をもつ活動を行うことにより，ものの個数や人数などを比べたり，数えたりすることなどの児童の日常生活や学校生活の場面と算数の学習をつなげていくことが大切である。","第１学年では，これを踏まえて，身の回りの事象について関心をもち，個数に着目して簡単な絵や図などに表したり，それらを読み取ったりすることでその事象の特徴を捉えることをねらいとしている。","この内容は，第２学年の簡単な表やグラフを用いて考察することの素地となるものである。"],"k":["ア 絵や図を用いた数量の表現","ものの個数を数えたり比べたりするとき，幾つかの種類のものについて，種類ごとに分類整理することで数えやすくなる。例えば，きりん，ぞう，うさぎ，しまうまなどを比べるとき，次の図のように並べてみることで一目で数の大小を比べることができるようになる。この図からは，うさぎが最も数が多いことやぞうとしまうまが同じ数であることなどを読み取ることができる。","対象を絵などに置き換える際には，それらの大きさを揃えることや，並べる際に均等に配置することが必要であることを理解できるようにする。","ここののまままま","並並べべるる→→","↓均等に配置する","大大ききささをを揃揃ええるる。。"],"s":["ア データの個数に着目し，身の回りの事象の特徴を捉えること","データの個数に着目し，身の回りの事象の特徴を捉えるとは，身の回りの事象に関する数の大小関係を，絵などを用いて整理して表現し，どの項目がどの程度多いのかといったことを捉えることである。","例えば，学級内でどの果物が人気があるのかについて興味をもった際に，一人一つずつ好きな果物を絵に描いて集めるとする。絵の大きさが個人によって異なっていたとしても，それを種類ごとに均等に配置して並べることで，個数を数えることは容易にできる。また，どの果物が人気があるのかについても積み上げた高さが最も高いものであるということからすぐに判断できる。この結果から，自分の学級ではどの果物が人気があるのか，ほかの果物はどの程度人気があるのかなどについて知ることができる。"]},"quoteEnd":0},"sansu-2-A-1":{"page":104,"name":"数の構成と表し方","expl":{"intro":["第１学年では，120程度までの数について，数のまとまりに着目し，数の比べ方や数え方を考えることを指導してきた。","第２学年では数の範囲を４位数まで広げて，数の概念や性質についての理解を深めるとともに，乗法的な見方や数の用いられ方についても指導し，数を用いる能力を伸ばし，数についての感覚をより豊かにすることをねらいとしている。また，数への関心を高め，主体的に数に関わる態度を育んでいく。","ここで育成される資質・能力は，第３学年での万の単位，第４学年での億や兆の単位の学習につながり，その素地となるものである。"],"k":["ア まとめて数えたり，分類して数えたりすること","必要に応じてものの個数を２ずつ，５ずつ，10ずつまとめて数えたり，ものの色，形，位置，種類などに目を付けて分類して数えたりすることを指導する。同じ大きさの数ずつまとめて数えることは，乗法の意味の理解につながるものである。さらに，多くのものの個数を数えるときに，10ずつのまとまりを作り，それをさらに10ずつのまとまりにして数えていくことは，十進位取り記数法に発展していく。","イ 十進位取り記数法","数の範囲を４位数までに広げ，十進位取り記数法による数の表し方及び数の大小，順序などについて知り，数についての理解を深めるようにする。この際，３位数から４位数へと数の範囲を徐々に広げて理解を深められるような配慮が必要である。十進位取り記数法は，それぞれの位を単位とする数が10になると次の位に進み，10に満たない端数がそれぞれの位の数字として表されることと，位置によってその単位の大きさを表す数が示されるということから成り立っている。位ごとに異なる記号を用いるのではないところにその特徴がある。","また，数の読み方との比較によって，記数法の特徴を理解することができる。例えば，8235を読むときには，全ての位を言うことになる。8000を読むときには，必要な位だけを言えばよいが，書くときには０を各位に記入しておかなければならない。","ここで，数の大小を調べることに関連して，数の大小関係を不等号「＞」，「＜」を用いて簡潔に表現できることを指導する。","「内容の取扱い」の（1）では，「１万についても取り扱うものとする」と示している。9999の次の数などとして１万について取り扱うことで，第３学年で指導する１万を超える数へと連続性や発展性をもって接続できるよう配慮することが大切である。","ウ 数の相対的な大きさ","「数の相対的な大きさについての理解」とは，十，百などを単位として，数の大きさを捉えることである。例えば，6000を「10が600個集まった数」とみたり「100が60個集まった数」とみたりすることである。数の相対的な大きさを捉えることによって，数の仕組みについての理解を深めるとともに，数についての感覚を豊かにすることをねらいとしている。その際には，形式的な指導でなく，具体物を用いた活動を通して，数の相対的な大きさについて理解できるようにすることが大切である。","数を相対的な大きさで理解することは，今後計算の結果を見積ったり，除法の計算をするとき，商の大きさを捉えたりすることに有効に働くものであり，その基礎となる力を養うためにも大切である。","エ 一つの数をほかの数の積としてみること","ものの集まりを幾つかずつにまとめて数えることを通して，数の乗法的な構成についての理解を図ることをねらいとしている。また，ある部分の大きさを基にして，その幾つ分として，全体の大きさを捉えることができるようにする。","例えば，「12個のおはじきを工夫して並べる」という活動を行うと，いろいろな並べ方ができる。下の図のように並べると，２×６，６×２，３×４，４×３などのような式で表すことができる。このように，一つの数をほかの数の積としてみることができるようにし，数についての理解を深めるとともに，数についての感覚を豊かにする。","●●●●●● ●●●●","●●●●●● ●●●●","●●●●","２×６又は６×２ ３×４又は４×３","オ 数による分類整理","現代の生活では様々なところに数が使われている。例えば，電話番号，自動車のナンバー，ホテルやマンションの部屋の番号，図書の分類番号など，物事を分類整理した結果を表すのに数を用いる場合がある。例えばホテルの部屋の番号では，517は５階の17号室を表すとするなどである。分類整理してその結果を数を用いて示す考え方については，日常生活との関連に配慮し，具体的な経験を通して，そのよさを理解できるようにする。","カ ， などの簡単な分数","簡単な分数とは， ， ， のように，具体物を操作することによって得ら２   ３   ４","れる大きさを表した，分母が１桁程度の単位分数のことである。","１，２，３，４，…などの数を用いると，ものの個数などを表すことができるが，ものを半分にした大きさを表すことまではできない。分数を用いると，半分にした大きさなどを表すことができる。","折り紙やロープなどの具体物を半分にすると，元の大きさの の大きさができ２","る。 は「二分の一」と読む。これは，二つに等分した大きさの一つ分という意２","味である。それらを更に半分にすると，元の大きさの の大きさができる。これは，４","四つに等分した大きさの一つ分という意味である。このような活動を更に続けると，１","元の大きさの の大きさができる。","このように具体物を操作することによって， ， ， などの大きさをつくる２   ４   ８","ことや， ， ， などの数を分数と呼ぶことを指導する。","さらに， ， ， などの大きさをつくる具体的な活動を通して，乗法及び除２   ３   ４","法の見方の素地となるように指導する。おはじきなどの具体物を用いて，元の大き１  １","さとその の大きさや の大きさを直接に比べて，その観察を通して，「…の半２   ３","分の大きさ（ ）」「…を三つに分けた一つ分の大きさ（ ）」であることを確かめ，２   ３","そうした表現を用いることができるようにする。","例えば，12個のおはじきが次の図のように並んでいるとする。この図から，12１  １  １","個の は６個で，12個の は４個で，12個の は３個とみることができる。","○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○","○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○ ○","○ ○ ○ ○ ○ ○ ○ ○","○ ○ ○ ○ ○ ○ ○ ○","12個の は６個  12個の は４個 12個の は３個","同じ図で見方を変えると，12個は６個の２倍であり，４個の３倍であり，３個１  １","の４倍ともみられる。このように，元の大きさの の大きさや の大きさから元２   ３","の大きさをみると「…の２倍の大きさ」，「…の３倍の大きさ」などの見方ができることについても知ることができるようにする。また，このように「ａの大きさの２１  １","倍（ ）がｂの大きさ」という場合は，「２倍（ ）」という言葉だけでは，ｂの２   ２","大きさをはっきり表すことにはならないので，ａの大きさをはっきりさせる必要があることについても知ることができるようにする。例えば，具体的に，元の大きさ１","が40の場合と元の大きさが４の場合では，２倍（又は ）の大きさが変わること２","を確かめるとよい。","分数の意味や表し方については，第３学年から本格的に指導するが，第２学年では，分数についての理解の素地となる学習活動を行い，分数の意味を実感できるようにするとともに，日常生活で生かすようにすることがねらいである。"],"s":["ア  数のまとまりに着目し，大きな数の比べ方や数え方を考え，日常生活に生かすこと","数のまとまりに着目し，大きな数の比べ方や数え方を考えること","具体物の手際のよい比べ方や数え方を考えていくことができるようにすることがねらいである。扱う数の大きさが第１学年より大きくなっているため，後で比べたり数え直したりが容易になるように，工夫して数える必要が出てくる。そこから，数のまとまりに着目するよさに気付くことができるようにする。","例えば，マス目のような静止して整ったものを数える場面があるとする。数える数が４位数になると，初めは１ずつや２ずつ数えていても，幾つか数えていく中で，同じまとまりを作って数えるとよいことを見いだしていく。そうすると，その後は，そのまとまりが分かるように囲んでいく。そして，そのまとまりの数を数える。そのまとまりの数が多ければ，まとまりからさらに大きなまとまりを作る。このようにしてより手際よい方法を考えていく。","また，例えば4035と912といった桁数の異なるものを比べたり，3781と3871といった桁数の同じものを比べたりして，どちらが大きいか，またどのように判断したのかを具体物や図，数直線などを使って表現できるようにしていくことも大切である。","日常生活に生かすこと","大きな数を数えたり比べたりできるようになっていることを，様々な場面で使うようにしていく。例えば，生活科で育てたひまわりの種を数えることや，木の実を拾った数を数えることなどが考えられる。また数で表したり，数で表されたものを比べたりすることも積極的に取り入れたい。第３学年以降で学習する５位数より大きい数は，実際に数えることは難しくなる。この学年では具体物と数とを結びつける活動を十分に行うようにすることが大切である。"]},"quoteEnd":0},"sansu-2-A-2":{"page":108,"name":"加法，減法","expl":{"intro":["第１学年では，１位数と１位数との加法及びその逆の減法について，数量の関係に着目し，計算の意味や計算の仕方を考えることを指導してきた。","第２学年では，２位数の加法及びその逆の減法の計算ができるようにするとともに，それらの筆算の仕方や，加法及び減法に成り立つ性質，加法と減法との相互関係について理解できるようにすることをねらいとしている。また，数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりできるようにするとともに，それらを活用して，計算を工夫したり計算の確かめをしたりすることができるようにすることをねらいとしている。","ここで育成される資質・能力は，第３学年の３位数や４位数の加法及び減法などの考察に生かされるものである。"],"k":["ア ２位数の加法とその逆の減法","第２学年では，初めに２位数の加法及びその逆の減法の計算を指導する。その際には，第１学年で指導した１位数と１位数との加法とその逆の減法及び簡単な場合の２位数の加法と減法を基にして，和と差を求めることができる。","例えば，28＋57の場合，一の位どうしを加えた８＋７＝15と，10のまとまりを加えた20＋50＝70とを合わせて85と計算することができる。このことをそのまま筆算として反映するならば，次のページの図の左のような形式化されていない状態のものが生まれてくることもある。繰り上がりの考え方が明確になったとき，通常行われている筆算を理解することができるようになっていく。","＋５７    ＋５７","１５ ・・・８＋７     ８５","→","＋７０ ・・・20＋50","このように各位の計算を，位を揃えてかけば，２位数の計算が各位の数の計算に帰着され，１位数の加法及びその逆の減法などの計算で処理できることになる。これを形式的に処理しやすくしたものが筆算形式である。なお，この計算方法は十進位取り記数法に基づく計算であり，以降の乗法や除法の計算の原理にもなる。なお，これらの計算の指導に当たっては，児童の実態に応じて，具体物や図などを用いることも大切である。","減法についても同様に，具体物や図などを用いて，計算の仕方を考えさせ，筆算を指導する。","なお，「内容の取扱い」の（2）では，「計算の結果の見積りについて配慮するものとする」と示されている。計算の仕方を考えたり計算の確かめをしたりするときなどに，計算の結果がおよそどのくらいの大きさになるのか，何桁の数になるのかを見積もることは，以降の計算指導においても大切である。","イ 簡単な場合の３位数などの加法，減法","２位数までの加法及びその逆の減法やこれまでの数の学習を基にして，簡単な場合について，３位数などの加法及び減法の仕方を知るとともに，計算の仕方についての理解を一層深めることをねらいとしている。","簡単な場合とは，次のようなものである。","① 百を単位としてみられる数の加法，減法","ここでの百を単位としてみられる数の加法及び減法とは，例えば， 800＋700，500−100などの計算である。これらの計算は，百を単位とした数の見方に関連させると，それぞれ，８＋７，５−１を基にして求めることができる。② ３位数と２位数などの加法及び減法","ここでの加法とは，百の位への繰り上がりがないもので，例えば，628＋７，234＋57などの計算である。また，減法とは，百の位からの繰り下がりがないもので，例えば，753−６，683−51，546−27などの計算である。","このような簡単な場合の３位数までの加法及び減法を指導することで，２位数までの計算の理解を確実にしていくだけでなく，３位数までの数の理解もより確実にしていくようにする。また，このような計算の仕方を理解することは，第３学年で取り扱う３位数や４位数についての加法及び減法の計算の仕方を考える際に有効に働くことになる。","ウ 加法及び減法に関して成り立つ性質","ここで取り扱う性質としては，第２学年の「内容の取扱い」の（3）で「交換法則や結合法則を取り扱うものとする」と示しているように，加法に関して成り立つ結合法則や交換法則を指導する。指導に当たっては，具体的な場面において，これらの法則が成り立つことを確かめ，理解できるようにすることが大切である。なお，計算法則そのものを一般的に調べていくのは，第４学年の内容である。","「内容の取扱い」の（2）では，「必要な場合には，（ ）や□などを用いることができる」と示されている。これは，加法に関して成り立つ結合法則についての理解を深める指導において，児童が工夫して取り組むことができるようにするためのものである。","エ 加法と減法との相互関係","三つの数量Ａ，Ｂ，Ｃについて，例えば，次の図のような関係にあるとき，ＡとＢが分かっていてＣを求める場合が加法で，Ａ＋Ｂ＝ＣやＢ＋Ａ＝Ｃとなる。","Ａ（男の子の人数） Ｂ（女の子の人数）","Ｃ（全体の人数）","また，ＣとＡ又はＢのいずれか一方が分かっていて，Ｂ又はＡを求める場合が減法で，Ｃ−Ａ＝ＢやＣ−Ｂ＝Ａとなる。このとき，加法と減法は三つの数量のどれを求めるかによって，相互に関係付けられている。このような加法と減法との関係を，加法と減法との相互関係という。","このような加法と減法との相互関係について，次の①，②，③のような場面を取り上げて指導する。","① 数量の関係表現は減法の形であるが，計算は加法を用いることになる場合例えば，「はじめにリンゴが幾つかあって，その中から５個食べたら７個残った。はじめに幾つあったか」を求めるような場合である。図で表せば，次のような場合で，□を７＋５として求める。","②  数量の関係表現は加法の形であるが，計算は減法を用いることになる場合例えば，「はじめにリンゴが幾つかあって，５個もらったら12個になった。はじめに幾つあったか」を求めるような場合である。","③ 減法の減数が未知のとき，その減数を求めるのに減法を用いる場合","例えば，「はじめにリンゴが12個あって，幾つか食べたので残りは７個になった。幾つ食べたか」を求めるような場合である。","なお，これらの場面を加法や減法の式で表すことを通して，式が事柄や数量の関係を簡潔に表すものであるという理解を深めるようにする必要がある。","なお，「内容の取扱い」の（2）では，「必要な場合には，（ ）や□などを用いることができる」と示されている。加法と減法との相互関係について理解する際に，図と関連付けることで，□を用いて□＋５＝12と表すことができることを示すものである。"],"s":["ア  数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること","数量の関係に着目し，計算の仕方を考えること","加法及び減法の計算の仕方を考える場合，既習の数の見方や計算の仕方を活用することで，未習の計算の仕方を見付け出していくことができる。その際，今までの計算と違うところはどこか，どういう数なら今までの計算が使えるかを考えさせることが大切である。例えば，２位数の加法及びその逆の減法の計算は，十進位取り記数法による数の表し方や数を十を単位としてみる見方に着目し，数を位ごとに足したり，引いたりすることで，既習の計算が使えるようになる。","指導に当たっては，第１学年で，１位数と１位数との加法及びその逆の減法は，「10とあと幾つ」という数の見方に着目し，数を分解して計算したことを想起させ，２位数をどのようにみると既習の計算が使えるのか考えさせることが大切である。その際，必要に応じて具体物や図などを用いて，計算の仕方を考えたり，説明したりできるようにする。また，見いだした計算の仕方を振り返り，位ごとに計算すると１位数どうしの計算に帰着できること，加法では，ある位の数が10集まったら，１繰り上がること，減法では，ある位の数どうしが引けないときは，１繰り下げて計算するという計算の仕組みに気付くことができるようにする。","数量の関係に着目し，計算に関して成り立つ性質を見いだすこと","具体的な場面に基づいて，数量の関係に着目し，計算に関して成り立つ性質を見いだすことがねらいである。例えば，「ふくろにどんぐりが８個，もう一つのふくろにどんぐりが16個入っています。どんぐりは全部で何個でしょう。」のような問題の場面を図や式を用いて表すと次のようになる。","○○○○○○〇〇 ○○○○○○○〇○○○○○○〇〇 ８＋16＝24","又は，","○○○○○○○〇○○○○○○○〇 ○○○○○○○〇 16＋８＝24","８＋16の結果と16＋８の結果とを比べることで，加法では，順序を変えて計算しても答えは変わらないことが分かる。図からも，左右の数を入れ替えても，全体の数は変わらないことを見いだすことができる。","計算に関して成り立つ性質を活用して，計算を工夫したり計算の確かめをしたりすること","加法についての結合法則や交換法則といった計算に関して成り立つ性質を活用して，新しい計算の仕方を生み出したり，計算の仕方を工夫したりすることができる。例えば，幾つかの数をまとめたり，順序を変えたりすると，計算を能率的にすることができる場合がある。例えば，一の位を足して10になる数の組み合わせに着目すると，25＋19＋１＝25＋（19＋１）＝25＋20や，18＋６＋２＝18＋２＋６＝20＋６のように工夫して計算することができる。","また，計算に関して成り立つ性質を活用して「計算の確かめ」をすることもできる。例えば，加法の交換法則を活用して，８＋16の結果と16＋８の結果とを比べることで，計算の確かめをすることができる。","このように，計算の工夫や計算の確かめに計算に関して成り立つ性質を活用していくことで，計算に関して成り立つ性質が「覚えるもの」ではなく「活用するもの」であることに気付き，活用しようとする態度を育むことになる。"]},"quoteEnd":0},"sansu-2-A-3":{"page":113,"name":"乗法","expl":{"intro":["第１学年では，加法の意味について理解することや，その計算の仕方を考えることを指導してきた。また，第２学年では，数のまとまりに着目し，数を２ずつ，５ずつなどの同じ大きさの集まりにまとめて数えることを指導してきている。","第２学年では，乗法が用いられる実際の場面を通して，乗法の意味について理解できるようにする。また，この意味に基づいて乗法九九を構成したり，その過程で乗法九九について成り立つ性質に着目したりするなどして，乗法九九を身に付け，１位数と１位数との乗法の計算が確実にできるようにするとともに，計算を生活や学習に活用する態度を養うことをねらいとしている。","なお，ここでの学習の内容は，第３学年の多数桁の乗法や除法の学習の素地となるものである。"],"k":["ア 乗法が用いられる場合とその意味","乗法は，一つ分の大きさが決まっているときに，その幾つ分かに当たる大きさを求める場合に用いられる。","例えば，「１皿に５個ずつ入ったみかんの４皿分の個数」を求めることについて式で表現することを考える。","「５個のまとまり」の４皿分を加法で表現する場合，５＋５＋５＋５と表現することができる。また，各々の皿から１個ずつ数えると，１回の操作で４個数えることができ，全てのみかんを数えるために５回の操作が必要であることから，４＋４＋４＋４＋４という表現も可能ではある。しかし，５個のまとまりをそのまま書き表す方が自然である。そこで，「１皿に５個ずつ入ったみかんの４皿分の個数」を乗法を用いて表そうとして，一つ分の大きさである５を先に書く場合５×４と表す。このように乗法は，同じ数を何回も加える加法，すなわち累加の簡潔な表現とも捉えることができる。言い換えると，（一つ分の大きさ）×（幾つ分）＝（幾つ分かに当たる大きさ）と捉えることができる。","また乗法は，幾つ分といったことを何倍とみて，一つ分の大きさの何倍かに当たる大きさを求めることであるという意味も，併せて指導する。このときも，一つ分に当たる大きさを先に，倍を表す数を後に表す場合，「２ｍのテープの３倍の長さ」であれば２×３と表す。","なお，海外在住経験の長い児童などへの指導に当たっては，「４×100ｍリレー」のように，表す順序を日本と逆にする言語圏があることに留意する。","ここで述べた被乗数と乗数の順序は，「一つ分の大きさの幾つ分かに当たる大きさを求める」という日常生活などの問題の場面を式で表現する場合に大切にすべきことである。一方，乗法の計算の結果を求める場合には，交換法則を必要に応じて活用し，被乗数と乗数を逆にして計算してもよい。","乗法による表現は，単に表現として簡潔性があるばかりでなく，我が国で古くから伝統的に受け継がれている乗法九九の唱え方を記憶することによって，その結果を容易に求めることができるという特徴がある。","イ 乗法の式","乗法が用いられる具体的な場面を，×の記号を用いた式に表したり，その式を具体的な場面に即して読み取ったり，式を読み取って図や具体物を用いて表したりすることを重視する必要がある。その際，乗法の式から場面や問題をつくるような活動も，乗法についての理解を深め，式を用いる能力を伸ばすために大切である。式に表す指導に際しては，「１皿に５個ずつ入ったみかん４皿分の個数」というような文章による表現，○やテープなどの図を用いた表現，具体物を用いた表現などと関連付けながら，式の意味の理解を深めるとともに，記号×を用いた式の簡潔さや明瞭さを味わうことができるようにする。","式を読み取る指導に際しては，例えば，３×５の式から，「プリンが３個ずつ入ったパックが５パックあります。プリンは全部で何個ありますか。」という問題をつくることができる。このとき，上で述べた被乗数と乗数の順序が，この場面の表現において本質的な役割を果たしていることに注意が必要である。「プリンが５個ずつ入ったパックが３パックあります。プリンは全部で幾つありますか。」という場面との対置によって，被乗数と乗数の順序に関する約束が必要であることやそのよさを児童が理解することが重要である。","このようにかけ算の式を具体的な場面と関連付けるようにすること，さらに，読み取ったことを，○などの図を用いたり，具体物を用いたりして表現することが，式を読み取る能力を伸ばすためには大切である。","ウ 乗法に関して成り立つ簡単な性質","「内容の取扱い」の（4）で「主に乗数が１ずつ増えるときの積の増え方や交換法則を取り扱うものとする」と示されているように，ここでは，乗法に関して乗数が１増えれば積は被乗数分だけ増えるという性質や，乗法についての交換法則について児童が自ら調べるように指導する。乗法九九を構成するときに乗数が１増えれば積は被乗数分だけ増えること，乗法についての交換法則などを活用し，効率よく乗法九九などを構成したり，計算の確かめをしたりすることも大切である。ここで「主に」と書かれているのは，児童の実態に応じて，図などと関連付けながら，乗法についての結合法則や分配法則に基づいた考えに触れてもよいことを意味している。","エ 乗法九九","乗法九九は，以後の学年で取り扱う乗法や除法の計算の基盤となるものとして必要なものである。したがって，乗法九九を構成したり理解したりする際には，体験的な活動や身近な生活体験などと結び付けるなどして指導の方法を工夫することが重要である。また，どの段の乗法九九についても十分に習熟し，確実に計算することができるようにするとともに，それらを生活や学習に活用することが大切である。乗法九九を生活や学習の場面で活用することによっても，技能の習熟が図られる。","オ 簡単な場合の２位数と１位数との乗法","簡単な場合についての２位数と１位数との乗法として，12程度までの２位数と１位数との乗法を指導する。その計算の仕方については，乗法九九を基にして，乗数が１増えれば積は被乗数分だけ増えるという性質を用いるなどして説明することができる。","４に２位数をかける乗法の計算を例に挙げると，まず，４の段の乗法九九の４×９＝36から，４×10＝40（36より４だけ増える）となることが分かる。さらに，４×11＝44（40より４だけ増える），４×12＝48（44より４だけ増える）のようにして積を求めることができる。","また，10×４は，10が４つあることから，40になると分かる。さらに，11×４＝11＋11＋11＋11＝44，12×４＝12＋12＋12＋12＝48となることが，乗法の意味から求められる。","このような簡単な場合の２位数と１位数との乗法の計算の仕方を考えることは，第３学年において，２位数や３位数などの乗法の計算の仕方を考える上での素地的な学習となるものである。"],"s":["ア  数量の関係に着目し，計算の意味や計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること","数量の関係に着目し，計算の意味や計算の仕方を考えること","乗法における数量の関係に着目し，児童が自ら乗法の意味について考えたり，乗法九九を構成したりしながらそれらを身に付けていくことが大切である。例えば，「４皿に３個ずつみかんが乗っている」場面を式に表す際，乗法の意味に基づいて３×４と表すことを考えることがある。また，３の段の九九の計算の仕方について，３×５を３＋３＋３＋３＋３＝15のように乗法の意味に基づいて構成したり，３×４の積12に３を加えることで求めたりするのである。こうした方法を後で学習する４の段などの九九の構成に生かしていくことが大切である。","数量の関係に着目し，計算に関して成り立つ性質などを見いだすこと","数量の関係に着目し，乗法に関して成り立つ性質などを見いだすことができるようにする。例えば，児童が３の段の乗法九九の構成を通して「かける数が１増えれば答えは３ずつ増える」ということを見付けることがある。このことについて，ほかの段の乗法九九でも同様なことが言えるのかを，乗法九九の表を構成したり，完成した乗法九九の表を観察したりして調べ，帰納的に考えて「乗数が１増えれば積は被乗数分だけ増える」という計算に関して成り立つ性質を見付けることができる。また，児童が乗法九九の構成を通して「３×４」と「４×３」の答えが同じ12になることを見付ける場合がある。このことについても，幾つかの場合から帰納的に考えて｢乗数と被乗数を交換しても積は同じになる」という計算に関して成り立つ性質を見付けることができる。","なお，乗法九九の表における数量の関係に着目すると，児童が見いだすきまりは，例えば，３の段と４の段の和が７の段になること，ｌ×１，２×２，３×３，…というように同じ数どうしをかける計算は斜めに並んでいることなど，様々である。乗法九九を構成したり観察したりすることを通して，乗法九九の様々なきまりを見付けるように指導することは，児童が発見する楽しさを味わうことにつながるものである。","計算に関して成り立つ性質を活用して，計算を工夫したり確かめをしたりすること","乗法に関して成り立つ性質を用いると，計算の工夫や確かめをすることができる。例えば，３×９については，３の９個分を求めるために，累加で求めてもよいが，交換法則を認めれば３×９＝９×３＝９＋９＋９＝27と求めることもできる。また，ある九九を忘れたり曖昧だったりする場合，交換法則や ●●●●","乗法に関して成り立つ性質を用いて，知っている九九を手が ●●●●","かりに，積を再構成することができる。 ●●●● ５×４また，図を基に５×４と３×４を合わせると８×４になる ●●●●","ことから，８×５や８×６も同じようにできるのではないか ●●●●","と考えて，計算の工夫をしたり確かめをしたりすることもで ●●●●","きる。 ●●●● ３×４こうした計算の工夫や確かめは，ここでの乗法だけでな ●●●●","く，後の学年で指導する乗法の計算の仕方を考えるときにも活用していくことができる。","このように，数量の関係に着目し計算について考えることによって，計算が簡単になったり，計算の確かめをしたりすることができるという数学のよさに気付き，これらの方法を学習に活用しようとする態度を養うことが大切である。","イ 数量の関係に着目し，計算を日常生活に生かすこと","身の回りには，同じ個数のものの集まりが多くある。これらの数を知りたいとき，乗法を活用することで，その数を簡単に知ることができる。靴箱の数や，教室の絵画や習字の作品の数など，長方形のように配列されたものの数は数えることによってではなく乗法で求めることができるという，乗法や乗法九九のよさを味わわせ，日常生活で生かそうとする態度を養うことが大切である。","Ｂ 図形"]},"quoteEnd":0},"sansu-2-B-1":{"page":118,"name":"三角形や四角形などの図形","expl":{"intro":["第１学年においては，ものの形に着目し，形の特徴を捉えることを指導してきた。第２学年では，三角形や四角形，正方形，長方形，直角三角形について，図形を構成する辺や頂点の数に着目し，図形を弁別することを指導する。また，身の回りにある箱の形をしたものを取り上げ，立体図形について理解する上で素地となる学習を行う。基礎となる図形を構成する要素に着目し，それを基に考えていく態度を養う。","ここで学習する図形を構成する要素に着目して図形を捉える際に働かせる数学的な見方・考え方により，第３学年では辺の長さの相等に着目して更に詳しく図形を考察していく。"],"k":["ア 三角形，四角形","第１学年では「さんかく」，「しかく」などと呼び図形を捉えていたが，第２学年では，３本の直線で囲まれている形を三角形といい，４本の直線で囲まれている形を四角形ということを約束する。これは，図形を構成する要素である辺の数に着目して，いろいろな図形から三角形，四角形を弁別しているのである。また，三角形，四角形の頂点にも着目できるようにする。その際には，三角形や四角形の約束や特徴を実感的に理解していく活動を取り入れることが大切である。","イ 正方形，長方形と直角三角形","第２学年では，正方形，長方形と直角三角形の意味や性質について指導する。三角形や四角形の指導と同様に，正方形，長方形，直角三角形の意味やその特徴を形式的に指導するのではなく，辺の長さや直角といった図形を構成する要素に着目して児童がこれらの図形について理解を深めていくことが大切である。","直角とは次のページの右の図のように紙を折った際に構成される角のことである。身の回りから，角の形が直角であるものを見付けたり，紙を折って直角を作ったりするなどの活動を行い，直角の意味を理解でき","るようにする。","四つの辺の長さが等しく，四つの角が直角で","ある四角形を正方形という。正方形には大きさ","は様々なものがあるが，形は全て同じである。また，四つの角が直角である四角形を長方形という。長方形には，縦と横の長さの組み合わせによって，様々な形がある。直角三角形は，正方形や長方形を，例えば右の図のよう","に，向かい合う頂点を結び二つに分けることによってでき","る三角形である。直角三角形は，正方形，長方形と同様に","日常生活の多くの場面で見いだすことができる図形であ","る。これらの図形を観察したり，分解したりする活動を通して理解できるようにすることが大切である。","また，「内容の取扱い」の（5）に示されているように，これらの図形を敷き詰める活動を通して，平面の広がりや，一定のきまりに従って図形を並べることによって出来上がる模様の美しさについて感じることができるようにすることが大切である。例えば長方形は，次のように敷き詰めていくことができる。","長方形の敷き詰め","ウ 正方形や長方形の面で構成される箱の形","第１学年において，児童は箱の形について形を全体的に捉える見方と機能的な性質に着目して学習してきた。第２学年では正方形や長方形の面で構成されている箱の形について指導する。第４学年で指導する立方体，直方体を理解する上で素地となるようにする。","第２学年では図形を全体的に捉える見方に加え，平面図形と同様に頂点，辺，面といった図形を構成する要素の存在にも気付くことができるようにする。例えば，箱の形をした具体物を観察すると，正方形，長方形の形をした面があることに気付く。面と面の間に辺があり，辺が集まったところが頂点である。","また，頂点，辺，面の個数についても調べることができるようにする。そのためには，箱の形をしたものを観察したり，構成したり，分解したりする活動を丁寧に取り扱う。例えば，６枚の長方形や正方形を貼り合わせて箱の形を構成したり，12本のひごを用いて箱の形を構成したりする。また，紙の箱を集めて，面を切り取ってみたり，切り取った形から箱を組み立てたりして，立体図形は平面図形によって構成されていることに気付くようにする。"],"s":["ア  図形を構成する要素に着目し，構成の仕方を考えるとともに，身の回りのものの形を図形として捉えること","第１学年で，児童は身の回りのものの形について，形を全体的に捉える見方を学習してきた。第２学年では，辺の長さや直角の有無といった約束に基づいて図形を弁別できるようにする。図形を構成する要素に着目するとは，図形を捉える際に辺や頂点，面，直角といったものに着目することである。構成の仕方を考えるとは，例えば，三角形を構成するためには３本の直線を用いる，また，それらのうち２本で頂点を構成する，というように，図形を構成する要素に着目し構成の仕方に見通しをもつことである。具体的には，次のような活動例が考えられる。","・ 右の図のような格子状に並んだ点を結んで，正方形，長","方形，直角三角形をかく活動を通して，図形を構成する","要素の特徴を捉えさせること。","・ 右のような長方形の紙を折って正方形を作るなどの活動","を通して，図形を構成する要素に着目し，４辺の長さが","等しくなることや角が直角となる理由を説明する力を育","てていくようにすること。","・ 右のような紙の四か所を直角に折っていって，長方形を","作る活動を通して，図形を構成する要素に着目させるこ","と。","このように図形を構成する活動を行う際には，図形を構成できない経験も大切にすることで構成の仕方を明確にすることが必要である。","身の回りのものを図形として捉えるとは，第１学年で全体的に捉えてきたものの形の見方から，図形を構成する要素に着目した約束に基づき，身の回りのものの形から三角形や四角形，正方形や長方形を見いだしたり弁別したりすることである。これらの学習を通して，日常にある図形や事象を捉える際にも，全体を見て概要を捉えた後に図形を構成する各要素に着目して思考し判断する態度の育成を目指す。","Ｃ 測定"]},"quoteEnd":0},"sansu-2-C-1":{"page":122,"name":"長さやかさの単位と測定","expl":{"intro":["第１学年では，長さ，広さ，かさなどの量を具体的な場面で直接比べたり（直接比較），他の物を用いて比べたり（間接比較），任意単位を設定してものの大きさを数で表現して比べたり（任意単位による測定）することについて指導してきている。第２学年では，普遍単位を用いることの必要性に気付かせ，単位の意味について理解させるとともに，それを用いて正しく測定すること（普遍単位による測定）を主なねらいとしている。また，身の回りのものの特徴に着目し，目的に応じた単位で量の大きさを的確に表現したり比べたりすることを主なねらいとしている。","第２学年の長さやかさの学習では，児童が，ものの大きさについて普遍単位を用いて進んで表現したり，測定する対象の大きさに応じた適切な単位を選択して的確に伝えようとしたりする態度を養う。","なお，ここで学習する内容は，第３学年の長さや重さについての学習の素地となるものである。"],"k":["ア 長さやかさの単位と測定","単位とは，測定のために用いる基になる大きさのことである。また，測定とは，一定の量を基準として，その量の大きさを数値化することである。","長さやかさについては，その大きさを普遍単位を用いて数値化した表現のよさや，普遍単位を用いることの必要性に気付くことができるようにする。","長さについては，測定するものの大きさに合わせて，ミリメートル（mm），センチメートル（cm），メートル（ｍ）について指導する。１ミリメートル（mm）は，１センチメートル（cm）を10等分した一つ分を単位としていることなど，単位の端下の処理に関連して，ミリ（ｍ），センチ（ｃ）などの接頭語の付いた単位の必要性にも着目させ，単位の意味や役割について理解できるようにすることが大切である。","その際には，ものの長さをものさしなどで測定することを通して，ものさしの目盛りの仕組みについても理解できるようにする。ものさしは，計器として初めて用いるものであり，直線の長さを正しく測定できるように考慮する。","かさについても同様に，測定するものの大きさに合わせて，ミリリットル（mL），デシリットル（dL），リットル（Ｌ）について指導する。長さと同様に１デシリットル（dL）は，１リットル（Ｌ）を10等分した一つ分を単位としていることを理解できるようにする。なお１ミリリットル（mL）については，１デシリットル（dL）の単位では測り取れない大きさを測るとき，その量を表すことに用いる単位であることや，１Ｌは1000mLであることを知らせる程度とする。","「１リットルます」を用いてかさを測定することを通して，１リットルますの目盛りの仕組みと単位の意味についての理解を深めることも大切である。","イ およその見当と適切な単位","長さやかさの測定をする際には，身の回りの大きさがだいたいどのくらいの大きさかを知っていると，そのものの大きさを手掛かりに，およその大きさの見当を付けることができる。例えば，机の横の長さが約60㎝であることを知っていればそのことを手掛かりに，ノートの横の長さの見当を付けることができる。","このように，長さやかさについて，およその見当を付けて測定し，適切な単位で量を表すことができるようにする。"],"s":["ア  身の回りのものの特徴に着目し，目的に応じた単位で量の大きさを的確に表現したり，比べたりすること","第２学年では，ものの特徴として長さやかさに着目する。目的に応じて大きさを捉えるのに適切な単位を選択して測定し，大きさを表現したり，大きさを比べたりする。例えば，教室の横の長さを測定するのにセンチメートルを単位として用いると，数値が大きくなりすぎて大きさを捉えるのが難しい。この場合はメートルを用いる。","このように測定する対象に応じた単位を選択する場面を問題の解決過程に位置付けることにより，目的に応じた単位で量の大きさを的確に表現することができるようにする。"]},"quoteEnd":0},"sansu-2-C-2":{"page":124,"name":"時間の単位","expl":{"intro":["第１学年では，日常生活で時刻を読んだり，時刻の読み方を用いて，日常生活を時刻を基に捉えたりすることについて指導してきた。第２学年では，時間の単位に着目し，時刻や時間の単位やそれらの関係を理解することを主なねらいとしている。第２学年の時間の単位の学習では，児童が体験を通して，日常生活における時間の使い方を工夫したり，時間の過ごし方について努力して改善しようとしたりする態度を養うことにつながる。"],"k":["ア 時間の単位と関係","時間は，時刻のある点からある点までの間隔の大きさを表す量である。日常生活の中では，時刻と時間の区別が明確ではない場合もあるため，時刻と時間を区別する必要がある。例えば，「朝７時に起きてから，学校が始まる８時まで」などの時刻についての具体的な場面を通して，長針が１回転する時間は１時間であるが，それが60分間であることを実感する。また，長針が１回転する間の短針の動きから１時間は60分であるという関係を理解したり，短針が１回転するのに要する時間から１日が24時間であるという関係を，図や時計の模型等を基に理解したりして，それらを用いることができるようにする。また，日常生活で使う日時に関する「昼前」「昼すぎ」や「昼食の前」「昼食の後」などの経験を基にして，「午前」「午後」「正午」の時間帯を捉え，午前や午後","はそれぞれ12時間ずつあること","を理解したり，時刻の起点から終","点までの量の大きさを表す時間に","ついて，時計の模型等の長針の動","きや図を用いて捉えるなどして，時刻と時間の関係について理解を深めることを大切にする。"],"s":["ア 時間の単位に着目し，時刻や時間を日常生活に生かすこと","時間の単位に着目し，短針や長針の動きを基に経過した時間を捉えて日常生活に生かすことが必要である。例えば，給食の始まりから終わりまでの時間を調べて，食事のペースの見通しをもったり，起きている時刻や学校が始まる時刻，学校から帰る時刻や寝る時刻などを「午前」「午後」を用いて表現し，その間の時間を調べて生活リズムを意識したりすることは大切である。必要な時間を確保して的確に判断し，行動することにつながる。","Ｄ データの活用"]},"quoteEnd":0},"sansu-2-D-1":{"page":125,"name":"簡単な表やグラフ","expl":{"intro":["第１学年では，データの個数について着目し，簡単な絵や図を用いて表したり読み取ったりすることで特徴を捉えることを学んできた。","第２学年では，身の回りの事象に関心をもち，データを整理する観点を定め，簡単な表やグラフを通じて特徴を捉え，考察することができるようになることをねらいとする。","この内容は第３学年での簡単な二次元の表や棒グラフを用いて考察することの素地となるものである。"],"k":["ア 簡単な表やグラフ","身の回りにある数量について，分類整理して簡単な表やグラフに表すことで特徴が捉えやすくなる。ここでいう簡単な表とは，観点が一つの表である。また，簡単なグラフとは，○などを並べて数の大きさを表したグラフのことである。このような表やグラフから，個数が最も多いなどの特徴を読み取ることができるようにする。"],"s":["ア  データを整理する観点に着目し，身の回りの事象について表やグラフを用いて考察すること","データを整理する観点に着目すること","データを整理する観点に着目し，身の回りの事象について表やグラフを用いて考察するとは，データを分析する際に注目する観点を定め，その観点に沿って分類整理し，簡単な表やグラフに表してデータの特徴を読み取り，事象について考察することである。","例えば，町探検で見付けたお店や施設をカードにかいたデータがあったとする。これらを整理する際に，どの町に多いの","かという観点や，どんな規模のものが多い 校くのしせつしらべ（こ）","のかといった観点に着目することで，分類 ○町 △町 □町 ☆町整理の仕方が異なる。何を知りたいかに ７ ４ ４ ２","よって，着目する観点を考えられるように","校くのしせつしらべ","する。","○","身の回りの事象について表やグラフを用い","○","て考察すること ○","カードを並び替えて整理することもでき ○ ○ ○","るが，表やグラフを用いることで簡潔に， ○ ○ ○","○ ○ ○ ○","視覚的に分かりやすくなることに気付き，","○ ○ ○ ○","考察できるようにする。","○町 △町 □町 ☆町例えば，先の例でどの町に多いのかに着","目して分類整理すると，前のページの右のような簡単な表やグラフにまとめられる。こうしてまとめた結果を読み取ることで，自分たちの校区では，どの町に施設が多いかなどを知ることができるだけでなく，「〇町は大きな道路があるからお店やさんが多いのだろう」，「☆町はほかの町より狭いので少ないのだろう」といった考察ができる。"]},"quoteEnd":0},"sansu-3-A-1":{"page":136,"name":"数の表し方","expl":{"intro":["第２学年では，４位数までの整数について，数のまとまりに着目し，大きな数の大きさの比べ方や数え方を考えることを指導してきた。","第３学年では，整数を万の単位にまで広げて指導するとともに，10倍や100倍，1","1000倍， の大きさの数や，相対的な大きさについて指導することを通して，整10","数の表し方について理解することや大きな数の大きさの比べ方や表し方を考えることをねらいとしている。また，身の回りから見いだせる大きな数に関心をもち，進んで調べていく態度を育むようにするとともに，数についての感覚を豊かにする。ここで育成される資質・能力は，さらに大きな数の表し方を考えていくことに生かされるだけでなく，小数の理解や，かけ算の計算の仕方などの考察にも生かされるものである。"],"k":["ア 万の単位","万の単位の指導に際しては，１万という数の大きさについて実感的に捉えられるようにすることが大切である。１万の大きさは，1000が10個集まった大きさ，9999より１大きい数などのように捉えることができる。さらに，5000と5000を合わせたものであるとか，100の100倍であるなどという多面的な見方を通して，その大きさを捉えられるようにする。","また，数の表し方については，１万より大きい数について，万を単位として，十万，百万，千万のように，十，百，千を用いて表せるようにする。","１万より大きな数については，具体的に数えたり，数を唱えたりする経験は少ないので，その指導に当たっては，十進位取り記数法の原理を基にして理解を図ったり，万の単位の目盛の付いた数直線の上で数を表すことによって理解できるようにするなどの指導が大切である。その際に，数直線の用語を指導する。","また，数の大きさを比較する際に等号，不等号の用語を指導する。","なお，「内容の取扱い」の（1）では，「１億についても取り扱うものとする」と示している。これは，第４学年での億の単位の学習に，円滑に接続できるように指導するものである。","イ 10倍，100倍，1000倍， の大きさ","整数を10倍，100倍，1000倍， にした大きさの数について調べ，その数字の10","並び方は変わらないことや，対応する数字の単位の大きさはそれぞれ，10倍，1","100倍，1000倍， した関係になっていることに気付き，理解できるようにする。10","ウ 数の相対的な大きさ","第３学年では，数の範囲を万の単位に広げて捉えられるようにする。その際，十，百，千，万を単位として数の相対的な大きさを捉えるようにする。","500や700は百を単位とすると５や７とみられることから，500＋700は５＋７とみられる。また800は百を単位とすると８とみられることから，800×５は８×５とみられる。このような数の相対的な見方を活用して，数を捉えたり，数の大きさを比較したり，計算の仕方を考えたりできるようにする。第２学年における学習を踏まえ，数の範囲が大きくなっても，このように相対的な大きさについて，理解が深まるようにする必要がある。"],"s":["ア  数のまとまりに着目し，大きな数の比べ方や表し方を考え，日常生活に生かすこと","数のまとまりに着目し，大きな数の比べ方や表し方を考えること","１万より大きい数について，その数をどう書き表すか，表された大きい数の唱え方や，それをどう捉えたりすればよいのかを考えていく。","その学習過程と，10倍，100倍，1000倍， にした大きさの数を見いだす過程10","では，数のまとまりに着目していく。これまでも十のかたまり（十の束）を作り，それを更に十で束ねるということを繰り返して大きな数を捉えたり表したりしてきた。この学年でも，今までの学習を生かして捉えていくようにする。","十進位取り記数法で表された数を比べる際には，数字の位置により単位の大きさを表すことから，大きい位を見れば大小を比べられることや，数のまとまりをそれぞれの位に表すことで数字として表すことができることを考える。","また，整数を10倍，100倍などにする操作を通し，数を比較したり，大きさを相対的に捉えたりする。例えば，234を10倍すると，百の位の２が千の位に，十の位の３が百の位に，一の位の４が十の位にくるという関係を見いだすことや，数を相対的な見方で捉えることで，その大きさのおよそをつかむことができる。","日常生活に生かすこと","日常生活で万の単位の数が使われている例として，統計資料などがある。第３学年では社会科の学習も始まり，地域のことを調べていく過程で見付けることのできる数について，その大きさをつかんだり読んだりすることで，学習を生かしていく。また，万を超える大きさの数になってくると，その大きさを実感的につかむことが難しくなってくる。そこで，数を相対的な大きさで捉え，10000㎏（10t）の重さは体重がおよそ1000㎏の象が10頭分だ，などとして捉えることも学習を生かすことにつながる。"]},"quoteEnd":0},"sansu-3-A-2":{"page":138,"name":"加法，減法","expl":{"intro":["第２学年では，２位数の加法及びその逆の減法について，数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすることを指導してきた。","第３学年では，３位数や４位数の加法及び減法の計算ができるようにするとともに，それらの筆算の仕方を理解できるようにすることをねらいとしている。また，数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用し，計算を工夫したり，計算の確かめをしたりすることができるようにすることをねらいとしている。","ここで育成される資質・能力は，小数や分数の加法及び減法などの考察に生かされるものである。"],"k":["ア ３位数や４位数の加法，減法の計算の仕方","第２学年で指導した２位数及び簡単な３位数の加法及び減法の計算を基にして，３位数や４位数の加法及び減法の計算の仕方を考えることを指導する。","例えば，154＋172の計算を考える場合，54＋72＝126と同様に，一の位どうしを加えた４＋２＝６と，十の位どうし（10のまとまり）を加えた50＋70＝120と，百の位どうし（100のまとまり）を加えた100＋100＝200を合わせて326と計算することができる。","その際に，第２学年で指導した２位数の加法及び減法の筆算の仕方を基に，３位数や４位数の加法及び減法についても位を揃えて筆算により計算できるように指導する。","イ 加法，減法の計算の確実な習得","３位数や４位数の加法及び減法の計算の技能を確実に身に付けて，必要な場面でそれらの計算を活用できるようにする。","「内容の取扱い」の（2）で示している簡単な計算の暗算とは，２位数どうしの加法やその逆の減法である。こうした計算は，日常生活でも多く用いられるし，また乗法や除法の計算を行う過程でも必要になるからである。日常生活においては，暗算で結果の見当を付けることも多い。指導に当たっては，そうした活用に配慮することが大切である。","また「内容の取扱い」の（2）では，「計算の結果の見積りについても触れるものとする」と示されている。３位数及び４位数の加法や減法の計算の仕方を考えたり，計算の確かめをしたりするときには，計算の結果の見積りを生かすよう配慮する必要がある。例えば，389＋4897の計算において位を揃えずに計算し8787と答えを求めたとき，389をおよそ400，4897をおよそ5000とみれば答えは5400になることから8787という答えは間違っていることに気付けるという場面である。このような場面で，児童自ら見積りができるようにすることが大切である。"],"s":["ア  数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること","数量の関係に着目し，計算の仕方を考えること","加法及び減法の計算の仕方を考える場合，既習の数の見方や計算の仕方を活用することで，未習の計算の仕方を見付け出していくことができる。その際，今までの計算と違うところはどこか，どういう数なら今までの計算が使えるかを考えさせることが大切である。例えば，３位数や４位数の加法及び減法の計算は，第２学年で学習した２位数の加法及び減法における計算の仕方を基にして，十進位取り記数法による数の表し方や数を十や百などを単位としてみる見方に着目し，数を百の位，十の位，一の位に分けて捉え，位ごとに足したり，引いたりすることで，既習の計算が使えるようになる。","指導に当たっては，第２学年で，２位数の加法及びその逆の減法は，十進位取り記数法による数の表し方や数を十を単位としてみる見方に着目し，位ごとに数を計算したことを想起させ，３位数や４位数をどのようにみると既習の計算が使えるのか考えさせることが大切である。その際，必要に応じて具体物や図などを用いて，計算の仕方を考えたり，説明したりできるようにする。また，見いだした計算の仕方を振り返り，位ごとに計算すると１位数どうしの計算に帰着できること，加法では，ある位の数が10集まったら，１繰り上がること，減法では，ある位の数どうしが引けないときは，１繰り下げて計算するという計算の仕組みが２位数の計算と同じであることに気付くことができるようにする。","例えば，568＋437の場合を考える。まず，百の位どうしを足して900になるので答えが900より大きくなると見通しを立てる。実際に計算する際は，第２学年で指導した68＋37のような２位数の加法における計算の仕方を基に，百の位，十の位，一の位に分けて捉え，位ごとに計算する。その際，繰り上がりのｌの処理の仕方を考えると，十の位は「３と６と繰り上がりの１を合わせて10｣，百の位は「４と５は「４と５と繰り上がりのｌを合わせて10」となり，答えが求まる。このこと繰り上がりのｌを合わせて10」となり，答えが求まる。このことは次のように次のように図で表現すると分かりやすく説明することができる。","図で表現すると分かりやすく説明することができる。","100 100 100 100 100 ⑩⑩⑩⑩⑩ ①①①①①","⑩ ①①①","＋ ＋ ＋","100 100 100 100 ⑩⑩⑩ ①①①①①","①①","↓ ↓ ↓","100 100 100 100 100 ⑩⑩⑩⑩⑩ ①①①①①","1000 ← 100 100 100 100 100 ⑩⑩⑩⑩⑩ ①①①①①","①①①①①","数量の関係に着目し，計算に関して成り立つ性質を見いだすこと","数量の関係に着目し，計算に関して成り立つ性質を見いだすこと","第２学年で見いだした計算に関して成り立つ性質について，３位数や４位第２学年で見いだした計算に関して成り立つ性質について，３位数や４位数に数数の範囲を広げる。第３学年では，計算の仕方を考えたり計算の確かめをしの範囲を広げる。第３学年では，計算の仕方を考えたり計算の確かめをしたりするする際に，計算に関して成り立つ性質を調べていくようにすることが大切であ際に，計算に関して成り立つ性質を調べていくようにすることが大切である。なお，なお，計算法則などを式に表し一般的に扱うのは第４学年の内容である。計算法則などを式に表し一般的に扱うのは第４学年の内容である。","計算に関して成り立つ性質を活用して，計算を工夫したり計算の確かめをし","計す算るにこ関として成り立つ性質を活用して，計算を工夫したり計算の確かめをしたりす","幾つかの数をまとめたり，順序を変えたりすると，計算を能率的にするこ","ること","で幾きつるか。の例数えをばま，と足めたしりて，10順0序にをな変るえ数たのり組すみる合とわ，計せ算にを着能目率す的るにとす，るこ38と7＋が7で5＋を 387＋（75＋25）と工夫して計算することができる。","きる。例えば，足して100になる数の組み合わせに着目すると，387＋75＋25をこのように，計算の工夫や計算の確かめに，計算に関して成り立つ性質を387＋（75＋25）と工夫して計算することができる。","していくことが大切である。","このように，計算の工夫や計算の確かめに，計算に関して成り立つ性質を活用していくことが大切である。"]},"quoteEnd":0},"sansu-3-A-3":{"page":141,"name":"乗法","expl":{"intro":["第２学年では，乗法について，数量の関係に着目し，乗法の意味や計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすることなどを指導してきている。第３学年では，乗法に関して成り立つ性質について理解し，その性質を用いて，２位数や３位数に１位数や２位数をかける乗法の計算の仕方を考える。そして，これらの乗法が乗法九九などの基本的な計算を基にしてできることを理解するとともに，その計算が確実にできるようにする。","なお，ここで育成される資質・能力は，第４学年の多数桁の除法の学習や第５学年の小数の乗法及び除法の考察に生かされるものである。"],"k":["ア ２位数や３位数に１位数や２位数をかける乗法の計算","乗数が１位数の計算の場合，数のまとまりに着目して計算する。例えば，23×４の計算は，23を20＋３とみて，20×４と３×４という基本的な計算を基にしてできることを理解できるようにする。これは，筆算の仕方に結び付く考えである。３位数に１位数をかける計算の指導に当たっても同様である。","乗数が２位数の計算は，何十をかける計算と，１位数をかける計算を基にしてできる。例えば，23×45の計算の場合，乗数の45を40＋５とみて，23×40と23×５に分けるとよい。ここでも分配法則を活用しているが，乗数が１位数の場合は被乗数を位ごとに分けるのに対して，乗数が２位数の場合は，乗数を位ごとに分けて計算する。","イ 乗法の計算が確実にでき，用いること","乗法の計算には，乗数や被乗数が人数や個数などの場合がある。また，例えば，「１ｍのねだんが85円のリボンを25ｍ買うと代金はいくらか。」などのような場合にも用いることができる。さらに，除法の逆としての乗法の問題，例えば「ひもを４等分した一つ分を測ったら９㎝あった。はじめのひもの長さは何㎝か。」のような場合にも，乗法が用いられることについて理解を深める。乗法が用いられる場面を判断し，適切に用いることができるよう指導することが大切である。","「内容の取扱い」の（2）では，「計算の結果の見積りについても触れるものとする」と示している。例えば，19×６の積について，20×６が120であることから，120より小さくなるといった見積りができることは，計算の確かめなどに役立てることができる。さらに，ここでは，「簡単な計算は暗算でできるよう配慮するものとする」と示している。これは，乗法や除法の計算の過程で暗算を必要とすることがあるためである。また，日常生活においても，暗算で見当を付けたり結果を求めたりすることが多いためである。ここでいう簡単な計算とは，２位数に１位数をかける程度の乗法であるが，その扱いについては，児童にとって過度の負担にならないよう配慮する必要がある。なお，指導に当たっては，筆算をしたり見積りをしたりする際に，暗算を生かすようにすることが大切である。","また，「内容の取扱い」の（3）では，「乗数又は被乗数が０の場合の計算についても取り扱うものとする」と示している。例えば，的当てで得点を競うゲームなどで，０点のところに３回入れば，０×３と表すことができる。３点のところに一度も入らなければ，３×０と表すことができる。０×３の答えは，実際の場面の意味から考えたり，乗法の意味に戻って０＋０＋０＝０と求めたりする。また３×０の答えは，具体的な場面から０と考えたり，乗法のきまりを使って３×３＝９，３×２＝６，３×１＝３と並べると積が３ずつ減っていることから，３×０＝０と求めることができることに気付くようにする。また，こうした０の乗法は，30×86や54×60のような計算の場合にも活用される。","ウ 乗法に関して成り立つ性質","第２学年では，乗数が１ずつ増えるときの積の変化や交換法則などを指導してきている。第３学年では，「内容の取扱い」の（4） 質を活用して，計算を工夫すること","計算に関して成り立つ性質を活用することで，計算の工夫ができる場合がある。例えば，４×７×25の場合，４×７を28と計算し，その積28に25をかけるのではなく，計算に関して成り立つ性質を使うと次のように計算の工夫も可能である。まず，交換法則を用いて，４×７×25を７×４×25とする。つぎに，７×４を先に計算するのではなく，結合法則を用いて先に４×25を計算し，７にその積100をかけることで700を得る。","このような計算の工夫を通して，問題解決などにおいて，よりよいものを求め続けようとする態度や，多面的に考えようとする態度が育成されるようにする。"]},"quoteEnd":0},"sansu-3-A-4":{"page":145,"name":"除法","expl":{"intro":["第２学年では，乗法について，数量の関係に着目し，乗法の意味や計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすることなどを指導してきている。第３学年では，第２学年での学習の上に，乗法の逆算である除法について学習する。除法の意味および除法と乗法や減法の意味について理解させるとともに，除数と商が共に１位数である除法の計算を学習する。このとき，計算の仕方を形式的に知るだけでなく，除法の計算の仕方を主体的に考えたり，計算に関して成り立つ性質を見いだし，その性質を計算の工夫や確かめに活用するとともに，日常生活に生かす態度を育むことが大切である。","ここで育成される資質・能力は，第４学年で学習する多数桁の除法，小数の除法，及び真分数を帯分数で表現することなどの考察に生かされるものである。"],"k":["ア 除法が用いられる場合とその意味","除法が用いられる具体的な場合として，大別すると次の二つがある。","一つは，ある数量がもう一方の数量の幾つ分であるかを求める場合で，包含除と呼ばれるものである。他の一つは，ある数量を等分したときにできる一つ分の大きさを求める場合で，等分除と呼ばれるものである。なお，包含除は，累減の考えに基づく除法ということもできる。例えば，12÷３の意味は，12個のあめを１人に３個ずつ分けて何人に分けられるかを求めること（包含除）と，12個のあめを３人に同じ数ずつ分けて一人何個になるかを求めること（等分除）がある。","第２学年において乗法は，（一つ分の大きさ）×（幾つ分）＝（幾つ分かに当たる大きさ）と捉えていたが，このとき（一つ分の大きさ）を求める場合が等分除で，（幾つ分）を求めることが包含除であると捉えることができる。このようなことを通して，除法が乗法の逆算であることを捉えられるようにしていく。","包含除と等分除を比較したとき，包含除の方が操作の仕方が容易であり，「除く」という意味に合致する。また，「割り算」という言葉の意味からすると等分除の方が分かりやすい。したがって，除法の導入に当たっては，これらの特徴を踏まえて取り扱うようにする必要がある。","なお次に述べるように，包含除と等分除を統合的に捉えることも大切である。例えば，12個のものを３人に等しく分けるという等分除の操作において，まず１人に１個ずつ配ると３個必要になり，もう一度１個ずつ配ると３個必要になる…というように等分除の操作を行うとき，この操作は，包含除の12個のものを３個ずつ配ることができる回数とみることができる。このことから，どちらも同じ式で表すことができることが分かるようにする。","・・・というように等分徐の操作を行うとき，この操作は，包含徐の12個のものを３個ずつ配ることができる回数とみることができる。このことから，どちらも同じ式で表すことができることが分かるようにする。","● ● ● ● ● ● ● ● ● ● ● ●","また，第２学年の乗法が用いられる場合として，倍に当たる大きさを求める場合また，第２学年の乗法が用いられる場合として，倍に当たる大きさを求める場合ががああるるこことをと学を習学し習てしいてるい。るこ。ここでこはで，は倍，に倍当にた当るた数る値数な値どながど整が数整で数あでる場あ合るに場つ合にいつてい，てあ，る数あ量るが数も量うが一も方うの一数方量のの数何量倍のか何を倍求かめをる求場め合るや場基合にやす基るに大すきるさを大求きめさるを求場め合るに場除合法がに用除い法らがれ用るいこらとれもる指こ導とすもる指。導そすのる際。，そ図のな際ど，を図基なにどしをて基，に何倍しかてを，求何倍かを求める場合は，幾つ分を求める場合（包含徐）とも考えられ，基にする大める場合は，幾つ分を求める場合（包含除）とも考えられ，基にする大きさを求めきさを求める場合は，一つ分の大きさを求める場合（等分徐）であると考えられる場合は，一つ分の大きさを求める場合（等分除）であると考えられることから，演算として同じ除法を用いるなど，既習の除法の意味と関連付けて理解できるよう- 145 -","にすることが大切である。","除法が用いられる場合として，ほかに，例えば，重さが４㎏で長さが２ｍである棒の１ｍの重さを求める場合，２㎏で400円のものの１㎏の値段を求める場合など，一人分を求める場合でなく，比例関係を仮定できる，伴って変わる二つの数量がある場合にも用いられる。第４学年などで，このような場合も図を用いるなどして等分除や包含除とみられることに気付かせ，除法が用いられることを理解できるようにしていく。","また，除法には割り切れない場合があり，その場合には余りを出すことを指導する。例えば「13枚のカードを１人に４枚ずつ配る」場面や「13枚のカードを４人に同じ枚数ずつ分ける」場面で，13÷４は４×□や□×４が13以下で13に最も近くなるときの整数□とそのときの余りを求めること，つまり整数の除法13÷４は，カードを分ける操作で最大の回数や１人当たりの最大の枚数を求めることに当たっていること，そしてそのときの余りの大きさは除数よりも小さくならなければならないことなどについて理解できるようにする。","イ 除法の式","第３学年では，除法が用いられる場合の記号÷を用いた式について理解できるようにする。指導に当たっては，これまでの加法，減法及び乗法と同様に，数量の関係を式に表したり，式を読み取ったりすることを重視することが大切である。","式に表す指導に際しては，「12個のあめを３人に同じ数ずつ分ける」というような言葉（文章）による表現，○やテープなどの図を用いた表現，具体物を用いた操作などと関連付けながら，式の意味の理解を深めるとともに，記号÷を用いた式の簡潔さや明瞭さを味わうことができるようにする。","また，式を読み取るとは，式から具体的な数量の関係を捉えることである。例えば，15÷３の式から「みかんが15個あります。一人に３個ずつ分けると何人に分けられますか。」というような問題場面を見いだすことができる。このように，式と具体的な場面を関連付けるようにすることが大切である。","また，言葉や図などと関連付けながら，「乗法における乗数や被乗数が，除法における除数に相当する」など，除法の式の意味を乗法の式の意味との関係から捉えていくことができるようにすることも大切である。","ウ 除法と乗法，減法との関係","除法は，ある数量から，一定の大きさの数量を取り去るときの最大の回数を求める場合（累減）とも考えることができる。例えば，12÷３の答えは，12−３−３−３−３＝０となるときの３の個数とも考えられる。この考えは包含除と捉えることもできる。","また，除法は，乗法の逆算ともみられる。そこで，乗法と関連させて，被乗数，乗数のいずれを求める場合に当たっているかを明確にすることも大切である。等分除は，□×３＝12の□を求める場合であり，包含除は３×□＝12の□を求める場合である。","エ 除数と商が１位数の場合の除法の計算","除数と商が１位数の場合の除法を指導する。例えば，48÷６や13÷４など，乗法九九を１回用いて商を求めることができる計算である。こうした計算は，今後指導する商が２位数の除法及び小数の除法の計算のためにも必要であり，確実に身に付けておく必要がある。","オ 簡単な場合の除数が１位数で商が２位数の除法","除数と商が１位数の場合の除法を活用して，簡単な場合についての除数が１位数で商が２位数の除法についても指導する。ここでは次のような簡単な場合についての計算を指導する。","一つは，80÷４や90÷３のように，被除数が何十で，被除数の十の位の数が除数で割り切れる計算である。80÷４の場合，児童自らが80を「10が８個」と捉え，その「８個」を４で割ると答えは「10が２個」というように単位の考えに基づいて考えることが大切である。","もう一つは，被除数が２位数で，69÷３のように，十の位の６と一の位の９がそれぞれ除数の３で割りきれる除法である。69÷３の場合，単位の考えによる60÷３の計算の仕方の理解に立ち，児童自らが２位数の乗法と同じように69を60と９に分けて捉えた上で，60÷３＝20，９÷３＝３として答えは23と考えることができる。こうした計算の仕方を考える指導は，除数と商が１位数の場合の除法の計算技能及び計算の意味の理解を確実なものとし，身に付けた知識及び技能を活用する力の育成を目指す上で重要である。"],"s":["ア  数量の関係に着目し，計算の意味や計算の仕方を考えたり，計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること","計算の意味や計算の仕方を考えたり，計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して計算を工夫すること","等分除や包含除のそれぞれの場面の問題を，具体物，図で考え，その結果を確かめたり，それを表現し伝え合ったりする活動を通して，除法は乗法の逆算とみることができることに気付き，計算の仕方を考えることができる。","例えば，12個のものを３個ずつ分けて，分けられた回数を求める場合（包含除）は，分けられた回数を□とすると，３×□＝12の□を求めることと同じである。また，12個のものを３人で分けて，一人分の数を求める場合（等分除）は，一人分の数を□とすると，□×３＝12の□を求めることと同じである。先に述べたように，等分除の操作は包含除の操作としてもみることができるので，どちらの場合も，12÷３の計算が３の段の乗法九九を用いて能率的に求めることができる。このようなことを考えることができるようにすることがねらいとなる。","また，80÷４を８÷４と考えて計算したり，84÷２を80÷２と４÷２と分けて計算したりすることは，計算に関して成り立つ性質を活用して計算を工夫することである。このとき，計算に関して成り立つ性質を基に式で考えるだけでなく，図などを用いて考えることは，計算に関して成り立つ性質に気付くことにつながる。","計算に関して成り立つ性質を活用して，計算の確かめをすること","上で述べたように，除法の計算は乗法によって求めることができる。除法の計算によって得られた商と除数の積が被除数に一致するかどうかを調べることによって，除法の計算の確かめができることを理解させる。また，こうした学習は，余りのある除法や小数の除法でも活用されるものであり，ここでの学習において，計算の結果を確かめる態度を育んでおきたい。","イ 数量の関係に着目し，計算を日常生活に生かすこと","日常生活において，あるものを何人かで数が等しくなるように分けたり，あるものから同じ数ずつ取り去ったり，同じ数ずつ袋に入れたりすることがある。こうした場面で，除法を活用して問題を能率的に解決できることに気付かせることが大切である。","また数学的活動で述べるとおり，余りの処理については，商をそのまま答えとできない場合があり，日常生活の場面に即してより適切な答えを考える必要がある。"]},"quoteEnd":0},"sansu-3-A-5":{"page":150,"name":"小数の意味と表し方","expl":{"intro":["第２学年では，長さや体積の測定について，単位に着目して「９㎝２㎜」，「３Ｌ６dL」などと表すことを指導している。","第３学年では，これらの経験を踏まえて，端数部分の大きさを表すのに小数を用いることを理解し，それらを適切に用い，そのよさに気付き，学習したことを生活や学習の中に活用できるようにする。","また，小数を用いると，１Ｌに満たない量を0.8Ｌと表したり，２Ｌと５dLをあわせた量を2.5Ｌと表したりすることができる。その際に，これらの量を測定する単位の構成が十進構造になっていることについて理解できるようにする。","ここで育成される資質・能力は，端数部分を表すのに分数を用いる際や，小数や分数の加法及び減法や乗法及び除法の計算の仕方を考える際などに生かされるものである。"],"k":["ア 小数の意味と表し方","小数が必要とされるのは，測定と関連している場合が多いので，端数部分の量の表現に関連して導入することが考えられる。","小数は，これまでの整数の十進位取り記数法の考えを１より小さい数に拡張して用いるところに特徴がある。整数の場合は，ある単位の大きさが10集まると次の単位となって表される仕組みであったが，小数の場合は，逆に，ある単位（1）の大きさを10等分して新たな単位（0.1）をつくり，その単位の幾つ分かで大きさを表し1 1","ている。ここで，「 の位」という用語と意味について指導する。 の位の代わりに，10   10","小数第１位と呼ぶことがある。","小数を数直線の上に表して，整数と同じ数直線の中に位置付けることは，小数の理解を深める上で大切なことである。例えば，3.6は整数の３と４の間にあること，さらに，３と４の間を10等分した目盛りの６番目にあることなど，整数の数直線と関係付けて指導する。","なお，「内容の取扱い」の（5）については，「Ａ（6）分数の意味と表し方」の解説の中で述べている。","イ 小数の加法，減法","小数の加法及び減法の意味について理解し，それらの計算ができるように指導する。","小数の加法及び減法の計算の仕方について，次のように考えることができる。① 小数の加法及び減法の計算を数直線に対応させて考える。","② 相対的な大きさを用いて，小数の計算を整数の計算に直して処理する。","③ 小数の計算では，小数点を揃え，各位の単位を揃えて計算する。","このようにすると，整数部分どうし，小数部分どうしで計算することができる。1","また，１は の単位が10個であるから，繰り上がり，繰り下がりのある計算が，10","整数のときと同じようにできる。","小数の加法及び減法の計算は，最終的には，上記の③のように，小数点を揃えて位ごとに計算するなど，小数の仕組みの理解の上に立って行うようにし，整数と同じ原理，手順でできることを理解できるようにすることが大切である。","小数を整数と同じ数直線上に表し，大小や順序についての関係を調べたり，0.1の何個分と考えれば整数と同じ見方ができることや，10個集まると１つ上の位に繰り上がることなど，整数との関連から説明したりすることを重視することが大切である。"],"s":["ア  数のまとまりに着目し，小数でも数の大きさを比べたり計算したりできるかどうかを考えるとともに，小数を日常生活に生かすこと","小数でも数の大きさを比べたり計算したりできるかどうかを考えること","例えば，2.4Ｌと3.1Ｌの大きさを比べることを考える。図や数直線を用いて表したり，0.1Ｌを単位としてその幾つ分かを考えたりすることで，整数と同じように大きさを比べることが考えられるようにする。","また，同様に の位までの小数の加法及び減法の計算の仕方を考える中で，小10","数が整数と同じ十進位取り記数法によって表された数であることを考えられるようにする。","小数を日常生活に生かすこと","小数で表されているものは日常生活でたくさん見付け出すことができ，児童にとって身近な数であるといえる。「1.5Ｌのペットボトル」などの小数を見付け，改めて学習した眼で見直すことで，それが１Ｌ５dLを表していることや，小数を用いるよさについて考えることができるようにする。"]},"quoteEnd":0},"sansu-3-A-6":{"page":152,"name":"分数の意味と表し方","expl":{"intro":["第２学年では， や など簡単な分数について知り，元の大きさに着目し，数２   ３","の大きさについて考え，日常生活に生かすことを指導してきた。","第３学年では，分数の意味や表し方について理解できるようにするとともに，分数についても整数と同様に加法及び減法ができることを知り，簡単な場合について，それらの計算ができることを知ることをねらいとしている。また，単位分数の大きさに着目し，分数でも数を比べたり計算したりできるかどうかを考えたり，計算の意味や仕方を考えたりするとともに，分数を日常生活に生かそうとする態度や能力を高めることもねらいとしている。","ここで育成される資質・能力は，第４学年の同分母の分数の加法及び減法について，単位分数に着目した計算の仕方などの考察に生かされるものである。"],"k":["ア 分数の意味と表し方","分数は，等分してできる部分の大きさや端数部分の大きさを表すのに用いられる。分数を指導する際，「分母」，「分子」の用語について扱う。","２分数の意味について，その観点の置き方によって，様々な捉え方ができる。","３を例にすると，次のようである。","① 具体物を３等分したものの二つ分の大きさを表す。","② Ｌ， ｍのように，測定したときの量の大きさを表す。","③ １を３等分したもの（単位分数である ）の二つ分の大きさを表す。","④ ＡはＢの というように，Ｂを１としたときのＡの大きさの割合を表す。３","⑤ 整数の除法「２÷３」の結果（商）を表す。","これらは便宜上分けたところもある。指導に当たっては，幾つかの考えを同時に用いることが多い。第３学年では，上記の①，②，③などの考え方を用いる。④，⑤については，第５学年で取り扱う。","例えば，次のページの図のような２ｍのテープがあるとする。このとき，テープ１","の色が付いた部分はテープ全体の （①）である。だから，テープ全体の長さが４","２ｍだとすると，色が付いた部分の長さは，２ｍの （①）であるといえる。一方，４","実際の長さを分数で表すと１ｍの （①）なので， ｍ（②）である。","と，色が付いた部分の長さは，２ｍの｜（①）であるといえる。一方，実際の長４","さを分数で表すと１ｍの｜（①）なので，｜ｍ（②）である。","２ｍ","１ｍ","－ｍ","なお，「内容の取
