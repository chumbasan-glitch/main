:null,"units":[{"u":"浦島太郎―「御伽草子」より","b":"5年","s":1},{"u":"古典芸能の世界 狂言「柿山伏」を楽しもう","b":"6年","s":1}],"kan":"k"},{"id":"kokugo-56-K3-ウ","g":[5,6],"area":"K3","areaName":"知識及び技能 ⑶ 我が国の言語文化","mark":"ウ","head":"言葉の由来や変化，共通語と方言，仮名と漢字の由来","title":"我が国の言語文化に関する次の事項を身に付けることができるよう指導する。","lines":["ウ　語句の由来などに関心をもつとともに，時間の経過による言葉の変化や世代による言葉の違いに気付き，共通語と方言との違いを理解すること。また，仮名及び漢字の由来，特質などについて理解すること。"],"notes":null,"units":[{"u":"漢字の成り立ち","b":"5年","s":1},{"u":"方言と共通語","b":"5年","s":1},{"u":"和語・漢語・外来語","b":"5年","s":1},{"u":"漢字の形と音・意味","b":"6年","s":1},{"u":"日本の文字文化（仮名づかい）","b":"6年","s":1}],"kan":"k"},{"id":"kokugo-56-K3-エ","g":[5,6],"area":"K3","areaName":"知識及び技能 ⑶ 我が国の言語文化","mark":"エ","head":"書写：配列，書く速さ，筆記具の選び方","title":"我が国の言語文化に関する次の事項を身に付けることができるよう指導する。","lines":["エ　書写に関する次の事項を理解し使うこと。","（ア）　用紙全体との関係に注意して，文字の大きさや配列などを決めるとともに，書く速さを意識して書くこと。","（イ）　毛筆を使用して，穂先の動きと点画のつながりを意識して書くこと。","（ウ）　目的に応じて使用する筆記具を選び，その特徴を生かして書くこと。"],"notes":null,"units":[{"u":"書写：学習の進め方","b":"5年","s":2},{"u":"書写：いつも気をつけよう","b":"5年","s":2},{"u":"書写：漢字の組み立て","b":"5年","s":2},{"u":"書写：書くときの速さ","b":"5年","s":2},{"u":"書写：字の形","b":"5年","s":2},{"u":"書写：文字の配列","b":"5年","s":2},{"u":"書写：書きぞめ","b":"5年","s":2},{"u":"書写：五年生のまとめ❶❷","b":"5年","s":2},{"u":"書写：六年生を送る会に向けて","b":"5年","s":2},{"u":"書写：書写広げたい❷〈英語〉","b":"5年","s":2},{"u":"書写：資料","b":"5年","s":2}],"kan":"k"},{"id":"kokugo-56-K3-オ","g":[5,6],"area":"K3","areaName":"知識及び技能 ⑶ 我が国の言語文化","mark":"オ","head":"日常的に読書に親しみ，考えを広げる","title":"我が国の言語文化に関する次の事項を身に付けることができるよう指導する。","lines":["オ　日常的に読書に親しみ，読書が，自分の考えを広げることに役立つことに気付くこと。"],"notes":null,"units":[{"u":"図書館を使いこなそう","b":"5年","s":1},{"u":"作家で広げるわたしたちの読書 モモ","b":"5年","s":1},{"u":"やなせたかし―アンパンマンの勇気","b":"5年","s":1},{"u":"公共図書館を活用しよう","b":"6年","s":1},{"u":"私と本 星空を届けたい","b":"6年","s":1}],"kan":"k"},{"id":"kokugo-56-A-ア","g":[5,6],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"ア","head":"目的や意図に応じて話題を決め，内容を検討する","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["ア　目的や意図に応じて，日常生活の中から話題を決め，集めた材料を分類したり関係付けたりして，伝え合う内容を検討すること。"],"notes":null,"units":[{"u":"よりよい学校生活のために （意見が対立したときには）","b":"5年","s":1}],"kan":"s"},{"id":"kokugo-56-A-イ","g":[5,6],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"イ","head":"事実と感想，意見を区別した構成","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["イ　話の内容が明確になるように，事実と感想，意見とを区別するなど，話の構成を考えること。"],"notes":null,"units":[{"u":"「子ども未来科」で何をする","b":"5年","s":1}],"kan":"s"},{"id":"kokugo-56-A-ウ","g":[5,6],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"ウ","head":"資料を活用して表現を工夫する","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["ウ　資料を活用するなどして，自分の考えが伝わるように表現を工夫すること。"],"notes":null,"units":[{"u":"今、私は、ぼくは","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-A-エ","g":[5,6],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"エ","head":"話し手の考えと比較しながら聞く","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["エ　話し手の目的や自分が聞こうとする意図に応じて，話の内容を捉え，話し手の考えと比較しながら，自分の考えをまとめること。"],"notes":null,"units":[{"u":"きいて、きいて、きいてみよう","b":"5年","s":1},{"u":"つないで、つないで、一つのお話","b":"6年","s":1},{"u":"聞いて、考えを深めよう","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-A-オ","g":[5,6],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"オ","head":"立場や意図を明確にして計画的に話し合う","title":"話すこと・聞くことに関する次の事項を身に付けることができるよう指導する。","lines":["オ　互いの立場や意図を明確にしながら計画的に話し合い，考えを広げたりまとめたりすること。"],"notes":null,"units":[{"u":"どちらを選びますか","b":"5年","s":1},{"u":"よりよい学校生活のために （意見が対立したときには）","b":"5年","s":1},{"u":"いちばん大事なものは","b":"6年","s":1},{"u":"みんなで楽しく過ごすために （伝えにくいことを伝える）","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-A-2","g":[5,6],"area":"A","areaName":"Ａ 話すこと・聞くこと","mark":"","head":"言語活動例：意見や提案，インタビュー，立場を決めた話合い","title":"⑴に示す事項については，例えば，次のような言語活動を通して指導するものとする。","lines":["ア　意見や提案など自分の考えを話したり，それらを聞いたりする活動。","イ　インタビューなどをして必要な情報を集めたり，それらを発表したりする活動。","ウ　それぞれの立場から考えを伝えるなどして話し合う活動。"],"notes":null,"units":[{"u":"きいて、きいて、きいてみよう","b":"5年","s":1},{"u":"どちらを選びますか","b":"5年","s":1},{"u":"よりよい学校生活のために （意見が対立したときには）","b":"5年","s":1},{"u":"「子ども未来科」で何をする","b":"5年","s":1},{"u":"聞いて、考えを深めよう","b":"6年","s":1},{"u":"いちばん大事なものは","b":"6年","s":1},{"u":"みんなで楽しく過ごすために （伝えにくいことを伝える）","b":"6年","s":1},{"u":"今、私は、ぼくは","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-B-ア","g":[5,6],"area":"B","areaName":"Ｂ 書くこと","mark":"ア","head":"目的や意図に応じて書くことを選び，伝えたいことを明確にする","title":"書くことに関する次の事項を身に付けることができるよう指導する。","lines":["ア　目的や意図に応じて，感じたことや考えたことなどから書くことを選び，集めた材料を分類したり関係付けたりして，伝えたいことを明確にすること。"],"notes":null,"units":[{"u":"みんなが使いやすいデザイン","b":"5年","s":1},{"u":"知ってほしい、この名言","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-B-イ","g":[5,6],"area":"B","areaName":"Ｂ 書くこと","mark":"イ","head":"筋道の通った文章の構成や展開","title":"書くことに関する次の事項を身に付けることができるよう指導する。","lines":["イ　筋道の通った文章となるように，文章全体の構成や展開を考えること。"],"notes":null,"units":[{"u":"文章に説得力をもたせるには","b":"5年","s":1},{"u":"もう一つの物語","b":"5年","s":1},{"u":"デジタル機器と私たち","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-B-ウ","g":[5,6],"area":"B","areaName":"Ｂ 書くこと","mark":"ウ","head":"事実と感想，意見を区別して書く","title":"書くことに関する次の事項を身に付けることができるよう指導する。","lines":["ウ　目的や意図に応じて簡単に書いたり詳しく書いたりするとともに，事実と感想，意見とを区別して書いたりするなど，自分の考えが伝わるように書き表し方を工夫すること。"],"notes":null,"units":[{"u":"言葉でスケッチ","b":"5年","s":1},{"u":"『鳥獣戯画』を読む 発見、日本文化のみりょく","b":"6年","s":1},{"u":"大切にしたい言葉","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-B-エ","g":[5,6],"area":"B","areaName":"Ｂ 書くこと","mark":"エ","head":"引用や図表・グラフを用いて書く","title":"書くことに関する次の事項を身に付けることができるよう指導する。","lines":["エ　引用したり，図表やグラフなどを用いたりして，自分の考えが伝わるように書き表し方を工夫すること。"],"notes":null,"units":[{"u":"目的に応じて引用するとき","b":"5年","s":1},{"u":"固有種が教えてくれること 自然環境を守るために（統計資料の読み方）","b":"5年","s":1},{"u":"おすすめパンフレットを作ろう","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-B-オ","g":[5,6],"area":"B","areaName":"Ｂ 書くこと","mark":"オ","head":"構成や書き表し方に着目して文章を整える","title":"書くことに関する次の事項を身に付けることができるよう指導する。","lines":["オ　文章全体の構成や書き表し方などに着目して，文や文章を整えること。"],"notes":null,"units":[{"u":"日常を十七音で","b":"5年","s":1},{"u":"文章を推敲しよう","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-B-カ","g":[5,6],"area":"B","areaName":"Ｂ 書くこと","mark":"カ","head":"感想や意見を伝え合い，よいところを見付ける","title":"書くことに関する次の事項を身に付けることができるよう指導する。","lines":["カ　文章全体の構成や展開が明確になっているかなど，文章に対する感想や意見を伝え合い，自分の文章のよいところを見付けること。"],"notes":null,"units":[{"u":"あなたは、どう考える","b":"5年","s":1},{"u":"たのしみは","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-B-2","g":[5,6],"area":"B","areaName":"Ｂ 書くこと","mark":"","head":"言語活動例：説明や意見文，短歌や俳句，経験を基にした文章","title":"⑴に示す事項については，例えば，次のような言語活動を通して指導するものとする。","lines":["ア　事象を説明したり意見を述べたりするなど，考えたことや伝えたいことを書く活動。","イ　短歌や俳句をつくるなど，感じたことや想像したことを書く活動。","ウ　事実や経験を基に，感じたり考えたりしたことや自分にとっての意味について文章に書く活動。"],"notes":null,"units":[{"u":"春の空","b":"5年","s":1},{"u":"日常を十七音で","b":"5年","s":1},{"u":"みんなが使いやすいデザイン","b":"5年","s":1},{"u":"夏の夜","b":"5年","s":1},{"u":"秋の夕","b":"5年","s":1},{"u":"固有種が教えてくれること 自然環境を守るために（統計資料の読み方）","b":"5年","s":1},{"u":"あなたは、どう考える","b":"5年","s":1},{"u":"冬の朝","b":"5年","s":1},{"u":"もう一つの物語","b":"5年","s":1},{"u":"春のいぶき","b":"6年","s":1},{"u":"たのしみは","b":"6年","s":1},{"u":"デジタル機器と私たち","b":"6年","s":1},{"u":"秋の深まり","b":"6年","s":1},{"u":"『鳥獣戯画』を読む 発見、日本文化のみりょく","b":"6年","s":1},{"u":"おすすめパンフレットを作ろう","b":"6年","s":1},{"u":"大切にしたい言葉","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-C-ア","g":[5,6],"area":"C","areaName":"Ｃ 読むこと","mark":"ア","head":"事実と感想，意見の関係を押さえ要旨を把握する","title":"読むことに関する次の事項を身に付けることができるよう指導する。","lines":["ア　事実と感想，意見などとの関係を叙述を基に押さえ，文章全体の構成を捉えて要旨を把握すること。"],"notes":null,"units":[{"u":"見立てる 言葉の意味が分かること 原因と結果","b":"5年","s":1},{"u":"笑うから楽しい 時計の時間と心の時間 主張と事例","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-C-イ","g":[5,6],"area":"C","areaName":"Ｃ 読むこと","mark":"イ","head":"登場人物の相互関係や心情を描写から捉える","title":"読むことに関する次の事項を身に付けることができるよう指導する。","lines":["イ　登場人物の相互関係や心情などについて，描写を基に捉えること。"],"notes":null,"units":[{"u":"銀色の裏地","b":"5年","s":1},{"u":"帰り道","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-C-ウ","g":[5,6],"area":"C","areaName":"Ｃ 読むこと","mark":"ウ","head":"文章と図表を結び付け，論の進め方を考える","title":"読むことに関する次の事項を身に付けることができるよう指導する。","lines":["ウ　目的に応じて，文章と図表などを結び付けるなどして必要な情報を見付けたり，論の進め方について考えたりすること。"],"notes":null,"units":[{"u":"新聞を読もう","b":"5年","s":1},{"u":"固有種が教えてくれること 自然環境を守るために（統計資料の読み方）","b":"5年","s":1},{"u":"インターネットでニュースを読もう","b":"6年","s":1},{"u":"『鳥獣戯画』を読む 発見、日本文化のみりょく","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-C-エ","g":[5,6],"area":"C","areaName":"Ｃ 読むこと","mark":"エ","head":"人物像や全体像を想像し，表現の効果を考える","title":"読むことに関する次の事項を身に付けることができるよう指導する。","lines":["エ　人物像や物語などの全体像を具体的に想像したり，表現の効果を考えたりすること。"],"notes":null,"units":[{"u":"たずねびと","b":"5年","s":1},{"u":"やまなし イーハトーヴの夢","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-C-オ","g":[5,6],"area":"C","areaName":"Ｃ 読むこと","mark":"オ","head":"理解したことに基づいて自分の考えをまとめる","title":"読むことに関する次の事項を身に付けることができるよう指導する。","lines":["オ　文章を読んで理解したことに基づいて，自分の考えをまとめること。"],"notes":null,"units":[{"u":"やなせたかし―アンパンマンの勇気","b":"5年","s":1},{"u":"想像力のスイッチを入れよう","b":"5年","s":1},{"u":"せんねん まんねん 名づけられた葉","b":"6年","s":1},{"u":"ぼくのブック・ウーマン","b":"6年","s":1},{"u":"「考える」とは","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-C-カ","g":[5,6],"area":"C","areaName":"Ｃ 読むこと","mark":"カ","head":"意見や感想を共有し，考えを広げる","title":"読むことに関する次の事項を身に付けることができるよう指導する。","lines":["カ　文章を読んでまとめた意見や感想を共有し，自分の考えを広げること。"],"notes":null,"units":[{"u":"大造じいさんとガン","b":"5年","s":1},{"u":"「考える」とは","b":"6年","s":1},{"u":"海の命","b":"6年","s":1}],"kan":"s"},{"id":"kokugo-56-C-2","g":[5,6],"area":"C","areaName":"Ｃ 読むこと","mark":"","head":"言語活動例：説明や解説の文章を比べる，伝記を読む，複数の本や新聞で調べる","title":"⑴に示す事項については，例えば，次のような言語活動を通して指導するものとする。","lines":["ア　説明や解説などの文章を比較するなどして読み，分かったことや考えたことを，話し合ったり文章にまとめたりする活動。","イ　詩や物語，伝記などを読み，内容を説明したり，自分の生き方などについて考えたことを伝え合ったりする活動。","ウ　学校図書館などを利用し，複数の本や新聞などを活用して，調べたり考えたりしたことを報告する活動。"],"notes":null,"units":[{"u":"銀色の裏地","b":"5年","s":1},{"u":"見立てる 言葉の意味が分かること 原因と結果","b":"5年","s":1},{"u":"新聞を読もう","b":"5年","s":1},{"u":"たずねびと","b":"5年","s":1},{"u":"固有種が教えてくれること 自然環境を守るために（統計資料の読み方）","b":"5年","s":1},{"u":"やなせたかし―アンパンマンの勇気","b":"5年","s":1},{"u":"想像力のスイッチを入れよう","b":"5年","s":1},{"u":"大造じいさんとガン","b":"5年","s":1},{"u":"帰り道","b":"6年","s":1},{"u":"笑うから楽しい 時計の時間と心の時間 主張と事例","b":"6年","s":1},{"u":"インターネットでニュースを読もう","b":"6年","s":1},{"u":"やまなし イーハトーヴの夢","b":"6年","s":1},{"u":"『鳥獣戯画』を読む 発見、日本文化のみりょく","b":"6年","s":1},{"u":"ぼくのブック・ウーマン","b":"6年","s":1},{"u":"「考える」とは","b":"6年","s":1},{"u":"海の命","b":"6年","s":1}],"kan":"s"}],"kaisetsu":{"source":"小学校学習指導要領（平成29年告示）解説 国語編（文部科学省，平成29年7月）","items":{"kokugo-12-K1-ア":{"page":42,"name":"言葉の働き","expl":{"intro":[],"k":["日常的に用いている言葉には，出来事や事物の内容を表す働きや，経験したことを伝える働きがあるということに気付くことを示している。","事物の内容や自分が経験したことを表現したり伝達したりすることは，言葉の主要な働きである。このような働きが，日常的に使用している言葉にあることに気付くようにすることが大切である。第１学年及び第２学年では，事物の内容や経験したことといった，具体的なことを伝える働きに重点を置いて気付くことを求めている。","この指導事項は〔知識及び技能〕や〔思考力，判断力，表現力等〕に示す様々な内容に関連するが，例えば，事物の内容や経験したことをどのような言葉を用いて表現するかという観点から，〔知識及び技能〕の⑴オの「身近なことを表す語句の量を増し，話や文章の中で使う」こととの関連を図り，指導の効果を高めることが考えられる。"],"s":[],"m":[]}},"kokugo-12-K1-イ":{"page":43,"name":"話し言葉と書き言葉","expl":{"intro":[],"k":["国語の音節（拍）と文字の関係，アクセントによる語の違いへの気付き，話す際の姿勢や口形，発声，発音に注意して話すことを示している。","音節と文字との関係とは，平仮名や片仮名における音節（拍）と文字との関係のことを示している。平仮名や片仮名は拗音の表記などを除けば，一文字が一音節（拍）に対応する文字である。漢字はそのような表音文字ではなく，個々の文字が音と意味とを備えている。児童の発達や学習の状況に応じて，一文字ずつ文字と音とを対応させて読むことなどが有効である。","アクセントによる語の意味の違いは，音声的な面から語を識別することに関わる点で重要である。日本語のアクセントは，一般に音節（拍）の高低として理解される。実際に発音を聞いたり発音したりすることを通して，意味の違いに気付くようにすることが大切である。","姿勢や口形，発声や発音に注意して話すことは，平成20年告示の学習指導要領では「Ａ話すこと・聞くこと」の「話すこと」に関する指導事項として示していたものであるが，〔知識及び技能〕へと位置付けを変更した。姿勢や口形，発声や発音は，主に相手に内容を正確に伝えるために重要である。","姿勢は，相手に対する印象などに加え，発声をしやすくしたり明瞭な発音をしたりする基礎となるものである。背筋を伸ばし，声を十分出しながら落ち着いた気持ちで話すことが求められる。また，正しい発音のために，唇や舌などを適切に使った口形について，早い時期に身に付けられるようにすることが大切である。「ライオン」を「ダイオン」，「子供」を「コロモ」，「サカナ」を「チャカナ」と発音するなど，ラ行やサ行などによく見られる置き換えや，「トウモロコシ」が「トウモコシ」となる音の省略など，幼児音の残る児童も見られる。そこで，母音の口形及び発音，発声について適切に指導するとともに，一音一音を識別させ，安定した発声や明瞭な発音へと導いていくようにすることが必要となる。"],"s":[],"m":[]}},"kokugo-12-K1-ウ":{"page":44,"name":"話し言葉と書き言葉","expl":{"intro":[],"k":["仮名遣いや助詞，句読点やかぎ（「 」）の使い方，平仮名や片仮名の読み書きや基礎的な使い方を理解して文や文章で使うことを示している。","長音とは「おかあさん」のように「のばす音」，拗音とは「きゃ」，「きゅ」のように「ねじれる音」，促音とは「らっぱ」のように「つまる音」，撥音とは「ん」の字に当たる「はねる音」のことである。","ここでは，発音に関する指導と関連させるとともに，日々の学習の積み重ねの中で，次第にその規則性に気付き，身に付けていくことができるようにすることが大切である。また，助詞の「は」，「へ」及び「を」については，視写や聴写などを取り入れながら繰り返し指導することによって，文の中で使えるようにすることが必要である。","句点については，文を書く際には，文末に必ず句点を打つように指導し，文意識を育てていくようにすることが大切である。読点については，文頭の接続語などの後，主語の後，従属節の後，並列する語の後など必要な箇所に打つことを理解することが重要である。","かぎ（「 」）については，会話文におけるかぎ（「 」）の使い方を中心に指導し，その他の箇所でもかぎ（「 」）が使われていることに気付くようにすることが大切である。","平仮名の読み書きについては，各教科等の学習の基礎となるものであり，第１学年でその全部の読み書きができるようにする必要がある。片仮名で書く語の種類を知り，文や文章の中で使うこととは，擬声語や擬態語，外国の地名や人名，外来語など片仮名で書く語がどのような種類の語であるかを知り，実際に文や文章の中で片仮名を使うことを示している。"],"s":[],"m":[]}},"kokugo-12-K1-エ":{"page":45,"name":"漢字","expl":{"intro":[],"k":["第１学年では，漢字に対する興味や関心，字形に関する意識などを養いながら，学年に配当されている80字の漢字を読めるようにする。第１学年の配当漢字には，象形文字や指事文字が多く含まれているので，漢字の字形と具体的な事物（実物や絵など）とを結び付けるなどの指導を工夫し，漢字が表意文字であることを意識しながら，漢字に対する興味や関心を高められるようにする。また，漢字単独の読みだけではなく，文や文章の中で漢字を読むことも大切にして，文脈の中での意味と結び付けていくようにする。","漸次書き，文や文章の中で使うとは，学習した漢字を習得できるように少しずつ書くことを積み重ねるとともに，文や文章で使うようにすることである。当該漢字を知っていることにとどまらず，実際に使うことによって有効性を実感できるようにし，第２学年の終わりまでに文や文章の中で使うことができるよう，２学年間にわたって確実に定着させていくことが大切である。","第２学年では，漢字を読むことについて，学年別漢字配当表の第２学年までに配当されている漢字を読むことを示している。また，漢字を書くことについては，第１学年に配当されている漢字を書き，文や文章の中で使う習慣を身に付けるようにするとともに，当該学年に配当されている漢字を漸次書き，文や文章の中で使うようにすることを示している。"],"s":[],"m":[]}},"kokugo-12-K1-オ":{"page":46,"name":"語彙","expl":{"intro":[],"k":["身近なことに関する語句の量を増したり，意味による語句のまとまりに気付いたりすることを通して語彙を豊かにすることを示している。","この指導事項は，小学校の第１学年及び第２学年の段階から語彙の量と質を豊かにすることが，全ての教科等における学習の基盤となる言語能力の育成につながることから，今回の改訂において新設したものである。","第１学年及び第２学年では，身近なことを表す語句の指導に重点を置き，これらに関する語句を理解し使うことを通じて，使いこなせる語句の量を増やし，語彙を豊かにすることを示している。身近なことを表す語句とは，日常生活や学校生活で用いる言葉，周りの人について表す言葉，事物や体験したことを表す言葉などを指す。これらを話や文章の中で使うことを通して，自分の語彙として身に付けていくことが重要である。","意味による語句のまとまりとは，ある語句を中心として，同義語や類義語，対義語など，その語句と様々な意味関係にある語句が集まって構成している集合である。例えば，動物や果物の名前を表す語句，色や形を表す語句などは，相互に関係のある語句として一つのまとまりを構成している。","語彙を豊かにするとは，自分の語彙を量と質の両面から充実させることである。使用する語句の量や範囲を広げながら，語句相互の意味関係を理解することで，児童が，自分の語彙を豊かにしていくことが重要である。","指導に当たっては，例えば，聞いたり読んだりする際に新しい言葉に着目することや，話したり書いたりする際にいろいろな表現を使うようにすることが有効である。また，「⑵ 情報と情報との関係」との関連を図り，指導の効果を高めることも考えられる。"],"s":[],"m":[]}},"kokugo-12-K1-カ":{"page":47,"name":"文や文章","expl":{"intro":[],"k":["話や文章に含まれる文の中で主語と述語が関係していることに気付かせることを示している。","書き言葉としての文章だけでなく，話し言葉としての話の中に含まれる文においても主語と述語との関係に気付かせることが大切である。主語と述語との関係とは，主語と述語の適切な係り受けのことである。例えば，「昨日，私は，母がおやつにクッキーを焼いてくれました。」のように「私は」に対する述語が示されないといったことがないように，主語と述語を適切に対応させることが必要である。表現するときだけでなく，文章を読むときにも主語と述語の適切な係り受けについて意識できるようにすることが大切である。","また，主語と述語が適切な係り受けの関係となっていることが，伝えたいことを相手に正確に伝える上で重要であることに気付くようにすることが大切である。"],"s":[],"m":[]}},"kokugo-12-K1-キ":{"page":48,"name":"言葉遣い","expl":{"intro":[],"k":["丁寧な言葉と普通の言葉を相手や場面に応じて使い分けることに気を付けて話すとともに，敬体で書かれた文章を読み慣れることを示している。","話すときの言葉遣いは，相手との親疎や人数の多少，改まった場面かどうかなどに応じて使い分ける必要がある。第１学年及び第２学年では，場面や状況によって丁寧な言葉を用いるときと普通の言葉を用いるときとがあることに気付き，それぞれを使い分けようとする気持ちをもたせることが大切である。","敬体とは，文末が「です」，「ます」又は「でした」，「ました」などのようになる文体である。まず，教科書の敬体の文章に読み慣れるようにすることが必要である。最初は，文末の表現に注意させて読み慣れるようにし，漸次自分でも使い慣れるようにしていくことが有効である。"],"s":[],"m":[]}},"kokugo-12-K1-ク":{"page":49,"name":"音読，朗読","expl":{"intro":[],"k":["語のまとまりや言葉の響きなどに気を付けて音読することを示している。","音読には，自分が理解しているかどうかを確かめる働きや自分が理解したことを表出する働きなどがある。このため，声に出して読むことは，響きやリズムを感じながら言葉のもつ意味を捉えることに役立つ。また，音読により自分が理解したことを表出することは，他の児童の理解を助けることにもつながる。","明瞭な発音で文章を読むこと，ひとまとまりの語や文として読むこと，言葉の響きやリズムなどに注意して読むことなどが重要となる。文字を確かめ，内容が理解できるか，どのように感じるかなどを，自分の声を自分で聞きながら把握していくことに重点を置くこととなる。","指導に当たっては，例えば，〔思考力，判断力，表現力等〕の「Ｂ書くこと」の「推敲」に関する指導事項のエと関わらせたり，「Ｃ読むこと」の「構成と内容の把握」に関する指導事項のアやイと関わらせたりすることが考えられる。"],"s":[],"m":[]}},"kokugo-12-K2-ア":{"page":50,"name":"情報と情報との関係","expl":{"intro":[],"k":["共通，相違，事柄の順序などに重点を置いて情報と情報との関係を理解することを示している。","相手の考えを理解したり自分の思いや考えを表現したりするためには，話や文章の中に含まれている情報と情報とがどのように結び付いているかを捉えたり，整理したりすることが必要となる。","共通する関係を理解するとは，事柄同士の中から同じ点を見いだしたり，そのことによって共通であることを認識したりすることである。例えば，一見異なるように見えるもの同士にも見方によっては共通する部分が見いだせることを理解したり，似ているもの同士のどことどこが似ているのかを明らかにしたりすることなどが考えられる。","相違する関係を理解するとは，事柄同士の様子や特徴などについて違う点を見いだしたり，そのことによって相違していることを認識したりすることである。例えば，一見似たように見えるもの同士にも見方によっては異なる部分を見いだせることを理解したり，異なるもの同士のどこが異なっているのかを明らかにしたりすることなどが考えられる。","事柄の順序の関係を理解するとは，複数の事柄などが一定の観点に基づいて順序付けられていることを認識することである。例えば，時間，作業手順，重要度，優先度などの観点に基づいた順序が考えられる。","第１学年及び第２学年では，事柄同士の共通点や相違点を見付けることや，事柄の順序を考えることが，理解したり表現したりする上で大切であることを理解することが重要である。","指導に当たっては，例えば，〔思考力，判断力，表現力等〕の「Ａ話すこと・聞くこと」の⑴の「話題の設定，情報の収集，内容の検討」に関する指導事項のア，「構成の検討，考えの形成」に関する指導事項のイ，「Ｂ書くこと」の⑴の「題材の設定，情報の収集，内容の検討」に関する指導事項のア，「構成の検討」に関する指導事項のイ，「Ｃ読むこと」の⑴の「構造と内容の把握」に関する指導事項のアやイなどとの関連を図り，指導の効果を高めることが考えられる。"],"s":[],"m":[]}},"kokugo-12-K3-ア":{"page":53,"name":"伝統的な言語文化","expl":{"intro":[],"k":["児童が伝統的な言語文化としての古典に出合い，親しんでいく始まりとして，昔話や神話・伝承などの読み聞かせを聞くなどすることを示している。","昔話や神話・伝承は，国の始まりや形成過程，人の生き方や自然などについての古代からの人々のものの見方や考え方が，長い歴史の中で口承だけでなく筆記された書物として，現在に引き継がれてきたものである。","昔話は，「むかしむかし，あるところに」などの言葉で語り始められる空想的な物語であり，特定または不特定の人物について描かれる。","神話・伝承は，一般的には特定の人や場所，自然，出来事などと結び付けられ，伝説的に語られている物語である。古事記，日本書紀，風土記などに描かれたものや，地域に伝わる伝説などが教材として考えられる。その際，児童の発達の段階や初めて古典を学習することを考慮し，易しく書き換えたものを取り上げることが必要である。","第１学年及び第２学年では，まず，読み聞かせを聞くことで，伝統的な言語文化に触れることの楽しさを実感できるようにすることが大切である。話の面白さに加え，独特の語り口調や言い回しなどにも気付き，親しみを感じていくことを重視する。また，地域が育んできた言語文化に触れることも大切である。例えば，地域の人々による民話の語りを聞いたり劇を行ったりするなど，言語活動を工夫することなどが考えられる。"],"s":[],"m":[]}},"kokugo-12-K3-イ":{"page":53,"name":"伝統的な言語文化","expl":{"intro":[],"k":["言葉そのものがもつ豊かさに気付くことを重視して新設した指導事項である。長く親しまれている言葉遊びを通して，語彙を豊かにし，言葉を用いること自体を楽しむことを示している。言語感覚を養う基盤として，第１学年及び第２学年に示している。","言葉遊びとしては，いろはうたやかぞえうた，しりとりやなぞなぞ，回文や折句，早口言葉，かるたなど，昔から親しまれてきたものが考えられる。また，地域に伝わる言葉遊びに触れたり，郷土のかるたで遊んだりする活動を通して地域特有の言語文化に親しむことも考えられる。","言葉の豊かさに気付くとは，言葉のリズムを楽しんだり，言葉を用いて発想を広げたり，言葉を通して人と触れ合ったりするなど，言葉のもつよさを十分に実感することである。"],"s":[],"m":[]}},"kokugo-12-K3-ウ":{"page":54,"name":"書写","expl":{"intro":[],"k":["書写に関する（ア），（イ），（ウ）の事項を理解し使うことを示している。","（ア） 姿勢や筆記具の持ち方を正しくして書くこと。","読みやすく整った文字を効率よく書くためには，姿勢と筆記具の持ち方を正しくして書くことが必要である。","姿勢とは，文字を書くときの体の構えのことである。背筋を伸ばした状態で体を安定させ，書く位置と目の距離を適度に取り，筆記具を持ったときに筆先が見えるようにすることが重要である。筆記具は，第１学年及び第２学年では主に鉛筆やフェルトペンを使用する。持ち方を正しくするには，人差し指と親指と中指の位置，手首の状態や鉛筆の軸の角度などを適切にすることが必要である。","姿勢と筆記具の持ち方は深く関連する。例えば，正面からでは筆先が見えないような持ち方で書く児童は，横から紙面をのぞき込む姿勢をとる。この状況で「背筋を伸ばす」といった指導のみが加えられた場合，児童は筆先を注視することなく文字を書くことになる。このようなことがないように関連性を考えて指導することが大切である。","（イ） 点画の書き方や文字の形に注意しながら，筆順に従って丁寧に書くこと。点画の始筆から送筆，さらに，終筆（とめ，はね，はらい）までを確実に書き，筆順に従って点画を積み重ねながら文字の形を形成していく過程を意識して書くことが大切である。そのように意識して書くことが読みやすい文字を丁寧に書こうとする態度を身に付けることにつながる。","点画とは，文字を構成する「横画，縦画，左払い，右払い，折れ，曲がり，そり，点」などのことである。漢字の構成要素を指すものであるが，仮名を構成する線についても併せて指導することとする。点画の書き方とは，点画の始筆から送筆，さらに，終筆（とめ，はね，はらい）までの筆記具の運び方のことである。特に点画の始筆と終筆の書き方に注意することが文字を丁寧に書くことと深く関わるので，書き方を意識しながら確実に書くようにすることが大切である。文字の形とは，点画の積み重ねによって形成される文字のおおよその形（概形）のことである。極端にゆがんだ形を生まないように，児童には，文字のおおよその形を把握した上で書くように指導することが求められる。","筆順とは，文字を書き進める際の合理的な順序が習慣化したもののことである。学校教育で指導する筆順は，「上から下へ」，「左から右へ」，「横から縦へ」といった原則として一般に通用している常識的なものである。","（ウ） 点画相互の接し方や交わり方，長短や方向などに注意して，文字を正しく書くこと。","点画相互の関係性は，正しく整った文字を実現するために理解しておかなければならないルールでもあるため，基準となる字形を見て理解することが求められる。","接し方や交わり方とは，二つの点画がどの位置で接したり交わったりすべきかといった点画相互の位置関係のことを指す。長短や方向とは，点画の長さや向きに関する点画相互の関係性のことである。例えば，「川」の場合，仮に一画目が他の二画に比べて長すぎたり，その方向が縦方向ではなくて横方向を向いていたりすると，その文字は「川」という文字としては認識されにくい。なお，接し方や交わり方，長短や方向は，文字の正誤に関わることから，漢字に関する事項の指導と関連を図りながら指導することが望ましい。"],"s":[],"m":[]}},"kokugo-12-K3-エ":{"page":56,"name":"読書","expl":{"intro":[],"k":["第１学年及び第２学年では，読書に親しむことに重点を置いている。読書を通して，様々な知識や情報を得たり，自分の考えを広げたりすることができる力の育成を目指し，日常的に読書に親しむようにすることが大切である。そのためには，読書を通して，新しい知識を獲得したり物語の世界を疑似的に体験したりできる読書の楽しさや面白さを感じることが大切である。","いろいろな本としては，例えば，物語，昔話，絵本，科学的な読み物，図鑑などが挙げられる。表紙や題名，知りたいことや読んでみたい内容から本を選んで読むことを通して，身の回りにはいろいろな本があることを知ることが大切である。なお，児童の発達や学習の状況に応じ，易しい読み物の読み聞かせやストーリーテリングなどを聞くことを通して，読書に興味をもつようにすることも考えられる。","2 〔思考力，判断力，表現力等〕"],"s":[],"m":[]}},"kokugo-12-A-ア":{"page":57,"name":"話題の設定，情報の収集，内容の検討","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年においては，身近なことや経験したことなどから話題を決め，必要な情報を選ぶことを示している。","話題を設定する上で第１学年及び第２学年にふさわしい対象として，身近なことや経験したことなどを挙げている。例えば，学校や家庭，地域における身近な出来事や自分が経験したことなどが考えられる。","話題を決めるとは，身近なことや経験したことなどの中から話題にしたいものを想起し，児童の興味や関心の度合い，伝えたい思いの強さを手掛かりにして一つに決めることである。","伝え合うために必要な事柄を選ぶとは，話題として決めた身近なことや経験したことなどに関連する事柄を具体的に思い出し，必要な事柄に絞っていくことである。第１学年及び第２学年では，集めた事柄の全部を話の中に取り入れるのではなく，伝え合うために必要な事柄かどうかを判断して選ぶことが重要である。また，話したり話し合ったりするために必要な事柄を選ぶことに加え，例えば自分が聞きたいことを聞く前に具体的に予想しておくなど，聞くことに関わって必要な事柄を選ぶことも重要となる。","なお，必要な材料を集めるためには，児童の発達や学習の状況に応じて，体験したことを写真や具体物を見て思い出したり，対象物の特徴を考えたりするなどの手掛かりを与えることも有効である。"],"m":[]}},"kokugo-12-A-イ":{"page":58,"name":"構成の検討，考えの形成（話すこと）","expl":{"intro":[],"k":[],"s":["話す事柄の順序について考えることを示している。第１学年及び第２学年においては，相手に伝わるように，行動したことや経験したことの順序に気を付けて話を構成することに重点を置いている。","相手に伝わるようにとは，聞き手を意識して，聞き手に伝わるかどうかを想像しながら話の構成を考えることである。相手としては，教師や同級生，幼児など身近な人々が考えられる。人数についても，ペアから小グループ，学級全体へと広げていくことが考えられる。様々な相手に話す経験を重ねることで，相手を具体的に意識することができるようになる。","話す事柄の順序を考えるとは，話の内容が相手に伝わるようにするにはどのような順序を踏まえればよいのかを考えることである。行動や経験の時間的な順序，物事や対象を説明したり紹介したりする際の事柄の順序，「始め−中−終わり」といった話の構成に関わる順序などを考えられるようにしていくこととなる。なお，第１学年及び第２学年においては，順序をよく考えることで，自分の伝えたいことを表現できたという実感を味わわせ，工夫して話そうとする態度へとつなぐことが大切である。"],"m":[]}},"kokugo-12-A-ウ":{"page":59,"name":"表現，共有（話すこと）","expl":{"intro":[],"k":[],"s":["伝えたいことを相手に伝えるための発声や発音の工夫について考えることを示している。第１学年及び第２学年においては，伝えたい事柄や相手に応じて，声の大きさや速さなどに注意し，適切な話し方を工夫することに重点を置いている。伝えたい事柄に応じて声の大きさや速さを工夫するとは，自分が話す内容を確かめ，何を伝えたいのかを意識した上で，声の大きさや速さについて工夫することである。例えば，大事なところは特に大きな声でゆっくり話すといったことが考えられる。このことが第３学年及び第４学年の「話の中心を意識して」話すことに発展していく。","相手に応じて声の大きさや速さを工夫するとは，聞き手の人数や聞き手との距離などを踏まえ，聞き手に届く音量や，音声が明確に聞こえる速さで話すことである。このことが第３学年及び第４学年で「話す場面を意識」することに発展していく。","声の大きさや速さなどを工夫するためには，実際に話す機会を設定することが重要である。話し言葉としての表現の仕方を工夫するためには，例えば，〔知識及び技能〕の⑴「イ 音節と文字との関係，アクセントによる語の意味の違いなどに気付くとともに，姿勢や口形，発声や発音に注意して話すこと。」との関連を図り，指導の効果を高めることが考えられる。また，伝えたい相手を意識して話すためには，例えば，〔知識及び技能〕の⑴キの「丁寧な言葉と普通の言葉との違いに気を付けて使う」こととの関連を図り，指導の効果を高めることが考えられる。"],"m":[]}},"kokugo-12-A-エ":{"page":60,"name":"構造と内容の把握，精査・解釈，考えの形成，共有（聞くこと）","expl":{"intro":[],"k":[],"s":["集中して話を聞き，話の内容を捉えて感想をもつことを示している。第１学年及び第２学年においては，話し手が知らせたいことや自分が聞きたいことを落とさないように集中して聞くことに重点を置いている。","話し手が知らせたいことを落とさないように集中して聞くとは，話し手が自分に知らせたいことは何か考えながら聞くことである。そのためには，事柄の順序を意識しながら聞き，話の内容を把握することが大切である。","また，自分が聞きたいことを落とさないように集中して聞くとは，自分にとって大事なことや知りたいことを落とさずに聞くことである。そのためには，自分の聞きたいことを明確にして話を聞くことが大切である。","話の内容を捉えて感想をもつことについては，話の内容に対して，自分が興味をもったところや感心したところなどを伝えることから始めて，徐々に自分の体験と結び付けるなどして感想が言えるようにしていくことが大切である。"],"m":[]}},"kokugo-12-A-オ":{"page":61,"name":"話合いの進め方の検討，考えの形成，共有（話し合うこと）","expl":{"intro":[],"k":[],"s":["話合いの基盤となる「思考力，判断力，表現力等」を示す指導事項である。第１学年及び第２学年においては，互いの話に関心をもって聞き，相手の発言に関連した発言をすることで話をつなぐことを示している。","互いの話に関心をもち，相手の発言を受けて話をつなぐとは，互いの話に関心をもって聞き，話の内容を理解した上で話題に沿って話したり，再び聞いたりすることである。相手の発言を受けて話をつなぐためには，例えば，相手の発言を聞いて，質問する，復唱して確かめる，共感を示す，感想を言うことなどが考えられる。","互いの話に関心をもって話し合うためには，このような活動を通して，話がつながることの楽しさやよさを実感できるようにすることが大切であり，第３学年及び第４学年以降での話合いの素地となる。"],"m":[]}},"kokugo-12-A-2":{"page":62,"name":"言語活動例","expl":{"intro":[],"k":[],"s":["ア　紹介や説明，報告など伝えたいことを話したり，それらを聞いて声に出して確かめたり感想を述べたりする活動。","伝えたいことを話したり，それらを聞いて声に出して確かめたり感想を述べたりする言語活動を例示している。","紹介とは，聞き手が知らないことや知りたいと思っていることを伝えることである。また，報告とは，見たことや聞いたことなどの事実や出来事を伝えることであり，説明とは，それらの内容を相手に分かるようにして伝えることである。紹介，説明，報告などの話す活動は，国語科に限らず，第１学年及び第２学年の言語活動として各教科等の学習に取り入れられることが多いため，それらの学習との連携が求められる。","また，話す活動としてはこのほかに，挨拶や連絡などが考えられる。","声に出して確かめるとは，話し手の伝えたかったことを確認したり，聞き手が興味をもったことについて話し手の発言内容を繰り返したりすることである。","イ　尋ねたり応答したりするなどして，少人数で話し合う活動。","話合いについての言語活動を例示している。","二人から数名程度のグループを作って話し合うなどの多様な形態の話合いが考えられる。","少人数での話合いは，多人数での話合いに比べ，一人一人が発言する機会も多い。また，話し手と聞き手の距離も近く，聞き手の反応を見ながら分からないことを質問したり応答したりしやすいという特徴をもつ。","特に，大きな集団の中で話すことに抵抗を感じる児童もいるため，互いに認め合う雰囲気を大事にしながら，尋ねたり応答したりする機会を多くもつことが大切である。","話合いを行うに当たり，教師と児童，児童同士の話合いを参考にできるよう工夫することも有効である。","話し合う言語活動は，他教科等においても取り入れられることが多いため，それらの活動との連携が求められる。"],"m":[]}},"kokugo-12-B-ア":{"page":64,"name":"題材の設定，情報の収集，内容の検討","expl":{"intro":[],"k":[],"s":["書くことを見付け，必要な事柄を集めて伝えたいことを明確にすることを示している。","書く題材を設定する上で，第１学年及び第２学年にふさわしい対象として，経験したことや想像したことなどを挙げている。経験したこととしては，身近な生活の中で自分が行ったことや見聞きした身の回りの出来事などが考えられる。想像したこととしては，様々な事物や出来事などを基に，想像を膨らませて考えたことなどが考えられる。","書くことを見付けるとは，経験したことや想像したことなどを想起し，それらの中から書きたいことや伝えたいことを見いだすことである。児童は，経験や生活，あるいは興味や関心に違いがある。題材の設定においては，そのような違いを考慮することも重要である。また，各教科等における学習で感じたことや，疑問に思ったことなども題材となる。","必要な事柄を集めたり確かめたりすることとは，書くための材料を収集することである。情報の収集の過程には，書こうとする題材に必要な事柄を集める過程と，集めた事柄の中から必要なものを選ぶ過程とがある。第１学年及び第２学年においては，書くために必要な事柄を思い出したり想像したりして，ノートやカードに書き出すとともに，書き出した事柄を見て，書こうとする題材に必要な事柄かどうかを確かめることが重要である。書こうとする題材に必要かどうかを判断することを通して，伝えたいことを明確にすることができる。なお，児童の発達や学習の状況に応じて，書こうとする題材に必要な事柄を集める過程に重点を置いて指導するなどの配慮が求められる。","また，各教科等の学習や児童の日常生活での経験などと関連させ，児童一人一人にとって書くことのよさを実感できるものとなるよう留意することが大切である。"],"m":[]}},"kokugo-12-B-イ":{"page":65,"name":"構成の検討","expl":{"intro":[],"k":[],"s":["書きたいことは，書く前から明確である場合もあるが，書くことによって明確になる場合もある。第１学年及び第２学年では，構成を考えることによって自分の考えを明確にしていくことを重視する。事柄の順序に沿って簡単な構成を考えるとは，集めた事柄の順序に沿いながら，文章の始めから終わりまでを，内容のまとまりごとに，幾つかに分けて配置していくことを意識することである。経験した順序，物を作ったり作業したりする手順，事物や対象を説明する際の具体的内容の順序など，時間の順序や事柄の順序を考えることから，徐々に，文章の冒頭で内容を大まかに説明すると読み手に伝わりやすいといったことも考えられるようにしていくことが重要である。","順序を考えることは，伝えたいことを相手に分かってもらうために必要なことであることに気付くようにすることが大切である。また，簡単な構成を考える際には，文章には「始め−中−終わり」などの構成があることを意識できるようにすることが重要である。"],"m":[]}},"kokugo-12-B-ウ":{"page":66,"name":"考えの形成，記述","expl":{"intro":[],"k":[],"s":["事柄の順序に沿いながら，文や文章の中で，語と語及び文と文との続き方を考えて記述し，自分の考えを一層明確にしていくことを示している。","語と語や文と文との続き方に注意するとは，前後の語句や文のつながりを大切にし，一文の意味が明確になるように語と語との続き方を考えるとともに，離れたところにある語と語や文と文とのつながりについても考えて記述することである。内容のまとまりが分かるように書き表し方を工夫するとは，順序に沿って考えた構成を基に，内容が混在しないようにまとまりを明確にした記述の仕方を工夫することである。時間や事柄の順序を表す語を適切に用いたり，内容のまとまりが明確になっているかを確かめながら書いたりすることが重要になる。"],"m":[]}},"kokugo-12-B-エ":{"page":66,"name":"推敲","expl":{"intro":[],"k":[],"s":["推敲の指導事項として，文章を読み返す習慣を付けることを示している。推敲は，ア，イ，ウ，オの指導事項とも密接な関わりがある。そのため，設定した題材，事柄の順序，語と語や文と文との続き方などを意識しながら読み返すことを求めている。読み返す習慣を付けるためには，間違いに気付いて正すことでよりよく伝わる文章になることを実感できるようにすることが大切である。また，書いた文を音読してみることなども読み返す習慣を付けることにつながる。","間違いを正すためには，一文一文を丁寧に読み返していくことが求められる。その際，語と語や文と文との続き方を確かめるとともに，〔知識及び技能〕の⑴「ウ 長音，拗音，促音，撥音などの表記，助詞の「は」，「へ」及び「を」の使い方，句読点の打ち方，かぎ（「 」）の使い方を理解して文や文章の中で使うこと。」における表記の仕方や使い方などに注意することが重要である。"],"m":[]}},"kokugo-12-B-オ":{"page":67,"name":"共有","expl":{"intro":[],"k":[],"s":["書いた文章を互いに読み，感想を伝え合うことを通して，自分の文章のよいところを見付けることを示している。","自分の文章の内容や表現のよいところとは，内容や記述などにおいて見られる具体的なよさのことである。第１学年及び第２学年では，順序の分かりやすさ，語と語や文と文との続き方などを観点として感想を伝え合い，自分の文章の内容や表現のよいところを見付けることができるようにすることが求められる。","また，文章の内容や書き表し方に表れる書き手の思いや発想のよいところについて感じたことを伝え合うことは，感性や情緒を養うことにもつながる。"],"m":[]}},"kokugo-12-B-2":{"page":68,"name":"言語活動例","expl":{"intro":[],"k":[],"s":["ア　身近なことや経験したことを報告したり，観察したことを記録したりするなど，見聞きしたことを書く活動。","見聞きしたことを文章に書く言語活動を例示している。","報告とは，見たことや聞いたことなどの事実や出来事を伝えることである。記録とは，事実や事柄，経験したことや見聞きしたことなどについて，メモを取ったり，文章として正確に書き残したりすることである。","児童の発達や学習の状況に応じて，見聞きしたことを忘れたりその時の思いが薄れたりしないうちに書く学習を設定することが有効である。","イ　日記や手紙を書くなど，思ったことや伝えたいことを書く活動。","実用的な文章を書く言語活動を例示している。","日記とは，日々の出来事や感想などを記録したものである。毎日書く場合のほか，様々な場合がある。児童の発達や学習の状況に応じて，絵日記などの形式を用いて書くことも考えられる。","手紙とは，特定の相手に対し，用件や気持ちなどを文章で伝えるものである。相手を明確に意識できるため，児童自らが推敲する必要性を実感して書くことのできる言語活動でもある。児童の発達や学習の状況に応じて，短い文や伝言などで表すことも考えられる。","ウ　簡単な物語をつくるなど，感じたことや想像したことを書く活動。","感じたことや想像したことを文章に書く言語活動を例示している。","簡単な物語をつくるとは，想像したことなどから，登場人物を決め，簡単なお話を書くことである。第１学年及び第２学年では，絵や写真から場面や登場人物の会話，行動を想像し，言葉を書き添えたり，お話をつくったりするなどの活動が考えられる。","このほか，見たり経験したりして感じたことを言葉にして文や文章として書くことなどが考えられる。"],"m":[]}},"kokugo-12-C-ア":{"page":69,"name":"構造と内容の把握（説明的な文章）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年では，説明的な文章を読む際，順序を考えながら内容の大体を捉えて読む力の育成に重点を置いている。どのような順序によって説明されているかを考えながら文章の構造を大づかみに捉え，それを手掛かりに内容を正確に理解することが求められる。","順序については，時間的な順序や事柄の順序を取り上げている。時間的な順序とは，時間の経過に基づいた順序のことである。事柄の順序とは，事物の作り方の手順など文章の内容に関わる順序に加え，どのように文章を構成しているかという文章表現上の順序なども意味する。例えば，文章の冒頭において，全体の内容を大まかに説明していることなどに着目し，説明の順序を押さえることも考えられる。","また，内容の大体を捉えるとは，一つの段落など文章の特定の部分にとどまらず，文章全体に何が書かれているかを大づかみに把握することである。","児童の発達や学習の状況に応じて，題名や見出し，写真なども手掛かりにしながら，文章全体の内容の把握と各段落に書かれている内容の把握とを進めていくことが大切である。"],"m":[]}},"kokugo-12-C-イ":{"page":70,"name":"構造と内容の把握（文学的な文章）","expl":{"intro":[],"k":[],"s":["文学的な文章について，内容の大体を捉えながら読むことを示している。第１学年及び第２学年においては，場面の様子や「誰が何をした，どのようなことを言った」など，登場人物の行動などを基に，内容の大体を捉えることに重点を置いている。内容の大体を捉えることが，文章を精査・解釈することなどに結び付くことを徐々に実感できるようにしていくことが大切である。","文学的な文章の内容の大体を捉えることとは，場面の様子や登場人物の行動，会話などを手掛かりとしながら，物語の登場人物や主な出来事，結末などを大づかみに捉えることである。児童の発達や学習の状況に応じて，本や作品の題名，場面の様子を描いた挿絵なども手掛かりにしながら，誰が，どうして，どうなったかなどを把握することを繰り返して，物語全体の内容を正確に理解することが重要である。また，本の表紙や題名からどんな話が展開されるのかを予想するなどして，内容の大体を捉えることにつなげていくことも大切である。","なお，第１学年及び第２学年では，内容の大体を捉える際に音読したり読み聞かせを聞いたりすることも有効である。"],"m":[]}},"kokugo-12-C-ウ":{"page":71,"name":"精査・解釈（説明的な文章）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年では，アの指導事項で順序を考えながら文章の内容の大体を捉えたことを基に，文章の中の重要な語や文を考えて選び出すことを示している。","文章の中の重要な語や文とは，書き手が述べている事柄を正確に捉えるために，時間や事柄の順序に関わって文章の中で重要になる語や文，読み手として必要な情報を適切に見付ける上で重要になる語や文などのことである。","考えて選び出すとは，例えば，「書き手が伝えたいことは何かを考える」，「自分が知るべきことについて詳しく知る」といったことを意識しながら，重要だと考えられる語や文を文章の中から見付けることである。"],"m":[]}},"kokugo-12-C-エ":{"page":72,"name":"精査・解釈（文学的な文章）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年においては，イの指導事項で内容の大体を捉えたことを基に，場面の様子に着目して，登場人物の行動や会話について，何をしたのか，なぜしたのかなどを具体的に思い描きながら，その世界を豊かに想像することを示している。","物語は通常複数の場面によって構成され，展開に即して時間や場所，周囲の風景，登場人物などの様子が変化しながら描かれている。場面の様子に着目するとは，登場人物の行動を具体的に想像する上で，物語の中のどの場面のどのような様子と結び付けて読むかを明らかにすることである。","登場人物の行動を具体的に想像するとは，着目した場面の様子などの叙述を基に，主人公などの登場人物について，何をしたのか，どのような表情・口調・様子だったのかなどを具体的にイメージしたり，行動の理由を想像したりすることである。これは，第３学年及び第４学年，第５学年及び第６学年の指導事項を経て，中学校第１学年の指導事項の「内容を解釈すること」へと発展していく指導事項であり，叙述と結び付けて想像することが大切である。"],"m":[]}},"kokugo-12-C-オ":{"page":72,"name":"考えの形成","expl":{"intro":[],"k":[],"s":["文章を読んで理解した内容と自分の体験とを結び付けて，感想をもつことを示している。","文章の内容と自分の体験とを結び付けるとは，文章の内容を，自分が既にもっている知識や実際の経験と結び付けて解釈し，想像を広げたり理解を深めたりすることである。また，感想をもつとは，文章の内容に対して児童一人一人が思いをもつことである。読み手の体験は一人一人異なることから，どのような体験と結び付けて読むかによって，感想も異なってくる。指導に当たっては，児童の発達や学習の状況に応じて，文章との関連を考えながら，実際の経験を十分想起できるよう工夫することが考えられる。"],"m":[]}},"kokugo-12-C-カ":{"page":73,"name":"共有","expl":{"intro":[],"k":[],"s":["文章を読んで感じたことや分かったことを共有することを示している。","文章を読んで感じたことや分かったこととは，文章の構造と内容を把握し，精査・解釈することを通して，「おもしろいな」と感じたり「なるほど」と気付いたりすることである。これらの感想や気付きは，オの指導事項の指導を通して形成されるものであり，カの指導事項では，そうした一人一人の感想などを互いに共有し合うことが求められる。","共有するとは，互いの思いを分かち合ったり，感じ方や考え方を認め合ったりすることであり，感想などを書いて読み合ったり発表したりするなど様々な言語活動によって行うことが考えられる。","児童の発達や学習の状況に応じて，一人一人が文章のどの叙述に対して，どのような感想をもったのかを共有しやすくするための配慮や，互いの思いや考えを受容する雰囲気をつくる工夫が大切である。"],"m":[]}},"kokugo-12-C-2":{"page":74,"name":"言語活動例","expl":{"intro":[],"k":[],"s":["ア　事物の仕組みを説明した文章などを読み，分かったことや考えたことを述べる活動。","説明的な文章を読み，分かったことや考えたことを述べる言語活動を例示している。","取り上げる文章としては，物事の働きや様子，科学的なことを説明した文章などが考えられる。","分かったことや考えたことを述べるとは，例えば，読んで理解した内容を友達に話したり，読んで考えた感想を文章に書いたりすることである。文章を読んで分かったことや考えたことを表現する活動は，児童にとって，自分は何が分かり何を考えたのかを整理する機会にもなる。","イ　読み聞かせを聞いたり物語などを読んだりして，内容や感想などを伝え合ったり，演じたりする活動。","文学的な文章について，読み聞かせをしてもらったり自分で読んだりしたことを基に，内容や感想を伝え合ったり，演じたりする言語活動を例示している。取り上げる文章としては，物語，絵本などが考えられる。","内容や感想などを伝え合うとは，例えば，物語のあらすじや登場人物の行動などを文章にまとめたり，感想を述べたりすることである。演じるとは，例えば，役割を決めて音読したり，紙芝居を行ったりすることである。","この言語活動は，例えば，〔知識及び技能〕の⑶「ア 昔話や神話・伝承などの読み聞かせを聞くなどして，我が国の伝統的な言語文化に親しむこと。」と関連を図ることが考えられる。","ウ　学校図書館などを利用し，図鑑や科学的なことについて書いた本などを読み，分かったことなどを説明する活動。","図鑑や科学的な読み物などを読み，分かったことなどを説明する言語活動を例示している。","図鑑は，図や絵，写真を中心に構成され，そこに短い解説の文が載せられていることが多い。科学的なことについて書いた本には，特定の植物や生物のことを詳しく書いたものや，実験や観察の過程が描かれているものなど様々なものがある。分かったことなどを説明するとは，図鑑や科学的なことについて書いた本を読んで，何を知ったのか，知ったことに対してどう思ったのかなどについて，話したり書いたりすることである。","学校図書館や地域の図書館などの利用に当たっては，施設の利用方法や本の配架場所などを知ることが必要である。その際，「第３ 指導計画の作成と内容の取扱い」の２⑶の「本などの種類や配置，探し方について指導するなど，児童が必要な本などを選ぶことができるよう配慮すること。｣を踏まえて指導することが必要である。"],"m":[]}},"kokugo-34-K1-ア":{"page":77,"name":"言葉の働き","expl":{"intro":[],"k":["第１学年及び第２学年のアを受けて，日常的に用いている言葉には，思考や感情を表す働きがあるということに気付くことを示している。","考えたことや思ったことを表す働きとは，思考や感情を表出する働きと他者に伝える働きの両方を含むものである。思考や感情を言葉に表す働きによって，一層明確に筋道を立てて物事を考えたり，思いを意識化したりすることができる。このような言葉の働きに気付くためには，第１学年及び第２学年での「事物の内容を表す働き」や「経験したことを伝える働き」への気付きが基盤となる。","この指導事項は〔知識及び技能〕や〔思考力，判断力，表現力等〕に示す様々な内容に関連するが，例えば，考えたことや思ったことを正確に表現するという観点から，〔知識及び技能〕の⑴オの「様子や行動，気持ちや性格を表す語句の量を増し，話や文章の中で使う」こととの関連を図り，指導の効果を高めることが考えられる。"],"s":[],"m":[]}},"kokugo-34-K1-イ":{"page":78,"name":"話し言葉と書き言葉","expl":{"intro":[],"k":["話したり聞いたりする際に視線を意識することや，言葉の抑揚，強弱，間の取り方などの話し方に注意することを示している。この事項は，平成20年告示の学習指導要領では「話すこと・聞くこと」の指導事項として示していたが，今回の改訂では，話し言葉に関する〔知識及び技能〕の内容として位置付けた。","相手を見て話すことによって，聞き手の注意を喚起したり，話したことが聞き手に十分伝わっているかを判断したり，聞き手の反応を見ながら話したりすることができる。また，相手を見て聞くことによって，話を聞こうとする意志を示したり，同意や共感，疑問など，話に対する反応を話し手に示したりすることができる。第３学年及び第４学年では，こうしたことの基盤として，相手を見て話したり聞いたりすることを示している。","言葉の抑揚や強弱とは，話す際の声の調子の上げ下げや強弱のことである。身振りや表情などとともに，話の伝わり方に大きな影響を与える要素である。不自然な強調は避けなければならないが，話す内容に応じて，声の上げ下げに注意したり，特定の語や表現の一部を他よりも強調したりして，話の内容が相手に伝わるようにすることが大切である。","間の取り方は，話し手と聞き手の双方にとって重要である。話し手にとっての間とは，発音・発声のための息継ぎであると同時に，自らが伝えたい内容を聞き手に理解してもらうために意図的に取る，構文や語句の上での間でもある。一方，聞き手にとっての間は，話し手の意図を理解したり，思いや考えの大事な箇所を感じ取ったりするなど，自分の理解を深める時間となる。"],"s":[],"m":[]}},"kokugo-34-K1-ウ":{"page":78,"name":"話し言葉と書き言葉","expl":{"intro":[],"k":["漢字と仮名の表記，送り仮名の付け方，改行の仕方，句読点の打ち方，ローマ字の読み書きに関する国語の表記を理解し，使うことを示している。","漢字と仮名とでは，音節との関係や書き表す語の種類など，文字としての性質や役割が異なっている。漢字と仮名を用いた表記を理解するとは，そのような性質や役割の異なる漢字や仮名を交ぜて書く「漢字仮名交じり文」という日本語の表記の仕方やその利点を理解することである。","送り仮名の付け方について理解する際には，個々の具体的な語の送り仮名の付け方だけでなく，活用語尾を送るという送り仮名の原則的な付け方についても理解を促し，活用についての意識をもたせるようにすることが重要である。","改行の仕方を理解して文や文章の中で使うとは，段落の始め，会話部分などの必要な箇所について行を改めて書くことを示している。また，第１学年及び第２学年のウの「かぎ（「 」）の使い方」を受けて，会話の部分などを改行して書くことが習慣となるようにすることも大切である。","句読点を適切に打つことは，第１学年及び第２学年のウの「句読点の打ち方」を理解して文や文章の中で使うことの発展である。句読点は，文の構成と関係している。特に読点は，意味を明確に伝えるために，文頭の接続詞などの後，主語の後，従属節の後，並列する語の後などに適切に打つことが求められる。第３学年及び第４学年では，それらに加え，文を読みやすくまた分かりやすくするために，文脈に合わせて適切に打つことができるようにすることが求められる。その際，「カ 主語と述語との関係，修飾と被修飾との関係，指示する語句と接続する語句の役割，段落の役割について理解すること。」と関連付けて指導することが有効である。","ローマ字で表記されたものを読み，ローマ字で書くことは，ローマ字での読み書きについて示したものである。ローマ字表記が添えられた案内板やパンフレットを見たり，コンピュータを使ったりする機会が増えるなど，ローマ字は児童の生活に身近なものになっていることなどを踏まえ，第３学年で指導するものとする。日常使われている簡単な単語とは，地名や人名などの固有名詞を含めた，児童が日常目にする簡単な単語のことである。","ローマ字の表記に当たっては，「ローマ字のつづり方」（昭和29年内閣告示）を踏まえることとなる。ここでは，「一般に国語を書き表す際には第１表に掲げたつづり方によるものと」し，「従来の慣例をにわかに改めがたい事情にある場合に限り，第２表に掲げたつづり方によっても差し支えない」こととされている。第１表（いわゆる訓令式）による表記の指導に当たっては，日本語の音が子音と母音の組み合わせで成り立っていることを理解することが重要である。第２表（いわゆるヘボン式と日本式）による表記の指導に当たっては，例えば，パスポートに記載される氏名の表記など，外国の人たちとコミュニケーションをとる際に用いられることが多い表記の仕方を理解することが重要である。"],"s":[],"m":[]}},"kokugo-34-K1-エ":{"page":80,"name":"漢字","expl":{"intro":[],"k":["第３学年及び第４学年においては，漢字を読むことについて，学年別漢字配当表の当該学年までに配当されている漢字を読むことを示している。また，漢字を書くことについては，当該学年の前の学年に配当されている漢字を書き，文や文章の中で使おうとする習慣を身に付けるようにするとともに，当該学年に配当されている漢字を漸次書き，文や文章の中で使うようにすることを示している。指導に当たっては，〔知識及び技能〕の⑶「ウ 漢字が，へんやつくりなどから構成されていることについて理解すること。」との関連を図ることが有効である。第３学年及び第４学年は，漢字による熟語などの語句の使用が増えてくる時期である。｢第３ 指導計画の作成と内容の取扱い｣の２⑴「イ 理解したり表現したりするために必要な文字や語句については，辞書や事典を利用して調べる活動を取り入れるなど，調べる習慣が身に付くようにすること。」を踏まえ，漢字辞典を使って漢字の読みや意味などを自分で調べる活動を積極的に取り入れ，習慣として定着するようにすることが大切である。","また，文や文章を書く際には，学習した漢字を使う習慣が身に付くようにすることが重要である。"],"s":[],"m":[]}},"kokugo-34-K1-オ":{"page":81,"name":"語彙","expl":{"intro":[],"k":["第１学年及び第２学年のオを受けて，様子や行動，気持ちや性格を表す語句の量を増したり，言葉の性質や役割によるまとまりを理解したりすることを通して語彙を豊かにすることを示している。","第３学年及び第４学年では，様子や行動，気持ちや性格を表す語句の量を増し，話や文章の中で使うことに重点を置いている。平成20年告示の学習指導要領では，「表現したり理解したりするために必要な語句を増」すことを示していたが，今回の改訂では，語彙に関する指導を充実させる観点から，各学年の重点を明示し，系統的に示している。なお，様子や行動，気持ちや性格を表す語句とは，事柄や人物などの様子や特徴を表す語句，人物などの行動や気持ち，性格を表す語句などを指す。これらを話や文章の中で使うことを通して，自分の語彙として身に付けていくことが重要である。","性質や役割による語句のまとまりがあることを理解するとは，様々な語句を，その特徴や使い方によって類別して捉えるということである。性質による語句のまとまりとは，物の名前を表す語句や，動きを表す語句，様子を表す語句などのまとまりのことである。役割による語句のまとまりとは，文の主語になる語句，述語になる語句，修飾する語句などのまとまりのことである。","語彙を豊かにするとは，自分の語彙の量と質を両面から充実させることである。性質や役割による語句のまとまりがあることを理解することを通して，語句の量を増し，使い方の範囲を広げ，語彙を豊かにすることが大切である。例えば，「Ｃ読むこと」において文学的な文章を読む際に，「様子や行動，気持ちや性格を表す語句」を捉えることや，「Ｂ書くこと」において語句を「役割」によって捉え，書き表し方を工夫したりすることも考えられる。"],"s":[],"m":[]}},"kokugo-34-K1-カ":{"page":82,"name":"文や文章","expl":{"intro":[],"k":["第１学年及び第２学年のカを受けて，主語と述語の関係，修飾と被修飾の関係，指示語や接続語の役割，段落の役割について理解することを示している。主語と述語との関係，修飾と被修飾との関係は，文の構成に関して理解を図る内容を示したものである。文章の内容を理解する場合だけでなく表現する場合にも，それぞれの文の中での語句の役割や，語句相互の関係に気を付けて，文がどのように組み立てられているかを理解することが重要である。第１学年及び第２学年では主語と述語が照応することが大切であることを取り上げている。これについての理解を深めるとともに，修飾語がどこに係るのかという修飾と被修飾との関係にも気を付けて，文の構成を理解することが大切である。","指示する語句と接続する語句の役割は，文や文章のつながりや関係性に関して理解を図る内容を示したものである。指示する語句とは，物事を指し示す役割をもつ語句のことである。具体的には，いわゆる「こ・そ・あ・ど言葉」と言われるものがこれに当たる。指示する語句を適切に使うことで，文や文章をより簡潔に表現したり，文と文との内容のつながりなどを明瞭に表したりすることができる。接続する語句とは，前後の文節や文などをつなぐ働きをもつ語句のことである。具体的には，いわゆる「つなぎ言葉」と言われるものがこれに当たる。接続する語句を適切に使うことで，文や文章などが，相互にどのように関わるのかを明確にし，文相互の関係，段落相互の関係などをつかんだり，端的に示したりすることができる。","なお，「このようなことから」，「なぜかというと」など，複数の語から構成される語句の中にも指示語，接続語と同様の役割をするものがあることから指示する語句，接続する語句という示し方をしている。","段落は，改行によって示されるいくつかの文のまとまりである形式段落と，その形式段落のいくつかが意味のつながりの上でひとまとまりになった意味段落とがある。段落には問題を提示したり，具体例を示したり，理由を述べたり，結論を述べたりするなどの役割がある。これらの段落相互の関係を理解することで，内容を把握したり必要な情報を的確に見付けたりすることができる。また，段落や段落相互の関係を明確にして表現することで，自分の思いや考えをより適切に表すことができる。"],"s":[],"m":[]}},"kokugo-34-K1-キ":{"page":83,"name":"言葉遣い","expl":{"intro":[],"k":["第１学年及び第２学年のキを受けて，相手や目的を意識して表現する際などに，丁寧な言葉を使うとともに，敬体と常体との違いに注意しながら書くことを示している。","常体とは，文末が「である」，「だ」又は「であった」，「だった」などのようになる文体である。文章を記述する際には，相手や目的に応じて敬体と常体のいずれかを使用して書くことが多い。それを意識的に使い分けることや，「です」，「ます」，「である」，「だ」などの文末表現に注意して書くことが求められる。"],"s":[],"m":[]}},"kokugo-34-K1-ク":{"page":84,"name":"音読，朗読","expl":{"intro":[],"k":["第１学年及び第２学年のクを受けて，文章の構成や内容を意識して音読することを示している。第３学年及び第４学年では，一文一文などの表現だけでなく，文章全体を意識して音読することを求めている。","文章全体として何が書かれているのかを大づかみに捉えたり，登場人物の行動や気持ちの変化などを大筋で捉えたりしながら，音読することを示している。なお，黙読を活用し，文章の内容の理解を深めることも重要である。","指導に当たっては，例えば，〔思考力，判断力，表現力等〕の「Ｂ書くこと」の「推敲」に関する指導事項のエと関わらせたり，「Ｃ読むこと」の「構成と内容の把握」に関する指導事項のアやイと関わらせたりすることが考えられる。"],"s":[],"m":[]}},"kokugo-34-K2-ア":{"page":85,"name":"情報と情報との関係","expl":{"intro":[],"k":["第１学年及び第２学年のアを踏まえ，考えと理由や事例，全体と中心の関係などに重点を置いて情報と情報との関係を理解することを示している。","理由は，なぜそのような考えをもつのかを説明するものである。事例とは，考えをより具体的に説明するために挙げられた事柄や内容のことである。このため，理解したり表現したりする上で，考えがどのような理由や事例によって支えられているのかを吟味することが重要である。","中心とは，話や文章の中心的な部分のことである。話や文章の全体を大づかみに捉えることが，その中心を把握することに役立つ。また，中心を把握することが，全体をより明確に捉えることにもつながっている。","指導に当たっては，例えば，〔思考力，判断力，表現力等〕の「Ａ話すこと・聞くこと」の⑴「イ 相手に伝わるように，理由や事例などを挙げながら，話の中心が明確になるよう話の構成を考えること。」，「Ｂ書くこと」の⑴「イ 書く内容の中心を明確にし，内容のまとまりで段落をつくったり，段落相互の関係に注意したりして，文章の構成を考えること。」，「ウ 自分の考えとそれを支える理由や事例との関係を明確にして，書き表し方を工夫すること。」，「Ｃ読むこと」の⑴「ア 段落相互の関係に着目しながら，考えとそれを支える理由や事例との関係などについて，叙述を基に捉えること。」，「ウ 目的を意識して，中心となる語や文を見付けて要約すること。」などとの関連を図り，指導の効果を高めることが考えられる。"],"s":[],"m":[]}},"kokugo-34-K2-イ":{"page":86,"name":"情報の整理","expl":{"intro":[],"k":["情報を整理する際に必要となる，比較や分類，語句の書き留め方，引用の仕方や出典の示し方，辞書や事典などの使い方について示したものである。","比較とは複数の情報を比べることである。分類とは，複数の情報を共通な性質に基づいて分けることである。話や文章を理解したり表現したりするためには，観点を明確にして比較したり分類したりすることで情報を整理することが重要である。","必要な語句とは，情報を集めたり，発信したりする場合に落としてはいけない語句である。それらを書き留めるためには，目的を意識して必要な語句を判断することが必要となる。したがって，話や文章の内容を網羅的に書き出したり，機械的にメモの取り方を覚えたりするのではなく，必要な情報は何かということを念頭に置きながら，落としてはいけない語句を適切に捉え，それらを書き留めることが重要となる。","指導に当たっては，例えば，〔思考力，判断力，表現力等〕の「Ａ話すこと・聞くこと」の⑴アや「Ｂ書くこと」の⑴アなどの材料を集めたり整理したりすることに関する指導事項，「Ａ話すこと・聞くこと」の⑴エや「Ｃ読むこと」の⑴ウなどの構造と内容を把握し精査・解釈することに関する指導事項との関連を図り，指導の効果を高めることが考えられる。","引用とは，本や文章の一節や文，語句などをそのまま抜き出すことである。文章を引用する場合には，必ず，引用する部分をかぎ（「 」）でくくることを併せて指導することが求められる。なお，文章の表現や情報だけに限らず，図表やグラフ，絵や写真なども含むことに留意する必要がある。","出典とは，引用元の書物や典拠などを指す。書物や典拠などのタイトル，著作者，発行年など，読み手が引用元に立ち返ってその内容を確認できるよう出典を示すとともに，引用部分が適切な量になるようにする必要がある。このことは，著作権を尊重し，保護するために必要なことであり，指導に当たっては十分留意することが求められる。","指導に当たっては，例えば，〔思考力，判断力，表現力等〕の「Ｂ書くこと」の⑴「ウ 自分の考えとそれを支える理由や事例との関係を明確にして，書き表し方を工夫すること。」や，「Ｃ読むこと」の⑴「オ 文章を読んで理解したことに基づいて，感想や考えをもつこと。」などとの関連を図り，引用したり出典を示したりできるようにすることが考えられる。","辞書や事典の使い方を理解し使うことは，情報化社会において必要な情報を収集したり，語彙を豊かにしたりするために必要な「知識及び技能」である。辞書の利用については，国語辞典や漢字辞典などの使い方を理解するとともに，必要なときにはいつでも辞書が手元にあり使えるような環境をつくっておくことが重要である。事典の利用については，目的に応じていろいろな種類の事典を選んだり，目次や索引を利用して情報を得たりすることが重要である。","辞書や事典については，調べる学習などにおいて活用できるようにすることが求められ，国語科に限らず，他の教科等の調べる学習や日常生活の中でも積極的に利用できるようにすることが大切である。"],"s":[],"m":[]}},"kokugo-34-K3-ア":{"page":89,"name":"伝統的な言語文化","expl":{"intro":[],"k":["易しい文語調の短歌や俳句の音読や暗唱を通して，言葉の響きやリズムに親しむことを示している。","短歌の五・七・五・七・七の三十一音，俳句の五・七・五の十七音のリズムから国語の美しい響きを感じ取りながら音読したり暗唱したりして，文語の調子に親しむ態度を育成するようにすることが重要である。","易しいとは，意味内容が容易に理解できるということである。文語調とは，日常の話し言葉とは異なった特色をもつ言語体系で書かれた文章の調子のことである。文語調の短歌や俳句では，歴史的仮名遣いや古典の語句などが用いられている。教材としては，響きやリズムを体感できるような作品や親しみやすい作者の作品を選んだり，代表的な歌集などから内容の理解しやすい歌を選んだりすることが考えられる。また，各地域に縁のある歌人や俳人，地域の景色を詠んだ歌や句を教材にすることで，地域の文化を理解することができるようにすることなども考えられる。"],"s":[],"m":[]}},"kokugo-34-K3-イ":{"page":89,"name":"伝統的な言語文化","expl":{"intro":[],"k":["長い間使われてきたことわざや慣用句，故事成語などの意味を知り，日常生活でも使うようにすることに関する内容を示している。","ことわざは，生活経験などにおいてありがちなことを述べたり，教訓を述べたりするものである。例えば，「塵も積もれば山となる」，「善は急げ」，「石橋をたたいて渡る」などがある。慣用句は，「水に流す」，「羽を伸ばす」などのように，二つ以上の語が結び付いて元の意味とは違った特定の意味を表すものである。故事成語は，「矛盾」，「推敲」，「五十歩百歩」などのように中国の故事に由来する熟語である。これらによって，先人の知恵や教訓，機知に触れることができる。これらの言葉の意味を知り，日常生活で用いるようにすることが大切である。"],"s":[],"m":[]}},"kokugo-34-K3-ウ":{"page":90,"name":"言葉の由来や変化","expl":{"intro":[],"k":["文字文化に関する内容として，第３学年及び第４学年では，「へん」，「つくり」，「かんむり」，「あし」，「たれ」，「かまえ」，「にょう」などの部首と他の部分とによって漢字が構成されることを知るとともに，実際の漢字についてその構成を理解することを示している。指導に当たっては，漢字のへんやつくりなどから，漢字を調べたり，漢字の字義や読み方を推測したりすることも有効である。"],"s":[],"m":[]}},"kokugo-34-K3-エ":{"page":91,"name":"書写","expl":{"intro":[],"k":["第１学年及び第２学年のウを受けて，書写に関する（ア），（イ），（ウ）の事項を理解し使うことを示している。","（ア） 文字の組立て方を理解し，形を整えて書くこと。","第１学年及び第２学年のウ（イ）及び（ウ）を受けて，一つの文字の組立て方を身に付けることを示している。","文字の組立て方とは，点画の組立て方から部首や部分相互の組立て方までを指すが，ここでは主に後者に重点を置いている。組立て方が簡単なものが多かった第１学年及び第２学年の漢字に比べて，第３学年及び第４学年では，組立て方が複雑な漢字が多くなる。そこで，部首と他の部分の組立て方，すなわち左と右，上と下，内と外などの関係において一つの文字が組み立てられるという仕組みを理解することを重視する。このため，「ウ 漢字が，へんやつくりなどから構成されていることについて理解すること。」との関連を図りながら指導することが必要である。","形を整えて書くとは，第１学年及び第２学年で指導した文字のおおよその形（概形）を意識するとともに，一つの文字の構成要素となる部分相互が等間隔であること，左右対称であること，同一方向であることなどを考えて書くことである。（イ） 漢字や仮名の大きさ，配列に注意して書くこと。","語句，文，文章などの文字の集まりにおける漢字や仮名の大きさや配列に注意して書くことを示している。","漢字や仮名の大きさとは，漢字と漢字，漢字と仮名，仮名と仮名との相互のつり合いから生じる相対的な大きさのことである。画数の多い文字ほど大きく書き，画数の少ない文字ほど小さく書くと，並べたときに読みやすい文字列になる。一般的に，仮名は漢字よりも小さく書くとよいと言われるのは，仮名が漢字よりも構成要素が少ないことによるものである。","配列に注意してとは，行の中心や行と行との間，文字と文字との間がそろっているかなど文字列及び複数の文字列に注意してということである。読みやすい文や文章を書くには，一文字一文字を整えることに加え，文字の集まりという面から整えることが重要である。したがって，書き出しの位置を決めること，行の中心に文字の中心をそろえるように書くことなどが求められる。字間，行間，行の中心を扱う配列の学習において，児童は，文や文章など文字数の多い教材で学習することになるため，毛筆を使用する場合は，小筆の使用にも配慮する必要がある。（ウ） 毛筆を使用して点画の書き方への理解を深め，筆圧などに注意して書くこと。第１学年及び第２学年のウ（イ）を受けて，毛筆を使用して点画の書き方への理解を深め，筆圧などに注意しながら書くことを示している。","「横画，縦画，左払い，右払い，折れ，曲がり，そり，点」などの点画の種類や「始筆，送筆，終筆」などの書き方については，第１学年及び第２学年で硬筆等を使用して基礎的な学習をしている。ここでは，点画やその書き方が毛筆を使用する中で定式化してきたという点に着目し，毛筆による学習を通して点画や点画の書き方への理解を一層深めて書けるようにする。","筆圧とは，筆記具から用紙に加わる力のことである。点画には，左右の払いのように筆圧を変化させて書くものや，横画のようにほぼ等しい筆圧で書くものがある。その意味で点画の種類を理解することと呼応しており，点画の書き方と筆圧とを関連付けることを重視する必要がある。例えば，送筆については，筆圧のかけ方に変化が少ない場合（横画，縦画など），徐々に筆圧を弱めていく場合（左払い，右払い，はねの部分など），穂先の位置が移動する場合（折れ，曲がり，そりなど）などがある。終筆については，止めの形で終わる場合（横画，縦画など），払いの形で終わる場合（左払い，右払いなど），はねの形で終わる場合（そり，曲がり，縦画など）などがある。なお，筆圧は，筆記具を握る力と連動することが多いので，第１学年及び第２学年の「姿勢や筆記具の持ち方」に関する事項ウ（ア）との関連を図りながら指導を進める配慮も必要である。"],"s":[],"m":[]}},"kokugo-34-K3-オ":{"page":92,"name":"読書","expl":{"intro":[],"k":["第１学年及び第２学年のエを受けて，幅広く読書に親しみ，読書が知識や情報を得ることに役立つことに気付くことを示している。","幅広く読書に親しむとは，多様な本や文章があることを知り，読書する本や文章の種類，分野，活用の仕方など，自分の読書の幅を広げていくことである。読書が，必要な知識や情報を得ることに役立つことに気付くためには，読書によって，疑問に思っていたことが解決したり，新しい世界に触れて自分の興味が広がったりする楽しさを味わうことが大切である。","また，読書によって知識や情報を得るための基盤として，学校図書館などの施設の利用方法や，必要な本などの選び方を身に付けることも大切である。","2 〔思考力，判断力，表現力等〕"],"s":[],"m":[]}},"kokugo-34-A-ア":{"page":95,"name":"話題の設定，情報の収集，内容の検討","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のアを受けて，目的を意識して，話題を決め，集めた材料を整理し，伝え合うために必要な事柄を選ぶことを示している。","話題の設定については，学校や家庭，地域のことなど，児童が日常生活の中で興味や関心をもっていることから話題を決めることを求めている。情報の収集については，第１学年及び第２学年では身近なことや経験したことの想起が中心であるが，第３学年及び第４学年では必要に応じて，本や文章を読んだり，人に聞いたりしながら調べることへと広がっていく。","目的としては，説明や報告をする，知りたいことを聞く，互いの考えを伝え合うことなどが考えられる。目的を意識することは，「話題の設定，情報の収集，内容の検討」だけでなく，話すこと，聞くこと，話し合うことのそれぞれの学習過程において必要となる。したがって，アの指導事項はイ，ウ，エ，オの指導事項と密接な関わりがある。","比較したり分類したりするとは，集めた材料を，共通点や相違点に着目しながら比べたり，共通する性質に基づいて分けたりすることである。第１学年及び第２学年の「伝え合うために必要な事柄を選ぶこと」を発展させ，集めたことが話したり聞いたり話し合ったりする目的に合っているかどうかを意識しながら確かめ，より適切なものを見付けていくことが求められる。"],"m":[]}},"kokugo-34-A-イ":{"page":95,"name":"構成の検討，考えの形成（話すこと）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のイを受けて，話の中心的な部分が明確になるように構成を考えることを示している。第３学年及び第４学年においては，具体的な相手や目的を一層強く意識して，話の中心が明確になるように理由や事例などを挙げ，筋道を立てた構成にすることに重点を置いている。","相手に伝わるように，理由や事例などを挙げるとは，伝えたいことがよく伝わるよう，相手のことを踏まえて理由や事例を選んでいくことである。例えば，相手が知らないことについては丁寧に理由付けをしたり，相手にとって理解しやすい事例を挙げたりすることが求められる。","話の中心が明確になるよう話の構成を考えるとは，自分の伝えたいことの中心が聞き手に分かりやすくなるよう話の構成を考えることである。話の中心は，話す目的と密接に関連して決まってくる。話し手はその中心を明確にし，話す内容を構成することが求められる。例えば，冒頭で話の中心を述べ，そのことに合わせた理由や事例などを挙げたり，最初に提示した内容と結論とがずれないようにしたりすることなどが重要である。"],"m":[]}},"kokugo-34-A-ウ":{"page":96,"name":"表現，共有（話すこと）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のウを受けて，表現を工夫することを示している。第３学年及び第４学年においては，話の中心的な部分を聞き手に分かりやすく伝えたり，場面を意識して話したりするために，言葉の抑揚や強弱，間の取り方，相手を見る視線など，表現を工夫することに重点を置いている。","話の中心や話す場面を意識して話すとは，話の中心を明確に捉えて話すとともに，相手との親疎やその人数，目的や場の状況などを意識し，声の出し方や言葉遣い，視線などに気を付けて話すことである。","言葉の抑揚や強弱，間の取り方などを工夫することは，話の中心や話す場面を意識して話す際の話し方として示しているものである。例えば，話の中心的な部分において自分の感じたことを強く伝えるために，抑揚を意識して話したり，多人数の聞き手に伝えたいことを伝えるために，声を張って話したりするなど，話の中心や話す場面を意識して話し方を工夫することが重要である。","また，言葉の抑揚や強弱，間の取り方などを工夫するためには，〔知識及び技能〕の⑴「イ 相手を見て話したり聞いたりするとともに，言葉の抑揚や強弱，間の取り方などに注意して話すこと。」との関連を図ることが有効である。さらに，場面や相手を意識して話すためには，例えば，〔知識及び技能〕の⑴「キ丁寧な言葉を使うとともに，敬体と常体との違いに注意しながら書くこと。」における言葉遣いに関する内容との関連を図り，指導の効果を高めることが考えられる。","指導に当たっては，様々な場面で話すことを通して，繰り返し表現の工夫を行う場を設けることが有効である。また，自分や友達の発表の様子を録画し，観点に沿って振り返るなど，ICT機器を活用することも効果的である。"],"m":[]}},"kokugo-34-A-エ":{"page":97,"name":"構造と内容の把握，精査・解釈，考えの形成，共有（聞くこと）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のエを受けて，話の中心を捉え，自分の考えをもつことを示している。第３学年及び第４学年においては，記録したり質問したりしながら聞くことや，話し手が伝えたいことや自分が聞きたいことの中心を捉え，自分の考えをもつことに重点を置いている。","必要なことを記録したり質問したりしながら聞くとは，目的に応じて必要な内容を記録したり，聞いた事柄を基に分からない点や確かめたい点を質問したりすることである。必要な内容を記録するためには，重要な語句は何か判断しながら聞いたり，聞いた後に話の内容を振り返ったりすることが大切である。","話の中心を捉えることには，話し手が伝えたいことの中心を捉えることと，自分が聞きたいことの中心を明確にして聞くこととの二つの側面がある。","話し手が伝えたいことの中心を捉えるためには，話の内容や話し方に関心をもち，事柄の順序など，話の組立て方を意識しながら，話の要点を聞くことが重要である。また，自分が聞きたいことの中心を明確にして聞くためには，どのような目的で聞くのか，自分が聞いたことは何かなどをよく確かめて聞くことが重要である。","自分の考えをもつためには，話の内容を予想して聞いたり，聞いた内容と自分が知っていることとを比べたりすることなどが有効である。また，記録したことや質問したことが十分なものだったかどうかは，聞いたことを基に自分の考えをまとめたり，それを表現したりする際に確認することができる。したがって，聞いたことを発表する機会などを設けることにより，指導の効果を高めることが考えられる。"],"m":[]}},"kokugo-34-A-オ":{"page":98,"name":"話合いの進め方の検討，考えの形成，共有（話し合うこと）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のオを受けて，目的や進め方を確認して話し合い，考えをまとめることを示している。第３学年及び第４学年においては，話し合って考えをまとめるために，司会などの役割を果たしながら，互いの意見の共通点や相違点に着目することに重点を置いている。","目的や進め方を確認して話し合うとは，話合いの目的や目指す到達点，そこに向かう話合いの進め方などを確認して，話し合う目的や必要性を意識して話合いを進めることである。司会の役割とは，話合いがまとまるように進行していくことである。最初は準備した進行表に沿って進行することそのものを学び，徐々に，話合いが目的に応じて適切に進行するように，参加者に発言を促したり，発言の共通点や相違点を確認したり，話し合った内容をまとめたりすることができるようにすることが求められる。","司会者，提案者，参加者などは，それぞれの役割を理解し，話題に沿って発言しているか，その発言は話合いの流れを踏まえているかなどの観点に基づいて適時判断しながら話合いを進めるようにすることが重要である。考えが，最終的に一つにまとまらない場合にも，どのような意見が出されたか，どのような点で考えが異なっているか，今後どのように話合いを進めていくとよいかなどを確認することが求められる。","互いの意見の共通点や相違点に着目して，考えをまとめるとは，互いの意見の共通点や相違点に着目し，一つの結論を出したり，話し合われたことに対する自分の考えをまとめたりすることである。互いの意見を比較し，考えが相違するときには，それぞれの考えがどのようなことに基づいているのかといったことにも目を向けることが重要である。"],"m":[]}},"kokugo-34-A-2":{"page":99,"name":"言語活動例","expl":{"intro":[],"k":[],"s":["ア　説明や報告など調べたことを話したり，それらを聞いたりする活動。","調べたことを話したり，それらを聞いたりする言語活動を例示している。","説明や報告など調べたことを話すとは，例えば，各教科等で行う観察や実験，調査などの経過や結論などをまとめて，聞き手に分かりやすく伝えたり発表したりすることである。","また，それらを聞いたりするとは，必要なことを記録したり質問したりしながら聞き，話の内容を捉えることである。","イ　質問するなどして情報を集めたり，それらを発表したりする活動。","質問するなどして情報を集めたり，それらを発表したりする言語活動を例示している。","情報を集めるために質問するとは，事前に自分が知りたいことを考え，尋ねることである。そのようにして集めた情報について，話したり書いたりして発表する活動についても例示している。","ウ　互いの考えを伝えるなどして，グループや学級全体で話し合う活動。","互いの考えを伝えるなどして話し合う言語活動を例示している。","話合いには，結論を一つにまとめることに重点を置くものや，それぞれの参加者の考えを明確にしたり広げたりすることに重点を置くものなどがある。","多人数での話合いは，少人数での話合いに比べ，話し手と聞き手との間に一定の距離があるため，改まった言葉遣いをするなどの配慮が必要である。","また，一人一人が発言する機会が少ないため，話合いの進め方や司会の役割が重要となる。このため，話合いをする際には，児童一人一人が，司会などの様々な役割を経験できるようにすることが重要である。","話し合う言語活動は，他教科等においても取り入れられることが多いため，それらの活動との連携が求められる。"],"m":[]}},"kokugo-34-B-ア":{"page":102,"name":"題材の設定，情報の収集，内容の検討","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のアを受けて，相手や目的を意識して，書くことを選び，集めた材料を整理し，伝えたいことを明確にすることを示している。第３学年及び第４学年では，集めた材料を比較したり分類したりして整理することに重点を置いている。","相手や目的を意識してとは，題材を設定したり情報を収集したりする際に，不特定多数の人に対して文章を書くのか，特定の人に対して文章を書くのか，何のために書くのか，読み手はどのようなことを知りたいのかなど，文章を書く相手や目的を念頭に置くことである。相手や目的を意識することは，「題材の設定，情報の収集，内容の検討」の過程だけでなく，「考えの形成，記述」，「推敲」などの過程においても重要なものとなる。したがって，アの指導事項はイ，ウ，エ，オの指導事項と密接な関わりがある。","材料とは，伝え合う内容を構成する体験や，本や文章を調べたり聞いたりすることによって得た情報のことであり，書く内容を考える際の素材となるものである。集めた材料を比較したり分類したりするとは，集めた材料を，共通点や相違点に着目しながら比べたり，共通する性質に基づいて分けたりして，伝えたいことが明確になるように書く材料を整理することである。例えば，同じような材料を比較して，どちらが自分の書きたい事柄に合っているかを考えたり，読み手が理解しやすいように，事柄ごとに材料を分類したりすることが考えられる。こうした整理を通して，伝えたいことを明確にすることが重要である。"],"m":[]}},"kokugo-34-B-イ":{"page":102,"name":"構成の検討","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のイを受けて，書く内容の中心を明確にし，文章の構成を考えることを示している。","書く内容の中心を明確にするとは，文章の構成を考えるに当たり，書こうとしている材料の中から，中心に述べたいことを一つに絞ることである。このことによって，中心となる事柄や，それに関わる他の書きたい事柄が明らかになる。それを基に内容のまとまりで段落をつくるのである。段落には，改行によって示されるいくつかの文のまとまりである形式段落と，その形式段落のいくつかが意味のつながりの上でひとまとまりになった意味段落とがある。段落は，そのような文章を構成する単位としての役割をもっている。","段落相互の関係に注意して文章の構成を考えるとは，書く文章の種類や特徴を踏まえ，段落と段落との関係に気を付けて文章の構成を考えることである。段落相互の関係としては，例えば，考えとそれを支える理由や，考えとそれを具体的に述べる事例といった関係，列挙された事例同士の関係などがある。書く内容の中心を明確にした上でこうした関係に注意し，文章の構成を考えることが重要である。また，「冒頭部−展開部−終結部」などの文章の展開や文章の種類に応じて，それぞれの部分に何を書くのか，それらがどのようにつながるのかを強く意識して，自分の考えが明確になるように工夫することも重要である。"],"m":[]}},"kokugo-34-B-ウ":{"page":104,"name":"考えの形成，記述","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のウを受けて，自分の考えなどが明確になるよう書き表し方を工夫することを示している。第３学年及び第４学年においては，自分の考えとそれを支える理由や事例といった関係性が明確になるように記述することに重点を置いている。","考えを支える理由を記述する際には，「なぜなら〜」，「その理由は〜」，「〜ためである」など，理由を示すことを明確にする表現を用いることができるようにすることが求められる。","事例とは，書き手の考えをより具体的に説明するために挙げられた事柄や内容のことである。考えを支える事例を記述する際には，「例えば〜」，「事例を挙げると〜」，「〜などがそれに当たる」などの表現を用いることができるようにすることが求められる。","また，例えば，〔知識及び技能〕の⑴「キ 丁寧な言葉を使うとともに，敬体と常体との違いに注意しながら書くこと。」における，相手や目的に応じて敬体と常体とを意識的に使い分けることや，書いていくときに「だ」，「である」，「です」，「ます」などの文末表現に注意して書くことの指導との関連を図ることも有効である。"],"m":[]}},"kokugo-34-B-エ":{"page":104,"name":"推敲","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のエを受けて，文や文章を整えることを示している。第３学年及び第４学年では，間違いを正すとともに，ア，イ，ウの指導事項に示す内容に基づいて，相手や目的を意識した表現になっているかを確かめることに重点を置いている。","間違いを正す際には，主語と述語，修飾語と被修飾語の関係の明確さ，長音，拗音，促音，撥音，助詞などの表記の仕方のほかに，敬体と常体，断定や推量，疑問などの文末表現の使い方などに注意することが求められる。","相手や目的を意識した表現になっているかを確かめるとは，書く相手や目的に照らして，構成や書き表し方が適切なものとなっているかを確かめることである。例えば，相手の立場や年齢，相手との関係に応じた文末表現になっているか，書こうとすることについて相手のもっている知識や関心に応じた構成や書き表し方になっているか，書く目的に応じた文末表現になっているかなどについて見直すことが重要である。","なお，指導に当たっては，児童自身が間違いなどを正したり，よりよい表現に書き直したりすることによって整った文章になることが実感できるように，例えば，下書きと推敲後の文章を比べるなどの工夫をすることが考えられる。"],"m":[]}},"kokugo-34-B-オ":{"page":105,"name":"共有","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のオを受けて，感想や意見を伝え合い，自分の文章のよいところを見付けることを示している。第３学年及び第４学年においては，書こうとしたことが明確になっているかなどの観点から，自分の文章のよいところを見付けることに重点を置いている。","文章に対する感想や意見を伝え合うとは，互いの書いた文章を読み合ったり音読し合ったりして，その内容や表現について，感想や意見を述べ合うことである。その際，書き手が書こうとしたことが明確に表現されているところを見付けることなどが重要である。そのためには，例えば，書き終えた文章に加えて，「題材の設定」，「情報の収集」，「内容の検討」，「構成の検討」など，学習過程の各段階のメモなどについても共有することで，書く目的などを確認し合えるようにすることも考えられる。","自分の文章のよいところを見付ける際には，記述した内容以外にも，相手について配慮したことや，記述の仕方などで工夫したこと，なぜそのような考えに至ったのかについてのきっかけなどを共有することも大切である。"],"m":[]}},"kokugo-34-B-2":{"page":106,"name":"言語活動例","expl":{"intro":[],"k":[],"s":["ア　調べたことをまとめて報告するなど，事実やそれを基に考えたことを書く活動。","事実やそれを基に考えたことを文章に書く言語活動を例示している。","調べたことをまとめて報告する文章を書く際には，報告する文章の特徴に基づいて書くこととなる。例えば，調査を報告する文章では，調査の目的や方法，調査の結果とそこから考えたことなどを明確に書くことになる。","事実やそれを基に考えたことを書くとは，自分の考えと，それを支える理由や事例としての事実との関係を明確にして書くことである。","このようにして書かれた文章については，例えば，学級新聞や小冊子，リーフレットなど，日常生活で目にする形式にまとめることも考えられる。","イ　行事の案内やお礼の文章を書くなど，伝えたいことを手紙に書く活動。","実用的な文章としての手紙を書く言語活動を例示している。","例えば，学校行事について案内する文章や，地域の活動などでお世話になった方々へのお礼の手紙を書く活動が考えられる。","行事を案内する文章を書く際には，行事名，日時，場所，内容などのほか，参加してほしいといったお願いなど，必要な情報を漏れなく書く必要がある。お礼の手紙を書く際には，表書きの住所や宛て名を正しく書くことや，後付けにおける署名や宛て名の位置関係といった基本的な形式などを押さえることが必要である。各教科等の学習や学校の教育活動全体との関連を図り，実際に書いて伝えたり，反応を受け取ったりすることができるよう工夫することが有効である。","ウ　詩や物語をつくるなど，感じたことや想像したことを書く活動。","感じたことや想像したことを書く言語活動を例示している。","詩をつくる際には，凝縮した表現であること，普通の文章とは違った改行形式や連による構成になっていることなどの基本的な特徴を踏まえて，感じたことや想像したことを書くこととなる。また，作家の創作による物語は，主人公やその他の登場人物がそれぞれの役割をもっていたり，冒頭部に状況や登場人物が設定され，事件とその解決が繰り返され発端から結末へと至る展開によって構成されていたりするなどの工夫がなされている。児童が物語をつくる際には，このような工夫を参考にすることも考えられる。"],"m":[]}},"kokugo-34-C-ア":{"page":108,"name":"構造と内容の把握（説明的な文章）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のアを受けて，段落相互の関係に着目しながら，文章の構造や内容を把握することを示している。","段落相互の関係とは，考えとその事例，結論とその理由といった関係などのことである。これらの関係に着目しながら，書き手の考えがどのような理由によって説明されているのか，どのような事例によって具体化されているのかなどを，叙述を基に正確に捉えていくことが求められる。なお，事例とは，書き手の考えを具体的に説明するために挙げられた事柄や内容のことである。","指導に当たっては，例えば，〔知識及び技能〕の⑴「カ 主語と述語との関係，修飾と被修飾との関係，指示する語句と接続する語句の役割，段落の役割について理解すること。」との関連を図り，指導の効果を高めることが考えられる。"],"m":[]}},"kokugo-34-C-イ":{"page":109,"name":"構造と内容の把握（文学的な文章）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のイを受けて，物語全体の登場人物の行動や気持ちを捉えることを示している。","登場人物の行動の背景には，そのときの，あるいはその行動に至るまでの気持ちがある場合が多い。そうした登場人物の気持ちを，行動や会話，地の文などの叙述を基に捉えていくことが求められる。","行動や気持ちなどを捉える際には，登場人物の境遇や性格なども重要な要素になる。物語全体を見通して，複数の叙述を基に行動や気持ちなどを捉えることが重要である。","また，登場人物の行動や気持ちを捉えることは，文章を精査・解釈することや自分の考えを形成することなどにつながるものである。"],"m":[]}},"kokugo-34-C-ウ":{"page":110,"name":"精査・解釈（説明的な文章）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のウを受けて，目的を意識して，アの指導事項で捉えた文章の構造や内容を基に，必要な情報を見付けて要約することを示している。要約するとは，文章全体の内容を正確に把握した上で，元の文章の構成や表現をそのまま生かしたり自分の言葉を用いたりして，文章の内容を短くまとめることである。文章の内容を端的に説明するといった要約する目的を意識して，内容の中心となる語や文を選んで，要約の分量などを考えて要約することが重要である。なお，この指導事項で示す内容は，文学的な文章においてあらすじを捉える際などにも必要となる「思考力，判断力，表現力等」である。"],"m":[]}},"kokugo-34-C-エ":{"page":110,"name":"精査・解釈（文学的な文章）","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のエを受けて，イの指導事項で捉えた内容を基に，登場人物の気持ちの変化や性格，情景について，場面の移り変わりと結び付けながら具体的に思い描き，その世界を豊かに想像することに重点を置いている。","登場人物の気持ちの変化について，場面の移り変わりと結び付けて具体的に想像するとは，場面の移り変わりとともに描かれる登場人物の気持ちが，どのように変化しているのかを具体的に思い描くことである。登場人物の気持ちは，場面の移り変わりの中で揺れ動いて描かれることが多い。そのため，複数の場面の叙述を結び付けながら，気持ちの変化を見いだして想像していく必要がある。また，どの叙述とどの叙述とを結び付けるかによっても変化やそのきっかけの捉え方が異なり，多様に想像を広げて読むことができる。","登場人物の性格は，複数の場面に共通して一貫して描かれる場合と，多面的に描かれる場合とがある。いずれの場合も，場面の移り変わりと結び付けて具体的に想像するためには，それぞれの登場人物の境遇や状況を把握し，物語全体に描かれた行動や会話に関わる複数の叙述を結び付けて読むことが重要である。一つの叙述だけではなく，複数の叙述を根拠にすることで，より具体的に登場人物の性格を思い描くことができる。","情景には，登場人物の気持ちが表されていることが多い。情景について具体的に想像する際には，場面の移り変わりとともに変化していく登場人物の気持ちと併せて考えていくことが重要である。"],"m":[]}},"kokugo-34-C-オ":{"page":111,"name":"考えの形成","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のオを受けて，文章を読んで感想や考えをもつことを示している。第３学年及び第４学年においては，文章の内容だけではなく理解したことに基づいて，感想や考えをもつことに重点を置いている。","文章を読んで理解したことに基づくとは，文章の内容や構造を捉え，精査・解釈しながら考えたり理解したりしたことを基にするということである。また，感想や考えをもつとは，文章を読んで理解したことについて，自分の体験や既習の内容と結び付けて自分の考えを形成することである。ここには，疑問点や更に知りたい点などを見いだすことも含まれる。","なお，感想や考えをもつことは，自分が文章をどのように捉え，理解したのかを改めて確かめることにもつながる。「構造と内容の把握」，「精査・解釈」に関する指導事項とも関連を図ることが重要である。"],"m":[]}},"kokugo-34-C-カ":{"page":112,"name":"共有","expl":{"intro":[],"k":[],"s":["第１学年及び第２学年のカを受けて，考えを共有したり，互いの感じ方などの違いに気付いたりすることを示している。","文章を読んで感じたことや考えたこととは，文章の構造と内容を把握し，精査・解釈することを通して，感想をもったり考えたりしたことである。これらの感想や考えは，同じ文章を読んでも文章のどこに着目するか，どのような思考や感情，経験と結び付けて読むかによって，一人一人に違いが出てくる。","これを共有し，一人一人の感じ方などに違いがあることに気付くとは，同じ文章を読んでも，一人一人の感じ方などに違いがあることに気付くとともに，互いの感じたことや考えたことを理解し，他者の感じ方などのよさに気付くことが大切である。"],"m":[]}},"kokugo-34-C-2":{"page":113,"name":"言語活動例","expl":{"intro":[],"k":[],"s":["ア　記録や報告などの文章を読み，文章の一部を引用して，分かったことや考えたことを説明したり，意見を述べたりする活動。","説明的な文章を読み，分かったことや考えたことを，本文を引用しながら説明したり意見を述べたりする言語活動を例示している。","例えば，自分の考えを支える理由や事例である本文の一部を引用することで，相手に分かるように自分の考えを説明したり意見を述べたりすることを取り上げている。","取り上げる文章としては，記録や報告の文章のほか，対象について観察したことや調べたことを説明した文章，事物を解説した文章などが考えられる。","小学校第３学年及び第４学年においては，説明する内容や意見を明確にもつことができるように，意図的，計画的に様々な内容の文章と出合わせる工夫も必要である。","イ　詩や物語などを読み，内容を説明したり，考えたことなどを伝え合ったりする活動。","文学的な文章を読んで，その内容を説明したり，読んで考えたことなどを伝え合ったりする言語活動を例示している。","取り上げる文章としては，詩や物語などが考えられる。","内容を説明したり，考えたことなどを伝え合ったりするとは，例えば，物語のあらすじや登場人物の行動や気持ちなどを説明したり，それらを基に考えたことや具体的に想像したことなどを文章にまとめたり発表したりすることである。","ウ　学校図書館などを利用し，事典や図鑑などから情報を得て，分かったことなどをまとめて説明する活動。","事典や図鑑などを読み，分かったことなどをまとめて説明する言語活動を例示している。","事典は，語義などの説明を中心とする辞書とは異なり，事物や事柄について解説したもので，百科事典などがある。","分かったことなどをまとめて説明するとは，何が分かったのか，なぜ疑問に思ったのか，どこを更に調べたいのかなどについてまとめ，話したり書いたりすることである。","学校図書館や地域の図書館などを利用し，こうした言語活動を行うことは，各教科等の学習において調べる活動を行う際の基盤になるものである。学校図書館や地域の図書館などの利用にあたっては，「第３ 指導計画の作成と内容の取扱い」の２⑶を踏まえ，施設の利用方法や本の配架場所などを指導することが必要である。"],"m":[]}},"kokugo-56-K1-ア":{"page":116,"name":"言葉の働き","expl":{"intro":[],"k":["第３学年及び第４学年のアを受けて，日常的に用いている言葉には，人間関係を構築する働きがあるということに気付くことを示している。","この指導事項は，言葉が果たす他者との良好な関係をつくる働きや特徴に気付くために，今回の改訂で新設したものである。挨拶などの日常会話において見られるように，言葉には，話し手と聞き手（送り手と受け手）の間に好ましい関係を築き，継続させる働きがある。このような言葉の働きに気付かせることが，中学校第２学年の「相手の行動を促す働きがあることに気付くこと」へと発展していく。","この指導事項は〔知識及び技能〕や〔思考力，判断力，表現力等〕に示す様々な内容に関連するが，例えば，〔知識及び技能〕の⑴オの「語感や言葉の使い方に対する感覚を意識して，語や語句を使うこと」との関連を図り，指導の効果を高めることが考えられる。"],"s":[],"m":[]}},"kokugo-56-K1-イ":{"page":117,"name":"話し言葉と書き言葉","expl":{"intro":[],"k":["第１学年から第４学年までの，話し言葉と書き言葉に関する事項を発展させ，話し言葉と書き言葉，それぞれの特色や役割に気付くことを示している。","音声は，発せられた途端に消えていくので，話し言葉はそのままでは遡って内容を確認することができない。このことによって，複雑な構文や誤解されやすい同音異義語を避けるなど，様々な表現上の特質が生まれる。聞き手や場面の状況の影響を強く受けながら表現及び理解が進められるという特質もある。","書き言葉については，読み手が文や文章を繰り返し確認することができる。使用される語彙や，文及び文章の構造なども話し言葉と違いがある。また，意味の違いを漢字の使い分けで表すこともできる。","それぞれの特質に配慮した使い分けを身に付けるための基礎を養うことが大切である。こうした両者の違いについて気付かせることは，オの「語感や言葉の使い方に対する感覚を意識して，語や語句を使うこと」との関連が深い。"],"s":[],"m":[]}},"kokugo-56-K1-ウ":{"page":117,"name":"話し言葉と書き言葉","expl":{"intro":[],"k":["第３学年及び第４学年のウを受けて，文や文章の中で漢字や仮名を適切に使い分けたり，送り仮名や仮名遣いに注意して正しく書いたりすることを示している。漢字と仮名を適切に使い分けるとは，「漢字仮名交じり文」という日本語の表記の仕方を踏まえ，文や文章の読みやすさや意味の通りやすさを考えて，漢字と仮名を適切に使い分けることである。その際，漢字の表意文字としての特徴と，仮名の表音文字としての特徴に気付いて使い分けることが大切になる。","送り仮名や仮名遣いについては，第３学年及び第４学年の内容を発展させ，文や文章の中で正しく書くことを求めている。オの「語句の構成」について理解することと関連付けることが効果的である。","仮名遣いについては，例えば，「鼻血（はなぢ）」と「地面（じめん）」，「みずうみ（湖）」と「みかづき（三日月）」などの区別を付けるなどして，正しく表記できるようにすることを求めている。その際，「送り仮名の付け方」（昭和48年内閣告示）や，「現代仮名遣い」（昭和61年内閣告示）の内容を十分に踏まえ，児童の仮名遣いの実態などと関連を図ることが重要である。"],"s":[],"m":[]}},"kokugo-56-K1-エ":{"page":118,"name":"漢字","expl":{"intro":[],"k":["第５学年及び第６学年においては，漢字を読むことについて，学年別漢字配当表の当該学年までに配当されている漢字を読むことを示している。また，漢字を書くことについては，当該学年の前の学年に配当されている漢字を書き，文や文章の中で使おうとする習慣を身に付けるようにするとともに，当該学年に配当されている漢字を漸次書き，文や文章の中で使うようにすることを示している。第５学年及び第６学年は，漢字による熟語などの語句の使用が一層増加する時期である。したがって，文や文章を書く際には，例えば，「収める」，「納める」，「修める」，「治める」などの同音異義語に注意するなど，漢字のもつ意味を考えて使う習慣が身に付くようにすることが重要である。"],"s":[],"m":[]}},"kokugo-56-K1-オ":{"page":119,"name":"語彙","expl":{"intro":[],"k":["第３学年及び第４学年のオを受けて，思考に関わる語句の量を増したり，語句と語句との関係，語句の構成や変化について理解したりすることを通して語彙を豊かにすることや，語感を磨くことを示している。","思考に関わる語句とは，「しかし」のように情報と情報との関係を表す語句，「要するに」のように情報全体の中でその情報がどのような位置付けにあるのかを示唆する語句，「考える」，「だろう」のように文の中の述部などとして表れる思考そのものに関わる語句などを指す。また，「〜は〜より…」，「〜は〜に比べて…」のように複数の情報を比べる場合や，「〜が〜すると…」，「〜になった原因を考えてみると…」のように原因と結果の関係について述べる場合の言い方なども含まれる。これらの語句を，話や文章の中で使うことができるようにすることが重要である。","語句と語句との関係には，類義語や対義語，上位語・下位語などがある。このような語句と語句との関係を理解することは，語感を高めたり，言葉の使い方に対する感覚を豊かにしたりすることにもつながる。話や文章の中で，結び付きの強い語句同士が相互に関連し合い，文章の種類や内容を特徴付けている場合があることに気付くことも重要である。","語句の構成については，お米の「お」のような接頭語，お父さんの「さん」のような接尾語のほかに，複合語，略語，慣用語なども含んでいる。語句の変化については，例えば，「花＋畑」で「ハナバタケ」というような音の変化，「帰る＋道」で「帰り道」というような語形の変化などがある。","語彙を豊かにするとは，自分の語彙を量と質の両面から充実させることである。具体的には，意味を理解している語句の数を増やすだけでなく，話や文章の中で使いこなせる語句を増やすとともに，語句と語句との関係，語句の構成や変化などへの理解を通して，語句の意味や使い方に対する認識を深め，語彙の質を高めることである。","語感や言葉の使い方に対する感覚とは，言葉や文，文章について，その正しさや適切さを判断したり，美しさ，柔らかさ，リズムなどを感じ取ったりする感覚のことである。","こうしたことを意識して，語や語句を使うためには，多くの文章を繰り返し読んで優れた表現に触れたり，自分の表現に生かしたりして，語感や言葉の使い方に関する感覚を養うことが重要である。"],"s":[],"m":[]}},"kokugo-56-K1-カ":{"page":120,"name":"文や文章","expl":{"intro":[],"k":["第３学年及び第４学年のカを受けて，語句の係り方や語順，文と文との接続，話や文章の構成や展開，種類について理解することを示している。","文の中での語句の係り方とは，主語と述語との関係，修飾と被修飾との関係に加え，文の書き出しと文末表現の関係などを含めた文の中の語句と語句との係り受けのことを指している。このうち，主語と述語との関係に着目して文の構成をみると，単文・重文・複文に分けることができる。","語順について理解するとは，述語が文末に位置することが多かったり，文の成分の順序が比較的柔軟であったりする日本語の語順の特徴を理解することを指している。なお，外国語科においては，第２の３⑵ウに「（ア）児童が日本語と英語との語順等の違いや，関連のある文や文構造のまとまりを認識できるようにするために，効果的な指導ができるよう工夫すること。」を示している。このことを踏まえ，指導に当たっては，外国語科における指導との関連を図り，相互に指導の効果を高めることが重要である。","文と文との接続の関係とは，前の文と後の文とのつながりのことである。どのようにつながるのかを明示する語句として，接続語などの接続する語句がある。文と文との関係を捉え，接続する語句を適切に選択することが重要である。なお，文と文は接続する語句によってのみつなげられるのではない。語句の係り方や語順が適切であることはもちろんのこと，書き出しや文末の言い回し，説明や描写のための語句の選択など様々な要因が関わっていることを理解し，適切に文と文とをつなげることができるようにすることが重要である。","話や文章の構成や展開とは，「始め−中−終わり」，「序論−本論−結論」や頭括型，尾括型，双括型などの，話や文章の組立てや説明などにおける論の進め方のことである。","話や文章の種類とその特徴とは，紹介，提案，推薦，案内，解説，物語など，日常生活で児童が触れることの多い話や文章の種類とその特徴のことである。例えば，提案は，その内容が実現可能で具体的なものであることが求められる。また，推薦は，目的に応じて固有のよさを捉えるなどして，推薦する理由を明確にすることが求められる。"],"s":[],"m":[]}},"kokugo-56-K1-キ":{"page":121,"name":"言葉遣い","expl":{"intro":[],"k":["第３学年及び第４学年のキを受けて，日常よく使われる敬語を理解して使い慣れることを示している。","相手と自分との関係を意識しながら，尊敬語や謙譲語などの敬語について理解することが重要である。","敬語の役割や必要性を自覚してくる時期であるので，児童の日常生活の中で相手や場面に応じて適切に敬語を使うことに慣れるようにすることが重要である。例えば，初対面の相手や目上の相手などに対し，「いらっしゃる」，「おっしゃる」，「お帰りになる」などの敬語を使うことができるよう，学校行事や来客があった時などと関連させて指導することも考えられる。"],"s":[],"m":[]}},"kokugo-56-K1-ク":{"page":122,"name":"表現の技法","expl":{"intro":[],"k":["表現の工夫とは，比喩や反復など修辞法に関する表現の工夫のことである。比喩とは，あるものを別のものにたとえて表現することである。「まるで〜のようだ」などのようにたとえであることを示す語句を伴う直喩や，そのような語句を用いない隠喩などがある。反復とは，同一又は類似した表現を繰り返すことである。連続したり間を置いたりして繰り返すなど様々な場合がある。表現の工夫には，比喩や反復，倒置など様々なものがある。","これらの表現の工夫は，第１学年及び第２学年の児童が読んだり書いたりする文章中にも頻繁に見られる。第５学年及び第６学年においては，これまでに触れてきたこうした表現の工夫への気付きをまとめて整理することが求められる。このことが，中学校第１学年の〔知識及び技能〕の⑴「オ 比喩，反復，倒置，体言止めなどの表現の技法を理解し使うこと。」の指導へと発展していく。"],"s":[],"m":[]}},"kokugo-56-K1-ケ":{"page":123,"name":"音読，朗読","expl":{"intro":[],"k":["第５学年及び第６学年においては，文章の構成や内容を理解して音声化することに加え，自分の思いや考えが聞き手に伝わるように音読や朗読をすることが求められる。","音読では，これまでに身に付けてきた，声の大きさや抑揚，速さや間の取り方といった音読の技能を生かすことが重要である。","朗読は，読者として自分が思ったことや考えたことを踏まえ，聞き手に伝えようと表現性を高めて，文章を声に出して読むことである。音読が，文章の内容や表現をよく理解し伝えることに重点があるのに対して，朗読は，児童一人一人が思ったり考えたりしたことを，表現性を高めて伝えることに重点がある。","指導に当たっては，例えば，〔思考力，判断力，表現力等〕の「Ｂ書くこと」の「共有」に関する指導事項のカと関わらせたり，「Ｃ読むこと」の「精査・解釈」，「考えの形成」に関する指導事項のウ，エ，オと関わらせたりすることが考えられる。"],"s":[],"m":[]}},"kokugo-56-K2-ア":{"page":124,"name":"情報と情報との関係","expl":{"intro":[],"k":["第３学年及び第４学年のアを受けて，原因と結果の関係などに重点を置いて情報と情報の関係を理解することを示している。","原因とは，ある物事や状態を引き起こすもとになるものを指し，結果とは，ある原因によってもたらされた事柄や状態を指す。原因と結果の関係について理解するためには，例えば，ある事象がどのような原因によって起きたのかを把握したり明らかにしたりするなど，様々な情報の中から原因と結果の関係を見いだし，結び付けて捉えることができるようにすることが重要である。","指導に当たっては，例えば，〔思考力，判断力，表現力等〕の「Ｂ書くこと」の⑴「イ 筋道の通った文章となるように，文章全体の構成や展開を考えること。」や，「Ｃ読むこと」の⑴「ア 事実と感想，意見などとの関係を叙述を基に押さえ，文章全体の構成を捉えて要旨を把握すること。」などとの関連を図り，指導の効果を高めることが考えられる。"],"s":[],"m":[]}},"kokugo-56-K2-イ":{"page":125,"name":"情報の整理","expl":{"intro":[],"k":["第３学年及び第４学年のイを受けて，情報と情報との関係付けの仕方や語句と語句との関係の表し方を理解し使うことを示している。","情報と情報との関係付けの仕方としては，例えば，複雑な事柄などを分解して捉えたり，多様な内容や別々の要素などをまとめたり，類似する点を基にして他のことを類推したり，一定のきまりを基に順序立てて系統化したりすることなどが挙げられる。","図などによる語句と語句との関係の表し方とは，複数の語句を丸や四角で囲んだり，語句と語句を線でつないだりするなど，図示することによって情報を整理することを指している。図示などにより語句と語句との関係を表すことを通して，考えをより明確なものにしたり，思考をまとめたりすることができることを理解することが重要である。","指導に当たっては，例えば，〔思考力，判断力，表現力等〕の「Ａ話すこと・聞くこと」の⑴アやイ，「Ｂ書くこと」の⑴アやイなどの材料を集めて整理したり，構成を検討したりすることに関する指導事項，「Ａ話すこと・聞くこと」の⑴エ，「Ｃ読むこと」の⑴アやウなどの構造と内容を把握し精査・解釈することに関する指導事項との関連を図り，指導の効果を高めることが考えられる。"],"s":[],"m":[]}},"kokugo-56-K3-ア":{"page":127,"name":"伝統的な言語文化","expl":{"intro":[],"k":["古文や漢文，近代以降の文語調の文章の音読を通して，言葉の響きやリズムに親しむことを示している。これらの文章には，独特のリズムや美しい語調が備わっている。音読することなどにより，その美しさや楽しさを感覚的に味わうことを求めている。","親しみやすい古文や漢文，近代以降の文語調の文章とは，児童が，言葉のリズムを実感しながら読めるもの，音読することによって内容の大体を知ることができるような親しみやすい範囲のものを指す。また，唱歌や文語調の校歌，各地域に縁のある作品など，児童にとって親しみやすいものを教材にすることも考えられる。古文や漢文を声に出して読むことで，心地よい響きやリズムを味わうとともに，読んで楽しいものであることを実感させるようにすることが大切である。"],"s":[],"m":[]}},"kokugo-56-K3-イ":{"page":127,"name":"伝統的な言語文化","expl":{"intro":[],"k":["古典について解説した文章を読むことなどを通して昔の人のものの見方や感じ方を知ることを示している。","古典について解説した文章とは，昔の人々の生活や文化，世の中の様子など，古典の背景について易しく解説したものである。作品の内容の大体を知るためには，児童向けに現代語で易しく書き換えられたものを用いて理解を深めることも考えられる。作品に直接的に表れている作者の考え方などを知り，現代人のものの見方や感じ方と比べたりして，古典への興味・関心を深めるようにすることが重要である。また，言語文化への興味・関心を深めるために，能，狂言，人形浄瑠璃，歌舞伎，落語などを鑑賞したり，年中行事や地域に伝わる祭事などを調べたりすることも考えられる。"],"s":[],"m":[]}},"kokugo-56-K3-ウ":{"page":128,"name":"言葉の由来や変化","expl":{"intro":[],"k":["語句の由来，時間の経過などによる言葉の変化，共通語と方言との違い，仮名及び漢字の由来について示している。","語句の由来などに関心をもつとは，語源や，その語がどのようにして伝わってきたのかなどについて関心をもつことができるようにすることである。語源を調べたり，和語，漢語，外来語などの区別について関心をもったりできるようにすることが重要である。","時間の経過による言葉の変化に気付くとは，伝統的な言語文化に触れるうちに，古典などの言葉には，自分たちが普段使っている言葉とは異なる言葉があることや，それは，言葉が時間の経過によって変化したためであることに気付くことである。そのように変化する言葉の特質に気付き，自分たちの言葉への関心を深めるとともに，言語文化としての古典に親しみ，受け継いでいく態度を養う契機とすることが重要である。ただし，古典に見られる過去の言葉は，現代の言葉と連続したものであること，したがって現代の言葉に置き換えなくてもそのまま理解できる部分があることにも自然に気付かせるように配慮することが大切である。世代による言葉の違いとは，年配者と，年少者や若者には，それぞれの世代に特有の言葉遣いがあることを指す。それらの存在に気付き，世代間の親近感やつながりを強めるという役割を意識させた上で，例えば，若者の言葉が，使える場合と使うべきではない場合とがあることなどを理解できるようにすることが重要である。","共通語と方言との違いを理解するためには，共通語と方言とを比較，対照させながら違いを理解し，それぞれの特質とよさを知り，共通語を用いることが必要な場合を判断しながら話すことができるようにすることが重要である。","こうした言葉の変化や違いを明確に意識することは，場に応じた適切な言葉遣いができるようになるためにも重要である。","仮名及び漢字の由来，特質などについて理解することは，文字文化に関することを示したものである。第３学年及び第４学年の「ウ 漢字が，へんやつくりなどから構成されていることについて理解すること。」を受けて，仮名及び漢字の由来，特質などについて理解することを示している。具体的には，仮名や漢字がどのように形成され，継承されてきたのかなどについて基本的な知識をもつこと，また，表音文字としての平仮名や片仮名，表意文字としての漢字の特質を理解すること，文章が漢字仮名交じりで表記されていることや，漢字には原則として音と訓の読み方があることなどをまとまった知識として整理することなどである。"],"s":[],"m":[]}},"kokugo-56-K3-エ":{"page":129,"name":"書写","expl":{"intro":[],"k":["第３学年及び第４学年のエを受けて，書写に関する（ア），（イ），（ウ）の事項を理解し使うことを示している。","（ア） 用紙全体との関係に注意して，文字の大きさや配列などを決めるとともに，書く速さを意識して書くこと。","第３学年及び第４学年のエ（イ）を受けて，文や文章などの文字の集まりにおける文字の大きさや配列の決定，書く速さの意識化を図ることを示している。書く速さの意識化は，中学校における行書の指導への橋渡しという位置付けになる。用紙全体との関係の用紙とは，原稿用紙や便箋などの書式に対応した用紙，半紙，画用紙や模造紙などの白紙に始まり，それらに準ずる布や金属，ガラスなどといった用材全般のことを指す。","文字の大きさは，第３学年及び第４学年のエ（イ）の「漢字や仮名の大きさ」と関連している。第３学年及び第４学年までは，漢字より仮名は小さく書くといった文字相互の相対的な大きさの関係であったのに対して，第５学年及び第６学年では，主に用紙全体との関係から判断される文字の大きさを指している。例えば，用紙全体からはみださずに書く，逆に余白をつくり過ぎずに書く，また，用紙の中で見出しの文字を目立たせる，地の文章の文字は控えめに見せるといったようなことである。","配列も同じように，第３学年及び第４学年のエ（イ）の「配列」と関連している。第３学年及び第４学年までは，「配列」が，字間は均等にする，行の中心はそろえる，行間は均等にするという一般的なものであったのに対して，第５学年及び第６学年では，用紙全体との関係から考えられる文字の位置，字間，行間などの効果的な在り方に重点を置いている。","書く速さを意識してとは，書く場面の状況によって速さが決まってくることを意識することである。速く書くことが求められるだけでなく，ゆっくりと丁寧に書くことが求められる場面もある。例えば，聞き取りメモや板書の視写をするといった時間が限定されている場面では，ある程度の速さが求められる。自分の持ち物に名前を書く場面や目上の人に手紙を書く場面などでは，ゆっくりと丁寧に書くことが求められる。","（イ） 毛筆を使用して，穂先の動きと点画のつながりを意識して書くこと。","第３学年及び第４学年のエ（ウ）を受けて，毛筆を使用して穂先の動きと点画のつながりを意識して書くことを示している。","穂先の動きについては，第３学年及び第４学年のエ（ウ）で，横画・縦画や左右の払いなどの点画の種類ごとにある一定の穂先の動きを指導している。ここでは，点画の中での穂先の動きだけでなく，点画から点画へ，さらには，文字から文字へと移動していく過程に重点を置く。したがって，「穂先の動き」と「点画のつながり」とは一体化した事項と言える。","また，穂先の柔軟さが書写する際の筆圧を吸収し，強弱のあるリズミカルな運筆を可能にするという毛筆という用具の特性を生かして，書き始めから書き終わりまでを無理なくつないで書き進める効率よい書写のリズムを習得させるようにする。また，点画相互，文字相互のつながりという点では，小筆や筆ペンなどを使用して，日常で文字を書く条件に近づけることが求められる。","（ウ） 目的に応じて使用する筆記具を選び，その特徴を生かして書くこと。","手書きの慣習に関わる文字文化に関する事項として位置付けられる。","目的に応じての目的は，生活や学習活動において文字を書く様々な場面における目的のことである。例えば，全校児童に伝えるために大きく読みやすく書くことや，お世話になった人にお礼の気持ちを伝えるために丁寧に整った文字で書くことなどである。","筆記具を選びの筆記具は，鉛筆，フェルトペン，毛筆，ボールペン，筆ペンなどから選択することが考えられる。これらの筆記具に適した用材の選択にも配慮する必要がある。その特徴を生かしての特徴は，筆記具全体の形状，書く部分の材質や形状，色などである。例えば，横断幕を書くときには，大きく書ける毛筆と墨で書きやすい布を選ぶことが考えられる。"],"s":[],"m":[]}},"kokugo-56-K3-オ":{"page":131,"name":"読書","expl":{"intro":[],"k":["第３学年及び第４学年のオを受けて，日常的に読書に親しむことや，読書が自分の考えを広げることなどに役立つことに気付くことを示している。","日常的に読書に親しむとは，読書の楽しさや有効性を実感しながら，日常生活の中で主体的，継続的に読書を行うことである。","読書が，自分の考えを広げることなどに役立つことに気付くとは，読書によって多様な視点から物事を考えることができるようになることに気付くことである。本などの中の言葉は，時間や空間を超えて読者に伝わり，様々な物事を理解したり，書き手の多様なものの見方や考え方に触れたりすることを可能にする。それらの中から自分を支える言葉を見付けたり，今までになかった考えを発見したりすることなどによって，読書の意義をより強く実感することができる。","2 〔思考力，判断力，表現力等〕"],"s":[],"m":[]}},"kokugo-56-A-ア":{"page":133,"name":"話題の設定，情報の収集，内容の検討","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のアを受けて，目的や意図に応じて，話題を決め，集めた材料を整理し，伝え合う内容を検討することを示している。","話すことにおいては，自分の目的や意図に応じるとともに，聞き手の求めていることに応じて集めた材料をどのように整理すればよいかを考えることが求められる。また，話す際の材料の整理だけでなく，聞くこと，話し合うことにおいても，聞いたり話し合ったりすることを具体的に考え，関係する材料を整理しておくことが重要である。","目的や意図に応じるとは，第３学年及び第４学年で意識してきた目的に加え，場面や状況を考慮することなども含んだものである。","集めた材料を分類したり関係付けたりするとは，集めた材料を話す目的や意図に応じて内容ごとにまとめたり，それらを互いに結び付けて関係を明確にしたりすることである。例えば，ある事柄を説明するために材料を複数のまとまりに分けたり，異なる内容の材料を総合してどのようなことが言えるのかを明確にしたりすることなどが考えられる。"],"m":[]}},"kokugo-56-A-イ":{"page":133,"name":"構成の検討，考えの形成（話すこと）","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のイを受けて，話の内容が明確になるように構成を考えることを示している。第５学年及び第６学年においては，事実と感想，意見などを区別したり関係付けたりして，話の全体の構成について考えることに重点を置いている。","話の内容が明確になるようにするとは，自分の立場や結論などが明確になるよう話の内容を構成することである。そのためには，第３学年及び第４学年で取り上げた「話の中心を明確に」することに加え，事実と感想，意見とを区別したり，詳しい説明を付け加えたりすることが考えられる。","事実と感想，意見とを区別するためには，接続語や文末表現などにも注意しながら，事実，意見，感想などの関係を明らかにすることが求められる。また，話の構成を考える際には，話の種類や特徴を意識することも重要である。"],"m":[]}},"kokugo-56-A-ウ":{"page":134,"name":"表現，共有（話すこと）","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のウを受けて，話の内容を分かりやすく伝えるために，資料を活用するなどして表現を工夫することを示している。第５学年及び第６学年においては，資料を活用したり，視線や指示の仕方について意識したりすることを通して，表現を工夫することに重点を置いている。","資料を活用するとは，音声言語だけでは聞き手が理解しにくかったり，誤解を招きそうだったりする場合などに，資料を使いながら話すことである。資料を用いる目的としては，説明を補足したり，伝えたいことを強調したりすることなどが挙げられる。例えば，必要な文言や数値などを引用したり，実物や画像，映像などを用いたり，図解したものや重要な語句の定義付けなどを明示したりすることが考えられる。その際，目的や相手，状況などを踏まえ，話す内容と資料との整合，適切な時間や機会での資料の提示の仕方などに注意する必要がある。","表現を工夫するためには，相手や目的を一層意識することが求められる。聞き手の興味・関心や情報量などを予想し，補足説明が必要な箇所や言葉だけでは伝わりにくい内容について，どのような資料を用意すればよいかを考えることも重要である。その際，目的や意図に応じて，資料の順番を変えたり，資料を提示しながら話す仕方について検討したりすることが求められる。また，実際に発表する場面では，聞き手のうなずきや表情にも注意することが重要である。","また，場面や相手を意識して話すためには，例えば，〔知識及び技能〕の⑴「キ 日常よく使われる敬語を理解し使い慣れること。」における言葉遣いに関する理解との関連を図り，指導の効果を高めることが考えられる。"],"m":[]}},"kokugo-56-A-エ":{"page":135,"name":"構造と内容の把握，精査・解釈，考えの形成，共有（聞くこと）","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のエを受けて，話を聞き，自他の意見を比較して考えをまとめることを示している。第５学年及び第６学年においては，話し手の目的や自分が聞こうとする意図を考慮しながら聞くことに重点を置いている。","話し手の目的に応じて話の内容を捉えるとは，話の目的は何か，自分に伝えたいことは何か，共に考えたいことは何かなどを踏まえて，話の内容を十分に聞き取ることである。自分が聞こうとする意図に応じて話の内容を捉えるとは，自分はどのような情報を求めているのか，聞いた内容をどのように生かそうとしているのか，そのためにどういった情報を相手から引き出そうとしているのかなどを明確にして聞くことである。","話し手の考えと比較しながら，自分の考えをまとめるとは，話し手の考えと自分の考えとを比較して共通点や相違点を整理したり，共感した内容や納得した事例を取り上げたりして，自分の考えをまとめることである。自分の考えと比較する経験を積み重ねることで，中学校第１学年の「エ 必要に応じて記録したり質問したりしながら話の内容を捉え，共通点や相違点などを踏まえて，自分の考えをまとめること。」において，自分の考えを筋道立てて整えることへと発展させることができる。"],"m":[]}},"kokugo-56-A-オ":{"page":136,"name":"話合いの進め方の検討，考えの形成，共有（話し合うこと）","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のオを受けて，計画的に話し合い，考えを形成することを示している。第５学年及び第６学年においては，互いの立場や意図を明確にしながら計画的に話し合うことで，考えを広げたりまとめたりすることに重点を置いている。","互いの立場を明確にするとは，話題に対してどのような考えをもっているかを互いに明らかにすることである。立場が対立的な関係にある場合においても，互いに言い負かすことを話合いの目的とするのではなく，異なる立場からの考えを聞き，意見の基となる理由を尋ね合うことで，互いに考えを広げたりまとめたりすることが大切である。意図を明確にするとは，話合いを通して何を達成しようとするのかということに加えて，相手や目的，状況などを踏まえながら，どのように話し合うのかといった話合いの方法に関する意識を明確にすることである。また，話合いにおいて立場や意図を明確に示すためには，話合いの冒頭で意見を述べることなども重要である。","計画的に話し合うとは，話合いを始める前に，話合いの内容，順序，時間配分等を事前に検討することに加えて，意見を一つにまとめるために話し合うのか，互いの考えを広げるために話し合うのかといった話合いの目的や方向性を検討することも含んでいる。","考えを広げたりまとめたりするとは，話合いを通して様々な視点から検討し，自分の考えを広げたり，互いの意見の共通点や相違点，利点や問題点等をまとめたりすることである。話し合った後で考えをまとめる際には，異なる意見を自分の考えに生かせるように「〜という意見もあったが」，「〜という考えもあるけれど」などの表現を用いられるようにすることが効果的である。","指導に当たっては，例えば，〔知識及び技能〕の⑴「イ 話し言葉と書き言葉との違いに気付くこと。」との関連を図り，指導の効果を高めることが考えられる。"],"m":[]}},"kokugo-56-A-2":{"page":137,"name":"言語活動例","expl":{"intro":[],"k":[],"s":["ア　意見や提案など自分の考えを話したり，それらを聞いたりする活動。","自分の考えを話したり，それらを聞いたりする言語活動を例示している。","提案とは，聞き手に何らかの行動を促すために自分の考えを示し，意見を求めることである。","また，それらを聞いたりするとは，必要なことを記録したり質問したりしながら聞き，話の内容を捉えることである。","イ　インタビューなどをして必要な情報を集めたり，それらを発表したりする活動。","インタビューなどをして必要な情報を集めたり，それらを発表したりする言語活動を例示している。","情報を集めるためにインタビューをするとは，目的をもって特定の相手に質問し，必要な情報を聞き出すことである。そのようにして集めた情報について，話したり文章にまとめたりして発表する活動についても例示している。","ウ　それぞれの立場から考えを伝えるなどして話し合う活動。","それぞれの立場から話し合う言語活動を例示している。","それぞれの立場から話し合うとは，賛成又は反対などのそれぞれの立場を明らかにした上で考えを述べ合い，互いの考えを基にして，考えを広げたりまとめたりすることである。","話し合う言語活動は，他教科等においても取り入れられることが多いため，それらの活動との連携が求められる。"],"m":[]}},"kokugo-56-B-ア":{"page":140,"name":"題材の設定，情報の収集，内容の検討","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のアを受けて，目的や意図に応じて，書くことを選び，集めた材料を整理し，伝えたいことを明確にすることを示している。第５学年及び第６学年では，目的や意図に応じて，集めた材料を分類したり関係付けたりして整理することに重点を置いている。","目的や意図に応じて書くとは，第３学年及び第４学年で意識してきた相手や目的に加え，場面や状況を考慮することなども含んだものである。","感じたことや考えたことなどから書くことを選ぶとは，家庭や地域，学校生活での学習などで感じたり考えたりしたことから選択して書く題材を決めることである。目的や意図が明確になっていて，それに基づいて題材を考えることもあれば，以前から疑問や問題意識をもっており，そこから題材を選んだ上で，目的や意図を設定していくことも考えられる。","集めた材料を分類したり関係付けたりするとは，集めた材料を書く目的や意図に応じて内容ごとにまとめたり，それらを互いに結び付けて関係を明確にしたりすることである。例えば，集めた材料を，目的や意図，相手に応じて，主張の理由，事例として適切なものを選んだり，優先順位を考えて並べたりすることである。その際，こうした整理が，伝えたいことを明確にすることや書き表し方を工夫することに，どのようにつながるかを見いだすことが重要である。また，賛成の立場から集めた材料と反対の立場から集めた材料とに分類することで，一方の立場からの材料の不足に気付き，更なる情報収集の必要性を感じることも考えられる。","集めた材料相互の関係が整理されることによって，示すべき理由や事例などの事実が絞られ，伝えたいことを明確にすることができる。","なお，情報を収集する対象や手段としては，本や文章，パンフレットやリーフレット，雑誌や新聞，音声や映像，インタビューやアンケートなど様々なものが考えられる。"],"m":[]}},"kokugo-56-B-イ":{"page":141,"name":"構成の検討","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のイを受けて，文章の構成を考えることを示している。第５学年及び第６学年においては，伝えたいことを筋道の通った文章で伝えるために，文章全体の構成や展開を考えることに重点を置いている。","筋道の通った文章とは，相手に分かりやすく伝わるように，伝えたいことや知らせたいことを明確にし，首尾一貫した展開となるよう，論の進め方に注意して組み立てた文章のことである。筋道の通った文章にするためには，第１学年及び第２学年で取り上げた「事柄の順序」に沿った構成や，第３学年及び第４学年で取り上げた「書く内容の中心を明確に」した構成を工夫することに加え，例えば，「考えと理由や事例」，「原因と結果」，「疑問と解決」などのつながりや配列を意識して文章全体の筋道を整えていくことが大切である。","文章全体の構成や展開には，例えば，基本的なものとして「序論−本論−結論」などが挙げられる。また，統括する内容を位置付ける箇所によって，「頭括型」，「尾括型」，「双括型」がある。","文章全体の構成を考える際には，それぞれの段落の内容としてどのようなことを書けばよいのかを考えたり，自分の考えを一貫して述べたりすることなどに注意したりすることが大切である。また，書き出しに読み手の関心を喚起する事例や全体の概略を配置したり，終結部に全体のまとめを書いたりして，読み手が考えを理解しやすいように書き方を工夫することも考えられる。","その際，例えば，〔知識及び技能〕の⑴カの「話や文章の構成や展開，話や文章の種類とその特徴」と関連付けて指導することも有効である。"],"m":[]}},"kokugo-56-B-ウ":{"page":142,"name":"考えの形成，記述","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のウを受けて，簡単に書いたり詳しく書いたり，事実と感想，意見とを区別して書いたりするなど，自分の考えが伝わるように書き表し方を工夫することを示している。第５学年及び第６学年においては，目的や意図に応じて簡単に書く部分と詳しく書く部分を決めたり，事実と感想，意見とを区別して書いたりするなど，書き表し方を工夫することに重点を置いている。","目的や意図に応じて簡単に書いたり詳しく書いたりするとは，書く目的や意図を明確にした上で，詳しく書く必要のある場合や簡単に書いた方が効果的である場合などを判断しながら書き表し方を工夫することである。イの指導事項の「構成や展開を考える」過程において，文章のどこを詳しく，どこを簡単に書けば効果的かをあらかじめ検討しておくことも考えられる。","事実と感想，意見とを区別して書いたりするには，事実を客観的に書くこととともに，その事実と感想や意見との関係を十分捉えて書くことが重要である。それは，自分の考えたことなどが客観的な事象に裏付けられたものになっているかどうかを振り返り，自分の考えをより深めていくことにつながるからである。また，事実と感想，意見とを明確に区別して書くためには，文末表現に注意することも重要である。"],"m":[]}},"kokugo-56-B-エ":{"page":142,"name":"考えの形成，記述","expl":{"intro":[],"k":[],"s":["引用したり，図表やグラフなどを用いたりして，自分の考えが伝わるように書き表し方を工夫することを示している。","引用して書くとは，本や文章などから必要な語句や文を抜き出して書くことである。引用する場合は，まず何のために引用するのかという目的を明確にすることが必要である。原文に正確に引用することや，引用した部分と自分の考えとの関係などを明確にすることなどに注意することも必要である。","図表やグラフなどを用いるのは，示すべき事実が，図解したり，表形式やグラフ形式で示したりした方が分かりやすい場合である。観察や実験，調査の結果などの事実の記述は，このような図表やグラフを用いる方が自分にとっても考えを深めやすく，相手にとってもよく理解できるものとなる。なお，用いる図表やグラフは，本や文章から引用する場合のほか，自分で作成する場合もある。ただし，自分で作成する場合には，国語科の学習であることに鑑み，図表やグラフを作成する活動に過度に偏らないよう留意する必要がある。","なお，引用した文章や図表等の出典については必ず明記するとともに，引用部分が適切な量になるようにする必要がある。このことは，著作権を尊重し，保護するために必要なことであり，指導に当たっては十分留意することが求められる。また，文章を引用する場合には，引用する部分をかぎ（「 」）でくくることや，図表を用いる場合には，本文に「図１は，〜」，「表１は，〜」といった表現を用いて本文との関連を示すことなども必要である。"],"m":[]}},"kokugo-56-B-オ":{"page":143,"name":"推敲","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のエを受けて，文や文章を整えることを示している。文章全体の構成や書き表し方などに着目して，文や文章を整えるとは，ア，イ，ウ，エの指導事項を観点に，文や文章を推敲することである。第５学年及び第６学年においては，文章全体を見たときに，内容や表現に一貫性があるか，目的や意図に照らして適切な構成や記述になっているか，事実と感想，意見とが区別して書かれているか，引用の仕方，図表やグラフなどの用い方は適切かといったことなどが推敲の観点となる。"],"m":[]}},"kokugo-56-B-カ":{"page":144,"name":"共有","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のオを受けて，感想や意見を伝え合い，文章の内容や表現のよいところを見付けることを示している。第５学年及び第６学年においては，文章全体の構成や展開が明確になっているかなどの観点から，自分の文章のよいところを見付けることに重点を置いている。","文章全体の構成や展開が明確になっているかなど，文章に対する感想や意見を伝え合うとは，互いの書いた文章を読み合い，目的や意図に応じた文章の構成や展開になっているかなどについて，具体的に感想や意見を述べ合うことである。このことを通して，自分の文章のよいところを見付けることとなる。また，互いの文章のよいところを見付けて伝え合うことを通して，それらを自分の表現に生かそうとすることが大切である。"],"m":[]}},"kokugo-56-B-2":{"page":145,"name":"言語活動例","expl":{"intro":[],"k":[],"s":["ア　事象を説明したり意見を述べたりするなど，考えたことや伝えたいことを書く活動。","考えたことや伝えたいことを文章に書く言語活動を例示している。","事象を説明する文章を書くとは，対象となる事象について，表面に表れている事実を説明するのみならず，その事実が生起した背景や原因，経過などを整理して書き表すことである。例えば，調査などを通して明らかになったことを解説する文章などが考えられる。","意見を述べる文章を書くとは，理由や事例を明確にしながら，筋道を立てて自分の考えを述べることである。例えば，自分の考えを，異なる立場の読み手に向けて主張する文章や，自分たちの生活をより良いものにするために提案する文章，事物のよさを多くの人に推薦する文章などを書くことが考えられる。","イ　短歌や俳句をつくるなど，感じたことや想像したことを書く活動。","感じたことや想像したことを書く言語活動を例示している。","短歌や俳句については，第３学年及び第４学年の〔知識及び技能〕の⑶「ア易しい文語調の短歌や俳句を音読したり暗唱したりするなどして，言葉の響きやリズムに親しむこと。」において取り上げている。これを踏まえ，第５学年及び第６学年においては，伝統的な定型詩の特徴を生かした創作を行うことによって，七音五音を中心とする言葉の調子やリズムに親しみ，凝縮した表現によって創作する活動として例示している。","ウ　事実や経験を基に，感じたり考えたりしたことや自分にとっての意味について文章に書く活動。","事実や経験を基に，感じたり考えたりしたことや自分にとっての意味について文章に書く言語活動を例示している。","身近に起こったこと，見たことや聞いたこと，経験したことなどを描写しながら，感想や自分にとっての意味などをまとめて書く言語活動である。この言語活動は，中学校第１学年の随筆を書く言語活動につながるものである。"],"m":[]}},"kokugo-56-C-ア":{"page":146,"name":"構造と内容の把握（説明的な文章）","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のアを受けて，事実と感想，意見などとの関係を押さえた上で，文章全体の構成を捉え，要旨を把握することを示している。","要旨とは，書き手が文章で取り上げている内容の中心となる事柄や，書き手の考えの中心となる事柄などである。要旨を把握するためには，文章全体の構成を捉えることが必要になる。文章の各部分だけを取り上げるのではなく，全体を通してどのように構成されているのかを正確に捉えることが重要である。その際，叙述を基に，書き手が，どのような事実を理由や事例として挙げているのか，どのような感想や意見などをもっているのかなどに着目して，事実と感想，意見などとの関係を押さえることとなる。","また，例えば，〔知識及び技能〕の⑴カの「話や文章の構成や展開」と関連付けて指導することも有効である。"],"m":[]}},"kokugo-56-C-イ":{"page":147,"name":"構造と内容の把握（文学的な文章）","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のイを受けて，登場人物の相互関係や心情の変化などを，描写を基に捉えることを示している。","登場人物の相互関係や心情などには，登場人物の性格や情景なども含まれる。描写とは，物事の様子や場面，行動や心情などを，読み手が想像できるように描いたものである。第５学年及び第６学年においては，描写に着目しながら読み進めていくことが重要である。登場人物の心情は，直接的に描写されている場合もあるが，登場人物相互の関係に基づいた行動や会話，情景などを通して暗示的に表現されている場合もある。このような表現の仕方にも注意し，想像を豊かにしながら読むことが大切になる。","また，登場人物の相互関係や心情などについて，描写を基に捉えることは，「エ 人物像や物語などの全体像を具体的に想像したり，表現の効果を考えたりすること。」につながる。"],"m":[]}},"kokugo-56-C-ウ":{"page":148,"name":"精査・解釈（説明的な文章）","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のウを受け，目的に応じて，アの指導事項で捉えた要旨を手掛かりとして，必要な情報を見付けたり，論の進め方について考えたりすることを示している。","目的に応じて，必要な情報を見付けるとは，書き手の述べたいことを知るために読む，読み手の知りたいことを調べるために読む，知的欲求を満たすために読む，自分の表現に生かすために読むなどの目的に応じて，文章の中から必要な情報を取捨選択したり，整理したり，再構成したりすることである。必要な情報は，目的に応じて変わるため，読む目的を明確にすることが重要である。","論の進め方について考えるとは，アの指導事項で捉えた「事実と感想，意見などとの関係」や「文章全体の構成」などを基に，目的に応じて，書き手は自分の考えをより適切に伝えるために，どのように論を進めているのか，どのような理由や事例を用いることで説得力を高めようとしているのかなどについて考えをもつことである。","また，日常生活において児童が触れる文章には，図表やグラフ，写真や挿絵などを含むものも多い。文章と図表などを結び付けるなどして読むとは，文章中に用いられている図表などが，文章のどの部分と結び付くのかを明らかにすることによって，必要な情報を見付けたり，論の進め方を捉えたりすることである。"],"m":[]}},"kokugo-56-C-エ":{"page":149,"name":"精査・解釈（文学的な文章）","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のエを受けて，イの指導事項で捉えた登場人物の相互関係などを手掛かりに，その人物像や物語などの全体像を具体的に思い描くことや，優れた叙述に着目しながら様々な表現の効果について考えることを示している。登場人物の人物像を具体的に想像するためには，登場人物の行動や会話，様子などを表している複数の叙述を結び付け，それらを基に性格や考え方などを総合して判断することが必要である。イの指導事項で捉えた性格や心情を踏まえ，物語などの展開と結び付けながら読んでいくことが重要である。","物語などの全体像は，登場人物や場面設定，個々の叙述などを基に，その世界や人物像を豊かに想像することで捉えられる。「何が書かれているか」という内容面だけでなく，「どのように描かれているか」という表現面にも着目して読むことが，物語などの全体像を具体的にイメージすることにつながる。","第３学年及び第４学年で登場人物の性格について具体的に想像することが，第５学年及び第６学年では，人物像を捉えることに結び付き，同様に，場面の移り変わりを捉えることが物語などの全体像を捉えることへとつながっていく。また，物語などの全体像を具体的に想像することは，中学校第１学年の指導事項の「内容を解釈すること」へと発展していくものである。","表現の効果を考えるとは，想像した人物像や全体像と関わらせながら，様々な表現が読み手に与える効果について自分の考えを明らかにしていくことである。感動やユーモアなどを生み出す優れた叙述，暗示性の高い表現，メッセージや題材を強く意識させる表現などに着目しながら読むことが重要である。","なお，表現の効果を考えることができるようにするためには，例えば，〔知識及び技能〕の⑴「ク 比喩や反復などの表現の工夫に気付くこと。」と関連付けて指導することも有効である。"],"m":[]}},"kokugo-56-C-オ":{"page":150,"name":"考えの形成","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のオを受けて，文章を読んで自分の考えをまとめることを示している。第５学年及び第６学年においては，感想や考えをもつことに加えて，それらをまとめることに重点を置いている。","文章を読んで理解したことに基づくとは，文章の内容や構造を捉え，精査・解釈しながら考えたり理解したりしたことを基にするということである。また，自分の考えをまとめるとは，文章を読んで理解したことについて，既有の知識や理解した内容と結び付けて自分の考えを形成することである。"],"m":[]}},"kokugo-56-C-カ":{"page":150,"name":"共有","expl":{"intro":[],"k":[],"s":["第３学年及び第４学年のカを受けて，意見や感想を共有し，自分の考えを広げることを示している。第５学年及び第６学年においては，共有することを通して自分の考えを広げることに重点を置いている。","文章を読んでまとめた意見や感想とは，文章の構造と内容を把握し，精査・解釈することを通して，意見や感想をもつことである。また，自分の考えを広げるためには，互いの意見や感想の違いを明らかにしたり，互いの意見や感想のよさを認め合ったりすることが大切である。"],"m":[]}},"kokugo-56-C-2":{"page":151,"name":"言語活動例","expl":{"intro":[],"k":[],"s":["ア　説明や解説などの文章を比較するなどして読み，分かったことや考えたことを，話し合ったり文章にまとめたりする活動。","説明的な文章を読み，分かったことや考えたことを，話し合ったり文章にまとめたりする言語活動を例示している。","取り上げる文章としては，説明や解説の文章のほか，意見，提案，報道などの文章が考えられる。","これらの文章を比較しながら読むことにより，共通点や相違点が明確になり，それぞれの文章をよく理解することにつながる。小学校第５学年及び第６学年においては，日常生活において考えをまとめる際に，単一の情報のみに基づくのではなく，複数の情報を比較や分類をしたり，関係付けたりして検討することが必要である。","イ　詩や物語，伝記などを読み，内容を説明したり，自分の生き方などについて考えたことを伝え合ったりする活動。","文学的な文章を読んで，その内容を説明したり，読んで考えたことなどを伝え合ったりする言語活動を例示している。","取り上げる文章としては，詩や物語，短編小説，伝記などが考えられる。","伝記は，物語や詩のような行動や会話，心情などを基軸に物語る文学的な描写と，事実の記述や説明の表現が用いられている。","自分の生き方などについて考えたことを伝え合ったりするとは，例えば，読み取った人物の生き方などから，これからの自分のことについて考え，文章にまとめたり発表したりすることである。","ウ　学校図書館などを利用し，複数の本や新聞などを活用して，調べたり考えたりしたことを報告する活動。","本や新聞など複数の資料を活用しながら，調べたり考えたりしたことを報告する言語活動を例示している。","複数の本や新聞などとは，同じテーマについて異なる書き手による本や文章，異なる新聞社による新聞記事などが挙げられる。本や新聞のほかに，雑誌，インターネットから得た情報などを活用することも考えられる。","調べたり考えたりしたことを報告するとは，複数の本や新聞などに書かれていることを比較，分類，関係付けるなどして分かったことと，それらを基に考えたことをまとめて，文章に書いたり発表したりすることである。","学校図書館や地域の図書館などの利用にあたっては，「第３ 指導計画の作成と内容の取扱い」の２⑶を踏まえ，施設の利用方法や本の配架場所などを指導することが必要である。"],"m":[]}}}},"areaKan":{"K1":"k","K2":"k","K3":"k","A":"s","B":"s","C":"s"},"trows":{"K1":[{"name":"言葉の働き","cells":{"1":[{"id":"kokugo-12-K1-ア","lab":"言葉には事物の内容を表し経験を伝える働きがある"}],"3":[{"id":"kokugo-34-K1-ア","lab":"言葉には考えや思いを表す働きがある"}],"5":[{"id":"kokugo-56-K1-ア","lab":"言葉には相手とのつながりをつくる働きがある"}]}},{"name":"話し言葉と書き言葉","cells":{"1":[{"id":"kokugo-12-K1-イ","lab":"音節と文字，発声や発音"},{"id":"kokugo-12-K1-ウ","lab":"平仮名・片仮名，助詞，句読点，かぎの使い方"}],"3":[{"id":"kokugo-34-K1-イ","lab":"相手を見て話す，抑揚・強弱・間"},{"id":"kokugo-34-K1-ウ","lab":"漢字と仮名の表記，送り仮名，ローマ字（3年）"}],"5":[{"id":"kokugo-56-K1-イ","lab":"話し言葉と書き言葉との違い"},{"id":"kokugo-56-K1-ウ","lab":"漢字と仮名の使い分け，送り仮名，仮名遣い"}]}},{"name":"漢字","cells":{"1":[{"id":"kokugo-12-K1-エ","lab":"漢字を読む・書く（1・2年の配当漢字）"}],"3":[{"id":"kokugo-34-K1-エ","lab":"漢字を読む・書く（3・4年の配当漢字）"}],"5":[{"id":"kokugo-56-K1-エ","lab":"漢字を読む・書く（5・6年の配当漢字）"}]}},{"name":"語彙","cells":{"1":[{"id":"kokugo-12-K1-オ","lab":"身近なことを表す語句を増やす"}],"3":[{"id":"kokugo-34-K1-オ","lab":"様子や気持ちを表す語句を増やす"}],"5":[{"id":"kokugo-56-K1-オ","lab":"思考に関わる語句，語句の構成や変化"}]}},{"name":"文や文章","cells":{"1":[{"id":"kokugo-12-K1-カ","lab":"主語と述語との関係"}],"3":[{"id":"kokugo-34-K1-カ","lab":"修飾と被修飾，指示語・接続語，段落の役割"}],"5":[{"id":"kokugo-56-K1-カ","lab":"語順，文と文の接続，文章の構成や種類"}]}},{"name":"言葉遣い","cells":{"1":[{"id":"kokugo-12-K1-キ","lab":"丁寧な言葉と普通の言葉，敬体"}],"3":[{"id":"kokugo-34-K1-キ","lab":"敬体と常体の違いに注意して書く"}],"5":[{"id":"kokugo-56-K1-キ","lab":"日常よく使われる敬語"}]}},{"name":"音読，朗読","cells":{"1":[{"id":"kokugo-12-K1-ク","lab":"語のまとまりや響きに気を付けて音読する"}],"3":[{"id":"kokugo-34-K1-ク","lab":"文章全体の構成を意識して音読する"}],"5":[{"id":"kokugo-56-K1-ケ","lab":"音読・朗読"}]}},{"name":"表現の技法","cells":{"5":[{"id":"kokugo-56-K1-ク","lab":"比喩や反復などの表現の工夫"}]}}],"K2":[{"name":"情報と情報との関係","cells":{"1":[{"id":"kokugo-12-K2-ア","lab":"共通・相違・順序など情報と情報との関係"}],"3":[{"id":"kokugo-34-K2-ア","lab":"考えと理由や事例，全体と中心の関係"}],"5":[{"id":"kokugo-56-K2-ア","lab":"原因と結果など情報と情報との関係"}]}},{"name":"情報の整理","cells":{"3":[{"id":"kokugo-34-K2-イ","lab":"比較や分類，引用，辞書や事典の使い方"}],"5":[{"id":"kokugo-56-K2-イ","lab":"情報の関係付け方，図による表し方"}]}}],"K3":[{"name":"伝統的な言語文化","cells":{"1":[{"id":"kokugo-12-K3-ア","lab":"昔話や神話・伝承の読み聞かせ"},{"id":"kokugo-12-K3-イ","lab":"言葉遊びで言葉の豊かさに気付く"}],"3":[{"id":"kokugo-34-K3-ア","lab":"短歌や俳句を音読・暗唱する"},{"id":"kokugo-34-K3-イ","lab":"ことわざ・慣用句・故事成語"}],"5":[{"id":"kokugo-56-K3-ア","lab":"古文や漢文を音読し，響きやリズムに親しむ"},{"id":"kokugo-56-K3-イ","lab":"古典を通して昔の人のものの見方を知る"}]}},{"name":"書写","cells":{"1":[{"id":"kokugo-12-K3-ウ","lab":"書写：姿勢・持ち方，点画，筆順"}],"3":[{"id":"kokugo-34-K3-エ","lab":"書写：組立て方，大きさや配列，毛筆"}],"5":[{"id":"kokugo-56-K3-エ","lab":"書写：配列，書く速さ，筆記具の選び方"}]}},{"name":"読書","cells":{"1":[{"id":"kokugo-12-K3-エ","lab":"読書に親しみ，いろいろな本を知る"}],"3":[{"id":"kokugo-34-K3-オ","lab":"幅広く読書に親しみ，知識や情報を得る"}],"5":[{"id":"kokugo-56-K3-オ","lab":"日常的に読書に親しみ，考えを広げる"}]}},{"name":"言葉の由来や変化","cells":{"3":[{"id":"kokugo-34-K3-ウ","lab":"漢字の構成（へんとつくり）"}],"5":[{"id":"kokugo-56-K3-ウ","lab":"言葉の由来や変化，共通語と方言，仮名と漢字の由来"}]}
