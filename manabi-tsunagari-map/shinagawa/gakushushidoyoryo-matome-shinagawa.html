単位分数の個数に着目することによって，分子の大きさを比べることで，分数の大きさを比べることができることに気付くようにする。","また，整数と同じように，分数でも計算ができるかどうかを考え，同分母の分数の加法及び減法は，単位分数の個数に着目することによって，整数の場合と同様に処理できることに気付くようにする。","大小比較や計算をする際に図に表したりするときには，１の大きさを決めることでそれが可能となることに気付くようにすることが大切である。","さらに，分数の大小比較や計算ができることから，分数も整数と同じように数としてみることができるようにする。","分数を日常生活に生かすこと","身の回りから分数を用いた表現を見いだしたり，大きさを分数を用いて考えたりするなど，分数を用いた数の処理や分数の見方を日常生活に生かそうとする態度を育むようにする。"]},"quoteEnd":0},"sansu-3-A-7":{"page":155,"name":"数量の関係を表す式","expl":{"intro":["問題場面を式に表したり，式を図に読み取ったりすることについては，第１学年の加法の指導に始まり，減法，乗法及び除法の場面においてそれぞれ段階的に進めてきている。そして，式は数量や数量の関係を簡潔，明瞭，的確に表すことができる数学的表現であることを指導している。","第３学年では，逆思考になるような問題の解決において，未知の数量を□として式に表したり，□に当てはまる数の求め方を図に表したりして考察させる。また，加法と減法，乗法と除法の相互関係についても，式と図を関連付けて説明し，捉えられるようにすることがねらいである。","この学習は，数量の関係を四則混合の式や，（ ）や□，△を用いた式で，簡潔に，又は一般的に表す第４学年の考察に生かされるものである。"],"k":["ア □を用いた式","第２学年では，加法や減法についての理解を深めることに関連して，「内容の取り扱い」で，（ ）や□などを用いることができることになっている。","第３学年では，問題を解決するために，未知の数量を□などの記号を用いて表現することにより，問題場面どおりに数量の関係を立式し，□に当てはまる数を調べることができるようにする。","□などの記号については，未知の数量を表す記号として用いる場合と変量を表す記号として用いる場合とに大きく分けられる。第３学年では，未知の数量を表す記号として用いる場合を中心に指導し，□などの記号を用いて立式することができるようにする。","指導に当たっては，□などを数をかく場所としてはじめに扱い，次第に未知の数量を表す記号などとしても扱い，文字としての役割をもつ□などについての理解が深まるよう配慮する必要がある。","□に当てはまる数を調べることについては，例えば，□＋８＝17という式について，□の中に１，２，３，…と順に数を当てはめていく方法，およその見当を付けて８，９と当てはめていく方法などがある。さらに，手際のよい方法として，四則計算の相互の関係を基に逆算で求める方法がある。このような活動に十分に取り組ませていく中で，□の表す数が９であるということだけでなく，□＋８という式そのものが17という一つの数量を表しているとみることができるようにすることが大切である。"],"s":["ア  数量の関係に着目し，数量の関係を図や式を用いて簡潔に表したり，式と図を関連付けて式を読んだりすること","第３学年では，式の指導において，具体的な場面に対応させながら，数量や数量の関係に着目して，式を用いて簡潔に表すことができるようにする。そして，式が表している場面などの意味を読み取ったり，式を用いて考えを伝え合ったり，式で処理したりするなどして式を使いこなし，式のよさを実感できるようにする。","図の指導においても，数量や数量の関係に着目して，図を用いて表すこと，図に表された数量の関係を読み取ること，図を用いて考えを伝え合うことなどができるようにする。","指導に当たっては，図に表された数量の関係を読み取ってそれを式に表したり，式に表された数量の関係を読み取ってそれを図に表したりする数学的活動を通して，式と図を関連付けることができるようにすることが大切である。","また，加法と減法との相互関係，乗法と除法の相互関係についても理解を深め，それらの意味を式と図を関連付けながら説明することができ，問題解決に生かせるようにすることが大切である。"]},"quoteEnd":0},"sansu-3-A-8":{"page":157,"name":"そろばん","expl":{"intro":["そろばんは，古くから我が国で用いられている計算のための道具であり，数を表したり，計算したりするのに便利なものである。数を表すための位を定め，珠を操作することによって，整数や小数を表すことができる。そろばんの仕組みが分かると，そうした数の加減乗除の計算をすることもできるようになる。","そろばんは，第３学年及び第４学年において指導する。"],"k":["ア そろばんによる数の表し方","第３学年では，そろばんによる整数や小数の表し方について指導する。十進位取り記数法の仕組みにより，整数や小数を表せるようにする。整数では，万の単位の1","数まで表し，小数では， の位の数まで表すことを指導する。","イ そろばんによる計算の仕方","計算に関しては，珠の操作による計算の仕方について理解できるようにする。整数では，１位数や２位数の加法及び減法の計算について指導する。数を入れるだけで計算できる「２＋１」，「３−１」などから始め，５の合成や分解をともなう「４＋３」，「６−４」などの計算や，繰り上がりや繰り下がりのある「８＋９」，「15−７」などの計算の仕方について理解できるようにする。","また，「３万＋５万」などの万の単位を含む簡単な計算や，小数では，「2.6＋0.3」1","などの の位までの簡単な小数の加法及び減法の計算の仕方を理解できるように10","する。"],"s":["ア そろばんの仕組みに着目し，大きな数や小数の計算の仕方を考えること","そろばんは，どの桁の珠も同じ大きさの形でできている。この仕組みは，同じ記号で異なる数を表すという位取り記数法に沿ったものであることから，そろばんで数を表したり，計算をしたりすることは，位取り記数法の理解を確かにすることにつながる。指導に当たっては，こうしたそろばんの仕組みと数の仕組みを対比させながら，計算の仕方を考えさせることを大切にしたい。","Ｂ 図形"]},"quoteEnd":0},"sansu-3-B-1":{"page":158,"name":"二等辺三角形，正三角形などの図形","expl":{"intro":["第２学年では四角形や三角形，正方形や長方形などについて，これらを構成する直線や直角などに着目することで，図形を弁別することを指導してきた。","第３学年では，図形を構成する要素の関係に着目し，辺の長さの相等や角の大きさの相等に着目して正三角形や二等辺三角形について知るとともに，角についても知ることをねらいとしている。また，図形を構成する要素に着目し，さらにその観点を他の図形にも用いようとする態度を養う。","ここで育成される資質・能力は，第４学年での平行四辺形，ひし形，台形などの考察に生かされるものである。"],"k":["ア 二等辺三角形，正三角形","二つの辺の長さが等しい三角形を二等辺三角形といい，三つの辺の長さが等しい三角形を正三角形という。第３学年ではこれらの図形を中心に，直角二等辺三角形にも触れる。","二等辺三角形や正三角形の意味や性質は，定規やコンパスによる作図，ひご等による構成，紙を折るなどの活動を豊かに行うことを通して，帰納的に理解できるようにする。例えば，二等辺三角形では，二つの角の大きさが等しいことや，正三角形では，三つの角の大きさが等しいことについては，二等辺三角形や正三角形を観察したり，実際に紙を切り抜いて作った三角形を折ってみたりするなどの活動を通して，確かめることができる。","実際，例えば次の図のように，折り紙から正三角形を構成することができる。① 折り紙を半分に折って折り目を付ける。","② 右下の頂点を折り目の上に重ねる。","③ 重なった点に印を付ける。","④ 折り紙の頂点と印の点を結ぶ。","② 右下の頂点を折り目の上に重ねる。","② 右下の頂点を折り目の上に重ねる。","③ 重なった点に印を付ける。","③ 重なった点に印を付ける。","④ 折り紙の頂点と印の点を結ぶ。","④ 折り紙の頂点と印の点を結ぶ。","〔折り紙から正三角形を構成〕","〔折り紙から正三角形を構成〕","〔折り紙から正三角形を構成〕","①〔折れ目を付ける〕 ②③〔右下の頂点を折れ目の上に ④〔折り紙の頂点と","①〔折れ目を付ける〕 ②③〔右下の頂点を折れ目の上に ④〔折り紙の頂点と","重ねて，そこに印を付ける〕 印の線を結ぶ〕","重ねて，そこに印を付ける〕 印の線を結ぶ〕","折り紙を折ることを用いた正三角形","折折りり紙紙をを折折るるここととをを用用いいたた正正三三角角形形の","の構成には右の方法もある。","の構構成成ににはは右右のの方方法法もあもるあ。る。","また，方眼を用いて二等辺三角形を作図することもで","また，方眼を用いて二等辺三角形を作図することもで","ア","また，方眼を用いて二等辺三角形を作図することもでき ア","きる。","きる。","る方。眼を使って，線分イウを決め，点イ，点ウの垂直二 ア","方眼を使って，線分イウを決め，点イ，点ウの垂直二","等 分方線眼上をの使点っアてと，，線点分イイウ，を点決ウめと，を点結イん，で点かウくの。垂直二等","等分線上の点アと，点イ，点ウとを結んでかく。","分線上の点アと，点イ，点ウとを結んでかく。 イ ウ","イ ウ定規やコンパスを用いた二等辺三角形の作図には，次のような方法が考えられ定規やコンパスを用いた二等辺三角形の作図には，次のような方法が考えられイ ウる。","る。","① 与えられた条件（底辺）を利用して作図する方法","①定規与やえコらンれパたス条を用件い（た底二辺等）辺を三利角用形しのて作作図図にすはる，次方の法ような方法が考えられる。線分イウがあるとき，点イを中心としてコンパスで弧をかき，同じ半径で① 線与分えイらウれがたあ条件る（と底き辺，）点をイ利を用中し心てと作し図てすコるン方パ法スで弧をかき，同じ半径で点ウから弧をかいて，交わった点アと，点イ，点ウとを結んでかく。","点ウから弧をかいて，交わった点アと，点イ，点ウとを結んでかく。","線分イウがあるとき，点イを中心としてコンパスで弧をかき，同じ半径で点② 円を用いて作図する方法","② 円を用いて作図する方法","ウから弧をかいて，交わった点アと，点イ，点ウとを結んでかく。","コンパスで円をかき，円の半径はどこでも等しいという性質を使って，円コンパスで円をかき，円の半径はどこでも等しいという性質を使って，円② 円を用いて作図する方法","コンパスで円をかき，円の半径はどこでも等しいという性質を使って，円周- 158 -","上の２点と円の中心とを結んでかく。","① ②","ア","ア","ウ","イ ウ イ","二等辺三角形や正三角形の構成を繰り返すなかで，二等辺三角形の底辺と他の二辺を同じ長さにすると正三角形になることなどに気付かせ，二等辺三角形と正三角形の関係に着目できるよう指導することが大切である。","「内容の取扱い」の（6）では，「定規，コンパスなどを用いて，図形をかいたり確かめたりする活動を重視するとともに，三角形や円などを基にして模様をかくなどの具体的な活動を通して，図形のもつ美しさに関心をもたせるよう配慮するものとする」と示している。二等辺三角形や正三角形を定規，コンパスなどを用いてかく活動を取り入れるようにする。","さらに，合同な二等辺三角形や正三角形","を敷き詰める活動を通して，これらの図形","で平面が敷き詰められることを理解し，敷","き詰めてできた模様を観察することによっ","て，その中にほかの図形を認めること，平","面図形の広がりや図形の美しさを確認する","ことなど，図形についての見方や感覚を豊","かにしていくようにする。","イ 角","第２学年では，直角について指導している。第３学年では，一つの頂点から出る２本の辺が作る形を角ということを指導する。本学年では第２学年までに〔測定〕領域で確かなものとなった数学的な見方・考え方を働かせて角の大きさを比べることができるようにする。ここでは実際に紙を切り抜いて作った二等辺三角形や正三角形について，長さの等しい辺を重ねるように折ることによって，二つの角の大きさがぴったり重なり，それらが等しいことを確かめることなどを指導する。なお，角の大きさの単位及び角の大きさの単位を用いた測定については，第４学年で指導する。","ウ 円，球","円と球については，第１学年で，まるい形，ボールのような形として捉えてきている。第３学年では，観察，分類，構成，作図などの活動を通して円について，また，観察を通して球について理解できるようにする。","円については，右の図のように，円周上のどの点も中","心から等距離にあることが分かるようにする。","そして，半径は中心から円周まで引いた直線と約束す","る。直径については，中心を通り，円周から円周まで引","いた直線と約束する。","さらに，作図などを通して，半径や直径は無数にある","ことに気付かせる。紙で作った円を折って円の中心を見","付けたり，コマ作りをしたりするなどの活動も，円の性質に気付いていくために有効である。そして，円による模様作りなどを行い，コンパスの操作に慣れさせるとともに，円のもつ美しさに触れるようにする。","また，この内容に関連してコンパスを用いるが，コンパスは単に円をかくだけでなく，等しい長さを測り取ったり移したりすることができる道具で，長さを比べたりする場面などでも活用できる。","球については，球を平面で切ると切り口はどこも円になること，球をちょうど半分に切った場合の切り口が最大になることなどを模型の操作や観察を通して理解させる。","また，ボールなどの球の直径の大きさは，ボー","ルを直方体などの立体ではさむなどの活動によっ","て調べることができる。これらの円や球について","指導する際には，児童の身の回りにある楕円状の","物や卵型のものも用いて，円や球と丸い形の区別","を明確化することが大切である。"],"s":["ア  図形を構成する要素に着目し，構成の仕方を考えるとともに，図形の性質を見いだし，身の回りのものの形を図形として捉えること","第２学年では，直線や面の形，直角といった図形を構成する要素に着目して図形を捉えることにより，数学的な見方・考え方が豊かなものとなってきた。第３学年の図形の指導ではこれらに加えて，辺の長さの相等や角の大きさの相等にも着目し図形を捉えられるようにする。","構成の仕方を考えるとは，図形の約束に基づいて論理的に構成していこうとすることである。例えば，二辺の長さが等しいことを基に二等辺三角形を作ることがこれに当たる。このとき，二つの角の大きさが等しいという性質にも気付くことができる。","身の回りのものを図形として捉えるとは，第２学年同様，図形を構成する要素に着目し正三角形や二等辺三角形，円や球などを見いだすことを通して，図形のもつ性質が日常生活でどのように役立てられているかを考察することである。","これらの指導を通して，図形の構成や問題の解決に当たる際には，それらを定める約束や性質を明確にし，それを用いて処理しようとする態度を養う。","Ｃ 測定"]},"quoteEnd":0},"sansu-3-C-1":{"page":163,"name":"長さ，重さの単位と測定","expl":{"intro":["第２学年までに，長さにおける比べ方を基にして広さやかさも同じように考えたり，任意単位の測定を基にして普遍単位の測定のよさに気付いたり，便利な基準量を基にしておよその見当を付けて表現したりすることについて指導してきた。第３学年では，身の回りのものの特徴に着目し，測定する対象の大きさのおよその見当を付けて適切な計器を柔軟に選択したり，長さや重さの単位を関係付けたりすることを主なねらいとしている。また，第３学年の長さや重さについて，およその見当を付けて適切な計器を選択して測定しようとする態度を養う。","ここで育成する資質・能力は，日常生活に必要な長さや重さを測定したり，単位を関係付けてみたりして，自らの日常生活に生かされるものである。"],"k":["ア 長さや重さの単位と測定","長さの単位として，第３学年では，キロメートル（㎞）を指導する。","１㎞の長さを直接見て捉えることは難しいため，100ｍの10倍，10ｍの100倍といった関係を基に理解できるようにすることが必要である。また，通学路などを思い起こさせ，学校から１㎞の道のりに当たるところを調べさせたり，運動場の200ｍのトラックを実際に５周歩かせてみたりすることで実感的に捉えられるようにすることが大切である。","重さについては，これまでの量の場合と同じように考え，単位となる重さの幾つ分かで測定できることを理解できるようにする。また，１ｇや１㎏の単位の意味について理解できるようにする。そして，日常生活における体重の測定，食品の買い物などで，計器を用いてものの重さを測定することを見聞きする経験や，１㎏の重さの具体物を手で持ち上げるなどの体験を通して，基本的な量の大きさについての感覚を豊かにする。","また，ものの重さを量る場合には，そのものを直接量ることができないので容器などに入れて量る場合がある。この場合には，「（正味の重さ）＝（全体の重さ）−（容器の重さ）」という関係が用いられることも理解できるようにする。","「内容の取扱い」の（7）では，g，㎏以外の重さの単位，トン（t）の扱いについて示している。ここでは，日常でよく用いられている「トン（t）」も大きい重さを表す重さの単位であることや，１tは1000㎏であることを指導する。また，長さと重さの単位には，どちらもキロ（ｋ）の付いた単位があることや長さとかさの単位には，どちらも，ミリ（ｍ）の付いた単位があることから，接頭語について触れるものとする。","イ 適切な単位と計器の選択","ここでは，主に実際の生活場面での効率的な測定，的確な表示ができるようにすることをねらいとしている。","ある量を測定するとき，その量がどの程度の大きさであるか，およその見当を付け，測定に用いる単位や計器を適切に選択できるようにすることが大切である。例えば，木の回りなどの曲線部分の長さを測る場合に，巻き尺を用いて測ることや，ものの重さを量る場合に，およその見当を付け，適切な計器を選択して測ることについて指導する。","はかりの取り扱いに関しては，どれだけの重さのものまで量れるかという秤量や，どのくらいまでの詳しさで量れるかという感量に気をつけることなど，使用上注意すべきことがある。計器を用いての測定に当たって，それらの点に留意する態度を養うことは大切である。","その際，測定して得られた数値が，適切な単位を選択することにより，扱いやすい大きさになることを理解できるようにする必要がある。"],"s":["ア 身の回りのものの特徴に着目し，単位の関係を統合的に考察すること","第３学年までに学習した長さ（mm，cm，m，km），かさ（mL，dL，Ｌ），重さ（g，kg，t）の単位について整理してまとめた表などから，それぞれに共通する関係を調べる。","10倍 100倍 1000倍","長さ mm，cm，m，km","１mm → １cm → １m → １km","かさ mL，dL，Ｌ， 100倍 10倍","１mL → １dL → １L","重さ g，kg，t","1000倍 1000倍","１g → １kg → １t","その際，次のようなことを見いだすことができる。","・長さと重さの単位には，どちらもｋ（キロ）の付いた単位があること","・長さとかさの単位には，どちらも，ｍ（ミリ）の付いた単位があること","・１kmは1000ｍであり，１ｍの1000倍になっていること","・１kgは1000ｇであり， １ｇの1000倍になっていること","・１Ｌは1000mLであり，１mLの1000倍になっていること","・１ｍは1000mmであり，１mmの1000倍になっていること","このような活動を通して，単位の前に接頭語ｋ（キロ）が付くと1000倍になることに気付いたり，それぞれが倍の関係にあることを図や文章でまとめたりして考察し，単位についての理解を深めることを大切にする。","1000mm 100cm １ｍ","1000mL 10dL １Ｌ","1000ｍ １km","1000ｇ １kg","なお，このように単位の関係を考えることは，今後，学習する様々な単位についても，主体的に考察し，単位の仕組みを考えることにつながっていく。例えば，メートル法の単位の仕組みについて学習したことを活用することで，新しい単位に出合ったときも類推して量の大きさを考えることができることにつながる。","日常生活の場面など児童の身の回りでは，様々な単位が用いられている。飲料などの量の単位としてミリグラム（㎎）やセンチリットル（cL）などが使われ，水道の使用量，タンクローリーの容量としてはキロリットル（kL）の単位が使われている。これらの単位は，メートル法に従って接頭語，ｍ（ミリ），ｃ（センチ），ｋ（キロ）を付けて作られた単位である。身の回りからこれらの単位を見付けた児童は，どのような単位であるか，今までに学習した単位とどのような関係になっているのかを考えることができるようになる。","例えば，薬の箱に書かれた成分表に100㎎と見付けた場合，ｇ（グラム）と書かれていることから重さの単位であることに気付き，ｍ（ミリ）と書かれていることから，1","100㎎が１ｇ（1000㎎）の の大きさであることを考え出すのである。","これまでに学習した単位との関係等について，児童の興味・関心に基づいて，日常生活などの中で自分で調べようとする態度が育成されることが大切である。"]},"quoteEnd":0},"sansu-3-C-2":{"page":166,"name":"時刻と時間","expl":{"intro":["第２学年までに，時刻を読んだり，単位の関係を理解したりして，時刻や時間を日常生活に関連付けられるように指導してきた。第３学年では，時間の単位に着目し，日常生活の中で必要になる時刻や時間を捉える際に，数学的な見方・考え方を働かせ，日常生活に必要な時刻や時間を求めることを主なねらいとしている。","第３学年の時刻と時間の学習では，児童が秒への関心をもち，体験を通して，必要になる時刻や時間を測定して表したり，必要な時刻や時間の求め方を考察したりしようとする態度を養う。ここで育成する資質・能力は，日常生活に必要な時刻や時間を求めることや第５学年の速さの考察に生かされるものである。"],"k":["ア 時間の単位（秒）","時間の単位として，秒を指導する。また，１分間が60秒という関係を指導し，それを用いることができるようにする。秒という単位が，日常のどのような場面で用いられているかについて指導することも大切である。","時間（秒）という量は，長さ，かさ，広さと違って，直接目で見ることができないために捉えにくく，基準の大きさを決めて，それを単位にして測るという操作を直接行うことは難しい。「秒」については，10秒や60秒というまとまった時間の中で「１秒」が幾つ分あるのかを意識し，時間について理解できるようにすることが大切である。そのことに関連して，例えば，時計の秒針の動きや，♩＝60に設定したメトロノームに合わせて手をたたいたり，数を数えたりするなどして，１秒の長さについての感覚を養うことが考えられる。また，何秒間，目を閉じて片足で立っていられるか，10秒間で平仮名を何文字書けるか，60秒間で何回呼吸するかなどを測定させ，ストップウォッチに親しませながら「秒」を実感を伴うように体験することも必要である。このように，「秒」を運動などの活動と結び付けたりすることを通して，その量の感覚を捉えるようにしていく。","イ 時刻や時間を求めること","である。そのことに関連して，例えば，時計の秒針の動きや，♩=60","ここでは，日常生活で必要となる場合について，時刻や時間を求めることができトロノームに合わせて手をたたいたり，数を数えたりするなどして，","るようにする。","ついての感覚を養うことが考えられる。また，何秒間，目を閉じて","日常生活で必要となる時間については，例えば，家から学校まで歩いてかかる時いられるか，10秒間で平仮名を何文字書けるか，60秒間で何回呼吸","間や読書にかかる時間などである。","測定させ，ストップウォッチに親しませながら「秒」を実感を伴う","時刻や時間を求めることについては，実際に時計の模型の針を動かし，針が進んることも必要である。このように，「秒」を運動などの活動と結び","ことだを目通盛しりのて数，をそ数のえ量たのり感，覚数を直捉線え上るによ表うされにたし時て刻いやく時。間を読んだりすることを指や時導間すをる求。そめのる際こ，と正時（分や秒の端数の付かない時刻）や正午を区切りとして考え日常生活で必要となる場合について，時刻や時間を求めることがで","ることにも触れることが考えられる。","る。","計算によって求める場合には，日常生活で必要となる場面で指導するようにし，必要となる時間については，例えば，家から学校まで歩いてかかる","いたずらに複雑な単位の換算は避けるようにする。","かかる時間などである。"],"s":["を求めることについては，実際に時計の模型の針を動かし，針が進","数を 数 えアた  時り間，の数単直位線に上着に目表しさ，れ時た刻時や刻時や間の時求間めを方読にんつだいりてす考る察こしと，日常生活に生その際，正かす時こ（と分や秒の端数の付かない時刻）や正午を区切りとし","にも 触時れ間るの適こ切となが単考位えをら用れいるて。，時刻や時間を求めることについては，日常生活におて求けめるる時場間の合経に過はを，日捉常え生て考活えでる必こ要ととがな大る切場で面あでる指。導例すえるばよ，時う計にのし長，針が１周を超雑な単位の換算は避けるようにする。","えたり正時をまたいだりする時刻や時間を求めることについては，模型の時計の針，判断力，表現力等","の動きを観察したり，数直線上の目盛りやその間について観察させたりすることをの単位に着目し，時刻や時間の求め方について考察し，日常生活に","通して考えさせることが大切である。","こと","な単位を用いて，時刻や時間を求めることについては，日常生活に","経過を捉えて","大切である。","の長針が１周","時をまたいだ","時間を求める","は，模型の時","を観察したり，","盛りやその間","させたりする","考えさせることが大切である。","Ｄ データの活用"]},"quoteEnd":0},"sansu-3-D-1":{"page":168,"name":"表と棒グラフ","expl":{"intro":["第２学年では，身の回りにある数量を分類整理し，簡単な表やグラフを用いて表して，事象について考察することを指導してきている。","第３学年では，これらの指導を基にして，身の回りにある事象について観点を定め，データを分類整理して表やグラフに表し，データの特徴を捉え考察したり，見いだしたことを表現したりできるようにすることをねらいとしている。","ここで育成される資質・能力は，第４学年で学習する二次元の表や折れ線グラフを用いて分析することに生かされるものである。"],"k":["ア データの分類整理と表","この学年では，日時，曜日，時間や場所などの観点から分類の項目を選び，資料を目的にあった手際のよい方法で，分かりやすく整理することを通して，表の意味を理解し，表を用いて表したり，表を読んだりすることができるようにすることをねらいとしている。","また，日時の観点や場所の観点など一つの観点で作った表を幾つか組み合わせて一つの表にまとめた簡単な二次元の表を取り扱い，組み合わせて作成した表を読むこともできるようにする。","そのため，次の点に配慮するようにする。","①  目的を明らかにし，集める資料の条件を考えたり，目的にあった分類の観点を選んだりすること。","②  資料に落ちや重なりがないように項目を決めたり，資料を分類したりすること。","指導に当たっては，機械的に処理したり表を考察したりするだけではなく，児童自身が課題を明確に捉え，それに沿って資料を積極的に集め，観点を決めて分類整理していこうとする態度や能力を伸ばすよう配慮することが大切である。そのためには，資料に落ちや重なりがないか調べたり，集計に当たって誤りがないか確かめたりするなど，誤りがおきにくいような方法を工夫する活動を重視する必要がある。その際，合計欄の意味に着目させ，合計の数と資料の数が一致しているかを確かめるなど，表の知識や技能を活用できるように指導する必要がある。","なお，表については，分類の仕方や，表し方に様々な種類があるので，それぞれの特色について理解したり，目的に応じて用いたりすることができるようにすることが大切である。","イ 棒グラフの特徴と用い方","第２学年までのグラフについての指導を基に，第３学年では，棒グラフについて，数量の大小や差などを読むことに加えて，最大値や最小値を捉えたり，項目間の関係，集団のもつ全体的な特徴などを読み取ったりすることができるようにすることをねらいとしている。その際，表と関連付けながら，児童が見いだしたことを表現することを通して，データの中の数量の大きさの違いを一目で捉えることができるという棒グラフの特徴についても気付くことができるようにする。","指導に当たっては，児童の分かりやすく表そうとする工夫を生かしながら，項目の取り方や並べ方，表題の付け方などについて正しく指導する必要がある。","また，目盛りの付け方，読み方については，ものさしを用いた測定のときの手続きや数直線の目盛りの付け方を生かす指導とも関連して，最小目盛りが１，10，100に当たるものを中心とし，「内容の取扱い」の（8）にあるように，目的によっては最小目盛りが２，５又は20，50などに当たるものについても，読んだりかいたりできるようにする。","その際，同じグラフを異なる目盛りの付け方で表した複数のグラフを比較したり，何種類かのグラフ用紙の中から適切な用紙を選択したりする活動を通して，グラフ用紙の大きさなどに応じて目盛りの付け方を工夫し，目的にあった目盛りを用いることができるようにする。","また，「内容の取扱い」の（8）には，「複数の棒グラフを組み合わせたグラフなどにも触れるものとする」と示している。一つの観点で作成した表を組み合わせた表について棒グラフに表す際，複数の棒グラフを組み合わせたグラフができることにも気付かせ，このような棒グラフを読むことができるようにする。"],"s":["ア  データを整理する観点に着目し，身の回りの事象について表やグラフを用いて考察して，見いだしたことを表現すること","データを整理する観点に着目すること","データを整理する観点に着目するとは，データをどのように分類整理すればよいかについて，解決したい問題に応じて観点を定めることである。","例えば，学年全体で遊び調べをして，児童の学級，性別，好きな遊びや嫌いな遊び，よくする遊びやしたことがない遊びなど様々なことを調べたデータがあった際に，分類整理する観点によって特徴として捉えられることは変わってくる。どの観点で整理することでどんな特徴が捉えられるか考察することが必要になってくる。","身の回りの事象について表やグラフを用いて考察すること","身の回りの事象について表やグラフを用いて考察するとは，自分たちの生活する身の回りの様々な事象における，解決したい問題に応じて定めた観点によって，データを表に分類整理したり，グラフにまとめたりすることで特徴や傾向を捉え考察することである。","例えば，遊び調べのデータについて，学級ごとに好きな遊びに違いはあるのかを分析するという観点で，下のように表に分類整理したり棒グラフに表したりすることで，どちらのクラスも「ハンカチ落とし」や「いす取りゲーム」は好きな人が多いといった特徴を捉えることができ，その背景として例えば「室内で皆が遊べる遊びは，ほかにあまりないからだろう。」といった考察をしていくようにする。","１組の好きな遊び ２組の好きな遊び １組と２組の好きな遊び","（人） （人） （人）種類 人数 種類 人数 種類 １組 ２組 合計ハンカチ落とし 7 ハンカチ落とし 5 ハンカチ落とし 7 5 12いす取りゲーム 6 いす取りゲーム 6 いす取りゲーム 6 6 12かくれんぼ 5 かくれんぼ 3 かくれんぼ 5 3 8おにごっこ 3 おにごっこ 4 おにごっこ 3 4 7かんけり 2 かんけり 3 かんけり 2 3 5合計 23 合計 21 合計 23 21 44見いだしたことを表現すること","見見いいだだししたたここととをを表表現現すするることとは，表やグラフから特徴や傾向を捉えたり，考察し た見りいしだたしこたとこをと，を表表の現どすのると部は分，か表らや，グあラるフいかはらグ特ラ徴フやの傾ど向のを捉部え分たかりら，そ考の察よしうにた考りえしたたりこしとたをの，か表をの，どほのか部分のか人らに，もあ分るかいるはよグうラにフ伝のえどるのこ部と分かでらあそるの。ように考その際，部分と部分や，複数のグラフを比べ，同じところや似ているところ，えたりしたのかを，ほかの人にも分かるように伝えることである。","少し違うところや大きく違うところなどを見いだし，表現できるようにするととその際，部分と部分や，複数のグラフを比べ，同じところや似ているところ，少もに，伝え合うことで様々な考えがあることに気付くことができるようにする。し違うところや大きく違うところなどを見いだし，表現できるようにするとともに，上の例では，適切なグラフを用いてそのグラフを示しながら，ハンカチ落とし伝え合うことで様々な考えがあることに気付くことができるようにする。","が全体的に人気があることや，ハンカチ落としとかくれんぼはクラスによって違上の例では，適切なグラフを用いてそのグラフを示しながら，ハンカチ落としがいがあることなどを学級内で発表して伝えることなどができる。","全体的に人気があることや，ハンカチ落としとかくれんぼはクラスによって違いがあることなどを学級内で発表して伝えることなどができる。"]},"quoteEnd":0},"sansu-4-A-1":{"page":181,"name":"整数の表し方","expl":{"intro":["第３学年までに，万の単位について，数のまとまりに着目し，大きな数の比べ方や表し方を考え，日常生活に生かすことを指導してきた。","第４学年では，億や兆といった新しい単位について指導し，４桁ごとに新たな単位を取り入れていることを知り，整数についての表し方や読み方について，一応のまとめをするとともに，十進位取り記数法についての理解を深めるようにする。ここで育成される資質・能力は，数学や日常生活で数の大きさを捉えたり計算したりするなどの考察に生かされるものである。"],"k":["ア 億，兆の単位","1000万より大きい数の言い表し方は，1000万の10倍のときに億という単位を取り入れ，さらに，1000億の10倍のときに兆という単位を取り入れている。このように，我が国の命数法（一，十，百，千，万などの数詞を用いて数を表す方法）では，一，十，百，千をそのまま繰り返して用い，４桁ごとに，万，億，兆という新しい単位を取り入れている。このため，少ない単位で大きな数を唱えたり表したりすることができる。","千 百 十 一 千 百 十 一 千 百 十 一 千 百 十 一","兆 億 万","整数は，十進位取り記数法によって表されているが，これは，次の事柄を基本的な原理としているものである。","①  それぞれの単位の個数が10になると新しい単位に置き換える。（十進法の考え）","②  それぞれの単位を異なる記号を用いて表す代わりに，これを位の位置の違いで示す。（位取りの考え）","この記数法の仕組みによると，どのような大きな数でも，用いる数字は０，１，２，３，４，５，６，７，８，９の10個で表すことができる。その考えのよさについても理解できるようにする。","「内容の取扱い」の（1）では，３桁ごとに区切って表すことについて述べている。国の予算や人口などの大きな数を表す際に，３桁ごとに「，」を用いて区切って表すことがある。そのように表された数についても読めるよう指導する。"],"s":["ア  数のまとまりに着目し，大きな数の大きさの比べ方や表し方を統合的に捉えるとともに，それらを日常生活に生かすこと","大きな数の大きさの比べ方や表し方を統合的に捉えること","ここでは，一，十，百，千という４桁の数のまとまりに着目し，それが命数法として単位を用いて表されることを使って，大きな数の唱え方や表し方を考えていく。例えば，９桁を超えるような大きな数については，そのままでは読み間違いやすいので，どのようにすれば読みやすくなるかを児童が自分で調べていくことができるようにすることが大切である。第３学年までの学習を生かして，４桁に区切るなどして万や億の単位の幾つ分かを考えることができるようにする。","また，数が漢数字で表されている場合には，単位を比べることや，同じ単位の数の大きさをみれば，数の大きさを比べることができることに気付くようにする。このようにして一，十，百，千という繰り返しに気付き，今までの学習と統合的に捉えて，さらに大きな数についても同じように考えられるようにする。","日常生活に生かすこと","数の範囲が億や兆になると，数の大きさを捉えにくくなるので，日常生活での具体的な場面を取り上げるよう配慮する。","第４学年では学習の範囲が広がり，新聞等社会一般の情報に対する視野も広がってくる。それらを読んだり，その数値を理解したりするなど，ここでの学習を生活や学習に生かそうとする態度が育成されることが大切である。"]},"quoteEnd":0},"sansu-4-A-2":{"page":183,"name":"概数と四捨五入","expl":{"intro":["第３学年までに，計算の結果を見積もったり，測定値を読み取ったりする際におよその見当を付けることを経験してきている。","第４学年では，概数の意味を理解し，数を手際よく捉えたり処理したりすることができるようにするとともに，場面の意味に着目して数の捉え方を考え，目的に応じて概数を用いることができるようにする。また，概数を用いると数の大きさが捉えやすくなることや，物事の判断や処理が容易になること，見通しを立てやすくなることなどのよさに気付き，目的に応じて自ら概数で事象を把握しようとする態度を養うようにする。","ここで育成される資質・能力は，除法の商の処理や，グラフをかく際に目盛りの単位に数を合わせる場合に用いるほか，見当を付けるなど数を用いた判断や考察に広く生かされるものである。"],"k":["ア 概数が用いられる場合","概数を用いる場合には，次のようなものがある。概数を用いるときは，その目的を明確にしながら，用い方を理解できるようにすることが大切である。","①  野球場の入場者数を約何万何千人と概数で表現して伝えるように，詳しい数値が分かっていても，目的に応じて数を丸めて表記する場合。","②  都市の人口を棒グラフを用いて比較するように，棒の長さなどで数のおよその大きさを表す場合。","③  ある時点での日本の人口のように，真の値を把握することが難しく，概数で代用する場合。","イ 四捨五入","四捨五入は，概数を作る場合に，最も広く用いられる。その方法は，測定で端下の数を最も近い目盛りで読み取る考えによっているということができる。この四捨五入では，ある単位未満のところを処理する場合に，その単位の一つ下の位の数が４以下であるか５以上であるかをみるだけでその処理ができる。例えば，42948を四捨五入して千の位までの概数で表す場合，千の一つ下の位である百の位にある数「９」を見て，切り上げになると判断し，43000と表す。","数直線のような図を用いて，概数にしても，数の大きさが大きくは変わらない（例えば4320を上から２桁の概数にする際に43や430にはならない）ことを実感的に理解できるよう配慮することが大切である。","また，以上，以下，未満の用語とその意味について指導する。例えば，「５以下」は５と同じか，それより小さい数を表す一方，「５未満」は５を含まず５より小さい数を表すことを確認する。","ウ 四則計算の結果の見積り","加法，減法，乗法，除法を用いる具体的な問題の場面で，目的に応じて和，差，積，商を概数で見積もることを指導する。「内容の取扱い」の（2）に示したとおり，計算の結果の見積りで暗算を活用する。また，四則計算の結果について，和，差，積，商という用語を使えるようにする。","目的に応じて用いるとは，何のために見当を付けるのかそのねらいを明らかにし，ねらいに応じた詳しさの概数にしたり，切り上げや切り捨てを用いて大きく見積もったり小さく見積もったりすることである。","問題場面での必要性に応じて，必要な範囲内の詳しさでの概数にしたり，切り上げや切り捨てによって大きく見積もったり小さく見積もったりする機会を設けることが大切である。"],"s":["ア  日常の事象における場面に着目し，目的に合った数の処理の仕方を考えるとともに，それを日常生活に生かすこと","日常の事象における場面に着目し，目的に合った数の処理の仕方を考えること","日常の事象の問題を解決する場合，解決の目的に合った処理の仕方を考えることが大切であり，その問題場面自体に着目する必要がある。","例えば，アアのように概数を用いる場合，どの程度の概数にすればよいか，目的に合った数の処理の仕方を考え，判断することが大切である。例えば，グラフをかく場合，紙の大きさなどによって最小目盛りが決まる。この目盛りの取り方により，何桁の概数にするかを判断できるようにする。","また，四則計算の結果の見積りについて，結果の見通しを立てたり，大きな誤りを防いだりするよさに気付かせたりするとともに，目的に合った見積りの仕方を考える。例えば，ある物を千円で買うことができるかどうかを見積もる場合，値段を大きくみて（切り上げて）概算することが望ましい。","このように，処理としては「どの位までの概数にするのか。」「切り上げるのか，切り捨てるのか，四捨五入するのか。」ということを，児童自らが判断する場面や，それが適切であるかどうかを振り返る場面を設けることが大切である。","概数を日常生活に生かすこと","概数を用いる場合，対象となる数について，四捨五入等の処理をし，その処理した数を用いて計算する。このとき，そのまま計算するときと比べると処理の回数が増えることから，概数を用いるよさを感じにくい場合がある。それゆえ，形式的に処理するのみでなく，日常生活の場面の目的に応じて，概数を用いることで，より能率的に処理できることに気付くようにする。また，他教科等の学習場面や新聞記事などでは，概数が多く用いられている。概数を読み取ったり，自ら概数を用いる場面を設けたりするなど，概数を日常生活に生かすよう配慮する。","なお，概算によって積，商を見積もることは，除数が２位数の除法における商の見当を付ける場面において重要な役割を担うことに留意して指導することが大切である。"]},"quoteEnd":0},"sansu-4-A-3":{"page":186,"name":"整数の除法","expl":{"intro":["第３学年では，除法について，数量の関係に着目し，除法の意味や計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすることなどを指導してきている。第４学年では，整数の除法の筆算での計算の仕方について指導し，多数桁の除法が基本的な計算を基にしてできることを理解させるともに，桁数の多い計算の仕方を発展的に考えるなど整数の計算の能力を定着させ，それを生活や学習に用いる態度を育むようにする。","ここで育成される資質・能力は，第５学年の小数の計算の考察などに生かされるものである。","なお，「内容の取扱い」の（3）では，「第１学年から第４学年までに示す整数の計算の能力を定着させ，それを用いる能力を伸ばすことに配慮するものとする」と示している。計算を用いる能力には，基礎的・基本的な計算の技能に習熟することや，計算を生活や学習に活用することなどが含まれる。これまでに児童が身に付けてきた計算の技能は，生活や学習で必要となる計算の基になるとともに，より複雑な計算を進めるための基になるものでもある。"],"k":["ア 除数が１位数や２位数で被除数が２位数や３位数の除法の計算の仕方","除法について，第３学年では，12÷３，13÷３などのような乗法九九を１回用いて商を求める計算及び80÷４，69÷３のような簡単な２位数を１位数で割る計算を扱ってきている。","第４学年では，除数が１位数や２位数で被除数が２位数や３位数の除法について考える。除数が１位数の場合には，72÷３や962÷４などのような２位数や３位数を１位数で割る場合を取り上げ，その筆算形式について理解できるようにする。72÷３の場合，72を70と２に分け，70を10のまとまり７個とみて，７÷３＝２あまり１と計算する。これは10のまとまりが２個できて10のまとまりが１個あまることを意味している。そこであまりの10と２を合わせた12について３で割ると４となることから，結果として72÷３の商は20と４を合わせた24となる。この見方は，筆算の仕方に結び付くものである。","除数が２位数の場合には，98÷23や171÷21のように２位数，３位数を２位数で割る計算を指導する。数の相対的な大きさについての理解を活用しながら，各段階の商の見当を付けていく。例えば，171÷21の場合，10を基準とみるとおよそ17÷２とみることができ，商がおよそ８であると見当を付けることができる。計算の見積りはここで生かされる。なお，見当を付けた商が大きかったり小さかったりして修正しなければならない場合，見当を付けた商を修正していく手順を丁寧に取り扱うことが重要である。","「内容の取扱い」の（2）では，簡単な暗算について述べている。簡単な暗算としては，48÷２のような，２位数と１位数の乗法の逆の除法などを指導し，児童の過度の負担とならないようにする。","イ 除法の計算を用いること","除数が１位数や２位数で被除数が２位数や３位数の場合の計算の技能については，確実に身に付け，必要な場面で活用できるようにする必要がある。","例えば，「96ｍのリボンは，24ｍのリボンの何倍の長さでしょう。」などのように「基準量」，「比較量」から「倍」を求める場合についても除法が用いられる。さらに，「黄色のリボンの長さは72ｍで，白いリボンの長さの４倍です。白いリボンの長さは何ｍでしょう。」のように「比較量」，「倍」から「基準量」を求めるような場合についても除法が用いられる。","また除法は，例えば，重さが４㎏長さが２ｍである棒の１ｍの重さを求める場合，２㎏で400円のものの１㎏の値段を求める場合など，人数の場面ではなく，比例関係を仮定できる，伴って変わる二つの数量がある場合にも用いられる。このような場合も，図を用いるなどして等分除や包含除とみられることに気付かせるなどして除法が用いられることを指導する。","ウ 被除数，除数，商及び余りの間の関係","余りのある除法については，第３学年で指導している。そこでは，例えば「30÷４＝７あまり２」と表すことを取り扱ってきている。","第４学年では，被除数，除数，商，余りの間の関係を調べ，次のような式の形に表すことを指導する。","（被除数）＝（除数）×（商）＋（余り）","余りは除数より小さいことに注意する必要がある。また，被除数，除数，商，余りの関係を，計算の確かめなどに用いることができるようにする。","エ 除法に関して成り立つ性質","除法に関して成り立つ性質として，「内容の取扱い」の（4）では，「除数及び被除数に同じ数をかけても，同じ数で割っても商は変わらないという性質などを取り扱うものとする」と示している。これを式で表すと次のようになる。","a÷b＝cのとき，","（a×m）÷（b×m）＝c","（a÷m）÷（b÷m）＝c","なお，商の見当を付ける際，およその数にして見積もるときにも，除法の性質を用いているといえる。この除法の性質は，第５学年の小数の除法の計算の仕方を考えたり，第６学年の分数の除法の計算の仕方を考えたりするときにも用いることができる。","他にも，（a×m）÷b＝c×m，（a÷m）÷b＝c÷mなど除法に関して成り立つ性質があるが，このような性質は児童の実態に合わせて取り上げてもよい。"],"s":["ア  数量の関係に着目し，計算の仕方を考えたり計算に関して成り立つ性質を見いだしたりするとともに，その性質を活用して，計算を工夫したり計算の確かめをしたりすること","計算の仕方を考えること","除数が１位数や２位数で被除数が２位数や３位数の場合の除法の計算の仕方を考えていくには，例えば75÷３の75を70と５や60と15とみたり70を10の七つ分とみたりするなど第３学年で学習した計算の仕方を考える際の数の見方を生かすことができる。また，96÷24の計算についても，90÷20とみたり100÷20とみたりすることで，商の見当を立てるなど，既習の計算を用いることができる。また，除法の場合には乗法や減法などの計算が使われていることにも着目できるようにし，児童が計算の仕方を主体的に考えられるようにする。","児童がこれまでに身に付けてきた計算の意味や計算の仕方などを活用して，桁数の多い計算について，その計算の仕方を発展的に考える力が育成されることが大切である。","計算に関して成り立つ性質を見いだすこと","除法に関して成り立つ性質については，児童が自分で調べていけるようにすることが大切である。そのために，商が同じになる除法の式を幾つもつくる活動を取り入れた指導をする必要がある。その中で，例えば350÷50の計算は35÷５として考えることができることに児童自らが気付き，ほかにも調べていこうとするようになる。このように，除法に関して成り立つ性質を帰納的に考え，性質として言葉でまとめていくことが大切である。","計算を工夫したり計算の確かめをしたりすること","除法に関して成り立つ性質を用いると，計算の工夫を考えることができる。例えば，6000÷30の計算は除数と被除数を10で割ることで，600÷３として考えることができる。また，300÷25の計算は除数と被除数に４をかけることで，1200÷100と考えることができる。こうした計算の工夫は，整数の除法だけでなく，後の学年で学習する小数や分数の除法の計算の仕方を考えるときにも活用していくことができる。","また，被除数，除数，商，余りの間の関係を用いることで，除法の計算の確かめをすることができる。","このように，数量の関係に着目し計算について考えることによって，計算が簡単になったり，計算の確かめをしたりすることができるという数学のよさに気付き，これらの方法を生活や学習に活用しようとする態度が育成されることが大切である。"]},"quoteEnd":0},"sansu-4-A-4":{"page":190,"name":"小数の仕組みとその計算","expl":{"intro":["第３学年では， の位までの小数について，小数でも数の大きさを比べたり計10","算したりできるかどうかを考えるとともに，小数を日常生活に生かすことを指導してきた。","第４学年では，小数が整数と同じ仕組みで表されていることの理解を深めるとともに，ある量の何倍かを表すのに小数を用いることを知らせる。また計算については，加法及び減法を指導するとともに，乗法及び除法について，乗数や除数が整数である場合について指導することにより，小数の四則計算の可能性が広がったことを感得させつつ，小数の理解を深めていくことを主なねらいとしている。","ここで育成される資質・能力は，小数の乗法及び除法や分数の乗法及び除法の計算の意味を考えたり，計算の仕方を見いだしたりする際などの考察に生かされるものである。"],"k":["ア 小数を用いた倍","第３学年までに，整数を用いた倍のみを扱い，ある量の二つ分のことをある量の２倍というなどと，「倍」の意味を「幾つ分」として指導してきている。第４学年では，ある量の何倍かを表すのに小数を用いてもよいことを指導し，「基準量を１としたときに幾つに当たるか」という拡張した「倍」の意味について理解できるようにする。例えば４ｍを基にすると，８ｍは４ｍの二つ分なので２倍に当たり，12ｍは４ｍの３倍に当たる。このとき10ｍは４ｍの２倍と３倍との間の長さであり，整数では表せない。２倍の８ｍに対して２ｍのはしたがあるので小数を用いて表すことを考える。基準となる１に対する大きさ４ｍを10等分し，0.1に当たる大きさである0.4ｍを用いると，２ｍは0.4ｍの五","つ分に当たる。このことから10ｍ","は４ｍを１としたときちょうど2.5","に位置付いていることが分かる。そ","こで，このことを「10ｍは４ｍを１","とすると2.5に当たる」といい，こ","れを2.5倍の意味として指導する。８ｍは４ｍを１とすると２に当たるので，今まで２倍としていたこととも整合的な意味となっている。","このように，小数は量を表すだけでなく，倍を表す場合があることを理解できるようにする。","イ 小数と数の相対的な大きさ","第３学年では の位までの小数を指導してきた。第４学年では， や な10  100   10001","どを単位とした小数を用いることにより， の単位に満たない大きさを表すこと10","ができることを指導する。また，小数は，整数と同じように十進位取り記数法によっ1","ているので，ある位の右の位は の大きさを単位にしており，ある位の左の位は10","10倍の大きさを単位にしている。このことを理解するとともに，小数の大小比較1","や計算も整数と同じ考え方でできることに気付くことが大切である。なお， の100位の代わりに，小数第２位と呼ぶことがある。","また，小数の場合についても，数の相対的な大きさについて理解を深めておくことが大切である。相対的な大きさは，ある位の単位に着目してその幾つ分とみる見方である。例えば，1.68は0.01が168集まった数とみる見方であり，このような見方を養っておくことは，小数の意味についての理解を深めるばかりでなく，小数の乗法及び除法の計算の仕方を考える上で有効に働く。","ウ 小数の加法，減法","第３学年では， の位までの小数の加法及び減法を指導している。第４学年では，10","の位までの小数などに範囲を広げて，加法及び減法の計算ができるように指導100","する。","小数の加法及び減法の計算は，小数点を揃えて位ごとに計算し，小数の仕組みの理解の上に立って行うようにし，整数と同じ原理，手順でできることを理解できるように指導する。","小数の計算の仕方は，0.1は の単位が10個であるから，繰り上がり，繰り下が100","りのある計算が，これまでの の位までの計算のときと同じようにできる。","例えば，3.7＋2.48の筆算をするとき，0.01を基にすると，整数のときと同じ原理でできる。しかし，位を揃えるのではなく，末尾を揃えて計算する誤答が多くみられるので，下記のように小数点を基に，位を揃えてかき，空位を０と考えれば，位ごとに計算ができることを指導する。このように，整数と同じ仕方で計算を行う。3.7","＋2.4 8","6.1 8","エ 乗数や除数が整数である場合の小数の乗法及び除法","乗数や除数が整数である場合についての小数の乗法及び除法の計算の指導では，その計算の意味を理解できるようにする。乗法は，一つ分の大きさが決まっているとき，その幾つ分かに当たる大きさを求める場合に用いられる。つまり，同じ数を何回か加える計算と考える。例えば，0.1×３ならば，0.1＋0.1＋0.1の意味である。累加の簡単な表現として，乗法による表現を用いることができる。さらに，乗法の意味は，基準にする大きさとそれに対する割合から，その割合に当たる大きさを求める計算と考えることができる。除法の意味は，乗法の逆で，割合を求める場合と基準にする大きさを求める場合で説明できる。","なお，「内容の取り扱い」の（5）については，「整数を整数で割って商が小数になる場合も含めるものとする」と示している。整数を整数で割ると，結果が整数になる場合とならない場合がある。整数で割りきれないとき，さらに，割り進むことができることを指導する。このとき，６Ｌを４等分する場面と６ｍは４ｍの何倍かを求める場面を考えることができる。","後者の場合は倍を表す数が小数になる。このとき，倍を求める除法の意味について考え直す機会となる。第３学年のときa÷bという包含除の除法の意味を「ある数量aがもう一方の数量bの幾つ分であるかを求めること」と捉えていた。商が小数の場合はこの意味を拡張し，「bを１とみたときにaが（小数も含めて）幾つに当たるかを求めること」と捉え直すことになる。"],"s":["ア  数の表し方の仕組みや数を構成する単位に着目し，計算の仕方を考えるとともに，それを日常生活に生かすこと","乗数や除数が整数である場合の小数の乗法や除法について，計算の仕方を考える際に，乗法における積の小数点の位置や除法における商の小数点の位置などについて，整数の場合と比べながら考えられるように指導する。","例えば，1.2×４の計算では，1.2は0.1を単位とするとその12個分であるから，12×４で，0.1が48個分と考えることができる。また，31.6÷４の計算では，31.6は0.1の316個分であるから，316÷４で，0.1の79個分と考えられる。このように，数を構成する単位に着目させ，指導することが大切である。また，乗法や除法の性質と関連付けて計算の仕方について考えることができるようにすることも大切である。","また，身の回りには，小数で表された量が多くある。これらの量を合わせたり，差を求めたりすることも多い。このような場面を捉えて，小数やその計算を日常生活で生かそうとする態度を養うことが大切である。"]},"quoteEnd":0},"sansu-4-A-5":{"page":193,"name":"同分母の分数の加法，減法","expl":{"intro":["第３学年では，１より小さい分数について，数のまとまりに着目し，分数でも数を比べたり計算したりできるかどうかを考えることを指導してきた。","第４学年では，分数の意味や表し方についての理解を深めるとともに，同分母の分数の加法及び減法の意味について理解し，それらの計算ができるようにすることをねらいとしている。また，分数を構成する単位（単位分数）に着目し，大きさの等しい分数を探したり，計算の仕方を考えたりするとともに，それを日常生活に生かそうとする態度や能力を高めることをねらいとしている。","ここで育成される資質・能力は，第５学年の異分母の分数の加法及び減法について，分数の意味や表現に着目した計算の仕方などの考察に生かされるものである。"],"k":["ア 大きさの等しい分数","分数については，例えば と のように，表し方が違っても大きさの等しい分２   ４","数がある。第４学年では，簡単な場合について，大きさの等しい分数があることに着目できるようにする。簡単な場合とは，例えば，数直線上に表した複数の分数について，その位置に着目し，位置が等しいことから，大きさが等しく表し方の違う分数があることを知るという程度を指している。","なお，分母を通分して大小を比較することは，第５学年で指導する。","イ 分数の加法，減法","和が１より大きい同分母の分数の加法及び減法の計算の仕方を理解し，それらの計算ができるようにする。","その際，真分数，仮分数，帯分数の意味と用語について指導し，真分数をはじめ，仮分数や帯分数の加法及び減法についても指導する。","真分数とは， ， のように分子が分母より小さい分数のことである。仮分数２   ５","とは， ， のように分子と分母が等しいか，分子が分母より大きい分数のこと２   ５","である。また，帯分数とは，1 のように整数と真分数を合わせた形の分数のこ５","とである。1 は，１と を加えた分数である。","１より大きい仮分数は，帯分数で表すと，その大きさが捉えやすくなる。例えば，９  １","は，2 に直すと，２より少し大きい数であると分かる。このようにして，分４   ４","数の大きさについての感覚を豊かにするように指導する。","真分数や仮分数で表すと，その計算が進めやすいという場合がある。例えば，第６学年で指導する分数の乗法及び除法については，帯分数よりも仮分数で表しておく方が計算を進めやすくなる。","分数の加法及び減法の計算の指導に当たっては，単位分数の個数を求めることを理解できるようにする。","例えば，真分数と真分数の加法である ＋ の計算では， が７個あるので，５   ５   ５","結果は と表すことができる。このとき，次ページにあるような図をかいて と５   107","考える児童がいることがある。色が付いている部分が全体の であることからそ10","のように考えてしまうのである。このようなときは問題に立ち返り， Ｌと Ｌ５   ５を合わせた量を求めていたことや１Ｌが図のどこに当たるのかを確認することで，１  ７","図の一つの長方形が Ｌになっていることから，色の付いた部分が Ｌであるこ５   ５","とを確認する。","１Ｌ １Ｌ"],"s":["ア  数を構成する単位に着目し，大きさの等しい分数を探したり，計算の仕方を考えたりするとともに，それを日常生活に生かすこと","縦の長さ(㎝) １ ２ ３ ４ ５ ６","数を構成す面る積単位に(㎠着)目６し，12大18き2さ4 の30等36しい分数を探すこと","単位分数の個数に着目することによって，同分母どうしの場合は数の大きさを比１  ２  ４","べることができる。また，分母が異なる場合であっても， と ， などの場合２   ４   ８","は，テープの図などを用いたり，数直線上に並べた分数を観察することを通して大きさの等しい分数を探すことができる。","数を構成する単位に着目して，分数の計算の仕方を考えること","単位分数の個数に着目することによって，同分母の分数の加法及び減法は整数の場合と同様に処理できる。真分数どうしの和が１までの加法とその逆の減法など簡単な場合について振り返りながら，同分母の分数の加法及び減法の意味や計算の仕方について考えることができるようにする。","単位分数の個数に着目することによって，分数はこれまでに学んできた整数と同じように，大きさを比べたり加法及び減法の計算をしたりすることができるようになる。","真分数の加法の考え方を基に，仮分数の加法についても同様に考えることができ７  ６  １  13  ３","る。例えば， ＋ の計算では， が13個あるので，結果は， 又は2 と５   ５   ５   ５   ５","表すことができる。","同様に，1 ＋2 のような帯分数どうしの加法及び減法の計算の仕方を考え５   ５","ることができる。計算の仕方としては，（１＋２）＋（ ＋ ）のように帯分数を整５   ５","数部分と分数部分に分け，整数部分どうし，分数部分どうしを計算した後に合わせ６  13","るという考え方と， ＋ のように帯分数を仮分数に直してから計算するという５   ５","考え方がある。","このように，これまでに学習したことと関連付けて考える際に，数学的な見方・考え方を働かせることで，他にも生かそうとする態度や習慣が育まれる。","分数の大きさや計算について考えたことを日常生活に生かすこと","第３学年で学習した時刻や時間の計算は，分母が60や６の分数の計算として処理できるなど，分数の計算が日常の生活にも使えることに気付くようにする。"]},"quoteEnd":0},"sansu-4-A-6":{"page":196,"name":"数量の関係を表す式","expl":{"intro":["第３学年までに，加法，減法，乗法，除法について，式を用いて表したり，式を読み取ったりすることを指導している。第３学年では，第２学年の乗法九九の指導を踏まえ，乗法の交換法則，結合法則，分配法則について式に表して整理し，数量の関係を表す式を活用してきている。","第４学年では，四則の混合した式や（ ）を用いた式について理解すること，数量の関係を一般的に捉え公式にまとめて用いること，□，△などを用いて数量の関係を式に表すことが主な内容となる。","数量の関係を式に表したり，式を読み取ったりする力を伸ばすとともに，計算の順序についてのきまりなどを理解し，適切に式を用いることができるようにすること，さらに，既習の式と，具体的な場面での立式などを基に，公式についての考え方を身に付けさせることをねらいとしている。","第５学年では，本学年で学習した□，△などを用いて数量の関係を簡潔に表す式の学習を基に，式を用いて伴って変わる２つの数量の変化や対応の特徴を考察する。"],"k":["ア 四則の混合した式や（ ）を用いた式","第４学年では，単に式に慣れさせるだけではなく，数量の関係を四則の混合した式や，（ ）を用いた式に表し，式を適切に用いることができるようにすることをねらいとする。","四則の混合した式や（ ）を用いた式は，前学年までにも指導してきているが，一つの数量を表すのに（ ）を用いることや乗法，除法を用いて表された式が一つの数量を表したりすることを確実に理解できるようにすることが主なねらいである。このことについて，いろいろな場面や問題で式に表したり，式から場面や一般的な関係を読み取ったりすることを通して，理解できるようにしていく。","指導に当たっては，乗法，除法を加法，減法より先に計算すること，（ ）の中を先に計算することなどのきまりがあることを，具体的な場面に照らして理解できるようにし，習熟を図る。さらに，四則を混合させたり（ ）を用いたりして一つの式に表すことには，数量の関係を簡潔に表すことができるなどのよさがあることが分かるようにし，四則を混合させたり（ ）を用いたりして一つの式に表すことができるようにすることが大切である。","イ 公式","公式とは数量の関係を簡潔かつ一般的に表したものである。第４学年で取り扱う公式とは，一般に公式と呼ばれるものだけに限らず，具体的な問題で立式するときに自然に使っているような一般的な関係を言葉でまとめて式で表したものも指している。公式については，数量を言葉で表しているということの理解と，言葉で表されているものにはいろいろな数が当てはまるということの理解が大切である。","公式としては，第４学年では（長方形の面積）＝（縦）×（横）（又は（横）×（縦））といった面積の公式が取り上げられている。公式は，どんな数値に対しても成り立つ一般的な関係であることを理解できるようにする。そして，（縦）と（横）から（面積）が求められるという見方に加えて，（面積）と（横）から（縦）を求めることもできるというような，公式の見方ができるようにすることも大切である。","さらに，この公式から面積を求めるには縦と横の長さを知ればよいといった数量の依存関係を表していることが分かる。また，縦が10㎝のとき，横を１㎝，２㎝，３㎝，…と１㎝ずつ増えると，面積は10㎠ずつ増えるといった関数関係を表しているという見方ができるようにすることも大切である。","ウ □，△などを用いた式","第３学年では，問題を解決するために，未知の数量を□などの記号を用いて表現することにより，文脈どおりに数量の関係を立式し，□に当てはまる数を調べることができるように指導してきている。","第４学年では，これまでの理解を基に，変量を表す記号として□，△などを用いた式を適切に用いることができるようにすることをねらいとしている。","第４学年で，□，△などを用いた式を取り扱う場合としては，例えば，正方形の一辺の長さと周りの長さの間の関係を□×４＝△と一般的に表す場合が考えられる。このように変量を□，△などを用いて式に表すと数量の関係を簡潔に表すことができる。","指導に当たっては，□，△などの記号にはいろいろな数が当てはまり，□，△の一方の大きさが決まれば，それに伴って，他方の大きさが決まることについての理解が深まるよう配慮する必要がある。","また，□，△などを用いた式は，四則に関して成り立つ性質についてまとめたり説明したりする場合にも活用できる。その際，□，△など２種類以上の記号を同じ式の中で用いる場合には，「同じ記号には，同じ数を入れる」と約束することについて知らせておくことが必要である。そして，□，△などの記号を用いると，数量の関係や計算の法則を簡潔，明瞭，的確に，また，一般的に表すことができるというよさに気付くことができるよう配慮することが大切である。"],"s":["ア  問題場面の数量の関係に着目し，数量の関係を簡潔に，また一般的に表現したり，式の意味を読み取ったりすること","問題場面の数量の関係に着目し，数量の関係を簡潔に，また一般的に式に表すこと","公式については，幾つもの数量の組を作って，数量と数量の間に共通するきまりや関係を見付け出し，それを一般化させて言葉を用いて表し，公式を作り上げていく過程を大切にする必要がある。また，公式を用いて数量の関係を表したり，具体的な問題場面を読み取ったりする数学的活動が重要である。これらの数学的活動を通して，数量の関係を一般的に捉えることができる公式のよさに気付くことができるように配慮する。第４学年の面積の公式を導いていくような一般化の考えは，数学や様々な分野でよく使われる大切な考えである。","問題場面の数量の関係に着目し，式の意味を読み取ったりすること","問題場面を四則の混合した式や（ ）を用いた式に表す際，式は計算の結果を求めるための手段だけでなく，思考の筋道を表現する手段としても用いられることに気付かせ，式のよさを捉えさせるようにする。","例えば，「500円玉をもって買い物に行き，150円のジュースと260円のパンを買いました。おつりはいくらですか」という問題がある。次のように式に表すことができる。","500−（150＋260）＝90  ジュースとパンをまとめて買った場合","500−150＝350 350−260＝90 ジュースとパンを別々に買った場合","もしも，500円玉１枚ではなく，100円玉５枚をもって行ったとすると，（200−150）＋（300−260）＝90と表すこともできる。場面を変えると，どんな式になるかを考え，伝え合うことで，数量の関係や思考の過程を表したり，式を読み取ったりする力を伸ばすことが大切である。"]},"quoteEnd":0},"sansu-4-A-7":{"page":199,"name":"四則に関して成り立つ性質","expl":{"intro":["第３学年までに，加法や乗法の計算の仕方を考えたり計算の確かめをしたりすることの指導を通して，具体的な場面において，交換法則，結合法則，分配法則が成り立つことについて学習してきている。","第４学年では，これまでに指導してきた数と計算の範囲において，四則に関して成り立つ性質を見いだし，それらを一般的に成り立つ計算として式にまとめ，必要に応じて活用できるようにすることがねらいである。","第５学年以降，計算法則は，小数，分数へと適用する範囲が拡張されていく。"],"k":["ア 四則に関して成り立つ性質","第４学年では，四則に関して成り立つ性質についての理解を深めるようにする。内容の取扱い（6）にあるように，ここで取り上げる四則に関して成り立つ性質は，交換法則，結合法則，分配法則である。","交換法則，結合法則，分配法則とは，次の式で表される法則である。","（交換法則）  （分配法則）","□＋△＝△＋□  □×（△＋○）＝□×△＋□×○","□×△＝△×□  □×（△−○）＝□×△−□×○","（□＋△）×○＝□×○＋△×○","（□−△）×○＝□×○−△×○","（結合法則）","□＋（△＋○）＝（□＋△）＋○","□×（△×○）＝（□×△）×○","第４学年では，四則に関して成り立つ性質について，□や△などの記号を用いた式に一般的に表し，整理して理解するとともに，これまでに指導した小数の加法に関しても成り立つことを確かめられるようにする。"],"s":["ア  数量の関係に着目し，計算に関して成り立つ性質を用いて計算の仕方を考えること","整数の計算に関して，交換法則，結合法則，分配法則を活用して計算を簡単に行う工夫をしたり，乗法の筆算形式の中に分配法則を見付けたりするなど，四則に関して成り立つ性質についての理解を深め，必要に応じて活用できるようにする。計算に関して成り立つ性質を活用する際には，「たし算では，たされる数とたす数を入れ替えて計算しても答えは等しいから。」というように言葉で理由を説明させるなどして，少しずつ筋道を立てて考えられるようにすることが大切である。"]},"quoteEnd":0},"sansu-4-A-8":{"page":200,"name":"そろばん","expl":{"intro":["第３学年では，そろばんについて，その仕組みに着目し，大きな数や小数の計算の仕方を考えることを指導してきた。","第４学年では，第３学年の理解の上に，そろばんの計算の仕組みについての理解を深めるようにする。整数については，億や兆の単位までの数を表すこと，小数に1","ついては の位までの数を表すことができるようにする。"],"k":["ア そろばんによる計算の仕方","計算に関しては，珠の操作による計算の仕方について理解できるようにする。整数では，２位数などの加法及び減法の計算や，「２億＋６億」，「10兆＋20兆」などの億や兆の単位を含む簡単な計算について，計算の仕方を理解できるようにする。1","小数では，「0.02＋0.85」などの の位までの小数の簡単な加法及び減法の計算の100","仕方を理解できるようする。"],"s":["ア そろばんの仕組みに着目し，大きな数や小数の計算の仕方を考えること","第３学年のＡ（8）でも解説したとおり，そろばんは，どの桁の珠も同じ大きさの形で出来ている。この仕組みは同じ記号で異なる数を表すという位取り記数法の原理に沿ったものであることから，そろばんで数を表したり，計算をしたりすることは，位取り記数法の理解を確かにすることにつながる。指導に当たっては，こうしたそろばんの仕組みと数の仕組みを対比させながら，計算の仕方を考えることを大切にしたい。","Ｂ 図形"]},"quoteEnd":0},"sansu-4-B-1":{"page":201,"name":"平行四辺形，ひし形，台形などの平面図形","expl":{"intro":["第２学年では，正方形，長方形について，図形を構成する要素に着目し，正方形，長方形を観察したり構成したりする活動を行っており，二つの直線の平行や垂直についての理解の基礎となる経験をしている。","これを受けて，第４学年では，図形を構成する要素である辺の平行や垂直の関係に着目し，平行四辺形，ひし形，台形の性質を見いだし，これらの図形の構成の仕方について考える。そして，見いだした性質を基に，既習の正方形，長方形を捉え直すことをねらいにしている。","さらに，これらの図形の性質が見いだされると，それらの性質間の関係を考察することが次の問題となる。平行四辺形になるための条件など，「ＡならばＢである」ことを証明することは，中学校第２学年において指導される。","なお，〔用語・記号〕では，平行，垂直，対角線という用語を示している。これらの用語を用いて説明したり，表現したりできるようにすることが大切である。"],"k":["ア 直線の平行や垂直の関係","２本の直線の平行については，「二つの直線がどこまでいっても交わらないとき，この二つの直線は平行である」と約束することができる。しかし「どこまでいっても」という表現では，実際に操作で確かめることができない。そこで，はじめに垂直の関係について約束し，その上で，平行の関係について約束する。次の２点が理解できるようにする。","①  二つの直線が直角に交わって","いるとき，この二つの直線は垂","直であるという。","②  一つの直線に垂直な二つの直","線があるとき，この二つの直線","は平行であるという。","＜垂直な二直線の図＞＜平行な二直線の図＞そして，②の約束を基に，平行な二直線には，「平行な二つの直線は，どこまでいっても交わらない」「平行な二つの直線の幅は，どこでも等しい」といった性質があることを理解する。ここで，垂直とは二直線の位置関係を表すものであり，形としての直角とは異なることに注意する。さらに，日常生活の中には，平行な二直線や，垂直な二直線が数多く見いだせることを知る。","イ 平行四辺形，ひし形，台形","直線の位置関係や辺の長さに着目することで，平行四辺形，ひし形，台形について知る。すなわち，向かい合った二組の辺が平行な四角形を平行四辺形といい，四つの辺の長さが等しい四角形をひし形といい，向かい合った一組の辺が平行な四角形を台形という。こうした四角形の名称を知り，図形の置き方をいろいろと変えても，その図形の名称が判断できるようにする。","そして，各々の四角形の性質について理解できるようにする。平行四辺形には，向かい合う辺の長さが等しい，向かい合う角の大きさが等しいなどの性質がある。ひし形には，二組の向かい合う角がそれぞれ等しいという性質がある。","さらに，対角線の意味と用語について指導する。四角形の対角線とは，向かい合う頂点を結んでできる直線である。対角線に関わる図形の性質として，平行四辺形には，２本の対角線が互いに二等分されるという性質があること，ひし形には，２本の対角線が互いに垂直に交わることや，互いに二等分されていることにも着目では，２本の対角線が互いに垂直に交わることや，互いに二等分されていることきるようにする。さらに，ひし形については，平行四辺形の性質を全て備えているも着目できるようにする。さらに，ひし形については，平行四辺形の性質を全四角形であることにも着目できるようにする。","備えている四角形であることにも着目できるようにする。","また，「内容の取扱い」の（7）で「平行四辺形，ひし形，台形で平面を敷き詰めるまた，「内容の取扱い」の(7)で「平行四辺形，ひし形，台形で平面を敷き詰などの操作的な活動を重視するよう配慮するものとする」と示している。平行四辺るなどの操作的な活動を重視するよう配慮するものとする」と示している。平形，ひし形，台形によって平面を敷き詰めることができることを確かめ，敷き詰め四辺形，ひし形，台形によって平面を敷き詰めることができることを確かめ，きた詰図め形たの図中形にのほ中かのに図ほ形かをの認図め形たをり認，め平た行線りの，平性行質線に気の付性い質たにり気す付るいなたどり，す図形るになど図つ形いにてつのい見て方のや見感覚方をや豊感か覚にをす豊るか。にする。","ア エ ア エ ウ イ ア エ","イ ウ イ ウ エ ア イ ウ","ウ イ ア エ ウ イ","エ ア イ ウ エ ア","例えば，台形アイウエによって平面を敷き詰めると上のようになり，台形で平面例えば，台形アイウエによって平面を敷き詰めると上のようになり，台形で面をを敷敷きき詰詰めめらられれるこるとこがと確がか確めからめれらるれ。るそし。てそ，しそての，中そにの平中行に四辺平形行を四認辺め形るをこ認とめこがとでがきでるき。るま。たま，角たア，と角角アイとの角大イきのさ大をき合わさせをた合りわ，せ角たウりと，角角エのウ大とき角さエをの合大わきせさ合たわりせすたるりとす，るどとちら，もど1ち80ら度もで1あ80る度こでとあにる気こ付とくにこ気とが付でくきこると。ができる。","さらに，敷き詰めた形に色を塗ったり，それに様々なデザインを工夫したりさらに，敷き詰めた形に色を塗ったり，それに様々なデザインを工夫したりするることにより，図形の美しさに触れていくことができる。","ことにより，図形の美しさに触れていくことができる。"],"s":["(ｱ) 図形を構成する要素及びそれらの位置関係に着目し，構成の仕方を考","ア  図形を構成する要素及びそれらの位置関係に着目し，構成の仕方を考察し","し図形の性質を見いだすとともに，その性質を基に既習の図形を捉え直こと","図形の性質を見いだすとともに，その性質を基に既習の図形を捉え直すこと図形を構成する要素及びそれらの位置関係に着目し，構成の仕方を考察し図形の性質を見いだすこと","図形を構成する要素として辺を取り上げ，それを直線として捉えることにより，二直線の位置関係が問題となる。そして，二直線の位置関係には，交わる場合と交わらない場合があること，さらに，交わる場合においては，特殊な場合として90度で交わる場合があることが分かる。このような考察により，二直線の関係には，特殊な場合として，垂直に交わる場合と，交わることのない平行の場合があることが引き出される。","そして，平行といった直線の位置関係に焦点化したとき，平行が何組あるかに着目することで，図形を分類することが可能になる。四角形を取り上げると，一組しかない四角形（台形）と二組ある四角形（平行四辺形，ひし形）に分類することができる。さらに，図形を構成する要素である辺の長さや角の大きさに着目することで，さらなる図形の性質が見いだされる。辺の長さに着目すると，平行な二組の辺の長さはそれぞれ等しいこと（平行四辺形の性質），さらに，その特殊な場合として，二組の平行な辺の長さが全て等しい場合（ひし形）のあることが分かる。さらに，角の大きさや，対角線の長さや位置関係を考えることで，さらなる性質が引き出される。そして，見いだされた性質を基にすると，図形を作図することが可能になるとともに，身の回りから，平行四辺形，ひし形，台形の形をした具体物を見付けることができる。","図形の性質を基に既習の図形を捉え直すこと","平行が何組あるかという視点から既習の四角形について振り返り，統合的にみることが肝要である。正方形，長方形は，二組の向かい合う辺が平行であることから，平行四辺形と同じ性質をもっている図形として捉え直すことができる。また，辺の長さも加味して考察すると，正方形は，二組の平行な辺の長さが全て等しいことから，ひし形と同じ性質をもっている図形として捉え直すことができる。さらに，対角線の長さや位置関係に着目することで，正方形，長方形を捉え直すこともできる。"]},"quoteEnd":0},"sansu-4-B-2":{"page":204,"name":"立方体，直方体などの立体図形","expl":{"intro":["第２学年では，箱の形について，それを構成する要素（頂点，辺，面）に着目し，六つの正方形や長方形を張り合わせたり，12本のひごを組み合わせたりすることで，箱が構成できることを指導してきている。これを受けて第４学年では，立方体，直方体について，それを構成する要素（頂点，辺，面）に着目し，辺と辺，辺と面，面と面の平行及び垂直の関係について考察する。そして，立体図形を平面上にいかに表現するか，また逆に，平面上に表現された図からいかに立体図形を構成できるかを考察するとともに，日常の事象を図形の性質から捉え直すことをねらいにしている。","立体図形を平面図形に表したり，逆に平面図形から立体図形を構成したりする活動を通して，立方体や直方体についての理解を深め，空間についての感覚を豊かにする。","なお，〔用語・記号〕では，平面という用語を示している。この用語を用いて説明したり，表現したりできるようにすることが大切である。"],"k":["ア 立方体，直方体","立方体は，六つの正方形で囲まれた立体図形である。また直方体は，六つの長方形で囲まれた立体図形，又は二つの正方形と四つの長方形で囲まれた立体図形である。立方体，直方体は，既習の平面図形である正方形，長方形によって構成されていることを理解する。","イ 直線や平面の平行や垂直の関係","直方体に関連して，直線や平面の平行や垂直の関係について理解できるようにする。直方体の辺や面については，向かい合う面は平行になることや隣り合う面は垂説明したり，表現したりできるようにすることが大切である。","(ｱ) 立方体，直方体","直になること，12","立方体は，六つの 〔立方体〕 〔直方体〕","本の辺のうち４本","正方形で囲まれた立","体ず図つ形三で組あのる辺。がまそた","直れ方ぞ体れは平，行六につなのる長","方形で囲まれた立体","ことや一つの辺が","図形，又は二つの正","二つの面に垂直で","方形と四つの長方形で囲まれた立体図形である。立方体，直方体は，既習の平面あること，また一つの頂点に集まる三つの辺が互いに垂直であることなどについて図形である正方形，長方形によって構成されていることを理解する。","理解できるようにする。","(ｲ) 直線や平面の平行や垂直の関係","例えば次の直方体の図で，面アイウエと面カキクケは平行である。頂点アに集ま直方体に関連して，直線や平面の平行や垂直の関係について理解できるようにするる辺。ア直イ方と体辺のア辺カやと面辺にアつエいはて互はい，に向垂か直でいあ合るう。面は平行になることや隣り合う面は 垂直になること，12本の辺のうち４本ずつ三組の辺がそれぞれ平行になることエ ウ","や一つの辺が二つの面に垂直であること，また一つの頂点に集まる三つの辺が互いに垂直であることなどについて理解できるようにする。","ア イ","例えば次のページの直方体の図で，面アイウエと面カキクケは平行である。頂点アに集まる辺アイと辺アカと辺アエは互いに垂直である。","ケ ク","カ キ","(ｳ) 見取図，展開図","見取ウ図 や見展取開図図，展は開，図立体図形を平面上に表現するための方法である。このことの よ見さ取が図分やか展る開よ図はう，に立指体導図す形るをこ平と面が上大に切表で現あするる。たそめのの際方，法平で面ある図。形ことののこ関と連のにもよ配さ慮がす分るか。る例よえうにば指，導一すつるのこ立と体が図大形切かでらあ，る一。通そりので際は，な平く面幾図つ形とかのの関展連開に図もを配かくことができることや，展開図からできあがる立体図形を想像できるようにする慮する。例えば，一つの立体図形から-，20一4通- りではなく幾つかの展開図をかくことことが大切である。","ができることや，展開図からできあがる立体図形を想像できるようにすることが大イ 思考力・表現力・判断力等","切である。","(ｱ) 図形を構成する要素及びそれらの位置関係に着目し，立体図形の平面上","イ で思の考表力現・や表現構力成・の判仕断方力を等考察し図形の性質を見いだすとともに，日常の事ア象  を図図形形をの構成性す質るか要ら素捉及えび直そすれこらとの位置関係に着目し，立体図形の平面上で図形を構成する要素及びそれらの位置関係に着目し，立体図形の平面上での表現","の表現や構成の仕方を考察し図形の性質を見いだすとともに，日常の事象をや構成の仕方を考察し図形の性質を見いだすこと","図形の性質から捉え直すこと","立方体，直方体の特徴を明確にしていくために，図形を構成する要素として面，","図形を構成する要素及びそれらの位置関係に着目し，立体図形の平面上での表現や辺，頂点を取り上げ，その図形を構成する要素の個数や面の形，辺や面の平行，","構成の仕方を考察し図形の性質を見いだすこと","垂直の関係などに着目する。例えば，面の形に着目したとき両者は区別される。立方体，直方体の特徴を明確にしていくために，図形を構成する要素として面，辺，また，面の位置関係に着目したとき，向かい合う面は平行になることや隣り合う頂点を取り上げ，その図形を構成する要素の個数や面の形，辺や面の平行，垂直の面は垂直になることが見いだされる。","関そ係しなてど，にこ着の目よするう。な例図え形ばを，構面成のす形るに要着素目のし個た数とやき面両の者形は，区辺別やされ面るの。平ま行た，，垂面直のの関位係置な関ど係がに明着ら目しかたにとさきれ，る向とか，いそ合れうを面基はに平，行立に体な図る形こをと平や面隣図り合形うと面しはて垂表直現にすることが可能になる。見取図や展開図の作図で，辺と辺，辺と面，面と面のつななることが見いだされる。","がりや位置関係に着目することになる。","そして，このような図形を構成する要素の個数や面の形，辺や面の平行，垂直の日常の事象を図形の性質から捉え直すこと","日常生活の中には，直方体，立方体の立体を数多く見いだすことができる。例関係などが明らかにされると，それを基に，立体図形を平面図形として表現することが可能になる。見取図や展開図の作図で，辺と辺，辺と面，面と面のつながりや位置関係に着目することになる。","日常の事象を図形の性質から捉え直すこと","日常生活の中には，直方体，立方体の立体を数多く見いだすことができる。例えば，レンガは直方体とみることができ，安定的に積み上げていくために，向かい合う面が平行であるという直方体の性質を活用していると捉え直すことができる。さらに，さいころは，目の出方が均等になるように，六つの面が同じ正方形である立方体を活用していることが分かる。このように，生活の中に立方体，直方体を見いだし，それがどのような性質を活用しているかを考えていくことが重要である。"],"s":[]},"quoteEnd":0},"sansu-4-B-3":{"page":207,"name":"ものの位置の表し方","expl":{"intro":["ものの位置については，第１学年で前後，左右，上下などの言葉で表すことについて指導している。これを受けて第４学年では，平面上にあるものの位置については二つの要素で，また，空間の中にあるものの位置の表し方について三つの要素で特定できることを知り，その位置を表現するには数をどのように活用すればよいかを考察することをねらいにする。"],"k":["ア ものの位置の表し方","平面の上にあるものの位置を表すには，横と縦の二つの要素が必要になることを理解する。体育館の床に旗を置く場合，体育館の四隅の一点を基にして，横に３ｍ，縦に４ｍ進むことを，例えば（横３ｍ，縦４ｍ）のように表せることを知る。","また，空間の中にあるものの位置を表すには，横，縦，高さの三つの要素が必要になることを理解する。教室を直方体と考えれば，天井からつり下げた飾りが，床の四隅の一点を基にして，横に３ｍ，縦に４ｍ，高さ２ｍの位置にある場合，例えば（横３ｍ，縦４ｍ，高さ２ｍ）のようにして表せることを理解する。"],"s":["ア  平面や空間における位置を決める要素に着目し，その位置を数を用いて表現する方法を考察すること","平面上の位置を表すには，どのような要素に着目すればよいかを考える。例えば，下駄箱の位置を特定するには，どのようにすればよいかを考えてみる。そうすると，まずは基準となる位置をどこかに定める必要があることが分かる。そして，基準となる位置から，幾つ目にあるかを考える必要がある。一列しかない場合は，右から何番目といった一つの要素だけで表すことができるが，左右，上下の平面的な広がりがあるときは，一つの要素だけでは表せない。そこで，左右，上下の二つの方向から表現していく必要性があることに気付く。そして，下駄箱の位置で用いた考えを発展させることで，平面上の位置を定める方法が見えてくる。すなわち，基準点を定め，縦，横の２方向からどのくらいの距離にあるかに着目するのである。何番目という順序数を長さへと広げたことになる。","さらに，３次元の位置についても，発展的に考えていくことができる。平面上での位置の定め方から類推し，縦，横，高さの３方向からどのくらいの距離にあるのかによって，その位置が特定できることを導くことができる。"]},"quoteEnd":0},"sansu-4-B-4":{"page":208,"name":"平面図形の面積","expl":{"intro":["第４学年の面積の学習は，第１学年における広さの学習や長さ，かさ，重さなど，量の比較や測定の経験を踏まえ，正方形や長方形といった図形の面積について，単位と測定の意味を理解し，面積の単位や図形を構成する要素に着目して面積の求め方について考え，それらを用いることができるようにすることを主なねらいとしている。なお，日常語としての広い，狭いという言葉は，「道幅が広い（狭い）」などと用いられることがあり，必ずしも面積の大小を意味している訳ではないことに注意する。また，今までに指導してきた量は，計器を用いて測定してきた。しかし面積は，計器を用いて測定するのではなく，辺の長さなどを用いて計算によって求めることに注意する。","第４学年の面積の学習においては，図形の中でも特に，正方形や長方形の面積の求め方を考えるとともに，面積の求め方を振り返り，効率的・能率的な求め方を探求し，公式として導き，導いた公式を活用する資質・能力が育成されることが大切である。さらには，面積の単位間の関係についても振り返り，面積の大きさを実感をもって理解できるようにすることも大切である。"],"k":["ア 面積の単位（㎠，㎡，㎢）と測定","面積の測定については，長さやかさなどの量についての測定の学習と同様に，その大きさを数値化して表すことのよさに気付くことができるようにする。そして，単位とする大きさを決めると，その幾つ分として面積の大きさが数値化できることを理解できるようにすることが大切である。単位とする大きさとしては，例えば，一辺の長さが１㎝の正方形の面積などを用いると便利であることについて理解できるようにすることが大切である。","面積の単位としては，平方センチメートル（㎠）のほかに，平方メートル（㎡），平方キロメートル（㎢）などを指導する。その際，面積を求める対象の大きさに応じて，単位間の関係に注意しながら単位の大きさを柔軟に選択し，適切な単位を用いることができるようにすることが大切である。例えば，教室や体育館などの面積を表すとき，平方センチメートルを単位とすると数値が大きくなり扱いにくくなるので，平方メートルなどの別の単位を用いるとよいことなどである。","「内容の取扱い」の（8）では，この内容に関わって「アール（a），ヘクタール（ha）の単位についても触れるものとする」と示されている。アール（a），ヘクタール（ha）という単位は，社会科など他教科等の学習とも関連する。ここでは，田や畑などの面積を表す場合に平方メートル（㎡）を単位とすると数値が大きくなるので，アール（a），ヘクタール（ha）の単位を使うと便利であることが分かるよう配慮する。その際，単位面積を正方形によって表すとき，平方メートルや平方キロメートルとアールやヘクタールの単位間の関係についても触れるものとする。","イ 正方形，長方形の面積の測定","右のような図形の面積は単位正方形の数を数えると求める","ことができる。ここで，左上の単位正方形を左下に移動させ","ると全体が長方形になるが，そのとき面積は，辺の長さを測","るだけで計算で求められる。","例えば，右の図のような長方形の面積を求めるに","A Dは，面積の意味を考えれば，単位の正方形を敷き詰","めてその個数を求めればよい。単位正方形が規則正","しく並んでいるので，乗法を用いると，手際よく個","数を求めることができる。このとき縦や横の長さを，","B C１㎝を単位として測っておけば，その数値について","（縦）×（横）（又は（横）×（縦））の計算をした結果が，１㎠を単位とした大きさとして表されることになる。このことより，","（長方形の面積）＝（縦）×（横）（又は（横）×（縦））","という公式について理解できるようにする。","また，国際的な調査（例えばTIMSS調査など）の結果から，長方形の周りの長さを問うているのに面積を答えるという誤りが見られることが報告されている。この公式と具体的な図の併用で，長方形の辺の長さが２倍や３倍になるときの面積の変化を考えさせるなどして，式の観点からの理解を深めたり，図形の周りの長さと面積との混同を防いだりすることも大切である。"],"s":["ア  面積の単位や図形を構成する要素に着目し，図形の面積の求め方を考えるとともに，面積の単位とこれまでに学習した単位との関係を考察すること面積の単位や図形を構成する要素に着目し，図形の面積の求め方を考えること","第４学年では，長方形や正方形，及びそれらを組み合わせた図形の面積を求める際，単位となる正方形を敷き詰めるのではなく計算によって面積を求める方法について考えることができるようにすることが大切である。","その際，正方形や長方形では，辺にそって単位正方形が規則正しく並んでいるので，乗法を用いると，その個数を手際よく求めることができるよさに気付き，計算を用いて面積を求めたり，（長方形の面積）＝（縦）×（横）（又は（横）×（縦））という公式を見いだしたりすることで，これまでに学習してきた乗法の一層の理解を深めるといった既習を基に統合的・発展的に考察する態度も養われる。","長方形を組み合わせた図形とは，Ｌ字型，凹字型などの図形のことである。例えば，左下のようなＬ字型の図形の面積の求め方を考えるとは，次のようなことである。長方形を組み合わせた図形とは，Ｌ字型，凹字型などの図形のことである。例えば，左下のようなＬ字型の図形の面積の求め方を考えるとは，次のようなことである。","２㎝ （あ） （い） （う） （え）","３㎝","４㎝","６㎝","３㎝","６㎝","この形の面積を求める際には，（あ）のように具体的に方眼を引いて考え，「１この形の面積を求める際には，（あ）のように具体的に方眼を引いて考え，「１㎠㎠が幾つあるか数えたら24㎠になる」と説明できる。これは面積の意味に基づくが説幾明つでああるるか。数まえたた，（らい24）㎠のによなうるに」三とつ説の明長で方き形るに。分こけれたは面り積，（のう意）味のによ基うづにく二説つ明ので長あ方る形。にま分たけ，た（りい）しのてよ，うそにれ三ぞつれのの長長方方形形に分のけ面た積りを，計（算うに）のよよりう求にめ二てつかのら長合方わせると考えることもできる。さらに，（え）のように，大きな長方形の面積から形に分けたりして，それぞれの長方形の面積を計算により求めてから合わせると考斜線部分の長方形の面積を引くと考えることもできる。","えることもできる。さらに，（え）のように，大きな長方形の面積から斜線部分の長面積の単位とこれまでに学習した単位との関係を考察すること","方形の面積を引くと考えることもできる。","面積の単位とこれまでに学習した単位との関係を考察すること","単位面積を正方形によって表すとき，次のような関係が成り立っていることに気付かせ，平方メートルや平方キロメートルとアールやヘクタールの単位の関連について考察できるようにする。す","なわち，長さの単位間の関係を","基に，面積の単位間の関係を考","察することで，その違いと理由","を理解できるようにすることが","大切である。","長さの単位 １㎝ （10㎝） １ｍ （10ｍ） （100ｍ） １㎞","面積の単位 １㎠ （100㎠） １㎡ （100㎡） （100a） １㎢","１a １ha","さらには，このような思考力，判断力，表現力が育成される学習を充実させることで，面積の大きさについての感覚を培えるよう，測定の経験を豊かにすることも大切である。","計算の上では，１㎡＝10000㎠であると分かっていても，長さの単位換算での経験から類推して，１㎡＝100㎠と誤ってしまう児童もいる。これは100㎠という面積の大きさについての感覚が身につき，１㎡という面積の意味が理解できていれば防げることである。そこで，身の回りにある正方形や長方形の面積を実際に調べる活動が有効になる。調べる対象は，児童の使っている折り紙，机の面，教室の床，花壇，体育館などである。活動に取り組むときは，児童の実態に合わせて目的意識をもたせ，例えば教室と図書室の面積の違いを調べることなどを通して，面積の学習が日常生活に役立つものであることを実感させるようにする。"]},"quoteEnd":0},"sansu-4-B-5":{"page":212,"name":"角の大きさ","expl":{"intro":["第２学年では直角の形について，また第３学年では二等辺三角形や正三角形の学習に関わって角の大きさが同じであることを指導してきている。第４学年では，角の大きさを回転の大きさとして捉え，角の大きさの単位「度（°）」を用いて角の大きさを測定するとともに，角の大きさの観点から，これまでに学習してきた図形の理解を一層深めることを主なねらいとしている。","第４学年の角の学習においては，図形を考察する要素の中でも，特に角の大きさに着目すると，図形間の関係が捉えやすくなるよさを理解し，積極的に図形の考察に活用する資質・能力が育成されることが大切である。"],"k":["ア 回転の大きさ","角の大きさの理解においては，図形の辺の長さの大小と角の大きさの大小とを混同して捉えることがあるため，一つの頂点から出る２本の辺が作る形を角といい，頂点を中心にして１本の辺を回転させたとき，その回転の大きさを，角の大きさということを理解することができるようにすることが大切である。そして，角の大きさを，辺の開き具合として捉えることができるようにする。","イ 角の大きさの単位と測定","第１学年から第３学年の「Ｃ測定」の領域の学習において考察した量と同様に，角の大きさを表す単位があることを理解し，角の大きさの単位である度（°）を用いて図形の角の大きさを測定できるようにする。","その際，直角の大きさが90度であることや，半回転した大きさが180度，１回転した大きさが360度であることなども取り扱い，図形の角の大きさの見当を付けながら測定する技能を養う。","また，分度器を用いて角の大きさを測定したり，必要な大きさの角を作ったりする際には，分度器の用い方に慣れるまで時間がかかることが考えられるため，図形の角の大きさを測定したり，示された角の大きさを作り確かめたりする経験を豊かにする。その際，角の大きさについての感覚を培う観点から，角の大きさの見当を付け，例えば，「90度より小さい。」，「180度より大きく270度より小さい。」など，直角の大きさを基準として角の大きさを判断できるようにする。"],"s":["ア  図形の角の大きさに着目し，角の大きさを柔軟に表現したり，図形の考察に生かしたりすること","図形の角の大きさに着目し，角の大きさを柔軟に表現すること","第４学年では，直角の大きさが90度であることや一回転した角の大きさが360度であることを基に，角の大きさを柔軟に表現できるようにする。これは，210度の大きさの角を作図する際に，210度を「180度より30度大きい角」や「360度より150度小さい大きさの角」と考えることである。","図形の角の大きさに着目し，図形の考察に生かすこと","第４学年においては，図形間の関係や大きさの判断をする際に，これまでに学習してきた辺の長さや構成要素の数だけでなく，図形の角の大きさに着目して，図形を多面的に考察できるようにする。これは，平行四辺形やひし形の向かい合う角の大きさが等しいことを見いだすことなどである。","第５学年の合同な図形や第６学年の拡大図・縮図，対称な図形の学習では，図形が「同じ」であることを角の大きさに着目して考察することがあるため，第４学年においては，単に角の大きさの測定や表現にとどまらず，角の大きさを根拠に的確に判断することができるようにすることが大切である。さらには，このような思考力，判断力，表現力が育成される学習を充実させることで，角の大きさについての感覚を培えるよう，測定の経験を豊かにすることが大切である。","Ｃ 変化と関係"]},"quoteEnd":0},"sansu-4-C-1":{"page":214,"name":"伴って変わる二つの数量","expl":{"intro":["第１学年から第３学年では，「Ａ数と計算」の領域において，ものとものとを対応付けたり，一つの数をほかの数の和や差としてみたり，一つの数をほかの数の積としてみたり，乗数が１ずつ増えるときの積の増え方の様子に着目したりすることを指導してきた。また，「Ｄデータの活用」の領域において，対象を絵や図に置き換えたり，身の回りの事象について，表やグラフで表したり読んだりすることを指導している。","第４学年では，具体的な場面において，表や式，折れ線グラフを用いて変化の様子を表したり，変化の特徴を読み取ったりすることができるようにするとともに，伴って変わる二つの数量を見いだして，それらの関係に着目し，表や式を用いて変化や対応の特徴を考察する力を伸ばすことをねらいとしている。また，考察に用いた表現や結果を振り返って，得られた結果を分かりやすい表現に工夫するなど，よりよく問題解決する態度を養うことも大切である。","ここで育成される資質・能力は，第５学年の簡単な比例，第６学年の比例，反比例などの考察に生かされるものである。"],"k":["ア 変化の様子と表や式，折れ線グラフ","第４学年では，表や式，折れ線グラフを用いて，伴って変わる二つの数量の変化の様子を表したり，変化の特徴を読み取ったりすることができるようにする。","変化の様子を表を用いて表すとは，伴って変わる二つの数量において，対応する値の組を幾つか求め，変化の様子を順序よく並べて整理して示すことである。また，表から変化の特徴を読み取るとは，表の数値の間の関係をみて，一方の数量が増加するときの他方の数量の増減の様子を捉え，二つの変化する数量の間の関係を明確にすることである。","伴って変わる二つの数量の関係は，□，△などを用いて式に表すことができる場合がある。ここで扱う□，△などの記号は，変量を表す記号である。第４学年では，具体的な問題場面において，表から，変化の様子を□，△などを用いた式に表したり，表された式から，数量の関係の特徴を読み取ったりすることができるようにする。式から数量の対応や変化の特徴を読み取るには，□，△などに複数の数を当てはめた結果を表に整理して表したり，二つの数量の関係を言葉の式などで表したりすることが大切であるため，そのような活動が行えるよう配慮する必要がある。変化の様子を折れ線グラフを用いて表すとは，二つの数量について，一方をグラフの横軸に，もう一方をグラフの縦軸にとって，伴って変わる数量の組を点で示し，点と点をつなぐことによって，部分の変化や全体の変化の様子を示すことである。折れ線グラフから変化の特徴を読み取るとは，一方の数量が増加するときの他方の数量の増減の様子を捉え，二つの変化する数量の間にある関係を明確にすることである。そのためには，各部分の折れ線の傾きから数量の増減の様子を捉えることが必要となる。"],"s":["ア  伴って変わる二つの数量を見いだして，それらの関係に着目し，表や式を用いて変化や対応の特徴を考察すること","伴って変わる二つの数量を見いだし，それらの関係に着目すること","関数の考えでは，まず，ある数量について，他のどんな数量と関係が付けられるかを明らかにする。ある一つの数量を調べようとするとき，その数量を直接調べにくいときに，それと関係のある他の数量を使って調べられないかと考えて事象を観察し，可能性のある数量を見いだしていく。そこでは，一方の数量を決めれば他の数量が決まるかどうか，あるいは，一方の数量は他の数量に伴って一定のきまりに従って変化するか，というような見方で二つの数量の関係をみていく。","例えば，次の図のような場面で，20番目の図形の周りの長さを知りたいときに，実際にかいていくこともできるが，他の数量が使えないかを考え，下の辺の長さ，正三角形の数などの候補を挙げる。下の辺の長さを決めても周りの長さは１つには決まらないが，正三角形の数を決めれば周りの長さは決まる。また，正三角形の数が１増えると，周りの長さは１増えそうであることも分かる。このような検討を通して，他の数量として正三角形の数を見いだし，正三角形の数と周りの長さの関係に着目していく。ここでは，児童が自ら幾つかの数値について計算をするなどして，データを集める活動を充実させることが重要である。","１番目 ２番目 ３番目 ４番目","表や式を用いて変化や対応の特徴を考察すること","関数の考えでは，次に，見いだされた二つの数量の関係についての問題を，表や式を用いて表し，伴って変わる二つの数量の間にある変化や対応の特徴を考察する。そのためには，対応する値の組を順序よく表などに整理したり，式を用いて表したりして，変化や対応の特徴としての規則性があるかどうか，ある場合には，どんな規則性があるかを明らかにしていく。","表で表すことで，表の数値の間の関係から，一方の数量が増加するときの他方の数量の増減という変化の様子が捉えやすくなる。表の数値を横に関連付けてみたり，縦に関連付けてみたりすることで，一方が１ずつ増えたときに，他方が１ずつ減る，２ずつ増えるなどの変化の特徴や，和が一定，差が一定，一方を定数倍すると他方になるなどの対応の特徴を見いだすことができる。また，式を用いることで，これらの特徴を簡潔に表すことができる。","上の三角形の例では，次のような表に表すことができる。","三角形の数（□） １ ２ ３ ４ ・・・ 20","周りの長さ（△） ３ ４ ５ ６ ・・・ 22","この表から，変化の特徴として，三角形の数が１ずつ増えると周りの長さも１ずつ増えることが分かる。また，対応の特徴として，三角形の数に２を足すと周りの長さの数になることが分かる。このことを数式で表すと次のようになる。","１＋２＝３","２＋２＝４","３＋２＝５","４＋２＝６","…","ここで，１，２，３，・・・は三角形の数で，３，４，５，・・・・は周りの長さであるので，次のような言葉の式にしたり，□と△を用いた式にすることができる。","（三角形の数）＋２＝（周りの長さ）","□＋２＝△","見いだした規則性については，もとの事象と対応させて確かめることが大切である。また，他の数値の間においても成り立つかどうかを調べることで，一般的に成り立っているか，どの範囲で成り立っているかなどを確認することも大切である。関数の考えでは，最後に，見いだされた変化や対応における規則性を適用して，求めたい数量についての結果を導いていく。規則性を適用する際には，知りたい数量との関係を捉え，どの数値を使うのかを判断するなど，筋道を立てて考えることが必要である。"]},"quoteEnd":0},"sansu-4-C-2":{"page":217,"name":"簡単な場合についての割合","expl":{"intro":["第２学年，第３学年では，「Ａ数と計算」の領域において，乗法，除法の意味について理解する際に，整数を用いた倍の意味についても取り扱い，「基にする量の何倍」という割合の見方の基礎を指導してきた。分数の意味においても「もとの大１","きさの 」などを指導している。また，「Ｃ測定」の領域でも，測定の意味におい２","て，単位の幾つ分かを考えており，割合の見方の基礎を指導してきている。","第４学年では，割合が２，３，４などの整数で表される簡単な場合について，ある二つの数量の関係と別の二つの数量の関係とを比べる場合に割合を用いる場合があることを知り，図や式などを用いて，二つの数量の関係どうしの比べ方を考察する力を伸ばすことをねらいとしている。また，二つの数量の関係に着目することで，数量の大きさに対する感覚をより豊かにすることも大切である。","ここで育成される資質・能力は，第５学年の異種の二つの量の割合として捉えられる数量，割合，百分率などの考察に生かされるものである。"],"k":["ア 簡単な場合についての割合","二つの数量ＡとＢの関係を，割合を用いて比べるとは，二つの数量のうちの一方，例えばＢを基準にする大きさ（基準量）としたときに，もう一方の数量であるＡ（比較量）がどれだけに相当するのかを，Ａ÷Ｂの商で比べることである。この表された数（商）が割合である。割合を表す数は，基準量を単位とした比較量の測定値であるともいえる。","ある二つの数量の関係と別の二つの数量の関係とを比べるとは，Ａ，Ｂという二つの数量の関係と，Ｃ，Ｄという二つの数量の関係どうしを比べることである。比べ方には大きく分けて，差でみる場合と割合でみる場合があるが，ここでは，割合でみる場合を扱う。二つの数量の関係どうしを割合でみて比べる際には，二つの数量の間の比例の関係を前提としている。この前提のもと，個々の数量の差ではなく，数量の間の乗法的な関係でみて，二つの数量の関係どうしを比べる場合があることを知っていく。","第４学年では，特に，簡単な場合について，割合を用いて比べることについて指導する。簡単な場合とは，二つの数量の関係が，基準とする数量を１とみたときにもう一方の数量が，２倍，３倍，４倍などの整数で表される場合について，二つの数量の関係と別の二つの数量の関係とを比べることを知る程度を指している。","例えば，「ある店で，トマトとミニトマトを値上げしました。トマトは１個100円が200円に，ミニトマトは１個50円が150円になりました。トマトとミニトマトではどちらがより多く値上がりしたといえますか。」という問題場面がある。","ここでは，例えばトマト１個については「100円が200円に」になっているが，トマトが２個あると「200円が400円に」になっている。３個のとき…なども，同時に起こっているとみることが必要である。トマトが１個のときも２個のときも，トマトについては，「もとの値段」を基準量とし，その大きさを１とすると，それに対する「値上げした値段」はいつでも２倍になっている。つまりトマトは２倍に値上がりしたということができる。このように，１個のときでも，２個のときでもいつでも同じ関係が成り立つのは，「もとの値段」と「値上げした値段」の間には比例関係があるからである。","トマト ミニトマト","１個で100円が200円に １個で  50円が150円に","２個で200円が400円に ２個で100円が300円に","３個で300円が600円に ３個で150円が450円に","… …","同様に，ミニトマトは３倍に値上がりしたということができ，従ってミニトマトの方が値上がりしたといえることになる。","また，「平ゴムＡと平ゴムＢがあります。平ゴムＡは，50㎝が150㎝まで伸びます。平ゴムＢは，100㎝が200㎝まで伸びます。どちらがよく伸びるゴムといえますか。」という問題場面がある。","平ゴムＡが，50㎝が150㎝まで伸びるということは，10㎝が30㎝まで伸び，20㎝が60㎝まで伸び，…ということである。平ゴムＢが，100㎝が200㎝まで伸びるということは，10㎝が20㎝まで伸び，20㎝が40㎝まで伸びるということである。つまり，ここでも平ゴムＡとＢについて，「もとの長さ」と「伸びた長さ」の間の割合がいつでも変わらないので，割合で比べることができる。","このように，基準とする数量が異なっていても，割合が変わらないとき，割合で比べることができる。"],"s":["ア  日常の事象における数量の関係に着目し，図や式などを用いて，ある二つの数量の関係と別の二つの数量の関係との比べ方を考察すること","日常の事象における数量の関係に着目すること","日常の事象において，二つの数量の関係と別の二つの数量の関係との比べ方を考察するには，一方を基準量としたときに，他方の数量がどれだけに相当するかという数量の関係に着目することが必要である。すなわち，比べる対象を明確にし，比べるために必要な二つの数量について，比例の関係を前提に乗法的な関係でみてよいかを判断し，基準量，比較量という数量の関係に着目する。第４学年では，基準量を１とみたときに，比較量が２倍，３倍，４倍などの整数で捉えられる場合について扱い，数量の関係に着目する力を伸ばす。","指導に当たっては，比べる際に必要な基準量，比較量に着目しやすくするために，問題としている場面を絵や図で表すことが大切である。また，児童は，第２学年，第３学年において，「Ａ数と計算」の領域，「Ｃ測定」の領域で，乗法，除法の意味，分数の意味，測定の意味について理解する際に，割合の見方の基礎を学習してきている。これらの学習と関連付けて指導をするようにする。","簡単な場合について，図や式を用いて数量の関係どうしを割合で比べること","ある二つの数量の関係と別の二つの数量の関係を割合を用いて比べるには，まず，これら二つの数量が比例関係にあること確認する。そして，それぞれの数量の関係について基準量を決め，基準量を１とみたときに，比較量がどれだけに当たるのかを見いだしていく。この過程では，言葉，テープ図や数直線などの図，式などを用いて基準量と比較量を表し，また，表された表現の中から，基準量と比較量を読み取って，割合を求めていくことが必要である。第４学年では，基準量を１とみたときに，比較量が２倍，３倍，４倍などの整数で捉えられる場合について，図や式を用いて，数量の関係を明瞭，的確に表したり，それらから数量の関係を適切に読み取って判断したりしていく。","なお，児童は，ある二つの数量の関係と別の二つの数量の関係を差で比べることに親しんでいることが考えられる。差による比べ方と対比することで，基準とする数量を１とみると他方の数量がどれだけ当たるのかという割合を用いた比べ方の特徴に気付かせることも大切である。","下の図は，50㎝が150㎝に伸びた平ゴムＡと，100㎝が200㎝に伸びた平ゴムＢを，差でみて比べた場合と，割合でみて比べた場合を示している。この場合には，例えば平ゴムＢを半分に切ったときのことを考えると，50㎝が100㎝に伸びることになるので比例関係が成立する。そこで割合で比べてよいことが分かる。割合では，基準とする数量が異なっても，それらを１とみて，相対的な大きさで比べていることが分かる。","図や式から数量の関係の特徴を読み取って問題を解決していくことを通して，児童が日常生活の中から，割合の関係にある事柄を見付け出そうとする態度が育成されることも大切である。","Ｄ データの活用"]},"quoteEnd":0},"sansu-4-D-1":{"page":220,"name":"データの分類整理","expl":{"intro":["第３学年までは，文字情報として得られる「質的データ」や数値情報として得られる「量的データ」について簡単な表に分類整理することや，棒グラフなどを用いて大小を比べることを学んできている。","第４学年では，目的に応じてデータを集めて分類整理し，特徴や傾向に着目して，適切なグラフを選択して表すことで判断したり，結論について考察したりすることができるようになることをねらいとしている。また，その過程でデータを二つの観点から分類整理した二次元の表に表して分析したり，時間変化に沿って得られた「時系列データ」について折れ線グラフに表して，時間的変化を分析したりできるようになることをねらいとしている。","この内容は，第５学年での円グラフや帯グラフの学習の素地となるものである。また，折れ線グラフに表したり読み取ったりすることは関数的な関係を捉えることにも通じるため「変化と関係」の学習にも関連する。"],"k":["ア 二つの観点から分類整理する方法","この学年では，日時，曜日，時間や場所などの観点から項目を二つ選び，分類整理して表を用いて表したり，そうした表を読んだりすることができるようにすることをねらいとしている。","その際，データを集めて分類整理するに当たって，目的に応じ，ある観点から起こり得る場合を分類し，項目を決めることが必要である。","また，Ａ，Ｂの二つの観点からデータを調べるとき，Ａからみてデータは「性質ａをもっている」と「性質ａをもっていない」の場合が考えられ，またＢからみてデータは「性質ｂをもっている」と「性質ｂをもっていない」の場合が考えられる。そのとき，これらを組み合わせると，データについてＡ，Ｂ二つの観点からみて，四つの場合が考えられる。このように，二つの観点から，物事を分類整理したり，論理的に起こり得る場合を調べたり，落ちや重なりがないように考えたりすることもできるようにする。","なお，「内容の取扱い」の（9）では，「資料を調べるときに，落ちや重なりがないようにすることを取り扱うものとする」と示している。ここで取り扱う落ちや重なりがないようにすることについては，データの読み飛ばしのないように順序よく数えること，あらかじめ起こり得る場合を整理すること，重複して数えることがないように数えたデータに色や印を付けることなど，数え間違いをなくす方法を具体的に指導する必要がある。その際，正しい結果が得られるように間違いをなくしていこうとする態度を養うよう配慮する必要がある。","イ 折れ線グラフの特徴と用い方","「Ｃ変化と関係」領域では，関数的な関係を表すことに関して折れ線グラフを指導している。「Ｄデータの活用」領域においては，時間の経過に伴って，データがどのように変化するかを表すために折れ線グラフを用いている。一般的には横軸に時間経過，縦軸にデータの値を記入し，各時間に相当する大きさを点で表し，それを折れ線で結んで変化を表す。","指導に当たっては，折れ線グラフについて，紙面の大きさや目的に応じて，適切な一目盛りの大きさやグラフ全体の大き","さを決めることができるようにする。そ","の際，同じグラフであっても，折れ線グ","ラフの縦軸の幅を変えることなどに","よって，見え方が異なることに気付かせ","るようにする。","また，「内容の取扱い」の（10）では，「複","数系列のグラフや組み合わせたグラフに","も触れるものとする」と示している。こ","こで取り扱う複数系列のグラフや組み合","わせたグラフについては，例えば，気温","の変化を折れ線グラフで表し，太陽のかげの長さを棒グラフで表したり，二つの地域の気温の変化を一つのグラフ用紙に表したりするなどである。このように二つの種類のグラフを組み合わせたものについても扱い，特徴を読み取れるようにする。"],"s":["ア  目的に応じてデータを集めて分類整理し，データの特徴や傾向に着目し，問題を解決するために適切なグラフを選択して判断し，その結論について考察すること","目的に応じてデータを集めて分類整理すること","目的に応じてデータを集めて分類整理するとは，解決すべき問題や調べてみたいことがらに関して適したデータを収集し分類整理することである。","まず，児童にとって身近な興味や気付きなどから，判断や考察したい事象を問題場面として設定できるようにする。例えば「図書室にある怖い話の本は，人気があるから借りにくい。」という気付きがあり，そこから「怖い話の本は，どんな人たちがよく借りているのか。」というような問題場面を設定したとする。","次に，この問題を解決するという目的でデータを集めることになる。その際，結果の見通しを立てることで観点がはっきりし，分類整理できるようになる。先の例では「怖い話の本は文字が多いので，主に高学年の児童に人気があるのだろう。」，「怖い話は，○年生の国語の教科書に出ていたので，○年生がその学習をする時期に借りるのではないか。」というような見通しをもつことで，データを集める観点をはっきりさせると，低学年と高学年など学年別にデータを集める，時期別にデータを集める，という計画が立てられる。","そして，アンケートや聞き取り，幾つかの怖い話の本の貸し出しリストなどから，必要とするデータを集め，表などに分類整理することになる。","データの特徴や傾向に着目し，問題を解決するために適切なグラフを選択して判断すること","各々の観点で集めたデータを，どのように整理して表せば問題に対する結論を出しやすいかを考える。","第３学年までに学習している一次元の表や，絵グラフ，棒グラフだけでなく，二次元の表や折れ線グラフについても知り，それらから適切なグラフや表を選択する。先の例は質的データであり，各々を一次元の表にまとめることで特徴や傾向をつかみ，結論を導くことができるが，二次元の表にまとめると新たな結論も見いだせる。","また，グラフに表す場合，この例は時系列データではないので折れ線グラフでなく，棒グラフを用いる方が適当であると判断し，棒グラフを選択することになる。一次元の表から棒グラフをかくことや，二次元の表からは複数の棒グラフを組み合わせたグラフをかくことで，その特徴を表すことができる。","結論について考察すること","こうして集めたデータを分類整理し，表やグラフなどに表して導いた結論が，問題の解決にかなうものであるのかどうか，また結論は誤りではないか，ということを考察する。結論が誤りかどうかは，データの集め方や他との比較を考えることで考察しやすくなる。","例えば先の例では，怖い本だけでなく図書室の利用者数に男女のかたよりがあるのではないか，といったことや，ほかの本と比べずに人気があるかどうか判断してよいか，といったようなことである。"]},"quoteEnd":0},"sansu-5-A-1":{"page":234,"name":"整数の性質","expl":{"intro":["第４学年までに，整数について，数のまとまりに着目し，十進位取り記数法の理解や，それを用いた筆算等の計算の仕方を考えることを指導してきた。","第５学年では，乗法や除法に着目し，整数の性質について学習する。整数の集合に類別したり，乗法的な構成に着目して集合を考えたりするなど，新たな視点から整数を捉え直し，様々な場面に活用するとともに，数に対する感覚がより豊かになるように指導していく。","ここで育成される資質・能力は，同じ大きさを表す分数を調べたり，約分や通分をしたりする際に用いるだけでなく，第６学年での等しい比，中学校第１学年「Ａ数と式」における自然数を素数の積に表すこと，第３学年の式の展開や因数分解の基礎となる内容である。"],"k":["ア 偶数，奇数","整数を２で割ると，余りは０か１になる。２で割ったときに余りが０になる整数を偶数といい，余りが１になる整数を奇数という。","このように，整数は，偶数又は奇数の２種類に類別される。全ての整数の集合は，偶数と奇数の二つの集合に類別されるということである。","このような整数の性質は，十進位取り記数法に依存しないので「一の位の数字に着目すればよい。」という記数法に着目する理解にとどまらないように配慮する必要がある。","イ 約数，倍数","12を割り切ることができる整数を12の約数という。１，２，３，４，６，12は12の約数である。また，３に整数をかけてできる数を３の倍数という。３，６，９，…は３の倍数である（このとき０は倍数に含めていない）。このように，約数や倍数の意味を指導するとともに，ある数の約数や倍数の全体をそれぞれ一つの集合として捉えられるようにすることをねらいとしている。","二つの整数の公約数や公倍数の集合は，それぞれの整数の約数や倍数からなる集合の共通な要素からなるものである。例えば，８の約数は｛１，２，４，８｝であり，12の約数は｛１，２，３，４，６，12｝である。これらから，８と12の公約数は｛１，２，４｝となる。最大公約数は，公約数の中で最大の数であるから，４であることが分かる。","また，８の倍数は｛８，16，24，32，…｝であり，12の倍数は｛12，24，36，48，…｝である。これらから８と12の公倍数は｛24，48，72，…｝となる。最小公倍数は，公倍数の中で最小の数であるから，24であることが分かる。","「内容の取扱い」の（1）では，最大公約数や最小公倍数の取扱いについて述べている。これらについては，具体的な場面に即して指導し，特に意味の理解を図るようにすることが大切である。"],"s":["ア  乗法及び除法に着目し，観点を決めて整数を類別する仕方を考えたり，数の構成について考察したりするとともに，日常生活に生かすこと","観点を決めて整数を類別する仕方を考えること","第４学年までに，例えば図形を考察する際に，図形を構成する要素に着目して図形を分類し，それぞれの集合に共通な性質を見いだすなどして図形を学んできている。","整数については，これまでは主に十進位取り記数法による表現を基に理解を深め，位に着目して学習してきている。ここでは，整数そのものを考察の対象とする。例えば，０以上の整数全体を二つに類別する仕方を考えていく。０，１，２，３，４，…を順に二つに分けていくと，１，３，５…の集合と，０，２，４，６，…の集合に分けられる。それぞれ，乗除を観点にその性質について考える。前者は「２で割って１余る数」とも言えるし，「２をかけて作った数＋１」ともいうことができる。後者は「２で割ると商が整数となり，割り切れる数」でもあるし，「２に整数をかけてできた数」でもある。このように乗法や除法に着目した観点で，整数全体を類別する仕方を考える。","数の構成について考察すること","第１学年では「一つの数をほかの数の和や差としてみるなど，ほかの数と関係付けてみること」，第２学年では「一つの数をほかの数の積としてみるなど，ほかの数と関係付けてみること」を指導してきている。","ここでは，乗法を用いて，例えば８×□で表される整数の集合（８の倍数）を考察の対象とする。児童は，九九の学習での「８の段」で表される範囲を超えて，無限に続いていくことを見いだすことができる。また，別の数で，例えば12×□で表される整数の集合を考えていくと，先ほどの８の倍数と共通の数を見いだすことができる。24は，８の倍数でもあり，12の倍数でもある。また，続いて調べていくと48，72，…が見いだされる。このように調べることで，整数の理解が深まるようにし，数の世界を広げながら探求していく素地となるようにする。","また，除法に着目して約数を考えていくことも，同様である。","日常生活に生かすこと","日常生活において，ものの集まりと数を１対１で対応付けることによって，ものの集まりを数を使って類別することができる。例えば，学級の児童を二つのグループに分けようとするとき，出席番号を２で割って，割り切れるかどうかという観点を決めると，全ての児童が，どちらかのグループに必ず入ることができる。また，三つ以上に分けるときを考えていくこともできる。"]},"quoteEnd":0},"sansu-5-A-2":{"page":237,"name":"整数，小数の記数法","expl":{"intro":["第４学年では億や兆の単位について知り，数のまとまりに着目し，整数の表し方に関して指導してきた。また，小数についても数のまとまりに着目して，数の範囲1","を の位などに拡張し，小数も整数と同じ十進数であることを指導してきた。100","第５学年では，整数と小数がともに十進位取り記数法によって表されているという観点に立って，十進数としての特徴をまとめて理解できるようにし，そのよさに気付き，学習したことを生活や学習などに能率よく用いる態度を養う。","ここで育成される資質・能力は，整数や小数，分数の計算を効率よくする際などに生かされるものである。"],"k":["ア 10倍，100倍，1000倍， ， などの大きさ","整数，小数の 10 倍，100 倍，1000 倍， ， などの大きさの数は，位の10   100","移動によってつくることができる。第５学年では，10倍，100倍，…したときの位の移動は，小数点の移動とも捉えることができるようにする。","十進位取り記数法の特徴についてまとめるとき，小数点の位置を移動して，10倍，1 1","100倍，1000倍， ， などの大きさの数をつくることを指導する。十進数では，10   100","小数点が１桁右に移ると10倍の大きさを表し，１桁左へ移ると の大きさを表す。10","そこで，10倍，100倍，1000倍， ， などの大きさの数を，小数点の移動な10   100","どによってつくることができる。必要に応じて， の大きさの数もつくること1000","ができる。こうした数の大きさの関係を調べる際には，形式的な操作のみを行うのではなく，数の大きさや数の構成についての感覚を豊かにするよう配慮することが大切である。"],"s":["ア  数の表し方の仕組みに着目し，数の相対的な大きさを考察し，計算などに有効に生かすこと","1 1整数，小数の乗法及び除法の計算の際には，10倍，100倍，1000倍， ，","10   100などの大きさの数は，小数点の移動などによってつくることができるということを用いて計算の結果を考えることができる。","10倍，100倍，…したときの位の移動は，小数点の移動とも捉えることができる。このことを十進位取り記数法の考えと関連付けられるようにすることが大切である。1","例えば，24.85÷100のような計算の場合，筆算をするのではなく， の大きさ100","の数は小数点が左へ二つ移動することから0.2485であると計算の結果を考えることができるようにする。","概算などに際してもこの考え方が十分用いられるように指導することが必要である。"]},"quoteEnd":0},"sansu-5-A-3":{"page":238,"name":"小数の乗法，除法","expl":{"intro":["第４学年では，小数の乗法及び除法について，数のまとまりに着目して，被乗数，被除数が小数の場合の乗法や除法，ある量の何倍かを表すのに小数を用いることがあることに関して指導してきた。","第５学年では，乗数，除数が小数の場合にも乗法や除法が用いられるように意味を広げることをねらいとしている。その際に，整数の場合の計算の意味や計算の仕方を活用して，新しい計算の仕方をつくることができるようにし，学習したことを1","生活や学習に活用する態度を養うことが大切である。計算の範囲としては， の位10","までの小数や の位までの小数などを指導する。","ここで育成される資質・能力は，分数の乗法及び除法の演算を判断したり，計算の仕方を見いだしたりする際などの考察に生かされるものである。"],"k":["ア 小数の乗法，除法の意味","小数の乗法の意味","第４学年までに，整数の乗法は，「一つ分の大きさが決まっているときに，その幾つ分かに当たる大きさを求める」場合や，「何倍かに当たる大きさを求める」場合などに用いるといった意味付けがなされてきた。","第５学年では，乗法を乗数が小数の場合にも用いることができるようにしたり，除法との関係も考えて，より広い場面や意味に用いることができるようにしたりして一般化していく。その際，数量関係を表している文脈が同じときには，整数の場合に成り立つ式の形は，小数の場合にもそのまま使えるようにするという考えにより，小数を含んだ乗法の意味を，「基準にする大きさ（Ｂ）」の「割合（ｐ）」に当たる大きさを求める操作がＢ×ｐであるとしてまとめることができる。Ａを「割合に当たる大きさ」とすると，Ｂ×ｐ＝Ａと表すことができる。このときｐが小数になってもこの式のまま使えるという拡張の考えを用いている。","例えば，１メートルの長さが80円の布を２メートル買ったときの代金は，80×２という式で表せる。同じ布を今度は0.8メートルや2.5メートル買ったときの代金についても，それぞれ80×0.8や80×2.5と，式の形は同じに表すことができる。数直線を用いることによって乗数ｐが１より小さい場合，積は被乗数Ｂより小さくなることも説明できる。","小数の除法の意味","除法の意味としては，乗法の逆として，割合を求める場合と，基準にする大きさを求める場合とがある。Ｂを「基準にする大きさ」，ｐを「割合」，Ａを「割合に当たる大きさ」とすると，次のような二つの場合である。","① ｐ＝Ａ÷Ｂ","これは，ＡはＢの何倍であるかを求める考えであり，除法の意味としては，ｐが整数の場合には，いわゆる包含除の考えに当たる。例えば，「９メートルの赤いリボンを，1.8メートルずつ切り取ると何本できるか」や「９メートルの赤いリボンは，1.8メートルの青いリボンの何倍になるか」という場合である。式は，９÷1.8となる。","② Ｂ＝Ａ÷ｐ","これは，基準にする大きさを求める考えであり，除法の意味としては，ｐが整数の場合には，いわゆる等分除の考えに当たる。例えば，「2.5メートルで200円の布は，１メートルではいくらになるか」という場合である。式は，200÷2.5となる。","これらの式は，Ｂやｐが整数の場合だけでなく，小数の場合にもそのまま当てはまると考えていくことが大切である。このとき，多くの児童にとっては，①の場合に比べ，②の方が捉えにくい。つまり，ｐが整数の場合は，ｐ等分した一つ分の大きさを求めるという見方で除法を捉えることもできたが，ｐが小数の場合を含めるときは，見方を一般化して，１に当たる大きき（基準にする大きさ）を求めるという説明で除法を捉える必要がある。このことに難しさがある。この点については，公式や言葉の式だけでなく，数直線や図などを用いたり具体的な場面に当てはめたりして分かりやすくすることが大切である。また，はじめに乗法の式に表してから，除法で求めるという考えを用いることも大切である。","なお，除数と商の大きさの関係については，除数が１より小さいとき，理解が困難になる児童が多くみられる。下の図のような数直線などを用いるなどして，除数が１より小さいとき，商が被除数よりも大きくなる理由について説明できるようにする。","イ 小数の乗法，除法の計算","小数は，整数と同じ十進位取り記数法で表現されているから，乗法や除法の計算は，単位，すなわち小数点の位置に着目してこれを移動し，整数に置き換えれば，整数の計算と同様な考え方で積や商を求めることができる。十進位取り記数法の仕組みが計算にも有効に生かされていることに気付くよう指導することが大切である。小数の乗法や除法の計算の仕方は，計算に関して成り立つ性質を用いて，整数の乗法や除法に直して考えることができる。","小数の乗法については，乗数を10倍すると積も10倍になることなどの乗法に関して成り立つ性質を生かして，児童が既習の整数の乗法に直して考えられるようにする。例えば，12×4.3の計算は，12×（4.3×10）÷10＝12×43÷10と考えることができる。また，12×0.43の計算は，12×（0.43×100）÷100＝12×43÷100と考えることができる。","小数の除法については，「除法の計算で，除数及び被除数に同じ数をかけても商は変わらない」という除法に関して成り立つ性質を生かして，計算の仕方を考えられるようにする。例えば，7.2÷2.4の計算は，（7.2×10）÷（2.4×10）＝72÷24と考えることができる。また，0.1÷0.04の計算は，（0.1×100）÷（0.04×100）＝10÷４と考えることができる。","なお，小数を割る計算の場面で，被除数の最小の位で割り切れないときは，割り進むことができることを指導する。例えば，0.5÷0.4＝1.25となる。","また，小数の除法で余りのある場合は，余りの小数点の位置に誤りが多いので注意を要する。その際には，余りが表す大きさを考えさせ，余りは除数より小さいことや，（被除数）＝（除数）×（商）＋（余り）の式に当てはめて，商，除数，余りの大きさの関係を捉えることなどについて指導する。","ウ 計算に関して成り立つ性質の小数への適用","整数の乗法及び除法に関して成り立つ関係や法則が，小数の場合でも成り立つことを確かめるようにする。","例えば，30×2.5と30×２＋30×0.5をそれぞれ計算すると結果は等しくなる。一般に，小数の場合でも，□×（△＋○）＝□×△＋□×○という分配法則が成り立つことが分かる。","こうした計算に関して成り立つ性質を活用して，計算の仕方を考えたり，計算の結果を確かめたりできるようにすることが大切である。"],"s":["ア  乗法及び除法の意味に着目し，乗数や除数が小数である場合まで数の範囲を広げて乗法及び除法の意味を捉え直すとともに，それらの計算の仕方を考えたり，それらを日常生活に生かしたりすること","乗法の計算の意味を捉え直すこと","乗数が整数の場合，Ｂ×ｐ＝Ａという式で表された乗法の意味を，一つ分の大きさＢのｐ個分に当たる大きさやｐ倍に当たる大きさを求める計算であると捉えていた。この乗法の意味を，乗数が小数の場合も含めて，乗法の意味をＢを１とみたときのｐに当たる大きさを求める計算と捉え直せるようにする。","例えば，１ｍ120円のリボン2.5ｍ分の代金を求める場合で考える。２ｍ分の代金は120×２，３ｍ分の代金は120×３と表すことができたことから，長さが2.5ｍのときも，代金は120×2.5と表すことができるのではと類推して考えることができる。金は120×２，３ｍ分の代金は120×３と表すことができたことから，長さが2.ただ，乗数が小数の場合も，整数と同じ考えで120×2.5と立式してよいかにつｍのときも，代金は120×2.5と表すことができるのではと類推して考えることがいては，この時点では明らかではない。乗数が小数でも120×2.5と式に表していできる。","いのか，その場合，小数をかける意味はどのように考えればよいか明らかにする必ただ，乗数が小数の場合も，整数と同じ考えで120×2.5と立式してよいかについ要てがはあ，るこ。の時点では明らかではない。乗数が小数でも120×2.5と式に表していい のそかこ，でそ実の際場に合12，0×小2数.5ををか今けまでるに意学味習はしどたの乗よ法うのに性考質えをれ用ばいよてい答かえ明をら出かしにてみする必要がある。","て，実際の値段と一致するか確かめてみることが大切である。例えば乗法の交換法そこで実際に120×2.5を今までに学習した乗法の性質を用いて答えを出してみ則を用いて答えを出すと，120×2.5＝2.5×120＝300となる。","て，実際の値段と一致するか確かめてみることが大切である。例えば乗法の交換一方，実際の値段を素朴に求めると，１ｍが120円，だから0.5ｍは60円。2.5法則を用いて答えを出すと，120×2.5＝2.5×120＝300となる。","ｍだから，120＋120＋60＝300となり一致する。このことから，120×2.5と書いて一方，実際の値段を素朴に求めると，１ｍが120円，だから0.5ｍは60円。2.よさそうだと考えることができる。","ｍだから，120＋120＋60＝300となり一致する。このことから，120×2.5と書い次に，乗数が整数の場合の乗法の意味では，乗数が小数の場合の意味を捉えるこてよさそうだと考えることができる。","と次がにで，き乗な数いがこ整と数かのら場，乗合法のの乗意法味のを意広味げでるは必，要乗が数あがる小。数２のｍ，場３合ｍの，意2味.5をｍ捉はそえるこれとぞがれで１きｍなをい基こにとするかとら，，２乗倍法，の３意倍味，を2.5広倍げにる当必た要るが。あそるこ。で，２下ｍの，よ３うｍな，数2直.5ｍは線そをれ用ぞいれて１，ｍ割を合基がに２のす時るはと1，20２×倍２，，３割合倍が，３2.の5倍とにき当にたはる120。×そ３ことで表，す下このとがような数直線を用いて，割合が２の時は120×２，割合が３のときには120×３と表すできたことから，割合が2.5のときも120×2.5と立式すると考えることができる。ことができたことから，割合が2.5のときも120×2.5と立式すると考えることが言い換えると，ある数に2.5をかけることは，ある数を１としたときに2.5に当たできる。言い換えると，ある数に2.5をかけることは，ある数を１としたときにる大きさを求めることになる。","2.5に当たる大きさを求めることになる。","このようにして，乗法とは割合に当たる大きさを求める計算であると考えることこのようにして，乗法とは割合に当たる大きさを求める計算であると考えるこで，乗数が整数の場合の意味も含み，乗数が整数でも小数でも同じ意味で捉えることで，乗数が整数の場合の意味も含み，乗数が整数でも小数でも同じ意味で捉えとができる。","ることができる。","乗法及び除法の計算の仕方を考えたり，それらを日常生活に生かしたりすること","乗法及び除法の計算の仕方を考えたり，それらを日常生活に生かしたりすること乗数が小数の乗法の計算の仕方は，数直線を用いたり，計算に関して成り立つ乗数が小数の乗法の計算の仕方は，数直線を用いたり，計算に関して成り立つ性性質などを用いたりすることにより考えることができる。","質などを用いたりすることにより考えることができる。","例えば，120×2.5の計算の仕方を考える。割合が0.1のときには量が12であり，例えば，120×2.5の計算の仕方を考える。割合が0.1のときには量が12であり，2.5という割合は0.1の25倍に当たることから，その量は，12×25で求めることがで2き.5るとい。う割合は0.1の25倍に当たることから，その量は，12×25で求めることがでまきたる，。計算に関して成り立つ性質を用いることもできる。乗数の2.5を10倍して 25まにたす，る計。算1に20関×し25てを成計り算立しつて性そ質のを答用いえるをこ10とでも割でるきとる，。1乗20数×の2.25.の5を答1え0が倍し求められる。これは，筆算形式での小数点の移動にもつながる考え方でもある。て25にする。120×25を計算してその答えを10で割ると，120×2.5の答えが求められる。これは，筆算形式での小数点の移動にもつながる考え方でもある。","小数の除法の意味や計算の仕方を考え-る2と40き-も同様な活動を行うことが大切である。また，身の回りには，小数で表された量が多くある。これらの量を用いて計算することも多い。このような場面を捉えて，小数やその計算を日常生活で生かそうとする態度を養うことが大切である。"]},"quoteEnd":0},"sansu-5-A-4":{"page":243,"name":"分数の意味と表し方","expl":{"intro":["第４学年では，真分数や仮分数，帯分数について，数を構成する単位に着目し，大きさの等しい分数を探すことや，それを日常生活に生かすことを考えることを指導してきた。","第５学年では，分数の意味や表し方についての理解を深めるとともに，数を構成する単位に着目し，数の相等及び大小関係について考察することや分数の表現に着目し，除法の結果の表し方を振り返り，分数の意味をまとめることなどの態度や能力を高めることをねらいとしている。","ここで育成される資質・能力は，第６学年の分数の乗法及び除法について，数の意味と表現，計算に関して成り立つ性質に着目した計算の仕方などの考察に生かされるものである。"],"k":["ア 分数と整数，小数の関係","整数，小数と分数の関係を理解する際に，整数と分数，小数と分数は別なものではなく，表記は違っても数としては同じものを表していることを実感させるようにする。","a","一般に，ある整数aを分数に表したいときは，a＝ とすればよい。しかし，１","整数を分数の形で表したときの分母は，必ずしも１とは限らず，分母のとる値によっ２  ４","て分子の値が決まる。例えば，２＝ ＝ ＝…などとなる。","小数を分数の形に表すには，分母として10，100，1000などを用いる。例えば，1 13","0.13は，0.01の13個分，すなわち の13個分にあたるので， と表すことが100   100","できる。","また，分数を整数や小数に表すことも指導する。例えば， は１÷４とみて，４","0.25と表すことができる。なお，分数には有限小数では表せないものもある。例え１","ば， は0.333…となり，有限小数では表すことができない。","イ 除法の結果と分数","二つの整数の乗法については，その計算の結果を常に整数で表すことができる。これに対して，二つの整数の除法については，商を小数まで割り進めても割り切れない場合（４÷３＝1.333…）があり，必ずしも計算の結果を整数や有限小数で表すことができるとは限らない。このとき，a÷b（a，bは整数でbは０でない）のa","商を という分数で表すと，どのようなときでも除法の結果を一つの数で表すこb","とができる。その際，６÷３＝２や２÷４＝0.5のように商が整数や小数になる場合も分数で表すことができることを理解できるようにする。","ウ 同じ大きさを表す分数","大きさの等しい分数の表し方は幾通りもある。例えば， ， ， ， ，…２   ４   ６   ８","は同じ大きさを表す分数である。","一つの分数の分子及び分母に同じ数を乗除してできる分数は，元の分数と同じ大２  ２×２  ４  ４  ４÷２  ２","きさを表している。例えば， ＝ ＝ となり， ＝ ＝ となる。３   ３×２   ６   ６   ６÷２   ３","このように分数は，同じ大きさの表し方が幾通りもあることが特徴である。この特a","徴は，a÷bが であることから分かるように，除法に関して成り立つ性質と同じb","である。","約分とは，分数の分子及び分母をそれらの公約数で割って，分母の小さい分数にすることである。約分した分数は，元の分数と同じ大きさを表す。約分の指導に際しても，数直線や図などを活用することが大切である。","このように，同じ大きさを表す分数の指導を通して，数についての感覚を豊かにするように配慮することが大切である。","エ 分数の相等と大小","幾つかの分数の相等や大小は，共通な分母に揃えることで比べることができる。分母が違う分数を分母が共通な分数に直すことを通分という。二つの分数を通分するときは，分母として，二つの分母の最小公倍数を用いると簡潔に表すことができる。通分の指導に当たっては，形式的に操作するだけでなく，その意味をよく理解し，大きさの等しい分数に着目できるようにすることが大切である。"],"s":["ア 数を構成する単位に着目し，数の相等及び大小関係について考察すること","異なるものを比べる場合には，基準や単位などを揃えて考える必要がある。分母の異なる分数の大きさを比べる場合には，共通な分母に揃えて考える必要がある。分母の異なる分数を共通な分母に揃えれば，単位分数の個数に着目して数の大小を判断できる。","分母の異なる分数を共通な分母に揃えるために，分母の大きさの違いに着目して,一つの分数の分子及び分母に同じ数を乗除してできる分数は元の分数と同じ大きさを表しているという特徴を生かして，共通の分母をつくり出すことを考えるようにする。","また，共通の分母をつくり出す際に，除法に関して成り立つ性質と関連付けながら，一つの分数の分子及び分母に同じ数を乗除してできる分数は，元の分数と同じ大きさを表していることについて考えることができるようにする。","イ  分数の表現に着目し，除法の結果の表し方を振り返り，分数の意味をまとめること","分数の表現に着目し，除法の結果の表し方の振り返ること","a  a","分子と分母によって表される分数の表現に着目し，a÷bを とみたり， をb   ba÷bとみたりできることについて考え，除法の結果を分数を用いて表すことができることを考えるようにする。","a  a","また，a÷bを とみたり， をa÷bとみたりすることを，分数を小数で表すb   b","ときや，分数の乗法，除法などの計算に生かそうとする態度を養うようにする。","分数の表現に着目して，分数の意味をまとめること","第３学年のところでも述べたが，分数の意味について，その観点の置き方によっ２","て，様々な捉え方ができる。 を例にすると，次のようである。","① 具体物を３等分したものの二つ分の大きさを表す。","② Ｌ， ｍのように，測定したときの量の大きさを表す。","③ １を３等分したもの(単位分数である ）の二つ分の大きさを表す。","④ ＡはＢの というように，Ｂを１としたときのＡの大きさの割合を表す。３","⑤ 整数の除法「２÷３」の結果（商）を表す。","分子と分母によって表される分数の表現に着目し，はしたの大きさ，量の大きさ，割合など，これまでの分数の意味について振り返りながら，分数には商を表す意味もあるというように，分数の意味を拡張して考えることができるようにする。"]},"quoteEnd":0},"sansu-5-A-5":{"page":246,"name":"分数の加法，減法","expl":{"intro":["第４学年では，和が１を超える同分母の分数の加法及び減法について，数を構成する単位に着目し，計算の仕方を考えることを指導してきた。","第５学年では，分数の意味や表し方について深めた理解の上に，異分母の分数の加法及び減法の計算の仕方を考え，それらの計算ができるようにすることをねらいとしている。分数の計算については，真分数をはじめ，仮分数や帯分数を含むものも指導する。その際，いたずらに複雑な計算を指導するのではなく，分数の意味や表現に着目し，計算の仕方を考えることや分数の計算を今後の学習へ活用できるようにすることを重視する必要がある。","ここでの資質・能力は，第６学年の分数の乗法及び除法について，数の意味と表現，計算に関して成り立つ性質に着目した計算の仕方などの考察に生かされるものである。"],"k":["ア 異分母の分数の加法，減法","分母が異なる分数の加法や減法は，通分することにより，分母が同じ分数の加法や減法として計算することができる。例えば，","１  １  １×３  １×２  ３  ２  ５","＋ ＝ ＋ ＝ ＋ ＝","２   ３   ２×３   ３×２   ６   ６   ６","と計算することになる。この場合，形式的に通分をして計算するのではなく，通分することによって単位分数の個数に着目して考えることが大切である。これは，単位を揃えて計算するという加法や減法の計算の基本になる考え方である。"],"s":["ア 分数の意味や表現に着目し，計算の仕方を考えること","分母の異なる分数の加法及び減法について，分母と分子を用いて表現された分数の意味や大きさに着目して，分母の異なる分数の大きさを比べる場合に用いた方法を振り返り，通分を用いた計算の仕方を考え出すことができるようにする。","また，分母と分子を用いて表現された分数の意味や大きさに着目して，あらかじめ結果の大きさについて見積もったり，得られた結果の妥当性を検討したりするなど，より妥当な判断を下そうとする慎重な態度を伸ばすようにする。"]},"quoteEnd":0},"sansu-5-A-6":{"page":247,"name":"数量の関係を表す式","expl":{"intro":["第４学年では，関数的な関係を捉えるための基礎となる見方や考え方を指導してきた。","第５学年では，□，△を用いた式に表し，式の中にある二つの数量の対応や変化の特徴について表などを用いて調べたり，二つの数量の関係を言葉の式で表したりする活動を十分に行い，関数の考えを伸ばすことをねらいとしている。","また，公式などの表している関係が，整数のみならず小数も含めて用いられることについて触れ，数量の関係や法則などを簡潔かつ一般的に表すという式の役割についての理解を深める。","第６学年では，□，△の代わりにa，xなどの文字を用いて，数量の関係や法則を簡潔かつ一般的に表現する力を高める。"],"k":["ア 数量の関係を表す式","第５学年では，第４学年までの理解の上に，□＝２＋△，□＝２×△，□＝３×△＋１などの式で表される数量の関係について調べ，数量の関係を表す式についての理解を深めることがねらいである。","数量の関係を表す式の意味を読み取るために，式の中にある二つの数量の対応や変化の関係の仕方にどんな特徴があるかを，表などを用いて調べることが大切である。また，伴って変わる二つの数量の関係を表などから読み取り，対応の関係や変化の関係を，□や△などの記号や言葉を用いたりして，一般的な式に表すことも十分に行えるように配慮する。","さらに，公式などの表している関係が，整数のみならず小数も含めて用いられることについて触れ，数量の関係や法則などを簡潔かつ一般的に表すという式の役割についての理解を深める。"],"s":["ア  二つの数量の対応や変わり方に着目し，簡単な式で表されている関係について考察すること","簡単な式とは□＝２＋△，□＝２×△，□＝３×△＋１などの式のことである。ここでは，簡単な式で表されている関係について，二つの数量の対応を基に，△に１，２，３，…を入れたときの□が幾つになるかを調べ，表に表し，伴って変わる二つの数量の変化の仕方について，表を使って考察することができるようにする。一方の数量が変化するともう一方の数量がどのように変化するかについてまとめた表から，対応の関係を見いだし，簡単に式で表現できるようにすることも大切である。","このように二つの数量の変わり方を，表や式を用いて考察することによって，式の意味を深めるとともに関数の考えを伸ばすようにする。","関数の考えや式の表現と読みは，他領域の内容を考察したり，活用したりする際に重要になるものである。例えば，三角形の高さと面積の関係や直径の長さと円周の長さの関係など，二つの数量の関係を捉えるのに有効である。そうしたことに配慮してこれらの指導を行うことが大切である。","Ｂ 図形"]},"quoteEnd":0},"sansu-5-B-1":{"page":248,"name":"平面図形の性質","expl":{"intro":["第４学年では，四角形を構成する要素である辺どうしの平行，垂直といった位置関係に加えて，構成する要素どうしの相等関係を基に分類し，平行四辺形，ひし形，台形について学習してきた。また，例えば正方形や二等辺三角形を真ん中で二つに切ると，形も大きさも同じ図形ができることを経験してきている。","第５学年では，図形を構成する要素及び図形間の関係に着目して，図形の構成の仕方を考えたり，図形の性質について更に考察したりすることをねらいとしている。図形の合同については，図形間の関係に着目し，与えられた図形と合同な図形をいかに構成すればよいかを考察する。多角形については，図形を構成する辺や角などの要素に着目して図形を弁別する。正多角形や円については，図形を構成する要素，並びに，図形を構成する要素の関係に着目することで，図形の性質を考察する。具体的には，円では直径と円周の長さに着目する。そして，見いだした性質について，筋道を立てて考え説明できるようにする。","図形の合同や多角形の角についての性質は，中学校第２学年において更に深めて学習することになる。"],"k":["ア 図形の形や大きさが決まる要素と図形の合同","三角形など簡単な平面図形について，図形が「決まる」という意味を理解し，合同な図形を能率的にかくことができるようにする。図形が決まることについては，ふつう，目的とする図形と合同な図形ができることを指している。","二つの図形がぴったりと重なるとき，つまり，形も大きさも同じであるとき，この二つの図形は合同であるという。二つの図形が合同であるとき，対応する辺や対応する角の大きさは，それぞれ等しい。","合同な図形を見付けたり，かいたり，つくったりする活動を通して，図形の形や大きさが一つに決まる要素について理解できるようにする。","例えば，三角形は，三つの辺と三つの角があるが，それらの要素を全て用いなくても，三つの辺の長さが決まれば三角形が一つに定まること，二つの辺の長さとその間の角の大きさが決まれば三角形が一つに定まること，一つの辺の長さとその両端の角の大きさが決まれば三角形が一つに決まることについて気付いていけるようにする。","三つの辺の長さが決まる 二つの辺の長さとその間の 一つの辺の長さとその両端の","角の大きさが決まる 角の大きさが決まる","また，二つの図形が合同かどうか確かめる場合には，全ての辺や角を調べなくてもよいことに，次第に着目させるようにする。例えば，長方形は縦と横の長さが分かれば決まる，ひし形は二つの対角線の長さが分かれば決まる，円は半径の長さが分かれば決まる，正方形や正三角形は一辺の長さが分かれば決まるなど，図形が決まるという観点から既習の図形について見直しをすることで，三角形が合同になる条件に気付かせるようにする。","その際，三角形の合同条件を覚えさせたり，形式的な推論をさせたりするなど深入りすることのないよう配慮する。これらは，中学校第２学年で学習する。","また，二つの合同な図形が，ずらしたり，回したり，裏返したりして置かれた場合でも，その位置に関係なく，必要な辺と辺，角と角が対応していることが捉えられるようにする。","このような合同の意味を理解し，合同の観点からこれまで学習してきた図形を見直すことも大切である。例えば，下の図のように，平行四辺形を対角線によって二つの三角形に分けると，合同な図形ができる。また，二つの合同な三角形を組み合わせて平行四辺形ができるし，合同な三角形をかくことで平行四辺形を作図することもできる。","二つの合同な三角形に分割 合同な二つの三角形の組み合わせ 合同な三角形による作図","また，「内容の取扱い」の（2）では，「平面を合同な図形で敷き詰めるなどの操作的な活動を重視するよう配慮するものとする」と示している。合同な三角形，四角形によって平面を敷き詰めることができることを確かめ，敷き詰めた図形の中にほかの図形を認めたり，平行線の性質に気付いたりするなど，図形についての見方や感覚を豊かにすることを指導する。","イ 多角形についての簡単な性質","多角形とは，三つ以上の直線で囲まれた図形である。例えば，６本の直線で囲まれた図形を，六角形という。","ある図形について，いつでも成り立つような事柄がある。そうしたものを図形の性質という。例えば，三角形については，どんな三角形でも，三つの角の大きさを加えると180度になる。これは，三角形のもつ性質である。また，四角形については，どんな四角形でも，四つの角の大きさを加えると360度になる。これは，四角形のもつ性質である。この性質は，三角形の三つの角の大きさを加えると180度になるという性質を用いて説明することができる。さらに，五角形についても，三角形のこの性質を用いると，五つの角の大きさを加えると540度になることが分かる。このように，三角形や四角形など多角形の性質について理解できるようにする。","ウ 正多角形","辺の長さが全て等しく，角の大きさが全て等しい多角形を，正多角形という。正三角形や正方形は，正多角形である。","正多角形には，円の内側にぴったり入る（円に内接する），円の外側にぴったり接する（円に外接する）などの性質がある。","例えば，円に内接する正八角形の頂点と円の中心とを結んでできる八つの三角形は，二等辺三角形であり，全て合同である。また，六つの合同な正三角形を一つの頂点が共通になるように並べると，正六角形ができる。円周をその円の半径の長さで区切っていくことによってできる形は，半径と等しい長さを一辺にもつ正六角形になる。","このように，正多角形について円と組み合わせて作図をしたり，正多角形についての性質を，円の性質と関連付けて調べたりできるようにする。","なお，第３の「指導計画の作成と内容の取扱い」の２の（2）では次のように書かれている。","「数量や図形についての感覚を豊かにしたり，表やグラフを用いて表現する力を高めたりするなどのため，必要な場面においてコンピュータなどを適切に活用すること。また，第１章総則の第３の１の（3）のイに掲げるプログラミングを体験しながら論理的思考力を身に付けるための学習活動を行う場合には，児童の負担に配慮しつつ，例えば第２の各学年の内容の〔第５学年〕の「Ｂ図形」の（1）における正多角形の作図を行う学習に関連して，正確な繰り返し作業を行う必要があり，更に一部を変えることでいろいろな正多角形を同様に考えることができる場面などで取り扱うこと。」","これは，正多角形の学習に関連して，児童の負担に配慮し，コンピュータを活用して正多角形の作図をするプログラミングを体験することができることを示している。","エ 円周率","円については，第３学年で，円の中心，半径，直径などについて指導してきている。第５学年では，円周率の意味を指導する。","円について直径の長さと円周の長さとの間に何か関係がありそうだと気付かせ，円周の長さは直径の長さの何倍になるかとの見通しを立てさせる。例えば，円に内接する正六角形と円に外接する正方形を利","用すれば，円周の長さは，正六角形の周り","の長さ（半径の６倍）より大きく，正方形","の周りの長さ（直径の４倍）より小さいと","いう見通しをもつことができる。実際に幾","つかの円について，直径の長さと円周の長","さを測定するなどして帰納的に考えることにより，どんな大きさの円についても，円周の長さの直径の長さに対する割合が一定であることを理解できるようにする。この割合のことを円周率という。","円周率を指導することにより，直径の長さから円周の長さを，また，逆に円周の長さから直径の長さを計算によって求めることができるなど，直径の長さ，円周の長さ，円周率の関係について理解できるようにする。","また，「内容の取扱い」の（3）では，「円周率は3.14を用いるものとする」と示している。"],"s":["ア  図形を構成する要素及び図形間の関係に着目し，構成の仕方を考察したり，図形の性質を見いだし，その性質を筋道を立てて考え説明したりすること図形を構成する要素に着目し，図形の性質を見いだすこと","図形の性質を調べるには，その図形を構成する要素に着目し，それらの関係を考察していくことになる。第５学年では，辺の長さや角の大きさの数量的な関係について考察し，図形の性質を見いだしていく。","例えば，三角形の性質を見いだすには，三角形を構成する要素である三つの辺の長さや三つの角の大きさに着目し，その数量的な関係を探る。そこで，三角形の三つの角の大きさの和に着目すると，その和がどんな場合でも一定であるという三角形の性質を見いだすことができる。","図形間の関係に着目し，構成の仕方を考察すること","二つの図形の関係を考えたとき，その最も基本的な関係として，「ぴったり重なる」という図形の合同を取り上げことができる。低学年から具体的な操作を通して二つの図形を「ぴったり重ねる」ことを行ってきている。第５学年では，「ぴったり重ねる」といった具体的な操作ができない場合でも，ぴったり重なることが説明できないかを考える。図形を構成する要素に着目して，対応する辺の長さや角の大きさが等しいかどうかを考えていくことになる。ぴったり重なるという具体的な操作を，対応する辺の長さや角の大きさが等しいことに置き換えて考えている点が重要である。そして，条件をなるべく少なくして思考を節約しようとする考えから，図形を構成する要素のうちどの要素が定まれば図形が一つに決定するかという図形の決定条件に目を向け，一つに図形が定まることから合同な図形を作図することを導くことになる。","例えば，二つの三角形の合同においては，三角形を構成する要素である三つの辺の長さ，三つの角の大きさに着目し，対応する辺の長さ，角の大きさが等しいかどうかを探ることになる。条件をなるべく少なくするために，どの要素が定まれば三角形が一つに決定するかという三角形の決定条件に目を向け合同であることを導くことになる。そして，三角形の決定条件が明らかにされると，それを基に，合同な三角形を作図することが可能になる。","図形の性質を筋道を立てて考え説明すること","筋道を立てて考えることには，ある前提を基に説明していくという演繹的な考えが代表的なものである。帰納的な考えや類推的な考えもまた，根拠となる事柄を示すという点で，筋道を立てた考えの一つといえる。","例えば，三角形の三つの角の大きさに着目し，幾つかの三角形について，三つの角の大きさの和を探ってみる。分度器で測ったり，合同な三角形を敷き詰めたり，三つの角の部分を寄せ集めたりするなどすると，調べた三角形の三つの角の大きさの和は，どれも180度になることが見えてくる。このように，幾つかの具体的な例に共通する一般的な事柄を見いだすことを帰納的に考えるという。一つの三角形だけで180度になることを説明するのではなく，複数の三角形で180度になることを説明することで，説明がより確かなものになることを味わえるようにする。","さらに，三角形の三つの角の大きさの和が180度であることが分かると，それを基に発展的に考え，四角形の四つの角の大きさの和はどうなるかを考えることができる。","四角形の四つの角の大きさの和は，三角形の三つの角の大きさの和が180度であることを基にして考えることができる。このように，既に正しいことが明らかになっている事柄を基にして別の新しい事柄を説明していくことを演繹的に考えるという。四角形の四つの角の和を基に説明する方法の代表的なものとして，次の二つの方法がある。①は四角形を１本の対角線で二つの三角形に分けて考える方法で，三角形の三つの角の大きさの和が180度であることを基にして，180度の２倍から360度を導き出す方法である。②は四角形の内部に点Ｅをとり，点Ｅと各頂点とを結んだ直線で四つの三角形に分けて考える方法で，三角形の三つの角の大きさの和が180度であることを基に ① Ａ ② Ａ","Ｄ Ｄ","して，180度の４倍から","点Ｅの周りの角の大きさ","Ｅ","である 360 度を引いて","360度を導き出す方法で","Ｂ Ｃ Ｂ Ｃある。 180×２ 180×４－360","これらの考え方を活用して考え説明しながら，筋道を立てて考えることに興味をもたせるようにするとともに，筋道を立てて考えることのよさについても気付かせていくようにする。"]},"quoteEnd":0},"sansu-5-B-2":{"page":254,"name":"立体図形の性質","expl":{"intro":["立体図形としては，第４学年で，立方体，直方体について，それを構成する要素（辺，面）に着目し，それらの平行及び垂直の関係について考察してきた。そして，立体図形を平面上にいかに表現するか，また逆に，平面上に表現された図からいかに立体図形を構成できるかを考察するとともに，日常の事象を図形の性質から捉え直してきている。これを受けて，第５学年では，角柱，円柱について指導する。図形を構成する要素である底面，側面に着目し，図形の性質を見いだすとともに，その性質を基に既習の図形を捉え直すことをねらいにしている。さらに，角錐，円錐については，中学校第１学年において指導される。","なお，〔用語・記号〕では，底面，側面という用語を示している。これらの用語を用いて説明したり，表現したりできるようにすることが大切である。"],"k":["ア 角柱や円柱","基本的な角柱や円柱とは，直角柱や直円柱のことである。以下，直角柱を角柱，直円柱を円柱として示す。","角柱や円柱は，底面と側面とで構成される立体である。角柱は，底面が多角形で側面が長方形や正方形の立体である。例えば，底面が三角形である角柱を三角柱，四角形である角柱を四角柱と呼ぶ。このとき，立方体や直方体についても四角柱の中に含めて捉えることができるようにする。また，円柱は，底面が円の柱体であることを指導する。","これらの立体図形について，図形を観察するなどの活動を通して，角柱や円柱の構成要素である頂点や辺や面の個数や面の形を捉えたり，辺と辺，辺と面，面と面の平行，垂直の関係を捉えたりすることができるように指導する。","また，見取図や展開図をかくことを通して，辺と辺，辺と面，面と面のつながりや位置関係を調べることができるようにする。また，展開図をかいて立体を構成する活動を通して，角柱や円柱についての理解を深め，空間についての感覚を豊かにする。"],"s":["ア  図形を構成する要素に着目し，図形の性質を見いだすとともに，その性質を基に既習の図形を捉え直すこと","図形を構成する要素に着目し，図形の性質を見いだすこと","図形を構成する要素として，頂点，辺，面を取り上げることができる。","角柱の底面は，三角形，四角形，五角形等があり，側面は，全て長方形や正方形である。角柱について図形を構成する要素に着目することで，図形を分類し名前をつけることができる。","また，角柱について，頂点の数，辺の数，面の数などをそれぞれ調べ，角柱について，頂点の数などの関係についてまとめることができるようにする。","見いだした図形の性質を基に既習の図形を捉え直すこと","底面，側面の形により分類した後で，既習の立方体，直方体についても振り返り，統合的に捉えることができないかを探ってみることが大切である。そうすると，立方体，直方体は，底面，側面が共に長方形や正方形であることから，四角柱の仲間として解釈し直すことができる。"]},"quoteEnd":0},"sansu-5-B-3":{"page":256,"name":"平面図形の面積","expl":{"intro":["第５学年では，第４学年における長方形や正方形の面積の学習を踏まえ，直線で囲まれた基本的な図形の面積について，必要な部分の長さを測り，既習の長方形や正方形などの面積の求め方に帰着させ計算によって求めたり，新しい公式をつくり出し，それを用いて求めたりすることができるようにすることを主なねらいとしている。そこで，既習の考えや経験を基に面積の求め方を考えたり，公式をつくったりする過程を重視することが大切である。","三角形，平行四辺形，ひし形，台形というように，面積の計算による求め方を繰り返し考えることで，基本図形の面積の求め方を見いだすだけでなく，その表現を振り返り，簡潔かつ的確な表現に高め，公式をつくりだしていく資質・能力の育成を目指すことが大切である。"],"k":["ア 三角形，平行四辺形，ひし形及び台形の面積の計算による求め方","第５学年においては，三角形や平行四辺形，ひし形及び台形の面積について，図形の見方を働かせて，第４学年までに学習してきた長方形や正方形の面積の求め方に帰着し，計算によって求めることができることを理解することが大切である。そして，計算による求め方を通して公式にして，三角形や平行四辺形，ひし形及び台形の面積は公式で求められることを理解し，それらを公式を使って求められるようにする。","その際，三角形や平行四辺形の底辺や高さの関係の理解を確実にすることが必要である。等積変形といった図形の操作活動に伴って，底辺をどこにとるかで高さが決まることを理解させることが大切である。また，実際に底辺の取り方を変えて面積を求め，それぞれの結果を比べる活動を取り入れることから，底辺をどこにとっても面積は同じであることを実感を伴って理解できるようにする。","高さ","底辺 高さ 高さ","底辺","高さ","底辺 底辺","さらには，求積のためにどの部分の長さを測る必","要があるかを考えることで，公式の理解を深め，活","用できるようにすることも大切である。","例えば，右のような，多くの辺の長さが示されて","いる場面において，平行四辺形の面積を求めようと","するとき，必要な情報を自ら選び出し面積を求める","などである。"],"s":["ア  図形を構成する要素などに着目して，基本図形の面積の求め方を見いだすとともに，その表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと","基本図形の面積の求め方を見いだすこと","第５学年においては，基本図形の面積の求め方を，図形を構成する要素などに着目して，既習の求積可能な図形の面積の求め方を基に考えたり，説明したりすることが大切である。","特に，図形について，本学年において思考力，判断力，表現力等を発揮させる基となる数学的な見方・考え方を働かせることで，例えば次のような考えが導かれる。","① 図形の一部を移動して，計算による求積が可能な図形に等積変形する考え","② 既習の計算による求積が可能な図形の半分の面積であるとみる考え","③ 既習の計算による求積が可能な図形に分割する考え","基本図形の面積の求め方を考える中で，上記のような数学的な見方・考え方を働かせることによって，児童が自ら工夫して面積を求めることができるようにすることが大切である。さらには，図形について数学的な見方・考え方を働かせることで，三角形などを組み合わせた形や一般の四角形などの面積の求め方を考え，測定できるようにするといった発展的に考察する態度を養うことも大切である。","例えば平行四辺形の面積を求めることについては，（あ）のような高さが図形の内部にある平行四辺形を長方形に等積変形して面積を求めるだけでなく，（い）のような高さが図形の内部にない平行四辺形の面積を求める場面においても，図形の見方を活用して考え，説明することが大切である。ここでは， 等積変形で（う）のように長方形に変形することや，（え）や（お）のように，（あ）で学習して求めることができるようになった平行四辺形に帰着させて面積を求めることを説明することが考えられる。","また，台形の面積を求めるとき，例えば下の図のようにして既習事項の平行四辺形や三角形などの面積の公式を活用することも大切である。","（か）では，具体物を用いて「台形を対角線で切って，三角形二つに分割してそれぞれの面積を求めて計算した。」と説明することができる。また，（き）では，「合同な台形をもう一つもってきて，台形二つを組み合わせて平行四辺形にすると，このときの底辺は（上底）＋（下底）になる。」などと説明することができる。さらには，（く）や（け）では，「台形の一部を移動したら，今までに学習した図形にすることができたので，その図形の面積の公式を用いて計算できた。」などと説明することができる。","このような活動を続けて行うことで，例えば，（さ）のような三角形の高さを二等分して等積変形し平行四辺形にして面積を求めようとする考えは，（し）のような特殊な三角形の場合や，（す）のような台形の場合でも活用できる考え方であることが分かる。","このように図形の面積の学習では，既習の面積の求め方の考えを活用することを繰り返すことにより，そのよさを実感することができるようにする。","面積の求め方の表現を振り返り，簡潔かつ的確な表現に高め，公式として導くこと","ある基本図形の面積の求め方を見いだしたら，もとの図形のどこの長さに着目すると面積を求めることができるのか，振り返って考えさせることが大切である。さらに，いつでも同じ要素などに着目することで，面積を求めることができるかどうかを確かめることによって，公式として導いていくようにする。"]},"quoteEnd":0},"sansu-5-B-4":{"page":259,"name":"立体図形の体積","expl":{"intro":["第１学年，第２学年でのかさの学習や，長さ，重さ，面積等の比較や測定の経験をしてきている。","第５学年では，立体の体積も面積などと同じように単位の大きさを決めるとその幾つ分として数値化して捉えることができるなど，立体の体積についてその単位や測定の意味を理解し，体積を求めることができるようにする。さらに，長方形などの面積の求め方と同じように，立方体や直方体の体積も，単位となる大きさに着目すると，図形の大きさを決定付ける辺の長さを基に計算で求めることが理解できるようにすることもねらいとしている。","第５学年の体積の学習においては，図形の面積と同様に，辺の長さなどを用いて計算によって求めることよさを理解できるようにすることが大切である。さらには，体積の単位間の関係についても振り返り，体積の大きさを実感をもって理解できるようにすることも大切である。"],"k":["ア 体積の単位（㎤，㎥）と測定","ここでは，面積を単位となる大きさを基に求めたことからの類推により，体積の単位としては空間を隙間なく埋め尽くす立体図形が適当であることについて理解できるようにする。そして，その立体図形としては一辺の長さでその大きさが決まる立方体が便利で，その一辺の長さが１㎝や１ｍのように長さの単位の大きさであるものが都合がよいことなどについて理解できるようにする。","また，身の回りにある立方体や直方体の体積を実際に求める活動や，実際に１㎥の大きさの立方体を観察する活動などにより，体積の大きさについての感覚が育成されるよう配慮する必要がある。なお，一辺が10㎝の立方体の体積が１Ｌに当たることにも触れるようにする。","イ 立方体及び直方体の体積の計算による求め方","立方体や直方体は，一辺が１㎝や１ｍなどの単位体積の立方体を積み重ねてつくることができる。したがって，長方形の面積を求めた場合からの類推によって，縦，横，高さを測ることによって，計算で体積を求めることができることを理解し，公式をつくることができるようにする。その際，例えば単位体積の立方体をきちんと敷き詰めた１段分の個数を（縦）×（横），その段の個数を（高さ）でそれぞれ表すことができることについての理解を確実にする必要がある。","また，身の回りにある立方体や直方体の体積を実際に求める体験的な活動により，体積についての量感を培うことができるよう配慮する必要がある。","さらに，具体物を用いたり図を用いたりして，縦と横の長さを固定した直方体について，高さが２倍，３倍，４倍，…になるときの体積の変化を考えさせるなどして，体積の公式の意味について，「Ｃ変化と関係」の比例の学習との関連で理解を深めさせることも大切である。このことが第６学年の角柱や円柱の体積の求積方法に活用される。"],"s":["ア  体積の単位や図形を構成する要素に着目し，図形の体積の求め方を考えるとともに，体積の単位とこれまでに学習した単位との関係を考察すること体積の単位や図形を構成する要素に着目し，図形の体積の求め方を考えること","立方体や直方体の体積を求める際，単位体積となる立方体を積み重ねないで体積を求めることについて考えることが大切である。その際，立方体や直方体には，単位体積となる立方体が規則正しく並んでいるので，乗法を用いると，手際よく個数を求めることができるよさに気付き，計算を用いて体積を求めたり，（直方体の体積）＝（縦）×（横）×（高さ）という公式を見いだしたりすることができるようにする。このことを通して，これまでに学習してきた乗法の一層の理解を深め，既習を基に統合的・発展的に考察する態度も養われる。","体積の単位とこれまでに学習した単位との関係を考察すること","これまでに学習してきた長さ，面積などの単位間の関係と，体積の単位間の関係を比較し，総合的に考察することで，単位間の関係について理解を深めるとともに，既習の知識と結びつけて考えようとする態度を養うことが大切である。","長さの単位 １㎝ （10㎝） １m","面積の単位 １㎠ （100㎠） １㎡","体積の単位 １㎤ （1000㎤） １㎥","かさの単位 １mL １Ｌ １kL","さらには，このような思考力，判断力，表現力が育成される学習を充実させることで，体積の大きさについての感覚を培うことが大切である。","Ｃ 変化と関係"]},"quoteEnd":0},"sansu-5-C-1":{"page":261,"name":"伴って変わる二つの数量の関係","expl":{"intro":["第４学年では，伴って変わる二つの数量について，それらの関係に着目し，表や式を用いて，変化や対応の特徴を考察することを指導してきた。","第５学年では，変わり方の特徴として，簡単な場合についての比例の関係を知るとともに，第４学年から継続して，伴って変わる二つの数量を見いだし，それらの関係に着目し，表や式を用いて，変化や対応の特徴を考察する力を伸ばしていく。また，考察の方法や結果を振り返って，簡潔・明瞭で一般化された表現に工夫するなど，よりよく問題解決する態度を養うことも大切である。","ここで育成される資質・能力は，第６学年の比例，反比例，中学校第１学年の比例，反比例などの考察に生かされるものである。"],"k":["ア 簡単な場合の比例の関係","第５学年では，伴って変わる二つの数量の関係の中から，特に簡単な場合について比例の関係を知ることをねらいとしている。簡単な場合とは，表を用いて，一方が２倍，３倍，４倍，…になれば，それに伴って他方も２倍，３倍，４倍，…になる二つの数量の関係について知る程度を指している。","具体的な場面としては，「階段１段の高さが15㎝ときの階段の段数と全体の高さ」，「横の長さが６㎝と決まっている場合の長方形の縦の長さと面積」などがある。表に数量を当てはめていくことで，比例の関係にあることを見いだすことができるようにする。","その際，比例の関係は，これまでに指導した乗法の場面と深く関わっていることに気付かせることも大切である。また，見いだした関係を的確に捉えるために，「縦の長さが２倍，３倍，４倍，…になれば，面積も２倍，３倍，４倍，…になる」などのように言葉を用いて表すことができるようにする。","このとき，１からの２倍，３倍，４倍，…を調べるだけでなく，２からも同様な関係になっていることも理解できるようにする。また，２倍や３倍であるということは，×２や×３をすることと考えれば，逆にみると÷２や÷３になっていることに触れる。"],"s":["ア  伴って変わる二つの数量を見いだして，それらの関係に着目し，表や式を用いて変化や対応の特徴を考察すること","伴って変わる二つの数量を見いだし，それらの関係に着目すること","第４学年では，加法，減法，乗法，除法の用いられる場合に関わって，伴って変わる二つの数量を見いだし，それらの関係に着目した。第５学年では，これらの理解の上に，簡単な場合についての比例の関係や加法と乗法など二つの演算が必要な場合に関わって，伴って変わる二つの数量を見いだし，それらの関係に着目していく。これまでと同様に，求めたい数量の大きさに対して，それと関係のある他の数量を使って調べられないかと考えて，事象を観察し，伴って変わる二つの数量を見いだす。そこでは，一方の数量を決めれば他方の数量が決まるかどうか，あるいは，一方の数量は他方の数量に伴って一定のきまりに従って変化するか，といった見方でみて，二つの数量の関係に着目する。考察の対象となる事柄の範囲を明確にすることも大切にしていく。","変化や対応の特徴を考察すること","第
