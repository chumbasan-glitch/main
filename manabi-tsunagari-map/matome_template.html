<title>学習指導要領まとめツール</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Zen+Maru+Gothic:wght@500;700&display=swap">
<style>
/* 紙の学習指導要領と解説を引く代わりの道具。上で選び、下に本文・解説・内容の取扱い・学年の目標を順に並べる */
:root{
  --bg:#f6f7f4; --panel:#ffffff; --ink:#1f2a2e; --ink2:#55626a; --line:#d9ded8; --accent:#2b5d8a; --mark:#ffe36b; --markInk:#1f2a2e;
  --soft:#eef3f8; --quote:#f4f6f1;
  --k:#2f7d5b; --kbg:#e6f4ec; --s:#2b5d8a; --sbg:#e5eef8; --m:#9a4f8c; --mbg:#f6e9f3;
  --font-display:"Zen Maru Gothic","BIZ UDPGothic","Hiragino Maru Gothic ProN","Meiryo",sans-serif;
  --font-body:"BIZ UDPGothic","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#161b1d; --panel:#1f2629; --ink:#e7ecea; --ink2:#a3afb3; --line:#36403f; --accent:#8cbbe6; --mark:#d9b800; --markInk:#111;
  --soft:#22303a; --quote:#232b2d;
  --k:#7fd3a8; --kbg:#1d3a2c; --s:#8cbbe6; --sbg:#1d2f42; --m:#e0a6d4; --mbg:#3a2336; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#161b1d; --panel:#1f2629; --ink:#e7ecea; --ink2:#a3afb3; --line:#36403f; --accent:#8cbbe6; --mark:#d9b800; --markInk:#111;
  --soft:#22303a; --quote:#232b2d;
  --k:#7fd3a8; --kbg:#1d3a2c; --s:#8cbbe6; --sbg:#1d2f42; --m:#e0a6d4; --mbg:#3a2336; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0; background:var(--bg); color:var(--ink); font-family:var(--font-body); font-size:15px; line-height:1.75}
button,input,select{font:inherit; color:inherit}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent); outline-offset:2px}
a{color:var(--accent)}
.wrap{max-width:1080px; margin:0 auto; padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px))}
header.top{position:sticky; top:0; z-index:20; background:var(--panel); border-bottom:1px solid var(--line)}
.topin{display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:6px 16px; padding-block:10px}
.brand{display:flex; align-items:center; gap:10px}
.brand h1{font-family:var(--font-display); font-size:20px; margin:0; letter-spacing:.03em}
.brand h1 .ed{font-size:.62em; margin-left:6px; padding:1px 7px; border-radius:999px; background:var(--accent); color:var(--panel); vertical-align:2px}
.logo{width:26px; height:26px; flex:none}
.tomap{font-size:13px; white-space:nowrap}
main{padding-block:16px 40px}
.lead{color:var(--ink2); margin:0 0 12px; max-width:62em}
.panel{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:14px}
.row{display:flex; flex-wrap:wrap; align-items:center; gap:8px; margin:6px 0}
.lbl{font-size:13px; color:var(--ink2); min-width:4.5em}
.seg{display:inline-flex; flex-wrap:wrap; border:1px solid var(--line); border-radius:10px; overflow:hidden}
.seg button{border:0; background:var(--panel); padding:7px 14px; cursor:pointer; min-height:40px}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent); color:var(--panel); font-weight:700}
.gbtn{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; cursor:pointer; min-height:40px; min-width:52px}
.gbtn[aria-pressed="true"]{background:var(--ink); color:var(--panel); border-color:var(--ink); font-weight:700}
select{border:1px solid var(--line); border-radius:8px; padding:7px 10px; background:var(--panel); min-height:40px}
.picks{display:grid; grid-template-columns:repeat(auto-fill,minmax(230px,1fr)); gap:8px; margin-top:8px}
.pick{display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--panel); border-radius:10px; padding:8px 11px; cursor:pointer; line-height:1.45; min-height:44px}
.pick:hover{border-color:var(--accent)}
.pick[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent); background:var(--soft)}
.pick small{display:block; color:var(--ink2); font-size:12px}
.areaH{font-size:13px; font-weight:700; color:var(--ink2); margin:12px 0 2px}
.search{display:flex; gap:8px}
.search input{flex:1; border:1px solid var(--line); border-radius:10px; padding:9px 12px; background:var(--panel); min-height:44px; font-size:16px}
.hits{margin-top:8px}
.hit{display:block; width:100%; text-align:left; border:0; border-top:1px solid var(--line); background:none; padding:8px 4px; cursor:pointer}
.hit b{font-size:14px}
.hit p{margin:2px 0 0; font-size:13px; color:var(--ink2)}
mark{background:var(--mark); color:var(--markInk); border-radius:2px; padding:0 1px}
.note{font-size:13px; color:var(--ink2)}

/* 結果 */
#result h2{font-family:var(--font-display); font-size:22px; margin:2px 0 4px; line-height:1.4}
.meta{display:flex; flex-wrap:wrap; gap:6px; font-size:13px; margin-bottom:6px}
.badge{border:1px solid var(--line); border-radius:999px; padding:1px 10px; background:var(--panel)}
.units{display:flex; flex-wrap:wrap; gap:6px; margin:6px 0 10px}
.unit{font-size:13px; background:var(--soft); border-radius:6px; padding:2px 8px}
.kanbar{position:sticky; top:var(--hh,58px); z-index:10; background:var(--bg); padding:8px 0; display:flex; flex-wrap:wrap; gap:6px; align-items:center}
.kanbar button{border:1px solid var(--line); background:var(--panel); border-radius:999px; padding:6px 14px; cursor:pointer; min-height:40px}
.kanbar button[aria-pressed="true"]{color:var(--panel); font-weight:700; border-color:transparent; background:var(--ink)}
.kanbar button[data-kan="k"][aria-pressed="true"]{background:var(--k)}
.kanbar button[data-kan="s"][aria-pressed="true"]{background:var(--s)}
.kanbar button[data-kan="m"][aria-pressed="true"]{background:var(--m)}
.multi{display:flex; flex-wrap:wrap; gap:6px; margin:4px 0 6px}
.multi button{border:1px solid var(--line); background:var(--panel); border-radius:8px; padding:4px 10px; cursor:pointer; font-size:13px}
.multi button[aria-pressed="true"]{border-color:var(--accent); box-shadow:inset 0 0 0 2px var(--accent)}
.sec{background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin:10px 0}
.sec > h3{margin:0 0 6px; font-size:16px; display:flex; flex-wrap:wrap; align-items:baseline; gap:4px 10px}
.sec > h3 .num{font-family:var(--font-display); color:var(--accent)}
.src{font-size:12px; color:var(--ink2); margin:6px 0 0}
.blk{border-left:4px solid var(--line); padding:4px 10px; margin:8px 0; border-radius:0 8px 8px 0}
.blk[data-kan="k"]{border-color:var(--k); background:var(--kbg)}
.blk[data-kan="s"]{border-color:var(--s); background:var(--sbg)}
.blk[data-kan="m"]{border-color:var(--m); background:var(--mbg)}
.blk .tag{display:inline-block; font-size:12px; font-weight:700; margin-bottom:2px}
.blk[data-kan="k"] .tag{color:var(--k)} .blk[data-kan="s"] .tag{color:var(--s)} .blk[data-kan="m"] .tag{color:var(--m)}
.quote{background:var(--quote); border-radius:8px; padding:6px 12px}
.blk p,.quote p,.sec p{margin:4px 0}
p.sub{font-weight:700; margin-top:10px}
.kref{display:block; font-weight:400; font-size:12px; color:var(--ink2)}
p.kmark{font-size:12px; color:var(--ink2); margin-top:10px}
.bhead{font-weight:700; margin:16px 0 4px; padding-top:8px; border-top:1px dashed var(--line)}
.bhead:first-child{border-top:0; margin-top:4px}
.tsunaBtn{border:1px solid var(--accent); color:var(--accent); background:var(--panel); border-radius:999px; padding:6px 14px; cursor:pointer; font-weight:700; min-height:40px; margin:4px 0}
.tsunaBtn[aria-expanded="true"]{background:var(--accent); color:var(--panel)}
.tsuna .tname{font-weight:700; margin:10px 0 4px}
.tsteps{display:flex; gap:6px; overflow-x:auto; padding-bottom:4px}
.tstep{flex:0 0 auto; width:136px; text-align:left; border:1px solid var(--line); border-radius:8px; padding:5px 7px; font-size:12px; line-height:1.4; background:var(--soft); color:var(--ink)}
.tstep b{display:block; font-size:11px}
button.tstep{cursor:pointer} button.tstep:hover{border-color:var(--accent)}
.tstep.now{outline:3px solid var(--ink); outline-offset:-1px; background:var(--panel)}
.tpn{display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:6px}
.tpn > div{border:1px solid var(--line); border-radius:8px; padding:6px 8px; font-size:13px}
.tpn b{display:block; font-size:12px; color:var(--ink2)}
.tlink{display:block; border:0; background:none; padding:2px 0; text-align:left; cursor:pointer; color:var(--accent); text-decoration:underline; font-size:13px}
.tpn span, .tmates span:not(.note){display:block; font-size:13px}
.tmates summary{cursor:pointer; color:var(--accent)}
.tcross{border:1px solid var(--line); border-radius:8px; padding:6px 8px; margin:6px 0; font-size:13px}
@media (max-width:640px){ .tpn{grid-template-columns:1fr} }
.partnote{background:var(--soft); border-radius:8px; padding:6px 10px; font-size:13px; margin:6px 0; display:flex; flex-wrap:wrap; gap:6px 10px; align-items:center}
p.i1{padding-left:1em; text-indent:-1em}
p.i2{padding-left:2em; text-indent:-1em}
details.sec > summary{cursor:pointer; font-weight:700}
body.only-k .blk:not([data-kan="k"]), body.only-s .blk:not([data-kan="s"]), body.only-m .blk:not([data-kan="m"]){display:none}
body.only-k .sec[data-has]:not([data-has~="k"]), body.only-s .sec[data-has]:not([data-has~="s"]), body.only-m .sec[data-has]:not([data-has~="m"]){display:none}
.empty{color:var(--ink2); font-size:14px; padding:6px 0}
.keito{display:grid; grid-template-columns:repeat(var(--n), minmax(260px, 1fr)); gap:10px; overflow-x:auto; padding-bottom:8px; margin-top:8px}
.kcol{min-width:0}
.ktab-wrap{overflow-x:auto; margin-top:8px}
.ktab{border-collapse:separate; border-spacing:6px; width:100%; min-width:820px; table-layout:fixed}
.ktab th{font-size:13px; text-align:left; vertical-align:top}
.ktab thead th{background:var(--ink); color:var(--panel); border-radius:8px; padding:4px 10px; text-align:center}
.ktab thead th small{font-weight:400; opacity:.85}
.ktab thead th:first-child,.ktab tbody th{background:none; color:var(--ink2); width:110px; padding-top:10px}
.ktab td{vertical-align:top; padding:0}
.kstack{display:flex; flex-direction:column; gap:6px}   /* 1つのマスに2つ以上の内容（クロールと平泳ぎなど）を縦に積む。高さは指定しない */
.ktab td .kcell{margin:0}
.khead{background:var(--ink); color:var(--panel); border-radius:8px; padding:4px 10px; font-weight:700; text-align:center; margin-bottom:6px}
.kcell{background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:8px 10px; margin-bottom:8px; font-size:14px}
.kname{font-weight:700; margin-bottom:4px}
.kexp summary{cursor:pointer; color:var(--accent); font-size:13px; margin-top:4px}
.kexp:not([open]) .k-c, .kexp[open] .k-o{display:none}   /* 開いているときは「解説を閉じる」 */
.kopen{border:0; background:none; color:var(--accent); cursor:pointer; padding:4px 0 0; font-size:13px; text-decoration:underline}
footer{color:var(--ink2); font-size:12px; text-align:center; padding:20px 16px 30px}
@media (max-width:640px){
  .brand h1{font-size:17px}
  #result h2{font-size:19px}
  .sec{padding:10px 12px}
  .picks{grid-template-columns:1fr}
}
</style>

<header class="top" id="hdr"><div class="wrap topin">
  <div class="brand">
    <svg class="logo" viewBox="0 0 26 26" aria-hidden="true"><rect x="3" y="3" width="17" height="20" rx="2" fill="none" stroke="currentColor" stroke-width="2"/><path d="M7 9h9M7 13h9M7 17h6" stroke="currentColor" stroke-width="2"/><circle cx="19" cy="18" r="4" fill="none" stroke="#2b5d8a" stroke-width="2.2"/><path d="M22 21l2.5 2.5" stroke="#2b5d8a" stroke-width="2.4" stroke-linecap="round"/></svg>
    <h1>学習指導要領まとめツール</h1>
  </div>
  <a class="tomap" id="toMap" href="#" hidden>学びのつながりマップへ →</a>
</div></header>

<main class="wrap">
  <p class="lead">教科書の単元、学習指導要領の区分、または言葉から選ぶと、学習指導要領の本文、解説のその内容の説明、内容の取扱い、学年の目標をまとめて読めます。「知識及び技能」などのボタンで、その観点の部分だけにしぼれます。</p>

  <div class="panel">
    <div class="row"><span class="lbl">教科</span><select id="subjSel" aria-label="教科"></select><span class="note" id="subjNote"></span></div>
    <div class="row"><span class="lbl">さがし方</span>
      <div class="seg" role="group" aria-label="さがし方">
        <button type="button" data-way="unit" aria-pressed="true">単元から</button>
        <button type="button" data-way="area" aria-pressed="false">区分から</button>
        <button type="button" data-way="word" aria-pressed="false">言葉で検索</button>
        <button type="button" data-way="keito" aria-pressed="false">系統で比べる</button>
      </div>
    </div>
    <div class="row" id="gradeRow"><span class="lbl">学年</span><div class="row" id="grades" style="margin:0"></div></div>
    <div id="pickUnit"></div>
    <div id="pickArea" hidden></div>
    <div id="pickKeito" hidden></div>
    <div id="pickWord" hidden>
      <div class="search"><input id="q" type="search" placeholder="例：概数、単位量あたり、筆算" aria-label="さがす言葉" autocomplete="off"></div>
      <div class="hits" id="hits"></div>
    </div>
  </div>

  <section id="result" aria-live="polite"><p class="empty">上で単元や内容を選んでください。</p></section>
</main>
<footer id="foot"></footer>

<script>
/*DATA*/
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const KAN = {k:"知識及び技能", s:"思考力、判断力、表現力等", m:"学びに向かう力、人間性等"};
const S = DATA.subjects, SUB = Object.fromEntries(S.map(s => [s.id, s]));
let cur = {subj:S[0].id, way:"unit", g:1, sel:null, part:0, kan:"all", q:""};
const store = {get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } }, set(k, v){ try{ localStorage.setItem(k, v); }catch(e){} }};

/* 段落の字下げ：ア・（ア）などで始まる行は少し下げる */
/* 「アは，『知識及び技能』に関わる事項である。」「アのイは，技能に関わる事項である。」（社会）などの区切りの文は，小さな灰色の文字にする */
const KMARK = /^[アイ](の[ア-ン](及び[ア-ン])?|の前文及びアからサまで)?は，.{0,24}(に関わる)?事項であ(る|り)/;
const pcls = t => t.length < 60 && KMARK.test(t) ? "kmark" : /^（内容の取扱い）|^\(\d\) 「.+」に関わる目標$/.test(t) ? "sub" : /^（[ア-ン]）|^\([ア-ン]\)/.test(t) ? "i2" : /^[ア-ンⅠ-Ⅹ①-⑳][\s　]/.test(t) ? "i1" : "";
const paras = (ls, q) => ls.map(t => '<p class="' + pcls(t) + '">' + hl(t, q) + '</p>').join("");
/* 「アのアは，…」が本文のどこを指すかを小さく添える（社会の6年の歴史など，同じ書き出しがいくつも続くため） */
function refOf(it, t){
  const m = t.length < 60 && t.match(/^([アイ])の([ア-ン])(?:及び([ア-ン]))?は，/); if(!m) return "";
  const i = it.lines.findIndex(l => l.startsWith(m[1] + "　")); if(i < 0) return "";
  for(let j = i + 1; j < it.lines.length && !/^[ア-ン]　/.test(it.lines[j]); j++)
    if(it.lines[j].startsWith("（" + m[2] + "）")){ const x = it.lines[j].replace(/^（.）　/, ""); return "（" + m[2] + "）" + (x.length > 34 ? x.slice(0, 34) + "…" : x); }
  return "";
}
const parasIt = (ls, q, it) => ls.map(t => { const r = refOf(it, t); return '<p class="' + pcls(t) + '">' + hl(t, q) + (r ? '<span class="kref">本文：' + esc(r) + '</span>' : '') + '</p>'; }).join("");
const hl = (t, q) => { const e = esc(t); if(!q) return e; const qq = esc(q); return e.split(qq).join('<mark>' + qq + '</mark>'); };

function renderSubjects(){
  $("subjSel").innerHTML = S.map(s => '<option value="' + s.id + '"' + (s.id === cur.subj ? ' selected' : '') + '>' + esc(s.name) + '</option>').join("") +
    DATA.coming.map(n => '<option disabled>' + esc(n) + '（準備中）</option>').join("");
  const s = SUB[cur.subj];
  $("subjNote").textContent = s.textbook ? "教科書：" + s.textbook : "";
}
function renderGrades(){
  const s = SUB[cur.subj];
  if(!s.grades.includes(cur.g)) cur.g = s.grades[0];   /* 理科・社会は3年から */
  $("grades").innerHTML = s.grades.map(g => '<button type="button" class="gbtn" data-g="' + g + '" aria-pressed="' + (g === cur.g) + '">' + g + '年</button>').join("");
  $("grades").querySelectorAll("button").forEach(b => b.onclick = () => { cur.g = +b.dataset.g; renderPicks(); });
}
function renderPicks(){
  const nu = !SUB[cur.subj].units.length; document.querySelector('[data-way="unit"]').hidden = nu;   /* 教科書のない教科等 */
  const nk = SUB[cur.subj].noKeito; document.querySelector('[data-way="keito"]').hidden = !!nk;
  if(nk && cur.way === "keito") cur.way = "unit";
  if(nu && cur.way === "unit") cur.way = "area";
  document.querySelectorAll("[data-way]").forEach(b => b.setAttribute("aria-pressed", b.dataset.way === cur.way));
  $("pickUnit").hidden = cur.way !== "unit"; $("pickArea").hidden = cur.way !== "area"; $("pickWord").hidden = cur.way !== "word"; $("pickKeito").hidden = cur.way !== "keito";
  $("gradeRow").hidden = cur.way === "word" || cur.way === "keito";
  if(cur.way === "keito"){ renderKeitoPick(); return; }
  renderGrades();
  const s = SUB[cur.subj];
  if(cur.way === "unit"){
    const us = s.units.filter(u => u.g === cur.g);
    $("pickUnit").innerHTML = us.length ? '<div class="picks">' + us.map((u, i) => '<button type="button" class="pick" data-u="' + i + '" aria-pressed="' + (cur.sel && cur.sel.t === "u" && cur.sel.name === u.u && cur.sel.g === u.g) + '">' + esc(u.u) + '<small>' + esc(u.b) + '・' + u.ids.length + 'つの内容</small></button>').join("") + '</div>'
      : '<p class="empty">この学年の単元はありません。</p>';
    if(s.unitNote) $("pickUnit").insertAdjacentHTML("afterbegin", '<p class="note">' + esc(s.unitNote) + '</p>');
    $("pickUnit").querySelectorAll("[data-u]").forEach(b => b.onclick = () => { const u = us[+b.dataset.u]; select({t:"u", g:u.g, name:u.u, book:u.b, ids:u.ids, parts:u.parts}); });
  }
  if(cur.way === "area"){
    let h = "";
    for(const a of s.areas){
      const its = s.items.filter(it => it.g.includes(cur.g) && it.area === a.key);
      if(!its.length) continue;
      h += '<div class="areaH">' + esc(a.name) + '</div><div class="picks">' + its.map(it => '<button type="button" class="pick" data-i="' + it.id + '" aria-pressed="' + (cur.sel && cur.sel.t === "i" && cur.sel.ids[0] === it.id) + '">' + esc((it.mark ? it.mark + " " : "") + it.head) + '</button>').join("") + '</div>';
    }
    if(s.katsudo && s.katsudo[cur.g]) h += '<div class="areaH">' + esc(s.katsudoName) + '</div><div class="picks"><button type="button" class="pick" data-k="1">' + esc(s.katsudoName) + '（' + cur.g + '年）</button></div>';
    $("pickArea").innerHTML = h;
    $("pickArea").querySelectorAll("[data-i]").forEach(b => b.onclick = () => select({t:"i", g:cur.g, ids:[b.dataset.i]}));
    $("pickArea").querySelectorAll("[data-k]").forEach(b => b.onclick = () => select({t:"k", g:cur.g, ids:[]}));
  }
}
function select(sel){ cur.sel = sel; cur.part = 0; cur.allParts = false; renderPicks(); renderResult(); location.hash = encodeURIComponent(cur.subj + ":" + (sel.t === "u" ? "u:" + sel.g + ":" + sel.name : sel.t === "k" ? "k:" + sel.g : "i:" + sel.ids[0])); scrollToResult(); }

  $("result").innerHTML = h;
  $("openAll").onclick = () => { const ds = [...$("result").querySelectorAll(".kexp")], open = !ds.every(d => d.open); ds.forEach(d => d.open = open); $("openAll").textContent = open ? "解説をすべて閉じる" : "解説をすべて開く"; };
  $("result").querySelectorAll(".kopen").forEach(b => b.onclick = () => { const it = s.items.find(i => i.id === b.dataset.i); cur.way = "area"; cur.g = it.g[0]; cur.kan = kan; select({t:"i", g:it.g[0], ids:[it.id]}); });
}
/* 系統表の形：同じ内容（幅跳び・走り幅跳びなど）を横の行にそろえる */
function renderKeitoRows(s, area, cols){
  const all = s.krows[cur.kArea];
  /* 見たい行だけを選ぶ（何も選ばなければすべて）。選んだ行は解説を開いておく */
  cur.kPick = cur.kPick || {};
  const pick = cur.kPick[cur.kArea] || [];
  const names = ["全体", ...all.map(r => r.name)];
  const showAll = !pick.length, want = n => showAll || pick.includes(n);
  const rows = all.filter(r => want(r.name));
  const it3 = cols.map(c => c.its[0]);
  const sub = (it, L) => {   /* 本文の⑴の中の「ア　…」と，解説の小見出し「ア …」の部分 */
    const P = splitHonbun(it).k, i = P.findIndex(l => l.startsWith(L + "　") || l.startsWith(L + " "));
    let line = i >= 0 ? [P[i]] : [];
    for(let j = i + 1; i >= 0 && j < P.length && /^（/.test(P[j]); j++) line.push(P[j]);
    const K = s.kaisetsu.items[it.id], ex = K && K.ksub ? K.ksub[L] || [] : [];
    return '<div class="kcell">' + (line.length ? '<div class="blk" data-kan="k">' + paras(line) + '</div>' : '') +
      (ex.length ? '<details class="kexp"><summary><span class="k-o">解説を開く</span><span class="k-c">解説を閉じる</span>（' + esc(ex[0].replace(/^[アイウエオ]\s+/, "")) + '）</summary>' + paras(ex.slice(1)) + '</details>' : '') + '</div>';
  };
  let h = '<div class="meta"><span class="badge">' + esc(s.name) + '</span><span class="badge">' + esc(area.name) + '</span><span class="badge" style="border-color:var(--k);color:var(--k)">' + KAN.k + '</span></div>' +
    '<h2>系統で比べる：' + esc(area.name.replace(/^[Ａ-Ｚ]\s*/, "")) + '</h2>' +
    '<div class="row"><span class="lbl">見たい内容</span><div class="row" style="margin:0" id="rowPick">' +
      '<button type="button" class="gbtn" data-rp="" aria-pressed="' + showAll + '">すべて</button>' +
      names.map(n => '<button type="button" class="gbtn" data-rp="' + esc(n) + '" aria-pressed="' + (!showAll && pick.includes(n)) + '">' + esc(n) + '</button>').join("") + '</div></div>' +
    '<p class="note" style="margin:2px 0">いくつでも選べます。選んだ内容は、解説を開いた状態で出ます。</p>' +
    '<div class="row"><p class="note" style="margin:0">解説 体育編の付録「領域別系統表」の並びに合わせて、同じ内容を横の行にそろえています（行の分け方はClaudeによるものです）。</p><button type="button" class="gbtn" id="openAll">解説をすべて開く</button></div>' +
    '<div class="ktab-wrap"><table class="ktab"><thead><tr><th></th>' + cols.map((c, i) => '<th>' + (c.g.length > 1 ? c.g[0] + '・' + c.g[c.g.length - 1] : c.g[0]) + '年<br><small>' + esc(s.kaisetsu.items[it3[i].id] ? s.kaisetsu.items[it3[i].id].name : it3[i].head) + '</small></th>').join("") + '</tr></thead><tbody>';
  /* いちばん上の行：⑴の書き出しと，小見出しの前にある説明（「基本的な技とは」など） */
  if(want("全体")) h += '<tr><th>全体</th>' + it3.map(it => { const P = splitHonbun(it).k, K = s.kaisetsu.items[it.id], pre = K && K.ksub ? K.ksub[""] || [] : [];
    return '<td><div class="kcell"><div class="blk" data-kan="k">' + paras(P.slice(0, 1)) + '</div>' + (pre.length ? '<details class="kexp"><summary><span class="k-o">解説を開く</span><span class="k-c">解説を閉じる</span>（全体）</summary>' + paras(pre) + '</details>' : '') + '</div></td>'; }).join("") + '</tr>';
  const span = rows.map(() => cols.map(() => 1));
  rows.forEach((r, ri) => cols.forEach((c, ci) => { if(ri > 0 && r.cells[ci] && r.cells[ci] === rows[ri - 1].cells[ci]){ let k = ri - 1; while(span[k][ci] === 0) k--; span[k][ci]++; span[ri][ci] = 0; } }));
  rows.forEach((r, ri) => {
    h += '<tr><th>' + esc(r.name) + '</th>';
    cols.forEach((c, ci) => {
      if(span[ri][ci] === 0) return;
      const rs = span[ri][ci] > 1 ? ' rowspan="' + span[ri][ci] + '"' : '';
      const L = r.cells[ci];
      h += '<td' + rs + '>' + (L ? '<div class="kstack">' + [...L].map(x => sub(it3[ci], x)).join("") + '</div>' : '<p class="note" style="text-align:center">―</p>') + '</td>';
    });
    h += '</tr>';
  });
  h += '</tbody></table></div><p class="src">出典：小学校学習指導要領（平成29年告示）' + esc(s.section) + '／' + esc(s.kaisetsu.source) + '（行の並びは同書 付録「小学校及び中学校の領域別系統表」を参考にした）</p>';
  $("result").innerHTML = h;
  if(!showAll){ $("result").querySelectorAll(".kexp").forEach(d => d.open = true); $("openAll").textContent = "解説をすべて閉じる"; }
  $("openAll").onclick = () => { const ds = [...$("result").querySelectorAll(".kexp")], open = !ds.every(d => d.open); ds.forEach(d => d.open = open); $("openAll").textContent = open ? "解説をすべて閉じる" : "解説をすべて開く"; };
  $("rowPick").querySelectorAll("[data-rp]").forEach(b => b.onclick = () => {
    const n = b.dataset.rp; let p = cur.kPick[cur.kArea] || [];
    p = !n ? [] : p.includes(n) ? p.filter(x => x !== n) : [...p, n];
    cur.kPick[cur.kArea] = p.length === names.length ? [] : p;
    renderKeito();
  });
}
/* 算数：テーマ（整数のしくみ・わり算など）を行，1〜6年を列にして，同じ系統の内容を横にそろえる */
function renderKeitoThemes(s, area, kan){
  const all = s.trows[cur.kArea];
  cur.kPick = cur.kPick || {};
  const key = cur.kArea + ":" + kan, pick = cur.kPick[key] || [], showAll = !pick.length;
  const rows = all.filter(r => showAll || pick.includes(r.name));
  const gs = s.grades.filter(g => rows.some(r => (r.cells[g] || []).length));   /* 内容のない学年の列は出さない */
  const cell = (c) => {
    const it = s.items.find(i => i.id === c.id), K = s.kaisetsu.items[it.id], body = splitHonbun(it)[kan];
    let expl = K ? K.expl[kan] || [] : [], note = "";
    if(K && !expl.length && K.expl.intro.length && !K.expl.k.length && !K.expl.s.length){ expl = K.expl.intro; note = "（ア・イに分けて書かれていないため説明全体）"; }
    const other = it.area !== cur.kArea ? '<span class="note">（' + esc((s.areas.find(a => a.key === it.area) || {}).name || "") + '）</span>' : '';
    return '<div class="kcell"><div class="kname">' + esc(((it.mark || "") + " " + c.lab).trim()) + other + '</div>' +
      (body.length ? '<div class="blk" data-kan="' + kan + '">' + paras(body) + '</div>' : '') +
      (expl.length ? '<details class="kexp"><summary><span class="k-o">解説を開く</span><span class="k-c">解説を閉じる</span>（p.' + K.page + '〜）' + esc(note) + '</summary>' + paras(expl).replace(/<p class="i1">(ア|イ|ウ|エ|オ)[\s　]/g, '<p class="sub">$1 ') + '</details>' : '') +
      '<button type="button" class="kopen" data-i="' + it.id + '">くわしく見る →</button></div>';
  };
  let h = '<div class="meta"><span class="badge">' + esc(s.name) + '</span><span class="badge">' + esc(area.name) + '</span><span class="badge" style="border-color:var(--' + kan + ');color:var(--' + kan + ')">' + KAN[kan] + '</span></div>' +
    '<h2>系統で比べる：' + esc(area.name.replace(/^[Ａ-Ｚ]\s*/, "")) + '</h2>' +
    '<div class="row"><span class="lbl">見たい内容</span><div class="row" style="margin:0" id="rowPick"><button type="button" class="gbtn" data-rp="" aria-pressed="' + showAll + '">すべて</button>' +
      all.map(r => '<button type="button" class="gbtn" data-rp="' + esc(r.name) + '" aria-pressed="' + (!showAll && pick.includes(r.name)) + '">' + esc(r.name) + '</button>').join("") + '</div></div>' +
    '<p class="note" style="margin:2px 0">いくつでも選べます。選んだ内容は、解説を開いた状態で出ます。' + esc(s.trowNote || "") + '</p>' +
    '<div class="row"><button type="button" class="gbtn" id="openAll">解説をすべて開く</button>' + (gs.length > 3 ? '<span class="note">横にスクロールすると' + gs[gs.length - 1] + '年まで見られます。</span>' : '') + '</div>' +
    '<div class="ktab-wrap"><table class="ktab" style="min-width:' + (gs.length * 230 + 120) + 'px"><thead><tr><th></th>' + gs.map(g => '<th>' + (s.tcols ? s.tcols[g] : g + '年') + '</th>').join("") + '</tr></thead><tbody>';
  for(const r of rows){
    h += '<tr><th>' + esc(r.name) + '</th>' + gs.map(g => { const cs = r.cells[g] || []; return '<td>' + (cs.length ? '<div class="kstack">' + cs.map(cell).join("") + '</div>' : '<p class="note" style="text-align:center">―</p>') + '</td>'; }).join("") + '</tr>';
  }
  h += '</tbody></table></div><p class="src">出典：小学校学習指導要領（平成29年告示）' + esc(s.section) + '／' + esc(s.kaisetsu.source) + '</p>';
  $("result").innerHTML = h;
  if(!showAll){ $("result").querySelectorAll(".kexp").forEach(d => d.open = true); $("openAll").textContent = "解説をすべて閉じる"; }
  $("openAll").onclick = () => { const ds = [...$("result").querySelectorAll(".kexp")], open = !ds.every(d => d.open); ds.forEach(d => d.open = open); $("openAll").textContent = open ? "解説をすべて閉じる" : "解説をすべて開く"; };
  $("rowPick").querySelectorAll("[data-rp]").forEach(b => b.onclick = () => {
    const n = b.dataset.rp; let p = cur.kPick[key] || [];
    p = !n ? [] : p.includes(n) ? p.filter(x => x !== n) : [...p, n];
    cur.kPick[key] = p.length === all.length ? [] : p; renderKeito();
  });
  $("result").querySelectorAll(".kopen").forEach(b => b.onclick = () => { const it = s.items.find(i => i.id === b.dataset.i); cur.way = "area"; cur.g = it.g[0]; cur.kan = kan; select({t:"i", g:it.g[0], ids:[it.id]}); });
}
function renderResult(){
  if(cur.way === "keito") return renderKeito();
  const s = SUB[cur.subj], sel = cur.sel, q = cur.way === "word" ? cur.q : "";
  document.body.classList.remove("only-k", "only-s", "only-m");
  if(cur.kan !== "all") document.body.classList.add("only-" + cur.kan);
  if(!sel){ $("result").innerHTML = '<p class="empty">上で単元や内容を選んでください。</p>'; return; }
  let h = "";
  if(sel.t === "k"){
    const k = s.katsudo[sel.g];
    h = '<div class="meta"><span class="badge">' + sel.g + '年</span><span class="badge">' + esc(s.name) + '</span></div><h2>' + esc(s.katsudoName) + '</h2>' + kanBar() +
      '<section class="sec"><h3>本文と解説の説明（p.' + k.page + '〜）</h3>' + paras(k.paras, q) + '<p class="src">出典：' + esc(s.kaisetsu.source) + '　p.' + k.page + '〜</p></section>' + goalSec(sel.g, q, 2);
  } else if(sel.t === "g"){
    h = '<div class="meta"><span class="badge">' + esc(s.name) + '</span></div><h2>' + sel.g + '年の目標</h2>' + kanBar() + goalSec(sel.g, $("q").value.trim(), 1);
  } else {
    const its = sel.ids.map(id => s.items.find(i => i.id === id)).filter(Boolean);
    const it = its[Math.min(cur.part, its.length - 1)];
    const area = s.areas.find(a => a.key === it.area);
    h = '<div class="meta"><span class="badge">' + (it.g.length > 1 ? it.g[0] + '・' + it.g[it.g.length - 1] : it.g[0]) + '年</span><span class="badge">' + esc(s.name) + '</span><span class="badge">' + esc(area ? area.name : it.areaName) + '</span>' + (sel.t === "u" ? '<span class="badge">単元：' + esc(sel.name) + '（' + esc(sel.book) + '）</span>' : '') + '</div>';
    if(its.length > 1) h += '<p class="note" style="margin:4px 0 0">この単元には、学習指導要領の内容が ' + its.length + ' つ結び付いています。</p><div class="multi">' + its.map((x, i) => '<button type="button" data-part="' + i + '" aria-pressed="' + (x === it) + '">' + esc((x.mark ? x.mark + " " : "") + x.head) + '</button>').join("") + '</div>';
    h += '<h2>' + esc((it.mark ? it.mark + " " : "") + (s.kaisetsu.items[it.id] ? s.kaisetsu.items[it.id].name : it.head)) + '</h2>';
    if(it.units && it.units.length) h += '<div class="units">' + it.units.map(u => '<span class="unit">📖 ' + esc(u.u) + '（' + esc(u.b) + '）</span>').join("") + '</div>';
    if(it.tsuna && (it.tsuna.flows.length || it.tsuna.cross.length)) h += '<button type="button" class="tsunaBtn" id="tsunaBtn" aria-expanded="' + !!cur.tsuna + '">🔗 ' + (cur.tsuna ? '学びのつながりを閉じる' : '学びのつながりを見る') + '</button>' + (cur.tsuna ? tsunaSec(it) : '');
    if(it.kan) h += '<p class="note" style="margin:4px 0">この指導事項は〔' + KAN[it.kan] + '〕の内容です。' + (it.kan === "k" ? '「思考力、判断力、表現力等」はＡ〜Ｃの指導事項にあります。' : '「知識及び技能」は⑴〜⑶の指導事項にあります。') + '「学びに向かう力、人間性等」は学年の目標の（3）を見てください。</p>';
    h += (s.noKan ? '' : kanBar()) + itemSecs(it, q) + goalSec(it.g[0], q, (s.bandSecs && s.bandSecs[it.g[0]]) || (it.notes && it.notes.length) ? 4 : 3);
    if(s.katsudo && s.katsudo[it.g[0]]) h += '<details class="sec"><summary>' + esc(s.katsudoName) + '（' + it.g[0] + '年）の本文と解説</summary>' + paras(s.katsudo[it.g[0]].paras, q) + '<p class="src">出典：' + esc(s.kaisetsu.source) + '　p.' + s.katsudo[it.g[0]].page + '〜</p></details>';
  }
  $("result").innerHTML = h;
  $("result").querySelectorAll("[data-kan]").forEach(b => { if(b.tagName === "BUTTON") b.onclick = () => { cur.kan = b.dataset.kan; store.set("matome-kan", cur.kan); renderResult(); }; });
  $("result").querySelectorAll("[data-part]").forEach(b => b.onclick = () => { cur.part = +b.dataset.part; renderResult(); });
  if($("tsunaBtn")) $("tsunaBtn").onclick = () => { cur.tsuna = !cur.tsuna; renderResult(); if(cur.tsuna) document.querySelector(".tsuna").scrollIntoView({behavior:"smooth", block:"nearest"}); };
  $("result").querySelectorAll("[data-go]").forEach(b => b.onclick = () => goItem(b.dataset.go));
  if($("allParts")) $("allParts").onclick = () => { cur.allParts = true; renderResult(); };
  if($("unitParts")) $("unitParts").onclick = () => { cur.allParts = false; renderResult(); };
}

/* ---------- 学びのつながり（つながりマップの詳しい画面と同じ中身） ---------- */
function tsunaSec(it){
  const R = DATA.refs, T = it.tsuna, g0 = it.g[0], gEnd = it.g[it.g.length - 1];
  const name = id => { const r = R[id]; return r.gl + (r.s !== cur.subj ? '・' + r.sn : ''); };
  const link = (id, lab) => { const r = R[id]; return SUB[r.s] && id !== it.id ? '<button type="button" class="tlink" data-go="' + id + '">' + esc(name(id)) + '：' + esc(lab || r.h) + '</button>' : '<span>' + esc(name(id)) + '：' + esc(lab || r.h) + '</span>'; };
  let h = '<section class="sec tsuna"><h3>学びのつながり<span class="note">テーマ（Claudeが学習指導要領の内容から作ったもの）ごとの学年の流れと、教科横断のテーマです。つながりマップの詳しい画面と同じ中身です。</span></h3>';
  for(const f of T.flows){
    const st = f.steps.map(([id, lab]) => ({id, lab, r:R[id]}));
    const prev = st.filter(x => x.r.g[x.r.g.length - 1] < g0), next = st.filter(x => x.r.g[0] > gEnd);
    const pg = prev.length ? Math.max(...prev.map(x => x.r.g[x.r.g.length - 1])) : null, ng = next.length ? Math.min(...next.map(x => x.r.g[0])) : null;
    h += '<div class="tflow"><div class="tname">テーマ「' + esc(f.name) + '」</div><div class="tsteps">' +
      st.map(x => '<' + (SUB[x.r.s] && x.id !== it.id ? 'button type="button" data-go="' + x.id + '"' : 'div') + ' class="tstep' + (x.id === it.id ? ' now' : '') + '"><b>' + esc(name(x.id)) + (x.id === it.id ? '（いま）' : '') + '</b>' + esc(x.lab) + '</' + (SUB[x.r.s] && x.id !== it.id ? 'button' : 'div') + '>').join("") + '</div>' +
      '<div class="tpn"><div><b>前の学年で学んだこと</b>' + (pg ? prev.filter(x => x.r.g[x.r.g.length - 1] === pg).map(x => link(x.id, x.lab)).join("") : '<span class="note">このテーマは、ここから始まります。</span>') + '</div>' +
      '<div><b>次の学年で学ぶこと</b>' + (ng ? next.filter(x => x.r.g[0] === ng).map(x => link(x.id, x.lab)).join("") : '<span class="note">小学校では、ここがまとめになります（中学校へつながります）。</span>') + '</div></div></div>';
  }
  if(T.cross.length) h += '<h4 style="margin:12px 0 4px;font-size:14px">教科横断のテーマ</h4>' + T.cross.map(c => '<div class="tcross"><b>' + esc(c.name) + '</b> <span class="note">' + esc(c.cats.join("、")) + '</span>' +
    (c.mates.length > 6 ? '<details class="tmates"><summary class="note">同じ小見出しの内容（' + c.mates.length + '）を見る</summary>' + c.mates.map(id => link(id)).join("") + '</details>'   /* 多いときはたたむ */
      : c.mates.length ? '<div class="tmates"><span class="note">同じ小見出しの内容：</span>' + c.mates.map(id => link(id)).join("") + '</div>' : '') + '</div>').join("");
  h += '<p class="note" style="margin-top:8px">ボタンになっている内容は、押すとこのツールで開きます。マップ全体で見るときは <a href="' + esc(DATA.mapUrl) + '" target="_blank" rel="noopener">学びのつながりマップ</a> へ。</p></section>';
  return h;
}
function goItem(id){
  const r = DATA.refs[id]; if(!SUB[r.s]) return;
  if(cur.subj !== r.s){ cur.subj = r.s; renderSubjects(); }
  cur.way = "area"; cur.g = r.g[0];
  select({t:"i", g:r.g[0], ids:[id]});
}

/* はじめ */
document.querySelectorAll("[data-way]").forEach(b => b.onclick = () => { cur.way = b.dataset.way; renderPicks(); if(cur.way === "word") $("q").focus(); });
$("subjSel").onchange = () => { cur.subj = $("subjSel").value; cur.sel = null; renderSubjects(); renderPicks(); renderResult(); };
let qt; $("q").addEventListener("input", () => { clearTimeout(qt); qt = setTimeout(doSearch, 200); });
if(DATA.mapUrl){ $("toMap").hidden = false; $("toMap").href = DATA.mapUrl; }
if(DATA.edition){ document.querySelector(".brand h1").insertAdjacentHTML("beforeend", '<small class="ed">' + esc(DATA.edition) + '</small>'); }
$("foot").textContent = DATA.footer;
const hh = () => document.documentElement.style.setProperty("--hh", $("hdr").offsetHeight + "px"); hh(); addEventListener("resize", hh);
const k0 = store.get("matome-kan"); if(k0 && (k0 === "all" || KAN[k0])) cur.kan = k0;
(function fromHash(){
  const h = decodeURIComponent(location.hash.slice(1)); if(!h) return;
  const [sid, t, a, b] = h.split(":"); if(!SUB[sid]) return; cur.subj = sid; const s = SUB[sid];
  if(t === "i"){ const it = s.items.find(i => i.id === a); if(it){ cur.way = "area"; cur.g = it.g[0]; cur.sel = {t:"i", g:it.g[0], ids:[a]}; } }
  if(t === "u"){ const u = s.units.find(x => x.g === +a && x.u === b); if(u){ cur.way = "unit"; cur.g = u.g; cur.sel = {t:"u", g:u.g, name:u.u, book:u.b, ids:u.ids, parts:u.parts}; } }
  if(t === "k"){ cur.way = "area"; cur.g = +a; cur.sel = {t:"k", g:+a, ids:[]}; }
})();
renderSubjects(); renderPicks(); renderResult();
</script>
