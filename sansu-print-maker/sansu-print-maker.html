const FR = (n, d) => { d = d || 1; if(d < 0){ n = -n; d = -d; } const g = gcd(n, d) || 1; return [n / g, d / g]; };
const fmul = (a, b) => FR(a[0] * b[0], a[1] * b[1]);
const fdiv = (a, b) => FR(a[0] * b[1], a[1] * b[0]);
const fadd = (a, b) => FR(a[0] * b[1] + b[0] * a[1], a[1] * b[1]);
const fsub = (a, b) => FR(a[0] * b[1] - b[0] * a[1], a[1] * b[1]);
const fA = f => fAns(f[0], f[1]);
const fM = f => { const [n, d] = FR(f[0], f[1]); if(d === 1) return String(n); return n > d ? MX(Math.floor(n / d), n % d, d) : F(n, d); };
const decFr = s => { const [n, k] = dparse(s); return FR(n, P10(k)); };
const fStr = f => f[1] === 1 ? String(f[0]) : F(f[0], f[1]);

/* ---------- 対称な図形 ---------- */
function symShape(kind){
  for(;;){
    if(kind === "line"){
      const k = ri(2, 3), top = [0, -ri(5, 8) / 2], bot = [0, ri(5, 8) / 2], right = [];
      const r0 = (R() - 0.5) * 0.6, ys = k === 2 ? [-1.3 + r0, 1.1 + r0] : [-2 + r0, 0 + r0, 1.9 + r0];
      for(const y of ys) right.push([1.2 + R() * 2, y]);
      const pts = [top].concat(right, [bot], right.slice().reverse().map(p => [-p[0], p[1]]));
      return {pts, k, n:pts.length};
    }
    const m = ri(2, 3), base = R() * 60, pts = [];
    let a = base;
    for(let i = 0; i < m; i++){ const r = 1.6 + R() * 1.4; pts.push([r * Math.cos(a * D2R), r * Math.sin(a * D2R)]); a += 180 / m * (0.75 + R() * 0.5); }
    const all = pts.concat(pts.map(p => [-p[0], -p[1]]));
    const angs = all.map(p => (Math.atan2(p[1], p[0]) * 180 / Math.PI + 360 - base + 1) % 360);
    if(!angs.every((v, i) => i === 0 || v > angs[i - 1] + 25)) continue;
    return {pts:all, m, n:all.length};
  }
}
function genSymFig(lv, kind){
  const S = symShape(kind), N = S.n, names = LETTERS.slice(0, N).split("");
  let corr;
  if(kind === "line") corr = i => (N - i) % N;
  else corr = i => (i + N / 2) % N;
  const pick1 = kind === "line" ? ri(1, S.k) : ri(0, N / 2 - 1);
  const i1 = pick1, i2 = (i1 + 1) % N, j1 = corr(i1), j2 = corr(i2);
  const i3 = kind === "line" ? ri(1, S.k) : ri(0, N - 1);
  const subs = [
    `点${names[i1]}に対応する点((点${names[j1]}))`,
    `辺${names[i1]}${names[i2]}に対応する辺((辺${names[j1]}${names[j2]}))`,
    `角${names[i3]}に対応する角((角${names[corr(i3)]}))`
  ];
  if(lv >= 1){ const v = ri(2, 6); subs.push(`辺${names[i1]}${names[i2]}の長さが${v}cmのとき，辺${names[j1]}${names[j2]}の長さ((${v}cm))`); }
  if(lv === 2){
    if(kind === "line") subs.push(`直線${names[i1]}${names[j1]}と${TAI}の${JIKU}は，どのように交わっていますか。((垂直に交わる))`);
    else { const v = ri(2, 5); subs.push(`直線O${names[i1]}の長さが${v}cmのとき，直線O${names[j1]}の長さ((${v}cm))`); }
  }
  const draw = (G, x, y, w, h, fs) => {
    const extra = kind === "line" ? [[0, S.pts[0][1] - 1.6], [0, S.pts[S.k + 1][1] + 1.6]] : [];
    const f = fitPts(S.pts.concat(extra), x, y, w, h, 6), P = f.pts.slice(0, N), cen = centroid(P);
    G.poly(P, {w:0.4, fill:SHADE});
    P.forEach((p, i) => { if(kind === "line" && (i === 0 || i === S.k + 1)) G.text(names[i], p[0] + 0.9 * fs, p[1] + (i ? 0.5 : -0.5) * fs, {size:fs * 0.85, align:"center"}); else vLabel(G, p, cen, names[i], fs); });
    if(kind === "line"){
      const a = f.pts[N], b = f.pts[N + 1];
      G.line(a[0], a[1], b[0], b[1], {w:0.3, dash:[1.2, 0.6, 0.3, 0.6]});
      G.text("ア", a[0] - 1.2, a[1] + 0.6, {size:fs * 0.75, align:"right"}); G.text("イ", b[0] - 1.2, b[1] - 0.6, {size:fs * 0.75, align:"right"});
    } else {
      const o = centroid(P); G.dot(o[0], o[1], 0.45); G.text("O", o[0] + 1.2, o[1] + 1.5, {size:fs * 0.75});
    }
  };
  const inst = kind === "line" ? `下の図は線${TAI}な図形で，直線アイは${TAI}の${JIKU}です。` : `下の図は点${TAI}な図形で，点Oは${TAI}の中心です。`;
  return setItem(66, 56, draw, subs, {inst, lead:(kind === "line" ? "線" : "点") + TAI + "な図形"});
}
/* 方眼：線対称・点対称な図形の残りの半分をかく */
function drawGridLines(G, x, y, cols, rows, c){
  for(let i = 0; i <= cols; i++) G.line(x + i * c, y, x + i * c, y + rows * c, {w:0.12, color:GRID});
  for(let j = 0; j <= rows; j++) G.line(x, y + j * c, x + cols * c, y + j * c, {w:0.12, color:GRID});
}
function genSymDraw(lv){
  const kind = lv === 0 ? "line" : lv === 2 ? "point" : pick(["line", "point"]);
  const COLS = 12, ROWS = 10, C = 5;
  let half, other;
  for(;;){
    if(kind === "line"){
      const y0 = ri(1, 3), y1 = ri(7, 9), k = ri(2, 3);
      const ys = shuffle([2, 3, 4, 5, 6, 7, 8].filter(v => v > y0 && v < y1)).slice(0, k).sort((a, b) => a - b);
      if(ys.length < 2) continue;
      half = [[6, y0]].concat(ys.map(v => [6 + ri(1, 5), v]), [[6, y1]]);
      other = half.map(p => [12 - p[0], p[1]]);
    } else {
      const k = ri(1, 2), a0 = ri(0, 11) * 15, pts = [];
      const step = 180 / (k + 1);
      for(let i = 0; i <= k; i++){ const a = (a0 + i * step + (i ? ri(-12, 12) : 0)) * D2R, r = ri(2, 4); pts.push([6 + Math.round(r * Math.cos(a)), 5 + Math.round(r * Math.sin(a))]); }
      const endp = [12 - pts[0][0], 10 - pts[0][1]];
      half = pts.concat([endp]);
      other = half.map(p => [12 - p[0], 10 - p[1]]);
      const all = half.concat(other.slice(1, -1));
      const ang = all.map(p => (Math.atan2(p[1] - 5, p[0] - 6) * 180 / Math.PI - a0 + 720) % 360);
      if(new Set(all.map(p => p.join())).size !== all.length) continue;
      if(!ang.every((v, i) => i === 0 || v > ang[i - 1] + 8)) continue;
    }
    if(half.concat(other).every(p => p[0] >= 0 && p[0] <= COLS && p[1] >= 0 && p[1] <= ROWS)) break;
  }
  const draw = (G, x, y, w, h, fs, ans) => {
    const gx = x + 2, gy = y + 1;
    drawGridLines(G, gx, gy, COLS, ROWS, C);
    const T = p => [gx + p[0] * C, gy + p[1] * C];
    if(kind === "line"){
      G.line(...T([6, -0.4]), ...T([6, ROWS + 0.4]), {w:0.35, dash:[1.2, 0.6, 0.3, 0.6]});
      G.text("ア", T([6, -0.4])[0] + 1.3, T([6, -0.4])[1] + 0.8, {size:fs * 0.7}); G.text("イ", T([6, ROWS])[0] + 1.3, T([6, ROWS])[1] - 0.8, {size:fs * 0.7});
    } else { const o = T([6, 5]); G.dot(o[0], o[1], 0.6); G.text("O", o[0] + 1.3, o[1] + 1.8, {size:fs * 0.7}); }
    G.poly(half.map(T), {close:false, w:0.55});
    if(ans) G.poly(other.map(T), {close:false, w:0.55, color:RED});
  };
  const inst = kind === "line" ? `直線アイを${TAI}の${JIKU}とする線${TAI}な図形になるように，残りの半分をかきましょう。` : `点Oを${TAI}の中心とする点${TAI}な図形になるように，残りの半分をかきましょう。`;
  return figItem(COLS * C + 4, ROWS * C + 2, draw, "", {inst, lead:(kind === "line" ? "線" : "点") + TAI + "な図形をかく", sig:JSON.stringify(half)});
}

function frPair(lv, maxD){

}

/* ---------- 資料の整理 ---------- */
function makeData(n, lo, hi, needMode){
  for(let t = 0; t < 500; t++){
    const d = Array.from({length:n}, () => ri(lo, hi));
    if(needMode){ const m = ri(lo, hi), k = ri(2, 3); for(let i = 0; i < k; i++) d[i] = m; }
    const cnt = {}; d.forEach(v => cnt[v] = (cnt[v] || 0) + 1);
    const mx = Math.max(...Object.values(cnt)), modes = Object.keys(cnt).filter(k => cnt[k] === mx);
    if(needMode && (mx < 2 || modes.length !== 1)) continue;
    const sum = d.reduce((a, b) => a + b, 0); if((sum * 10) % n) continue;
    const s = d.slice().sort((a, b) => a - b), med = n % 2 ? s[(n - 1) / 2] : (s[n / 2 - 1] + s[n / 2]) / 2;
    return {d:shuffle(d), mean:ds(sum * 10 / n, 1), med:String(med), mode:modes[0]};
  }
  return null;
}
const CLS_LBL = (a, w) => `${a}以上${a + w}未満`;
function histData(lv){
  const w = 5, start = pick([15, 20]), k = 6;
  const tot = lv === 2 ? pick([20, 25]) : ri(18, 26);
  for(;;){
    const c = Array.from({length:k}, () => ri(1, 7)); const s = c.reduce((a, b) => a + b, 0);
    c[2] += tot - s; if(c[2] < 1 || c[2] > 9) continue;
    const mx = Math.max(...c); if(c.filter(v => v === mx).length > 1) continue;
    return {w, start, k, c, tot};
  }
}

function genGridScale(lv){
  const k = lv === 2 ? 0.5 : 2, C = 4.5;
  let pts;
  for(;;){
    const n = lv === 0 ? 3 : 4, maxc = lv === 2 ? 8 : 5, step = lv === 2 ? 2 : 1;
    pts = Array.from({length:n}, () => [ri(0, maxc / step) * step, ri(0, (lv === 2 ? 6 : 4) / step) * step]);
    if(new Set(pts.map(p => p.join())).size < n) continue;
    const c = centroid(pts); pts.sort((a, b) => Math.atan2(a[1] - c[1], a[0] - c[0]) - Math.atan2(b[1] - c[1], b[0] - c[0]));
    const an = pts.map((p, i) => angAt(p, pts[(i + n - 1) % n], pts[(i + 1) % n]));
    if(an.some(v => v < 25 || v > 165)) continue;
    const bb = bbox(pts); if(bb.w < 2 || bb.h < 2) continue;
    break;
  }
  const bb = bbox(pts), mnx = Math.min(...pts.map(p => p[0])), mny = Math.min(...pts.map(p => p[1]));
  pts = pts.map(p => [p[0] - mnx, p[1] - mny]);
  const c1 = bb.w + 2, r1 = bb.h + 2, c2 = Math.ceil(bb.w * k) + 2, r2 = Math.ceil(bb.h * k) + 2;
  const BW = Math.max(c2, 8) * C, BH = Math.max(r2, 6) * C;
  const drawFig = (G, x, y, w, h, fs) => {
    drawGridLines(G, x + 2, y + 1, c1, r1, C);
    G.poly(pts.map(p => [x + 2 + (p[0] + 1) * C, y + 1 + (p[1] + 1) * C]), {w:0.5});
  };
  const ans = (G, bx, by, bw, bh, fs) => { G.poly(pts.map(p => [bx + (p[0] * k + 1) * C, by + (p[1] * k + 1) * C]), {w:0.5, color:RED}); };
  const it = drawItem(c1 * C + 4, r1 * C + 2, drawFig, BW, BH, ans,
    {inst:lv === 2 ? `左の図形の${F(1, 2)}の縮図を，右の方眼にかきましょう。` : "左の図形の2倍の拡大図を，右の方眼にかきましょう。", lead:lv === 2 ? "縮図をかく" : "拡大図をかく", sig:JSON.stringify(pts)});
  const d0 = it.draw;
  it.draw = function(G, x, y, W, fs, ans_){
    const side = this.side(W), bx = side ? x + W - BW : x, by = side ? y : y + r1 * C + 2 + 0.8 * fs;
    drawGridLines(G, bx, by, Math.round(BW / C), Math.round(BH / C), C);
    d0.call(this, G, x, y, W, fs, ans_);
  };
  return it;
}

/* 場合の数：カードでできる整数（数え上げで答えを出す） */
function cardCount(digs, k, cond){
  let cnt = 0; const used = new Array(digs.length).fill(false);
  const rec = (s) => {
    if(s.length === k){ if(s[0] !== "0" && cond(+s)) cnt++; return; }
    for(let i = 0; i < digs.length; i++) if(!used[i]){ used[i] = true; rec(s + digs[i]); used[i] = false; }
  };
  rec(""); return cnt;
}
function genGridPath(lv){
  const m = ri(3, lv === 0 ? 4 : 5), n = ri(2, lv === 0 ? 3 : 4);
  const bx = lv === 2 ? [ri(1, m - 1), ri(1, n - 1)] : null;
  let ans;
  if(!bx) ans = comb(m + n, m);
  else { const f = []; for(let i = 0; i <= m; i++){ f[i] = []; for(let j = 0; j <= n; j++){ f[i][j] = (i === 0 && j === 0) ? 1 : ((i ? f[i - 1][j] : 0) + (j ? f[i][j - 1] : 0)); if(i === bx[0] && j === bx[1]) f[i][j] = 0; } } ans = f[m][n]; }
  const draw = (G, x, y, w, h, fs) => {
    const c = Math.min((w - 12) / m, (h - 10) / n), ox = x + 6, oy = y + 4 + n * c;
    for(let i = 0; i <= m; i++) G.line(ox + i * c, oy, ox + i * c, oy - n * c, {w:0.35});
    for(let j = 0; j <= n; j++) G.line(ox, oy - j * c, ox + m * c, oy - j * c, {w:0.35});
    G.text("A", ox - 2.5, oy + 1.5, {size:fs * 0.8, align:"center"}); G.text("B", ox + m * c + 2.5, oy - n * c - 1.5, {size:fs * 0.8, align:"center"});
    if(bx){ const px = ox + bx[0] * c, py = oy - bx[1] * c; G.line(px - 1.3, py - 1.3, px + 1.3, py + 1.3, {w:0.5}); G.line(px - 1.3, py + 1.3, px + 1.3, py - 1.3, {w:0.5}); }
  };
  return figItem(FIGW + 8, FIGH + 6, draw, "((" + ans + "通り))", {inst:bx ? "AからBまで，遠回りをしないで行く道順は何通りありますか。×の地点は通れません。" : "AからBまで，遠回りをしないで行く道順は何通りありますか。", lead:"道順", sig:"g" + m + n + (bx || "")});
}

/* 図形の応用 */
function genSector(lv){
  for(;;){
    const th = pick([30, 45, 60, 90, 120, 135, 150, 210, 240, 270]), r = ri(2, 12);
    const areaOk = (r * r * th) % 360 === 0, perOk = (2 * r * th) % 360 === 0;
    const askPer = lv >= 1 && R() < 0.5;
    if(askPer ? !perOk : !areaOk) continue;
    const A = dmul(r * r * th / 360, "3.14"), Pm = dadd(dmul(2 * r * th / 360, "3.14"), 2 * r);
    const draw = (G, x, y, w, h, fs) => {
      const R_ = Math.min(w, h) / 2 - 4, cx = x + w / 2, cy = y + h / 2 + (th <= 180 ? R_ * 0.3 : 0);
      const s0 = -Math.PI / 2 - th * D2R / 2, s1 = s0 + th * D2R;
      G.arc(cx, cy, R_, s0, s1, {fill:SHADE, stroke:false});
      G.arc(cx, cy, R_, s0, s1, {w:0.4});
      G.line(cx, cy, cx + R_ * Math.cos(s0), cy + R_ * Math.sin(s0), {w:0.4}); G.line(cx, cy, cx + R_ * Math.cos(s1), cy + R_ * Math.sin(s1), {w:0.4});
      G.arc(cx, cy, 2.2, s0, s1, {w:0.25});
      const md = (s0 + s1) / 2; G.text(th + "°", cx + 5 * Math.cos(md), cy + 5 * Math.sin(md), {size:fs * 0.7, align:"center"});
      const mx = cx + R_ * 0.5 * Math.cos(s1), my = cy + R_ * 0.5 * Math.sin(s1);
      G.text(cm(r), mx + 1.5, my + 2.2, {size:fs * 0.75});
    };
    return figItem(FIGW, FIGH + 6, draw, (askPer ? "まわりの長さ" : "面積") + "((" + (askPer ? cm(Pm) : A + "cm^2") + "))", {inst:"つぎのおうぎ形について答えましょう。円周率は3.14とします。", lead:"おうぎ形", sig:"s" + th + r + askPer});
  }
}
function genParallelAngle(lv){
  const a = ri(25, 65), b = ri(25, 65), x = a + b;
  const draw = (G, x0, y, w, h, fs) => {
    const y1 = y + 4, y2 = y + h - 4, L_ = x0 + 2, R_ = x0 + w - 2;
    G.line(L_, y1, R_, y1, {w:0.4}); G.line(L_, y2, R_, y2, {w:0.4});
    G.text("ℓ", R_ - 1, y1 - 2, {size:fs * 0.7}); G.text("m", R_ - 1, y2 - 2, {size:fs * 0.7});
    const px = x0 + w * 0.7, py = (y1 + y2) / 2;
    const d1 = (py - y1) / Math.tan(a * D2R), d2 = (y2 - py) / Math.tan(b * D2R);
    const A = [px - d1, y1], B = [px - d2, y2], P = [px, py];
    G.line(...A, ...P, {w:0.4}); G.line(...P, ...B, {w:0.4});
    angleMark(G, A, [R_, y1], P, lv === 2 ? "ア" : a + "°", fs);
    angleMark(G, B, [R_, y2], P, b + "°", fs);
    angleMark(G, P, A, B, lv === 2 ? x + "°" : "ア", fs);
  };
  const q = lv === 2 ? `ア((${a}°))` : `ア((${x}°))`;
  return figItem(FIGW + 6, FIGH + 4, draw, q, {inst:"直線ℓと直線mは平行です。アの角度を求めましょう。", lead:"角度", sig:"p" + a + b + lv});
}

/* 数を漢字で書く（万・億・兆の4けたごと） */
function kanjiNum(n){
  const units = ["", "万", "億", "兆"]; let s = "", i = 0;
  if(n === 0) return "零";
  while(n > 0){
    const g = n % 10000; n = Math.floor(n / 10000);
    if(g){ let t = ""; const th = Math.floor(g / 1000), h = Math.floor(g / 100) % 10, te = Math.floor(g / 10) % 10, o = g % 10;
      if(th) t += (th > 1 ? KN[th] : "") + "千"; if(h) t += (h > 1 ? KN[h] : "") + "百"; if(te) t += (te > 1 ? KN[te] : "") + "十"; if(o) t += KN[o];
      s = t + units[i] + s; }
    i++;
  }
  return s;
}
/* 大きな数（億・兆をふくむ）を、0の多い形で作る */
function bigNum(lv){
  for(;;){
    const len = lv === 0 ? ri(9, 10) : ri(10, 13), digs = [ri(1, 9)];
    for(let i = 1; i < len; i++) digs.push(R() < (lv === 2 ? 0.45 : 0.6) ? 0 : ri(1, 9));
    const n = Number(digs.join("")); if(n <= Number.MAX_SAFE_INTEGER) return n;
  }
}

const MONTHS = ["1月", "2月", "3月", "4月", "5月", "6月", "7月", "8月", "9月", "10月", "11月", "12月"];
function tempSeries(){ const base = ri(3, 8), amp = ri(17, 22), out = []; for(let m = 0; m < 12; m++) out.push(Math.round(base + amp * Math.sin((m - 3) / 12 * 2 * Math.PI) / 2 + amp / 2 + ri(-1, 1))); return out; }
function drawLineGraph(G, x, y, w, h, fs, series, ymax, step, unitLbl){
  const ox = x + 10, oy = y + h - 7, gw = w - 14, gh = h - 12, n = series[0].length;
  for(let v = 0; v <= ymax; v++){ const yy = oy - gh * v / ymax; G.line(ox, yy, ox + gw, yy, {w:v % step === 0 ? 0.15 : 0.07, color:GRID}); if(v % step === 0) G.text(String(v), ox - 1.5, yy, {size:fs * 0.5, align:"right"}); }
  for(let i = 0; i < n; i++){ const xx = ox + gw * (i + 0.5) / n; G.text(String(i + 1), xx, oy + 2.4, {size:fs * 0.5, align:"center"}); }
  G.line(ox, oy, ox + gw, oy, {w:0.4}); G.line(ox, oy, ox, oy - gh, {w:0.4});
  G.text("(" + unitLbl + ")", ox - 1, y + 1.5, {size:fs * 0.5, align:"right"}); G.text("(月)", ox + gw, oy + 5, {size:fs * 0.5, align:"right"});
  series.forEach((s, k) => {
    const pts = s.map((v, i) => [ox + gw * (i + 0.5) / n, oy - gh * v / ymax]);
    G.poly(pts, {close:false, w:0.45, dash:k ? [1, 0.6] : null});
    pts.forEach(p => k ? G.rect(p[0] - 0.6, p[1] - 0.6, 1.2, 1.2, {fill:INK, stroke:false}) : G.dot(p[0], p[1], 0.6));
  });
}

function genAngle4(lv){
  const kind = lv === 0 ? "line" : lv === 1 ? pick(["line", "vert"]) : "big";
  const a = ri(3, 16) * 5 + (lv === 2 ? ri(0, 4) : 0);
  const draw = (G, x, y, w, h, fs) => {
    const cx = x + w / 2, cy = y + h / 2 + (kind === "line" ? 5 : 0), L_ = Math.min(w / 2 - 3, h - 8);
    const ray = t => [cx + L_ * Math.cos(t), cy - L_ * Math.sin(t)];
    if(kind === "line"){
      G.line(cx - L_, cy, cx + L_, cy, {w:0.4}); const r = ray(a * D2R); G.line(cx, cy, ...r, {w:0.4});
      angleMark(G, [cx, cy], [cx + L_, cy], r, a + "°", fs); angleMark(G, [cx, cy], r, [cx - L_, cy], "ア", fs);
    } else if(kind === "vert"){
      const t = a * D2R, p1 = ray(t), p2 = ray(t + Math.PI);
      G.line(cx - L_, cy, cx + L_, cy, {w:0.4}); G.line(...p2, ...p1, {w:0.4});
      angleMark(G, [cx, cy], [cx + L_, cy], p1, a + "°", fs); angleMark(G, [cx, cy], [cx - L_, cy], p2, "ア", fs);
    } else {
      const t = a * D2R, p1 = ray(0), p2 = ray(t);
      G.line(cx, cy, ...p1, {w:0.4}); G.line(cx, cy, ...p2, {w:0.4});
      angleMark(G, [cx, cy], p1, p2, a + "°", fs);
      G.arc(cx, cy, 3.2, 0, 2 * Math.PI - t, {w:0.25});
      G.text("ア", cx - 5, cy + 3.5, {size:fs * 0.85, align:"center"});
    }
  };
  const ans = kind === "big" ? 360 - a : 180 - a;
  const ansV = kind === "vert" ? a : ans;
  const inst = kind === "big" ? "アの角度を計算で求めましょう。" : "アの角度を計算で求めましょう。";
  return figItem(FIGW, FIGH, draw, `ア((${ansV}°))`, {inst, lead:"角度", sig:kind + a});
}

/* ---------- 垂直・平行と四角形 ---------- */
const QUADS = [["向かい合った1組の辺が平行な四角形", "台形"], ["向かい合った2組の辺が，どちらも平行な四角形", "平行四辺形"], ["4つの辺の長さがみんな等しい四角形", "ひし形"], ["4つの角がみんな直角で，4つの辺の長さがみんな等しい四角形", "正方形"], ["4つの角がみんな直角な四角形", "長方形"]];
function genPara4(lv){
  const a = ri(3, 8), b = lv === 2 ? a : ri(3, 8), ang = ri(10, 16) * 5;
  const rh = lv === 2;
  const subs = [`辺CDの長さ((${a}cm))`, `辺ADの長さ((${b}cm))`, `角Bの大きさ((${ang}°))`, `角Cの大きさ((${180 - ang}°))`];
  const draw = (G, x, y, w, h, fs) => {
    const A = [0, 0], B = [a, 0], s = [b * Math.cos(ang * D2R), b * Math.sin(ang * D2R)];
    const pts = [[s[0], -s[1]], [a + s[0], -s[1]], [a, 0], [0, 0]];
    const f = fitPts(pts, x, y, w, h, 7), P = f.pts, cen = centroid(P), N = ["A", "B", "C", "D"];
    G.poly(P, {w:0.4}); P.forEach((p, i) => vLabel(G, p, cen, N[i], fs));
    sideLabel(G, P[0], P[1], cm(a), cen, fs); sideLabel(G, P[1], P[2], cm(b), cen, fs);
    angleMark(G, P[3], P[0], P[2], ang + "°", fs);
  };
  const inst = rh ? "下の四角形ABCDはひし形です。" : "下の四角形ABCDは平行四辺形です。";
  return setItem(62, 40, draw, lv === 0 ? subs.slice(0, 3) : subs, {inst, lead:rh ? "ひし形" : "平行四辺形"});
}
function genParallelLines(lv){
  const a = ri(8, 16) * 5, kind = lv === 0 ? "same" : lv === 1 ? "alt" : pick(["same", "alt", "co"]);
  const ans = kind === "co" ? 180 - a : a;
  const draw = (G, x, y, w, h, fs) => {
    const y1 = y + h * 0.3, y2 = y + h * 0.75, L_ = x + 2, R_ = x + w - 2;
    G.line(L_, y1, R_, y1, {w:0.4}); G.line(L_, y2, R_, y2, {w:0.4});
    G.text("あ", R_ - 1, y1 - 2.3, {size:fs * 0.65}); G.text("い", R_ - 1, y2 - 2.3, {size:fs * 0.65});
    /* 右上から左下へ下がる直線。上の交わる点 P1、下の交わる点 P2 */
    const dx = (y2 - y1) / Math.tan(a * D2R), mx = x + w / 2, P1 = [mx + dx / 2, y1], P2 = [mx - dx / 2, y2];
    const ext = 0.35, T1 = [P1[0] + dx * ext, y1 - (y2 - y1) * ext], T2 = [P2[0] - dx * ext, y2 + (y2 - y1) * ext];
    G.line(...T1, ...T2, {w:0.4});
    if(kind === "same"){ angleMark(G, P1, [R_, y1], T1, a + "°", fs); angleMark(G, P2, [R_, y2], P1, "ア", fs); }
    else if(kind === "alt"){ angleMark(G, P1, [L_, y1], P2, a + "°", fs); angleMark(G, P2, [R_, y2], P1, "ア", fs); }
    else { angleMark(G, P1, [L_, y1], P2, a + "°", fs); angleMark(G, P2, [L_, y2], P1, "ア", fs); }
  };
  const realAns = kind === "same" ? a : kind === "alt" ? a : 180 - a;
  return figItem(FIGW + 4, FIGH, draw, `ア((${realAns}°))`, {inst:"直線あと直線いは平行です。アの角度を求めましょう。", lead:"平行な直線と角", sig:kind + a});
}

/* ---------- そろばん ---------- */
function drawSoroban(G, x, y, w, h, fs, digits, onesIdx){
  const n = digits.length, rw = Math.min(6, (w - 6) / n), bx = x + (w - rw * n) / 2, top = y + 2, beam = y + h * 0.33, bot = y + h - 2;
  G.rect(bx - 1, top, rw * n + 2, bot - top, {w:0.6});
  G.line(bx - 1, beam, bx + rw * n + 1, beam, {w:0.6});
  const bh = Math.min(2.4, (bot - beam) / 6.2), bw = rw * 0.42;
  const bead = (cx, cy) => G.poly([[cx - bw, cy], [cx, cy - bh / 2], [cx + bw, cy], [cx, cy + bh / 2]], {fill:"#444444", w:0.2});
  for(let i = 0; i < n; i++){
    const cx = bx + (i + 0.5) * rw, d = digits[i];
    G.line(cx, top, cx, bot, {w:0.25});
    bead(cx, d >= 5 ? beam - bh / 2 - 0.1 : top + bh / 2 + 0.3);
    const up = d % 5;
    for(let k = 0; k < 4; k++){ const cy = k < up ? beam + bh / 2 + 0.1 + k * bh : bot - bh / 2 - 0.3 - (3 - k) * bh; bead(cx, cy); }
    if((onesIdx - i) % 3 === 0) G.dot(cx, beam, 0.45, "#ffffff"), G.dot(cx, beam, 0.3);
  }
  const cx = bx + (onesIdx + 0.5) * rw; G.text(knows("位") ? "一の位" : "一のくらい", cx, bot + 2.8, {size:fs * 0.55, align:"center"});
}

function genRectArea(lv){
  const L_ = lv === 0 && R() < 0.4, a = ri(3, 12), b = L_ ? a : ri(3, 12);
  const draw = (G, x, y, w, h, fs) => {
    const s = Math.min((w - 14) / a, (h - 10) / b), rx = x + (w - a * s) / 2, ry = y + (h - b * s) / 2;
    G.rect(rx, ry, a * s, b * s, {w:0.4});
    G.text(cm(a), rx + a * s / 2, ry + b * s + 3, {size:fs * 0.8, align:"center"});
    if(!L_) G.text(cm(b), rx + a * s + 1.5, ry + b * s / 2, {size:fs * 0.8});
  };
  return figItem(FIGW, FIGH, draw, `((${a * b}cm^2))`, {inst:"つぎの長方形や正方形の面積を求めましょう。", lead:"面積", sig:"r" + a + b});
}
function genLArea(lv){
  const W = ri(6, 12), H = ri(5, 10), w2 = ri(2, W - 3), h2 = ri(2, H - 2), A = W * H - (W - w2) * (H - h2);
  const draw = (G, x, y, w, h, fs) => {
    const s = Math.min((w - 14) / W, (h - 10) / H), ox = x + (w - W * s) / 2, oy = y + (h - H * s) / 2;
    const P = [[0, 0], [w2, 0], [w2, H - h2], [W, H - h2], [W, H], [0, H]].map(p => [ox + p[0] * s, oy + p[1] * s]);
    G.poly(P, {w:0.4}); const cen = centroid(P);
    sideLabel(G, P[0], P[1], cm(w2), cen, fs); sideLabel(G, P[4], P[5], cm(W), cen, fs); sideLabel(G, P[5], P[0], cm(H), cen, fs); sideLabel(G, P[3], P[4], cm(h2), cen, fs);
  };
  return figItem(FIGW + 4, FIGH + 4, draw, `((${A}cm^2))`, {inst:"つぎの図形の面積を求めましょう。", lead:"いろいろな形の面積", sig:"L" + W + H + w2 + h2});
}

function hissanAddItem(a, b, op, o){

    draw(G, x, y, W, fs, ans){
      const {cs, rh} = this.dims(fs), x0 = x + 0.3 * cs;
      for(let c = 0; c <= cols; c++) G.line(x0 + c * cs, y, x0 + c * cs, y + 3 * rh, {w:0.12, color:GRID, dash:[0.5, 0.7]});
      for(let rr = 0; rr <= 3; rr++) G.line(x0, y + rr * rh, x0 + cols * cs, y + rr * rh, {w:0.12, color:GRID, dash:[0.5, 0.7]});
      const put = (s, row, color) => { for(let i = 0; i < s.length; i++) G.text(s[i], x0 + (cols - s.length + i + 0.5) * cs, y + (row + 0.5) * rh + 0.03 * fs, {size:fs * 1.02, align:"center", color}); };
      put(sa, 0); put(sb, 1); G.text(op === "+" ? "＋" : "－", x0 + (cols - sb.length - 0.5) * cs, y + 1.5 * rh, {size:fs, align:"center"});
      G.line(x0, y + 2 * rh, x0 + cols * cs, y + 2 * rh, {w:0.35});
      if(ans) put(sr, 2, RED);
    }
  }, o || {});
}
/* ものさし（2年）：0〜maxCm、テープの長さ Lmm */
function drawRuler(G, x, y, w, h, fs, maxCm, Lmm){
  const u = (w - 6) / (maxCm * 10), ox = x + 3, ry = y + 9;
  G.rect(ox - 1, ry, maxCm * 10 * u + 2, 9, {w:0.35, fill:"#f6f6f6"});
  for(let i = 0; i <= maxCm * 10; i++){ const l = i % 10 === 0 ? 3.2 : i % 5 === 0 ? 2.2 : 1.3; G.line(ox + i * u, ry, ox + i * u, ry + l, {w:i % 10 === 0 ? 0.3 : 0.15}); if(i % 10 === 0) G.text(String(i / 10), ox + i * u, ry + 5.5, {size:fs * 0.5, align:"center"}); }
  G.rect(ox, y + 2, Lmm * u, 5, {w:0.35, fill:"#d8d8d8"});
}
/* はかり（3年）：maxG まで、1目もり stepG */
function drawScale(G, cx, cy, r, fs, maxG, stepG, valG){
  G.arc(cx, cy, r, 0, 2 * Math.PI, {w:0.5});
  const n = maxG / stepG;
  for(let i = 0; i < n; i++){ const a = i / n * 2 * Math.PI, big = (i * stepG) % (maxG / 10) === 0, l = big ? 2 : 1; G.line(cx + (r - l) * Math.sin(a), cy - (r - l) * Math.cos(a), cx + r * Math.sin(a), cy - r * Math.cos(a), {w:big ? 0.3 : 0.12});
    if((i * stepG) % (maxG / 4) === 0) G.text(i * stepG >= 1000 ? (i * stepG / 1000) + "kg" : String(i * stepG), cx + (r - 5.2) * Math.sin(a), cy - (r - 5.2) * Math.cos(a), {size:fs * 0.45, align:"center"}); }
  const a = valG / maxG * 2 * Math.PI; G.line(cx, cy, cx + (r - 1) * Math.sin(a), cy - (r - 1) * Math.cos(a), {w:0.6}); G.dot(cx, cy, 0.8);
  G.text(maxG >= 1000 ? (maxG / 1000) + "kgまで" : maxG + "gまで", cx, cy + r * 0.45, {size:fs * 0.45, align:"center"});
}

/* 円と球：箱にボールがならんでいる図 */
function genBalls(lv){
  const r = ri(2, 6), n = ri(2, lv === 2 ? 4 : 3), rows = lv === 2 ? 2 : 1;
  const draw = (G, x, y, w, h, fs) => {
    const s = Math.min((w - 8) / (2 * r * n), (h - 10) / (2 * r * rows)), R_ = r * s, bx = x + (w - 2 * R_ * n) / 2, by = y + 2;
    G.rect(bx, by, 2 * R_ * n, 2 * R_ * rows, {w:0.4});
    for(let j = 0; j < rows; j++) for(let i = 0; i < n; i++) G.arc(bx + R_ * (2 * i + 1), by + R_ * (2 * j + 1), R_, 0, 2 * Math.PI, {w:0.35});
    G.line(bx + R_, by + R_, bx + 2 * R_, by + R_, {w:0.3}); G.dot(bx + R_, by + R_, 0.3);
    G.text(cm(r), bx + 1.5 * R_, by + R_ - 1.5, {size:fs * 0.7, align:"center"});
  };
  const q = lv === 2 ? `たての長さ((${4 * r}cm))　横の長さ((${2 * r * n}cm))` : `箱の横の長さ((${2 * r * n}cm))`;
  return figItem(62, lv === 2 ? 34 : 24, draw, q, {inst:`同じ大きさのボールが，箱にぴったり入っています。ボールの半${KEI}は図のとおりです。`, lead:"円と球", sig:"b" + r + n + rows});
}

const U2 = [];
function unit2(no, name, month, meate, subs){ U2.push({id:"2-" + no, no, name, month, meate, subs}); }
const K2_CALC = "つぎの　計算を　しましょう。", K2_BOX = "[[ ]]に　あう　数を　書きましょう。", K2_Q = "つぎの　もんだいに　答えましょう。";
const L2 = (mk, inst, lead) => lineItem(mk, {inst, lead});
const W2 = (text, shiki, ans, lead) => wordItem(text, shiki, ans, {inst:K2_Q, lead:lead || "文しょうだい"});
const KURA2 = "【位|くらい】", MEN = "【面|めん】";
const FRUITS = ["りんご", "みかん", "いちご", "バナナ", "ぶどう"];

/* ○のグラフ（1・2年共通） */
function pictoItem(g, lv){
  const n = 4, labels = shuffle(FRUITS).slice(0, n), vals = labels.map(() => ri(2, 8));
  const mx = vals.indexOf(Math.max(...vals)), mn = vals.indexOf(Math.min(...vals));
  if(vals.filter(v => v === vals[mx]).length > 1 || vals.filter(v => v === vals[mn]).length > 1) return pictoItem(g, lv);
  const i1 = ri(0, 3); let i2; do{ i2 = ri(0, 3); } while(i2 === i1);
  const one = g === 1;
  const subs = one ? [`${labels[i1]}は　なん人ですか。((${vals[i1]}にん))`.replace("なん人", "なんにん"), `いちばん　おおいのは　どれですか。((${labels[mx]}))`]
                   : [`${labels[i1]}が　すきな　人は　何人ですか。((${vals[i1]}人))`, `いちばん　多いのは　どれですか。((${labels[mx]}))`];
  if(lv >= 1) subs.push(one ? `${labels[i1]}と　${labels[i2]}の　ちがいは　なんにんですか。((${Math.abs(vals[i1] - vals[i2])}にん))` : `${labels[i1]}と　${labels[i2]}の　ちがいは　何人ですか。((${Math.abs(vals[i1] - vals[i2])}人))`);
  if(lv === 2) subs.push(one ? `いちばん　すくないのは　どれですか。((${labels[mn]}))` : `いちばん　少ないのは　どれですか。((${labels[mn]}))`);
  return setItem(56, 44, (G, x, y, w, h, fs) => drawPicto(G, x, y, w, h, fs, labels, vals), subs,
    {inst:one ? "つぎの　もんだいに　こたえましょう。" : K2_Q, lead:one ? "かずしらべ" : "グラフ", text:one ? "すきな　くだものを　しらべて，○で　あらわしました。" : "すきな　くだものを　しらべて，○を　つかった　グラフに　あらわしました。", sig:labels.join() + vals.join()});
}

/* 形をえらぶ図（2年） */
const SHAPES2 = {
  tri:{pts:[[0.1, 0.9], [0.5, 0.1], [0.9, 0.9]], cls:["三角形"]},
  rtri:{pts:[[0.15, 0.9], [0.15, 0.15], [0.85, 0.9]], cls:["三角形", "直角三角形"], right:0},
  open3:{pts:[[0.1, 0.9], [0.5, 0.1], [0.9, 0.9], [0.25, 0.9]], cls:[], open:true},
  quad:{pts:[[0.1, 0.8], [0.3, 0.15], [0.9, 0.3], [0.75, 0.9]], cls:["四角形"]},
  rect:{pts:[[0.05, 0.25], [0.95, 0.25], [0.95, 0.8], [0.05, 0.8]], cls:["四角形", "長方形"]},
  sq:{pts:[[0.15, 0.15], [0.85, 0.15], [0.85, 0.85], [0.15, 0.85]], cls:["四角形", "正方形"]},
  open4:{pts:[[0.35, 0.15], [0.9, 0.2], [0.8, 0.85], [0.1, 0.8], [0.15, 0.3]], cls:[], open:true}
};
function genShapes2(lv){
  const keys = shuffle(Object.keys(SHAPES2)).slice(0, 6), names = ["あ", "い", "う", "え", "お", "か"];
  const target = lv === 0 ? pick(["三角形", "四角形"]) : lv === 1 ? pick(["三角形", "四角形", "直角三角形"]) : pick(["直角三角形", "正方形"]);
  const ans = keys.map((k, i) => SHAPES2[k].cls.includes(target) ? names[i] : null).filter(Boolean);
  if(!ans.length) return genShapes2(lv);
  const draw = (G, x, y, w, h, fs) => {
    const cw = w / keys.length, s = Math.min(cw - 2, h - 7);
    keys.forEach((k, i) => {
      const S = SHAPES2[k], ox = x + i * cw + (cw - s) / 2, oy = y;
      const P = S.pts.map(p => [ox + p[0] * s, oy + p[1] * s]);
      G.poly(P, {w:0.45, close:!S.open});
      if(S.right === 0){ const q = s * 0.1; G.poly([[P[0][0], P[0][1] - q], [P[0][0] + q, P[0][1] - q], [P[0][0] + q, P[0][1]]], {close:false, w:0.25}); }
      G.text(names[i], ox + s / 2, oy + s + 3.5, {size:fs * 0.75, align:"center"});
    });
  };
  return figItem(110, 26, draw, `${target}((${ans.join("，")}))`, {inst:"下の　形の　中から，えらんで　記ごうで　答えましょう。".replace("記ごう", "きごう"), lead:"形", sig:keys.join() + target});
}

}

const U1 = [];

const K1_CALC = "けいさんを　しましょう。", K1_BOX = "[[ ]]に　あう　かずを　かきましょう。", K1_Q = "つぎの　もんだいに　こたえましょう。";

const W1 = (text, shiki, ans, lead) => wordItem(text, shiki, ans, {inst:K1_Q, lead:lead || "ぶんしょうだい"});
const HON = n => [1, 6, 8, 10].includes(n % 10 === 0 ? 10 : n % 10) || n % 10 === 0 ? "ぽん" : n % 10 === 3 ? "ぼん" : "ほん";
const hon = n => n + HON(n);
const HIKI = n => [1, 6, 8].includes(n % 10) || n % 10 === 0 ? "ぴき" : n % 10 === 3 ? "びき" : "ひき";
const hiki = n => n + HIKI(n);

/* ものを かぞえる図（5こずつ・10のまとまり） */
function drawCount(G, x, y, w, h, fs, n, shape){
  const tens = Math.floor(n / 10), ones = n % 10, s = Math.min(6.5, (w - 12) / 11, (h - 2) / 2), r = s * 0.4;
  const one = (px, py) => {
    if(shape === "flower"){ for(let k = 0; k < 5; k++){ const a = k * 2 * Math.PI / 5; G.arc(px + r * 0.5 * Math.cos(a), py + r * 0.5 * Math.sin(a), r * 0.45, 0, 2 * Math.PI, {w:0.25, fill:"#e6e6e6"}); } G.arc(px, py, r * 0.3, 0, 2 * Math.PI, {w:0.25, fill:"#999999"}); }
    else G.arc(px, py, r, 0, 2 * Math.PI, {w:0.35, fill:"#dddddd"});
  };
  const oy = y + 1 + s / 2;
  let ox = x + 2;
  if(tens){ G.rect(ox, oy - s / 2 - 0.5, 5 * s + 1, 2 * s + 1, {w:0.3}); for(let k = 0; k < 10; k++) one(ox + 0.5 + (k % 5 + 0.5) * s, oy + Math.floor(k / 5) * s); ox += 5 * s + 5; }
  for(let k = 0; k < ones; k++) one(ox + (k % 5 + 0.5) * s, oy + Math.floor(k / 5) * s);
}
function countItem(n, shape, qmk, o){ return figItem(80, n > 5 ? 15 : 8, (G, x, y, w, h, fs) => drawCount(G, x, y, w, h, fs, n, shape), qmk, Object.assign({sig:"cnt" + n}, o)); }

/* テープの ながさくらべ（ますの かず） */
function genTapes(lv){
  const a = ri(4, 14), b = ri(4, 14); if(a === b) return genTapes(lv);
  const draw = (G, x, y, w, h, fs) => { const s = Math.min(5, (w - 10) / 15); [["あ", a], ["い", b]].forEach(([nm, v], i) => { const yy = y + 2 + i * (s + 4); G.text(nm, x + 2, yy + s / 2, {size:fs * 0.8}); for(let k = 0; k < v; k++) G.rect(x + 7 + k * s, yy, s, s, {w:0.3, fill:"#e4e4e4"}); }); };
  const q = lv === 0 ? `ながい　ほうは　どちらですか。((${a > b ? "あ" : "い"}))` : `どちらが　ますの　いくつぶん　ながいですか。((${a > b ? "あ" : "い"}が　${Math.abs(a - b)}つぶん))`;
  return figItem(90, 20, draw, q, {inst:"あと　いの　テープの　ながさを　くらべましょう。", lead:"ながさくらべ", sig:"tp" + a + b});
}
/* いろいたの かずを かぞえる（さんかくの いろいた） */
function genTiles(lv){
  const cells = [], k = lv === 0 ? 2 : lv === 1 ? 3 : 4, seen = new Set(["0,0"]); cells.push([0, 0]);
  while(cells.length < k){ const [cx, cy] = pick(cells), d = pick([[1, 0], [-1, 0], [0, 1], [0, -1]]), nc = [cx + d[0], cy + d[1]]; if(!seen.has(nc.join()) && Math.abs(nc[0]) < 3 && Math.abs(nc[1]) < 2){ seen.add(nc.join()); cells.push(nc); } }
  const extra = lv === 0 ? 0 : ri(1, 2), minY = Math.min(...cells.map(c => c[1])), tops = cells.filter(c => c[1] === minY).slice(0, extra);
  const draw = (G, x, y, w, h, fs) => {
    const xs = cells.map(c => c[0]), mnx = Math.min(...xs), mxx = Math.max(...xs), s = Math.min((w - 6) / (mxx - mnx + 1), (h - 4) / (Math.max(...cells.map(c => c[1])) - minY + 1 + (extra ? 1 : 0)));
    const ox = x + 3 - mnx * s, oy = y + 2 + (extra ? s : 0) - minY * s;
    for(const [cx, cy] of cells){ const X = ox + cx * s, Y = oy + cy * s; G.rect(X, Y, s, s, {w:0.35, fill:"#e0e0e0"}); G.line(X, Y + s, X + s, Y, {w:0.35}); }
    for(const [cx, cy] of tops){ const X = ox + cx * s, Y = oy + cy * s; G.poly([[X, Y], [X + s, Y], [X, Y - s]], {w:0.35, fill:"#e0e0e0"}); }
  };
  return figItem(50, 30, draw, `((${cells.length * 2 + tops.length}まい))`, {inst:"さんかくの　いろいたを　なんまい　つかって　いますか。", lead:"いろいた", sig:JSON.stringify(cells) + tops.length});
}

GRADES[1] = U1;

/* ================= 問題を作る・ならべる ================= */
function unitsOf(grade){ return GRADES[grade] || []; }
function subsOn(st, u){ const off = (st.subsOff[u.id] || []); return u.subs.filter(s => !off.includes(s.id)); }

function buildItems(st){
  R = makeRng(st.seed);
  setLearned(st.grade);
  const out = [];
  for(const u of unitsOf(st.grade)){
    if(!st.units.includes(u.id)) continue;
    const n = st.alloc[u.id] || 0, subs = subsOn(st, u);
    if(!n || !subs.length) continue;
    const k = Math.max(1, Math.min(subs.length, Math.ceil(n / 2.5)));
    const use = k < subs.length ? shuffle(subs.map((s, i) => i)).slice(0, k).sort((a, b) => a - b).map(i => subs[i]) : subs;
    const cnt = use.map(() => 0); for(let i = 0; i < n; i++) cnt[i % use.length]++;
    use.forEach((s, si) => {
      let left = cnt[si], guard = 0; const got = [], seen = new Set();
      while(left > 0 && guard++ < 50){
        const lv = st.level === "mix" ? ri(0, 2) : st.level;
        let it; try{ it = s.gen(lv); }catch(e){ console.error(u.name, s.name, e); break; }
        if(!it) continue;
        const sig = it.sig || (it.toks && it.cat !== "fig" ? mkText(it.toks) : it.subs ? it.subs.map(mkText).join("|") : null);
        if(sig && seen.has(sig) && guard < 40) continue;
        if(sig) seen.add(sig);
        if(it.n > left){ if(it.trim) it.trim(left); else continue; }
        it.unit = u; it.sub = s; got.push(it); left -= it.n;
      }
      got.sort((a, b) => a.inst < b.inst ? -1 : a.inst > b.inst ? 1 : 0);
      out.push(...got);
    });
  }
  return out;
}

function genericInst(cat){
  const q = knows("問答") ? "つぎの問題に答えましょう。" : knows("答") ? "つぎの　もんだいに　答えましょう。" : "つぎの　もんだいに　こたえましょう。";
  if(cat === "hissan") return knows("筆算") ? "筆算でしましょう。" : "ひっ算で　しましょう。";
  return q;
}
function groupList(list){
  const out = [], cats = [];
  for(const it of list) if(!cats.includes(it.cat)) cats.push(it.cat);
  for(const cat of cats){
    const ci = list.filter(i => i.cat === cat), insts = [];
    for(const it of ci) if(!insts.includes(it.inst)) insts.push(it.inst);
    const parts = insts.map(t => ci.filter(i => i.inst === t));
    const big = parts.filter(p => p.reduce((s, i) => s + i.n, 0) >= 2), small = parts.filter(p => !big.includes(p));
    const rest = small.flat();
    parts.forEach(p => { if(big.includes(p)) out.push({items:p}); else if(p === small[0]) out.push({items:rest}); });
  }
  return out;
}
function makeGroups(items, order){
  let groups = [];
  if(order === "mix") groups = groupList(shuffle(items));
  else {
    const units = []; for(const it of items) if(!units.includes(it.unit)) units.push(it.unit);
    for(const u of units) groups.push(...groupList(items.filter(i => i.unit === u)));
  }
  for(const g of groups){
    const same = g.items.every(i => i.inst === g.items[0].inst);
    g.inst = same ? g.items[0].inst : genericInst(g.items[0].cat);
    g.n = g.items.reduce((s, i) => s + i.n, 0);
    for(const i of g.items) i.showLead = !same;
    g.instT = parseMk(g.inst);
  }
  return groups;
}

/* 100点満点の配点：大問ごとに同じ点数（各○点）になるようにする */
function assignPoints(groups){
  const N = groups.reduce((s, g) => s + g.n, 0);
  for(const g of groups){ g.each = null; g.total = null; g.itemPts = null; }
  if(!N || N > 100) return false;
  const base = Math.floor(100 / N), r = 100 - base * N;
  const pri = {word:0, fig:1, hissan:2, calc:3};
  const order = groups.map((g, i) => i).sort((a, b) => pri[groups[a].items[0].cat] - pri[groups[b].items[0].cat]);
  const stages = [new Map([[0, null]])];
  for(const gi of order){
    const prev = stages[stages.length - 1], next = new Map();
    for(const [s] of prev) for(let e = 0; e <= 4; e++){ const s2 = s + e * groups[gi].n; if(s2 <= r && !next.has(s2)) next.set(s2, [s, e]); }
    stages.push(next);
  }
  const extra = new Array(groups.length).fill(0);
  if(stages[stages.length - 1].has(r)){
    let s = r;
    for(let k = order.length; k >= 1; k--){ const [ps, e] = stages[k].get(s); extra[order[k - 1]] = e; s = ps; }
    groups.forEach((g, i) => { g.each = base + extra[i]; g.total = g.each * g.n; });
  } else {
    let left = r;
    for(const gi of order){ const g = groups[gi]; g.itemPts = []; for(const it of g.items){ let p = base * it.n; const add_ = Math.min(left, it.n); p += add_; left -= add_; g.itemPts.push(p); } g.total = g.itemPts.reduce((a, b) => a + b, 0); }
  }
  return true;
}

/* ================= ページのレイアウト ================= */
const PAPERS = {A4:[210, 297], B4:[257, 364]};
const MARGIN = 12;
const FS = {s:4.3, m:4.9, l:5.7};

function hdrH(fs){ return Math.max(15, 3.3 * fs); }
function meateH(fs){ return 2.0 * fs; }

function layoutPages(G, groups, paper, fs, opt){
  const [PW, PH] = PAPERS[paper];
  const CW = PW - 2 * MARGIN, bottom = PH - MARGIN - 5;
  const top0 = MARGIN + hdrH(fs) + (opt.meate ? meateH(fs) + 0.8 * fs : 0) + 1.3 * fs;
  const indent = 0.9 * fs, availW = CW - indent, gapX = 1.6 * fs, numW = NUMW(fs);
  const pages = [{ops:[]}]; let y = top0;
  const newPage = () => { pages.push({ops:[]}); y = top0; };
  groups.forEach((g, gi) => {
    const ptsTxt = opt.score === "100" ? ptsText(g) : "";
    const ptsW = ptsTxt ? G.width(ptsTxt, fs * 0.7) + 1.5 * fs : 0;
    const instLines = wrapToks(G, g.instT, CW - 1.8 * fs - ptsW, fs);
    const gh = blockMetrics(G, instLines, fs, 0.25 * fs).h + 0.8 * fs;
    const nonfull = g.items.filter(i => !i.full);
    let c = 1;
    for(const cc of [4, 3, 2]){
      const cw = (availW - (cc - 1) * gapX) / cc;
      if(nonfull.length && nonfull.every(i => i.minW(G, fs) + numW <= cw)){ c = cc; break; }
    }
    const colW = (availW - (c - 1) * gapX) / c;
    const rows = []; let cur = [];
    let num = 1;
    g.items.forEach((it, ii) => {
      const cell = {item:it, num, pts:g.itemPts ? g.itemPts[ii] : null}; num += it.n;
      if(it.full){ if(cur.length){ rows.push(cur); cur = []; } rows.push([Object.assign(cell, {w:availW})]); }
      else { cur.push(Object.assign(cell, {w:colW})); if(cur.length === c){ rows.push(cur); cur = []; } }
    });
    if(cur.length) rows.push(cur);
    const leadH = 1.35 * fs;
    rows.forEach((row, ri_) => {
      let h = 0;
      row.forEach((cell, k) => {
        cell.x = MARGIN + indent + k * (colW + gapX);
        cell.cw = cell.w - (cell.item.selfNum ? 0 : numW);
        cell.lead = cell.item.showLead && cell.item.lead ? leadH : 0;
        cell.h = cell.lead + cell.item.height(G, cell.cw, fs);
        h = Math.max(h, cell.h);
      });
      const rowGap = 1.3 * fs;
      const need = h + (ri_ === 0 ? gh : 0);
      if(y + need > bottom && y > top0 + 1) newPage();
      if(ri_ === 0){ pages[pages.length - 1].ops.push({t:"group", g, gi, y, instLines, ptsTxt}); y += gh; }
      pages[pages.length - 1].ops.push({t:"row", row, y, h});
      y += h + rowGap;
    });
    y += 0.9 * fs;
  });
  pages.forEach(p => p.used = p.ops.length ? Math.max(...p.ops.map(o => o.y + (o.h || 0))) : top0);
  return {pages, PW, PH, fits:pages.length === 1};
}
function ptsText(g){
  const ten = knows("点") ? "点" : "てん";
  if(g.each != null) return g.n > 1 ? (knows("各") ? `各${g.each}${ten}〔${g.total}〕` : `1つ${g.each}${ten}〔${g.total}〕`) : `${g.each}${ten}`;
  if(g.total != null) return `〔${g.total}〕`;
  return "";
}

/* ================= ページを描く ================= */
function drawHeader(G, L, fs, opt, ans, pageNo, pageCount){
  const PW = L.PW, CW = PW - 2 * MARGIN, x0 = MARGIN, y0 = MARGIN, hh = hdrH(fs);
  const scoreW = Math.max(26, 5.6 * fs), nameW = Math.max(62, CW * 0.36), titleW = CW - scoreW - nameW;
  G.rect(x0, y0, CW, hh, {w:0.6});
  G.line(x0 + titleW, y0, x0 + titleW, y0 + hh, {w:0.4});
  G.line(x0 + titleW + nameW, y0, x0 + titleW + nameW, y0 + hh, {w:0.4});
  let ts = fs * 1.3; const tw = titleW - 2 * fs;
  if(G.width(opt.title, ts, 700) <= tw) G.text(opt.title, x0 + fs, y0 + hh / 2, {size:ts, weight:700});
  else {
    const parts = opt.title.split("・"); let best = null;
    for(let cut = 1; cut < parts.length; cut++){
      const l1 = parts.slice(0, cut).join("・") + "・", l2 = parts.slice(cut).join("・");
      const w = Math.max(G.width(l1, 1, 700), G.width(l2, 1, 700));
      if(!best || w < best.w) best = {l1, l2, w};
    }
    if(!best) best = {l1:opt.title, l2:"", w:G.width(opt.title, 1, 700)};
    ts = Math.min(fs * 1.05, tw / best.w, (hh - 2) / 2.5);
    G.text(best.l1, x0 + fs, y0 + hh / 2 - ts * 0.62, {size:ts, weight:700});
    G.text(best.l2, x0 + fs, y0 + hh / 2 + ts * 0.62, {size:ts, weight:700});
  }
  G.text(opt.grade <= 2 ? "なまえ" : "名前", x0 + titleW + 0.6 * fs, y0 + 0.75 * fs, {size:fs * 0.62});
  if(opt.score === "100") G.text(knows("点") ? "点" : "てん", x0 + CW - 0.6 * fs, y0 + hh - 0.8 * fs, {size:fs * 0.8, align:"right"});
  else G.text("／" + opt.total + (opt.grade <= 2 ? "もん" : "問"), x0 + CW - 0.6 * fs, y0 + hh - 0.8 * fs, {size:fs * 0.8, align:"right"});
  if(ans) G.text("答え（先生用）", x0 + CW, y0 - 3.2, {size:fs * 0.75, color:RED, align:"right", weight:700});
  if(pageCount > 1) G.text(pageNo + "／" + pageCount, x0 + CW / 2, L.PH - MARGIN + 1, {size:fs * 0.6, align:"center"});
  if(opt.meate){
    const my = y0 + hh + 0.8 * fs, mh = meateH(fs);
    G.rect(x0, my, CW, mh, {w:0.3, fill:"#f4f4f4"});
    G.text("めあて", x0 + 0.8 * fs, my + mh / 2, {size:fs * 0.75, weight:700});
    let ms = fs * 0.9; while(ms > fs * 0.6 && G.width(opt.meate, ms) > CW - 5.5 * fs) ms -= 0.2;
    G.text(opt.meate, x0 + 4.6 * fs, my + mh / 2, {size:ms});
  }
}
function drawPageAt(G, L, pi, fs, opt, ans){
  const page = L.pages[pi];
  G.rbSeen = new Set();
  G.rect(0, 0, L.PW, L.PH, {fill:"#ffffff", stroke:false});
  drawHeader(G, L, fs, opt, ans, pi + 1, L.pages.length);
  const numW = NUMW(fs);
  for(const op of page.ops){
    if(op.t === "group"){
      const b = 1.2 * fs, x = MARGIN, first = blockMetrics(G, op.instLines, fs, 0.25 * fs).ms[0];
      const cy = op.y + first.up;
      G.rect(x, cy - b / 2, b, b, {fill:INK, stroke:false});
      G.text(String(op.gi + 1), x + b / 2, cy + 0.02 * fs, {size:fs * 0.85, color:"#ffffff", align:"center", weight:700});
      drawBlock(G, op.instLines, x + b + 0.6 * fs, op.y, fs, false, 0.25 * fs);
      if(op.ptsTxt) G.text(op.ptsTxt, L.PW - MARGIN, cy, {size:fs * 0.7, align:"right"});
    } else {
      for(const cell of op.row){
        const it = cell.item; let y = op.y, x = cell.x;
        if(cell.lead){ drawToks(G, parseMk("〔" + it.lead + "〕"), x, y + cell.lead / 2 - 0.1 * fs, fs * 0.72, false); y += cell.lead; }
        if(!it.selfNum){
          const fu = it.firstUp ? it.firstUp(G, cell.cw, fs) : 0.62 * fs;
          drawNum(G, x, y + fu, cell.num, fs); x += numW;
        }
        if(cell.pts != null) G.text("（" + cell.pts + (knows("点") ? "点" : "てん") + "）", cell.x + cell.w, op.y + 0.5 * fs, {size:fs * 0.55, align:"right"});
        it.draw(G, x, y, cell.cw, fs, ans, cell.num);
      }
    }
  }
}

/* ================= PDF（画像をならべたPDFを作る） ================= */
async function canvasJpeg(c){ return new Promise(res => c.toBlob(res, "image/jpeg", 0.92)); }
async function makePdf(canvases, paper){
  const pages = [];
  for(const c of canvases){ const b = await canvasJpeg(c); pages.push({bytes:new Uint8Array(await b.arrayBuffer()), w:c.width, h:c.height}); }
  const [W, H] = PAPERS[paper], wPt = (W * 72 / 25.4).toFixed(2), hPt = (H * 72 / 25.4).toFixed(2);
  const enc = new TextEncoder(), chunks = [], offs = []; let len = 0;
  const push = x => { const b = typeof x === "string" ? enc.encode(x) : x; chunks.push(b); len += b.length; };
  const obj = (id, parts) => { offs[id] = len; push(id + " 0 obj\n"); parts.forEach(push); push("\nendobj\n"); };
  push("%PDF-1.4\n"); push(new Uint8Array([37, 226, 227, 207, 211, 10]));
  const n = pages.length;
  obj(1, ["<< /Type /Catalog /Pages 2 0 R >>"]);
  obj(2, ["<< /Type /Pages /Kids [" + pages.map((_, i) => (3 + 3 * i) + " 0 R").join(" ") + "] /Count " + n + " >>"]);
  pages.forEach((pg, i) => {
    const p = 3 + 3 * i, cs = "q " + wPt + " 0 0 " + hPt + " 0 0 cm /Im" + i + " Do Q";
    obj(p, ["<< /Type /Page /Parent 2 0 R /MediaBox [0 0 " + wPt + " " + hPt + "] /Resources << /XObject << /Im" + i + " " + (p + 2) + " 0 R >> >> /Contents " + (p + 1) + " 0 R >>"]);
    obj(p + 1, ["<< /Length " + cs.length + " >>\nstream\n" + cs + "\nendstream"]);
    obj(p + 2, ["<< /Type /XObject /Subtype /Image /Width " + pg.w + " /Height " + pg.h + " /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length " + pg.bytes.length + " >>\nstream\n", pg.bytes, "\nendstream"]);
  });
  const total = 3 + 3 * n, xref = len;
  let x = "xref\n0 " + total + "\n0000000000 65535 f \n";
  for(let i = 1; i < total; i++) x += String(offs[i]).padStart(10, "0") + " 00000 n \n";
  push(x); push("trailer\n<< /Size " + total + " /Root 1 0 R >>\nstartxref\n" + xref + "\n%%EOF\n");
  return new Blob(chunks, {type:"application/pdf"});
}

let view = "q", items = [], groups = [], LAY = null, PAPER_NOW = "A4";

/* ---------- 単元ごとの問題数 ---------- */
function selUnits(){ return unitsOf(state.grade).filter(u => state.units.includes(u.id)); }
function autoSplit(){
  const us = selUnits(), n = us.length; state.alloc = {};
  if(!n) return;
  const base = Math.floor(state.total / n); let r = state.total - base * n;
  us.forEach(u => { state.alloc[u.id] = base + (r > 0 ? 1 : 0); if(r > 0) r--; });
}
function defaultMeate(){
  const us = selUnits();
  if(!us.length) return "";
  if(us.length === 1) return us[0].meate;
  return us.map(u => u.name.replace(/（.）/, "")).slice(0, 3).join("や") + (us.length > 3 ? "など" : "") + "をふりかえろう";
}

  const us = selUnits();

}

/* ---------- 問題を作ってならべる ---------- */
let mG = null;
function measureG(){ if(!mG){ const c = document.createElement("canvas"); mG = makeG(c.getContext("2d"), 4); } return mG; }
function printOpt(){
  return {title:titleText(), grade:state.grade, score:state.score === "100" && groups.reduce((s, g) => s + g.n, 0) <= 100 ? "100" : "count", total:groups.reduce((s, g) => s + g.n, 0), meate:state.meateOn ? state.meate.trim() : ""};
}
function generate(){
  items = buildItems(state);
  groups = makeGroups(items, state.order);
  relayout();
}
function relayout(){
  if(state.score === "100") assignPoints(groups); else for(const g of groups){ g.each = g.total = g.itemPts = null; }
  const G = measureG(), fs = FS[state.size], opt = printOpt();
  if(state.paper === "auto"){
    const a4 = layoutPages(G, groups, "A4", fs, opt);
    if(a4.fits || state.over === "pages"){ LAY = a4; PAPER_NOW = "A4"; }
    else { LAY = layoutPages(G, groups, "B4", fs, opt); PAPER_NOW = "B4"; }
    $("paperAuto").textContent = "おすすめ（" + PAPER_NOW + "）";
  } else { PAPER_NOW = state.paper; LAY = layoutPages(G, groups, PAPER_NOW, fs, opt); $("paperAuto").textContent = "おすすめ"; }
  const n = LAY.pages.length, note = $("paperNote");
  if(!groups.length){ note.hidden = true; }
  else if(state.paper === "auto" && PAPER_NOW === "B4" && n === 1){ note.hidden = false; note.textContent = "A4の1まいには入りきらないので、B4にしました。"; }
  else if(n > 1){ note.hidden = false; note.textContent = PAPER_NOW + "で" + n + "まいになります。" + (PAPER_NOW === "A4" ? "1まいにしたいときは、用紙をB4にするか、問題数をへらしてください。" : "1まいにしたいときは、問題数をへらすか、文字を小さくしてください。"); }
  else note.hidden = true;
  const total = groups.reduce((s, g) => s + g.n, 0);
  $("pvMeta").textContent = total ? PAPER_NOW + "たて ・ " + total + "問 ・ " + n + "まい ・ " + LEVEL_NAMES[state.level] : "";
  $("cntInfo").textContent = total && total !== state.total ? "（できた問題 " + total + "問）" : "";
  drawPreview();
  scheduleFonts();
}

/* ---------- プレビュー ---------- */
let pvTimer = 0;
function drawPreview(){
  clearTimeout(pvTimer);
  pvTimer = setTimeout(() => {
    const box = $("pages");
    const none = !groups.length;
    for(const id of ["savePdf", "saveImgQ", "saveImgA", "printQ", "printA"]) $(id).disabled = none;
    if(none){ box.innerHTML = '<div class="empty">単元を1つ以上えらんでください。</div>'; return; }
    const want = LAY.pages.length;
    const figs = [...box.querySelectorAll("figure")];
    if(figs.length !== want || box.querySelector(".empty")){
      box.innerHTML = "";
      for(let i = 0; i < want; i++){
        const f = document.createElement("figure"), c = document.createElement("canvas"), cap = document.createElement("figcaption");
        c.setAttribute("aria-label", "プリントのプレビュー " + (i + 1) + "まいめ"); c.lang = "ja";
        cap.textContent = want > 1 ? (i + 1) + "まいめ" : ""; cap.hidden = want < 2;
        f.append(c, cap); box.appendChild(f);
      }
    }
    const cvs = box.querySelectorAll("canvas");
    const cssW = Math.min(820, Math.max(280, box.clientWidth - 24));
    const k = cssW * Math.min(2, window.devicePixelRatio || 1) / LAY.PW;
    const fs = FS[state.size], opt = printOpt();
    cvs.forEach((c, i) => {
      c.width = Math.round(LAY.PW * k); c.height = Math.round(LAY.PH * k);
      const G = makeG(c.getContext("2d"), k);
      try{ drawPageAt(G, LAY, i, fs, opt, view === "a"); }catch(e){ console.error(e); }
    });
  }, 30);
}
function renderAll(){ renderGrades(); renderUnits(); renderSubs(); renderCount(); renderOptions(); }
function update(regen){ persist(); renderAll(); if(regen) generate(); else relayout(); }

/* ---------- 保存（PDF・画像） ---------- */
let dl = null, dlChecked = false;
async function getDl(){
  if(dl) return dl;
  try{ if(window.claude && typeof window.claude.use === "function") dl = await window.claude.use("downloads"); }catch(e){ dl = null; }
  dlChecked = true; setSaveMode();
  return dl;
}
function setSaveMode(){
  const can = !!dl || !dlChecked;
  /* タブレットなど保存ができない画面では、印刷ボタンで印刷用の画像を出す */
  $("savePdf").textContent = can ? "PDFで保存（問題＋答え）" : "問題と答えの画像をまとめて出す";
  $("saveImgQ").hidden = $("saveImgA").hidden = !can;
  if(!can && !setSaveMode.noted){ setSaveMode.noted = true; status("「問題を印刷する」「答えを印刷する」をおすと，印刷用の画像が出ます。画像を長押しして「共有」→「プリント」で印刷できます。"); }
}
function status(msg, kind){ const el = $("saveStatus"); el.textContent = msg; el.className = "status" + (kind ? " " + kind : ""); }
const PRINT_K = 200 / 25.4;
function renderPrint(ans){
  const fs = FS[state.size], opt = printOpt();
  return LAY.pages.map((_, i) => { const c = document.createElement("canvas"); c.width = Math.round(LAY.PW * PRINT_K); c.height = Math.round(LAY.PH * PRINT_K); drawPageAt(makeG(c.getContext("2d"), PRINT_K), LAY, i, fs, opt, ans); return c; });
}
function baseName(){
  const us = selUnits();
  const unit = us.length ? us[0].name.replace(/[（）()\s]/g, "") + (us.length > 1 ? "ほか" : "") : "";
  const d = new Date(), pad = n => String(n).padStart(2, "0");
  return "算数プリント_" + state.grade + "年_" + unit + "_" + groups.reduce((s, g) => s + g.n, 0) + "問_" + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate());
}
function showImages(list){
  const box = $("imgList"); box.innerHTML = "";
  for(const it of list){
    const fig = document.createElement("figure"), cap = document.createElement("figcaption"), img = document.createElement("img");
    cap.textContent = it.label; img.alt = it.label; img.src = it.canvas.toDataURL("image/png");
    fig.append(cap, img); box.appendChild(fig);
  }
  $("imgHow").textContent = "画像を1まいずつ長押しして「共有」→「プリント」をえらぶと，そのまま印刷できます。「写真に保存」してから，プリンターのアプリで印刷することもできます。用紙は「" + PAPER_NOW + "」，大きさは「用紙に合わせる」（ふちなしにしない）にしてください。";
  $("imgOverlay").hidden = false;
}
async function offer(filename, data){
  if(!dl) return "none";
  try{ await dl.save({filename, data}); return "saved"; }catch(err){ return (err && err.code) || "error"; }
}
function explain(code){
  if(code === "declined") return ["保存をやめました。", ""];
  if(code === "rate_limited") return ["保存の確認画面がすでに開いています。少し待ってからもう一度おしてください。", "err"];
  return ["この画面では保存できませんでした。", "err"];
}
async function withBusy(btn, fn){ const t = btn.textContent; btn.disabled = true; btn.textContent = "作成中…"; try{ await fn(); } finally { btn.disabled = false; btn.textContent = t; setSaveMode(); } }
$("savePdf").addEventListener("click", e => withBusy(e.currentTarget, async () => {
  await fontsReady;
  if(!(await getDl())){
    const q = renderPrint(false), a = renderPrint(true);
    showImages(q.map((c, i) => ({label:"問題" + (q.length > 1 ? "（" + (i + 1) + "まいめ）" : ""), canvas:c})).concat(a.map((c, i) => ({label:"答え（先生用）" + (a.length > 1 ? "（" + (i + 1) + "まいめ）" : ""), canvas:c}))));
    status("画像を表示しました。長押しして「共有」→「プリント」で印刷できます。", "ok");
    return;
  }
  status("PDFを作っています…");
  let blob;
  try{ blob = await makePdf(renderPrint(false).concat(renderPrint(true)), PAPER_NOW); }catch(err){ status("PDFを作れませんでした。「画像で保存」をためしてください。", "err"); return; }
  const r = await offer(baseName() + ".pdf", blob);
  const n = LAY.pages.length;
  if(r === "saved") status("PDFを保存しました（" + (n > 1 ? "1〜" + n + "ページ目：問題、" + (n + 1) + "〜" + (2 * n) + "ページ目：答え" : "1ページ目：問題、2ページ目：答え") + "）。印刷するときは、用紙を " + PAPER_NOW + " にしてください。", "ok");
  else status(...explain(r));
}));
async function saveImage(ans, btn){
  await withBusy(btn, async () => {
    await fontsReady; await getDl();
    const cs = renderPrint(ans);
    for(let i = 0; i < cs.length; i++){
      const blob = await new Promise(res => cs[i].toBlob(res, "image/png"));
      const r = await offer(baseName() + (ans ? "_答え" : "_問題") + (cs.length > 1 ? "_" + (i + 1) : "") + ".png", blob);
      if(r !== "saved"){ status(...explain(r)); return; }
    }
    status((ans ? "答え" : "問題") + "の画像を保存しました。", "ok");
  });
}
/* 印刷用のファイル：開くと印刷の画面が出る */
function printHtml(cs, ans){
  const [W, H] = PAPERS[PAPER_NOW];
  const imgs = cs.map(c => '<img src="' + c.toDataURL("image/png") + '" alt="">').join("");
  return '<!doctype html><html lang="ja"><head><meta charset="utf-8"><title>' + baseName() + (ans ? "_答え" : "_問題") + '</title>' +
    '<style>@page{size:' + W + 'mm ' + H + 'mm;margin:0}html,body{margin:0;padding:0;background:#fff}' +
    'img{display:block;width:' + W + 'mm;height:' + H + 'mm;page-break-after:always;break-after:page}img:last-child{page-break-after:auto;break-after:auto}' +
    '.note{font:16px sans-serif;padding:12px 16px;background:#e1e9f5;color:#1a2b45}.note button{font:inherit;margin-left:12px;padding:4px 14px}' +
    '@media print{.note{display:none}}</style></head><body>' +
    '<div class="note">印刷の画面が出ないときは <button onclick="print()">印刷する</button> をおしてください。用紙は ' + PAPER_NOW + '、倍率は100%（またはページに合わせる）、余白なしにしてください。</div>' +
    imgs + '<script>window.addEventListener("load",function(){setTimeout(function(){window.print();},400);});<\/script></body></html>';
}
async function printPages(ans, btn){
  await withBusy(btn, async () => {
    await fontsReady;
    if(!(await getDl())){ const cs = renderPrint(ans); showImages(cs.map((c, i) => ({label:(ans ? "答え（先生用）" : "問題") + (cs.length > 1 ? "（" + (i + 1) + "まいめ）" : ""), canvas:c}))); return; }
    status("印刷用のファイルを作っています…");
    const r = await offer(baseName() + (ans ? "_答え" : "_問題") + "_印刷用.html", printHtml(renderPrint(ans), ans));
    if(r === "saved") status("印刷用のファイルを保存しました。そのファイルを開くと印刷の画面が出ます。用紙は " + PAPER_NOW + " を選んでください。", "ok");
    else status(...explain(r));
  });
}
$("printQ").addEventListener("click", e => printPages(false, e.currentTarget));
$("printA").addEventListener("click", e => printPages(true, e.currentTarget));
$("saveImgQ").addEventListener("click", e => saveImage(false, e.currentTarget));
$("saveImgA").addEventListener("click", e => saveImage(true, e.currentTarget));
$("imgClose").addEventListener("click", () => { $("imgOverlay").hidden = true; });
$("imgClose2").addEventListener("click", () => { $("imgOverlay").hidden = true; });
getDl();

/* ---------- 操作 ---------- */
function bindSeg(id, fn){ $(id).addEventListener("click", e => { const b = e.target.closest("button"); if(b && !b.disabled) fn(b.dataset.v); }); }
bindSeg("segLevel", v => { state.level = v === "mix" ? "mix" : +v; update(true); });
bindSeg("segOrder", v => { state.order = v; update(true); });
bindSeg("segPaper", v => { state.paper = v; update(false); });
bindSeg("segOver", v => { state.over = v; update(false); });
bindSeg("segSize", v => { state.size = v; update(false); });
bindSeg("segScore", v => { state.score = v; update(false); });
bindSeg("segView", v => { view = v; segSet("segView", view); drawPreview(); });
const setTotal = v => { state.total = Math.max(1, Math.min(60, v | 0)); autoSplit(); update(true); };
$("cntMinus").addEventListener("click", () => setTotal(state.total - 1));
$("cntPlus").addEventListener("click", () => setTotal(state.total + 1));
$("cnt").addEventListener("change", () => setTotal(parseInt($("cnt").value, 10) || 1));
$("reSplit").addEventListener("click", () => { autoSplit(); update(true); });
$("regen").addEventListener("click", () => { state.seed = (state.seed * 7 + 12345 + Math.floor(Math.random() * 1000)) % 100000000; generate(); });
$("unitAll").addEventListener("click", () => { state.units = unitsOf(state.grade).map(u => u.id); autoSplit(); update(true); });
$("unitNone").addEventListener("click", () => { state.units = []; autoSplit(); update(true); });
$("meateOn").addEventListener("change", () => { state.meateOn = $("meateOn").checked; update(false); });
$("meate").addEventListener("input", () => { state.meate = $("meate").value; state.meateEdited = state.meate !== defaultMeate(); persist(); relayout(); });
window.addEventListener("resize", drawPreview);

/* ---------- 書体の読みこみ ----------
   日本語の書体は字ごとに分けて配られるので、プリントに出てくる字を全部読みこんでからかく */
const loadedChars = {};
async function ensureFonts(){
  if(!document.fonts || !document.fonts.load || !LAY || !groups.length) return false;
  const f = FONTS[FONT_KEY], set = loadedChars[f.web] || (loadedChars[f.web] = new Set());
  const c = document.createElement("canvas"), G = makeG(c.getContext("2d"), 0.05); G.capture = [];
  const fs = FS[state.size], opt = printOpt();
  try{ for(let i = 0; i < LAY.pages.length; i++){ drawPageAt(G, LAY, i, fs, opt, false); drawPageAt(G, LAY, i, fs, opt, true); } }catch(e){}
  let txt = "";
  for(const ch of G.capture.join("") + "（）〔〕答え先生用名前めあて点問／0123456789") if(ch.trim() && !set.has(ch)){ set.add(ch); txt += ch; }
  if(!txt) return false;
  const ws = [...new Set([f.n, f.b, 400])];
  try{ await Promise.race([Promise.all(ws.map(w => document.fonts.load(w + ' 20px "' + f.web + '"', txt))), new Promise(r => setTimeout(r, 6000))]); }catch(e){}
  return true;
}
let fontsReady = Promise.resolve();
function scheduleFonts(){
  fontsReady = fontsReady.then(ensureFonts).then(changed => { if(changed){ mG = null; clearMetrics(groups); relayout(); } }).catch(() => {});
}

function clearMetrics(o){
  const seen = new Set();
  const walk = v => { if(!v || typeof v !== "object" || seen.has(v)) return; seen.add(v); if(v.m && v.t) delete v.m; for(const k of Object.keys(v)) if(k !== "unit" && k !== "sub") walk(v[k]); };
  walk(o);
}

load();
if(!Object.keys(state.alloc).length || selUnits().some(u => state.alloc[u.id] === undefined)) autoSplit();
renderAll();
generate();

</script>
