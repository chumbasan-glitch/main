<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>時間割作成ツール</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #2b2b2b; --sub: #6b6b6b; --line: #dedad2; --line-strong: #c9c4b8;
    --field: #ffffff; --soft: #f1eee7; --hover: #ebe7de; --track: #e7e3da; --item: #fcfbf8;
    --main: #2f6f5e; --main-weak: #e3efe9; --on-main: #ffffff; --link: #2f6f5e;
    --warn: #b3261e; --warn-weak: #fbe9e7; --note: #fff6d6;
    --cell-fixed: #e6e6e6; --cell-none: #9e9e9e; --cell-empty: #fff3c4; --cell-sat: #e6f0fa; --cell-line: #cfcac0; --day-line: #555555;
    --x-bg: #6b6b6b; --x-ink: #ffffff; --toast-bg: #333333; --toast-ink: #ffffff;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #151a19; --card: #1e2423; --ink: #e7eae6; --sub: #a6aea9; --line: #34403c; --line-strong: #4b5853;
    --field: #121615; --soft: #28302e; --hover: #2c3533; --track: #2f3836; --item: #1a201f;
    --main: #2f6f5e; --main-weak: #1f3a33; --on-main: #ffffff; --link: #7fd1b6;
    --warn: #ff8f85; --warn-weak: #3b2321; --note: #3a3320;
    --cell-fixed: #3a403e; --cell-none: #5f6664; --cell-empty: #4a4121; --cell-sat: #1f3140; --cell-line: #3f4a46; --day-line: #b9c1bd;
    --x-bg: #a6aea9; --x-ink: #151a19; --toast-bg: #e7eae6; --toast-ink: #151a19;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #151a19; --card: #1e2423; --ink: #e7eae6; --sub: #a6aea9; --line: #34403c; --line-strong: #4b5853;
    --field: #121615; --soft: #28302e; --hover: #2c3533; --track: #2f3836; --item: #1a201f;
    --main: #2f6f5e; --main-weak: #1f3a33; --on-main: #ffffff; --link: #7fd1b6;
    --warn: #ff8f85; --warn-weak: #3b2321; --note: #3a3320;
    --cell-fixed: #3a403e; --cell-none: #5f6664; --cell-empty: #4a4121; --cell-sat: #1f3140; --cell-line: #3f4a46; --day-line: #b9c1bd;
    --x-bg: #a6aea9; --x-ink: #151a19; --toast-bg: #e7eae6; --toast-ink: #151a19;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 16px; line-height: 1.6; }
  header { background: var(--main); color: var(--on-main); padding: 12px 20px; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  header h1 { font-size: 18px; margin: 0; }
  header .save { font-size: 13px; opacity: .9; }
  .wrap { display: flex; max-width: 1200px; margin: 0 auto; gap: 20px; padding: 20px 16px 80px; }
  nav { width: 220px; flex: none; }
  nav ol { list-style: none; margin: 0; padding: 0; position: sticky; top: 12px; }
  nav li button { width: 100%; text-align: left; background: none; border: 0; padding: 6px 10px; border-radius: 6px; font: inherit; font-size: 14px; color: var(--sub); cursor: pointer; }
  nav li button:hover { background: var(--hover); }
  nav li button.on { background: var(--main-weak); color: var(--link); font-weight: bold; }
  main { flex: 1; min-width: 0; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px; }
  .qno { color: var(--link); font-weight: bold; font-size: 14px; }
  h2 { margin: 4px 0 8px; font-size: 22px; }
  .lead { color: var(--sub); margin: 0 0 18px; }
  .bar { height: 6px; background: var(--track); border-radius: 3px; margin-bottom: 16px; overflow: hidden; }
  .bar > div { height: 100%; background: var(--main); }
  table.t { border-collapse: collapse; margin: 8px 0 12px; }
  table.t th, table.t td { border: 1px solid var(--line); padding: 4px 6px; text-align: center; vertical-align: middle; }
  table.t th { background: var(--soft); font-weight: normal; font-size: 14px; }
  table.t td.l, table.t th.l { text-align: left; }
  .scroll { overflow-x: auto; }
  input[type=text], input[type=number], select { font: inherit; padding: 4px 6px; border: 1px solid var(--line-strong); border-radius: 6px; background: var(--field); color: var(--ink); }
  input[type=number] { width: 4.2em; }
  input.s { width: 6em; } input.m { width: 10em; } input.lg { width: 16em; }
  button.btn { font: inherit; border: 1px solid var(--link); background: var(--card); color: var(--link); padding: 6px 14px; border-radius: 8px; cursor: pointer; }
  button.btn:hover { background: var(--main-weak); }
  button.btn.primary { background: var(--main); color: var(--on-main); }
  button.btn.primary:hover { filter: brightness(1.1); }
  button.btn.small { font-size: 13px; padding: 2px 10px; }
  button.btn.del { border-color: var(--line-strong); color: var(--sub); }
  button.btn:disabled { opacity: .5; cursor: default; }
  .foot { display: flex; justify-content: space-between; margin-top: 24px; gap: 12px; }
  .item { border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; margin: 10px 0; background: var(--item); }
  .item .row { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; margin: 4px 0; }
  .chips label { display: inline-flex; align-items: center; gap: 3px; margin-right: 10px; white-space: nowrap; }
  .choice { display: block; border: 1px solid var(--line); border-radius: 10px; padding: 10px 14px; margin: 8px 0; cursor: pointer; }
  .choice.on { border-color: var(--main); background: var(--main-weak); }
  a { color: var(--link); }
  .ok { color: var(--link); } .ng { color: var(--warn); font-weight: bold; }
  .small { font-size: 13px; color: var(--sub); }
  .box { border-radius: 10px; padding: 12px 14px; margin: 12px 0; }
  .box.warn { background: var(--warn-weak); } .box.note { background: var(--note); } .box.good { background: var(--main-weak); }
  .box ul { margin: 6px 0 0; padding-left: 20px; }
  .off { background: var(--cell-none); color: var(--on-main); }
  .cellbtn { width: 3.2em; font: inherit; font-size: 13px; border: 1px solid var(--line-strong); border-radius: 4px; background: var(--field); color: var(--ink); cursor: pointer; padding: 2px 0; }
  .cellbtn.wide { width: 5em; }
  .cellbtn.x { background: var(--x-bg); color: var(--x-ink); border-color: var(--x-bg); }
  .progress { height: 14px; background: var(--track); border-radius: 7px; overflow: hidden; margin: 8px 0; }
  .progress > div { height: 100%; background: var(--main); width: 0; transition: width .2s; }
  table.pv { border-collapse: collapse; font-size: 11px; table-layout: fixed; }
  table.pv th, table.pv td { border: 1px solid var(--cell-line); padding: 0; text-align: center; }
  table.pv .c { width: 3.6em; height: 2.4em; display: flex; align-items: center; justify-content: center; overflow: hidden; line-height: 1.1; word-break: break-all; padding: 0 1px; font-size: 12px; }
  table.pv .c.f3 { font-size: 10.5px; } table.pv .c.f4 { font-size: 9px; } table.pv .c.f9 { font-size: 8px; }
  table.pv th .c { font-weight: bold; }
  .blocks { display: flex; flex-wrap: wrap; gap: 14px 3.6em; margin-top: 16px; }
  .blk-t { font-weight: bold; font-size: 13px; margin-bottom: 2px; }
  table.pv td.fx { background: var(--cell-fixed); } table.pv td.no { background: var(--cell-none); } table.pv td.em { background: var(--cell-empty); } table.pv td.sa { background: var(--cell-sat); } table.pv td.mo { background: var(--main-weak); }
  table.pv th.sec { text-align: left; background: var(--main-weak); padding: 2px 6px; }
  table.pv th.day { border-left: 2px solid var(--day-line); } table.pv td.dl { border-left: 2px solid var(--day-line); }
  .perclass { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 13px; }
  .perclass label { display: inline-flex; align-items: center; gap: 4px; }
  table.ft { border-collapse: collapse; table-layout: fixed; }
  table.ft th, table.ft td { border: 1px solid var(--cell-line); padding: 4px 6px; vertical-align: top; }
  table.ft th { background: var(--soft); text-align: center; width: 3em; }
  table.ft tr:first-child th { width: auto; }
  table.ft td { width: 10.5em; font-size: 12px; line-height: 1.5; height: 4.2em; }
  table.ft td.no { background: var(--cell-none); }
  table.ft .fn { white-space: nowrap; margin-right: .6em; display: inline-block; }
  .adv { border-top: 1px solid var(--line); padding: 10px 0 4px; margin-top: 8px; }
  .adv-t { font-weight: bold; margin-bottom: 4px; }
  .adv ul { margin: 2px 0 4px; }
  .tag { display: inline-block; font-size: 12px; padding: 0 8px; border-radius: 10px; background: var(--soft); margin-right: 6px; }
  .tag.fix { background: var(--main-weak); color: var(--link); }
  [contenteditable="true"] { cursor: text; outline: none; }
  [contenteditable="true"]:focus { box-shadow: inset 0 0 0 2px var(--link); background: var(--field); }
  .print-title { display: none; font-weight: bold; font-size: 16px; margin: 0 0 6px; }
  .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: var(--toast-bg); color: var(--toast-ink); padding: 8px 18px; border-radius: 20px; font-size: 14px; opacity: 0; transition: opacity .3s; pointer-events: none; }
  .toast.show { opacity: .92; }
  @media (max-width: 800px) { nav { display: none; } .wrap { padding: 12px 8px 80px; } .card { padding: 16px; } }
  @media print {
    html, body { background: #fff !important; color: #000 !important; }
    body.printing * { visibility: hidden; }
    body.printing .print-target, body.printing .print-target * { visibility: visible; }
    body.printing .print-target { position: absolute; left: 0; top: 0; overflow: visible; }
    body.printing .print-title { display: block; }
    header, nav, .foot, .noprint { display: none !important; } .card { border: 0; }
  }
</style>
</head>
<body>
<header>
  <h1>時間割作成ツール</h1>
  <span class="save" id="saveName"></span>
</header>
<div class="wrap">
  <nav><ol id="nav"></ol></nav>
  <main><div class="card" id="card">読み込んでいます…</div></main>
</div>
<div class="toast" id="toast"></div>

<script>window.JW_STANDALONE = true;</script>
<script>
/* =========================================================
 * 時間割作成ツール：組み立て・チェックの計算部分
 * （入力画面とチェック画面の両方から読み込む）
 * ========================================================= */
var JW = (function () {
  var DAYS = ['月', '火', '水', '木', '金'];
  var GRADES = [1, 2, 3, 4, 5, 6];

  // 年間標準時数（小学校学習指導要領）… 1年〜6年
  var STD = {
    kokugo: [306, 315, 245, 245, 175, 175], shakai: [0, 0, 70, 90, 100, 105],
    sansu: [136, 175, 175, 175, 175, 175], rika: [0, 0, 90, 105, 105, 105],
    seikatsu: [102, 105, 0, 0, 0, 0], ongaku: [68, 70, 60, 60, 50, 50],
    zukou: [68, 70, 60, 60, 50, 50], katei: [0, 0, 0, 0, 60, 55],
    taiiku: [102, 105, 105, 105, 90, 90], gaikatsu: [0, 0, 35, 35, 0, 0],
    gaikokugo: [0, 0, 0, 0, 70, 70], doutoku: [34, 35, 35, 35, 35, 35],
    sougou: [0, 0, 70, 70, 70, 70], gakkatsu: [34, 35, 35, 35, 35, 35]
  };

  function weeksOf(g) { return g === 1 ? 34 : 35; }

  function subj(id, name, display, weekly, opt) {
    var hours = {};
    GRADES.forEach(function (g, i) { hours[g] = weekly[i]; });
    var s = { id: id, name: name, display: display, hours: hours, room: '', roomGrades: [],
      maxPerDay: 1, pairs: 0, active: false, auto: true };
    for (var k in (opt || {})) s[k] = opt[k];
    return s;
  }

  // 特別教室：count＝部屋の数、grades[k]＝k番目の部屋を使う学年（空＝全学年）
  function room(name, cap) { return { name: name, cap: cap, count: 1, grades: [[]] }; }
  var CIRCLED = '①②③④⑤⑥⑦⑧⑨';
  function roomLabel(r, k) { return (+r.count || 1) > 1 ? r.name + CIRCLED.charAt(k) : r.name; }
  // 1部屋ずつに分けた特別教室の一覧
  function physicalRooms(A) {
    var list = [];
    (A.rooms || []).forEach(function (r) {
      var n = Math.max(1, +r.count || 1);
      for (var k = 0; k < n; k++) {
        list.push({ kind: r.name, label: roomLabel(r, k), cap: Math.max(1, +r.cap || 1), grades: ((r.grades || [])[k] || []).slice(),
          gradeCap: r.gradeCap || {} });
      }
    });
    return list;
  }

  function perGrade(v) { var o = {}; GRADES.forEach(function (g) { o[g] = v; }); return o; }

  // 最初に表示する答え（標準時数を週あたりに直したもの）
  function defaultAnswers() {
    var classNames = {};
    GRADES.forEach(function (g) { classNames[g] = ['1組', '2組']; });
    return {
      version: 1,
      name: '',
      days: DAYS.slice(),
      maxPeriods: 6,
      classCounts: perGrade(2),
      useCustomNames: false,
      classNames: classNames,
      periods: {
        1: [5, 5, 5, 5, 5], 2: [5, 6, 5, 5, 5], 3: [6, 6, 5, 6, 5],
        4: [6, 6, 5, 6, 6], 5: [6, 6, 5, 6, 6], 6: [6, 6, 5, 6, 6]
      },
      subjects: [
        subj('kokugo', '国語', '国語', [9, 9, 7, 7, 5, 5], { maxPerDay: 2 }),
        subj('shakai', '社会', '社会', [0, 0, 2, 2, 2, 3]),
        subj('sansu', '算数', '算数', [4, 5, 5, 5, 5, 5]),
        subj('rika', '理科', '理科', [0, 0, 2, 3, 3, 3]),
        subj('seikatsu', '生活', '生活', [3, 3, 0, 0, 0, 0], { maxPerDay: 2, pairs: 1 }),
        subj('ongaku', '音楽', '音楽', [2, 2, 2, 2, 1, 1], { room: '音楽室', roomGrades: [3, 4, 5, 6] }),
        subj('zukou', '図画工作', '図画工作', [2, 2, 2, 2, 2, 2], { maxPerDay: 2, pairs: 'all' }),
        subj('katei', '家庭', '家庭', [0, 0, 0, 0, 2, 1], { room: '家庭科室', maxPerDay: 2, pairs: 'all' }),
        subj('taiiku', '体育', '体育', [3, 3, 3, 3, 3, 3], { room: '校庭', active: true }),
        subj('gaikatsu', '外国語活動', '外国語活動', [0, 0, 1, 1, 0, 0]),
        subj('gaikokugo', '外国語', '外国語', [0, 0, 0, 0, 2, 2]),
        subj('doutoku', '道徳', '道徳', [1, 1, 1, 1, 1, 1]),
        subj('sougou', '総合的な学習の時間', '総合', [0, 0, 2, 2, 2, 2], { maxPerDay: 2 }),
        subj('gakkatsu', '学級活動', '学級活動', [1, 1, 1, 1, 1, 1])
      ],
      rooms: [
        room('体育館', 2), room('校庭', 3), room('音楽室', 1), room('図工室', 1), room('理科室', 1),
        room('家庭科室', 1), room('図書館', 1), room('PC室', 1)
      ],
      variants: [],
      teachers: [],
      fixed: [],
      prefs: [],
      pins: [],
      module: { on: false, per: 3, count: 1, grades: GRADES.slice(), slots: {} },
      syncs: [],
      rules: { dailyMax: true, pairs: true, spread: true, active: true },
      // 使う機能（使わない機能の質問は出さない）
      features: { teachers: true, homeroom: false, variants: false, module: false, sat: false, syncs: false, pins: false },
      // 教科担任制：学年ごとに { on, manual: 'gap'|'auto', assign: { 教科: 'own'|'cls:学年-組'|'other' } }
      homeroom: { grades: {} }
    };
  }

  // 使わない機能の入力は、組むときには無いものとして扱う
  function effective(A) {
    var f = A.features;
    if (!f || A._eff) return A;
    var B = {};
    for (var k in A) B[k] = A[k];
    B._eff = true;
    if (!f.module) B.module = { on: false, per: 3, count: 1, grades: [], slots: {} };
    if (!f.sat && B.days.length > 5) {
      B.days = B.days.slice(0, 5);
      var per = {};
      for (var g in B.periods) per[g] = (B.periods[g] || []).slice(0, 5);
      B.periods = per;
    }
    if (!f.variants) B.variants = [];
    if (!f.teachers) B.teachers = [];
    if (!f.syncs) B.syncs = [];
    if (!f.pins) B.pins = [];
    if (!f.homeroom) B.homeroom = null;
    return B;
  }

  function uid(prefix) { return prefix + Math.random().toString(36).slice(2, 8); }

  function className(A, g, i) {
    var list = (A.useCustomNames && A.classNames[g]) ? A.classNames[g] : null;
    var n = list && list[i] ? String(list[i]).trim() : '';
    return n || ((i + 1) + '組');
  }
  function classLabel(A, g, i) { return g + '年' + className(A, g, i); }
  // 表で使う短い名前（3年A組→3A、3年1組→3-1）
  function classShort(A, g, i) {
    var n = className(A, g, i).replace(/組$/, '');
    return /^[0-9０-９]+$/.test(n) ? g + '-' + n : g + n;
  }

  function subjectById(A, id) {
    for (var i = 0; i < A.subjects.length; i++) if (A.subjects[i].id === id) return A.subjects[i];
    return null;
  }
  function variantById(A, id) {
    for (var i = 0; i < A.variants.length; i++) if (A.variants[i].id === id) return A.variants[i];
    return null;
  }
  // 教科や「教科の一部」の名前（選択肢に出す名前）
  function targetName(A, id) {
    var s = subjectById(A, id);
    if (s) return s.name;
    var v = variantById(A, id);
    if (v) { var p = subjectById(A, v.subject); return (p ? p.name : '') + '（' + v.name + '）'; }
    return '（不明）';
  }
  function targetList(A) {
    var list = [];
    A.subjects.forEach(function (s) {
      list.push({ id: s.id, name: s.name });
      A.variants.forEach(function (v) {
        if (v.subject === s.id) list.push({ id: v.id, name: s.name + '（' + v.name + '）' });
      });
    });
    return list;
  }
  function subjectRoom(s, g) {
    if (!s.room) return '';
    if (s.roomGrades && s.roomGrades.length && s.roomGrades.indexOf(g) < 0) return '';
    return s.room;
  }
  function slotName(A, s) {
    var MP = A.maxPeriods;
    return A.days[Math.floor(s / MP)] + (s % MP + 1);
  }
  function listText(arr) { return arr.join('・'); }
  function prefText(A, p) {
    var days = (p.days || []).length ? p.days.map(function (d) { return A.days[d]; }).join('・') + '曜' : '';
    var pers = (p.periods || []).length ? p.periods.join('・') + '時間目' : '';
    var when = (days + (days && pers ? 'の' : '') + pers) || 'いつでも';
    return targetName(A, p.target) + 'を' + when + (p.mode === 'avoid' ? 'に入れない' : 'に入れる');
  }

  // 時数に数えない土曜日か
  function satOnly(A, d) { return A.days[+d] === '土' && !A.satCount; }

  // 授業の固定と、「先に決まっている時間」で教科を選んだもの（学年の全クラス）をまとめる
  function allPins(A, classes) {
    var list = (A.pins || []).slice();
    (A.fixed || []).forEach(function (f) {
      if (!f.target || satOnly(A, f.day)) return;
      classes.forEach(function (c) {
        if ((f.grades || []).indexOf(c.grade) >= 0) list.push({ teacher: '', cls: c.key, target: f.target, day: f.day, period: f.period, fromFixed: true, label: (f.label || '').trim() });
      });
    });
    return list;
  }

  // モジュールで数える時間（例：3回で1時間）
  // モジュールの曜日ごとの内容 { 曜日: { kind: 'subject'|'other', target, text, label } }（古い形もここで読みかえる）
  function moduleSlots(mod) {
    if (!mod || !mod.on) return {};
    if (mod.slots) return mod.slots;
    var out = {};
    (mod.days || []).forEach(function (d) { out[d] = { kind: 'subject', target: mod.target, label: mod.label || '' }; });
    return out;
  }
  // モジュールでその教科を何時間と数えるか（例：3回で1時間）
  // A を渡すと、時数に数えない土曜日のモジュールは数えない
  function moduleHours(mod, subjId, A) {
    var slots = moduleSlots(mod), n = 0;
    Object.keys(slots).forEach(function (d) {
      var x = slots[d];
      if (A && satOnly(A, d)) return;
      if (x && x.kind === 'subject' && x.target === subjId) n++;
    });
    var per = Math.max(1, +mod.per || 3);
    return Math.floor(n / per) * Math.max(1, +mod.count || 1);
  }

  /* ---------- 入力内容から、組み立て用のデータを作る ---------- */
  // opt.includeManual … 担任が入れる教科（ツールで組まない教科）のコマも作る（チェック用）
  function buildModel(A, opt) {
    opt = opt || {};
    A = effective(A);
    var D = A.days.length, MP = A.maxPeriods, S = D * MP;
    var errors = [], notes = [];
    var classes = [];
    GRADES.forEach(function (g) {
      var n = +A.classCounts[g] || 0;
      for (var i = 0; i < n; i++) {
        classes.push({ key: g + '-' + i, grade: g, idx: i, label: classLabel(A, g, i), short: classShort(A, g, i) });

    });
    var classIndex = {};
    classes.forEach(function (c, ci) { classIndex[c.key] = ci; });

    // コマが使えるか（true / 固定の内容 / false）
    var avail = classes.map(function (c) {

    });
    // 土曜日を時数に数えない場合は、ツールでは土曜日に授業を入れない（先生が手で入れる）

    A.days.forEach(function (dn, d) {
      if (dn !== '土' || A.satCount) return;
      classes.forEach(function (c, ci) {
        for (var p = 0; p < MP; p++) if (avail[ci][d * MP + p]) { avail[ci][d * MP + p] = false; satFree[ci][d * MP + p] = true; }
      });
    });
    var fixedLabel = classes.map(function () { return {}; });
    (A.fixed || []).forEach(function (f) {
      if (f.target && !satOnly(A, f.day)) return; // 教科を選んだ時間は、その教科の授業として固定する（下の allPins）
      var s = (+f.day) * MP + (+f.period - 1);
      // 数えない土曜日は、教科を選んでも表に出すだけ（時数には数えない）
      var text = (f.label || '').trim() || (f.target ? ((subjectById(A, f.target) || {}).display || targetName(A, f.target)) : '') || '行事';
      classes.forEach(function (c, ci) {
        if ((f.grades || []).indexOf(c.grade) >= 0 && (avail[ci][s] || satFree[ci][s])) {

          delete satFree[ci][s];

        }
      });
    });

    // 特別教室：同じ種類の部屋を、その学年が使える部屋のまとまり（pool）にする
    var phys = physicalRooms(A);
    var rooms = {}, poolName = {}, poolRooms = {}, poolGradeCap = {};
    var noRoomMsg = {};
    function poolFor(kind, g) {
      if (!kind) return '';
      var idx = [];
      phys.forEach(function (r, i) { if (r.kind === kind && (!r.grades.length || r.grades.indexOf(g) >= 0)) idx.push(i); });
      if (!idx.length) {
        if (phys.some(function (r) { return r.kind === kind; }) && !noRoomMsg[kind + g]) {
          noRoomMsg[kind + g] = 1;
          errors.push(g + '年が使える' + kind + 'がありません（質問「特別教室」で使う学年を確認してください）。');
        }
        return '';
      }
      var key = kind + '#' + idx.join(',');
      if (!rooms[key]) {
        rooms[key] = idx.reduce(function (t, i) { return t + phys[i].cap; }, 0);
        // 学年ごとの上限（例：5・6年が使うときは単独）
        poolGradeCap[key] = {};
        GRADES.forEach(function (gg) {
          poolGradeCap[key][gg] = idx.reduce(function (t, i) {
            var gc = +phys[i].gradeCap[gg];

          }, 0);
        });
        poolName[key] = idx.length === 1 ? phys[idx[0]].label : kind;
        poolRooms[key] = idx;
      }

    }

    var units = [];
    var classUnits = classes.map(function () { return []; });
    function addUnit(ci, s, variant, display, roomKind, auto) {
      var u = { id: units.length, cls: ci, subj: s.id, variant: variant, display: display,
        room: poolFor(roomKind, classes[ci].grade), teachers: [], sync: null, pair: -1, prefs: [],
        active: !!s.active, manual: !auto };
      units.push(u);
      classUnits[ci].push(u.id);
      return u;
    }

    classes.forEach(function (c, ci) {
      var g = c.grade;
      A.subjects.forEach(function (s) {
        var h = +s.hours[g] || 0;
        // モジュール（朝の短い時間）で数える分は、普通の時間から引く
        var mod = A.module;
        if (mod && mod.on && (mod.grades || []).indexOf(g) >= 0) h = Math.max(0, h - moduleHours(mod, s.id, A));
        if (h <= 0) return;
        var vs = A.variants.filter(function (v) { return v.subject === s.id && (+v.hours[g] || 0) > 0; });
        var vsum = vs.reduce(function (t, v) { return t + (+v.hours[g] || 0); }, 0);
        var base = h - vsum;
        if (base < 0) {

            vs.map(function (v) { return v.name; }).join('・') + '）の合計' + vsum + 'コマのほうが多くなっています。');
          base = 0;
        }
        var baseUnits = [];
        var sAuto = s.auto !== false;
        for (var k = 0; k < base; k++) baseUnits.push(addUnit(ci, s, null, s.display || s.name, subjectRoom(s, g), sAuto));
        vs.forEach(function (v) {
          for (var k = 0; k < (+v.hours[g] || 0); k++) addUnit(ci, s, v.id, v.display || v.name, v.room, v.auto !== false);
        });
        // 'all' … すべて2時間続き（必ず守る）。数 … その回数だけ、できれば2時間続き
        var allPairs = s.pairs === 'all';
        var np = allPairs ? Math.floor(baseUnits.length / 2) : Math.min(+s.pairs || 0, Math.floor(baseUnits.length / 2));
        for (var p = 0; p < np; p++) {
          var a = baseUnits[p * 2], b = baseUnits[p * 2 + 1];
          a.pair = b.id; b.pair = a.id;
          a.pairHard = b.pairHard = allPairs;
        }
      });
    });

    function matches(u, target) { return u.subj === target || u.variant === target; }
    function isAuto(target) {
      var s = subjectById(A, target);
      if (s) return s.auto !== false || A.variants.some(function (v) { return v.subject === s.id && v.auto !== false; });
      var v = variantById(A, target);
      return !!v && v.auto !== false;
    }
    function offNote(what, target) {
      notes.push(what + '：' + targetName(A, target) + 'はこのツールで組まない教科なので、この設定は使いません。');
    }

    // 専科・講師（組まない教科でも、先生が担当する授業はツールで組む）
    var teachers = (A.teachers || []).map(function (t) {
      var off = [];
      for (var s = 0; s < S; s++) {
        var d = Math.floor(s / MP), p = s % MP + 1;
        off.push(!!(t.off && t.off[d + '-' + p]));
      }
      // 学年ごとの曜日の指定（その学年はこの曜日だけ）
      var dayOk = {};
      Object.keys(t.gradeDays || {}).forEach(function (g) {
        var ds = t.gradeDays[g] || [];
        if (!ds.length) return;
        dayOk[g] = A.days.map(function (x, d) { return ds.indexOf(d) >= 0; });
      });
      return { name: t.name || '（名前なし）', off: off, expect: {}, dayOk: dayOk, group: !!t.groupGrade, chain: !!t.chainGrade, dayRoom: t.dayRoom || {} };
    });
    (A.teachers || []).forEach(function (t, ti) {
      (t.jobs || []).forEach(function (j) {
        var ci = classIndex[j.cls];
        if (ci === undefined) return;
        var pool = classUnits[ci].map(function (id) { return units[id]; })
          .filter(function (u) { return matches(u, j.target) && u.teachers.indexOf(ti) < 0; });
        var n = j.hours === 'all' ? pool.length : (+j.hours || 0);
        if (pool.length < n) {
          errors.push(teachers[ti].name + '：' + classes[ci].label + 'の' + targetName(A, j.target) +
            'は週' + pool.length + 'コマしかないので、' + n + 'コマは持てません。');
          n = pool.length;
        }

        var bySubject = !!subjectById(A, j.target);
        pool.sort(function (a, b) {
          return (a.teachers.length - b.teachers.length) ||
            (bySubject ? ((a.variant ? 1 : 0) - (b.variant ? 1 : 0)) : 0) ||
            ((a.manual ? 1 : 0) - (b.manual ? 1 : 0)) || ((b.pair >= 0) - (a.pair >= 0));
        });
        pool.slice(0, n).forEach(function (u) { u.teachers.push(ti); u.manual = false; });
        teachers[ti].expect[ci] = (teachers[ti].expect[ci] || 0) + n;
      });
    });
    // 時間割での表し方（例：後補充は【　】）
    (A.teachers || []).forEach(function (t, ti) {
      var txt = t.cellMode === 'bracket' ? '【　】' : t.cellMode === 'text' ? (t.cellText || '').trim() : '';
      if (!txt) return;

    });
    // 教科担任制：担任も1人の先生として扱い、同じ時間に2つのクラスで教えないようにする
    var hrIndex = {};
    function hrTeacher(key) {

      var off = [];

      hrIndex[key] = teachers.length - 1;

    }
    var HR = A.homeroom && A.homeroom.grades ? A.homeroom.grades : {};
    classes.forEach(function (c, ci) {

    });
    function M_subjName(id) { var sj = subjectById(A, id); return sj ? sj.name : id; }

    // 担任が入れる分（ツールで組まない）を数え、組むときは外す

    var manualList = {};
    units.forEach(function (u) {
      if (!u.manual) return;

    });
    if (!opt.includeManual) classUnits = classUnits.map(function (list) { return list.filter(function (id) { return !units[id].manual; }); });

    // 曜日ごとの教室（先生の設定）
    units.forEach(function (u) {
      if (!u.teachers.length) return;
      var T = teachers[u.teachers[0]], diff = false, g = classes[u.cls].grade;
      var byDay = A.days.map(function (x, d) {
        var v = T.dayRoom[d];
        var r = !v ? u.room : v === '__class' ? '' : poolFor(v, g);
        if (r !== u.room) diff = true;

      if (diff) u.roomByDay = byDay;
    });

    // 同じ時間にそろえる授業
    var syncMembers = {};
    (A.syncs || []).forEach(function (sg, gi) {
      var cis = (sg.classes || []).map(function (k) { return classIndex[k]; })
        .filter(function (x) { return x !== undefined; });
      if (cis.length < 2) return;
      if (!opt.includeManual && !isAuto(sg.target) &&
        !cis.some(function (ci) { return classUnits[ci].some(function (id) { return matches(units[id], sg.target); }); })) return offNote('同じ時間にそろえる授業', sg.target);
      var cnt = +sg.count || 0;
      var ok = true;
      var picks = cis.map(function (ci) {
        var pool = classUnits[ci].map(function (id) { return units[id]; })
          .filter(function (u) { return matches(u, sg.target) && !u.sync; })
          .sort(function (a, b) { return ((a.pair >= 0) - (b.pair >= 0)) || (b.teachers.length - a.teachers.length); });
        if (pool.length < cnt) {
          errors.push('同じ時間にそろえる授業：' + classes[ci].label + 'の' + targetName(A, sg.target) +
            'は週' + pool.length + 'コマしかないので、' + cnt + 'コマそろえられません。');

        }

      if (!ok) return;

    });

    teachers.forEach(function (t, ti) {
      t.units = units.filter(function (u) { return u.teachers.indexOf(ti) >= 0 && !u.manual; }).map(function (u) { return u.id; });
      var keys = {};
      units.forEach(function (u) { if (u.teachers.indexOf(ti) >= 0) keys[u.sync || ('u' + u.id)] = 1; });
      var need = Object.keys(keys).length;
      var can = t.off.filter(function (x) { return !x; }).length;
      if (need > can) errors.push(t.name + '：担当が週' + need + 'コマあるのに、勤務できるコマは' + can + 'コマです。');
    });

    // 希望
    var prefs = (A.prefs || []).map(function (p, pi) {
      var mask = [];
      for (var s = 0; s < S; s++) {
        var d = Math.floor(s / MP), per = s % MP + 1;
        var dOk = !(p.days || []).length || p.days.indexOf(d) >= 0;
        var pOk = !(p.periods || []).length || p.periods.indexOf(per) >= 0;
        mask.push(dOk && pOk);
      }
      units.forEach(function (u) {
        var gOk = !(p.grades || []).length || p.grades.indexOf(classes[u.cls].grade) >= 0;
        if (gOk && matches(u, p.target)) u.prefs.push(pi);
      });
      return { mode: p.mode, mask: mask, text: prefText(A, p), strict: !!p.strict };
    });

    // 授業の固定（このクラスのこの授業を、この時間に）
    var tIndex = {};
    (A.teachers || []).forEach(function (t, ti) { tIndex[t.id] = ti; });
    allPins(A, classes).forEach(function (pn) {
      var ci = classIndex[pn.cls];
      if (ci === undefined || !pn.target) return;
      var s = (+pn.day) * MP + (+pn.period - 1), c = classes[ci];
      var what = c.label + 'の' + targetName(A, pn.target) + '（' + slotName(A, s) + '）';
      if (!avail[ci][s]) { errors.push('授業の固定：' + what + 'は、授業を入れられない時間です。'); return; }
      var ti = tIndex[pn.teacher];
      var pool = classUnits[ci].map(function (id) { return units[id]; })
        .filter(function (u) { return matches(u, pn.target) && u.pin === undefined && !u.sync; })
        .sort(function (a, b) { return ti === undefined ? 0 : ((b.teachers.indexOf(ti) >= 0) - (a.teachers.indexOf(ti) >= 0)); });
      if (!pool.length) {
        // 組まない教科でも、時間を決めて固定したものはツールで入れる
        var mu = units.filter(function (u) { return u.cls === ci && u.manual && matches(u, pn.target) && u.pin === undefined; })[0];
        if (mu) {
          mu.manual = false;
          classUnits[ci].push(mu.id);
          manualCount[ci]--;
          var mk2 = c.grade + '年 ' + mu.display;
          if (--manualList[mk2] <= 0) delete manualList[mk2];
          pool = [mu];
        }
      }
      if (!pool.length) { errors.push((pn.fromFixed ? '先に決まっている時間：' : '授業の固定：') + what + 'に入れる授業がありません（組まない教科か、時数が足りません）。'); return; }
      if (ti !== undefined && pool[0].teachers.indexOf(ti) < 0) notes.push('授業の固定：' + what + 'は、' + teachers[ti].name + 'の担当ではありません。');
      pool[0].pin = s;
      if (pn.label) pool[0].display = pn.label; // 例：市民科として数え、表には「委／ク」と出す
    });

    var maxPerDay = {}, subjName = {}, subjTotal = {};
    A.subjects.forEach(function (s) {
      maxPerDay[s.id] = Math.max(1, +s.maxPerDay || 1);
      subjName[s.id] = s.name;
    });

    // 特別教室に入りきるか
    Object.keys(rooms).forEach(function (r) {
      var need = units.filter(function (u) { return u.room === r && !u.manual; }).length;
      var slots = 0;
      for (var s = 0; s < S; s++) {
        if (classes.some(function (c, ci) { return avail[ci][s]; })) slots++;
      }
      if (need > slots * rooms[r]) errors.push(poolName[r] + '（' + roomUsers(r) + '）：使う授業が週' + need + 'コマあり、上限' + rooms[r] + 'クラス×' + slots +
        'コマ＝' + (slots * rooms[r]) + 'コマをこえています。上限を上げるか、使う学年やコマ数を見直してください。');
    });
    function roomUsers(r) {
      var gs = GRADES.filter(function (g) { return units.some(function (u) { return u.room === r && classes[u.cls].grade === g; }); });
      return gs.length ? gs.join('・') + '年' : '';
    }
    Object.keys(syncMembers).forEach(function (key) {
      if (key.split(':')[1] !== '0') return;
      var cis = syncMembers[key];
      var u = units.filter(function (x) { return x.sync === key; })[0];
      if (u && u.room && cis.length > (rooms[u.room] || 99)) errors.push('同じ時間にそろえる授業：' +
        listText(cis.map(function (ci) { return classes[ci].label; })) + 'を' + poolName[u.room] + 'でそろえると、上限' +
        rooms[u.room] + 'クラスをこえます。');
    });

    // コマ数の過不足
    classes.forEach(function (c, ci) {
      var free = avail[ci].filter(Boolean).length;
      var need = classUnits[ci].filter(function (id) { return !units[id].manual; }).length + manualCount[ci];
      if (need > free) errors.push(c.label + '：授業が週' + need + 'コマあるのに、使えるコマは' + free +
        'コマです（' + (need - free) + 'コマ入りません）。');
    });

    return { A: A, D: D, MP: MP, S: S, classes: classes, classIndex: classIndex, avail: avail,
      fixedLabel: fixedLabel, satFree: satFree, units: units, pins: allPins(A, classes), classUnits: classUnits, syncMembers: syncMembers,
      teachers: teachers, prefs: prefs, rooms: rooms, poolName: poolName, poolRooms: poolRooms, poolGradeCap: poolGradeCap, phys: phys,
      maxPerDay: maxPerDay, subjName: subjName, manualList: manualList,
      rules: A.rules || {}, errors: errors, notes: uniq(notes) };
  }

  /* ---------- 評価（点数が小さいほどよい時間割） ---------- */
  function weights(M, level) {
    var r = M.rules;
    var w = { hard: 100, pref: 8, daily: r.dailyMax ? 20 : 0, pair: r.pairs ? 40 : 0,
      spread: r.spread ? 3 : 0, active: r.active ? 4 : 0, group: 6, chain: 3 };
    if (level >= 1) w.pref = 1;               // 希望をゆるめる
    if (level >= 2) { w.daily = Math.min(w.daily, 3); w.pair = Math.min(w.pair, 3); w.spread = Math.min(w.spread, 1); w.active = Math.min(w.active, 1); w.group = 1; w.chain = 1; } // 組み方のルールもゆるめる
    return w;
  }

  function newState(M) {
    var grid = M.classes.map(function () { var a = []; for (var s = 0; s < M.S; s++) a.push(-1); return a; });
    var pos = M.units.map(function () { return -1; });
    return { grid: grid, pos: pos };
  }

  function roomOf(M, u, s) { return u.roomByDay ? u.roomByDay[Math.floor(s / M.MP)] : u.room; }

  function evalSlot(M, st, s, W, out) {
    var cost = 0;
    var tk = {}, rc = {};
    for (var c = 0; c < M.classes.length; c++) {
      var id = st.grid[c][s];
      if (id < 0) continue;
      var u = M.units[id];
      var key = u.sync || ('u' + id);
      for (var i = 0; i < u.teachers.length; i++) {
        var t = u.teachers[i];
        if (!tk[t]) tk[t] = {};

    for (var t in tk) {

  // 2時間続きは 1・2、3・4、5・6時間目の組み合わせだけ（2・3などは続きにしない）

  // 同じ学年の授業を、できるだけ同じ曜日にまとめる（先生ごと）

      G.days[Math.floor(s / M.MP)] = 1;
      G.per[u.cls] = (G.per[u.cls] || 0) + 1;
      if (T.chain) (byDay[Math.floor(s / M.MP)] = byDay[Math.floor(s / M.MP)] || {})[s % M.MP] = g;

            ps.map(function (p) { return (p + 1) + '時間目' + byDay[dd][p] + '年'; }).join('・') + '）。' });

          Object.keys(G.days).sort().map(function (d) { return M.A.days[d]; }).join('・') + '）に分かれています（できれば' + ideal + 'つ）。' });

  function evalClass(M, st, c, W, out) {

          if (out) out.push({ level: 'hard', kind: 'daily', cls: c, subj: sj, d: d, text: lab + ' ' + M.subjName[sj] + '：' +
            M.A.days[d] + '曜日に' + Math.ceil(perDay[d][sj]) + '回入っています（1日' + M.maxPerDay[sj] + '回まで）。' });

          ds.map(function (x) { return M.A.days[x]; }).join('・') + '）。' });

  function Solver(M, seed) {

  // 2つのコマを入れかえてみて、よくなれば（または温度しだいで）採用する

      var u = M.units[id], s = st.pos[id];

      var ids = u.sync ? M.syncMembers[u.sync].map(function (ci) { return st.grid[ci][s]; }) : [id];
      ids.forEach(function (x) { if (x >= 0) { st.grid[M.units[x].cls][s] = -1; st.pos[x] = -1; removed.push(x); } });

          if (id >= 0 && unitBad(M, M.units[id], s)) { unplace(id); found = true; break; }
          // 1日の上限をこえている
          if (id >= 0 && M.rules.dailyMax && dailyOver(M, st, c, id)) { unplace(id); found = true; break; }

        }

      var u = M.units[id];
      // 必ず2時間続きは、2コマそろって入る場所をさがす

        var v = M.units[u.pair], bestP = -1, bestPC = Infinity;

  // 全体の流れ。onProgress(割合, メッセージ) を途中で呼ぶ。done(結果) で終わる。
  // 全部入らなかったときは、別の組み方で最大 TRIES 回まで試し、いちばんよいものを返す。
  function solve(A, opts) {
    opts = opts || {};

    var seed0 = opts.seed || (Date.now() % 2147483647) || 1;
    var best = null, attempt = 0;
    function score(res) { return res.unplaced.length * 1000 + res.hard.length * 1000 + res.soft.length; }
    function once(done) {
      var M = buildModel(A);
      var sv = new Solver(M, (seed0 + attempt * 7919) % 2147483647 || 1);
      var nUnits = M.units.length || 1;
      var base = Math.max(60000, Math.min(400000, nUnits * 600));
      var plan = [
        { level: 0, iters: base, msg: 'すべての条件を守って組んでいます' },
        { level: 1, iters: Math.floor(base / 2), msg: '希望をゆるめて組み直しています' },
        { level: 2, iters: Math.floor(base / 2), msg: '組み方のルールもゆるめて組み直しています' }

      function progress() {

        return Math.min(0.99, (attempt + Math.min(1, (doneIters + it) / totalIters)) / TRIES);
      }
      function run() {
        while (true) {
          var P = plan[phase];
          var end = Math.min(P.iters, it + chunk);
          for (; it < end; it++) sv.step(temp(it / P.iters));
          if (opts.onProgress) opts.onProgress(progress(), (attempt ? '別の組み方で試しています（' + (attempt + 1) + '回目）：' : '') + P.msg);
          if (it < P.iters) { if (opts.async) return setTimeout(run, 0); continue; }
          if (sv.hardCount() === 0 || phase === plan.length - 1) break;
          phase++; it = 0; relaxed = phase;
          sv.setLevel(plan[phase].level);
        }
        if (sv.hardCount() > 0) sv.removeConflicts();
        sv.setLevel(0);
        return done(makeResult(M, sv.st, relaxed));
      }
      return run();
    }
    function next(res) {
      if (!best || score(res) < score(best)) best = res;
      attempt++;
      var perfect = !best.unplaced.length && !best.hard.length;
      if (perfect || attempt >= TRIES) {
        best.attempts = attempt;
        if (opts.done) opts.done(best);
        return best;
      }
      return once(next);
    }
    return once(next);
  }

  /* ---------- 結果をまとめる ---------- */
  function report(M, st) {
    var W = weights(M, 0), out = [];
    for (var c = 0; c < M.classes.length; c++) evalClass(M, st, c, W, out);
    for (var s = 0; s < M.S; s++) evalSlot(M, st, s, W, out);
    for (var t = 0; t < M.teachers.length; t++) evalTeacher(M, st, t, W, out);
    return out;
  }

  function makeResult(M, st, relaxed) {
    var issues = report(M, st);
    var unplaced = [];
    M.units.forEach(function (u) { if (st.pos[u.id] < 0 && !u.manual) unplaced.push(u); });
    var agg = {};
    unplaced.forEach(function (u) {
      var k = M.classes[u.cls].label + '　' + u.display;
      agg[k] = (agg[k] || 0) + 1;
    });
    return {
      advice: diagnose(M, st, issues, unplaced),
      model: M, state: st, relaxed: relaxed,
      unplaced: Object.keys(agg).map(function (k) { return k + '　' + agg[k] + 'コマ'; }),
      hard: issues.filter(function (x) { return x.level === 'hard'; }).map(function (x) { return x.text; }),
      soft: issues.filter(function (x) { return x.level === 'soft'; }).map(function (x) { return x.text; }),
      errors: M.errors,
      notes: M.notes,
      manual: manualSummary(M),
      table: buildTable(M, st)
    };
  }

  // 担任が入れる分（学年ごと・教科ごと）。クラスで時数がちがうときは「週3〜4コマ」
  function manualSummary(M) {
    var by = {}, order = [];
    M.units.forEach(function (u) {
      if (!u.manual && !u.placeholder) return;
      var k = M.classes[u.cls].grade + '年 ' + u.display;
      if (!by[k]) { by[k] = {}; order.push(k); }
      by[k][u.cls] = (by[k][u.cls] || 0) + 1;
    });
    return order.map(function (k) {
      var g = +k.charAt(0);
      var ns = M.classes.map(function (c, ci) { return c.grade === g ? (by[k][ci] || 0) : null; }).filter(function (x) { return x !== null; });
      var lo = Math.min.apply(null, ns), hi = Math.max.apply(null, ns);

  }

  function countIn(M, key) {
    var g = +key.charAt(0);
    return M.classes.filter(function (c) { return c.grade === g; }).length || 1;
  }

  /* ---------- 守れなかった理由と直し方 ---------- */
  function diagnose(M, st, issues, unplaced) {
    var A = M.A, groups = {}, order = [];
    function add(key, title, reason, fixes, item) {
      if (!groups[key]) { groups[key] = { title: title, reason: reason, fixes: fixes, items: [] }; order.push(key); }
      if (item && groups[key].items.indexOf(item) < 0) groups[key].items.push(item);
    }
    function dayName(d) { return A.days[d] + '曜'; }
    function subjOf(id) { return subjectById(A, id) || { name: M.subjName[id] || id, maxPerDay: 1 }; }
    // そのクラスで、授業を入れられる曜日の数
    function usableDays(ci) {
      var n = 0;

    }
    function classHours(ci, sj) { return M.classUnits[ci].filter(function (id) { return M.units[id].subj === sj; }).length; }
    // 必ず守る条件だけで、その授業を入れられる時間
    function candidates(u, test) {

    }
    var RETRY = '「もう一度組む」を押すと、別の組み方を試します。';

    // その授業を入れられる時間をしぼっている条件
    function causesFor(u) {
      var g = M.classes[u.cls].grade;
        var causes = [], fixes = [];
        u.teachers.forEach(function (t) {
          var T = M.teachers[t];
          var byOff = candidates(u, function (M2, uu, s) { return T.off[s]; });
          var byDay = candidates(u, function (M2, uu, s) { var ok = T.dayOk[g]; return ok && !ok[Math.floor(s / M.MP)]; });
          if (byOff.length < M.S / 2) { causes.push(T.name + 'の勤務'); fixes.push('質問「講師などの勤務」で、' + T.name + 'の勤務できる時間を増やす'); }
          if (T.dayOk[g]) { causes.push(T.name + 'の' + g + '年の曜日の指定（' + A.days.filter(function (x, d) { return T.dayOk[g][d]; }).join('・') + '）'); fixes.push('質問「専科・講師の曜日」で、' + T.name + 'の' + g + '年の曜日を増やす'); }
        });
        u.prefs.forEach(function (pi) {
          var p = M.prefs[pi];
          if (p.strict) { causes.push('絶対に守る希望「' + p.text + '」'); fixes.push('質問「教科の希望」で「' + p.text + '」を「できれば守る」にするか、時間を広げる'); }
        });

    }
    // 同じクラスで、同じ条件がかかる授業（同じ教科・同じ先生・同じ希望）
    function sameKind(u) {
      return M.classUnits[u.cls].map(function (id) { return M.units[id]; }).filter(function (v) {
        return v.subj === u.subj && v.variant === u.variant && v.teachers.join() === u.teachers.join() && v.prefs.join() === u.prefs.join();
      });
    }
    // 「先に決まっている時間」に教科の名前が自由に書かれていたら、教科として選び直すよう案内する
    function fixedAsSubject(g) {
      var names = {};
      A.subjects.forEach(function (sj) { names[sj.name] = sj.name; names[sj.display || sj.name] = sj.name; });
      A.variants.forEach(function (v) { names[v.display || v.name] = v.name; });
      var ABBR = { '学活': '学級活動', '総合': '総合的な学習の時間', '道': '道徳', '外活': '外国語活動' };
      var out = [];
      (A.fixed || []).forEach(function (f) {
        if (f.target || (f.grades || []).indexOf(g) < 0) return;
        var hit = names[f.label] || ABBR[f.label];
        if (hit) out.push('質問「先に決まっている時間」の「' + f.label + '」（' + A.days[f.day] + f.period + '）は、内容を「教科」にして「' + hit + '」を選ぶ（その教科の時数に数えます）');

    }
    var overflow = {};
    M.classes.forEach(function (c, ci) {

    });

    // 入らなかったコマ
    unplaced.forEach(function (u) {
      var c = M.classes[u.cls], g = c.grade, item = c.label + ' ' + unitName(u);
      if (overflow[u.cls]) {
        var ov = overflow[u.cls];
        add('overflow:' + g, g + '年：授業のコマ数が、使えるコマより多いです',
          '授業が週' + ov.need + 'コマあるのに、1日のコマ数から先に決まっている時間を引くと、使えるコマは' + ov.free + 'コマです（' + (ov.need - ov.free) + 'コマ入りません）。',
          fixedAsSubject(g).concat(['質問「教科の週の時数」で時数を減らす', '質問「1日のコマ数」でコマ数を増やす', '質問「先に決まっている時間」を見直す']), c.label);

      cand.forEach(function (s) { cdays[Math.floor(s / M.MP)] = 1; });
      var cdn = Object.keys(cdays).length, mx = M.maxPerDay[u.subj];
      var sameSubj = M.classUnits[u.cls].filter(function (id) { return M.units[id].subj === u.subj; }).length;
      if (M.rules.dailyMax && cdn * mx < sameSubj) {
        var cf3 = causesFor(u);
        add('daymax:' + u.subj + cf3.causes.join(), unitName(u) + '：1日の上限では入りきりません',
          (cf3.causes.length ? cf3.causes.join('と、') + 'で、' : '') + unitName(u) + 'を入れられる曜日は' + Object.keys(cdays).map(function (d) { return A.days[d]; }).join('・') +
          'の' + cdn + '日だけです。1日' + mx + '回までだと' + (cdn * mx) + 'コマしか入りませんが、週' + sameSubj + 'コマあります。',
          cf3.fixes.concat(['質問「組み方のルール」で、' + M.subjName[u.subj] + 'の1日の上限を見直す']), item);
        return;
      }
      if (u.pairHard) {
        var blocks = 0;
        for (var s = 0; s + 1 < M.S; s++) if (s % M.MP % 2 === 0 && M.avail[u.cls][s] && M.avail[u.cls][s + 1] && (s + 1) % M.MP) blocks++;
        var need = M.classUnits[u.cls].filter(function (id) { return M.units[id].pairHard && M.units[id].pair > id; }).length;
        if (blocks - need < 2) {
          add('blocks:' + u.cls, '2時間続きを入れる場所が足りません', c.label + 'は、1・2／3・4／5・6時間目がそろって空いているところが' + blocks + 'か所しかなく、2時間続きが' + need + '組あります（先に決まっている時間や、5時間の日で区切られています）。',
            ['質問「先に決まっている時間」を、2時間続きを区切らない時間に動かす', '2時間続きにする教科を減らす（質問「組み方のルール」）'], item);

      var dayFull = u.teachers.filter(function (t) {
        var T = M.teachers[t], ok = T.dayOk[g];
        if (!ok) return false;
        var n = T.units.filter(function (id) { return M.classes[M.units[id].cls].grade === g; }).length, k = 0;
        for (var s3 = 0; s3 < M.S; s3++) if (ok[Math.floor(s3 / M.MP)] && !T.off[s3]) k++;
        if (n < k - 1) return false;
        var dn = A.days.filter(function (x, d) { return ok[d]; }).join('・');
        add('dayfull:' + t + ':' + g, T.name + '：' + g + '年の授業が指定の曜日に' + (n > k ? '入りきりません' : 'ぎりぎりです'),
          T.name + 'の' + g + '年の授業は週' + n + 'コマありますが、指定の曜日（' + dn + '）に' + T.name + 'が授業できるのは' + k + 'コマ' +
          (n > k ? 'だけです。' : 'です。ほとんど空きがないため、クラスの時間割と合わない時間が出ました。'),

        return true;

      var busyT = u.teachers.filter(function (t) {

      if (busyT.length) {

          add('busyT:' + t, T.name + 'の時間がいっぱいです', T.name + 'の担当は週' + T.units.length + 'コマで、勤務できる' + can + 'コマのほとんどを使っています。クラスの授業や教室の都合と合う時間が残りませんでした。',
            ['質問「専科・講師の担当」で担当を減らす（ほかの先生や担任に回す）', '質問「講師などの勤務」で勤務を増やす', RETRY], item);
        });
        return;
      }
      // 教室が混んでいる
      var rk = u.room;
      if (rk) {
        var use = M.units.filter(function (x) { return x.room === rk && !x.manual; }).length, cap = M.rooms[rk];
        var slots = 0; for (var s2 = 0; s2 < M.S; s2++) if (M.classes.some(function (cc, ci) { return M.avail[ci][s2]; })) slots++;
        if (use >= slots * cap * 0.75) {

            ['質問「特別教室」で上限を上げる、または学年ごとの上限を見直す', '質問「教科の表示名と場所」で、この教室を使う学年を減らす', '質問「専科・講師の担当」の「曜日ごとの教室」で、普通教室の日を作る'], item);

        [RETRY, '「絶対に守る」にしている希望を「できれば守る」にする', '専科・講師の曜日の指定を減らす'], item);
    });

    issues.forEach(function (x) {
      var c = x.cls !== undefined ? M.classes[x.cls] : null;
      if (x.kind === 'daily') {

        // 必ず守る条件で、その教科を入れられる曜日
        var u0 = M.units[M.classUnits[x.cls].filter(function (id) { return M.units[id].subj === x.subj; })[0]];

        var cd = Object.keys(cdays).length;
        if (u0 && cd < ud && h > cd * mx) {
          var cf2 = causesFor(u0);
          add('daily-days:' + c.grade + x.subj + cf2.causes.join(), c.grade + '年の' + sj.name + '：入れられる曜日が少なすぎます',
            (cf2.causes.length ? cf2.causes.join('と、') + 'で、' : '') + sj.name + 'を入れられる曜日は' + Object.keys(cdays).map(function (d) { return A.days[d]; }).join('・') +
            'の' + cd + '日だけです。週' + h + 'コマを1日' + mx + '回までにすると、' + (cd * mx) + 'コマしか入りません。',
            cf2.fixes.concat(['質問「組み方のルール」で、' + sj.name + 'の1日の上限を' + Math.ceil(h / Math.max(1, cd)) + '回にする']), c.label);
        } else if (h > ud * mx) {
          add('daily-max:' + c.grade + x.subj, c.grade + '年の' + sj.name + '：1日の上限では入りきりません',
            sj.name + 'は週' + h + 'コマありますが、授業のある日は' + ud + '日なので、1日' + mx + '回までだと最大' + (ud * mx) + 'コマしか入りません。',
            ['質問「組み方のルール」で、' + sj.name + 'の1日の上限を' + Math.ceil(h / ud) + '回にする'], c.label);
        } else {
          add('daily:' + x.subj, sj.name + '：同じ日に上限より多く入りました',
            '週' + h + 'コマは1日' + mx + '回までで入る数ですが、専科・講師の曜日、希望、2時間続きなどと合わせると、ほかの日に入れられませんでした。',
            [RETRY, '質問「組み方のルール」で、' + sj.name + 'の1日の上限を' + (mx + 1) + '回にする', sj.name + 'にかかわる希望や曜日の指定を減らす'], c.label);
        }
      } else if (x.kind === 'pref') {
        var p = M.prefs[x.pi], ok = 0;
        for (var s = 0; s < M.S; s++) if (M.avail[x.cls][s] && (p.mode === 'avoid' ? !p.mask[s] : p.mask[s])) ok++;
        var n = M.classUnits[x.cls].filter(function (id) { return M.units[id].prefs.indexOf(x.pi) >= 0; }).length;
        if (n > ok) {
          add('pref-few:' + x.pi, '希望「' + p.text + '」：時間が足りません',
            'この希望に合う時間は' + ok + 'コマしかないのに、当てはまる授業が週' + n + 'コマあります。',
            ['質問「教科の希望」で、曜日や時間を広げる'], c.label);
        } else {
          add('pref:' + x.pi, '希望「' + p.text + '」を守れませんでした',
            '希望に合う時間はありますが、専科・講師の担当、教室の上限、そろえる授業など、必ず守る条件を優先しました。',
            [RETRY, 'どうしても守りたいときは、質問「教科の希望」で「絶対に守る」にする（ほかの授業が動きます）'], c.label);
        }
      } else if (x.kind === 'pair') {
        var sj2 = subjOf(x.subj);
        add('pair:' + x.subj, sj2.name + '：2時間続きになりませんでした',
          '「できれば2時間続き」の設定なので、ほかの条件を優先しました。',
          ['質問「組み方のルール」で、' + sj2.name + 'を「すべて2時間続き（必ず）」にする', RETRY], c.label);
      } else if (x.kind === 'spread') {
        var sj3 = subjOf(x.subj);
        add('spread:' + x.subj, sj3.name + '：曜日がかたよりました',
          '専科・講師の曜日や、ほかの授業との重なりで、間をあけて入れられませんでした。',
          [RETRY, '気にならなければ、そのままで大丈夫です'], c.label);
      } else if (x.kind === 'active') {
        add('active', '体育などの動きのある教科が続きました',
          '動きのある教科の時数が多く、1日の中で間をあけきれませんでした。',
          [RETRY, '質問「組み方のルール」で、動きのある教科のチェックを見直す'], c.label + ' ' + dayName(x.d));
      } else if (x.kind === 'group') {
        var T = M.teachers[x.t];
        add('group:' + x.t, T.name + '：同じ学年の授業を同じ曜日にまとめきれませんでした',
          x.g + '年の授業が' + x.n + 'つの曜日に分かれました（できれば' + x.ideal + 'つ）。同じ曜日にすると、クラスの時間割や教室と合わない時間がありました。',
          [RETRY, '質問「専科・講師の曜日」で、学年ごとに曜日を決める（例：' + x.g + '年は月・木）'], x.g + '年');
      } else if (x.kind === 'chain') {
        var T2 = M.teachers[x.t];
        add('chain:' + x.t, T2.name + '：同じ学年の授業を続けきれませんでした',
          '同じ日に同じ学年の授業を続けようとしましたが、クラスの時間割（ほかの専科や講師の時間、1日の上限など）と合わない時間がありました。',
          [RETRY, '質問「専科・講師の曜日」で、学年ごとに曜日を決めると続けやすくなります'], dayName(x.d));
      } else if (x.level === 'hard') {
        add('hard:' + x.kind, '必ず守る条件を守れませんでした', x.text, [RETRY], '');
      }
    });
    return order.map(function (k) { return groups[k]; });
  }

  // スプレッドシートに書き出す表
  function buildTable(M, st) {
    var A = M.A;
    var classRows = M.classes.map(function (c, ci) {
      var cells = [];
      for (var s = 0; s < M.S; s++) {
        var d = Math.floor(s / M.MP), p = s % M.MP + 1;
        var inDay = p <= (+(A.periods[c.grade] || [])[d] || 0);
        if (M.fixedLabel[ci][s]) cells.push({ t: M.fixedLabel[ci][s], k: 'fixed' });
        else if (M.satFree[ci][s]) cells.push({ t: '', k: 'sat' });
        else if (!inDay) cells.push({ t: '', k: 'none' });
        else if (st.grid[ci][s] >= 0 && M.units[st.grid[ci][s]].placeholder) cells.push({ t: '', k: 'empty' });
        else if (st.grid[ci][s] >= 0) cells.push({ t: M.units[st.grid[ci][s]].display, k: 'lesson' });
        else cells.push({ t: '', k: 'empty' });
      }
      return { label: c.short, full: c.label, grade: c.grade, cells: cells };
    });
    // 曜日ごとの列の数（その曜日にいちばん多い時間数）
    var dayPeriods = A.days.map(function (d, di) {
      return M.classes.reduce(function (mx, c) { return Math.max(mx, Math.min(M.MP, +(A.periods[c.grade] || [])[di] || 0)); }, 0);
    });
    function occupancy(filter) {
      var cells = [];
      for (var s = 0; s < M.S; s++) {
        var names = [];
        for (var ci = 0; ci < M.classes.length; ci++) {
          var id = st.grid[ci][s];
          if (id >= 0 && filter(M.units[id])) names.push(ci);
        }
        cells.push(compactNames(M, names));
      }
      return cells;
    }
    var teacherRows = M.teachers.map(function (t, ti) {
      if (t.homeroom !== undefined && !t.away) return null; // 自分のクラスだけを教える担任は出さない
      var cells = occupancy(function (u) { return u.teachers.indexOf(ti) >= 0 && (t.homeroom === undefined || u.cls !== t.homeroom); });
      if (t.homeroom !== undefined) {
        var nAway = 0;
        t.units.forEach(function (id) { if (st.pos[id] >= 0 && M.units[id].cls !== t.homeroom) nAway++; });
        return { label: t.name, title: t.name + '（' + Object.keys(t.subs).join('・') + '）週' + nAway + '時間', cells: cells, off: t.off.slice() };
      }
      // 見出しは「名前（担当する教科）」
      var subs = [];
      ((A.teachers[ti] || {}).jobs || []).forEach(function (j) {
        var n = targetName(A, j.target);
        if (subs.indexOf(n) < 0 && t.name.indexOf(n) < 0) subs.push(n);
      });
      var keys = {};
      t.units.forEach(function (id) { if (st.pos[id] >= 0) keys[M.units[id].sync || id] = 1; });
      var n = Object.keys(keys).length;
      return { label: t.name, title: t.name + (subs.length ? '（' + subs.join('・') + '）' : '') + (n ? '週' + n + '時間' : ''), cells: cells, off: t.off.slice() };
    }).filter(Boolean);
    var roomRows = roomRowsOf(M, st);
    var mslots = moduleSlots(A.module), mdays = Object.keys(mslots).filter(function (d) { return mslots[d] && mslots[d].kind && mslots[d].kind !== 'none'; }).map(Number).sort();
    var mod = mdays.length ? A.module : null, mlabels = {};
    mdays.forEach(function (d) {
      var x = mslots[d], sj = x.kind === 'subject' ? (subjectById(A, x.target) || {}) : {};
      mlabels[d] = (x.label || '').trim() || (x.kind === 'subject' ? (sj.display || sj.name || '') : (x.text || '').trim()) || 'モジュール';
    });
    return { title: (A.name ? A.name + '　' : '') + '時間割一覧', days: A.days.slice(), maxPeriods: M.MP, dayPeriods: dayPeriods,
      module: mod ? { days: mdays, grades: (mod.grades || []).slice(), labels: mlabels } : null,
      classRows: classRows, teacherRows: teacherRows, roomRows: roomRows, free: freeTable(M, st) };
  }

  // 特別教室の行（1部屋ずつ）。同じ種類の部屋が2つ以上あるときは、前の部屋から順に割りふる
  function roomRowsOf(M, st) {
    var rows = M.phys.map(function (r) {
      var gs = r.grades.length ? '（' + r.grades.join('・') + '年）' : '';
      return { label: r.label + gs, cells: [] };
    });
    for (var s = 0; s < M.S; s++) {
      var inRoom = M.phys.map(function () { return []; });
      Object.keys(M.poolRooms).forEach(function (key) {
        var idx = M.poolRooms[key];
        for (var ci = 0; ci < M.classes.length; ci++) {
          var id = st.grid[ci][s];
          if (id < 0 || roomOf(M, M.units[id], s) !== key) continue;
          var k = 0;
          while (k < idx.length - 1 && inRoom[idx[k]].length >= M.phys[idx[k]].cap) k++;
          inRoom[idx[k]].push(ci);
        }
      });
      rows.forEach(function (r, i) { r.cells.push(compactNames(M, inRoom[i])); });
    }
    return rows;
  }

  // 同じ学年の2クラス以上は「5梅月」のように短く書く（クラス名が1文字のとき）
  function compactNames(M, cis) {
    var groups = [], by = {};
    cis.forEach(function (ci) {
      var c = M.classes[ci];
      if (!by[c.grade]) { by[c.grade] = []; groups.push(c.grade); }
      by[c.grade].push(c);
    });
    return groups.map(function (g) {
      var list = by[g];
      var tails = list.map(function (c) { return c.short.slice(String(g).length); });
      var single = list.length > 1 && tails.every(function (t) { return t.length === 1 && !/[0-9０-９\-]/.test(t); });
      return single ? g + tails.join('') : list.map(function (c) { return c.short; }).join('・');
    }).join('・');
  }

  /* ---------- 補教表（補教用の空き時間一覧） ---------- */
  // 補教表に入れるか：専科はいつも、講師・少人数・TT・その他は種類ごと（A.subsKinds）、先生ごと（subsMode）に変えられる
  function inSubs(A, t) {
    if (t.subsMode === 'in') return true;
    if (t.subsMode === 'out') return false;
    if (t.kind === '専科') return true;
    var k = A.subsKinds || {};
    return k[t.kind] !== false;
  }
  // who(ci, s)：そのクラスのその時間に教えている先生（省略時は授業の担当から）
  function freeTable(M, st, who) {
    who = who || function (ci, s) { var id = st.grid[ci][s]; return id >= 0 ? M.units[id].teachers : []; };
    var A = M.A, MP = M.MP, src = A.teachers || [];
    var kindOf = function (ti) { return ti < src.length ? src[ti].kind : '担任'; };
    // 授業のある曜日・時間（土曜日を数えない設定のときは、土曜日は出さない）
    var schoolTime = [];
    for (var s = 0; s < M.S; s++) schoolTime.push(M.classes.some(function (c, ci) { return M.avail[ci][s]; }));
    var days = [], maxP = 0;
    for (var d = 0; d < M.D; d++) {
      var any = false;
      for (var p = 0; p < MP; p++) if (schoolTime[d * MP + p]) { any = true; maxP = Math.max(maxP, p + 1); }
      if (any) days.push(d);
    }
    // その時間に教えている先生
    function teachingAt(s) {
      var busy = {};
      M.classes.forEach(function (c, ci) {
        who(ci, s).forEach(function (t) { busy[t] = 1; });
      });
      return busy;
    }
    var hrOf = {};
    M.teachers.forEach(function (T, ti) { if (T.homeroom !== undefined) hrOf[T.homeroom] = ti; });
    var cells = {};
    days.forEach(function (d) {
      for (var p = 0; p < maxP; p++) {
        var s = d * MP + p, names = [];
        if (!schoolTime[s]) { cells[s] = null; continue; }
        var busy = teachingAt(s);
        // 専科
        src.forEach(function (t, ti) {
          if (t.kind === '専科' && inSubs(A, t) && !M.teachers[ti].off[s] && !busy[ti]) names.push(M.teachers[ti].name);
        });
        // 担任：自分のクラスに専科・講師（またはほかの担任）が入っていて、自分はどこでも教えていない
        M.classes.forEach(function (c, ci) {
          if (!M.avail[ci][s]) return;                   // 先に決まっている時間・授業のない時間
          var hr = hrOf[ci];
          if (hr !== undefined && busy[hr]) return;      // 教科担任制で、ほかのクラスに教えに行っている
          var id = st.grid[ci][s];
          if (id < 0) return;                            // 担任が入れる教科の空きマス
          var u = M.units[id], ts = who(ci, s);
          if (u.placeholder || !ts.length) return;
          if (hr !== undefined && ts.indexOf(hr) >= 0) return;
          var withHr = ts.some(function (t) { var k = kindOf(t); return k === '少人数' || k === 'TT'; });
          if (withHr) return;                            // 少人数・TTは担任もクラスにいる
          names.push(c.short + '担任');
        });
        // 講師・少人数・TT・その他
        src.forEach(function (t, ti) {
          if (t.kind !== '専科' && inSubs(A, t) && !M.teachers[ti].off[s] && !busy[ti]) names.push(M.teachers[ti].name);
        });
        cells[s] = names;
      }
    });
    return { days: days, maxP: maxP, cells: cells };
  }

  /* ---------- スプレッドシートで手直ししたあとのチェック ---------- */
  function splitNames(t) {
    return String(t || '').split(/[・,、，\s\/]+/).map(function (x) { return x.trim(); }).filter(Boolean);
  }
  // 「5梅月」→「5梅」「5月」にもどす
  function expandNames(t, byShort) {
    var out = [];
    splitNames(t).forEach(function (n) {
      if (byShort[n] !== undefined) return out.push(n);
      var m = /^([0-9])(.+)$/.exec(n);
      if (m && m[2].split('').every(function (ch) { return byShort[m[1] + ch] !== undefined; })) {
        m[2].split('').forEach(function (ch) { out.push(m[1] + ch); });
      } else out.push(n);
    });
    return out;
  }

  function check(A, sheet) {
    var M = buildModel(A, { includeManual: true });
    var st = newState(M);
    var must = [], better = [];
    var byLabel = {}, byShort = {};
    M.classes.forEach(function (c, ci) { byLabel[c.label] = ci; byLabel[c.short] = ci; byShort[c.short] = ci; });

    // 表示名 → 教科
    var dispMap = {};
    M.units.forEach(function (u) {
      if (!dispMap[u.display]) dispMap[u.display] = { subj: u.subj, variant: u.variant };
    });
    var seenRow = {};
    (sheet.classRows || []).forEach(function (row) {
      var ci = byLabel[String(row.label).trim()];
      if (ci === undefined) { if (String(row.label).trim()) must.push('「' + row.label + '」というクラスは、答えの中にありません。'); return; }
      seenRow[ci] = true;
      var c = M.classes[ci];
      var used = {};
      var extra = {};
      for (var s = 0; s < M.S; s++) {
        var t = String(row.cells[s] == null ? '' : row.cells[s]).trim();
        var fx = M.fixedLabel[ci][s];
        if (fx) {
          if (t !== fx) must.push(c.label + ' ' + slotName(A, s) + '：先に決まっている「' + fx + '」が「' + (t || '空き') + '」になっています。');
          continue;
        }
        if (!t || M.satFree[ci][s]) continue;
        if (!M.avail[ci][s]) { must.push(c.label + ' ' + slotName(A, s) + '：授業のない時間に「' + t + '」が入っています。'); continue; }
        var dm = dispMap[t];
        if (!dm) { must.push(c.label + ' ' + slotName(A, s) + '：「' + t + '」は教科の表示名にありません。'); continue; }
        var id = M.classUnits[ci].filter(function (x) {
          var u = M.units[x];
          return !used[x] && u.display === t;
        })[0];
        if (id === undefined) { extra[t] = (extra[t] || 0) + 1; continue; }
        used[id] = true;
        place(st, ci, s, id);
      }
      var lack = {}, lackManual = {};
      M.classUnits[ci].forEach(function (x) {
        if (used[x]) return;
        var L = M.units[x].manual ? lackManual : lack;
        L[M.units[x].display] = (L[M.units[x].display] || 0) + 1;
      });
      Object.keys(lack).forEach(function (k) { must.push(c.label + ' ' + k + '：' + lack[k] + 'コマ足りません。'); });
      Object.keys(lackManual).forEach(function (k) { better.push(c.label + ' ' + k + '：担任が入れる教科が、まだ' + lackManual[k] + 'コマ入っていません。'); });
      Object.keys(extra).forEach(function (k) { must.push(c.label + ' ' + k + '：' + extra[k] + 'コマ多いです。'); });
    });
    M.classes.forEach(function (c, ci) { if (!seenRow[ci]) must.push(c.label + 'の行が見つかりません。'); });

    // 先生は下の表を見てチェックするので、ここでは外す
    M.units.forEach(function (u) { u.teachers = []; delete u.pin; });
    // 授業の固定は、表のその時間にその授業が入っているかで確かめる
    M.pins.forEach(function (pn) {
      var ci = M.classIndex[pn.cls];
      if (ci === undefined || !pn.target) return;
      var s = (+pn.day) * M.MP + (+pn.period - 1), id = st.grid[ci][s];
      var ok = id >= 0 && (M.units[id].subj === pn.target || M.units[id].variant === pn.target);
      if (!ok) must.push(M.classes[ci].label + '：' + slotName(A, s) + 'に固定した' + targetName(A, pn.target) + 'が入っていません。');
    });
    // 2時間続きの組み合わせを、表で隣り合っているものから数え直す
    M.classes.forEach(function (c, ci) {
      var groups = {}, pairs = {};
      M.classUnits[ci].forEach(function (x) {
        var u = M.units[x];
        if (u.pair >= 0) pairs[u.subj] = (pairs[u.subj] || 0) + 0.5;
      });
      M.classUnits[ci].forEach(function (x) {
        var u = M.units[x];
        if (pairs[u.subj] && !u.variant) { (groups[u.subj] = groups[u.subj] || []).push(u); u.pair = -1; }
      });
      Object.keys(groups).forEach(function (sj) {
        var list = groups[sj], np = pairs[sj], made = 0;
        var at = {};
        list.forEach(function (u) { if (st.pos[u.id] >= 0) at[st.pos[u.id]] = u; });
        for (var s = 0; s + 1 < M.S && made < np; s++) {
          var a = at[s], b = at[s + 1];
          if (a && b && a.pair < 0 && b.pair < 0 && isPairSlots(M.MP, s, s + 1)) { a.pair = b.id; b.pair = a.id; made++; }
        }
        var rest = list.filter(function (u) { return u.pair < 0; });
        for (var k = 0; made < np && k + 1 < rest.length; k += 2, made++) { rest[k].pair = rest[k + 1].id; rest[k + 1].pair = rest[k].id; }
      });
    });
    // そろえる授業
    Object.keys(M.syncMembers).forEach(function (key) {
      var cis = M.syncMembers[key];
      var slots = cis.map(function (ci) {
        var id = M.classUnits[ci].filter(function (x) { return M.units[x].sync === key; })[0];
        return id === undefined ? -1 : st.pos[id];
      });
      // 同じ教科のコマのうち、どれかがそろっていればよい
      var ok = false;
      for (var s = 0; s < M.S && !ok; s++) {
        ok = cis.every(function (ci) {
          var id = st.grid[ci][s];
          return id >= 0 && M.units[id].subj === M.units[M.classUnits[ci].filter(function (x) { return M.units[x].sync === key; })[0]].subj;
        });
      }
      if (!ok && slots.length) must.push('同じ時間にそろえる授業：' + listText(cis.map(function (ci) { return M.classes[ci].label; })) + 'の' +
        targetName(A, A.syncs[+key.split(':')[0]].target) + 'がそろっていません。');
    });
    var W = weights(M, 0), out = [];
    for (var c = 0; c < M.classes.length; c++) evalClass(M, st, c, W, out);
    for (var s = 0; s < M.S; s++) evalSlot(M, st, s, W, out);
    out.forEach(function (x) { (x.level === 'hard' ? must : better).push(x.text); });

    // 専科・講師（下の表）
    var tByName = {}, rowWho = {};
    M.teachers.forEach(function (t, ti) { tByName[t.name] = ti; });
    (sheet.teacherRows || []).forEach(function (row) {
      var ti = tByName[String(row.label).trim()];
      if (ti === undefined) return;
      var T = M.teachers[ti], count = {};
      for (var s = 0; s < M.S; s++) {
        var names = expandNames(row.cells[s], byShort);
        if (!names.length) continue;
        var cis = names.map(function (n) { return byShort[n]; });
        rowWho[s] = rowWho[s] || {};

var drafts = {};
function draftOf(t) {
  if (!drafts[t.id]) drafts[t.id] = { cls: '', grades: [], target: A.subjects.length ? A.subjects[0].id : '', hours: 'all' };
  return drafts[t.id];
}
// 選んだだけで「追加」を押していない担当を追加する。追加した数を返す
function commitDrafts() {
  var n = 0;
  (A ? A.teachers : []).forEach(function (t) {
    var dr = drafts[t.id];
    if (!dr || !dr.target || (!dr.cls && !dr.grades.length)) return;
    var keys = dr.cls ? [dr.cls] : allClasses().filter(function (c) { return dr.grades.indexOf(c.grade) >= 0; }).map(function (c) { return c.key; });
    keys.forEach(function (k) { t.jobs.push({ cls: k, target: dr.target, hours: dr.hours }); n++; });
    delete drafts[t.id];
  });
  if (n) toast('選んでいた担当を追加しました');
  return n;
}

function fitClass(t) { var n = String(t == null ? '' : t).length; return n <= 2 ? '' : n === 3 ? ' f3' : n <= 8 ? ' f4' : ' f9'; }
function cellDiv(t) { return '<div class="c' + fitClass(t) + '">' + esc(t) + '</div>'; }

// 補教表：左に時間、上に曜日、マスに空いている先生の名前
function freeTableHtml(t) {

  var h = '<table class="ft"><tr><th></th>' + f.days.map(function (d) { return '<th>' + esc(t.days[d]) + '</th>'; }).join('') + '</tr>';
  for (var p = 0; p < f.maxP; p++) {

      var c = f.cells[d * t.maxPeriods + p];
      return c === null || c === undefined ? '<td class="no"></td>' : '<td>' + c.map(function (n) { return '<span class="fn">' + esc(n) + '</span>'; }).join(' ') + '</td>';
    }).join('') + '</tr>';

// スプレッドシートと同じ形のプレビュー
function previewTable(t, editable) {
  var ed = function (attrs) { return editable ? ' contenteditable="true" spellcheck="false" ' + attrs : ''; };
  var MP = t.maxPeriods, D = t.days.length;
  var dayP = t.dayPeriods || t.days.map(function () { return MP; });
  var maxP = Math.max.apply(null, dayP.concat([1]));
  var mod = t.module, hasM = function (di) { return !!mod && dayP[di] > 0 && mod.days.indexOf(di) >= 0; };
  var h = '<table class="pv"><tr><th rowspan="2">' + cellDiv('') + '</th>';
  t.days.forEach(function (d, di) { if (dayP[di]) h += '<th class="day" colspan="' + (dayP[di] + (hasM(di) ? 1 : 0)) + '">' + esc(d) + '</th>'; });
  h += '</tr><tr>';
  t.days.forEach(function (d, di) {
    if (hasM(di)) h += '<th class="day">' + cellDiv('朝') + '</th>';
    for (var p = 0; p < dayP[di]; p++) h += '<th' + (p === 0 && !hasM(di) ? ' class="day"' : '') + '>' + cellDiv(p + 1) + '</th>';
  });
  h += '</tr>';
  t.classRows.forEach(function (r, ri) {
    h += '<tr><th>' + cellDiv(r.label) + '</th>';
    t.days.forEach(function (d, di) {
      if (hasM(di)) h += '<td class="mo dl">' + cellDiv(mod.grades.indexOf(r.grade) >= 0 ? mod.labels[di] : '') + '</td>';
      for (var p = 0; p < dayP[di]; p++) {
        var c = r.cells[di * MP + p];
        var k = c.k === 'fixed' ? 'fx' : c.k === 'none' ? 'no' : c.k === 'empty' ? 'em' : c.k === 'sat' ? 'sa' : '';
        var canEdit = editable && c.k !== 'none';
        h += '<td class="' + k + (p === 0 && !hasM(di) ? ' dl' : '') + '">' +
          (canEdit ? '<div class="c' + fitClass(c.t) + '"' + ed('data-ed="c" data-r="' + ri + '" data-s="' + (di * MP + p) + '"') + '>' + esc(c.t) + '</div>' : cellDiv(c.t)) + '</td>';
      }
    });
    h += '</tr>';
  });
  h += '</table>';

  // 下：先生・特別教室ごとの小さな表を、左から詰めて並べる
  var blocks = t.teacherRows.map(function (r, i) { return { title: r.title || r.label, cells: r.cells, off: r.off, ed: 't', i: i }; })
    .concat(t.roomRows.map(function (r, i) { return { title: r.label, cells: r.cells, ed: '', i: i }; }).filter(function (b) { return b.cells.some(function (c) { return c; }); }));
  h += '<div class="blocks">' + blocks.map(function (b) {
    var x = '<div class="blk"><div class="blk-t">' + esc(b.title) + '</div><table class="pv"><tr><th>' + cellDiv('') + '</th>' +
      t.days.map(function (d) { return '<th>' + cellDiv(d) + '</th>'; }).join('') + '</tr>';
    for (var p = 0; p < maxP; p++) {
      x += '<tr><th>' + cellDiv(p + 1) + '</th>';
      for (var di = 0; di < D; di++) {
        var sIdx = di * MP + p, k = p >= dayP[di] ? 'no' : (b.off && b.off[sIdx]) ? 'fx' : '';
        var v = b.cells[sIdx] || '';
        x += '<td class="' + k + '">' + (editable && b.ed && k !== 'no' ? '<div class="c' + fitClass(v) + '"' + ed('data-ed="t" data-r="' + b.i + '" data-s="' + sIdx + '"') + '>' + esc(v) + '</div>' : cellDiv(v)) + '</td>';
      }
      x += '</tr>';
    }
    return x + '</table></div>';
  }).join('') + '</div>';
  return h;
}

  if (!k || !A || el.tagName !== 'INPUT' || (el.type !== 'text' && el.type !== 'number')) return;

});
document.addEventListener('change', function (e) {
  var el = e.target;
  if (el.id === 'answersFile' && el.files && el.files[0]) {
    var rd = new FileReader();
    rd.onload = function () {
      document.getElementById('importText').value = rd.result;
      actions.importAnswers();
    };
    rd.readAsText(el.files[0], 'utf-8');
    return;
  }
  if (el.dataset && el.dataset.draft) {
    var t = A.teachers.filter(function (x) { return x.id === el.dataset.draft; })[0];
    if (!t) return;
    var dr = draftOf(t), f = el.dataset.f;
    if (f === 'grades') {
      var g = +el.value, i = dr.grades.indexOf(g);
      if (el.checked && i < 0) dr.grades.push(g);
      if (!el.checked && i >= 0) dr.grades.splice(i, 1);
    } else if (f === 'hours') dr.hours = el.value === 'all' ? 'all' : +el.value;
    else dr[f] = el.value;
    if (f === 'cls') render();
    return;
  }
  var k = el.dataset && el.dataset.k;
  if (!k) return;
  var t = el.dataset.t || 'text', v;
  if (t === 'num') v = +el.value || 0;
  else if (t === 'bool') v = el.checked;
  else if (t === 'radio-true') v = true;
  else if (t === 'radio-false') v = false;
  else if (t === 'hours') v = el.value === 'all' ? 'all' : +el.value;
  else if (t === 'arr' || t === 'arrs') {
    var arr = (getPath(k) || []).slice(), x = t === 'arr' ? +el.value : el.value, at = arr.indexOf(x);
    if (el.checked && at < 0) arr.push(x);
    if (!el.checked && at >= 0) arr.splice(at, 1);
    if (t === 'arr') arr.sort(function (a, b) { return a - b; });
    v = arr;
  } else if (t === 'room') {
    v = el.value.trim();
    var old = el.dataset.old;
    // 教室の名前を変えたら、使っているところも変える
    A.subjects.forEach(function (s) { if (s.room === old) s.room = v; });
    A.teachers.forEach(function (t) { Object.keys(t.dayRoom || {}).forEach(function (d) { if (t.dayRoom[d] === old) t.dayRoom[d] = v; }); });
    A.variants.forEach(function (x) { if (x.room === old) x.room = v; });
  } else if (t === 'sname') {
    v = el.value.trim() || el.dataset.old;
    var sj = getPath(k.replace(/\.name$/, ''));
    if (sj.display === el.dataset.old) sj.display = v;
  } else v = el.value;
  setPath(k, v);
  if (/^teachers\.\d+\.kind$/.test(k) && v === '専科') getPath(k.replace(/\.kind$/, '')).off = {};
  if (k === 'features.sat' && (!!v) !== (A.days.length > 5)) actions.toggleSat();
  if (/^module\.slots\.\d+\.kind$/.test(k) && v === 'subject') {
    var ms = getPath(k.replace(/\.kind$/, ''));
    if (!ms.target) ms.target = (A.subjects.filter(function (x) { return x.id === 'kokugo'; })[0] || A.subjects[0]).id;
  }
  if (/^fixed\.\d+\.kind$/.test(k)) {
    var fx = getPath(k.replace(/\.kind$/, ''));
    delete fx.kind;
    if (v === 'subject') { if (!fx.target) fx.target = A.subjects[0].id; }
    else delete fx.target;
  }
  if (/^pins\.\d+\.teacher$/.test(k)) { var pn = getPath(k.replace(/\.teacher$/, '')); pn.cls = ''; pn.target = ''; }
  if (/^pins\.\d+\.cls$/.test(k)) {
    var pn2 = getPath(k.replace(/\.cls$/, '')), tt = A.teachers.filter(function (x) { return x.id === pn2.teacher; })[0];
    var js = tt ? tt.jobs.filter(function (j) { return j.cls === v; }) : [];
    if (js.length === 1) pn2.target = js[0].target;
  }
  if (k === 'maxPeriods') JW.GRADES.forEach(function (g) { A.periods[g] = (A.periods[g] || []).map(function (p) { return Math.min(p, v); }); });
  result = null;
  // 文字や数字を入れたあとは、すぐに画面を書き直すと、続けて押したボタンが効かなくなるので少し待つ
  if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number')) {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 250);
  } else render();
});

  step = Math.max(0, Math.min(STEPS.length - 1, i));
  while (!visible(step) && step > 0 && step < STEPS.length - 1) step += dir || 1;
  render(); window.scrollTo(0, 0);
}

function fixAnswers(x) {
  // 古い保存データでも動くように、足りない項目をおぎなう
  var d = JW.defaultAnswers();
  ['teachers', 'fixed', 'prefs', 'syncs', 'variants', 'rooms'].forEach(function (k) { if (!x[k]) x[k] = d[k]; });
  if (!x.rules) x.rules = d.rules;
  // 専科は担任と同じく毎日勤務として扱う
  (x.teachers || []).forEach(function (t) {
    t.jobs = t.jobs || []; t.off = t.kind === '専科' ? {} : (t.off || {});
    t.gradeDays = t.gradeDays || {};
    if (t.groupGrade === undefined) t.groupGrade = t.kind === '専科';
  });
  if (x.satCount === undefined) x.satCount = false;
  if (!x.pins) x.pins = [];
  if (!x.features) x.features = { teachers: true, homeroom: false, variants: (x.variants || []).length > 0, module: !!(x.module && x.module.on),
    sat: (x.days || []).length > 5, syncs: (x.syncs || []).length > 0, pins: (x.pins || []).length > 0 };
  if (!x.homeroom) x.homeroom = { grades: {} };
  if (!x.module) x.module = JW.defaultAnswers().module;
  x.rooms.forEach(function (r) { r.gradeCap = r.gradeCap || {}; });
  // 図工・家庭は、すべて2時間続き（必ず）
  x.subjects.forEach(function (s) { if ((s.id === 'zukou' || s.id === 'katei') && s.pairs !== 'all') s.pairs = 'all'; });
  (x.teachers || []).forEach(function (t) { t.dayRoom = t.dayRoom || {}; });
  x.rooms.forEach(function (r) { r.count = r.count || 1; r.grades = r.grades || [[]]; });
  x.subjects.forEach(function (s) { if (s.auto === undefined) s.auto = true; });
  x.variants.forEach(function (v) { if (v.auto === undefined) v.auto = true; });
  return x;
}
