// 印刷：用紙（A3横・A4横）に収まるように縮めて、その部分だけ印刷する
function printArea(id, size, maxW, maxH) {
  var area = document.getElementById(id);
  var ps = document.getElementById('pageStyle') || document.head.appendChild(Object.assign(document.createElement('style'), { id: 'pageStyle' }));
  ps.textContent = '@page { size: ' + size + ' landscape; margin: 8mm; }';
  area.style.zoom = '';
  area.style.zoom = Math.min(1, maxW / area.scrollWidth, maxH / area.scrollHeight);
  area.classList.add('print-target');
  document.body.classList.add('printing');
  setTimeout(function () {
    window.print();
    document.body.classList.remove('printing');
    area.classList.remove('print-target');
    area.style.zoom = '';
  }, 50);
}

// ファイルを保存する（ブラウザの「ダウンロード」に入る）
function downloadFile(name, type, text) {
  var blob = new Blob(['\ufeff' + text], { type: type + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[\\/:*?"<>|]/g, '_');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  toast('「' + a.download + '」を保存しました（ダウンロードフォルダ）');
}

// 組んだ時間割を、このパソコンに保存しておく（HTML版）
function saveTable() {
  if (!STANDALONE || !result || !saveName) return;
  var keep = { table: result.table, unplaced: result.unplaced, hard: result.hard, soft: result.soft, advice: result.advice,
    manual: result.manual, attempts: result.attempts, relaxed: result.relaxed };
  try { localStorage.setItem('jw_result_' + saveName, JSON.stringify(keep)); } catch (e) {}
}
function loadTable(name) {
  if (!STANDALONE) return null;
  try { return JSON.parse(localStorage.getItem('jw_result_' + name) || 'null'); } catch (e) { return null; }
}

// Excelで開けるファイル（スプレッドシート版と同じ形：上にクラス、下に先生・教室の表）
function sheetHtml(t) {
  var D = t.days.length, MP = t.maxPeriods, dayP = t.dayPeriods, mod = t.module;
  var maxP = Math.max.apply(null, dayP.concat([1]));
  var cols = [];
  t.days.forEach(function (d, di) {
    if (!dayP[di]) return;
    if (mod && mod.days.indexOf(di) >= 0) cols.push({ d: di, m: true });
    for (var p = 0; p < dayP[di]; p++) cols.push({ d: di, p: p });
  });
  var W = 42, H = 24, BD = 'border:.5pt solid #888;';
  function fs(v) { var n = String(v == null ? '' : v).length; return n <= 2 ? 10 : n === 3 ? 9 : n <= 8 ? 7 : 6; }
  function td(v, bg, extra) { return '<td style="' + BD + 'text-align:center;vertical-align:middle;mso-number-format:\'\\@\';font-size:' + fs(v) + 'pt;background:' + (bg || '#fff') + ';' + (extra || '') + '">' + esc(v) + '</td>'; }
  var nCols = Math.max(1 + cols.length, 4 * (D + 2));
  var h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">' +
    '<style>table{border-collapse:collapse;font-family:"Noto Sans JP","Yu Gothic",sans-serif} td{height:' + H + 'px;width:' + W + 'px}</style></head><body><table>';
  h += '<col span="' + nCols + '" width="' + W + '">';
  h += '<tr><td colspan="' + nCols + '" style="font-size:14pt;font-weight:bold">' + esc(t.title) + '</td></tr>';
  // 見出し
  h += '<tr>' + td('クラス', '#dfe8f5', 'font-weight:bold');
  t.days.forEach(function (d, di) { var n = cols.filter(function (c) { return c.d === di; }).length; if (n) h += '<td colspan="' + n + '" style="' + BD + 'text-align:center;font-weight:bold;background:#dfe8f5">' + esc(d) + '</td>'; });
  h += '</tr><tr>' + td('', '#dfe8f5') + cols.map(function (c) { return td(c.m ? '朝' : c.p + 1, '#dfe8f5', 'font-weight:bold'); }).join('') + '</tr>';
  t.classRows.forEach(function (r) {
    h += '<tr>' + td(r.label, '#dfe8f5', 'font-weight:bold') + cols.map(function (c) {
      if (c.m) return td(mod.grades.indexOf(r.grade) >= 0 ? mod.labels[c.d] : '', '#eef4ea');
      var cell = r.cells[c.d * MP + c.p];
      var bg = cell.k === 'fixed' ? '#e6e6e6' : cell.k === 'none' ? '#9e9e9e' : cell.k === 'empty' ? '#fff3c4' : cell.k === 'sat' ? '#e6f0fa' : '#fff';
      return td(cell.t, bg);
    }).join('') + '</tr>';
  });
  h += '<tr><td colspan="' + nCols + '"></td></tr>';
  // 下の表：左から4つずつ並べる
  var blocks = t.teacherRows.map(function (r) { return { title: r.title || r.label, cells: r.cells, off: r.off }; })
    .concat(t.roomRows.filter(function (r) { return r.cells.some(function (c) { return c; }); }).map(function (r) { return { title: r.label, cells: r.cells }; }));
  var per = Math.max(1, Math.floor((1 + cols.length + 1) / (D + 2)));
  for (var b0 = 0; b0 < blocks.length; b0 += per) {
    var band = blocks.slice(b0, b0 + per);
    h += '<tr>' + band.map(function (b) { return '<td colspan="' + (D + 1) + '" style="font-weight:bold;font-size:9pt">' + esc(b.title) + '</td><td></td>'; }).join('') + '</tr>';
    h += '<tr>' + band.map(function () { return td('', '#dfe8f5') + t.days.map(function (d) { return td(d, '#dfe8f5', 'font-weight:bold'); }).join('') + '<td></td>'; }).join('') + '</tr>';
    for (var p = 0; p < maxP; p++) {
      h += '<tr>' + band.map(function (b) {
        return td(p + 1, '#dfe8f5', 'font-weight:bold') + t.days.map(function (d, di) {
          var sIdx = di * MP + p, none = p >= dayP[di];
          return td(none ? '' : (b.cells[sIdx] || ''), none ? '#9e9e9e' : (b.off && b.off[sIdx]) ? '#d9d9d9' : '#fff');
        }).join('') + '<td></td>';
      }).join('') + '</tr>';
    }
    h += '<tr><td colspan="' + nCols + '"></td></tr>';
  }
  // 補教表
  if (t.free && t.free.days.length) {
    var f = t.free, CW = 3; // 1曜日あたり3列分の幅
    h += '<tr><td colspan="' + nCols + '" style="font-size:12pt;font-weight:bold">補教表（補教用の空き時間一覧）</td></tr>';
    h += '<tr>' + td('', '#dfe8f5') + f.days.map(function (d) { return '<td colspan="' + CW + '" style="' + BD + 'text-align:center;font-weight:bold;background:#dfe8f5">' + esc(t.days[d]) + '</td>'; }).join('') + '</tr>';
    for (var fp = 0; fp < f.maxP; fp++) {
      h += '<tr style="height:' + (H * 2) + 'px">' + td(fp + 1, '#dfe8f5', 'font-weight:bold') + f.days.map(function (d) {
        var c = f.cells[d * MP + fp];
        return '<td colspan="' + CW + '" style="' + BD + 'vertical-align:top;font-size:8pt;white-space:normal;background:' + (c ? '#fff' : '#9e9e9e') + '">' + esc(c ? c.join('　') : '') + '</td>';
      }).join('') + '</tr>';
    }
  }
  return h + '</table></body></html>';
}

// 見本の学校（架空）
function sampleAnswers() {
  var x = JW.defaultAnswers();
  x.classCounts = { 1: 3, 2: 3, 3: 3, 4: 3, 5: 3, 6: 3 };
  ['kokugo', 'shakai', 'sansu', 'rika', 'seikatsu', 'doutoku', 'sougou', 'gakkatsu'].forEach(function (id) { JW.subjectById(x, id).auto = false; });
  JW.subjectById(x, 'zukou').room = '図工室'; JW.subjectById(x, 'zukou').roomGrades = [5, 6];
  var all = function (gs, t) { var a = []; gs.forEach(function (g) { for (var i = 0; i < 3; i++) a.push({ cls: g + '-' + i, target: t, hours: 'all' }); }); return a; };
  x.teachers = [
    { id: 'ts1', name: '音楽専科', kind: '専科', off: {}, jobs: all([3, 4, 5, 6], 'ongaku'), groupGrade: true, chainGrade: true, gradeDays: {}, dayRoom: {} },
    { id: 'ts2', name: '図工専科', kind: '専科', off: {}, jobs: all([5, 6], 'zukou'), groupGrade: true, chainGrade: false, gradeDays: {}, dayRoom: {} },
    { id: 'ts3', name: '少人数算数', kind: '少人数', off: { '0-1': true, '0-2': true, '0-3': true, '0-4': true, '0-5': true, '0-6': true },
      jobs: [0, 1, 2].map(function (i) { return { cls: '4-' + i, target: 'sansu', hours: 2 }; }), groupGrade: false, gradeDays: {}, dayRoom: {} }
  ];
  x.features.homeroom = true;
  x.homeroom = { grades: {
    5: { on: true, manual: 'gap', assign: { rika: 'cls:5-0', shakai: 'cls:5-1', gaikokugo: 'cls:5-2', ongaku: 'other', zukou: 'other' } },
    6: { on: true, manual: 'gap', assign: { rika: 'cls:6-0', shakai: 'cls:6-1', gaikokugo: 'cls:6-2', ongaku: 'other', zukou: 'other' } }
  } };
  x.prefs = [{ grades: [1, 2], target: 'taiiku', mode: 'avoid', days: [], periods: [5, 6], strict: false }];
  return x;
}

function checkHtml(r) {
  var h = '';
  h += r.must.length ? '<div class="box warn"><b>必ず直すところ（' + r.must.length + '件）</b><ul>' + r.must.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>'
    : '<div class="box good"><b>必ず直すところはありません。</b></div>';
  if (r.better.length) h += '<details class="box note"><summary><b>できれば直すところ（' + r.better.length + '件）</b></summary><ul>' + r.better.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></details>';
  h += STANDALONE ? '<p class="small">特別教室の表は、上の表から作り直しました。</p>' : '<p class="small">結果は「チェック結果」シートにも書きました。下の「特別教室」の表は、上の表から作り直しました。</p>';
  return h;
}
