var drafts = {};
function draftOf(t) {
  if (!drafts[t.id]) drafts[t.id] = { cls: '', grades: [], target: A.subjects.length ? A.subjects[0].id : '', hours: 'all' };

}
// 選んだだけで「追加」を押していない担当を追加する。追加した数を返す
function commitDrafts() {
  var n = 0;
  (A ? A.teachers : []).forEach(function (t) {
    var dr = drafts[t.id];
    if (!dr || !dr.target || (!dr.cls && !dr.grades.length)) return;
    var keys = dr.cls ? [dr.cls] : allClasses().filter(function (c) { return dr.grades.indexOf(c.grade) >= 0; }).map(function (c) { return c.key; });
    keys.forEach(function (k) { t.jobs.push({ cls: k, target: dr.target, hours: dr.hours }); n++; });

}

// 文字数が多いマスは、文字を小さくして表示する
function fitClass(t) { var n = String(t == null ? '' : t).length; return n <= 2 ? '' : n === 3 ? ' f3' : n <= 8 ? ' f4' : ' f9'; }
function cellDiv(t) { return '<div class="c' + fitClass(t) + '">' + esc(t) + '</div>'; }

// 補教表：左に時間、上に曜日、マスに空いている先生の名前
function freeTableHtml(t) {
  var f = t.free;
  if (!f || !f.days.length) return '<p class="small">授業のある時間がありません。</p>';
  var h = '<table class="ft"><tr><th></th>' + f.days.map(function (d) { return '<th>' + esc(t.days[d]) + '</th>'; }).join('') + '</tr>';
  for (var p = 0; p < f.maxP; p++) {
    h += '<tr><th>' + (p + 1) + '</th>' + f.days.map(function (d) {
      var c = f.cells[d * t.maxPeriods + p];
      return c === null || c === undefined ? '<td class="no"></td>' : '<td>' + c.map(function (n) { return '<span class="fn">' + esc(n) + '</span>'; }).join(' ') + '</td>';
    }).join('') + '</tr>';
  }
  return h + '</table>';
}

// スプレッドシートと同じ形のプレビュー
function previewTable(t, editable) {
  var ed = function (attrs) { return editable ? ' contenteditable="true" spellcheck="false" ' + attrs : ''; };
  var MP = t.maxPeriods, D = t.days.length;
  var dayP = t.dayPeriods || t.days.map(function () { return MP; });
  var maxP = Math.max.apply(null, dayP.concat([1]));
  var mod = t.module, hasM = function (di) { return !!mod && dayP[di] > 0 && mod.days.indexOf(di) >= 0; };
  var h = '<table class="pv"><tr><th rowspan="2">' + cellDiv('') + '</th>';
  t.days.forEach(function (d, di) { if (dayP[di]) h += '<th class="day" colspan="' + (dayP[di] + (hasM(di) ? 1 : 0)) + '">' + esc(d) + '</th>'; });
  h += '</tr><tr>';
  t.days.forEach(function (d, di) {
    if (hasM(di)) h += '<th class="day">' + cellDiv('朝') + '</th>';
    for (var p = 0; p < dayP[di]; p++) h += '<th' + (p === 0 && !hasM(di) ? ' class="day"' : '') + '>' + cellDiv(p + 1) + '</th>';
  });
  h += '</tr>';
  t.classRows.forEach(function (r, ri) {
    h += '<tr><th>' + cellDiv(r.label) + (r.hr ? '<div class="hrn">' + esc(r.hr) + '</div>' : '') + '</th>';
    t.days.forEach(function (d, di) {
      if (hasM(di)) h += '<td class="mo dl">' + cellDiv(mod.grades.indexOf(r.grade) >= 0 ? mod.labels[di] : '') + '</td>';
      for (var p = 0; p < dayP[di]; p++) {
        var c = r.cells[di * MP + p];
        var k = c.k === 'fixed' ? 'fx' : c.k === 'none' ? 'no' : c.k === 'empty' ? 'em' : c.k === 'sat' ? 'sa' : '';
        var canEdit = editable && c.k !== 'none';
        h += '<td class="' + k + (p === 0 && !hasM(di) ? ' dl' : '') + '">' +
          (canEdit ? '<div class="c' + fitClass(c.t) + '"' + ed('data-ed="c" data-r="' + ri + '" data-s="' + (di * MP + p) + '"') + '>' + esc(c.t) + '</div>' : cellDiv(c.t)) + '</td>';
      }
    });
    h += '</tr>';
  });
  h += '</table>';

  // 下：先生・特別教室ごとの小さな表を、左から詰めて並べる
  var blocks = t.teacherRows.map(function (r, i) { return { title: r.title || r.label, cells: r.cells, off: r.off, ed: 't', i: i }; })
    .concat(t.roomRows.map(function (r, i) { return { title: r.label, cells: r.cells, ed: '', i: i }; }).filter(function (b) { return b.cells.some(function (c) { return c; }); }));
  h += '<div class="blocks">' + blocks.map(function (b) {
    var x = '<div class="blk"><div class="blk-t">' + esc(b.title) + '</div><table class="pv"><tr><th>' + cellDiv('') + '</th>' +
      t.days.map(function (d) { return '<th>' + cellDiv(d) + '</th>'; }).join('') + '</tr>';
    for (var p = 0; p < maxP; p++) {
      x += '<tr><th>' + cellDiv(p + 1) + '</th>';
      for (var di = 0; di < D; di++) {
        var sIdx = di * MP + p, k = p >= dayP[di] ? 'no' : (b.off && b.off[sIdx]) ? 'fx' : '';
        var v = b.cells[sIdx] || '';
        x += '<td class="' + k + '">' + (editable && b.ed && k !== 'no' ? '<div class="c' + fitClass(v) + '"' + ed('data-ed="t" data-r="' + b.i + '" data-s="' + sIdx + '"') + '>' + esc(v) + '</div>' : cellDiv(v)) + '</td>';
      }
      x += '</tr>';
    }
    return x + '</table></div>';
  }).join('') + '</div>';
  return h;
}

/* ---------- 入力の反映 ---------- */
var renderTimer = null;

document.addEventListener('change', function (e) {

  var k = el.dataset && el.dataset.k;
  if (!k) return;
  var t = el.dataset.t || 'text', v;
  if (t === 'num') v = +el.value || 0;
  else if (t === 'bool') v = el.checked;
  else if (t === 'radio-true') v = true;
  else if (t === 'radio-false') v = false;
  else if (t === 'hours') v = el.value === 'all' ? 'all' : +el.value;
  else if (t === 'arr' || t === 'arrs') {
    var arr = (getPath(k) || []).slice(), x = t === 'arr' ? +el.value : el.value, at = arr.indexOf(x);
    if (el.checked && at < 0) arr.push(x);
    if (!el.checked && at >= 0) arr.splice(at, 1);
    if (t === 'arr') arr.sort(function (a, b) { return a - b; });
    v = arr;
  } else if (t === 'arroff') {
    var off = (getPath(k) || []).slice(), y = +el.value, at2 = off.indexOf(y);
    if (!el.checked && at2 < 0) off.push(y);
    if (el.checked && at2 >= 0) off.splice(at2, 1);
    v = off.sort(function (a, b) { return a - b; });
  } else if (t === 'room') {
    v = el.value.trim();
    var old = el.dataset.old;
    // 教室の名前を変えたら、使っているところも変える
    A.subjects.forEach(function (s) { s.room = renameSpec(s.room, old, v); });
    A.teachers.forEach(function (t) { Object.keys(t.dayRoom || {}).forEach(function (d) { t.dayRoom[d] = renameSpec(t.dayRoom[d], old, v); }); });
    A.variants.forEach(function (x) { x.room = renameSpec(x.room, old, v); });
  } else if (t === 'sname') {
    v = el.value.trim() || el.dataset.old;
    var sj = getPath(k.replace(/\.name$/, ''));
    if (sj.display === el.dataset.old) sj.display = v;
  } else v = el.value;
  setPath(k, v);
  if (/^teachers\.\d+\.kind$/.test(k) && v === '専科') getPath(k.replace(/\.kind$/, '')).off = {};
  if (k === 'features.sat' && (!!v) !== (A.days.length > 5)) actions.toggleSat();
  if (/^module\.slots\.\d+\.kind$/.test(k) && v === 'subject') {
    var ms = getPath(k.replace(/\.kind$/, ''));
    if (!ms.target) ms.target = (A.subjects.filter(function (x) { return x.id === 'kokugo'; })[0] || A.subjects[0]).id;
  }
  if (/^fixed\.\d+\.kind$/.test(k)) {
    var fx = getPath(k.replace(/\.kind$/, ''));
    delete fx.kind;
    if (v === 'subject') { if (!fx.target) fx.target = A.subjects[0].id; }
    else delete fx.target;
  }
  if (/^pins\.\d+\.teacher$/.test(k)) { var pn = getPath(k.replace(/\.teacher$/, '')); pn.cls = ''; pn.target = ''; }
  if (/^pins\.\d+\.cls$/.test(k)) {
    var pn2 = getPath(k.replace(/\.cls$/, '')), tt = A.teachers.filter(function (x) { return x.id === pn2.teacher; })[0];
    var js = tt ? tt.jobs.filter(function (j) { return j.cls === v; }) : [];
    if (js.length === 1) pn2.target = js[0].target;
  }
  if (k === 'maxPeriods') JW.GRADES.forEach(function (g) { A.periods[g] = (A.periods[g] || []).map(function (p) { return Math.min(p, v); }); });
  result = null;
  // 文字や数字を入れたあとは、すぐに画面を書き直すと、続けて押したボタンが効かなくなるので少し待つ
  if (el.tagName === 'INPUT' && (el.type === 'text' || el.type === 'number')) {
    clearTimeout(renderTimer);
    renderTimer = setTimeout(render, 250);
  } else render();
});

document.addEventListener('click', function (e) {
  var el = e.target.closest ? e.target.closest('[data-a]') : null;
  if (!el || el.disabled) return;
  var f = actions[el.dataset.a];
  if (f) { e.preventDefault(); f(el.dataset, el); }
});

function saveNow() {
  if (!A || !saveName) return Promise.resolve();
  return call('saveAnswers', saveName, JSON.stringify(A)).then(function () { toast('保存しました'); })
    .catch(function (err) { alert('保存できませんでした：' + (err && err.message || err)); });
}
function go(i, dir) {
  step = Math.max(0, Math.min(STEPS.length - 1, i));
  while (!visible(step) && step > 0 && step < STEPS.length - 1) step += dir || 1;
  render(); window.scrollTo(0, 0);
}

function fixAnswers(x) {
  // 古い保存データでも動くように、足りない項目をおぎなう
  var d = JW.defaultAnswers();
  ['teachers', 'fixed', 'prefs', 'syncs', 'variants', 'rooms'].forEach(function (k) { if (!x[k]) x[k] = d[k]; });
  if (!x.rules) x.rules = d.rules;
  // 専科は担任と同じく毎日勤務として扱う
  (x.teachers || []).forEach(function (t) {
    t.jobs = t.jobs || []; t.off = t.kind === '専科' ? {} : (t.off || {});
    t.gradeDays = t.gradeDays || {};
    if (t.groupGrade === undefined) t.groupGrade = t.kind === '専科';
  });
  if (x.satCount === undefined) x.satCount = false;
  if (!x.pins) x.pins = [];
  if (!x.features) x.features = { teachers: true, homeroom: false, variants: (x.variants || []).length > 0, module: !!(x.module && x.module.on),
    sat: (x.days || []).length > 5, syncs: (x.syncs || []).length > 0, pins: (x.pins || []).length > 0 };
  if (!x.homeroom) x.homeroom = { grades: {} };
  if (!x.module) x.module = JW.defaultAnswers().module;
  x.rooms.forEach(function (r) { r.gradeCap = r.gradeCap || {}; });
  // 図工・家庭は、すべて2時間続き（必ず）
  x.subjects.forEach(function (s) { if ((s.id === 'zukou' || s.id === 'katei') && s.pairs !== 'all') s.pairs = 'all'; });
  (x.teachers || []).forEach(function (t) { t.dayRoom = t.dayRoom || {}; });
  x.rooms.forEach(function (r) { r.count = r.count || 1; r.grades = r.grades || [[]]; });
  x.subjects.forEach(function (s) { if (s.auto === undefined) s.auto = true; });
  x.variants.forEach(function (v) { if (v.auto === undefined) v.auto = true; });
  // 教科の場所を使う学年は「外した学年」で持つ（特別教室の学年に合わせて自動で変わるように）
  x.subjects.forEach(function (s) {
    if (!s.roomOff) s.roomOff = s.roomGrades && s.roomGrades.length ? JW.GRADES.filter(function (g) { return s.roomGrades.indexOf(g) < 0; }) : [];
    delete s.roomGrades;
  });
  x.syncs.forEach(function (sg) { if (!sg.mode) sg.mode = 'pick'; });
  if (x.rules.senkaDaily === undefined) x.rules.senkaDaily = true;
  // 希望と授業の固定は、曜日×時間の表で選んだマスで持つ
  x.prefs.forEach(function (p) { if (!p.cells) { p.cells = JW.prefCells(x, p); delete p.days; delete p.periods; } });
  x.pins.forEach(function (pn) {
    if (!pn.cells) { pn.cells = pn.day !== undefined && pn.period ? [pn.day + '-' + pn.period] : []; pn.how = 'all'; pn.count = 1; delete pn.day; delete pn.period; }
  });
  if (!x.hrNames) x.hrNames = {};
  return x;
}

var actions = {
  go: function (d) { if (A || +d.i === 0) { if (A) { commitDrafts(); saveNow(); } go(+d.i); } },
  next: function () { commitDrafts(); saveNow(); go(step + 1); },
  prev: function () { commitDrafts(); saveNow(); go(step - 1, -1); },
  open: function (d) {

      if (!json) return alert('読み込めませんでした。');
      A = fixAnswers(JSON.parse(json)); saveName = d.n; result = loadTable(d.n); go(1);

  },
  create: function () {

    var p = from ? call('loadSave', from).then(function (j) { return fixAnswers(JSON.parse(j)); }) : Promise.resolve(JW.defaultAnswers());
    p.then(function (x) { A = x; A.name = name; saveName = name; result = null; return saveNow(); }).then(function () { go(1); })
      .catch(function (err) { alert(err.message || err); });

// 印刷：用紙（A3横・A4横）に収まるように縮めて、その部分だけ印刷する
function printArea(id, size, maxW, maxH) {
  var area = document.getElementById(id);
  var ps = document.getElementById('pageStyle') || document.head.appendChild(Object.assign(document.createElement('style'), { id: 'pageStyle' }));
  ps.textContent = '@page { size: ' + size + ' landscape; margin: 8mm; }';
  area.style.zoom = '';
  area.style.zoom = Math.min(1, maxW / area.scrollWidth, maxH / area.scrollHeight);
  area.classList.add('print-target');
  document.body.classList.add('printing');
  setTimeout(function () {
    window.print();
    document.body.classList.remove('printing');
    area.classList.remove('print-target');
    area.style.zoom = '';
  }, 50);
}

// ファイルを保存する（ブラウザの「ダウンロード」に入る）
function downloadFile(name, type, text) {
  var blob = new Blob(['\ufeff' + text], { type: type + ';charset=utf-8' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name.replace(/[\\/:*?"<>|]/g, '_');
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(function () { URL.revokeObjectURL(a.href); }, 5000);
  toast('「' + a.download + '」を保存しました（ダウンロードフォルダ）');
}

// 組んだ時間割を、このパソコンに保存しておく（HTML版）
function saveTable() {
  if (!STANDALONE || !result || !saveName) return;
  var keep = { table: result.table, unplaced: result.unplaced, hard: result.hard, soft: result.soft, advice: result.advice,
    manual: result.manual, attempts: result.attempts, relaxed: result.relaxed };
  try { localStorage.setItem('jw_result_' + saveName, JSON.stringify(keep)); } catch (e) {}
}
function loadTable(name) {
  if (!STANDALONE) return null;
  try { return JSON.parse(localStorage.getItem('jw_result_' + name) || 'null'); } catch (e) { return null; }
}

// Excelで開けるファイル（スプレッドシート版と同じ形：上にクラス、下に先生・教室の表）
function sheetHtml(t) {
  var D = t.days.length, MP = t.maxPeriods, dayP = t.dayPeriods, mod = t.module;
  var maxP = Math.max.apply(null, dayP.concat([1]));
  var cols = [];
  t.days.forEach(function (d, di) {
    if (!dayP[di]) return;
    if (mod && mod.days.indexOf(di) >= 0) cols.push({ d: di, m: true });
    for (var p = 0; p < dayP[di]; p++) cols.push({ d: di, p: p });
  });
  var W = 42, H = 24, BD = 'border:.5pt solid #888;';
  function fs(v) { var n = String(v == null ? '' : v).length; return n <= 2 ? 10 : n === 3 ? 9 : n <= 8 ? 7 : 6; }
  function td(v, bg, extra) { return '<td style="' + BD + 'text-align:center;vertical-align:middle;mso-number-format:\'\\@\';font-size:' + fs(v) + 'pt;background:' + (bg || '#fff') + ';' + (extra || '') + '">' + esc(v) + '</td>'; }
  var nCols = Math.max(1 + cols.length, 4 * (D + 2));
  var h = '<html xmlns:o="urn:schemas-microsoft-com:office:office" xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8">' +
    '<style>table{border-collapse:collapse;font-family:"Noto Sans JP","Yu Gothic",sans-serif} td{height:' + H + 'px;width:' + W + 'px}</style></head><body><table>';
  h += '<col span="' + nCols + '" width="' + W + '">';
  h += '<tr><td colspan="' + nCols + '" style="font-size:14pt;font-weight:bold">' + esc(t.title) + '</td></tr>';
  // 見出し
  h += '<tr>' + td('クラス', '#dfe8f5', 'font-weight:bold');
  t.days.forEach(function (d, di) { var n = cols.filter(function (c) { return c.d === di; }).length; if (n) h += '<td colspan="' + n + '" style="' + BD + 'text-align:center;font-weight:bold;background:#dfe8f5">' + esc(d) + '</td>'; });
  h += '</tr><tr>' + td('', '#dfe8f5') + cols.map(function (c) { return td(c.m ? '朝' : c.p + 1, '#dfe8f5', 'font-weight:bold'); }).join('') + '</tr>';
  t.classRows.forEach(function (r) {
    h += '<tr>' + td(r.label + (r.hr ? '（' + r.hr + '）' : ''), '#dfe8f5', 'font-weight:bold') + cols.map(function (c) {
      if (c.m) return td(mod.grades.indexOf(r.grade) >= 0 ? mod.labels[c.d] : '', '#eef4ea');
      var cell = r.cells[c.d * MP + c.p];
      var bg = cell.k === 'fixed' ? '#e6e6e6' : cell.k === 'none' ? '#9e9e9e' : cell.k === 'empty' ? '#fff3c4' : cell.k === 'sat' ? '#e6f0fa' : '#fff';
      return td(cell.t, bg);
    }).join('') + '</tr>';
  });
  h += '<tr><td colspan="' + nCols + '"></td></tr>';
  // 下の表：左から4つずつ並べる
  var blocks = t.teacherRows.map(function (r) { return { title: r.title || r.label, cells: r.cells, off: r.off }; })
    .concat(t.roomRows.filter(function (r) { return r.cells.some(function (c) { return c; }); }).map(function (r) { return { title: r.label, cells: r.cells }; }));
  var per = Math.max(1, Math.floor((1 + cols.length + 1) / (D + 2)));
  for (var b0 = 0; b0 < blocks.length; b0 += per) {
    var band = blocks.slice(b0, b0 + per);
    h += '<tr>' + band.map(function (b) { return '<td colspan="' + (D + 1) + '" style="font-weight:bold;font-size:9pt">' + esc(b.title) + '</td><td></td>'; }).join('') + '</tr>';
    h += '<tr>' + band.map(function () { return td('', '#dfe8f5') + t.days.map(function (d) { return td(d, '#dfe8f5', 'font-weight:bold'); }).join('') + '<td></td>'; }).join('') + '</tr>';
    for (var p = 0; p < maxP; p++) {
      h += '<tr>' + band.map(function (b) {
        return td(p + 1, '#dfe8f5', 'font-weight:bold') + t.days.map(function (d, di) {
          var sIdx = di * MP + p, none = p >= dayP[di];
          return td(none ? '' : (b.cells[sIdx] || ''), none ? '#9e9e9e' : (b.off && b.off[sIdx]) ? '#d9d9d9' : '#fff');
        }).join('') + '<td></td>';
      }).join('') + '</tr>';
    }
    h += '<tr><td colspan="' + nCols + '"></td></tr>';
  }
  // 補教表
  if (t.free && t.free.days.length) {
    var f = t.free, CW = 3; // 1曜日あたり3列分の幅
    h += '<tr><td colspan="' + nCols + '" style="font-size:12pt;font-weight:bold">補教表（補教用の空き時間一覧）</td></tr>';
    h += '<tr>' + td('', '#dfe8f5') + f.days.map(function (d) { return '<td colspan="' + CW + '" style="' + BD + 'text-align:center;font-weight:bold;background:#dfe8f5">' + esc(t.days[d]) + '</td>'; }).join('') + '</tr>';
    for (var fp = 0; fp < f.maxP; fp++) {
      h += '<tr style="height:' + (H * 2) + 'px">' + td(fp + 1, '#dfe8f5', 'font-weight:bold') + f.days.map(function (d) {
        var c = f.cells[d * MP + fp];
        return '<td colspan="' + CW + '" style="' + BD + 'vertical-align:top;font-size:8pt;white-space:normal;background:' + (c ? '#fff' : '#9e9e9e') + '">' + esc(c ? c.join('　') : '') + '</td>';
      }).join('') + '</tr>';
    }
  }
  return h + '</table></body></html>';
}

  x.teachers = [

      jobs: [0, 1, 2].map(function (i) { return { cls: '4-' + i, target: 'sansu', hours: 2 }; }), groupGrade: false, gradeDays: {}, dayRoom: {} }

function checkHtml(r) {
  var h = '';
  h += r.must.length ? '<div class="box warn"><b>必ず直すところ（' + r.must.length + '件）</b><ul>' + r.must.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></div>'
    : '<div class="box good"><b>必ず直すところはありません。</b></div>';
  if (r.better.length) h += '<details class="box note"><summary><b>できれば直すところ（' + r.better.length + '件）</b></summary><ul>' + r.better.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul></details>';
  h += STANDALONE ? '<p class="small">特別教室の表は、上の表から作り直しました。</p>' : '<p class="small">結果は「チェック結果」シートにも書きました。下の「特別教室」の表は、上の表から作り直しました。</p>';
  return h;
}
