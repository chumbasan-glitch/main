<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<base target="_top">
<style>
  :root {
    --bg: #ffffff; --ink: #2b2b2b; --sub: #6b6b6b; --main: #2f6f5e; --on-main: #ffffff;
    --warn-weak: #fbe9e7; --note: #fff6d6; --good: #e3efe9;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg: #1e2423; --ink: #e7eae6; --sub: #a6aea9; --main: #2f6f5e; --on-main: #ffffff;
      --warn-weak: #3b2321; --note: #3a3320; --good: #1f3a33;
    }
  }
  body { font-family: "Noto Sans JP", "Hiragino Sans", "Yu Gothic", sans-serif; font-size: 14px; line-height: 1.6; color: var(--ink); background: var(--bg); margin: 8px 12px; }
  .box { border-radius: 8px; padding: 10px 12px; margin: 10px 0; }
  .warn { background: var(--warn-weak); } .note { background: var(--note); } .good { background: var(--good); }
  ul { margin: 6px 0 0; padding-left: 20px; }
  .small { font-size: 12px; color: var(--sub); }
  button { font: inherit; border: 1px solid var(--main); background: var(--main); color: var(--on-main); padding: 6px 14px; border-radius: 8px; cursor: pointer; }
</style>
</head>
<body>
<div id="out">「時間割一覧」シートを読み込んで、チェックしています…</div>
<?!= include('Logic') ?>
<script>
function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function list(a) { return '<ul>' + a.map(function (x) { return '<li>' + esc(x) + '</li>'; }).join('') + '</ul>'; }
function fail(err) { document.getElementById('out').innerHTML = '<div class="box warn">' + esc(err && err.message || err) + '</div>'; }

google.script.run.withFailureHandler(fail).withSuccessHandler(function (data) {
  var A = JSON.parse(data.answers), d = JW.defaultAnswers();
  ['teachers', 'fixed', 'prefs', 'syncs', 'variants', 'rooms'].forEach(function (k) { if (!A[k]) A[k] = d[k]; });
  if (!A.rules) A.rules = d.rules;
  var r = JW.check(A, data);
  var h = '<div class="small">チェックに使った答え：「' + esc(data.saveName) + '」</div>';
  h += r.must.length ? '<div class="box warn"><b>必ず直すところ（' + r.must.length + '件）</b>' + list(r.must) + '</div>'
    : '<div class="box good"><b>必ず直すところはありません。</b></div>';
  h += r.better.length ? '<div class="box note"><b>できれば直すところ（' + r.better.length + '件）</b>' + list(r.better) + '</div>'
    : '<div class="box good">できれば直すところもありません。</div>';
  h += '<p class="small">結果は「チェック結果」シートにも書きます。下の「特別教室」の表は、上の表から作り直します。</p>';
  h += '<button onclick="google.script.host.close()">閉じる</button>';
  document.getElementById('out').innerHTML = h;
  google.script.run.withFailureHandler(fail).writeCheckResult(r);
}).readTimetable();
</script>
</body>
</html>
