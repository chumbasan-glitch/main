<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>授業プランノート</title>
<style>
:root{
  --bg:#F3F1EA;
  --surface:#FFFFFF;
  --surface-2:#ECE8DC;
  --ink:#22302A;
  --ink-soft:#5D6A62;
  --line:#D5CFBF;
  --accent:#2E6B4F;
  --accent-ink:#FFFFFF;
  --accent-soft:#DCEBE1;
  --warn:#A14E28;
  --warn-soft:#F7E4D7;
  --board:#2D4C3C;
  --board-frame:#7A6040;
  --chalk:#F5F5EE;
  --chalk-y:#F4D962;
  --chalk-r:#F39A96;
  --chalk-b:#94CBF4;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#161B18;
    --surface:#202723;
    --surface-2:#2A332E;
    --ink:#E8EEE9;
    --ink-soft:#A8B5AD;
    --line:#3A463F;
    --accent:#7CC3A0;
    --accent-ink:#11201A;
    --accent-soft:#25392F;
    --warn:#F0A07A;
    --warn-soft:#3A2A21;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#161B18;
  --surface:#202723;
  --surface-2:#2A332E;
  --ink:#E8EEE9;
  --ink-soft:#A8B5AD;
  --line:#3A463F;
  --accent:#7CC3A0;
  --accent-ink:#11201A;
  --accent-soft:#25392F;
  --warn:#F0A07A;
  --warn-soft:#3A2A21;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{
  margin:0;background:var(--bg);color:var(--ink);
  font-family:"BIZ UDPGothic","BIZ UDPゴシック","Yu Gothic UI","Yu Gothic","Hiragino Sans","Meiryo",sans-serif;
  font-size:15px;line-height:1.6;
}
button,select,input,textarea{font:inherit;color:inherit}
.wrap{max-width:1360px;margin:0 auto;padding:12px 16px 60px;display:flex;flex-direction:column;gap:14px}

/* ---------- header ---------- */
header.top{display:flex;align-items:center;gap:10px 14px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding-bottom:8px}
header.top h1{margin:0;font-size:24px;letter-spacing:.08em;font-weight:700}
header.top .ver{color:var(--ink-soft);font-size:12px}
header.top .cur{color:var(--ink-soft);font-size:13px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
header.top .cur b{color:var(--ink)}
.state{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-soft);white-space:nowrap}
.state.dirty{background:var(--warn-soft);color:var(--warn)}
.tools{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
.btn.on{background:var(--warn);border-color:var(--warn);color:#fff;font-weight:700}
.btn.small{padding:2px 8px;font-size:13px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- layout ---------- */
.layout{display:grid;grid-template-columns:250px minmax(0,1fr);gap:14px;align-items:start}
@media (max-width:900px){.layout{grid-template-columns:1fr}}
.side{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px}
.side h2{margin:0;font-size:14px}
.side .hint{font-size:12px;color:var(--ink-soft);margin:0}
.lib{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:4px;max-height:60vh;overflow:auto}
.lib li{display:flex;gap:4px;align-items:stretch}
.lib .open{flex:1;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;cursor:pointer;min-width:0}
.lib .open.cur{border-color:var(--accent);background:var(--accent-soft)}
.lib .open b{display:block;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lib .open small{color:var(--ink-soft);font-size:11px}
.lib .del{border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--ink-soft);padding:0 8px}
.main{min-width:0;display:flex;flex-direction:column;gap:10px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--line)}
.tab{border:1px solid var(--line);border-bottom:none;background:var(--surface-2);border-radius:8px 8px 0 0;padding:7px 14px;cursor:pointer;font-weight:700;color:var(--ink-soft)}
.tab.active{background:var(--surface);color:var(--ink);border-color:var(--ink)}
.hourbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px}
.hourbar select{padding:5px 8px;border-radius:8px;border:1px solid var(--line);background:var(--surface);max-width:100%;min-width:0}
.hourbar .sp{flex:1}
.editnote{background:var(--warn-soft);color:var(--warn);border-radius:10px;padding:8px 12px;font-size:13px}

/* ---------- paper (always white, looks like printout) ---------- */
.paper{background:#fff;color:#111;border-radius:6px;box-shadow:0 1px 3px rgba(0,0,0,.18);padding:22px 26px;max-width:100%;overflow-x:auto;
  font-family:"BIZ UDPGothic","BIZ UDPゴシック","Yu Gothic","Hiragino Sans","Meiryo","IPAPGothic","Noto Sans CJK JP",sans-serif;font-size:14px;line-height:1.6}
.paper h2{font-size:20px;margin:0 0 10px;border-bottom:2px solid #111;padding-bottom:4px;letter-spacing:.05em}
.paper h3{font-size:16px;margin:16px 0 6px}
.paper table{border-collapse:collapse;width:100%}
.paper th,.paper td{border:1px solid #444;padding:5px 7px;vertical-align:top;text-align:left}
.paper th{background:#EFEFEA;font-weight:700;white-space:nowrap}
.paper .c{text-align:center;vertical-align:middle}
.paper .muted{color:#555;font-size:12px}
.paper .tx{white-space:pre-wrap;word-break:break-word;min-height:1.6em}
table.info th{width:8.5em}
table.plan td.mk{width:2.4em;text-align:center;vertical-align:middle;font-size:16px}
table.plan td.hr{width:2.6em;text-align:center}
table.flow th{text-align:center}
table.flow td.time{width:3.6em;text-align:center}
.box{border:1.5px solid #111;border-radius:6px;padding:8px 12px;margin:6px 0}
.legend{font-size:12px;color:#444;margin-top:4px}
.ops{display:inline-flex;gap:2px;margin-top:4px;flex-wrap:wrap}
.ops button,.mark,.addrow{border:1px solid #bbb;background:#fafafa;border-radius:5px;font-size:12px;padding:0 6px;cursor:pointer;color:#333;line-height:1.7}
.ops button:hover,.addrow:hover{border-color:#2E6B4F;color:#2E6B4F}
.mark{font-size:16px;min-width:2em;min-height:1.8em}
.ed{outline:1.5px dashed #D3A57E;outline-offset:1px;border-radius:3px;background:#FFFBF4;min-height:1.6em;cursor:text}
.ed:focus{outline:2px solid #C0692F;background:#fff}
.ed:empty::before{content:attr(data-ph);color:#aaa}
.paper select,.paper input[type=number]{border:1px solid #bbb;border-radius:5px;padding:1px 4px;font-size:12px;background:#fff;color:#111}
ruby rt{font-size:.5em}

/* ---------- blackboard ---------- */
.board{background:var(--board);border:10px solid var(--board-frame);border-radius:6px;color:var(--chalk);display:flex;gap:0;min-height:300px;aspect-ratio:2.4/1;padding:14px 10px;
  font-family:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","UD Digi Kyokasho NK-R","Yu Gothic","YuGothic","Meiryo","Hiragino Sans","IPAGothic","Noto Sans CJK JP",sans-serif;font-size:17px;line-height:1.5;overflow:hidden;position:relative}
.board.h{flex-direction:row}
.board.v{flex-direction:row-reverse;justify-content:space-between}
.board.h .bcol{flex:1 1 0}
.board.v .bcol{flex:0 0 auto;max-width:40%}
.bcol{display:flex;flex-direction:column;gap:8px;padding:2px 10px;min-width:0;min-height:0}
.board.h .bcol + .bcol{border-left:1px dashed rgba(255,255,255,.18)}
.board.v .bcol{writing-mode:vertical-rl;flex-direction:column}
.board.v .bcol + .bcol{border-right:1px dashed rgba(255,255,255,.18)}
.bit{white-space:pre-wrap;word-break:break-word}
.bit .chip{display:inline-block;border:1.5px solid currentColor;border-radius:50%;width:1.5em;height:1.5em;line-height:1.35em;text-align:center;font-size:.8em;margin:0 .3em .2em 0}
.board.v .bit .chip{writing-mode:horizontal-tb;margin:0 0 .3em 0}
.bit.s-title{font-size:1.45em;font-weight:700}
.bit.s-date{font-size:.85em;opacity:.9}
.bit.s-aim{border:2px solid var(--chalk-y);border-radius:4px;padding:4px 8px}
.bit.s-sum{border:2px solid var(--chalk-r);border-radius:4px;padding:4px 8px}
.bit.s-q{border-bottom:2px solid var(--chalk);padding-bottom:2px}
.board.v .bit.s-q{border-bottom:none;border-left:2px solid var(--chalk);padding:0 0 0 4px}
/* 縦書きでは太字にすると文字が重なる（教科書体に太字がなく、疑似太字になるため）。太字を使わず、大きさや線で強調する */
.board.v .bit{font-weight:400!important;font-synthesis:none}
.board.v .bit.s-title{font-size:1.6em;letter-spacing:.08em}
.bit.s-card{border:2px dashed var(--chalk);background:rgba(255,255,255,.07);padding:4px 8px;border-radius:3px}
.bit.s-card::before{content:"掲示 ";font-size:.7em;opacity:.8}
.bit.s-note{font-size:.85em;opacity:.92}
.bit.c-yellow{color:var(--chalk-y)}
.bit.c-red{color:var(--chalk-r)}
.bit.c-blue{color:var(--chalk-b)}
.board .empty{opacity:.6;font-size:14px;margin:auto}
.memo ol{margin:4px 0;padding-left:1.8em}
.memo li{margin:2px 0}
.bedit{margin-top:14px;border-top:2px dashed #D3A57E;padding-top:10px}
.bedit .col{border:1px solid #ccc;border-radius:8px;padding:8px;margin:8px 0;background:#fcfcf9}
.bedit .item{display:grid;grid-template-columns:auto 1fr;gap:6px;align-items:start;margin:6px 0}
.bedit .item .ctl{display:flex;flex-direction:column;gap:3px}

/* ---------- reflection sheets ---------- */
.sheet{font-family:"UD Digi Kyokasho N-R","UD デジタル 教科書体 N-R","BIZ UDPGothic","Yu Gothic","Meiryo","Hiragino Sans","IPAGothic","Noto Sans CJK JP",sans-serif;color:#111}
.sheet .shead{display:flex;justify-content:space-between;align-items:flex-end;gap:10px;border-bottom:2px solid #111;padding-bottom:4px;margin-bottom:10px;flex-wrap:wrap}
.sheet .stitle{font-size:20px;font-weight:700}
.sheet .sname{font-size:15px;white-space:nowrap}
.sheet .sname span{display:inline-block;border-bottom:1px solid #111;min-width:3em;text-align:center}
.sheet .sname span.nm{min-width:10em}
.sheet .aimbox{border:2px solid #111;border-radius:8px;padding:8px 12px;margin:8px 0 12px;display:flex;gap:10px;align-items:flex-start}
.sheet .aimbox .lbl{font-weight:700;white-space:nowrap;border:1.5px solid #111;border-radius:50%;width:2em;height:2em;line-height:1.85em;text-align:center;flex:none}
.sheet h4{margin:12px 0 4px;font-size:16px}
.sheet table.self td{vertical-align:middle;padding:6px 8px}
.sheet table.self td.sc{width:13em;text-align:center;white-space:nowrap}
.sheet .lines{margin:4px 0 8px}
.sheet .lines div{border-bottom:1px solid #777;height:var(--lh,34px)}
.sheet.low{font-size:18px}
.sheet.low .lines div{--lh:46px}
.sheet.mid{font-size:16px}
.sheet.mid .lines div{--lh:38px}
.sheet.high{font-size:15px}
.sheet.high .lines div{--lh:32px}
.face{display:inline-flex;flex-direction:column;align-items:center;margin:0 6px;font-size:11px}
.face svg{width:34px;height:34px}
.marks span{display:inline-block;width:1.9em;height:1.9em;line-height:1.8em;text-align:center;border:1px solid #999;border-radius:50%;margin:0 3px;font-size:16px}
table.ur td{vertical-align:middle}
table.ur td.wr{height:var(--rh,68px)}
.sheet.low table.ur td.wr{--rh:84px}
.sheet .bigbox{border:1.5px solid #111;border-radius:8px;padding:6px 10px;margin:8px 0}

/* ---------- performance task ---------- */
.task{border:2.5px double #111;border-radius:8px;padding:12px 16px;margin:8px 0;font-size:15px}
table.rub td,table.rub th{font-size:13px}
table.rub th.lv{text-align:center;width:28%}

.hgrid{display:grid;gap:0}
.hgrid.n2{grid-template-rows:1fr 1fr}
.hgrid.n4{grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr}
.hcard{border:1px dashed #888;padding:12px 14px;display:flex;flex-direction:column;gap:6px;min-height:0}
.hgrid.n1 .hcard{border:none;padding:0}
.hcard .ht{font-size:1.2em;font-weight:700;text-align:center}
.hcard .lines{margin:0}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:flex;align-items:flex-start;justify-content:center;padding:24px 12px;z-index:50;overflow:auto}
.modal .card{background:var(--surface);color:var(--ink);border-radius:14px;padding:18px 20px;width:min(720px,100%);display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.3)}
.modal h2{margin:0;font-size:19px}
.modal .row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.modal label.f{display:flex;flex-direction:column;gap:3px;font-size:13px;font-weight:700;color:var(--ink-soft)}
.modal input[type=text],.modal input[type=number],.modal select,.modal textarea{border:1px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--surface);font-weight:400;color:var(--ink)}
.modal textarea{width:100%;min-height:90px;resize:vertical}
.modal .opt{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:8px 10px;cursor:pointer}
.modal .opt:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.modal .foot{display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.modal .help{font-size:13px;color:var(--ink-soft)}
.modal .grid2{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:8px}
.modal ol.steps{margin:0;padding-left:1.4em}
.modal ol.steps li{margin:4px 0}
.welcome{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:24px;display:flex;flex-direction:column;gap:14px}
.welcome h2{margin:0}
.welcome ol{margin:0;padding-left:1.4em}
.welcome li{margin:6px 0}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:80;max-width:90vw;font-size:14px;box-shadow:0 6px 20px rgba(0,0,0,.3)}

/* ---------- print ---------- */
#print{display:none}
@page{size:A4 portrait;margin:11mm}
@page land{size:A4 landscape;margin:9mm}
@media print{
  body{background:#fff}
  body > *:not(#print){display:none!important}
  #print{display:block}
  .page{break-after:page;page-break-after:always}
  .page:last-child{break-after:auto;page-break-after:auto}
  .page.land{page:land}
  .paper{box-shadow:none;padding:0;border-radius:0;overflow:visible;font-size:12.5px}
  .paper h2{font-size:17px}
  .paper h3{font-size:14px;margin:10px 0 4px}
  table.flow td,table.flow th{font-size:11.5px;padding:3px 5px}
  tr,.box,.task{break-inside:avoid}
  /* 白黒印刷用の板書 */
  .board{background:#fff!important;color:#111!important;border:3px solid #111;aspect-ratio:auto;height:108mm;min-height:0;font-size:15px}
  .board .bcol + .bcol{border-color:#999!important}
  .bit.s-aim{border-color:#111}
  .bit.s-sum{border:3px double #111}
  .bit.s-q,.board.v .bit.s-q{border-color:#111}
  .bit.s-card{border-color:#111;background:none}
  .bit.c-yellow,.bit.c-red,.bit.c-blue{color:#111;font-weight:700}
  .board.v .bit.c-yellow,.board.v .bit.c-red,.board.v .bit.c-blue{font-weight:400;text-decoration:underline;text-decoration-thickness:1.5px;text-underline-offset:4px}
  table.rub td,table.rub th{font-size:11px;padding:3px 5px}
  .task{font-size:13px;padding:8px 12px}
  .memo{font-size:11px}
  .memo ol{columns:2;column-gap:8mm}
  .memo h3{margin:6px 0 2px}
  .sheet .lines div{border-color:#555}
  .hgrid.n2,.hgrid.n4{height:272mm}
  .hgrid.n4 .hcard{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap" id="app">
  <header class="top">
    <h1>授業プランノート</h1>
    <span class="ver">ver 1.7</span>
    <a class="ver" id="topLink" href="../index.html" hidden>ツール一覧へ</a>
    <span class="cur" id="curTitle"></span>
    <span class="state" id="saveState" hidden></span>
    <span class="state" id="clState" hidden></span>
    <div class="tools">
      <button class="btn primary" id="bNew">＋ 新しい単元</button>
      <button class="btn" id="bOpen">ファイルを開く</button>
      <button class="btn" id="bPaste">貼り付けて読み込む</button>
      <button class="btn" id="bSave" disabled>保存</button>
      <button class="btn" id="bEdit" disabled>修正する</button>
      <button class="btn" id="bPrint" disabled>印刷・PDF</button>
      <button class="btn" id="bWord" disabled>Wordで書き出し</button>
      <button class="btn" id="bSettings">設定</button>
      <button class="btn" id="bHelp">使い方</button>
    </div>
  </header>
  <div class="layout">
    <aside class="side">
      <h2>このパソコンに保存したプラン</h2>
      <p class="hint">修正すると自動でここにも保存されます。OneDriveへの保存は「保存」ボタンで行ってください。</p>
      <ul class="lib" id="lib"></ul>
    </aside>
    <main class="main" id="main"></main>
  </div>
</div>
<div id="print"></div>
<input type="file" id="fileIn" accept=".json,application/json" hidden>

<script>
"use strict";
const APP_VER = "1.7";
const SUBJECTS = ["国語","社会","算数","理科","生活","音楽","図画工作","家庭","体育"];
const SUBJECT_GRADES = {国語:[1,2,3,4,5,6],社会:[3,4,5,6],算数:[1,2,3,4,5,6],理科:[3,4,5,6],生活:[1,2],音楽:[1,2,3,4,5,6],図画工作:[1,2,3,4,5,6],家庭:[5,6],体育:[1,2,3,4,5,6]};
const DEFAULT_PUB = {国語:"光村図書",社会:"東京書籍",算数:"学校図書",理科:"学校図書",生活:"光村図書",音楽:"教育芸術社",図画工作:"日本文教出版",家庭:"東京書籍",体育:"東京書籍"};
const VIEWS = [["k","知識・技能","知"],["t","思考・判断・表現","思"],["a","主体的に学習に取り組む態度","態"]];
const BOARD_STYLES = [["normal","ふつう"],["title","題名"],["date","日付"],["aim","めあて"],["q","問題・発問"],["key","大事な言葉"],["card","掲示物"],["sum","まとめ"],["note","メモ・補足"]];
const BOARD_COLORS = [["","白"],["yellow","黄"],["red","赤"],["blue","青"]];

/* ================= storage helpers (失敗しても動くように) ================= */
function lsGet(k,def){try{const v=localStorage.getItem(k);return v==null?def:JSON.parse(v);}catch(e){return def;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));return true;}catch(e){return false;}}
const settings = Object.assign({pub:Object.assign({},DEFAULT_PUB),school:"",teacher:""}, lsGet("lpn.settings",{}));
settings.pub = Object.assign({},DEFAULT_PUB,settings.pub||{});

/* ================= state ================= */
let plan = null, EDIT = false, STATIC = false;
let tab = "unit", hourIdx = 0, reflectMode = "hour";
let fileHandle = null, fileDirty = false, saveTimer = null;
// claude.ai の中で開いているときだけ使える機能（プランの自動作成・ファイルの保存）
const IN_CLAUDE = !!window.claude;
const CL = {sample:null, downloads:null, state:IN_CLAUDE?"checking":"none", ready:null};
let REFS = null;
const CLAUDE_URL = "https://claude.ai/artifact/TSnVV4ZH3SA1ZwYVYfmT8Z";
if(IN_CLAUDE){
  try{
    CL.ready = window.claude.use("sample").then(x=>{CL.sample=x; CL.state=x?"ok":"none"; render(); return x;}).catch(()=>{CL.state="none"; render(); return null;});
    window.claude.use("downloads").then(x=>{CL.downloads=x;}).catch(()=>{});
  }catch(e){}
  fetch("refs.json").then(r=>r.ok?r.json():null).then(j=>{REFS=j;}).catch(()=>{});
}

/* ================= utils ================= */
const $ = s => document.querySelector(s);
function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}
// {漢字|かんじ} → ふりがな
function rich(s){return esc(s).replace(/\{([^{}|\n]+)\|([^{}|\n]+)\}/g,"<ruby>$1<rt>$2</rt></ruby>");}
function plainText(s){return String(s??"").replace(/\{([^{}|\n]+)\|([^{}|\n]+)\}/g,"$1");}
function newId(){return "p"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function getP(path){return path.split(".").reduce((o,k)=>o==null?undefined:o[k],plan);}
function setP(path,v){const ks=path.split(".");let o=plan;for(let i=0;i<ks.length-1;i++){if(o[ks[i]]==null)o[ks[i]]={};o=o[ks[i]];}o[ks[ks.length-1]]=v;}
function toast(msg,ms=3200){const t=document.createElement("div");t.className="toast";t.textContent=msg;document.body.appendChild(t);setTimeout(()=>t.remove(),ms);}
function gradeNum(){return parseInt(plan?.meta?.grade,10)||3;}
function band(){const g=gradeNum();return g<=2?"low":g<=4?"mid":"high";}
function nowStr(){const d=new Date();return `${d.getFullYear()}/${d.getMonth()+1}/${d.getDate()} ${d.getHours()}:${String(d.getMinutes()).padStart(2,"0")}`;}
function planName(p=plan){return `${p.meta.grade}年 ${p.meta.subject}「${plainText(p.meta.unit)}」`;}
function fileBase(p=plan){return `${p.meta.grade}年_${p.meta.subject}_${plainText(p.meta.unit)}`.replace(/[\\/:*?"<>|\s]+/g,"_");}

/* ================= data model ================= */
function blank(kind){
  switch(kind){
    case "step": return {time:"",act:"",react:"",note:"",eval:""};
    case "row": return {hour:"",act:"",k:"",t:"",a:"",method:""};
    case "item": return {style:"normal",color:"",text:""};
    case "col": return {items:[blank("item")]};
    case "rubric": return {view:"",A:"",B:"",C:""};
    case "sec": return {heading:"",lines:4};
    case "handout": return {title:"",body:"",lines:3,perPage:1};
    case "lesson": return {title:"",objective:"",aim:"",materials:"",steps:[blank("step")],summary:"",board:{dir:"",columns:[blank("col")],notes:""},reflect:{selfEval:[],prompts:[]}};
    default: return "";
  }
}
function defaultReflect(b){
  if(b==="low") return {selfEval:["めあてに むかって がんばれた","ともだちの はなしを よく きけた"],prompts:["きょう わかったこと・できたこと","つぎに やってみたいこと"]};
  if(b==="mid") return {selfEval:["めあてに向かって学習できた","自分の考えをもつことができた","友だちの考えを聞いて、考えを広げられた"],prompts:["今日の学習で分かったこと","友だちの考えから学んだこと・次にやってみたいこと"]};
  return {selfEval:["めあてを達成できた","根拠をもって自分の考えを書いたり話したりできた","友達の考えと比べて、考えを深められた"],prompts:["今日の学習で分かったこと・考えたこと（めあてに対して）","友達の考えから気づいたこと・次の学習に生かしたいこと"]};
}
function defaultUnitReflect(b){
  if(b==="low") return {before:"この がくしゅうで やってみたいこと",after:"この がくしゅうで できるように なったこと"};
  if(b==="mid") return {before:"この単元で知っていること・やってみたいこと",after:"この単元で分かったこと・できるようになったこと"};
  return {before:"単元のはじめに：知っていること・学習してみたいこと",after:"単元のおわりに：分かったこと・できるようになったこと・これから生かしたいこと"};
}
function S(v){return v==null?"":String(v);}
function normalize(src){
  const p = (src && typeof src==="object") ? src : {};
  const m = p.meta||{};
  const d = {app:"lesson-planner",format:1,id:p.id||newId(),createdAt:p.createdAt||nowStr(),updatedAt:p.updatedAt||nowStr(),
    meta:{grade:S(m.grade).replace(/年$/,""),subject:S(m.subject),unit:S(m.unit),publisher:S(m.publisher),hours:0,pages:S(m.pages),period:S(m.period),material:S(m.material),note:S(m.note)},
    goals:{k:"",t:"",a:""},criteria:{k:"",t:"",a:""},plan:[],lessons:[],unitReflect:{},pt:{}};
  for(const [k] of VIEWS){d.goals[k]=S(p.goals?.[k]);d.criteria[k]=S(p.criteria?.[k]);}
  d.plan = (Array.isArray(p.plan)?p.plan:[]).map(r=>({hour:S(r.hour),act:S(r.act),k:S(r.k),t:S(r.t),a:S(r.a),method:S(r.method)}));
  const ls = Array.isArray(p.lessons)?p.lessons:[];
  const n = Math.max(ls.length, parseInt(m.hours,10)||0, 1);
  for(let i=0;i<n;i++){
    const L = ls[i]||{};
    const b = L.board||{};
    let cols = Array.isArray(b.columns)?b.columns:[];
    d.lessons.push({
      title:S(L.title),objective:S(L.objective),aim:S(L.aim),materials:S(L.materials),summary:S(L.summary),
      steps:(Array.isArray(L.steps)&&L.steps.length?L.steps:[{}]).map(s=>({time:S(s.time),act:S(s.act),react:S(s.react),note:S(s.note),eval:S(s.eval)})),
      board:{dir:["v","h"].includes(b.dir)?b.dir:"",notes:S(b.notes),
        columns:(cols.length?cols:[{}]).map(c=>({items:(Array.isArray(c.items)&&c.items.length?c.items:[{}]).map(it=>({style:BOARD_STYLES.some(x=>x[0]===it.style)?it.style:"normal",color:BOARD_COLORS.some(x=>x[0]===(it.color||""))?(it.color||""):"",text:S(it.text)}))}))},
      reflect:{selfEval:Array.isArray(L.reflect?.selfEval)?L.reflect.selfEval.map(S):[],prompts:Array.isArray(L.reflect?.prompts)?L.reflect.prompts.map(S):[]}
    });
  }
  d.meta.hours = d.lessons.length;
  d.unitReflect = {before:S(p.unitReflect?.before),after:S(p.unitReflect?.after)};
  const pt = p.pt||{};
  d.pt = {mode:["none","together","own"].includes(pt.mode)?pt.mode:"none",ownPlan:S(pt.ownPlan),title:S(pt.title),task:S(pt.task),placement:S(pt.placement),
    rubric:(Array.isArray(pt.rubric)?pt.rubric:[]).map(r=>({view:S(r.view),A:S(r.A),B:S(r.B),C:S(r.C)})),
    sheet:{title:S(pt.sheet?.title),intro:S(pt.sheet?.intro),sections:(Array.isArray(pt.sheet?.sections)?pt.sheet.sections:[]).map(s=>({heading:S(s.heading),lines:Math.min(20,Math.max(1,parseInt(s.lines,10)||4))}))},
    handouts:(Array.isArray(pt.handouts)?pt.handouts:[]).map(h=>({title:S(h.title),body:S(h.body),lines:Math.min(20,Math.max(0,parseInt(h.lines,10)||0)),perPage:[1,2,4].includes(+h.perPage)?+h.perPage:1}))};
  return d;
}
function fillDefaults(d){
  // 振り返りの項目が空なら、学年に合わせた標準の項目を入れる
  const b = (parseInt(d.meta.grade,10)||3)<=2?"low":(parseInt(d.meta.grade,10)||3)<=4?"mid":"high";
  const def = defaultReflect(b);
  d.lessons.forEach(L=>{if(!L.reflect.selfEval.length)L.reflect.selfEval=[...def.selfEval];if(!L.reflect.prompts.length)L.reflect.prompts=[...def.prompts];});
  const u = defaultUnitReflect(b);
  if(!d.unitReflect.before)d.unitReflect.before=u.before;
  if(!d.unitReflect.after)d.unitReflect.after=u.after;
  return d;
}

/* ================= library (ブラウザ内保存) ================= */
function libLoad(){return lsGet("lpn.library",{});}
function libPut(p){const lib=libLoad();lib[p.id]=p;if(!lsSet("lpn.library",lib))toast("このパソコンへの自動保存ができませんでした。「保存」ボタンでファイルに保存してください。");renderLib();}
function libDel(id){const lib=libLoad();delete lib[id];lsSet("lpn.library",lib);renderLib();}
function renderLib(){
  const lib = libLoad();
  const arr = Object.values(lib).sort((a,b)=>String(b.updatedAt).localeCompare(String(a.updatedAt),"ja",{numeric:true}));
  $("#lib").innerHTML = arr.length ? arr.map(p=>`<li><button class="open ${plan&&plan.id===p.id?"cur":""}" data-lib="${esc(p.id)}"><b>${esc(planName(p))}</b><small>${esc(p.meta.hours)}時間・${esc(p.updatedAt)}</small></button><button class="del" data-libdel="${esc(p.id)}" title="このパソコンから削除">×</button></li>`).join("")
    : `<li class="hint" style="font-size:12px;color:var(--ink-soft)">まだありません</li>`;
}

/* ================= load / change ================= */
function loadPlan(p,{handle=null,fromFile=false}={}){
  plan = fillDefaults(normalize(p));
  fileHandle = handle; fileDirty = !fromFile; EDIT=false; tab="unit"; hourIdx=0;
  libPut(plan);
  render();
}
function changed(){
  if(!plan)return;
  plan.updatedAt = nowStr(); plan.meta.hours = plan.lessons.length;
  fileDirty = true; updateState();
  clearTimeout(saveTimer); saveTimer = setTimeout(()=>libPut(plan),600);
}
function updateState(){
  const c=$("#clState");
  if(IN_CLAUDE){ c.hidden=false; c.textContent = CL.state==="ok"?"Claude：使えます":CL.state==="checking"?"Claude：確認中…":"Claude：この開き方では使えません"; c.className="state"+(CL.state==="none"?" dirty":""); }
  const s=$("#saveState");
  if(!plan){s.hidden=true;return;}
  s.hidden=false;
  s.className="state"+(fileDirty?" dirty":"");
  s.textContent = fileDirty ? "ファイルに未保存の変更あり" : "ファイルに保存済み";
}

/* ================= render helpers ================= */
function ed(path,{tag="div",cls="",ph="（入力）",live=false}={}){
  const v = getP(path) ?? "";
  if(STATIC||!EDIT) return `<${tag} class="tx ${cls}">${rich(v)}</${tag}>`;
  return `<${tag} class="ed tx ${cls}" contenteditable="plaintext-only" spellcheck="false" data-path="${path}" data-ph="${esc(ph)}"${live?' data-live="1"':""}>${esc(v)}</${tag}>`;
}
function ops(list,i,kind,{move=true}={}){
  if(STATIC||!EDIT) return "";
  const col = kind==="col";
  return `<span class="ops"><button data-op="add" data-list="${list}" data-i="${i}" data-kind="${kind}" title="${col?"次に列を追加":"下に追加"}">${col?"＋列":"＋行"}</button><button data-op="del" data-list="${list}" data-i="${i}" title="削除">${col?"列を削除":"削除"}</button>${move?`<button data-op="up" data-list="${list}" data-i="${i}" title="前へ">↑</button><button data-op="down" data-list="${list}" data-i="${i}" title="後へ">↓</button>`:""}</span>`;
}
function addFirst(list,kind,label="＋ 追加"){
  if(STATIC||!EDIT) return "";
  return `<button class="addrow" data-op="add" data-list="${list}" data-i="-1" data-kind="${kind}">${label}</button>`;
}
function mark(path){
  const v=getP(path)||"";
  if(STATIC||!EDIT) return esc(v);
  return `<button class="mark" data-cycle="${path}" title="クリックで　なし→○→◎">${esc(v)||"・"}</button>`;
}
function sel(path,options,cur){
  return `<select data-set="${path}">${options.map(([v,l])=>`<option value="${esc(v)}"${v===cur?" selected":""}>${esc(l)}</option>`).join("")}</select>`;
}

/* ================= 板書計画 ================= */
function isVert(L){return L.board.dir? L.board.dir==="v" : plan.meta.subject==="国語";}
function boardHTML(i){
  const L=plan.lessons[i], v=isVert(L);
  const cols=L.board.columns;
  const inner = cols.map(c=>`<div class="bcol">${c.items.map(it=>{
      const chip = it.style==="aim"?'<span class="chip">め</span>':it.style==="sum"?'<span class="chip">ま</span>':"";
      return `<div class="bit s-${it.style} c-${it.color}">${chip}${rich(it.text)}</div>`;}).join("")}</div>`).join("");
  const empty = cols.every(c=>c.items.every(it=>!it.text.trim()));
  return `<div class="board ${v?"v":"h"}" id="boardPreview">${empty?'<div class="empty">（板書の内容がまだありません）</div>':inner}</div>`;
}
function posName(ci,n,v){
  if(n===1)return "全体";
  const sides = v?["右","左"]:["左","右"];
  if(ci===0)return sides[0]+"端";
  if(ci===n-1)return sides[1]+"端";
  return n===3?"中央":`${v?"右":"左"}から${ci+1}列目`;
}
function memoHTML(i){
  const L=plan.lessons[i], v=isVert(L), cols=L.board.columns;
  let k=0; const lis=[];
  cols.forEach((c,ci)=>c.items.forEach(it=>{
    if(!it.text.trim())return; k++;
    const sty = it.style==="normal"?"":BOARD_STYLES.find(x=>x[0]===it.style)[1];
    const col = it.color?`（${BOARD_COLORS.find(x=>x[0]===it.color)[1]}チョーク）`:"";
    lis.push(`<li><b>［${posName(ci,cols.length,v)}］${sty}</b>${col}：${rich(it.text).replace(/\n/g," ／ ")}</li>`);
  }));
  return `<div class="memo"><h3>板書メモ（書く順番）　<span class="muted">${v?"縦書き・右から左へ":"横書き・左から右へ"}</span></h3>
    ${lis.length?`<ol>${lis.join("")}</ol>`:'<p class="muted">（まだありません）</p>'}
    ${(L.board.notes||EDIT&&!STATIC)?`<h3>留意点</h3>${ed(`lessons.${i}.board.notes`,{ph:"チョークの色、掲示物、子どもの考えを書く場所など",live:true})}`:""}</div>`;
}
function boardEditor(i){
  const L=plan.lessons[i], p=`lessons.${i}.board`, v=isVert(L);
  return `<div class="bedit">
    <div class="row" style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><b>板書の修正</b>
      書き方：${sel(p+".dir",[["","教科に合わせる（国語は縦）"],["v","縦書き"],["h","横書き"]],L.board.dir)}
      <span class="muted">列は${v?"右":"左"}から順に並びます。</span></div>
    ${L.board.columns.map((c,ci)=>`<div class="col"><b>${ci+1}列目（${posName(ci,L.board.columns.length,v)}）</b>
      ${ops(p+".columns",ci,"col")}
      ${c.items.map((it,ii)=>`<div class="item"><div class="ctl">${sel(`${p}.columns.${ci}.items.${ii}.style`,BOARD_STYLES,it.style)}${sel(`${p}.columns.${ci}.items.${ii}.color`,BOARD_COLORS,it.color)}</div>
        <div>${ed(`${p}.columns.${ci}.items.${ii}.text`,{ph:"板書する言葉",live:true})}${ops(`${p}.columns.${ci}.items`,ii,"item")}</div></div>`).join("")}
      ${addFirst(`${p}.columns.${ci}.items`,"item","＋ 先頭に追加")}
    </div>`).join("")}
    ${addFirst(p+".columns","col","＋ 列を先頭に追加")}
  </div>`;
}
function renderBoard(i){
  const m=plan.meta, L=plan.lessons[i];
  return `<div class="paper">
    <h2>板書計画　第${i+1}時／全${m.hours}時　<span style="font-size:14px;font-weight:400">${esc(m.grade)}年 ${esc(m.subject)}「${rich(m.unit)}」　${rich(L.title)}</span></h2>
    ${boardHTML(i)}
    ${memoHTML(i)}
    ${(!STATIC&&EDIT)?boardEditor(i):""}
  </div>`;
}

/* ================= 振り返りシート ================= */
const FACES = [["にこにこ","M10 21 Q17 28 24 21"],["まあまあ","M11 23 L23 23"],["もうすこし","M10 25 Q17 19 24 25"]];
function faceSVG(d){return `<svg viewBox="0 0 34 34"><circle cx="17" cy="17" r="15" fill="none" stroke="#111" stroke-width="1.6"/><circle cx="12" cy="14" r="1.8" fill="#111"/><circle cx="22" cy="14" r="1.8" fill="#111"/><path d="${d}" fill="none" stroke="#111" stroke-width="1.8" stroke-linecap="round"/></svg>`;}
function scaleHTML(b,compact=false){
  if(b==="low") return FACES.map(([n,d])=>`<span class="face">${faceSVG(d)}${compact?"":n}</span>`).join("");
  return `<span class="marks"><span>◎</span><span>○</span><span>△</span></span>`;
}
function lines(n){return `<div class="lines">${"<div></div>".repeat(n)}</div>`;}
function sheetHead(title){
  const b=band();
  const nm = b==="low"?"なまえ":"名前";
  const md = `<span></span>がつ<span></span>にち`;
  return `<div class="shead"><div class="stitle">${title}</div><div class="sname">${b==="low"?md:'<span></span>月<span></span>日'}　<span></span>${b==="low"?"ねん":"年"}<span></span>${b==="low"?"くみ":"組"}　${nm}<span class="nm"></span></div></div>`;
}
function renderReflectHour(i){
  const L=plan.lessons[i], m=plan.meta, b=band(), p=`lessons.${i}.reflect`;
  const nLines = b==="low"?3:b==="mid"?4:4;
  const title = `${b==="low"?"ふりかえりシート":"振り返りシート"}　<span style="font-size:15px;font-weight:400">${esc(m.subject)}「${rich(m.unit)}」　第${i+1}時</span>`;
  return `<div class="paper sheet ${b}">

  if(s){setP(s.dataset.set,s.value);changed();render();return;}
  if(e.target.id==="hourSel"){hourIdx=+e.target.value;render();return;}

document.addEventListener("click",async e=>{
  const t=e.target;
  const tb=t.closest("[data-tab]"); if(tb){tab=tb.dataset.tab;render();window.scrollTo({top:0});return;}
  const hb=t.closest("[data-hour]"); if(hb){hourIdx=Math.max(0,Math.min(plan.lessons.length-1,hourIdx+(+hb.dataset.hour)));render();return;}
  const op=t.closest("[data-op]");
  if(op){
    const list=getP(op.dataset.list); const i=+op.dataset.i;
    switch(op.dataset.op){
      case "add": list.splice(i+1,0,blank(op.dataset.kind)); break;
      case "del": if(!await ask("削除しますか？"))return; list.splice(i,1); break;
      case "up": if(i>0)[list[i-1],list[i]]=[list[i],list[i-1]]; break;
      case "down": if(i<list.length-1)[list[i+1],list[i]]=[list[i],list[i+1]]; break;
    }
    changed();render();return;
  }
  const cy=t.closest("[data-cycle]");
  if(cy){const v=getP(cy.dataset.cycle)||"";setP(cy.dataset.cycle,v===""?"○":v==="○"?"◎":"");changed();render();return;}
  const pm=t.closest("[data-ptmode]");
  if(pm){
    if(pm.dataset.ptmode==="none"){if(!await ask("パフォーマンス課題を使わない設定にしますか？（書いた内容は残ります）"))return;plan.pt.mode="none";}
    else{plan.pt.mode="together";if(!plan.pt.rubric.length)plan.pt.rubric=[{view:"思考・判断・表現",A:"",B:"",C:""}];if(!plan.pt.sheet.sections.length)plan.pt.sheet.sections=[blank("sec")];}
    changed();render();return;
  }
  if(t.id==="regenLesson"){regenLesson(hourIdx);return;}
  if(t.id==="addLesson"){const L=blank("lesson"),def=defaultReflect(band());L.reflect={selfEval:[...def.selfEval],prompts:[...def.prompts]};plan.lessons.splice(hourIdx+1,0,L);hourIdx++;changed();render();toast("時間を追加しました。単元計画の表も必要に応じて直してください。");return;}
  if(t.id==="delLesson"){if(plan.lessons.length<=1)return;if(!await ask(`第${hourIdx+1}時を削除しますか？（あとの時間が1つずつ前にずれます）`))return;plan.lessons.splice(hourIdx,1);hourIdx=Math.max(0,hourIdx-1);changed();render();return;}
  const lb=t.closest("[data-lib]");
  if(lb){const p=libLoad()[lb.dataset.lib];if(p){if(plan&&fileDirty&&plan.id!==p.id&&!await ask("今のプランにファイル未保存の変更があります（このパソコンには残っています）。切り替えますか？"))return;loadPlan(p);fileDirty=false;updateState();}return;}
  const ld=t.closest("[data-libdel]");
  if(ld){const p=libLoad()[ld.dataset.libdel];if(p&&await ask(`「${planName(p)}」をこのパソコンの一覧から削除しますか？\n（OneDrive に保存したファイルは消えません）`)){libDel(p.id);if(plan&&plan.id===p.id){plan=null;render();}}return;}
});

function say(msg){
  modal(`<h2>お知らせ</h2><p style="margin:0;white-space:pre-wrap">${esc(msg)}</p><div class="foot"><button class="btn primary" data-close>OK</button></div>`);
}
// confirm() の代わり（claude.ai の中では confirm() が使えないため）
function ask(msg,okLabel="はい"){
  return new Promise(res=>{
    const m=modal(`<h2>確認</h2><p style="margin:0;white-space:pre-wrap">${esc(msg)}</p><div class="foot"><button class="btn" data-close>いいえ</button><button class="btn primary" data-ok>${esc(okLabel)}</button></div>`);
    let done=false;const fin=v=>{if(!done){done=true;res(v);}};
    m.querySelector("[data-ok]").onclick=()=>{m.remove();fin(true);};
    m.addEventListener("click",e=>{if(e.target===m||e.target.closest("[data-close]"))fin(false);});
  });
}

function modal(html,{lock=false}={}){
  const m=document.createElement("div");m.className="modal";m.innerHTML=`<div class="card">${html}</div>`;
  m.addEventListener("click",e=>{if((!lock&&e.target===m)||e.target.closest("[data-close]"))m.remove();});
  document.body.appendChild(m);return m;
}

function parseLoose(text){
  let t=String(text).trim().replace(/^﻿/,"");
  const a=t.indexOf("{"), b=t.lastIndexOf("}");
  if(a<0||b<a) throw new Error("プランのデータが見つかりません");
  return JSON.parse(t.slice(a,b+1));
}
function checkPlan(obj){
  if(!obj||typeof obj!=="object"||!obj.meta||!Array.isArray(obj.lessons)) throw new Error("授業プランノートのデータではないようです");
  return obj;
}

async function download(name,data,type){
  if(IN_CLAUDE){
    if(!CL.downloads){say("この画面ではファイルを保存できませんでした。少し待ってから、もう一度押してください。");return false;}
    try{ await CL.downloads.save({filename:name,data:data instanceof Blob?data:new Blob([data],{type})}); return true; }
    catch(e){ if(e&&e.code!=="declined") say("保存できませんでした（"+(e&&e.code||"不明なエラー")+"）。"); return false; }
  }
  const blob=data instanceof Blob?data:new Blob([data],{type});
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();

const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0;}return t;})();
function crc32(u){let c=0xFFFFFFFF;for(let i=0;i<u.length;i++)c=CRC_T[(c^u[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0;}
function zipStore(files){
  const enc=new TextEncoder(), parts=[], cd=[]; let off=0;
  for(const f of files){
    const name=enc.encode(f.name), data=typeof f.data==="string"?enc.encode(f.data):f.data, crc=crc32(data);
    const h=new DataView(new ArrayBuffer(30));
    h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(8,0,true);h.setUint16(10,0,true);h.setUint16(12,33,true);
    h.setUint32(14,crc,true);h.setUint32(18,data.length,true);h.setUint32(22,data.length,true);h.setUint16(26,name.length,true);h.setUint16(28,0,true);
    parts.push(new Uint8Array(h.buffer),name,data);
    const c=new DataView(new ArrayBuffer(46));
    c.setUint32(0,0x02014b50,true);c.setUint16(4,20,true);c.setUint16(6,20,true);c.setUint16(8,0x0800,true);c.setUint16(10,0,true);c.setUint16(12,0,true);c.setUint16(14,33,true);
    c.setUint32(16,crc,true);c.setUint32(20,data.length,true);c.setUint32(24,data.length,true);c.setUint16(28,name.length,true);
    c.setUint16(30,0,true);c.setUint16(32,0,true);c.setUint16(34,0,true);c.setUint16(36,0,true);c.setUint32(38,0,true);c.setUint32(42,off,true);
    cd.push(new Uint8Array(c.buffer),name);
    off+=30+name.length+data.length;
  }
  const cdSize=cd.reduce((s,x)=>s+x.length,0);
  const e=new DataView(new ArrayBuffer(22));
  e.setUint32(0,0x06054b50,true);e.setUint16(8,files.length,true);e.setUint16(10,files.length,true);e.setUint32(12,cdSize,true);e.setUint32(16,off,true);
  return new Blob([...parts,...cd,new Uint8Array(e.buffer)],{type:"application/vnd.openxmlformats-officedocument.wordprocessingml.document"});
}
function x(s){return plainText(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])).replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F]/g,"");}

const GEN_RULES = `【作成のきまり】
・小学校学習指導要領（平成29年告示）と、国立教育政策研究所「『指導と評価の一体化』のための学習評価に関する参考資料」に沿って作る。
・単元の目標は、〔知識及び技能〕〔思考力，判断力，表現力等〕の指導事項（記号つき。例：(1)ク、C(1)エ）と、学びに向かう力，人間性等の3つ。
・評価規準：「知識・技能」「思考・判断・表現」は、指導事項の文末を「〜している。」にして作る（指導事項の一部を用いてもよい）。国語の「思考・判断・表現」は冒頭に「『読むこと』において，」のように領域名を付ける。
・「主体的に学習に取り組む態度」は、①粘り強さ（粘り強く、進んで等）②自らの学習の調整（学習の見通しをもって、学習課題に沿って等）③他の観点で重点とする内容 ④単元の言語活動・学習活動 を組み合わせ、文末を「〜しようとしている。」にする。
・記録に残す評価（◎）は場面をしぼる（各観点1〜2回程度、単元の後半が中心）。○は指導に生かす評価。
・「主体的に学習に取り組む態度」は、振り返りの記述などから複数の時間で見取る。「思考・判断・表現」は、交流したあとに書いたものなどで評価する。
・評価規準ごとに、B（おおむね満足）の具体的な姿、A（十分満足）の姿、Cの子への手だてを考える。
・1時間は45分。本時の展開の時間の合計を必ず45分にする。
・教科書の本文や問題はそのまま書き写さず、「教科書p.○」のようにページで示す。
・子どもが読む言葉（めあて・振り返り・課題文）は学年に合わせる。1・2年はひらがな中心、3・4年は習っていない漢字に {漢字|かんじ} の形でふりがなを付ける。
・パフォーマンス課題は、場面・役割・相手・目的が分かる子ども向けの課題文と、A・B・Cのルーブリック（Cは「Cの子への手だて」）を作る。`;
function refExcerpt(r){
  const t = REFS?.nenkei?.[r.subject+r.grade];
  if(!t) return "";
  const key = r.unit.replace(/[「」『』\s]/g,"");
  let i = t.indexOf(key);
  if(i<0 && key.length>4) i = t.indexOf(key.slice(0,4));
  if(i<0) return "";
  return t.slice(Math.max(0,i-300), i+3800);
}
function basicInfo(r){
  return `・学年：${r.grade}年\n・教科：${r.subject}（教科書：${r.publisher||"不明"}${r.pages?"　"+r.pages:""}）\n・単元：${r.unit}\n・総時数：${r.hours}時間（1時間45分）${r.period?"\n・実施時期："+r.period:""}${r.wish?"\n・先生の希望："+r.wish:""}`;
}

function genModal(){

    <p class="help" style="margin:0">全部できるまで数分かかります。この画面を閉じずにお待ちください。</p>

  m.querySelector("#gStop").onclick = ()=>{ genCtl?.abort(); };

    now(txt){ m.querySelector("#gNow").textContent=txt; },
    close(){ m.remove(); }
  };
}
function genErrText(e){
  const c = e?.code;
  if(c==="cancelled") return "とめました。";
  if(c==="not_granted"||c==="sampling_disabled") return "Claude を使う許可がないため、作れませんでした。";
  if(c==="rate_limited") return "Claude の利用が混み合っているか、利用の上限に達しました。しばらく待ってから、もう一度ためしてください。";
  if(c==="session_expired") return "claude.ai のログインが切れました。ログインし直してから、もう一度ためしてください。";
  if(c==="invalid_json") return "Claude の返事をプランの形に読み取れませんでした。もう一度ためしてください。";
  if(c==="prompt_too_large") return "資料が長すぎて送れませんでした。";
  return "うまく作れませんでした（"+(c||"不明なエラー")+"）。もう一度ためしてください。";
}

    const m = modal(`<h2>パフォーマンス課題の案</h2><p class="help" style="margin:0">使う案を選んでください。選んだあと、下の欄で直すこともできます。</p>

    const ta = m.querySelector("#ptEdit");

k・t・a の欄には "◎" "○" "" のどれかを入れる。`;

async function genLessons(r, unit, from, to, signal){
  const arr = await CL.sample.json(lessonPrompt(r, unit, from, to), {signal, modelTier:"complex", cache:false});

}
async function genFlow(r){
  let ptText = "";
  if(r.pt==="together"){ ptText = await askPT(r); if(!ptText) return; }
  else if(r.pt==="own") ptText = r.own;
  const g = genModal();
  genCtl = new AbortController();
  const sig = genCtl.signal;
  let unit;
  const s1 = g.step("単元計画（目標・評価規準・指導と評価の計画）");
  g.now("単元計画を考えています（1〜3分）…");
  try{
    unit = await CL.sample.json(unitPrompt(r, ptText), {signal:sig, modelTier:"complex", cache:false});
    if(!unit||!Array.isArray(unit.plan)) throw {code:"invalid_json"};
  }catch(e){ g.close(); say(genErrText(e)); return; }
  s1.textContent += "　…できました";
  // 本時は2時間ずつ、2つ同時に作る
  const lessons = new Array(r.hours).fill(null);
  const batches = []; for(let i=0;i<r.hours;i+=2) batches.push([i, Math.min(i+1, r.hours-1)]);
  const failed = [];
  let left = batches.length;
  g.now(`本時の流れ・板書・振り返りを作っています（残り ${left} 回分）…`);
  const run = async ([a,b])=>{
    const li = g.step(`第${a+1}${a===b?"":"・"+(b+1)}時の本時の流れ・板書・振り返り`);
    try{
      const arr = await genLessons(r, unit, a, b, sig);
      for(let k=a;k<=b;k++) lessons[k] = arr[k-a] || null;
      li.textContent += "　…できました";
    }catch(e){
      if(e?.code==="cancelled") throw e;
      for(let k=a;k<=b;k++) failed.push(k+1);
      li.textContent += "　…作れませんでした";
    }
    left--; g.now(left?`本時の流れ・板書・振り返りを作っています（残り ${left} 回分）…`:"仕上げています…");
  };
  try{
    const queue = batches.slice();
    const worker = async ()=>{ while(queue.length){ await run(queue.shift()); } };
    await Promise.all([worker(), worker()]);
  }catch(e){
    if(e?.code==="cancelled"){ g.close(); say("とめました。作りかけのプランは使いません。"); return; }
  }
  g.close();
  const pt = r.pt==="none" ? {mode:"none"} : Object.assign({mode:r.pt, ownPlan:r.pt==="own"?r.own:""}, unit.pt||{});
  loadPlan({
    meta:Object.assign({grade:r.grade, subject:r.subject, unit:r.unit, publisher:r.publisher, hours:r.hours}, unit.meta||{}, r.pages?{pages:r.pages}:{}, r.period?{period:r.period}:{}),
    goals:unit.goals, criteria:unit.criteria, plan:unit.plan, unitReflect:unit.unitReflect,
    lessons:lessons.map(x=>x||{}), pt
  });
  if(failed.length) say(`第${failed.join("・")}時は作れませんでした。その時間を開いて「この時間をClaudeで作り直す」を押すと、もう一度作れます。`);
  else toast("プランができました。中身を確かめて、「保存」で OneDrive に保存してください。",6000);
}
async function regenLesson(i){
  if(!CL.sample||!plan) return;
  if(!await ask(`第${i+1}時の本時の流れ・板書・振り返りを、Claude で作り直しますか？（今の第${i+1}時の内容は置きかわります）`,"作り直す")) return;
  const m=plan.meta;
  const r={grade:m.grade, subject:m.subject, unit:m.unit, hours:plan.lessons.length, publisher:m.publisher, pages:m.pages, period:m.period, wish:""};
  const g = genModal(); genCtl = new AbortController();
  g.step(`第${i+1}時の本時の流れ・板書・振り返り`); g.now("考えています（1〜2分）…");
  try{
    const arr = await genLessons(r, {goals:plan.goals, criteria:plan.criteria, plan:plan.plan, pt:plan.pt.mode==="none"?null:plan.pt}, i, i, genCtl.signal);
    const L = normalize({meta:{hours:1}, lessons:[arr[0]||{}]}).lessons[0];
    if(!L.reflect.selfEval.length||!L.reflect.prompts.length){ const d=defaultReflect(band()); L.reflect={selfEval:L.reflect.selfEval.length?L.reflect.selfEval:[...d.selfEval], prompts:L.reflect.prompts.length?L.reflect.prompts:[...d.prompts]}; }
    plan.lessons[i] = L; changed(); g.close(); render(); toast(`第${i+1}時を作り直しました`);
  }catch(e){ g.close(); say(genErrText(e)); }
}

  <p class="help" style="margin:0">教材用パソコンでは https://chumbasan-glitch.github.io/main/ から開くと、いつも最新版のツールが使えます。プランの中身はインターネット上には保存されません（「保存」でファイルに保存します）。なお、左の一覧（このパソコンに保存したプラン）は、ファイル版とインターネット版で別々です。インターネット版で初めて使うときは、OneDrive のプランのファイルを「ファイルを開く」で一度開いてください。</p>
  <h3 style="margin:0">印刷・iPad で見る</h3>
  <p class="help" style="margin:0">「印刷・PDF」で印刷するものを選びます。PDF にするときはプリンターで「PDFに保存」を選び、OneDrive に保存すると iPad で見られます。iPad の Word で文を直したいときは「Wordで書き出し」を使います（Word で直した内容は、このツールには戻りません）。</p>
  <div class="foot"><button class="btn primary" data-close>閉じる</button></div>`);
}

$("#bNew").onclick=openNew;
$("#bOpen").onclick=openFile;
$("#bPaste").onclick=async()=>{if(plan&&fileDirty&&!await ask("今のプランにファイル未保存の変更があります（このパソコンには残っています）。読み込みますか？"))return;openPaste();};
$("#bSave").onclick=openSave;
$("#bEdit").onclick=()=>{document.activeElement?.blur?.();EDIT=!EDIT;render();};
$("#bPrint").onclick=()=>{document.activeElement?.blur?.();openPrint();};
$("#bWord").onclick=exportWord;
$("#bSettings").onclick=openSettings;
$("#bHelp").onclick=openHelp;
document.addEventListener("keydown",e=>{if((e.ctrlKey||e.metaKey)&&e.key==="s"&&plan){e.preventDefault();openSave();}});

if(/^https?:$/.test(location.protocol)) $("#topLink").hidden=false;
render();
</script>
</body>
</html>
