<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週案ツクール</title>
<style>
:root{
  --bg:#EEF2EC;
  --surface:#FFFFFF;
  --surface-2:#F4F7F2;
  --ink:#1F2B24;
  --ink-soft:#5E6B63;
  --line:#CFD9D1;
  --accent:#2E6B4F;
  --accent-ink:#FFFFFF;
  --accent-soft:#DDEDE3;
  --warn:#9A5B00;
  --warn-soft:#FFF1D6;
  --red:#A8323F;
  --off:#E9ECE8;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","Yu Gothic UI","Yu Gothic","Meiryo",sans-serif;font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;background:var(--accent);color:var(--accent-ink)}
header.top h1{margin:0;font-size:20px;letter-spacing:.08em;font-weight:700}
header.top .cls{font-size:14px;opacity:.9}
header.top .sp{flex:1}
.savebox{display:flex;align-items:center;gap:10px}
.savestate{font-size:12px;opacity:.9}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
header.top .btn.primary{background:#fff;color:var(--accent);border-color:#fff}
.btn.small{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--red)}
nav.tabs{display:flex;gap:4px;padding:8px 16px 0;background:var(--bg);flex-wrap:wrap}
nav.tabs button{border:none;background:transparent;padding:8px 16px;border-radius:8px 8px 0 0;font-weight:700;color:var(--ink-soft)}
nav.tabs button.on{background:var(--surface);color:var(--accent)}
main{background:var(--surface);margin:0 16px 24px;border-radius:0 8px 8px 8px;padding:16px;min-height:60vh}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--ink)}
.hint{color:var(--ink-soft);font-size:12px}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:16px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=date],input[type=number],select,textarea{border:1.5px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 6px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-soft)}
label.f>*{font-size:14px;color:var(--ink)}

/* 週案 */
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.weekbar select{font-weight:700}
.weeklayout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
@media (max-width:1100px){.weeklayout{grid-template-columns:minmax(0,1fr)}}
.gridwrap{overflow-x:auto}
table.wk{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
table.wk th,table.wk td{border:1px solid var(--line);vertical-align:top;padding:4px}
table.wk th.lab{width:44px;background:var(--surface-2);font-size:12px;vertical-align:middle;text-align:center}
table.wk thead th{background:var(--surface-2);font-weight:700;text-align:center;padding:4px 2px}
table.wk thead .dd{display:flex;justify-content:center;align-items:center;gap:6px}
.wd0{color:var(--red)} .wd6{color:#2856A3}
td.off{background:var(--off)}
td.off .slot,td.off .asa{opacity:.45}
.offlab{font-size:11px;color:var(--red);font-weight:700}
textarea.ev,textarea.note{width:100%;min-height:38px;resize:vertical;font-size:12px;padding:3px 4px}
.slot{display:flex;flex-direction:column;gap:3px;border-left:6px solid var(--c,#ddd);padding-left:4px;min-height:84px}
.slot.drag-over{outline:2px dashed var(--accent)}
.slot .sh{display:flex;gap:3px;align-items:center}
.slot .grip{cursor:grab;color:var(--ink-soft);font-size:12px;user-select:none;padding:0 2px}
.slot select.subj{flex:1;min-width:0;font-weight:700;padding:2px;background:var(--cbg,#fff)}
.slot select.unit{width:100%;font-size:12px;padding:2px}
.part{border-left:6px solid var(--c,#ddd);border-top:1.5px dashed var(--line);padding:3px 0 0 4px;margin-left:-10px;display:flex;flex-direction:column;gap:3px}
.part select.psubj{flex:1;min-width:0;font-weight:700;padding:2px;background:var(--cbg,#fff)}
.part input.phr{width:38px;flex:none;font-size:12px;padding:2px 3px;text-align:center}
.part textarea.pct{width:100%;min-height:34px;resize:vertical;font-size:12px;padding:3px 4px}
.part textarea.pct.auto{color:#4C5A52;background:var(--surface-2)}
.part .pdel{border:none;background:transparent;color:var(--red);font-weight:700;padding:0 4px}
.part .plab{font-size:12px;font-weight:700}
.slot .adv{font-size:11px;color:var(--ink-soft);display:flex;gap:3px;align-items:center}
.sh input.warn{border-color:var(--red);background:#FDECEC}
.psplit{align-self:flex-start;margin-top:2px}
.sh input.hr{width:38px;flex:none;font-size:12px;padding:2px 3px;text-align:center}
.asa .sh{display:flex;gap:3px}
.asa .sh select{flex:1;min-width:0}
.slot select.unit.pinned{border-color:var(--accent);font-weight:700}
.slot select.unit.skip{color:var(--ink-soft)}
.slot .tw{position:relative}
.slot textarea.ct{width:100%;min-height:48px;resize:vertical;font-size:12px;padding:3px 4px}
.slot textarea.ct.auto{color:#4C5A52;background:var(--surface-2)}
.slot .rv{position:absolute;right:2px;bottom:4px;border:none;background:var(--accent-soft);border-radius:4px;font-size:11px;padding:0 4px}
.asa{display:flex;flex-direction:column;gap:3px;border-left:6px solid var(--c,#ddd);padding-left:4px}
.asa select{font-size:12px;padding:2px;background:var(--cbg,#fff)}
.asa input{font-size:12px;width:100%;padding:2px 4px}
.memo textarea{width:100%;min-height:54px;resize:vertical}
.side h3{margin-top:0}
table.tot{border-collapse:collapse;width:100%;font-size:13px}
table.tot th,table.tot td{border:1px solid var(--line);padding:2px 6px;text-align:right}
table.tot th{background:var(--surface-2);text-align:center}
table.tot td.n{text-align:left;white-space:nowrap}
table.tot tr.child td.n{padding-left:16px;color:var(--ink-soft);font-size:12px}
table.tot tr.child td{color:var(--ink-soft);font-size:12px}
table.tot tr.sum td{font-weight:700;background:var(--surface-2)}
.neg{color:var(--red);font-weight:700}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}

/* 時間割 */
table.tt{border-collapse:collapse}
table.tt th,table.tt td{border:1px solid var(--line);padding:4px 6px;text-align:center}
table.tt th{background:var(--surface-2)}
table.tt select{width:110px;font-weight:700}

/* 単元計画 */
.subjchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subjchips button{border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}
.subjchips button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.subjchips button small{color:var(--ink-soft);margin-left:4px}
.unitcard{border:1.5px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--surface-2)}
.unitcard .uh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.unitcard .uh input.un{flex:1;min-width:180px;font-weight:700}
.unitcard .uh input.utot{width:60px}
.unitcard textarea{width:100%;min-height:90px;margin-top:6px;font-size:13px;line-height:1.6}
.unitcard.skipped{opacity:.55}
.unitcard .aim{display:block;font-size:12px;color:var(--ink-soft);margin-top:4px}
.unitcard .aim textarea{min-height:40px;font-size:12px}
.unitcard .sched{font-size:12px;color:var(--accent);font-weight:700}
.paste textarea{width:100%;min-height:120px;font-size:12px;font-family:"BIZ UDGothic","MS Gothic",monospace}
.msg{white-space:pre-wrap;font-size:13px;padding:8px 10px;border-radius:6px;background:var(--accent-soft);margin-top:6px}
.msg.err{background:var(--warn-soft);color:var(--warn)}
details.box{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px}
details.box summary{font-weight:700;cursor:pointer}

/* 時数 */
.yrwrap{overflow-x:auto}
table.yr{border-collapse:collapse;font-size:12px}
table.yr th,table.yr td{border:1px solid var(--line);padding:3px 5px;text-align:right;white-space:nowrap}
table.yr th{background:var(--surface-2);text-align:center}
table.yr td.n{text-align:left}
table.yr td.term,table.yr th.term{background:var(--accent-soft);font-weight:700}
table.yr tr.child td{color:var(--ink-soft)}
table.yr tr.sum td{font-weight:700;background:var(--surface-2)}

/* 設定 */
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{border:2px solid var(--line);border-radius:8px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;width:104px}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tp{display:grid;grid-template-columns:1fr 26px;grid-template-rows:10px 1fr;width:90px;height:62px;border:1.5px solid var(--pl);background:#fff}
.tph{grid-column:1 / 3;background:var(--ph);border-bottom:1px solid var(--pl)}
.tpb{background:linear-gradient(to bottom,#fff 0 40%,var(--pb) 40% 55%,#fff 55%);border-right:1px solid var(--pl)}
.tps{display:flex;flex-direction:column}
.tps i{flex:1;border-bottom:1px solid var(--pl)}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-width:900px}
table.subj{border-collapse:collapse;font-size:13px}
table.subj th,table.subj td{border:1px solid var(--line);padding:3px 4px;text-align:center}
table.subj th{background:var(--surface-2)}
table.subj input.nm{width:80px}
table.subj input.h{width:46px;text-align:center}
table.subj input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line)}
table.brk td,table.brk th{padding:3px 4px}
table.brk{border-collapse:collapse}
table.brk th{font-size:12px;color:var(--ink-soft);text-align:left}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.2)}

/* 印刷（B5縦） */
#print{display:none}
@page{size:182mm 257mm;margin:7mm}
@media print{
  body{background:#fff}
  .app{display:none!important}
  #print{display:block}
}
#print{font-family:"BIZ UDPGothic","Yu Gothic","Meiryo",sans-serif;color:#000;width:168mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;
  --pl:#2E8B88;--ph:#CCF5CC;--pb:#FFF0C8;--s1:#FFFFA6;--s2:#CCF5CC;--sub:#99EE99;--tot:#66E066}
#print .ph{height:6mm;font-size:10pt;display:flex;align-items:flex-end;gap:5mm;padding-left:1mm}
#print .ph b{font-size:11pt}
#print .pbody{display:flex;margin-top:1.5mm;border:0.35mm solid var(--pl)}
#print table{border-collapse:collapse;table-layout:fixed}
#print td,#print th{border:0.2mm solid var(--pl);padding:0;overflow:hidden;vertical-align:top}
#print table.pw{width:128mm}
#print table.pw th.l{background:var(--ph);font-weight:400;font-size:7.5pt;text-align:center;vertical-align:middle;line-height:1.1}
#print table.pw th.l.big{font-size:15pt}
#print table.pw thead th{background:var(--ph);font-weight:400;font-size:8pt;text-align:center;vertical-align:middle;line-height:1.15}
#print tr.band td,#print tr.band th{background:var(--pb)}
#print td.sj{font-size:7.5pt;font-weight:700;padding:0 0.8mm;white-space:nowrap;vertical-align:middle;line-height:1}
#print td.hr{font-size:6.5pt;text-align:center;vertical-align:middle;white-space:nowrap;line-height:1}
#print .cb{overflow:hidden;font-size:7pt;line-height:1.28;word-break:break-all;padding:0.4mm 0.7mm;white-space:pre-wrap}
#print .cb .pu{font-weight:700}
#print td.poff{background:#E8E8E8}
#print td.hol,#print tr.band td.hol{background:#FF9FCF}
#print td.emp{background:#D9D9D9}
#print .bigc{display:flex;align-items:center;justify-content:center;font-size:26pt;line-height:1}
#print thead th.hk{font-size:7.5pt}
#print td.spc{padding:0}
#print table.sub{width:100%;border-collapse:collapse;table-layout:fixed;margin:-0.2mm 0 0}
#print table.sub td{border:0.2mm solid var(--pl);border-left:none;border-right:none}
#print table.sub td.hr{border-left:0.2mm solid var(--pl)}
#print .offn{font-weight:700}
#print .side{width:40mm;display:flex;flex-direction:column;border-left:0.35mm solid var(--pl)}
#print table.pt2{width:100%;font-size:6.8pt}
#print table.pt2 th{background:var(--ph);font-weight:400;height:5mm;vertical-align:middle;font-size:7pt}
#print table.pt2 td{height:3.55mm;text-align:center;vertical-align:middle;white-space:nowrap;line-height:1}
#print table.pt2 td.n{text-align:center}
#print table.pt2 tr.r1 td{background:var(--s1)}
#print table.pt2 tr.r2 td{background:var(--s2)}
#print table.pt2 tr.sub td{background:var(--sub)}
#print table.pt2 tr.tot td{background:var(--tot);font-weight:700}
#print table.pt2 tr.gap td{height:0.8mm;background:var(--pl)}
#print .memo{flex:1;padding:0.6mm 1mm;font-size:7.5pt;white-space:pre-wrap;overflow:hidden;border-top:0.35mm solid var(--pl)}
#print .rec{border:0.35mm solid var(--pl);border-top:none;height:25mm;padding:0.6mm 1mm;font-size:7.5pt;white-space:pre-wrap;overflow:hidden}
#print .k{font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>週案ツクール <small id="hdrVer" style="font-size:12px;opacity:.85"></small></h1>
    <span class="cls" id="hdrCls"></span>
    <span class="sp"></span>
    <div class="savebox">
      <span class="savestate" id="saveState"></span>
      <button class="btn primary" id="btnSave" title="Ctrl+S でも保存できます">保存</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="week" class="on">週案</button>
    <button data-tab="tt">時間割</button>
    <button data-tab="units">単元計画</button>
    <button data-tab="hours">時数</button>
    <button data-tab="set">設定</button>
  </nav>
  <main>
    <div id="banners"></div>
    <section id="tab-week"></section>
    <section id="tab-tt" hidden></section>
    <section id="tab-units" hidden></section>
    <section id="tab-hours" hidden></section>
    <section id="tab-set" hidden></section>
  </main>
</div>
<div id="print"></div>
<div id="toast" hidden></div>
<script id="shuan-data" type="application/json">null</script>
<script>
"use strict";
// 保存のとき、このファイルの形をそのまま書き出すため、画面を作る前の状態をとっておく
const PRISTINE = "<!DOCTYPE html>\n" + document.documentElement.outerHTML;
const APP_VER = 2;
const VERSION = "v3";
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD = ["日","月","火","水","木","金","土"];
const CIRC = "①②③④⑤⑥⑦⑧⑨⑩⑪⑫⑬⑭⑮⑯⑰⑱⑲⑳㉑㉒㉓㉔㉕㉖㉗㉘㉙㉚㉛㉜㉝㉞㉟㊱㊲㊳㊴㊵㊶㊷㊸㊹㊺㊻㊼㊽㊾㊿";
const circ = n => n >= 1 && n <= 50 ? CIRC[n - 1] : "(" + n + ")";

/* ---------- 日付 ---------- */
const pad = n => String(n).padStart(2, "0");
const ymd = (y, m, d) => { const t = new Date(y, m - 1, d); return t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate()); };
const parse = s => { const [y, m, d] = s.split("-").map(Number); return new Date(y, m - 1, d); };
const fmt = t => t.getFullYear() + "-" + pad(t.getMonth() + 1) + "-" + pad(t.getDate());
const addDays = (s, n) => { const t = parse(s); t.setDate(t.getDate() + n); return fmt(t); };
const wday = s => parse(s).getDay();
const mondayOf = s => addDays(s, -((wday(s) + 6) % 7));
const md = s => { const t = parse(s); return (t.getMonth() + 1) + "/" + t.getDate(); };
const today = () => fmt(new Date());
const addYears = (s, n) => { if (!s) return s; const [y, m, d] = s.split("-").map(Number); return ymd(y + n, m, d); };

/* ---------- 祝日 ---------- */
const holCache = {};
function holidaysOf(y) {
  if (holCache[y]) return holCache[y];
  const m = new Map();
  const nthMon = (mo, n) => { const w = new Date(y, mo - 1, 1).getDay(); return 1 + ((8 - w) % 7) + (n - 1) * 7; };
  const k = y - 1980;
  const spring = Math.floor(20.8431 + 0.242194 * k - Math.floor(k / 4));
  const autumn = Math.floor(23.2488 + 0.242194 * k - Math.floor(k / 4));
  [[1,1,"元日"],[1,nthMon(1,2),"成人の日"],[2,11,"建国記念の日"],[2,23,"天皇誕生日"],[3,spring,"春分の日"],
   [4,29,"昭和の日"],[5,3,"憲法記念日"],[5,4,"みどりの日"],[5,5,"こどもの日"],[7,nthMon(7,3),"海の日"],
   [8,11,"山の日"],[9,nthMon(9,3),"敬老の日"],[9,autumn,"秋分の日"],[10,nthMon(10,2),"スポーツの日"],
   [11,3,"文化の日"],[11,23,"勤労感謝の日"]].forEach(([mo, d, n]) => m.set(ymd(y, mo, d), n));
  // 国民の休日（祝日にはさまれた日）
  for (const d of Array.from(m.keys())) {
    const n2 = addDays(d, 2), n1 = addDays(d, 1);
    if (m.has(n2) && !m.has(n1) && wday(n1) !== 0) m.set(n1, "国民の休日");
  }
  // 振替休日
  for (const d of Array.from(m.keys()).sort()) {
    if (wday(d) === 0) { let x = addDays(d, 1); while (m.has(x)) x = addDays(x, 1); m.set(x, "振替休日"); }
  }
  return (holCache[y] = m);
}
const holiday = s => holidaysOf(+s.slice(0, 4)).get(s) || "";

/* ---------- 初期データ ---------- */
const SUBJ_DEF = [
  ["国語","こくご","#F4C7C7","",[306,315,245,245,175,175]],
  ["図書","としょ","#F6DCCB","国語",["○","○","○","○","○","○"]],
  ["書写","しょしゃ","#EBD0D6","国語",["○","○","○","○","○","○"]],
  ["社会","しゃかい","#F6E0A8","",["","",70,90,100,105]],
  ["算数","さんすう","#BCD6F2","",[136,175,175,175,175,175]],
  ["理科","りか","#C6E5C1","",["","",90,105,105,105]],
  ["生活","せいかつ","#DCEDB5","",[102,105,"","","",""]],
  ["音楽","おんがく","#F0C4DE","",[68,70,60,60,50,50]],
  ["図工","ずこう","#FAD1AE","",[68,70,60,60,50,50]],
  ["家庭","かてい","#EADCC0","",["","","","",60,55]],
  ["体育","たいいく","#B8E2E6","",[102,105,105,105,90,90]],
  ["道徳","どうとく","#DED0F0","",[34,35,35,35,35,35]],
  ["外国語","がいこくご","#CFD6F7","",["","",35,35,70,70]],
  ["総合","そうごう","#E3DBC2","",["","",70,70,70,70]],
  ["学級","がっきゅう","#E2E2E2","",[34,35,35,35,35,35]],
  ["行事","ぎょうじ","#FFEE9E","",["○","○","○","○","○","○"]],
  ["クラブ","クラブ","#D3ECEE","",["","","","○","○","○"]],
  ["委員会","いいんかい","#E7DCF4","",["","","","","○","○"]],
];
function fiscalYearOf(s) { const t = parse(s); return t.getMonth() >= 3 ? t.getFullYear() : t.getFullYear() - 1; }
function defaultSchool(y) {
  const oct = new Date(y, 9, 1).getDay(); const sports = 1 + ((8 - oct) % 7) + 7;

  function step(x, key, d, hold) {
    const units = D.units[x.s] || [];
    if (!units.length) return;
    if (D.unitStart[x.s] && d < D.unitStart[x.s]) { info[key] = {before: true}; return; }
    if (x.skip) { info[key] = {skip: true}; return; }

    let pinned = false;
    if (x.pin) { const [pu, pn] = x.pin.split(":").map(Number); if (units[pu]) { p = {u: pu, n: pn}; pinned = true; } }
    if (p.u >= units.length) { info[key] = {done: true, pinned}; ptr[x.s] = p; return; }
    const un = units[p.u];
    info[key] = {u: p.u, n: p.n, pinned, hold, unit: un.name, label: un.name + circ(p.n + 1), auto: (un.lessons || [])[p.n] || ""};
    if (hold) { ptr[x.s] = p; return; }   // 単元を進めない
    const sc = (sched[x.s] = sched[x.s] || []);
    const e = (sc[p.u] = sc[p.u] || {first: d, last: d, used: 0});

      parts.forEach((pt, k) => {

        c[pt.s] = (c[pt.s] || 0) + (split ? parseHours(pt.h) : slotUnits(pt, i));

}

const U = 12;

  if (r && !FRAC[r]) return (neg ? "-" : "") + (t / U).toFixed(2);

  <table class="tt"><tr><th></th>${[1,2,3,4,5].map(w => `<th>${WD[w]}</th>`).join("")}</tr>`;
  for (let i = 0; i <= P(); i++) {
    h += `<tr><th>${i === 0 ? "朝（" + esc(D.school.asaHours || "1/3") + "）" : i}</th>`;
    for (const w of [1,2,3,4,5]) {
      const v = D.timetable[w][i] || "";
      h += `<td style="background:${v ? colorOf(v) + "66" : "transparent"}"><select data-w="${w}" data-i="${i}">${subjOptions(v)}</select></td>`;

const SAMPLE_TSV = "教科\t単元名\t時間\t学習内容\n国語\tごんぎつね\t1\t題名や挿絵から話の内容を想像し、学習計画を立てる。\n国語\tごんぎつね\t2\t場面ごとに、ごんの行動や気持ちを読み取る。\n算数\tわり算の筆算\t1\t何十・何百のわり算のしかたを考える。\n算数\tわり算の筆算\t2\t2けた÷1けたの筆算のしかたを考える。\n";
function parseTSV(text) {
  const rows = []; let row = [], cell = "", q = false;
  text = text.replace(/\r\n?/g, "\n");
  for (let i = 0; i < text.length; i++) {
    const ch = text[i];
    if (q) {
      if (ch === '"') { if (text[i + 1] === '"') { cell += '"'; i++; } else q = false; }
      else cell += ch;
    } else if (ch === '"' && cell === "") q = true;
    else if (ch === "\t") { row.push(cell); cell = ""; }
    else if (ch === "\n") { row.push(cell); rows.push(row); row = []; cell = ""; }
    else cell += ch;
  }
  if (cell !== "" || row.length) { row.push(cell); rows.push(row); }
  return rows.map(r => r.map(c => c.trim()));
}
function parseLessonNo(v) {
  v = String(v || "").trim();

      const n = parseLessonNo(third);

function fixPins(subj, a, b) {
  const f = D.unitFrom[subj];
  if (f !== undefined) { if (b === -1) { if (a < f) D.unitFrom[subj] = f - 1; } else if (f === a) D.unitFrom[subj] = b; else if (f === b) D.unitFrom[subj] = a; }
  for (const d in D.days) for (const x of D.days[d].slots || []) {
    if (x.s !== subj || !x.pin) continue;
    const [u, n] = x.pin.split(":").map(Number);
    if (b === -1) { if (u === a) delete x.pin; else if (u > a) x.pin = (u - 1) + ":" + n; }
    else if (u === a) x.pin = b + ":" + n; else if (u === b) x.pin = a + ":" + n;
  }
}

  </table><button class="btn small" id="sAddSubj" style="margin-top:6px">＋ 教科を追加</button>

  <h2 style="margin-top:24px">配る・移す</h2>
  <div class="row"><button class="btn" id="sDist">配布用のファイルを作る</button><label class="row" style="gap:4px"><input type="checkbox" id="sDistUnits"> 学年と単元計画も入れる（同じ学年の先生に配るとき）</label></div>
  <p class="hint">配布用のファイルには、学校の設定（年度・後期・休業日・教科と時数）だけが入ります。組・担任名・時間割・週案は入りません。</p>
  <div class="row" style="margin-top:10px"><button class="btn" id="sExport">データを書き出す（バックアップ）</button><button class="btn" id="sImport">データを読み込む</button><input type="file" id="sFile" accept=".html,.htm,.json" hidden></div>
  <p class="hint">新しい版の週案ツクールに入れかえるときは、新しいファイルを開いて「データを読み込む」で、今まで使っていたファイルを選んでください。</p>
  <div class="row" style="margin-top:16px"><button class="btn danger" id="sClear">この年度の週案をすべて消す</button></div>`;
  el.innerHTML = h;
  const upd = (fn, rr = true) => e => { fn(e.target.value, e.target); changed(rr); };
  $("#sGrade").onchange = upd(v => c.grade = +v || 0);
  $("#sKumi").oninput = upd(v => c.kumi = v.trim(), false); $("#sKumi").onchange = () => render();
  $("#sTeacher").oninput = upd(v => c.teacher = v.trim(), false); $("#sTeacher").onchange = () => render();
  $("#sStart").onchange = upd(v => c.startDate = v);
  $$(".sInit", el).forEach(i => i.onchange = () => { const t = parseHours(i.value); if (t) c.init[i.dataset.s] = t; else delete c.init[i.dataset.s]; changed(); });
  if ($("#sConfirm")) $("#sConfirm").onclick = () => { s.confirmed = true; changed(); };
  $("#sYear").onchange = e => {
    const ny = parseInt(e.target.value); if (!(ny >= 2000 && ny <= 2099)) return render();
    const dy = ny - s.year; if (!dy) return;
    if (!confirm(`年度を${ny}年度にします。後期の始まりと休業日の日付も${dy > 0 ? dy + "年後" : -dy + "年前"}にずらします。`)) return render();
    s.year = ny; s.kokiStart = addYears(s.kokiStart, dy); s.week1 = mondayOf(ymd(ny, 4, 1));
    s.breaks.forEach(b => { b.from = addYears(b.from, dy); b.to = addYears(b.to, dy); });
    curWeek = ""; changed();
  };
  $("#sKoki").onchange = upd(v => s.kokiStart = v);
  $("#sWeek1").onchange = upd(v => s.week1 = v ? mondayOf(v) : mondayOf(yearStart()));
  $("#sPeriods").onchange = upd(v => s.periods = +v);
  $("#sAsa").onchange = e => { const v = e.target.value.trim(); if (!(parseHours(v) > 0)) { toast("「1/3」のように入れてください"); return render(); } s.asaHours = v; changed(); };
  $$("[data-theme]", el).forEach(b => b.onclick = () => { c.theme = b.dataset.theme; changed(); });
  $("#sRate").onchange = upd(v => c.rateMode = v);
  $$("tr[data-b]", el).forEach(tr => {
    const b = s.breaks[+tr.dataset.b];
    $(".bn", tr).oninput = upd(v => b.name = v, false);
    $(".bf", tr).onchange = upd(v => { b.from = v; if (!b.to || b.to < v) b.to = v; });
    $(".bt", tr).onchange = upd(v => b.to = v);
    $(".bd", tr).onclick = () => { s.breaks.splice(+tr.dataset.b, 1); changed(); };
  });
  $("#sAddBrk").onclick = () => { s.breaks.push({name: "", from: "", to: ""}); changed(); };
  $$("tr[data-x]", el).forEach(tr => {
    const i = +tr.dataset.x; const x = s.subjects[i];
    $(".xc", tr).onchange = upd(v => x.color = v);
    $(".nm", tr).onchange = e => {
      const nv = e.target.value.trim(); const ov = x.name;
      if (!nv || nv === ov) return render();
      if (subjByName(nv)) { toast("同じ名前の教科があります"); return render(); }
      renameSubject(ov, nv); changed();
    };
    $(".xp", tr).onchange = upd(v => x.parent = v.trim());
    $(".xs", tr).onchange = e => { x.sp = e.target.checked; changed(); };
    $$(".h", tr).forEach(inp => inp.onchange = upd(v => x.hours[+inp.dataset.g] = v.trim().replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))));
    $$("[data-xm]", tr).forEach(b => b.onclick = () => { const j = i + +b.dataset.xm; if (j < 0 || j >= s.subjects.length) return; [s.subjects[i], s.subjects[j]] = [s.subjects[j], s.subjects[i]]; changed(); });
    $(".xd", tr).onclick = () => { if (confirm("「" + x.name + "」を教科一覧から削除しますか？（週案に入っている分はそのまま残ります）")) { s.subjects.splice(i, 1); changed(); } };
  });
  $("#sAddSubj").onclick = () => { let n = "新しい教科", k = 2; while (subjByName(n)) n = "新しい教科" + k++; s.subjects.push({name: n, kana: "", color: "#DDDDDD", parent: "", hours: ["○","○","○","○","○","○"]}); changed(); };
  $("#sDist").onclick = () => {
    const withU = $("#sDistUnits").checked;
    const nd = newData();
    nd.school = JSON.parse(JSON.stringify(D.school));
    if (withU) { nd.cls.grade = D.cls.grade; nd.units = JSON.parse(JSON.stringify(D.units)); nd.unitStart = {...D.unitStart}; nd.unitFrom = {...D.unitFrom}; }
    download("週案ツクール_" + VERSION + "_配布用" + (withU && D.cls.grade ? "_" + D.cls.grade + "年" : "") + ".html", buildHtml(nd));
    toast("配布用のファイルをダウンロードしました");
  };
  $("#sExport").onclick = () => download(fileBaseName() + "_バックアップ_" + today() + ".json", JSON.stringify(D, null, 1), "application/json");
  $("#sImport").onclick = () => $("#sFile").click();
  $("#sFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const t = await f.text(); let nd = null;
    try {
      if (/\.json$/i.test(f.name)) nd = JSON.parse(t);
      else { const m = t.match(/<script id="shuan-data" type="application\/json">([\s\S]*?)<\/script>/); if (m) nd = JSON.parse(m[1]); }
    } catch (err) { nd = null; }
    e.target.value = "";
    if (!nd || nd.app !== "shuan-tsukuru") { toast("週案ツクールのデータが見つかりませんでした"); return; }
    if (!confirm("「" + f.name + "」のデータを読み込みます。いまのデータは置きかわります。よろしいですか？")) return;
    const fid = D.fileId; D = normalize(nd); D.fileId = fid; curWeek = ""; changed(); toast("読み込みました。「保存」を押してください");
  };
  $("#sClear").onclick = () => {
    if (!confirm("この年度の週案（行事・学習内容・メモなど）をすべて消します。時間割・単元計画・設定は残ります。よろしいですか？")) return;
    D.weeks = {}; D.days = {}; changed(); toast("週案を消しました");
  };
}
function renameSubject(ov, nv) {
  const s = subjByName(ov); s.name = nv;
  for (const x of D.school.subjects) if (x.parent === ov) x.parent = nv;
  for (const w in D.timetable) D.timetable[w] = D.timetable[w].map(v => v === ov ? nv : v);
  if (D.units[ov]) { D.units[nv] = D.units[ov]; delete D.units[ov]; }
  if (D.unitStart[ov]) { D.unitStart[nv] = D.unitStart[ov]; delete D.unitStart[ov]; }
  if (D.unitFrom[ov] !== undefined) { D.unitFrom[nv] = D.unitFrom[ov]; delete D.unitFrom[ov]; }
  if (D.cls.init[ov]) { D.cls.init[nv] = D.cls.init[ov]; delete D.cls.init[ov]; }
  for (const d in D.days) for (const x of D.days[d].slots || []) if (x.s === ov) x.s = nv;
}

/* ---------- はじまり ---------- */
let draftInfo = null;
try {
  const dr = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
  if (dr && dr.data && dr.data.fileId === D.fileId && dr.rev > D.rev) draftInfo = {at: new Date(dr.at).toLocaleString("ja-JP"), data: dr.data};
  else if (dr) localStorage.removeItem(DRAFT_KEY);
} catch (e) {}
$$("#tabs button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$("#hdrVer").textContent = VERSION;
$("#btnSave").onclick = save;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
render();
</script>
</body>
</html>
