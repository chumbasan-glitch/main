  ${s.subjects.map((x, i) => `<tr data-x="${i}"><td><button class="xc" style="background:${esc(x.color)}" title="色を選ぶ"></button></td><td><input type="text" class="nm" value="${esc(x.name)}"></td><td><input type="text" class="xp" value="${esc(x.parent)}" style="width:60px"></td><td><input type="checkbox" class="xs"${isSpecial(x) ? " checked" : ""}></td>${x.hours.map((v, g) => `<td><input type="text" class="h" data-g="${g}" value="${esc(v)}"></td>`).join("")}<td><button class="btn small" data-xm="-1">↑</button><button class="btn small" data-xm="1">↓</button><button class="btn small danger xd">削除</button></td></tr>${colorEdit === i ? `<tr class="cpick"><td colspan="11"><div class="cpanel">
    ${Object.entries(COLOR_SETS).map(([k, cs]) => `<div class="crow"><span>${cs.name}</span>${[...new Set(cs.c)].map(cc => `<button class="sw${cc.toLowerCase() === String(x.color).toLowerCase() ? " on" : ""}" data-col="${cc}" style="background:${cc}" title="${cc}"></button>`).join("")}</div>`).join("")}
    <details${!Object.values(COLOR_SETS).some(cs => cs.c.map(v => v.toLowerCase()).includes(String(x.color).toLowerCase())) ? " open" : ""}><summary>細かく選ぶ（詳細設定）</summary><label class="row" style="gap:6px;margin-top:4px">色<input type="color" class="xcd" value="${esc(x.color)}"><span class="hint">好きな色を自由に選べます</span></label></details>
    <button class="btn small" id="cpClose">閉じる</button></div></td></tr>` : ""}`).join("")}
  </table><button class="btn small" id="sAddSubj" style="margin-top:6px">＋ 教科を追加</button>

  <h2 style="margin-top:24px">配る・移す</h2>
  <div class="row"><button class="btn" id="sDist">配布用のファイルを作る</button><label class="row" style="gap:4px"><input type="checkbox" id="sDistUnits"> 学年と単元計画も入れる（同じ学年の先生に配るとき）</label></div>
  <p class="hint">配布用のファイルには、学校の設定（年度・後期・休業日・教科と時数）だけが入ります。組・担任名・時間割・週案は入りません。</p>
  <div class="row" style="margin-top:10px"><button class="btn" id="sExport">データを書き出す（バックアップ）</button><button class="btn" id="sImport">データを読み込む</button><input type="file" id="sFile" accept=".html,.htm,.json" hidden></div>
  <p class="hint">新しい版の週案ツクールに入れかえるときは、新しいファイルを開いて「データを読み込む」で、今まで使っていたファイルを選んでください。</p>
  <div class="row" style="margin-top:16px"><button class="btn danger" id="sClear">この年度の週案をすべて消す</button></div>`;
  el.innerHTML = h;
  const upd = (fn, rr = true) => e => { fn(e.target.value, e.target); changed(rr); };
  $("#sGrade").onchange = upd(v => c.grade = +v || 0);
  $("#sKumi").oninput = upd(v => c.kumi = kumiOf(v), false); $("#sKumi").onchange = () => render();
  $("#sTeacher").oninput = upd(v => c.teacher = v.trim(), false); $("#sTeacher").onchange = () => render();
  $("#sStart").onchange = upd(v => c.startDate = v);
  $$(".sInit", el).forEach(i => i.onchange = () => { const t = parseHours(i.value); if (t) c.init[i.dataset.s] = t; else delete c.init[i.dataset.s]; changed(); });
  if ($("#sConfirm")) $("#sConfirm").onclick = () => { s.confirmed = true; changed(); };
  $("#sYear").onchange = e => {
    const ny = parseInt(e.target.value); if (!(ny >= 2000 && ny <= 2099)) return render();
    const dy = ny - s.year; if (!dy) return;
    if (!confirm(`年度を${ny}年度にします。後期の始まりと休業日の日付も${dy > 0 ? dy + "年後" : -dy + "年前"}にずらします。`)) return render();
    s.year = ny; s.kokiStart = addYears(s.kokiStart, dy); s.week1 = mondayOf(ymd(ny, 4, 1));
    s.breaks.forEach(b => { b.from = addYears(b.from, dy); b.to = addYears(b.to, dy); });
    curWeek = ""; changed();
  };
  $("#sKoki").onchange = upd(v => s.kokiStart = v);
  $("#sWeek1").onchange = upd(v => s.week1 = v ? mondayOf(v) : mondayOf(yearStart()));
  $("#sPeriods").onchange = upd(v => s.periods = +v);
  $("#sAsa").onchange = e => { const v = e.target.value.trim(); if (!(parseHours(v) > 0)) { toast("「1/3」のように入れてください"); return render(); } s.asaHours = v; changed(); };
  $("#sAsaEv").onchange = e => { s.asaEvents = e.target.value.split(/[、,，\s]+/).map(x => x.trim()).filter(Boolean); changed(); };
  $("#sFont").onchange = e => { c.font = e.target.value; changed(); };
  $$("[data-theme]", el).forEach(b => b.onclick = () => { c.theme = b.dataset.theme; changed(); });
  $("#sRate").onchange = upd(v => c.rateMode = v);
  $$("tr[data-b]", el).forEach(tr => {
    const b = s.breaks[+tr.dataset.b];
    $(".bn", tr).oninput = upd(v => b.name = v, false);
    $(".bf", tr).onchange = upd(v => { b.from = v; if (!b.to || b.to < v) b.to = v; });
    $(".bt", tr).onchange = upd(v => b.to = v);
    $(".bd", tr).onclick = () => { s.breaks.splice(+tr.dataset.b, 1); changed(); };
  });
  $("#sAddBrk").onclick = () => { s.breaks.push({name: "", from: "", to: ""}); changed(); };
  $$("tr[data-x]", el).forEach(tr => {
    const i = +tr.dataset.x; const x = s.subjects[i];
    $(".xc", tr).onclick = () => { colorEdit = colorEdit === i ? -1 : i; render(); };
    const pk = tr.nextElementSibling && tr.nextElementSibling.classList.contains("cpick") ? tr.nextElementSibling : null;
    if (pk) {
      $$(".sw", pk).forEach(b => b.onclick = () => { x.color = b.dataset.col; changed(); });
      $(".xcd", pk).onchange = e => { x.color = e.target.value; changed(); };
      $("#cpClose", pk).onclick = () => { colorEdit = -1; render(); };
    }
    $(".nm", tr).onchange = e => {
      const nv = e.target.value.trim(); const ov = x.name;
      if (!nv || nv === ov) return render();
      if (subjByName(nv)) { toast("同じ名前の教科があります"); return render(); }
      renameSubject(ov, nv); changed();
    };
    $(".xp", tr).onchange = upd(v => x.parent = v.trim());
    $(".xs", tr).onchange = e => { x.sp = e.target.checked; changed(); };
    $$(".h", tr).forEach(inp => inp.onchange = upd(v => x.hours[+inp.dataset.g] = v.trim().replace(/[０-９]/g, ch => String.fromCharCode(ch.charCodeAt(0) - 0xFEE0))));
    $$("[data-xm]", tr).forEach(b => b.onclick = () => { const j = i + +b.dataset.xm; if (j < 0 || j >= s.subjects.length) return; [s.subjects[i], s.subjects[j]] = [s.subjects[j], s.subjects[i]]; changed(); });
    $(".xd", tr).onclick = () => { if (confirm("「" + x.name + "」を教科一覧から削除しますか？（週案に入っている分はそのまま残ります）")) { s.subjects.splice(i, 1); changed(); } };
  });
  $$("[data-cset]", el).forEach(b => b.onclick = () => {
    const k = b.dataset.cset;
    if (!confirm("すべての教科の色を「" + COLOR_SETS[k].name + "」にします。よろしいですか？")) return;
    s.subjects.forEach((x, i) => x.color = setColorFor(k, x.name, i)); colorEdit = -1; changed();
  });
  $("#sAddSubj").onclick = () => { let n = "新しい教科", k = 2; while (subjByName(n)) n = "新しい教科" + k++; s.subjects.push({name: n, kana: "", color: "#DDDDDD", parent: "", hours: ["○","○","○","○","○","○"]}); changed(); };
  $("#sDist").onclick = () => {
    const withU = $("#sDistUnits").checked;
    const nd = newData();
    nd.school = JSON.parse(JSON.stringify(D.school));
    if (withU) { nd.cls.grade = D.cls.grade; nd.units = JSON.parse(JSON.stringify(D.units)); nd.unitStart = {...D.unitStart}; nd.unitFrom = {...D.unitFrom}; }
    download("週案ツクール_" + VERSION + "_配布用" + (withU && D.cls.grade ? "_" + D.cls.grade + "年" : "") + ".html", buildHtml(nd));
    toast("配布用のファイルをダウンロードしました");
  };
  $("#sExport").onclick = () => download(fileBaseName() + "_バックアップ_" + today() + ".json", JSON.stringify(D, null, 1), "application/json");
  $("#sImport").onclick = () => $("#sFile").click();
  $("#sFile").onchange = async e => {
    const f = e.target.files[0]; if (!f) return;
    const t = await f.text(); let nd = null;
    try {
      if (/\.json$/i.test(f.name)) nd = JSON.parse(t);
      else { const m = t.match(/<script id="shuan-data" type="application\/json">([\s\S]*?)<\/script>/); if (m) nd = JSON.parse(m[1]); }
    } catch (err) { nd = null; }
    e.target.value = "";
    if (!nd || nd.app !== "shuan-tsukuru") { toast("週案ツクールのデータが見つかりませんでした"); return; }
    if (!confirm("「" + f.name + "」のデータを読み込みます。いまのデータは置きかわります。よろしいですか？")) return;
    const fid = D.fileId; D = normalize(nd); D.fileId = fid; curWeek = ""; changed(); toast("読み込みました。「保存」を押してください");
  };
  $("#sClear").onclick = () => {
    if (!confirm("この年度の週案（行事・学習内容・メモなど）をすべて消します。時間割・単元計画・設定は残ります。よろしいですか？")) return;
    D.weeks = {}; D.days = {}; changed(); toast("週案を消しました");
  };
}
function renameSubject(ov, nv) {
  const s = subjByName(ov); s.name = nv;
  for (const x of D.school.subjects) if (x.parent === ov) x.parent = nv;
  for (const w in D.timetable) D.timetable[w] = D.timetable[w].map(v => v === ov ? nv : v);
  if (D.units[ov]) { D.units[nv] = D.units[ov]; delete D.units[ov]; }
  if (D.unitStart[ov]) { D.unitStart[nv] = D.unitStart[ov]; delete D.unitStart[ov]; }
  if (D.unitFrom[ov] !== undefined) { D.unitFrom[nv] = D.unitFrom[ov]; delete D.unitFrom[ov]; }
  if (D.cls.init[ov]) { D.cls.init[nv] = D.cls.init[ov]; delete D.cls.init[ov]; }
  for (const d in D.days) for (const x of D.days[d].slots || []) if (x.s === ov) x.s = nv;
}

/* ---------- はじまり ---------- */
let draftInfo = null;
try {
  const dr = JSON.parse(localStorage.getItem(DRAFT_KEY) || "null");
  if (dr && dr.data && dr.data.fileId === D.fileId && dr.rev > D.rev) draftInfo = {at: new Date(dr.at).toLocaleString("ja-JP"), data: dr.data};
  else if (dr) localStorage.removeItem(DRAFT_KEY);
} catch (e) {}
addShorts(D);
$$("#tabs button").forEach(b => b.onclick = () => switchTab(b.dataset.tab));
$("#hdrVer").textContent = VERSION;
$("#btnSave").onclick = save;
document.addEventListener("keydown", e => { if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "s") { e.preventDefault(); save(); } });
window.addEventListener("beforeunload", e => { if (dirty) { e.preventDefault(); e.returnValue = ""; } });
render();
</script>
</body>
</html>
