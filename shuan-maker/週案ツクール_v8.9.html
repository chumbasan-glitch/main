<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>週案ツクール</title>
<style>
:root{
  --bg:#EEF2EC;
  --surface:#FFFFFF;
  --surface-2:#F4F7F2;
  --ink:#1F2B24;
  --ink-soft:#5E6B63;
  --line:#CFD9D1;
  --accent:#2E6B4F;
  --accent-ink:#FFFFFF;
  --accent-soft:#DDEDE3;
  --warn:#9A5B00;
  --warn-soft:#FFF1D6;
  --red:#A8323F;
  --off:#E9ECE8;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font,"MS UI Gothic","Meiryo",sans-serif);font-size:14px;line-height:1.5}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
header.top{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:10px 16px;background:var(--accent);color:var(--accent-ink)}
header.top h1{margin:0;font-size:20px;letter-spacing:.08em;font-weight:700}
header.top .cls{font-size:14px;opacity:.9}
header.top .sp{flex:1}
.savebox{display:flex;align-items:center;gap:10px}
.savestate{font-size:12px;opacity:.9}
.btn{border:1.5px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 12px;line-height:1.3}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
header.top .btn.primary{background:#fff;color:var(--accent);border-color:#fff}
.btn.small{padding:3px 8px;font-size:12px;border-radius:6px}
.btn.danger{color:var(--red)}
nav.tabs{display:flex;gap:4px;padding:8px 16px 0;background:var(--bg);flex-wrap:wrap}
nav.tabs button{border:none;background:transparent;padding:8px 16px;border-radius:8px 8px 0 0;font-weight:700;color:var(--ink-soft)}
nav.tabs button.on{background:var(--surface);color:var(--accent)}
main{background:var(--surface);margin:0 16px 24px;border-radius:0 8px 8px 8px;padding:16px;min-height:60vh}
.banner{padding:10px 14px;border-radius:8px;background:var(--warn-soft);color:var(--warn);margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.banner b{color:var(--ink)}
.hint{color:var(--ink-soft);font-size:12px}
h2{font-size:17px;margin:4px 0 10px}
h3{font-size:15px;margin:16px 0 8px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
input[type=text],input[type=date],input[type=number],select,textarea{border:1.5px solid var(--line);border-radius:6px;background:var(--surface);padding:4px 6px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:2px;font-size:12px;color:var(--ink-soft)}
label.f>*{font-size:14px;color:var(--ink)}

/* 週案 */
.weekbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.weekbar select{font-weight:700}
.contbar{margin-top:-4px}
.contbar .caution{font-size:12.5px;color:#B23A1E;font-weight:700}
.weeklayout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:14px;align-items:start}
@media (max-width:1100px){.weeklayout{grid-template-columns:minmax(0,1fr)}}
.gridwrap{overflow-x:auto}
table.wk{border-collapse:collapse;width:100%;min-width:760px;table-layout:fixed}
table.wk th,table.wk td{border:1px solid var(--line);vertical-align:top;padding:4px}
table.wk th.lab{width:44px;background:var(--surface-2);font-size:12px;vertical-align:middle;text-align:center}
table.wk thead th{background:var(--surface-2);font-weight:700;text-align:center;padding:4px 2px}
table.wk thead .dd{display:flex;justify-content:center;align-items:center;gap:6px}
.wd0{color:var(--red)} .wd6{color:#2856A3}
td.off{background:var(--off)}
td.off .slot,td.off .asa{opacity:.45}
.offlab{font-size:11px;color:var(--red);font-weight:700}
tr.brk td,tr.brk th{background:#FFF6DD}
tr.brk td.off{background:var(--off)}
textarea.br{width:100%;min-height:34px;resize:vertical;font-size:12px;padding:3px 4px;background:#FFFDF5}
textarea.ev,textarea.note{width:100%;min-height:38px;resize:vertical;font-size:12px;padding:3px 4px}
.slot{display:flex;flex-direction:column;gap:3px;border-left:6px solid var(--c,#ddd);padding-left:4px;min-height:84px}
.slot.drag-over{outline:2px dashed var(--accent)}
.slot .sh{display:flex;gap:3px;align-items:center}
.slot .grip{cursor:grab;color:var(--ink-soft);font-size:12px;user-select:none;padding:0 2px}
.slot input.subj,.asa input.subj{flex:1;min-width:0;font-weight:700;padding:2px 4px;background:var(--cbg,#fff)}
.uf{display:flex;gap:3px}
.crs{display:flex;gap:2px}
.crs button{flex:1;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;font-size:11px;padding:0 2px;line-height:1.6}
.crs button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.uf input.un{flex:1;min-width:0;font-size:12px;padding:2px 4px;font-weight:700}
.uf input.no{width:44px;flex:none;font-size:12px;padding:2px 3px;text-align:center}
.part{border-left:6px solid var(--c,#ddd);border-top:1.5px dashed var(--line);padding:3px 0 0 4px;margin-left:-10px;display:flex;flex-direction:column;gap:3px}
.part input.psubj{flex:1;min-width:0;font-weight:700;padding:2px;background:var(--cbg,#fff)}
.part input.phr{width:38px;flex:none;font-size:12px;padding:2px 3px;text-align:center}
.part textarea.pct{width:100%;min-height:34px;resize:vertical;font-size:12px;padding:3px 4px}
.part textarea.pct.auto{color:#4C5A52;background:var(--surface-2)}
.part .pdel{border:none;background:transparent;color:var(--red);font-weight:700;padding:0 4px}
.part .plab{font-size:12px;font-weight:700}
.slot .adv{font-size:11px;color:var(--ink-soft);display:flex;gap:3px;align-items:center}
.sh input.warn{border-color:var(--red);background:#FDECEC}
.psplit{align-self:flex-start;margin-top:2px}
.sh input.hr{width:38px;flex:none;font-size:12px;padding:2px 3px;text-align:center}
.asa .sh{display:flex;gap:3px}
.asa .sh input.subj{font-weight:400;font-size:12px}
.slot select.unit.pinned{border-color:var(--accent);font-weight:700}
.slot select.unit.skip{color:var(--ink-soft)}
.slot .tw{position:relative}
.slot textarea.ct{width:100%;min-height:48px;resize:vertical;font-size:12px;padding:3px 4px}
.slot textarea.ct.auto{color:#4C5A52;background:var(--surface-2)}
.slot .rv{position:absolute;right:2px;bottom:4px;border:none;background:var(--accent-soft);border-radius:4px;font-size:11px;padding:0 4px}
.asa{display:flex;flex-direction:column;gap:3px;border-left:6px solid var(--c,#ddd);padding-left:4px}
.asa select{font-size:12px;padding:2px;background:var(--cbg,#fff)}
.asa input{font-size:12px;width:100%;padding:2px 4px}
.memo textarea{width:100%;min-height:54px;resize:vertical}
.side h3{margin-top:0}
table.tot{border-collapse:collapse;width:100%;font-size:13px}
table.tot th,table.tot td{border:1px solid var(--line);padding:2px 6px;text-align:right}
table.tot th{background:var(--surface-2);text-align:center}
table.tot td.n{text-align:left;white-space:nowrap}
table.tot tr.child td.n{padding-left:16px;color:var(--ink-soft);font-size:12px}
table.tot tr.child td{color:var(--ink-soft);font-size:12px}
table.tot tr.sum td{font-weight:700;background:var(--surface-2)}
.neg{color:var(--red);font-weight:700}
.chip{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(0,0,0,.15)}

/* 時間割 */
.ttwrap{display:flex;gap:24px;align-items:flex-start;flex-wrap:wrap}
.tthead{display:flex;align-items:baseline;gap:12px;margin-bottom:8px}
.tthead b{font-size:17px}
.tthead span{color:var(--ink-soft);font-size:13px}
table.tt2{border-collapse:separate;border-spacing:4px;user-select:none;margin-left:-4px}
table.tt2 th{font-weight:700;color:var(--ink-soft);font-size:13px}
table.tt2 tr:first-child th{height:28px}
table.tt2 tr th:first-child{width:44px;font-size:18px;color:var(--ink)}
table.tt2 th small{display:block;font-size:10px;font-weight:400;color:var(--ink-soft)}
table.tt2 td{width:92px;height:52px;border:1.5px solid var(--line);border-radius:8px;text-align:center;vertical-align:middle;font-size:15px;font-weight:700;cursor:pointer;background:var(--surface);transition:border-color .1s}
table.tt2 td:hover{border-color:var(--accent)}
.ttpal{background:var(--surface-2);border:1.5px solid var(--line);border-radius:10px;padding:12px;width:230px;position:sticky;top:12px}
.ttpt{font-size:13px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.ttbtns{display:grid;grid-template-columns:1fr 1fr;gap:6px;align-items:start}
.ttbtns>div{display:flex;flex-direction:column;gap:6px}
.ttbtns.ttasa{display:flex;flex-direction:column;gap:6px}
.ttbtns button{display:flex;align-items:center;gap:6px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:4px 10px;font-size:13px;text-align:left}
.ttbtns button::before{content:"";width:12px;height:12px;border-radius:3px;background:var(--sc);border:1px solid rgba(0,0,0,.15);flex:none}
.ttbtns button:hover{border-color:var(--accent)}
.ttbtns button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700;box-shadow:0 0 0 2px var(--accent-soft)}
table.tt{border-collapse:collapse}
table.tt th,table.tt td{border:1px solid var(--line);padding:4px 6px;text-align:center}
table.tt th{background:var(--surface-2)}
table.tt select{width:110px;font-weight:700}

/* 単元計画 */
.subjchips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.subjchips button{border:1.5px solid var(--line);border-radius:999px;padding:4px 12px;background:var(--surface)}
.subjchips button.on{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.subjchips button small{color:var(--ink-soft);margin-left:4px}
.unitcard{border:1.5px solid var(--line);border-radius:8px;padding:10px;margin-bottom:10px;background:var(--surface-2)}
.unitcard .uh{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.unitcard .uh input.un{flex:1;min-width:180px;font-weight:700}
.unitcard .uh input.utot{width:60px}
.unitcard textarea{width:100%;min-height:90px;font-size:13px;line-height:1.6}
.unitcard.skipped{opacity:.55}
.ucols{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:6px}
.ulab{display:flex;flex-direction:column;font-size:12px;color:var(--ink-soft)}
.ulab textarea{margin-top:2px}
.unitcard .aim{display:block;font-size:12px;color:var(--ink-soft);margin-top:4px}
.unitcard .aim textarea{min-height:40px;font-size:12px}
.unitcard .sched{font-size:12px;color:var(--accent);font-weight:700}
.paste textarea{width:100%;min-height:120px;font-size:12px;font-family:"UD デジタル 教科書体 N-R","UD Digi Kyokasho N-R","BIZ UDGothic","MS Gothic",monospace}
.msg{white-space:pre-wrap;font-size:13px;padding:8px 10px;border-radius:6px;background:var(--accent-soft);margin-top:6px}
.msg.err{background:var(--warn-soft);color:var(--warn)}
details.box{border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;margin-bottom:12px}
details.box summary{font-weight:700;cursor:pointer}

/* 時数 */
.yrwrap{overflow-x:auto}
table.yr{border-collapse:collapse;font-size:12px}
table.yr th,table.yr td{border:1px solid var(--line);padding:3px 5px;text-align:right;white-space:nowrap}
table.yr th{background:var(--surface-2);text-align:center}
table.yr td.n{text-align:left}
table.yr td.term,table.yr th.term{background:var(--accent-soft);font-weight:700}
table.yr tr.child td{color:var(--ink-soft)}
table.yr tr.sum td{font-weight:700;background:var(--surface-2)}

/* 設定 */
.themes{display:flex;gap:10px;flex-wrap:wrap}
.theme{border:2px solid var(--line);border-radius:8px;background:#fff;padding:6px;display:flex;flex-direction:column;align-items:center;gap:4px;width:104px}
.theme.on{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.tp{display:grid;grid-template-columns:1fr 26px;grid-template-rows:10px 1fr;width:90px;height:62px;border:1.5px solid var(--pl);background:#fff}
.tph{grid-column:1 / 3;background:var(--ph);border-bottom:1px solid var(--pl)}
.tpb{background:linear-gradient(to bottom,#fff 0 40%,var(--pb) 40% 55%,#fff 55%);border-right:1px solid var(--pl)}
.tps{display:flex;flex-direction:column}
.tps i{flex:1;border-bottom:1px solid var(--pl)}
.csets{display:flex;gap:8px;flex-wrap:wrap}
.cset{border:1.5px solid var(--line);border-radius:8px;background:var(--surface);padding:6px 8px;display:flex;flex-direction:column;gap:4px;align-items:flex-start}
.cset:hover{border-color:var(--accent)}
.cstrip{display:flex}
.cstrip i{width:12px;height:16px;display:block}
table.subj button.xc{width:34px;height:24px;border:1px solid rgba(0,0,0,.25);border-radius:4px;padding:0}
tr.cpick td{background:var(--surface-2);text-align:left}
.cpanel{display:flex;flex-direction:column;gap:5px;padding:6px}
.crow{display:flex;gap:3px;align-items:center;flex-wrap:wrap}
.crow span{width:76px;font-size:12px;color:var(--ink-soft)}
.sw{width:22px;height:22px;border:1px solid rgba(0,0,0,.2);border-radius:4px;padding:0}
.sw.on{outline:2.5px solid var(--accent);outline-offset:1px}
.setgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;max-width:900px}
table.subj{border-collapse:collapse;font-size:13px}
table.subj th,table.subj td{border:1px solid var(--line);padding:3px 4px;text-align:center}
table.subj th{background:var(--surface-2)}
table.subj input.nm{width:80px}
table.subj input.h{width:46px;text-align:center}
table.subj input.xf{width:220px}
table.subj .fxon{font-size:11px;color:#2E7D5B;background:#E3F2EA;border-radius:8px;padding:1px 7px}
table.subj input[type=color]{width:34px;height:24px;padding:0;border:1px solid var(--line)}
table.brk td,table.brk th{padding:3px 4px}
table.brk{border-collapse:collapse}
table.brk th{font-size:12px;color:var(--ink-soft);text-align:left}

#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:8px 16px;border-radius:8px;font-size:14px;z-index:50;box-shadow:0 4px 16px rgba(0,0,0,.2)}

/* 印刷（B5縦） */
#print{display:none}
@page{size:182mm 257mm;margin:7mm}
@page{size:JIS-B5 portrait;margin:7mm}
@media print{
  body{background:#fff}
  .app,#toast{display:none!important}
  #print{display:block}
}
#print{font-family:var(--font,"MS UI Gothic","Meiryo",sans-serif);color:#000;width:168mm;-webkit-print-color-adjust:exact;print-color-adjust:exact;
  --pl:#2E8B88;--ph:#CCF5CC;--pb:#FFF0C8;--s1:#FFFFA6;--s2:#CCF5CC;--sub:#99EE99;--tot:#66E066}
#print .ph{height:6mm;font-size:8pt;display:flex;align-items:flex-end;gap:4mm;padding-left:1mm;color:#000}
#print .ph b{font-size:8.5pt;font-weight:400}
#print .ph .wt{color:#000;font-size:10pt;font-weight:700}
#print .pbody{display:flex;margin-top:1.5mm;border:0.35mm solid var(--pl)}
#print table{border-collapse:collapse;table-layout:fixed}
#print td,#print th{border:0.2mm solid var(--pl);padding:0;overflow:hidden;vertical-align:top}
#print table.pw{width:134mm}
#print table.pw th.l{background:var(--ph);font-weight:400;font-size:6.5pt;text-align:center;vertical-align:middle;line-height:1.1;letter-spacing:-0.05em}
#print table.pw th.l .mj{font-size:5pt;letter-spacing:-0.08em;line-height:1.15}
#print table.pw th.l.big{font-size:14pt;letter-spacing:0}
#print table.pw thead th{background:var(--ph);font-weight:400;font-size:8pt;text-align:center;vertical-align:middle;line-height:1.05}
#print tr.band td,#print tr.band th{background:var(--pb)}
#print td.sj{font-size:7.5pt;font-weight:700;padding:0 0.8mm;white-space:nowrap;vertical-align:middle;line-height:1}
#print td.hr{font-size:6.5pt;text-align:center;vertical-align:middle;white-space:nowrap;line-height:1}
#print .cb{overflow:hidden;font-size:7pt;line-height:1.28;word-break:break-all;padding:0.4mm 0.7mm;white-space:pre-wrap}
#print .cb .pu{font-weight:700}
#print td.poff{background:#E8E8E8}
#print td.hol,#print tr.band td.hol{background:#FF9FCF}
#print td.emp{background:#D9D9D9}
#print .bigc{display:flex;align-items:center;justify-content:center;font-size:26pt;line-height:1}
#print thead th.hk{font-size:7.5pt}
#print td.spc{padding:0}
#print td.stc{padding:0;vertical-align:top}
#print .st{display:flex;height:3.4mm}
#print .st .sj{flex:1;min-width:0;font-weight:700;padding:0 0.8mm;white-space:nowrap;overflow:hidden;line-height:3.4mm}
#print .st .hr{width:var(--hw);flex:none;border-left:0.2mm solid var(--pl);font-size:6pt;text-align:center;line-height:3.4mm;white-space:nowrap}
#print .st.x{border-bottom:0.2mm solid var(--pl);height:3.6mm}
#print .st.x .sj,#print .st.x .hr{line-height:3.6mm}
#print td.spc .cb,#print td.hol .cb{line-height:1.2}
#print .cb.sq{padding:0.3mm 0.5mm;overflow:hidden}
#print table.sub{width:100%;border-collapse:collapse;table-layout:fixed;margin:-0.2mm 0 0}
#print table.sub td{border:0.2mm solid var(--pl);border-left:none;border-right:none}
#print table.sub td.hr{border-left:0.2mm solid var(--pl)}
#print .offn{font-weight:700}
#print .side{width:34mm;display:flex;flex-direction:column;border-left:0.35mm solid var(--pl)}
#print table.pt2{width:100%;font-size:6.8pt}
#print table.pt2 th{background:var(--ph);font-weight:400;height:5mm;vertical-align:middle;font-size:6.5pt;letter-spacing:-0.05em;padding:0}
#print table.pt2 td:nth-child(3){font-size:5.6pt;letter-spacing:-0.04em;padding-top:0.6mm}
#print table.pt2 td{height:3.55mm;text-align:center;vertical-align:middle;white-space:nowrap;line-height:1;padding:0.35mm 0 0}   /* MS UI Gothic は字が上に寄って見えるので、少し下げる */
#print table.pt2 td.n{text-align:center}
#print table.pt2 td{font-size:6.3pt;letter-spacing:-0.02em}
#print table.pt2 td.rt{font-size:5.3pt}
#print table.pt2 tr.r1 td{background:var(--s1)}
#print table.pt2 tr.r2 td{background:var(--s2)}
#print table.pt2 tr.sub td{background:var(--sub)}
#print table.pt2 tr.tot td{background:var(--tot);font-weight:700}
#print table.pt2 tr.gap td{height:0.8mm;background:var(--pl)}
#print .memo{flex:1;padding:0.6mm 1mm;font-size:7.5pt;white-space:pre-wrap;overflow:hidden;border-top:0.35mm solid var(--pl)}
#print .rec{border:0.35mm solid var(--pl);border-top:none;height:25mm;padding:0.6mm 1mm;font-size:7.5pt;white-space:pre-wrap;overflow:hidden}
#print .k{font-weight:700}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <h1>週案ツクール <small id="hdrVer" style="font-size:12px;opacity:.85"></small></h1>
    <span class="cls" id="hdrCls"></span>
    <span class="sp"></span>
    <div class="savebox">
      <span class="savestate" id="saveState"></span>
      <button class="btn primary" id="btnSave" title="Ctrl+S でも保存できます">保存</button>
    </div>
  </header>
  <nav class="tabs" id="tabs">
    <button data-tab="week" class="on">週案</button>
    <button data-tab="tt">時間割</button>
    <button data-tab="units">単元計画</button>
    <button data-tab="hours">時数</button>
    <button data-tab="set">設定</button>
  </nav>
  <main>
    <div id="banners"></div>
    <section id="tab-week"></section>
    <section id="tab-tt" hidden></section>
    <section id="tab-units" hidden></section>
    <section id="tab-hours" hidden></section>
    <section id="tab-set" hidden></section>
  </main>
</div>
<div id="print"></div>
<div id="toast" hidden></div>
<script id="shuan-data" type="application/json">null</script>
<script>
// 動かないときに理由を画面に出す（古いしくみのブラウザでも動くように、ここだけ古い書き方にしている）
var BOOT_OK = false;
function bootMsg(why) {

  const uni = {"½": 6, "⅓": 4, "⅔": 8, "¼": 3, "¾": 9, "⅙": 2, "⅚": 10};
  let m = v.match(/^(\d+)?\s*([½⅓⅔¼¾⅙⅚])$/);

  const h = parseHours(x.h);

}
const isAsaEvent = n => !!n && !subjByName(n) && (D.school.asaEvents || []).includes(n);
// 朝の欄に出す時数：教科や行事を入れたら設定の時数（1/3）、朝会は時数に数えないので出さない
const asaShown = x => !x.s || isAsaEvent(x.s) ? "" : (x.h || D.school.asaHours || "1/3");

function totalsRows(maps) {

  for (const s of gradeSubjects()) {
    if (s.parent && subjByName(s.parent)) continue;
    const kids = gradeSubjects().filter(k => k.parent === s.name);
    const vals = maps.map(m => (m[s.name] || 0) + kids.reduce((a, k) => a + (m[k.name] || 0), 0));
    rows.push({name: s.name, color: s.color, vals, std: subjHours(s), child: false, sp: isSpecial(s)});
    for (const k of kids) rows.push({name: k.name, color: k.color, vals: maps.map(m => m[k.name] || 0), std: null, child: true});

function idb() {

    const r = indexedDB.open("shuan-tsukuru", 1);

async function idbGet(k) { try { const db = await idb(); return await new Promise(r => { const q = db.transaction("h").objectStore("h").get(k); q.onsuccess = () => r(q.result); q.onerror = () => r(null); }); } catch (e) { return null; } }

let handle = null;
function download(name, text, type = "text/html") {
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([text], {type}));

// 保存先のファイルに、いま開いているものとは別の（または新しい）週案が入っていないか確かめる
async function safeToOverwrite(h) {

    const t = await (await h.getFile()).text();
    const m = t.match(/<script id="shuan-data" type="application\/json">([\s\S]*?)<\/script>/);
    if (m) v = JSON.parse(m[1]);
  } catch (e) { return true; }
  if (!v || v.app !== "shuan-tsukuru") return true;
  if (v.fileId === D.fileId && (v.rev || 0) <= D.rev) return true;
  const who = (v.cls && v.cls.grade ? v.cls.grade + "年" + (v.cls.kumi ? v.cls.kumi + "組" : "") + " " : "") + (v.savedAt ? v.savedAt.replace("T", " ") + "に保存" : "");
  return confirm("保存先の「" + h.name + "」には、いま開いている週案とは別の（または新しい）データが入っています。" + (who ? "（" + who + "）" : "") +
    "\n上書きすると、そのデータは消えます。\n\n上書きするときは「OK」、別のファイルに保存するときは「キャンセル」を押してください。");
}
async function save() {
  const prevSaved = D.savedAt;
  const now = new Date();
  D.savedAt = fmt(now) + "T" + pad(now.getHours()) + ":" + pad(now.getMinutes());
  const html = buildHtml(D);
  if (!window.showSaveFilePicker) {
    download(currentFileName() || fileBaseName() + ".html", html);
    dirty = false; showSaveState();
    toast("ダウンロードしました。前のファイルと置きかえてください");
    return;
  }
  try {
    let h = handle || await idbGet("h:" + location.href);
    let ok = false;
    if (h) {
      try {
        let p = await h.queryPermission({mode: "readwrite"});
        if (p !== "granted") p = await h.requestPermission({mode: "readwrite"});
        ok = p === "granted";
      } catch (e) { ok = false; }
    }
    if (!ok) {
      toast("いま開いているこのファイルを選んで「保存」→「はい（置きかえる）」を押してください", 6000);
      h = await window.showSaveFilePicker({suggestedName: currentFileName() || fileBaseName() + ".html", types: [{description: "週案ツクール（HTML）", accept: {"text/html": [".html"]}}]});
    }
    if (!(await safeToOverwrite(h))) {
      toast("保存するファイルを選んでください（新しい名前にすると、別のファイルとして保存されます）", 6000);
      h = await window.showSaveFilePicker({suggestedName: currentFileName() || fileBaseName() + ".html", types: [{description: "週案ツクール（HTML）", accept: {"text/html": [".html"]}}]});
      if (!(await safeToOverwrite(h))) { D.savedAt = prevSaved; toast("保存をやめました"); return; }
    }
    const w = await h.createWritable(); await w.write(html); await w.close();
    handle = h; await idbSet("h:" + location.href, h);
    dirty = false; showSaveState();
    try { localStorage.removeItem(DRAFT_KEY); } catch (e) {}
    const cur = currentFileName();
    if (cur && h.name !== cur) toast("「" + h.name + "」に保存しました。次からはそのファイルを開いてください", 7000);
    else toast("保存しました");
  } catch (e) {
    D.savedAt = prevSaved;
    if (e && e.name === "AbortError") toast("保存をやめました");
    else { toast("保存できませんでした。かわりにダウンロードします"); download(fileBaseName() + ".html", buildHtml(D)); }
  }
}

    t += `<tr class="sub"><td>小計</td><td>${fr(s2[0])}</td><td>${fr(s2[1])}</td><td></td></tr>`;
  }
  t += `<tr class="tot"><td>合計</td><td>${fr(s1[0] + s2[0])}</td><td>${fr(s1[1] + s2[1])}</td><td></td></tr></table>`;
  h += `<div class="side">${t}<div class="memo"><span class="k">メモ</span>\n${esc(wr.memo || "")}</div></div></div>
  <div class="rec"><span class="k">記録欄</span>\n${esc(wr.rec || "")}</div>`;
  const pe = $("#print");
  pe.style.cssText = themeVars(D.cls.theme) + `;--hw:${days.length > 5 ? 4.5 : 6}mm`;
  pe.innerHTML = h;
}

/* 時間割タブ */
let ttPick = "";
function renderTT() {
  const el = $("#tab-tt");
  const subs = gradeSubjects();
  if (ttPick && !subs.find(x => x.name === ttPick) && !isAsaEvent(ttPick)) ttPick = "";
  const c = D.cls;
  let h = `<div class="ttwrap"><div>
    <div class="tthead"><b>ふだんの時間割</b><span>${esc(c.grade ? c.grade + "年" + (c.kumi ? c.kumi + "組" : "") : "")}</span></div>
    <table class="tt2"><tr><th></th>${[1,2,3,4,5].map(w => `<th>${WD[w]}</th>`).join("")}</tr>`;
  for (let i = 0; i <= P(); i++) {
    h += `<tr><th>${i === 0 ? `朝<small>${esc(D.school.asaHours || "1/3")}時間</small>` : i}</th>`;
    for (const w of [1,2,3,4,5]) {
      const v = D.timetable[w][i] || "";
      h += `<td data-w="${w}" data-i="${i}" style="${v ? "background:" + colorOf(v) + ";border-color:" + colorOf(v) : ""}">${esc(v)}</td>`;
    }
    h += "</tr>";
  }
  h += `</table></div>
  <div class="ttpal"><div class="ttpt">教科を選んで、マスをクリック</div>
    <div class="ttbtns">${[subs.filter(x => !isSpecial(x)), subs.filter(isSpecial)].map(col => `<div>${col.map(x => `<button data-s="${esc(x.name)}" class="${ttPick === x.name ? "on" : ""}" style="--sc:${x.color}">${esc(x.name)}</button>`).join("")}</div>`).join("")}</div>
    <div class="ttpt" style="margin-top:12px">朝会（朝の欄だけ・時数に数えない）</div>
    <div class="ttbtns ttasa">${(D.school.asaEvents || []).map(n => `<button data-s="${esc(n)}" data-asa="1" class="${ttPick === n ? "on" : ""}" style="--sc:#E9E9E9">${esc(n)}</button>`).join("")}</div>
    <p class="hint">・同じ教科のマスをもう一度クリックすると消えます。<br>・押したままなぞると、まとめて入れられます。</p>
  </div></div>
  <p class="hint">ここに入れた時間割が、毎週の週案（月〜金）に自動で入ります。週案で直したところは、そちらが優先されます。祝日と学校の休業日は自動で空欄になります。</p>`;
  el.innerHTML = h;
  $$(".ttbtns button", el).forEach(b => b.onclick = () => { ttPick = ttPick === b.dataset.s ? "" : b.dataset.s; render(); });
  // クリック1回で入れる。同じ教科ならけす。なぞってまとめて入れる
  let painting = null;
  const paint = td => {
    if (isAsaEvent(ttPick) && +td.dataset.i !== 0) return;
    const w = td.dataset.w, i = +td.dataset.i;
    const v = painting === "" ? "" : ttPick;
    D.timetable[w][i] = v;
    td.textContent = v; td.style.background = v ? colorOf(v) : ""; td.style.borderColor = v ? colorOf(v) : "";
  };
  $$("td[data-w]", el).forEach(td => {
    td.onmousedown = e => {
      e.preventDefault();
      if (!ttPick) { toast("先に右の教科ボタンを選んでください"); return; }
      if (isAsaEvent(ttPick) && +td.dataset.i !== 0) { toast("朝会は朝の欄にだけ入れられます"); return; }
      painting = (D.timetable[td.dataset.w][+td.dataset.i] || "") === ttPick ? "" : ttPick;
      paint(td);
    };
    td.onmouseenter = () => { if (painting !== null) paint(td); };
  });
  const end = () => { if (painting !== null) { painting = null; changed(false); } };
  el.onmouseup = end; el.onmouseleave = end;
}

聞の記事を書く。書いた記事を読み返し、間違いを直すなどして推敲する。書いたものを友達と読み合い、漢字を正しく用いることのよさを実感する。（2/2）"],"short":["１年間の出来事を想像し、３年生までに習った漢字を使って学級新聞の記事を書くことができる。（1/2）","書いた記事を読み返して推敲し、漢字を正しく用いるよさを実感することができる。（2/2）"]},{"name":"四年生をふり返って","month":3,"total":1,"aim":"言葉には、考えたことや思ったことを表す働きがあることに気づくことができる。（知・技(1)ア）相手や目的を意識して、経験したことや想像したことなどから書くことを選び、集めた材料を比較したり分類したりして、伝えたいことを明確にすることができる。（思・判・表B(1)ア）","title":"","lessons":["１年間の学び全体を振り返る。P146「『たいせつ』のまとめ」などを見て、どのようなことを学んだのか確かめる。特に身についたと思う言葉の力を書きまとめる。"],"short":["１年間の学びを振り返り、特に身についたと思う言葉の力を書きまとめることができる。"]}]},"mitsumura-5-kokugo":{"label":"光村図書　5年　国語（年間指導計画例）","grade":5,"subject":"国語","units":[{"name":"ひみつの言葉を引き出そう","month":4,"total":1,"aim":"言葉には、相手とのつながりをつくる働きがあることに気づくことができる。（知・技(1)ア）話し手の目的や自分が聞こうとする意図に応じて、話の内容を捉えることができる。（思・判・表A(1)エ）","title":"","lessons":["扉の詩、目次、P9「国語の学びを見わたそう」を見て、学習の進め方を確かめたり、見通しをもったりする。P17を読み、５年生の国語学習での目標や楽しみなことを書く。P18-19を読み、活動のしかたを確かめる。気持ちや様子を表す言葉を、一人一つずつカードに書く。他の人に言葉が見えないように、グループの中で交換する。一人がカードを持ち、グループで２分間話す。カードに書かれている言葉を確かめ、会話を振り返る。カードを持つ人を交代して、再度行う。話してみて感じたことを振り返る。"],"short":["一年間の学習の見通しをもち、言葉が相手とのつながりをつくることに気付くことができる。"]},{"name":"かんがえるのって　おもしろい","month":4,"total":1,"aim":"詩を音読することができる。（知・技(1)ケ）","title":"","lessons":["詩を声に出して読んだり、友達の音読を聞いたりして、描かれていることを想像する。思い浮かべた様子や自分の経験と重ねて感じたことをノートに書く。ノートに書いたことを基にして、詩を読んで感じたことを伝え合う。学習を振り返る。"],"short":["詩を音読して描かれた様子を想像し、感じたことを伝え合うことができる。"]},{"name":"名前を使って、自己しょうかい・続けてみよう","month":4,"total":1,"aim":"文と文との接続の関係、話や文章の構成や展開について理解することができる。（知・技(1)カ）文章に対する感想を伝え合い、自分の文章のよいところを見つけることができる。（思・判・表B(1)カ）","title":"","lessons":["P23の作例を基に、名前を使って自分を紹介する文章の書き方を確かめる。自分を紹介する文章を書く。書いた文章をグループで読み合い、感想を伝える。「いいな。」と思った作品を、クラス全体に紹介する。名前を使って自己紹介をしてみて気づいたことを振り返る。P24「続けてみよう」を読み、日々のことを記録することの大切さに気づき、ノートの書き方について学ぶ。"],"short":["名前を使って自分を紹介する文章を書き、読み合って文章のよいところを見つけることができる。"]},{"name":"銀色の裏地","month":4,"total":5,"aim":"比喩や反復などの表現の工夫に気づくことができる。（知・技(1)ク）登場人物の相互関係や心情などについて、描写を基に捉えることができる。（思・判・表C(1)イ）","title":"人物の心情や人物どうしの関わりをとらえ、印象に残ったことを伝え合おう","lessons":["学習の見通しをもつ。","「理緒」の心情や、他の人物との関係を捉える。","登場人物の心情や人物どうしの関係が、どのように変化したのかについて想像する。","P37「考えのまとめ方」を参考に、強く印象に残ったことをまとめる。","考えたことを伝え合い、新たに考えたことや感じたことをノートに書く。学習を振り返る。"],"short":["物語の内容を捉え、学習の見通しをもつことができる。","描写を基に、「理緒」の心情や他の人物との関係を捉えることができる。","登場人物の心情や人物どうしの関係の変化を、描写を基に想像することができる。","比喩などの表現の工夫に着目し、強く印象に残ったことをまとめることができる。","考えたことを伝え合い、新たに考えたことや感じたことをまとめることができる。"]},{"name":"図書館を使いこなそう","month":4,"total":1,"aim":"日常的に読書に親しみ、読書が、自分の考えを広げることに役立つことに気づくことができる。（知・技(3)オ）","title":"","lessons":["何かをさまざまな角度から調べるときに、どのように本を探しているかについて、経験を紹介し合う。図書館での本の探し方について理解する。図書館で、複数の棚から本を探す。P41の記録カードの例を見て、読書記録のつけ方を知る。"],"short":["図書館での本の探し方を理解し、複数の棚から本を探して記録をつけることができる。"]},{"name":"漢字の成り立ち","month":4,"total":2,"aim":"漢字の由来、特質などについて理解することができる。（知・技(3)ウ）","title":"","lessons":["漢字には、大きく分けて四つの成り立ちがあることを、例とともに確認する。","P43の設問１に取り組む。P43の設問２に取り組む。学習を振り返る。"],"short":["漢字には大きく分けて四つの成り立ちがあることを、例を基に理解することができる。","漢字の成り立ちを考えながら問題に取り組み、漢字の特質を理解することができる。"]},{"name":"春の空","month":4,"total":1,"aim":"親しみやすい古文を音読するなどして、言葉の響きやリズムに親しむことができる。（知・技(3)ア）","title":"","lessons":["「枕草子」を音読して、言葉の響きやリズムを味わい、感じたことを伝え合う。「枕草子」やP45の春に関わる言葉、俳句を参考にして、春らしいものや様子を文章に書く。書いたものを交流して、感想を伝え合う。学習を振り返る。"],"short":["「枕草子」を音読して言葉の響きやリズムに親しみ、春らしい様子を文章に書くことができる。"]},{"name":"きいて、きいて、きいてみよう","month":5,"total":6,"aim":"情報と情報との関係づけのしかた、図などによる語句と語句との関係の表し方を理解し使うことができる。（知・技(2)イ）話し手の目的や自分が聞こうとする意図に応じて、話の内容を捉え、話し手の考えと比較しながら、自分の考えをまとめることができる。（思・判・表A(1)エ）","title":"話の意図を考えてきき合い、「きくこと」について考えよう","lessons":["学習の見通しをもつ。","インタビューの順番を決め、話題を考える。インタビューのためのメモを用意する。","活動のしかたや気をつける点を確かめる。","役割を交代しながらインタビューをする。記録したメモを基に報告の準備をする。記録者がインタビューの内容について報告を行い、報告を聞いて気づいたことを伝え合う。（1/2）","役割を交代しながらインタビューをする。記録したメモを基に報告の準備をする。記録者がインタビューの内容について報告を行い、報告を聞いて気づいたことを伝え合う。（2/2）","「きくこと」について考えたことを伝え合う。学習を振り返る。"],"short":["インタビューの目的を確かめ、学習の見通しをもつことができる。","インタビューの順番と話題を決め、聞きたいことをメモに準備することができる。","活動のしかたや気をつける点を確かめ、インタビューの準備を整えることができる。","話し手の意図を考えながらインタビューをし、内容を記録して報告することができる。（1/2）","役割を交代してインタビューをし、自分の考えと比べながら報告を聞くことができる。（2/2）","「きくこと」について考えたことを伝え合い、学習を振り返ることができる。"]},{"name":"見立てる・言葉の意味が分かること","month":5,"total":7,"aim":"原因と結果など情報と情報との関係について理解することができる。（知・技(2)ア）事実と感想、意見などとの関係を叙述を基に押さえ、文章全体の構成を捉えて要旨を把握することができる。（思・判・表C(1)ア）","title":"文章の要旨をとらえ、考えたことを伝え合おう","lessons":["学習の見通しをもつ。「見立てる」を読み、事例や文章構成に着目して筆者の主張を見つけて、自分の考えを伝え合う。（1/2）","学習の見通しをもつ。「見立てる」を読み、事例や文章構成に着目して筆者の主張を見つけて、自分の考えを伝え合う。（2/2）","「言葉の意味が分かること」を読み、筆者の主張を見つける。","文章の要旨を150字以内でまとめる。","文章構成や事例の挙げ方、原因と結果の関係、事例と筆者の考えの結び付きなどを確かめる。筆者の考えや、事例の示し方に対する自分の考えをまとめる。（1/2）","文章構成や事例の挙げ方、原因と結果の関係、事例と筆者の考えの結び付きなどを確かめる。筆者の考えや、事例の示し方に対する自分の考えをまとめる。（2/2）","自分の考えを伝え合う。学習を振り返る。"],"short":["事例や文章構成に着目して「見立てる」を読み、筆者の主張を見つけることができる。（1/2）","「見立てる」の筆者の主張について、自分の考えを伝え合うことができる。（2/2）","「言葉の意味が分かること」を読み、事例を基に筆者の主張を見つけることができる。","事実と意見の関係を押さえ、文章の要旨を150字以内でまとめることができる。","原因と結果の関係や事例と筆者の考えの結び付きを確かめることができる。（1/2）","筆者の考えや事例の示し方について、自分の考えをまとめることができる。（2/2）","自分の考えを伝え合い、要旨の捉え方について学習を振り返ることができる。"]},{"name":"敬語","month":6,"total":2,"aim":"日常よく使われる敬語を理解し使い慣れることができる。（知・技(1)キ）","title":"","lessons":["敬語について知る。","P65の設問１に取り組む。学習を振り返る。"],"short":["敬語について知り、相手や場面に応じた敬語の働きを理解することができる。","場面や相手に応じて、日常よく使われる敬語を適切に使うことができる。"]},{"name":"日常を十七音で","month":6,"total":3,"aim":"比喩や反復などの表現の工夫に気づくことができる。（知・技(1)ク）俳句の構成や書き表し方などに着目して、俳句を整えることができる。（思・判・表B(1)オ）","title":"表現を工夫して、俳句を作ろう","lessons":["学習の見通しをもつ。","俳句を作る材料を集める。材料を基に、５・７・５の17音の形にする。P68を参考に、表現の工夫のしかたを確かめる。","作った俳句の表現を工夫する。作った俳句を友達と読み合い、言葉や表現を工夫したところや、友達の俳句への感想を伝え合う。学習を振り返る。"],"short":["俳句の形式を確かめ、身の回りの出来事を俳句に表す学習の見通しをもつことができる。","俳句の材料を集め、表現の工夫を確かめながら5・7・5の形にすることができる。","比喩などの表現を工夫して俳句を整え、友達と読み合って感想を伝え合うことができる。"]},{"name":"漢字の広場①","month":6,"total":1,"aim":"第４学年までに配当されている漢字を書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["P70に提示された言葉を使いながら、図書館の人になったつもりで、本の場所や図書館の使い方などについて説明する文や文章を書く。書いた文や文章を読み返し、構成などを整える。書いた文や文章を読み合い、交流するとともに、示された漢字について確認する。"],"short":["第4学年までに習った漢字を使い、図書館の使い方などを説明する文章を書くことができる。"]},{"name":"古典の世界（一）","month":6,"total":2,"aim":"親しみやすい古文を音読するなどして、言葉の響きやリズムに親しむことができる。（知・技(3)ア）","title":"","lessons":["古典の世界を想像して、関心をもつ。二次元コードの音声を参考に、四つの古典作品の冒頭を音読し、現代語訳や解説から内容の大体を知る。","作品を読んで感じたことや考えたことなどをノートに書き、伝え合う。四つの作品を再度読んだり、子ども向けの古典作品集などを読んだりする。学習を振り返る。"],"short":["四つの古典作品の冒頭を音読し、内容の大体を知って言葉の響きやリズムに親しむことができる。","古典作品を読んで感じたことを伝え合い、古典の言葉の響きやリズムを楽しむことができる。"]},{"name":"目的に応じて引用するとき","month":6,"total":2,"aim":"引用して、自分の考えが伝わるように書き表し方を工夫することができる。（思・判・表B(1)エ）","title":"","lessons":["P76上段を見て、自分にも似た体験がないか想起して紹介し合い、目的に応じた引用の重要性について考えることを押さえる。P76下段を読んで、情報を書き留めるときに気をつけることを確認する。P77の文章と「山下さんの引用カード」を読んで、気づいたことを話し合う。「山下さんの引用カード」を参考にして、「手洗いの際に、蛇口を閉めることの大切さを説明する文章を書く場合」という設定で、引用カードを書く。どのような引用カードを書いたのか、伝え合う。学習を振り返る。（1/2）","P76上段を見て、自分にも似た体験がないか想起して紹介し合い、目的に応じた引用の重要性について考えることを押さえる。P76下段を読んで、情報を書き留めるときに気をつけることを確認する。P77の文章と「山下さんの引用カード」を読んで、気づいたことを話し合う。「山下さんの引用カード」を参考にして、「手洗いの際に、蛇口を閉めることの大切さを説明する文章を書く場合」という設定で、引用カードを書く。どのような引用カードを書いたのか、伝え合う。学習を振り返る。（2/2）"],"short":["目的に応じた引用の重要性に気付き、情報を書き留めるときの注意点を確かめることができる。（1/2）","引用カードの例を参考に、目的に応じて引用カードを書き、伝え合うことができる。（2/2）"]},{"name":"みんなが使いやすいデザイン","month":6,"total":8,"aim":"目的や意図に応じて、感じたことや考えたことなどから書くことを選び、集めた材料を分類したり関係づけたりして、伝えたいことを明確にすることができる。(思・判・表B(1)ア）","title":"伝えたいことを整理して、報告しよう","lessons":["学習の見通しをもつ。","調べたいことを見つける。","調べ方を選んで取材し、集めた情報を整理する。（1/2）","調べ方を選んで取材し、集めた情報を整理する。（2/2）","報告する文章の構成を考える。","報告する文章の下書きを書く。","下書きを読み直して、清書する。","書いた文章を読み合って感想を伝え合う。学習を振り返る。"],"short":["みんなが使いやすいデザインについて報告する学習の見通しをもつことができる。","身の回りのデザインから、目的に応じて調べたいことを見つけることができる。","目的に合った調べ方を選んで取材し、必要な情報を集めることができる。（1/2）","集めた情報を分類したり関係づけたりして、伝えたいことを明確にすることができる。（2/2）","伝えたいことが明確になるように、報告する文章の構成を考えることができる。","構成に沿って、調べたことが伝わるように報告する文章の下書きを書くことができる。","下書きを読み直して表現を整え、報告する文章を清書することができる。","報告する文章を読み合って感想を伝え合い、学習を振り返ることができる。"]},{"name":"同じ読み方の漢字","month":7,"total":2,"aim":"第５学年までに配当されている漢字を読むとともに、漸次書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["P84上段の問題に取り組み、同じ訓をもつ漢字でも、意味や使い方に違いがあることに気づく。P84の設問１２に取り組む。","P85上段を読み、同じ音をもつ熟語でも、意味や使い方に違いがあることに気づく。P85の設問３４に取り組む。学習を振り返る。"],"short":["同じ訓をもつ漢字の意味や使い方の違いに気付き、文の中で正しく使うことができる。","同じ音をもつ熟語の意味や使い方の違いに気付き、文の中で正しく使うことができる。"]},{"name":"夏の夜","month":7,"total":1,"aim":"親しみやすい古文を音読するなどして、言葉の響きやリズムに親しむことができる。（知・技(3)ア）","title":"","lessons":["「枕草子」を音読して、言葉の響きやリズムを味わい、感じたことを伝え合う。「枕草子」やP87の夏に関わる言葉、俳句を参考にして、夏らしいものや様子を文章に書く。書いたものを交流して、感想を伝え合う。学習を振り返る。"],"short":["「枕草子」を音読して言葉の響きやリズムに親しみ、夏らしい様子を文章に書くことができる。"]},{"name":"本は友達","month":7,"total":5,"aim":"日常的に読書に親しみ、読書が、自分の考えを広げることに役立つことに気づくことができる。（知・技(3)オ）","title":"本は友達","lessons":["学習の見通しをもつ。自分の本の選び方について、友達と話す。","「モモ」を読んで、感想を伝え合う。これから読みたい作家を決めて、その作家の本を探して読む。P91の作例を参考に「しょうかいカード」を書き、本を紹介し合う。（1/3）","「モモ」を読んで、感想を伝え合う。これから読みたい作家を決めて、その作家の本を探して読む。P91の作例を参考に「しょうかいカード」を書き、本を紹介し合う。（2/3）","「モモ」を読んで、感想を伝え合う。これから読みたい作家を決めて、その作家の本を探して読む。P91の作例を参考に「しょうかいカード」を書き、本を紹介し合う。（3/3）","自分の選んだ作家や作品の魅力を紹介し合い、気づいたことを伝え合う。学習を振り返る。"],"short":["自分の本の選び方を友達と話し合い、学習の見通しをもつことができる。","「モモ」を読んで感想を伝え合い、これから読みたい作家を決めることができる。（1/3）","選んだ作家の本を探して読み、読書が考えを広げることに気付くことができる。（2/3）","作例を参考に「しょうかいカード」を書き、本を紹介し合うことができる。（3/3）","選んだ作家や作品の魅力を紹介し合い、読書の幅を広げることができる。"]},{"name":"かぼちゃのつるが・われは草なり","month":9,"total":2,"aim":"比喩や反復などの表現の工夫に気づくことができる。（知・技(1)ク）","title":"","lessons":["二つの詩を音読する。「かぼちゃのつるが」を読み、繰り返しの表現により、どのような様子が想像されるかについて、話し合う。","「われは草なり」を読み、「われは草なり」とは、どのようなことを表しているかについて考える。二つの詩を読んで、繰り返しの表現があることの効果について、考えをまとめる。学習を振り返る。"],"short":["「かぼちゃのつるが」の繰り返しの表現から、どのような様子かを想像することができる。","二つの詩を読み、繰り返しの表現の効果について考えをまとめることができる。"]},{"name":"どちらを選びますか","month":9,"total":2,"aim":"思考に関わる語句の量を増し、話や文章の中で使うことができる。（知・技(1)オ）互いの立場や意図を明確にしながら計画的に話し合い、考えを広げたりまとめたりすることができる。（思・判・表A(1)オ）","title":"","lessons":["P104-105を読み、学習の進め方を確認する。海を薦めるチーム（二人）と、山を薦めるチーム（二人）に分かれて、チームごとに薦める理由を考えてノートに書き出す。話し合いを行う。学習を振り返る。（1/2）","P104-105を読み、学習の進め方を確認する。海を薦めるチーム（二人）と、山を薦めるチーム（二人）に分かれて、チームごとに薦める理由を考えてノートに書き出す。話し合いを行う。学習を振り返る。（2/2）"],"short":["海と山の立場に分かれ、薦める理由を考えてノートに書き出すことができる。（1/2）","互いの立場や意図を明確にしながら話し合い、考えを広げることができる。（2/2）"]},{"name":"新聞を読もう","month":9,"total":2,"aim":"目的に応じて、文章と図表などを結び付けるなどして必要な情報を見つけたり、論の進め方について考えたりすることができる。（思・判・表C(1)ウ）","title":"","lessons":["新聞の１面の構成について確認する。P108-109の二つの記事を読み、どんな違いがあるか、どうして違うのかを考え、ノートに書く。二つの記事を比べて考えたことについて話し合う。","新聞の中から自分が興味をもったニュースを一つ選び、そのニュースについて、複数の記事を読み比べ、思ったことや考えたことをノートに書く。ノートに書いたことを基に、自分の選んだニュースや記事について紹介し合う。学習を振り返る。"],"short":["新聞の1面の構成を確かめ、二つの記事を比べて違いとその理由を考えることができる。","興味をもったニュースの複数の記事を読み比べ、考えたことを紹介し合うことができる。"]},{"name":"文章に説得力をもたせるには","month":9,"total":2,"aim":"筋道の通った文章となるように、文章全体の構成や展開を考えることができる。（思・判・表B(1)イ）","title":"","lessons":["意見文における「主張」と「根拠」について知る。P110-111の意見文の例を読み、「主張」と「根拠」がどのように書かれているかを確かめる。","自分が毎日を安全に過ごすための方法について意見文を書くと仮定して、構成や、どのまとまりにどんなことを書くかを考えて、伝え合う。学習を振り返る。"],"short":["意見文の例を読み、「主張」と「根拠」がどのように書かれているかを確かめることができる。","筋道の通った意見文になるように、構成やまとまりごとに書くことを考えることができる。"]},{"name":"漢字の広場②","month":9,"total":1,"aim":"第４学年までに配当されている漢字を書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["P112に提示された言葉を使いながら、作家になったつもりで、登山家の半生を文章に書く。書いた文章を読み返し、構成などを整える。書いた文章を友達と読み合い、交流するとともに、示された漢字について確認する。"],"short":["第4学年までに習った漢字を使い、登山家の半生を文章に書くことができる。"]},{"name":"たずねびと","month":9,"total":6,"aim":"人物像や物語などの全体像を具体的に想像したり、表現の効果を考えたりすることができる。（思・判・表C(1)エ）","title":"物語の全体像を想像し、考えたことを伝え合おう","lessons":["学習の見通しをもつ。","本文を読んで、「綾」の心情の変化を捉える。","P129「言葉に着目しよう」を参考にし、物語の全体像を想像する。（1/2）","P129「言葉に着目しよう」を参考にし、物語の全体像を想像する。（2/2）","自分の思いや考えにどのような変化があったかについて、ノートにまとめる。","まとめたことを友達と伝え合う。学習を振り返る。"],"short":["物語の内容を捉え、全体像を想像する学習の見通しをもつことができる。","本文を読み、「綾」の心情の変化を捉えることができる。","言葉に着目し、物語の全体像を具体的に想像することができる。（1/2）","表現の効果を考えながら、物語の全体像を想像することができる。（2/2）","物語を読んで、自分の思いや考えにどのような変化があったかをまとめることができる。","まとめたことを友達と伝え合い、物語の全体像について考えを広げることができる。"]},{"name":"漢字の広場③","month":10,"total":1,"aim":"第４学年までに配当されている漢字を書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["P131に提示された言葉を使いながら、各教科での学習や学校生活について、学級日誌に記録するように文章を書く。書いた文章を読み返し、構成などを整える。書いた文章を友達と読み合い、交流するとともに、示された漢字について確認する。"],"short":["第4学年までに習った漢字を使い、学級日誌に記録するように文章を書くことができる。"]},{"name":"方言と共通語","month":10,"total":2,"aim":"共通語と方言との違いを理解することができる。（知・技(3)ウ）","title":"","lessons":["方言と共通語について知る。方言と共通語の特徴と必要性を確かめる。設問に取り組む。学習を振り返る。（1/2）","方言と共通語について知る。方言と共通語の特徴と必要性を確かめる。設問に取り組む。学習を振り返る。（2/2）"],"short":["方言と共通語の特徴について知り、それぞれの違いを理解することができる。（1/2）","方言と共通語の必要性を確かめ、場面に応じた使い分けを理解することができる。（2/2）"]},{"name":"秋の夕","month":10,"total":1,"aim":"親しみやすい古文を音読するなどして、言葉の響きやリズムに親しむことができる。（知・技(3)ア）","title":"","lessons":["「枕草子」を音読して、言葉の響きやリズムを味わい、感じたことを伝え合う。「枕草子」やP135の秋に関わる言葉、俳句を参考にして、秋らしいものや様子を文章に書く。書いたものを交流して、感想を伝え合う。学習を振り返る。"],"short":["「枕草子」を音読して言葉の響きやリズムに親しみ、秋らしい様子を文章に書くことができる。"]},{"name":"よりよい学校生活のために","month":10,"total":6,"aim":"情報と情報との関係づけのしかた、図などによる語句と語句との関係の表し方を理解し使うことができる。（知・技(2)イ）目的や意図に応じて、日常生活の中から話題を決め、集めた材料を分類したり関係づけたりして、伝え合う内容を検討することができる。（思・判・表A(1)ア）互いの立場や意図を明確にしながら計画的に話し合い、考えを広げたりまとめたりすることができる。（思・判・表A(1)オ）","title":"たがいの立場を明確にして、話し合おう","lessons":["学習の見通しをもつ。","学校生活の中から、議題を決める。","自分の立場を明らかにするために、考えを書き出す。","話し合いのしかたを全体で確認して、進行計画を立てる。話し合いのときに気をつけることを確認する。","計画に沿って、グループで話し合う。","話し合った結果をクラス全体へ報告し、感想を伝え合う。学習を振り返る。"],"short":["立場を明確にして話し合う学習の見通しをもつことができる。","学校生活の中から、話し合う議題を決めることができる。","考えを書き出して分類したり関係づけたりし、自分の立場を明らかにすることができる。","話し合いのしかたを確かめ、目的に応じた進行計画を立てることができる。","互いの立場や意図を明確にしながら、計画に沿って話し合うことができる。","話し合った結果を報告して感想を伝え合い、学習を振り返ることができる。"]},{"name":"浦島太郎――「御伽草子」より","month":11,"total":1,"aim":"古典について解説した文章を読んだり作品の内容の大体を知ったりすることを通して、昔の人のものの見方や感じ方を知ることができる。（知・技(3)イ）","title":"","lessons":["P144-145を読み、「浦島太郎」の結末について知ることを発表し合う。二次元コードを活用して古典の文章の朗読を聞いたのち、繰り返し音読する。「知っている話と違う」「今の自分たちにも、気持ちが分かる」などの視点で考えをもち、友達と話し合う。学習を振り返る。"],"short":["「浦島太郎」を音読して内容の大体を知り、昔の人のものの見方や感じ方を知ることができる。"]},{"name":"和語・漢語・外来語","month":11,"total":2,"aim":"語句の由来などに関心をもつとともに、世代による言葉の違いに気づくことができる。（知・技(3)ウ）","title":"","lessons":["言葉には、「和語」「漢語」「外来語」があることを知る。P147の設問に取り組み、漢語と和語で意味が異なる場合があることを知る。","和語・漢語・外来語の使い分けについて考える。身の回りにある文章から、和語・漢語・外来語を探して発表し合い、どのような文章の中に多く見られるかを確かめる。学習を振り返る。"],"short":["和語・漢語・外来語があることを知り、意味の違いに気付くことができる。","身の回りの文章から和語・漢語・外来語を探し、使い分けについて考えることができる。"]},{"name":"固有種が教えてくれること・自然環境を守るために","month":11,"total":10,"aim":"原因と結果など情報と情報との関係について理解することができる。（知・技(2)ア）引用したり、図表やグラフを用いたりして、自分の考えが伝わるように書き表し方を工夫することができる。（思・判・表B(1)エ）目的に応じて、文章と図表などを結び付けるなどして必要な情報を見つけたり、論の進め方について考えたりすることができる。（思・判・表C(1)ウ）","title":"資料を用いた文章の効果を考え、それをいかして書こう","lessons":["学習の見通しをもつ。「固有種が教えてくれること」を読むことで、初めて知ったことや興味をもったことを出し合う。","文章の構成を整理して、内容を捉える。筆者が図表やグラフ、写真を使った意図と効果を考える。（1/2）","文章の構成を整理して、内容を捉える。筆者が図表やグラフ、写真を使った意図と効果を考える。（2/2）","筆者の考えや説明の工夫について、資料の効果にも触れながら、自分の考えをまとめる。筆者の説明の工夫について、グループで伝え合う。学校図書館などで、環境に関する図書を読み、内容や説明のしかたについて感想を伝え合う。学習を振り返り、次の学習の見通しをもつ。（1/2）","筆者の考えや説明の工夫について、資料の効果にも触れながら、自分の考えをまとめる。筆者の説明の工夫について、グループで伝え合う。学校図書館などで、環境に関する図書を読み、内容や説明のしかたについて感想を伝え合う。学習を振り返り、次の学習の見通しをもつ。（2/2）","前時までの学習をいかし、環境問題について自分の考えを書くことを確かめる。統計資料を集め、自分の考えをもつ。自然環境について、自分の考えをもつ。","「初め」「中」「終わり」の構成で、書くことを整理する。","グラフや表を用いて、考えを書く。（1/2）","グラフや表を用いて、考えを書く。（2/2）","書いた文章を友達と読み合い、説得力のあるところについて、意見や感想を交流する。学習を振り返る。"],"short":["「固有種が教えてくれること」を読んで感想を出し合い、学習の見通しをもつことができる。","文章の構成を整理して内容を捉え、原因と結果の関係を確かめることができる。（1/2）","筆者が図表やグラフ、写真を使った意図と効果を考えることができる。（2/2）","資料の効果に触れながら、筆者の説明の工夫について考えをまとめることができる。（1/2）","筆者の説明の工夫を伝え合い、環境に関する図書を読んで感想を伝え合うことができる。（2/2）","統計資料を集めて、自然環境について自分の考えをもつことができる。","「初め」「中」「終わり」の構成で、書くことを整理することができる。","グラフや表を用いて、自分の考えが伝わるように文章を書くことができる。（1/2）","資料と文章の結び付きを見直し、考えが伝わる文章に仕上げることができる。（2/2）","書いた文章を読み合い、説得力のあるところについて感想を交流することができる。"]},{"name":"カンジー博士の暗号解読","month":11,"total":2,"aim":"第５学年までに配当されている漢字を読むとともに、漸次書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["P166を読み、暗号の解読のしかたを確かめる。設問に取り組み、グループで確かめ合う。暗号文を作り、グループで解き合う。（1/2）","P166を読み、暗号の解読のしかたを確かめる。設問に取り組み、グループで確かめ合う。暗号文を作り、グループで解き合う。（2/2）"],"short":["暗号の解読のしかたを確かめ、第5学年までに習った漢字を読むことができる。（1/2）","漢字を使って暗号文を作り、グループで解き合うことができる。（2/2）"]},{"name":"古典の世界（二）","month":12,"total":1,"aim":"親しみやすい漢文を音読するなどして、言葉の響きやリズムに親しむことができる。（知・技(3)ア）","title":"","lessons":["教師の範読（朗読ＣＤ、デジタル教科書、二次元コードの音声）を聞き、読み方やリズムを知る。「論語」や漢詩「春暁」を声に出して読む。グループで交互に音読を聞き合いながら、漢文特有の言い回しやリズムを楽しむ。"],"short":["「論語」や漢詩「春暁」を音読し、漢文特有の言い回しやリズムに親しむことができる。"]},{"name":"漢字の広場④","month":12,"total":1,"aim":"第４学年までに配当されている漢字を書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["P170に提示された言葉（県名）を使いながら、それぞれのますに入る文を書く。書いた文を読み返すなどして、構成などを考える。書いた文を見せ合って紹介し合うとともに、示された漢字を確認する。"],"short":["第4学年までに習った漢字（県名）を使い、文を書いて紹介し合うことができる。"]},{"name":"やなせたかし――アンパンマンの勇気","month":12,"total":5,"aim":"日常的に読書に親しみ、読書が、自分の考えを広げることに役立つことに気づくことができる。（知・技(3)オ）文章を読んで理解したことに基づいて、自分の考えをまとめることができる。（思・判・表C(1)オ）","title":"伝記を読み、自分の生き方について考えよう","lessons":["学習の見通しをもつ。","伝記に取り上げられている出来事を確かめる。考え方に着目して、「たかし」の人物像をまとめる。「たかし」の行動や考え方について、自分の考えを書く。（1/2）","伝記に取り上げられている出来事を確かめる。考え方に着目して、「たかし」の人物像をまとめる。「たかし」の行動や考え方について、自分の考えを書く。（2/2）","選んで読んだ本（伝記）について、考えたことを200字程度で書く。","書いた文章を読み合い、感想を伝え合う。学習を振り返る。"],"short":["伝記を読んで自分の生き方について考える学習の見通しをもつことができる。","伝記に取り上げられている出来事を確かめ、「たかし」の人物像をまとめることができる。（1/2）","「たかし」の行動や考え方について、自分の考えをまとめて書くことができる。（2/2）","選んで読んだ伝記について、考えたことを200字程度で書くことができる。","書いた文章を読み合って感想を伝え合い、読書が考えを広げることに気付くことができる。"]},{"name":"あなたは、どう考える","month":12,"total":6,"aim":"語感や言葉の使い方に対する感覚を意識して、語や語句を使うことができる。（知・技(1)オ）文章全体の構成や展開が明確になっているかなど、文章に対する感想や意見を伝え合い、自分の文章のよいところを見つけることができる。（思・判・表B(1)カ）","title":"意見文を書いて読み合い、よいところを見つけよう","lessons":["学習の見通しをもつ。","自分の関心のあることから題材を決め、主張を考える。","自分の考えを見直したり、グループで見せ合ったりして、他の立場から自分の考えを見直す。","文章の構成を考える。構成を基に、意見文を書く。書いた文章を読み返して、文章を推敲する。（1/2）","文章の構成を考える。構成を基に、意見文を書く。書いた文章を読み返して、文章を推敲する。（2/2）","意見文を読んで感想を伝え合い、文章のよさを見つける。学習を振り返る。"],"short":["意見文を書いて読み合う学習の見通しをもつことができる。","自分の関心のあることから題材を決め、主張を考えることができる。","グループで考えを見せ合い、他の立場から自分の考えを見直すことができる。","主張が明確になるように文章の構成を考え、意見文を書くことができる。（1/2）","言葉の使い方を意識して意見文を読み返し、推敲することができる。（2/2）","意見文を読んで感想を伝え合い、文章のよいところを見つけることができる。"]},{"name":"冬の朝","month":12,"total":1,"aim":"親しみやすい古文を音読するなどして、言葉の響きやリズムに親しむことができる。（知・技(3)ア）","title":"","lessons":["「枕草子」を音読して、言葉の響きやリズムを味わい、感じたことを伝え合う。「枕草子」やP191の冬に関わる言葉、俳句を参考にして、冬らしいものや様子を文章に書く。書いたものを交流して、感想を伝え合う。学習を振り返る。"],"short":["「枕草子」を音読して言葉の響きやリズムに親しみ、冬らしい様子を文章に書くことができる。"]},{"name":"好きな詩のよさを伝えよう","month":1,"total":2,"aim":"比喩や反復などの表現の工夫に気づくことができる。（知・技(1)ク）目的や意図に応じて、感じたことや考えたことなどから書くことを選ぶことができる。（思・判・表B(1)ア）文章を読んでまとめた意見や感想を共有し、自分の考えを広げることができる。（思・判・表C(1)カ）","title":"","lessons":["教科書にある詩を繰り返し音読し、好きなところや気づいたことなどについて、ノートに書く。それぞれの詩の工夫を確かめる。教科書にある詩からお気に入りの詩を選び、どこがいいのかをまとめて書く。","好きな詩を紹介するカードを書く。カードを基にして詩を紹介し合う。学習を振り返る。"],"short":["詩を繰り返し音読して表現の工夫に気付き、好きな詩のよさをまとめて書くことができる。","好きな詩を紹介するカードを書いて紹介し合い、自分の考えを広げることができる。"]},{"name":"言葉でスケッチ","month":1,"total":2,"aim":"目的や意図に応じて事実と感想とを区別して書くなど、自分の考えが伝わるように書き表し方を工夫することができる。（思・判・表B(1)ウ）","title":"","lessons":["メモの書き方をつかむ。","P195「例」のよいところを見つけて、情景が伝わってくる表現の工夫のしかたを確かめる。自分が選んだ写真を、言葉で表現する。完成した文章を読み合い、よいところを伝え合う。学習を振り返る。"],"short":["見たことや感じたことを書き留めるメモの書き方をつかむことができる。","表現を工夫し、選んだ写真の情景が伝わるように言葉で表すことができる。"]},{"name":"熟語の読み方","month":1,"total":2,"aim":"第５学年までに配当されている漢字を読むことができる。（知・技(1)エ）","title":"","lessons":["P196上段の熟語は、それぞれの漢字を音読みと訓読みのどちらで読んでいるかを考える。重箱読みと湯桶読みの熟語について理解する。設問１に取り組み、音読みと訓読みの組み合わせになっている熟語を探す。","P197を読んで、特別な読み方をする熟語があることを知る。設問２に取り組み、熟語の読み方を考える。特別な読み方をする熟語を見つけてクイズにして、紹介し合う。"],"short":["重箱読みと湯桶読みを理解し、音読みと訓読みを組み合わせた熟語を読むことができる。","特別な読み方をする熟語があることを知り、熟語を正しく読むことができる。"]},{"name":"漢字の広場⑤","month":1,"total":1,"aim":"第４学年までに配当されている漢字を書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["P198に提示された言葉とつなぎ言葉を使って、駅からおばあちゃんの家までの道順を案内する文章を書く。書いた文章を読み返すなどして、つなぎ言葉の使い方や構成などを考える。書いた文章を見せ合い、違う道順や違う表現で書いた友達と紹介し合うとともに、示された漢字を確認する。"],"short":["第4学年までに習った漢字とつなぎ言葉を使い、道順を案内する文章を書くことができる。"]},{"name":"想像力のスイッチを入れよう","month":1,"total":6,"aim":"文章を読んで理解したことに基づいて、自分の考えをまとめることができる。（思・判・表C(1)オ）","title":"事例と意見の関係をおさえて読み、考えたことを伝え合おう","lessons":["学習の見通しをもつ。","筆者が伝えようとしていることを捉える。筆者が挙げた事例と、それぞれの事例に対する筆者の意見をまとめる。事例を挙げて説明することの効果について話し合う。（1/2）","筆者が伝えようとしていることを捉える。筆者が挙げた事例と、それぞれの事例に対する筆者の意見をまとめる。事例を挙げて説明することの効果について話し合う。（2/2）","筆者が考える「想像力のスイッチ」について、まとめる。","P206「もっと読もう」を参考にして、自分の経験を想起して、メディアとの関わり方についての自分の考えを文章に書く。","書いたものを読み合い、互いの考え方の類似点や相違点を見つけて伝え合う。学習を振り返る。"],"short":["事例と意見の関係を押さえて読む学習の見通しをもつことができる。","筆者が挙げた事例とそれぞれに対する筆者の意見をまとめることができる。（1/2）","事例を挙げて説明することの効果について話し合うことができる。（2/2）","筆者が考える「想像力のスイッチ」について、まとめることができる。","自分の経験を基に、メディアとの関わり方についての考えを文章に書くことができる。","書いたものを読み合い、互いの考えの類似点や相違点を伝え合うことができる。"]},{"name":"複合語","month":1,"total":2,"aim":"語句の構成や変化について理解し、語彙を豊かにすることができる。（知・技(1)オ）","title":"","lessons":["複合語について知る。複合語の種類を確かめる。","複合語の特徴を確かめる。学習を振り返る。"],"short":["複合語について知り、その種類を確かめることができる。","複合語の特徴を確かめ、語句の構成や変化について理解することができる。"]},{"name":"言葉を使い分けよう","month":2,"total":3,"aim":"言葉には、相手とのつながりをつくる働きがあることに気づくことができる。（知・技(1)ア）語感や言葉の使い方に対する感覚を意識して、語や語句を使うことができる。（知・技(1)オ）目的や意図に応じて簡単に書いたり詳しく書いたりするなど、自分の考えが伝わるように書き表し方を工夫することができる。（思・判・表B(1)ウ）","title":"言葉について考えよう","lessons":["学習の見通しをもつ。相手に応じた言葉の選び方について考える。","相手や場に応じた言い方について考える。P215の課題に取り組む。","言葉や表現に気をつけて手紙の文面を考える。学習を振り返る。"],"short":["相手に応じた言葉の選び方について考え、学習の見通しをもつことができる。","相手や場に応じた言い方について考え、言葉を使い分けることができる。","相手との関係を意識し、言葉や表現に気をつけて手紙の文面を考えることができる。"]},{"name":"もう一つの物語","month":2,"total":6,"aim":"話や文章の構成や展開、話や文章の種類とその特徴について理解することができる。（知・技(1)カ）筋道の通った文章となるように、文章全体の構成や展開を考えることができる。（思・判・表B(1)イ）","title":"読む人を意識して構成を考え、物語を書こう","lessons":["学習の見通しをもつ。","作例を基に、「何を」「どのように」書き換えているかをつかむ。書き換えたい物語を選び、変える部分を考える。","読む人を意識して、物語の構成を考える。","表現を工夫して、物語の下書きをする。","物語を清書する。","読み合って、感想を伝え合う。学習を振り返る。"],"short":["物語を書き換える学習の見通しをもつことができる。","作例から書き換え方をつかみ、選んだ物語の変える部分を考えることができる。","読む人を意識して、筋道の通った物語の構成を考えることができる。","表現を工夫して、物語の下書きをすることができる。","構成や表現を見直して、物語を清書することができる。","書いた物語を読み合って感想を伝え合い、学習を振り返ることができる。"]},{"name":"「子ども未来科」で何をする","month":2,"total":6,"aim":"話し言葉と書き言葉との違いに気づくことができる。（知・技(1)イ）話の内容が明確になるように、事実と感想、意見とを区別するなど、話の構成を考えることができる。（思・判・表A(1)イ）","title":"事実と感想、意見とを区別して、説得力のある提案をしよう","lessons":["学習の見通しをもつ。","P225「山下さんのスピーチ」を参考に、「何を」「どのように」に伝えるスピーチなのかの見通しをもつ。考えてみたいテーマを決める。","テーマから課題を考え、情報を集める。","スピーチの構成を考える。","スピーチメモを基にして、練習をする。","スピーチをする。感想を伝え合う。学習を振り返る。"],"short":["提案するスピーチをする学習の見通しをもつことができる。","スピーチの例を参考に伝え方の見通しをもち、考えてみたいテーマを決めることができる。","テーマから課題を考え、提案に必要な情報を集めることができる。","事実と感想、意見とを区別して、スピーチの構成を考えることができる。","話し言葉と書き言葉の違いに気付き、スピーチメモを基に練習することができる。","提案するスピーチをして感想を伝え合い、学習を振り返ることができる。"]},{"name":"大造じいさんとガン","month":3,"total":6,"aim":"文章を読んでまとめた意見や感想を共有し、自分の考えを広げることができる。（思・判・表C(1)カ）","title":"登場人物の心情の変化に着目して読み、物語のみりょくを伝え合おう","lessons":["学習の見通しをもつ。","「残雪」に対する「大造じいさん」の心情と、その変化に着目して、物語の内容を捉える。物語の山場について考える。（1/2）","「残雪」に対する「大造じいさん」の心情と、その変化に着目して、物語の内容を捉える。物語の山場について考える。（2/2）","読み深める観点を選んで、物語の魅力を見つけて自分の言葉でまとめる。","物語の魅力とそう考える理由をまとめる。選んだ場面や文を朗読で表現する。学習を振り返る。（1/2）","物語の魅力とそう考える理由をまとめる。選んだ場面や文を朗読で表現する。学習を振り返る。（2/2）"],"short":["物語のみりょくを伝え合う学習の見通しをもつことができる。","「残雪」に対する「大造じいさん」の心情の変化に着目し、内容を捉えることができる。（1/2）","「大造じいさん」の心情の変化を基に、物語の山場について考えることができる。（2/2）","読み深める観点を選び、物語の魅力を自分の言葉でまとめることができる。","物語の魅力とそう考える理由をまとめ、友達と共有することができる。（1/2）","選んだ場面や文を朗読で表現し、物語の魅力を伝え合うことができる。（2/2）"]},{"name":"漢字の広場⑥","month":3,"total":1,"aim":"第４学年までに配当されている漢字を書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["P249に提示された言葉を使いながら、新聞記者になったつもりで、出来事を報道する文章を書く。書いた文章を読み返すなどして、構成などを考える。書いた文章を見せ合い、交流するとともに、示された漢字を確認する。"],"short":["第4学年までに習った漢字を使い、新聞記者になって出来事を報道する文章を書くことができる。"]},{"name":"五年生をふり返って","month":3,"total":1,"aim":"言葉には、相手とのつながりをつくる働きがあることに気づくことができる。（知・技(1)ア）目的や意図に応じて、感じたことや考えたことなどから書くことを選ぶことができる。（思・判・表B(1)ア）","title":"","lessons":["１年間の国語学習を振り返る。「自分自身についた言葉の力」と「その力のいかし方」について、自分の考えをまとめて書く。書いた考えを友達と紹介し合う。"],"short":["一年間の国語学習を振り返り、身についた言葉の力とそのいかし方を書くことができる。"]}]},"mitsumura-6-kokugo":{"label":"光村図書　6年　国語（年間指導計画例）","grade":6,"subject":"国語","units":[{"name":"つないで、つないで、一つのお話","month":4,"total":1,"aim":"自分が聞こうとする意図に応じて、話の内容を捉え、自分の考えをまとめることができる。（思・判・表A(1)エ）","title":"","lessons":["扉の詩、目次、P9「国語の学びを見わたそう」を見て、学習の進め方を確かめたり、見通しをもったりする。P17を読み、６年生の国語学習の目標を書く。「つないで、つないで、一つのお話」の活動の目的と流れを確かめる。最初と最後の１文を決め、グループで２周する間にお話が完結するように１文ずつ話をつなぐ。時間に余裕があれば、「もっと楽しもう」に挑戦する。できたお話を発表して感想を伝え合ったり、友達とお話を作ってどう感じたかを振り返ったりする。"],"short":["一年間の学習の見通しをもち、友達の話を捉えながら一文ずつつないで、一つのお話を作ることができる。"]},{"name":"準備","month":4,"total":1,"aim":"詩を音読することができる。（知・技(1)ケ）","title":"","lessons":["詩の内容や情景を思い浮かべながら音読する。音読を聞き合い、互いに感じたことを伝え合う。学習のまとめをする。"],"short":["詩の情景を思い浮かべ、反復などの表現の工夫に気付き、工夫して音読することができる。"]},{"name":"伝わるかな、好きな食べ物・続けてみよう","month":4,"total":1,"aim":"比喩や反復などの表現の工夫に気づくことができる。（知・技(1)ク）文章全体の構成や展開が明確になっているかなど、文章に対する感想や意見を伝え合い、自分の文章のよいところを見つけることができる。（思・判・表B(1)カ）","title":"","lessons":["「伝わるかな、好きな食べ物」の活動の目的と流れを確かめる。紹介する食べ物を決め、見た目や食感などの特徴を想起し、書く内容を考える。比喩を用いるなど表現を工夫しながら、おいしさが伝わるように文章を書く。文章を読み合い、何の食べ物かを当て合う。時間に余裕があれば、「もっと楽しもう」に挑戦する。自分が書いた文章のよさや、友達が書いた文章で印象に残った表現について振り返る。P24「続けてみよう」を読み、年間を通した継続的な活動に取り組む意欲をもち、ノートの書き方について学ぶ。"],"short":["比喩などの表現の工夫に気付き、好きな食べ物のおいしさが伝わるように文章を書くことができる。"]},{"name":"帰り道","month":4,"total":5,"aim":"文章の構成や展開、文章の種類とその特徴について理解することができる。（知・技(1)カ）登場人物の相互関係や心情などについて、描写を基に捉えることができる。（思・判・表Ｃ(1)イ）","title":"視点や作品の構成に着目して読み、印象に残ったことを伝え合おう","lessons":["学習の見通しをもつ。","「律」と「周也」の心情や関係の変化を考える。","「律」と「周也」の人物像を考え、交流する。","特に印象に残ったことについて考えをまとめる。","考えたことを伝え合う。学習を振り返る。"],"short":["物語の内容を想像し、問いをもって学習計画を立てることができる。","天気雨の前後の描写を基に、「律」と「周也」の心情や関係の変化を捉えることができる。","様々な視点から二人の人物像を考え、構成の効果に気付くことができる。","構成・内容・表現などの観点から、特に印象に残ったことについて考えをまとめることができる。","考えたことを伝え合い、物語の構成や表現の特徴について学びを振り返ることができる。"]},{"name":"公共図書館を活用しよう","month":4,"total":1,"aim":"日常的に読書に親しみ、読書が、自分の考えを広げることに役立つことに気づくことができる。（知・技(3)オ）","title":"","lessons":["公共図書館を利用した経験を想起する。公共図書館で利用できる資料やサービスを確かめ、利用してみたいものを出し合う。P42「図書館以外の施設も活用しよう」を読み、図書館以外の施設にどんなものがあるかを知る。P43の記録カードの例を参考に、読んだ本や調べたことの記録のしかたを知る。"],"short":["公共図書館の資料やサービスを知り、読書や調べたことを記録カードにまとめる方法に気付くことができる。"]},{"name":"漢字の形と音・意味","month":4,"total":2,"aim":"漢字の由来、特質などについて理解することができる。（知・技(3)ウ）","title":"","lessons":["同じ部分をもつ漢字には、音も共通する場合があることを理解する。","同じ部分をもつ漢字には、意味のうえでつながりがある場合があることを理解する。学習のまとめをする。"],"short":["同じ部分をもつ漢字には音が共通するものがあることに気付き、漢字を読み書きすることができる。","同じ部分をもつ漢字には意味のつながりがあることに気付き、漢字の特質を理解することができる。"]},{"name":"春のいぶき","month":4,"total":1,"aim":"語句と語句との関係について理解し、語彙を豊かにするとともに、語感や言葉の使い方に対する感覚を意識して、語や語句を使うことができる。（知・技(1)オ）","title":"","lessons":["春のイメージを広げる。自分の地域の今の「春」を、俳句や短歌に表す。書いた作品をグループで読み合う。"],"short":["季節を表す言葉に気付き、身の回りで感じた「春」を俳句や短歌に表すことができる。"]},{"name":"聞いて、考えを深めよう","month":5,"total":6,"aim":"語感や言葉の使い方に対する感覚を意識して、語や語句を使うことができる。（知・技(1)オ）話し手の目的や自分が聞こうとする意図に応じて、話の内容を捉え、話し手の考えと比較しながら、自分の考えをまとめることができる。（思・判・表A(1)エ）","title":"インタビューをして、自分の考えと比べながら聞こう","lessons":["学習の見通しをもつ。","インタビューの相手を決め、知りたいことを明らかにする。","インタビューをする。（1/2）","インタビューをする。（2/2）","話を聞いて考えたことを、伝え合う。","学習を振り返る。"],"short":["インタビューの目的を確かめ、学習の見通しをもつことができる。","インタビューの相手を決め、目的に応じて知りたいことを明らかにすることができる。","相手の考えと自分の考えを比べながら、インタビューをすることができる。（1/2）","相手の考えと自分の考えを比べながら聞き、話の内容を捉えることができる。（2/2）","インタビューで聞いたことを基に、自分の考えをまとめて伝え合うことができる。","言葉の使い方や聞き方について振り返り、身につけた力を確かめることができる。"]},{"name":"漢字の広場①","month":5,"total":1,"aim":"第５学年までに配当されている漢字を書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["教科書の絵を見て、町のあちこちで起こっている出来事を想像する。提示された言葉を使い、５年生までに習った漢字を正しく用いて、それぞれの出来事を町の人に伝える記事を書く。"],"short":["５年生までに習った漢字を正しく使い、町の出来事を伝える記事を書くことができる。"]},{"name":"笑うから楽しい・時計の時間と心の時間","month":5,"total":7,"aim":"原因と ],"short":["季節を表す言葉に気付き、身の回りで感じた「冬」を手紙に書くことができる。"]},{"name":"詩を朗読してしょうかいしよう","month":1,"total":2,"aim":"詩を朗読することができる。（知・技(1)ケ）","title":"","lessons":["三つの詩を朗読する。","お気に入りの詩を朗読する。"],"short":["詩の表現の工夫に気付き、思いが伝わるように朗読することができる。","お気に入りの詩を選び、聞き手を意識して朗読することができる。"]},{"name":"知ってほしい、この名言","month":1,"total":2,"aim":"情報と情報との関係づけのしかた、図などによる語句と語句との関係の表し方を理解し使うことができる。（知・技(2)イ）目的や意図に応じて、感じたことや考えたことなどから書くことを選び、集めた材料を分類したり関係づけたりして、伝えたいことを明確にすることができる。（思・判・表B(1)ア）","title":"","lessons":["名言だと思う言葉を集める。集めた言葉を整理する。","言葉を選んでカードに書き、読み合う。学習を振り返る。"],"short":["心に残る名言を集め、情報と情報の関係に気付きながら整理することができる。","伝えたい言葉を選んでカードに書き、読み合うことができる。"]},{"name":"日本の文字文化","month":1,"total":2,"aim":"文や文章の中で漢字と仮名を適切に使い分けるとともに、送り仮名や仮名遣いに注意して正しく書くことができる。（知・技(1)ウ）語句の由来などに関心をもち、仮名及び漢字の由来、特質などについて理解することができる。（知・技(3)ウ）","title":"","lessons":["「問いをもとう」を基に、身の回りで使われている文字や、その特徴について考える。P200-201「日本語の表記」を読む。P201の設問１に取り組む。","P201-202「仮名の由来」を読む。学習のまとめをする。"],"short":["身の回りの文字の特徴に気付き、日本語の表記について理解することができる。","仮名の由来に気付き、漢字と仮名を適切に使い分けることができる。"]},{"name":"漢字の広場⑤","month":1,"total":1,"aim":"第５学年までに配当されている漢字を書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["教科書の絵を見て、商店街の通りやお店の中の様子、人々の会話を想像する。提示された言葉を使い、５年生までに習った漢字を正しく用いて、商店街の様子を表す文章を書く。"],"short":["５年生までに習った漢字を正しく使い、商店街の様子を表す文章を書くことができる。"]},{"name":"「考える」とは","month":1,"total":6,"aim":"文章の構成や展開、文章の種類とその特徴について理解することができる。（知・技(1)カ）文章を読んで理解したことに基づいて、自分の考えをまとめることができる。（思・判・表C(1)オ）文章を読んでまとめた意見や感想を共有し、自分の考えを広げることができる。（思・判・表C(1)カ）","title":"筆者の考えを読み取り、テーマについて考えを述べ合おう","lessons":["学習の見通しをもつ。","それぞれの文章で筆者が最も伝えたいことを考える。","筆者がどのように自分の考えを伝えようとしているか、文章の特徴を明らかにする。（1/2）","筆者がどのように自分の考えを伝えようとしているか、文章の特徴を明らかにする。（2/2）","三つの文章を読んで考えたことをまとめる。","グループで考えを伝え合い、自分の考えを広げたり深めたりする。学習を振り返る。"],"short":["三つの文章を読む目的を確かめ、学習の見通しをもつことができる。","それぞれの文章で、筆者が最も伝えたいことを捉えることができる。","筆者の考えの伝え方に気付き、文章の特徴を明らかにすることができる。（1/2）","三つの文章を比べ、構成や表現の特徴を捉えることができる。（2/2）","三つの文章を読んで考えたことを、自分の考えとしてまとめることができる。","考えを伝え合い、自分の考えを広げたり深めたりすることができる。"]},{"name":"使える言葉にするために","month":1,"total":1,"aim":"第６学年までに配当されている漢字を読み、漸次書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["言葉を使う場面や、使い方を理解するために、どのようなことをすればよいか、友達と話し合う。P216の設問（▼）に示されている言葉について、読み方や意味が分からないものがあれば、辞書で調べる。"],"short":["言葉を使える言葉にする方法に気付き、辞書で読み方や意味を調べて使うことができる。"]},{"name":"日本語の特徴","month":1,"total":3,"aim":"語句と語句との関係、語句の構成や変化について理解し、語彙を豊かにするとともに、語感や言葉の使い方に対する感覚を意識して、語や語句を使うことができる。（知・技(1)オ）文の中での語句の係り方や語順について理解することができる。（知・技(1)カ）目的や意図に応じて簡単に書いたり詳しく書いたりするとともに、事実と感想、意見とを区別して書いたりするなど、自分の考えが伝わるように書き表し方を工夫することができる。（思・判・表B(1)ウ）","title":"言葉について考えよう","lessons":["学習の見通しをもつ。同じ内容について書かれた、日本語と英語の文を比べ、気づいたことを話し合う。","P219の説明や「言語の特徴を考えるときは」を参考に、日本語の特徴をまとめる。","「日本語のここがおもしろい。」と思うところを紹介する文章を書き、友達と読み合う。"],"short":["日本語と英語の文を比べ、日本語の特徴に気付くことができる。","説明や資料を参考にして、日本語の特徴をまとめることができる。","日本語のおもしろいところを紹介する文章を書き、友達と読み合うことができる。"]},{"name":"大切にしたい言葉","month":2,"total":6,"aim":"語感や言葉の使い方に対する感覚を意識して、語や語句を使うことができる。（知・技(1)オ）目的や意図に応じて簡単に書いたり詳しく書いたりするとともに、事実と感想、意見とを区別して書いたりするなど、自分の考えが伝わるように書き表し方を工夫することができる。（思・判・表B(1)ウ）","title":"書き表し方を工夫して、経験と考えを伝えよう","lessons":["学習の見通しをもつ。大切にしたい言葉を選び、関連する経験を書き出す。","書く分量を確かめ、文章構成を考える。","下書きをし、友達と読み合って推敲する。","書き表し方を工夫して清書する。（1/2）","書き表し方を工夫して清書する。（2/2）","読み合って、感想を伝え合う。学習を振り返る。"],"short":["大切にしたい言葉を選び、それに関連する自分の経験を書き出すことができる。","書く分量を確かめ、経験と考えが伝わる文章構成を考えることができる。","下書きを読み合い、表現を見直して推敲することができる。","事実と考えを区別し、書き表し方を工夫して清書することができる。（1/2）","語感や言葉の使い方を意識して、文章を仕上げることができる。（2/2）","文章を読み合って感想を伝え合い、学習を振り返ることができる。"]},{"name":"今、私は、ぼくは","month":2,"total":6,"aim":"話し言葉と書き言葉との違いに気づくことができる。（知・技(1)イ）資料を活用するなどして、自分の考えが伝わるように表現を工夫することができる。（思・判・表A(1)ウ）","title":"資料を使って、みりょく的なスピーチをしよう","lessons":["学習の見通しをもつ。","スピーチの話題と内容を決める。構成を考えて、スピーチメモを作る。","発表に必要な資料を準備する。","スピーチの練習をする。","スピーチの会を開く。","感想を伝え合う。学習を振り返る。"],"short":["スピーチの目的を確かめ、学習の見通しをもつことができる。","話題と内容を決め、構成を考えてスピーチメモを作ることができる。","自分の考えが伝わるように、効果的な資料を準備することができる。","話し言葉と書き言葉の違いに気付き、資料を使ってスピーチの練習をすることができる。","資料を活用し、聞き手を意識してスピーチをすることができる。","スピーチの感想を伝え合い、学習を振り返ることができる。"]},{"name":"海の命","month":3,"total":6,"aim":"文章を読んでまとめた意見や感想を共有し、自分の考えを広げることができる。（思・判・表C(1)カ）","title":"登場人物の生き方について、考えたことを話し合おう","lessons":["学習の見通しをもつ。","物語の構成と内容を確かめる。","周囲の人物との関わりが、「太一」の生き方や考え方にどのような影響を与えたのかを読み深める。（1/2）","周囲の人物との関わりが、「太一」の生き方や考え方にどのような影響を与えたのかを読み深める。（2/2）","自分の考えをまとめる。","考えたことをグループで伝え合う。学習を振り返る。"],"short":["物語を読んで問いをもち、学習の見通しをもつことができる。","物語の構成と内容を確かめ、登場人物の関係を捉えることができる。","周囲の人物との関わりが、「太一」の生き方に与えた影響を読み深めることができる。（1/2）","「太一」の考え方の変化を捉え、物語の全体像を具体的に想像することができる。（2/2）","物語を読んで考えたことを、自分の考えとしてまとめることができる。","考えたことを伝え合い、自分の考えを広げることができる。"]},{"name":"漢字の広場⑥","month":3,"total":1,"aim":"第５学年までに配当されている漢字を書き、文や文章の中で使うことができる。（知・技(1)エ）","title":"","lessons":["教科書の絵を見て、いつ、どこで、どんなことがあったのか、６年間の学校生活のさまざまな場面の様子を想像する。提示された言葉を使い、５年生までに習った漢字を正しく用いて、いつ、どこで、どんなことがあったのかを伝える文章を書く。"],"short":["５年生までに習った漢字を正しく使い、６年間の学校生活の出来事を伝える文章を書くことができる。"]},{"name":"卒業するみなさんへ","month":3,"total":4,"aim":"比喩や反復などの表現の工夫に気づくことができる。（知・技(1)ク）詩を朗読することができる。（知・技(1)ケ）目的や意図に応じて、感じたことや考えたことなどから書くことを選び、伝えたいことを明確にすることができる。（思・判・表B(1)ア）文章を読んで理解したことに基づいて、自分の考えをまとめることができる。（思・判・表C(1)オ）詩を読んでまとめた意見や感想を共有し、自分の考えを広げることができる。（思・判・表C(1)カ）","title":"卒業するみなさんへ","lessons":["学習の見通しをもつ。６年間で身につけた力を振り返る。","「生きる」を読み、感じたことを友達と話し合ったり、朗読したりする。","「人間は他の生物と何がちがうのか」を読み、筆者の考えに対する自分の考えをまとめる。","本単元をまとめる。"],"short":["６年間で身につけた言葉の力を振り返り、中学校での学びに生かす見通しをもつことができる。","「生きる」の表現の工夫に気付き、感じたことを話し合ったり朗読したりすることができる。","「人間は他の生物と何がちがうのか」を読み、筆者の考えに対する自分の考えをまとめることができる。","これからの言葉との向き合い方を考え、学習をまとめることができる。"]}]},"sansu-1":{"label":"学校図書　1年　算数（年間指導計画）","grade":1,"subject":"算数","units":[{"name":"入門期","month":4,"total":2,"aim":"・観点や条件が同じ集合作りの意味を理解することができる。\n・2つの集合それぞれに含まれる要素の個数について，1対1対応の考え方を用いて比べることができる。\n・集合の観点を明確にし，2つの集合それぞれに含まれる要素の個数を比べる方法を考える力を養う。","title":"","lessons":["絵の中にかかれているものを見つける。\nこれからどんなお話になるのか想像する。\n絵を見て場面のお話をする中で，いろいろなものの集合作りをする。","サルの絵の上に赤いおはじきを，おにぎりの上に黄色いおはじきを置き，それぞれ1列に並べ替えて数を比べる。\nチョウやタンポポと同じ数だけ○に色をぬり，数を比べる。"],"short":["生活の中の数量に関心をもつ。\n絵の中にかかれているものをもとにして，お話を想像する。\n絵を見て集合作りをする。\nものの位置を，前後，左右，上下などを使って表現する。","1対1対応によって，2つの集合に含まれる要素の個数を比べる。\n｢多い｣，｢少ない｣，｢同じ｣などの言葉を使って，数量の関係を言い表す。"]},{"name":"１０までの かず","month":4,"total":7,"aim":"・10までの数について，個数を正しく数えたり表したりすることができる。\n・10までの数について，正しく読んだり書いたりすることができる。\n・ものの個数を数えたり表したりすることを通して，10までの数の大小や順序，数の構成について考える力を養う。","title":"","lessons":["絵や教室の中からウサギと同じ数だけあるものを探す。\nブロックや○の色ぬりと数字を対応させ，｢3｣，「1｣，｢2｣，｢4｣，｢5｣の意味と読み方・書き方を知る。\n数字の表す個数のものを絵の中から見つけてそれを線で囲んだり，その個数だけ○に色をぬったりする。","身の回りから自由に数を探し，もの，ブロック，数字を対応させた絵本を作る。\n完成した絵本を同じ仲間に分けたり，数の順に並べたりする。\n絵に表されたものの個数を読み取り，ブロック・数字と対応させて線でつなぐ。\nスズメの絵を見て気がついたことを話し合う（数の順序や特徴）。","ブロックや○の色ぬりと数字を対応させ，｢6｣，「7｣，｢8｣，「9｣，「10」の意味と読み方・書き方を知る。\n数字の表す個数のものを絵の中から見つけてそれを線で囲んだり，その個数だけ○に色をぬったりする。","絵に表されたものの個数を読み取り，ブロック・数字と対応させて線でつなぐ。\nスズメの絵を見て気がついたことを話し合う（数の順序や特徴）。","絵を見てどのようなお話か考え，話し合う。\n何もないことを表すために「0」を用いることを知り，｢0｣の読み方・書き方を知る。\n0を使うお話作りをする。","2枚ずつの数カードを使って，どちらが大きいかを当てるゲームをする。","数カードの並び替えゲームをする。\nブロックを用いて0から10までの数系列作りをし，気づいたことを話し合う。\n数の順序にしたがって点を線でつなぎ，絵を完成する。"],"short":["｢3｣，「1｣，｢2｣，｢4｣，｢5｣の意味と，読み方・書き方を理解し，正しく数えたり表したりすることができる。","もの，ブロック，数詞，数字の対応を確実にし，個数表現としての1～5の理解を深める。\n数を1ずつ増やして並べることで，数の順序，系列がわかる。","5より大きい数に関心をもち，「6」，「7」，「8」，「9」，「10」の意味と，読み方・書き方を理解し，正しく数えたり表したりすることができる。","もの，ブロック，数詞，数字の対応を確実にし，個数表現としての6～10の理解を深める。\n数を1ずつ増やして並べることで，数の順序，系列がわかる。","「0」の意味と，読み方・書き方を理解する。","数の大小を理解する。","10までの数の大小，順序を理解する。"]},{"name":"いくつと いくつ","month":5,"total":4,"aim":"・10までの数の合成・分解ができる。\n・一つの数をほかの数の和や差として見て，数を多面的に捉えることができる。\n・数の合成・分解を，順序立てて考え，数を多面的に捉え，表現する力を養う。","title":"","lessons":["5，6の玉落としゲームを行い，5，6がどのように分かれるかを予想し調べる。\n5，6の構成をブロックで表し，数と関連付けてまとめる。","箱から7個のおはじきを取り，7がどのように分かれるかを調べる。\n7の構成をブロックで表し，数と関連付けてまとめる。\nおはじきを8個にぎって，一方の数を隠して，隠した数を当てる「いくつといくつ」のゲームをする。\n8の構成をブロックで表し，数と関連付けてまとめる。","数字カードを用いて9はいくつといくつに分けられるかを考えるゲームをする。\n9の構成をブロックで表し，数と関連付けてまとめる。\n1～9までのカードを並べ，10を作る組み合わせを考える。\n10の構成をブロックで表し，数と関連付けてまとめる。","数字トランプを作る。\n作った数字トランプを使って，10を作るゲームをする。\n表を用いて10を様々な数で合成する。"],"short":["5と6について，その構成を理解する。","7と8について，その構成を理解する。","9と10について，その構成を理解する。","10の構成に対する見方を広げる。"]},{"name":"なんばんめかな","month":5,"total":2,"aim":"・個数や順番を正しく数えたり表したりできる。\n・順序数と集合数の違いを理解することができる。\n・上下，左右の基準を明らかにし，ものの位置を表すことができる。\n・方向や位置に関する言葉と数を用いて，ものの位置を正しく表す方法を考える力を養い，それを進んで生活に役立てようとする態度を養う。","title":"","lessons":["それぞれの動物の場所を言葉で友だちに伝える。\n左右，前後，上下などの方向を表す言葉と順序数を使って，ものの位置を表す。","「前から3人目」と「前から3人」という言葉が表すものの違いについて考える。\n左右などの言葉と順序数を使って，ものの位置を表すゲームをする。\n前後左右などの言葉と順序数から席の位置を見つける。"],"short":["個数や順番を正しく数えたり，表したりする活動を通して，順序を表す数について知る。\n左右，前後，上下などの方向を表す言葉と順序数を使って，ものの位置を表す。","集合数と順序数の違いを理解する。\n一直線上に並んだものの位置の表し方を生かして，平面上での位置の表し方を考える。"]},{"name":"あわせて いくつ ふえると いくつ","month":5,"total":12,"aim":"・加法の意味や，加法が用いられる場面について理解することができる。\n・加法の記号や等号を知り，それらを用いた式で具体的場面を表したり，式を読み取ったりすることができる。\n・和が10以下の加法の計算ができる。\n・文や絵から，加法の場面かどうかを判断したり，加法の式を具体的な場面に結びつけたりして，加法の意味を考える力を養う。\n・様々な加法の場面を式に表し，数感覚を豊かにしている。","title":"","lessons":["ボールをかごの中に入れる絵を見て2つの集合を合わせる場面であることを理解する。\nブロックで合併の操作をしたり，言葉で表現したりする。\n｢あわせる｣場面の問題で，水槽の中の金魚は何匹になるかを考える。\n｢あわせる｣場面を加法として理解し，記号｢＋｣，｢＝｣を用いて式に表す。\n「ぜんぶで」も「あわせる」と同じと見て加法の場面であることを知り，加法の式で表す。\n和が5以下の加法の計算練習をする。","文から具体的場面を考え，場面の様子を表す絵を選ぶ。\n立式し，その根拠をブロック操作をしながら友だちに説明する。\n5＋○の計算練習をする。","絵や○の図を用いて場面を表し，立式したり和を求めたりする。\n○＋5の計算練習をする。","アヒルが池に来る絵などを見て，増加の場面であることを理解する。\nブロックで増加の操作をしたり，言葉で表現したりする。\n金魚を水槽の中に入れる場面の絵と，ブロック操作を通してもともとあったものにあとから加えて増やす場面であることを理解する。\n｢ふえる｣場面も加法として捉え，｢＋｣，「＝｣を用いて式に表す。\n和が10未満の加法の計算の練習をする。","文から具体的場面を考え，場面の様子を表す絵を選ぶ。\n立式し，その根拠をブロック操作をしながら友だちに説明する。\n和が10未満の計算練習をする。","絵や○の図を用いて場面を表し，立式したり和を求めたりする。\n和が10の加法の計算練習をする。","式や絵から加法（合併・増加）の場面を想起し，問題を作る。\nブロックの動きに合わせて加法（合併・増加）の場面を想起し，問題を作る。","たし算カードを作る。","カードを使って和が10以下の加法の計算を練習する。\nグループで同じ答えのカード探しをする。\n同じ答えのカードを並べ，気づいたことを発表する。","玉入れの場面を加法の式で表し，0を使う場面も加法の式に表せることを知る。\n0の入った加法の式から，具体的場面を想起する。\n0の入った加法の計算練習をする。","身の回りで加法が用いられている場面を見つける。\n被加数，加数，和をそれぞれ1ページずつ絵や式に表し，たし算の絵本を作る。\n作った絵本を友だちと説明し合い，身の回りの様々な場面で加法が用いられていることに気づく。","加法の計算をする。\n加法の場面について理解し，式に表す。"],"short":["加法が用いられる場面(合併)を理解する。\n加法の記号と等号を使って，式に表すことを理解する。\n和が5以下の加法の計算をする。","加法が用いられる場面（合併）について，立式の根拠を説明する。\n被加数が5で，和が10未満の加法の計算をする。","加法が用いられる場面（合併）を絵や図に表し，そのよさを感じようとしている。\n加数が5で，和が10未満の加法の計算をする。","増加の場面も加法の式に表せることを理解する。\n合併と増加で場面は異なっても，同じように加法の式に表すよさを感じようとする。","加法が用いられる場面（増加）について，立式の根拠を説明する。\n和が10未満の加法の計算をする。","加法が用いられる場面（増加）を絵や図に表し，そのよさを感じようとしている。\n和が10の加法の計算をする。","日常生活の中から加法が用いられる場面を見つけ，問題を作る。","これまでの学習を振り返り，加法の式を自分で考え，たし算カードを作る。","たし算カードを使ったゲームを通して，和が10以下の加法の計算について技能の習熟を図る。\n和が等しいいくつかのたし算カードを並べて，数の変わり方の特徴に気づく。","0という数の意味をもとに，0の加法の意味や計算のしかたについて理解する。","日常生活から加法が用いられている場面を見つけ，絵や式に表現する。","既習事項の確かめをする。"]},{"name":"のこりは いくつ ちがいは いくつ","month":6,"total":12,"aim":"・減法の意味や，減法が用いられる場面について理解することができる。\n・減法の記号や等号を知り，それらを用いた式で具体的場面を表したり，式を読み取ったりすることができる。\n・10以下の数についての減法の計算ができる。\n・文や絵から，減法の場面かどうかを判断したり，減法の式を具体的な場面に結びつけたりして，減法の意味を考える力を養う。\n・様々な減法の場面を式に表し，数感覚を豊かにしている。","title":"","lessons":["車が出て行っている絵を見て，残りの数を求める場面であることを理解する。\nブロックで求残の操作をしたり，言葉で表現したりする。\n水槽の金魚をすくい上げたときに，水槽の「のこり」の金魚は何匹になったか考える。\n｢のこり｣を求める場面を減法として捉え，｢－｣，｢＝｣を用いて式に表す。\n絵から「のこり」を求める場面を読み取り，式に表し答えを求める。\n5以下の2数の減法の計算練習をする。","文から具体的場面を考え，場面の様子を表す絵を選ぶ。\n立式し，その根拠をブロック操作をしながら友だちに説明する。\n差が5になる，または，減数が5の減法の練習をする。","絵や○の図を用いて場面を表し，立式したり差を求めたりする。\n9以下の2数の減法の計算練習をする。","文や絵から，（全体の数）－（茶色の犬の数）を考えて白い犬の数を求める場面であることを読み取り，式に表し答えを求める。\nブロック操作を通して，求残と関連付けて求補の意味を捉える。\n10－（1位数）の減法の計算練習をする。","水槽から金魚をとる場面のうち，1匹もとれなかった場面を考え，式に表す。\n0の入った減法の計算や，答えが0になる減法の計算練習をする。","文や絵から馬と牛の頭数を比べる求差の場面であることを理解する。\nブロックで求差の操作をしたり，言葉で表現したりする。\n2つの集合の個数を比べて差を求めるとき，個数の多い方に着目して考えると，1対1対応ができるもの・できないものに分け，求残の場面と同じと見ることができると気づく。\n｢ちがいを求める｣場面も減法として捉え，｢－｣，「＝｣を用いて式に表す。","式や絵から減法（求残・求差）の場面を想起し，問題を作る。\nブロックの動きに合わせて減法（求残・求差）の場面を想起し，問題を作る。","文や絵から問題場面を読み取り，式に表したり答えを求めたりする。\n絵や図などを用いて1対1対応させていき，立式の根拠を説明する。","ひき算カードを作る。","カードを使って10以下の数についての減法の計算を練習する。\nグループで同じ答えのカード探しをする。\n同じ答えのカードを並べ，気づいたことを発表する。","身の回りで減法が用いられている場面を見つける。\n被減数，減数，差をそれぞれ1ページずつ絵や式に表し，ひき算の絵本を作る。\n作った絵本を友だちと説明し合い，身の回りの様々な場面で減法が用いられていることに気づく。","減法の計算をする。\n減法の場面について理解し，式に表す。"],"short":["減法が用いられる場面(求残)を理解する。\n減法の記号と等号を使って式に表すことを理解する。\n5以下の2数の減法の計算をする。","減法が用いられる場面（求残）について，立式の根拠を説明する。\n差が5になる，または，減数が5の減法の計算をする。","減法が用いられる場面（求残）を絵や図に表し，そのよさを感じようとしている。\n9以下の2数の減法の計算をする。","減法が用いられる場面(求補)を，求残場面と関連付けて理解する。\n10－（1位数）の減法の計算をする。","0という数の意味をもとに，0の減法の意味や計算のしかたについて理解する。","求差の場面も減法の式に表せることを理解する。\n求残と求差で場面は異なっても，同じように減法の式に表すよさを感じようとする。","日常生活の中から減法が用いられる場面を見つけ，問題を作る。","「ちがい」をたずねる場面にも，減法を適用できることを理解する。\n立式の根拠を絵や図などを用いて説明する。","これまでの学習を振り返り，減法の式を自分で考え，ひき算カードを作る。","ひき算カードを使ったゲームを通して，10以下の数についての減法の計算について技能の習熟を図る。\n差が等しいいくつかのひき算カードを並べて，数の変わり方の特徴に気づく。","日常生活から減法が用いられている場面を見つけ，絵や式に表現する。","既習事項の確かめをする。"]},{"name":"さんすうを つかって","month":7,"total":1,"aim":"","title":"","lessons":["イラストから加法や減法の問題を作る。\n自分の作った問題を発表する。\n作った問題を交換して互いに解く。\n今の自分を振り返りながら学習のまとめをする。"],"short":["これまでの単元の学習をもとに，数の数え方，加法や減法の考え方を日常場面に適用する。\nこれまでの単元の学習をもとに，日常場面から加法や減法のお話や式をつくる。"]},{"name":"いくつ あるかな","month":9,"total":1,"aim":"・ものの個数を絵や図などを用いて，表したり読み取ったりすることができる。\n・データの個数に着目し，身の回りの事象について，どの項目がどの程度多いのかといった事象の特徴を捉える力を養う。","title":"","lessons":["黒板に貼った果物カードの数を比べる方法を考える。\n果物の種類ごとに分類整理すると数えやすくなることに気づく。\n並べる際，大きさを揃えることが必要であることを理解する。\n果物の数を絵グラフに表し，わかったことについて話し合う。"],"short":["資料の特徴をわかりやすく表す方法を考える。\n表した絵グラフから，ものの個数や特徴を読み取る。\nものの個数を絵や図などを用いて表すよさを理解している。"]},{"name":"１０より おおきい かずを かぞえよう","month":9,"total":7,"aim":"・10より大きく30までのものの数を数えたり，数字を用いて表したりすることができる。\n・2位数の構成を理解することができる。\n・数のまとまりに着目し，数の大きさを比べたり，数え方を考えたりする力を養う。","title":"","lessons":["絵を見て，リス，ドングリ，花の数の数え方を考える。\nブロックを置いて数える活動を通して「10のまとまり」と「いくつ」に分けて数えると，便利であることを理解する。","絵を見てリンゴや花の数を数える。\nブロックを置いて数える活動を通して「10のまとまり」と「いくつ」に分けて数えると，便利であることを理解する。\nブロックを対応させて，20までの数の唱え方，書き方を知り，練習する。\n2とび，5とびなど10以外の数でもまとまりを作ってものの個数を数える。","「10といくつ」で表された条件から，数を合成して20までの数を作る。\n20までの数を，「10といくつ」に分解する。","20までの数を，「かずのせん」の上に順序よく並べる。\n「かずのせん」（数直線）について理解し，位置に対応する数を判断する。\n数直線を用いて，20までの数の大小を比較する。\n数の大小や順序を考え，数の系列を作る。","｢10といくつ｣の数の見方を用いた数の合成について，加法の式に表す。\nその逆の分解について，減法の式に表す。\n10＋(1位数)やその逆の減法(2位数)－(1位数)=10の計算練習をする。","12＋3の計算のしかたを考える。\n15−2の計算のしかたを考える。\n繰り上がりのない(2位数)＋(1位数)や繰り下がりのない(2位数)－(1位数)の計算練習をする。","｢20といくつ｣，｢30といくつ｣という見方で，ものの個数を数えたり表したりする。\n「10のまとまりがいくつ」，「ばらがいくつ」と見ることで，大きな数についても数字で書き表したり読んだりすることができることを知る。"],"short":["10より大きい数について，数のまとまりに着目して数え方を考える。\n10より大きい数について，10のまとまりを用いて正しく数える。","20までの数について，数のまとまりに着目して数え方を考える。\n20までの数について，10のまとまりを用いて正しく数える。","20までの数について，「10といくつ」の考え方を用いて合成・分解をし，数構成を考える。\n20までの数について「10といくつ」という表し方で合成・分解をする。","数の大小や順序を考え，数の系列を作ったり，数直線の上に表したりする。","10＋(1位数)やその逆の減法(2位数)－(1位数)=10について，「10といくつ」の考え方を用いて計算のしかたを考える。\n10＋(1位数)やその逆の減法(2位数)－(1位数)=10の計算をする。","繰り上がりのない(2位数)＋(1位数)や繰り下がりのない(2位数)－(1位数)について，「10といくつ」の考え方を用いて計算のしかたを考える。\n繰り上がりのない(2位数)＋(1位数)や繰り下がりのない(2位数)－(1位数)の計算をする。","10のまとまりを作るなど，これまで学習した数の数え方や表し方を用いて，20より大きい数についても工夫して数えたり表したりする。"]},{"name":"なんじ なんじはん","month":9,"total":2,"aim":"・時計の長針や短針が示す数と時刻を表す数との対応を理解し，日常生活と関連付けて，何時，何時半の時刻を読むことができる。\n・どのように時刻を読むのかを考える力を養う。\n・日常生活での活動と時刻とを関連付ける力を養う。","title":"","lessons":["日常生活の場面の絵と時計を見て，時刻を予想する。\n長針と短針の動きや目盛りの数をもとに，時計の仕組みや時刻の読み方を考える。\nデジタル時計の場合の時刻の表記を知る。","示された時刻を時計の模型で表す。\n自分の生活と時刻を結びつけ，時刻を表したり読んだりする。"],"short":["時計の仕組みに関心をもち，時刻(何時，何時半)の読み方を考える。\n長針と短針の位置をもとに，時刻（何時・何時半）を読むことができる。","時刻を時計模型で表す。\n学んだことを活用して，自分の生活時間を振り返ろうとする。"]},{"name":"かたちあそび","month":10,"total":5,"aim":"・身の回りにあるものの中から，形を認め，形の特徴（図形的な性質・機能的な性質）を捉えることができる。\n・具体物を用いて，形を作ったり分解したりすることができる。\n・ものの形に着目し，身の回りにあるものの特徴を捉える力を養う。\n・具体的な操作を通して，形の構成について考える力を養う。","title":"","lessons":["立体図形の特徴を考えて仲間分けをする。\nどのように分けたか振り返り，グループに名前をつけるなど，形の特徴を言葉で表現する。","形当てクイズをし，手触りをもとに，形の特徴を捉える。\n自分が考えた答えの根拠を伝える活動を通して，形の特徴を言葉で表現する。","グループごとに箱を積み上げる遊びをする。\nどのような形が積み上げやすいかを考えたり理由を考えたりする。\n形遊びをしながら，転がりやすい形を見つけ，その特徴を捉える。\n転がり方を見て，転がる理由を考える。","作りたい形を考え，形の特徴（図形的な性質・機能的な性質）を生かした箱選びをし，作品を作る。\n自由に作品作りを楽しむ。\nどんな箱をどんなところで使ったか発表し合う。","集めた空き箱などの立体図形の面の形を写し取る。\n写し取った形について話し合う。\n形の特徴を生かして自由に作品作りをする。\n用いた立体図形と関連付けながら，かいた絵を発表する。"],"short":["箱など身の回りにある立体図形を見つけ，形の特徴を捉えて仲間分けする方法を考える。","立体図形について面・辺・角などの特徴を捉える。","立体図形の特徴を用いて，高く積む・転がすなど目的を達成するための方法を考える。\n高く積みやすい形，転がりやすい形などについて，その理由を形の特徴をもとに説明する。","集めた空き箱などの形の特徴（図形的な性質・機能的な性質）を生かして作品作りを楽しむ。","集めた空き箱などの立体図形から面を切り取ったり，それらの形を組み合わせて図形を構成したりする。"]},{"name":"たしたり ひいたり してみよう","month":10,"total":3,"aim":"・2つの数の加減をもとに，3口の数の加減の場面を立式し，答えを求めることができる。\n・2つの数の加減をもとに，3口の数の加減の計算の意味やその方法を理解することができる。\n・具体物や図などを用いて，2つの数の加減をもとに，3口の数の加減の計算のしかたを考える力を養う。","title":"","lessons":["絵を見てどんな式になるかを考えて，立式する。\n3口の式についてブロック操作を通して場面と式とを関連付け，意味を理解する。\n3口の加法のしかたを考え，計算する。","絵を見てどんな式になるかを考えて，立式する。\n3口の式についてブロック操作を通して場面と式とを関連付け，意味を理解する。\n3口の減法のしかたを考え，計算する。","問題文やブロック図からどんな式になるかを考えて，立式する。\n3口の数の加減混合の計算のしかたを考え，計算する。\n日常生活の中にある3口の計算が用いられる場面を見つけ，示された式に合う問題を作る。"],"short":["3口の加法になる問題場面を式に表す方法や計算のしかたについて考える。\n3口の加法になる問題場面を一つの式に表し，2口の場合をもとに計算する。","3口の減法になる問題場面を式に表す方法や計算のしかたについて考える。\n3口の減法になる問題場面を一つの式に表し，2口の場合をもとに計算する。","3口の数の加減混合の計算になる問題場面を式に表し，計算する。\n3口の計算を用いたり式に表したりすることのよさに気づき，問題作りを楽しむ。"]},{"name":"たしざん","month":10,"total":9,"aim":"・10のまとまりに着目し，繰り上がりのある計算の意味やその方法を理解することができる。\n・繰り上がりのある計算が正しくできる。\n・繰り上がりのある加法の計算のしかたを，具体物や言葉，式，図を用いて表現したり考えたりする力を養う。","title":"","lessons":["バスの乗客数を求める場面を式に表す。\n9＋4の計算のしかたをいろいろ考える。\n9に1を移して10を作ればよいことに気づく。\n9＋4の計算のしかたを10のまとまりに着目して，ブロックを使ったり，絵をかいたりして表し，繰り上がりのある加法の計算のしかたを説明する。","8＋3の計算のしかたをブロックを使ったり絵をかいたりして説明する。\nブロックを使って確かめる。\n10のまとまりを作るために，加数を分解すればよいことがわかる。\n加数分解が使える場合の計算練習をする。","3＋9のような計算のしかたを考える。\n場合によっては加数分解よりも被加数分解の方が簡単であることに気づく。\n3＋9の計算のしかたを10のまとまりに着目して，ブロックを使ったり，絵をかいたりして表し，繰り上がりのある加法の計算のしかたを説明する。\n被加数分解が使える場合の計算練習をする。","8＋6の計算のしかたをいろいろ考え，発表する。\nブロックを使って，8を10にする計算のしかたや，6を10にする計算のしかたなどを考える。\n8を5と3，6を5と1と考えて，5と5を合わせて10を作る方法もあることに気づく。\n8＋6の計算のしかたをこれまでに学習してきた求め方をもとに考え，説明する。","5＋6の計算のしかたをいろいろ考え，発表する。\nブロックを使って，5を10にする計算のしかたや，6を10にする計算のしかたなどを考える。\n6を5と1と考えて，5と5を合わせて10を作る方法もあることに気づく。\n5＋6の計算のしかたをこれまでに学習してきた求め方をもとに考え，説明する。","絵を見て7＋8になる問題を，いろいろな場面を想像して作る。\n自分の作った問題を発表する。\n友だちが作った問題を絵で表す。\n式と具体的な場面を結びつけながら考えを説明する。","繰り上がりのある加法のカードを作る。\nカードを使って計算練習をする。\nカードを使って様々なゲームを行う。\nゲームをしながら，楽しく計算練習をする。\nカルタのように誰かが答えを言って，その答えになるカードを取る。\nトランプのカード合わせのように，答えが同じになったらカードが取れるというゲームをする。\n2人組になり，お互いカードを出し合い大きさを比べるゲームをする。","答えが同じカードを集める。\n集めたカードを整理して並べ，気づいたことを発表し合う。\n被加数と加数に着目してカードを並べる活動を通して，加数が1ずつ増えると答えが1ずつ増えるといったきまりを見つけ，説明する。","繰り上がりのある加法の計算をする。\n絵や図をかいて，加法適用の場面であることを読み取り，式と答えを考える。"],"short":["問題が加法の用いられる場面であることに気づき，繰り上がりのある加法の計算のしかたを考える。","前時の学習についても合わせて振り返り，繰り上がりのある加法の計算では，10のまとまりを作ればよいことに気づく。\n繰り上がりのある加法の計算をする。","加数が10に近い場合の計算について，計算のしかたを考え，被加数を分解して10のまとまりを作ればよいことに気づく。\n繰り上がりのある加法の計算をする。","「10のまとまりを作って，あといくつ」という数の見方を用いて，計算のしかたを考える。\nこれまでの学習と関連付けて，いろいろな計算のしかたを考える。","加法が用いられる場面であることに気づき，立式して計算のしかたを考える。\n繰り上がりのある加法の計算をする。","日常生活の中から，加法が用いられる場面を見つけて，これまでに学んだことを生かして問題解決をする。\n問題作りの活動を通して，加法の意味を振り返り，式と具体的な場面とを結びつけて考える。","繰り上がりのある加法のカードを作って計算練習をする。\nカードを使ってゲームを楽しみ，繰り上がりのある加法の計算に親しむ。","答えが同じになるカードを集め，整理することで，被加数と加数の関係に気づく。","既習事項の確かめをする。"]},{"name":"ひきざん","month":11,"total":10,"aim":"・10のまとまりに着目し，繰り下がりのある計算の意味やその方法を理解することができる。\n・繰り下がりのある計算が正しくできる。\n・繰り下がりのある減法の計算のしかたを，具体物や言葉，式，図を用いて表現したり考えたりする力を養う。","title":"","lessons":["どんぐりの問題の場面を式に表す。\n12－9の計算のしかたをいろいろ考える。\n12－9の計算のしかたを10のまとまりに着目して，ブロックを使ったり，絵をかいたりして繰り下がりのある減法の計算のしかたを説明する。\n10から9をひいて，それから2を加えればよいことに気づく。","13－8の計算のしかたをブロックを使ったり，絵をかいたりして説明する。\nブロックを使って確かめる。\n一の位からひけないときは，10のまとまりからひけばよいことがわかる。\n減加法が使える場合の計算練習をする。","11－2の計算のしかたを考える。\n11－2の計算のしかたを10のまとまりに着目して，ブロックを使ったり，絵をかいたりして説明する。\n減々法による計算のしかたを理解し，減加法と比べる。\n減々法が使える場合の計算練習をする。","14－6の計算のしかたをいろいろ考えて発表する。\n14－6の計算のしかたをこれまでに学習してきた求め方をもとに考え，説明する。\n具体物の操作を通して，減々法，減加法それぞれの計算のしかたを確かめる。\n様々な数値の繰り下がりのある減法の計算練習をする。","減法適用の文章題を読み取り，式と答えを求める。\n繰り下がりのある減法の計算練習をする。","絵を見て12−5になる問題を，いろいろな場面を想像して作る。\n自分の作った問題を発表する。\n友だちが作った問題を絵で表す。\n式と具体的な場面を結びつけながら考えを説明する。","繰り下がりのある減法のカードを作る。\nカードを使って計算練習をする。\nカルタのように誰かが答えを言って，その答えになるカードを取る。\nトランプのカード合わせの要領で，答えが同じカードがペアになったら捨てていくというゲームをする。\n2人組になり，お互いカードを出し合い大きさを比べるゲームをする。","答えが同じカードを集める。\n集めたカードを整理して並べ，気づいたことを発表し合う。\n被減数と減数に着目してカードを並べる活動を通して，減数が1ずつ増えると答えが1ずつ減るといったきまりを見つけ，説明する。","文章題からどんな演算を適用すればよいかを考え，ブロックなどの具体物，図などを用いて，その演算に決定した理由を説明する。\nどんな演算を適用すればよいか判断し，式に表したり答えを求めたりする。","繰り下がりのある減法の計算練習をする。\n絵や図をかいて，減法適用の場面であることを読み取り，式と答えを考える。"],"short":["問題が減法の用いられる場面であることに気づき，繰り下がりのある減法の計算のしかたを考える。","前時の学習についても合わせて振り返り，繰り下がりのある減法の計算では，10のまとまりから先にひけばよいことに気づく。\n繰り下がりのある減法の計算をする。","減々法が適するような減法について，計算のしかたを考えたり，具体物や言葉，式，図などを用いて表現したりする。\n繰り下がりのある減法の計算をする。","減々法，減加法から考えやすい方法を選び，計算のしかたを考えたり，具体物や言葉，式，図などを用いて表現したりする。\n被減数や減数の数値に応じて，計算のしかたを工夫する。","減法が用いられる場面であることに気づき，立式して計算のしかたを考える。\n繰り下がりのある減法の計算をする。","日常生活の中から，減法が用いられる場面を見つけて，これまでに学んだことを生かして問題解決をする。\n問題作りの活動を通して，減法の意味を振り返り，式と具体的な場面とを結びつけて考える。","繰り下がりのある減法のカードを作って計算練習をする。\nカードを使ってゲームを楽しみ，繰り下がりのある減法の計算に親しむ。","答えが同じになるカードを集め，整理することで，被減数と減数の関係に気づく。","合併場面，求残場面の文章題を読んで，加法，減法のどちらを用いればよいかを考え，適切な演算を用いて計算する。\n増加場面，求差場面の文章題を読んで，加法，減法のどちらを用いればよいかを考え，適切な演算を用いて計算する。","既習事項の確かめをする。"]},{"name":"くらべてみよう","month":11,"total":7,"aim":"・長さ，かさ，広さの比べ方，数値化の方法，量の概念を理解することができる。\n・直接比較，間接比較，任意単位による比較を使って，量の大きさを比べることができる。\n・長さ，かさ，広さの特徴を捉え，長さ，かさ，広さを比べる方法や数値化する方法を考える力を養う。","title":"","lessons":["身近にあるものの中から長さを見つける。\n身近にあるものの長さを比べるための方法を考え，考えた方法を使い大きさを比べる。\n縄跳びのように曲がっているもの，はがきや箱の縦と横の長さのように直接並べることが難しいものについて，長さを比べる方法を考える。","教室にあるいろいろなものの長さを，紙テープを用いて取り出す。\nテープなどの媒介物を用いて長さを写し取る間接比較の考えを用いて，長さを比べる。\nいろいろなものを測定した紙テープを黒板に貼り，長さを比べる。","長さを数値化して大きさを比べる方法を考える。\n身近にあるものの長さを比べるために，小さいもののいくつ分かで測る考えで大きさを比べる。\n机の縦と横の長さや，鉛筆の長さなどを任意単位を用いて比べる。","ジュースのかさを比べる方法をいろいろ考える。\nジュースのかさを比べるための方法を考え，考えた方法を使い大きさを比べる。\nジュースのかさの比べ方について話し合い，かさを比べるには共通の容器が必要なことに気づく。","かさを数値化して大きさを比べる方法を考える。\nコップを単位としてかさを数値化し，大きさを比べる。\n液量の比べ方（直接比較・任意単位）を活用して，箱の大きさを比べる方法を考える。","これまでに考えてきた大きさを比べる方法を使い，ハンカチや掲示板などの広さを比べる方法を考える。\n直接重ねたり，「（カードやマスが）何枚分」と数値化したりして，広さが比べられることに気づく。\n任意単位による比較を活用して，じんとりゲームをする。","長さ，かさ，広さを，任意単位の考え方をもとに比べる。"],"short":["身の回りにあるものの長さに着目し，長さの比べ方を考える。\n直接比較や間接比較の方法を理解し，長さを比べる。","紙テープを用いて，ものの長さを取り出し，基準を揃えて長さを比べる。\n日常生活の中にあるいろいろなものの長さを比較，測定する活動を通して，長さについての感覚を豊かにする。","鉛筆などを単位として，身近にあるものの長さを数値化する方法を考える。\n直接比較・間接比較の場合と比べ，数値化することのよさを見いだす。","身の回りにあるもののかさに着目し，長さの比べ方を参考にしてかさの比べ方を考える。\n直接比較や間接比較の方法を理解し，かさを比べる。","日常生活の中にあるいろいろなもののかさを比較，測定する活動を通して，かさについての感覚を豊かにする。\n直接比較や任意単位による比較を用いて，液量に限らず身近にあるもののかさを比べる。","身の回りにあるものの広さに着目し，長さやかさの比べ方を参考にして広さの比べ方を考える。\n直接比較や任意単位による比較の方法を理解し，広さを比べる。","既習事項の確かめをする。"]},{"name":"さんすうを つかって（12月）","month":12,"total":1,"aim":"","title":"","lessons":["非常用持ち出し袋のリストの中身を確認する。\nお兄さんの持っていこうとしている物とリストを比較して，過不足を確認する。\n自分なりに持ち出し袋に入れる物を考え，発表する。\n今の自分を振り返りながら学習のまとめをする。"],"short":["これまでの単元の学習をもとに，非常用持ち出し袋について考える。\nこれまでの単元の学習をもとに整理のしかたやものの個数の数え方を活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]},{"name":"かたちを つくろう","month":1,"total":4,"aim":"・身の回りにあるものの中から，形を認め，形の特徴を捉えることができる。\n・具体物を用いて，形を作ったり分解したりすることができる。\n・形を作ったり分解したりする活動を通して，形の構成について考える力を養う。","title":"","lessons":["教科書の写真を参考に，色板を使っていろいろな形を作る。\n自分が作った作品を発表する。\n友だちが作った作品と同じ形を作る。","色板を移動させて，提示された形を作る。\n4枚の色板を｢ずらす｣，｢回す｣，｢裏返す｣などして，いろいろな形を工夫して作る。","教科書の写真を参考に，棒を使っていろいろな形を作る。\n自分が作った作品を発表する。\n友だちが作った作品と同じ形を作る。","格子状の点をつないで，いろいろな｢閉じた形｣を作る。\n自分が作った作品を発表する。\n友だちが作った作品と同じ形を作る。"],"short":["身の回りにあるものの中に形を見つけ，その特徴を捉えて色板で形を作る。","平行移動，回転移動，対称移動など，見通しをもって色板を操作しながら，形を構成，分解する方法を考える。\n形の観察，構成，分解の活動を通して，図形についての基礎となる経験を豊かにする。","身の回りにあるものの中に形を見つけ，その特徴を捉えて棒で形を作る。","格子状の点と点をつないで，いろいろな形を作る。"]},{"name":"大きい かずを かぞえよう","month":1,"total":11,"aim":"・100までの数の読み方，書き方，数の大小，順序，系列を理解することができる。\n・用語「十の位」，「一の位」の意味や2位数の構成について理解することができる。\n・簡単な場合について，2位数を含む加法及び減法の計算ができる。\n・既習の数の仕組みをもとに，100までの数の大きさの比べ方や数え方を考える力を養う。\n・簡単な場合について，2位数を含む加法及び減法の計算のしかたを考える力を養う。\n・数のまとまりの考えを日常生活に生かす力を養う。","title":"","lessons":["ランダムに並んでいるブロックの数がよくわかるようになる並べ方を考え，実際に並べ，数を数える。\nブロックの数を数える方法を考える。\n10のまとまりを作って数え，その数を表す。","いろいろな場合の個数を10のまとまりを作って数え，10のまとまりの個数と端数によって個数を表す。\n10のまとまりだけで，端数がない場合の数の表記のしかたを考える。\nブロックを使って，2位数の構成について表現し，理解する。","提示された2位数について，ブロックを用いて表す。\n「10がいくつと，1がいくつ」で表された条件から，数を合成して100までの数を作る。\n100までの数を，「10がいくつと，1がいくつ」に分解する。","魚が何匹いるのかを数えるための方法を考え，その方法で実際に数える。\n魚が何匹いるのかを数えるための方法を考える。\n｢99とあと1つ｣，｢10が10こ｣で100であることを知る。","100までの数表を完成させ，規則性について気づいたことを話し合う。\n100までの数について，カードを使って大小比較をする。\n100までの数について，大小や順序を考え，数の系列を作る。\nある数を基準にして，「それよりもいくつ大きい（小さい）数」を，数表を用いて見つける。","鉛筆の本数を数える場面において，100より大きい数の表し方を考える。\n10のまとまりや100のまとまりを作って数え，それぞれのまとまりの個数と端数によって全体の個数を表すことを理解する。","20＋30などの10を単位として見られる数の加法の計算のしかたを考える。\nブロックなどを操作しながら，10を単位とした数の見方に関連させて，計算のしかたについて説明する。\n簡単な(何十)＋(何十)の計算練習をする。","繰り上がりのない（2位数）＋（1位数）の計算のしかたを考える。\nブロックなどを操作しながら，位の考え方に関連させて，計算のしかたについて説明する。\n簡単な(2位数)＋(1位数)の計算練習をする。","50−20などの10を単位として見られる数の減法の計算のしかたを考える。\nブロックなどを操作しながら，10を単位とした数の見方に関連させて，計算のしかたについて説明する。\n簡単な(何十)−(何十)の計算練習をする。","繰り下がりのない(2位数)−(1位数)の計算のしかたを考える。\nブロックなどを操作しながら，位の考え方に関連させて，計算のしかたについて説明する。\n簡単な(2位数)−(1位数)の計算練習をする。","大きい数を数えたり，そのしくみを調べたりする。\n（何十）±（何十）や，簡単な（2位数）＋（1位数），（2位数）－（1位数）の計算をする。"],"short":["ブロックを工夫して数え，既習の数の仕組みをもとに2位数の表し方を考える。\n用語「十の位」，「一の位」の意味を理解する。","ばらがないときに，一の位をどのように表すか考え表現する。\n空位の0について理解し，いろいろな場合の2位数について数を用いて表す。","100までの数について，「10がいくつと，1がいくつ」の考え方を用いて合成・分解をし，数構成を考える。\n100までの数について「10がいくつと，1がいくつ」という表し方で合成・分解をする。","既習の数の仕組みから，10が10個集まったら新しい単位が必要になることや，100の構成・大きさについて理解する。","100までの数表を作り，その規則性を見いだす。\n数の大小や順序を考え，数の系列を作る。","既習の数の仕組みから，100より大きい数の表し方を考える。\n120程度までの簡単な場合について，3位数の表し方を理解する。","簡単な(何十)＋(何十)の計算のしかたを考える。\n簡単な(何十)＋(何十)の計算をする。","簡単な(2位数)＋(1位数)の計算のしかたを考える。\n簡単な(2位数)＋(1位数)の計算をする。","簡単な(何十)−(何十)の計算のしかたを考える。\n簡単な(何十)−(何十)の計算をする。","簡単な(2位数)−(1位数)の計算のしかたを考える。\n簡単な(2位数)−(1位数)の計算をする。","既習事項の確かめをする。"]},{"name":"なんじなんぷん","month":2,"total":2,"aim":"・時計の長針や短針が示す数と時刻を表す数との対応を理解し，日常生活と関連付けて，何時何分の時刻を読むことができる。\n・時刻の読み方や短針・長針の役割について考える力を養う。\n・日常生活での活動と時刻とを関連付ける力を養う。","title":"","lessons":["日常生活の場面の絵と時計を見て，時刻を予想する。\n長針と短針の動きや目盛りの数をもとに，時計の仕組みや時刻の読み方を考える。\nデジタル時計の場合の時刻の表記を知る。","示された時刻を時計の模型で表す。\n自分の生活と時刻を結びつけ，時刻を表したり読んだりする。"],"short":["時計の仕組みに関心をもち，時刻(何時何分)の読み方を考える。\n長針と短針の位置をもとに，時刻（何時何分）を読む。","時刻を時計模型で表す。\n学んだことを活用して，自分の生活時間を振り返ろうとする。"]},{"name":"たすのかな ひくのかな ずに かいて かんがえよう","month":2,"total":5,"aim":"・加法，減法の場面をより一層理解し，順序数，集合数に関連した加減の計算の意味やその方法を理解することができる。\n・加法や減法が用いられる場面について，絵や図に表して演算決定したり答えを求めたりする力を養う。","title":"","lessons":["順序数を含む問題場面であることを読み取り，どの演算を用いればよいかを考える。\n問題場面を絵や図に表し，数量の関係を捉える。\n立式し，答えを求める。","異種のものの数量を含む問題場面であることを読み取り，どの演算を用いればよいかを考える。\n問題場面を絵や図に表し，数量の関係を捉える。\n立式し，答えを求める。","求大場面であることを読み取り，どの演算を用いればよいかを考える。\n問題場面を絵や図に表し，数量の関係を捉える。\n立式し，答えを求める。","求小場面であることを読み取り，どの演算を用いればよいかを考える。\n問題場面を絵や図に表し，数量の関係を捉える。\n立式し，答えを求める。","ブロックを使って，10個のいちごを2人に等しく分ける方法を考える。\nブロックを使って，18個の金平糖を3人に等しく分ける方法を考える。\n分け方を図や式に表す。"],"short":["順序数を含む場面について，数量の関係に着目し，演算決定をしたり式の表し方を考えたりする。\n順序数を含む場面を絵や図に表して立式し，答えを求める。\n図に表すよさを見いだし，図表現に親しむ。","異種のものの数量を含む場面について，数量の関係に着目し，演算決定をしたり式の表し方を考えたりする。\n異種のものの数量を含む場面を絵や図に表して立式し，答えを求める。","求大場面について，数量の関係に着目し，演算決定をしたり式の表し方を考えたりする。\n求大場面を絵や図に表して立式し，答えを求める。","求小場面について，数量の関係に着目し，演算決定をしたり式の表し方を考えたりする。\n求小場面を絵や図に表して立式し，答えを求める。","具体物を等分したり，同じ数のまとまりとしてみたりすることを通して，数についての感覚を豊かにする。"]},{"name":"ふりかえろう つなげよう","month":2,"total":1,"aim":"","title":"","lessons":["身の回りには12になるものが多く存在することに気づく。\n12個の○を規則的に並べる方法をいろいろと考え，並べ方を式に表す。"],"short":["身の回りで使われている数に興味をもち，どのようなところにどのような数が使われているかを調べる。\n12個の○を規則的に並べ，加法などの式
