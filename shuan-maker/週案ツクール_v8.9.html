で表し，数の見方を豊かにする。"]},{"name":"かずしらべ","month":3,"total":1,"aim":"・ものの個数を絵や図などを用いて，表したり読み取ったりすることができる。\n・日々変化していく数量に着目し，身の回りの事象について，どの項目がどの程度多いのかといった事象の特徴を捉える力を養う。","title":"","lessons":["クラスで今週借りた本の冊数について，わかりやすく表す方法を考える。\n絵グラフを用いて，曜日ごとに資料を整理する。\n最大値と最小値の差など，絵グラフに表してわかったことについて話し合う。"],"short":["日々変化していく数量に着目し，各曜日の個数を絵グラフに整理する。\n絵グラフから，事象の特徴を捉える。"]},{"name":"１年の まとめを しよう","month":3,"total":3,"aim":"・既習の数の構成や計算，測定のしかた，図形の構成，資料の整理について理解することができる。\n・既習の計算や測定が適切にできる。\n・既習の見方・考え方を確かめたり，その関係を考えたりする力を養う。","title":"","lessons":["10のまとまりを作って，いちごの個数を数える。\n2，3位数について分解・合成したり，大小関係や順序を考えたりする。","加法や減法が用いられる場面について理解し，図や式に表して答えを求める。\n加法や減法が用いられる場面を見つけ，式に合う問題を作る。\n加法や減法の計算のしかたを理解し，計算する。","任意単位による比較のしかたを理解し，長さやかさの大きさを比べる。\n色板や棒を用いて示された図形を作り，必要な色板や棒の数を考える。\n日常生活と関連付けながら，時計に表された時刻を読む。\n果物の数を絵グラフに整理し，最大値や最小値を読み取る。"],"short":["数の数え方や数構成，系列などを理解しているか確認する。","加法や減法について理解しているか確認する。","長さ，かさの比べ方や図の構成要素，時刻の読み方，絵グラフについて理解しているか確認する。"]},{"name":"プログラミングのプ","month":3,"total":1,"aim":"","title":"","lessons":["命令の出し方について理解する。\nスタートから目的のところまで進むために，どのように命令を出したらよいかを考える。\n命令に沿ってこまを動かしたり，友だちと考えを交流したりして，出した命令について振り返る。"],"short":["課題を解決するための指示の出し方を考えたり，実際に指示通りに動かしたりして，論理的思考力を高める。"]},{"name":"さんすうを つかって（3月）","month":3,"total":1,"aim":"","title":"","lessons":["イラスト（消費期限）やカレンダーから，問題を把握する。\n条件に沿って，食べ物を無駄にしない方法を考え，自分の考えを説明する。\n今の自分を振り返りながら学習のまとめをする。"],"short":["これまでの単元の学習をもとに，食べ物の消費期限について考える。\n1年の算数で学んできた様々なことを活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]}]},"sansu-2":{"label":"学校図書　2年　算数（年間指導計画）","grade":2,"subject":"算数","units":[{"name":"ひょうと グラフ","month":4,"total":4,"aim":"・身の回りにある数量について，分類整理して簡単な表やグラフに表すと，特徴が読み取りやすくなることを理解することができる。\n・データを分類整理する方法や，簡単な表やグラフにわかりやすくまとめる方法を考え工夫する力を養う。","title":"","lessons":["育てたい野菜ごとの人数を落ちなく数え，表の中に数を書き入れる。\n表から野菜別の人数をグラフの中に○で記入し，グラフを作成する。\n表に表すよさや，グラフに表すよさについて話し合う。","落とし物カードを見て，落とし物の種類ごとにその数を表やグラフにまとめる。\n作成したグラフからどれがいちばん多いか，いくつ違うかなど読み取れることを話し合う。\n見やすいグラフにするにはどうすればよいか考え，表現を工夫する。\n多い順に並び替えたグラフを作成する。","前時の落とし物のカードを見て，落とした場所ごとにその数を表やグラフにまとめる。\n作成したグラフから読み取れることを話し合う。\nより見やすいグラフにするにはどうすればよいか表現を工夫する。\n落とし物をしないように気を付けることや，減らすために工夫できることはないか，表やグラフをもとに考え，話し合う。\n「なるほど算数」を読んで，落とし物を減らす工夫について考える。","３月の天気調べの結果を表やグラフに整理する。\nグラフや表を見てその特徴を読み取り，説明する。"],"short":["育てたい野菜ごとの人数を調べるために，同じ野菜の人数を数えて，表にかき表す。\n育てたい野菜別に作成した表から，簡単なグラフに表す。","前時の学習を活用して，落とし物の数を種類ごとに表やグラフにまとめる。\nグラフをより見やすくする方法を考え，工夫して表現する。","前時までの学習を活用して，落とし物をした場所ごとに表やグラフにまとめる。\n調べたいことによって，グラフをより見やすく工夫できないか考える。\n調べたことを使って，落とし物をしないように気を付けることや，減らすための工夫を考える。","既習事項の確かめをする。"]},{"name":"時こくと 時間（１）","month":4,"total":3,"aim":"・日，時，分について知り，時刻と時間の違いや，1時間＝60分，1日＝24時間の関係を理解することができる。\n・時刻や時間を，時計や帯時計で求めることができる。また，時間の単位換算ができる。\n・時計や帯時計の目盛りをもとに，長針や短針の位置関係に着目して時刻や時間を調べる力を養う。","title":"","lessons":["時計の短針と長針を見て，「何時何分」と時刻を読む。\n時計を見ながら，1分間の長さを体感する。\n長針が何目盛り進んだのかを読み取り，かかった時間を調べる。\n時刻と時間の違いを理解する。\n長針が1回りするときの短針の動きを調べ，長針の1回りが60分間で1時間であることを具体的な場面で確かめる。\n1分間をもとにすれば，いろいろな時間を表すことができることを話し合う。\n「なるほど算数」を読んで数直線の1目盛りの大きさについて知る。","生活場面の時刻を，午前・午後を付けて読む。\n1日に短針が何回回るか調べ，1日が何時間であるかを考える。\n自分の生活とつなげながら，時刻と時間について考える。\n「なるぼど 算数」を読んで，午前・午後の言葉の意味を知る。\n「なるほど算数」を読んで，電車やバスの時刻表を通じて24時制の表示について知る。","時間の単位換算をしたり，用語の意味を確認したりする。\n時計が表す時刻を，午前・午後を付けて読む。\n時計の文字盤に時刻を表す。\n時刻と時間の言葉を正しく使う。"],"short":["時計を見て，分を単位とする時刻を読む。\n長針が1目盛り進む時間が1分間であることや，1回りすると60分間で1時間になることを理解し，かかった時間を読み取る。\n時刻と時刻の間の経過量が時間であることを知り，時間と時刻の違いを理解する。","生活体験をもとに，1日の時間を量としてつかむ。\n午前，午後を付けて，時刻を表す。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"２けたの たし算と ひき算","month":4,"total":2,"aim":"・(2位数)＋(2位数)や(2位数)－(2位数)の計算のしかたを理解することができる。\n・12＋23や25－13の答えを求めるために，既習事項をもとに，言葉や図，式などを用いて考え，表現する力を養う。","title":"","lessons":["(2位数)＋(2位数)の具体的な問題場面を式に表す。\n12＋23の計算のしかたを，10のまとまりに着目して考える。\nクッキーをおはじきやブロックに置き換えて考え，10ずつにまとめ，2桁の加法の計算は，十の位同士，一の位同士を計算すればよいことを説明する。","25－13の計算のしかたを，加法のときと同じように，10のまとまりに着目して考える。\nクッキーをおはじきやブロックに置き換えて考え，2桁の減法の計算は，十の位同士，一の位同士を計算すればよいことを説明する。"],"short":["具体的な場面から(2位数)＋(2位数)の立式をし，計算のしかたを考える。","具体的な場面から(2位数)－(2位数)の立式をし，計算のしかたを考える。"]},{"name":"たし算の ひっ算","month":4,"total":7,"aim":"・2位数の加法について，位ごとに計算する筆算のしかたとその意味がわかり，交換法則や結合法則が成り立つことを理解することができ，筆算を使って計算することができる。\n・2位数の加法の筆算は位ごとに計算を繰り返せばよいことに気づき，既習事項をもとに図や式などを用いて表現し，計算のしかたを考える力を養う。","title":"","lessons":["加法の問題場面をテープ図と式で表す。\nテープ図をもとに加法の式で表し，計算のしかたを考える。\nブロック操作と対応させながら，筆算のしかたを知る。\n既習の計算から，位を縦に揃えて計算する方法を考える。\n筆算形式の書き方やしかたを練習する。","(1位数)＋(2位数)，(2位数)＋(1位数)の筆算のしかたを考える。\n筆算を用いて計算練習をする。","加法の問題場面を筆算形式で表す。\nブロックを操作することにより，繰り上がりの意味を理解し，十の位に繰り上がる計算のしかたを考える。\n筆算の表記を計算の順序に対応させて説明する。\n繰り上がりのある筆算形式について，正しい書き方や計算のしかたを考え，計算練習をする。\n「なるほど算数」を読んで，繰り上がりの書き方について知る。","(2位数)＋(2位数)で繰り上げて一の位が0になる筆算と，(2位数)＋(1位数)で繰り上がりのある筆算のしかたを考える。\n答えが50になる式をつくり，その式について話し合う。","具体的な操作活動を通して，加法の交換法則に気づく。\n交換法則が成り立つ理由について話し合う。\n加法の交換法則を理解する。","位ごとに計算することに着目して，先に計算すると簡単に答えを導けることに気づき，加法の結合法則を知る。\n（　）の意味とそのよさについて話し合う。\n（　）を使った簡単な計算のしかたを考える。","加法の筆算のしかたを確認し，筆算の練習をする。\n文章を読んで立式し，筆算で答えを求める。\n加法の筆算の誤箇所を見つけ，正しい筆算に修正をする。"],"short":["加法の用いられている場面を式に表し，繰り上がりのない2位数の加法の計算のしかたを考える。\n繰り上がりのない(2位数)＋(2位数)の加法の筆算のしかたがわかる。","繰り上がりのない(1位数)＋(2位数)，(2位数)＋(1位数)のたし算の筆算のしかたがわかり，練習をする。","(2位数)＋(2位数)の計算について，ブロック操作と筆算を対応させ，繰り上がりの意味を理解する。\n繰り上がりのある(2位数)＋(2位数)の加法の筆算のしかたがわかり，練習をする。","(2位数)＋(1，2位数)で繰り上がりのあるたし算の筆算のしかたを考える。\n答えが50になる加法の式をつくる。","加法では，被加数と加数を入れ替えてたしても答えが同じになることに気づく。","3口の加法では，前の2口を先にたしても後の2口を先にたしても答えは同じになることに気づく。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"ひき算の ひっ算","month":5,"total":6,"aim":"・2位数の減法のしかたについて，位ごとに計算する筆算のしかたとその意味を理解し，繰り下がりがないときや，繰り下がりがあるときの計算が筆算でできる。\n・2位数の減法の筆算は位ごとの計算を繰り返せばよいことに気づき，既習事項をもとに図や式などを用いて表現し，計算のしかたを考える力を養う。","title":"","lessons":["減法の適用場面を知り，式に表す。\n加法の筆算をもとにして，繰り下がりのない(2位数)－(2位数)の筆算のしかたを考える。\nブロック操作と対応させながら，筆算のしかたを説明する。\n筆算形式の書き方やしかたを練習する。","(2位数)－(何十)，(2位数)－(1位数)，(2位数)－(2位数)の差の一の位が0になる筆算のしかたを考える。\n筆算形式の書き方やしかたを練習する。\n減法の筆算は，縦に位を揃えて書き，同じ位同士で計算することを説明する。","繰り下がりのない筆算との違いを見つけ，ブロックの操作をすることにより，繰り下がりの意味を知り，筆算のしかたを考える。\n既習事項（1年「繰り下がりがある計算」）との関連を意識させ，解決の見通しをもち，解決方法を説明する。\n筆算を用いて計算練習をする。","繰り下がりのある筆算を練習する。\n70－43や34－26のような筆算で，被減数や差に空位があるときの処理のしかたを考える。\n(2位数)－(1位数)で繰り下がりのある筆算のしかたを考える。\n位を揃えて計算することを説明する。","テープ図や言葉の式をもとに，被減数・減数・差の関係を調べ，加減の関係を考える。\n減法の計算結果を，加法を用いて確かめる。\n加法と減法の相互関係について，図と関連付けて考え，説明する。","減法の筆算のしかたを確かめ，筆算の練習をする。\n減法の計算結果の確かめ方を確かめる。\n文章を読んで減法の問題場面を理解し，答えを求める。\n減法の筆算の誤箇所を見つけ，正しい筆算に修正をする。\n虫食い算をし，求め方を説明したり，虫食い算を作り，友だちと交換したりする。"],"short":["減法の用いられる場面を式に表し，繰り下がりのない2位数の減法の計算のしかたを考える。\n繰り下がりのない(2位数)－(2位数)の減法の筆算のしかたがわかる。","繰り下がりのない(2位数)－(2位数)，(2位数)－(1位数)の減法の筆算のしかたがわかり，練習をする。","繰り下がりのある(2位数)－(2位数)の計算について，ブロック操作と筆算を対応させ，繰り下がりの意味を理解する。\n繰り下がりのある(2位数)－(2位数)の減法の筆算のしかたがわかり，練習をする。","繰り下がりのある(2位数)－(2位数)の筆算の練習をする。\n(何十)－(2位数)や差が1位数になる筆算のしかたを考える。\n繰り下がりのある(2位数)－(1位数)の筆算のしかたを考える。","減法では，答えに減数をたすと，被減数になることに気づく。\n減法の答えの確かめ方を理解する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"長さ（1）","month":5,"total":8,"aim":"・ものさしを用いて長さを測り，cm，mmを単位として表すことができ，決まった長さの直線を引くことができる。また，簡単な長さの加法，減法の計算ができる。\n・長さを表す単位を知るとともに，長さを表すには，cm，mmの単位を用いればよいことを理解することができる。\n・普遍単位の必要性に気づき，長さの表し方を考え表現したり，1cmより短い長さの表し方や，長さの加減のしかたを考えたりする力を養う。","title":"","lessons":["ジャンケンレースのテープの長さを比べる方法を考え，直接比較や間接比較での比べ方について話し合う。\n直接比較しづらいものは，身の回りのものを用いて，そのいくつ分かで比べる。\nどれぐらいの差かを比べるときに，任意単位での数値化が必要なことに気づき，実際に測定して，その方法について話し合う。","工作用紙で，長さを測る道具を作り，教科書や身の回りのものの長さを測る。\n目盛りいくつ分かで測定の結果を表現する。","葉書の横の長さを測定する。\n工作用紙の1目盛り分の長さが1cmであることを知り，cmを使っていろいろなものの長さを書き表す。\n1cm目盛りの工作用紙の道具でテープや線の長さを正しい測り方で測定する。\n正確に測ることができていない理由について考え，正しい測定方法について話し合う。\n身の回りのもので10cmに近いものを探す。\nはしたが出たときの表し方を考える。","ものさしで，細かい目盛りが1cmをいくつに分けたうちの1つ分かを調べ，1cmが10mmであることを確かめる。\nものさしの目盛りを見て，棒の長さを○cm△mmと正しく測定し，単位を使って書き表したり読んだりする。\nはしたの長さを表す単位の必要性を感じ，それについて話し合う。\nものさしを使って，様々な線の長さを測る。","ものさしを使って，いろいろなものの長さを測る。\n○cm△mmの長さを，□mmで表現したり，□mmで表されたものを，○cm△mmで表現したりする。\n単位を使って表された2つの長さを比べる。","ものさしを使って，決まった長さの直線を引く。\nものさしを見て，線を引く側と，長さを測る側を確認する。\n「直線」という言葉を知る。","赤の線，青い線それぞれのつなげた長さを実際に測り，加法の計算で求める。\n赤と青の2本の線の長さの違いを減法の計算で求め，実際に測って確かめる。\ncmとmmの複名数で表された長さの加減の方法を考える。\n長さも加減が使えることについて話し合う。","ものさしの目盛りを読んで，矢印が示す長さを表す。\n長さの単位換算や計算，大小比較をする。\nあてはまる長さの単位を考える。\n2つの線の長さを測定して，和と差を求める。\n2cmの長さの直線をものさしを使ってかき，スタートから宝箱まで繋ぐ。"],"short":["テープの長さを比べる方法を考え，同じ任意単位で比べることができることに気づく。","工作用紙の目盛りを共通単位とし，いろいろなものの長さを測定する。","長さを測る道具を使って，身近なものの長さを測定する。\n長さの単位cmを知る。\n1cm目盛りの紙を使って，テープや線の長さを測定する。","ものさしを使うと，はしたの長さまで測ることができることを知る。\n単位mmを知る。1cm＝10mmの関係を知る。\nものさしを使って，ものの長さを測定する。","ものさしを使って，身近なものの長さを測定し，練習をする。\n長さの単位換算を理解する。\n長さの大小比較をする。","ものさしを使って，決まった長さの直線を引く。\nものさしには長さを測ること，直線を引くことの機能があることを知る。","長さの加法性を理解する。\n長さについて，簡単な加法，減法の計算のしかたを理解し，計算する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"たし算と ひき算（１）","month":6,"total":5,"aim":"・加法と減法の相互関係について，テープ図で数量の関係を捉え，立式し，計算することができる。\n・テープ図を用いると数量の関係がよくわかることを理解することができる。\n・数量の関係を図や式などを用いて表現し，数量の関係を考える力を養う。","title":"","lessons":["文章題を読んで，どんなことがわかっているか，尋ねていることは何かを理解するために，具体物を図にかき表して，関係をはっきりさせる。\n様々な図に表したものを見て，それぞれの図のよいところを話し合う。\n問題場面をテープ図で表して立式し，既習の計算のしかたを用いて，答えを求める。","問題場面（減法）をテープ図で表して立式し，既習の計算のしかたを用いて，答えを求める。\n文章題を読んで，尋ねていることは何かを考え，その数を□で表すことを理解する。","問題場面を2本のテープ図で表すことがあることを知る。\nテープ図を2本使うよさについて話し合い，どんな場面のときに2本使うとよいか考える。\n問題場面（減法）をテープ図で表して立式し，既習の計算を用いて，答えを求める。","問題場面をテープ図で表して立式し，既習の計算を用いて，答えを求める。\n文章題を読んで，尋ねていることは何かを考え，その数を□で表すことを理解する。","テープ図をもとに，加法や減法を用いて，問題を解く。"],"short":["文章の問題場面を様々な絵や図に表現し，それらの比較を通して，テープ図のよさを理解する。\n文章題の場面を理解し，テープ図から立式し，問題を解決する（合併場面）。\n文章題の場面を理解し，テープ図から立式し，問題を解決する（増加場面）。","文章題の場面を理解し，テープ図から立式し，問題を解決する（求残場面）。","文章題の場面を理解し，テープ図から演算を決めて立式し，問題を解決する（求差場面）。","文章題の場面を理解し，テープ図から演算を決めて立式し，問題を解決する（異種のもの）。","既習事項の確かめをする。"]},{"name":"１０００までの 数","month":6,"total":7,"aim":"・1000までの数について，十進位取り記数法に則って表したり，数直線上に3位数の位置を表したりすることができる。\n・10を単位とした加減計算をすることができる。\n・数を相対的な大きさから捉えるなど，数についての豊かな感覚をもつことができる。\n・10ずつ，100ずつにまとめて数を数えるよさについて考えたり，3位数の計算をするときに，同じ単位で計算していくよさを考えたりする力を養う。","title":"","lessons":["ひよこが何羽いるか数える。\nブロックを10ずつ，100ずつのまとまりで箱に入れたり，線で囲んだりする操作を通して，3位数の仕組みを考える。\n100より大きい数はどのように表せばよいか考え，説明する。\n操作と対応させながら，十進位取り記数法による3位数の読み方，表し方，書き方，百の位の意味を知る。\n3位数の読み方，書き方，数構成について考え，3位数を読んだり書いたりする。","各位の枠の中には，何がどれだけあるのかを確かめ，一の位や十の位が0のとき，またその両方が0のときの読み方や書き方を考える。\nブロックを使って，数の表し方を考え，説明する。\n3位数の読み方，書き方，数構成について考え，3位数を読んだり書いたりする。","100の単位を1ずつ多くしていったとき，100を10個集めた数を1000ということを知る。\n既習内容を使って，3位数の数系列を考え，話し合う。\n数直線の1目盛りの大きさや，いくつとびで数が並んでいるのかを考え，話し合う。\nある数よりいくつか大きい数や小さい数を考える。\n数の変わり方や，数直線の目盛りの大きさを捉え，連続する3位数を読み取る。","230は10をいくつ集めた数か考える。\n数をお金に置き換えて考え，何百何十を10の何個分と表したり，何百を100や10のまとまりで言い表したりする。","比較する位ごとの数字に着目して，3位数の大小を比べる。\n2つの数の大小比較について，どのようにすれば比べられるか，その方法を考え，話し合う。\n＞や＜の記号を使って，数の大小を表す。","10のまとまりを使って，(何十)＋(何十)，(百何十)－(何十)の計算のしかたを考える。\n10を単位とした加減の計算方法を考え，そのよさについて話し合う。","数を正確に表したり，3位数の数構成を調べたりする。\n3位数の大小比較をしたり，その比べ方を説明したりする。\n10のまとまりを使って計算する。\n数の表し方や仕組み，3桁の数の大きさを確かめる。\n文章を読んで問題場面を理解し，解決する。"],"short":["たくさんのひよこを，工夫して数える。\n3位数の数構成，読み方，書き方及び百の位の意味を理解する。\n3位数の読み方，書き方，数構成について，練習をし理解を深める。","一の位や十の位が0のとき，またその両方が0のときの3位数の読み方や書き方を理解する。","3位数の数構成や数系列，数直線について理解する。\n1000（千）の大きさと系列や構成を理解する。","3位数の相対的な見方について理解する。","3位数の大小がわかる。\n＞，＜の記号の意味を知る。","10を単位とした2,3位数の加法や減法の計算ができる。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"大きい 数の たし算と ひき算","month":6,"total":11,"aim":"・既習をもとにして，（2位数）＋（2位数）の加法と，その逆の減法や，簡単な3位数の加法，減法などで，位ごとに計算する筆算のしかたとその意味を理解し，繰り上がり・繰り下がりなしや，繰り上がり・繰り下がりありの計算が筆算でできる。\n・既習をもとにして，数が大きくなっても加法や減法の筆算は位ごとに計算を繰り返せばよいことに気づき，既習事項をもとに図や式などを用いて表現し，計算のしかたを考える力を養う。","title":"","lessons":["加法の問題場面を式で表し，計算のしかたを考える。\n位ごとに計算することで，百の位に繰り上げる計算のしかたを，ブロックの操作などを通して考える。\n(2位数)＋(2位数)で繰り上がり，百の位が1になる筆算のしかたを知る。\n百の位に繰り上げる加法を言葉や図を用いて説明する。","(2位数)＋(2位数)で百の位と十の位に繰り上げて3位数になる筆算のしかたを考える。\n十の位と百の位に繰り上げる加法を言葉や図を用いて説明する。\n(2位数)＋(2位数)や(1位数)＋(2位数)で，一の位から繰り上げて百の位に波及する筆算のしかたを考える。\n筆算を用いて計算練習をする。","(何百)＋(何百)の計算のしかたを考える。\n繰り上げて1000になる計算のしかたを考える。\n何百の加法のしかたを説明する。","(3位数)＋(1，2位数)の筆算の書き表し方を考える。\n筆算のしかたの間違いを修正し，繰り上がりに注意して計算する。\n(3位数)＋(1，2位数)の筆算のしかたを説明する。","被減数を計算しやすいように分け，10を単位とした計算を活用して，答えの求め方を考える。\nブロックの操作をすることにより，百の位から十の位へ繰り下げる筆算のしかたを考える。\n百の位から繰り下げる減法を言葉や図を用いて説明する。","ブロックの操作をすることにより，2回繰り下げることに着目して，筆算のしかたを考える。\n百の位と十の位から繰り下げる減法を言葉や図を用いて説明する。\n筆算を用いて計算練習をする。","被減数の十の位が空位のときの筆算のしかたを考える。\n十の位から1繰り下げることができないときは，百の位から十の位へ1繰り下げて，さらに，十の位から一の位に1繰り下げる計算方法を，筆算のしかたの手順に沿って説明する。","(何百)－(何百)の計算のしかたを考える。\n(千)－(何百)の筆算のしかたを考える。\n100のまとまりがいくつあるか考え，計算を説明する。","(3位数)－(1，2位数)の筆算の書き表し方を考え，繰り下がりに注意して計算する。\n筆算のしかたの間違いを見つけ，話し合う。","2位数や3位数の加減の筆算のしかたを説明し，練習をする。\n筆算のしかたの間違いを見つけ，正しく修正する。\n文章を読んで問題場面を理解し，解決する。\n100のまとまりがいくつあるか考え，計算を説明する。\n加法や減法を使って問題を作る。","減法の筆算をする際に間違えそうなところを確認する。\n計算間違いをしないようにするためにはどうすればよいか考える。"],"short":["加法の用いられている場面を式に表し，百の位に繰り上がりのある2位数の加法の計算のしかたを考える。\n(2位数)＋(2位数)で，百の位に繰り上げる筆算のしかたを考える。","(2位数)＋(2位数)で，百の位と十の位に繰り上げる筆算のしかたを考える。\n一の位から繰り上げて百の位に波及する筆算のしかたを考える。\n百の位と十の位に繰り上げたり，一の位から繰り上げて百の位に波及したりする(2位数)＋(2位数)の筆算のしかたがわかり，練習をする。","(何百)＋(何百)の計算のしかたや，和が1000になる計算のしかたを考える。","(3位数)＋(1，2位数)の計算のしかたを考える。","減法の用いられている場面を式に表し，(百何十何)－(2位数)で，百の位から繰り下がりのある減法の計算のしかたを考える。\n(百何十何)－(2位数)で，百の位から繰り下げる筆算のしかたを考える。","(百何十何)－(2位数)で，十の位からと百の位からの2回繰り下がりのある筆算のしかたを考える。\n(百何十何)－(2位数)で，十の位からと百の位からの2回繰り下がりのある減法の筆算のしかたがわかり，練習をする。","(百何)－(1，2位数)の筆算のしかたを考える。","(何百)－(何百)の計算のしかたや，(千)－(何百)の計算のしかたを考える。","(3位数)－(1，2位数)の計算のしかたを考える。","既習事項の確かめをする。\n既習事項の理解を深める。","減法の筆算をするときにしやすい間違いについて知る。\n繰り下がりをする際の間違いについて考える。"]},{"name":"ふりかえろう つなげよう","month":7,"total":1,"aim":"","title":"","lessons":["加法と減法の筆算の似ているところや違うところを考え，整理する。\n繰り上がりや繰り下がりについて，筆算のしかたや意味について考える。"],"short":["加法と減法の筆算を比較し，その特徴を考える。"]},{"name":"算数をつかって","month":7,"total":1,"aim":"","title":"","lessons":["夏休みを元気に過ごすために気を付けたいことをまとめ，発表し合う。\n時刻と時間の学習を振り返り，1日の生活の予定を立て，1日の過ごし方について考える。\n今の自分を振り返りながら学習のまとめをする。"],"short":["これまでの単元の学習をもとに，夏休みの過ごし方について考える。\n時刻と時間の学習を活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]},{"name":"水の かさ","month":9,"total":7,"aim":"・1Lますと1dLますを使って，かさを測ることができる。また，かさの加減の計算ができる。\n・かさの単位を使うとかさを正確に表せることや，単位同士の関係1L＝10dL，1L＝1000mLを理解することができる。\n・かさについての豊かな感覚をもつことができる。\n・単位の大きさを決めると，かさを数で表すことができる普遍単位のよさに気づき，かさの表し方を考え表現する力を養う。","title":"","lessons":["水筒などの容器に入る水などのかさの比べ方を考え，数値化する方法について話し合う。\nコップ何杯分かを調べると，かさも数で表せることに気づく。\n大きさの異なるコップでは比較できないことから，共通の単位の必要性に気づく。\n「何ばい分」に対して，任意単位での数値化が必要なことに気づき，違いを数値化する方法を考え，話し合う。","単位の必要性から，かさを比べるのにますを使って，その何杯分かで表せることを知る。\n1Lますと「L」の書き方を知る。\n1Lますを用いて，いろいろな容器に入る水のかさを量る。\n身の回りで，「L」で表されている入れ物を探す。","はしたを表すための方法を考え，発表し合う。\nはしたの量を表す単位の必要性に気づき，それについて話し合う。\n1Lますで量ったはしたの水のかさを量る単位にdLがあることを知る。\n1dLますの存在と「dL」の書き方を知る。\n1dLが10杯分で1Lになることを，操作を通して理解する。","目盛りを読んで，複名数と単名数でかさを表す。\n複名数で表されたかさを，大小比較することができる。\n1Lますや1dLますを使って，いろいろな容器に入っている水のかさを測定する。\n「なるほど算数」を読んで，１dLますの作り方を知る。","飲み物が入っていた容器に入る水のかさを測定し，小さなかさの単位「mL」の存在とともに，1mLという量の大きさを知る。\n1000mLパックの入れ物のかさを，1Lますや1dLますで量って何杯分になるかを調べる活動を通して，1L＝1000mL，1dL＝100mLの関係を調べる。\n身の回りで，「mL」で表されている入れ物を探す。","2つの容器の水のかさを量って，その合計や違いを求める。\n既習事項を生かして，計算のしかたを考え，単位に着目して計算の方法を説明する。\n水のかさについて，加法と減法の簡単な計算の練習をする。\n単位を揃えて計算する方法に気づき，計算のしかたを考え，説明する。","容器によって1Lますか1dLのどちらを選ぶか考える。\nかさの単位換算，大小比較をする。\nかさをLやｄLを使って表す。\nかさについて，加法と減法の簡単な計算の練習をする。"],"short":["具体的な操作活動を通して，かさの比べ方を考え，単位の必要性に気づく。","かさの単位（L）と，その書き方を知り，1Lますを用いて測定する。","1Lますで量りきれないはしたのかさを量る方法を考える。\nかさの単位（L）より小さい単位（dL）とその書き方を知る。\n1L＝10dLの関係がわかる。","1L＝10dLの関係を知る。\nかさの単位換算を理解する。\nかさの大小比較をする。","dLより小さいかさの単位mLを知る。\nmLの単位を生活の中で探し，1L＝1000mL，1dL＝100mLの関係を理解する。","水のかさも加法や減法の計算ができることを理解する。\nかさについて，加法や減法の計算のしかたがわかる。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"三角形と 四角形","month":9,"total":10,"aim":"・ものの形の観察や構成・分類などの活動を通して，三角形や四角形を弁別したり，作図したりすることができる。\n・直角の概念や，三角形・四角形の定義や性質を理解することができる。\n・図形についての豊かな感覚をもつことができる。\n・ものの形についての観察や構成などの活動を通して，三角形や四角形について分類し，分類した観点や分類した図形ごとの特徴を見いだす力を養う。","title":"","lessons":["動物を囲むために，点を直線で結んで，平面図形を構成することを知る。\n囲み方の約束を決め，囲み方を考える。\nゴリラとライオン，キリンを囲んでいる直線の数を調べ，三角形の定義について知る。\nゾウとシマウマ，カバを囲んでいる直線の数を調べ，四角形の定義について知る。","｢直線であること｣，｢囲まれていること｣を意識し，三角形や四角形かどうか，図について検討し，話し合う。\n三角形，四角形，閉じてない形，曲線をもつ形の中から，三角形，四角形を見つける。\n三角形や四角形でないものについて，その理由を考え，説明する。\n用語｢へん｣，｢ちょう点｣を知る。\n格子点を利用して，いろいろな三角形，四角形をかく。\n三角形や四角形の辺や頂点の数を調べる。\n図の中から三角形や四角形を見つける。","四角形に1本の直線を引いて，2つの形を作る。\n三角形に1本の直線を引いて，2つの形を作る。\nどのような引き方をしたのか話し合う。","紙を4つに折ってできた角の形を調べ，用語｢直角｣を知る。\n三角定規の1つの角は，直角になっていることを知る。\n不定形の紙で作った直角や三角定規を使って，身近な直角を探す。\n身の回りから直角になっているかどを探す。","格子点を使って直角をかく。\n三角定規を使って直角をかく。\n直角を確かめるには，三角定規を使うと便利であることを話し合う。","紙を折って，直角を作るとどのような形になるのか調べる。\n四角形の角を調べ，4つの角が直角な四角形を見つけ，長方形を理解する。\nものさしを使ったり，長方形の紙を折ったりして，向かい合う辺の長さを比べる。\n長方形の定義をもとに，いろいろな四角形の中から，定義にあてはまる形を見つける。\n身の回りから長方形を探す。","長方形の紙を折って切り，正方形を作る。\n作った正方形の角の大きさや辺の長さを調べる。\n正方形の定義を知る。\n身の回りから正方形を探したり，長方形から正方形を作ったりする。","長方形や正方形の紙を対角線で切ってできる三角形を調べ，直角のある三角形が直角三角形であることを知る。\nいろいろな三角形から直角三角形を見つける。","格子点を直線で結び，長方形や正方形，直角三角形を作る。\n作った図形に色を塗り，模様を作る。\nできたいろいろな模様を観察し合い，基本単位の繰り返しの規則性や，その美しさについて考察し，話し合う。","三角形，四角形の構成要素を確認したり，長方形，正方形，直角三角形を弁別したりする。\n直角三角形の作図や長方形から，直角三角形，正方形の作図をする。\n図の中から正方形，直角三角形がいくつあるか見つける。"],"short":["三角形や四角形に関心をもって，直線を使って動物を囲む。\n3本の直線で囲まれた形を三角形ということを知る。\n4本の直線で囲まれた形を四角形ということを知る。","3本の直線で囲まれた形，4本の直線で囲まれた形に着目して，三角形と四角形を弁別する。\n頂点を決めて，三角形や四角形を作図することができる。\n三角形，四角形の構成要素に頂点と辺があることを知る。","四角形，三角形を分割し，三角形や四角形を作る。\n１つの四角形から2つの三角形・三角形と四角形・2つの四角形が作れるときのきまりに気づく。","不定形の紙を折る操作を通して，直角の概念を理解する。\n不定形の紙で作った直角や三角定規をもとに，身の回りの直角を探し，直角の理解を深める。","格子点を使って直角をかいたり，三角定規を使って直角をかいたりすることにより，直角への理解を深める。","紙を折ってできた長方形の直角の数に着目し，長方形の定義を知り，その意味を理解する。\n直角に注目して，いくつかの四角形の中から長方形を弁別する。\n長方形の辺の長さを調べ，その性質を理解する。","長方形から正方形を作り，角の大きさや辺の長さを調べる。\n正方形の定義を知り，その意味を理解する。\n方眼を利用して，長方形や正方形を作図する。","長方形や正方形から直角三角形を作る。\n直角三角形の定義を知る。\n三角形のかどに着目して，直角三角形を弁別する。","格子点を利用して，長方形や正方形，直角三角形をもとにして敷き詰め模様を作る。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"かけ算（１）","month":10,"total":16,"aim":"・｢1つ分の大きさ｣や｢いくつ分｣に着目し，乗法の式に表すことができる。\n・乗法の意味を理解するとともに，乗法の答えは，同数累加と同じ答えになることを理解することができる。\n・乗法九九を構成するとともに，2の段から5の段までの九九を唱えることができる。\n・乗法が用いられる場面を式に表したり，式を読み取ったりすることができる。\n・乗法の用いられる場面を，具体物や図などを用いて表現し，もとになる大きさやそのいくつ分を考えて式に表す力を養う。\n・乗法のきまりに着目して，乗法九九の構成を考えたり，乗法が用いられる場面を式に表したり，乗法の式を具体的な場面に結びつけて捉えたりする力を養う。","title":"","lessons":["遊園地でいろいろな乗り物に乗っている場面を見て，それぞれの乗り物に乗っている全体の人数を求める。\n乗り物によって，乗る人数や乗り方がどのように違っているのかを考える。\nコーヒーカップに乗っている全部の人数の表し方について確認する。\nジェットコースターやゴーカート，飛行機に乗っている人数を求める。\n｢かけ算｣の用語を知り，「×」や乗法の意味について知る。","チョコレート全部の数を求めるのに，何がわかればよいか考える。\n｢1箱8個ずつ，3箱分｣というまとまりの見方で，全体の数を求める。","1箱8個ずつ6箱分の缶詰をブロックで表し，式に表して総数を求める。\n乗法の答えは，同数累加の答えと同じであることを理解する。\n場面をブロックで表し，式に表して総数を求める。","12個のゼリーの数を乗法の式に表す。\n12の表し方に3×4や4×3などの式があることを知る。\n身の回りから，乗法の式で表せる場面を探し，カードに表現する。","テープの1本分，2本分，3本分の長さを式で表し，答えを求める。\n｢倍｣の用語と意味を知る。","1皿に5個ずつのっているクッキーの，何皿分かの個数を乗法の式で表し，全体の個数を求める。\n｢九九」の意味を知る。","5の段の九九の唱え方を知る。\n5の段の九九のカードを作り，覚える。\n5の段の九九を用いて問題を解決する。","ケーキが2個ずつのっている皿の，何皿分かの個数を乗法の式で表し，全体の個数を求める。","2の段の九九の唱え方を知る。\n2の段の九九のカードを作り，覚える。\n2の段の九九を用いて問題を解決する。","三輪車のタイヤの数を求める式を乗法の式で表し，全体の個数を求める。\n三輪車が1台増えると，タイヤの数は3個増えることを知る。\n3×4で，3が「かけられる数」，4が「かける数」であることを知る。","3の段の九九の唱え方を知る。\n3の段の九九のカードを作り，覚える。\n3の段の九九を用いて問題を解決する。","1台に4個ずつタイヤをつけた自動車の何台分かのタイヤの数を乗法の式で表し，全体の個数を求める。\n自動車が1台増えると，タイヤの数は4個増えることを知る。","4の段の九九の唱え方を知る。\n4の段の九九のカードを作り，覚える。\n4の段の九九を用いて問題を解決する。","これまでに学習した2の段から5の段までの九九の式を書く。\n2の段の答えと3の段の答えをたすと，5の段の答えになることに気づく。\nほかにもきまりがないか考える。","2，3，4，5の段の乗法の式と答えのカードで，答えとりや大きさ比べのゲームをする。","全部の数の求め方を考え，説明する。\nある数の○個分のことを，ある数の○倍ということを振り返る。\n乗法九九の計算練習をする。\n文章を読んで問題場面を理解し，乗法の式に表して解決する。"],"short":["乗り物に乗っている人数が同じときは，1台分の人数と乗り物の数で全体の数を表すことができることがわかり，そのよさに気づく。\n乗法の記号｢×｣，｢かけ算｣という用語・意味について理解する。","全体の数量を，｢1つ分の大きさ」と「いくつ分」とで捉える。\n乗法の式の表し方と，読み方を知る。","単位量のいくつ分ということを意識してブロックを並べ，総数を求める。\n乗法の式と同数累加の式は，同じ答えになることを知る。","総数が決まっている場合について，単位量のいくつ分ということを意識していくつかの乗法の式に表す。\n乗法の式で表せる場面を見つける。","連続量について，乗法の式で表す。\nある数の1個分，2個分，3個分は，ある数の1倍，2倍，3倍であることを知る。","1皿に5個ずつのっているクッキーの，何皿分かの個数を求める場面を通して，5の段の九九を構成する。\n5の段の九九の答えは，5ずつ多くなっていることに気づく。","5の段の九九の呼称を知り，唱える。\n5の段の九九を用いて問題を解決する。","ケーキが2個ずつのっている皿の，何皿分かの個数を求める場面を通して，2の段の九九を構成する。\n2の段の九九の答えは，2ずつ多くなっていることに気づく。","2の段の九九の呼称を知り，唱える。\n2の段の九九を用いて問題を解決する。","三輪車のタイヤの数を求める場面を通して，3の段の九九を構成する。\n3の段の九九の答えは，3ずつ多くなっていることに気づく。","3の段の九九の呼称を知り，唱える。\n3の段の九九を用いて問題を解決する。","1台に4個ずつタイヤを着けた自動車何台分かのタイヤの数を求める場面を通して，4の段の九九を構成する。\n4の段の九九の答えは，4ずつ多くなっていることがわかる。","4の段の九九の呼称を知り，唱える。\n4の段の九九を用いて問題を解決する。","2の段から5の段までの九九の式を見て，乗法のきまりを見つける。","九九の式と答えを別々に書いたカードを作り，答えとりや大きさ比べのゲームをしながら，2，3，4，5の段の九九の理解を深める。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"かけ算（２）","month":11,"total":11,"aim":"・乗法九九を構成するとともに，6の段から9の段，1の段の九九を唱えることができる。\n・乗法が用いられる場面を式に表したり，式を読み取ったりすることができる。\n・乗法のきまりに着目して，乗法九九の構成を考えたり，乗法が用いられる場面を式に表したり，乗法の式を具体的な場面に結びつけて捉えたりする力を養う。","title":"","lessons":["絵をもとに1箱に6個ずつ入っている何箱分かのチョコレートの個数を乗法の式で表し，全体の個数を求める。\n6の段の九九を作る。\n乗数が1増えると，答えは被乗数分だけ増えることに気づく。\n2の段と4の段に分けて6の段の答えを見つける。","6の段の九九の唱え方を知る。\nカードを作り，練習して覚える。\n絵を見て式を考える。","1箱に7個ずつ入っている何箱分かのチョコレートの個数を乗法の式で表し，全体の個数を求める。\n7の段の九九を作る。\n7の段でも乗数が1増えると，答えは被乗数分だけ増えることに気づく。\n5×3の答えと2×3の答えを合わせると，7×3の答えになることに気づく。","7の段の九九の唱え方を知る。\nカードを作り，練習して覚える。\n7の段の九九を使って，問題を解決する。","1箱に8個ずつ入っている何箱分かのチョコレートの個数を乗法の式で表し，全体の個数を求める。\n8の段の九九を作る。\n乗数が1増えると，答えは被乗数分だけ増えることがわかる。\n被乗数を分けて，8の段の答えを見つける。","8の段の九九の唱え方を知る。\nカードを作り，練習して覚える。\n8の段の九九を使って，問題を解決する。\n8×2の答えに8×3の答えをたすと，8×5の答えになることに気づく。","1箱に9個ずつ入っている何箱分かのチョコレートの個数を乗法の式で表し，全体の個数を求める。\n9の段の九九を作る。\n乗数が1増えると，答えは被乗数分だけ増えることがわかる。\n被乗数を分けて，9の段の答えを見つける。","9の段の九九の唱え方を知る。\nカードを作り，練習して覚える。\n絵を見て，問題を作る。","ケーキを1人に1個ずつ4人分用意するときの，ケーキの個数を乗法の式で表し，全体の個数を求める。\n1の段の九九を構成する。\n1の段の九九の唱え方を知る。\nカードを作り，練習して覚える。","問題の絵を見ながら場面を理解する。\n問題の仕組みを調べて，わかっていることやわからないことなどをはっきりさせる。\n図にかきながら演算を決めて，文章題を解く。","乗法九九の計算の練習をする。\n文章を読んで問題場面を理解し，乗法の式に表して解決する。\n式が表す場面を選ぶ。\n乗法九九の計算をし，2つの式の答えを大小比較する。\nアレイ図の◯の数を乗法九九を用いて工夫して求める。"],"short":["1箱に6個ずつ入っているチョコレートの，何箱分かのチョコレートの個数を求める場面を通して，6の段の九九を構成する。\n乗数が1増えると，積は被乗数分だけ増えることを理解する。","6の段の九九の呼称を知り，唱える。\n6の段の九九を用いて，問題を解決する。","1箱に7個ずつ入っているチョコレートの，何箱分かのチョコレートの個数を求める場面を通して，7の段の九九を構成する。\n7の段でも，乗数が1増えると，積は被乗数分だけ増えることを理解する。","7の段の九九の呼称を知り，唱える。\n7の段の九九を用いて，問題を解決する。\n乗法の交換法則が成り立つことに気づく。","1箱に8個ずつ入っているチョコレートの，何箱分かのチョコレートの個数を求める場面を通して，8の段の九九を構成する。\n8の段でも，乗数が1増えると，積は被乗数分だけ増えることを理解する。\n8の段の九九の構成を通して，答えの増え方に気づく。","8の段の九九の呼称を知り，唱える。\n8の段の九九を用いて，問題を解決する。","1箱に9個ずつ入っているチョコレートの，何箱分かのチョコレートの個数を求める場面を通して，9の段の九九を構成する。\n9の段でも，乗数が1増えると，積は被乗数分だけ増えることを理解する。\n9の段の九九の構成を通して，答えの増え方に気づく。","9の段の九九の呼称を知り，唱える。\n9の段の九九を用いて，問題を解決する。","3の段，2の段の九九の答えからケーキの数を類推して，1の段の九九を構成する。\n1の段の九九の呼称を知り，唱える。\n1の段の九九を用いて，問題を解決する。","問題文から場面を読み取って，加法や減法・乗法の演算決定をし，乗法の理解を深める。\n具体物の操作をもとに，解き方を絵や図，式や数，言葉を使ってわかりやすく説明する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"かけ算（３）","month":11,"total":6,"aim":"・乗法のきまりを用いて，乗法九九を構成することができる。\n・被乗数，乗数，積の関係や交換法則を理解することができる。\n・九九表を観察して，乗法についての性質を見いだしたり，簡単な2位数と1位数の計算について，乗法のきまりをもとに考えたりする力を養う。","title":"","lessons":["乗法九九の答えを表に書く。\n九九表から，いろいろなきまりや特徴がないか考え，話し合う。\n「なるほど算数」を読んで，九九表に1円玉を積んだときの様子を知る。","被乗数が5（5の段）の答えと，乗数が5の答えを比べる。\n答えが同じになる理由を考え，話し合う。\n乗数が1増えると，積は被乗数分だけ増えることを式で表現する。\n交換法則を用いて問題を解く。","3×10，3×11，3×12の答えを求める方法を考える。\n既習事項を活用して，3×12のブロックの数を求める。\n分配法則や乗法のきまりを使って，答えを求める。\n12×3の計算のしかたの考え方について説明をする。\n13×3の求め方を考える。","チョコレートの数を求める式を考える。\n乗法のきまりを使って，工夫して答えを求める。","それぞれのテープの4倍の長さに色を塗り，長さを求める。\n4倍の長さのテープを見つける。\nテープの長さの求め方を考え，求める。","九九表のきまりを使って，九九表の一部がどこに当てはまるかを考え，その理由を説明する。\n乗法の交換法則やきまりを使って問題を解決する。\n文章を読んで問題場面を理解し，解決する。"],"short":["各段の九九を1枚の表にするために工夫することを通して，九九表の仕組みを理解し，九九表を完成する。\n九九表をもとに，被乗数，乗数，積の関係を確かめたり，いろいろなきまりや特徴を見つけ出したりする。","九九表や具体物の操作をもとに，乗数が1増えると，積は被乗数分だけ増えることや，乗法の交換法則を理解する。","乗数が九九の範囲を超えた乗法について，乗法のきまりや具体的な操作をもとに考える。","チョコレートの総数の数え方について，既習の乗法九九を活用して考える。","１本の長さが異なると，同じ4倍をしても長さが異なることについて考える。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"分数","month":12,"total":5,"aim":"・1/2や1/3などの簡単な分数について知り，等分してできる部分の大きさを，分数を用いて表すことができる。\n・いろいろな分数の表し方とその意味を理解することができる。\n・具体物を等分することによって，様々な大きさの分数を考える力を養う。","title":"","lessons":["折り紙を同じ大きさに2つに折る。\n半分の大きさを数で表すにはどうしたらよいか考え，もとの大きさの「二分の一」について知る。\nもとの大きさの1/2の大きさに色を塗る。\nもとの大きさの1/2の大きさになっているものを見つける。","折り紙を2回折って，同じ大きさになるように分ける。\n同じ大きさにいくつかに分けた1つ分の大きさの表し方を考え，1/4の意味と書き方を知る。\n用語｢分数｣と，その書き表し方を知る。\n同じ大きさに8つに分けた1つ分の大きさの表し方を考え，1/8の意味と書き方を知る。\n図に色を塗り，もとの大きさの1/4について理解を深める。\n図の中の色が塗られた部分が，もとの大きさの何分の一になっているかを考え，説明する。","もとの折り紙と，もとの大きさの1/4の折り紙を比べて，気づいたことを話し合う。\n折り紙の大きさと，その折り紙の1/4の大きさの関係から，1/4と4倍の意味や関係を捉える。","同じ大きさに切ったケーキ1つ分の大きさとそのケーキにのっているいちごの数を求める。\nゆうさんとはるとさんのケーキの大きさを比べ，話し合う。\n同じ大きさに切ったケーキともとのケーキの関係を考える。","1/2の大きさになっている図を見つける。\n色のついたところの大きさはもとの大きさの何分の一か考える。\n24個のボールが入った箱について，1/3の大きさになるように線を引いて分け，そのときのボールの数について考える。"],"short":["分数の意味と表し方を理解する。\n同じ大きさに2つに分けた1つ分の大きさを，もとの大きさの「二分の一」といい，1/2と書くことを理解する。","同じ大きさに4つに分けた1つ分の大きさを，もとの大きさの四分の一といい，1/4と書くことを理解する。\n1/2，1/4のような数を分数ということを理解する。","数量の関係に着目し，1/4と4倍の意味や関係について捉える。","もとの大きさが違うと，同じ分数で表されていても大きさが変わることに気づく。","既習事項の確かめをする。"]},{"name":"算数をつかって（12月）","month":12,"total":1,"aim":"","title":"","lessons":["日常生活の中で使用している水の量について考える。\n節水について知り，自分の生活を振り返り，自分ができることについて考える。"],"short":["これまでの単元の学習をもとに，節水について考える。\nかさの学習を活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]},{"name":"時こくと 時間（２）","month":1,"total":2,"aim":"・時刻と時間の違いや，1時間＝60分，1日＝24時間の関係を理解し，時間や時刻を，時計や帯時計で求めることができる。\n・時計や帯時計の目盛りをもとに，長針や短針の位置関係に着目して時刻や時間を調べる力を養う。","title":"","lessons":["時計の文字盤を見ながら，ある時刻からの時間が経ったときの時刻や，時間が経つ前の時刻を知る方法を考える。\n既習をもとに，時計を数直線に表し，時刻や時間を求める。\nジャンケンゲームをして，時間経過，時間をさかのぼることを捉え，時刻を考える。","時計の文字盤や数の線をもとに，時刻や時間を求める。\n文章から場面を理解し，時刻や経過した時間を求める。"],"short":["ある時刻から時間が経過したときの時刻や，経過する前の時刻を求める。\n時刻と時間を生活の場面で正しく使う。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"１００００までの 数","month":1,"total":6,"aim":"・4位数までの数を書いたり読んだりすることができる。\n・4位数までの数の表し方，大小，順序，相対的な大きさなどを理解し，数についての豊かな感覚をもつことができる。\n・十進位取り記数法の仕組みに気づき，数の相対的な大きさを捉える力を養う。","title":"","lessons":["ブロックで表された数を数えることを通して，二千という数を理解する。\nブロックで表された数を数えることを通して，4位数の読み方や書き方，位取りの仕組みを理解する。","紙の数を位取り表に表し，空位のある数について理解する。\n空位のある4位数を書く。\n4位数の読み方，書き方，数構成について考え，4位数を読んだり書いたりする。","2400を，10や100を単位として捉える。\n4位数を10，100，1000のまとまりとして捉える。","数直線上の数を読む。\n数直線上に数を表す。\n1000が10個集まると10000になることを知る。\n1000を1目盛りにした数直線作りをする。","4位数の大小を比較する。\n4位数の順序，系列を理解する。\n数の小さい順に，線で結ぶ。\n数の大小比較をし，その関係を不等号を使って表す。\n「なるほど算数」を読んで，身の回りで使わせている数字の意味について知る。","4位数を読んだり書いたりする。\n4位数の数構成の問題を解く。\n10000までの数の相対的な大きさを捉える問題を解く。"],"short":["ペットボトルのふたの数の数え方を考える。\n二千という数を理解する。\n4位数の読み方と書き方，位取りの仕組みを理解する。","空位のある4位数の読み方と書き方，位取りの仕組みを理解する。\n4位数の数構成を理解する。","数の相対的な大きさについて理解する。","数直線上の数を読んだり，数直線上に数を表したりすることができる。\n1000が10個集まると10000になることを知る。","4位数の大小を比較する。\n4位数の順序，系列を理解する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"ふりかえろう つなげよう（1月）","month":1,"total":1,"aim":"","title":"","lessons":["100マスの工作用紙に模様をかき，並べる。"],"short":["工作用紙を使った活動を通して，十進位取り記数法のよさを感得する。"]},{"name":"長さ（２）","month":1,"total":4,"aim":"・ものさしを用いて，mを単位として測ったり，簡単な長さの加法，減法の計算をしたりすることができる。\n・より長いものの長さを表す単位mを知るとともに，長さについての豊かな感覚をもつことができる。\n・普遍単位の必要性に気づき，長さの表し方を考え表現したり，100cmより長いものの長さの表し方や，長さの加減のしかたを考えたりする力を養う。","title":"","lessons":["電子黒板の横の長さをテープに写し取り，30cmものさしで測る。\n1mや1m＝100cmを知る。\n1mものさしをもとにして，178cm＝1m78cmであることを確かめる。\n1mものさしを使って測定し，複名数で表現する。\n複名数で表現された測定値を単名数で表現し直し，比べる。","1mの長さになるように見当を付けて紙テープを切り，ものさしで確かめる。\n身の回りのものの長さを予想し，実際に測って確かめる。","mとcmの複名数で表された長さの加減の方法を考える。\n長さの加減の計算練習をする。","長い長さの表し方を考える。\n長さの大小比較をする。\n複名数で示された長さの計算をする。\n適切な長さの単位を選択する。"],"short":["長さの単位メートル（m）を知る。\n1m＝100cmの関係を理解する。\n1mものさしを使って測定した長さを，複名数や単名数で表す。","1mのテープを作ったり，身の回りのものの長さを予想したりするなど，長さの量感を豊かにする。","1m＝100cmを用いて，mとcmの複名数で表された長さの加減をする。\nm単位の加減も同様にできることがわかる。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"ふりかえろう つなげよう（2月）","month":2,"total":1,"aim":"","title":"","lessons":["身の回りにあるものの長さを調べ，どのような単位が使われているか，調べる。\n調べた長さについて，表記されている単位をほかの単位で表現できるか考える。"],"short":["身の回りにあるものの長さを調べて，mm，cm，mの関係を整理してまとめる。"]},{"name":"たし算と ひき算（２）","month":2,"total":3,"aim":"・テープ図で数量の関係を捉え，立式し，計算することができる。\n・テープ図を用いると数量の関係がよくわかることや加法と減法の相互関係を理解することができる。\n・数量の関係を図や式などを用いて表現し，数量の関係を考える力を養う。","title":"","lessons":["加法（減法）の表現になっている場面をテープ図に表し，わかっている量と求める量をはっきりさせる。\n加数に□を使った加法（減法）の式をつくる。\n図に数を書き入れながら，減法（加法）の計算で答えを求める。","減法の表現になっている場面をテープ図に表し，わかっている量と求める量をはっきりさせる。\n減数に□を使った減法の式をつくる。\n図に数を書き入れながら，減法の計算で答えを求める。","テープ図から問題をつくる。"],"short":["問題文の表現は加法（減法）の形であるが，計算は減法（加法）を用いて解くことを理解する。\nテープ図を読んだり式を比較したりすることを通して，加法と減法は逆の関係になっていることを説明する。","減法適用の場面で，未知の減数を求めるのに，減法を用いて解くことがわかる。","テープ図から，適切な問題作りをすることで，加法と減法についての理解を深める。"]},{"name":"しりょうの せいり","month":2,"total":1,"aim":"・身の回りにある数量を分類整理し，簡単な表やグラフを用いて表したり読み取ったりすることができる。\n・データを整理する観点に着目し，身の回りの事象について表やグラフを用いて考える力を養う。","title":"","lessons":["2年2組と1年2組のデータに着目し，2クラスまとめて表に表すことができる。\n表をもとにグラフに表すことができる。〔発展〕「なるほど算数」を読んで，2年2組と1年2組のデータに着目し，2クラスを分けて1つのグラフに表したことからわかることを考える。"],"short":["身の回りの事象について，データに着目し，目的に合わせて表やグラフに表現したり考察したりする。"]},{"name":"はこの 形","month":2,"total":5,"aim":"・箱の形の面を写し取り，開いた形に並べたり，構成・分解したりしながら，もとの箱の形に作り上げることができる。\n・箱の形，さいころの形の特徴や性質を理解することができる。\n・箱の形について，構成要素をもとに分類し，分類した観点や分類した形の特徴を見いだす力を養う。","title":"","lessons":["箱を観察し，きれいな箱を作るために必要な部品を考える。\n｢面｣の用語を知る。\n箱のすべての面を厚紙に写し取って，切り取る。\n切り取った面の形や数を調べる。","切り取った6つの面を，切り開いた形に並べる。\n並べ方を変え，箱の形になる開いた形をいろいろ考える。\n箱の形を再構成し，面と面の繋がりのしくみを考える。\n箱の面の繋がりに気を付けて並べ，好きな絵をかく。\n開いた図を組み立てる。\n組み立てた箱を見て，気づいたことを話し合う。","p.141を切り取り，実際に箱が組み立てられるか確かめる。\n面の数と形に着目して，組み立てると箱の形ができる場合を考える。","実際に，ひごと粘土で箱の形を作る。\n辺の数と特徴を調べ，まとめる。\n頂点の数と特徴を調べ，まとめる。\n｢へん｣，｢ちょう点｣の用語を知る。\n構成要素の数を調べる。\nさいころの形をした箱について，面の数，辺の数や頂点の数を調べる。","箱の形の構成要素を確認する。\n未完成の展開図に面をかきたして，箱の形が作れる展開図にする。"],"short":["箱の形の面を写し取る活動を通して，箱を構成する面の形や面の数を理解する。","箱の形を構成する6つの面の繋がり方がわかる。\n開いた形に並べた面に好きな絵をかき，きれいな箱の形を作る。","いろいろな面を組み合わせる活動を通して，箱の形を構成する面の特徴や並べ方を考える。","ひごと粘土玉で箱の形を作り，頂点と辺の数や特徴を調べる。\n箱の形の構成要素（面，辺，頂点）に注目し，その特徴を理解する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"２年の まとめ","month":3,"total":3,"aim":"・既習の用語や定義，性質を理解することができる。\n・既習の計算や作図が適切にできる。\n・既習の見方・考え方を確かめたり，その関係を考えたりする力を養う。","title":"","lessons":["4枚の数字のカードを並べて，いろいろな数を作る。\n加減の計算をする。\n約束にしたがって加減の計算をする。","答えの数字が全部違う4つの九九を考える。\n乗法の問題を解く。\n類似問題を作る。\n条件や場面を変えて，問題を作る。","格子状の点を繋いで，三角形と四角形をかく。\n長さをものさしで測り，cmとmmの単位関係をまとめる。\nLとdLの単位関係をまとめる。"],"short":["4位数までの数についてや，2桁の加減について理解しているか確認する。","乗法について理解しているか確認する。","三角形や四角形，長さ，かさについて理解しているか確認する。"]},{"name":"プログラミングのプ","month":3,"total":1,"aim":"","title":"","lessons":["一筆書きのルールについて理解する。\nスタートから目的のところまで進むために，どのようにかいたらよいかを考える。\n友だちと考えを交流したりして，かいた方法について振り返る。"],"short":["課題を解決するための方法を考えたり，実際に動かしたりして，論理的思考力を高める。"]},{"name":"算数をつかって（3月）","month":3,"total":1,"aim":"","title":"","lessons":["日本で昔から使われている模様には，どんな形が繰り返し使われているかを見つけ，発表する。\n同じ形が繰り返し使われている模様を身の回りから見つけ発表する。\n自分なりに同じ形を繰り返して作った模様を作り，発表する。\n今の自分を振り返りながら学習のまとめをする。"],"short":["これまでの単元の学習をもとに，日本で昔から使われている模様について考える。\n三角形や四角形の学習を活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]}]},"sansu-3":{"label":"学校図書　3年　算数（年間指導計画）","grade":3,"subject":"算数","units":[{"name":"かけ算","month":4,"total":7,"aim":"・乗法に関して成り立つ性質について理解することができる。\n・0の乗法や10の乗法の計算のしかたを理解し，計算することができる。\n・乗法に関して成り立つ性質を見いだし，その性質を活用して，0の乗法や10の乗法の計算のしかたを考える力を養う。","title":"","lessons":["九九表を完成し，数の並び方から気づいたことやおもしろいと思ったことを発表する。\n7×6の答えの見つけ方を九九表や図を使って考え，説明する。\n7×6と6×7の答えが同じになる理由を考え，図に表し説明する。\n7の段を観察し，積の増減のしかたと乗数の関係を見いだし，説明する。\n等号の意味について理解する。","前時の発表で取り上げられなかった内容について，検討する。\n7×6の答えは3×6と4×6の和と同じになる理由を考え，図に表し説明する。\n被乗数や乗数の分け方をいろいろ変えても答えは変わらないことに気づく。","これまでに見つけたきまりを使って，8×7の答えの求め方を説明する。\nこれまでに見つけたきまりについて整理し，確認する。\n乗法の交換法則についてまとめる。\n乗数が1増えたり減ったりすると，積が被乗数分増えたり減ったりするきまりについてまとめる。\n乗法の分配法則についてまとめる。","それぞれの解き方のかける順序の違いを明らかにし，どの方法でも答えが同じになることに気づき，説明する。\n乗法の結合法則についてまとめる。\n12×3を結合法則で考えて，説明する。","ゲームの得点を乗法九九を用いて計算する。\n□×0や0×□，0×0が0になる理由を考え，乗法の仕組みを使って説明する。\n0の乗法とその答えについてまとめる。\n乗法九九の表に，0の段を加える。","シールの枚数を求める式を考える。\n5×10や10×5の答えの求め方を考え，分配法則や交換法則などのきまりを活用して説明する。\n乗法九九の表に10の段を加える。","乗法のきまりについて確認する。\n10や0を含む乗法の問題を作る。\n乗法のきまりを活用して，九九の範囲を超える計算のしかたを考える。"],"short":["九九表の数の並び方に着目し，積の増減のしかたと乗数の関係や交換法則を発見したり，成り立つ理由を説明したりすることができる。","九九表の数の並び方に着目し，分配法則を発見したり，成り立つ理由を説明したりすることができる。","これまでに見つけたきまりが成り立つことをほかの数で確かめる。","3つの数をかける場面がわかり，3つの数をかけるときは，かける順序を入れ替えても答えが同じになることを説明できる。","□×0や0×□の答えが0になる理由を，いろいろな方法で説明できる。","乗数や被乗数が10の乗法の答えを，乗法のきまりを用いたり，10がいくつ分と考えたりして求めることができる。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"時こくと時間","month":4,"total":6,"aim":"・日常生活に必要な時刻や時間を求めることができる。\n・ストップウォッチを用いて時間を測定したり，時間を求めたりできる。\n・時間の単位｢秒｣と，分と秒の関係，時間の求め方を理解することができる。\n・具体物や図，式を用いて，時刻や時間の求め方を考え，日常生活に生かす力を養う。\n・分と秒の関係が60進法に基づいていることをもとに，時間の求め方を考える力を養う。","title":"","lessons":["学校を出発した時刻と歩いた時間から，水族館に到着した時刻を求める。\n水族館を出発した時刻と公園に到着した時刻から，かかった時間を求める。","学校に到着した時刻と歩いた時間から，公園を出発した時刻を求める。\n時刻や時間の求め方についてまとめる。\n水族館にいた時間と公園で遊んでいた時間の合計時間を求める。","11時30分−8時40分の計算のしかたを筆算で考える。\n8時30分から2時間50分後の時刻を筆算で求める。","目を閉じて，どのくらい立っていられるか調べる方法を考える。\n短い時間の単位を決め，そのいくつ分で時間を測定する。\nストップウォッチを用いて，目を閉じて立っていられる時間を測定する。\nストップウォッチを用いて，ぴったり〇秒を計る取り組みを行う。","秒を分と秒で表したり，分を秒に直したりして時間の長さの大小を比べる。\n分と秒の混ざっている時間の合計を求める。","時刻や時間を，模型や数直線を用いて求める。\n秒を分と秒で表したり，分を秒に直したりして時間の長さの大小を比べる。"],"short":["出発時刻とかかった時間から到着時刻を求めることができる。\n出発時刻と到着時刻からかかった時間を求めることができる。","到着時刻とかかった時間から，出発時刻を求めることができる。\n合わせた時間を求めることができる。","繰り下がりや繰り上がりのある時間の計算を筆算ですることができる。","分より短い時間を計る方法について考えることができる。\n分より短い時間の単位｢秒｣について理解することができる。\nストップウォッチで短い時間を正確に計ることができる。","分と秒の単位換算をすることができる。\n分と秒を用いて，短い時間を測定することができる。","既習事項の確かめをする。"]},{"name":"わり算","month":4,"total":10,"aim":"・除法が用いられる場面を絵・図・式を使って表し，除法の意味を理解し，乗法九九を用いて答えを求めることができる。\n・除法が用いられる場面を式に表したり，式を読み取ったりすることができる。\n・具体物や図，既習の乗法を用いて，除法の答えを見つける方法を考えたり，除法が用いられる場面を式に表したり，式を具体的な場面に結びつけて捉えたりする力を養う。","title":"","lessons":["分ける場面には，2種類の場面があることに気づく。\n｢12個のクッキーを4人で分ける」場面について話し合う。\n｢12個のクッキーを4人で等分するとき」の1人分の個数を操作を通して考える。\n除法の式の表し方を知る。\nいろいろな除法の場面の式を，ブロックを分けるなどの操作を通して考える。","15÷3の簡単な答えの求め方を考える。\n除法の答えと乗法の被乗数との関係を考える。\n乗法九九で除法の答えを見つける。\n被除数が連続量の場合についても，分離量のときと同様に考えられることを知る。","絵を見ながら除法の場面を思い浮かべ，問題を作る。\n一つの除法の式からいろいろな問題を作り，発表し合う。\n自由に除法の問題を作り，友だち同士で問題を解き合う。","問題文を読み，これまでに学習した分け方との違いについて話し合う。\n実際に操作して，何人に分けられるかを求め，発表し合う。\nこの操作も除法の式に表されることを知る。\nいろいろな除法の場面の式を，ブロックを分けるなどの操作を通して考える。","何人に分けられるかを計算で求める方法を考える。\nブロックの操作を乗法の式と結びつけながら，3の段の九九で答えが見つけられる理由を説明する。\nかさについての包含除の問題を考え，式と答えを求める。","2つの問題を比べて，違いを考える。\n写真を見て，10÷5の式になる2つの問題を作る。\n2つの問題の違いを考え，発表し合う。\n「なるほど算数」を読んで，2種類の除法についてまとめ，わり算の本作りをする。","クッキーの個数が12個，4個，0個のとき，それぞれ4人で等分する場合の式と答えを考える。\n考えた式や答えを発表し合う。\n答えが1になる場合と0になる場合の除法についてまとめる。\n6÷1の式になる除法の場面を知り，答えを求める。","80÷4の計算のしかたを考える。\n図から続きを考え，計算のしかたを説明する。","36÷3の計算のしかたを考える。\n九九が使えないときのわり算の答えの求め方をまとめる。","除法の計算練習をする。\n等分除の問題と包含除の問題を解く。\n1つの式でも，等分除と包含除の2種類の問題があることを確かめる。\n等分除と包含除の2種類の問題作りをする。"],"short":["「分ける」ことと「同じ数ずつ分ける」ことの意味の違いがわかり，操作を通して，等分したときの1人分の数を求めることができる。\n等分除が用いられる場面がわかり，除法の式の表し方を知る。","等分除の答えを乗法九九を用いて求めることができる。","等分除の問題を作ることができる。","包含除が用いられる場面がわかり，除法の式の表し方を知る。","包含除の答えを乗法九九を用いて求めることができる。","等分除と包含除の違いがわかる。\n1つの式から2種類の除法の問題を作ることができる。","除法で答えが1や0になる場合や，1でわる除法の意味がわかり，計算することができる。","（何十）÷（1位数）＝（何十）の計算のしかたを考え，説明できる。","簡単な場合の除数が1位数で商が2位数の除法の計算のしかたを考え，説明できる。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"○倍の計算 倍について考えよう","month":5,"total":1,"aim":"・2量の関係を｢倍」を使って表したり，｢何倍」にあたる大きさを求めたりすることができる。\n・倍を使った2量の関係の表し方を理解することができる。\n・2量で，一方の量をもとにする量とし，それを単位としてほかの量の大きさが｢何倍」になるかという関係について，数で表すことを考える力を養う。","title":"","lessons":["倍を求める方法を考える。\n除法を使って倍を求める方法を知る。"],"short":["テープの長さの関係の考察を通して，倍の考え方を知る。\n何倍かを求めるときは，除法を使って計算することを知る。"]},{"name":"たし算とひき算","month":5,"total":13,"aim":"・3位数や4位数の加法及び減法の計算のしかたや，加法や減法の計算が，2位数などの基本的な計算をもとにできることなどを理解し，3位数や4位数の加法及び減法の計算が筆算でできる。\n・（2位数）±（2位数）の計算のしかたをもとに類推するなどして，3位数や4位数の加法及び減法の計算のしかたを考える力を養う。","title":"","lessons":["加法の用いられる場面を理解し，そこから式を立てる。\n2位数同士の加法の計算のしかたをもとにして，自力で計算方法を考える。\nブロック操作と筆算形式を対応させ，繰り上がりのない3位数の加法も，位ごとに計算することを理解する。","十の位に繰り上げる筆算のしかたを考え，発表し合う。\n百の位に繰り上げる筆算のしかたを考え，発表し合い，筆算のしかたについてまとめる。","十の位にも百の位にも繰り上げる筆算のしかたを考え，発表し合う。\nブロック操作と筆算形式を対応させながら，筆算のしかたについてまとめる。\n十の位に繰り上げて十の位が空位になる場合の筆算のしかたを考え，発表し合い，筆算のしかたについてまとめる。","千の位に繰り上げる筆算のしかたを考え，発表し合い，筆算のしかたについてまとめる。","場面から，減法を用いればよいことを理解し，式を立てる。\n(3位数)－(3位数)で繰り下がりのない場合の筆算のしかたを考え，発表し合う。\nブロック操作と筆算形式を対応させ，繰り下がりのない3位数の減法も，位ごとに計算することを理解する。","(3位数)－(3位数)で，十の位から一の位へ繰り下げる筆算のしかたを考え，発表し合う。\n百の位から十の位へ繰り下げる場合の筆算のしかたを考え，発表し合い，筆算のしかたについてまとめる。","(3位数)－(2，3位数)で，十の位から一の位へ，百の位から十の位へと2回繰り下げる筆算のしかたを考える。\nブロックなどを用いて，友だちにもよくわかるように計算方法を説明し合い，筆算のしかたについてまとめる。","(3位数)－(3位数)で，被減数の十の位が空位の場合で，百の位から一の位へ繰り下げる筆算のしかたを考える。\nブロックなどを用いて，友だちにもよくわかるように計算方法を説明し合い，筆算のしかたについてまとめる。","1000－(3位数)で，千の位から繰り下げる筆算のしかたを考える。","(4位数)±(4位数)の筆算のしかたを考える。\n10000－(4位数)の筆算のしかたを考える。","298＋120のできるだけ簡単な計算のしかたを考える。\n300＋120－2という計算の方法を知る。\n前問の計算方法をもとにして，500－198のできるだけ簡単な計算のしかたを考える。","875＋47＋53のできるだけ簡単な計算のしかたを考える。\n加法の計算のきまりについて知る。\n加法と減法について暗算のしかたを考える。","(3，4位数)±(3，4位数)の筆算をする。\n加法の計算のきまりについて振り返り，工夫して計算する。\n問題場面から，加法か減法かを判断し，立式し解決する。\n筆算の間違いを見つけ，正しく直す。"],"short":["加法の用いられる場面を理解し，立式する。\n(3位数)＋(3位数)で，繰り上がりのない筆算のしかたを考える。","(3位数)＋(3位数)で，十の位に繰り上げる筆算のしかたを考える。\n(3位数)＋(3位数)で，百の位に繰り上げる筆算のしかたを考える。","(3位数)＋(3位数)で，十の位にも百の位にも繰り上げる筆算のしかたを考える。\n(3位数)＋(3位数)で，繰り上がりが2回あり，十の位が空位になる筆算のしかたを考える。","(3位数)＋(3位数)で，千の位に繰り上げる筆算のしかたを考える。\n(3位数)＋(3位数)で，千の位に繰り上がりがあり，百の位が空位になる筆算のしかたを考える。","減法の用いられる場面を理解し，立式する。\n(3位数)－(3位数)で繰り下がりのない筆算のしかたを考える。","(3位数)－(3位数)で，繰り下がりが1回ある筆算のしかたを考える。","(3位数)－(2，3位数)で，繰り下がりが2回ある筆算のしかたを考える。","(3位数)－(3位数)で，被減数の十の位が空位の計算のしかたを考える。","千の位から繰り下げる計算のしかたを考える。","(4位数)±(4位数)，10000−(4位数)の筆算のしかたを，3位数の計算原理をもとに考える。","被加数，加数，和の関係について考える。\n被減数，減数，差の関係について考える。","加法の交換法則や結合法則を活用して，計算のしかたを工夫する。\n(2位数)±(1，2位数)などの簡単な暗算ができる。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"ふりかえろう つなげよう","month":6,"total":1,"aim":"","title":"","lessons":["加法の筆算のしかたを振り返り，答えが1000になる場合の筆算について考える。\n減法の筆算のしかたを振り返り，1000からひく場合の筆算について考える。"],"short":["3位数の筆算のしかたを振り返るとともに，どんな桁数になっても筆算が使えることを理解する。"]},{"name":"表とグラフ","month":6,"total":7,"aim":"・目的に合った分類の観点を決めて資料を整理し，表に表したり，読んだりすることができる。\n・棒グラフの特徴を理解し，棒グラフに表したり，集団のもつ全体的な傾向を読み取ったりすることができる。\n・解決したい問題に応じて観点を決めて資料を分類整理し，表やグラフを用いて考察して，見いだしたことを表現する力を養う。","title":"","lessons":["学校の前の交通量調査について話し合う。\n自動車の種類についての傾向が，一目見てすぐにわかるような，資料の整理方法を考える。\n落ちや重なりのない資料の数え方や工夫について話し合う。\n｢正」の字を書きながら資料を整理する。\n表からわかったことを発表し合う。\n表の中の「その他」が何を表しているのかについて話し合う。","用語「棒グラフ」，｢横のじく」，「たてのじく」，「表題」，「たんい」という用語を知り，棒グラフの読み方を考える。\n数の大きさの順に表したり，「その他」は最後に書いたりするなど，棒グラフの表し方について知る。\n表とグラフのそれぞれのよさについて話し合う。","学校の前と駅の前の棒グラフを比べて，資料からわかることを考え，発表し合う。","順番通りに表された横の棒グラフを読む。\n最小目盛りが表している大きさを読む。","これまで見てきた棒グラフをもとにして棒グラフのかき方を考える。\np.82，83のグラフ用紙にたりないところをかき込んで，棒グラフを完成させる。\nサッカーの好きな人の数の表を，棒グラフに表し，かいたグラフの正当性について検討し合う。\n好きなスポーツ調べの表を，棒グラフに表す。\n数が多い場合の1目盛りの大きさについて検討する。","｢かし出した本の数」の4月～6月までの3つの表を，1つの表にまとめる方法を考える。\n考えた方法で，各自が1つの表にまとめる。\n1つの表にまとめるとどんなよさがあるのかについて話し合う。\n二次元表の読み取りの練習問題をする。","表と棒グラフのそれぞれのよさについて再確認し合う。\n棒グラフを完成させる。\n二次元表の空いているところを求める。"],"short":["学校の前の交通量に興味をもち，調べる目的をつかむ。\n目的に合った調査の方法や手順を考え，調査をする。\n集めた資料をもとにして，整理の観点を決め，それに応じた分類整理の方法を考える。\n集めた資料を，落ちや重なりがないように整理し，表に表す。","棒グラフの見方・用語を理解する。\n棒グラフは，数の多い順に表すと見やすくなることがわかる。\n棒グラフを読み，資料の特徴を指摘する。\n表と棒グラフ，それぞれのよさがわかる。","2つの棒グラフを比べて資料の特徴を考える。","横の棒グラフを読む。\n数の多い順ではなく，順番通りに表す棒グラフがあることがわかる。\n最小目盛りがいくつかを読み取る。","棒グラフのかき方がわかる。\n1目盛りの大きさを工夫して棒グラフをかく。","資料を比較するために，いくつかの一次元表を，二次元表にまとめる。","既習事項の確かめをする。"]},{"name":"長さ","month":7,"total":7,"aim":"・長さの単位kmを知り，ほかの長さの単位との関係を理解することができる。\n・目的に応じて巻尺やものさしなどを選び，身の回りのものの長さを測ったり，kmやmを単位として長さを表したりすることができる。\n・長さの単位のkmとmの関係がわかり，目的に応じて単位を選んだり，適切な計器を選んだりすることを考える力を養う。","title":"","lessons":["ゴム自動車の走った長さを1mものさしで正しく測る方法を考える。\nより正確に測るにはどんな器具があればよいかについて考える。\n用語｢きょり」の意味を知る。\n巻尺の使い方，目盛りの読み方を知る。\n巻尺を使ってゴム自動車の走った距離を測る。\n校庭で｢10m当てゲーム」をする。","いろいろなものの長さを測る計画を立てる。\n測る対象に応じて，測定器具を選ぶ。\n計画に応じて，実際に長さを測る。\n測った結果を発表し合う。\n測定の難しさや，工夫したことなどを話し合う。","入口からペンギンまでを直線で結ぶ。\n入口からペンギンまでの道順を地図上に赤線で書く。\n「道のり」と「距離」の違いを知る。\n新しい単位kmや，mとkmの関係を知る。","繰り上がりや繰り下がりのある長さの計算のしかたを考える。\nkmやmに分けて考え，あとでたす方法と，kmをmに直して計算し，最後にkmに換算する2つの方法を理解する。","グループごとに1kmを歩いて体験する計画を立てる。\n1kmを歩くと｢どこまで行けるのか｣，｢何歩くらいか」，｢何分で歩けるか」，｢どのくらい疲れるか」などを予想する。\n実際に学校から1km歩き，歩数や時間を測定する。","道のりとかかる時間を組み合わせて，観光するコースを調べる。\n回り方の違いによる，道のりとかかる時間の差を求める。","用語や単位について確認する。\n巻尺の目盛りの読み方を確認する。\nkmとmの関係を確認する。\n対象物に応じた適切な単位を選ぶ。\n長さの大小比較，計算をする。\n標識から長さを読み取り，位置関係を考える。"],"short":["長いものを測る測定器具として巻尺があることを知る。\n巻尺を使って，長さを正確に測ることができる。\n10mを見当を付けて歩いたり，10mを歩いてその歩数を調べたりしながら，10mの量感を豊かにする。","長さの見当をもとに，測定計器を選ぶとよいことがわかる。\n身近なものの長さを予想し，実測することを通して，量感を身に付ける。\n測る対象によって，測定計器を選んだり，測り方を工夫したりする。","「道のり」と「距離」の違いを理解する。\n1kmの意味がわかる。\nmとkmの関係を理解し，mで表された長さを，kmとmで表すことができる。","繰り上がりや繰り下がりのある長さの計算のしかたがわかる。\n長さの計算も単位を揃えれば，筆算で求めることができることがわかる。","1kmが実際にどれくらいあるのかを，体験を通して感じ取る。\n1kmは，「どこまで行けるのか」，「何分くらいかかるのか」がわかる。","道のりと時間を組み合わせて，効率的なコースを考える。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"算数をつかって","month":7,"total":1,"aim":"","title":"","lessons":["表を見て，事故の起きやすい時間帯，場所，原因などについて気づいたことをまとめる。\nこれまでまとめたことから，交通事故にあわないようにするためにはどうすればよいかについて話し合う。"],"short":["これまでの単元の学習をもとに，交通安全について考える。\nこれまでの学習を活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]},{"name":"円と球","month":9,"total":7,"aim":"・円や球の定義や性質，それぞれのもつ構成要素の関係を理解することができる。\n・コンパスを用いて，決められた大きさの円をかいたり，線分を写し取ったり，模様をかいたりすることができる。\n・折ったり，重ねたりする操作をもとにして，円や球の性質や特徴を，帰納的に考える力を養う。","title":"","lessons":["10～12名くらいで玉入れをするときの条件を話し合う。\nかごから等距離に並ぶにはどうすればよいかを考える。\nそれぞれの考えを発表し合い，妥当性について検討する。\n人数がもっと増えたとき，みんなが立つ位置がどんな形になるかを考える。\n1つの点から3cm離れた点を，たくさんかく。\n｢円｣の定義，｢中心｣，｢半径｣の意味を知る。\n円にたくさんの半径を引き，どれも同じ長さになっていることを確かめる。\n円の形をしたものを身の回りから探す。","自分で円をかく道具を考え，まるい形をかく。\n半径の長さを変えて，いろいろな大きさの円をかく。\n校庭に半径2mの円をかく。","コンパスを使って円をかく。\n半径の長さが2cm，3cm，4cm，5cmの円を，コンパスを使ってかく。\nコンパスを使ってきれいな模様をかく。\n模様に色を塗って，楽しむ。","円の中心の見つけ方を考える。\n円を折る活動を通して，直径の性質について調べる。\n直径の意味を知る。\n正方形にぴったり入る円をかく。","コンパスを使って，直線を等間隔に区切ったり，直線の長さを比べたりする。\nコンパスを使って，指定の距離にある点を見つける。","球をいろいろな方向から見ると，どんな形に見えるか考える。\n球の定義と構成要素を知る。\n球の切り口がいちばん大きくなるのはどんなときか考える。\n球の直径の調べ方を考える。\n身の回りから球の形をしたものを探す。\n「なるほど算数」を読んで，マンホールの形が丸い理由について考える。","円の構成要素についてまとめる。\nコンパスを使って，円をかいたり，直線の長さを比べたり，折れ線を直線に写し取ったりする。\n直径や半径の関係を使って，問題を解く。"],"short":["ある点から等距離に点をたくさん打つと，まんまる（円）な形に近づくことに気づく。\n円の定義や用語を知る。","円をかく道具を工夫する。","コンパスで円をかく。\nコンパスのはたらきについて知る。\n模様作りを通して，コンパスの使い方に慣れる。","円の直径と中心について理解を深める。\n直径の意味を知り，その性質を調べる。","コンパスのいろいろな使い方を知る。","球の特徴を円と関連付けて理解する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"あまりのあるわり算","month":9,"total":5,"aim":"・余りの意味や処理のしかた，除法の計算のしかたを理解し，余りのある除法の計算や余りの処理ができる。\n・余りのある除法の意味や処理のしかたを具体的な場面と結びつけながら，具体物や図を用いて考える力を養う。","title":"","lessons":["りんご25個を5個ずつ袋に入れる場合とみかん20個を6個ずつ袋に入れる場合について，それぞれ何袋できるか考える。\n考えた方法と結果を発表し合う。\n式と答えの求め方をまとめる。\n「わり切れる」，「わり切れない」の意味を知る。\n34÷6の等分除の問題場面で，余りのある除法の立式と答えの求め方を確かめる。","4でわる除法とその余りを比べ，余りの数の範囲を考える。\n余りは，除数より小さい数であることを確かめる。","除法の答えの確かめのしかたを知る。","等分除，包含除で余りのある文章題を解く。\n余りの処理のしかたについて検討する。","余りのある除法の計算やその確かめのしかたについて確かめる。\n計算の間違いを直す。\n余りの処理のしかたについて確かめ，問題を解く。〔発展〕「なるほど算数」を読んで，除法の筆算のしかたを知る。"],"short":["分けるとき，余りが出る場合も除法の立式ができることを知り，乗法九九を用いて答えを求める。","余りのある除法の除数と余りを調べ，除数と余りの関係を知る。","除法の計算の確かめのしかたがわかる。","余りのある除法の問題を解き，余りの処理のしかたについて考える。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"（２けた）×（１けた）の計算","month":10,"total":1,"aim":"・乗法九九の範囲を超える乗法の答えを，既習の計算のきまりを用いて求めることができる。\n・12×4の答えを求めるために，具体物や図，式などを用いて表現し，既習事項を使って考える力を養う。","title":"","lessons":["12×4の問題の式及びその計算のしかたを考える。\n12×4の計算方法をブロック図と式を対応させ，友だちにもわかるように発表し合う。さらに，それぞれの方法の共通点について話し合う。\n17×4の計算のしかたを考える。"],"short":["12×4の計算のしかたを乗法に関して成り立つ性質をもとに考え，それらの計算が乗法九九などの基本的な計算をもとにしてできることを理解する。"]},{"name":"１けたをかけるかけ算","month":10,"total":9,"aim":"・乗法の計算が乗法九九などの基本的な計算をもとにしてできることや，(2，3位数)×(1位数)の筆算のしかたを理解し，筆算で計算できる。\n・(2，3位数)×(1位数)の計算のしかたを，具体物や図，式を用いて表現して考える力を養う。","title":"","lessons":["20×4の計算のしかたを考え，発表し合う。\n10の8（2×4）個分という考え方でまとめる。\n200×4の計算のしかたを考え，発表し合う。\n100の8（2×4）個分という考え方でまとめる。\n(何十，何百)×(1位数)の計算問題に取り組む。","23×3の計算のしかたを考える。\n1が3×3個と10が2×3個と考えて計算する考えと，23を20と3に分けて計算する考えを比べ，同じところを話し合う。","23×3の筆算のしかたを考える。\n位ごとに分けてかける方法を念頭におき，ブロックと式と筆算を結びつけながら筆算の仕組みを説明し合い，まとめる。","繰り上がりのある筆算のしかたを考える。\n繰り上げた数をどのように処理すればよいかについて話し合う。\n繰り上がりのある筆算形式についてまとめる。","213×3の計算のしかたを考える。\n考えを発表し合い，その妥当性を検討する。\n位ごとに分けてかける方法をブロックと式を結びつけながら計算のしかたを説明する。","213×3の筆算のしかたを考える。\n位ごとに分けてかける方法を念頭におき，ブロックと式と筆算を結びつけながら筆算の仕組みを説明し合い，まとめる。\n繰り上がりのある筆算のしかたを考える。\n繰り上げた数をどのように処理すればよいかについて話し合う。","繰り上がりのある筆算形式についてまとめる。\n(3位数)×(1位数)で，被乗数に0のある計算のしかたを考える。\n考えの妥当性について検討する。","20×3の大きさをもとにして，24×3の答えの大きさの見当を付ける。\n24×3の暗算のしかたをまとめる。\n暗算の練習をする。","(2位数)×(1位数)の計算のしかたを確認する。\n乗法の筆算の練習をする。\n(2，3位数)×(1位数)の筆算の間違いを直す。\n43×6の式になる問題を作る。"],"short":["被乗数が何十・何百の場合の乗法の答えを，10がいくつ分，100がいくつ分と考えて，九九を用いて求める。","23×3の計算のしかたを考える。","乗法九九が使えるように，被乗数を位ごとに分けて計算する筆算形式に置き換えることができる。","(2位数)×(1位数)で繰り上がりのある計算を筆算でする。","(2位数)×(1位数)で学習したことを用いて，(3位数)×(1位数)の計算のしかたを説明する。","(3位数)×(1位数)の筆算のしかたがわかる。\n(3位数)×(1位数)で，繰り上がりのある計算が筆算でできる。","(3位数)×(1位数)で，繰り上がりのある計算が筆算でできる。\n(3位数)×(1位数)で，被乗数に0のある計算が筆算でできる。","積の見積もりをもとにして，(2位数)×(1位数)の暗算をする。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"大きい数","month":10,"total":10,"aim":"・十進位取り記数法をもとに千万の位までの数の読み書きや数を数直線上に表したり，大小比較をしたりできる。\n・10倍，100倍，1000倍したり，10でわったりした数を求めることができる。\n・十進位取り記数法をもとに，大きい数の読み方や計算のしかたなどを考える力を養う。","title":"","lessons":["入場券の枚数の表し方について，互いの考えを紹介し合う。\n36427の読み方，表し方を知る。\n十進位取り記数法で1000が10個集まった数を表す方法を考え，紹介し合う。\n位ごとの数で10000の数の仕組みや1万より大きい数の表し方を考える。\n一万の位までの数を読んだり書いたりする。","位取り表を用い，286837，1178690，14602500の読み方や，構成について考える。\n｢十万の位｣，｢百万の位｣，｢千万の位｣の意味を知る。\n千万の位までの数を読んだり，書いたりする。\n「なるほど算数」を読み，4桁区切りの読み方の工夫を知る。","13980000について，一万や千などの数を単位とした数の相対的な見方を考える。\n「万」を使った数の表し方を知る。\nことば「万」の意味について知る。","数直線の仕組みを知る。\n数直線の1目盛りの大きさと大小関係を考えて，数直線上の数を読む。\n数系列について考える。\n一億について知る。","位ごとに考えて数の大小比較をする。\n不等号の意味を知る。","20の10倍，25の10倍，100倍，1000倍の数を求め，答えの位ごとの数値を比べる。\nある数を10倍，100倍，1000倍すると，その積の位の数がどのように変わるかを考える。\n10倍，100倍，1000倍するときの積の求め方を考える。","150を10でわったときの商を求める。\n10でわったとき，商の各位の数値がどのように変わるかのきまりを考える。\n10倍した数を10でわると，その答えがどうなるか予想し，確かめ合う。","数を一万のまとまりと見て，大きい数の計算を簡略化して考える。\n桁数の多い，加法，減法の筆算を解く。\n4位数同士の加法，減法のしかたを考える。\n1～8までの数カードを使って，答えがいちばん大きい加法や答えがいちばん小さい減法の問題を作る。","千万の位までの数を読んだり，書いたりする。\n大きい数の数構成を調べる。\n数直線上の数を読む。\n10倍，100倍，1000倍した数と10でわった数を求める。\n位ごとの数の大きさを考えて，大小比較をする。\n桁数の多い数の計算をする。","数直線の1目盛りの大きさを読み取る。\n数直線の目盛りの表す数を考える。"],"short":["一万の位までの数の読み方，表し方を知り，それを正しく読む。\n一万の位までの数の構成を知り，正しく読んだり書いたりする。","千万の位までの数の読み方や構成などを考え，それを正しく読んだり書いたりする。","千万の位までの数構成について理解を深める。\n一万や千を単位として数を表す。","数直線上に数を表したり，数直線上の数を読んだりする。\n一億について知る。","大きい数の大小比較をする。","10倍，100倍，1000倍の数を表す。","10でわった数の表し方がわかる。","数を一万のまとまりと見て，大きな数の計算を簡略化して考える。\n桁数の多い，加減の筆算を考える。\n十進位取り記数法の考えや数の相対的な見方を活用して，大きい数の加減の計算を考える。","既習事項の確かめをする。\n既習事項の理解を深める。","数直線で1目盛りの大きさによって，数直線上に表される数が変わることを理解する。"]},{"name":"小数","month":11,"total":10,"aim":"・小数の意味とその表し方，小数の計算のしかたを理解することができる。\n・小数の構成や大きさなどについての豊かな感覚をもち，1/10の位までの小数の加法，減法の計算ができる。\n・小数の表し方や計算のしかたを，整数の表し方や計算のしかたをもとに考える力を養う。","title":"","lessons":["いろいろな入れ物のかさを1dLますで測ってかさ比べをし，はしたの量の表し方を考える。\nはしたの量を単位の10等分をもとに表す。\n小数を知り，はしたの量を小数で表す。","1dLに満たない量を小数で表す。\n小数の表し方を知り，小数点の意味を理解する。\nいろいろなかさを小数で表す。","1Lに満たないはしたの表し方を考える。\n1Lや1cm，1mをもとにかさや長さを小数で表す。","25.7について調べる。\n小数第一位の意味を理解する。\n小数を位ごとに分けて表せることを理解する。","2.4dLは2dLと0.4dL，0.1dLの24個分であることを図をもとにして理解する。\n小数を数直線上に表したり，数直線上の小数を読み取ったりする。","数直線上の小数を読み取る。\n0.1が10個分で1になることから，単位の構成が十進構造になっていることを理解する。\n小数の数系列を考えたり，大小比較をする。","小数の加法の問題場面を，図を手がかりにして立式する。\n0.1を単位にして計算のしかたを考える。","小数の加法を，筆算を使って計算する。\n小数の加法の計算をし，繰り上がりのある場合の処理のしかたも考える。","小数の減法の場面を，図で確かめながら立式する。\n加法の計算と比較しながら，小数の減法のしかたを考える。\n小数の減法を，筆算を使って計算する。\n小数の減法の計算をし，繰り下がりのある場合の処理のしかたも考える。","小数の構成を確認する。\n数直線上の小数を読む。\n小数の大小比較，加法，減法の計算をする。\nはしたの量の表し方を説明する。"],"short":["1dLより小さい端数部分も10等分した単位を用いて数として表せることを知る。","小数の意味とその表し方を理解する。","かさや長さをいろいろな単位をもとに小数で表すことができる。","小数が整数と同じ仕組みで表されていることを知る。","小数の相対的な大きさについて理解する。","小数の仕組みや大小関係を理解する。","小数の加法は，0.1を単位として考えると，整数と同じように計算ができることを純小数で理解する。","帯小数の加法のしかたについて理解する。","小数の減法も，小数の加法と同様に考えられることを理解する。\n帯小数の減法のしかたについて理解する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"三角形と角","month":11,"total":12,"aim":"・三角形の辺の長さの違いに着目して三角形を構成したり，コンパスで作図したりできる。\n・二等辺三角形，正三角形の定義や特徴，図形としての角の意味を理解することができる。\n・図形についての豊かな感覚をもつことができる。\n・三角形について分類し，分類した観点や分類した図形ごとの特徴を見いだしたり，三角形の構成要素に着目し，三角形の特徴を帰納的に見いだしたりする力を養う。","title":"","lessons":["長さの異なる3種類の色ストローで様々な三角形を作る。\n作った三角形を比べ，落ちや重なりを調べ，似ている形を探し分類する。","互いの分類のしかたを確かめ合い，2辺が同じ三角形，3辺が同じ三角形の特徴を考える。\nそれぞれの三角形を紙に写し取り，二等辺三角形や正三角形の辺の長さや特徴を調べる。\n「二等辺三角形」と「正三角形」の定義を知る。","長さの異なる4種類の色ストローで様々な三角形を作る。\n作った三角形の中から，二等辺三角形や正三角形を選ぶ。\n身近な生活の中から二等辺三角形や正三角形が使われているものを探す。","与えられた長さを用いて，二等辺三角形をかく方法を考える。\n適切な三角形の作図方法を考える。\n二等辺三角形の作図の練習をする。\n3辺の長さに着目しながら，二等辺三角形が作れない場合の理由を説明する。","二等辺三角形のかき方をもとに，正三角形のかき方を考え，かき方をノートにまとめる。","円の半径を使った二等辺三角形や正三角形のかき方を考え，説明する。\n円を使って，二等辺三角形や正三角形をかく。","折り紙を折ったり，切ったりして二等辺三角形や正三角形を作るとともに，その特徴を考える。","三角定規の角を写し取り，重ねてその大きさを比べる。\n角の定義と，「角」，「頂点」，「辺」，「角の大きさ」の用語を知る。\n大きい三角定規と小さい三角定規の角の大きさについて比べる。","二等辺三角形，正三角形の角の大きさの関係を調べる。\n二等辺三角形，正三角形の性質を，角の大きさの関係からまとめる。\n直角二等辺三角形の性質を説明する。","同じ大きさの二等辺三角形や正三角形を敷き詰めて，その特徴を生かしたいろいろな形を作る。\n三角定規を2枚使って，既習の三角形，四角形の形を作る。","二等辺三角形の底辺を徐々に伸ばしたときの形の変化について調べる。","二等辺三角形，正三角形の定義，用語を確かめる。\nコンパスを用いて，いろいろな三角形の作図をする。\n円の性質を用いて，三角形を判別する。\n角についての用語や三角形の角について調べる。"],"short":["3種類の長さのストローを組み合わせて，いろいろな三角形を作る。\n辺の長さの違いに着目し，三角形を分類する方法を考える。","辺の長さの違いに着目し，三角形を分類する方法を考える。\n二等辺三角形の定義がわかる。\n正三角形の定義がわかる。","二等辺三角形や正三角形の定義や性質の理解を深める。","辺の長さが指定された二等辺三角形を，コンパスを使ってかく。","正三角形のかき方について，二等辺三角形のかき方をもとに考えることができる。","円の中にかいた三角形が二等辺三角形（正三角形）であることを説明する。","二等辺三角形や正三角形を折り紙で作って，それぞれの性質の理解を深める。","三角定規の角について，その意味，構成要素の「頂点」，「辺」，「角の大きさ」を理解する。","三角形の3つの角を紙に写し取って角の大きさを比べ，二等辺三角形や正三角形の特徴を調べる。","同じ大きさの二等辺三角形や正三角形を敷き詰めて，いろいろな模様を作る。","二等辺三角形と正三角形の関係について理解する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"算数をつかって（12月）","month":12,"total":1,"aim":"","title":"","lessons":["文章中に書かれた数を数直線上に表す。\nレッドリストに掲載されている動植物に興味をもち，その数について知る。\n動植物を守るために自分たちにできることを話し合う。\n今の自分を振り返りながら学習のまとめをする。"],"short":["これまでの単元の学習をもとに，生物の数や絶滅危惧種について考える。\n大きな数の学習を活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]},{"name":"２けたをかけるかけ算","month":1,"total":9,"aim":"・乗数が2位数になっても，乗数を位ごとに分けて計算し，その部分積をたすと積が求められるという筆算の意味を理解することができる。\n・(2，3位数)×(2位数)の計算が筆算でできる。\n・(2，3位数)×(2位数)の計算のしかたを，具体物や図，式を用いて表現して考える力を養う。","title":"","lessons":["4×30の問題場面の図をもとに立式し，計算のしかたを考える。\n互いの考えのよさを知り，計算の工夫によって乗数が2位数のときも，積が求められることを確かめる。","4×30と4×3の計算を比べて気づいたことを話し合う。\n被乗数と乗数，積の関係を理解する。\n40×30の計算のしかたを考える。\n40×30と4×3の答えを比べ，あとから100倍する方法のよさを考える。","問題場面から式をつくる。\n十の位で計算し，およその答えを求める。\n23×12の計算のしかたを考える。\n既習内容を生かして位ごとに計算し，互いの考えを紹介し合う。\n筆算のしかたを考える。\n部分積の表し方や処理のしかたを考え，互いの考えを紹介し合う。\n教科書の｢筆算のしかた」を用い，2位数をかける筆算の手順をまとめる。\n練習問題で筆算の手順を確かめる。","(2位数)×(2位数)の計算のしかたについて，筆算で位ごとに処理する方法を確かめる。","乗数に空位がある場合の合理的な筆算の手順をまとめる。","123×32の計算のしかたを考える。\n既習内容を生かして位ごとに計算する。\n(2位数)×(2位数)の考えをもとに，(3位数)×(2位数)の筆算のしかたを考える。","(2位数)×(2位数)の考えをもとに，(3位数)×(2位数)の筆算のしかたを考える。\n空位のあるときの筆算のしかたについて考える。\n答えの見当を付けて筆算をする。","ちょうどの数になる計算の暗算のしかたを考える。","(2，3位数)×(2位数)の手順を確認する。\n(2位数)×(何十)や(2，3 位数)×(2位数)の計算をする。\n文章題を解く。\n筆算の間違いを直す。\n計算問題を作る。"],"short":["(1位数)×(何十)の意味がわかり，式が立てられる。\n既習内容を生かし，(1位数)×(何十)の計算方法を考え，説明する。","(何十)×(何十)の計算方法を，(1位数)×(何十)の計算方法をもとに考え，積を求める。","(2位数)×(2位数)の乗数を位ごとに分けて計算する。","(2位数)×(2位数)(繰り上がりあり)の筆算の手順を，計算の方法と結びつけながら考える。","(2位数)×(何十)の合理的な筆算のしかたを理解する。","(3位数)×(2位数)の乗数を位ごとに分けて計算する。\n(3位数)×(2位数)の筆算の手順を，計算の方法と結びつけながら考える。","(3位数)×(2位数)で，積が10000を超える場合の筆算を，答えの見当を付けて計算する。\n空位のある(3位数)×(2位数)の筆算を，位に気を付けながら計算する。","(2位数)×(1位数)，(3位数)×(1位数)の暗算をする。\n暗算がしやすいように工夫をして計算する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"分数","month":1,"total":10,"aim":"・分数の意味と表し方がわかり，簡単な場合の加減の意味を理解することができる。\n・分数の構成や大きさなどについての豊かな感覚をもつことができる。\n・単位分数をもとに，分数の表し方や，簡単な場合の加減のしかたを考えたりまとめたりする力を養う。","title":"","lessons":["1mに満たないテープの長さの表し方を考える。\n1mを等分した長さと比べ，はしたの長さが何個分で1mになるかを調べる。\n1mを等分した1つ分の表し方を知る。\nはしたの長さが何個分で1mになるかを調べる。\nいろいろな単位分数で長さを表す。","1mに満たないはしたの表し方を考える。\n等分して作った単位分数の何個分になるか，液量図を使って調べる。\n「分数」，「分母」，「分子」の用語と意味を知る。\n「なるほど算数」を読んで，分数ものさしを作る。","テープ図に色を塗り，分数の大きさの関係を理解する。\n分母と分子が等しい数のとき，1と等しくなることを理解する。\n分数の大小を比較する。","1/5mの6個分を6/5mと表すことができることから，7個分，8個分，…の長さの表し方について考える。\n1より大きい分数を数直線上に表したり，数直線上に表された数を読んだりする。\n単位分数の何個分かをもとに，分数の大きさ比べをする。","「1/4m」と「4等分した1つ分」の違いを理解する。\nもとにする大きさが変わると1つ分の大きさも変わることを知る。\n量分数と分割分数の違いを知る。","数直線を用いて，分数と小数の関係を考え，小数と分数の位の関係を知る。\n分数と小数を数直線上に表す。\n分数と小数の大小を比較する。","同分母分数の加法の計算のしかたを考える。\n同分母分数の加法は，分母はそのままにして分子同士を計算すればよいことがわかる。","同分母分数の減法の計算のしかたを，加法をもとにして考える。\n同分母分数の減法は，分母はそのままにして分子同士を計算すればよいことがわかる。","分数の数構成の問題を解く。\n長さやかさの量だけ色を塗る。\n分数の大小比較，加減の計算をする。\n分数と小数を数直線上に表す。\n数字カードを使って分数作りをする。\n分数に関わる文章題を解く。","2年と3年で学習した分数の違いについて考える。"],"short":["1mに満たない長さの表し方を考え，単位分数を用いた分数の表し方を知る。","はしたの表し方を考え，単位分数の何個分かで量を表すことを理解する。\n｢分数｣，｢分母｣，｢分子｣の用語について理解する。","単位分数をもとにして，分数の構成や大小比較について理解する。","単位分数の何個分という表し方をもとに，単位量を超える大きさも分数で表せることを理解する。","量分数と分割分数の違いについて理解する。","分母が10の分数と小数の関係を理解する。","分数の加法を適用する場面がわかり，同分母分数の加法の計算のしかたを理解する。","分数の減法を適用する場面がわかり，同分母分数の減法の計算のしかたを理解する。","既習事項の確かめをする。\n既習事項の理解を深める。","量分数と分割分数の違いについて興味をもち，テープの長さをもとに分数についての理解を深める。"]},{"name":"重さ","month":2,"total":11,"aim":"・重さが測定できる量であることを知り，重さの単位を理解することができる。\n・はかりを使っていろいろなものの重さを量り，「g」や「kg」の単位を用いて重さを表したり，重さの計算をしたりすることができる。\n・重さの大きさについての豊かな感覚をもつことができる。\n・ものの重さも，ほかの量と同様に単位とする重さを決め，そのいくつ分で量ればよいと考えたり，目的に応じて，単位や計器を選ぶことを考えたりする力を養う。","title":"","lessons":["手に持ったり，道具を使ったりして重さ比べをする。\n手では比較しにくい重さを比べる方法を考え，実際に道具を使って比較する。\n天秤の仕組みを使って，重さ比べをする。","重さの違いが少ないものについて，どちらがどれだけ重いか調べる方法を考える。\n重さの単位｢g｣とその書き方・読み方を知る。\n一円玉と天秤の仕組みを用いて，いろいろなものの重さを量る。","｢はかり｣の名称を知り，目盛りの仕組みを考える。\nはかりで，身の回りのものの重さを量る。\n指示された重さを示す針をはかりに表す。","1000gよりも重いものの表し方を考える。\n1kg＝1000gを知る。\n1kgになるものを探し，量って確かめる。","はかりの目盛りを用い，はかりの単位の読み方を考え，正しい読み取り方を知る。\n重さの見当を付けて，kg，gを組み合わせて，いろいろなものの重さを量る。\n重さの見当を付けてはかりを選ぶ。\n重さの単位「t」を知る。","長さ，かさ，重さの単位を整理することで，共通する関係を見つける。\n気づきを話し合い，ノートにまとめる。\n重さの「単位早わかり表」をもとに，長さとかさの「単位早わかり表」を作る。","小数を用いて体重を表している事例から，何kg何gと表す方法を考える。\nkgのみで小数で表された重さを，kgとgの2つの単位で表す。\nkgとgの2つの単位で表された重さを，小数を用いてkgのみで表す。","粘土を変形すると，重さはどうなるか考える。\n重さの保存性を知る。\n同じ体積で，材質の違うものの重さを予想する。\n同じ体積でも，材質によって重さが違うことがわかる。","みかんとかごの重さの和を考える。\n重さの和を測定したり，単位の関係に気をつけて計算で求めたりする。\n重さの和や差を求め，重さが加減できることを確かめる。","重さの単位や表し方を確かめる。\nはかりの目盛りを読む。\n重さの単位換算をする。\n重さの和や差を求める。","重さに対する量感を確かめる。\n正しくはかりを読む。"],"short":["形や材質，大きさの違うものの重さを調べる方法を考えて，重さ比べをする。","重さは単位とする重さのいくつ分で表せることを知り，単位を決めて身の回りのものの重さを測定する。\n重さの単位｢g｣とその書き方・読み方を理解する。","重さを測定する道具としてはかりがあることを知り，はかりで様々なものの重さを測定する。","大きな重さを量る単位として「kg」があることを知り，1kgを使って重さを測定する。","重さのおよその見当を付けて，目的に応じてはかりを選ぶ。\nはかりの目盛りの仕組みを知り，適切な単位を用いていろいろなものの重さを表す。","長さ，かさ，重さの単位に共通する関係に気づき，単位についての理解を深める。","重さを表すのに小数を用いることができることに気づく。\n同じものの重さを，2つの単位（kg，g）で表したり，小数を用いて1つの単位（kg）で表したりすることができる。","粘土の変形を通して，重さの保存性を理解する。\n体積が同じでも，材質によって重さが違うことを理解する。","重さの測定活動を通して，重さは加減ができることに気づき，重さの単位の仕組みを生かして簡単な加減の計算ができる。","既習事項の確かめをする。\n既習事項の理解を深める。","重さの学びを活用して，日常生活の問題を解決することができる。"]},{"name":"ふりかえろう つなげよう（2月）","month":2,"total":1,"aim":"","title":"","lessons":["これまでに学習した量の単位を振り返る。\n長さの単位の関係を確かめる。\nかさの単位の関係を確かめる。\n重さの単位の関係を確かめる。\n同じ記号がついた単位の関係を確かめる。\n身の回りのものから単位を見つける。"],"short":["量の単位と測定に関わる数学的活動を通して，次の事項を身に付けることができるよう指導する。①メートル法の単位の意味や関係を知り，身の回りで目にする量の単位に興味をもつ。②長さ，かさ，重さの単位を比べていく中で，単位に使われている記号の意味を考えたり，単位同士の関係を統合的に整理しようとしたりすることができる。③長さ，かさ，重さ，それぞれの単位の関係を確かめることができる。"]},{"name":"□を使った式","month":2,"total":5,"aim":"・図や言葉の式をもとに，わからない数を□として，文脈通りに数量の関係を式に表すことができる。\n・数量の関係を図や□を使って考えたり，□に入る数を，□に数をあてはめて考えたりする力を養う。","title":"","lessons":["バスにはじめに乗っていた人数とあとから乗ってきた人数を合わせた人数を表す式を考える。\n問題場面の式を比べ，まとめた言葉の式で表す。\n図をもとに，言葉の式をつくる。\nわからない数を□として，加法の式に表す。\n□にあてはまる数の求め方を考える。","買った本の値段とおつりの関係を表す式を考える。\n問題場面の式を比べ，まとめた言葉の式で表す。\n図をもとに，言葉の式をつくる。\nわからない数を□として，減法の式に表す。\n□にあてはまる数の求め方を考える。","図をもとに，言葉の式をつくる。\nわからない数を□として，乗法の式に表す。\n□にあてはまる数の求め方を考える。\n数量の関係を図や□を使った式に表し，□にあてはまる数を求める。\n乗法の場合のわからない数□を求める練習をする。","わからない数を□として，除法の式に表す。\n数量の関係を図や□を使った式に表し，□にあてはまる数を求める。\n除法の場合のわからない数□を求める練習をする。","□を使って，加減乗除の式で表し，□にあてはまる数を計算で求める。"],"short":["具体的な場面をもとにして，加法の問題場面を言葉の式や□を使った式で表現する。\n□にあてはまる数の求め方を理解する。","具体的な場面をもとにして，減法の問題場面を言葉の式や□を使った式で表現する。\n□にあてはまる数の求め方を理解する。","図や言葉の式をもとに，わからない数を□として，乗法の式に表す。\n乗数や被乗数が□のときの求め方を理解する。","図や言葉の式をもとに，わからない数を□として，除法の式に表す。\n被除数が□のときの求め方を理解する。","既習事項の確かめをする。"]},{"name":"しりょうの活用","month":3,"total":2,"aim":"・1つの観点で作成した表を組み合わせた表をもとに棒グラフにする際，複数の棒グラフを組み合わせたグラフができることを理解し，このような棒グラフを読むことができる。\n・表やグラフからその特徴や傾向を考察したり，考察したことを，表やグラフのどの部分から考えたかを，わかるように伝えたりする力を養う。","title":"","lessons":["1組と2組の1次元表やグラフを見て，特徴や傾向を話し合う。\n2次元表から作った2種類の複数の棒グラフについて比較して，それぞれの捉えやすい特徴についてまとめる。","2つの表を読み取り，それぞれ2番目に好きなメニューを表にまとめ直す。\nまとめた表から複合グラフや積み上げ棒グラフに表し，グラフから気づいたことを話し合う。"],"short":["並列棒グラフや積み上げ棒グラフがあることを知り，グラフにより捉えやすい特徴が変わることを理解する。","並列棒グラフや積み上げ棒グラフから特徴や傾向を捉えたり，考察したりし，それらをほかの人と伝え合うことができる。"]},{"name":"そろばん","month":3,"total":2,"aim":"・そろばんの各部の名称や数の表し方，計算のしかたを理解することができる。\n・そろばんを使って，簡単な加法や減法の計算をすることができる。\n・そろばんの仕組みや十進位取り記数法の仕組みをもとに，10や5の補数を使って計算する方法を考える力を養う。","title":"","lessons":["そろばんの各部の名称を知り，数の表現のしかたを考える。\nいろいろな数をそろばんに置いたり，置いてある数を読んだりする。","五珠の合成・分解を伴う加減の計算のしかたを考える。\n加減の計算のしかたを確かめる。\n万の単位，小数第一位までの簡単な加減の計算のしかたを考える。\n万の単位，小数第一位までの簡単な加減の計算のしかたを確かめる。"],"short":["そろばんの仕組みを知り，そろばんに数を置いたり，置いてある数を読んだりする。","そろばんを使い，簡単な加減の計算ができる。\nそろばんを使い，万の単位，小数第一位までの簡単な加減の計算ができる。"]},{"name":"３年のまとめ","month":3,"total":3,"aim":"・既習の用語や定義，性質を理解することができる。\n・既習の計算や作図が適切にできる。\n・既習の見方・考え方を確かめたり，その関係を考えたりする力を養う。","title":"","lessons":["整数・小数・分数の構成の問題を解く。\n小数・分数を数直線上に表す。\n整数・小数・分数の大小比較をする。\n様々なタイプの加減乗除の問題を解く。\nます目を使った乗法の問題の解き方を考え，筆算との違いや共通点を考える。","整数の加減乗除の文章題を解く。\n□を使った乗法の式を立て，問題を解く。\n長さ，時間，重さの基本となる単位の換算をする。\n時間や時刻，重さの計算をする。\nゾウの重さの量り方を知る。","構成要素や性質をもとに，図形の名称を確かめたり作図したりする。\n2つの円を重ねてできる三角形の性質を調べる。\n保健室に来た人数調べのデータを表に整理し，棒グラフで表す。\n表やグラフからわかることをまとめる。\n昔のエジプト人の直角の作り方を知り，実際に作って確かめる。"],"short":["大きな数・小数・分数の仕組み，整数の加減乗除について理解しているか確認する。","整数の加減乗除の問題場面について理解しているか確認する。\n□を使った式について理解しているか確認する。\n単位換算をしたり，量の測定をしたりして，量について理解しているか確認する。","図形の定義や性質を整理したり，実際に図形をかいたりして，図形について理解しているか確認する。\n資料をもとに表やグラフをかいたり読んだりして，数量関係について理解しているか確認する。"]},{"name":"プログラミングのプ","month":3,"total":1,"aim":"","title":"","lessons":["命令の出し方について理解する。\n問題にある命令カードの順で命令された場合のこまの位置について考える。\nグループの友だちとゴールの場所を決めて，その場所にたどり着くための命令カードの順番を考える。"],"short":["課題を解決するための指示の出し方を考えたり，実際に指示通りに動かしたりして，論理的思考力を高める。"]},{"name":"算数をつかって（3月）","month":3,"total":1,"aim":"","title":"","lessons":["棒グラフから，1日に出すゴミの量について考える。\n出されたゴミの内容から分別されていないゴミやその量を調べる。\nゴミの分別や減らす方法について考える。\n今の自分を振り返りながら学習のまとめをする。"],"short":["これまでの単元の学習をもとに，ゴミの分別について考える。\n表やグラフの学習を活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]}]},"sansu-4":{"label":"学校図書　4年　算数（年間指導計画）","grade":4,"subject":"算数","units":[{"name":"大きい数","month":4,"total":6,"aim":"・億，兆の単位と表し方，数の読み方や書き方を知り，整数は十進位取り記数法で表されていることを理解することができる。\n・兆の位までの数を，万，億，兆の単位を用いて，正しく読んだり書いたりできる。\n・十進位取り記数法の考えをもとに，数の大小比較をしたり，倍の関係を調べたりしながら，数の仕組みを考える力を養う。","title":"","lessons":["都道府県の人口や世界各国の人口を見て大きい数に興味をもつ。\nそれぞれの人口を正確に読む。\n千万より大きい位の存在を知り，大きい数の表し方を考える。\n一億の単位とその表し方を知る。","十進位取り記数法をもとに，一兆の単位を知る。\n千兆の位までを調べ，一，十，百，千の繰り返しで表されていることを知る。\n大きい数を下から4桁ずつ区切り，万，億，兆をつけて手際よく読めるようにする。\n大きい数を表す際に，3桁ごとの区切りを用いる場合もあることを知る。\n「なるほど算数」を読んで，英語での大きい数の読み方を知る。","位取り表を用い，3256900の10倍，100倍，1000倍を調べる。また，その逆操作で1/10にした数を考える。\n1億の10倍，100倍，1000倍，1万倍の数を表す。\n数直線上に表した数を読んだり，数を数直線上に表したりする。\n比べる数の位を調べて，大小比較をしたり，不等号で表したりする。〔発展〕「なるほど算数」を読んで，1000兆より大きい数を知る。","整数の位ごとの性質を知る。\n単位と単位の関係を知り，整数の表し方の仕組みをまとめる。\n位取り表を用いて，30980000000000の構成を理解し，1億が何個分というように，大きい数はそれぞれの位を何個集めて表されているかを考える。","大きい数の加減の式は，2通りあることを知る。\n万，億，兆の単位を用いた，加減乗除の計算のしかたを理解する。\n加減乗除の計算の答えを，日本では和差積商とも言うことを知り，使い方に慣れる。\nことば｢和，差，積，商｣の意味を知る。","大きい数を読んだり書いたりする。\n大きい数の仕組みを確かめる。\n大きい数の大小を比べる。\n大きい数の計算をする。\n数カードから問題に合った数を作る。"],"short":["数の構成をもとに，億の単位を用いた数の表し方を知る。","4桁の区切りのよさを生かして，兆の位までの数が正しく読める。","10倍，100倍，1000倍，1/10の数の関係がわかる。\n1万倍の数の関係がわかる。\n数直線での大きい数の表し方を考える。\n大きい数の大小比較のしかたがわかる。","整数は，0～9の10個の数字で表せることを知る。\n大きい数の数構成がわかる。\n数の相対的な大きさを考えて，大きい数の仕組みがわかる。","万や億，兆を単位にした大きい数の加減乗除の計算のしかたを考える。\n｢和｣，｢差｣，｢積｣，｢商｣の用語とその意味を理解する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"折れ線グラフ","month":4,"total":5,"aim":"・折れ線グラフの読み方，かき方を理解し，折れ線グラフは，2つの数量の変化の様子をわかりやすく表せることを理解することができる。\n・資料を折れ線グラフに表し，線の傾きから，部分の変化や全体的な傾向を読み取ることができる。\n・折れ線グラフのよさや，効果的なかき方を工夫し，グラフから，統計的な特徴や傾向について考える力を養う。","title":"","lessons":["表と棒グラフを見て，月ごとの違いや気温の変わり方を読み取る。\n棒グラフを見て，気温の変わり方や違いについて発表する。\n量の変化を表す折れ線グラフを知る。","折れ線グラフを構成する要素や読み方を調べる。\n折れ線グラフの傾き具合で変わり方がわかることを知る。\n折れ線グラフのよさについて話し合い，折れ線グラフで表すことに適した事象を見つける。","資料に合わせた折れ線グラフのかき方を考え，横軸，縦軸の目盛りの取り方，単位の書き方，点の打ち方，表題のつけ方を知る。","省略のある折れ線グラフと，そうでない折れ線グラフを比較し，よさを知る。\nどのような工夫をしたか，話し合う。\n省略のある折れ線グラフを使って，変化を読み取る。","気温の変わり方を折れ線グラフにかく。\n折れ線グラフの用途を確認する。"],"short":["新潟市の気温の特徴を表や棒グラフから読み取り，気温の変化や違いを調べる。\n量の変化の様子を表すには，折れ線グラフが便利であることを知り，折れ線グラフを読む。","2都市の気温の変化を折れ線グラフから読み取る。\n折れ線グラフの傾きが急になるほど，変わり方が大きくなることがわかる。","折れ線グラフのかき方がわかる。\n縦軸の目盛りを適切に取り，折れ線グラフをかく。\n折れ線グラフに正しく表せる。\n2つの折れ線グラフから違いや変化を見つける。","省略のある折れ線グラフのよさを知り，そのグラフを読み取る。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"ふりかえろう つなげよう","month":4,"total":1,"aim":"","title":"","lessons":["棒グラフと表から読み取れることを話し合う。\n棒グラフで表すことのよさ，折れ線グラフで表すことのよさを比較しながら，それぞれの使用目的を確認する。"],"short":["これまで学習した統計分野（棒グラフ，表，折れ線グラフ）を振り返るとともに，それらの特徴を理解する。"]},{"name":"わり算","month":4,"total":4,"aim":"・除法に関して成り立つ性質について理解することができる。\n・(何十，何百)÷(1位数)を，10や100を単位として計算することができる。\n・除法に関して成り立つ性質を見つけ説明したり，10や100を単位とした計算のしかたを考える力を養う。","title":"","lessons":["商が同じになる除法を見つける。\n商が同じになる複数の除法の式を見て，除法のきまりを説明する。","除法のきまりを理解する。\n除法のきまりを説明する。","60枚の色紙を3人で同じ数ずつ分けるとき，1人分の枚数を求める式を考える。\n60÷3の計算のしかたを考える。\n600枚の色紙を3人で同じ数ずつ分けるとき，1人分の枚数を求める式を考える。\n600÷3の計算のしかたを考える。","除法のきまりを使って，□にあてはまる数を求める。\n除法のきまりを使って計算する。"],"short":["商が同じになる除法から除法のきまりを見つける。","除数と商の間にあるきまりを見つける。","(何十，何百)÷(1位数)の除法は，10や100を単位とすることで，既習の除法と同様に計算できることがわかる。","既習事項の確かめをする。"]},{"name":"角","month":5,"total":8,"aim":"・回転の大きさを表す量としての角の意味や，角の単位｢度（゜）｣や測定の意味を理解し，角の大きさについての豊かな感覚をもつことができる。\n・分度器を用いて角の大きさを測定したり，必要な大きさの角を作ったりできる。\n・角の大きさも，ほかの量と同様に単位とする大きさを決め，そのいくつ分で測ればよいと考える力を養う。","title":"","lessons":["㋐～㋔の動物の絵を見て，口の開き具合について話し合う。\n教科書の動物の口を紙に写し取って重ね，口の開き具合の大小を比べる。\n三角定規の1つの角を単位として，角の大きさをその何個分と表し，角の大きさを比べる。","教具の操作で，角を回転の量として捉えて角の大きさの変わり方を調べる。また，直角との大きさ比べをする。\np.158の円盤を使って，角の大きさを視覚的に捉える。\n角の大きさを表す単位として，○直角があることを知り，○直角の大きさを知る。\n回転角がそれぞれ三角定規の角のいくつ分か調べる。","角の大きさを表す単位として，度（°）があることを知る。\n分度器の使い方を理解し，使い方に慣れる。","分度器を使って，角を正しく測る。\n辺が短い場合は，辺をのばしてよいことを理解する。\nいろいろな角を測る。","180°より大きい角を測る方法を考える。\n補角を理解する。\n対頂角の大きさの関係を調べる。","分度器を用いて角をかく手順を知る。\n180゜より大きい角をかく工夫を考える。\n分度器を用いて，三角形をかく。\n「なるほど算数」を読んで，分度器を使って模様作りをする。","三角定規の角の大きさを知る。\n三角定規の角を組み合わせ，角度の求め方を考える。\n分度器を使って，身の回りのいろいろな場所の角度を調べて発表する。","工夫して角度を測ったり，角をかいたりする。\n三角定規を組み合わせてできる角の大きさを求める。\n角の大きさについてまとめる。"],"short":["辺の開き具合としての，角の大きさを比べる方法を見つける。","回転によってできる角の大きさを調べる。","角の大きさの単位「度（°）」を知る。\n分度器の使い方を知り，角の大きさを正しく測る。\n○直角の大きさを理解する。","分度器を使って，角を正しく測る。","180°より大きい角度を工夫して測る。","分度器を用いて角や三角形をかく。","三角定規を組み合わせてできるいろいろな角の大きさの求め方を考える。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"（２けた）÷（１けた）の計算","month":5,"total":1,"aim":"・48÷3の計算のしかたを，絵や図を使ってわかりやすく表現できる。\n・48÷3の計算のしかたを，具体物や図，式を用いて，被除数を分割していろいろ考える力を養う。","title":"","lessons":["48÷3の計算のしかたを考える。\n既習事項をもとにいろいろな方法を考える。\n56÷4の計算のしかたを考える。\n計算のしかたをわかりやすくノートにまとめる。"],"short":["48÷3の計算のしかたを，既習事項をもとに図や式を使って説明する。\n56÷4の計算のしかたを考え，ノートにまとめる。"]},{"name":"１けたでわるわり算","month":5,"total":9,"aim":"・(2，3位数)÷(1位数)の除法について，筆算の仕組みや被除数・除数・商・余りの関係を理解し，計算のしかたについてわかりやすく説明できる。\n・既習の計算のしかたをもとに，(2，3位数)÷(1位数)の計算のしかたを考える力を養う。","title":"","lessons":["48枚の色紙を9枚ずつ分けるとき，何人に分けられるかを考える。\n除法の筆算形式を知る。\n48÷8の筆算のしかたを考えることができ，筆算をきちんと書くことができる。\n除法の答えの確かめのしかたを考える。","69枚の色紙を3人で同じ数ずつ分けるときの答えの求め方を発表し合う。\n式に表し，被除数を位ごとに分けて計算する。\n72枚の色紙を3人で同じ数ずつ分けるときの答えの求め方を発表し合う。\n72÷3の筆算のしかたを考える。","計算は，筆算でした方が効率的にできることを確認し，筆算の手順について話し合う。\n92÷4の筆算を，話し合った手順で計算する。\n92÷4の筆算の計算手順を説明し合う。","83÷5の筆算のしかたを確認する。\n83÷5の筆算の計算手順を考え，説明し合う。","64÷3，92÷3を，それぞれ筆算で計算する方法を考える。\n既習の筆算のしかたをもとに，商に0がたつ場合の筆算のしかたをまとめ，説明する。","639÷3の計算のしかたを考える｡\nそれぞれの位を3でわればよいことに気づく。\n536÷4の計算のしかたを考える。\n具体的な除法の場面と結びつけながら，百の位から商のたつ，筆算のしかたをまとめる。","420÷3，859÷8の計算方法を考える。\n各々の計算方法を発表し合い，より効率的な方法はどれかを話し合う。\n答えの確かめをする。\n(3位数)÷(1位数)の筆算の練習問題をする。\n筆算の間違いを見つけ説明し合い，正しく計算する。\n「なるほど算数」を読んで，72÷4の暗算の考え方を知る。","254÷3の計算のしかたを考える。\n100のまとまりが分けられないときの計算のしかたを考え，発表し合う。\n具体的な除法の場面と結びつけながら，十の位から商のたつ筆算のしかたをまとめる。\n(3位数)÷(1位数)の筆算の練習問題をする。","除法の筆算のしかたをまとめる。\n(2，3位数)÷(1位数)の計算問題を筆算で解く。\n除法の文章題を解く。"],"short":["除法の場面を式に表し，計算のしかたとしての筆算形式を理解する。\n除法の計算を理解している。\n除法の答えの確かめのしかたを考える。","余りのない(2位数)÷(1位数)の計算のしかたを考える。","除法の計算のしかたと筆算とを結びつけて，筆算の計算手順を説明する。","余りのある除法の筆算をする。","商に0がたつ除法の筆算をする。","(3位数)÷(1位数)の計算を位ごとに分けて計算するしかたを考える。\n(3位数)÷(1位数)で商が3位数になる場合の筆算のしかたを考える。","(3位数)÷(1位数)の計算で，商に空位のあるものの筆算をする。\n商と余りの確かめをする。\n簡単な(2位数)÷(1位数)の暗算をする。","(3位数)÷(1位数)で，商が2位数になる場合の筆算のしかたを考える。","既習事項の確かめをする。"]},{"name":"しりょうの整理","month":6,"total":5,"aim":"・二次元表の整理のしかたや，読み取り方を理解することができる。\n・図や表を用い，2つの観点に着目して，資料を落ちや重なりなく分類整理できる。\n・身近な資料を異なる2つの観点から調べ，その表し方や読み取り方を考える力を養う。","title":"","lessons":["小学生の学校でのけがの記録から，原因を見直す観点を洗い出す。\n出された観点について，2人一組などになって読み上げて「正｣の字を用いて表にまとめ，落ちなく調べる。","2つの観点を組み合わせ，二次元表に整理すると，どんなことがわかるか考える。\n必要に応じて観点を2つ決め，二次元表に整理する。","資料を見て，どんな観点が考えられるか話し合い，観点と整理のしかたを洗い出す。\n洗い出された観点をもとに，わかりやすい表を考え，落ちや重なりがないように二次元表にまとめる。","学校での4年生のけがの記録の資料を表にまとめる。\n二次元表から，必要な数値を読み取る。\n表からわかることを話し合い，発表する。","二次元表に書かれている数値の意味を読み取り，説明する。\n二次元表にあてはまる数を求める。"],"short":["小学生の学校でのけがについて，考察に必要な観点を考える。\n出された観点について，表にまとめる。","2つの観点を組み合わせた二次元表を作成する。\n資料からわかることをまとめる。","資料を見て分類の項目を拾い出し，それをもとにわかりやすい表にまとめる。","既習事項の確かめをする。","二次元表を用いて，身の回りの事象について考え，理解を深める。"]},{"name":"ふりかえろう つなげよう（6月）","month":6,"total":1,"aim":"","title":"","lessons":["二次元表から読み取れることを話し合う。"],"short":["二次元表の表し方を振り返り，それらの特徴を理解する。"]},{"name":"２けたでわるわり算","month":6,"total":12,"aim":"・除数が2位数の場合も，除法の計算ができることを理解し，筆算のアルゴリズムを理解することができる。\n・除法の場面を式に表したり，除法の計算の手順にしたがって処理をしたりすることができる。\n・除法に関して成り立つ性質などをもとに，計算のしかたを考える力を養う。","title":"","lessons":["包含除の場面を取り上げ，2桁の数でわる除法の意味を考える。\n80÷20の商は，10を単位として考えると，8÷2で求められることを知る。","80÷30の商と余りについて，10を単位として考えると，8÷3で求められることを知る。\n除法の確かめを行うことにより，10をまとまりとしてわることのよさを知る。","84÷21で商のたて方を考える。\n(2位数)÷(2位数)の筆算の手順を理解し，計算する。","96÷33で商のたて方を考える。\n仮商が大きすぎた場合の修正のしかたを考える。\n仮商の正しさを確かめることにより，除法について成り立つ関係を知る。","68÷16の商のたて方を考える。\n仮商が大きすぎた場合の修正のしかたを考える。\n仮商が大きすぎて，修正してもまだ大きい場合の修正のしかたを考える。","(3位数)÷(2位数)で，商が1位数になる場合の筆算のしかたを考える。\n(3位数)÷(2位数)で，仮商が10になりそうな筆算のしかたを考える。\n(3位数)÷(2位数)の筆算の手順をまとめる。","(3位数)÷(2位数)の商のたつ位置を考え，筆算の手順を考える。\n商を2回たてる筆算の手順を考える。","商の一の位が空位になる場合の筆算の手順を考える。","(3位数)÷(3位数)の商のたつ位置を考え，筆算の手順を考える。「なるほど算数」を読んで，いろいろな国の除法を知る。","商が等しくなる場合の除法のきまりが，大きい数でも成り立つか確認する。\n除法のきまりを使って，大きい数の除法の問題を解く。","問題場面を絵やテープ図や数直線などに表し，式を立てる。\n立てた式について，どうしてそうなるのかを発表し合い，乗法になる場合，除法になる場合の手がかりを話し合う。","除数が2位数の除法の計算をする。\n除法を適用して，文章題を解く。\n乗法，除法を使い，数表を完成する。"],"short":["何十でわる計算のしかたを考え，10を単位とした計算の意味を理解する。","何十でわる除法で，余りが出る場合について理解する。\n10を単位として計算した場合の余りの大きさを正しく理解する。","(2位数)÷(2位数)の筆算のしかたを理解する。\n除数と被除数をおよその数と見て，仮商をたてる。","仮商の見当のつけ方を理解する。\n仮商が大きすぎた場合の修正のしかたを考える。\n仮商の修正を含む筆算の手順を理解する。","仮商が大きすぎた場合の修正のしかたを考える。\n仮商の修正を含む筆算の手順を理解する。","(3位数)÷(2位数)＝(1位数)の場合の筆算のしかたを考える。\n(3位数)÷(2位数)で，仮商が10になりそうな場合の筆算のしかたを考える。\n(3位数)÷(2位数)の筆算の手順をまとめる。","(3位数)÷(2位数)＝(2位数)の筆算のしかたを考える。","商の一の位に0がたつ筆算のしかたを考える。","(3位数)÷(3位数)＝(1位数)の筆算のしかたを考える。","除法では，被除数と除数を同じ数でわっても，商は変わらないことを使って，大きい数の除法の計算のしかたを考える。","問題文や図から数量の関係を捉え，除法になるか乗法になるかを判断して，式を立てる。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"○倍の計算（１）","month":7,"total":1,"aim":"・倍を使った表し方，何倍にあたる量の求め方を理解し，倍や，何倍かにあたる大きさを求めることができる。\n・2量の一方をもとにする量とし，それを単位としてほかの量の大きさが｢何倍｣になるかという関係を，図や式を用いて考える力を養う。","title":"","lessons":["図を用いて2量の関係を考える。\n2量の関係をもとに，何倍になっているかを求める。\n2量の関係をもとに，6倍の長さを求める。\n2量の関係をもとに，1の大きさを求める。"],"short":["2量の関係を一方を1と見たとき，他方がその何倍にあたるかを，除法を適用して求める。\nもとにする量と何倍かがわかっているとき，何倍かにあたる大きさを乗法を適用して求める。\n比べられる量と，それがもとにする量の何倍かが分かっているとき，もとにする量を，除法を適用して求める。"]},{"name":"算数をつかって","month":7,"total":1,"aim":"","title":"","lessons":["海のプラスチックゴミについて調べる。\nプラスチックの生産量，ゴミとして廃棄された量，再利用された量の変化を表す折れ線グラフを見て気づいたことをまとめる。\n自分たちの周りにあるプラスチックゴミを減らす方法で，自分たちにできそうなことを話し合う。\n今の自分を振り返りながら学習のまとめをする。"],"short":["これまでの単元の学習をもとに，海のプラスチックゴミについて考える。\nこれまでの学習を活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]},{"name":"垂直・平行と四角形","month":9,"total":15,"aim":"・垂直・平行の意味，台形，平行四辺形，ひし形の定義や性質，対角線の意味を理解しており，図形についての豊かな感覚をもつことができる。\n・垂直・平行な2直線の作図や台形，平行四辺形，ひし形の作図が正しくできる。\n・垂直・平行という観点で，2直線の関係を考えたり，四角形について分類し，分類した観点や分類した図形ごとの特徴を見いだしたりする力を養う。","title":"","lessons":["点を結んで直線を引き，いろいろな四角形を作る。\n作った四角形を比べ，落ちや重なりを調べ，似ている形を探し分類する。","2直線の交わる角度を分度器で調べる。\n2直線の交わり方から，垂直の関係にある2直線を探し，垂直の意味を知る。\n交わらない2直線が垂直になっているかどうかを調べる。\n紙を折って，垂直な2直線を作る。\nことば「垂」，「直」の意味をする。","三角定規や分度器を使って，垂直な直線のかき方を考える。\n1点を通り，ある直線に対して垂直な直線のかき方を考える。","2直線とほかの1直線が交わる角度を調べる。\n平行の意味を知る。\n複数の直線の中から平行になっている直線を選ぶ。","平行な2直線とほかの1直線が交わってできる角や2直線間の距離など，平行な直線の性質を調べる。\n身の回りから垂直や平行の関係にあるものを探す。","三角定規や定規を使って，平行な直線のかき方を考える。\n1点を通り，ある直線に対して平行な直線のかき方を考える。","作った四角形を，平行な辺で仲間分けする。\nｐ.113で仲間分けした四角形で平行な辺を1組もつ四角形について考える。\n台形について知る。\n平行線を用いて台形を作図する。\n身の回りから台形の形をしたものを探す。","仲間分けした四角形で平行な辺を2組もつ四角形について考える。\n平行四辺形について知る。\n方眼を使って，平行四辺形をかくことができる。\n身の回りから平行四辺形の形をしたものを探す。","平行四辺形の性質を理解する。\n台形と平行四辺形の違いを理解し，正しく説明できる。","与えられた2辺とその間の角を用いて，平行四辺形のかき方を考える。\n三角定規や定規，コンパス，分度器を用いて平行四辺形を作図する。\n作図した平行四辺形について，辺の長さや角の大きさを調べる。\n平行四辺形のかき方をまとめる。","仲間分けした四角形で4つの辺の長さが等しい四角形について考える。\nひし形について知る。\nコンパスを用いてひし形をかき，辺の長さや角の大きさを調べる。\n平行四辺形の作図のしかたをもとに，与えられた2辺とその間の角を用いて，ひし形のかき方を考える。","四角形を2つの三角形に分ける対角線を引く。\nいろいろな四角形の対角線の長さや交わり方を調べ，その結果と四角形の性質を比較する。\n対角線の特徴を生かして，ひし形や正方形を作図する。","2辺とその間の角を80°，120°，90°にして平行四辺形を作図する。\n2辺を5cmにしてその間の角を60°，120°，90°にしてひし形を作図する。\n作図した平行四辺形やひし形から，四角形の関係を理解する。\nいろいろな四角形を比較して，四角形の関係を説明する。〔発展〕「なるほど算数」を読んで，四角形の包含関係を知る。","合同な四角形を敷き詰めて，模様を作る。\n身の回りから，四角形の敷き詰めが使われているものを探す。","垂直，平行な2直線を作図する。\n台形，平行四辺形，ひし形の定義や性質をまとめる。\nひし形の作図をする。\n垂直や平行な直線を見つける。\n平行四辺形を作図する。\n四角形を性質で分類する。"],"short":["ドット図を利用して，四角形を作る。\n平行な辺の組の数などで，四角形を仲間分けする。","p.113で作った四角形から垂直に交わる2直線について考える。\n垂直の意味を理解する。\n垂直な関係にある2直線を調べる。","垂直な直線のかき方を理解する。","平行の意味を理解する。","平行な直線の性質を調べる。","平行な直線のかき方を理解する。","台形の定義を知り，台形のかき方を知る。","平行四辺形の定義を理解する。","平行四辺形の性質を理解する。","平行四辺形の定義や性質を使ったかき方を理解する。","ひし形の定義を知り，辺や角の関係を考える。\nひし形の性質やかき方を理解する。","対角線の定義を知り，いろいろな四角形の対角線の特徴がわかる。","平行四辺形とひし形を作図し，いろいろな四角形の性質を理解する。","四角形の敷き詰めを通して，四角形の性質を考える。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"○倍の計算（２） ～かんたんな割合～","month":9,"total":1,"aim":"・簡単な場合について，ある2量の関係と別の2量の関係とを比較する場合に，割合を用いる場合があることを知ることができる。\n・ある2量の関係と別の2量の関係との比べ方を，図や式を用いて考える力を養う。","title":"","lessons":["2つのゴムの長さと伸び方について，伸びた長さの差を求める。\n2つのゴムは，もとの長さの何倍伸びたかを求める。\n差で求めたときと倍で求めたときの求め方の違いについて考え，どちらが伸びたかについて話し合う。"],"short":["2量の関係の一方を1と見たとき，他方がその何倍にあたるか，その倍のことを割合と言い表すことを知る。"]},{"name":"がい数","month":10,"total":10,"aim":"・概数の意味や，場面に応じた使い方，概算のしかたを理解し，概算をすることができる。\n・四捨五入して，目的に応じた概数を求めることができる。\n・目的に応じた概数の表し方や概算のしかたを考えている。","title":"","lessons":["およその数の必要な場面がわかり，その表し方について考える。\n「がい数」の用語を知る。\n身の回りで概数で表されているものを探す。","「四捨五入」，「以上」，「以下」，「未満」の用語を知る。\n四捨五入して，千の位までの概数を求める。\nことば「概数」，「約」の意味を知る。","児童数を概数で表す方法を，千の位に着目して考える。\n四捨五入する位によって，表される概数が異なることを知る。\n「上から1桁，2桁」の概数で表す方法を理解する。","四捨五入して，800になる整数を調べ，どんな範囲の数を表しているか，数直線を用いて見つける。\n四捨五入した概数の表す範囲を正しく表す。\nことば「以」，「未」の意味を知る。","束にできる枚数を表す際には，切り捨てて概数にすることを知る。\n何人分の車両を用意するかを考える際には，切り上げて概数にすることを知る。\n身の回りで，切り捨て，切り上げを使う場面を見つける。","動物園の入園者数のおよその数の求め方を考える。\n加法，減法の概算のしかたを理解する。","上から1桁の概数にした積や商による見積もりのしかたを理解する。\n電卓を用いて，正しい数値と見積もりとを比べる。","概算を用いて問題を解く。","資料の数値を概数にし，折れ線グラフに表して，変化の様子を読み取る。\n「なるほど算数」を読んで，除法の筆算を概数を使って考える方法を知る。","場面に適した概数の使い方を考える。\n四捨五入や切り捨て，切り上げで概数にする。\n概数の表し方を確認する。\n概数を使って問題を解く。"],"short":["概数の必要性に気づき，「概数」，「約」の意味を理解する。","四捨五入の意味を知り，それを用いて概数を求める。","身の回りにある数値を概数にする経験を積む。\n「上から○けた」という概数の表し方を知る。","概数はある範囲の数の代表であることがわかる。","目的によっては，切り捨てと切り上げによる概数が用いられることがわかる。","加減の概算のしかたがわかり，概算を用いて計算することのよさがわかる。","見積もりの意味を知り，上から1桁の概数にして積を見積もる意味や計算のしかたを知る。\n上から1桁の概数にして，商を見積もる意味や計算のしかたを知る。","目的に応じた概算や見積もりのしかたを知る。","概数を利用して，資料をグラフに表す。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"式と計算","month":10,"total":9,"aim":"・四則混合の式や（　）を用いた式の意味がわかり，計算の順序を理解することができる。\n・数量の関係を式で簡潔に表したり，式を正しく計算したりすることができる。\n・□や△などの記号を用いて，計算法則を表すことができる。\n・整数の四則計算の理解を深めることができる。\n・具体的な場面から1つの式をつくったり，式から具体的な場面を考えたりする力や，□や△などの記号を用いると，計算法則を簡潔，一般的に表せることに気づく力を養う。\n・既習の計算のしかたを使って，同様の原理で計算を考える力を養う。","title":"","lessons":["500円で2つの品物を買ったときのおつりの求め方を考える。\n2つの式を1つの式に表すために，数量の関係や思考の過程を表しながら考えたり，話し合ったりする。\n（　）を使って1つの式に表せることを知る。\n計算の順序と結びつけて，（　）の値の意味を考える。\n（　）を用いた式から問題作りをし，式の意味を考える。","2種類の品物をいくつか買ったときの代金の求め方を考え，1つの式に表す。\n計算の順序と結びつけて，乗除部分の意味と，乗除部分を先に計算する理由を考える。","（　）と四則混合の式の計算順序を確かめる。\n等号を用いて，わかりやすく表す方法を知る。","計算場面を通して，2通りの式を立てたり，相互の関係や計算のしやすさを考えたりする。\n3つの数の乗法でも乗法のきまりが適応できるか考える。","具体的な場面を通して，2通りの式を立てたり，相互の関係や計算のしやすさを考えたりする。","具体的な場面を式で表し，計算のきまりを使って説明する。\nおはじきの個数の求め方について，線で区切ったり囲ったりして，式と考え方を結びつけて説明する。\n分配法則や結合法則を用いて，まとまりに着目し，被乗数を（　）で表して計算しやすい数にする。","乗法において，どんなきまりが成り立つか，乗数と積の関係から調べる。\nほかの数でも適応できるか積極的に確かめようとする。","計算は桁数が多くなっても，位を揃えれば3桁までの加法や減法と同じようにできることを説明する。\n(3位数)×(3位数)，(4位数)÷(2位数)の計算のしかたを，既習事項をもとに説明する。","1つの式に表し，問題を解く。\n混合式の計算をする。\n桁数の多い数について，筆算を使って正確にできるようにする。"],"short":["（　）を使って，数量の関係を結合式（1つの式）に表す。\n（　）のある式の計算のしかたを理解する。\n（　）を用いた式から，具体的な場面や一般的な関係を読み取る。","乗法・除法で表された式は，1つの数量を表していることを理解する。\n四則混合の式では，乗除を先に計算することを理解する。","（　）と四則混合の式の計算順序がわかり，正しい順序で計算する。","加法・乗法の交換法則・結合法則を確認する。","具体的な場面で，分配法則が成り立つことに気づく。","数のまとまりや区切りのよい数に着目して，計算のしかたを説明する。\n分配法則や結合法則を使って，工夫して計算する。","乗法の式に，いろいろな数をあてはめ，どんなきまりが成り立つか調べる。","加法や減法は，桁数が多くなっても，これまでと同じように位ごとに計算すればできることを理解する。\n既習事項をもとにして，(3位数)×(3位数)，(4位数)÷(2位数)の計算のしかたを説明する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"小数","month":11,"total":10,"aim":"・小数の仕組みや，加法や減法の計算のしかたを理解することができる。\n・小数第三位までの数を表すことができる。また，小数第二位までの小数の加法や減法の計算ができる。\n・十進位取り記数法の原理をもとに，端数部分の表し方や計算のしかたを考える力を養う。","title":"","lessons":["やかんに水を目分量で1L入れ，そのかさ比べをし，はしたの量の表し方を考える。\n水のかさをL単位で表す方法を考える。\n0.1を作ったときの経験をもとに話し合う。\n0.1Lを10等分した1つ分を0.01Lと表すことを知る。","2m83cmの長さをm単位で表す方法を考える。\n1cmが0.01mと表されることを知る。","0.01より小さいはしたの表し方を考える。\n0.01を作ったときの経験をもとに話し合う。\n0.01Lを10等分した1つ分を0.001Lと表すことを知る。\n1425mをkm，1kg264gをkgで表す。","1，0.1，0.01，0.001の関係を調べる。\n2.386の仕組みを調べる。\n小数の位取りの仕組みをまとめる。","小数の相対的な大きさについて，整数のときと同じ考え方をもとに，比べ方を話し合う。","10倍，1/10の数の，それぞれの数の位について考える。","問題場面から立式し，小数の加法の計算のしかたを考える。\n小数の仕組みや整数の筆算のしかたをもとに考え，説明する。\n小数第二位までの加法の筆算のしかたを知る。\n和の末位が0になったときの処理や，末位が揃っていない場合の筆算のしかたを考える。","問題場面から立式し，小数の減法の計算のしかたを考える。\n小数の加法の計算のしかたをもとに考え，説明する。\n小数第二位までの減法の筆算のしかたを知る。\n末位が揃っていない場合の筆算のしかたを考える。","小数でも交換法則や結合法則が成り立つことを確かめる。","小数の数構成を確認する。\n小数の大小比較をする。\n小数の加法，減法の計算をする。\n小数の構成の問題を解く。"],"short":["かさについて，0.1Lを10等分した1つ分を0.01Lと表すことを理解し，その読み方や書き方を知る。","長さについて，1mを10等分した1つ分を0.1m，0.1mを10等分した1つ分を0.01mと表すことを理解し，その読み方や書き方を知る。","0.01Lを10等分した1つ分を0.001Lと表すことを理解し，その読み方を知る。","小数の位取りについて理解し，小数も整数と同じように，10倍，1/10ごとに新しい単位を決めて表すことを理解する。","小数の相対的な大きさについて理解する。","小数の10倍，1/10の関係を理解する。","小数の加法の意味と計算のしかたを考える。\n小数第二位までの小数の加法の筆算のしかたを理解する。\n小数第二位までの小数の加法で，和の末位が0になったときの処理や位が揃っていない場合の筆算のしかたを考える。","小数の減法の意味と計算のしかたを考える。\n小数第二位までの小数の減法の筆算のしかたを理解する。\n小数第二位までの小数の減法で，末位の揃っていない場合の筆算のしかたを考える。","小数の場合でもこれまでに学習した交換法則と結合法則が使えることを確認する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"そろばん","month":11,"total":2,"aim":"・そろばんには十進位取り記数法の仕組みが用いられていることや，数の表し方，計算のしかたを理解し，簡単な加法や減法の計算をすることができる。\n・そろばんの仕組みをもとに，億や兆，1/100までの位の数を表すことで，十進位取り記数法の仕組みや計算のしかたを考える力を養う。","title":"","lessons":["いろいろな数をそろばんに置いたり，置いてある数を読んだりする。\nそろばんの仕組みと数の仕組みを対比させながら，位取り記数法の原理に触れ，考える。","2位数同士の加法で百の位に繰り上げる加法のしかたを考える。\n小数や大きい数の加法のしかたを考える。\n(3位数)－(2位数)＝(2位数)の減法のしかたを考える。\n小数や大きな数の減法のしかたを考える。"],"short":["そろばんの仕組みを知り，小数や大きい数をそろばんで表したり数を読んだりする。","そろばんを使い，繰り上がり・繰り下がりのある加法・減法の計算をすることができる。"]},{"name":"面積","month":11,"total":11,"aim":"・面積の単位と測定の意味がわかり，面積の求め方や単位の関係を理解できる。\n・長方形や正方形の面積を，公式を使って求めることができる。\n・広さを数値化する方法，広さに応じた面積の単位や求め方を考えたり，面積の単位とこれまでに学習した単位との関係を考えたりする力を養う。","title":"","lessons":["直接比較など既習の比較方法を振り返りながら，長方形や正方形の花壇の広さを数で表す方法を考える。\n面積の意味を理解し，単位となる広さのいくつ分かで表すことを知る。","1cm2の正方形の数を数えて面積を求める。\nいろいろな1cm2の図形を知り，工夫してかく。","面積が12cm2の図形をかく。\n周りの長さと面積がそれぞれ異なる2つの長方形を比べ，わかることを話し合う。","長方形の面積の求め方を考える。\n単位正方形が規則的に並んでいることをもとに，手際よく個数を求められることを考える。\n長方形の面積の求め方を公式化する。\n1cm2の正方形の数が，縦に何個，横に何個かで求められることを知る。\n正方形の面積の求め方を公式化する。","必要な辺の長さを測り，長方形や正方形の面積を求める。\n面積と横の長さがわかっている長方形の縦の長さを求める。","複合図形の面積の求め方を説明する。\nどの方法がいつでも使えるか話し合う。\n複合図形の面積を求める。","m2の単位を用いて面積を求める。\n1m2＝10000cm2であることを，図や計算から確かめる。\n単位が異なる場合の面積を求めるとき，単位を揃えて計算することに気づく。\n1辺が1mの正方形を作り，面積の単位1m2を体感する。","畑の面積を考え，面積の単位aを知る。\naを用いて面積を求める。\n牧場の面積を求め，面積の単位haを知る。\nhaとaの関係を考える。\n飛行場の広さを求め，面積の単位km2を知る。\nkm2とhaの関係を理解する。","正方形の1辺の長さと面積の単位の関係について表にまとめ，話し合う。\n長方形の場合はどうなるか，計算によって確かめる。\n教室や体育館など，身の回りの面積について考えたり，調べたりする。","求積公式を利用して，長方形や正方形の面積を求める。\n工夫して複合図形の面積を求める。\n求積公式を利用して，辺の長さを求める。\n面積の単位がわかる。","約150cm2の面積の大きさを考える。\n約150cm2の面積の長方形をかく。"],"short":["広さはどんな表し方ができるか考える。\n任意単位をもとにして，広さを表す。","面積の単位（cm2）を知り，単位面積をもとにして面積を求める。\n形が変わっても，面積は変わらないことがわかる。","同じ面積の様々な図形をかく。\n周りの長さと面積の大きさの関係について考える。","長方形と正方形の面積の求め方を考え，求積公式の意味を説明する。","必要な長さを測り取って，面積を求める。\n面積と1辺の長さがわかっているとき，他の1辺の長さを，求積公式を使って求める。","複合図形の面積を工夫して求める方法を説明する。\n必要な辺の長さを測り，複合図形の面積を求める。","面積の単位m2を知る。\n1m2=10000cm2の関係を理解する。\n長さの単位が違う場合の面積を求める。","単位aを知り，aを使って面積を求める。\n単位haを知り，haを使って面積を求める。\naとhaの関係を考える。\n単位km2を知り，km2を使って面積を求める。","正方形や長方形の辺の長さと面積の単位の関係について理解する。\ncm2，m2，a，ha，km2の単位関係の理解を深める。","既習事項の確かめをする。\n既習事項の理解を深める。","面積の量感を確かめる。\n面積から長方形の辺の長さを考える。"]},{"name":"ふりかえろう つなげよう（12月）","month":12,"total":1,"aim":"","title":"","lessons":["同じ周りの長さの図形の面積を比較する。\nBとCの広さの大小がはっきりしないという問題意識をもとに，｢広さ｣の比べ方を考える。"],"short":["図形の特徴に応じて面積を求める中で，効率よく面積を求める方法に関心をもつ。\n同じ長さのひもで囲まれた3つの図形の面積の求め方を考えるとともに，それらの面積の大小を比較することを通して，図形の面積が図形の周りの長さで決まらないということを理解する。\n正方形及び長方形の面積の計算による求め方についての理解を深める。"]},{"name":"算数をつかって（12月）","month":12,"total":1,"aim":"","title":"","lessons":["日本全体の面積と，森林の面積の比較をする。\n宅地と森林の面積を比較する。\n森林に関する問題を調べ，自分たちにできそうなことを話し合う。\n今の自分を振り返りながら学習のまとめをする。"],"short":["これまでの単元の学習をもとに，日本の森林の現状について考える。\nこれまでの学習を活用して，日常生活がよりよくなるためにできることを考え，改善につなげる。"]},{"name":"計算のしかたを考えよう","month":1,"total":2,"aim":"・乗数や除数が整数の場合の，小数の乗法と除法の計算のしかたを理解することができる。\n・小数×整数と小数÷整数の計算のしかたを，整数の乗法や除法の計算のしかたをもとに，比べながら考える力を養う。","title":"","lessons":["問題文に数をあてはめて，小数の場合にも乗法が成り立つことを調べる。\n□が小数の場合でも整数のときと同じように考えられることを確かめる。\n1.2×3の計算のしかたを考える。","問題文に数をあてはめて，小数の場合にも除法が成り立つことを調べる。\n□が小数の場合でも整数のときと同じように考えられることを確かめる。\n5.4÷3の計算のしかたを考える。"],"short":["1.2×3の計算のしかたを既習事項をもとに，図や式を使って考える。","5.4÷3の計算のしかたを既習事項をもとに，図や式を使って考える。"]},{"name":"小数のかけ算とわり算","month":1,"total":10,"aim":"・乗数や除数が整数の場合の小数の乗法及び除法の意味と計算のしかたを理解し，筆算を使って計算することができる。\n・乗数や除数が整数の場合の小数の乗法及び除法の意味や計算のしかたを，具体物や図，式を用いて考える力を養う。","title":"","lessons":["2.3×4の意味を数直線図や言葉の式を手がかりに考える。\n2.3×4の計算のしかたを考える。\n0.1のいくつ分や，乗法のきまりを想起しながら考える。\n2.3×4の筆算のしかたを理解する。\n被乗数が純小数の乗法の計算をする。","積の末位が0のときの処理のしかたを説明する。\n乗数が2位数のときの筆算のしかたを説明する。\n整数のときと同様に考える。","2.35×3の計算のしかたを考える。\n積に0を追加したり，末位の0を処理したりする方法を考える。\n(小数)×(整数)の筆算のしかたをまとめる。\n被乗数を小数第三位などにする考えも出た場合，発展的に扱う。","5.7÷3の意味を数直線図や言葉の式を手がかりに考える。\n5.7÷3の計算のしかたを考える。\n(小数)÷(整数)の計算も，整数の計算と同じように計算できると考える。\n5.7÷3の筆算のしかたを理解する。\n38.4÷12の計算のしかたを考える。","4.5÷9の計算のしかたを説明できる。\n一の位に0がたつ除法の場合でも，0.1や0.01を単位として考えて計算する。","7.3÷5の計算のしかたを説明できる。\n商がわり切れない場合，小さい単位で考えると除法が続けられることを知る。\nわり進める計算のしかたを理解する。\n(整数)÷(整数)＝(小数)の筆算を確かめる。","求める商の意味を考え，商を概数で求める方法を考える。\n商を適当な位で四捨五入して，概数で求める。","具体的な問題場面で余りが出る場合があることを知る。\n具体的な場面をもとに，余りの小数点の位置を考える。\n余りの数の意味について，テープ図を活用しながら考える。\n余りの小数点は，被除数の小数点に揃えて付けることを理解する。","わかっていること，求めることを把握し問題場面を図に表して，どの演算を使うかを考える。","小数の乗法・除法の計算のしかたを確認する。\nいろいろな小数の乗法・除法の計算をする。\n文章題を解く。"],"short":["(小数)×(整数)の式の意味を，数直線図を手がかりにして理解する。\n(小数)×(1位数の整数)の筆算のしかたを考える。","積の末位の0の処理のしかたを理解する。\n(小数)×(2位数の整数)の計算のしかたを考え，筆算のしかたを理解する。","(小数第二位の小数)×(整数)の計算のしかたを考える。\n積に0を追加して小数点を付けたり，積の末位の0を処理することを理解する。","(小数)÷(整数)の式の意味を，数直線図を手がかりにして理解する。\n(小数)÷(1位数の整数)の筆算のしかたを考える。\n(小数)÷(2位数の整数)の計算のしかたを考え，筆算のしかたを考える。","被除数が除数より小さい場合の筆算のしかたを考える。\n一の位に0がたつ除法の場合でも，0.1や0.01を単位として考えると計算できることを知る。\n一の位に0がたつ除法のしかたを理解する。","わり進める場合の計算のしかたを考え，筆算の方法を理解する。\n(整数)÷(整数)＝(小数)の筆算のしかたを理解する。","商を四捨五入して，概数で求める意味や方法を理解する。","余りのある小数の除法の計算のしかたを考える。","問題場面を図に表し，立式して解決する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"○倍の計算（３） ～小数倍～","month":1,"total":1,"aim":"・小数を用いた倍を使った表し方，何倍にあたる量の求め方を理解し，倍や，何倍かにあたる大きさを求めることができる。\n・小数においても，2量の一方をもとにする量とし，それを単位として他方の量の大きさが｢何倍｣になるかという関係を，図や式を用いて考える力を養う。","title":"","lessons":["表とテープ図に表されたものをもとに，それぞれ2量の関係を調べる。\nテープなどを使って，実際に調べたり，確かめたりする。\n2量の関係をもとに，何倍になっているか，計算で求める。\n1より小さい小数倍になる場合はあるのか，どのような状態なのか考える。"],"short":["2量の関係の一方を1と見たとき，他方がその何倍にあたるかを，除法を適用して求める。\n何倍かを表すとき小数を用いることがあることを知る。"]},{"name":"分数","month":1,"total":9,"aim":"・分母が違っても大きさの等しい分数があることや，同分母分数の加法及び減法の計算のしかたを理解し，計算ができる。\n・1つの分数を，分母を変えていろいろな表し方ができる。\n・分数の大きさや，同分母分数の加法及び減法の計算のしかたを考える力を養う。","title":"","lessons":["1mより長い長さの表し方を考え，2通りの表し方があることを知る。\nテープ図などを見ながら大きさの表し方について考えたり，説明したりする。\n｢真分数｣，｢帯分数｣，｢仮分数｣の用語を知る。","長さやかさを帯分数と仮分数で表し，その大きさを確認する。\nテープ図などを見ながら，帯分数や仮分数の大きさを考える。","テープ図をもとに，同分母分数や単位分数のいくつ分かなどの見方を使って，帯分数を仮分数に，仮分数を整数または帯分数に表す方法を考え，説明する。","数直線を手がかりに，単位分数の大きさの関係を考える。\n単位分数では，分母が大きくなるほど分数の大きさはどうなるか考える。\n数直線を手がかりに，大きさの等しい分数を探す。\n分母の異なる分数で，大きさの等しい分数があることを知る。\n分数の大小を確認する。","同分母分数の（真分数）＋（真分数）の計算のしかたを考える。\n単位分数のいくつ分といくつ分を整数の加法と関わり合わせて考える。\n和が仮分数になる場合の処理のしかたを考える。\n同分母分数の計算方法の間違いに気づき，正しい答えを求める。","同分母の帯分数同士の和で，分数部分が仮分数になった場合の計算のしかたを，図を用いて考える。\n同分母分数の加法で繰り上がりのある計算のしかたを理解する。\n仮分数に直しても計算できることを知る。","同分母分数の（真分数）－（真分数）の計算のしかたを考える。\n加法のときと同じように，単位分数のいくつ分の減法になるか考える。\n帯分数を仮分数に直しても計算できることを知る。","同分母分数の（帯分数）－（帯分数）で繰り下がりのある計算のしかたを，図を用いて考える。\n（整数）－（帯分数）の計算のしかたを考える。","帯分数と仮分数の関係がわかり，それぞれの分数に直す。\n分数の大きさを比べる。\n同分母分数の加法や減法の計算をする。\n文章題を解く。"],"short":["真分数の意味を理解するとともに，1より大きい量の表し方を考え，2通りの表し方を理解する。","帯分数と仮分数の表し方を理解する。","帯分数，仮分数の関係を理解する。\n単位分数の何個分という考えをもとに，帯分数を仮分数に，仮分数を整数または帯分数に表す方法を考える。","数直線を手がかりに，分数の大きさは，分母と分子の関係によることを理解する。\n数直線を用いて，大きさの等しい分数を見つける。","単位分数のいくつ分になるのかという考え方を用いて，同分母分数（真分数＋真分数）の計算のしかたを考える。\n和が仮分数になった場合は帯分数または整数にすると大きさがわかることを理解し，処理のしかたを身に付ける。","単位分数のいくつ分になるのかという考え方を用いて，同分母分数（帯分数＋帯分数）の計算のしかたを考える。","単位分数のいくつ分になるのかという考え方を用いて，同分母分数の減法の計算のしかたを考える。","繰り下がりのある同分母分数の計算のしかたを理解している。\n前時の仮分数に直して計算する方法を生かして計算する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"直方体と立方体","month":2,"total":11,"aim":"・直方体や立方体の定義を知り，直方体や立方体の辺や面の垂直・平行の関係を理解することができる。\n・直方体や立方体の見取図や展開図をかくことができる。\n・ものの位置の表し方について理解することができる。\n・立体図形の構成要素やそれらの位置関係に着目し，図形ごとの特徴を見いだす力や，見取図や展開図のかき方を考える力，ものの位置の表し方について考える力を養う。","title":"","lessons":["身の回りにある箱の面に着目して，分類のしかたを説明する。\n直方体と立方体を知る。\n直方体，立方体の面・辺・頂点の数やその関係を調べる。\n2つの角柱について，直方体の定義にあてはまらない理由を説明する。","直方体の辺にはさみを入れ，切り開き広げてできた形を見る。\n展開図の意味を知る。\n展開図から直方体を考える。\n向かい合う面を繋ぐと直方体はできないなど，直方体の面の繋がり方に着目する。\n展開図は，1通りではないことを知る。","面と面のつながりを考えながら，直方体から展開図をかく。\nほかにも展開図を表せないか考える。","正方形を組み合わせて立方体を作る。\n立方体のいろいろな展開図を考える。\nできた展開図を説明しながら，発表する。","直方体と立方体が積み重ねられる理由を，面と面の関係や平行の関係に着目して説明する。\n直方体の面と面の垂直関係を調べる。\n直方体の面と面の平行関係を調べる。\n立方体の面と面の垂直・平行関係を調べる。","直方体の見取図を見ながら，1つの辺に垂直な辺，平行な辺を調べる。\n立方体についても垂直な辺，平行な辺について調べる。","面と辺の垂直関係を調べる。\n直方体の面と辺の平行関係を調べる。\n教室の中で床に垂直な面や辺，平行な面や辺にあたる部分を探す。","全体の様子の見方について考え，かき方について話し合う。\n直方体の見取図をかく。\n見取図の意味とかき方を知る。\n直方体の大きさは，縦・横・高さの3つの辺の長さで決まることを知る。\n立方体の見取図について理解する。","平面上のます目の位置の表し方について考え，理由を説明する。\n平面上の位置を2つの数の組で表せることを知る。\nます目上にいろいろな数を作り，とった石の位置を2つの数で伝え合う。\n方眼上の交点の位置の表し方を知る。\n2つの数の組が表す点を繋いで，絵をかく。\n「なるほど算数」を読んで，位置の表し方が点字に活用されていることを知る。","空間上の動物の位置を数で表す方法を考える。\n空間上の位置は，3つの数の組で表すことを知る。\n位置の表し方が利用されているものを身の回りから探す。","直方体，立方体の構成要素を確かめ，その展開図をかく。\n直方体，立方体の辺や面の平行や垂直を考える。\n平面座標，空間の位置について考える。"],"short":["面の形をもとに，箱の形を仲間分けすることで，直方体や立方体を類別し，その定義を理解する。\n直方体や立方体の構成要素として，面，辺，頂点があることを知り，その観点から性質を調べる。","直方体の箱を切り開いて広げる。\n直方体の面や辺の繋がり方を考える。","直方体ができるように展開図のかき方を考える。","立方体の展開図から完成図を予想したり，構成要素の関係を考えたりして，立方体の展開図のかき方を考える。","直方体と立方体の面と面の垂直・平行の関係を理解する。","直方体と立方体の辺と辺の垂直・平行の関係を理解する。","直方体の面と辺の垂直・平行の関係を理解する。","直方体と立方体の見取図を理解し，かき方を考える。","平面上にあるものの位置は，2つの数の組で表せることを理解する。\n方眼上の位置の表し方を理解する。","空間の位置の表し方を理解する。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"ともなって変わる量","month":2,"total":5,"aim":"・伴って変わる2つの数量の関係を表や式，グラフに表して調べる方法を理解することができる。\n・表や式，グラフに表すことができる。\n・数量関係を比べる場合に，割合を用いる場合があることを理解することができる。\n・2つの数量の間にどんな関係があるか，表から対応のきまりを見いだしたり，グラフから数量の変化の特徴を考えたりする力を養う。","title":"","lessons":["写真を参考に，身の回りから伴って変わる2つの数量を探して発表する。\n長方形や正方形の縦の長さと横の長さの関係を表に表して調べ，きまりについて話し合う。\n縦の長さと横の長さの関係を□と○を使った式に表す。","階段の段が増えると1階からの高さはどのような変わり方をするのか表に表して調べ，話し合い，増え方のきまりに気づく。\n段の数と高さの関係を□や○を使った式に表す。\n式を使って40段の高さを求める。","1辺が1cmの正方形を敷き詰めて，階段状の形を作る。\n伴って変わる2つの数量の関係を表にまとめ，4cmずつ増えているきまりを見つける。\n変数を□と○で表した式の説明をする。\n15段のときの周りの長さや，周りの長さが40cmのときの段数を，式にあてはめて求める。","水を入れた時間と溜まった水の量の関係を表す表をもとに，折れ線グラフを作る。\nグラフから，7分後や20分後の水の量を読む。\n表やグラフから，2量の関係のきまりについて話し合う。","2つの数量の関係を表にまとめる。\n伴って変わる2つの数量の関係を□と○を使って式に表し，問題を解く。\nテープを繋いだときののりしろと，テープの長さの関係がわかる。\n木の本数と間の距離の関係を考え，式の表し方を説明する。"],"short":["身の回りの事象から，1つの量が変わると，それに伴って変わる量があることに気づく。\n伴って変わる2つの数量の関係を表と式に表し，関係を考える。","伴って変わる2つの数量の関係を表と式に表し，関係を考える。","段数と周りの長さを関連付けて，その間にあるきまりを考える。\n段数とまわりの長さの変化を調べて，きまりを一般化する。","変化の様子をグラフに表し，変化の様子を読み取る。","既習事項の確かめをする。\n既習事項の理解を深める。"]},{"name":"しりょうの活用","month":3,"total":2,"aim":"・目的に応じたデータを集めて，分類整理して表に表したり，読んだりすることができる。
